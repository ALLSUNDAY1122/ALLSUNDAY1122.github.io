<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5cf78">
<title>みーつけた！どうぶつかくれんぼ v3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#5b351e;--cream:#fff8e7;--gold:#f3b64a;--orange:#ff812f}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#ddeccc;touch-action:manipulation}
button{font:inherit}
#app{height:100dvh;max-width:1100px;margin:auto;position:relative;overflow:hidden;background:#a9d9ff}
.scene{position:absolute;inset:0;overflow:hidden;transition:background .7s}
.scene.forest{background:linear-gradient(#8dd7ff 0 44%,#cfeaa7 44% 66%,#78c45c 66%)}
.scene.savanna{background:linear-gradient(#86d9ff 0 45%,#f6d57a 45% 67%,#d5a74d 67%)}
.scene.snow{background:linear-gradient(#9edfff 0 44%,#e9f7ff 44% 66%,#d7edf8 66%)}
.bgHill{position:absolute;left:-10%;right:-10%;bottom:28%;height:25%;border-radius:50% 50% 0 0/70% 70% 0 0;background:#6fb95d;transition:.6s}
.savanna .bgHill{background:#c99642}.snow .bgHill{background:#c8e8f4}
.sun{position:absolute;right:7%;top:12%;width:80px;height:80px;border-radius:50%;background:#ffe878;box-shadow:0 0 40px #fff5a9}
.cloud{position:absolute;width:150px;height:42px;border-radius:30px;background:#fff;left:7%;top:17%;filter:drop-shadow(0 6px 7px #437c9b22)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff}
.cloud:before{width:62px;height:62px;left:18px;top:-30px}.cloud:after{width:78px;height:78px;right:18px;top:-38px}
.ground{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(#91d971,#62b64c);transition:.6s}
.savanna .ground{background:linear-gradient(#dfbf63,#c79642)}.snow .ground{background:linear-gradient(#eefaff,#cde7f3)}
.river{position:absolute;left:28%;right:-5%;bottom:20%;height:13%;background:#6fc9ef;clip-path:polygon(0 25%,100% 0,100% 70%,0 100%);opacity:.85}
.savanna .river,.snow .river{display:none}
.top{position:absolute;z-index:50;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
.nameCard{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff7db,#ffe6a6);border:4px solid #ca8631;border-radius:25px;padding:6px 12px 6px 7px;box-shadow:0 4px 0 #9b591b,0 9px 20px #0002;color:var(--ink);font-weight:900;font-size:clamp(16px,3vw,25px)}
.face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #e3b15a;font-size:29px}
.progress{margin-left:auto;display:flex;gap:7px;padding:8px 12px;background:#bd732d;border:4px solid #f6cf78;border-radius:24px;box-shadow:0 4px 0 #864617}
.dot{width:32px;height:32px;border-radius:50%;background:#63311688;display:grid;place-items:center;color:#fff}.dot.done{background:#ffd75f;color:#7a441e}
.icon{width:52px;height:52px;border:4px solid #cc8730;border-radius:50%;background:linear-gradient(#fff0b2,#ffc858);box-shadow:0 4px 0 #9d581a;font-size:23px}
.prompt{position:absolute;z-index:45;left:50%;bottom:max(15px,env(safe-area-inset-bottom));transform:translateX(-50%);min-width:min(80vw,500px);text-align:center;padding:12px 22px;background:#fff9ea;border:4px solid #edbc5b;border-radius:31px;box-shadow:0 5px 0 #bf7c26,0 10px 20px #0002;color:var(--ink);font-weight:950;font-size:clamp(22px,4.7vw,35px)}
.hint{position:absolute;z-index:46;right:18px;bottom:18px;border:4px solid #d18b31;background:#fff4cf;border-radius:26px;padding:11px 18px;box-shadow:0 4px 0 #a65e1d;font-weight:900;color:var(--ink)}
.stageBtn{position:absolute;z-index:46;left:18px;bottom:18px;border:4px solid #3b8cba;background:#dff4ff;border-radius:25px;padding:11px 16px;box-shadow:0 4px 0 #276486;font-weight:900;color:#24546d}
.animal{position:absolute;z-index:20;width:170px;height:170px;left:12%;top:44%;transform:translate(-50%,-50%);transition:left .9s ease,top .9s ease,transform .5s ease;filter:drop-shadow(0 10px 9px #0002);pointer-events:none}
.animal.search{pointer-events:auto}.animal.found{z-index:60!important;left:50%!important;top:48%!important;animation:pop .85s cubic-bezier(.16,.85,.22,1.3) both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.55) rotate(-10deg)}65%{transform:translate(-50%,-50%) scale(1.25) rotate(5deg)}100%{transform:translate(-50%,-50%) scale(1.06)}}
.tree,.rock,.bush,.log{position:absolute;z-index:31;cursor:pointer;filter:drop-shadow(0 10px 10px #0002)}
.tree{left:-7%;bottom:6%;width:45%;height:79%}.rock{right:4%;bottom:25%;width:31%;height:32%}.bush{right:25%;bottom:16%;width:27%;height:22%}.log{right:3%;bottom:4%;width:27%;height:20%}
.savanna .tree{filter:hue-rotate(18deg) saturate(.8) drop-shadow(0 10px 10px #0002)}.snow .tree{filter:saturate(.35) brightness(1.3) drop-shadow(0 10px 10px #0002)}
.wiggle{animation:wiggle .55s ease-in-out infinite alternate}@keyframes wiggle{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.05)}}
.modal,.stages{position:absolute;inset:0;z-index:100;display:none;place-items:center;background:#153b28aa;backdrop-filter:blur(4px);padding:20px}
.modal.show,.stages.show{display:grid}
.card{width:min(92vw,680px);max-height:92dvh;overflow:auto;background:#fff8df;border:5px solid #efb24a;border-radius:36px;box-shadow:0 8px 0 #b86921,0 20px 45px #0004;padding:22px;text-align:center}
.card h1{margin:0 0 12px;color:#ff6c24;font-size:clamp(34px,7vw,56px)}
.bigAnimal{width:min(48vw,260px);height:min(48vw,260px);margin:0 auto}
.next{border:4px solid #e15c18;background:linear-gradient(#ffa950,#ff7822);color:#fff;border-radius:28px;padding:12px 25px;font-size:24px;font-weight:950;box-shadow:0 5px 0 #a94310}
.realWrap{width:100%;aspect-ratio:16/9;background:#111;border-radius:22px;overflow:hidden;margin:10px 0}.realWrap video,.realWrap img{width:100%;height:100%;object-fit:contain;background:#111}
.fact{font-size:clamp(20px,4vw,29px);font-weight:900;color:var(--ink);margin:12px}.credit{font-size:11px;color:#75685b;line-height:1.3}
.stageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}
.stageChoice{border:4px solid #fff;background:#fff;border-radius:24px;padding:8px;box-shadow:0 5px 0 #b96b22,0 9px 18px #0002;font-weight:950;color:var(--ink)}
.stagePic{height:120px;border-radius:17px;display:grid;place-items:center;font-size:63px;margin-bottom:6px}
.stagePic.forest{background:linear-gradient(#8edaff,#87cf68)}.stagePic.savanna{background:linear-gradient(#88d9ff,#dfb753)}.stagePic.snow{background:linear-gradient(#a7e3ff,#eefcff)}
@media(max-width:620px){.animal{width:125px;height:125px}.tree{left:-14%;width:58%;height:76%}.rock{right:-3%;width:38%}.bush{right:18%;width:35%}.log{right:-2%;width:36%}.hint,.stageBtn{display:none}.progress{gap:4px;padding:6px 7px}.dot{width:27px;height:27px}.icon{width:46px;height:46px}.nameCard{border-width:3px}.stageGrid{grid-template-columns:1fr 1fr}.stagePic{height:95px}}
</style></head>
<body><div id="app"><div id="scene" class="scene forest">
<div class="sun"></div><div class="cloud"></div><div class="bgHill"></div><div class="river"></div><div class="ground"></div>
<div class="top"><div class="nameCard"><div id="mini" class="face">🐻</div><span id="topText">くまさんが<br>かくれるよ！</span></div><div class="progress"><div class="dot">●</div><div class="dot">●</div><div class="dot">●</div></div><button id="sound" class="icon">🔈</button><button id="pause" class="icon">Ⅱ</button></div>
<div id="animal" class="animal"></div>
<svg id="tree" class="tree target" viewBox="0 0 430 720"><defs><linearGradient id="tg" x1="0" x2="1"><stop stop-color="#75401f"/><stop offset=".5" stop-color="#aa6634"/><stop offset="1" stop-color="#583017"/></linearGradient><radialGradient id="lg"><stop stop-color="#82db4c"/><stop offset="1" stop-color="#268a35"/></radialGradient></defs><path d="M146 700C135 520 160 390 167 280C110 255 70 216 32 155C72 165 116 190 164 210C145 145 157 87 182 32C205 99 211 144 211 196C252 162 298 139 363 123C321 175 284 214 227 246C238 384 276 521 292 700Z" fill="url(#tg)"/><g fill="url(#lg)"><circle cx="82" cy="128" r="83"/><circle cx="161" cy="88" r="99"/><circle cx="250" cy="100" r="105"/><circle cx="331" cy="138" r="90"/><circle cx="105" cy="205" r="90"/><circle cx="220" cy="186" r="105"/><circle cx="324" cy="210" r="94"/></g></svg>
<svg id="rock" class="rock target" viewBox="0 0 360 270"><defs><linearGradient id="rg"><stop stop-color="#d8d3c4"/><stop offset=".55" stop-color="#9d9a90"/><stop offset="1" stop-color="#74736c"/></linearGradient></defs><path d="M24 244C15 203 38 153 73 119C107 85 112 43 165 24C230 1 276 44 305 91C339 144 356 188 334 244Z" fill="url(#rg)" stroke="#777268" stroke-width="8"/></svg>
<svg id="bush" class="bush target" viewBox="0 0 350 220"><defs><radialGradient id="bg"><stop stop-color="#7dd652"/><stop offset="1" stop-color="#2d8f35"/></radialGradient></defs><g fill="url(#bg)" stroke="#2d7e32" stroke-width="3"><circle cx="70" cy="130" r="58"/><circle cx="126" cy="87" r="70"/><circle cx="186" cy="96" r="73"/><circle cx="250" cy="110" r="68"/><circle cx="300" cy="143" r="51"/><circle cx="174" cy="147" r="70"/></g></svg>
<svg id="log" class="log target" viewBox="0 0 380 220"><defs><linearGradient id="wg" x1="0" x2="1"><stop stop-color="#6d3d1d"/><stop offset=".45" stop-color="#a9652f"/><stop offset="1" stop-color="#5d3218"/></linearGradient></defs><path d="M70 64C130 41 234 38 322 59L338 163C244 160 139 165 70 139Z" fill="url(#wg)" stroke="#5d351b" stroke-width="8"/><ellipse cx="68" cy="102" rx="55" ry="63" fill="#8b5127" stroke="#5c3318" stroke-width="8"/><ellipse cx="68" cy="102" rx="30" ry="36" fill="#3c2719"/></svg>
<button id="stageBtn" class="stageBtn">🗺️ ステージ</button><button id="hint" class="hint">🔍 ヒント</button><div id="prompt" class="prompt">どこかな？ 🐾</div>
<div id="foundModal" class="modal"><div class="card"><h1>みーつけた！</h1><div id="bigAnimal" class="bigAnimal"></div><div id="reaction" class="fact"></div><button id="toReal" class="next">ほんものも みる ➜</button></div></div>
<div id="realModal" class="modal"><div class="card"><h1 id="realTitle">ほんもの！</h1><div class="realWrap"><video id="realVideo" muted playsinline preload="metadata"></video><img id="realImage" hidden alt="ほんものの動物"><div id="fallback" style="color:#fff;padding:40px" hidden>よみこめなかったよ</div></div><div id="fact" class="fact"></div><div id="credit" class="credit"></div><button id="realNext" class="next">つぎへ ➜</button></div></div>
<div id="stages" class="stages"><div class="card"><h1 style="color:#6c421e">ステージをえらぼう</h1><div class="stageGrid"><button class="stageChoice" data-stage="forest"><div class="stagePic forest">🌳</div>もり</button><button class="stageChoice" data-stage="savanna"><div class="stagePic savanna">🦒</div>サバンナ</button><button class="stageChoice" data-stage="snow"><div class="stagePic snow">🐧</div>ゆきのくに</button></div></div></div>
</div></div>
<script>
const A={forest:[{name:'くまさん',mini:'🐻',kind:'bear',reaction:'ばあ！ みーつかった〜！',fact:'ほんものの くまさん。からだが おおきいね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/5/5a/Brown_Bear_%28Ursus_arctos%29.webm',credit:'Brown Bear (Ursus arctos) / U.S. Fish and Wildlife Service・Public Domain'},{name:'うさぎさん',mini:'🐰',kind:'rabbit',reaction:'ぴょーん！ いたよ〜！',fact:'ほんものの うさぎさん。おみみが ながいね！',type:'image',media:'https://upload.wikimedia.org/wikipedia/commons/f/f9/Rabbit_0068.gif',credit:'Rabbit 0068.gif / Nevit Dilmen・CC BY-SA 3.0'},{name:'らいおんさん',mini:'🦁',kind:'lion',reaction:'がおー！ みつかった！',fact:'ほんものの らいおんさん。おおきな からだだね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/8/83/Lion.webm',credit:'Lion.webm / Altes・CC BY-SA 4.0'}],savanna:[{name:'ぞうさん',mini:'🐘',kind:'elephant',reaction:'ぱおーん！ みーつかった！',fact:'ほんものの ぞうさん。おはなが ながいね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/9/9b/Elephant.webm',credit:'Elephant.webm / OJjnr・CC0 1.0'},{name:'きりんさん',mini:'🦒',kind:'giraffe',reaction:'にょきっ！ みつかった！',fact:'ほんものの きりんさん。くびが ながいね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/2/28/Giraffe_Grazzing.webm',credit:'Giraffe Grazzing.webm / Babitha Shetty・CC BY-SA 4.0'},{name:'らいおんさん',mini:'🦁',kind:'lion',reaction:'がおー！ みつかった！',fact:'ほんものの らいおんさん。たてがみ ふさふさ！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/8/83/Lion.webm',credit:'Lion.webm / Altes・CC BY-SA 4.0'}],snow:[{name:'ぺんぎんさん',mini:'🐧',kind:'penguin',reaction:'ぺたぺた！ みつかった！',fact:'ほんものの ぺんぎんさん。よちよち あるくね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/6/67/%D0%9F%D0%B8%D0%BD%D0%B3%D0%B2%D0%B8%D0%BD%D0%BE%D0%B2%D1%8B%D0%B5_Penguin.webm',credit:'Пингвиновые Penguin.webm / Zelio007・CC BY-SA 4.0'},{name:'うさぎさん',mini:'🐰',kind:'rabbit',reaction:'ぴょーん！ ゆきでも げんき！',fact:'ほんものの うさぎさん。おみみが ながいね！',type:'image',media:'https://upload.wikimedia.org/wikipedia/commons/f/f9/Rabbit_0068.gif',credit:'Rabbit 0068.gif / Nevit Dilmen・CC BY-SA 3.0'},{name:'くまさん',mini:'🐻',kind:'bear',reaction:'のっそり！ みーつけた！',fact:'ほんものの くまさん。おおきいね！',type:'video',media:'https://upload.wikimedia.org/wikipedia/commons/5/5a/Brown_Bear_%28Ursus_arctos%29.webm',credit:'Brown Bear (Ursus arctos) / U.S. Fish and Wildlife Service・Public Domain'}]};
const spots=[{id:'tree',x:14,y:55,px:21,py:52,label:'おおきな木'},{id:'rock',x:84,y:53,px:78,py:50,label:'岩'},{id:'bush',x:73,y:72,px:68,py:66,label:'草むら'},{id:'log',x:90,y:82,px:84,py:78,label:'丸太'}];let stage='forest',round=0,found=0,current,spot,search=false,hintLevel=0,timer=null,paused=false;const $=id=>document.getElementById(id),animal=$('animal'),prompt=$('prompt'),dots=[...document.querySelectorAll('.dot')],targets=[...document.querySelectorAll('.target')];
function svg(kind){if(kind==='rabbit')return `<svg viewBox="0 0 220 220"><ellipse cx="78" cy="52" rx="24" ry="55" fill="#f3eee8" stroke="#c7bdb3" stroke-width="6"/><ellipse cx="142" cy="52" rx="24" ry="55" fill="#f3eee8" stroke="#c7bdb3" stroke-width="6"/><ellipse cx="78" cy="52" rx="10" ry="38" fill="#f3a8b8"/><ellipse cx="142" cy="52" rx="10" ry="38" fill="#f3a8b8"/><circle cx="110" cy="119" r="69" fill="#f5f1ec" stroke="#c7bdb3" stroke-width="6"/><circle cx="84" cy="108" r="9"/><circle cx="136" cy="108" r="9"/><ellipse cx="110" cy="132" rx="12" ry="9" fill="#e78493"/><path d="M110 140Q96 153 82 143M110 140Q125 153 140 143" fill="none" stroke="#5d4135" stroke-width="5" stroke-linecap="round"/></svg>`;if(kind==='lion')return `<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="94" fill="#9a5528"/><circle cx="110" cy="116" r="67" fill="#f0b854" stroke="#9e5d28" stroke-width="5"/><circle cx="83" cy="105" r="9"/><circle cx="137" cy="105" r="9"/><ellipse cx="110" cy="130" rx="15" ry="11" fill="#5d3821"/><path d="M110 140Q94 154 79 144M110 140Q127 154 143 144" fill="none" stroke="#6a4026" stroke-width="5"/></svg>`;if(kind==='elephant')return `<svg viewBox="0 0 220 220"><circle cx="110" cy="112" r="75" fill="#aebbd3" stroke="#7586a4" stroke-width="6"/><ellipse cx="53" cy="104" rx="43" ry="54" fill="#aebbd3" stroke="#7586a4" stroke-width="6"/><ellipse cx="167" cy="104" rx="43" ry="54" fill="#aebbd3" stroke="#7586a4" stroke-width="6"/><circle cx="83" cy="104" r="7"/><circle cx="137" cy="104" r="7"/><path d="M110 125C110 145 107 178 130 185C143 189 149 174 140 168" fill="none" stroke="#8d9db8" stroke-width="24" stroke-linecap="round"/></svg>`;if(kind==='giraffe')return `<svg viewBox="0 0 220 220"><rect x="86" y="54" width="48" height="118" rx="23" fill="#f3c86c" stroke="#a97432" stroke-width="5"/><ellipse cx="110" cy="58" rx="50" ry="42" fill="#f3c86c" stroke="#a97432" stroke-width="5"/><path d="M82 29L74 8M138 29L146 8" stroke="#9b6a30" stroke-width="10" stroke-linecap="round"/><circle cx="91" cy="55" r="7"/><circle cx="129" cy="55" r="7"/><ellipse cx="110" cy="75" rx="18" ry="12" fill="#c58a47"/><g fill="#a66a30"><circle cx="100" cy="103" r="10"/><circle cx="123" cy="130" r="11"/><circle cx="102" cy="154" r="9"/><circle cx="94" cy="45" r="8"/></g></svg>`;if(kind==='penguin')return `<svg viewBox="0 0 220 220"><ellipse cx="110" cy="117" rx="69" ry="88" fill="#24384f"/><ellipse cx="110" cy="130" rx="47" ry="68" fill="#f7fafb"/><circle cx="85" cy="87" r="8" fill="#fff"/><circle cx="135" cy="87" r="8" fill="#fff"/><circle cx="85" cy="87" r="4"/><circle cx="135" cy="87" r="4"/><path d="M100 103L110 117L120 103Z" fill="#f4a93d"/><ellipse cx="77" cy="199" rx="30" ry="9" fill="#f4a93d"/><ellipse cx="143" cy="199" rx="30" ry="9" fill="#f4a93d"/></svg>`;return `<svg viewBox="0 0 220 220"><circle cx="62" cy="65" r="31" fill="#8b4d2d"/><circle cx="158" cy="65" r="31" fill="#8b4d2d"/><circle cx="110" cy="116" r="76" fill="#a85f38" stroke="#713d24" stroke-width="5"/><ellipse cx="110" cy="136" rx="42" ry="31" fill="#e7b78b"/><circle cx="84" cy="107" r="9"/><circle cx="136" cy="107" r="9"/><ellipse cx="110" cy="126" rx="13" ry="10" fill="#3c2419"/><path d="M110 136Q96 152 82 141M110 136Q125 152 140 141" fill="none" stroke="#5b3522" stroke-width="5"/></svg>`}
function setProgress(){dots.forEach((d,i)=>{d.classList.toggle('done',i<found);d.textContent=i<found?'★':'●'})}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function startRound(){clearInterval(timer);targets.forEach(t=>t.classList.remove('wiggle'));search=false;hintLevel=0;current=A[stage][round%A[stage].length];spot=spots[Math.floor(Math.random()*spots.length)];$('mini').textContent=current.mini;$('topText').innerHTML=current.name+'が<br>かくれるよ！';animal.innerHTML=svg(current.kind);animal.className='animal';animal.style.left='12%';animal.style.top='44%';animal.style.transform='translate(-50%,-50%) scale(1)';prompt.textContent=current.name+'が きたよ！';await wait(850);if(paused)return;animal.style.left=spot.x+'%';animal.style.top=spot.y+'%';prompt.textContent=current.name+' かくれるよ〜';await wait(900);if(paused)return;animal.style.transform='translate(-50%,-50%) scale(.44)';animal.classList.add('search');search=true;prompt.textContent=current.name+' どこかな？ 🐾';startHints()}
function startHints(){clearInterval(timer);timer=setInterval(()=>{if(!search||paused)return;hintLevel=Math.min(3,hintLevel+1);if(hintLevel===1)prompt.textContent='よ〜く みてみよう 👀';if(hintLevel===2){$(spot.id).classList.add('wiggle');animal.style.left=spot.px+'%';animal.style.top=spot.py+'%';animal.style.transform='translate(-50%,-50%) scale(.53)';prompt.textContent=spot.label+'が あやしいよ！'}if(hintLevel===3){animal.style.transform='translate(-50%,-50%) scale(.68)';prompt.textContent=current.name+'が ちらっ！'}},3600)}
async function win(){if(!search)return;search=false;clearInterval(timer);targets.forEach(t=>t.classList.remove('wiggle'));animal.classList.add('found');prompt.textContent='みーつけた！';await wait(650);found++;setProgress();$('bigAnimal').innerHTML=svg(current.kind);$('reaction').textContent=current.reaction;$('foundModal').classList.add('show')}
targets.forEach(t=>t.onclick=()=>{if(search&&t.id===spot.id)win();else if(search)prompt.textContent='そこも みてみよう！'});animal.onclick=win;$('hint').onclick=()=>{if(search){$(spot.id).classList.add('wiggle');animal.style.left=spot.px+'%';animal.style.top=spot.py+'%';animal.style.transform='translate(-50%,-50%) scale(.58)';prompt.textContent=spot.label+'の ところかな？'}};
$('toReal').onclick=()=>{$('foundModal').classList.remove('show');$('realTitle').textContent='ほんものの '+current.name+'！';$('fact').textContent=current.fact;$('credit').textContent='素材: '+current.credit;const v=$('realVideo'),im=$('realImage'),fb=$('fallback');v.hidden=true;im.hidden=true;fb.hidden=true;v.pause();v.removeAttribute('src');im.removeAttribute('src');$('realModal').classList.add('show');if(current.type==='image'){im.src=current.media;im.hidden=false}else{v.src=current.media;v.hidden=false;v.currentTime=0;let p=v.play();if(p&&p.catch)p.catch(()=>{});setTimeout(()=>{if($('realModal').classList.contains('show'))v.pause()},5200)}};
$('realVideo').onerror=()=>{$('realVideo').hidden=true;$('fallback').hidden=false};$('realImage').onerror=()=>{$('realImage').hidden=true;$('fallback').hidden=false};$('realNext').onclick=()=>{let v=$('realVideo');v.pause();v.removeAttribute('src');v.load();$('realImage').removeAttribute('src');$('realModal').classList.remove('show');if(found>=3){found=0;round=0;setProgress();$('stages').classList.add('show')}else{round++;startRound()}};$('stageBtn').onclick=()=>$('stages').classList.add('show');document.querySelectorAll('.stageChoice').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;round=0;found=0;setProgress();$('scene').className='scene '+stage;$('stages').classList.remove('show');startRound()});$('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';if(!paused)startRound()};$('sound').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='🔈'?'🔇':'🔈';setProgress();startRound();
</script></body></html>
