<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>呑み処アーケード</title>
<style>
:root{--bg:#171423;--card:#241f38;--card2:#2e2848;--line:#3a3357;--paper:#f7f1e3;--dim:#9b93b8;--red:#e8503a;--gold:#f2b33d;--pink:#f27ba9;--green:#4ecb71;--blue:#5a8ff2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(700px 450px at 80% -10%,rgba(232,80,58,.14),transparent 60%),radial-gradient(700px 500px at 10% 0,rgba(242,179,61,.1),transparent 60%),var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{overscroll-behavior:none}button,input{font:inherit}.wrap{max-width:430px;margin:auto;min-height:100dvh;padding-bottom:42px}.noren{height:54px;background:repeating-linear-gradient(90deg,#7c2b2b 0 52px,#8f3434 52px 56px);display:flex;align-items:center;justify-content:center;letter-spacing:8px;color:#f3d9c2;font-weight:900}.lanterns{display:flex;justify-content:center;gap:18px;padding-top:16px}.lantern{width:46px;height:58px;border-radius:23px/29px;background:radial-gradient(circle at 50% 38%,#ff987a,var(--red) 72%);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 0 24px rgba(232,80,58,.45)}h1{text-align:center;font-size:29px;margin:10px 0 2px}.sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:16px}.panel{margin:0 16px 16px;padding:15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--card),#1d1930);box-shadow:0 6px 20px rgba(0,0,0,.25)}.panel h3{font-size:13px;color:var(--gold);margin:0 0 10px}.counts{display:flex;gap:8px;margin-bottom:10px}.counts button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--card2);color:var(--dim);font-weight:800}.counts button.on{background:var(--gold);color:#36290a}.name{display:flex;gap:8px;margin:7px 0}.name span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}.name input{flex:1;min-width:0;border:0;border-radius:10px;background:var(--card2);color:var(--paper);padding:9px 10px}.section{margin:22px 18px 10px;color:var(--dim);font-size:12px}.section b{color:var(--paper);font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}.game{border:1px solid var(--line);border-left:5px solid var(--red);background:linear-gradient(160deg,var(--card),#1d1930);border-radius:8px 15px 15px 8px;color:var(--paper);padding:11px;text-align:left;min-height:122px}.game.love{border-left-color:var(--pink)}.ghead{display:flex;gap:8px;align-items:center}.ico{width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:19px}.gt{font-weight:900;font-size:13px;line-height:1.3}.gd{font-size:10px;color:var(--dim);line-height:1.5;margin-top:7px}.meta{font-size:9px;color:var(--gold);margin-top:8px}.footer{text-align:center;color:var(--dim);font-size:10px;line-height:1.8;margin:24px 18px}.screen{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}.screen.show{display:block}.inner{max-width:430px;margin:auto;min-height:100dvh;padding-bottom:40px}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:13px 14px;background:rgba(23,20,35,.94);backdrop-filter:blur(10px)}.back{border:0;border-radius:11px;background:var(--card2);color:var(--paper);padding:9px 12px}.top h2{font-size:17px;margin:0}.stage{padding:12px 16px 30px}.rules{background:linear-gradient(160deg,var(--card),#1d1930);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13px;line-height:1.8;margin-bottom:14px}.big{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(180deg,#f2634d,var(--red));color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #9c2f20;margin:7px 0}.big.gold{background:linear-gradient(180deg,#ffcf67,var(--gold));color:#33270a;box-shadow:0 5px 0 #a8791b}.big.ghost{background:var(--card2);box-shadow:0 5px 0 #111}.display{background:linear-gradient(160deg,var(--card),#1d1930);border:1px solid var(--line);border-radius:18px;padding:22px 14px;text-align:center;margin:12px 0}.huge{font-size:56px;font-weight:900;color:var(--gold)}.mid{font-size:26px;font-weight:900}.small{font-size:12px;color:var(--dim);line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.chip{border:1px solid var(--line);background:var(--card2);color:var(--paper);border-radius:999px;padding:9px 13px;font-weight:800}.answers{display:grid;gap:9px}.answers button{border:1px solid var(--line);background:var(--card2);color:var(--paper);border-radius:13px;padding:13px;text-align:left}.cards4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);background:var(--card2);color:var(--paper);border-radius:13px;min-height:76px;font-size:24px;font-weight:900}.flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:white}.flash.on{animation:f .35s}@keyframes f{0%{opacity:.7}100%{opacity:0}}.race{display:flex;flex-direction:column;gap:9px}.lane{height:42px;border-radius:10px;background:#211c33;position:relative;overflow:hidden}.horse{position:absolute;left:6px;top:8px;transition:left .18s linear;font-size:24px}.lane span{position:absolute;right:8px;top:12px;color:var(--dim);font-size:11px}.result{font-size:20px;font-weight:900;color:var(--gold);margin-top:10px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="home">
 <div class="noren">呑　み　処</div>
 <div class="lanterns"><div class="lantern">呑</div><div class="lantern">み</div><div class="lantern">処</div></div>
 <h1>呑み処アーケード</h1><div class="sub">スマホ1台で遊ぶ 飲み会ミニゲーム</div>
 <div class="panel"><h3>本日のお客さま</h3><div class="counts" id="counts"></div><div id="names"></div></div>
 <div id="list"></div>
 <div class="footer">お酒は20歳になってから。無理な飲酒・一気飲みは禁止。<br>ソフトドリンクでも遊べます。</div>
</div>
<div class="screen" id="screen"><div class="inner"><div class="top"><button class="back" onclick="closeGame()">← 戻る</button><h2 id="title"></h2></div><div class="stage" id="stage"></div></div></div>
<div class="flash" id="flash"></div>
<script>
const G=[
['reflex','⚡','瞬間タップバトル','緑になったら即タップ。フェイントに注意','友'],
['bomb','💣','数字クライシス','爆弾を避けてマスを開ける','友'],
['assoc','💬','お題連想バトル','お題に交代で即答','友'],
['cups','🍶','ロシアンお猪口','ハズレを引いた人が負け','友'],
['simon','🧠','光の記憶','順番を覚えて再現','友'],
['roulette','🎯','質問ルーレット','ランダム質問で盛り上がる','恋'],
['king','👑','王様ゲーム・ライト','王様と指令をランダム決定','恋'],
['twister','✋','指ツイスター','指令どおりに指を置く','恋'],
['quiz','❓','早押し雑学バトル','4択クイズで対決','友'],
['shake','📱','シェイク対決','8秒間スマホを振る','友'],
['timing','⏱','絶妙タイマー','狙った秒数で止める','友'],
['warikan','💴','運命の割り勘','支払い割合をルーレット決定','友'],
['telepathy','💞','以心伝心ワード','同じ答えなら成功','恋'],
['vote','🗳','秘密の多数決','匿名投票で結果発表','恋'],
['couple','💕','相性シミュレーター','今夜のベストペアを決める','恋'],
['wolf','🐺','ワードウルフ','1人だけ違うワードを見抜く','友'],
['race','🏇','呑みどころダービー','ランダムレースで勝負','友'],
['count30','🔢','カウント30','30を言った人が負け','友'],
['truth','💗','告白 or パス','質問に答えるかパス','恋']
];
let n=3,players=['あなた','友人A','友人B','友人C'];
const qs=s=>document.querySelector(s), ce=(t,c,txt)=>{let e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
function renderHome(){let c=qs('#counts');c.innerHTML='';[2,3,4].forEach(x=>{let b=ce('button',x===n?'on':'',x+'人');b.onclick=()=>{n=x;renderHome()};c.appendChild(b)});let names=qs('#names');names.innerHTML='';for(let i=0;i<n;i++){let r=ce('div','name');let s=ce('span','', ['🍺','🏮','🎲','🍶'][i]);let inp=ce('input');inp.value=players[i]||'';inp.placeholder='プレイヤー'+(i+1);inp.oninput=e=>players[i]=e.target.value||('P'+(i+1));r.append(s,inp);names.append(r)}let root=qs('#list');root.innerHTML='';[['友','友人の部（気楽にワイワイ）'],['恋','友人以上恋人未満の部（ちょっとドキドキ）']].forEach(([type,label])=>{let sec=ce('div','section');sec.innerHTML='<b>'+label.split('（')[0]+'</b>（'+label.split('（')[1];root.append(sec);let gr=ce('div','grid');G.filter(g=>g[4]===type).forEach(g=>{let b=ce('button','game '+(type==='恋'?'love':''));b.innerHTML='<div class="ghead"><div class="ico">'+g[1]+'</div><div class="gt">'+g[2]+'</div></div><div class="gd">'+g[3]+'</div><div class="meta">2〜4人 ・ 約1〜3分</div>';b.onclick=()=>openGame(g[0]);gr.append(b)});root.append(gr)})}
function pn(i){return players[i]||('P'+(i+1))}function rnd(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function openGame(id){let g=G.find(x=>x[0]===id);qs('#title').textContent=g[1]+' '+g[2];qs('#screen').classList.add('show');document.body.style.overflow='hidden';build(id)}function closeGame(){qs('#screen').classList.remove('show');document.body.style.overflow='';qs('#stage').innerHTML=''}function base(desc){qs('#stage').innerHTML='<div class="rules">'+desc+'</div>'}function btn(t,fn,cls='big'){let b=ce('button',cls,t);b.onclick=fn;qs('#stage').append(b);return b}function display(html){let d=ce('div','display');d.innerHTML=html;qs('#stage').append(d);return d}function flash(c='#fff'){let f=qs('#flash');f.style.background=c;f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function build(id){
 if(id==='reflex'){base('スタート後、赤→黄→緑と変化します。<b>緑になった瞬間</b>にタップ。早押しはフライング。');let d=display('<div class="huge">READY</div><div class="small">スタートを押してください</div>');let armed=false,start=0;btn('スタート',()=>{d.innerHTML='<div class="huge" style="color:#e8503a">待て</div>';armed=false;setTimeout(()=>{d.innerHTML='<div class="huge" style="color:#f2b33d">まだ</div>'},700);setTimeout(()=>{d.innerHTML='<div class="huge" style="color:#4ecb71">GO!</div>';armed=true;start=performance.now();flash('#4ecb71')},1500+Math.random()*2200)});btn('タップ！',()=>{if(!armed){d.innerHTML='<div class="mid">フライング！</div>';return}let ms=Math.round(performance.now()-start);d.innerHTML='<div class="huge">'+ms+'<span style="font-size:18px">ms</span></div><div class="small">'+(ms<250?'神速！':ms<400?'かなり速い':'もう一回！')+'</div>';armed=false},'big gold')}
 else if(id==='bomb'){base('16マスに爆弾が3個。順番に1枚ずつ開けて、爆弾を引いたら負け。');let bombs=new Set(shuffle([...Array(16).keys()]).slice(0,3)),done=false;let d=display('<div class="small">安全なマスを選べ</div>');let grid=ce('div','cards4');qs('#stage').append(grid);for(let i=0;i<16;i++){let b=ce('button','tile','?');b.onclick=()=>{if(done||b.disabled)return;b.disabled=true;if(bombs.has(i)){b.textContent='💣';done=true;d.innerHTML='<div class="mid">爆発！</div><div class="small">このマスを選んだ人が負け</div>';flash('#e8503a')}else b.textContent='○'};grid.append(b)}btn('盤面をリセット',()=>build('bomb'),'big ghost')}
 else if(id==='assoc'){let topics=['赤いもの','コンビニにあるもの','夏といえば','東京にあるもの','甘い食べ物','動物','居酒屋メニュー','3文字の言葉'];let turn=0,sec=5,timer;function next(){clearInterval(timer);let topic=rnd(topics);base('お題に合う言葉を5秒以内に答えて「答えた」を押す。同じ答え・時間切れで負け。');let d=display('<div class="small">お題</div><div class="mid">'+topic+'</div><div class="result">'+pn(turn%n)+' の番</div><div class="huge" id="sec">5</div>');sec=5;timer=setInterval(()=>{sec--;let e=qs('#sec');if(e)e.textContent=sec;if(sec<=0){clearInterval(timer);d.innerHTML+='<div class="result">時間切れ！</div>'}},1000);btn('答えた → 次の人',()=>{turn++;next()})}next()}
 else if(id==='cups'){base('4つのお猪口から1つ選択。1つだけハズレ。金杯はボーナス。');let lose=Math.floor(Math.random()*4),gold=(lose+1+Math.floor(Math.random()*3))%4,done=false;let d=display('<div class="mid">どれを選ぶ？</div>');let gr=ce('div','cards4');qs('#stage').append(gr);for(let i=0;i<4;i++){let b=ce('button','tile','🍶');b.onclick=()=>{if(done)return;done=true;if(i===lose){b.textContent='💥';d.innerHTML='<div class="mid">ハズレ！</div><div class="small">選んだ人が負け</div>'}else if(i===gold){b.textContent='🏆';d.innerHTML='<div class="mid">金杯！</div><div class="small">好きな人を指名できる</div>'}else{b.textContent='○';d.innerHTML='<div class="mid">セーフ</div>'}};gr.append(b)}btn('もう一度',()=>build('cups'),'big ghost')}
 else if(id==='simon'){base('光った順番を覚えて同じ順に押す。成功するたび1つ長くなる。');let seq=[],pos=0,level=0,locked=true,d=display('<div class="huge">0</div><div class="small">レベル</div>'),gr=ce('div','cards4');qs('#stage').append(gr);let bs=[];['🔴','🔵','🟡','🟢'].forEach((x,i)=>{let b=ce('button','tile',x);b.onclick=()=>{if(locked)return;if(i===seq[pos]){pos++;if(pos===seq.length){locked=true;level++;d.innerHTML='<div class="huge">'+level+'</div><div class="small">成功！</div>';setTimeout(round,700)}}else{locked=true;d.innerHTML='<div class="mid">ミス！</div><div class="small">レベル '+level+'</div>';flash('#e8503a')}};bs.push(b);gr.append(b)});function round(){seq.push(Math.floor(Math.random()*4));pos=0;locked=true;let k=0;let iv=setInterval(()=>{bs.forEach(b=>b.style.transform='');if(k>=seq.length){clearInterval(iv);locked=false;return}let b=bs[seq[k++]];b.style.transform='scale(1.12)';flash('rgba(242,179,61,.35)')},650)}btn('開始',()=>{seq=[];level=0;round()})}
 else if(id==='roulette'){let q=['第一印象が一番変わった人は？','今この場で一番モテそうな人は？','実はもっと話してみたい人は？','最近一番うれしかったことは？','旅行に行くなら誰とどこへ？','自分の意外な一面を1つ','今だから言える小さな秘密は？'];base('ボタンを押すたび質問を1つ選びます。答えにくい質問はスキップ可。');let d=display('<div class="huge">🎯</div>');btn('ルーレットを回す',()=>{d.innerHTML='<div class="small">質問</div><div class="mid">'+rnd(q)+'</div><div class="result">'+pn(Math.floor(Math.random()*n))+' が回答</div>'},'big gold')}
 else if(id==='king'){let cmd=['右隣の人を10秒ほめる','全員で乾杯の音頭','誰か1人をニックネームで呼ぶ','一番最近撮った写真の話をする','全員で同じポーズをする','好きな食べ物を即答'];base('王様と指令をランダムで決定。無理な指令はスキップ。');let d=display('<div class="huge">👑</div>');btn('王様を決める',()=>{let k=Math.floor(Math.random()*n);d.innerHTML='<div class="small">王様</div><div class="mid">'+pn(k)+'</div><div class="result">指令：'+rnd(cmd)+'</div>'},'big gold')}
 else if(id==='twister'){let fingers=['右手の親指','右手の人差し指','左手の親指','左手の人差し指'],colors=['🔴 赤','🔵 青','🟡 黄','🟢 緑'];base('2人で画面を見ながら、指定された指を指定色の場所に置く。');let d=display('<div class="huge">✋</div>');btn('次の指令',()=>d.innerHTML='<div class="mid">'+rnd(fingers)+'</div><div class="result">→ '+rnd(colors)+'</div>','big gold')}
 else if(id==='quiz'){let Q=[['日本で一番高い山は？',['富士山','北岳','槍ヶ岳','御嶽山'],0],['1円玉の主な素材は？',['鉄','銅','アルミニウム','銀'],2],['世界で最も面積が大きい国は？',['中国','カナダ','ロシア','アメリカ'],2],['成人の骨の数はおよそ？',['106','206','306','406'],1],['オリンピックの五輪マークの輪はいくつ？',['4','5','6','7'],1]];let item=rnd(Q);base('4択クイズ。正解したら1点。');let d=display('<div class="mid">'+item[0]+'</div>');let a=ce('div','answers');qs('#stage').append(a);item[1].forEach((x,i)=>{let b=ce('button','',String.fromCharCode(65+i)+'. '+x);b.onclick=()=>{d.innerHTML='<div class="mid">'+(i===item[2]?'正解！':'不正解')+'</div><div class="small">正解：'+item[1][item[2]]+'</div>';flash(i===item[2]?'#4ecb71':'#e8503a')};a.append(b)});btn('次の問題',()=>build('quiz'),'big ghost')}
 else if(id==='shake'){base('8秒間でスマホを振った回数を競う。端末がモーション許可を求める場合があります。');let d=display('<div class="huge">0</div><div class="small">シェイク数</div>'),count=0,last=0,active=false,listener=e=>{if(!active)return;let a=e.accelerationIncludingGravity;if(!a)return;let m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0),now=Date.now();if(m>28&&now-last>120){count++;last=now;d.querySelector('.huge').textContent=count}};async function start(){count=0;active=true;try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')await DeviceMotionEvent.requestPermission()}catch(e){}window.addEventListener('devicemotion',listener);let s=8;d.innerHTML='<div class="huge">0</div><div class="small">残り <span id="left">8</span>秒</div>';let iv=setInterval(()=>{s--;let e=qs('#left');if(e)e.textContent=s;if(s<=0){clearInterval(iv);active=false;window.removeEventListener('devicemotion',listener);d.innerHTML='<div class="huge">'+count+'</div><div class="small">回</div>'}},1000)}btn('8秒スタート',start,'big gold');btn('動かない場合：タップで加算',()=>{count++;d.querySelector('.huge').textContent=count},'big ghost')}
 else if(id==='timing'){let target=rnd([3,5,7,10]),st=0,run=false,raf;function loop(){if(!run)return;let t=(performance.now()-st)/1000;qs('#tm').textContent=t.toFixed(2);raf=requestAnimationFrame(loop)}base('表示された目標秒数ぴったりで止める。');let d=display('<div class="small">目標</div><div class="huge">'+target+'秒</div><div class="mid" id="tm">0.00</div>');btn('スタート',()=>{st=performance.now();run=true;loop()});btn('ストップ',()=>{if(!run)return;run=false;cancelAnimationFrame(raf);let t=(performance.now()-st)/1000,diff=Math.abs(t-target);d.innerHTML='<div class="mid">'+t.toFixed(2)+'秒</div><div class="result">誤差 '+diff.toFixed(2)+'秒</div>'},'big gold')}
 else if(id==='warikan'){base('合計金額を入力し、誰がどれだけ払うかランダムで決めます。');let d=display('<input id="amt" inputmode="numeric" value="10000" style="width:80%;padding:12px;border:0;border-radius:10px;background:#2e2848;color:white;text-align:center;font-size:22px"> 円');btn('割り勘ルーレット',()=>{let total=Math.max(0,+qs('#amt').value||0),w=Array.from({length:n},()=>Math.random()+.3),sum=w.reduce((a,b)=>a+b,0),vals=w.map(x=>Math.round(total*x/sum/100)*100),delta=total-vals.reduce((a,b)=>a+b,0);vals[0]+=delta;d.innerHTML=vals.map((v,i)=>'<div class="result">'+pn(i)+'：'+v.toLocaleString()+'円</div>').join('')},'big gold')}
 else if(id==='telepathy'){let topics=['好きな寿司ネタ','旅行したい都道府県','居酒屋で最初に頼むもの','夏の定番','朝食といえば','コンビニスイーツ','休日にしたいこと'];base('お題を見て、全員が同時に答えを声に出す。揃ったら成功。');let d=display('<div class="mid">'+rnd(topics)+'</div>');btn('次のお題',()=>d.innerHTML='<div class="mid">'+rnd(topics)+'</div>','big gold')}

 else if(id==='couple'){base('参加者からランダムに2人を選び、今日の相性スコアを表示。');let d=display('<div class="huge">💕</div>');btn('相性を見る',()=>{let [a,b]=shuffle([...Array(n).keys()]).slice(0,2),s=60+Math.floor(Math.random()*41);d.innerHTML='<div class="mid">'+pn(a)+' × '+pn(b)+'</div><div class="huge">'+s+'%</div><div class="small">本日の相性</div>'},'big gold')}
 else if(id==='wolf'){let pairs=[['犬','猫'],['ビール','ハイボール'],['海','プール'],['映画館','カラオケ'],['ラーメン','うどん']],pair=rnd(pairs),wolf=Math.floor(Math.random()*n),idx=0;base('1人ずつ端末を見て自分のワードを確認。1人だけ違うワード。');let d=display('<div class="mid">'+pn(0)+' に端末を渡してください</div><div class="small">他の人は見ない</div>');let b=btn('ワードを見る',reveal,'big gold');function reveal(){if(idx>=n)return;d.innerHTML='<div class="small">あなたのワード</div><div class="huge" style="font-size:36px">'+(idx===wolf?pair[1]:pair[0])+'</div>';b.textContent='隠して次の人へ';b.onclick=()=>{idx++;if(idx<n){d.innerHTML='<div class="mid">'+pn(idx)+' に端末を渡してください</div>';b.textContent='ワードを見る';b.onclick=reveal}else{d.innerHTML='<div class="mid">全員確認完了</div><div class="small">3分話し合って狼を当てよう</div>';b.textContent='狼を発表';b.onclick=()=>d.innerHTML='<div class="mid">狼は '+pn(wolf)+'</div><div class="small">ワード：'+pair[1]+'</div>'}}}}
 else if(id==='race'){base('全員1頭ずつ。スタートするとランダム速度でゴールを目指す。');let d=display('<div class="mid">🏁 ダービー</div>'),r=ce('div','race');qs('#stage').append(r);let hs=[];for(let i=0;i<n;i++){let l=ce('div','lane');let h=ce('div','horse','🏇');let s=ce('span','',pn(i));l.append(h,s);r.append(l);hs.push(h)}btn('スタート！',()=>{let pos=Array(n).fill(0),done=false,iv=setInterval(()=>{for(let i=0;i<n;i++){pos[i]+=1+Math.random()*5;hs[i].style.left=Math.min(88,pos[i])+'%';if(pos[i]>=88&&!done){done=true;clearInterval(iv);d.innerHTML='<div class="mid">優勝 '+pn(i)+'</div><div class="huge">🏆</div>'}},120)},'big gold')}
