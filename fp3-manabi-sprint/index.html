<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdf6ef"><meta name="robots" content="noindex,follow">
<title>FP3級｜学びスプリント</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--ink:#231f1a;--sub:#726b60;--accent:#ee7d3f;--accent-dark:#a8481c;--accent-soft:#fdeee2;--good:#16803d;--bad:#c62828;--border:#f0e4d6;--r:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:82px}.screen{display:none}.screen.active{display:block}.top{padding:calc(18px + env(safe-area-inset-top)) 16px 8px}.brand{font-size:.72rem;color:var(--sub);font-weight:800;letter-spacing:.06em}.title{font-size:1.65rem;font-weight:900;margin:5px 0}.tag{color:var(--sub);font-size:.86rem}.badge{display:inline-flex;background:var(--accent-soft);color:var(--accent-dark);padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:800}.section{padding:10px 16px}.card,.action,.domain{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 3px rgba(60,45,20,.08)}.action{width:100%;padding:16px;text-align:left;display:flex;gap:12px;align-items:center}.action strong{display:block}.action span span{display:block;color:var(--sub);font-size:.78rem;margin-top:4px}.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.domain{padding:13px;text-align:left;min-height:84px}.domain b{font-size:.82rem}.domain small{display:block;color:var(--sub);margin-top:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center}.stat strong{display:block;color:var(--accent-dark);font-size:1.2rem}.stat span{font-size:.68rem;color:var(--sub)}.resume{display:none;margin:6px 16px;width:calc(100% - 32px);padding:15px;border:0;border-radius:var(--r);background:var(--accent-dark);color:#fff;text-align:left}.resume.show{display:block}.quizhead{position:sticky;top:0;z-index:5;background:rgba(253,246,239,.96);padding:calc(10px + env(safe-area-inset-top)) 16px 9px;display:flex;align-items:center;gap:10px}.homebtn{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:#fff}.meta{flex:1;font-size:.75rem;color:var(--sub)}.meta b{display:block;color:var(--ink);font-size:.86rem}.progress{height:6px;margin:0 16px 13px;background:#eadfd3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.qcard{margin:0 16px;padding:17px;background:#fff;border:1px solid var(--border);border-radius:var(--r)}.qtag{display:inline-flex;background:var(--accent-soft);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:.7rem;font-weight:800}.qtext{font-size:1.08rem;line-height:1.62;font-weight:800;margin:13px 0}.choices{display:grid;gap:9px}.choice,.unknown{width:100%;min-height:54px;border:1.5px solid var(--border);border-radius:14px;background:#fff;text-align:left;padding:11px;font-weight:700}.choice.correct{border-color:#83c99c;background:#eef9f1}.choice.wrong{border-color:#eda0a0;background:#fff0f0}.unknown{margin-top:10px;border-style:dashed;color:var(--sub);text-align:center}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#fff8f2}.feedback.show{display:block}.feedback h3{margin:0 0 8px}.feedback p{font-size:.82rem;line-height:1.65;margin:7px 0}.next,.primary,.secondary{width:100%;min-height:50px;border-radius:14px;font-weight:900}.next,.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--border);background:#fff}.result{margin:18px 16px;padding:22px;text-align:center}.score{font-size:3rem;font-weight:950;color:var(--accent-dark)}.stack{display:grid;gap:9px;margin-top:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(3,1fr);height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);border-top:1px solid var(--border)}.nav button{border:0;background:transparent;color:var(--sub);font-weight:800}.nav button.on{color:var(--accent-dark);background:var(--accent-soft)}.error{margin:16px;padding:16px;border-radius:14px;background:#fff0f0;color:#8b1e1e}.muted{color:var(--sub);font-size:.78rem;line-height:1.6}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="top"><div class="brand">学びスプリント</div><div class="title">FP3級</div><p class="tag">開始→理解→進捗→復習→再挑戦を12問で回す。</p><span class="badge">FP2 v1.3 shell｜180問監査済み正本</span></div><button id="resume" class="resume"><strong>続きから</strong><div id="resumeMeta" class="muted" style="color:#fff"></div></button><div class="section"><button id="start12" class="action"><span class="icon">12</span><span><strong>今日の12問</strong><span>6分野からバランスよく出題</span></span></button></div><div class="section"><button id="startWeak" class="action"><span class="icon">復</span><span><strong>苦手復習</strong><span id="weakMeta">現在の苦手 0問</span></span></button></div><div class="section"><h3>分野から解く</h3><div id="domains" class="grid"></div></div><div class="section"><h3>学習状況</h3><div class="stats"><div class="stat"><strong id="answeredStat">0</strong><span>回答数</span></div><div class="stat"><strong id="rateStat">—</strong><span>正答率</span></div><div class="stat"><strong id="weakStat">0</strong><span>苦手</span></div></div></div><div id="loadError"></div></section>
<section id="quiz" class="screen"><div class="quizhead"><button id="quizHome" class="homebtn">⌂</button><div class="meta"><b id="quizTitle">FP3級</b><span id="quizSub"></span></div><strong id="counter"></strong></div><div class="progress"><i id="bar"></i></div><div class="qcard"><span id="qtag" class="qtag"></span><div id="qtext" class="qtext"></div><div id="choices" class="choices"></div><button id="unknown" class="unknown">わからない</button><div id="feedback" class="feedback"><h3 id="feedbackTitle"></h3><p id="explanation"></p><p id="trap"></p><button id="next" class="next">次の問題へ</button></div></div></section>
<section id="result" class="screen"><div class="result card"><div class="muted">今回の結果</div><div id="resultScore" class="score"></div><div id="resultMeta" class="muted"></div><div class="stack"><button id="reviewWrong" class="primary">苦手だけ復習</button><button id="again" class="secondary">もう12問</button><button id="resultHome" class="secondary">ホームへ戻る</button></div></div></section>
<section id="history" class="screen"><div class="top"><div class="brand">学習記録</div><div class="title">積み上げ</div></div><div class="section"><div class="stats"><div class="stat"><strong id="hAnswered">0</strong><span>総回答</span></div><div class="stat"><strong id="hCorrect">0</strong><span>正解</span></div><div class="stat"><strong id="hWeak">0</strong><span>苦手</span></div></div></div><div class="section"><div class="card" style="padding:15px"><div class="muted">苦手は誤答・「わからない」で追加。苦手復習で正解すると解除します。中断した演習はホームの「続きから」から復帰できます。</div></div></div></section>
<section id="settings" class="screen"><div class="top"><div class="brand">設定</div><div class="title">教材情報</div></div><div class="section"><div class="card" style="padding:15px"><div class="muted">監査済み180問（2024–2026年）。通常出題はstatus=active_coreのみ。旧制度問題は通常セッションから除外します。</div></div></div><div class="section"><button id="reset" class="secondary">学習記録をリセット</button></div></section>
<nav id="nav" class="nav"><button data-screen="home" class="on">ホーム</button><button data-screen="history">学習記録</button><button data-screen="settings">設定</button></nav></div>
<script>
const LS='fp3-manabi-v1';let bank=[],session=[],idx=0,correct=0,answeredThis=[],mode='';let st=load();
function load(){try{return Object.assign({answered:0,correct:0,weak:[],resume:null},JSON.parse(localStorage.getItem(LS)||'{}'))}catch{return {answered:0,correct:0,weak:[],resume:null}}}function save(){localStorage.setItem(LS,JSON.stringify(st));renderStats()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.screen===id));window.scrollTo(0,0);if(id==='home')renderStats()}
function activeBank(){return bank.filter(q=>!q.status||q.status==='active_core')}
function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function balanced12(){const a=activeBank(),ds=[...new Set(a.map(q=>q.domain))];let out=[];ds.forEach(d=>out.push(...sample(a.filter(q=>q.domain===d),2)));return sample(out,12)}
function begin(list,label){if(!list.length)return;session=list;idx=0;correct=0;answeredThis=[];mode=label;st.resume={ids:list.map(q=>q.id),idx:0,correct:0,label};save();show('quiz');renderQ()}
function normalizeChoices(q){if(q.type==='true_false'||!q.choices||q.choices.length===0)return [{v:true,t:'○ 正しい'},{v:false,t:'× 誤り'}];return q.choices.map((t,i)=>({v:i,t:String(t)}))}
function isCorrect(q,v){if(typeof q.answer==='boolean')return v===q.answer;if(typeof q.answer==='number')return v===q.answer||v===q.answer-1;const s=String(q.answer).trim();if(/^\d+$/.test(s)){const n=Number(s);return v===n||v===n-1}return String(v)===s}
function renderQ(){const q=session[idx];if(!q){finish();return}document.getElementById('quizTitle').textContent=mode;document.getElementById('quizSub').textContent=`${q.year||''} ${q.domain||''}`;document.getElementById('counter').textContent=`${idx+1}/${session.length}`;document.getElementById('bar').style.width=`${(idx/session.length)*100}%`;document.getElementById('qtag').textContent=q.topic||q.domain||'FP3';document.getElementById('qtext').textContent=q.question;const box=document.getElementById('choices');box.innerHTML='';normalizeChoices(q).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c.t;b.onclick=()=>answer(c.v,b,false);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('unknown').disabled=false}
function answer(v,btn,unknown){const q=session[idx];const ok=!unknown&&isCorrect(q,v);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('unknown').disabled=true;if(btn)btn.classList.add(ok?'correct':'wrong');st.answered++;if(ok){st.correct++;correct++;if(mode==='苦手復習')st.weak=st.weak.filter(id=>id!==q.id)}else if(!st.weak.includes(q.id))st.weak.push(q.id);answeredThis.push({id:q.id,ok});document.getElementById('feedbackTitle').textContent=ok?'正解':'復習ポイント';document.getElementById('explanation').textContent=q.explanation||q.correction||'解説を確認してください。';document.getElementById('trap').textContent=q.trap?`ひっかけ：${q.trap}`:'';document.getElementById('feedback').className='feedback show';save()}
function next(){idx++;if(st.resume){st.resume.idx=idx;st.resume.correct=correct}save();renderQ()}
function finish(){st.resume=null;save();show('result');document.getElementById('resultScore').textContent=`${correct}/${session.length}`;document.getElementById('resultMeta').textContent=`正答率 ${Math.round(correct/session.length*100)}%・苦手 ${st.weak.length}問`;document.getElementById('reviewWrong').style.display=st.weak.length?'block':'none'}
function renderStats(){const r=st.answered?Math.round(st.correct/st.answered*100)+'%':'—';['answeredStat','hAnswered'].forEach(id=>document.getElementById(id).textContent=st.answered);document.getElementById('rateStat').textContent=r;document.getElementById('hCorrect').textContent=st.correct;['weakStat','hWeak'].forEach(id=>document.getElementById(id).textContent=st.weak.length);document.getElementById('weakMeta').textContent=`現在の苦手 ${st.weak.length}問`;const rb=document.getElementById('resume');if(st.resume&&st.resume.ids?.length){rb.classList.add('show');document.getElementById('resumeMeta').textContent=`${st.resume.label} ${Math.min(st.resume.idx+1,st.resume.ids.length)}/${st.resume.ids.length}`}else rb.classList.remove('show')}
function resume(){if(!st.resume)return;const map=new Map(bank.map(q=>[q.id,q]));const list=st.resume.ids.map(id=>map.get(id)).filter(Boolean);if(!list.length){st.resume=null;save();return}session=list;idx=Math.min(st.resume.idx,list.length-1);correct=st.resume.correct||0;mode=st.resume.label||'続きから';show('quiz');renderQ()}
function buildDomains(){const a=activeBank(),ds=[...new Set(a.map(q=>q.domain))];const el=document.getElementById('domains');el.innerHTML='';ds.forEach(d=>{const n=a.filter(q=>q.domain===d).length,b=document.createElement('button');b.className='domain';b.innerHTML=`<b>${d}</b><small>${n}問から12問</small>`;b.onclick=()=>begin(sample(a.filter(q=>q.domain===d),12),d);el.appendChild(b)})}
async function init(){try{const r=await fetch('./question_bank_180.payload.json',{cache:'no-store'});if(!r.ok)throw Error('教材を取得できません');const data=await r.json();bank=data.questions||[];if(bank.length!==180)throw Error(`問題数異常: ${bank.length}`);buildDomains();renderStats()}catch(e){document.getElementById('loadError').innerHTML=`<div class="error">教材読込エラー：${e.message}</div>`}}
document.getElementById('start12').onclick=()=>begin(balanced12(),'今日の12問');document.getElementById('startWeak').onclick=()=>begin(sample(activeBank().filter(q=>st.weak.includes(q.id)),12),'苦手復習');document.getElementById('resume').onclick=resume;document.getElementById('quizHome').onclick=()=>show('home');document.getElementById('unknown').onclick=()=>answer(null,null,true);document.getElementById('next').onclick=next;document.getElementById('reviewWrong').onclick=()=>begin(sample(activeBank().filter(q=>st.weak.includes(q.id)),12),'苦手復習');document.getElementById('again').onclick=()=>begin(balanced12(),'今日の12問');document.getElementById('resultHome').onclick=()=>show('home');document.getElementById('reset').onclick=()=>{if(confirm('学習記録をリセットしますか？')){localStorage.removeItem(LS);st=load();renderStats();show('home')}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));init();
</script></body></html>
