name: KangoshiSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  LearningSprintCore:
    path: ../../native-ios/LearningSprintCore

targets:
  KangoshiSprint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: GeneratedResources/questions.generated.json
        buildPhase: resources
      - path: GeneratedResources/Media
        type: folder
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LearningSprintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kangoshi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: KangoshiSprint
        INFOPLIST_KEY_CFBundleDisplayName: 看護師国試 学びスプリント
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - KangoshiSprintUITests

  KangoshiSprintUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: KangoshiSprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kangoshi.uitests
        TEST_TARGET_NAME: KangoshiSprint
