d": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-003", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 3, "questionType": "four_choice", "question": "労働者災害補償保険に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["労働者災害補償保険の適用を受ける労働者には、雇用形態がアルバイトやパートタイマーである者も含まれる。", "労働者災害補償保険の保険料の算定に用いられる労災保険率は、事業の規模によって災害の発生率が異なることから、適用事業に従事する労働者数に応じて定められている。", "労働者の業務上の傷病が治癒したときに、身体に一定の障害が残り、その障害の程度が所定の障害等級に該当する場合、障害補償給付が支給される。", "業務災害により労働者が死亡した場合、対象となる遺族に対し、遺族補償給付として遺族補償年金または遺族補償一時金が支給される。"], "answer": 2, "explanation": "労災保険率は労働者数によって定められるのではなく、事業の種類（業種）ごとの災害発生率の違いに応じて定められているため、選択肢2が最も不適切。労災保険はアルバイト・パートを含むすべての労働者に適用される（選択肢1は正しい）。障害等級に該当する場合の障害補償給付、死亡の場合の遺族補償年金・一時金の支給（選択肢3・4）も正しい記述。試験では「労災保険率＝業種別」という点と、雇用保険率のように事業規模で変わるわけではない点の混同を狙うひっかけが定番であり、両保険の保険料算定基準の違いを整理しておく必要がある。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-004", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 4, "questionType": "four_choice", "question": "国民年金の保険料に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["国民年金の第1号被保険者は、国民年金の保険料の納付を免除または猶予されている者および国民年金基金の加入員等を除き、月額400円の付加保険料を納付することができる。", "産前産後期間の保険料免除制度により国民年金の保険料の納付が免除された期間は、保険料納付済期間として老齢基礎年金の年金額に反映される。", "国民年金の保険料免除期間に係る保険料を追納する場合、追納すべき額は、追納する時期にかかわらず、免除された時点における保険料の額となる。", "国民年金の保険料を前納した第1号被保険者が、その前納に係る期間の経過前に第2号被保険者となった場合、前納した保険料のうち、未経過期間に係るものの還付を受けることができる。"], "answer": 3, "explanation": "保険料免除期間の追納額は、免除を受けた年度から起算して3年度以上経過すると当時の保険料額に一定の加算額が上乗せされる仕組みになっており、「追納する時期にかかわらず免除当時の額のまま」とする選択肢3は誤り。付加保険料（月額400円、選択肢1）、産前産後期間の保険料免除が保険料納付済期間として扱われる点（選択肢2）、前納後に第2号被保険者となった場合の未経過分の還付（選択肢4）はいずれも正しい。追納には加算金が生じ得るという点は本試験の頻出ひっかけであり、「3年以内は加算なし、それ以降は加算あり」という時期による差異を押さえておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-005", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 5, "questionType": "four_choice", "question": "公的年金の老齢給付の繰上げ支給に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["老齢厚生年金の繰上げ支給を請求することができる者が老齢基礎年金の繰上げ支給を請求する場合、老齢厚生年金の繰上げ支給の請求も同時に行わなければならない。", "1962年4月2日以後生まれの者が、62歳6カ月に達した月に老齢基礎年金の繰上げ支給を請求した場合、老齢基礎年金の減額率は12％となる。", "寡婦年金を受給している者が老齢基礎年金の繰上げ支給を請求した場合、寡婦年金の受給権が消滅する。", "加給年金対象者となる配偶者を有する者が老齢厚生年金の繰上げ支給を請求した場合、繰上げ支給の老齢厚生年金に繰り上げた月数に応じて減額された加給年金額が加算される。"], "answer": 4, "explanation": "加給年金額は老齢厚生年金を繰上げ支給しても減額されず、本来の支給開始年齢（原則65歳）に達してから満額で加算が開始される。したがって「繰り上げた月数に応じて減額された加給年金額が加算される」とする選択肢4が誤り。減額率は1962年4月2日以後生まれの者は1カ月あたり0.4％であり、62歳6カ月（65歳到達の30カ月前）で繰上げ請求すると0.4％×30カ月＝12％となるため選択肢2は正しい。老齢基礎年金と老齢厚生年金を両方受給できる者が繰上げ請求する場合は同時に行う必要がある点（選択肢1）、寡婦年金の受給権消滅（選択肢3）も正しい。加給年金は「繰上げでは減額されないが、繰下げでは増額されない」という非対称な扱いが頻出ひっかけである。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-006", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 6, "questionType": "four_choice", "question": "公的年金の遺族給付に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["遺族基礎年金を受給することができる遺族は、国民年金の被保険者等の死亡の当時、その者によって生計を維持され、かつ、所定の要件を満たす「子のある配偶者」または「子」である。", "厚生年金保険の被保険者である夫が死亡し、子のない30歳未満の妻が遺族厚生年金の受給権を取得した場合、その妻に対する遺族厚生年金の支給期間は、最長で10年間である。", "厚生年金保険の被保険者である夫が死亡し、子のない40歳以上65歳未満の妻が遺族厚生年金の受給権を取得した場合、妻が65歳に達するまでの間、妻に支給される遺族厚生年金に中高齢寡婦加算額が加算される。", "国民年金の被保険者の死亡により、その者の遺族に遺族基礎年金が支給される場合、その者の遺族に死亡一時金は支給されない。"], "answer": 2, "explanation": "子のない30歳未満の妻が遺族厚生年金の受給権を取得した場合、その支給は最長10年間ではなく5年間の有期給付とされているため、選択肢2が最も不適切。遺族基礎年金の受給対象が「子のある配偶者」または「子」である点（選択肢1）、子のない40歳以上65歳未満の妻に対する中高齢寡婦加算（選択肢3）、遺族基礎年金が支給される場合には死亡一時金は支給されない（選択肢4、死亡一時金と遺族基礎年金は併給調整の関係にある）はいずれも正しい。「30歳未満の子のない妻＝5年間の有期給付」という数字は頻出論点であり、寡婦年金・中高齢寡婦加算との年齢要件の違いとあわせて整理しておくとよい。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-007", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 7, "questionType": "four_choice", "question": "国民年金基金に関する次の記述のうち、最も適切なものはどれか。", "choices": ["国民年金基金には、国民年金の第1号被保険者および第3号被保険者と、日本国内に住所を有する60歳以上65歳未満の国民年金の任意加入被保険者が加入することができる。", "国民年金基金の加入員は、厚生年金保険の被保険者になるなどの所定の事由に該当したときに加入員の資格を喪失するが、自己の都合で任意に脱退することはできない。", "国民年金基金への加入は口数制となっており、1口目は2種類の終身年金のなかから選択し、2口目以降は5種類の確定年金のなかから選択する。", "国民年金基金の給付には、老齢年金、障害年金、遺族一時金がある。"], "answer": 2, "explanation": "国民年金基金は国民年金の第1号被保険者（および任意加入被保険者）を対象とする制度であり、第3号被保険者は加入対象外であるため選択肢1は誤り。給付は老齢年金と遺族一時金のみであり障害年金は存在しないため選択肢4も誤り。1口目は終身年金（2種類）から選択するが、2口目以降は終身年金・確定年金（5種類）のいずれからも選択できるため「2口目以降は確定年金のみ」とする選択肢3も誤り。加入員は厚生年金保険の被保険者になる等の法定事由により資格を喪失するが、任意に自己都合で脱退することは認められておらず、選択肢2が正しい。国民年金基金は自営業者等の年金の上乗せ制度として、iDeCoとの併用限度額なども併せて出題されやすい。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-008", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 8, "questionType": "four_choice", "question": "公的年金に係る税金に関する次の記述のうち、最も適切なものはどれか。", "choices": ["老齢基礎年金および老齢厚生年金の支払の際に、所得税および復興特別所得税が源泉徴収される場合、その源泉徴収税率は10.21％である。", "老齢基礎年金を受給権発生日から数年後に請求し、遡及して数年分の年金を一括して受給した場合、一括して受給した年金は、一時所得として所得税の課税対象となる。", "厚生年金保険の被保険者が死亡したことにより、遺族が取得した遺族厚生年金の受給権に基づく年金給付は、相続または遺贈により取得したものとみなして相続税の課税対象となる。", "老齢基礎年金および老齢厚生年金の受給者が死亡し、その者に支給されるべき年金給付のうち、まだ支給されていなかったもの（未支給年金）は、当該年金を受け取った遺族の一時所得として所得税の課税対象となる。"], "answer": 4, "explanation": "未支給年金は、受給者本人の相続財産ではなく、請求した遺族固有の権利に基づく一時所得として所得税の課税対象となるため選択肢4が正しい（相続税の対象にはならない）。老齢年金は雑所得として課税され、源泉徴収税率は原則5.105％（一定額超の部分等一部を除く）であり10.21％ではないため選択肢1は誤り。遡及して一括受給した年金も各年分の老齢年金（雑所得）として扱われ、一時所得にはならないため選択肢2は誤り。遺族厚生年金など公的年金の遺族給付は、そもそも非課税所得であり相続税・所得税いずれの課税対象にもならないため選択肢3も誤り。未支給年金の一時所得課税と、遺族年金の非課税という対比は頻出のひっかけポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-009", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 9, "questionType": "four_choice", "question": "住宅ローンの一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["住宅ローンの返済方法において、元利均等返済と元金均等返済を比較した場合、借入額や返済期間などの他の条件が同一であれば、総返済額は元利均等返済のほうが多くなる。", "住宅ローンの一部繰上げ返済において、返済額軽減型と返済期間短縮型を比較した場合、繰上げ返済額や金利などの他の条件が同一であれば、利息の軽減効果は返済額軽減型のほうが大きくなる。", "住宅ローンの一部繰上げ返済をする場合、取扱金融機関によって最低返済額や必要となる手数料が異なることがある。", "住宅ローンの借換えに際して、現在借入れをしている金融機関の抵当権を抹消し、借換先の金融機関の抵当権を設定する場合、登録免許税等の諸費用が必要となる。"], "answer": 2, "explanation": "一部繰上げ返済の利息軽減効果は、返済期間を短くする「返済期間短縮型」のほうが「返済額軽減型」より大きくなるため、選択肢2の記述は逆であり最も不適切。元金均等返済は当初の元金部分の返済額が大きく利息負担の減りが早いため、総返済額は元利均等返済のほうが多くなる（選択肢1は正しい）。繰上げ返済の最低額・手数料は金融機関ごとに異なる（選択肢3）。借換え時には旧抵当権の抹消登記・新抵当権の設定登記にそれぞれ登録免許税等がかかる（選択肢4）。「返済額軽減型と返済期間短縮型のどちらが利息軽減効果が大きいか」は頻出の入れ替えひっかけであり、期間短縮型が優れる点を必ず覚えておく。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-010", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 10, "questionType": "four_choice", "question": "下記の〈X社の貸借対照表〉に基づく財務分析に関する次の記述のうち、最も不適切なものはどれか。なお、X社の当期純利益は800百万円である。\n〈X社の貸借対照表〉（単位：百万円）流動資産合計12,000（現金及び預金9,000、売掛金1,500、製品1,500）／固定資産合計8,000／資産合計20,000。流動負債合計1,500（買掛金600、短期借入金900）／固定負債合計2,500／負債合計4,000／資本金4,000／利益剰余金12,000／純資産合計16,000／負債・純資産合計20,000", "choices": ["X社の自己資本比率は、80％である。", "X社の流動比率は、800％である。", "X社の固定長期適合率は、50％である。", "X社の自己資本当期純利益率は、5％である。"], "answer": 3, "explanation": "固定長期適合率＝固定資産÷（固定負債＋自己資本（純資産））で計算する。X社では固定資産8,000百万円、固定負債2,500百万円、純資産16,000百万円なので、8,000÷（2,500＋16,000）＝8,000÷18,500≒43.2％となり、50％とする選択肢3が誤り。自己資本比率＝純資産16,000÷資産合計20,000＝80％（選択肢1は正しい）。流動比率＝流動資産12,000÷流動負債1,500＝800％（選択肢2は正しい）。自己資本当期純利益率（ROE）＝当期純利益800÷純資産16,000＝5％（選択肢4は正しい）。財務指標問題は分母・分子の取り違えが典型的なひっかけであり、固定長期適合率は「固定資産÷（固定負債＋自己資本）」であって自己資本のみで割らない点に注意。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-011", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 11, "questionType": "four_choice", "question": "生命保険の保険料等の一般的な仕組みに関する次の記述のうち、最も不適切なものはどれか。", "choices": ["責任準備金は、保険会社が将来の保険金等の支払のために、保険数理に基づいて算定し、積み立てる準備金である。", "保険料のうち、将来の保険金等の支払財源となる純保険料は、予定死亡率と予定利率に基づいて計算される。", "終身保険について、保険料の算定に用いられる予定利率が引き上げられた場合、新規契約の保険料は高くなる。", "保険会社が実際に要した事業費が、保険料を算定する際に見込んでいた事業費よりも少なかった場合、費差益が生じる。"], "answer": 3, "explanation": "予定利率は保険会社が契約者から預かった保険料を運用する際に見込む利回りであり、予定利率が引き上げられると運用収益をあらかじめ多く見込めるため保険料は割安（低く）なる。したがって「予定利率が引き上げられると保険料は高くなる」とする選択肢3は誤り。責任準備金の定義（選択肢1）、純保険料が予定死亡率・予定利率に基づく点（選択肢2）、事業費が予定より少なく済んだ場合の費差益（選択肢4）はいずれも正しい。予定利率と保険料の関係（利率上昇→保険料低下）は予定死亡率・予定事業費率との向きの違いも含め混同しやすいので、三利源（死差・利差・費差）とあわせて整理しておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-012", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 12, "questionType": "four_choice", "question": "生命保険の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。なお、記載のない特約については考慮しないものとする。", "choices": ["逓減定期保険は、保険期間の経過に伴って所定の割合で保険料が逓減するが、保険金額は一定である。", "収入保障保険の死亡保険金を一時金で受け取る場合の受取額は、年金形式で受け取る場合の受取総額よりも少ない。", "低解約返戻金型終身保険では、他の契約条件が同一で低解約返戻金型ではない終身保険と比較して、保険料払込期間中の解約返戻金額が低く抑えられているため、割安な保険料が設定されている。", "定期保険特約付終身保険（更新型）では、定期保険特約を同額の保険金額で更新した場合、更新後の保険料は更新前の保険料よりも高くなる。"], "answer": 1, "explanation": "逓減定期保険は、保険期間の経過とともに「保険金額」が所定の割合で逓減していく一方、保険料は保険期間を通じて一定（変わらない）という商品性であり、選択肢1の「保険料が逓減し保険金額は一定」という記述は保険料と保険金額の関係が逆であるため誤り。収入保障保険は年金形式受取りのほうが一時金受取りより受取総額が多くなる（一時金は将来の利息相当分が割り引かれるため、選択肢2は正しい）。低解約返戻金型終身保険は払込期間中の解約返戻金を抑えることで保険料を割安にしている（選択肢3は正しい）。更新型の定期保険特約は更新時の年齢で保険料が再計算されるため、通常は更新後のほうが保険料は高くなる（選択肢4は正しい）。逓減定期保険と逓増定期保険（保険金額が増える）の違いも合わせて押さえておきたい。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-013", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 13, "questionType": "four_choice", "question": "個人年金保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。", "choices": ["確定年金では、年金支払期間中に被保険者（＝年金受取人）が死亡した場合、あらかじめ指定された受取人が既払込保険料相当額から被保険者に支払われた年金額を差し引いた金額を死亡保険金として受け取ることができる。", "保証期間付終身年金の保険料は、他の契約条件が同一であれば、被保険者が男性のほうが女性よりも高くなる。", "変額個人年金保険では、特別勘定における運用実績によって、将来受け取る年金額や解約返戻金額が変動する。", "個人年金保険では、被保険者が保険料払込期間中に所定の高度障害状態に該当すると、以後の保険料の払込みが免除され、直ちに年金を受け取ることができる。"], "answer": 3, "explanation": "変額個人年金保険は、保険料が特別勘定で株式や債券等により運用され、その運用実績に応じて将来の年金額や解約返戻金額が変動する仕組みであり、選択肢3が正しい。確定年金は年金受取人死亡時に残存期間分の年金または一時金が遺族に支払われる仕組みであり、既払込保険料相当額から既払年金額を控除するという計算方法ではないため選択肢1は誤り。終身年金は平均余命の長い女性のほうが受給期間が長くなる見込みのため保険料は女性のほうが高くなる（選択肢2は男女が逆で誤り）。高度障害により以後の保険料払込みが免除される制度はあるが、直ちに年金支払いが開始されるわけではなく、原則として所定の年金開始年齢まで待つ必要があるため選択肢4も誤り。変額保険の運用リスクが契約者に帰属する点は生命保険分野の頻出テーマである。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-014", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 14, "questionType": "four_choice", "question": "所得税における生命保険料控除に関する次の記述のうち、最も適切なものはどれか。なお、各選択肢において、生命保険契約は2012年1月1日以後に締結されたものとし、ほかに必要な要件等はすべて満たしているものとする。", "choices": ["勤労者財産形成貯蓄積立保険（一般財形）の保険料は、一般の生命保険料控除の対象となる。", "特定（三大）疾病保障定期保険の保険料は、一般の生命保険料控除の対象となる。", "一般の生命保険料控除、個人年金保険料控除および介護医療保険料控除の控除限度額は、各5万円である。", "終身保険の月払保険料について、保険料の支払がなかったため自動振替貸付により保険料の払込みに充当された金額は、その年分の生命保険料控除の対象とならない。"], "answer": 2, "explanation": "特定（三大）疾病保障定期保険は、被保険者の生死にかかわらず一定の疾病等に該当すると保険金が支払われる生前給付タイプの保険であるが、税制上は死亡保険金の支払いもあるため一般の生命保険料控除の対象に区分され、選択肢2が正しい。財形貯蓄は税制上の優遇（利子非課税等）が財形制度自体にあり、生命保険料控除の対象とはならないため選択肢1は誤り。新制度（2012年以後契約）における各控除（一般・個人年金・介護医療）の所得税上の控除限度額は各4万円（合計最大12万円）であり、各5万円は誤り（旧制度は各5万円、合計最大10万円）。自動振替貸付により保険料払込みに充当された金額も、実質的に保険料を支払ったものとして生命保険料控除の対象となるため選択肢4も誤り。新旧制度の限度額の違い（旧5万円・新4万円）は頻出数字なので確実に区別すること。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-015", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 15, "questionType": "four_choice", "question": "契約者（＝保険料負担者）を法人とする生命保険等に係る保険料の経理処理に関する次の記述のうち、最も不適切なものはどれか。なお、いずれの保険契約も保険料は年払いかつ全期払いで、2025年4月に締結したものとする。また、特約については考慮しないものとする。", "choices": ["被保険者を役員・従業員全員、死亡保険金受取人を被保険者の遺族、満期保険金受取人を法人とする養老保険の支払保険料は、その全額を損金の額に算入することができる。", "被保険者を役員、死亡保険金受取人を法人とする終身保険の支払保険料は、その全額を資産に計上する。", "被保険者を役員、給付金受取人を法人とする解約返戻金のない医療保険の支払保険料は、その全額を損金の額に算入することができる。", "被保険者を役員、死亡保険金受取人を法人とし、最高解約返戻率が75％である定期保険（保険期間30年）の支払保険料は、保険期間の前半4割相当期間においては、その60％相当額を資産に計上し、残額を損金の額に算入することができる。"], "answer": 1, "explanation": "死亡保険金受取人が被保険者の遺族、満期保険金受取人が法人という契約形態（いわゆる福利厚生プラン）の養老保険の保険料は、原則として2分の1を資産（保険料積立金）に計上し、残りの2分の1を損金の額に算入する取扱い（ハーフタックスプラン）となるため、「全額を損金の額に算入することができる」とする選択肢1が誤り。死亡保険金受取人が法人である終身保険の保険料は貯蓄性が高く全額資産計上（選択肢2は正しい）。解約返戻金のない医療保険は掛捨てのため全額損金算入可（選択肢3は正しい）。最高解約返戻率50％超70％以下・70％超85％以下等の区分に応じた資産計上割合のルールにより、最高解約返戻率75％の定期保険は前半4割期間において支払保険料の60％を資産計上する取扱いが正しい（選択肢4は正しい）。福利厚生プラン＝1/2損金という数字は頻出であり必修事項。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-016", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 16, "questionType": "four_choice", "question": "自動車損害賠償責任保険（以下、「自賠責保険」という）に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["原動機付自転車は、自賠責保険の加入が義務付けられていない。", "自賠責保険の保険金の支払限度額は、加害車両が1台である場合、被害者1人につき、死亡による損害については3,000万円である。", "自賠責保険の補償の対象は対人賠償に限られ、対物賠償は補償の対象とならない。", "自賠責保険では、被害者が、保険会社に対し、保険金額の限度において、損害賠償額の支払を請求することができる。"], "answer": 1, "explanation": "自賠責保険は原動機付自転車を含むすべての自動車（軽自動車・二輪車・原付を含む）に加入が義務付けられているため、「原動機付自転車は加入が義務付けられていない」とする選択肢1が誤り。死亡による損害の支払限度額は被害者1人につき3,000万円（選択肢2は正しい）。自賠責保険は対人賠償のみを対象とし対物賠償は対象外（選択肢3は正しい）。被害者は保険会社に対して直接、保険金額の限度内で損害賠償額の支払を請求できる被害者請求の制度がある（選択肢4は正しい）。自賠責保険の強制加入対象に原付が含まれる点は基本知識として押さえておくべき頻出論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-017", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 17, "questionType": "four_choice", "question": "地震保険の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["地震保険は、火災保険の契約時に付帯して加入するほか、火災保険の保険期間の中途で付帯して加入することもできる。", "地震保険の保険料率は、居住用建物の構造によって異なるが、居住用建物の所在地による違いはない。", "地震保険の保険料には、「建築年割引」「耐震等級割引」「免震建築物割引」「耐震診断割引」の割引制度があるが、これらは重複して適用を受けることはできない。", "地震保険では、「全損」「大半損」「小半損」「一部損」の区分による損害の程度に応じて保険金が支払われる。"], "answer": 2, "explanation": "地震保険の保険料率は建物の構造（イ構造・ロ構造）だけでなく、地震発生リスクの違いを反映して都道府県ごと（所在地）によっても異なるため、「所在地による違いはない」とする選択肢2が誤り。地震保険は火災保険契約時だけでなく契約期間の中途でも付帯加入できる（選択肢1は正しい）。4種類の割引制度は重複適用不可で最も有利な1つのみ適用される（選択肢3は正しい）。損害区分は全損・大半損・小半損・一部損の4区分で保険金額に対する一定割合が支払われる（選択肢4は正しい）。地震保険料率が「構造×所在地」の2要素で決まる点は頻出のひっかけであり、所在地要素を見落とさないこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-018", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 18, "questionType": "four_choice", "question": "契約者（＝保険料負担者）を法人とする損害保険に係る保険料等の経理処理に関する次の記述のうち、最も適切なものはどれか。", "choices": ["被保険者および保険金受取人を従業員全員とする普通傷害保険の支払保険料は、その全額を損金の額に算入することができる。", "保険期間5年の火災保険において、5年分の保険料を一括で支払った場合、その全額を支払った事業年度の損金の額に算入することができる。", "業務用自動車が交通事故により損壊し、法人が受け取った自動車保険の車両保険の保険金の全額を充当して修理をした場合、当該保険金について経理処理をする必要はない。", "倉庫に保管していた棚卸資産が火災により滅失し、法人が受け取った火災保険の保険金で同一の棚卸資産を取得した場合、当該棚卸資産について圧縮記帳の適用を受けることができる。"], "answer": 1, "explanation": "従業員全員を被保険者・保険金受取人とする普通傷害保険の保険料は、福利厚生費として全額をその事業年度の損金の額に算入できるため、選択肢1が正しい。複数年分を一括払いした損害保険料は、支払時に全額を損金算入するのではなく、期間の経過に応じて按分し、未経過期間分は前払費用として資産計上する必要があるため選択肢2は誤り。車両保険金で修理をした場合、保険金は原則として益金に算入し、修理費用は損金に算入するという両建ての経理処理が必要であり「経理処理をする必要はない」とする選択肢3は誤り。圧縮記帳は固定資産（建物・機械等）の滅失に伴う保険金等について適用される制度であり、棚卸資産の滅失に対する保険金には圧縮記帳は適用できないため選択肢4も誤り。損害保険料の期間按分と圧縮記帳の対象資産（棚卸資産は対象外）は頻出の誤りやすいポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-019", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 19, "questionType": "four_choice", "question": "第三分野の保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。", "choices": ["医療保険では、治療を目的としない人間ドックなどの検査入院をし、異常が発見されなかった場合、入院給付金は支払われない。", "限定告知型の医療保険では、他の契約条件が同一で限定告知型ではない医療保険と比較して、割安な保険料が設定されている。", "所得補償保険では、ケガや病気によって就業不能となった場合であっても、医療機関に入院しなければ、保険金は支払われない。", "がん保険では、180日間または6カ月間の免責期間が設けられており、その期間中にがんと診断確定されても、がん診断給付金は支払われない。"], "answer": 1, "explanation": "医療保険の入院給付金は治療を目的とする入院が支払対象であり、人間ドックなど検査目的の入院で異常が発見されなかった場合は治療とはいえないため給付金は支払われず、選択肢1が正しい。限定告知型（引受基準緩和型）医療保険は、持病があっても加入しやすい分、通常の医療保険より保険料は割高に設定されているため選択肢2は誤り。所得補償保険は入院を要件とせず、医師の指示に基づく自宅療養等で就業不能状態にあれば保険金の支払対象となるため選択肢3は誤り。がん保険には契約日から90日間（または3カ月）程度の免責期間（待期期間）が設けられているのが一般的であり、180日・6カ月という数字は誤りで選択肢4も誤り。がん保険の免責期間の日数（90日）は頻出数字なので正確に覚えておく必要がある。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-020", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 20, "questionType": "four_choice", "question": "損害保険を活用した事業活動のリスク管理に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["レストランを営む事業者が、提供した料理が原因で食中毒を発生させ、法律上の損害賠償責任を負担する場合に備えて、生産物賠償責任保険（PL保険）を契約した。", "貸しビル業を営む事業者が、火災により所有するビル内に設置した機械に損害が生じる場合に備えて、機械保険を契約した。", "建設業を営む事業者が、請け負った建築工事中に誤って工具を落として第三者にケガをさせ、法律上の損害賠償責任を負担する場合に備えて、請負業者賠償責任保険を契約した。", "製造業を営む事業者が、業務中の事故により従業員やパート従業員がケガをする場合に備えて、労働者災害補償保険（政府労災保険）の上乗せ補償を目的として労働災害総合保険を契約した。"], "answer": 2, "explanation": "機械保険は、火災以外の原因（機械の破裂・作業ミス等の偶発的事故）による機械の損害を補償する保険であり、火災による損害は一般に機械保険では免責とされ火災保険で対応すべき事故であるため、「火災により生じた機械の損害」に備えて機械保険を契約するという選択肢2の記述は不適切。飲食物が原因の食中毒による賠償責任にはPL保険が適切（選択肢1は正しい）。工事中の事故による第三者への賠償責任には請負業者賠償責任保険が適切（選択肢3は正しい）。労災の上乗せ補償には労働災害総合保険が適切（選択肢4は正しい）。機械保険と火災保険の補償範囲の切り分け（機械保険は火災事故を免責とする）は事業活動リスク管理の頻出論点である。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-021", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 21, "questionType": "four_choice", "question": "為替相場の変動要因に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["日本の物価が米国と比較して相対的に上昇することは、一般に、円安・米ドル高の要因となる。", "米国が政策金利を引き上げることにより、日本と米国との金利差が拡大することは、一般に、円高・米ドル安の要因となる。", "日本の対米貿易黒字が拡大することは、一般に、円高・米ドル安の要因となる。", "購買力平価説によれば、米国と日本に同じ財があり、その財を米国では3米ドル、日本では450円で買える場合、為替レートは1米ドル＝150円が妥当となる。"], "answer": 2, "explanation": "米国が政策金利を引き上げ日米金利差が拡大すると、より高い金利を求めて資金が円からドルへ流出（ドル買い・円売り）しやすくなり、一般に円安・米ドル高の要因となる。したがって「円高・米ドル安の要因となる」とする選択肢2は逆であり誤り。日本の物価上昇（円の実質的な価値低下）は円安要因（選択肢1は正しい）。対米貿易黒字拡大は輸出企業のドル売り・円買いを通じて円高要因となる（選択肢3は正しい）。購買力平価説では同一財の価格比較（3米ドル＝450円）から1米ドル＝150円が妥当なレートとなる（選択肢4は正しい、450÷3＝150）。金利差拡大と為替の方向性（高金利通貨が買われる）は金融資産運用分野の頻出テーマ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-022", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 22, "questionType": "four_choice", "question": "銀行等の金融機関で取り扱う預金の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。", "choices": ["期日指定定期預金では、預金者が、預入日の翌営業日から最長預入期日までの間で満期日を指定することができる。", "当座預金は、公共料金の自動振替口座として利用することができる。", "スーパー定期預金には、預入期間が3年以上の場合、単利型と半年複利型があるが、半年複利型を利用することができるのは法人に限られる。", "大口定期預金は、最低預入金額が2,000万円に設定された変動金利型の定期預金である。"], "answer": 2, "explanation": "当座預金は本来手形・小切手の決済用口座であるが、公共料金等の自動振替（口座振替）にも利用することができるため選択肢2は正しい。期日指定定期預金は一般に据置期間（通常1年）経過後に満期日を指定できる仕組みであり、「預入日の翌営業日から」ではないため選択肢1は誤り。スーパー定期預金の半年複利型は預入期間3年以上の場合に個人のみが利用でき、法人は利用できない（選択肢3は法人・個人が逆で誤り）。大口定期預金は最低預入金額1,000万円以上の固定金利型定期預金であり、変動金利型でも2,000万円でもないため選択肢4も誤り。各種預金商品の対象者（個人限定か法人可か）や金利タイプの違いは頻出の細かい論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-023", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 23, "questionType": "four_choice", "question": "上場投資信託（ETF）の一般的な仕組みに関する次の記述のうち、最も適切なものはどれか。", "choices": ["ETFは、非上場の投資信託と異なり、運用管理費用（信託報酬）は徴収されない。", "証券取引所を通じて行うETFの売買取引では、現物取引のほか、信用取引も行うことができる。", "ETFは、支払われる分配金が自動で再投資されるため、投資の複利効果を得ることができる。", "ETFには、株価指数に連動するものはあるが、REIT指数や商品指数に連動するものはない。"], "answer": 2, "explanation": "ETFは上場株式と同様に証券取引所で売買される投資信託であり、通常の現物取引に加え、信用取引の対象にもなり得るため選択肢2が正しい。ETFも投資信託である以上、運用管理費用（信託報酬）は徴収されるため選択肢1は誤り。ETFの分配金は自動的に再投資される仕組みではなく、投資家に金銭として分配されるのが原則であり（自動再投資ができるのは一般的な追加型株式投資信託の分配金再投資コースなど）、選択肢3は誤り。ETFには日経平均やTOPIXなどの株価指数連動型のほか、東証REIT指数連動型や金・商品指数連動型のETFも存在するため選択肢4も誤り。ETFは上場している分、信用取引が可能という点が非上場投資信託との重要な違いである。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-024", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 24, "questionType": "four_choice", "question": "固定利付債券（個人向け国債を除く）の一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["市場金利の上昇は債券価格の下落要因となり、市場金利の低下は債券価格の上昇要因となる。", "発行体の財務状況の悪化や経営不振などにより、元金の償還や利払い等が履行されない可能性が高まることは、債券価格の下落要因となる。", "景気が好況で物価が持続的に上昇する状態にある局面では、債券価格は上昇する傾向がある。", "債券を償還までの期間の長短で比較した場合、他の条件が同一であれば、償還までの期間が長い債券のほうが、利回りの変化に対する価格の変動幅は大きくなる。"], "answer": 3, "explanation": "景気が好況でインフレ（物価上昇）が続く局面では、一般に市場金利が上昇するため、金利上昇は債券価格の下落要因となり、「債券価格は上昇する傾向がある」とする選択肢3は誤り（正しくは下落傾向）。市場金利と債券価格が逆方向に動く関係（選択肢1）、発行体の信用力低下（デフォルトリスクの上昇）が価格下落要因となる点（選択肢2）は正しい。償還までの期間が長い債券ほどデュレーションが長く、金利変動に対する価格変動幅（感応度）が大きくなる（選択肢4は正しい）。「好況・インフレ→金利上昇→債券価格下落」という因果関係の理解は債券投資の基本であり頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-025", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 25, "questionType": "four_choice", "question": "国内の証券取引所における上場株式の取引の一般的な仕組みに関する次の記述のうち、最も不適切なものはどれか。なお、各選択肢において、株式は内国株式であるものとする。", "choices": ["証券取引所の立会取引における上場株式の売買注文のうち、指値注文では、価格優先の原則および時間優先の原則に従って処理される。", "証券取引所の立会取引における上場株式の売買注文では、成行注文よりも指値注文が優先される。", "上場株式を証券取引所の普通取引により売買したときの受渡日（決済日）は、原則として、売買の約定日（売買成立日）から起算して3営業日目である。", "上場株式を証券取引所の普通取引により売買する場合、100株単位での取引となる。"], "answer": 2, "explanation": "証券取引所の売買注文では、価格を指定しない成行注文が指値注文よりも優先して約定する原則（成行優先の原則）があり、「指値注文が優先される」とする選択肢2は逆であり誤り。指値注文同士では価格優先・時間優先の原則が適用される（選択肢1は正しい）。普通取引の受渡しは約定日を含め3営業日目（約定日の2営業日後）とされている（選択肢3は正しい）。国内上場株式は原則として単元株制度により100株単位で取引される（選択肢4は正しい）。「成行注文優先の原則」は板寄せ・ザラバ方式の基本ルールとして頻出であり、価格優先・時間優先の原則と併せて整理しておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-026", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 26, "questionType": "four_choice", "question": "株式市場の各種指標等に関する次の記述のうち、最も適切なものはどれか。", "choices": ["日経平均株価は、東京証券取引所のプライム市場に上場している内国普通株式全銘柄を対象として算出される。", "JPX日経インデックス400は、東京証券取引所のプライム市場、スタンダード市場、グロース市場を主市場とする銘柄から企業の収益性や株式の流動性等を基に選定された400銘柄を対象として算出される。", "東証REIT指数は、東京証券取引所に上場している不動産投資信託の銘柄のうち、時価総額上位30銘柄を対象として算出される。", "S&P500種株価指数は、英国のロンドン証券取引所に上場している銘柄のうち、時価総額上位の代表的な500銘柄を対象として算出される。"], "answer": 2, "explanation": "JPX日経インデックス400は、東証プライム・スタンダード・グロースの各市場から、ROEや営業利益等の収益性、時価総額、流動性等の基準により選定された400銘柄で構成される指数であり、選択肢2が正しい。日経平均株価はプライム市場上場の全銘柄ではなく、その中から選定された代表的な225銘柄を対象とする指数であるため選択肢1は誤り。東証REIT指数は上位30銘柄に限定せず、東証に上場する全REIT銘柄を対象として算出されるため選択肢3は誤り。S&P500種株価指数は英国ロンドン証券取引所ではなく、米国の株式市場（NYSE・NASDAQ等）に上場する代表的な500銘柄を対象とする指数であるため選択肢4も誤り。各指数の対象銘柄数・対象市場の正確な理解が問われる頻出分野。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-027", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 27, "questionType": "four_choice", "question": "個人（居住者）が国内の金融機関を通じて取引する外貨建金融商品の一般的な仕組みに関する次の記述のうち、最も不適切なものはどれか。", "choices": ["外貨建金融商品の取引に係る為替手数料は、同一の外貨を対象にする場合であっても、取扱金融機関によって異なることがある。", "外貨預金の払戻し時において、預金者が外貨を円貨に交換する場合に適用される為替レートは、預入金融機関が提示する対顧客直物電信売相場（TTS）である。", "外国為替証拠金取引では、証拠金にあらかじめ決められた倍率を掛けた金額まで売買することができるが、倍率には法令により上限が定められている。", "米ドル建債券を保有している場合、為替レートが円安・米ドル高に変動することは、当該債券に係る円換算の運用利回りの上昇要因となる。"], "answer": 2, "explanation": "外貨を円貨に交換する（外貨を売って円を受け取る）際に適用されるのは対顧客直物電信買相場（TTB）であり、対顧客直物電信売相場（TTS）は円を外貨に交換する際に適用されるレートであるため、選択肢2の記述は逆であり誤り。為替手数料は金融機関ごとに設定が異なる（選択肢1は正しい）。FX（外国為替証拠金取引）のレバレッジ倍率は個人向けで最大25倍などの上限が金融商品取引法関連法令により定められている（選択肢3は正しい）。米ドル建資産を保有中に円安・ドル高が進むと、円換算した資産価値・運用利回りは上昇する（選択肢4は正しい）。TTS（Selling、円から外貨）とTTB（Buying、外貨から円）の向きの取り違えは外貨建商品分野で最頻出のひっかけである。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-028", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 28, "questionType": "four_choice", "question": "Aさんのポートフォリオにおける各資産の構成比、期待収益率および標準偏差が下記の表のとおりであった場合、当該ポートフォリオの期待収益率として、最も適切なものはどれか。\n資産：預金60％期待収益率0.1％／債券10％期待収益率1.0％／株式30％期待収益率7.0％", "choices": ["0.32％", "1.10％", "2.26％", "2.70％"], "answer": 3, "explanation": "ポートフォリオ全体の期待収益率は、各資産の構成比に期待収益率を乗じた値を合計して求める加重平均で計算する。預金部分は0.6×0.1％＝0.06％、債券部分は0.1×1.0％＝0.10％、株式部分は0.3×7.0％＝2.10％となり、これらを合計すると0.06％＋0.10％＋2.10％＝2.26％となる。したがって正解は選択肢3。標準偏差の情報は本設問の期待収益率の計算には使用しない（リスク＝標準偏差の合成にはアセット間の相関係数が必要であり、単純な加重平均では求められない点に注意）。ポートフォリオの期待収益率は加重平均、リスク（標準偏差）は相関係数を考慮した計算が必要という違いを理解しておくことが重要。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-029", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 29, "questionType": "four_choice", "question": "NISA（少額投資非課税制度）に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、NISAにより投資収益が非課税となる口座をNISA口座という。", "choices": ["NISAのつみたて投資枠と成長投資枠の双方を、同一年中において、併せて新規投資に利用することはできない。", "NISA口座は、その年の1月1日時点において20歳未満の者は、開設することができない。", "NISAのつみたて投資枠を利用して購入した株式投資信託の非課税保有期間は、最長で20年間とされている。", "NISAのつみたて投資枠を利用して1年間のうちに株式投資信託を購入することができる限度額（年間投資枠）は、120万円である。"], "answer": 4, "explanation": "2024年開始の新NISA制度において、つみたて投資枠の年間投資枠上限は120万円であり、選択肢4は正しい。新NISAでは、つみたて投資枠と成長投資枠は同一年中に併用して利用することができるため選択肢1は誤り。NISA口座の開設可能年齢は、その年の1月1日時点で18歳以上とされており、20歳未満は開設不可という記述（未成年者は一律不可とする点）は現行制度と異なり誤り。新NISAでは非課税保有期間の制限が撤廃され無期限化されているため、「最長20年間」とする選択肢3は旧つみたてNISAの内容であり誤り。新NISAの年間投資枠（つみたて120万円・成長240万円、合計最大360万円）と非課税保有限度額1,800万円は必須の暗記数字。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-030", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 30, "questionType": "four_choice", "question": "預金保険制度に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["確定拠出年金の加入者が運用の対象として選択した定期預金は、加入者の預金として、預金保険制度による保護の対象となる。", "預金保険制度の対象金融機関に預け入れた決済用預金については、1金融機関ごとに預金者1人当たり元本1,000万円を限度として、預金保険制度による保護の対象となる。", "日本国内に本店のある銀行の国内支店に預け入れた外貨預金は、その金額の多寡にかかわらず、預金保険制度による保護の対象とならない。", "単に名義を借りたにすぎない他人名義預金は、預金保険制度による保護の対象とならない。"], "answer": 2, "explanation": "決済用預金（無利息・要求払い・決済サービスを提供という3要件を満たす預金、代表例は当座預金）は、預金保険制度により金額の上限なく全額保護される仕組みであり、「1,000万円を限度として保護される」とする選択肢2は誤り（1,000万円までの限度額があるのは一般預金等であり、決済用預金は別枠で全額保護）。確定拠出年金の運用対象として選択された定期預金も、通常の預金と同様に加入者名義の預金として保護対象となる（選択肢1は正しい）。外貨預金は預金保険制度の対象外である（選択肢3は正しい）。単なる名義借り（実質的な預金者と名義人が異なる預金）は保護対象とならない（選択肢4は正しい）。「決済用預金＝全額保護、一般預金等＝1,000万円まで」という区分は預金保険制度の最重要ポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-031", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 31, "questionType": "four_choice", "question": "わが国の税制に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["所得税では、課税対象となる所得を10種類に区分し、所得の種類ごとに定められた計算方法により所得の金額を計算する。", "相続税では、納税者が申告書に記載した被相続人の資産等の内容に基づき、税務署長が納付すべき税額を決定する賦課課税方式が採用されている。", "税金を負担する者と税金を納める者が異なる税金を間接税といい、消費税は間接税に該当する。", "税金には国税と地方税があるが、法人税は国税に該当し、不動産取得税は地方税に該当する。"], "answer": 2, "explanation": "相続税は、納税義務者自身が課税価格や税額を計算して申告・納付する申告納税方式が採用されており、税務署長が税額を決定する賦課課税方式（固定資産税や不動産取得税等の地方税に多い方式）ではないため、選択肢2が最も不適切。所得税は10種類（利子・配当・不動産・事業・給与・退職・山林・譲渡・一時・雑）に所得を区分して計算する（選択肢1は正しい）。消費税のように負担者と納税者が異なる税を間接税という（選択肢3は正しい）。法人税は国税、不動産取得税は地方税（都道府県税）である（選択肢4は正しい）。「申告納税方式」と「賦課課税方式」の区別、および相続税・所得税・法人税が申告納税方式である点は税制の基本として頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-032", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 32, "questionType": "four_choice", "question": "所得税における各種所得に関する次の記述のうち、最も適切なものはどれか。", "choices": ["個人事業主が事業資金で株式を購入し、その配当金を受け取ったことによる所得は、事業所得となる。", "給与等の収入金額が850万円を超える給与所得者が23歳未満の扶養親族を有する場合、総所得金額の計算上、給与所得の金額から所得金額調整控除として最大で10万円が控除される。", "個人による不動産の貸付が事業的規模で行われている場合、その賃貸収入による所得は、事業所得となる。", "会社員が自宅の購入資金として勤務先から無利息で金銭を借り入れたことにより生じた経済的利益は、給与所得となる。"], "answer": 4, "explanation": "勤務先から無利息または低利で金銭を借り入れたことにより得られる経済的利益（本来支払うべき利息相当額の免除）は、給与所得者にとって労務の対価に準じるものとして給与所得として課税されるため選択肢4が正しい。事業資金で取得した株式であっても配当金は事業所得ではなく配当所得として区分される（選択肢1は誤り）。所得金額調整控除は、給与収入850万円超で、本人が特別障害者である、23歳未満の扶養親族を有する等の要件に該当する場合に適用され、控除額は（給与等の収入金額（1,000万円が上限）－850万円）×10％で計算され、最大15万円（1,000万円のとき）であり最大10万円ではないため選択肢2は誤り。不動産の貸付は事業的規模であっても不動産所得に区分され、事業所得にはならないため選択肢3も誤り。所得区分の原則（不動産賃貸は規模を問わず不動産所得）は頻出のひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-033", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 33, "questionType": "four_choice", "question": "所得税における損益通算に関する次の記述のうち、最も適切なものはどれか。", "choices": ["不動産所得の金額の計算上生じた損失の金額のうち、不動産所得を生ずべき業務の用に供する土地の取得に要した負債の利子に相当する部分の金額は、給与所得の金額と損益通算することができる。", "先物取引に係る雑所得の金額の計算上生じた損失の金額は、不動産所得の金額と損益通算することができる。", "生活の用に供していた自家用車を売却したことによる譲渡所得の金額の計算上生じた損失の金額は、給与所得の金額と損益通算することができる。", "コンサルティング事業を営むことによる事業所得の金額の計算上生じた損失の金額は、不動産所得の金額と損益通算することができる。"], "answer": 4, "explanation": "事業所得の金額の計算上生じた損失（赤字）は、不動産所得・給与所得・雑所得等の他の所得と損益通算することができるため、選択肢4が正しい。不動産所得の損失のうち、土地等の取得に要した負債の利子に相当する部分の金額は損益通算の対象から除外される特例があり、選択肢1は誤り。先物取引に係る雑所得（申告分離課税）の損失は、原則として他の所得と損益通算できず（先物取引間での通算・繰越控除のみ可能）、選択肢2は誤り。生活用動産（通勤用の自家用車など生活に通常必要な動産）の譲渡による譲渡所得の損失は、そもそも損益通算の対象とならない（非課税所得に近い扱い）ため選択肢3も誤り。損益通算の対象となる所得（不動産・事業・山林・譲渡の頭文字「不事山譲」）とその例外（土地取得の負債利子、生活用動産の譲渡損等）は最頻出論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-034", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 34, "questionType": "four_choice", "question": "所得税における所得控除に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["控除対象扶養親族のうち、その年の12月31日現在の年齢が19歳以上23歳未満の者は、特定扶養親族に該当する。", "控除対象扶養親族のうち、その年の12月31日現在の年齢が70歳以上の者は、老人扶養親族に該当する。", "納税者の合計所得金額が1,000万円を超える場合、配偶者の合計所得金額の多寡にかかわらず、配偶者控除の適用を受けることはできない。", "納税者との婚姻の届出を提出していない者であっても、納税者が加入している健康保険の被扶養者となっており、いわゆる内縁関係にあると認められる者は、控除対象配偶者に該当する。"], "answer": 4, "explanation": "所得税における配偶者控除の対象となる「配偶者」は民法上の婚姻届出をした法律上の配偶者に限られ、健康保険上の被扶養者であるかどうかにかかわらず、内縁関係（事実婚）にある者は控除対象配偶者に該当しないため、選択肢4が最も不適切。19歳以上23歳未満の控除対象扶養親族は特定扶養親族に該当し、扶養控除額が上乗せされる（選択肢1は正しい）。70歳以上の控除対象扶養親族は老人扶養親族に該当する（選択肢2は正しい）。納税者本人の合計所得金額が1,000万円を超える場合は配偶者控除の適用が一切できない（選択肢3は正しい）。税法上の「配偶者」は民法上の婚姻関係を要する点は社会保険の被扶養者の考え方との違いとして頻出のひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-035", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 35, "questionType": "four_choice", "question": "所得税における配当控除に関する次の記述のうち、最も不適切なものはどれか。なお、記載のない事項については考慮しないものとする。", "choices": ["内国法人から支払を受ける非上場株式の配当に係る配当所得は、確定申告において総合課税を選択したとしても、配当控除の適用を受けることはできない。", "公募株式投資信託の分配金に係る配当所得は、確定申告において総合課税を選択することにより、配当控除の適用を受けることができる。", "配当控除の控除額を計算する際の配当所得の金額は、株式等を取得するために要した負債の利子がある場合、配当等の収入金額から当該負債の利子の額を控除した金額である。", "配当控除の控除額を計算する際の配当所得の金額は、配当所得の金額が他の所得の金額と損益通算される場合、損益通算する前の配当所得の金額である。"], "answer": 1, "explanation": "非上場株式の配当であっても、内国法人から支払を受ける剰余金の配当等であれば、確定申告で総合課税を選択することにより配当控除の適用を受けることができるため、「適用を受けることはできない」とする選択肢1が誤り（ただし申告不要制度を選択した場合や申告分離課税を選択した場合は配当控除の適用はない）。公募株式投資信託（一定の外貨建資産や不動産投資信託を含まないもの）の分配金も総合課税選択により配当控除の対象となる（選択肢2は正しい）。配当控除の計算上の配当所得の金額は、負債利子を控除した後の金額を基礎とする（選択肢3は正しい）。損益通算がある場合は通算前の配当所得の金額を基礎に配当控除を計算する（選択肢4は正しい）。上場・非上場を問わず「総合課税を選択すれば配当控除の対象になり得る」という原則を押さえておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-036", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 36, "questionType": "four_choice", "question": "所得税の申告に関する次の記述のうち、最も適切なものはどれか。なお、各選択肢において、記載された所得以外の所得は考慮しないものとする。また、いずれも適切に源泉徴収等がされ、年末調整すべきものは年末調整が済んでいるものとする。", "choices": ["1カ所から給与として年額1,500万円の支払を受けた給与所得者は、確定申告を要しない。", "同族会社の役員がその会社から給与として年額800万円の支払を受け、かつ、その会社から不動産賃貸料として年額12万円の支払を受けた場合、当該役員は確定申告を要しない。", "2カ所以上から給与の支払を受けている者のうち、給与の全部が源泉徴収の対象となる場合において、年末調整されなかった給与の収入金額が年額25万円である者は、確定申告を要しない。", "確定申告を要する者は、原則として、所得が生じた年の翌年2月16日から3月31日までの間に納税地の所轄税務署長に対して確定申告書を提出しなければならない。"], "answer": 1, "explanation": "1カ所のみから給与の支払を受け、年末調整で所得税の精算が完了している給与所得者は、給与収入がいくら高額であっても（1,500万円等）原則として確定申告は不要であるため、選択肢1が正しい。ただし、同族会社の役員が、その会社から給与のほかに、当該会社に対する不動産の貸付け等による所得（地代・家賃等）を受けている場合は、金額の多寡（少額）にかかわらず確定申告が必要とされる特則があるため選択肢2は誤り。2カ所以上から給与を受ける者は、主たる給与以外の給与や他の所得の合計額が20万円を超える場合に確定申告が必要となり、25万円は20万円を超えているため確定申告が必要であり選択肢3は誤り。確定申告書の提出期間は原則として翌年2月16日から3月15日までであり、3月31日ではないため選択肢4も誤り。「同族会社役員の副収入は少額でも申告要」「20万円基準」「申告期限3月15日」は所得税申告の最頻出数字。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-037", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 37, "questionType": "four_choice", "question": "法人税の基本的な仕組みに関する次の記述のうち、最も適切なものはどれか。", "choices": ["法人税の納税地は、原則として、その法人の代表者の住所地または居所地である。", "法人は、法人税の納税地に異動があった場合、原則として、異動前の納税地の所轄税務署長にその旨を届け出なければならない。", "法人税の確定申告書は、原則として、各事業年度終了の日の翌日から1カ月以内に、納税地の所轄税務署長に提出しなければならない。", "新設法人が設立事業年度から青色申告の適用を受けようとする場合、原則として、設立の日から1カ月以内に、「青色申告の承認申請書」を納税地の所轄税務署長に提出しなければならない。"], "answer": 2, "explanation": "法人税の納税地に異動があった場合、法人は原則として異動前の納税地の所轄税務署長に対して異動届出書を提出しなければならないため、選択肢2が正しい。法人税の納税地は法人の代表者の住所地ではなく、原則としてその法人の本店または主たる事務所の所在地であるため選択肢1は誤り。法人税の確定申告書の提出期限は原則として各事業年度終了の日の翌日から2カ月以内であり、1カ月以内ではないため選択肢3は誤り。新設法人が設立事業年度から青色申告の適用を受けるためには、原則として設立の日以後3カ月を経過した日と当該事業年度終了の日とのいずれか早い日の前日までに承認申請書を提出する必要があり、1カ月以内ではないため選択肢4も誤り。法人税確定申告の期限（2カ月以内）と青色申告承認申請の期限（設立後3カ月以内等）の数字の違いは頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-038", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 38, "questionType": "four_choice", "question": "法人税における減価償却に関する次の記述のうち、最も不適切なものはどれか。なお、各選択肢において、当期とは2024年4月1日から2025年3月31日までの事業年度であるものとする。", "choices": ["法人が減価償却費を損金の額に算入するにあたっては、確定した決算において償却費として損金経理することが要件とされている。", "法人が2016年4月1日以後に取得した建物、建物附属設備および構築物については、「減価償却資産の償却方法の届出書」の提出の有無にかかわらず、定額法を選択することはできず、定率法しか認められない。", "当期に取得価額が10万円未満の減価償却資産を取得して事業の用に供した場合、その使用可能期間の長短にかかわらず、原則として、当期においてその取得価額の全額を損金経理により損金の額に算入することができる。", "当期に取得価額が10万円以上20万円未満の減価償却資産を取得して事業の用に供した場合、原則として、当期以後3年間にわたってその取得価額の3分の1相当額を損金経理により損金の額に算入することができる。"], "answer": 2, "explanation": "2016年4月1日以後に取得した建物、建物附属設備および構築物の法定償却方法は「定額法」のみとされ、定率法を選択することはできない（記述内容が逆になっている）ため、選択肢2が誤り。減価償却費の損金算入には確定決算での損金経理が要件となる（選択肢1は正しい）。取得価額10万円未満の少額減価償却資産は、原則としてその事業年度に全額を損金算入できる（選択肢3は正しい、なお中小企業者等の特例で30万円未満まで拡大される場合もある）。取得価額10万円以上20万円未満の資産は一括償却資産として3年間で均等に（3分の1ずつ）損金算入できる（選択肢4は正しい）。「2016年4月以後の建物等＝定額法のみ」という改正内容は減価償却分野の最頻出ポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-039", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 39, "questionType": "four_choice", "question": "消費税に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["消費税の課税期間に係る基準期間は、個人事業者についてはその年の前年である。", "基準期間における課税売上高が1,000万円を超える法人は、消費税の免税事業者となることができない。", "特定期間における給与等支払額の合計額および課税売上高がいずれも1,000万円を超える法人は、消費税の免税事業者となることができない。", "消費税の課税事業者である法人は、原則として、課税期間の末日の翌日から2カ月以内に、消費税の確定申告書を納税地の所轄税務署長に提出しなければならない。"], "answer": 1, "explanation": "個人事業者の消費税における基準期間は、その年の前年ではなく前々年であるため、選択肢1の記述は誤り。これに対して特定期間における課税売上高と給与等支払額の合計額は、いずれか一方が1,000万円を超える場合に免税事業者となれない取扱いであり、両方が1,000万円を超えることを要件とする選択肢3の「かつ」という記述も誤りである。もっとも、本問においては選択肢1が最も基本的な誤り（前年ではなく前々年）であるため正解となる。基準期間の課税売上高が1,000万円超であれば免税事業者となれない（選択肢2は正しい）。消費税確定申告書の提出期限は課税期間終了の日の翌日から原則2カ月以内である（選択肢4は正しい）。個人事業者の基準期間は「前々年」、法人は「前々事業年度」である点、および特定期間の判定基準が「または」である点は消費税の最頻出論点として必ず押さえておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-040", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 40, "questionType": "four_choice", "question": "損益計算書および貸借対照表の一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["損益計算書における売上総利益の額は、売上高の額から売上原価の額を差し引いた額である。", "損益計算書における営業利益の額は、経常利益の額から販売費及び一般管理費の額を差し引いた額である。", "貸借対照表における無形固定資産は、物理的な形態を持たない特許権や商標権等の資産の金額を表している。", "貸借対照表における固定負債は、返済期限が決算日の翌日から1年以内に到来しない借入金等の負債の金額を表している。"], "answer": 2, "explanation": "損益計算書は売上高から順に、売上高－売上原価＝売上総利益、売上総利益－販売費及び一般管理費＝営業利益、営業利益＋営業外収益－営業外費用＝経常利益という積み上げの順序で計算されるため、営業利益は経常利益から販売費及び一般管理費を差し引いて求めるものではなく、逆に営業利益をもとに経常利益を計算する。したがって選択肢2の記述は計算順序が逆で誤り。売上総利益の計算式（選択肢1）、無形固定資産の定義（選択肢3）、固定負債の定義（決算日の翌日から1年を超えて返済期限が到来するもの、選択肢4）はいずれも正しい。損益計算書の利益段階（売上総利益→営業利益→経常利益→税引前当期純利益→当期純利益）の順序を正確に覚えることが本問対策の鍵。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-041", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 41, "questionType": "four_choice", "question": "不動産の登記や調査に関する次の記述のうち、最も適切なものはどれか。", "choices": ["不動産登記の事務は、当該不動産の所在地である市区町村の役所や役場がつかさどっている。", "抵当権の設定を目的とする登記では、債権額や抵当権者の氏名または名称などの登記事項が、不動産の登記記録の権利部乙区に記録される。", "区分建物を除く建物に係る登記記録において、床面積は、壁その他の区画の内側線で囲まれた部分の水平投影面積（内法面積）により記録される。", "不動産の登記事項証明書の交付を請求することができるのは、当該不動産の利害関係者に限られる。"], "answer": 2, "explanation": "抵当権など所有権以外の権利に関する登記事項は、登記記録の権利部乙区に記録されるため、選択肢2が正しい。不動産登記事務は市区町村ではなく法務局（登記所）がつかさどっているため選択肢1は誤り。区分建物を除く一般建物の床面積は壁その他の区画の中心線で囲まれた部分の水平投影面積（壁芯面積）により算定されるのが原則であり、内法面積（区分建物の専有部分で用いられる算定方法）ではないため選択肢3は誤り。登記事項証明書の交付請求は利害関係の有無にかかわらず、手数料を納付すれば誰でも請求することができるため選択肢4も誤り。「一般建物＝壁芯、区分建物＝内法」という床面積の算定方法の違いは不動産分野の頻出ひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-042", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 42, "questionType": "four_choice", "question": "不動産の売買契約に係る民法の規定に関する次の記述のうち、最も適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["売主から代理権を付与された第三者が売主の所有不動産を売却する場合、その第三者が売買契約の締結時に売主の代理人である旨を買主に告げていなければ、買主がその旨を知ることができたとしても、当該契約は無効となる。", "共有されている不動産の共有者の1人が、自己が有している持分を第三者に譲渡する場合、他の共有者全員の同意を得なければならない。", "売買の目的物である建物が、その売買契約の締結から当該建物の引渡しまでの間に、地震によって全壊した場合、買主は売主に対して建物代金の支払を拒むことができる。", "買主が売主に解約手付を交付した場合、相手方が売買契約の履行に着手した後であっても、買主はその解約手付を放棄し、売主はその解約手付の倍額を現実に提供して、当該契約の解除をすることができる。"], "answer": 3, "explanation": "民法上、売買契約締結後、引渡し前に売主・買主いずれの責めにも帰することができない事由（地震などの不可抗力）により目的物が滅失・損傷した場合、買主は反対給付（代金支払い）の履行を拒むことができる（危険負担の債務者主義的な扱い）ため、選択肢3が正しい。代理人が本人（売主）の代理人であることを示さずに契約した場合（顕名がない場合）、相手方がその事情を知り、または知ることができたときは代理の効果が生じるとされており、「知ることができたとしても無効」とする選択肢1は誤り。共有持分の譲渡は各共有者が単独で自由に行うことができ、他の共有者全員の同意は不要であるため選択肢2は誤り（共有物全体の処分・変更には全員の同意が必要だが持分処分は別）。解約手付による契約解除は、相手方が契約の履行に着手する前でなければすることができず、履行着手後はできないため選択肢4も誤り。危険負担・手付解除・共有持分の処分は民法分野の頻出3論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-043", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 43, "questionType": "four_choice", "question": "借地借家法に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、定期借地権等以外の借地権を普通借地権という。", "choices": ["普通借地権の設定契約において、その存続期間は50年を超えることができない。", "借地権者の債務不履行により普通借地権の設定契約が解除された場合、借地権者は、借地権設定者に対し、借地上の建物を時価で買い取るべきことを請求することができない。", "普通借地権の存続期間が満了する場合に、借地権者が契約の更新を請求し、借地権設定者が遅滞なく異議を述べなかったときは、借地上に建物が存在するかどうかにかかわらず、従前の契約と同一の条件で契約を更新したものとみなされる。", "普通借地権の設定契約は、公正証書によってしなければならない。"], "answer": 2, "explanation": "借地権者の債務不履行（地代の不払い等）を理由として借地契約が解除された場合には、借地権者に契約継続の正当な保護は及ばず、建物買取請求権は認められないため、選択肢2が正しい。普通借地権の存続期間は当初30年以上と定めればよく、上限（50年を超えてはならない）という制限はないため選択肢1は誤り。契約更新後の建物買取請求権等が認められる更新の擬制は、借地上に建物が存在することが前提とされており、「建物が存在するかどうかにかかわらず」とする選択肢3は誤り。普通借地権の設定契約は口頭でも有効に成立し、公正証書による作成は必須ではない（公正証書が必要とされるのは事業用定期借地権）ため選択肢4も誤り。「建物買取請求権が認められない場合（債務不履行解除等）」は借地借家法の頻出ひっかけ論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-044", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 44, "questionType": "four_choice", "question": "建物の賃貸借に関する次の記述のうち、最も不適切なものはどれか。なお、本問においては、定期建物賃貸借契約以外の建物賃貸借契約を普通借家契約という。", "choices": ["期間の定めのない普通借家契約において、正当な事由に基づき、建物の賃貸人による賃貸借の解約の申入れが認められた場合、建物の賃貸借は、解約の申入れの日から6カ月を経過することによって終了する。", "普通借家契約において期間を1年未満に定めた場合、期間は1年とみなされる。", "賃借人は、建物の引渡しを受けた後にこれに生じた損傷があっても、通常の使用および収益によって生じた建物の損耗ならびに建物の経年変化によるものである場合は、賃貸借が終了したときに、その損傷を原状に復する義務を負わない。", "賃借人が賃貸人の同意を得て建物に付加した造作について、賃貸借終了時に、賃借人が賃貸人に対してその買取りを請求しないこととする旨の特約は有効である。"], "answer": 2, "explanation": "普通借家契約において期間を1年未満に定めた場合、借地借家法上は「期間の定めのない賃貸借」とみなされるのであって、「期間は1年とみなされる」わけではないため、選択肢2が最も不適切。期間の定めのない普通借家契約において、賃貸人が正当事由をもって解約を申し入れた場合、申入れの日から6カ月経過により賃貸借は終了する（選択肢1は正しい）。通常損耗・経年変化についての原状回復義務は賃借人に生じない（選択肢3は正しい、いわゆる通常損耗ガイドラインの考え方）。造作買取請求権は任意規定であり、買取請求をしない旨の特約（造作買取請求権を排除する特約）は有効である（選択肢4は正しい）。「期間1年未満＝期間の定めのない契約とみなす」は普通借家契約特有のルールとして頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-045", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 45, "questionType": "four_choice", "question": "都市計画法に関する次の記述のうち、最も適切なものはどれか。", "choices": ["都市計画区域として指定された区域では、計画的な市街化を図るため、都市計画に市街化区域と市街化調整区域との区分を定めなければならない。", "土地の区画形質の変更は、建築物の建築や特定工作物の建設の用に供することを目的としていない場合であっても、開発行為に該当する。", "土地区画整理事業の施行として行う開発行為は、都道府県知事等の開発許可を受ける必要はない。", "農業を営む者の居住の用に供する建築物の建築を目的として市街化調整区域内で行う開発行為は、都道府県知事等の開発許可を受ける必要がある。"], "answer": 3, "explanation": "土地区画整理事業の施行として行う開発行為は、都市計画法上、開発許可を要しない行為として明示的に除外されているため、選択肢3が正しい。都市計画区域について市街化区域・市街化調整区域の区分（線引き）を必ず定めなければならないわけではなく、区分を定めない「非線引都市計画区域」も存在するため選択肢1は誤り。開発行為とは「建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更」を指し、それ以外の目的で行う区画形質の変更は開発行為に該当しないため選択肢2は誤り。農業を営む者の居住用建築物（農家住宅）等、市街化調整区域内で行う開発行為のうち一定のものは開発許可が不要とされているため選択肢4も誤り。開発許可が不要となる例外（区画整理事業、農林漁業用建築物等）は都市計画法の頻出項目。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-046", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 46, "questionType": "four_choice", "question": "都市計画区域および準都市計画区域内における建築基準法の規定に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["敷地の前面道路の幅員が12ｍ未満である建築物の容積率は、原則として、「都市計画で定められた数値」と「前面道路の幅員に一定の数値を乗じたもの」とのいずれか低いほうが上限となる。", "準防火地域内に耐火建築物を建築する場合、建築物の建蔽率の制限について緩和措置の適用を受けることができる。", "建築基準法第42条第2項の規定により道路境界線とみなされる線と道路との間の敷地部分（セットバック部分）は、建築物を建築することができないが、建築物の建蔽率および容積率の算定の基礎となる敷地面積に算入することができる。", "建築物の敷地が2つの異なる用途地域にわたる場合、その全部について、敷地の過半の属する用途地域における建築物の用途に関する規定が適用される。"], "answer": 3, "explanation": "セットバック部分（2項道路のみなし道路境界線と実際の道路との間の敷地部分）は、建蔽率・容積率を算定する際の敷地面積には算入できない（含めない）取扱いとされているため、「算入することができる」とする選択肢3が誤り。前面道路幅員12ｍ未満の場合の容積率上限の計算方法（選択肢1）、準防火地域内の耐火建築物に対する建蔽率緩和（選択肢2）、2以上の用途地域にわたる敷地は過半の属する用途地域の用途規制が敷地全部に適用される（選択肢4）はいずれも正しい。セットバック部分は「建築不可・敷地面積に不算入」という2点セットで覚えておくべき頻出論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-047", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 47, "questionType": "four_choice", "question": "建物の区分所有等に関する法律に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["共用部分の管理に係る費用については、規約に別段の定めがない限り、共有者で等分する。", "区分所有者は、規約に別段の定めがない限り、集会の決議によって管理者を選任し、または解任することができる。", "区分所有建物ならびにその敷地および附属施設の管理を行うための団体（管理組合）は、区分所有者全員で構成される。", "共用部分に対する区分所有者の共有持分は、規約に別段の定めがない限り、各共有者が有する専有部分の床面積の割合による。"], "answer": 1, "explanation": "共用部分の管理に要する費用（管理費等）の負担割合は、区分所有法上、規約に別段の定めがない限り、各共有者の持分（専有部分の床面積の割合）に応じて負担するものとされており、「等分する」とする選択肢1が誤り。管理者の選任・解任は規約に別段の定めがない限り集会の決議による（選択肢2は正しい）。管理組合は区分所有者全員で当然に構成される団体である（選択肢3は正しい）。共用部分の共有持分は原則として専有部分の床面積の割合による（選択肢4は正しい）。管理費等の負担割合と共有持分の割合が原則として一致する（床面積割合按分）という点は区分所有法の基本であり頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-048", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 48, "questionType": "four_choice", "question": "不動産取得税に関する次の記述のうち、最も適切なものはどれか。", "choices": ["相続人以外の者が、被相続人が作成した遺言による特定遺贈により土地を取得した場合、原則として、不動産取得税が課される。", "相続人が、被相続人との死因贈与契約に基づき、被相続人の相続開始に伴って土地を取得した場合、原則として、不動産取得税は課されない。", "土地の所有権を等価交換方式による全部譲渡により取得した場合、原則として、取得者に対して不動産取得税は課されない。", "所定の要件を満たす戸建て住宅（認定長期優良住宅を除く）を新築した場合、不動産取得税の課税標準の算定にあたっては、1戸につき最高で1,500万円が価格から控除される。"], "answer": 1, "explanation": "相続による不動産の取得（相続人が相続により取得する場合）は不動産取得税が非課税とされるが、相続人以外の第三者への特定遺贈（相続人以外への遺贈）は、実質的に売買や贈与に近い財産移転として扱われ、不動産取得税の課税対象となるため選択肢1が正しい。死因贈与は法形式上「贈与」であり、相続そのものではないため非課税の対象とはならず、原則として不動産取得税が課されるため選択肢2は誤り。等価交換方式による取得は形式的には交換・譲渡であり、原則として不動産取得税の課税対象となるため選択肢3は誤り。一定の新築住宅（認定長期優良住宅を除く一般住宅）の課税標準からの控除額は1戸につき最高1,200万円であり、1,500万円ではないため選択肢4は誤り（認定長期優良住宅の場合は1,300万円）。相続（非課税）と遺贈・死因贈与（原則課税）の区別は不動産取得税の頻出ひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-049", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 49, "questionType": "four_choice", "question": "個人が土地を譲渡した場合の譲渡所得に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["譲渡した土地の取得費が不明な場合、譲渡所得の金額の計算上、譲渡収入金額の10％相当額を取得費とすることができる。", "土地の譲渡に係る所得については、譲渡した日の属する年の1月1日における当該土地の所有期間が5年を超える場合、長期譲渡所得に区分される。", "土地の譲渡に係る所得が長期譲渡所得に区分される場合、課税長期譲渡所得金額に対し、原則として、所得税（復興特別所得税を含む）15.315％、住民税5％の税率により課税される。", "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。"], "answer": 1, "explanation": "譲渡した土地の取得費が不明な場合に用いる概算取得費は、譲渡収入金額の10％相当額ではなく5％相当額とするのが正しいルールであるため、選択肢1が最も不適切。譲渡した年の1月1日時点の所有期間が5年を超えていれば長期譲渡所得に区分される（選択肢2は正しい）。長期譲渡所得の税率は所得税15.315％（復興特別所得税込み）、住民税5％の合計20.315％である（選択肢3は正しい）。仲介手数料は譲渡費用として譲渡所得の計算上控除できる（選択肢4は正しい）。「概算取得費＝譲渡収入金額の5％」という数字は土地・建物の譲渡所得計算における最頻出の基本数値であり、10％との混同に注意が必要。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-050", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 50, "questionType": "four_choice", "question": "土地の有効活用の手法に関する次の記述のうち、最も適切なものはどれか。", "choices": ["事業受託方式では、土地所有者は建物の建設資金を負担することなく、土地有効活用の企画、建設会社の選定、建物の建設、建設した建物の管理・運営等をデベロッパーに任せることができる。", "建設協力金方式では、土地所有者が土地上に建設するビルや店舗等を貸し付ける予定のテナントから、建設資金の全部または一部を借り受け、当該建物を建設することとなる。", "定期借地権方式では、土地所有者が土地上に建設される建物の所有名義人となり、当該土地と建物を一定期間貸し付けることにより地代・賃料収入を得ることができる。", "等価交換方式では、土地所有者は建物の建設資金を調達する必要はなく、土地の所有権の一部を譲渡することにより、当該土地上に建設された建物の全部を取得することができる。"], "answer": 2, "explanation": "建設協力金方式は、出店予定のテナントから建設資金の全部または一部を保証金・建設協力金の形で預かり、それを原資として土地所有者が建物を建設する仕組みであり、選択肢2が正しい。事業受託方式は、企画・建設・管理・運営等をデベロッパーに任せる点は正しいが、建設資金は土地所有者自身が負担（借入等により調達）する方式であるため「建設資金を負担することなく」とする選択肢1は誤り。定期借地権方式は、土地のみを一定期間貸し付ける方式であり、建物は借地人（テナント等）が建設・所有するのが通常であるため「土地所有者が建物の所有名義人となる」とする選択肢3は誤り。等価交換方式は土地の所有権の一部を譲渡する対価として建物の一部（区分所有権）を取得する仕組みであり、「建物の全部を取得できる」とする選択肢4は誤り。各手法における「資金負担者」「建物の所有者」の違いを整理することが有効活用分野の対策の鍵。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-051", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 51, "questionType": "four_choice", "question": "民法上の贈与に関する次の記述のうち、最も適切なものはどれか。", "choices": ["定期贈与は、贈与者または受贈者のいずれか一方が生存している限り、その効力を失うことはない。", "書面によらない贈与は、当該贈与契約の履行が終わった部分を除き、贈与者および受贈者が解除をすることができる。", "負担付贈与の受贈者が、その負担である義務を履行しない場合において、贈与者が相当の期間を定めてその履行の催告をし、その期間内に履行がなくても、原則として、贈与者が当該贈与契約の解除をすることはできない。", "死因贈与には民法の遺贈に関する規定が準用されるため、贈与者の相続開始後、死因贈与契約書について家庭裁判所による検認を請求する必要がある。"], "answer": 2, "explanation": "書面によらない贈与契約は、履行が終わっていない部分について、各当事者（贈与者・受贈者双方）がいつでも解除することができるため、選択肢2が正しい。定期贈与（定期的に一定額を給付する贈与）は、特約がない限り贈与者または受贈者の死亡によってその効力を失うため、「一方が生存している限り効力を失わない」とする選択肢1は誤り。負担付贈与において受贈者が負担義務を履行しない場合、贈与者は相当の期間を定めて履行を催告し、その期間内に履行がなければ贈与契約を解除することができるため選択肢3は誤り（解除できないとする点が誤り）。死因贈与には遺贈の方式に関する規定（成立要件としての厳格な方式）は準用されないとするのが判例の立場であり、検認は自筆証書遺言等の遺言書に必要な手続であって死因贈与契約書には不要であるため選択肢4も誤り。書面によらない贈与の解除可能性は民法の基本論点として頻出。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-052", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 52, "questionType": "four_choice", "question": "贈与税の計算に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["子が同一年中に父母のそれぞれから暦年課税に係る贈与により財産を取得した場合、贈与税額の計算上、贈与税の課税価格から控除する基礎控除額は、最高で220万円である。", "その年の1月1日において18歳以上の者が、直系尊属から暦年課税に係る贈与により財産を取得した場合、贈与税額の計算上、特例贈与財産に係る税率が適用される。", "相続時精算課税適用者が、2024年1月1日以後に特定贈与者から贈与により財産を取得した場合、贈与税額の計算上、基礎控除額が控除される。", "相続時精算課税に係る贈与税額の計算上、適用される税率は、一律20％である。"], "answer": 1, "explanation": "暦年課税の基礎控除額は、贈与者の人数にかかわらず、受贈者1人につき年110万円が上限であり、父母それぞれから贈与を受けたとしても控除額は合計110万円までであって220万円にはならないため、選択肢1が最も不適切。18歳以上の者が直系尊属から贈与を受けた場合は特例税率（特例贈与財産用の税率表）が適用される（選択肢2は正しい）。2024年以後の相続時精算課税制度には、特別控除2,500万円とは別枠で年110万円の基礎控除が新設されている（選択肢3は正しい）。相続時精算課税に係る贈与税率は特別控除・基礎控除を超えた部分に対して一律20％である（選択肢4は正しい）。暦年課税の基礎控除110万円は「受贈者ごと」に付与される点（贈与者の数に比例しない）は最頻出の基本知識。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-053", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 53, "questionType": "four_choice", "question": "民法上の相続分に関する次の記述のうち、最も不適切なものはどれか。なお、記載のない事項については考慮しないものとする。", "choices": ["養子の法定相続分は、実子の法定相続分と同じである。", "嫡出でない子の法定相続分は、嫡出である子の法定相続分の2分の1である。", "父母の一方のみを同じくする兄弟姉妹の法定相続分は、父母の双方を同じくする兄弟姉妹の法定相続分の2分の1である。", "代襲相続人が1人である場合、その代襲相続人の法定相続分は、被代襲者が受けるべきであった法定相続分と同じである。"], "answer": 2, "explanation": "かつては嫡出でない子（非嫡出子）の法定相続分は嫡出子の2分の1とされていたが、最高裁判所の違憲決定を受けた民法改正（2013年）により、現行民法では嫡出子と嫡出でない子の法定相続分は同一とされているため、選択肢2が最も不適切。養子の法定相続分は実子と同じである（選択肢1は正しい）。父母の一方のみを同じくする兄弟姉妹（半血兄弟姉妹）の法定相続分は、父母の双方を同じくする兄弟姉妹（全血兄弟姉妹）の2分の1である（選択肢3は正しい、この規定は現行法でも存続）。代襲相続人が1人の場合、その相続分は被代襲者が受けるべきであった相続分と同じである（選択肢4は正しい）。「嫡出子・非嫡出子の相続分は現在は同一」という改正内容は頻出の重要ポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-054", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 54, "questionType": "four_choice", "question": "民法に規定する相続に関する次の記述のうち、最も適切なものはどれか。", "choices": ["相続の単純承認をした相続人は、被相続人の財産のうち、積極財産のみを相続する。", "相続の放棄をする相続人は、原則として、相続の開始があったことを知った時から3カ月以内に、その旨を家庭裁判所に申述しなければならない。", "相続人が相続の放棄をした場合、その放棄をした者の子が代襲して相続人となる。", "限定承認は、相続人が複数いる場合であっても、限定承認を行おうとする者が単独ですることができる。"], "answer": 2, "explanation": "相続放棄は、原則として自己のために相続の開始があったことを知った時から3カ月以内（熟慮期間内）に、家庭裁判所に申述して行わなければならないため、選択肢2が正しい。単純承認をした相続人は、プラスの財産（積極財産）だけでなく借金等のマイナスの財産（消極財産）も包括的に承継するため「積極財産のみを相続する」とする選択肢1は誤り。相続放棄をした者は、初めから相続人でなかったものとみなされ、代襲相続の原因にはならない（代襲相続が生じるのは死亡・欠格・廃除の場合）ため選択肢3は誤り。限定承認は共同相続人がいる場合、相続人全員が共同して行わなければならず、単独ですることはできないため選択肢4も誤り。相続放棄の熟慮期間（3カ月）、限定承認の全員共同要件、放棄が代襲原因にならない点はいずれも相続の基本かつ頻出論点。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-055", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 55, "questionType": "four_choice", "question": "相続税における遺産に係る基礎控除額に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["遺産に係る基礎控除額は、「3,000万円＋600万円×法定相続人の数」の算式により計算した金額である。", "遺産に係る基礎控除額の計算上、法定相続人の数は、相続人が相続の放棄をした場合には、その放棄がなかったものとした場合における相続人の数である。", "遺産に係る基礎控除額の計算上、法定相続人の数は、被相続人の特別養子となった者は実子とみなして計算する。", "遺産に係る基礎控除額の計算上、法定相続人の数に含めることができる普通養子（特別養子縁組以外の縁組による養子）の数は、被相続人の実子の有無にかかわらず、1人までである。"], "answer": 4, "explanation": "相続税の基礎控除額の計算に含めることができる普通養子の数は、被相続人に実子がいる場合は1人まで、実子がいない場合は2人までとされており、「実子の有無にかかわらず1人まで」とする選択肢4が最も不適切。基礎控除額の計算式「3,000万円＋600万円×法定相続人の数」は正しい（選択肢1）。相続放棄があっても放棄がなかったものとして法定相続人の数に数える（選択肢2は正しい）。特別養子は実子とみなされ、養子の人数制限の対象外となる（選択肢3は正しい）。「実子あり→養子1人まで、実子なし→養子2人まで」の使い分けは相続税の基礎控除額計算における頻出の必須知識。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-056", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 56, "questionType": "four_choice", "question": "相続税の申告と納付に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["相続税の申告書は、原則として、相続人がその相続の開始があったことを知った日の翌日から10カ月以内に、当該相続人の住所地の所轄税務署長に提出しなければならない。", "死亡保険金の非課税金額の規定の適用を受けることにより相続税の課税価格の合計額が遺産に係る基礎控除額以下となる場合、相続税の申告書を提出する必要はない。", "「小規模宅地等についての相続税の課税価格の計算の特例」の適用を受けた宅地等を相続税の物納に充てる場合の収納価額は、当該特例の適用後の価額となる。", "相続人が相続税の延納を申請する場合に担保として提供する財産は、所定の要件を満たせば、相続人が相続開始前から所有していた財産や共同相続人または第三者が所有している財産であってもさしつかえない。"], "answer": 1, "explanation": "相続税の申告書の提出先は、相続人の住所地の所轄税務署長ではなく、被相続人の死亡時の住所地を管轄する所轄税務署長とされているため、選択肢1が最も不適切。相続税は、非課税規定等の適用により課税価格の合計額が基礎控除額以下となる場合には申告書の提出義務がない（選択肢2は正しい、ただし配偶者の税額軽減や小規模宅地等の特例は適用を受けるために申告が必要である点との違いに注意）。小規模宅地等の特例適用後の減額された価額が物納における収納価額となる（選択肢3は正しい）。延納の担保は相続財産に限らず、相続人固有の財産や共同相続人・第三者の財産も一定要件のもとで提供できる（選択肢4は正しい）。「相続税申告書の提出先＝被相続人の住所地の所轄税務署」という点は所得税の確定申告（納税者本人の住所地）との違いとして頻出のひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-057", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 57, "questionType": "four_choice", "question": "取引相場のない株式の相続税評価に関する次の記述のうち、最も適切なものはどれか。なお、特定の評価会社の株式には該当しないものとする。", "choices": ["会社規模が小会社である会社の株式で、中心的な同族株主が取得したものの価額は、原則として、類似業種比準方式によって評価する。", "会社規模の判定上、従業員数が70人以上の会社は、その総資産価額（帳簿価額によって計算した金額）や取引金額の多寡にかかわらず、大会社となる。", "同族株主のいる会社の株式で、同族株主以外の株主が取得したものの価額は、その会社規模にかかわらず、原則として、純資産価額方式によって評価する。", "類似業種比準方式における比準要素は、1株当たりの配当金額、1株当たりの売上高および1株当たりの純資産価額（帳簿価額によって計算した金額）である。"], "answer": 2, "explanation": "会社規模の判定にあたり、従業員数が70人以上の会社は、総資産価額や取引金額の多寡にかかわらず、無条件で大会社に区分されるため、選択肢2が正しい。小会社の株式を中心的な同族株主等が取得した場合は原則として純資産価額方式（または類似業種比準方式との併用方式のうち一定の制限を受けた方式）により評価され、単純に類似業種比準方式のみで評価するわけではないため選択肢1は誤り。同族株主のいる会社で同族株主以外の株主等が取得した株式は、原則として配当還元方式により評価され、純資産価額方式ではないため選択肢3は誤り。類似業種比準方式の比準要素は、1株当たりの配当金額、利益金額、純資産価額（帳簿価額）の3要素であり、「売上高」は比準要素に含まれないため選択肢4も誤り。会社規模判定における従業員数70人以上＝大会社という基準は頻出の重要数字。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-058", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 58, "questionType": "four_choice", "question": "宅地の相続税評価に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["路線価が定められていない地域の宅地の価額は、倍率方式によって評価する。", "不整形地である宅地の価額を倍率方式によって評価する場合、原則として、その宅地の固定資産税評価額に国税局長が一定の地域ごとに定めた倍率を乗じた価額に、その宅地の形状に応じた補正率を乗じて計算した金額によって評価する。", "宅地の価額は、2筆の宅地が一体として利用されている場合、その2筆の宅地全体を1画地として評価する。", "正面および側方の2つの路線に接する宅地（角地）の価額を路線価方式によって評価する場合、それぞれの路線の路線価に奥行価格補正率を乗じて求めた価額を比較し、いずれか高いほうの路線が正面路線となる。"], "answer": 2, "explanation": "倍率方式による評価は、固定資産税評価額に国税局長が定める一定の倍率を乗じるだけで足り、宅地の形状（不整形等）による補正は行わない（固定資産税評価額の算定段階で既に個別事情が反映されているとの考え方による）ため、「形状に応じた補正率を乗じて計算する」とする選択肢2が最も不適切。路線価が定められていない地域は倍率方式による評価となる（選択肢1は正しい）。一体として利用されている複数筆の宅地は、原則として1画地として評価する（選択肢3は正しい）。正面と側方の2路線に接する角地は、路線価に奥行価格補正率を乗じた価額の高いほうを正面路線とする（選択肢4は正しい）。倍率方式では形状補正を行わない点は路線価方式（不整形地補正等を行う）との対比で頻出のひっかけ。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-059", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 59, "questionType": "four_choice", "question": "「小規模宅地等についての相続税の課税価格の計算の特例」（以下、「本特例」という）に関する次の記述のうち、最も適切なものはどれか。なお、各選択肢において、ほかに必要な要件等はすべて満たしているものとする。", "choices": ["被相続人と配偶者が同居し、居住の用に供していた宅地を、被相続人と同居していなかった子が相続により取得した場合、その宅地について本特例の適用を受けることはできない。", "被相続人と配偶者が同居し、居住の用に供していた宅地を、配偶者が相続により取得し、その宅地を相続税の申告期限までに第三者に売却した場合、その宅地について本特例の適用を受けることはできない。", "被相続人が居住の用に供していた宅地を、相続開始の直前において被相続人と同居していなかった配偶者が相続により取得した場合、その宅地について本特例の適用を受けることはできない。", "被相続人と配偶者および相続人ではない孫が同居し、居住の用に供していた宅地を、その孫が遺贈により取得した場合、その宅地について本特例の適用を受けることはできない。"], "answer": 1, "explanation": "配偶者が存命で被相続人と同居していた場合、居住用宅地を同居していない子が取得したときは、原則として（いわゆる「家なき子特例」の要件を満たさない限り）特定居住用宅地等としての本特例の適用を受けることができないため、選択肢1が正しい。配偶者が取得した居住用宅地は、取得後にその宅地を売却したり居住しなくなったりしても、無条件（取得要件なし）で特例の適用を受けられるため選択肢2は誤り。配偶者が被相続人と同居していたか否かにかかわらず、配偶者が取得した居住用宅地は特例の適用対象となるため選択肢3は誤り。同居していた親族（相続人でない孫を含む）が遺贈により宅地を取得し居住を継続する等の要件を満たせば特例の適用を受けられる場合があるため選択肢4も誤り。配偶者は「無条件」で特例適用可、子等の親族は「同居継続・保有継続等」の要件が必要という違いが本特例の最重要ポイント。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-060", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 60, "questionType": "four_choice", "question": "非上場企業の事業承継対策等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["株式の発行会社が、経営者以外の少数株主が保有する自社株式を買い取ることにより、当該会社の株式の分散を防止または抑制することができる。", "経営者への役員退職金の原資を準備する方法として、契約者（＝保険料負担者）および死亡保険金受取人を法人、被保険者を経営者とする終身保険などの生命保険に加入することが考えられる。", "「非上場株式等についての贈与税の納税猶予及び免除の特例」の適用を受けるためには、特例承継計画を策定して、所定の期限までに都道府県知事に提出し、その確認を受ける必要がある。", "「非上場株式等についての贈与税の納税猶予及び免除の特例」の適用を受ける場合、当該非上場株式等の贈与について相続時精算課税制度を選択することはできない。"], "answer": 4, "explanation": "「非上場株式等についての贈与税の納税猶予及び免除の特例」（法人版事業承継税制の特例）の適用を受ける場合であっても、贈与者が60歳以上・受贈者が18歳以上等、相続時精算課税制度の通常の要件を満たせば、相続時精算課税制度を併せて選択することができるため、「選択することはできない」とする選択肢4が最も不適切。少数株主からの自社株買い取りによる株式分散防止（選択肢1）、役員退職金原資としての法人契約の終身保険活用（選択肢2）は事業承継対策として適切である。特例の適用には特例承継計画を策定し、所定期限までに都道府県知事に提出して確認を受ける必要がある（選択肢3は正しい）。納税猶予特例と相続時精算課税制度の併用可否は事業承継税制の応用論点として頻出であり、両制度は併用可能という点を押さえておくこと。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-001", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 1, "questionType": "four_choice", "question": "ファイナンシャル・プランナー(以下「FP」という)の顧客に対する行為に関する次の記述のうち、関連法規に照らし、最も適切なものはどれか。", "choices": ["社会保険労務士の登録を受けていないFPのAさんは、年金について相談に来た顧客の求めに応じ、公的年金の老齢給付を繰り上げた場合と繰り下げた場合の受給額について、それぞれの見込額を試算して説明した。", "税理士の登録を受けていないFPのBさんは、ふるさと納税について相談に来た顧客の求めに応じ、顧客の年間収入や家族構成をもとに寄附金控除の額を計算し、確定申告書の作成を代行した。", "金融商品取引業者の登録を受けていないFPのCさんは、株式投資について相談に来た顧客の求めに応じ、顧客の選んだ銘柄の株価チャートを示しながら投資のタイミングを有償で助言した。", "弁護士の登録を受けていないFPのDさんは、相続について相談に来た顧客の求めに応じ、顧客と代理人契約を締結し、顧客の代理人として、有償で他の相続人との遺産分割協議を行った。"], "answer": 1, "explanation": "正解1。公的年金の受給見込額の試算・説明は社労士資格がなくても可能な一般的な情報提供業務である。2は無資格者による税務書類作成・税務代理で税理士法違反。3は無登録での有償投資助言(個別銘柄のタイミング助言)は金商法の投資助言業務に該当し違反。4は非弁護士による有償の代理人としての遺産分割協議は弁護士法72条(非弁行為)違反。FP実務では「一般的な説明」と「具体的な税務代理・法律代理・有償投資助言」の境界線が頻出論点であり、資格法との抵触の有無を丁寧に見極める必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-002", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 2, "questionType": "four_choice", "question": "全国健康保険協会管掌健康保険(協会けんぽ)に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["一般保険料率は都道府県ごとに定められているのに対して、40歳以上65歳未満の被保険者の介護保険料率は全国一律に定められている。", "療養の給付を受けた被保険者が医療機関に支払った額のうち、差額ベッド代や入院時の食事代は、高額療養費の支給の対象とならない。", "退職により被保険者資格を喪失した者は、所定の要件を満たせば、最長で2年間、任意継続被保険者となることができる。", "夫婦がともに被保険者である場合において、妻が出産したときは、所定の手続きにより、夫婦に対して出産育児一時金および家族出産育児一時金が支給される。"], "answer": 4, "explanation": "正解は4が不適切。出産育児一時金は被保険者本人の出産に対して支給され、家族出産育児一時金は被扶養者(家族)の出産に対して支給されるものであり、妻が被保険者として出産した場合は妻に出産育児一時金のみが支給され、夫にも重複して家族出産育児一時金が支給されることはない。1〜3は協会けんぽの正しい制度内容(介護保険料率は全国一律、差額ベッド代等は高額療養費対象外、任意継続は最長2年)である。給付が重複支給されないという点がひっかけの核心となっている。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-003", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 3, "questionType": "four_choice", "question": "雇用保険に関する次の記述のうち、最も適切なものはどれか。", "choices": ["2つの事業所に雇用される65歳以上の労働者で、1つの事業所における1週間の所定労働時間がそれぞれ5時間以上20時間未満であり、2つの事業所における1週間の所定労働時間の合計が20時間以上である者は、所定の要件を満たせば、申出により、雇用保険の高年齢被保険者となることができる。", "雇用保険の保険料のうち、失業等給付・育児休業給付に係る保険料は、事業主が全額を負担するのに対し、雇用保険二事業に係る保険料は、事業主と労働者が折半して負担する。", "特定受給資格者等を除く一般の受給資格者に支給される基本手当の所定給付日数は、算定基礎期間が20年以上の場合、120日である。", "育児休業給付金の額は、育児休業期間中に事業主から賃金が支払われなかった場合、1支給単位期間について、休業開始時賃金日額に支給日数を乗じた額の100分の40に相当する額となる。"], "answer": 1, "explanation": "正解1。マルチジョブホルダー制度により、65歳以上の労働者が複数事業所で合算して週20時間以上等の要件を満たせば、申出により高年齢被保険者となれる。2は逆で、失業等給付・育児休業給付は労使折半、雇用保険二事業は事業主のみ負担が正しく、記述が逆転しているため誤り。3は一般受給資格者(自己都合等)で算定基礎期間20年以上の所定給付日数は150日が正しく、120日は誤り。4は育児休業給付金は原則67%(180日超は50%)であり、40%は誤り。数字の入替えが頻出のひっかけパターンである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-004", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 4, "questionType": "four_choice", "question": "老齢厚生年金の繰下げ支給に関する次の記述のうち、最も適切なものはどれか。", "choices": ["老齢厚生年金の繰下げ支給による年金の増額率は、繰り下げた月数に0.5%を乗じて得た率である。", "老齢厚生年金の受給権者が、老齢厚生年金の受給権を取得したときに遺族厚生年金の受給権者であった場合、老齢厚生年金の繰下げ支給の申出をすることができない。", "老齢厚生年金の受給権者が、老齢厚生年金の繰下げ支給の申出をする場合、老齢基礎年金の繰下げ支給の申出を同時に行わなければならない。", "加給年金額が加算される老齢厚生年金について繰下げ支給の申出をする場合、加給年金額についても繰下げ支給による増額の対象となる。"], "answer": 2, "explanation": "正解2。老齢厚生年金の受給権取得日に遺族厚生年金など他の年金の受給権がある場合は、繰下げ支給の申出をすることができない。1は増額率が0.7%/月であり0.5%は誤り(繰上げの減額率0.4%と混同しやすい)。3は老齢基礎年金と老齢厚生年金の繰下げは別々に選択可能であり同時申出は不要のため誤り。4は加給年金額・振替加算は繰下げによる増額の対象外というのが正しい知識であり、選択肢の記述は誤り。繰上げ・繰下げ制度の細かい要件の混同がひっかけの中心である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-005", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 5, "questionType": "four_choice", "question": "確定拠出年金の企業型年金を新たに導入する際の既存の退職金制度等との関係等に関する次の記述のうち、最も適切なものはどれか。", "choices": ["厚生年金適用事業所の事業主が企業型年金を実施しようとする場合、労使合意に基づいて企業型年金に係る規約を作成し、当該規約について都道府県知事の承認を受ける必要がある。", "退職給与規程に基づき退職一時金制度を実施している企業が、同制度を廃止して同制度に係る資産を企業型年金に移換する場合、単年度で一括して資産を移換することができる。", "確定給付企業年金を実施している企業が、同制度に係る資産を企業型年金に移換した場合、確定給付企業年金の加入期間は、60歳に達した日の前日が属する月以前の期間に限り、確定拠出年金の通算加入者等期間に通算される。", "中小企業退職金共済に加入している企業が、事業の拡充等により中小企業者でなくなり、所定の申出により共済契約を解除する場合、当該契約に係る資産を企業型年金に移換することはできない。"], "answer": 3, "explanation": "正解3。確定給付企業年金(DB)から企業型DCへ資産を移換する場合、DBの加入期間は60歳に達する日の前日の属する月以前の期間に限り、DCの通算加入者等期間として通算される。1は規約の承認は厚生労働大臣であり都道府県知事は誤り。2は退職一時金からの資産移換は一定期間に分割して移換する方式が用いられるのが通例であり、単年度一括という限定は不正確。4は中小企業者に該当しなくなった場合の解除に伴う資産移換は認められているため誤り。制度間のポータビリティの細目が頻出である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-006", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 6, "questionType": "four_choice", "question": "国民年金基金、小規模企業共済および中小企業退職金共済に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["60歳以上65歳未満の国民年金の任意加入被保険者は、国内に住所を有していても、国民年金基金に加入することができない。", "常時使用する従業員数が20人以下の建設業を営む個人事業主は、小規模企業共済に加入することができる。", "中小企業退職金共済の掛金は、事業主が全額負担し、掛金月額は被共済者1人当たり3万円が上限となる。", "中小企業退職金共済の退職金は、被共済者が退職した日に60歳以上であるなどの要件を満たした場合、被共済者の請求により、退職金の全部または一部を分割払いにすることができる。"], "answer": 1, "explanation": "正解は1が不適切。国民年金の任意加入被保険者(60歳以上65歳未満で国内に住所を有する者等)は、国民年金基金の加入対象者に含まれ加入することができる。よって「加入することができない」とする1が誤り。2は建設業は常時使用従業員20人以下(商業・サービス業は5人以下)で小規模企業共済に加入可、3は中退共掛金月額上限3万円で事業主全額負担、4は要件を満たせば分割払い可能であり、いずれも正しい記述である。加入対象者の範囲の正誤判定がポイントとなる。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-007", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 7, "questionType": "four_choice", "question": "企業年金等に拠出した掛金に係る法人税および所得税の取扱いに関する次の記述のうち、最も適切なものはどれか。", "choices": ["確定拠出年金の企業型年金において、法人の事業主が拠出した掛金は、2分の1相当額を限度に損金の額に算入することができる。", "確定拠出年金の個人型年金において、加入者である妻の掛金を生計を一にする夫が支払った場合、その掛金は夫の小規模企業共済等掛金控除として所得控除の対象となる。", "中小企業退職金共済において、法人の事業主が拠出した掛金は、全額を損金の額に算入することができる。", "小規模企業共済において、個人事業主が拠出した掛金は、事業所得の金額の計算上、全額が必要経費となる。"], "answer": 3, "explanation": "正解3。中小企業退職金共済の事業主拠出掛金は、その全額を損金の額に算入できる。1はDC企業型の事業主掛金は全額損金算入が可能であり、2分の1限度という制限はなく誤り。2は小規模企業共済等掛金控除は掛金を実際に支払った加入者本人にのみ適用され、生計を一にする親族が肩代わりしても本人以外の所得控除にはならないため誤り。4は小規模企業共済の掛金は必要経費ではなく所得控除(小規模企業共済等掛金控除)として扱われるため誤り。控除方式の違いがひっかけとなっている。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-008", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 8, "questionType": "four_choice", "question": "日本学生支援機構の奨学金および日本政策金融公庫の教育一般貸付(以下「国の教育ローン」という)に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["日本学生支援機構の入学時特別増額貸与奨学金は、第一種奨学金または第二種奨学金に加えて、入学した月の分の奨学金の月額に一時金として増額して貸与する有利子の奨学金である。", "日本学生支援機構の奨学金の対象となる学校は、国内に所在する大学等に限られ、海外に所在する大学等は対象とならない。", "国の教育ローンを利用するためには、世帯年収(所得)が申込人の世帯で扶養している子の人数に応じて定められた額以下でなければならない。", "国の教育ローンの資金使途には、入学金・授業料等の学校納付金や教材費だけでなく、自宅外から通学する学生の住居費用や通学費用も含まれる。"], "answer": 2, "explanation": "正解は2が不適切。日本学生支援機構の奨学金制度には海外大学等へ進学・留学する学生を対象とした奨学金制度もあり、国内の大学等に限定されるわけではない。1は入学時特別増額貸与奨学金(第二種の増額)が有利子である旨、正しい記述である。3は国の教育ローンの世帯年収要件(扶養する子の人数により基準額が異なる)は正しい。4は資金使途に住居費用・通学費用等も含まれる点は正しい。対象校の範囲についての誤認がひっかけの核心である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-009", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 9, "questionType": "four_choice", "question": "リタイアメントプランニング等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["金融機関のリバースモーゲージは、通常、利用者が自宅に住み続けながらその不動産を担保に資金を借り入れ、利用者の死亡後に、その不動産の売却等により借入金を返済する仕組みである。", "老後生活資金として一定期間、毎年一定額を受け取るために必要な元本を計算する際、毎年受け取りたい金額に乗じる係数は年金現価係数である。", "将来、本人の判断能力が不十分になった場合に備えて、あらかじめ本人が選任した者と締結する任意後見契約は、所定の様式の公正証書によってしなければならない。", "定年年齢を75歳未満に定めている事業主は、高年齢者等の雇用の安定等に関する法律に基づき、雇用する高年齢者の75歳までの雇用確保のため、所定の措置を講じるよう努めなければならない。"], "answer": 4, "explanation": "正解は4が不適切。高年齢者雇用安定法上、事業主が講じる義務・努力義務があるのは原則65歳までの雇用確保(義務)および65歳から70歳までの就業機会確保(努力義務)であり、「75歳までの雇用確保」という数字は存在しない。70歳への数字置換えがひっかけとなっている。1〜3はリバースモーゲージ、年金現価係数、任意後見契約(公正証書必須)についていずれも正しい記述であり、年齢要件の数字入替えパターンに注意が必要である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-010", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 10, "questionType": "four_choice", "question": "キャッシュレス決済の一般的な特徴等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["クレジットカードは、原則として、カード会社が設定した利用枠(利用限度額)内で、商品やサービスを受け取った後に支払請求がされる後払いの決済手段である。", "クレジットカードで商品やサービスを購入した場合の返済方法の一つである分割払いは、利用代金の支払回数を決め、その回数で代金を分割して支払う方法である。", "デビットカードで商品やサービスを購入した場合、クレジットカードと同様に、定額リボルビング払いや分割払いで代金の支払いをすることができる。", "交通系や流通系の電子マネーやプリペイドカードは、カードやスマートフォンに事前にチャージしておき、商品やサービスの購入時にチャージ額から支払う決済手段である。"], "answer": 3, "explanation": "正解は3が不適切。デビットカードは即時決済(口座から即時引落し)が特徴であり、クレジットカードのような分割払いやリボルビング払いという概念は存在しない(後払いの信用供与を伴わないため)。1・2・4はクレジットカードの後払い性、分割払いの仕組み、電子マネー・プリペイドカードの事前チャージ方式について、いずれも一般的で正しい説明である。デビットカードとクレジットカードの決済の仕組みの違い(即時払いか後払いか)を理解しているかがポイントとなる。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-011", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 11, "questionType": "four_choice", "question": "少額短期保険に関する次の記述のうち、最も適切なものはどれか。", "choices": ["死亡保障を目的とした少額短期保険の保険料は、所得税の生命保険料控除の対象となる。", "少額短期保険業者が取り扱う保険契約は、生命保険契約者保護機構または損害保険契約者保護機構による保護の対象となる。", "少額短期保険では、低発生率保険を除き、被保険者1人につき引き受けることができる保険金額の合計額は1,000万円が上限である。", "少額短期保険の保険期間は、生命保険、傷害疾病保険および損害保険のいずれも1年が上限である。"], "answer": 3, "explanation": "正解3。少額短期保険業者が引き受けることができる保険金額は、被保険者1人当たり原則1,000万円が上限(低発生率保険は特例で上限が異なる)であり、この記述は正しい。1は少短の保険料は生命保険料控除の対象外であり誤り。2は少短業者は保険契約者保護機構の保護対象外(セーフティネット非対象)であり誤り。4は保険期間の上限は生命保険・傷害疾病保険が1年、損害保険が2年であり、損害保険を1年とする点が誤り。保護機構の対象外という論点は頻出である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-012", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 12, "questionType": "four_choice", "question": "生命保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。なお、記載のない特約については考慮しないものとする。", "choices": ["低解約返戻金型終身保険は、保険料払込期間中の一定期間における解約返戻金額および死亡保険金額が他の契約条件が同一で低解約返戻金型ではない終身保険に比べて低く抑えられているため、割安な保険料が設定されている。", "変額保険(終身型)では、契約時に定めた保険金額(基本保険金額)が保証されており、運用実績にかかわらず、死亡保険金の額は基本保険金額を下回らない。", "定期保険特約付終身保険(更新型)は、定期保険特約を同額の保険金額で更新する場合、被保険者の健康状態についての告知や医師の診査が必要であり、その健康状態によっては更新することができない。", "逓減定期保険は、保険期間の経過に伴い所定の割合で保険料が逓減するが、保険金額は一定である。"], "answer": 2, "explanation": "正解2。変額保険(終身型)は、死亡保険金について基本保険金額が最低保証されており、運用実績が悪化しても基本保険金額を下回ることはない(満期保険金や解約返戻金には最低保証がない点との違いに注意)。1は低解約返戻金型終身保険は死亡保険金額は他の終身保険と同額であり、低く抑えられるのは解約返戻金のみであるため誤り。3は更新型の定期保険特約は告知・診査不要で自動更新されるのが原則であり誤り。4は逓減定期保険は保険料一定で保険金額が逓減するため記述が逆で誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-013", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 13, "questionType": "four_choice", "question": "個人年金保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。", "choices": ["確定年金では、年金受取開始日前に被保険者が死亡した場合、死亡給付金受取人が契約時に定められた年金受取総額と同額の死亡給付金を受け取ることができる。", "10年保証期間付終身年金では、被保険者の性別以外の契約条件が同一である場合、保険料は男性の方が女性よりも高くなる。", "MVA(市場価格調整)機能を有する変額個人年金保険では、市場金利に応じた運用資産の価格変動が解約返戻金額等に反映され、一般に、解約時の市場金利が契約時と比較して上昇した場合には解約返戻金額が減少する。", "外貨建て個人年金保険では、円換算支払特約を付加することで、当該保険契約の締結後から年金や解約返戻金、死亡給付金を受け取るまでの為替リスクを回避することができる。"], "answer": 3, "explanation": "正解3。MVA(市場価格調整)機能付き変額個人年金保険は、解約時に市場金利の変動を解約返戻金額に反映させる仕組みであり、一般に解約時の市場金利が契約時より上昇すると債券価格の下落と同様の効果で解約返戻金額は減少する。1は確定年金の死亡給付金は通常、既払込保険料相当額等であり年金受取総額と同額という記述は誤り。2は終身年金の保険料は平均余命の長い女性の方が高いのが通常で記述が逆であり誤り。4は円換算支払特約は年金等受取時の円転換レートを固定するだけで、それまでの為替変動リスクは回避できないため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-014", "grade": "FP2", "examDate":
