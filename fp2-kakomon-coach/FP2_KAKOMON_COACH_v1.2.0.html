"2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 14, "questionType": "four_choice", "question": "2012年1月1日以後に締結された生命保険契約の保険料に係る生命保険料控除に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["変額個人年金保険の保険料は、個人年金保険料控除の対象とはならず、一般の生命保険料控除の対象となる。", "終身保険に付加された傷害特約の保険料は、生命保険料控除の対象とならない。", "終身保険の月払保険料のうち、2024年1月に払い込まれた2023年12月分の保険料は、2024年分の一般の生命保険料控除の対象となる。", "自動振替貸付により払込みに充当された終身保険の保険料は、生命保険料控除の対象とならない。"], "answer": 4, "explanation": "正解は4が不適切。自動振替貸付によって保険料の払込みに充当された金額も、実際に保険料が払い込まれたものとして生命保険料控除の対象となる(貸付金であっても控除対象から除外されない)。1は変額個人年金は個人年金保険料控除の対象外で一般の生命保険料控除の対象という扱いが正しい。2は傷害特約等の身体の傷害のみに起因する給付部分の保険料は控除対象外で正しい。3は実際に払い込んだ年の控除対象となる取扱いも正しい。自動振替貸付の扱いの誤認がひっかけの核心である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-015", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 15, "questionType": "four_choice", "question": "生命保険の税金に関する次の記述のうち、最も不適切なものはどれか。なお、いずれも契約者(=保険料負担者)および保険金受取人は個人であるものとする。", "choices": ["契約者と被保険者が同一人である養老保険において、被保険者の相続人ではない者が受け取った死亡保険金は、相続税の課税対象となる。", "契約者と被保険者が同一人である一時払終身保険において、被保険者がリビング・ニーズ特約に基づいて受け取る特約保険金は非課税となる。", "一時払終身保険を契約から5年以内に解約した場合に受け取る解約返戻金は、一時所得として所得税の課税対象となる。", "契約者、被保険者および年金受取人が同一人である個人年金保険(保証期間付終身年金)において、保証期間中に年金受取人が死亡して遺族が取得した残りの保証期間の年金受給権は、一時所得として所得税の課税対象となる。"], "answer": 4, "explanation": "正解は4が不適切。契約者・被保険者・年金受取人が同一人である個人年金保険において、年金受取人死亡後に遺族が取得する残存保証期間の年金受給権は、被相続人から相続により取得したものとみなされ「みなし相続財産」として相続税の課税対象となり、所得税(一時所得)の対象ではない。1・2・3はそれぞれ、みなし相続財産としての死亡保険金の相続税課税、リビング・ニーズ特約給付金の非課税規定、一時払終身保険の解約返戻金が一時所得となる点であり、いずれも正しい。相続税と所得税の課税区分の混同に注意が必要である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-016", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 16, "questionType": "four_choice", "question": "法人を契約者(=保険料負担者)とする生命保険等に係る保険料の経理処理に関する次の記述のうち、最も適切なものはどれか。なお、いずれの保険契約も保険料は年払いかつ全期払いで、2024年10月に締結したものとする。", "choices": ["被保険者が特定の役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を損金の額に算入することができる。", "被保険者が役員および従業員全員、死亡保険金受取人が被保険者の遺族、満期保険金受取人が被保険者である養老保険の支払保険料は、その全額を資産に計上する。", "被保険者が特定の役員、死亡保険金受取人が被保険者の遺族である定期保険の支払保険料は、その役員に対する給与となる。", "被保険者が特定の役員、保険金受取人が法人である解約返戻金のない終身払いのがん保険(保険期間:終身、年払保険料:80万円)の支払保険料は、保険期間満了年齢を116歳として計算した保険期間の前半4割相当期間においては、その60%相当額を資産に計上し、残額を損金の額に算入することができる。"], "answer": 3, "explanation": "正解3。役員・従業員の一部のみを被保険者とし、死亡保険金受取人が被保険者の遺族である定期保険の保険料は、特定の者だけを対象とする給与として、その役員等に対する給与(損金算入だが給与課税対象)として扱われる。1は法人受取の終身保険は資産計上が原則であり全額損金算入は誤り。2はいわゆる福利厚生プラン(全員加入、遺族が死亡保険金・本人が満期保険金)の養老保険料は原則1/2損金・1/2資産計上(福利厚生費)であり全額資産計上は誤り。4はがん保険の経理処理の割合等の数値が実際の通達内容と異なり誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-017", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 17, "questionType": "four_choice", "question": "火災保険および地震保険の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["2024年中に住宅建物および家財を対象として火災保険を契約する場合、保険期間は最長で10年とされ、長期契約の保険料を一括払いしたときは、所定の割引率が適用される。", "地震保険は、火災保険に原則自動付帯となっているが、契約者が地震保険を付帯しないことの意思表示をした場合は、付帯しないことができる。", "地震保険の保険料には、「建築年割引」「耐震等級割引」「免震建築物割引」「耐震診断割引」の割引制度があるが、これらは重複して適用を受けることはできない。", "地震保険における損害の程度の区分は、「全損」「大半損」「小半損」「一部損」である。"], "answer": 1, "explanation": "正解は1が不適切。住宅火災保険等の保険期間は、2015年10月以降の改定により最長5年とされており、10年という記述は誤りである。2〜4は地震保険の自動付帯と付帯しない旨の意思表示、各種割引制度の重複適用不可、損害区分の4区分(全損・大半損・小半損・一部損)について、いずれも正しい記述である。保険期間の上限年数の変遷が頻出のひっかけポイントとなっている。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-018", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 18, "questionType": "four_choice", "question": "任意加入の自動車保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["被保険者が被保険自動車を運転中に、誤って被保険者の父の所有する自宅の車庫に衝突して損壊させた場合、対物賠償保険の補償の対象となる。", "被保険者が被保険自動車を運転中に、ハンドル操作を誤って同乗していた被保険者の配偶者がケガをした場合、対人賠償保険の補償の対象となる。", "被保険者が被保険自動車を運転中に、交通事故を起こしてケガをした場合、その損害額のうち、被保険者の過失割合に相当する部分についても、人身傷害保険の補償の対象となる。", "地震を原因とする津波により被保険自動車に損害が生じた場合、一般条件の車両保険の補償の対象となる。"], "answer": 3, "explanation": "正解3。人身傷害保険は、被保険者自身の過失割合にかかわらず、実際の損害額全額(治療費・逸失利益等)が保険金額の範囲内で支払われる点が特徴であり、過失割合相当部分も含めて補償される。1は対物賠償保険は「他人の財物」を対象とし、父・配偶者・子など親族(家族)の財物への損害は原則として対象外(免責)であるため誤り。2は対人賠償保険も「他人」が対象であり、運転者本人の父母・配偶者・子は対象外とされるのが一般的で誤り。4は地震・噴火・津波による損害は車両保険では原則免責(地震保険等の別契約が必要)であり誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-019", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 19, "questionType": "four_choice", "question": "第三分野の保険の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["がん保険では、通常90日間または3ヵ月間の免責期間が設けられており、その期間中にがんと診断確定されても、がん診断給付金は支払われない。", "先進医療特約で先進医療給付金の支払対象とされている先進医療は、療養を受けた時点において厚生労働大臣によって定められたものである。", "民間の介護保険は、公的介護保険の自己負担額の補塡を目的としており、被保険者の自己負担額を限度に保険金等が支払われる。", "特定(三大)疾病保障定期保険では、被保険者が特定疾病に罹患し、特定疾病保険金を受け取った場合、その後被保険者が死亡しても死亡保険金は支払われない。"], "answer": 3, "explanation": "正解は3が不適切。民間の介護保険は、多くの商品が所定の要介護状態等の基準を満たせば契約で定めた一時金や年金が定額で支払われる方式であり、公的介護保険の自己負担額の実費補塡(損害填補)を目的とするものではなく、自己負担額を限度とする支払いでもない。1・2・4はがん保険の免責期間、先進医療の判定時点、特定疾病保障保険で保険金受取後に契約が消滅し重複して死亡保険金が出ない点であり、いずれも正しい一般的な商品性である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-020", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 20, "questionType": "four_choice", "question": "損害保険を活用した事業活動のリスク管理に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["食品製造業を営む事業者が、製造した食品が原因で食中毒を発生させ、法律上の損害賠償責任を負うリスクに備えて、生産物賠償責任保険(PL保険)を契約した。", "建設業を営む事業者が、業務中の事故で従業員が負傷するリスクに備えて、労働者災害補償保険(政府労災保険)の上乗せとして、労働災害総合保険(法定外補償)を契約した。", "金属製品製造業を営む事業者が、工場内に設置した機械設備が火災により損害を被るリスクに備えて、機械保険を契約した。", "複合商業ビルを運営する事業者が、来店客が施設の管理不備によりケガをして、法律上の損害賠償責任を負うリスクに備えて、施設所有(管理)者賠償責任保険を契約した。"], "answer": 3, "explanation": "正解は3が不適切。機械保険は、火災・落雷・破裂・爆発など「火災以外」の偶発的事故(機械の破損・作動不良等)による損害を補償する保険であり、火災による損害は機械保険の対象外(火災保険等で対応すべき)である。よって「火災により損害を被るリスク」に機械保険を契約するという設定が誤り。1・2・4はPL保険・労働災害総合保険・施設所有者賠償責任保険のいずれも典型的な活用例として正しい。機械保険の担保範囲(火災を除く)の理解がポイントとなる。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-021", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 21, "questionType": "four_choice", "question": "内閣府が公表する景気動向指数に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["景気動向指数は、景気の現状把握および将来予測に資するために作成された指標であり、コンポジット・インデックス(CI)を中心として公表される。", "消費者物価指数は、全国の世帯が購入する家計に係る財およびサービスの価格等を総合した物価の変動を時系列的に測定した指標であり、そのうち生鮮食品を除く総合指数は、景気動向指数の遅行系列に採用されている。", "コンポジット・インデックス(CI)は、主として景気拡張の動きの各経済部門への波及度合いを測定することを目的としており、景気の拡張局面では50%を上回り、景気の後退局面では50%を下回る傾向がある。", "景気転換点の判定には、一致指数を構成する個別指標ごとに統計的手法を用いて景気の山と谷を設定し、谷から山に向かう局面にある指標の割合を算出したヒストリカル・ディフュージョン・インデックス(ヒストリカルDI)が用いられている。"], "answer": 3, "explanation": "正解は3が不適切。「主として景気拡張の動きの各経済部門への波及度合いを測定」し、50%を基準に上回る・下回るという性質を持つのはDI(ディフュージョン・インデックス)であり、CI(コンポジット・インデックス)は景気変動の大きさやテンポ(量感)を表す指標である。CIとDIの役割・目的を入れ替えたひっかけとなっている。1・2・4はCIを中心とした公表、消費者物価指数(生鮮食品除く総合指数)の遅行系列採用、ヒストリカルDIによる景気の山谷判定であり、いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-022", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 22, "questionType": "four_choice", "question": "銀行等の金融機関で取り扱う預金の一般的な商品性等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["オプション取引などのデリバティブを組み込んだ仕組預金には、金融機関の判断によって満期日が繰り上がるものがある。", "スーパー定期預金は、預入期間が3年以上の場合、単利型と半年複利型があるが、半年複利型を利用することができるのは法人に限られる。", "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、任意の日を満期日として指定することができる。", "預金口座の名義人自身が、ケガや病気による長期の入院などにより金融機関に行くことが難しくなる場合に備えて、事前に代理人の指名手続きを行うことにより、指名された代理人が口座名義人に代わって、普通預金の払戻しなどを行うことができる。"], "answer": 2, "explanation": "正解は2が不適切。スーパー定期預金の半年複利型を利用できるのは「個人」に限られており、法人は対象外である(選択肢の記述は逆転している)。1・3・4は仕組預金の早期償還条項、期日指定定期預金の満期日指定の仕組み、代理人指名手続き(いわゆる予約型代理人サービス等)による払戻しについて、いずれも正しい記述である。個人限定・法人限定の逆転がひっかけの典型パターンである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-023", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 23, "questionType": "four_choice", "question": "固定利付債券の利回り(単利・年率)の計算に関する次の記述の空欄(ア)〜(エ)にあてはまる計算式として、最も不適切なものはどれか。なお、手数料、経過利子、税金等については考慮しないものとする。表面利率が0.1%で、償還年限が10年の固定利付債券が額面100円当たり101円20銭で発行された。この債券の応募者利回り(%)の計算式は(ア)となり、直接利回り(%)の計算式は(イ)となる。また、この債券を新規発行時に購入し、5年後に額面100円当たり102円で売却した場合の所有期間利回り(%)の計算式は(ウ)となる。さらに、この債券を発行から5年後に額面100円当たり102円で購入し、償還まで保有した場合の最終利回り(%)の計算式は(エ)となる。", "choices": ["(ア)={0.1+(100.00-101.20)/10}/101.20×100", "(イ)=0.1/101.20×100", "(ウ)={0.1+(102.00-101.20)/5}/101.20×100", "(エ)={0.1+(102.00-100.00)/5}/100.00×100"], "answer": 4, "explanation": "正解は4(エ)が不適切。最終利回りは「(額面100円-購入価格)/残存年数」を分子、購入価格を分母として計算すべきところ、選択肢4の式は分子の差額計算に購入価格102円ではなく額面100円を用い、かつ分母も購入価格102.00ではなく額面100.00を用いており誤り。正しい最終利回りの式は{0.1+(100-102)/5}/102×100となる。1(ア)応募者利回り、2(イ)直接利回り、3(ウ)所有期間利回りの式はいずれも正しい公式(発行価格・売却価格・額面・残存期間の当てはめ)に則っている。利回り計算では分母(発行価格・購入価格)と差益計算の分子(該当する価格差)を取り違えないことが重要である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-024", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 24, "questionType": "four_choice", "question": "債券のイールドカーブ(利回り曲線)の一般的な特徴等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["イールドカーブは、縦軸を債券の利回り、横軸を債券の残存期間として、利回りと投資期間の関係を表した曲線である。", "残存期間の短い債券の利回りよりも残存期間の長い債券の利回りの方が低く、イールドカーブが右下がりの曲線となる状態を、逆イールドという。", "残存期間の短い債券の利回りよりも残存期間の長い債券の利回りの方が高い状態のとき、両者の金利差が縮小することを、イールドカーブのフラット化という。", "イールドカーブが逆イールドの状態にあるとき、時間の経過に伴って債券価格が上昇し、キャピタルゲインが期待される効果を、ロールダウン効果という。"], "answer": 4, "explanation": "正解は4が不適切。ロールダウン効果とは、順イールド(右上がり)のカーブの下で、時間の経過とともに残存期間が短くなるにつれて利回りが低下し(価格は上昇し)、キャピタルゲインが期待できる効果を指す。逆イールド(右下がり)の状態では、時間の経過に伴い残存期間短縮によりむしろ利回りが上昇し価格が下落する方向に働くため、この記述は誤り。1〜3はイールドカーブの定義、逆イールドの定義、フラット化の定義について、いずれも正しい。順イールドと逆イールドでの効果の違いに注意する必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-025", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 25, "questionType": "four_choice", "question": "株式の信用取引に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["信用取引で売建てした場合の決済方法には、反対売買により決済する方法と、売付株と同種同量の株式を証券会社に引き渡して決済する方法がある。", "制度信用取引の対象となる銘柄は、証券取引所が規則等に基づき選定したものに限られる。", "一般信用取引では、投資家が証券会社から貸付けを受けた金銭や株式を6ヵ月以内に返済しなければならない。", "金融商品取引法等によれば、原則として、株式の信用取引を行う際の委託保証金の額は30万円以上で、かつ、株式の約定金額に100分の30を乗じた金額以上でなければならないとされている。"], "answer": 3, "explanation": "正解は3が不適切。一般信用取引は、返済期限を当事者間(投資家と証券会社)の合意により無期限とすることも可能であり、制度信用取引のように返済期限が法令上6ヵ月と定められているわけではない(6ヵ月というのは制度信用取引の期限である)。1・2・4は信用取引の決済方法、制度信用取引の対象銘柄が取引所選定に限られる点、委託保証金の最低額(30万円以上かつ約定代金の30%以上)について、いずれも正しい記述である。制度信用取引と一般信用取引の返済期限の違いが頻出論点となっている。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-026", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 26, "questionType": "four_choice", "question": "下記<資料>に基づき算出されるX社およびY社の株式の投資指標に関する次の記述のうち、最も適切なものはどれか。<資料>X社:株価2,500円、当期純利益210億円、純資産(自己資本)6,000億円、配当金総額120億円、発行済株式数4億株。Y社:株価1,300円、当期純利益190億円、純資産(自己資本)2,800億円、配当金総額70億円、発行済株式数3億株。", "choices": ["ROEは、Y社よりもX社の方が高い。", "PERは、X社よりもY社の方が高い。", "PBRは、Y社よりもX社の方が高い。", "配当性向は、X社よりもY社の方が高い。"], "answer": 3, "explanation": "正解3。ROE:X社210/6000=3.5%、Y社190/2800≒6.79%となりY社の方が高いため1は誤り。EPS:X社210億/4億株=52.5円、Y社190億/3億株≒63.3円。PER:X社2500/52.5≒47.6倍、Y社1300/63.3≒20.5倍となりX社の方が高いため2は誤り。時価総額:X社2500×4億=1兆円、Y社1300×3億=3900億円。PBR:X社1兆/6000億≒1.67倍、Y社3900億/2800億≒1.39倍となりX社の方が高く、3が正しい。配当性向:X社120/210≒57.1%、Y社70/190≒36.8%となりX社の方が高いため4は誤り。各指標の分子分母の取り違えに注意して計算する必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-027", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 27, "questionType": "four_choice", "question": "オプション取引の一般的な特徴に関する次の記述のうち、最も適切なものはどれか。", "choices": ["コール・オプションは「原資産を権利行使価格で売る権利」であり、プット・オプションは「原資産を権利行使価格で買う権利」である。", "権利行使期間中であればいつでも権利行使が可能なものをヨーロピアン・オプションといい、満期日(権利行使日)においてのみ権利行使が可能なものをアメリカン・オプションという。", "コール・オプションの買い手の最大利益とプット・オプションの買い手の最大利益は、いずれもプレミアム(オプション料)の額となる。", "コール・オプションおよびプット・オプションは、他の条件が同一であれば、いずれもボラティリティが上昇するほど、プレミアム(オプション料)は高くなる。"], "answer": 4, "explanation": "正解4。オプション取引において、原資産価格のボラティリティ(変動率)が高いほど、権利行使によって利益を得られる可能性が高まるため、コール・プットいずれのオプションもプレミアム(オプション料)は上昇する。1はコール・オプションは「買う権利」、プット・オプションは「売る権利」であり記述が逆で誤り。2はアメリカンタイプが権利行使期間中いつでも行使可能、ヨーロピアンタイプが満期日のみ行使可能であり名称が逆で誤り。3はオプションの買い手の最大損失がプレミアムに限定される一方、最大利益はコールの場合理論上無限大、プットの場合も大きな利益が見込め、プレミアムに限定されるのは売り手の最大利益であるため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-028", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 28, "questionType": "four_choice", "question": "ポートフォリオ理論に関する次の記述のうち、最も適切なものはどれか。", "choices": ["ポートフォリオのリスクとは、一般に、組成されたポートフォリオの損失額の大きさを示すのではなく、そのポートフォリオの期待収益率からのばらつきの度合いをいう。", "ポートフォリオのリスクのうち、分散投資によって消去可能なリスクをシステマティック・リスクという。", "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値よりも大きくなる。", "ポートフォリオの期待収益率は、組み入れた各資産の期待収益率を組入比率で加重平均した値よりも大きくなる。"], "answer": 1, "explanation": "正解1。ポートフォリオのリスクとは一般に、実現収益率が期待収益率からどの程度ばらつくか(標準偏差・分散)で測られる概念であり、単純な損失額の大小を意味するものではない。2は分散投資により消去できるリスクは「アンシステマティック・リスク(非市場リスク・個別銘柄リスク)」であり、システマティック・リスク(市場リスク)は分散投資では消去できないため名称が逆で誤り。3は相関係数が1未満の資産を組み合わせる場合、分散効果によりポートフォリオ全体のリスクは各資産リスクの加重平均値以下になるため誤り。4はポートフォリオの期待収益率は各資産の期待収益率の加重平均そのものであり、それを上回ることはないため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-029", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 29, "questionType": "four_choice", "question": "上場株式等の譲渡および配当等(一定の大口株主等が受けるものを除く)に係る税金等に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、特定口座のうち、源泉徴収がされない口座を簡易申告口座といい、源泉徴収がされる口座を源泉徴収選択口座という。", "choices": ["上場株式等に係る配当所得等について、総合課税を選択して確定申告をした場合、上場株式等に係る譲渡損失の金額と損益通算することができる。", "上場株式等に係る配当所得等の金額と損益通算してもなお控除しきれない上場株式等に係る譲渡損失の金額は、確定申告をすることにより、翌年以後5年間にわたって繰り越すことができる。", "簡易申告口座には、上場株式等の配当等を受け入れることはできない。", "源泉徴収選択口座は、開設が投資家1人当たり1口座までとされており、複数の金融機関にそれぞれ源泉徴収選択口座を開設することはできない。"], "answer": 3, "explanation": "正解3。簡易申告口座(源泉徴収なしの特定口座)は、譲渡損益のみを管理する口座であり、配当等を受け入れることはできない(配当等を口座内で受け入れられるのは源泉徴収選択口座のみ)。1は上場株式等に係る配当所得等と譲渡損失との損益通算は、配当所得について申告分離課税を選択した場合に限られ、総合課税を選択した場合は損益通算できないため誤り。2は繰越控除の年数は3年間が正しく5年間ではないため誤り。4は源泉徴収選択口座は口座単位(金融機関ごと)で開設・選択が可能であり、複数の金融機関でそれぞれ開設できるため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-030", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 30, "questionType": "four_choice", "question": "わが国における個人による金融商品取引に係るセーフティネットに関する次の記述のうち、最も適切なものはどれか。", "choices": ["確定拠出年金の加入者が運用の方法として選択した定期預金は、預金保険制度による保護の対象とならない。", "日本国内に本店のある銀行の海外支店や外国銀行の在日支店に預け入れた預金は、その預金の種類にかかわらず、預金保険制度による保護の対象とならない。", "日本国内で事業を行う生命保険会社が破綻した場合、生命保険契約者保護機構による補償の対象となる保険契約については、高予定利率契約を除き、原則として、破綻時点の責任準備金等の80%まで補償される。", "日本国内に本店のある銀行で購入した投資信託は、日本投資者保護基金による保護の対象となる。"], "answer": 2, "explanation": "正解2。日本国内に本店のある銀行の海外支店に預け入れた預金、および外国銀行の在日支店に預け入れた預金は、預金の種類にかかわらず預金保険制度による保護の対象とならない。1はiDeCoで運用指図した定期預金も預金保険制度の保護対象となるため誤り。3は生命保険契約者保護機構の補償割合は高予定利率契約を除き原則として責任準備金等の90%までであり80%は誤り。4は投資信託は分別管理が徹底されており証券会社破綻時には日本投資者保護基金の対象となり得るが、銀行で購入した投資信託は銀行が同基金の会員ではないため保護対象とならず誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-031", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 31, "questionType": "four_choice", "question": "所得税の基本的な仕組みに関する次の記述のうち、最も適切なものはどれか。", "choices": ["所得税では、納税者が申告した所得金額に基づき、納付すべき税額を税務署長が決定する賦課課税方式が採用されている。", "所得税では、課税対象となる所得を8種類に区分し、それぞれの所得の種類ごとに定められた計算方法により所得の金額を計算する。", "所得税の各種所得の金額の計算上、収入金額には、原則として、その年において収入すべきことが確定した金額から、未収入の金額を控除した額を計上する。", "非永住者以外の居住者の課税所得には、日本国内で生じた所得だけでなく、日本国外で生じた所得も含まれる。"], "answer": 4, "explanation": "正解4。非永住者以外の居住者(いわゆる永住者)は、国内で生じた所得だけでなく国外で生じた所得も含めて全世界所得が課税対象となる。1は所得税は納税者自身が所得金額と税額を計算して申告する申告納税方式が採用されており、賦課課税方式ではないため誤り。2は所得区分は10種類(利子・配当・不動産・事業・給与・退職・山林・譲渡・一時・雑)であり8種類ではないため誤り。3は権利確定主義により、未収であっても収入すべきことが確定した金額はその年の収入金額に算入するのが原則であり、未収入金額を控除するという記述は誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-032", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 32, "questionType": "four_choice", "question": "所得税の各種所得に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["暗号資産取引により生じた損益は、その暗号資産取引自体が事業と認められる場合等を除き、雑所得となる。", "不動産の貸付けを事業的規模で行ったことにより生じた賃貸収入に係る所得は、事業所得となる。", "賃貸している建物とその土地を売却したことによる所得は、譲渡所得となる。", "ふるさと納税に係る寄附金を支出し、その謝礼として受け取った返礼品に係る経済的利益は、一時所得となる。"], "answer": 2, "explanation": "正解は2が不適切。不動産の貸付けによる所得は、事業的規模で行われている場合であっても、所得区分としては「不動産所得」であり、事業所得とはならない(事業的規模かどうかは、青色申告特別控除額や必要経費の範囲などに影響するに過ぎない)。1・3・4は暗号資産取引の雑所得該当、賃貸不動産(建物・土地)売却による譲渡所得該当、ふるさと納税返礼品の経済的利益が一時所得となる点であり、いずれも正しい記述である。不動産所得と事業所得の混同がひっかけの典型となっている。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-033", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 33, "questionType": "four_choice", "question": "所得税の各種所得の金額の計算上生じた次の損失の金額のうち、他の所得の金額と損益通算できるものはどれか。", "choices": ["不動産所得の金額の計算上生じた損失の金額のうち、不動産所得を生ずべき業務の用に供する土地の取得に要した負債の利子に相当する部分の金額", "業務用車両を売却したことによる譲渡所得の金額の計算上生じた損失の金額", "終身保険の解約返戻金を受け取ったことによる一時所得の金額の計算上生じた損失の金額", "ゴルフ会員権を売却したことによる譲渡所得の金額の計算上生じた損失の金額"], "answer": 2, "explanation": "正解2。生活に通常必要でない資産(ゴルフ会員権、貴金属・別荘等)や不動産所得の土地取得に係る負債利子相当部分の損失は損益通算の対象外とされているが、事業用の業務用車両など、事業の用に供していた資産の譲渡による譲渡所得の損失は、生活に通常必要でない資産に該当しない限り、原則として他の所得と損益通算できる。1は不動産所得の損失のうち土地等取得の負債利子部分は損益通算不可、3は一時所得の損失はそもそも他の所得と損益通算できない、4はゴルフ会員権の譲渡損失は税制改正により損益通算の対象外とされており、いずれも通算不可である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-034", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 34, "questionType": "four_choice", "question": "所得税における配偶者控除に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["納税者の合計所得金額が1,000万円を超える場合、配偶者の合計所得金額の多寡にかかわらず、配偶者控除の適用を受けることはできない。", "老人控除対象配偶者とは、控除対象配偶者のうち、原則として、その年の12月31日現在の年齢が70歳以上の者をいう。", "納税者との婚姻の届出をしていない、いわゆる内縁関係にあると認められる者は、納税者が加入している健康保険の被扶養者となっている場合であっても、控除対象配偶者には該当しない。", "青色申告者の配偶者で青色事業専従者として給与の支払いを受ける者は、合計所得金額が48万円以下であれば、控除対象配偶者に該当する。"], "answer": 4, "explanation": "正解は4が不適切。青色事業専従者として給与の支払いを受ける者は、その給与の額にかかわらず、控除対象配偶者(および扶養親族)には該当しないこととされている(専従者給与を受ける者は別途給与所得者として扱われ、配偶者控除等の対象から除外される)。1・2・3は納税者の合計所得金額1,000万円超で配偶者控除不可、老人控除対象配偶者の年齢要件(70歳以上)、内縁関係者(民法上の婚姻届出がない者)は控除対象配偶者に該当しない点であり、いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-035", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 35, "questionType": "four_choice", "question": "所得税における住宅借入金等特別控除(以下「住宅ローン控除」という)に関する次の記述のうち、最も適切なものはどれか。なお、2024年10月中に住宅ローンを利用して住宅を取得し、同月中にその住宅を居住の用に供したものとする。", "choices": ["取得した住宅が認定住宅等以外の一般の中古住宅である場合、住宅ローン控除の控除額は住宅ローンの年末残高3,000万円までにつき控除率0.7%で計算され、控除期間は最長で13年となる。", "取得した住宅が店舗併用住宅である場合、その床面積の2分の1以上に相当する部分がもっぱら居住の用に供されなければ、住宅ローン控除の適用を受けることができない。", "住宅ローン控除は、納税者が給与所得者である場合、所定の書類を勤務先に提出することにより、住宅を取得し、居住の用に供した年分から年末調整により適用を受けることができる。", "住宅ローン控除の適用を受けていた者が、転勤等のやむを得ない事由により転居したため、取得した住宅を居住の用に供しなくなった場合、翌年以降に再び当該住宅をその者の居住の用に供したとしても、再入居した年以降、住宅ローン控除の適用を受けることはできない。"], "answer": 2, "explanation": "正解2。住宅ローン控除の適用対象となるためには、取得した家屋の床面積の2分の1以上に相当する部分が専ら自己の居住の用に供されるものでなければならない(店舗併用住宅等の場合)。1は中古住宅(一般・その他既存住宅)の控除期間は最長10年であり13年は誤り(13年となるのは認定住宅等の新築等の場合)。3は住宅ローン控除の適用を受ける最初の年分は、給与所得者であっても確定申告が必要であり、2年目以降から年末調整による適用が可能であるため誤り。4は転勤等のやむを得ない事由により転居した後、再びその住宅に居住した場合は、要件を満たせば再入居した年以降について再度適用を受けられるため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-036", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 36, "questionType": "four_choice", "question": "所得税の申告に関する次の記述のうち、最も適切なものはどれか。なお、記載のない事項については考慮しないものとする。", "choices": ["不動産所得、事業所得または雑所得を生ずべき業務を行う者は、納税地の所轄税務署長の承認を受けることにより青色申告書を提出することができる。", "年の中途で死亡した者のその年分の所得税について確定申告を要する場合、その相続人は、原則として、相続の開始があったことを知った日の翌日から4ヵ月以内に、当該所得税について確定申告書を提出しなければならない。", "その年中の給与収入の金額が1,000万円を超える給与所得者は、年末調整の対象とならず、確定申告をしなければならない。", "その年中の公的年金等の収入金額の合計が420万円であり、その全部について所得税が源泉徴収されている場合で、それ以外の所得が原稿料に係る雑所得の金額30万円のみである者は、確定申告を行う必要はない。"], "answer": 2, "explanation": "正解2が適切。年の中途で死亡した者について確定申告を要する場合、その相続人は相続の開始があったことを知った日の翌日から4ヵ月以内に準確定申告書を提出しなければならない。1は不動産・事業・山林所得を生ずべき業務を行う者が青色申告の承認を受けられる旨は概ね正しいが、雑所得は原則として青色申告の対象外であるため「雑所得」を含む記述は誤り。3は年末調整の対象とならない基準は給与収入2,000万円超であり1,000万円超は誤り。4は公的年金等の収入420万円は400万円以下の申告不要制度の基準を超えており、かつ他の所得(雑所得)も20万円を超えるため確定申告が必要であり誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-037", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 37, "questionType": "four_choice", "question": "法人税の損金に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["法人が納付した法人税の本税の額は、損金の額に算入することができない。", "法人が従業員の業務遂行中の交通違反に係る反則金を負担した場合、その負担金は、損金の額に算入することができる。", "法人が納付した法人事業税の本税の額は、損金の額に算入することができる。", "法人が減価償却費として損金経理した金額のうち、償却限度額に達するまでの金額は、その全額を損金の額に算入することができる。"], "answer": 2, "explanation": "正解は2が不適切。法人が負担した従業員の交通違反等に係る反則金(罰金・科料・過料に相当するもの)は、法人税法上、損金の額に算入することができない(制裁的な性質を持つ費用は損金不算入とされる)。1は法人税・住民税の本税は損金不算入、3は事業税(本税)は損金算入可能な租税公課、4は減価償却費は償却限度額まで損金経理により全額損金算入可能であり、いずれも正しい記述である。反則金・罰金等の損金不算入という原則の理解がポイントとなる。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-038", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 38, "questionType": "four_choice", "question": "次のうち、消費税の適格請求書等保存方式(インボイス制度)における適格請求書に必要とされる記載事項でないものはどれか。", "choices": ["適格請求書発行事業者の氏名または名称および登録番号", "適格請求書発行事業者の本店または主たる事務所の所在地", "課税資産の譲渡等に係る資産または役務の内容", "税率ごとに区分した消費税額等"], "answer": 2, "explanation": "正解2。適格請求書(インボイス)の必要記載事項は、発行事業者の氏名・名称および登録番号、取引年月日、取引内容(軽減税率対象品目である旨)、税率ごとに区分して合計した対価の額および適用税率、税率ごとに区分した消費税額等、書類の交付を受ける事業者の氏名・名称などであり、発行事業者の「本店または主たる事務所の所在地」は記載事項に含まれていない(所在地情報は登録番号から確認できる仕組みのため不要)。1・3・4はいずれも法定の記載事項として正しい。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-039", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 39, "questionType": "four_choice", "question": "会社と役員間の取引に係る所得税・法人税に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["役員が会社に無利息で金銭の貸付けを行った場合、原則として、通常収受すべき利息に相当する金額が、その役員の雑所得の収入金額に算入される。", "会社が役員からの借入金について債務免除を受けた場合、その債務免除を受けた金額が、その会社の所得の金額の計算上、益金の額に算入される。", "役員が会社所有の社宅に無償で居住している場合、原則として、通常の賃貸料相当額が、その役員の給与所得の収入金額に算入される。", "会社が所有する資産を適正な時価よりも高い価額で役員に譲渡した場合、会社は時価で譲渡したものとされ、譲渡価額と時価との差額が、受贈益として益金の額に算入される。"], "answer": 1, "explanation": "正解は1が不適切。役員が会社に金銭を無利息で貸し付けた場合、貸し手である役員側には利息を受け取っていない以上、経済的利益(みなし収入)は生じず、原則として課税関係は生じない。2は債務免除益の益金算入、3は社宅無償貸与に伴う経済的利益の給与課税、4は高額譲渡による受贈益の益金算入であり、いずれも正しい取扱いである。無利息貸付による経済的利益の認定課税は、会社が役員に無利息で貸し付けた場合に役員側で問題となるものであり、本問のように役員が会社に貸し付ける場合には課税関係が生じない点に注意する必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-040", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 40, "questionType": "four_choice", "question": "決算書の一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["貸借対照表において、純資産の部の合計額がマイナスになることはない。", "貸借対照表において、資産の部の合計額は、負債の部および純資産の部の合計額と一致する。", "損益計算書において、営業利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "損益計算書において、経常利益の額は、営業利益の額に営業外損益の額を加減した額である。"], "answer": 1, "explanation": "正解は1が不適切。貸借対照表の純資産の部の合計額は、いわゆる債務超過(資産の部の合計額より負債の部の合計額の方が大きい状態)の会社では、マイナス(資本の欠損)になり得る。2は貸借対照表の借方・貸方の一致(資産=負債+純資産)という複式簿記の大原則であり正しい。3・4は損益計算書における営業利益・経常利益の算定式として正しい。「マイナスになることはない」という断定表現が誤りを示す典型的なひっかけである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-041", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 41, "questionType": "four_choice", "question": "不動産の登記や調査に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["抵当権の登記の登記事項は、不動産の登記記録の権利部乙区に記録される。", "不動産の登記事項証明書は、対象不動産の所有者以外の者であっても、所定の手数料を納付して交付を請求することができる。", "新築した建物の所有権を取得した者は、その所有権の取得の日から1ヵ月以内に、所有権保存登記を申請しなければならない。", "区分建物を除く建物に係る登記記録において、床面積は、各階ごとに壁その他の区画の中心線で囲まれた部分の水平投影面積(壁芯面積)により記録される。"], "answer": 3, "explanation": "正解は3が不適切。新築した建物の「表題登記」は、所有権を取得した日から1ヵ月以内に申請しなければならない義務があるが、「所有権保存登記」自体には申請義務や期限の定めはない(任意の登記)。表題登記と保存登記の申請義務の有無を混同させるひっかけとなっている。1は抵当権など担保権に関する登記事項は権利部乙区に記録される。2は登記事項証明書は利害関係の有無を問わず誰でも交付請求できる。4は区分建物以外の建物の床面積は壁芯面積で記録される。いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-042", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 42, "questionType": "four_choice", "question": "宅地建物取引業法に関する次の記述のうち、最も不適切なものはどれか。なお、買主は宅地建物取引業者ではないものとする。", "choices": ["宅地建物取引業者は、自ら売主となる宅地の売買契約の締結に際して、代金の額の10分の2を超える額の手付を受領することができない。", "宅地建物取引業者が、自ら売主となる宅地の売買契約の締結に際して手付を受領したときは、その手付がいかなる性質のものであっても、買主が契約の履行に着手する前であれば、当該宅地建物取引業者はその倍額を現実に提供して、契約の解除をすることができる。", "アパートやマンションの所有者が、当該建物の賃貸を自ら業として行うためには、あらかじめ宅地建物取引業の免許を取得しなければならない。", "専任媒介契約の有効期間は3ヵ月を超えることができず、これより長い期間を定めたときは、その期間は3ヵ月とされる。"], "answer": 3, "explanation": "正解は3が不適切。自らが所有する不動産を自ら賃貸人として賃貸する行為は、宅地建物取引業法上の「取引」(売買・交換の代理・媒介、貸借の代理・媒介等)に該当せず、宅地建物取引業の免許は不要である(自ら貸主となる行為は宅建業に含まれない)。1は手付金の額の制限(代金の2/10超禁止)、2は手付解除に関する規定、4は専任媒介契約の有効期間の上限(3ヵ月)であり、いずれも正しい記述である。「自ら貸主」は宅建業の規制対象外という点が頻出論点である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-043", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 43, "questionType": "four_choice", "question": "不動産の売買契約に係る民法の規定に関する次の記述のうち、最も不適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["未成年者が法定代理人の同意を得ずに、不動産の売買契約を締結した場合であっても、原則として、法定代理人は当該売買契約を取り消すことができない。", "不動産が共有されている場合に、各共有者が、自己が有している持分を共有者以外の者に売却するときは、他の共有者の同意を得る必要はない。", "売買契約締結後、買主の責めに帰することができない事由により、当該契約の目的物の引渡債務の全部が履行不能となった場合、買主は履行の催告をすることなく、直ちに契約の解除をすることができる。", "同一の不動産について二重に売買契約が締結された場合、譲受人相互間においては、売買契約の締結の先後にかかわらず、原則として、所有権移転登記を先にした者が、当該不動産の所有権の取得を他方に対抗することができる。"], "answer": 1, "explanation": "正解は1が不適切。未成年者が法定代理人の同意を得ずに行った法律行為(不動産売買契約等)は、原則として、本人または法定代理人が取り消すことができる(民法5条2項)。「取り消すことができない」とする記述は誤りである。2は共有持分の処分(自己持分の売却)は各共有者が単独で自由に行うことができ他の共有者の同意は不要で正しい。3は債務者の帰責事由なく履行不能となった場合、債権者(買主)は催告不要で直ちに解除できる(民法542条)ため正しい。4は不動産の物権変動の対抗要件は登記であり、二重譲渡の優劣は登記の先後で決まるため正しい。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-044", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 44, "questionType": "four_choice", "question": "借地借家法に関する次の記述のうち、最も不適切なものはどれか。なお、本問においては、同法第22条の借地権を一般定期借地権といい、第22条から第24条の定期借地権等以外の借地権を普通借地権という。また、記載のない特約については考慮しないものとする。", "choices": ["普通借地権の存続期間は30年とされているが、契約でこれより長い期間を定めたときは、その期間とされる。", "普通借地権の存続期間が満了した時点で借地上に建物が存在しない場合は、借地権者が契約の更新を請求しても、従前の契約と同一の条件で契約が更新されたものとはみなされない。", "借地権者は、借地権の登記がない限り、その土地の上に借地権者の名義で登記されている建物を所有していても、当該借地権を第三者に対抗することはできない。", "一般定期借地権において、契約の更新および建物の築造による存続期間の延長がなく、期間満了による建物等の買取りの請求をしないこととする旨を定める特約は、公正証書による等書面(電磁的記録による場合を含む)によってしなければならない。"], "answer": 3, "explanation": "正解は3が不適切。借地借家法上、借地権者は借地権自体の登記がなくても、その土地の上に借地権者名義で登記されている建物を所有していれば、それをもって借地権を第三者に対抗することができる(建物登記による対抗力、借地借家法10条)。選択肢は「対抗することはできない」としており誤り。1は普通借地権の存続期間(30年、合意でより長期も可)、2は建物滅失時の更新請求に関する規定、4は一般定期借地権の特約が書面(公正証書等)によるべき旨であり、いずれも正しい記述である。建物登記による借地権の対抗力は頻出の重要論点である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-045", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 45, "questionType": "four_choice", "question": "借地借家法に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、同法第38条における定期建物賃貸借契約を定期借家契約といい、それ以外の建物賃貸借契約を普通借家契約という。また、特約については考慮しないものとする。", "choices": ["定期借家契約は、公正証書によってしなければならない。", "定期借家契約は、契約当事者間の合意があっても、存続期間を1年未満とすることはできない。", "普通借家契約において、賃貸人は、賃貸人および賃借人が建物の使用を必要とする事情や建物の利用状況などを考慮して、正当の事由があると認められる場合でなければ、賃借人に対し、建物の賃貸借の解約の申入れをすることはできない。", "普通借家契約において、賃貸人が賃借人に対して期間満了の1年前から6ヵ月前までの間に更新をしない旨の通知をしなかったときは、従前の契約と同じ期間で契約を更新したものとみなされる。"], "answer": 3, "explanation": "正解3が適切。普通借家契約において、賃貸人からの解約申入れ・更新拒絶には、建物の使用の必要性や利用状況等を考慮した「正当の事由」が必要とされる(借地借家法28条、借主保護の趣旨)。1は定期借家契約は公正証書に限らず書面(電磁的記録を含む)により契約すればよく、公正証書に限定されないため誤り。2は定期借家契約は普通借家契約と異なり1年未満の期間を定めることも可能であるため誤り。4は法定通知期間内に通知をしなかった場合、更新されたものとみなされるのは「期間の定めのない」契約としてであり、従前と同じ期間ではないため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-046", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 46, "questionType": "four_choice", "question": "都市計画区域および準都市計画区域内における建築基準法の規定に関する次の記述のうち、最も適切なものはどれか。", "choices": ["建築基準法第42条第2項により道路境界線とみなされる線と道路との間の敷地部分(セットバック部分)は、建築物を建築することができないが、建築物の容積率の算定の基礎となる敷地面積に含めることができる。", "防火地域内にある耐火建築物は、いずれの用途地域内にある場合であっても、建蔽率の制限に関する規定の適用を受けない。", "共同住宅の共用の廊下または階段の用に供する部分の床面積は、原則として、建築物の容積率の算定の基礎となる延べ面積に算入されない。", "敷地の前面道路の幅員が12m未満である建築物の容積率は、原則として、「都市計画で定められた容積率」と「前面道路の幅員に一定の数値を乗じて得たもの」とのいずれか高い方が上限となる。"], "answer": 3, "explanation": "正解3が適切。共同住宅の共用廊下・共用階段の用に供する部分の床面積は、建築基準法上、容積率算定の基礎となる延べ面積には算入されない(住宅の居住環境向上の趣旨による特例)。1はセットバック部分(道路境界線とみなされる線と道路の間の敷地)は、建築物の建築ができないだけでなく、容積率・建蔽率算定の基礎となる敷地面積にも算入されないため誤り。2は防火地域内の耐火建築物は建蔽率が10%緩和される(または建蔽率80%地域では制限自体が撤廃)のみで、一律に適用除外となるわけではないため誤り。4は前面道路幅員12m未満の場合、容積率の上限は都市計画で定めた容積率と前面道路幅員×法定乗数の「いずれか低い方」であり「高い方」ではなく誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-047", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 47, "questionType": "four_choice", "question": "建物の区分所有等に関する法律に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["一棟の建物のうち、構造上の独立性と利用上の独立性を備えた建物の部分は、区分所有権の目的となる専有部分となるが、規約により共用部分とすることができる。", "建物ならびにその敷地および附属施設の管理を行うための区分所有者の団体(管理組合)は、原則として、区分所有者全員で構成されるが、規約によりその構成員とならない区分所有者を定めることができる。", "区分所有者は、敷地利用権が数人で有する所有権である場合、規約に別段の定めがない限り、敷地利用権を専有部分と分離して処分することはできない。", "共用部分に対する区分所有者の共有持分は、規約に別段の定めがない限り、各共有者が有する専有部分の床面積の割合による。"], "answer": 2, "explanation": "正解は2が不適切。建物の区分所有等に関する法律上、管理組合は区分所有者全員をもって当然に構成される団体であり、区分所有者である以上、その意思にかかわらず当然に管理組合の構成員となる。規約によって特定の区分所有者を構成員から除外することはできない。1は専有部分となりうる部分を規約により共用部分(規約共用部分)とすることができる旨、3は敷地利用権と専有部分の分離処分禁止の原則、4は共用部分の共有持分の割合(専有部分の床面積割合による)であり、いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-048", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 48, "questionType": "four_choice", "question": "不動産の取得に係る税金に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["不動産取得税は、所有権移転登記の有無にかかわらず、契約内容その他から総合的に判断して現実に所有権を取得したと認められる場合に、当該不動産の取得者に対して課される。", "一定の要件を満たす戸建て住宅(認定長期優良住宅を除く)を新築した場合、不動産取得税の課税標準の算定に当たっては、1戸につき最高1,200万円を価格から控除することができる。", "登録免許税は、贈与により取得した不動産の所有権移転登記に対しても課される。", "登録免許税は、新築した建物の表題登記に対しても課される。"], "answer": 4, "explanation": "正解は4が不適切。登録免許税は、所有権保存登記・移転登記・抵当権設定登記など「権利に関する登記」に対して課される税であり、「表題登記」(表示に関する登記、不動産の物理的状況を公示するもの)には登録免許税は課されない。1は不動産取得税が事実上の所有権取得に着目して課される点、2は新築住宅特例の課税標準控除(1戸最高1,200万円、認定長期優良住宅は1,300万円)、3は贈与による所有権移転登記に対する登録免許税の課税であり、いずれも正しい記述である。表題登記と保存・移転登記の課税上の扱いの違いに注意する必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-049", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 49, "questionType": "four_choice", "question": "個人が土地を譲渡した場合の譲渡所得に関する次の記述のうち、最も適切なものはどれか。", "choices": ["相続(限定承認に係るものを除く)により取得した土地を譲渡した場合、その土地の所有期間を判定する際の取得の時期は、被相続人の取得の時期が引き継がれる。", "土地の譲渡に係る所得が長期譲渡所得に区分される場合、課税長期譲渡所得金額に対し、原則として、所得税(復興特別所得税を含む)が20.42%、住民税が5%の税率で課される。", "土地の譲渡に係る所得については、その土地を譲渡した日の属する年の1月1日における所有期間が10年以下の場合、短期譲渡所得に区分される。", "譲渡所得の金額の計算上、譲渡した土地の取得費が不明な場合には、譲渡収入金額の10%相当額を取得費とすることができる。"], "answer": 1, "explanation": "正解1が適切。相続(限定承認に係るものを除く単純承認等)により取得した資産を譲渡した場合、所有期間の判定における取得の時期は、被相続人が取得した時期がそのまま相続人に引き継がれる(取得費も同様に引き継ぐ)。2は長期譲渡所得の税率は所得税15.315%(復興特別所得税込み)・住民税5%が正しく、20.42%という数値は誤り。3は短期・長期の区分は譲渡年の1月1日現在の所有期間が5年以下か5年超かで判定され、10年という基準はないため誤り。4は取得費が不明な場合の概算取得費は譲渡収入金額の5%相当額であり10%は誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-050", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 50, "questionType": "four_choice", "question": "不動産の有効活用の手法の一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["等価交換方式における全部譲渡方式は、土地所有者が土地の全部をデベロッパーに譲渡し、その対価としてその土地上にデベロッパーが建設した建物およびその土地の一部を譲り受ける方式である。", "建設協力金方式は、土地所有者が建設する建物を貸し付ける予定のテナント等から、建設費相当額の全部または一部を借り受けて建物を建設する方式である。", "定期借地権方式では、土地所有者は土地を一定期間貸し付けることにより地代収入を得ることができ、当該土地上に建設される建物の建設資金を負担する必要はない。", "事業受託方式は、土地の有効活用の企画、建設会社の選定や当該土地上に建設された建物の管理・運営等を土地所有者の依頼を受けたデベロッパーが行う手法であり、土地所有者は建設資金を調達する必要はなく、建物の所有名義はデベロッパーとなる。"], "answer": 4, "explanation": "正解は4が不適切。事業受託方式は、土地の有効活用の企画・建設会社の選定・建物の管理運営等をデベロッパーが受託して行う方式であるが、建設資金の調達や借入れは土地所有者自身が行い、建物の所有名義も土地所有者のままである点が特徴(デベロッパーは事業運営のノウハウを提供する立場に留まる)。1は等価交換方式(全部譲渡方式)の仕組み、2は建設協力金方式の仕組み(テナントからの借入金で建設)、3は定期借地権方式で建設資金負担が不要な点であり、いずれも正しい記述である。事業受託方式と等価交換方式・建設協力金方式との違い(資金調達主体・所有名義)の混同に注意する必要がある。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-051", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 51, "questionType": "four_choice", "question": "民法上の贈与に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["書面によらない贈与は、その履行の終わった部分を除き、各当事者が解除をすることができる。", "死因贈与では、民法の遺贈に関する規定が準用され、贈与者の一方的な意思表示により成立し、贈与者の死亡によってその効力を生じる。", "定期贈与は、贈与者または受贈者の死亡によって、その効力を失う。", "負担付贈与では、受贈者がその負担である義務を履行しない場合において、贈与者が相当の期間を定めてその履行の催告をし、その期間内に履行がない場合、原則として、贈与者は、当該贈与の解除をすることができる。"], "answer": 2, "explanation": "正解は2が不適切。死因贈与は、贈与者の死亡によって効力を生ずる贈与契約であり、その効力発生等については民法上「遺贈に関する規定」が準用されるが、契約自体は贈与者と受贈者双方の合意(諾成契約)によって成立するものであり、遺贈のような贈与者の単独(一方的)の意思表示によって成立するものではない。1は書面によらない贈与の任意解除権に関する規定、3は定期贈与の一身専属性(当事者の死亡により効力を失う)、4は負担付贈与の履行遅滞による解除に関する規定であり、いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-052", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 52, "questionType": "four_choice", "question": "みなし贈与財産等に関する次の記述のうち、最も適切なものはどれか。", "choices": ["契約者(=保険料負担者)および被保険者が父、死亡保険金受取人が子である生命保険契約において、父の死亡により子が受け取った死亡保険金は、子が父から贈与により取得したものとみなされ、贈与税の課税対象となる。", "子が父から著しく低い価額の対価で土地を譲り受けた場合には、原則として、その相続税評価額と支払った対価の額との差額が、子が父から贈与により取得したものとみなされ、贈与税の課税対象となる。", "債務者である個人が資力を喪失して債務を弁済することが困難になり、債権者である個人から当該債務の免除を受けた場合、当該免除を受けた金額のうちその債務を弁済することが困難である部分の金額についても、贈与税の課税対象となる。", "妻が夫から居住用マンションを離婚による財産分与により取得した場合、原則として、妻が取得した当該マンションは、贈与により取得した財産とはみなされず、贈与税の課税対象とならない。"], "answer": 4, "explanation": "正解4。離婚に伴う財産分与により取得した財産は、婚姻中の実質的共有財産の清算および離婚後の扶養等を目的とする分与であり、社会通念上相当な範囲内であれば、贈与により取得した財産とはみなされず、原則として贈与税の課税対象とならない。1は契約者と被保険者が同一人(父)である生命保険契約で、被保険者の死亡により相続人以外の子が受け取る死亡保険金は、みなし相続財産として相続税の課税対象となるのであって、贈与税の課税対象ではないため誤り。2はみなし贈与課税の基準となるのは相続税評価額ではなく、その財産の「時価」と支払った対価との差額であるため不正確。3は資力喪失により債務弁済が困難な部分の債務免除については、贈与税の課税対象とならないとされており誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-053", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 53, "questionType": "four_choice", "question": "贈与税の計算に関する次の記述のうち、最も不適切なものはどれか。なお、受贈者は個人であるものとする。", "choices": ["子が同一年中に父母のそれぞれから贈与を受けた場合、同年分の子の暦年課税に係る贈与税額の計算上、贈与税の課税価格から控除する基礎控除額は、各贈与者につき最高110万円である。", "暦年課税に係る贈与税額の計算上、適用される税率は、超過累進税率である。", "相続時精算課税に係る贈与税額の計算上、2024年1月1日以後に贈与により取得した財産については、贈与税の課税価格から基礎控除額として最高110万円を控除することができる。", "相続時精算課税に係る贈与税額の計算上、適用される税率は、一律20%である。"], "answer": 1, "explanation": "正解は1が不適切。暦年課税に係る贈与税の基礎控除額(110万円)は、贈与者ごとではなく、受贈者1人につき、その年中に受けたすべての贈与の合計額に対して適用される上限額である。よって父母それぞれから贈与を受けた場合でも基礎控除は合計で110万円までであり、贈与者ごとに110万円ずつ控除できるわけではない。2は暦年課税の税率構造(超過累進税率)、3は2024年度税制改正により創設された相続時精算課税の基礎控除(年110万円、暦年課税とは別枠)、4は相続時精算課税の贈与税率(一律20%)であり、いずれも正しい記述である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-054", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 54, "questionType": "four_choice", "question": "民法上の相続分に関する次の記述のうち、最も不適切なものはどれか。なお、記載のない事項については考慮しないものとする。", "choices": ["相続人が複数いる場合、各共同相続人は、被相続人の遺言により相続分や遺産分割方法の指定がされていなければ、法定相続分どおりに相続財産を分割しなければならない。", "共同相続人の1人が遺産の分割前にその相続分を共同相続人以外の第三者に譲り渡した場合、他の共同相続人は、当該第三者に対して一定期間内にその価額および費用を支払うことで、その相続分を譲り受けることができる。", "被相続人の兄弟姉妹が相続人である場合において、当該兄弟姉妹のうち被相続人の相続開始以前に死亡した者がいるときは、その死亡した者の子が代襲して相続人となる。", "養子の法定相続分は、実子の法定相続分と同じである。"], "answer": 1, "explanation": "正解は1が不適切。被相続人の遺言による相続分・遺産分割方法の指定がない場合であっても、共同相続人全員の協議(遺産分割協議)により、法定相続分とは異なる割合で自由に遺産を分割することができ、必ずしも法定相続分どおりに分割しなければならないわけではない。2は相続分の取戻権(民法905条)に関する正しい記述、3は兄弟姉妹の代襲相続(一代限り)に関する正しい記述、4は養子と実子の法定相続分が同じである点であり、いずれも正しい記述である。法定相続分はあくまで目安であり、協議による自由な分割が可能という点が本問の核心である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-055", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 55, "questionType": "four_choice", "question": "配偶者に対する相続税額の軽減(以下「配偶者の税額軽減」という)に関する次の記述のうち、最も適切なものはどれか。", "choices": ["配偶者の税額軽減の適用を受けることにより配偶者の納付すべき相続税額が0(ゼロ)となる場合、当該配偶者は相続税の申告書を提出する必要はない。", "相続税の申告期限までに分割されていない財産は、原則として、配偶者の税額軽減の対象とならないが、相続税の申告書に「申告期限後3年以内の分割見込書」を添付し、申告期限までに分割されなかった財産について申告期限から3年以内に分割したときは、配偶者の税額軽減の対象となる。", "相続の放棄をした被相続人の配偶者が遺贈により取得した財産は、配偶者の税額軽減の対象とならない。", "配偶者の税額軽減の適用を受けるためには、相続が開始した日の前日において被相続人との婚姻期間が20年以上でなければならない。"], "answer": 2, "explanation": "正解2。相続税の申告期限までに遺産分割が確定していない財産は、原則として配偶者の税額軽減の対象とならないが、申告書に「申告期限後3年以内の分割見込書」を添付して提出し、申告期限後3年以内に分割が行われた場合には、その分割された財産について税額軽減の適用を受けることができる(更正の請求による)。1は税額軽減の適用を受けるためには、たとえ納付税額が0円となる場合でも相続税の申告書の提出が要件とされるため誤り。3は相続放棄をした者が遺贈により取得した財産であっても税額軽減の対象となるため誤り。4は配偶者の税額軽減には婚姻期間の要件はなく(婚姻期間20年以上の要件があるのは贈与税の配偶者控除)、誤りである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-056", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 56, "questionType": "four_choice", "question": "相続税における取引相場のない株式の評価に関する次の記述のうち、最も適切なものはどれか。なお、評価の対象となる株式は、特定の評価会社の株式には該当しないものとする。", "choices": ["配当還元方式による株式の価額は、その株式の1株当たりの年配当金額を5%で還元した元本の金額によって評価する。", "類似業種比準価額を計算する場合の類似業種の株価は、課税時期の属する月以前3ヵ月間の各月の類似業種の株価のうち最も低いものとするが、納税義務者の選択により、類似業種の前年平均株価または課税時期の属する月以前2年間の平均株価によることができる。", "会社規模が小会社である会社において、中心的な同族株主が取得した株式の価額は、原則として、類似業種比準方式によって評価する。", "同族株主のいる会社において、同族株主以外の株主が取得した株式の価額は、その会社規模にかかわらず、原則として、純資産価額方式によって評価する。"], "answer": 2, "explanation": "正解2。類似業種比準価額の計算における類似業種の株価は、課税時期の属する月以前3ヵ月間の各月の類似業種の株価のうち最も低いものを用いるのが原則だが、納税義務者の選択により、前年平均株価または課税時期の属する月以前2年間の平均株価によることも認められている。1は配当還元方式の還元率は年10%であり5%は誤り。3は小会社(原則として純資産価額方式、または類似業種比準方式と純資産価額方式の併用方式の低い方を選択可能な会社)において中心的な同族株主が取得する株式は、原則として純資産価額方式で評価されるため誤り。4は同族株主のいる会社で、同族株主以外の株主(少数株主)が取得する株式は、原則として特例的評価方式である配当還元方式により評価されるため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-057", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 57, "questionType": "four_choice", "question": "小規模宅地等についての相続税の課税価格の計算の特例(以下「本特例」という)に関する次の記述のうち、最も適切なものはどれか。なお、各選択肢において、ほかに必要な要件等はすべて満たしているものとする。", "choices": ["被相続人から相続時精算課税の適用を受けて贈与により取得した宅地等の価額が相続税の課税価格に加算される場合、当該宅地等については本特例の適用を受けることができない。", "被相続人が月極駐車場(アスファルト等の構築物のない青空駐車場)の用に供していた土地を相続により取得した場合、当該土地について本特例の適用を受けることができる。", "相続人以外の親族が被相続人から宅地を遺贈により取得した場合、当該宅地について本特例の適用を受けることができない。", "相続開始の直前において被相続人と同居していなかった被相続人の配偶者が、被相続人が居住の用に供していた宅地を相続により取得した場合、当該宅地について本特例の適用を受けることはできない。"], "answer": 1, "explanation": "正解1が適切。相続時精算課税に係る贈与により取得した宅地等で、その贈与財産の価額が相続税の課税価格に加算される場合、その宅地等については小規模宅地等についての課税価格の計算の特例の適用を受けることができない(本特例は相続・遺贈により取得した宅地等が対象であり、生前贈与財産には適用されない)。2は構築物のない青空駐車場の敷地は「事業の用に供されていた宅地等」には該当せず本特例の対象外のため誤り。3は相続人以外の親族(孫等)であっても遺贈により取得した宅地等について要件を満たせば本特例の適用を受けられるため誤り。4は被相続人の配偶者が居住用宅地を取得する場合、同居の有無を問わず無条件に本特例(特定居住用宅地等)の適用を受けられるため誤り。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-058", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 58, "questionType": "four_choice", "question": "相続対策としての生命保険の活用等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["相続税は、金銭による一括納付が原則とされているため、相続財産の大半が不動産であり一括納付が困難になると見込まれる場合には、納税資金対策として、不動産を承継する相続人を死亡保険金受取人とする生命保険契約を締結する方法が考えられる。", "契約者(=保険料負担者)および被保険者が夫、死亡保険金受取人が妻である生命保険契約において、夫の死亡により妻が受け取った死亡保険金は、受取人の固有の財産であり、原則として、遺産分割協議の対象とならない。", "相続税額の計算上、死亡保険金の非課税金額の規定による非課税限度額は、「500万円×法定相続人の数」の算式により計算した金額である。", "契約者(=保険料負担者)および被保険者が夫、死亡保険金受取人が妻である生命保険契約において、夫の死亡により妻が受け取った死亡保険金は、妻が相続の放棄をした場合であっても、相続税額の計算上、死亡保険金の非課税金額の規定の適用を受けることができる。"], "answer": 4, "explanation": "正解は4が不適切。死亡保険金の非課税限度額(500万円×法定相続人の数)の規定は、相続人が取得した死亡保険金についてのみ適用され、相続の放棄をした者が取得した死亡保険金については、その者は税法上「相続人」として扱われないため非課税規定の適用を受けることができない(ただし、みなし相続財産として相続税の課税対象にはなる)。1は不動産承継者を保険金受取人とする納税資金対策の典型例、2は死亡保険金受取人固有の財産としての性質(遺産分割協議の対象外)、3は非課税限度額の計算式であり、いずれも正しい記述である。相続放棄者は非課税の適用対象外という点が頻出のひっかけである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-059", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 59, "questionType": "four_choice", "question": "会社法に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["株式会社における株主は、その有する株式の引受価額を限度として責任を負う。", "株式会社が特定の株主との合意により自己株式を有償で取得する場合、株主総会の決議は不要である。", "株主総会には、毎事業年度終了後の一定の時期に開催する定時株主総会と、必要に応じて開催する臨時株主総会がある。", "株式会社のうち公開会社は、取締役会を置かなければならない。"], "answer": 2, "explanation": "正解は2が不適切。会社法上、株式会社が特定の株主との合意により自己株式を有償で取得する場合には、原則として株主総会の特別決議が必要とされ(他の株主に売主追加請求権を認める等の手続も必要)、株主総会決議が不要というのは誤りである。1は株主有限責任の原則、3は定時株主総会・臨時株主総会の区分、4は公開会社における取締役会設置の義務であり、いずれも会社法上正しい記述である。自己株式の特定者からの取得には特別な手続(特別決議等)が必要という点が本問の核心である。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-01-gakka-060", "grade": "FP2", "examDate": "2025-01", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 60, "questionType": "four_choice", "question": "2024年4月1日に施行された改正不動産登記法における相続登記に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["相続により不動産を取得した相続人は、原則として、自己のために相続の開始があったことを知り、かつ、その所有権を取得したことを知った日から3年以内に相続登記の申請をしなければならない。", "相続登記の申請をしなければならない者は、登記官に対し、所有権の登記名義人について相続が開始した旨および自らが当該所有権の登記名義人の相続人である旨を申し出ることで、相続登記の申請の義務を履行したものとみなされる。", "2024年3月31日以前に開始した相続により不動産を取得した相続人は、相続登記がされていない場合であっても、その所有権について相続登記の申請をする義務はない。", "相続登記の申請をしなければならない者が、正当な理由がないのにその申請を怠った場合、罰則の適用対象となる。"], "answer": 3, "explanation": "正解は3が不適切。改正不動産登記法による相続登記の申請義務化は、2024年4月1日の施行日より前に発生していた相続についても遡及的に適用され、既に相続が発生している場合は、施行日から3年以内(2027年3月31日まで)に相続登記の申請をしなければならない義務を負う。「申請する義務はない」とする本肢は誤りである。1は原則的な申請期限(3年以内)、2は相続人申告登記による義務履行のみなし規定、4は義務違反時の過料(10万円以下)の罰則であり、いずれも正しい記述である。施行日前の相続にも遡及適用される点が本問の重要ポイントである。", "legalReferenceDate": "2024-10-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202501_q.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}]</script>

  if(!st.settings.examDate) st.settings.examDate = DEFAULT_NEXT_EXAM_DATE;
  if(typeof st.todayTenRunCount !== "number") st.todayTenRunCount = 0;
  if(!st.seenIds) st.seenIds = {};
  if(typeof st.inProgress === "undefined") st.inProgress = null;
  return st;
}
function saveState(st){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){}
}
var STATE = loadState();

function applyFontSize(){
  // 注意: rem単位はルート要素(html)のfont-sizeを基準に解決されるため、
  // body要素にクラスを付与しても文字サイズには反映されない（旧バージョンの不具合）。
  // documentElement(html = :root)にクラスを付与することで、全体のrem基準値を変更する。
  var root = document.documentElement;
  root.classList.remove("fs-large","fs-xlarge");
  document.body.classList.remove("fs-large","fs-xlarge");
  if(STATE.settings.fontSize === "large") root.classList.add("fs-large");
  if(STATE.settings.fontSize === "xlarge") root.classList.add("fs-xlarge");
}
applyFontSize();

var byId = {};
QUESTIONS.forEach(function(q){ byId[q.id] = q; });
var byDomain = {};
DOMAINS.forEach(function(d){ byDomain[d] = QUESTIONS.filter(function(q){return q.domain===d;}); });
var byExam = {};
EXAM_DATES.forEach(function(e){ byExam[e] = QUESTIONS.filter(function(q){return q.examDate===e;}).sort(function(a,b){return a.sourceQuestionNumber-b.sourceQuestionNumber;}); });
// 年度×課目 = 18セッション（各10問）
var byExamDomain = {};
EXAM_DATES.forEach(function(e){
  byExamDomain[e] = {};
  DOMAINS.forEach(function(d){
    byExamDomain[e][d] = byExam[e].filter(function(q){ return q.domain===d; });
  });
});

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function weakList(){
  return QUESTIONS.filter(function(q){ return STATE.weak[q.id] && STATE.weak[q.id].streak < 3; });
}

function buildTodayTen(){
  var isFirst = STATE.todayTenRunCount === 0;
  var picked = [];
  if(isFirst){
    // balanced across 6 domains: 1 or 2 each to total 10 (4 domains x2 + 2 domains x1... use round robin)
    var pools = {};
    DOMAINS.forEach(function(d){ pools[d] = shuffle(byDomain[d]); });
    var di = 0;
    while(picked.length < 10){
      var d = DOMAINS[di % DOMAINS.length];
      if(pools[d].length){
        picked.push(pools[d].shift());
      }
      di++;
      if(di > 200) break;
    }
  } else {
    var unseen = QUESTIONS.filter(function(q){ return !STATE.seenIds[q.id]; });
    var weak = weakList();
    var seenNotWeak = QUESTIONS.filter(function(q){ return STATE.seenIds[q.id] && !(STATE.weak[q.id] && STATE.weak[q.id].streak<3); });
    var pool = shuffle(unseen).concat(shuffle(weak)).concat(shuffle(seenNotWeak));
    var used = {};
    pool.forEach(function(q){
      if(picked.length<10 && !used[q.id]){ used[q.id]=true; picked.push(q); }
    });
  }
  return picked.slice(0,10);
}

// ---------- Progress persistence (中断復帰・続きから始める) ----------
function saveProgress(){
  if(!SESSION) return;
  STATE.inProgress = {
    key: SESSION.key,
    title: SESSION.title,
    ids: SESSION.questions.map(function(q){ return q.id; }),
    idx: SESSION.idx,
    correct: SESSION.correct,
    answeredCount: SESSION.answeredCount,
    savedAt: Date.now()
  };
  saveState(STATE);
}
function clearProgress(){
  STATE.inProgress = null;
  saveState(STATE);
}
function resumeSession(){
  var ip = STATE.inProgress;
  if(!ip) return;
  var qs = ip.ids.map(function(id){ return byId[id]; });
  var ok = qs.every(function(q){ return !!q; }) && ip.idx < qs.length;
  if(!ok){
    clearProgress();
    render();
    alert("前回の学習データを復元できませんでした。お手数ですが最初からやり直してください。");
    return;
  }
  SESSION = { key: ip.key, title: ip.title, questions: qs, idx: ip.idx, correct: ip.correct, answeredCount: ip.answeredCount, answered:false, selected:null };
  go("quiz");
}

function tabbarHtml(active){

function progressBarPct(count){
  var pct = Math.min(100, count*20); // 5 completions = full bar (visual only)

  return pct;
}

function examCountdownDays(){
  var ds = STATE.settings.examDate || DEFAULT_NEXT_EXAM_DATE;
  var parts = ds.split("-").map(function(n){ return parseInt(n,10); });
  var examDay = new Date(parts[0], parts[1]-1, parts[2]);
  var today = new Date();
  var todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var msPerDay = 24*60*60*1000;
  return Math.round((examDay.getTime() - todayMid.getTime()) / msPerDay);
}

function examCountdownHtml(){
  var ds = STATE.settings.examDate || DEFAULT_NEXT_EXAM_DATE;
  var days = examCountdownDays();
  var parts = ds.split("-").map(function(n){ return parseInt(n,10); });
  var label = parts[0]+"年"+parts[1]+"月実施";
  var numHtml, subHtml;
  if(days > 0){
    numHtml = "残り "+days+" 日";
    subHtml = "次回試験（"+label+"予定）まで";
  } else if(days === 0){
    numHtml = "本日が試験日です";
    subHtml = label+"の予定日";
  } else {
    numHtml = "試験日を過ぎています";
    subHtml = label+"の予定日（"+Math.abs(days)+"日経過）";
  }
  return '<div class="section" style="padding-top:0;"><div class="countdown-card"><div class="countdown-ic">📅</div>'+
    '<div class="countdown-body"><div class="countdown-lbl">'+esc(subHtml)+'</div><div class="countdown-num">'+esc(numHtml)+'</div>'+
    '<div class="countdown-sub">試験日は設定画面から変更できます</div></div></div></div>';
}

function ringHtml(count){
  var pct = Math.max(0, Math.min(count,5))/5*100;
  return '<div class="ring" data-filled="'+(count>0?"1":"0")+'" style="--pct:'+pct+'%"><span>'+count+'</span></div>';
}

var SESSION = null; // {key, title, questions:[], idx, correct, answeredCount}

function startSession(key, questions, title){
  if(!questions || questions.length===0){
    alert("この分野には出題可能な問題がありません。");
    return;
  }
  SESSION = { key:key, title:title, questions:questions, idx:0, correct:0, answeredCount:0, answered:false, selected:null };

}

function renderQuiz(){
  var q = SESSION.questions[SESSION.idx];
  var total = SESSION.questions.length;
  var html = '';
  html += '<div class="header"><button id="quitBtn">← 中断</button><h1>'+esc(SESSION.title)+'</h1></div>';
  html += '<div class="quiz-wrap">';
  html += '<div class="quiz-top"><span class="prog">'+(SESSION.idx+1)+' / '+total+'</span><span class="domain-tag" style="'+domainStyle(q.domain)+'">'+esc(q.domain)+'</span></div>';
  html += '<div class="qbar"><div style="width:'+Math.round(((SESSION.idx)/total)*100)+'%"></div></div>';
  html += '<div class="qtext">'+esc(q.question)+'</div>';
  html += '<div id="choices">';
  q.choices.forEach(function(c, i){
    var num = i+1;
    var cls = "choice";
    if(SESSION.answered){
      if(num === q.answer) cls += " correct";
      else if(num === SESSION.selected) cls += " wrong";
      cls += " disabled";
    }
    html += '<div class="'+cls+'" data-choice="'+num+'"><div class="num">'+num+'</div><div>'+esc(c)+'</div></div>';
  });
  html += '</div>';
  if(!SESSION.answered){
    html += '<button class="dontknow-btn" id="dontknowBtn">わからない</button>';
  }
  if(SESSION.answered){
    var isCorrect = SESSION.selected === q.answer;
    var wasDontKnow = SESSION.selected === -1;
    html += '<div class="feedback '+(isCorrect?"ok":"ng")+'">';
    html += '<div class="fh '+(isCorrect?"ok":"ng")+'">'+(wasDontKnow?"正解は "+q.answer+" でした":(isCorrect?"正解！":"不正解"))+'</div>';
    html += '<div class="expl">'+esc(q.explanation)+'</div>';
    html += '</div>';
    html += '<button class="next-btn" id="nextBtn">'+(SESSION.idx+1 < total ? "次の問題へ" : "結果を見る")+'</button>';
  }
  html += '</div>';
  app.innerHTML = html;

  document.getElementById("quitBtn").onclick = function(){
    if(confirm("学習を中断してホームに戻りますか？（ここまでの回答は記録され、「続きから」の復帰情報はクリアされます）")){
      clearProgress();
      go("home");
    }
  };

  if(!SESSION.answered){
    app.querySelectorAll('.choice').forEach(function(el){
      el.onclick = function(){ answerQuestion(parseInt(el.getAttribute("data-choice"),10)); };
    });
    var dk = document.getElementById("dontknowBtn");
    if(dk) dk.onclick = function(){ answerQuestion(-1); };
  } else {
    document.getElementById("nextBtn").onclick = function(){ nextQuestion(); };
  }
}

function answerQuestion(choiceNum){
  var q = SESSION.questions[SESSION.idx];
  SESSION.selected = choiceNum;
  SESSION.answered = true;
  var isCorrect = choiceNum === q.answer;

  STATE.seenIds[q.id] = true;
  STATE.stats.totalAnswered++;
  if(isCorrect){
    STATE.stats.totalCorrect++;
    SESSION.correct++;
    // 修正: 過去に誤答／わからないで弱点登録された問題のみstreakを進める。
    // 旧バージョンでは初回正解の問題にもstreak:1を付与し、誤って弱点扱いにしてしまうバグがあった。
    var w = STATE.weak[q.id];
    if(w){
      var streak = (w.streak||0)+1;
      if(streak >= 3){
        delete STATE.weak[q.id];
      } else {
        STATE.weak[q.id] = { streak: streak };
      }
    }
  } else {
    STATE.weak[q.id] = { streak: 0 };
  }
  SESSION.answeredCount++;
  saveState(STATE);
  render();
}

function nextQuestion(){
  if(SESSION.idx+1 < SESSION.questions.length){
    SESSION.idx++;
    SESSION.answered = false;
    SESSION.selected = null;
    saveProgress();
    render();
  } else {
    // session complete
    clearProgress();
    STATE.sessionCompletions[SESSION.key] = (STATE.sessionCompletions[SESSION.key]||0) + 1;
    STATE.stats.history.unshift({
      title: SESSION.title,
      date: new Date().toISOString(),
      correct: SESSION.correct,
      total: SESSION.questions.length
    });
    STATE.stats.history = STATE.stats.history.slice(0,30);
    saveState(STATE);
    go("result");
  }
}

  document.getElementById("resetBtn").onclick = function(){
    if(confirm("本当にすべての学習記録をリセットしますか？この操作は元に戻せません。")){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      STATE = loadState();
      applyFontSize();
      go("home");
    }
  };
  bindTabbar();
}

go("home");
})();
</script>
</body>
