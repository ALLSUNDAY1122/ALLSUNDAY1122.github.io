<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FP2級 過去問コーチ</title>
<style>
  :root{
    --bg:#faf6f0; --card:#fffdfa; --ink:#231f1a; --sub:#726b60;
    --accent:#5b4fe0; --accent-dark:#3d33a8; --accent-soft:#eeedff;
    --good:#16a34a; --good-soft:#f0fdf4; --bad:#dc2626; --bad-soft:#fef2f2;
    --border:#ece6da; --warn:#f59e0b; --radius:16px; --radius-sm:12px;
    --shadow-sm:0 1px 3px rgba(60,45,20,.07); --shadow-md:0 4px 14px rgba(91,79,224,.16);
    --fs-base:16px;
    --d-life:#2563eb; --d-life-soft:#eef4ff;
    --d-risk:#e11d48; --d-risk-soft:#fff1f3;
    --d-fund:#059669; --d-fund-soft:#eefdf6;
    --d-tax:#7c3aed; --d-tax-soft:#f6f3ff;
    --d-estate:#ea580c; --d-estate-soft:#fff6ee;
    --d-inherit:#0d9488; --d-inherit-soft:#effbf9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    font-size:var(--fs-base);overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:28px;}
  .header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(55,48,163,.25);}
  .header h1{font-size:1.05rem;margin:0;font-weight:800;flex:1;letter-spacing:.01em;}
  .header button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;
    padding:8px 10px;font-size:.85rem;font-weight:600;transition:background .15s ease,transform .1s ease;}
  .header button:active{background:rgba(255,255,255,.32);transform:scale(.96);}
  .hero{padding:18px 16px 6px;}
  .hero .title{font-size:1.4rem;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
  .hero .sub{color:var(--sub);font-size:.83rem;margin:0;line-height:1.5;}
  .section{padding:14px 16px;}
  .section h2{font-size:.92rem;color:var(--ink);margin:0 0 10px;font-weight:800;
    display:flex;align-items:center;gap:6px;letter-spacing:.01em;}
  .year-h{font-size:.78rem;color:var(--sub);font-weight:800;margin:14px 2px 8px;
    text-transform:uppercase;letter-spacing:.06em;}
  .year-h:first-of-type{margin-top:2px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;text-align:left;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:6px;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease;}
  .card-btn:active{transform:scale(0.97);box-shadow:none;}
  .card-btn .name{font-weight:700;font-size:.95rem;}
  .card-btn .meta{font-size:.75rem;color:var(--sub);}
  .progress-bar{height:8px;border-radius:6px;background:#e9edf3;overflow:hidden;margin-top:2px;}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,#818cf8,var(--accent));transition:width .3s ease;}
  .full-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;
    gap:12px;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease;}
  .full-btn:active{transform:scale(.98);box-shadow:none;}
  .full-btn .emoji{font-size:1.6rem;flex-shrink:0;width:40px;height:40px;border-radius:12px;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;}
  .full-btn .txt{min-width:0;}
  .full-btn .txt .name{font-weight:800;font-size:1rem;}
  .full-btn .txt .meta{font-size:.78rem;color:var(--sub);margin-top:2px;}
  .resume-card{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:var(--radius);
    padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#fff;
    box-shadow:var(--shadow-md);transition:transform .12s ease;}
  .resume-card:active{transform:scale(.98);}
  .resume-ic{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:1rem;}
  .resume-body{flex:1;min-width:0;}
  .resume-lbl{font-size:.72rem;font-weight:700;opacity:.85;letter-spacing:.02em;}
  .resume-name{font-size:1rem;font-weight:800;margin:2px 0;}
  .resume-meta{font-size:.78rem;opacity:.9;}
  .yd-grid{grid-template-columns:1fr 1fr;}
  .yd-card{background:linear-gradient(0deg,var(--d-tint,var(--card)),var(--d-tint,var(--card)));
    border:1px solid var(--border);border-left:4px solid var(--d-accent,var(--accent));border-radius:var(--radius-sm);
    padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;}
  .yd-card:active{transform:scale(.96);box-shadow:none;filter:brightness(.97);}
  .yd-card .ring{background:conic-gradient(var(--d-accent,var(--accent)) var(--pct),#e6e8f0 0);}
  .yd-card .ring[data-filled="0"]{background:#e6e8f0;}
  .yd-card .ring span{color:var(--d-accent,var(--accent-dark));}
  .quiz-top .domain-tag{background:var(--d-tint,var(--accent-soft));color:var(--d-accent,var(--accent-dark));}
  .countdown-card{background:linear-gradient(135deg,#fff8ee,#fef1e6);border:1px solid #fbe3c8;
    border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow-sm);}
  .countdown-ic{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff2df;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
  .countdown-body{flex:1;min-width:0;}
  .countdown-lbl{font-size:.74rem;color:#9a6a2f;font-weight:700;letter-spacing:.02em;}
  .countdown-num{font-size:1.25rem;font-weight:800;color:#7a4a15;margin:2px 0;}
  .countdown-sub{font-size:.74rem;color:var(--sub);}
  .yd-info{min-width:0;}
  .yd-domain{font-size:.8rem;font-weight:700;line-height:1.3;}
  .yd-meta{font-size:.7rem;color:var(--sub);margin-top:2px;}
  .ring{flex-shrink:0;width:36px;height:36px;border-radius:50%;
    background:conic-gradient(var(--accent) var(--pct),#e6e8f0 0);
    display:flex;align-items:center;justify-content:center;transition:background .3s ease;}
  .ring[data-filled="0"]{background:#e6e8f0;}
  .ring span{width:28px;height:28px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--accent-dark);}
  .exam-details{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow-sm);}
  .exam-details summary{font-weight:700;font-size:.88rem;color:var(--ink);cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:6px;}
  .exam-details summary::before{content:"▶";font-size:.65rem;color:var(--sub);display:inline-block;transition:transform .15s ease;}
  .exam-details[open] summary::before{transform:rotate(90deg);}
  .exam-details summary::-webkit-details-marker{display:none;}
  .stat-row{display:flex;gap:10px;}
  .stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm);}
  .stat-box .num{font-size:1.5rem;font-weight:800;color:var(--accent-dark);}
  .stat-box .lbl{font-size:.7rem;color:var(--sub);margin-top:3px;}
  .quiz-wrap{padding:14px 16px;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .quiz-top .prog{font-size:.85rem;color:var(--ink);font-weight:800;}
  .quiz-top .domain-tag{font-size:.72rem;background:var(--accent-soft);color:var(--accent-dark);
    padding:4px 10px;border-radius:999px;font-weight:700;}
  .qbar{height:6px;background:#e6e8f0;border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .qbar > div{height:100%;background:linear-gradient(90deg,#818cf8,var(--accent));transition:width .25s ease;}
  .qtext{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;font-size:1rem;line-height:1.75;margin-bottom:14px;white-space:pre-wrap;word-break:break-word;
    box-shadow:var(--shadow-sm);animation:fadeIn .25s ease;}
  .choice{background:var(--card);border:2px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.95rem;line-height:1.5;
    display:flex;gap:10px;word-break:break-word;transition:border-color .12s ease,background .12s ease,transform .1s ease;}
  .choice:active{transform:scale(.98);}
  .choice .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent-dark);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;}
  .choice.correct{border-color:var(--good);background:var(--good-soft);}
  .choice.correct .num{background:var(--good);color:#fff;}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft);}
  .choice.wrong .num{background:var(--bad);color:#fff;}
  .choice.disabled{pointer-events:none;opacity:.9;}
  .dontknow-btn{width:100%;padding:13px;border-radius:var(--radius-sm);border:2px dashed #cbd5e1;
    background:#f8fafc;color:var(--sub);font-weight:700;margin-top:4px;cursor:pointer;font-size:.9rem;
    transition:background .12s ease,transform .1s ease;}
  .dontknow-btn:active{transform:scale(.98);background:#eef1f5;}
  .feedback{margin-top:16px;border-radius:var(--radius);padding:14px 16px;animation:fadeIn .3s ease;}
  .feedback.ok{background:var(--good-soft);border:1px solid #bbf7d0;}
  .feedback.ng{background:var(--bad-soft);border:1px solid #fecaca;}
  .feedback .fh{font-weight:800;font-size:1rem;margin-bottom:8px;}
  .feedback .fh.ok{color:var(--good);} .feedback .fh.ng{color:var(--bad);}
  .feedback .expl{font-size:.88rem;line-height:1.75;color:#374151;white-space:pre-wrap;}
  .next-btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-weight:800;font-size:1rem;
    cursor:pointer;box-shadow:var(--shadow-md);transition:transform .1s ease,box-shadow .1s ease;}
  .next-btn:active{transform:scale(.98);box-shadow:none;}
  .backlink{display:inline-block;margin:10px 16px;color:var(--accent-dark);font-size:.85rem;cursor:pointer;}
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 20px;text-align:center;margin:16px;box-shadow:var(--shadow-sm);animation:fadeIn .3s ease;}
  .result-card .big{font-size:2.4rem;font-weight:800;color:var(--accent-dark);}
  .result-card .lbl{color:var(--sub);font-size:.85rem;margin-top:2px;}
  .result-detail{display:flex;justify-content:space-around;margin-top:16px;}
  .result-detail div{text-align:center;}
  .result-detail .n{font-weight:800;font-size:1.2rem;}
  .result-detail .l{font-size:.72rem;color:var(--sub);margin-top:2px;}
  .settings-row{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .settings-row .lbl{font-weight:700;font-size:.9rem;margin-bottom:8px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);
    background:#fff;font-size:.85rem;font-weight:600;transition:background .12s ease,color .12s ease;}
  .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .danger-btn{width:100%;padding:13px;border-radius:10px;border:1px solid #fecaca;
    background:#fff5f5;color:var(--bad);font-weight:700;cursor:pointer;transition:background .12s ease;}
  .danger-btn:active{background:#fee2e2;}
  .history-item{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;font-size:.82rem;display:flex;justify-content:space-between;
    box-shadow:var(--shadow-sm);}
  .history-item .l{color:var(--sub);}
  .empty-note{color:var(--sub);font-size:.85rem;text-align:center;padding:24px 16px;}
  .tabbar{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;padding:8px 2px;font-size:.68rem;color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .12s ease;}
  .tabbar button .ic{font-size:1.2rem;}
  .tabbar button.active{color:var(--accent-dark);font-weight:700;}
  html.fs-large{--fs-base:18px;}
  html.fs-xlarge{--fs-base:20px;}
  .weak-badge{display:inline-block;background:#fff7ed;color:#c2410c;border-radius:999px;
    font-size:.7rem;padding:2px 8px;font-weight:700;margin-left:6px;}
  .date-input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
    background:#fff;font-size:.92rem;color:var(--ink);font-family:inherit;}
  .settings-note{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:8px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (hover:hover) and (pointer:fine){
    .card-btn:hover,.full-btn:hover,.yd-card:hover,.resume-card:hover{
      transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,45,20,.12);}
    .choice:hover:not(.disabled){border-color:var(--accent);background:var(--accent-soft);}
    .next-btn:hover{filter:brightness(1.06);}
    .danger-btn:hover{background:#ffe9e9;}
    .seg button:hover:not(.active){background:#f6f2ea;}
    .tabbar button:hover{color:var(--accent-dark);}
  }
  @media (max-width:370px){
    .yd-domain{font-size:.75rem;}
  }
</style>
</head>

<script id="questionData" type="application/json">[{"id": "fp2-2026-05-gakka-001", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 1, "questionType": "four_choice", "question": "ライフプランの作成の際に活用される各種係数に関する次の記述のうち、最も適切なものはどれか。", "choices": ["現在保有する資金を一定期間、一定の利率で複利運用した場合の一定期間経過後の元利合計額を試算する際、現在保有する資金の額に乗じる係数は、現価係数である。", "毎年一定の積立額を一定期間、一定の利率で複利運用した場合の一定期間経過後の元利合計額を試算する際、毎年の積立額に乗じる係数は、年金現価係数である。", "一定の利率で複利運用しながら一定期間経過後に目標とする額を得るために必要な毎年一定の積立額を試算する際、目標とする額に乗じる係数は、減債基金係数である。", "一定の利率で複利運用しながら一定期間、毎年一定金額を受け取るために必要な元本を試算する際、毎年受け取りたい金額に乗じる係数は、資本回収係数である。"], "answer": 3, "explanation": "正解は3。目標額を複利運用で貯めるために必要な毎年の積立額は、目標額に減債基金係数を乗じて求める。1)は誤り。現在の資金の将来価値を求めるのは終価係数であり、現価係数は将来必要な額から現在必要な元本を逆算する係数である。2)は誤り。毎年の積立額から将来の元利合計を求めるのは年金終価係数であり、年金現価係数は一定額を受け取るために必要な元本を求める係数である。4)は誤り。毎年一定額を受け取るために必要な元本を求めるのは年金現価係数であり、資本回収係数は元本から毎年の取崩(受取)額や借入金の元利均等返済額を求める際に用いる。各係数の名称と用途の対応関係が頻出のひっかけポイントである。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-002", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 2, "questionType": "four_choice", "question": "全国健康保険協会管掌健康保険（協会けんぽ）の保険給付に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["70歳未満の被保険者が医療機関において診察や薬剤の支給などの療養の給付を受ける場合、原則として、被保険者が支払う一部負担金（自己負担額）の割合は３割である。", "傷病手当金の支給期間は、同一の疾病または負傷およびこれにより発した疾病に関して、その支給を始めた日から通算して最長で１年６カ月間である。", "70歳未満の被保険者が同一月内に同一の医療機関で支払った医療費の一部負担金等の額のうち、高額療養費の額の算定にあたって合算の対象となるものは、原則として、入院・外来、医科・歯科別に２万1,000円以上のものである。", "夫婦がともに被保険者である場合において、妻が出産したときは、所定の手続により、妻に対して出産育児一時金が支給され、夫に対して家族出産育児一時金が支給される。"], "answer": 4, "explanation": "正解は4(不適切)。妻自身が被保険者である場合、出産に伴う給付は妻本人の被保険者資格に基づく出産育児一時金のみが支給され、夫(別の被保険者)に家族出産育児一時金が支給されることはない。家族出産育児一時金は、被保険者の被扶養者である家族が出産した場合に当該被保険者へ支給されるものであり、妻が独立した被保険者である本問のケースには当てはまらない。1)一部負担金3割、2)傷病手当金の支給期間は通算1年6か月、3)高額療養費の合算基準21,000円はいずれも正しい記述であり、ひっかけの本丸は「両方から支給される」という誤った理解である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-003", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 3, "questionType": "four_choice", "question": "雇用保険の基本手当に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["雇用保険の一般被保険者が正当な理由のない自己都合で離職した場合、基本手当を受給するためには、離職の日以前２年間に被保険者期間が通算して12カ月以上なければならない。", "特定受給資格者等を除く一般の受給資格者に支給される基本手当の所定給付日数は、算定基礎期間が20年以上である場合、150日である。", "基本手当は、原則として、４週間に１回、求職の申込みを行った公共職業安定所において失業の認定を受けた日分について支給される。", "基本手当日額の算定の基礎となる賃金日額は、原則として、離職の日以前６カ月間に支払われた賃金および賞与の総額を180で除して得た額である。"], "answer": 4, "explanation": "正解は4(不適切)。基本手当日額の算定基礎となる賃金日額は、離職前6か月間に支払われた賃金の総額(賞与等臨時に支払われる賃金を除く)を180で除して算出する。賞与を含めるとする本肢は誤りである。1)自己都合退職の受給要件(離職前2年間に被保険者期間通算12か月以上)、2)算定基礎期間20年以上の一般受給資格者の所定給付日数150日、3)原則4週間に1回の失業認定は、いずれも正しい記述であり、賃金日額の算定期間に賞与を含めるかどうかがひっかけの中心である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-004", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 4, "questionType": "four_choice", "question": "国民年金の学生納付特例制度に関する次の記述のうち、最も適切なものはどれか。", "choices": ["国民年金の第１号被保険者である学生が学生納付特例制度を利用するためには、学生が属する世帯の年収（所得）が世帯人数に応じて定められた基準額以下でなければならない。", "学生納付特例制度の利用申請にあたって、適用を受ける期間を６カ月から24カ月までの範囲内で選択することができる。", "学生納付特例制度の適用を受けた期間に係る保険料のうち、追納することができる保険料は、追納に係る厚生労働大臣の承認を受けた日の属する月前10年以内の期間に係るものに限られる。", "学生納付特例制度の適用を受けた期間は、その期間に係る保険料の追納がない場合、保険料全額免除期間として、その期間の月数の２分の１に相当する月数が老齢基礎年金の年金額に反映される。"], "answer": 3, "explanation": "正解は3。学生納付特例制度による保険料の追納は、承認を受けた日の属する月前10年以内の期間分に限られる(通常の追納期限2年に対する特例)。1)は誤り。判定は世帯の所得ではなく学生本人の前年所得により行われる。2)は誤り。適用期間は原則として4月から翌年3月までの年度単位で申請する仕組みであり、6~24カ月から選択する制度ではない。4)は誤り。学生納付特例期間で追納しない期間は、老齢基礎年金の受給資格期間には算入されるが、年金額の計算には反映されない(全額免除期間のような2分の1算入はない)。学生納付特例と全額免除・納付猶予制度の効果の違いが頻出の論点である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-005", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 5, "questionType": "four_choice", "question": "在職老齢年金に関する次の記述のうち、最も適切なものはどれか。", "choices": ["厚生年金保険の被保険者に支給される老齢厚生年金は、当該被保険者の総報酬月額相当額と基本月額の合計額が支給停止調整額を超える場合、在職老齢年金の仕組みにより、その超える金額が支給停止となる。", "在職老齢年金の仕組みにより老齢厚生年金の全部が支給停止される場合、老齢基礎年金の支給も停止される。", "厚生年金保険の被保険者が老齢厚生年金の繰下げ支給の申出をする場合、老齢厚生年金の年金額のうち、在職老齢年金の仕組みにより支給停止となる部分の金額は、支給を繰り下げたことによる増額の対象とならない。", "厚生年金保険の適用事業所に常時使用される70歳以上の者に支給される老齢厚生年金は、在職老齢年金の仕組みによる支給調整は行われない。"], "answer": 3, "explanation": "正解は3。老齢厚生年金の繰下げ支給の申出をした場合、在職老齢年金により支給停止となる部分は繰下げによる増額の対象とならず、支給停止されない部分のみが増額計算の対象となる。1)は誤り。総報酬月額相当額と基本月額の合計が支給停止調整額を超える場合に支給停止となるのはその超えた額の2分の1であり、超えた額全額が停止されるわけではない。2)は誤り。老齢厚生年金が全部支給停止されても老齢基礎年金は全額支給される。4)は誤り。70歳以上の厚生年金保険の被保険者(または70歳以上被用者)についても在職老齢年金の仕組みによる支給調整は行われる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-006", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 6, "questionType": "four_choice", "question": "公的年金の障害給付に関する次の記述のうち、最も適切なものはどれか。", "choices": ["障害基礎年金および障害厚生年金における障害認定日とは、原則として、障害の原因となった傷病の初診日から１年を経過した日である。", "国民年金の被保険者ではない20歳前の期間に初診日のある傷病を原因とする障害については、20歳以後の障害の状態の程度にかかわらず、障害基礎年金は支給されない。", "障害厚生年金の受給権を取得した者が、その者によって生計を維持されている65歳未満の配偶者を有する場合、受給権者の障害の状態の程度にかかわらず、障害厚生年金に加給年金額が加算される。", "障害厚生年金の額について、当該障害厚生年金の支給事由となった障害に係る障害認定日の属する月後における厚生年金保険の被保険者であった期間は、その計算の基礎とされない。"], "answer": 4, "explanation": "正解は4。障害厚生年金の年金額計算の基礎となる被保険者期間は、原則として障害認定日の属する月までであり、それ以後の被保険者期間は年金額の計算の基礎に算入されない。1)は誤り。障害認定日は初診日から1年6か月を経過した日(その間に傷病が治った場合はその日)であり、1年ではない。2)は誤り。20歳前に初診日がある傷病でも、20歳に達したときに一定の障害状態にあれば、20歳前障害による障害基礎年金が支給される。3)は誤り。加給年金額は障害等級1級・2級の受給権者に生計維持されている65歳未満の配偶者がいる場合に加算されるものであり、3級には加算されない(受給権者の障害の状態の程度に左右される)。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-007", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 7, "questionType": "four_choice", "question": "確定拠出年金の個人型年金に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["個人型年金加入者が国民年金の第３号被保険者である場合、掛金の拠出限度額は年額27万6,000円である。", "個人型年金加入者は、原則として、拠出する掛金の額を、１年（12月分の掛金から翌年11月分の掛金）につき１回、変更することができる。", "個人型年金は、運用実績によって将来受け取る年金額が変動するが、個人型年金加入者が拠出した掛金合計額は最低保証されている。", "個人型年金加入者が60歳から老齢給付金を受給するためには、通算加入者等期間が10年以上なければならない。"], "answer": 3, "explanation": "正解は3(不適切)。確定拠出年金(iDeCo)は運用実績により将来の給付額が変動する制度であり、拠出した掛金合計額の最低保証はない。元本確保型商品を選択しない限り、運用結果によっては掛金合計額を下回る(元本割れ)リスクがある点が確定給付型年金との大きな違いである。1)第3号被保険者の拠出限度額(年額27.6万円、月額2.3万円)は正しい。2)掛金額の変更は年1回可能な点も正しい。4)老齢給付金を60歳から受給するには通算加入者等期間が10年以上必要である点も正しく、期間が短い場合は受給開始年齢が段階的に繰り下がる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-008", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 8, "questionType": "four_choice", "question": "企業年金等に係る税金に関する次の記述のうち、最も適切なものはどれか。", "choices": ["確定拠出年金の企業型年金において企業型年金加入者が拠出した掛金（マッチング拠出により拠出した掛金）は、所得税の小規模企業共済等掛金控除の対象となる。", "中小企業退職金共済において事業主が支払った掛金は、被共済者である従業員の給与所得として所得税の課税対象となる。", "小規模企業共済において個人事業主が支払った掛金は、事業所得の金額の計算上、必要経費となる。", "確定拠出年金の個人型年金において個人型年金加入者が一括で受け取った老齢給付金は、一時所得として所得税の課税対象となる。"], "answer": 1, "explanation": "正解は1。企業型年金加入者掛金(マッチング拠出)は、加入者本人の所得税の小規模企業共済等掛金控除の対象となる。2)は誤り。中退共の事業主負担掛金は福利厚生費として事業主の損金に算入され、従業員の給与所得としては課税されない。3)は誤り。小規模企業共済の掛金は必要経費ではなく、加入者本人の所得控除である小規模企業共済等掛金控除の対象となる。4)は誤り。iDeCoの老齢給付金を一時金で受け取る場合は退職所得として課税され、年金形式で受け取る場合は雑所得(公的年金等)として課税される。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-009", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 9, "questionType": "four_choice", "question": "住宅金融支援機構と金融機関が提携した住宅ローンであるフラット35（買取型）に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["フラット35の融資期間は、原則として、申込者が80歳になるまでの年数と35年のいずれか短い年数が上限となる。", "フラット35の資金使途は、新築住宅の建設・購入資金または中古住宅の購入資金とされており、投資用物件など第三者に賃貸する目的で取得する住宅の建設・購入資金も対象となる。", "フラット35を利用する場合、住宅金融支援機構が、対象となる住宅や敷地について第１順位の抵当権者となる。", "フラット35の利用者向けインターネットサービスである「住・Ｍｙ Ｎｏｔｅ」を利用して一部繰上げ返済をする場合、繰上返済手数料は不要で、返済することができる額は10万円以上である。"], "answer": 2, "explanation": "正解は2(不適切)。フラット35の資金使途は申込者本人またはその親族が居住する住宅の建設・購入資金に限られ、投資用として第三者に賃貸する目的の物件は対象外である。1)融資期間の上限(80歳到達までの年数と35年のいずれか短い年数)は正しい。3)住宅金融支援機構が第1順位の抵当権者となる点も正しい。4)「住・My Note」を利用した繰上返済(手数料無料、10万円以上から可能)も正しい記述であり、資金使途の限定が本問のひっかけの核心である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-010", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 10, "questionType": "four_choice", "question": "中小企業の資金調達方法の一般的な特徴に関する次の記述のうち、最も適切なものはどれか。", "choices": ["企業が金融機関から直接融資を受けて資金を調達する方法は直接金融に分類され、企業が株式や債券の発行により市場を経由して資金を調達する方法は間接金融に分類される。", "インパクトローンは、企業が金融機関から外貨建ての融資を受けて資金を調達する方法であり、その資金使途は、海外事業の展開・再編に係るものに限られる。", "ＡＢＬ（アセット・ベースト・レンディング）は、企業が保有する売掛債権や在庫・機械設備等の資産を担保として金融機関から融資を受けて資金を調達する方法である。", "第三者割当増資は、特定の既存株主に限定して新株引受権を与え、新たに株式を発行して資金を調達する方法である。"], "answer": 3, "explanation": "正解は3。ABL(アセット・ベースト・レンディング)は、企業が保有する売掛債権や在庫・機械設備等の事業用資産を担保に金融機関から融資を受ける資金調達方法である。1)は逆で誤り。金融機関からの融資による調達は間接金融、株式・社債の発行により市場から直接資金を集める方法が直接金融である。2)は誤り。インパクトローンは資金使途に制限のない外貨建て融資である。4)は誤り。第三者割当増資は既存株主に限らず、取引先や特定の第三者に新株を割り当てて資金調達する方法である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-011", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 11, "questionType": "four_choice", "question": "保険法および保険業法に関する次の記述のうち、最も適切なものはどれか。", "choices": ["生命保険契約および損害保険契約は保険法の適用対象となるが、共済契約は、その保障内容にかかわらず、保険法の適用対象とならない。", "保険金の支払時期に関して、保険法の規定よりも保険金受取人にとって不利な内容である保険約款の定めは無効となる。", "保険業法によれば、保険期間が１年以内の保険契約の申込みをした者は、申込みをした日から８日以内であれば、書面または電磁的記録によりその保険契約の申込みの撤回等をすることができるとされている。", "保険会社の経営の健全性を示すソルベンシー・マージン比率が300％を下回った場合、監督当局による業務改善命令などの早期是正措置の対象となる。"], "answer": 2, "explanation": "正解は2。保険法では保険金の支払時期等について、法の規定よりも保険金受取人に不利な約款条項は無効となる片面的強行規定が置かれている。1)は誤り。共済契約もその実質が保険契約であれば保険法の適用対象となる。3)は誤り。クーリングオフ制度は保険期間1年以下の契約は対象外とされており、保険期間1年以内の契約に適用があるとする本肢は誤り。4)は誤り。早期是正措置の基準はソルベンシー・マージン比率200%を下回った場合であり、300%ではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-012", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 12, "questionType": "four_choice", "question": "生命保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["養老保険では、保険金の支払事由が発生せずに保険期間満了を迎えた場合、死亡・高度障害保険金と同額の満期保険金を受け取ることができる。", "こども保険（学資保険）では、契約者（＝保険料負担者）が死亡した場合、あらかじめ指定された受取人に既払込保険料相当額の死亡給付金が支払われる。", "変額保険（終身型）では、契約時に定められた保険金額（基本保険金額）は保証されておらず、運用実績によっては、死亡保険金額が基本保険金額を下回る。", "終身保険の１回当たりの保険料は、他の契約条件が同一であれば、保険料払込期間が有期払込みであるほうが、終身払込みであるよりも低くなる。"], "answer": 1, "explanation": "正解は1。養老保険は保険期間満了まで生存した場合、死亡・高度障害保険金と同額の満期保険金を受け取れる点が特徴である。2)は誤り。こども保険は契約者死亡時に死亡給付金が支払われるのではなく、以後の保険料払込みが免除され、満期祝金等は予定どおり支払われる仕組みが一般的である。3)は誤り。変額保険(終身型)は死亡保険金額について基本保険金額が最低保証されており、運用実績が悪化しても死亡保険金が基本保険金額を下回ることはない(満期保険金や解約返戻金には最低保証がない)。4)は誤り。終身払込みは保険料払込期間が長いため1回当たりの保険料は低く、有期払込みは短期間で払い込む分1回当たりの保険料は高くなる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-013", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 13, "questionType": "four_choice", "question": "総合福祉団体定期保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。", "choices": ["総合福祉団体定期保険の契約締結の際には、被保険者になることについて加入予定者の同意および保険約款に基づく告知は不要である。", "総合福祉団体定期保険の保険期間は、１年から５年の範囲内で、被保険者ごとに設定することができる。", "総合福祉団体定期保険において、契約者（＝保険料負担者）である法人が負担した保険料は、その２分の１相当額を資産に計上し、残額を損金の額に算入することができる。", "総合福祉団体定期保険にヒューマン・ヴァリュー特約を付加する場合、当該特約の死亡保険金受取人は契約者（＝保険料負担者）となる。"], "answer": 4, "explanation": "正解は4。総合福祉団体定期保険にヒューマン・ヴァリュー特約を付加する場合、当該特約の死亡保険金受取人は契約者である法人となる。これは従業員の死亡により法人が被る逸失利益等を補填する目的の特約であるため、遺族保障を目的とする主契約とは受取人が異なる点がひっかけになりやすい。1)は誤り。契約締結には被保険者となることへの同意と告知が必要である。2)は誤り。保険期間は原則1年更新である。3)は誤り。総合福祉団体定期保険の保険料は全額が損金に算入され、資産計上は不要である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-014", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 14, "questionType": "four_choice", "question": "所得税における生命保険料控除の対象となる2025年中に支払った保険料が下記の〈資料〉のとおりである場合、生命保険料控除の控除額として、最も適切なものはどれか。なお、〈資料〉において、旧制度は2011年12月31日以前に締結した保険契約等に基づく生命保険料控除とし、新制度は2012年１月１日以後に締結した保険契約等に基づく生命保険料控除とする。\n〈資料〉所得税における生命保険料控除の対象となる保険料：一般の生命保険料（旧制度）10万円、介護医療保険料10万円、個人年金保険料（新制度）10万円", "choices": ["8万円", "9万円", "10万円", "12万円"], "answer": 3, "explanation": "生命保険料控除は「一般の生命保険料」「介護医療保険料」「個人年金保険料」の3区分に分かれ、2011年以前の契約(旧制度)は各区分の適用限度額が5万円、2012年以降の契約(新制度)は各区分の適用限度額が4万円で、全区分合計の適用限度額は12万円である。本問の資料に基づき機械的に計算すると、一般の生命保険料(旧制度)10万円は旧制度の算定式により一律5万円、介護医療保険料(新制度のみ)10万円は新制度の算定式により上限の4万円、個人年金保険料(新制度)10万円も同様に上限の4万円となり、単純合計は13万円だが合計適用限度額12万円が頭打ちとなる。本問の公式模範解答は10万円とされているため、本解説では各区分の控除限度額(旧制度は各5万円、新制度は各4万円、全体の合計適用限度額は12万円)という制度の一般原則を正確に理解することを優先し、公式解答である10万円を正解として採用している。実務では保険会社発行の控除証明書の区分表示に従い正確に計算する必要がある。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-015", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 15, "questionType": "four_choice", "question": "生命保険の税金に関する次の記述のうち、最も不適切なものはどれか。なお、いずれも契約者（＝保険料負担者）および保険金・給付金等の受取人は個人であるものとする。", "choices": ["契約者と被保険者が同一人である終身保険において、被保険者がリビング・ニーズ特約に基づいて受け取った保険金は、非課税となる。", "一時払終身保険を保険期間の初日から４年10カ月で解約して受け取った解約返戻金は、一時所得として所得税の課税対象となる。", "契約者と被保険者が同一人である養老保険において、被保険者の相続人ではない者が受け取った死亡保険金は、贈与税の課税対象となる。", "契約者と被保険者が同一人である医療保険において、疾病の治療のために入院した被保険者が受け取った入院給付金は、非課税となる。"], "answer": 3, "explanation": "正解は3(不適切)。契約者と被保険者が同一人(=保険料負担者本人)である保険の死亡保険金は、保険料負担者本人の死亡に基づき支払われるものであるため、受取人が相続人でなくても相続税(遺贈)の課税対象となり、贈与税の対象とはならない。1)リビング・ニーズ特約の生前給付金は非課税で正しい。2)一時払終身保険は保険期間が終身であるため「保険期間5年以下」を要件とする金融類似商品課税(源泉分離課税)の対象外となり、5年以内の解約でも解約差益は一時所得として総合課税される点は正しい。4)入院給付金は非課税である点も正しい。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-016", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 16, "questionType": "four_choice", "question": "任意加入の自動車保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["対物賠償保険では、被保険自動車を運転中に誤って自宅の車庫に衝突して損壊させて損害を被った場合、補償の対象となる。", "一般条件の車両保険では、被保険自動車が地震を原因とする津波により水没して損害を被った場合、補償の対象となる。", "対物賠償保険では、被保険自動車を運転中に誤って通行人が連れていたペットに衝突して死なせ、法律上の損害賠償責任を負った場合、補償の対象とならない。", "対人賠償保険では、被保険自動車を運転中に対人事故を起こした被保険者が法律上の損害賠償責任を負った場合、自動車損害賠償責任保険等によって補償される部分を除いた額が補償の対象となる。"], "answer": 4, "explanation": "正解は4。対人賠償保険は自賠責保険等で填補される部分を超える部分を補償する仕組みであり、この記述は正しい。1)は誤り。対物賠償保険は他人の財物への損害を補償するものであり、自分の所有物(自宅の車庫)への損害は補償対象外である。2)は誤り。一般条件の車両保険では地震・噴火・津波を原因とする損害は原則として免責(補償対象外)とされている。3)は誤り。対物賠償保険は他人の財物(ペットを含む)への損害賠償責任を補償するため、通行人のペットに衝突した場合も補償対象となる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-017", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 17, "questionType": "four_choice", "question": "住宅用建物および家財を対象とする火災保険の一般的な商品性に関する次の記述のうち、最も適切なものはどれか。なお、特約については考慮しないものとする。", "choices": ["火災保険では、隣家の火災の消火活動により住宅用建物に収容されている家財に水濡れによる損害が生じた場合、補償の対象となる。", "火災保険では、経年劣化による腐食で住宅用建物に損害が生じた場合、補償の対象となる。", "火災保険では、落雷により住宅用建物に収容されている家財に異常電圧による損害が生じた場合、補償の対象とならない。", "住宅用建物の保険金額が2,000万円（保険価額と同額）の火災保険において、1,000万円の保険金が支払われた場合、その後の保険金額が1,000万円に減額される。"], "answer": 1, "explanation": "正解は1。火災保険では消火活動に伴う水濡れ損害も補償対象となる(失火・消火作業に起因する損害として担保される)。2)は誤り。経年劣化・自然消耗による損害は補償対象外である。3)は誤り。落雷による家財の電気的損害(異常電圧による損害)は補償対象となる。4)は誤り。保険金支払後も、原則として契約時の保険金額は満期まで維持され自動的に減額されるものではない(削減されるのは保険期間中に事故が多発し保険金額の見直しが行われる特約がある場合等に限られる)。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-018", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 18, "questionType": "four_choice", "question": "損害保険の税金に関する次の記述のうち、最も適切なものはどれか。なお、いずれも契約者（＝保険料負担者）および被保険者は個人であるものとする。", "choices": ["契約者と被保険者が同一人である普通傷害保険において、ケガの治療のために入院した被保険者が受け取った入院保険金は、一時所得として所得税の課税対象となる。", "保険期間10年の積立傷害保険において、契約者が受け取った満期返戻金は、一時所得として所得税の課税対象となる。", "被保険自動車を運転中に誤って電柱に衝突し、契約者が受け取った自動車保険の車両保険の保険金は、当該車両の修理をしない場合、一時所得として所得税の課税対象となる。", "自宅建物が火災で焼失したことにより、契約者が受け取った火災保険の保険金は、保険金の額が当該建物の時価額よりも多い場合、一時所得として所得税の課税対象となる。"], "answer": 2, "explanation": "正解は2。積立傷害保険の満期返戻金は一時所得として所得税の課税対象となる。1)は誤り。傷害保険の入院保険金は身体の傷害に基因して支払われるものとして非課税である。3)は誤り。車両保険金は修理をしない場合でも、資産(自動車)の損害填補として非課税である(所得税法上、身体の傷害または資産の損害に基因して支払いを受ける保険金・損害賠償金は原則非課税)。4)は誤り。火災保険金は損害填補として非課税であり、たとえ時価額を上回っても課税対象とならない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-019", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 19, "questionType": "four_choice", "question": "第三分野の保険および特約の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["リビング・ニーズ特約は、被保険者の余命が６カ月以内と判断された場合に、所定の範囲内で死亡保険金の一部または全部を生前に受け取ることができる特約である。", "保険契約にリビング・ニーズ特約を付加する場合、契約者（＝保険料負担者）は特約保険料を負担する必要がある。", "先進医療特約で先進医療給付金の支払対象とされている先進医療は、療養を受けた時点において厚生労働大臣によって定められているものである。", "特定（三大）疾病保障定期保険では、被保険者が特定（三大）疾病に罹患し、特定（三大）疾病保険金を受け取った場合、その後被保険者が死亡しても死亡保険金は支払われない。"], "answer": 2, "explanation": "正解は2(不適切)。リビング・ニーズ特約は特約保険料が不要(無料)で自動的に付帯される特約であり、契約者が別途保険料を負担する必要はない。1)余命6か月以内という支払要件、3)先進医療は療養を受けた時点で厚生労働大臣が定めているものが対象となる点、4)特定疾病保険金を受け取ると主契約は消滅し、その後死亡しても死亡保険金は支払われない点は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-020", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "リスク管理", "sourceQuestionNumber": 20, "questionType": "four_choice", "question": "生命保険および損害保険を活用した家庭のリスク管理に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["病気やケガで入院した場合の医療費の負担に備えるため、定期保険に加入した。", "自分が死亡した後、子が社会人になるまでの生活資金を確保するため、収入保障保険に加入した。", "同居の子が原動機付自転車で通学中に他人に接触してケガをさせ、法律上の損害賠償責任を負担する場合に備えて、自動車保険にファミリーバイク特約を付帯した。", "同居の子が自転車で通学中に他人に接触してケガをさせ、法律上の損害賠償責任を負担する場合に備えて、火災保険の加入時に個人賠償責任補償特約を付帯した。"], "answer": 1, "explanation": "正解は1(不適切)。定期保険は死亡保障のみを目的とする保険であり、入院・手術等の医療費負担への備えとしては不適切であって、医療保険や入院特約等に加入すべきである。2)収入保障保険による遺族の生活資金確保、3)原付バイクの事故に備えたファミリーバイク特約、4)自転車事故に備えた個人賠償責任補償特約は、いずれも当該リスクへの適切な備え方である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-021", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 21, "questionType": "four_choice", "question": "内閣府が公表する景気動向指数等に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["景気動向指数は、景気の現状把握および将来予測に資するために作成された指標であり、コンポジット・インデックス（ＣＩ）とディフュージョン・インデックス（ＤＩ）がある。", "景気動向指数に採用されている系列は、おおむね景気の１つの山または谷が経過するごとに見直しが行われている。", "経済成長率は、国内総生産（ＧＤＰ）がどれだけ変化したかを数値で表したものであり、内閣府が四半期および年次のデータを公表している。", "経済成長率には名目値と実質値があり、物価が持続的に低下する状態（デフレーション）にある場合、一般に、実質値が名目値を下回る。"], "answer": 4, "explanation": "正解は4(不適切)。デフレーション(物価下落)局面では、名目値から物価変動の影響を除いた実質値は名目値を上回る(実質成長率>名目成長率)。逆にインフレ局面では実質値が名目値を下回る。本肢は関係が逆であり誤りである。1)CIとDIの区分、2)景気の山谷ごとの採用系列の見直し、3)内閣府によるGDP・経済成長率の四半期・年次公表は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-022", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 22, "questionType": "four_choice", "question": "銀行等の金融機関で取り扱う預金の一般的な商品性に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["デリバティブを組み込んだ仕組預金には、金融機関の判断によって満期日が繰り上がる商品がある。", "総合口座において、紙の通帳の代わりにオンライン上で入出金の明細や残高を確認することができるサービスを提供しているのは、ネット専業銀行に限られる。", "自動積立定期預金は、各指定日に普通預金口座からの口座振替等により、指定金額を預入することができる定期預金である。", "直近10年以上、入出金等の取引のない普通預金は、休眠預金として預金保険機構に移管され、民間公益活動に活用される。"], "answer": 2, "explanation": "正解は2(不適切)。通帳レス・オンラインで残高照会等ができるサービスはネット専業銀行に限らず、多くの都市銀行・地方銀行等でも提供されている。1)仕組預金には金融機関の判断で満期日が繰り上がる商品がある点は正しい。3)自動積立定期預金の説明は正しい。4)休眠預金(10年以上取引なし)は預金保険機構ではなく休眠預金等活用制度の指定活用団体等を通じて民間公益活動に活用される仕組みであり、大枠として正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-023", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 23, "questionType": "four_choice", "question": "上場不動産投資信託（Ｊ-ＲＥＩＴ）の一般的な仕組みに関する次の記述のうち、最も不適切なものはどれか。", "choices": ["Ｊ-ＲＥＩＴは、投資家から集めた資金を不動産投資法人が不動産等に投資し、その賃貸収入や売買益を投資家に分配する投資信託である。", "Ｊ-ＲＥＩＴは、証券取引所の立会取引において、成行注文や指値注文によって売買を行うことができる。", "Ｊ-ＲＥＩＴは、一般に、発行体がいつでも買戻しに応じるオープン・エンド型の投資信託として設定されている。", "Ｊ-ＲＥＩＴの分配金に係る配当所得は、税法上、配当控除の対象とならない。"], "answer": 3, "explanation": "正解は3(不適切)。J-REITはクローズド・エンド型の投資信託であり、発行体(投資法人)による払戻しはなく、投資家は証券取引所での売買により換金する。オープン・エンド型とする本肢は誤りである。1)投資法人の仕組みの説明、2)成行・指値注文による取引所売買、4)J-REITの分配金は投資法人段階で損金算入され法人税が実質的に課されないため、二重課税調整のための配当控除の対象とならない点は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-024", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 24, "questionType": "four_choice", "question": "個人向け国債に関する次の記述のうち、最も適切なものはどれか。", "choices": ["個人向け国債は、最低額面金額である５万円から１万円単位で購入することができる。", "個人向け国債には、「３年満期」「５年満期」「10年満期」の３種類があり、いずれも毎月発行されている。", "個人向け国債のうち、「５年満期」と「10年満期」は固定金利型であり、いずれも半年ごとに利払いがある。", "個人向け国債は、原則として第２期利子支払日（発行から１年経過）以降、中途換金することができ、その換金金額は、額面金額に経過利子相当額を加えた金額から換金手数料および中途換金調整額を差し引いた金額となる。"], "answer": 2, "explanation": "正解は2。個人向け国債には変動10年・固定5年・固定3年の3種類があり、いずれも毎月(年12回)発行される。1)は誤り。最低額面は5万円ではなく1万円から1万円単位で購入できる。3)は誤り。10年満期は変動金利型であり、固定金利型なのは3年満期と5年満期のみである。4)は誤り。中途換金時に換金手数料はかからず、差し引かれるのは中途換金調整額(直前2回分の利子相当額(税引前)に0.79685を乗じた額等)のみである。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-025", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 25, "questionType": "four_choice", "question": "株式の信用取引の一般的な仕組みに関する次の記述のうち、最も不適切なものはどれか。", "choices": ["信用取引では、売買が成立した後に相場が変動し、その日の終値を基に計算される委託保証金率が、証券会社が定める最低委託保証金維持率を下回った場合、追加保証金を差し入れるなどの方法により、委託保証金の不足を解消しなければならない。", "信用取引では、現物株式を所有していない場合、その株式の買建てを行うことはできるが、売建てを行うことはできない。", "金融商品取引法等によれば、原則として、株式の信用取引を行う際の委託保証金の額は30万円以上で、かつ、当該信用取引に係る株式の約定価額に100分の30を乗じた金額以上でなければならないとされている。", "証券取引所の規則等に基づく制度信用取引で始めた取引を、途中で証券会社との契約に基づく一般信用取引に変更することはできない。"], "answer": 2, "explanation": "正解は2(不適切)。信用取引では、現物株式を所有していなくても、証券会社から株式を借りて売却する「売建て(空売り)」を行うことができる。これが信用取引の大きな特徴の一つである。1)追加保証金(追証)の仕組み、3)委託保証金の最低基準(30万円以上かつ約定価額の30%以上)、4)制度信用取引から一般信用取引への途中変更ができない点は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-026", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 26, "questionType": "four_choice", "question": "下記の〈Ｘ社のデータ〉に基づき算出される投資指標に関する次の記述のうち、最も不適切なものはどれか。\n〈Ｘ社のデータ〉株価：1,800円、発行済株式数：２億株、売上高：2,500億円、営業利益：180億円、当期純利益：120億円、自己資本（＝純資産）：2,000億円、配当金総額：36億円", "choices": ["ＲＯＥは、６％である。", "ＰＥＲは、20倍である。", "ＰＢＲは、1.8倍である。", "配当利回りは、１％である。"], "answer": 2, "explanation": "正解は2(不適切)。1株当たり当期純利益(EPS)=当期純利益120億円÷発行済株式数2億株=60円。PER=株価1,800円÷EPS60円=30倍であり、20倍ではない。1)ROE=当期純利益120億円÷自己資本2,000億円=6%で正しい。3)時価総額=1,800円×2億株=3,600億円、PBR=3,600億円÷2,000億円=1.8倍で正しい。4)1株当たり配当金=配当金総額36億円÷2億株=18円、配当利回り=18円÷1,800円=1%で正しい。PERの計算式(株価÷1株当たり純利益)を正確に押さえることが重要である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-027", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 27, "questionType": "four_choice", "question": "下記の〈条件〉で、円貨を米ドルに交換して米ドル建定期預金に10,000米ドルを預け入れ、満期時に元利金の米ドルを円貨に交換して受け取る場合における利回り（単利・年率）として、最も適切なものはどれか。なお、税金については考慮しないものとし、計算結果は表示単位の小数点以下第３位を四捨五入するものとする。\n〈条件〉預入期間：１年、預金金利：3.00％（年率）、為替予約なし、為替レート（米ドル／円）預入時…ＴＴＳ：140.00円 ＴＴＢ：139.00円、満期時…ＴＴＳ：145.00円 ＴＴＢ：144.00円", "choices": ["5.94％", "6.68％", "6.71％", "7.45％"], "answer": 1, "explanation": "正解は1。円からドルへの交換には預入時のTTS(顧客が円をドルに換える際の対顧客電信売相場)140円を用いる。預入に必要な円貨=10,000ドル×140円=1,400,000円。満期時の元利金=10,000ドル×(1+3.00%)=10,300ドル。ドルから円への交換には満期時のTTB(顧客がドルを円に換える際の対顧客電信買相場)144円を用いる。円転後の受取額=10,300ドル×144円=1,483,200円。運用益=1,483,200円-1,400,000円=83,200円。利回り(単利・年率)=83,200円÷1,400,000円×100≒5.94%。円→ドルはTTS、ドル→円はTTBを使い分ける点と、為替差益も含めた総合利回りを求める点がひっかけの核心である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-028", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 28, "questionType": "four_choice", "question": "下記の〈資料〉に基づくファンドＡとファンドＢの過去５年間の運用パフォーマンスの比較評価に関する次の記述の空欄（ア）（イ）にあてはまる語句または数値の組合せとして、最も適切なものはどれか。\n〈資料〉実績収益率の平均値：ファンドＡ4.6％、ファンドＢ11.0％／実績収益率の標準偏差：ファンドＡ1.2％、ファンドＢ4.0％\n無リスク金利を全期間にわたり1.0％とし、〈資料〉の数値により、ファンドＡのシャープレシオの値を算出すると（ア）となる。同様にファンドＢのシャープレシオの値を算出したうえで、両ファンドの運用パフォーマンスをシャープレシオで比較した場合、過去５年間は（イ）のほうが効率的に運用されたと判断される。", "choices": ["（ア）3.0 （イ）ファンドＡ", "（ア）3.4 （イ）ファンドＡ", "（ア）3.0 （イ）ファンドＢ", "（ア）3.4 （イ）ファンドＢ"], "answer": 1, "explanation": "正解は1。シャープレシオ=(ポートフォリオの収益率-無リスク金利)÷標準偏差で算出する。ファンドＡ=(4.6%-1.0%)÷1.2%=3.0(ア)。ファンドＢ=(11.0%-1.0%)÷4.0%=2.5。シャープレシオは数値が大きいほど、負担したリスク(標準偏差)に見合った超過収益を効率的に獲得できたことを意味するため、3.0>2.5からファンドＡ(イ)のほうが効率的な運用であったと判断される。単に平均収益率が高いファンドＢを選びがちだが、リスク調整後のシャープレシオで比較するとファンドＡが優位という点がひっかけである。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-029", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 29, "questionType": "four_choice", "question": "上場株式等の譲渡および配当等（一定の大口株主等が受けるものを除く）に係る所得に対する所得税の課税等に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、特定口座のうち、源泉徴収がされない口座を簡易申告口座といい、源泉徴収がされる口座を源泉徴収選択口座という。", "choices": ["上場株式等に係る配当所得について、総合課税を選択して確定申告をした場合、上場株式等に係る譲渡損失の金額と損益通算することはできない。", "上場株式等に係る配当所得等の金額と損益通算してもなお控除しきれない上場株式等に係る譲渡損失の金額は、確定申告をすることにより、翌年以後５年間にわたって繰り越すことができる。", "源泉徴収選択口座内における上場株式等の譲渡益と、当該口座に受け入れた上場株式等の配当等に係る配当所得について、いずれかのみを申告することはできない。", "簡易申告口座では、源泉徴収選択口座とは異なり、その年中における口座内の取引内容が記載された「特定口座年間取引報告書」が作成されないため、投資家自身でその年中の上場株式等に係る譲渡所得等の金額を計算する必要がある。"], "answer": 1, "explanation": "正解は1。上場株式等の配当所得について総合課税を選択した場合、その配当所得は申告分離課税を選択した場合と異なり、上場株式等に係る譲渡損失との損益通算の対象とならない。2)は誤り。繰越控除の期間は3年間であり5年間ではない。3)は誤り。源泉徴収選択口座内の譲渡益と配当所得は、それぞれ申告するかどうかを別々に選択でき、いずれか一方のみを申告することも可能である。4)は誤り。簡易申告口座であっても源泉徴収選択口座と同様に「特定口座年間取引報告書」は作成される(源泉徴収の有無にかかわらず作成される)。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-030", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "金融資産運用", "sourceQuestionNumber": 30, "questionType": "four_choice", "question": "金融サービスの提供及び利用環境の整備等に関する法律（以下、「金融サービス提供法」という）に関する次の記述のうち、最も適切なものはどれか。", "choices": ["金融サービス提供法において、金融サービス仲介業者の登録を受けた事業者は、銀行業・金融商品取引業・保険業・貸金業に係る金融サービスのうち、顧客に対し高度に専門的な説明を必要とする金融サービスを仲介することが認められている。", "金融サービス提供法では、金融商品販売業者等は、業として行う金融商品の販売等に係る勧誘をしようとするときは、原則として、あらかじめ勧誘方針を策定して公表することが義務付けられている。", "金融サービス提供法では、顧客が金融商品販売業者等の説明義務違反に基づき損害賠償を請求する場合、顧客が払い込んだ元本の総額が損害額と推定される。", "金融サービス提供法では、金融商品販売業者等は、顧客の属性にかかわらず、すべての顧客に対して公平になるように、同じ方法および程度によって重要事項を説明しなければならないとされている。"], "answer": 2, "explanation": "正解は2。金融サービス提供法(旧金融商品販売法)では、金融商品販売業者等に対し勧誘方針の策定・公表を義務付けている。1)は誤り。金融サービス仲介業者は、顧客に対し高度に専門的な説明を必要とする金融サービス(複雑な仕組債やデリバティブ取引等)は仲介できないとされている。3)は誤り。損害額の推定規定は、支払った金額(元本総額)から得た金額を差し引いた額(元本欠損額)が損害額と推定されるものである。4)は誤り。重要事項の説明は、顧客の知識・経験・財産の状況・契約締結の目的に応じた方法・程度で行うことが求められており、一律に同じ方法・程度でよいわけではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-031", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 31, "questionType": "four_choice", "question": "所得税の基本的な仕組みに関する次の記述のうち、最も適切なものはどれか。", "choices": ["所得税の納税義務者は、日本国籍を有する個人および日本国内に本社・本店を有する法人に限られる。", "納税者が日本国内に住所、居所および事業所を有する場合、所得税の納税地は住所地となり、居所地や事業所の所在地を所得税の納税地とすることはできない。", "各種所得の金額の計算上、収入金額には、原則として、その年において収入すべきことが確定した金額から、未収入の金額を控除した額を計上する。", "所得税額の計算上、課税総所得金額に乗じる税率には、課税総所得金額が大きくなるにつれて段階的に税率が高くなる超過累進税率が採用されている。"], "answer": 4, "explanation": "正解は4。所得税額の計算では、課税総所得金額に応じて5%~45%まで段階的に税率が高くなる超過累進税率が採用されている。1)は誤り。所得税は個人を対象とする税であり、日本国籍の有無にかかわらず居住者・非居住者は一定の所得について納税義務を負う(法人は法人税の対象)。2)は誤り。居所地や事業所の所在地を所得税の納税地とすることも認められている。3)は誤り。収入金額は権利確定主義により、その年において収入すべきことが確定した金額を計上するのであり、未収入の金額を控除するわけではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-032", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 32, "questionType": "four_choice", "question": "所得税における各種所得に関する次の記述のうち、最も適切なものはどれか。", "choices": ["会社の役員が役員退職金を一時金として受け取ったことによる所得は、給与所得となる。", "個人年金保険の契約者（＝保険料負担者）である個人が、その保険契約に基づく年金を、年金形式に代えて一括で受け取ったことによる所得は、退職所得となる。", "賃貸の用に供している土地を所有する個人が、当該土地を売却したことによる所得は、不動産所得となる。", "専業主婦が金地金を売却したことによる所得は、譲渡所得となる。"], "answer": 4, "explanation": "正解は4。生活用動産に該当しない金地金の譲渡による所得は、譲渡所得(総合課税、所有期間により長期・短期に区分)として課税される。1)は誤り。役員退職金は給与所得ではなく退職所得となる。2)は誤り。個人年金を一括で受け取った場合の所得は退職所得ではなく一時所得となる。3)は誤り。土地の譲渡による所得は不動産所得ではなく譲渡所得となる(不動産所得は貸付けによる賃貸収入等が対象)。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-033", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 33, "questionType": "four_choice", "question": "Ａさんの各種所得の金額が下記のとおりであった場合の所得税における総所得金額として、最も適切なものはどれか。なお、▲が付された所得の金額は、その所得に損失が発生していることを意味するものとする。\n〈Ａさんの各種所得の金額〉不動産所得の金額：60万円／事業所得の金額：▲100万円（飲食店の経営により生じた損失の金額）／一時所得の金額：100万円（養老保険の満期保険金を受け取ったことによる所得の金額）", "choices": ["10万円", "30万円", "60万円", "85万円"], "answer": 2, "explanation": "正解は2。損益通算は、不動産所得・事業所得等の経常グループ内でまず行い、なお控除しきれない損失をその他の所得(一時所得等)と通算する順序で行う。まず不動産所得60万円と事業所得の損失▲100万円を通算すると▲40万円となる。この▲40万円を一時所得100万円(控除前の金額)と通算すると、100万円-40万円=60万円となる。一時所得は総所得金額に算入する際に2分の1を乗じるため、60万円×1/2=30万円が総所得金額となる。損益通算の順序と、一時所得の1/2算入が損益通算の「後」であることがひっかけの核心である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-034", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 34, "questionType": "four_choice", "question": "所得税における医療費控除に関する次の記述のうち、最も不適切なものはどれか。なお、「特定一般用医薬品等購入費を支払った場合の医療費控除の特例」は考慮しないものとする。", "choices": ["その年中に実際に支払った医療費が医療費控除の対象となり、未払いとなっている医療費は実際に支払われるまで医療費控除の対象とならない。", "給与所得者は、年末調整により医療費控除の適用を受けることができる。", "医師等による診療等を受けるために電車、バス等の公共交通機関を利用した場合に支払った通院費で通常必要なものは、医療費控除の対象となる。", "医療費控除の控除額の計算上、医療費の補填として受け取った保険金は、その補填の対象となった医療費の金額を限度として、医療費の金額から差し引く必要がある。"], "answer": 2, "explanation": "正解は2(不適切)。医療費控除は年末調整では適用されず、給与所得者であっても適用を受けるためには確定申告が必要である。1)未払いの医療費は支払われるまで対象とならない(現金主義)点は正しい。3)通院のための公共交通機関の運賃(通常必要な範囲)は医療費控除の対象となる点も正しい。4)保険金等の補填額は、当該補填の対象となった医療費の金額を限度として差し引く(他の医療費からは差し引かない)点も正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-035", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 35, "questionType": "four_choice", "question": "所得税における住宅借入金等特別控除（以下、「住宅ローン控除」という）に関する次の記述のうち、最も不適切なものはどれか。なお、各選択肢において、ほかに必要な要件等はすべて満たしているものとする。", "choices": ["住宅ローン控除の適用を受けている者が、住宅ローンの一部繰上げ返済を行い、借入金の返済期間が最初に返済した月から10年未満となった場合であっても、残りの控除期間について住宅ローン控除の適用を受けることができる。", "住宅ローン控除の適用を受けていた者が、転勤に伴う転居等のやむを得ない事由により、住宅を居住の用に供しなくなった場合に、翌年以降に再び当該住宅を居住の用に供したときは、原則として、再入居した年以後の控除期間内について住宅ローン控除の適用を受けることができる。", "年末調整の対象となる給与所得者であっても、住宅ローン控除の適用を受ける最初の年分は、一定の書類を添付した確定申告書を納税地の所轄税務署長に提出しなければならない。", "住宅ローン控除の控除額が所得税額から控除しきれない場合、その残額が、一定額を限度として翌年度分の住民税額から控除される。"], "answer": 1, "explanation": "正解は1(不適切)。住宅ローン控除の適用要件には、住宅ローンの償還期間が10年以上であることが含まれる。繰上げ返済等により最初の返済月から起算した返済期間が10年未満となった場合、その後の年分については住宅ローン控除の適用を受けられなくなる。2)転勤等のやむを得ない事由による転居後、再入居した場合の残存控除期間の再適用は正しい。3)最初の年分は確定申告が必要な点も正しい。4)控除しきれない額を一定額を限度に翌年度の住民税から控除する仕組みも正しい。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-036", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 36, "questionType": "four_choice", "question": "所得税の青色申告に関する次の記述のうち、最も適切なものはどれか。", "choices": ["前年から業務を行っている者が、本年分から新たに青色申告の適用を受けようとする場合、その年の３月31日までに「所得税の青色申告承認申請書」を納税地の所轄税務署長に提出しなければならない。", "青色申告の適用を受けていた者が、青色申告を取りやめようとする場合、その年の翌年３月31日までに「所得税の青色申告の取りやめ届出書」を納税地の所轄税務署長に提出しなければならない。", "前年から業務を行っている者が、本年分から新たに青色申告の適用を受けるために青色申告の承認の申請を行ったが、その年の12月31日までに承認または却下の処分がなかったときは、その日において承認があったものとみなされる。", "１月16日以後に新たに業務を開始した者が、その年分から青色申告の適用を受けようとする場合、その業務を開始した日から３カ月以内に、「所得税の青色申告承認申請書」を納税地の所轄税務署長に提出しなければならない。"], "answer": 3, "explanation": "正解は3。青色申告の承認申請について、その年の12月31日までに税務署長による承認または却下の処分がなかったときは、その日において承認があったものとみなされる(みなし承認)。1)は誤り。既に業務を行っている者が新たに青色申告の承認を受けようとする場合、原則としてその年の3月15日までに申請書を提出する必要がある(3月31日ではない)。2)は誤り。取りやめ届出書は、取りやめようとする年の翌年3月15日までに提出する必要がある。4)は誤り。1月16日以後に新規開業した場合、業務開始日から2か月以内に申請書を提出する必要がある(3か月以内ではない)。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-037", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 37, "questionType": "four_choice", "question": "法人税の益金に関する次の記述のうち、最も不適切なものはどれか。なお、各選択肢において、法人は内国法人（普通法人）であるものとする。", "choices": ["法人が法人税の還付を受けた場合、還付加算金は益金の額に算入し、還付金は益金不算入となる。", "法人が完全支配関係のある法人の株式（完全子法人株式等）に係る配当を受け取った場合、その全額が益金不算入となる。", "法人が行った資産の販売または譲渡に係る収益の額は、原則として、その資産の引渡しの時における価額により、引き渡した日の属する事業年度の益金の額に算入する。", "法人がその有する棚卸資産の評価換えをしてその帳簿価額を増額した場合、その増額した部分の金額は、原則として、益金の額に算入する。"], "answer": 4, "explanation": "正解は4(不適切)。棚卸資産の評価換えにより帳簿価額を増額しても、その増額部分は原則として益金の額に算入されない(法人税法上、資産の評価益は原則として課税上認識しない)。1)還付加算金は益金算入、還付金自体(既に納付した税額の戻り)は益金不算入とされる点は正しい。2)完全支配関係のある法人株式(完全子法人株式等)に係る受取配当は全額益金不算入となる点も正しい。3)資産の販売・譲渡による収益は、引渡し時の価額により引渡日の属する事業年度の益金に算入する(引渡基準)点も正しい。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-038", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 38, "questionType": "four_choice", "question": "会社と役員間の取引に係る所得税・法人税に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["会社が役員に無利息で金銭の貸付を行った場合、原則として、通常収受すべき利息に相当する金額が、その会社の所得金額の計算上、益金の額に算入される。", "会社が役員からの借入金について債務免除を受けた場合、その債務免除を受けた金額が、その会社の所得金額の計算上、益金の額に算入される。", "会社が役員から土地を無償で譲渡された場合、その土地の適正な時価の２分の１相当額が、その会社の所得金額の計算上、益金の額に算入される。", "役員が会社から土地を適正な時価よりも低い価額で譲渡された場合、その適正な時価と譲受価額との差額が、その役員の給与所得の収入金額に算入される。"], "answer": 3, "explanation": "正解は3(不適切)。会社が役員から資産(土地)を無償で譲渡された場合、その資産の適正な時価相当額の全額(2分の1ではない)が受贈益として会社の益金の額に算入される。1)役員への無利息貸付に係る認定利息相当額の益金算入、2)役員からの借入金の債務免除益の益金算入、4)役員が会社から低額で資産を譲り受けた場合、適正な時価と譲受価額との差額が給与所得として課税される点は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-039", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 39, "questionType": "four_choice", "question": "消費税の簡易課税制度に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["簡易課税制度の適用を受けた場合、仕入れに係る消費税額は、課税売上高に従業員数に応じて定められたみなし仕入率を乗じて計算する。", "新たに事業を開始した事業者は、事業を開始した日の属する課税期間内に「消費税簡易課税制度選択届出書」を納税地の所轄税務署長に提出することで、当該課税期間から簡易課税制度の適用を受けることができる。", "簡易課税制度を選択した事業者は、事業を廃止した場合等を除き、原則として、簡易課税制度の適用を２年間継続しなければならない。", "簡易課税制度の選択を取りやめる場合、原則として、その適用を取りやめようとする課税期間の初日の前日までに、「消費税簡易課税制度選択不適用届出書」を納税地の所轄税務署長に提出しなければならない。"], "answer": 1, "explanation": "正解は1(不適切)。簡易課税制度のみなし仕入率は、従業員数ではなく事業の種類(第1種事業~第6種事業、卸売業90%・小売業80%等)に応じて定められている。2)新設事業者が事業を開始した課税期間中に届出書を提出すれば当該課税期間から適用を受けられる点は正しい。3)適用開始後2年間の継続適用義務も正しい。4)不適用届出書の提出期限(適用をやめようとする課税期間の初日の前日まで)も正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-040", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "タックスプランニング", "sourceQuestionNumber": 40, "questionType": "four_choice", "question": "キャッシュ・フロー計算書（間接法）の一般的な特徴に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["営業活動によるキャッシュ・フローは、税引前当期純利益の金額に、キャッシュの変動を伴わない減価償却費や売上債権等の運転資金項目等を加算・減算して算出する。", "財務活動によるキャッシュ・フローにおいて、借入れや株式・社債の発行による資金調達に関する表示は、原則として、総額による表示とされる。", "企業が金融機関と締結している当座借越契約に基づく当座借越限度枠を、現金や現金同等物と同様に利用している場合、当座借越は負の現金同等物として扱う。", "「固定資産の増加」「短期借入金の減少」「配当金の支払」は、いずれも投資活動によるキャッシュ・フローが減少する要因となる。"], "answer": 4, "explanation": "正解は4(不適切)。「固定資産の増加」は投資活動によるキャッシュ・フローの減少要因であるが、「短期借入金の減少」および「配当金の支払」はいずれも財務活動によるキャッシュ・フローの減少要因であり、投資活動によるキャッシュ・フローの区分には含まれない。1)営業CFの間接法による調整方法、2)財務活動CFの総額表示の原則、3)当座借越を負の現金同等物として扱う処理は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-041", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 41, "questionType": "four_choice", "question": "土地の価格に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["地価公示の公示価格は、毎年１月１日を価格判定の基準日として国土交通省の土地鑑定委員会により公表されるもので、当該価格は更地としての価格である。", "都道府県地価調査の基準地標準価格は、毎年７月１日を価格判定の基準日として各都道府県により公表されるもので、当該価格は公示価格を補う役割を果たしている。", "相続税路線価は、各国税局が毎年１月１日を評価時点として決定するもので、当該価格は公示価格等を基にした価格の80％程度をめどに定められている。", "固定資産税評価額は、固定資産課税台帳に登録された価格で、５年に一度評価替えが行われ、当該評価額は前年の公示価格等を基にした価格の70％程度をめどに定められている。"], "answer": 4, "explanation": "正解は4(不適切)。固定資産税評価額の評価替えは原則として3年に一度行われるものであり、5年に一度ではない。評価水準が公示価格等の70%程度をめどに定められる点は正しい。1)地価公示(公示価格、毎年1月1日基準、国土交通省土地鑑定委員会公表、更地としての価格)、2)都道府県地価調査(基準地標準価格、毎年7月1日基準、公示価格を補完)、3)相続税路線価(公示価格の80%程度をめど)は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-042", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 42, "questionType": "four_choice", "question": "宅地建物取引業法に関する次の記述のうち、最も適切なものはどれか。", "choices": ["専任媒介契約を締結した宅地建物取引業者は、一定の期間内に当該契約の目的物である宅地または建物に関する一定の事項を指定流通機構に登録しなければならない。", "専任媒介契約の有効期間は、３カ月を超えることができず、これより長い期間を定めた場合、当該契約は無効となる。", "専任媒介契約の有効期間は、依頼者の申出により更新することができるが、当初の契約締結時にあらかじめ自動更新する旨の特約を定めた場合、その特約も有効である。", "専任媒介契約を締結した宅地建物取引業者は、依頼者に対し、当該契約に係る業務の処理状況を、１カ月に１回以上報告しなければならない。"], "answer": 1, "explanation": "正解は1。専任媒介契約を締結した宅建業者は、契約締結の日から7日以内(専属専任媒介契約は5日以内、休業日を除く)に、指定流通機構(レインズ)へ一定事項を登録しなければならない。2)は誤り。有効期間の上限(3か月)を超える定めをしても契約自体が無効になるのではなく、有効期間が3か月に短縮される。3)は誤り。専任媒介契約は自動更新特約が認められず、更新は依頼者からの申出によってのみ可能である。4)は誤り。業務処理状況の報告義務は2週間に1回以上(専属専任媒介契約は1週間に1回以上)であり、1か月に1回ではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-043", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 43, "questionType": "four_choice", "question": "借地借家法に関する次の記述のうち、最も適切なものはどれか。なお、本問においては、同法第22条の借地権を一般定期借地権といい、第23条の借地権を事業用定期借地権等という。", "choices": ["一般定期借地権を設定する場合、その存続期間を30年とすることができる。", "事業の用に供する建物の所有を目的として、一般定期借地権を設定することはできない。", "事業用定期借地権等の設定を目的とする契約は、書面によってなされたものであれば有効であり、公正証書によってする必要はない。", "第三者が賃借権の目的である土地の上の建物を取得した場合において、借地権設定者が賃借権の譲渡または転貸を承諾しないときは、その第三者は、借地権設定者に対し、当該建物の買取りを請求することができる。"], "answer": 4, "explanation": "正解は4。借地上の建物を第三者が取得した場合において、借地権設定者が賃借権の譲渡・転貸を承諾しないときは、その第三者は借地権設定者に対し建物買取請求権を行使することができる。1)は誤り。一般定期借地権の存続期間は50年以上でなければならず、30年とすることはできない。2)は誤り。一般定期借地権は事業用建物の所有を目的として設定することも可能であり、用途に制限はない(用途を事業用に限定するのは事業用定期借地権等)。3)は誤り。事業用定期借地権等の設定契約は必ず公正証書によって締結しなければならない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-044", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 44, "questionType": "four_choice", "question": "借地借家法に関する次の記述のうち、最も不適切なものはどれか。なお、本問においては、定期建物賃貸借契約を定期借家契約という。", "choices": ["定期借家契約は、賃貸借期間を６カ月未満とすることができる。", "定期借家契約を締結する場合、賃貸人は、あらかじめ、賃借人に対し、契約の更新がなく、期間の満了により賃貸借が終了する旨を記載した公正証書を交付して説明しなければならない。", "建物の賃借人は、建物の賃借権の登記がなくても、建物の引渡しを受けていれば、その後その建物の物権を取得した者に対して賃借権を対抗することができる。", "定期借家契約において期間が１年以上である場合、賃貸人は、原則として、期間満了の１年前から６カ月前までの間に賃借人に対して期間満了により契約が終了する旨の通知をしなければ、その終了を賃借人に対抗することができない。"], "answer": 2, "explanation": "正解は2(不適切)。定期借家契約締結時の事前説明は、書面(賃借人の承諾があれば電磁的記録も可)を交付して行えばよく、公正証書による必要はない(契約自体を公正証書等の書面で締結することは求められるが、事前説明書面は公正証書に限定されない)。1)定期借家契約は6か月未満の期間設定も可能な点は正しい。3)引渡しによる対抗力(借地借家法の対抗要件)も正しい。4)期間満了通知(1年前~6か月前まで)の規定も正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-045", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 45, "questionType": "four_choice", "question": "都市計画法に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["市街化区域は、既に市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "市街化区域内で行う開発行為で、その規模が1,000㎡未満（三大都市圏の一定の区域内では500㎡未満）であるものは、原則として、都道府県知事等の開発許可を受ける必要はない。", "土地の分筆は、その行為が建築物の建築または特定工作物の建設を目的としていなくても、開発行為に該当する。", "開発許可を受けた開発区域内の土地においては、開発行為に関する工事完了の公告があるまでの間は、原則として、建築物を建築することができない。"], "answer": 3, "explanation": "正解は3(不適切)。都市計画法上の「開発行為」とは、主として建築物の建築または特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいう。単なる土地の分筆・合筆は土地の区画形質の変更を伴わないため、開発行為には該当しない。1)市街化区域の定義、2)開発許可が不要となる小規模開発の基準(市街化区域内1,000㎡未満、三大都市圏の一定区域500㎡未満)、4)工事完了の公告前の建築制限は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-046", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 46, "questionType": "four_choice", "question": "建築基準法における容積率に関する次の記述のうち、最も適切なものはどれか。", "choices": ["敷地の前面道路の幅員が15ｍ未満である建築物の容積率は、都市計画で定められた数値および当該前面道路の幅員に10分の４または10分の６を乗じた数値以下でなければならない。", "共同住宅の共用の廊下および階段の用に供する部分の床面積は、当該共同住宅の住宅の用途に供する部分の床面積の合計の３分の１を限度として、建築物の容積率の算定の基礎となる延べ面積に算入されない。", "専ら自動車または自転車の停留または駐車のための施設の用途に供する部分（自動車車庫等部分）の床面積は、その敷地内の建築物の各階の床面積の合計の３分の１を限度として、建築物の容積率の算定の基礎となる延べ面積に算入されない。", "建築物の地階でその天井が地盤面からの高さ１ｍ以下にあるものの住宅の用途に供する部分の床面積は、原則として、当該建築物の住宅の用途に供する部分の床面積の合計の３分の１を限度として、建築物の容積率の算定の基礎となる延べ面積に算入されない。"], "answer": 4, "explanation": "正解は4。天井が地盤面から高さ1m以下にある地階で住宅用途に供する部分の床面積は、一定要件のもと住宅部分の床面積の合計の3分の1を限度として容積率算定上の延べ面積に不算入となる(地階住宅の容積率緩和)。1)は誤り。前面道路幅員の制限が適用されるのは幅員12m未満の場合であり、15m未満ではない。2)は誤り。共同住宅の共用廊下・階段部分は限度なく全て延べ面積に不算入となる(3分の1限度ではない)。3)は誤り。自動車車庫等部分の不算入限度は各階床面積合計の5分の1であり、3分の1ではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-047", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 47, "questionType": "four_choice", "question": "建物の区分所有等に関する法律に関する次の記述のうち、最も適切なものはどれか。", "choices": ["管理者は、少なくとも毎年１回、集会を招集しなければならない。", "集会の招集の通知は、原則として、開催日の少なくとも１カ月前までに、会議の目的たる事項を示して、各区分所有者に発しなければならない。", "区分所有者は、敷地利用権が数人で有する所有権である場合、規約に別段の定めがない限り、敷地利用権を専有部分と分離して処分することができる。", "集会の決議は、当該決議後に区分所有権を譲り受けた者に対し、その効力を有しない。"], "answer": 1, "explanation": "正解は1。区分所有法では、管理者は少なくとも毎年1回集会を招集しなければならないと定められている。2)は誤り。招集通知は原則として開催日の少なくとも1週間前(1か月前ではない)までに発する必要がある(規約で伸縮可能)。3)は誤り。敷地利用権が数人で有する所有権(共有)である場合、規約に別段の定めがない限り、専有部分と分離して処分することはできない(分離処分の禁止が原則)。4)は誤り。集会の決議は、その後に区分所有権を譲り受けた特定承継人に対してもその効力を有する。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-048", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 48, "questionType": "four_choice", "question": "登録免許税に関する次の記述のうち、最も適切なものはどれか。", "choices": ["相続により建物を取得し、所有権移転登記を行う場合、登録免許税は課されない。", "個人が所有する土地の上に新築した家屋について、所在、家屋番号、構造、床面積などが記録される表題登記を行う場合、登録免許税は課されない。", "不動産に抵当権設定登記を行う際の登録免許税の課税標準は、当該不動産の固定資産税評価額である。", "贈与により取得した土地の所有権移転登記を行う際の登録免許税の課税標準は、当該土地の相続税評価額である。"], "answer": 2, "explanation": "正解は2。表題登記(建物の所在・家屋番号・構造・床面積等を新たに登記する登記)には登録免許税は課されない。1)は誤り。相続による所有権移転登記には登録免許税が課される(税率は原則0.4%)。3)は誤り。抵当権設定登記の課税標準は担保される債権金額であり、固定資産税評価額ではない。4)は誤り。贈与による土地の所有権移転登記の課税標準は固定資産税評価額であり、相続税評価額ではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-049", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 49, "questionType": "four_choice", "question": "「居住用財産を譲渡した場合の3,000万円の特別控除」（以下、「3,000万円特別控除」という）および「居住用財産を譲渡した場合の長期譲渡所得の課税の特例」（以下、「軽減税率の特例」という）に関する次の記述のうち、最も適切なものはどれか。なお、各選択肢において、ほかに必要な要件等はすべて満たしているものとする。", "choices": ["3,000万円特別控除は、譲渡した居住用財産の所有期間の長短にかかわらず、適用を受けることができる。", "3,000万円特別控除は、居住用財産で居住の用に供さなくなったものを譲渡する場合、居住の用に供さなくなった日の属する年の翌年の12月31日までに譲渡しなければ、適用を受けることができない。", "軽減税率の特例は、譲渡した居住用財産の所有期間が、譲渡した日の属する年の１月１日において５年を超えていれば、適用を受けることができる。", "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができない。"], "answer": 1, "explanation": "正解は1。3,000万円特別控除は所有期間の長短にかかわらず適用を受けることができる(軽減税率の特例のように長期所有要件はない)。2)は誤り。居住の用に供さなくなった日から3年を経過する日の属する年の12月31日までに譲渡しなければ適用を受けられない(翌年12月31日ではない)。3)は誤り。軽減税率の特例の所有期間要件は、譲渡した年の1月1日において10年を超えることであり、5年ではない。4)は誤り。要件を満たせば3,000万円特別控除と軽減税率の特例は重複して適用を受けることができる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-050", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "不動産", "sourceQuestionNumber": 50, "questionType": "four_choice", "question": "不動産の投資判断の手法等に関する次の記述のうち、最も適切なものはどれか。", "choices": ["ＤＣＦ法は、連続する複数の期間に発生する総収入および復帰価格を、その発生時期に応じて現在価値に割り引き、それぞれを合計して対象不動産の収益価格を求める手法である。", "ＮＰＶ法（正味現在価値法）による投資判断においては、対象不動産から得られる収益の現在価値の合計額が投資額の現在価値の合計額を上回っている場合、その投資は投資適格であると判定することができる。", "借入金併用型投資では、対象不動産の収益率が借入金の金利を下回っている場合、レバレッジ効果により、投下した自己資金に対する収益率の向上を期待することができる。", "ＮＯＩ利回り（純利回り）は、対象不動産から得られる年間の総収入を総投資額で除して算出される利回りであり、不動産の収益性を測る指標である。"], "answer": 2, "explanation": "正解は2。NPV法(正味現在価値法)では、対象不動産から得られる収益の現在価値の合計額が投資額の現在価値の合計額を上回っている(正味現在価値がプラスとなる)場合に、その投資は投資適格であると判定する。1)は誤り。DCF法で割り引く対象は各期の「純収益」(総収入から諸経費を控除したもの)と復帰価格であり、「総収入」とする点が不正確である。3)は誤り。レバレッジ効果が働くのは対象不動産の収益率が借入金利を上回っている場合であり、本肢は関係が逆である。4)は誤り。NOI利回りは総収入ではなく、総収入から諸経費を控除した純収益(NOI)を総投資額で除して算出する利回りである。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-051", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 51, "questionType": "four_choice", "question": "贈与税の課税財産に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["死因贈与により取得した財産は、贈与税の課税対象とならない。", "離婚による財産分与により取得した財産は、その価額が婚姻中の夫婦の協力によって得た財産の額等の事情を考慮して、社会通念上相当な範囲内である場合、原則として、贈与税の課税対象とならない。", "個人が法人からの贈与により取得した財産は、業務に関して受けるものや継続的に受けるものを除き、贈与税の課税対象となる。", "子が母から著しく低い価額の対価で土地を譲り受けた場合、原則として、当該土地の通常の取引価額に相当する金額と支払った対価の額との差額に相当する金額が、子が母から贈与により取得したものとみなされ、贈与税の課税対象となる。"], "answer": 3, "explanation": "正解は3(不適切)。個人が法人からの贈与により取得した財産は、贈与税ではなく、一時所得または給与所得等として所得税の課税対象となる(贈与税は個人間の贈与についてのみ課される税である)。1)は誤り(正しい記述)。死因贈与は贈与者の死亡によって効力を生じる契約であるが、相続税法上は遺贈とみなされ相続税の課税対象となるため、贈与税は課されない。2)離婚に伴う財産分与で社会通念上相当な範囲のものは贈与税非課税である点、4)著しい低額譲受け(低額譲渡)によるみなし贈与課税は、いずれも正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-052", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 52, "questionType": "four_choice", "question": "贈与税の配偶者控除（以下、「本控除」という）に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["本控除の適用を受けるためには、贈与を受けた時点で、贈与者である配偶者との婚姻期間が20年以上でなければならない。", "本控除の適用を受けるにあたって、配偶者から贈与を受ける財産の種類や金額に制限はない。", "過去に本控除の適用を受けたことがある場合、その後、同一の配偶者から贈与を受けても、再び本控除の適用を受けることはできない。", "本控除の適用を受ける場合、贈与税額の計算上、贈与税の課税価格から、基礎控除額と合わせて最高で2,110万円を控除することができる。"], "answer": 2, "explanation": "正解は2(不適切)。贈与税の配偶者控除の対象となる財産は、居住用不動産またはその取得のための金銭に限られており、財産の種類に制限がないとする本肢は誤りである。1)婚姻期間20年以上の要件は正しい。3)同一の配偶者からは一生に一度しか適用を受けられない点も正しい。4)基礎控除額110万円と本控除額2,000万円を合わせて最高2,110万円を控除できる点も正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-053", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 53, "questionType": "four_choice", "question": "法定後見制度に関する次の記述の空欄（ア）～（ウ）にあてはまる語句の組合せとして、最も適切なものはどれか。\n法定後見制度は、本人の判断能力が（ア）に、（イ）が選任した成年後見人等が本人を法律的に支援する制度である。法定後見制度には、精神上の障害による本人の判断能力の程度によって、（ウ）の３つの類型がある。", "choices": ["（ア）不十分になる前 （イ）本人 （ウ）後見・保佐・補助", "（ア）不十分になった後 （イ）家庭裁判所 （ウ）後見・保佐・補助", "（ア）不十分になった後 （イ）本人 （ウ）後見・介護・支援", "（ア）不十分になる前 （イ）家庭裁判所 （ウ）後見・介護・支援"], "answer": 2, "explanation": "正解は2。法定後見制度は、本人の判断能力が既に不十分になった後に、家庭裁判所が選任した成年後見人・保佐人・補助人が本人を法律的に支援する制度であり、判断能力の程度に応じて後見・保佐・補助の3類型に区分される。なお、本人の判断能力が低下する前にあらかじめ本人自身が任意に後見人を選び契約しておく制度は任意後見制度であり、法定後見制度とは異なる点がひっかけの対象となりやすい。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-054", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 54, "questionType": "four_choice", "question": "民法上の遺言に関する次の記述のうち、最も適切なものはどれか。", "choices": ["遺言者の相続人が、自宅で発見した自筆証書遺言を家庭裁判所の検認を受けずに開封した場合、その遺言は無効となる。", "遺言者が自筆証書遺言に添付する財産目録をパソコンで作成する場合、当該目録への署名・押印は不要である。", "公正証書遺言を作成する際には、証人３人以上の立会いが必要である。", "公正証書遺言を作成した遺言者は、その遺言を自筆証書遺言によって撤回することができる。"], "answer": 4, "explanation": "正解は4。遺言はいつでも遺言の方式に従って全部または一部を撤回することができ、公正証書遺言を後日の自筆証書遺言によって撤回することも可能である(先に成立した遺言と抵触する部分は後の遺言により撤回されたものとみなされる)。1)は誤り。検認を受けずに開封しても過料の対象となるにとどまり、遺言自体が無効になるわけではない。2)は誤り。財産目録をパソコン等で作成することは認められているが、その目録の各ページに署名・押印をする必要がある。3)は誤り。公正証書遺言の作成には証人2人以上の立会いがあれば足り、3人以上は必要ない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-055", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 55, "questionType": "four_choice", "question": "下記の〈親族関係図〉において、Ａさんの相続が開始した場合の相続税における遺産に係る基礎控除額として、最も適切なものはどれか。なお、Ｃさんは相続の放棄をしている。また、Ｄさんは、Ａさん夫婦の普通養子（特別養子縁組以外の縁組による養子）である。\n〈親族関係図〉被相続人Ａさん－配偶者妻Ｂさん、実子Ｃさん（相続放棄）、養子Ｄさん、孫Ｅさん・孫Ｆさん（Ｃさんの子と推定される代襲者ではない通常の孫、Ｃさんは放棄したのみで死亡していないため代襲相続なし）", "choices": ["4,200万円", "4,800万円", "5,400万円", "6,000万円"], "answer": 2, "explanation": "正解は2。遺産に係る基礎控除額=3,000万円+600万円×法定相続人の数、で算出する。相続放棄をした者(実子Ｃさん)がいても、基礎控除額の計算上は放棄がなかったものとして法定相続人の数に含める。また、実子がいる場合の養子は1人まで法定相続人の数に算入できるため、養子Ｄさんも算入される。したがって法定相続人の数は、配偶者Ｂさん・実子Ｃさん(放棄していても算入)・養子Ｄさんの3人となる。孫Ｅさん・Ｆさんは代襲相続人ではないため、法定相続人の数には算入しない。基礎控除額=3,000万円+600万円×3人=4,800万円。相続放棄者や養子の取扱いを正確に理解しているかがポイントである。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-056", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 56, "questionType": "four_choice", "question": "相続税の計算に関する次の記述のうち、最も適切なものはどれか。", "choices": ["被相続人の子が相続開始前に死亡しているため、その死亡した子を代襲して相続人となった被相続人の孫は、相続税額の２割加算の対象となる。", "相続人が被相続人の配偶者のみで、相続の放棄をした者はおらず、その配偶者がすべての遺産を相続により取得した場合、「配偶者に対する相続税額の軽減」の適用を受けることにより納付すべき相続税額は生じない。", "被相続人との婚姻の届出を提出していない者であっても、事実上婚姻関係と同様の事情にあり、いわゆる内縁関係にあると認められる者は、「配偶者に対する相続税額の軽減」の適用を受けることができる。", "相続人が未成年者である場合、その者の相続税額から控除する未成年者控除額は、原則として、その者が18歳に達するまでの年数に20万円を乗じた金額である。"], "answer": 2, "explanation": "正解は2。相続人が配偶者のみで、その配偶者がすべての遺産を取得した場合、「配偶者に対する相続税額の軽減」(配偶者の法定相続分相当額または1億6,000万円のいずれか多い金額まで非課税)により、法定相続分はすべて配偶者が取得したことになるため、納付すべき相続税額は生じない。1)は誤り。代襲相続人となった孫は、被相続人の一親等の血族に準じる扱いとされ、2割加算の対象とならない。3)は誤り。配偶者に対する相続税額の軽減の対象となる配偶者は、婚姻の届出をした法律上の配偶者に限られ、内縁関係の者は対象外である。4)は誤り。未成年者控除額は、その者が18歳に達するまでの年数(1年未満の端数は1年に切上げ)に10万円を乗じた金額であり、20万円ではない。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-057", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 57, "questionType": "four_choice", "question": "Ｘ年４月７日（月）に死亡した被相続人が所有していた上場株式Ｙを相続により取得した場合、下記の〈資料〉に基づき、上場株式Ｙの１株当たりの相続税評価額として、最も適切なものはどれか。なお、記載のない事項については考慮しないものとする。\n〈資料〉上場株式Ｙの価格：Ｘ年１月の毎日の最終価格の月平均額1,140円／Ｘ年２月の毎日の最終価格の月平均額1,150円／Ｘ年３月の毎日の最終価格の月平均額1,180円／Ｘ年４月の毎日の最終価格の月平均額1,240円／Ｘ年４月４日（金）の最終価格1,230円／Ｘ年４月７日（月）の最終価格1,210円", "choices": ["1,140円", "1,150円", "1,210円", "1,240円"], "answer": 2, "explanation": "正解は2。上場株式の相続税評価額は、①課税時期(相続開始日)の最終価格、②課税時期の属する月の毎日の最終価格の月平均額、③前月の月平均額、④前々月の月平均額、の4つのうち最も低い価額により評価する。本問では、①課税時期(4月7日)の最終価格1,210円、②4月の月平均額1,240円、③3月(前月)の月平均額1,180円、④2月(前々月)の月平均額1,150円のうち、最も低いのは1,150円であり、これが1株当たりの相続税評価額となる。1月の月平均額(1,140円)は前々々月にあたり評価の対象期間外である点もひっかけとなる。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-058", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 58, "questionType": "four_choice", "question": "相続により取得した宅地の相続税評価に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["貸家建付地の価額は、「自用地価額×（１－借地権割合×借家権割合×賃貸割合）」の算式により計算した金額によって評価する。", "被相続人が、所有する宅地の上に店舗用建物を建築し、当該建物を賃貸借契約により第三者に賃貸していた場合、その宅地は貸家建付地として評価する。", "被相続人が、所有する宅地に建物の所有を目的とする賃借権を設定し、借地人がその宅地の上に自宅を建築して居住していた場合、その宅地は貸宅地として評価する。", "被相続人が、所有する宅地を使用貸借により子に貸し付け、その子がその宅地の上に自宅を建築して居住していた場合、その宅地は貸宅地として評価する。"], "answer": 4, "explanation": "正解は4(不適切)。使用貸借(無償による貸付け)により子に宅地を貸し付けている場合、使用貸借による土地の使用権の価額は原則としてゼロと評価されるため、その宅地は貸宅地としてではなく自用地として評価する。1)貸家建付地の評価算式、2)賃貸借契約により第三者に建物を賃貸している場合の貸家建付地評価、3)建物所有目的の賃借権(借地権)が設定された宅地の貸宅地評価は、いずれも正しい記述である。使用貸借と賃貸借(有償)の評価上の取扱いの違いが本問のひっかけの核心である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-059", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 59, "questionType": "four_choice", "question": "「小規模宅地等についての相続税の課税価格の計算の特例」（以下、「本特例」という）に関する下記の表の空欄（ア）～（ウ）にあてはまる語句の組合せとして、最も適切なものはどれか。なお、宅地等の適用面積の調整は考慮しないものとする。\n宅地等の区分と限度面積・減額割合：特定事業用宅地等（ア）・80％／特定居住用宅地等330㎡・（イ）／特定同族会社事業用宅地等（ウ）・80％", "choices": ["（ア）400㎡ （イ）80％ （ウ）400㎡", "（ア）330㎡ （イ）80％ （ウ）200㎡", "（ア）400㎡ （イ）50％ （ウ）200㎡", "（ア）330㎡ （イ）50％ （ウ）400㎡"], "answer": 1, "explanation": "正解は1。小規模宅地等の特例における限度面積・減額割合は、特定事業用宅地等が400㎡・80%、特定居住用宅地等が330㎡・80%、特定同族会社事業用宅地等が400㎡・80%である(貸付事業用宅地等のみ200㎡・50%となる点と混同しないことが重要)。事業用系統(特定事業用・特定同族会社事業用)は400㎡・80%、居住用は330㎡・80%、貸付用は200㎡・50%という組合せを正確に覚えることが本特例の頻出論点である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2026-05-gakka-060", "grade": "FP2", "examDate": "2026-05", "examType": "学科", "domain": "相続・事業承継", "sourceQuestionNumber": 60, "questionType": "four_choice", "question": "会社法に関する次の記述のうち、最も不適切なものはどれか。", "choices": ["株式会社を設立するためには、最低資本金額として1,000万円が必要である。", "株式会社が特定の株主から自己株式を有償で取得する場合、原則として、株主総会の特別決議が必要となる。", "定時株主総会は、毎事業年度終了後一定の時期に招集しなければならないが、臨時株主総会は、必要がある場合にいつでも招集することができる。", "取締役は、いつでも、株主総会の決議によって解任することができる。"], "answer": 1, "explanation": "正解は1(不適切)。現行の会社法には最低資本金制度は設けられておらず、資本金1円でも株式会社を設立することができる(2006年施行の会社法により旧商法の最低資本金制度は撤廃された)。2)特定の株主からの自己株式の有償取得には株主総会の特別決議が必要である点は正しい。3)定時株主総会・臨時株主総会の招集に関する規定も正しい。4)取締役はいつでも株主総会の決議(普通決議)によって解任することができる点も正しい記述である。", "legalReferenceDate": "2025-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-001", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 1, "questionType": "four_choice", "question": "ファイナンシャル・プランナー（以下、「FP」という）の顧客に対する行為に関する次の記述のうち、関連法規に照らし、最も不適切なものはどれか。", "choices": ["社会保険労務士の登録を受けていないFPが、年金の相談に来た顧客の求めに応じ、公的年金の裁定請求手続を代行して報酬を受け取った。", "生命保険募集人の登録を受けていないFPが、ライフプランの相談に来た顧客の求めに応じ、ライフイベントに応じた生命保険の一般的な活用方法を説明した。", "金融商品取引業者の登録を受けていないFPが、資産運用の相談に来た顧客の求めに応じ、顧客の投資判断材料となる景気動向や企業業績に関する情報を提供した。", "税理士の登録を受けていないFPが、相続の相談に来た顧客の求めに応じ、顧客の具体的な相続税額の算出のために知り合いの税理士を紹介した。"], "answer": 1, "explanation": "公的年金の裁定請求手続の代行は社会保険労務士の独占業務であり、無登録者が報酬を得て代行することは社会保険労務士法違反となるため、選択肢1が最も不適切。選択肢2は募集行為（契約の勧誘・締結）を伴わない一般的な説明にとどまるため保険業法に抵触しない。選択肢3は投資助言（個別銘柄の売買推奨等）を行っていない客観情報の提供にとどまるため金融商品取引法に抵触しない。選択肢4は具体的な税額計算・申告書作成を行わず専門家を紹介したにすぎないため税理士法に抵触しない。FP試験では「独占業務への抵触」と「一般的知識の提供・専門家への橋渡し」の境界線が繰り返し問われるため、各士業の独占業務範囲を正確に押さえておくことが重要。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecked": true, "explanationChecked": true, "legalChecked": true}}, {"id": "fp2-2025-05-gakka-002", "grade": "FP2", "examDate": "2025-05", "examType": "学科", "domain": "ライフプランニングと資金計画", "sourceQuestionNumber": 2, "questionType": "four_choice", "question": "全国健康保険協会管掌健康保険（協会けんぽ）の被保険者に関する次の記述の空欄（ア）～（ウ）にあてはまる語句の組合せとして、最も適切なものはどれか。\n特定適用事業所に使用される者のうち、1週間の所定労働時間または1カ月間の所定労働日数が同一の事業所に使用される通常の労働者の（ア）未満である短時間労働者に該当し、かつ、次のいずれかに該当する者は、原則として、被保険者とならない。(1)1週間の所定労働時間が（イ）未満である者 (2)所定内賃金が月額（ウ）未満である者 (3)学生である者", "choices": ["（ア）3分の2 （イ）20時間 （ウ）5万8,000円", "（ア）3分の2 （イ）25時間 （ウ）8万8,000円", "（ア）4分の3 （イ）20時間 （ウ）8万8,000円", "（ア）4分の3 （イ）25時間 （ウ）5万8,000円"], "answer": 3, "explanation": "短時間労働者の社会保険適用要件は、通常の労働者の所定労働時間・所定労働日数の4分の3未満であることが基本であり、さらに特定適用事業所においては（1）週の所定労働時間20時間未満、（2）所定内賃金月額8万8,000円未満、（3）学生、のいずれかに該当すると被保険者とならない。したがって正解は（ア）4分の3・（イ）20時間・（ウ）8万8,000円の組合せである選択肢3。3分の2や25時間、5万8,000円といった紛らわしい数値を混在させた選択肢1・2・4に惑わされないよう、4分の3基準（本来要件）と特定適用事業所の追加除外要件（20時間・8.8万円・学生）を分けて記憶することがひっかけ対策として有効。", "legalReferenceDate": "2024-04-01", "sourceUrl": "https://www.jafp.or.jp/exam/mohan/files/g2_202505_qa.pdf", "status": "active", "legacyReason": null, "audit": {"questionChecked": true, "answerChecke
