<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<title>いっしょに一冊</title>
<style>
  :root{
    --cream:#FFF8EF; --coral:#FF8A65; --coral-dark:#D9613A;
    --ink:#4E3C2E; --ink-soft:#8A7565; --white:#FFFFFF;
    --shadow:0 12px 32px rgba(150,105,60,.16);
    --shadow-soft:0 4px 14px rgba(150,105,60,.11);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:linear-gradient(165deg,#FFF9F1 0%,#FFF1E0 45%,#FCEAE3 100%);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,"Hiragino Sans",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 70px}

  /* ---------- header ---------- */
  header{text-align:center;padding:6px 0 20px}
  header h1{font-size:clamp(26px,5vw,38px);margin:0 0 6px;color:var(--coral-dark)}
  header p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.7}

  /* ---------- age filter ---------- */
  .bands{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 24px}
  .band{padding:9px 18px;border-radius:999px;background:var(--white);border:2px solid transparent;
        font-size:14px;color:var(--ink-soft);cursor:pointer;box-shadow:var(--shadow-soft);
        transition:transform .15s,border-color .15s,color .15s}
  .band:hover{transform:translateY(-2px)}
  .band.active{border-color:var(--coral);color:var(--coral-dark);font-weight:700;background:#FFF2EA}

  /* ---------- shelf ---------- */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
  .card{background:var(--white);border:none;border-radius:26px;overflow:hidden;padding:0;
        cursor:pointer;box-shadow:var(--shadow-soft);text-align:left;
        transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
  .card:active{transform:translateY(-1px) scale(.99)}
  .card-cover{width:100%;aspect-ratio:4/3;overflow:hidden;background:#F6EDE2;display:block}
  .card-cover svg{width:100%;height:100%;display:block}
  .card-body{padding:15px 17px 17px;display:flex;flex-direction:column;gap:5px;flex:1}
  .card-title{font-size:18px;font-weight:700;line-height:1.3}
  .card-meta{font-size:12px;color:var(--ink-soft)}
  .card-sum{font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin-top:2px}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:9px}
  .tag{font-size:11.5px;padding:4px 10px;border-radius:999px;background:#FFF1E6;color:var(--coral-dark);font-weight:700}
  .tag.alt{background:#EDF5E8;color:#5A8A50}

  footer{text-align:center;margin-top:44px;color:var(--ink-soft);font-size:12px;line-height:1.9}
  footer .pill{display:inline-block;margin-bottom:9px;padding:7px 15px;border-radius:999px;
               background:#FFF2E8;color:var(--coral-dark);font-weight:700;font-size:11.5px}

  /* ---------- reader ---------- */
  .reader{position:fixed;inset:0;z-index:60;display:none;background:var(--reader-bg,#FFF3E8)}
  .reader.open{display:flex;flex-direction:column}

  .rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:calc(10px + env(safe-area-inset-top)) 16px 8px;flex-shrink:0}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.9);
            box-shadow:var(--shadow-soft);font-size:17px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
  .icon-btn:hover{transform:scale(1.08)}
  .rlabel{font-size:12.5px;color:var(--ink-soft);font-weight:700;text-align:center;flex:1;min-width:0}
  .rlabel .act{display:inline-block;background:rgba(255,255,255,.85);border-radius:999px;
               padding:2px 9px;margin-right:6px;color:var(--coral-dark)}
  .fsize{display:flex;gap:5px;flex-shrink:0}
  .fsize button{border:none;background:rgba(255,255,255,.9);box-shadow:var(--shadow-soft);
                border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .fsize button.active{background:var(--coral);color:#fff;font-weight:700}

  /* 絵本レイアウト：絵が主役 */
  .stage{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 14px 6px}
  .picture{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .picture svg{height:100%;width:auto;max-width:100%;max-height:100%;aspect-ratio:4/3;display:block;
               border-radius:22px;box-shadow:0 10px 28px rgba(120,80,45,.18);background:#fff}
  .textbox{flex:0 0 auto;background:rgba(255,255,255,.92);border-radius:22px;
           margin:12px auto 0;padding:16px 22px;max-width:620px;width:100%;
           box-shadow:var(--shadow-soft);text-align:center}
  .stitle{font-size:13px;font-weight:700;color:var(--coral-dark);margin-bottom:7px}
  .stext{font-size:19px;line-height:1.85;white-space:pre-line}
  .stext.fs-small{font-size:16.5px;line-height:1.8}
  .stext.fs-large{font-size:22px;line-height:1.9}
  .qbtn{margin-top:12px;border:2px dashed var(--coral);background:#FFF6EF;color:var(--coral-dark);
        padding:8px 18px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:700}
  .qbtn:hover{background:#FFEADC}
  .qbox{margin-top:10px;background:#FFF4EA;border-radius:16px;padding:12px 16px;
        font-size:15px;line-height:1.7;display:none}
  .qbox.show{display:block;animation:pop .22s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .qbox::before{content:"💬 ";}

  .rnav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:18px;
        padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
  .nav-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:21px;cursor:pointer;
           background:var(--coral);color:#fff;box-shadow:0 7px 16px rgba(255,138,101,.42);
           transition:transform .15s,opacity .15s}
  .nav-btn:disabled{opacity:.3;box-shadow:none;cursor:default}
  .nav-btn:not(:disabled):hover{transform:scale(1.08)}
  .dots{display:flex;gap:5px;flex-wrap:wrap;max-width:260px;justify-content:center}
  .dot{width:6px;height:6px;border-radius:50%;background:#EDD3BE;transition:all .2s}
  .dot.active{width:18px;border-radius:4px;background:var(--coral)}

  .end{text-align:center;max-width:520px;margin:auto;padding:20px}
  .end h3{color:var(--coral-dark);font-size:21px;margin:0 0 12px}
  .end p{font-size:16.5px;line-height:1.85;margin:0}
  .end .acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .pill-btn{border:none;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:700;
            cursor:pointer;box-shadow:var(--shadow-soft)}
  .pill-btn.primary{background:var(--coral);color:#fff}
  .pill-btn.secondary{background:#fff;color:var(--coral-dark)}

  @media (max-width:620px){
    .stext{font-size:17px}
    .textbox{padding:13px 16px;margin-top:9px}
    .rnav{gap:13px}
    .nav-btn{width:48px;height:48px}
  }
  /* 横向き：絵を左、文を右 */
  @media (orientation:landscape) and (max-height:520px){
    .stage{flex-direction:row;gap:14px;align-items:stretch}
    .picture{flex:1 1 55%}
    .textbox{flex:1 1 45%;margin:0;display:flex;flex-direction:column;justify-content:center;max-width:none}
  }
</style>
</head>
<body>

<div class="wrap" id="home">
  <header>
    <h1>いっしょに一冊</h1>
    <p>1ページごとに絵があります。親子で同じ絵を見ながら、<br>ゆっくり読んであげてください。</p>
  </header>
  <div class="bands" id="bands"></div>
  <div class="shelf" id="shelf"></div>
  <footer>
    <div class="pill">Web試作版</div><br>
    外部通信・広告・ログイン・追跡なし。すべてこの端末の中だけで動きます。<br>
    挿絵はすべてこのアプリのために描き起こしたものです。
  </footer>
</div>

<div class="reader" id="reader">
  <div class="rtop">
    <button class="icon-btn" id="closeBtn" aria-label="とじる">✕</button>
    <div class="rlabel" id="rlabel"></div>
    <div class="fsize">
      <button data-size="small">小</button>
      <button data-size="medium" class="active">中</button>
      <button data-size="large">大</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rnav" id="rnav">
    <button class="nav-btn" id="prevBtn" aria-label="まえのページ">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="つぎのページ">›</button>
  </div>
</div>

<script src="art-core.js"></script>
<script src="art-scenes.js"></script>
<script src="books-data.js"></script>
<script>
(function(){
  "use strict";
  var books = (window.BOOKS_DATA||[]).slice().sort(function(a,b){return a.ageOrder-b.ageOrder;});
  var state = {band:"all", fs:"medium"};
  var cur = {book:null, i:0, showQ:false, ended:false};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

  /* ---------- 本だな ---------- */
  function renderBands(){
    var seen={}, out='<div class="band active" data-v="all">ぜんぶ</div>';
    books.forEach(function(b){ if(!seen[b.ageBand]){seen[b.ageBand]=1;
      out+='<div class="band" data-v="'+esc(b.ageBand)+'">'+esc(b.ageBand)+'</div>';}});
    var w=document.getElementById("bands"); w.innerHTML=out;
    w.querySelectorAll(".band").forEach(function(el){
      el.addEventListener("click",function(){
        w.querySelectorAll(".band").forEach(function(x){x.classList.remove("active");});
        el.classList.add("active"); state.band=el.getAttribute("data-v"); renderShelf();
      });
    });
  }

  function renderShelf(){
    var list = books.filter(function(b){return state.band==="all"||b.ageBand===state.band;});
    document.getElementById("shelf").innerHTML = list.map(function(b){
      return '<button class="card" data-id="'+esc(b.id)+'">'+
        '<div class="card-cover">'+ART.render(b.id,0)+'</div>'+
        '<div class="card-body">'+
          '<div class="card-title">'+esc(b.title)+'</div>'+
          '<div class="card-meta">'+esc(b.reading)+' ／ '+esc(b.author)+' 原作</div>'+
          '<div class="card-sum">'+esc(b.summary)+'</div>'+
          '<div class="card-tags">'+
            '<span class="tag">'+esc(b.ageBand)+'</span>'+
            '<span class="tag">'+esc(b.duration)+'</span>'+
            '<span class="tag alt">全'+b.sceneCount+'ページ</span>'+
          '</div>'+
        '</div></button>';
    }).join("");
    document.querySelectorAll(".card").forEach(function(c){
      c.addEventListener("click",function(){
        var id=c.getAttribute("data-id");
        var b=books.filter(function(x){return x.id===id;})[0];
        if(b) open(b);
      });
    });
  }

  /* ---------- リーダー ---------- */
  var reader=document.getElementById("reader"), stage=document.getElementById("stage"),
      rlabel=document.getElementById("rlabel"), dots=document.getElementById("dots"),
      prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn"),
      rnav=document.getElementById("rnav");

  function open(b){
    cur={book:b,i:0,showQ:false,ended:false};
    reader.style.setProperty("--reader-bg",b.bg);
    reader.classList.add("open");
    document.body.style.overflow="hidden";
    draw();
  }
  function close(){reader.classList.remove("open");document.body.style.overflow="";}
  document.getElementById("closeBtn").addEventListener("click",close);

  document.querySelectorAll(".fsize button").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".fsize button").forEach(function(x){x.classList.remove("active");});
      btn.classList.add("active"); state.fs=btn.getAttribute("data-size");
      try{localStorage.setItem("issho-fs",state.fs);}catch(e){}
      draw();
    });
  });
  try{var sv=localStorage.getItem("issho-fs"); if(sv){state.fs=sv;
    document.querySelectorAll(".fsize button").forEach(function(x){
      x.classList.toggle("active",x.getAttribute("data-size")===sv);});}}catch(e){}

  function draw(){
    var b=cur.book; if(!b) return;
    var n=b.scenes.length;

    if(cur.ended){
      rnav.style.visibility="hidden";
      rlabel.textContent=b.title+" ・ おしまい";
      stage.innerHTML='<div class="end"><h3>おしまい</h3>'+
        '<p>'+esc(b.endMessage)+'</p>'+
        '<div class="acts">'+
          '<button class="pill-btn secondary" id="again">もういちど よむ</button>'+
          '<button class="pill-btn primary" id="back">本だなへ もどる</button>'+
        '</div></div>';
      document.getElementById("again").onclick=function(){cur.i=0;cur.ended=false;cur.showQ=false;draw();};
      document.getElementById("back").onclick=close;
      return;
    }

    rnav.style.visibility="visible";
    var sc=b.scenes[cur.i];
    rlabel.innerHTML='<span class="act">'+esc(sc.act)+'</span>'+esc(b.title)+
                     '（'+(cur.i+1)+'／'+n+'）';

    stage.innerHTML=
      '<div class="picture">'+ART.render(b.id,cur.i)+'</div>'+
      '<div class="textbox">'+
        '<div class="stitle">'+esc(sc.title)+'</div>'+
        '<div class="stext fs-'+state.fs+'">'+esc(sc.text)+'</div>'+
        '<button class="qbtn" id="qbtn">'+(cur.showQ?'といかけを かくす':'💭 といかけを みる')+'</button>'+
        '<div class="qbox'+(cur.showQ?' show':'')+'">'+esc(sc.question)+'</div>'+
      '</div>';
    document.getElementById("qbtn").onclick=function(){cur.showQ=!cur.showQ;draw();};

    var d=""; for(var i=0;i<n;i++) d+='<span class="dot'+(i===cur.i?' active':'')+'"></span>';
    dots.innerHTML=d;
    prevBtn.disabled=cur.i===0;
  }

  function prev(){
    if(!cur.book) return;
    if(cur.ended){cur.ended=false;cur.i=cur.book.scenes.length-1;cur.showQ=false;draw();return;}
    if(cur.i>0){cur.i--;cur.showQ=false;draw();}
  }
  function next(){
    if(!cur.book||cur.ended) return;
    if(cur.i<cur.book.scenes.length-1){cur.i++;cur.showQ=false;draw();}
    else{cur.ended=true;draw();}
  }
  prevBtn.addEventListener("click",prev);
  nextBtn.addEventListener("click",next);
  document.addEventListener("keydown",function(e){
    if(!reader.classList.contains("open")) return;
    if(e.key==="ArrowLeft")prev(); if(e.key==="ArrowRight")next(); if(e.key==="Escape")close();
  });

  var tx=null;
  stage.addEventListener("touchstart",function(e){tx=e.changedTouches[0].clientX;},{passive:true});
  stage.addEventListener("touchend",function(e){
    if(tx===null)return; var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>44){ if(dx<0)next(); else prev(); } tx=null;
  },{passive:true});

  renderBands(); renderShelf();
})();
</script>
</body>
</html>
