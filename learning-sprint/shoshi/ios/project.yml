name: ShoshiSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  ShoshiSprint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App.swift
      - path: Models.swift
      - path: LearningLogic.swift
      - path: QuestionRepository.swift
      - path: StoreKitManager.swift
      - path: AppModel.swift
      - path: BackupDocument.swift
      - path: Theme.swift
      - path: Views.swift
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.shoshi
        PRODUCT_NAME: ShoshiSprint
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 司法書士 学びスプリント
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      testTargets:
        - ShoshiSprintTests

  ShoshiSprintTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: ShoshiSprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.shoshi.tests
