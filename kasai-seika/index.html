<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>葛西青果株式会社｜提案用ホームページ</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3faf5;color:#063b28}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:520px;padding:36px;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(6,59,40,.15)}.mark{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#248d5d,#063b28);font-size:30px}h1{margin:0;font-size:24px}p{color:#607066;line-height:1.7}.bar{height:8px;margin-top:24px;overflow:hidden;border-radius:99px;background:#e6f4e9}.bar i{display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#248d5d,#ef7b25);animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}button{display:none;margin:20px auto 0;padding:13px 22px;border:0;border-radius:12px;color:#fff;background:#0d5b3b;font-weight:700}small{display:block;margin-top:16px;color:#809087}
</style>
</head>
<body>
<main><div class="box"><div class="mark">青</div><h1>葛西青果株式会社</h1><p id="message">提案用ホームページを読み込んでいます。</p><div class="bar" id="bar"><i></i></div><button id="retry" type="button">もう一度読み込む</button><small>非公式・提案用サンプル</small></div></main>
<script>
const source='https://raw.githubusercontent.com/ALLSUNDAY1122/-omochabako/main/kasai-seika-v2/index.html';
const message=document.getElementById('message');
const retry=document.getElementById('retry');
const bar=document.getElementById('bar');
async function load(){
  retry.style.display='none';bar.style.display='block';message.textContent='提案用ホームページを読み込んでいます。';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    if(!html.includes('<html')) throw new Error('HTMLを取得できませんでした');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);bar.style.display='none';retry.style.display='block';
    message.textContent='ページの読み込みに失敗しました。通信状態を確認して、もう一度お試しください。';
  }
}
retry.addEventListener('click',load);load();
</script>
</body>
</html>
