name: Learning Sprint Question Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/learning-sprint-audit.json'
      - '**/questions*.json'
  push:
    branches: [main]
    paths:
      - '**/learning-sprint-audit.json'
      - '**/questions*.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all learning-sprint question banks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CONFIGS < <(find . -name learning-sprint-audit.json -type f | sort)
          if [ ${#CONFIGS[@]} -eq 0 ]; then
            echo 'No learning-sprint-audit.json found.'
            exit 0
          fi
          for config in "${CONFIGS[@]}"; do
            python automation/learning-sprint-question-pipeline/validate_questions.py "$config"
          done
