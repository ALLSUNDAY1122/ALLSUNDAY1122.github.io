<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#f7d98b"/>
<title>みーつけた！どうぶつかくれんぼ</title>
<style>
:root{
  --ink:#5b341d;
  --cream:#fff8e7;
  --gold:#f3b84b;
  --orange:#ff8a34;
  --panel:#fff7df;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dcefdc;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:manipulation}
button{font:inherit}
#app{height:100dvh;max-width:1024px;margin:auto;position:relative;overflow:hidden;background:#bfe5ff}
.scene{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 18% 14%,#fff8 0 6%,transparent 7%),
    linear-gradient(#83d7ff 0 44%,#c9efa8 44% 66%,#89cd69 66%);
}
.sky-cloud{position:absolute;background:#fff;border-radius:999px;filter:drop-shadow(0 6px 8px #4c84a233)}
.sky-cloud:before,.sky-cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:150px;height:48px;left:8%;top:13%}.c1:before{width:70px;height:70px;left:18px;top:-28px}.c1:after{width:84px;height:84px;right:15px;top:-36px}
.c2{width:110px;height:34px;right:8%;top:20%}.c2:before{width:54px;height:54px;left:12px;top:-24px}.c2:after{width:63px;height:63px;right:10px;top:-30px}
.mountain{position:absolute;bottom:38%;width:46%;height:29%;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(#8eb7d9,#6793b5);opacity:.8}
.m1{left:2%}.m2{right:-6%;transform:scale(.8);opacity:.62}
.hill{position:absolute;left:-10%;right:-10%;bottom:28%;height:24%;background:#78bc67;border-radius:50% 50% 0 0 / 70% 70% 0 0}
.river{position:absolute;left:30%;right:0;bottom:19%;height:16%;background:linear-gradient(160deg,#65c5ef,#b8edff);clip-path:polygon(0 18%,100% 0,100% 73%,0 100%);opacity:.95}
.river:after{content:"";position:absolute;left:6%;right:5%;top:42%;height:6px;border-radius:50%;background:#fff8;box-shadow:80px 18px 0 #fff7,190px -10px 0 #fff7}
.grass{position:absolute;inset:auto 0 0;height:43%;background:
 radial-gradient(circle at 12% 70%,#ffe35e 0 5px,transparent 6px),
 radial-gradient(circle at 21% 52%,#fff 0 4px,#ffd36c 5px 7px,transparent 8px),
 radial-gradient(circle at 70% 62%,#ff79a9 0 5px,transparent 6px),
 linear-gradient(#9adb75,#65b84e)}
.header{
 position:absolute;z-index:50;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));
 display:flex;align-items:center;gap:10px
}
.avatar-card{
 display:flex;align-items:center;gap:10px;background:linear-gradient(#fff6d7,#ffe7a8);
 border:4px solid #cf8c35;border-radius:28px;padding:7px 14px 7px 8px;
 box-shadow:0 4px 0 #a96521,0 8px 18px #0002;color:var(--ink);font-weight:900;font-size:clamp(18px,3.5vw,28px)
}
.face{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #e5ae55;display:grid;place-items:center}
.progress{
 margin-left:auto;display:flex;align-items:center;gap:12px;padding:9px 17px;background:linear-gradient(#d9994f,#bc6f29);
 border:4px solid #ffd582;border-radius:26px;box-shadow:0 4px 0 #8e4c19,0 8px 18px #0002
}
.slot{width:42px;height:42px;border-radius:50%;background:#6d371d55;display:grid;place-items:center;color:#fff;font-size:26px}
.slot.done{background:#ffe272;color:#78441c;box-shadow:inset 0 0 0 3px #fff2}
.iconbtn{
 width:60px;height:60px;border:4px solid #db9639;border-radius:50%;background:linear-gradient(#fff1b8,#ffc95c);
 box-shadow:0 4px 0 #a45e1c,0 8px 18px #0002;font-size:27px;display:grid;place-items:center
}
.prompt{
 position:absolute;z-index:40;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
 min-width:min(84vw,520px);text-align:center;background:#fffaf0;border:5px solid #f1c264;border-radius:34px;
 box-shadow:0 6px 0 #c98b2f,0 12px 22px #0002;padding:13px 28px;color:var(--ink);font-size:clamp(24px,5vw,38px);font-weight:950
}
.homebtn{position:absolute;z-index:45;left:20px;bottom:22px;width:70px;height:70px;border-radius:50%;border:4px solid #d18b31;background:#ffd575;box-shadow:0 4px 0 #a65e1d;font-size:34px}
.hintbtn{position:absolute;z-index:45;right:20px;bottom:22px;border:4px solid #d18b31;background:#fff4cf;border-radius:28px;padding:12px 20px;box-shadow:0 4px 0 #a65e1d;font-weight:900;color:var(--ink);font-size:20px}
.spark{position:absolute;pointer-events:none;font-size:34px;opacity:0;z-index:60}
.spark.go{animation:spark 900ms ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(120deg)}}
.tree{
 position:absolute;z-index:30;left:-6%;bottom:7%;width:46%;height:82%;
 filter:drop-shadow(0 14px 16px #315b2730)
}
.rock{
 position:absolute;z-index:30;right:5%;bottom:25%;width:31%;height:34%;
 filter:drop-shadow(0 13px 13px #315b2733)
}
.bush{
 position:absolute;z-index:31;right:23%;bottom:17%;width:27%;height:23%;
 filter:drop-shadow(0 10px 12px #315b2733)
}
.log{
 position:absolute;z-index:31;right:5%;bottom:5%;width:27%;height:21%;
 filter:drop-shadow(0 10px 12px #315b2733)
}
.animal{
 position:absolute;z-index:20;width:180px;height:180px;left:17%;top:42%;
 transform:translate(-50%,-50%) scale(.96);transition:
 left 900ms cubic-bezier(.2,.75,.2,1),
 top 900ms cubic-bezier(.2,.75,.2,1),
 transform 500ms ease,
 opacity 350ms ease;
 filter:drop-shadow(0 10px 8px #0002);
 pointer-events:none
}
.animal.searching{pointer-events:auto}
.animal.found{
 z-index:55!important;left:50%!important;top:50%!important;
 animation:reveal 900ms cubic-bezier(.18,.9,.25,1.25) both
}
@keyframes reveal{
 0%{transform:translate(-50%,-50%) scale(.65) rotate(-8deg)}
 60%{transform:translate(-50%,-50%) scale(1.25) rotate(5deg)}
 100%{transform:translate(-50%,-50%) scale(1.08) rotate(0)}
}
.wiggle{animation:wiggle 650ms ease-in-out infinite alternate}
@keyframes wiggle{from{transform:translate(-50%,-50%) rotate(-2deg)}to{transform:translate(-50%,-50%) rotate(3deg)}}
.celebrate{
 position:absolute;inset:0;z-index:80;display:none;place-items:center;
 background:linear-gradient(#9be0ffdd,#b9eb8eee);backdrop-filter:blur(3px)
}
.celebrate.show{display:grid}
.card{
 width:min(88vw,640px);padding:28px;text-align:center;border:5px solid #f1b74e;border-radius:38px;
 background:#fff7db;box-shadow:0 8px 0 #b96d23,0 18px 40px #0003
}
.card h1{margin:0;font-size:clamp(40px,8vw,68px);color:#ff6a24;text-shadow:0 3px 0 #fff}
.card p{font-size:24px;font-weight:900;color:var(--ink)}
.again{border:4px solid #e76719;background:linear-gradient(#ffad50,#ff7a24);color:white;border-radius:28px;padding:14px 30px;font-size:26px;font-weight:950;box-shadow:0 5px 0 #b94712}
@media(max-width:600px){
 .header{left:10px;right:10px;gap:7px}
 .avatar-card{padding-right:10px;border-width:3px}.face{width:46px;height:46px}
 .progress{padding:7px 10px;gap:7px;border-width:3px}.slot{width:34px;height:34px;font-size:21px}
 .iconbtn{width:50px;height:50px;border-width:3px}
 .animal{width:130px;height:130px}
 .tree{width:54%;height:79%;left:-12%}
 .rock{width:36%;right:0}.bush{width:34%;right:19%}.log{width:34%;right:2%}
 .homebtn,.hintbtn{display:none}
 .prompt{bottom:max(15px,env(safe-area-inset-bottom));padding:10px 18px;border-width:4px}
}
@media(min-width:800px){
 .animal{width:220px;height:220px}
 .tree{width:42%}.rock{width:29%}.bush{width:24%}.log{width:25%}
}
</style>
</head>
<body>
<div id="app">
  <div class="scene">
    <div class="sky-cloud c1"></div><div class="sky-cloud c2"></div>
    <div class="mountain m1"></div><div class="mountain m2"></div><div class="hill"></div><div class="river"></div><div class="grass"></div>

    <div class="header">
      <div class="avatar-card"><div class="face" id="faceMini">🐻</div><span id="topText">くまさんが<br>かくれるよ！</span></div>
      <div class="progress" id="progress"><div class="slot">●</div><div class="slot">●</div><div class="slot">●</div></div>
      <button class="iconbtn" id="soundBtn" aria-label="音">🔈</button>
      <button class="iconbtn" id="pauseBtn" aria-label="一時停止">Ⅱ</button>
    </div>

    <div id="animal" class="animal"></div>

    <svg id="tree" class="tree target" viewBox="0 0 430 720" aria-label="大きな木">
      <defs>
        <linearGradient id="trunkG" x1="0" x2="1"><stop stop-color="#7a431f"/><stop offset=".45" stop-color="#a8612f"/><stop offset="1" stop-color="#603719"/></linearGradient>
        <radialGradient id="leafG"><stop stop-color="#75d541"/><stop offset="1" stop-color="#2b8f35"/></radialGradient>
      </defs>
      <path d="M146 700 C135 520 160 390 167 280 C110 255 70 216 32 155 C72 165 116 190 164 210 C145 145 157 87 182 32 C205 99 211 144 211 196 C252 162 298 139 363 123 C321 175 284 214 227 246 C238 384 276 521 292 700Z" fill="url(#trunkG)"/>
      <path d="M190 210 C154 159 138 98 166 49" fill="none" stroke="#613516" stroke-width="15" stroke-linecap="round" opacity=".5"/>
      <path d="M203 278 C197 391 220 506 253 633" fill="none" stroke="#c37a43" stroke-width="14" stroke-linecap="round" opacity=".45"/>
      <g fill="url(#leafG)">
        <circle cx="82" cy="128" r="83"/><circle cx="161" cy="88" r="99"/><circle cx="250" cy="100" r="105"/><circle cx="331" cy="138" r="90"/>
        <circle cx="100" cy="203" r="90"/><circle cx="210" cy="184" r="108"/><circle cx="322" cy="211" r="95"/>
      </g>
      <g fill="#9be757" opacity=".75"><circle cx="112" cy="102" r="28"/><circle cx="270" cy="73" r="33"/><circle cx="344" cy="176" r="25"/><circle cx="183" cy="166" r="31"/></g>
      <g fill="#f8df58"><circle cx="97" cy="616" r="9"/><circle cx="320" cy="645" r="8"/></g>
    </svg>

    <svg id="rock" class="rock target" viewBox="0 0 360 270" aria-label="岩">
      <defs><linearGradient id="rockG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8d3c4"/><stop offset=".55" stop-color="#9e9b90"/><stop offset="1" stop-color="#77766f"/></linearGradient></defs>
      <path d="M24 244 C15 203 38 153 73 119 C107 85 112 43 165 24 C230 1 276 44 305 91 C339 144 356 188 334 244Z" fill="url(#rockG)" stroke="#777268" stroke-width="8"/>
      <path d="M76 154 C112 123 154 116 191 122" fill="none" stroke="#eee9dc" stroke-width="9" stroke-linecap="round" opacity=".75"/>
      <path d="M236 61 C268 83 286 105 298 137" fill="none" stroke="#78766f" stroke-width="10" stroke-linecap="round" opacity=".35"/>
    </svg>

    <svg id="bush" class="bush target" viewBox="0 0 350 220" aria-label="草むら">
      <defs><radialGradient id="bushG"><stop stop-color="#7dd652"/><stop offset="1" stop-color="#2d8f35"/></radialGradient></defs>
      <g fill="url(#bushG)" stroke="#2d7e32" stroke-width="3">
        <circle cx="70" cy="130" r="58"/><circle cx="126" cy="87" r="70"/><circle cx="186" cy="96" r="73"/><circle cx="250" cy="110" r="68"/><circle cx="300" cy="143" r="51"/><circle cx="174" cy="147" r="70"/>
      </g>
      <g fill="#a7ea6f"><ellipse cx="93" cy="75" rx="14" ry="8" transform="rotate(-30 93 75)"/><ellipse cx="230" cy="64" rx="15" ry="8" transform="rotate(25 230 64)"/><ellipse cx="278" cy="126" rx="14" ry="8" transform="rotate(-20 278 126)"/></g>
    </svg>

    <svg id="log" class="log target" viewBox="0 0 380 220" aria-label="丸太">
      <defs><linearGradient id="logG" x1="0" x2="1"><stop stop-color="#6d3d1d"/><stop offset=".45" stop-color="#a9652f"/><stop offset="1" stop-color="#5d3218"/></linearGradient></defs>
      <path d="M70 64 C130 41 234 38 322 59 L338 163 C244 160 139 165 70 139Z" fill="url(#logG)" stroke="#5d351b" stroke-width="8"/>
      <ellipse cx="68" cy="102" rx="55" ry="63" fill="#8b5127" stroke="#5c3318" stroke-width="8"/>
      <ellipse cx="68" cy="102" rx="30" ry="36" fill="#3c2719"/><path d="M58 70 C67 87 72 113 65 134" fill="none" stroke="#b8773e" stroke-width="6"/>
    </svg>

    <button class="homebtn" aria-label="ホーム">⌂</button>
    <button class="hintbtn" id="hintBtn">🔍 ヒント</button>
    <div class="prompt" id="prompt">くまさん どこかな？ 🐾</div>

    <div id="celebrate" class="celebrate">
      <div class="card">
        <h1>みーつけた！</h1>
        <div id="bigAnimal" style="width:240px;height:240px;margin:10px auto"></div>
        <p id="reaction">ばあ！</p>
        <button id="nextBtn" class="again">つぎへ ➜</button>
      </div>
    </div>
  </div>
</div>
<script>
const animalEl=document.getElementById('animal');
const prompt=document.getElementById('prompt');
const topText=document.getElementById('topText');
const faceMini=document.getElementById('faceMini');
const celebrate=document.getElementById('celebrate');
const bigAnimal=document.getElementById('bigAnimal');
const reaction=document.getElementById('reaction');
const nextBtn=document.getElementById('nextBtn');
const targets=[...document.querySelectorAll('.target')];
const spots=[
 {id:'tree',x:23,y:52,peekX:31,peekY:49,label:'おおきな木'},
 {id:'rock',x:81,y:50,peekX:77,peekY:46,label:'岩'},
 {id:'bush',x:68,y:69,peekX:66,peekY:61,label:'草むら'},
 {id:'log',x:87,y:79,peekX:82,peekY:76,label:'丸太'}
];
const animals=[
 {name:'くまさん',mini:'🐻',kind:'bear',reaction:'ばあ！ みーつかった〜！'},
 {name:'うさぎさん',mini:'🐰',kind:'rabbit',reaction:'ぴょーん！ いたよ〜！'},
 {name:'らいおんさん',mini:'🦁',kind:'lion',reaction:'がおー！ みつかった！'}
];
let round=0,found=0,currentAnimal,currentSpot,searching=false,hintLevel=0,hintTimer=null,paused=false;

function animalSvg(kind){
 if(kind==='rabbit') return `<svg viewBox="0 0 220 220"><defs><radialGradient id="furR"><stop stop-color="#fff"/><stop offset="1" stop-color="#ddd8d1"/></radialGradient></defs><ellipse cx="82" cy="54" rx="24" ry="55" fill="#f2eee8" stroke="#c6bdb3" stroke-width="6"/><ellipse cx="138" cy="54" rx="24" ry="55" fill="#f2eee8" stroke="#c6bdb3" stroke-width="6"/><ellipse cx="82" cy="54" rx="10" ry="38" fill="#f4a5b8"/><ellipse cx="138" cy="54" rx="10" ry="38" fill="#f4a5b8"/><circle cx="110" cy="116" r="70" fill="url(#furR)" stroke="#c6bdb3" stroke-width="6"/><circle cx="83" cy="106" r="9" fill="#2f241f"/><circle cx="137" cy="106" r="9" fill="#2f241f"/><ellipse cx="110" cy="130" rx="12" ry="9" fill="#e98291"/><path d="M110 138 Q96 152 83 142 M110 138 Q124 152 138 142" fill="none" stroke="#5d4135" stroke-width="5" stroke-linecap="round"/><circle cx="72" cy="130" r="13" fill="#f6b8c5" opacity=".6"/><circle cx="148" cy="130" r="13" fill="#f6b8c5" opacity=".6"/></svg>`;
 if(kind==='lion') return `<svg viewBox="0 0 220 220"><defs><radialGradient id="mane"><stop stop-color="#d98735"/><stop offset="1" stop-color="#8e4b22"/></radialGradient><radialGradient id="faceL"><stop stop-color="#ffd77a"/><stop offset="1" stop-color="#eeb14d"/></radialGradient></defs><circle cx="110" cy="112" r="91" fill="url(#mane)"/><circle cx="110" cy="115" r="67" fill="url(#faceL)" stroke="#a45d27" stroke-width="5"/><circle cx="84" cy="104" r="9" fill="#30231c"/><circle cx="136" cy="104" r="9" fill="#30231c"/><ellipse cx="110" cy="129" rx="15" ry="11" fill="#5b351f"/><path d="M110 138 Q94 153 78 143 M110 138 Q127 153 143 143" fill="none" stroke="#6b4027" stroke-width="5" stroke-linecap="round"/><circle cx="76" cy="131" r="11" fill="#f5a46e" opacity=".6"/><circle cx="145" cy="131" r="11" fill="#f5a46e" opacity=".6"/></svg>`;
 return `<svg viewBox="0 0 220 220"><defs><radialGradient id="furB"><stop stop-color="#c97a43"/><stop offset="1" stop-color="#7f4528"/></radialGradient><linearGradient id="scarf" x1="0" x2="1"><stop stop-color="#ffd24d"/><stop offset="1" stop-color="#f59b28"/></linearGradient></defs><circle cx="62" cy="65" r="31" fill="#8b4d2d"/><circle cx="158" cy="65" r="31" fill="#8b4d2d"/><circle cx="62" cy="65" r="16" fill="#d59a71"/><circle cx="158" cy="65" r="16" fill="#d59a71"/><circle cx="110" cy="116" r="76" fill="url(#furB)" stroke="#713d24" stroke-width="5"/><ellipse cx="110" cy="135" rx="42" ry="31" fill="#e8b98c"/><circle cx="84" cy="107" r="9" fill="#2d2019"/><circle cx="136" cy="107" r="9" fill="#2d2019"/><ellipse cx="110" cy="126" rx="13" ry="10" fill="#3c2419"/><path d="M110 136 Q96 152 82 141 M110 136 Q125 152 140 141" fill="none" stroke="#5b3522" stroke-width="5" stroke-linecap="round"/><path d="M67 168 Q110 195 155 167 L143 205 L111 187 L79 205Z" fill="url(#scarf)" stroke="#d98020" stroke-width="4"/><circle cx="94" cy="185" r="5" fill="#fff2a2"/><circle cx="124" cy="190" r="5" fill="#fff2a2"/></svg>`;
}
function setAnimal(kind){animalEl.innerHTML=animalSvg(kind)}
function setProgress(){
 [...document.querySelectorAll('.slot')].forEach((s,i)=>{s.classList.toggle('done',i<found);s.textContent=i<found?'★':'●'})
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}

async function startRound(){
 clearInterval(hintTimer); hintLevel=0; searching=false; targets.forEach(t=>t.classList.remove('wiggle'));
 currentAnimal=animals[round%animals.length];
 currentSpot=spots[Math.floor(Math.random()*spots.length)];
 faceMini.textContent=currentAnimal.mini;
 topText.innerHTML=`${currentAnimal.name}が<br>かくれるよ！`;
 setAnimal(currentAnimal.kind);
 animalEl.className='animal';
 animalEl.style.left='14%';animalEl.style.top='40%';
 prompt.textContent=`${currentAnimal.name}が きたよ！`;
 await wait(900);
 if(paused)return;
 animalEl.style.left=currentSpot.x+'%'; animalEl.style.top=currentSpot.y+'%';
 prompt.textContent=`${currentAnimal.name} かくれるよ〜`;
 await wait(950);
 if(paused)return;
 animalEl.style.left=currentSpot.peekX+'%'; animalEl.style.top=currentSpot.peekY+'%';
 animalEl.style.transform='translate(-50%,-50%) scale(.82)';
 animalEl.classList.add('searching');
 searching=true;
 prompt.textContent=`${currentAnimal.name} どこかな？ 🐾`;
 startHints();
}
function startHints(){
 clearInterval(hintTimer);
 hintTimer=setInterval(()=>{
  if(!searching||paused)return;
  hintLevel=Math.min(3,hintLevel+1);
  if(hintLevel===1) prompt.textContent='よ〜く みてみよう 👀';
  if(hintLevel===2){document.getElementById(currentSpot.id).classList.add('wiggle');prompt.textContent=currentSpot.label+'が あやしいよ！'}
  if(hintLevel===3){animalEl.style.transform='translate(-50%,-50%) scale(.94)';prompt.textContent=currentAnimal.name+'が ちらっ！'}
 },3500);
}
function sparks(){
 const app=document.getElementById('app');
 for(let i=0;i<12;i++){
  const s=document.createElement('div');s.className='spark go';s.textContent=i%3===0?'★':'✦';s.style.left='50%';s.style.top='48%';
  s.style.setProperty('--dx',(Math.random()*360-180)+'px');s.style.setProperty('--dy',(Math.random()*260-180)+'px');app.appendChild(s);setTimeout(()=>s.remove(),950)
 }
}
async function foundAnimal(){
 if(!searching)return;
 searching=false;clearInterval(hintTimer);targets.forEach(t=>t.classList.remove('wiggle'));
 animalEl.classList.add('found');prompt.textContent='みーつけた！';
 sparks(); await wait(700);
 found++;setProgress();
 bigAnimal.innerHTML=animalSvg(currentAnimal.kind);reaction.textContent=currentAnimal.reaction;celebrate.classList.add('show');
}
targets.forEach(t=>t.addEventListener('click',()=>{if(searching&&t.id===currentSpot.id)foundAnimal();else if(searching)prompt.textContent='そこも みてみよう！'}));
animalEl.addEventListener('click',foundAnimal);
document.getElementById('hintBtn').addEventListener('click',()=>{if(searching){document.getElementById(currentSpot.id).classList.add('wiggle');prompt.textContent=currentSpot.label+'の ところかな？'}});
nextBtn.addEventListener('click',()=>{celebrate.classList.remove('show');if(found>=3){found=0;round=0;setProgress();}else round++;startRound()});
document.getElementById('pauseBtn').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';if(!paused)startRound()});
document.getElementById('soundBtn').addEventListener('click',e=>{e.currentTarget.textContent=e.currentTarget.textContent==='🔈'?'🔇':'🔈'});
setProgress();startRound();
</script>
</body>
</html>
