<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Trig Rush</title><style>body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh}.loading{text-align:center}.bar{width:180px;height:6px;border-radius:99px;background:#1a2a43;overflow:hidden;margin:16px auto}.bar:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,#50a8ff,#29f0d5);animation:load 1s infinite alternate}@keyframes load{to{transform:translateX(120%)}}</style></head><body><div class="loading"><strong>CITY TRIG RUSH</strong><div class="bar"></div><small>Loading...</small></div><script>(async()=>{try{const names=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<p>読み込みに失敗しました。ページを再読み込みしてください。</p>'}})();</script></body></html>
