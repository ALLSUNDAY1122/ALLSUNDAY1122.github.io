<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-037 個別独立再作図</title><desc>⑦で示す部分の最少電線本数（心線数）は。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-037｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="100" y="190" width="260" height="150" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="195" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">配線図上の対象箇所</text><circle cx="500" cy="265" r="62" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="480" y="275" font-family="sans-serif" font-size="30" fill="#1e293b">7</text><path d="M360 265 H438" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="235" font-family="sans-serif" font-size="20" fill="#1e293b">対象：</text><text x="600" y="275" font-family="sans-serif" font-size="17" fill="#1e293b">⑦で示す部分の最少電線本数（心線</text><text x="100" y="410" font-family="sans-serif" font-size="18" fill="#1e293b">個別参照番号 7 の器具・電路条件を独立模式化</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">⑦で示す部分の最少電線本数（心線数）は。</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>