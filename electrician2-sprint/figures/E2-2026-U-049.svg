<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-049 個別独立再作図</title><desc>⑲で示すボックス内の接続をすべて差込形コネクタとする場合，使用する差込形コネクタの種類と最少個数の組合せで，正しいものは。ただし，使用する電線はすべてVVF1.6とする。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-049｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="80" y="170" width="155" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="140" y="205" font-family="sans-serif" font-size="21" fill="#1e293b">イ</text><path d="M110 270 H205 M157 235 V315" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="157" cy="270" r="10" fill="white" stroke="#334155" stroke-width="2"/><rect x="275" y="170" width="155" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="335" y="205" font-family="sans-serif" font-size="21" fill="#1e293b">ロ</text><path d="M305 270 H400 M352 235 V315" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="352" cy="270" r="13" fill="white" stroke="#334155" stroke-width="2"/><rect x="470" y="170" width="155" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="530" y="205" font-family="sans-serif" font-size="21" fill="#1e293b">ハ</text><path d="M500 270 H595 M547 235 V315" fill="none" stroke="#9333ea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="547" cy="270" r="16" fill="white" stroke="#334155" stroke-width="2"/><rect x="665" y="170" width="155" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="725" y="205" font-family="sans-serif" font-size="21" fill="#1e293b">ニ</text><path d="M695 270 H790 M742 235 V315" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="742" cy="270" r="19" fill="white" stroke="#334155" stroke-width="2"/><text x="80" y="420" font-family="sans-serif" font-size="18" fill="#1e293b">選択肢の機能・構造を表す独立模式図（原図転写なし）</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">⑲で示すボックス内の接続をすべて差込形コネクタとする場合，使用する差込形コネクタの種類と最少個数の組合せで，正しいものは。ただし，使用する電</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>