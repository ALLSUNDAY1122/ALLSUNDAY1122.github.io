<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-010 個別独立再作図</title><desc>低圧屋内配線の分岐回路の設計で，配線用遮断器，分岐回路の電線の太さ及びコンセントの組合せとして，適切なものは。ただし，分岐点から配線用遮断器までは3 m，配線用遮断器からコンセントまでは8 mとし，電線の数値は分岐回路の電線（軟銅線）の太さを示す。また，コンセントは兼用コンセントではないものとする。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-010｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="220" width="160" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="135" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">配線用遮断器</text><rect x="380" y="220" width="160" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="425" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">分岐回路電線</text><rect x="660" y="220" width="150" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="700" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">コンセント</text><path d="M250 265 H380 M540 265 H660" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="170" font-family="sans-serif" font-size="20" fill="#1e293b">定格・電線太さ・負荷条件</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">低圧屋内配線の分岐回路の設計で，配線用遮断器，分岐回路の電線の太さ及びコンセントの組合せとして，適切なものは。ただし，分岐点から配線用遮断器</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>