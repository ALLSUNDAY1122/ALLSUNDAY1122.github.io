<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-026 個別独立再作図</title><desc>直読式接地抵抗計を用いて，接地抵抗を測定する場合，被測定接地極 E に対する，2つの補助接地極 S（P）（電圧用）及び H（C）（電流用）の配置として，適切なものは。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-026｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="190" width="150" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="130" y="242" font-family="sans-serif" font-size="18" fill="#1e293b">接地抵抗計</text><path d="M240 235 H350 V350 H760" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 350 V420" stroke="#92400e" stroke-width="8"/><text x="340" y="455" font-family="sans-serif" font-size="18" fill="#1e293b">E</text><path d="M550 350 V420" stroke="#92400e" stroke-width="8"/><text x="540" y="455" font-family="sans-serif" font-size="18" fill="#1e293b">S(P)</text><path d="M760 350 V420" stroke="#92400e" stroke-width="8"/><text x="750" y="455" font-family="sans-serif" font-size="18" fill="#1e293b">H(C)</text><text x="360" y="315" font-family="sans-serif" font-size="18" fill="#1e293b">補助接地極の配置</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">直読式接地抵抗計を用いて，接地抵抗を測定する場合，被測定接地極 E に対する，2つの補助接地極 S（P）（電圧用）及び H（C）（電流用）の</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>