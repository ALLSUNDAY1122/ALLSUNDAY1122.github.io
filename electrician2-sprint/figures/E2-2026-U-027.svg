<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-027 個別独立再作図</title><desc>単相3線式回路の漏れ電流の有無を，クランプ形漏れ電流計を用いて測定する場合の測定方法として，正しいものは。ただし，図中の破線は中性線を示す。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-027｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="220" width="130" height="80" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="120" y="267" font-family="sans-serif" font-size="18" fill="#1e293b">単相電源</text><rect x="650" y="220" width="130" height="80" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="680" y="267" font-family="sans-serif" font-size="18" fill="#1e293b">負荷</text><path d="M220 240 H650 M220 280 H650" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="240" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="350" y="247" font-family="sans-serif" font-size="20" fill="#1e293b">V</text><circle cx="480" cy="240" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="470" y="247" font-family="sans-serif" font-size="20" fill="#1e293b">A</text><circle cx="560" cy="240" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="550" y="247" font-family="sans-serif" font-size="20" fill="#1e293b">W</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">単相3線式回路の漏れ電流の有無を，クランプ形漏れ電流計を用いて測定する場合の測定方法として，正しいものは。ただし，図中の破線は中性線を示す。</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>