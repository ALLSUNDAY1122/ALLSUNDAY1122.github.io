<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-005 個別独立再作図</title><desc>図のような三相3線式200 Vの回路で，c o 間の抵抗が断線した。断線前と断線後の a o 間の電圧 V の値［V］の組合せとして，正しいものは。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-005｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="200" width="130" height="80" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="120" y="247" font-family="sans-serif" font-size="18" fill="#1e293b">三相電源</text><rect x="430" y="130" width="140" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="465" y="169.5" font-family="sans-serif" font-size="18" fill="#1e293b">R相負荷</text><rect x="430" y="235" width="140" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="465" y="274.5" font-family="sans-serif" font-size="18" fill="#1e293b">S相負荷</text><rect x="430" y="340" width="140" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="465" y="379.5" font-family="sans-serif" font-size="18" fill="#1e293b">T相負荷</text><path d="M220 240 H330 V162 H430 M330 240 H430 M330 240 V372 H430" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="255" font-family="sans-serif" font-size="22" fill="#1e293b">線電流 I</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図のような三相3線式200 Vの回路で，c o 間の抵抗が断線した。断線前と断線後の a o 間の電圧 V の値［V］の組合せとして，正しい</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>