<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>E2-2026-U 集合住宅 配線構成模式図</title><desc>鉄筋コンクリート造集合住宅の一戸を、部屋の機能配置と分電盤の回路別系統として独立して模式化した図。</desc><defs><style>text{font-family:sans-serif;fill:#1e293b}.room{fill:#fff;stroke:#64748b;stroke-width:3}.wire{fill:none;stroke:#0f766e;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#64748b;stroke-width:2}.label{font-size:20px}.small{font-size:15px}.head{font-size:30px;font-weight:bold}.circ{fill:#ecfeff;stroke:#0f766e;stroke-width:2}</style></defs><rect width="1400" height="1000" fill="#fff"/><text x="55" y="55" class="head">2026年度上期｜集合住宅の屋内配線・回路系統（独立模式図）</text><text x="55" y="88" class="small">原典15頁の技術情報をもとに、空間構成・回路分担を再構成。原図の間取り線・器具配置・引出線は転写していない。</text>
<rect x="55" y="130" width="850" height="790" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<rect class="room" x="85" y="165" width="340" height="210"/><text x="255" y="205" text-anchor="middle" class="label">洋室・和室</text><text x="255" y="235" text-anchor="middle" class="small">照明・一般コンセント</text>
<rect class="room" x="425" y="165" width="220" height="210"/><text x="535" y="205" text-anchor="middle" class="label">玄関・廊下</text><text x="535" y="235" text-anchor="middle" class="small">照明・屋外照明</text>
<rect class="room" x="645" y="165" width="230" height="210"/><text x="760" y="205" text-anchor="middle" class="label">浴室・洗面所</text><text x="760" y="235" text-anchor="middle" class="small">照明・換気扇・コンセント</text>
<rect class="room" x="85" y="375" width="340" height="190"/><text x="255" y="415" text-anchor="middle" class="label">リビング</text><text x="255" y="445" text-anchor="middle" class="small">照明・コンセント</text>
<rect class="room" x="425" y="375" width="220" height="190"/><text x="535" y="415" text-anchor="middle" class="label">ダイニング</text><text x="535" y="445" text-anchor="middle" class="small">照明・コンセント</text>
<rect class="room" x="645" y="375" width="230" height="190"/><text x="760" y="415" text-anchor="middle" class="label">台所</text><text x="760" y="445" text-anchor="middle" class="small">照明・換気扇・専用回路</text>
<rect class="room" x="85" y="565" width="340" height="160"/><text x="255" y="605" text-anchor="middle" class="label">ベランダ・屋外</text><text x="255" y="635" text-anchor="middle" class="small">防雨形コンセント・屋外照明</text>
<rect class="room" x="425" y="565" width="450" height="160"/><text x="650" y="605" text-anchor="middle" class="label">便所・水回り周辺</text><text x="650" y="635" text-anchor="middle" class="small">照明・換気・接地端子付機器</text>
<rect x="85" y="755" width="790" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="110" y="790" font-size="21" font-weight="bold">屋内電灯分電盤・計量部</text><rect x="110" y="810" width="100" height="48" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="160" y="840" text-anchor="middle" class="small">電力量計</text><path d="M210 834 H280" stroke="#1d4ed8" stroke-width="3"/><rect x="280" y="810" width="120" height="48" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="340" y="840" text-anchor="middle" class="small">主幹・漏電保護</text>
<g class="wire"><path d="M400 834 H455 V775 H255 V725"/><path d="M455 775 H535 V565"/><path d="M455 775 H760 V565"/><path d="M455 775 V375 H255"/><path d="M455 775 V165 H535"/><path d="M455 775 H760 V375"/><path d="M455 775 H255 V165"/></g>
<g><circle class="circ" cx="255" cy="165" r="18"/><text x="255" y="171" text-anchor="middle" class="small">a</text><circle class="circ" cx="535" cy="165" r="18"/><text x="535" y="171" text-anchor="middle" class="small">b</text><circle class="circ" cx="760" cy="165" r="18"/><text x="760" y="171" text-anchor="middle" class="small">c</text><circle class="circ" cx="255" cy="375" r="18"/><text x="255" y="381" text-anchor="middle" class="small">d</text><circle class="circ" cx="535" cy="375" r="18"/><text x="535" y="381" text-anchor="middle" class="small">e</text><circle class="circ" cx="760" cy="375" r="18"/><text x="760" y="381" text-anchor="middle" class="small">f</text><circle class="circ" cx="255" cy="565" r="18"/><text x="255" y="571" text-anchor="middle" class="small">g</text></g>
<rect x="955" y="130" width="390" height="790" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="985" y="175" font-size="24" font-weight="bold">分電盤回路表（模式）</text><text x="985" y="215" class="small">単相3線式 100/200 V</text><text x="985" y="255" class="small">回路 a〜e：100 V 分岐</text><text x="985" y="285" class="small">回路 f：200 V 分岐</text><text x="985" y="315" class="small">回路 g：リビング・ダイニング</text><path d="M985 345 H1310" class="thin"/><g class="small"><text x="985" y="385">a　洋室・和室の照明／コンセント</text><text x="985" y="435">b　玄関・廊下・屋外照明</text><text x="985" y="485">c　浴室・洗面所・便所</text><text x="985" y="535">d　台所照明・コンセント・換気扇</text><text x="985" y="585">e　リビング・ダイニング・屋外</text><text x="985" y="635">f　ルームエアコン専用（200 V）</text><text x="985" y="685">g　台所専用コンセント（100 V）</text></g><path d="M985 715 H1310" class="thin"/><text x="985" y="755" class="small">図示は回路分担の概念図。</text><text x="985" y="785" class="small">実際の配線経路・電線本数・器具</text><text x="985" y="815" class="small">位置・寸法を示す施工図ではない。</text><text x="985" y="870" class="small">問題31〜40の参照対象：①〜⑩</text></svg>