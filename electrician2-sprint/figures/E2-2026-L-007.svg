<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-007 個別独立再作図</title><desc>図のような単相3線式回路で，消費電力100 W，500 Wの2つの負荷はともに抵抗負荷である。図中の×印点で断線した場合，a b 間の電圧［V］は。ただし，断線によって負荷の抵抗値は変化しないものとする。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-007｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="210" width="130" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="120" y="262" font-family="sans-serif" font-size="18" fill="#1e293b">単相3線電源</text><rect x="490" y="155" width="160" height="70" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="535" y="197" font-family="sans-serif" font-size="18" fill="#1e293b">抵抗負荷100W</text><rect x="490" y="315" width="160" height="70" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="535" y="357" font-family="sans-serif" font-size="18" fill="#1e293b">抵抗負荷500W</text><path d="M220 255 H350 V190 H490 M350 190 V350 H490 M220 255 V350 H350" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 245 L430 275 M430 245 L400 275" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="225" font-family="sans-serif" font-size="16" fill="#1e293b">断線点</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図のような単相3線式回路で，消費電力100 W，500 Wの2つの負荷はともに抵抗負荷である。図中の×印点で断線した場合，a b 間の電圧［</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>