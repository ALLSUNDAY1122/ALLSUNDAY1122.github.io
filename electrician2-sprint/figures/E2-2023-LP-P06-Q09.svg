<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>低圧屋内幹線からの分岐回路</title><desc>技術情報に基づく独立模式図。原典の線画・配置をトレースしていない。</desc><rect width="900" height="560" fill="white"/><g fill="none" stroke="#17212b" stroke-width="4" stroke-linejoin="round"><path d="M100 260H780"/><rect x="170" y="205" width="100" height="110" fill="white"/><path d="M220 205V315 M270 260H780"/><rect x="650" y="205" width="100" height="110" fill="white"/><path d="M700 205V315"/></g><g font-family="sans-serif" font-size="24" fill="#17212b"><text x="80" y="220">幹線</text><text x="160" y="190">配線用遮断器</text><text x="193" y="270">50 A</text><text x="365" y="210">VVR 8 mm²</text><text x="365" y="245">許容電流 42 A</text><text x="650" y="190">分岐先</text><text x="420" y="350">a</text><text x="700" y="350">b</text><text x="350" y="420">a–b間の長さを検討</text></g></svg>