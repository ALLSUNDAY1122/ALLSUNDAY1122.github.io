<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-021 個別独立再作図</title><desc>図に示す一般的な低圧屋内配線の工事で，スイッチボックス部分の回路は。ただし，aは電源からの非接地側電線（黒色），bは電源からの接地側電線（白色）を示し，負荷には電源からの接地側電線が直接に結線されているものとする。なお，パイロットランプは100 V用を使用する。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-021｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="120" y="210" width="160" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="165" y="262" font-family="sans-serif" font-size="18" fill="#1e293b">電源 a / b</text><rect x="380" y="190" width="180" height="140" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="435" y="267" font-family="sans-serif" font-size="18" fill="#1e293b">スイッチBOX</text><rect x="650" y="210" width="140" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="685" y="262" font-family="sans-serif" font-size="18" fill="#1e293b">照明負荷</text><path d="M280 240 H380 M560 240 H650 M280 270 H330 V315 H380" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="385" y="365" font-family="sans-serif" font-size="18" fill="#1e293b">点滅器＋確認表示灯</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図に示す一般的な低圧屋内配線の工事で，スイッチボックス部分の回路は。ただし，aは電源からの非接地側電線（黒色），bは電源からの接地側電線（白</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>