<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-004 個別独立再作図</title><desc>図のような交流回路で，負荷に対してコンデンサ C を設置して，力率を100％に改善した。このときの電流計の指示値は。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-004｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="120" y="220" width="140" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="155" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">交流電源</text><rect x="610" y="220" width="150" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="650" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">負荷</text><rect x="380" y="350" width="130" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="410" y="389.5" font-family="sans-serif" font-size="18" fill="#1e293b">C</text><path d="M260 265 H610 M445 350 V310 M445 310 H610" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="180" font-family="sans-serif" font-size="21" fill="#1e293b">力率改善回路</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図のような交流回路で，負荷に対してコンデンサ C を設置して，力率を100％に改善した。このときの電流計の指示値は。</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>