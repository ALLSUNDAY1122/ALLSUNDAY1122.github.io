<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-U-009 個別独立再作図</title><desc>図のように，三相の電動機と電熱器が低圧屋内幹線に接続されている場合，幹線の太さを決める根拠となる電流の最小値［A］は。ただし，需要率は100％とする。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-U-009｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="220" width="150" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="130" y="272" font-family="sans-serif" font-size="18" fill="#1e293b">幹線</text><rect x="520" y="130" width="150" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="560" y="169.5" font-family="sans-serif" font-size="18" fill="#1e293b">電熱器 H 5A</text><rect x="520" y="230" width="150" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="560" y="269.5" font-family="sans-serif" font-size="18" fill="#1e293b">電動機 M 5A</text><rect x="520" y="330" width="150" height="65" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="560" y="369.5" font-family="sans-serif" font-size="18" fill="#1e293b">電動機 M 15A</text><path d="M240 265 H380 V162 H520 M380 265 H520 M380 265 V362 H520" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図のように，三相の電動機と電熱器が低圧屋内幹線に接続されている場合，幹線の太さを決める根拠となる電流の最小値［A］は。ただし，需要率は100</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>