<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-006 個別独立再作図</title><desc>図のような単相2線式回路で，電源電圧は105 V，電線1線当たりの抵抗は0.25 Ωである。スイッチ S を閉じると，抵抗負荷の両端の電圧は100 Vになった。この配線の電力損失［W］は。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-006｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="90" y="200" width="130" height="80" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="120" y="247" font-family="sans-serif" font-size="18" fill="#1e293b">105V電源</text><rect x="360" y="145" width="170" height="70" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="410" y="187" font-family="sans-serif" font-size="18" fill="#1e293b">線路抵抗0.25Ω</text><rect x="360" y="300" width="170" height="70" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="410" y="342" font-family="sans-serif" font-size="18" fill="#1e293b">線路抵抗0.25Ω</text><rect x="650" y="220" width="150" height="110" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="690" y="282" font-family="sans-serif" font-size="18" fill="#1e293b">抵抗負荷</text><path d="M220 240 H360 M530 180 H600 V240 H650 M220 240 V340 H360 M530 335 H650" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="205" font-family="sans-serif" font-size="18" fill="#1e293b">負荷端100V</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">図のような単相2線式回路で，電源電圧は105 V，電線1線当たりの抵抗は0.25 Ωである。スイッチ S を閉じると，抵抗負荷の両端の電圧は</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>