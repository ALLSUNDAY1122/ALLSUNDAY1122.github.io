<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><title>E2-2026-L 木造3階建住宅 配線構成模式図</title><desc>木造三階建て住宅の各階と二つの分電盤L-1、L-2の回路系統を独立して模式化。</desc><defs><style>text{font-family:sans-serif;fill:#1e293b}.room{fill:#fff;stroke:#64748b;stroke-width:3}.wire{fill:none;stroke:#0f766e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#64748b;stroke-width:2}.small{font-size:15px}.label{font-size:22px;font-weight:bold}.head{font-size:30px;font-weight:bold}.circ{fill:#ecfeff;stroke:#0f766e;stroke-width:2}</style></defs><rect width="1500" height="1100" fill="#fff"/><text x="55" y="55" class="head">2026年度下期｜木造3階建住宅の階別配線・分電盤系統（独立模式図）</text><text x="55" y="88" class="small">原典15頁の技術情報をもとに、階層と系統の関係を再構成。原図の間取り線・器具配置・引出線は転写していない。</text>
<rect x="55" y="130" width="920" height="860" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<rect class="room" x="90" y="165" width="400" height="210"/><text x="290" y="205" text-anchor="middle" class="label">3階｜屋上・和室</text><text x="290" y="240" text-anchor="middle" class="small">照明・コンセント・屋外設備</text><rect class="room" x="490" y="165" width="450" height="210"/><text x="715" y="205" text-anchor="middle" class="label">3階｜居室</text><text x="715" y="240" text-anchor="middle" class="small">単相100 V分岐回路</text>
<rect class="room" x="90" y="375" width="400" height="230"/><text x="290" y="415" text-anchor="middle" class="label">2階｜洋室群</text><text x="290" y="450" text-anchor="middle" class="small">照明・一般コンセント</text><rect class="room" x="490" y="375" width="450" height="230"/><text x="715" y="415" text-anchor="middle" class="label">2階｜階段・ベランダ</text><text x="715" y="450" text-anchor="middle" class="small">照明・屋外コンセント</text>
<rect class="room" x="90" y="605" width="400" height="235"/><text x="290" y="645" text-anchor="middle" class="label">1階｜和室・居間</text><text x="290" y="680" text-anchor="middle" class="small">照明・コンセント</text><rect class="room" x="490" y="605" width="450" height="235"/><text x="715" y="645" text-anchor="middle" class="label">1階｜台所・浴室・便所</text><text x="715" y="680" text-anchor="middle" class="small">換気・水回り・専用回路</text>
<rect x="90" y="840" width="850" height="115" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="880" font-size="22" font-weight="bold">電力量計・引込／主幹保護</text><text x="115" y="915" class="small">単相3線式 100/200 V　屋外引込から各階系統へ</text>
<g class="wire"><path d="M940 895 H915 V270 H715"/><path d="M915 500 H715"/><path d="M915 720 H715"/><path d="M915 270 H290"/><path d="M915 500 H290"/><path d="M915 720 H290"/></g><g><circle class="circ" cx="290" cy="165" r="18"/><text x="290" y="171" text-anchor="middle" class="small">a〜d</text><circle class="circ" cx="715" cy="165" r="18"/><text x="715" y="171" text-anchor="middle" class="small">e</text><circle class="circ" cx="290" cy="375" r="18"/><text x="290" y="381" text-anchor="middle" class="small">f〜h</text><circle class="circ" cx="715" cy="375" r="18"/><text x="715" y="381" text-anchor="middle" class="small">i</text><circle class="circ" cx="290" cy="605" r="18"/><text x="290" y="611" text-anchor="middle" class="small">j</text><circle class="circ" cx="715" cy="605" r="18"/><text x="715" y="611" text-anchor="middle" class="small">k</text></g>
<rect x="1010" y="130" width="435" height="400" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="1040" y="175" font-size="25" font-weight="bold">1階分電盤 L-1</text><text x="1040" y="220" class="small">主幹：漏電保護付遮断器</text><text x="1040" y="260" class="small">分岐：100 V回路群 a〜f</text><text x="1040" y="300" class="small">分岐：200 Vルームエアコン回路</text><path d="M1040 330 H1410" class="thin"/><g class="small"><text x="1040" y="370">・1階の照明、コンセント、水回り</text><text x="1040" y="410">・屋外設備および専用負荷</text><text x="1040" y="450">・上階分電盤への幹線系統</text></g><rect x="1010" y="570" width="435" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1040" y="615" font-size="25" font-weight="bold">2階分電盤 L-2</text><text x="1040" y="660" class="small">主幹：3極遮断器</text><text x="1040" y="700" class="small">分岐：100 V回路群 g〜k</text><text x="1040" y="740" class="small">分岐：200 Vルームエアコン回路</text><path d="M1040 770 H1410" class="thin"/><text x="1040" y="810" class="small">2・3階の負荷へ分岐給電</text>
<text x="1010" y="925" class="small">凡例：丸囲み英字は回路群の識別</text><text x="1010" y="955" class="small">100 V／200 V回路を区別して管理</text><text x="55" y="1040" class="small">問題31〜40の参照対象：①〜⑩。模式図であり、施工用の配線経路図・寸法図ではない。</text></svg>