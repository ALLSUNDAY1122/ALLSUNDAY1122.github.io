<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>E2-2026-L-023 個別独立再作図</title><desc>金属管工事で金属管とアウトレットボックスとを電気的に接続する方法として，施工上，最も適切なものは。</desc><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="sans-serif" font-size="25" fill="#1e293b">E2-2026-L-023｜個別図版</text><text x="40" y="85" font-family="sans-serif" font-size="15" fill="#1e293b">技術内容に基づく独立再構成／原典図のトレースなし</text><rect x="120" y="200" width="230" height="160" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="200" y="287" font-family="sans-serif" font-size="18" fill="#1e293b">アウトレットBOX</text><rect x="650" y="235" width="160" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="695" y="287" font-family="sans-serif" font-size="18" fill="#1e293b">金属管</text><path d="M350 280 H650" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="220" font-family="sans-serif" font-size="18" fill="#1e293b">接続金具・ロックナット</text><text x="40" y="500" font-family="sans-serif" font-size="15" fill="#1e293b">金属管工事で金属管とアウトレットボックスとを電気的に接続する方法として，施工上，最も適切なものは。</text><text x="40" y="535" font-family="sans-serif" font-size="13" fill="#1e293b">模式図。施工・測定の判断は本文条件および関連規程を確認。</text></svg>