<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>ITパスポート スワイプ</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--line:#29344c;--text:#f8fafc;--muted:#9aa7bd;--ok:#22c55e;--ng:#ef4444;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-weight:900;letter-spacing:.02em}.badge{font-size:12px;color:#bfdbfe;background:#1e3a5f;border:1px solid #31557f;padding:6px 9px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.stat{background:#111a2c;border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}
.progress{height:5px;background:#1e293b;border-radius:99px;overflow:hidden;margin-bottom:12px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}
.card-wrap{position:relative;min-height:530px}
.card{background:rgba(18,26,45,.98);border:1px solid #33415e;border-radius:24px;padding:18px;min-height:510px;box-shadow:0 20px 50px rgba(0,0,0,.3);touch-action:none;transition:transform .18s,opacity .18s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}
.q{font-size:18px;line-height:1.65;font-weight:800;margin:0 0 12px;white-space:pre-wrap}
.stem{font-size:13px;line-height:1.55;color:#d7deea;background:#0d1527;padding:10px;border-radius:12px;margin:8px 0}
.choices{display:grid;gap:9px;margin-top:13px}
.choice{width:100%;text-align:left;border:1px solid #35425d;background:#182238;border-radius:15px;padding:12px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.choice:active{transform:scale(.99)}.choice strong{display:grid;place-items:center;min-width:25px;height:25px;border-radius:8px;background:#283754}
.choice.correct{border-color:var(--ok);background:#113421}.choice.wrong{border-color:var(--ng);background:#3a171b}
.guide{text-align:center;color:var(--muted);font-size:12px;padding:10px 0}
.feedback{display:none;margin-top:13px;border-radius:16px;padding:14px;line-height:1.55;font-size:14px}
.feedback.show{display:block}.feedback.ok{background:#123522;border:1px solid #247a45}.feedback.ng{background:#3a171b;border:1px solid #8a3038}
.feedback b{display:block;font-size:16px;margin-bottom:5px}
.source{font-size:10px;line-height:1.5;color:#71809a;text-align:center;margin-top:12px}
.start{position:fixed;inset:0;background:#0b1020;z-index:5;display:grid;place-items:center;padding:24px}
.start.hide{display:none}.startbox{max-width:420px;width:100%}.start h1{font-size:31px;margin:0 0 8px}.start p{color:var(--muted);line-height:1.6}
.mode{width:100%;border:0;background:#2563eb;padding:16px;border-radius:17px;font-weight:900;font-size:17px;margin-top:10px}
.submode{width:100%;border:1px solid #344461;background:#17233a;padding:14px;border-radius:17px;font-weight:800;margin-top:9px}
.result{display:none;text-align:center;padding:40px 10px}.result.show{display:block}.result h2{font-size:32px}.big{font-size:50px;font-weight:1000}
@media(max-width:380px){.q{font-size:16px}.card{padding:14px}.card-wrap{min-height:560px}}
</style>
</head>
<body>
<div class="start" id="start"><div class="startbox"><div class="badge">Safari価値検証版 v0.2</div><h1>ITパスポート<br>スワイプ</h1><p>四択をタップ、またはカードを上下左右へスワイプ。<br>上＝ア／右＝イ／下＝ウ／左＝エ</p><button class="mode" data-count="12">12問スタート</button><button class="submode" data-count="60">チャレンジ60問（現在は12問を反復）</button><p style="font-size:12px">問題・正答：IPA 令和8年度公開問題。解説文は独自作成です。</p></div></div>
<div class="app"><header><div class="brand">ITパスポート スワイプ</div><div class="badge" id="comboBadge">COMBO 0</div></header><div class="stats"><div class="stat"><b id="now">0</b><span>問題</span></div><div class="stat"><b id="score">0</b><span>正解</span></div><div class="stat"><b id="rate">0%</b><span>正答率</span></div><div class="stat"><b id="best">0</b><span>最高連続</span></div></div><div class="progress"><i id="bar"></i></div><div class="card-wrap" id="quiz"><article class="card" id="card"><div class="meta"><span id="meta"></span><span id="num"></span></div><h2 class="q" id="question"></h2><div id="stem"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="guide">↑ ア　→ イ　↓ ウ　← エ</div><div class="source" id="source"></div></article></div><div class="result" id="result"><div class="badge">RESULT</div><h2>終了</h2><div class="big" id="finalScore"></div><p id="finalText"></p><button class="mode" id="again">もう一度</button></div></div>
<script>
const QUESTIONS=[{"id":"r08-001","year":"令和8年度","number":1,"field":"ストラテジ系","answer":0,"question":"生成AIを用いた生成物の取扱いに関して、既存の著作物の著作権者から許諾を得ることが必要となる可能性のあるものだけを、全て挙げたものはどれか。","stem":["a　好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し、その楽曲をインターネット上にアップロードし、無料で公開した。","b　好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し、その楽曲を自分のPC上に保管し、個人で視聴した。","c　生成AIで音楽を生成したところ、偶然好みのアーティストの楽曲に似た音楽が生成できたので、自分のPC上に保管し、個人で視聴した。"],"choices":["a","a、b","a、b、c","b、c"],"explanation":"正解はアです。既存作品に似せる意図があり、さらにインターネット上で公開するaは、著作権侵害となる可能性があるため、権利者の許諾が必要になる場合があります。bとcは私的使用の範囲に当たり得ます。ポイントは、生成AIを使ったかではなく、既存作品との類似性、依拠性、公開・利用の態様で判断することです。"},{"id":"r08-002","year":"令和8年度","number":2,"field":"ストラテジ系","answer":0,"question":"BYODに関する記述として、適切なものはどれか。","choices":["企業の業務に、従業員が私物の携帯情報端末を許可を得た上で利用すること","企業の業務の定型的な作業をソフトウェアのロボットで効率化すること","企業の業務の流れを分析し、継続的に改善、最適化していくこと","企業の業務の流れを見直し、抜本的にデザインし直すこと"],"explanation":"正解はアです。BYODはBring Your Own Deviceの略で、従業員が個人所有のスマートフォンやPCを、会社の許可と管理ルールの下で業務利用する考え方です。イはRPA、ウはBPM、エはBPRの説明です。"},{"id":"r08-003","year":"令和8年度","number":3,"field":"ストラテジ系","answer":2,"question":"投資会社A社がマクシミン戦略を採り、かつ、市況が好転した場合の利益はどれか。投資戦略aの利益は好転時20、悪化時−15、投資戦略bの利益は好転時5、悪化時0とする。","choices":["−15","0","5","20"],"explanation":"正解はウです。マクシミン戦略では、各戦略の最小利益を比較し、その中で最も大きい戦略を選びます。戦略aの最小値は−15、戦略bの最小値は0なので、戦略bを採用します。市況が好転した場合、戦略bの利益は5です。"},{"id":"r08-004","year":"令和8年度","number":4,"field":"ストラテジ系","answer":1,"question":"特定の目的の達成や課題の解決をテーマとして、ソフトウェアの開発者や企画者などが短期集中的にアイディアを出し合い、ソフトウェアの開発などの共同作業を行い、成果を競い合うイベントはどれか。","choices":["トレードフェア","ハッカソン","パネルディスカッション","レセプション"],"explanation":"正解はイです。ハッカソンは、ハックとマラソンを組み合わせた名称で、限られた期間にチームでアイデアを形にする開発イベントです。トレードフェアは見本市、パネルディスカッションは討論会、レセプションは歓迎会や公式な集会を指します。"},{"id":"r08-005","year":"令和8年度","number":5,"field":"ストラテジ系","answer":3,"question":"インターネットを利用した企業広告に関する新たなビジネスモデルを知的財産として出願し、コンピュータシステムとして実現した。このビジネスモデルを知的財産として保護する法律はどれか。","choices":["意匠法","実用新案法","著作権法","特許法"],"explanation":"正解はエです。コンピュータを使って実現される新規性・進歩性のあるビジネス上の仕組みは、要件を満たせばビジネス関連発明として特許法で保護されます。意匠法は物品などのデザイン、実用新案法は物品の形状・構造・組合せ、著作権法は表現物を主に保護します。"},{"id":"r08-006","year":"令和8年度","number":6,"field":"ストラテジ系","answer":3,"question":"デジタルトランスフォーメーションに関する説明として、最も適切なものはどれか。","choices":["デジタル製品を使いこなせる人と使いこなせない人の間に機会の差が生じること","生まれた時からインターネットやデジタル製品が身近にある世代のこと","アナログ信号を電子ファイル保存のためにデジタル信号へ変換すること","デジタル技術が生活やビジネスなどのあらゆる面に影響を与え、変革をもたらしていくこと"],"explanation":"正解はエです。DXは単なるデジタル化ではなく、デジタル技術を使って業務、製品、組織、顧客体験などを変革することです。アはデジタルデバイド、イはデジタルネイティブ、ウはデジタイゼーションの説明です。"},{"id":"r08-007","year":"令和8年度","number":7,"field":"ストラテジ系","answer":1,"question":"バリューエンジニアリングにおける価値、機能、コストの関係性を示すものとして、適切なものはどれか。","choices":["価値＝機能／（コスト＋機能）","価値＝機能／コスト","価値＝機能×コスト","価値＝コスト／機能"],"explanation":"正解はイです。バリューエンジニアリングでは、価値を「必要な機能を、どれだけ少ないコストで実現できるか」と捉え、価値＝機能÷コストで表します。価値を高めるには、機能を上げる、コストを下げる、または両方を行います。"},{"id":"r08-008","year":"令和8年度","number":8,"field":"ストラテジ系","answer":2,"question":"IoTを利用したシステムの事例として、最も適切なものはどれか。","choices":["不特定多数の借り手と貸し手をインターネット上で仲介する","SNSの書込みや通話内容から利用者の感情を分析する","設備に設置したセンサー情報をインターネット経由で集め、スマートフォンで設備状況を監視する","電子ファイルを保存するインターネット上のストレージを提供する"],"explanation":"正解はウです。IoTは、センサーや機器などのモノをネットワークにつなぎ、情報を収集・制御する仕組みです。設備のセンサー情報を遠隔監視する事例は典型的なIoTです。アはマッチングサービス、イは感情分析、エはクラウドストレージです。"},{"id":"r08-009","year":"令和8年度","number":9,"field":"ストラテジ系","answer":1,"question":"製品の製造に関連して発生する費用のうち、間接費だけを全て挙げたものはどれか。a 完成した製品を検査する労務費、b 工場の電気供給設備を保守する労務費、c 製品の外注加工費","choices":["a、b","b","b、c","c"],"explanation":"正解はイです。工場の共通設備を保守する労務費bは、特定の製品へ直接対応付けにくいため間接費です。完成品検査の労務費aや外注加工費cは、対象製品に直接関連付けられるため直接費として扱われます。"},{"id":"r08-010","year":"令和8年度","number":10,"field":"ストラテジ系","answer":3,"question":"ブレーンストーミングの進め方として適切なものだけを全て挙げたものはどれか。a 自由奔放なアイディアは控え、実現可能な案を求める。b 他のメンバーのアイディアに便乗した案でも、とがめずに進める。c テーマに適したアイディアを選択しながら進める。","choices":["a","a、b","a、b、c","b"],"explanation":"正解はエです。ブレーンストーミングでは、自由奔放、批判厳禁、質より量、結合・便乗歓迎が基本原則です。bは結合・便乗歓迎に合致します。aは自由奔放に反し、cは発想中に評価・選別しているため批判厳禁や量の重視に反します。"},{"id":"r08-011","year":"令和8年度","number":11,"field":"ストラテジ系","answer":3,"question":"人気のあるプロサッカー選手が背広姿でサインしている姿を撮影し、プリントしてフリーマーケットで販売した。この行為によって侵害されるおそれがある選手の権利として、最も適切なものはどれか。","choices":["意匠権","商標権","著作権","パブリシティ権"],"explanation":"正解はエです。著名人の氏名や肖像が持つ顧客吸引力を、本人の許可なく商品販売に利用すると、パブリシティ権を侵害する可能性があります。写真そのものの著作権とは別に、写っている人物の経済的価値が問題になります。"},{"id":"r08-012","year":"令和8年度","number":12,"field":"ストラテジ系","answer":3,"question":"業務プロセスを可視化するための流れ図の作成において利用する記述様式として、最も適切なものはどれか。","choices":["CRUD図","DMM（Diamond Mandala Matrix）","E-R図","WFA（Work Flow Architecture）"],"explanation":"正解はエです。WFAは業務の流れや担当、処理を可視化するための記述様式です。CRUD図はデータに対する生成・参照・更新・削除の関係、E-R図は実体と関連、DMMは発想整理のためのマトリクスです。"}];
const letters=["ア","イ","ウ","エ"];let session=[],index=0,correct=0,combo=0,best=Number(localStorage.getItem("itp_best")||0),locked=false,target=12;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function begin(count){target=count;session=[];while(session.length<count)session.push(...shuffle(QUESTIONS));session=session.slice(0,count);index=correct=combo=0;locked=false;$("start").classList.add("hide");$("result").classList.remove("show");$("quiz").style.display="block";render()}function render(){if(index>=session.length)return finish();locked=false;const q=session[index];$("now").textContent=index+1;$("score").textContent=correct;$("rate").textContent=(index?Math.round(correct/index*100):0)+"%";$("best").textContent=best;$("comboBadge").textContent="COMBO "+combo;$("bar").style.width=(index/session.length*100)+"%";$("meta").textContent=q.year+"・"+q.field;$("num").textContent="問"+q.number;$("question").textContent=q.question;$("stem").innerHTML=(q.stem||[]).map(x=>`<div class="stem">${x}</div>`).join("");$("choices").innerHTML=q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><strong>${letters[i]}</strong><span>${c}</span></button>`).join("");$("feedback").className="feedback";$("feedback").innerHTML="";$("source").textContent=`出典：IPA 令和8年度 ITパスポート試験 公開問題 問${q.number}（問題・選択肢・正答）／解説：独自作成`;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}function answer(i){if(locked)return;locked=true;const q=session[index],ok=i===q.answer;document.querySelectorAll(".choice").forEach((b,j)=>{if(j===q.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});if(ok){correct++;combo++;best=Math.max(best,combo);localStorage.setItem("itp_best",best)}else combo=0;$("score").textContent=correct;$("rate").textContent=Math.round(correct/(index+1)*100)+"%";$("best").textContent=best;$("comboBadge").textContent="COMBO "+combo;const f=$("feedback");f.className="feedback show "+(ok?"ok":"ng");f.innerHTML=`<b>${ok?"正解":"不正解"}　正解：${letters[q.answer]}</b>${q.explanation}`;setTimeout(()=>{index++;render()},2600)}function finish(){$("quiz").style.display="none";$("bar").style.width="100%";$("result").classList.add("show");$("finalScore").textContent=`${correct} / ${session.length}`;$("finalText").textContent=`正答率 ${Math.round(correct/session.length*100)}%・最高コンボ ${best}`}document.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>begin(Number(b.dataset.count)));$("again").onclick=()=>begin(target);let sx=0,sy=0,dx=0,dy=0;const card=$("card");card.addEventListener("touchstart",e=>{if(locked)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=dy=0},{passive:true});card.addEventListener("touchmove",e=>{if(locked)return;const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;card.style.transform=`translate(${dx*.35}px,${dy*.35}px) rotate(${dx*.015}deg)`},{passive:true});card.addEventListener("touchend",()=>{card.style.transform="";if(locked)return;if(Math.max(Math.abs(dx),Math.abs(dy))<55)return;let i;if(Math.abs(dx)>Math.abs(dy))i=dx>0?1:3;else i=dy>0?2:0;answer(i)});
</script>
</body></html>
