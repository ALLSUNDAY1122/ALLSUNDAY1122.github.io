name: Jichitai Compare CI

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'
  push:
    branches:
      - main
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: read

concurrency:
  group: jichitai-compare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate municipality data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject unrelated changes
        working-directory: jichitai-compare
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:scope

      - name: Generate public municipality data and pages
        working-directory: jichitai-compare
        run: npm run generate

      - name: Generate national progress
        working-directory: jichitai-compare
        run: npm run progress

      - name: Validate source and generated data
        working-directory: jichitai-compare
        run: npm run validate:generated

      - name: Upload validation failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jichitai-validation-report
          path: jichitai-compare/operations/audits/public-summary-validation-report.json
          if-no-files-found: ignore

      - name: Check JavaScript syntax
        working-directory: jichitai-compare
        run: |
          node --check app.js
          node --check scripts/generate-municipality-pages.mjs
          node --check scripts/validate-municipality-pages.mjs
          node --check scripts/smoke-public-site.mjs

      - name: Confirm generated files are committed
        if: github.event_name == 'push'
        working-directory: jichitai-compare
        shell: bash
        run: |
          changed="$(git status --porcelain -- data/generated/municipalities.json data/generated/municipality-pages.json operations/progress.json municipality sitemap.xml)"
          if [ -n "$changed" ]; then
            echo '生成済みファイルが最新ではありません。'
            git status --short -- data/generated/municipalities.json data/generated/municipality-pages.json operations/progress.json municipality sitemap.xml
            exit 1
          fi

      - name: Verify published GitHub Pages site
        if: github.event_name == 'push'
        working-directory: jichitai-compare
        run: npm run smoke:public
