name: PharmacistSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 7
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  PharmacistSprint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App.swift
      - path: Models.swift
      - path: LearningStore.swift
      - path: LearningStoreResultActions.swift
      - path: Theme.swift
      - path: RootAndHomeViews.swift
      - path: QuizViews.swift
      - path: HistorySettingsViews.swift
      - path: MockPaywallViews.swift
      - path: Generated/questions.native.json
        buildPhase: resources
      - path: Generated/assets
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.yakuzaishi
        PRODUCT_NAME: PharmacistSprint
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 薬剤師国試
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      testTargets:
        - PharmacistSprintTests
      gatherCoverageData: true
      coverageTargets:
        - PharmacistSprint

  PharmacistSprintTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/QuestionModelTests.swift
    dependencies:
      - target: PharmacistSprint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
