<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薬剤師国家試験｜学びスプリント v0.3</title><style>:root{--bg:#fdf6ef;--card:#fff;--ink:#231f1a;--sub:#726b60;--a:#ee7d3f;--ad:#a8481c;--as:#fdeee2;--bd:#f0e4d6;--ok:#16a34a;--okb:#f0fdf4;--ng:#dc2626;--ngb:#fef2f2}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:22px 16px 8px}.brand{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.06em}.title{font-size:25px;font-weight:900;margin-top:5px}.lead{font-size:13px;color:var(--sub);line-height:1.55;margin:4px 0 0}.section{padding:11px 16px}.card,button.card{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 1px 3px rgba(60,45,20,.08)}button{font:inherit;color:inherit}.hero{min-height:84px;padding:16px;display:flex;align-items:center;gap:13px;text-align:left}.round{width:46px;height:46px;border-radius:50%;background:var(--as);color:var(--ad);display:grid;place-items:center;font-weight:950}.hero strong{font-size:17px}.meta{display:block;color:var(--sub);font-size:12px;margin-top:3px}.arrow{margin-left:auto;font-size:22px;color:var(--ad)}.rowbtn{padding:14px;display:flex;align-items:center;text-align:left;margin-top:9px}.rowbtn strong{font-size:14px}.count{margin-left:auto;background:var(--as);color:var(--ad);padding:4px 9px;border-radius:999px;font-size:11px;font-weight:900}.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fmt{padding:12px 8px;min-height:94px;text-align:left}.pill{display:inline-block;font-size:10px;font-weight:900;color:#0f766e;background:#ecfdf5;padding:3px 7px;border-radius:999px}.fmt strong{display:block;margin-top:9px}.fmt small{display:block;color:var(--sub);margin-top:4px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:72px;display:grid;grid-template-columns:repeat(3,1fr);background:#fffffff4;border-top:1px solid var(--bd)}.nav button{border:0;background:transparent;font-weight:800;color:#81766b}.nav button.active{color:var(--ad);background:var(--as)}.hidden{display:none!important}.head{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;z-index:5}.back{border:0;background:var(--as);color:var(--ad);border-radius:11px;min-height:42px;padding:0 12px;font-weight:850}.counter{margin-left:auto;font-weight:900}.quiz{padding:13px 16px}.progress{height:6px;background:#f1e7dc;border-radius:999px;overflow:hidden}.progress div{height:100%;background:var(--a)}.qcard{padding:16px;margin-top:13px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;color:var(--sub);background:#f8f3ed;padding:4px 7px;border-radius:999px;font-weight:800}.question{font-size:20px;line-height:1.6;font-weight:850;margin:14px 0}.hint{font-size:12px;color:var(--ad);font-weight:850;margin-bottom:10px}.choices{display:grid;gap:9px}.choice{width:100%;min-height:58px;border:1.5px solid var(--bd);background:#fff;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left}.n{width:30px;height:30px;border-radius:9px;background:#f4eee7;display:grid;place-items:center;font-weight:950}.choice.sel{border-color:var(--a);background:#fff9f4}.choice.sel .n{background:var(--a);color:#fff}.choice.ok{border-color:#86d3aa;background:var(--okb)}.choice.ok .n{background:var(--ok);color:#fff}.choice.ng{border-color:#efaaa3;background:var(--ngb)}.choice.ng .n{background:var(--ng);color:#fff}.choice.dim{opacity:.48}.unknown{width:100%;min-height:48px;margin-top:10px;border:1px dashed #d6c8ba;border-radius:14px;background:#fffaf6;color:var(--sub);font-weight:800}.feedback{margin-top:13px;padding:14px;border-radius:14px}.feedback.ok{background:var(--okb);border:1px solid #bfe8cf}.feedback.ng{background:var(--ngb);border:1px solid #efc2bd}.feedback strong{font-size:15px}.label{display:block;font-size:10px;color:var(--sub);font-weight:900;letter-spacing:.05em;margin-top:9px}.feedback p{font-size:13px;line-height:1.65;margin:4px 0}.next{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--a);font-weight:950;margin-top:10px}.result{padding:20px;text-align:center}.score{font-size:48px;font-weight:950}.actions{display:grid;gap:9px;margin-top:14px}.actions button{min-height:50px;border-radius:14px;font-weight:900}.primary{border:0;background:var(--a)}.outline{border:1px solid var(--bd);background:#fff}.record{padding:16px}.record .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}.record .row:last-child{border:0}.notice{font-size:12px;color:var(--sub);line-height:1.6;padding:13px;margin-top:10px}.error{background:#fff4f4;border:1px solid #f4c6c6;color:#8a2525}</style></head><body><div id="app" class="app"><div id="home"><div class="top"><div class="brand">学びスプリント</div><div class="title">薬剤師国家試験</div><p class="lead">今日も12問、積み上げる。<br>Safari価値検証版 v0.3</p></div><section class="section"><button class="card hero" id="start"><span class="round">12</span><span><strong>今日の12問</strong><span class="meta">必須・理論・実践を短く反復</span></span><span class="arrow">›</span></button><button class="card rowbtn" id="review"><span><strong>苦手復習</strong><span class="meta">間違えた問題だけ再演習</span></span><span class="count" id="weakCount">0問</span></button></section><section class="section"><div class="formats"><button class="card fmt" data-form="必須"><span class="pill">必須</span><strong>12問</strong><small>無料</small></button><button class="card fmt" data-form="理論"><span class="pill">理論</span><strong>12問</strong><small>検証版</small></button><button class="card fmt" data-form="実践"><span class="pill">実践</span><strong>12問</strong><small>検証版</small></button></div><div class="card notice">このv0.3は起動安定性を最優先した検証版です。公式過去問本文は使用せず、独自問題だけで操作を確認します。</div></section></div><div id="quiz" class="hidden"><div class="head"><button class="back" id="quit">ホーム</button><span class="counter" id="counter">1 / 12</span></div><main class="quiz"><div class="progress"><div id="bar" style="width:8.3%"></div></div><section class="card qcard"><div class="tags" id="tags"></div><div class="question" id="question"></div><div class="hint" id="hint"></div><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div id="feedback" class="feedback hidden"><strong id="fbTitle"></strong><span class="label">この問題で覚える一文</span><p id="point"></p><span class="label">解説</span><p id="detail"></p><button class="next" id="next">次の問題へ</button></div></section></main></div><div id="result" class="hidden"><div class="top"><div class="brand">学びスプリント</div><div class="title">結果</div></div><section class="section"><div class="card result"><div class="score" id="score">0 / 12</div><p class="lead" id="rate"></p><p class="lead">合否判定ではなく、次に復習する範囲を決めるための結果です。</p><div class="actions"><button class="primary" id="again">もう12問</button><button class="outline" id="resultHome">ホームへ</button></div></div></section></div><div id="record" class="hidden"><div class="top"><div class="brand">学びスプリント</div><div class="title">学習記録</div></div><section class="section"><div class="card record"><div class="row"><span>累計解答</span><strong id="answered">0問</strong></div><div class="row"><span>累計正答率</span><strong id="totalRate">—</strong></div><div class="row"><span>苦手問題</span><strong id="weakRecord">0問</strong></div></div></section></div><div id="settings" class="hidden"><div class="top"><div class="brand">学びスプリント</div><div class="title">設定</div></div><section class="section"><div class="card notice">問題データ：独自問題のみ<br>試験制度：第106〜114回相当の現行区分<br>検証版：v0.3 stable</div><button class="card rowbtn" id="reset"><strong>学習データをリセット</strong></button></section></div><nav class="nav"><button class="active" data-view="home">ホーム</button><button data-view="record">学習記録</button><button data-view="settings">設定</button></nav></div><script>(function(){'use strict';var Q=[{id:'1',f:'必須',s:'薬理',q:'オピオイド受容体拮抗薬として用いられる薬物はどれか。',c:['ナロキソン','モルヒネ','フェンタニル','コデイン','オキシコドン'],a:[0],p:'ナロキソンはオピオイド受容体拮抗薬である。',d:'オピオイドによる呼吸抑制などの拮抗に用いられる。'},{id:'2',f:'必須',s:'薬剤',q:'未使用のインスリン製剤の一般的な保存として適切なのはどれか。',c:['凍結を避けて冷所で保存する','直射日光下で保存する','40℃以上で保存する','必ず凍結する','保存条件はない'],a:[0],p:'インスリン製剤は凍結を避けて保存する。',d:'実際の製品では添付文書の保存条件を確認する。'},{id:'3',f:'必須',s:'病態・薬物治療',q:'気管支喘息の長期管理で気道炎症を抑える中心的な吸入薬はどれか。',c:['吸入ステロイド薬','抗菌薬のみ','抗凝固薬','局所麻酔薬','利尿薬'],a:[0],p:'吸入ステロイド薬は喘息長期管理の基本薬の一つである。',d:'発作時治療と長期管理を分けて整理する。'},{id:'4',f:'必須',s:'法規・制度・倫理',q:'患者情報を扱う際の基本姿勢として適切なのはどれか。',c:['業務上必要な範囲で適切に扱う','SNSへ実名投稿する','目的なく配布する','誰にでも伝える','記録をすべて公開する'],a:[0],p:'患者情報は目的と必要性を踏まえて適切に扱う。',d:'個人情報保護と医療職としての守秘を横断して考える。'},{id:'5',f:'理論',s:'薬理',q:'アミノグリコシド系抗菌薬で特に注意する副作用を2つ選べ。',c:['腎障害','聴覚障害','白内障のみ','甲状腺機能亢進のみ','虫歯'],a:[0,1],pick:2,p:'腎毒性と耳毒性が重要である。',d:'薬物濃度モニタリングと関連付けて覚える。'},{id:'6',f:'理論',s:'薬物動態',q:'グレープフルーツジュースとの相互作用で代表的な酵素はどれか。',c:['CYP3A4','ペプシン','トロンビン','ACE','DNAポリメラーゼ'],a:[0],p:'主に小腸CYP3A4との相互作用で知られる。',d:'実務では薬剤ごとの添付文書を確認する。'},{id:'7',f:'理論',s:'薬物動態',q:'一次速度で消失する薬物で、半減期を長くする方向に働くのはどれか。',c:['クリアランスの低下','クリアランスの上昇','分布容積の低下のみ','採血時刻の変更','錠剤の色'],a:[0],p:'半減期は一般にクリアランスに反比例する。',d:'t1/2 = 0.693 × Vd / CL の関係を押さえる。'},{id:'8',f:'理論',s:'物理・化学・生物',q:'DNAを構成する基本単位はどれか。',c:['ヌクレオチド','トリグリセリド','セルロース','コレステロール','グリコーゲン'],a:[0],p:'DNAはヌクレオチドが連なった高分子である。',d:'糖・リン酸・塩基からなるヌクレオチドを基本単位として覚える。'},{id:'9',f:'実践',s:'実務',q:'ワルファリン服用患者への確認として特に重要なのはどれか。',c:['併用薬や健康食品の変更','好きな色','靴のサイズ','利き手','視力だけ'],a:[0],p:'併用薬・健康食品・食事内容の変化を確認する。',d:'相互作用や出血リスクに関わる情報を継続的に把握する。'},{id:'10',f:'実践',s:'実務',q:'吸入ステロイド薬の服薬指導で確認したい項目を2つ選べ。',c:['吸入手技','吸入後のうがい','毎回の自己増量','他人との吸入器共有','必ず食前30分'],a:[0,1],pick:2,p:'吸入手技と吸入後のうがいが重要である。',d:'デバイスごとに手技が異なるため実物での確認が有効。'},{id:'11',f:'実践',s:'実務',q:'処方監査で確認すべき内容を2つ選べ。',c:['用法・用量の妥当性','重複投与や相互作用','患者の星座','紙の色だけ','薬剤師の好み'],a:[0,1],pick:2,p:'用法・用量、重複・相互作用などを系統的に確認する。',d:'必要時は疑義照会を含め適切に対応する。'},{id:'12',f:'実践',s:'実務',q:'NSAIDs使用中の患者で消化管出血を疑う情報はどれか。',c:['黒色便','髪型の変更','身長1mmの変化','利き手変更','爪の白斑のみ'],a:[0],p:'黒色便は上部消化管出血を疑う重要な情報の一つである。',d:'NSAIDsでは消化管障害リスクを患者背景と合わせて確認する。'}];var store={answered:0,correct:0,weak:{}};try{var saved=localStorage.getItem('pharmSprintV03');if(saved)store=JSON.parse(saved)||store}catch(e){}var session=[],idx=0,answers=[],selected=[],done=false;function el(id){return document.getElementById(id)}function show(id){['home','quiz','result','record','settings'].forEach(function(x){el(x).classList.toggle('hidden',x!==id)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===id)});if(id==='record')refreshRecord();window.scrollTo(0,0)}function save(){try{localStorage.setItem('pharmSprintV03',JSON.stringify(store))}catch(e){}}function weakIds(){return Object.keys(store.weak||{})}function refreshCounts(){el('weakCount').textContent=weakIds().length+'問';el('weakRecord').textContent=weakIds().length+'問'}function start(form,weak){var pool=Q.slice();if(form)pool=pool.filter(function(q){return q.f===form});if(weak){var ids=weakIds();pool=pool.filter(function(q){return ids.indexOf(q.id)>=0})}if(!pool.length){alert('現在、復習対象はありません。');return}session=pool.slice();idx=0;answers=[];selected=[];done=false;show('quiz');renderQ()}function renderQ(){var q=session[idx];done=false;selected=[];el('counter').textContent=(idx+1)+' / '+session.length;el('bar').style.width=Math.round((idx+1)/session.length*100)+'%';el('tags').innerHTML='<span class="tag">'+q.f+'</span><span class="tag">'+q.s+'</span>';el('question').textContent=q.q;el('hint').textContent=q.pick?q.pick+'つ選択すると自動採点':'選択肢タップで即時採点';el('feedback').className='feedback hidden';el('unknown').disabled=false;var box=el('choices');box.innerHTML='';q.c.forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.innerHTML='<span class="n">'+(i+1)+'</span><span></span>';b.lastChild.textContent=t;b.onclick=function(){choose(i)};box.appendChild(b)});el('next').textContent=idx===session.length-1?'結果を見る':'次の問題へ'}function choose(i){if(done)return;var q=session[idx];if(q.pick){var pos=selected.indexOf(i);if(pos>=0)selected.splice(pos,1);else if(selected.length<q.pick)selected.push(i);paintSel();if(selected.length===q.pick)grade(false)}else{selected=[i];grade(false)}}function paintSel(){document.querySelectorAll('.choice').forEach(function(b,i){b.classList.toggle('sel',selected.indexOf(i)>=0)})}function grade(unknown){if(done)return;done=true;var q=session[idx],ans=unknown?[]:selected.slice().sort(),ok=ans.length===q.a.length&&ans.every(function(v,i){return v===q.a.slice().sort()[i]});answers.push(ok);store.answered++;if(ok){store.correct++;delete store.weak[q.id]}else store.weak[q.id]=1;save();refreshCounts();document.querySelectorAll('.choice').forEach(function(b,i){b.disabled=true;b.classList.remove('sel');if(q.a.indexOf(i)>=0)b.classList.add('ok');else if(selected.indexOf(i)>=0)b.classList.add('ng');else b.classList.add('dim')});el('unknown').disabled=true;el('feedback').className='feedback '+(ok?'ok':'ng');el('fbTitle').textContent=ok?'正解です':'復習対象に追加しました';el('point').textContent=q.p;el('detail').textContent=q.d}function next(){if(!done)return;if(idx<session.length-1){idx++;renderQ();window.scrollTo(0,0)}else finish()}function finish(){var c=answers.filter(Boolean).length;el('score').textContent=c+' / '+session.length;el('rate').textContent='正答率 '+Math.round(c/session.length*100)+'%';show('result')}function refreshRecord(){el('answered').textContent=store.answered+'問';el('totalRate').textContent=store.answered?Math.round(store.correct/store.answered*100)+'%':'—';refreshCounts()}el('start').onclick=function(){start()};el('review').onclick=function(){start(null,true)};document.querySelectorAll('[data-form]').forEach(function(b){b.onclick=function(){start(b.getAttribute('data-form'))}});el('quit').onclick=function(){show('home')};el('unknown').onclick=function(){grade(true)};el('next').onclick=next;el('again').onclick=function(){start()};el('resultHome').onclick=function(){show('home')};el('reset').onclick=function(){if(confirm('学習データをリセットしますか？')){store={answered:0,correct:0,weak:{}};save();refreshRecord();show('home')}};document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){show(b.getAttribute('data-view'))}});refreshCounts();show('home')})();</script></body></html>
