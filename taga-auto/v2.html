<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#18263a"><title>有限会社多賀オート｜提案用ホームページ</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f7f9;color:#172335}.loading{min-height:100vh;display:grid;place-items:center;padding:24px}.loading-box{width:min(520px,100%);padding:36px;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(24,38,58,.14);text-align:center}.loading-mark{width:52px;height:52px;margin:0 auto 16px;border:2px solid #dce5eb;border-top-color:#285b84;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading p{color:#687585}.ui-icon{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.menu .ui-icon{width:23px;height:23px}.header-call .ui-icon,.btn .ui-icon,.mobile-bar .ui-icon{margin-right:7px}.quick-card .ui-icon{color:var(--red);margin-right:7px;width:19px;height:19px}.service-icon .ui-icon{width:56px;height:56px;stroke-width:1.8}.point-icon .ui-icon{width:24px;height:24px}.tech-icon{display:block;color:#fff}.tech-icon .ui-icon{width:34px;height:34px;stroke-width:1.7}.menu{align-items:center!important;justify-content:center!important;font-size:0!important}.icon-defs{position:absolute;width:0;height:0;overflow:hidden}</style></head><body><main class="loading" id="loader"><div class="loading-box"><div class="loading-mark"></div><strong>有限会社 多賀オート</strong><p>提案用ホームページを読み込んでいます。</p></div></main><script>
const base='https://raw.githubusercontent.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/da35485b0a9f4f6cdba1ce589f6cd92311cb8807/taga-auto/index.html';
const symbols=`<svg class="icon-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="icon-phone" viewBox="0 0 24 24"><path d="M7.4 3.5 4.8 5.4c-.7.5-.9 1.4-.6 2.2 2.2 6 6.9 10.7 12.9 12.9.8.3 1.7.1 2.2-.6l1.9-2.6c.5-.7.4-1.7-.3-2.2l-3-2.2c-.6-.4-1.4-.4-1.9.1l-1.5 1.4a15.1 15.1 0 0 1-5-5L10.9 8c.5-.5.6-1.3.1-1.9l-2.2-3c-.4-.6-1.4-.7-2.1-.2Z"/></symbol><symbol id="icon-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a5 5 0 0 0-6.5 6.5L3.5 17.5a2.1 2.1 0 1 0 3 3l4.7-4.7a5 5 0 0 0 6.5-6.5l-3 3-3-3 3-3Z"/></symbol><symbol id="icon-car" viewBox="0 0 24 24"><path d="m5 11 1.8-4.5A2.4 2.4 0 0 1 9 5h6a2.4 2.4 0 0 1 2.2 1.5L19 11M4 11h16v7H4zM7 18v2M17 18v2M7 14h.01M17 14h.01"/></symbol><symbol id="icon-tools" viewBox="0 0 24 24"><path d="m14 6 4-4 4 4-4 4M13 7l4 4M3 21l8-8M5 9l-3-3 4-4 3 3-2 2 3 3-2 2Z"/></symbol><symbol id="icon-building" viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M8 9h2M14 9h2M8 13h2M14 13h2M10 21v-4h4v4M2 21h20"/></symbol><symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="icon-badge" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="m8.5 12-1.5 9 5-3 5 3-1.5-9"/></symbol><symbol id="icon-mobile" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 5h4M11 18h2"/></symbol><symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"/></symbol></svg>`;
const icon=n=>`<svg class="ui-icon" aria-hidden="true"><use href="#icon-${n}"/></svg>`;
function setText(root,sel,text){const e=root.querySelector(sel);if(e)e.textContent=text}function setHTML(root,sel,html){const e=root.querySelector(sel);if(e)e.innerHTML=html}
function replaceIcons(root){
 const q=root.querySelectorAll('.quick-card');[['wrench','整備案内','対応内容を分かりやすく'],['building','整備体制','技術と対応姿勢を伝える'],['pin','会社情報','電話・住所・地図'],['phone','お問い合わせ','相談方法を明確にする']].forEach((v,i)=>{if(q[i])q[i].innerHTML=icon(v[0])+v[1]+`<span>${v[2]}</span>`});
 const si=root.querySelectorAll('.service-icon');['wrench','car','tools'].forEach((n,i)=>{if(si[i])si[i].innerHTML=icon(n)});
 const ti=root.querySelectorAll('.tech-icon');['mobile','phone','pin','edit'].forEach((n,i)=>{if(ti[i])ti[i].innerHTML=icon(n)});
 const call=root.querySelector('.header-call');if(call)call.innerHTML=icon('phone')+'03-3680-9143<span>公開情報上の代表候補</span>';
 const menu=root.querySelector('#menu');if(menu){menu.innerHTML=icon('menu');menu.setAttribute('aria-label','メニューを開く')}
 const hb=root.querySelector('.hero-actions .btn-primary');if(hb)hb.innerHTML=icon('phone')+'電話で相談する';
 const mb=root.querySelectorAll('.mobile-bar a');if(mb[0])mb[0].innerHTML=icon('phone')+'電話する';if(mb[1])mb[1].innerHTML=icon('pin')+'地図を見る';
}
function patch(doc){
 doc.head.insertAdjacentHTML('beforeend',document.querySelector('style').outerHTML);doc.body.insertAdjacentHTML('afterbegin',symbols);
 setText(doc,'.eyebrow','西葛西に根ざす自動車整備会社');setHTML(doc,'.hero h1','確かな整備で、<br><span>地域のカーライフ</span>を支える。');setText(doc,'.hero p','自動車整備会社としての技術、対応内容、所在地、連絡先を、初めての方にも分かりやすく伝えるホームページ案です。');
 const hp=doc.querySelectorAll('.hero-point');if(hp[2])hp[2].innerHTML='<b>地域に根ざす</b><small>西葛西を拠点</small>';
 const nav=doc.querySelector('a[href="#shop"]');if(nav)nav.textContent='整備体制';
 setHTML(doc,'#service .section-head h2','対応内容を、<br>分かりやすく伝える。');
 setText(doc,'#shop .copy .kick','SERVICE QUALITY');setHTML(doc,'#shop .copy h2','地域に根ざした整備体制を、<br>企業の信頼として伝える。');setText(doc,'#shop .copy p','長年培った整備経験、丁寧な対応、地域で継続して事業を行う責任を、実際の業務に沿って伝える構成です。会社の規模を評価する表現ではなく、技術と対応品質を企業価値として示します。');
 const points=doc.querySelector('.points');if(points)points.innerHTML=`<div class="point"><span class="point-icon">${icon('badge')}</span><span><b>経験に裏付けられた整備</b><small>担当者の技術と対応姿勢を、正式確認後に掲載</small></span></div><div class="point"><span class="point-icon">${icon('building')}</span><span><b>地域に根ざした整備拠点</b><small>所在地と事業内容を明確にし、企業としての信頼を伝える</small></span></div><div class="point"><span class="point-icon">${icon('phone')}</span><span><b>分かりやすい相談導線</b><small>電話とWebの両方から、必要な相談へ進める</small></span></div>`;
 setHTML(doc,'.contact-copy h2','お車の点検・整備について、<br>まずはご相談ください。');
 doc.querySelectorAll('text').forEach(t=>{if(t.textContent.includes('顔が見える町'))t.textContent='地域に根ざす自動車整備会社'});doc.querySelectorAll('[aria-label]').forEach(e=>{e.setAttribute('aria-label',e.getAttribute('aria-label').replace('町工場','自動車整備会社').replace('地域の小さな','地域に根ざした'))});
 replaceIcons(doc);return doc;
}
(async()=>{try{const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();const doc=patch(new DOMParser().parseFromString(html,'text/html'));document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}catch(e){document.getElementById('loader').innerHTML='<div class="loading-box"><strong>ページを読み込めませんでした</strong><p>通信状態を確認して、再読み込みしてください。</p></div>'}})();
</script></body></html>
