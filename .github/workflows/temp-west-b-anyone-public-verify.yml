name: Temporary West B Anyone Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-anyone-public-verify-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'ops/run-west-b-anyone-public-verify-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published pages and generated JSON
        shell: bash
        run: |
          set -euo pipefail
          git switch -C audit/west-b-anyone-public-verification-20260725
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const cache = Date.now();
          const generatedUrl = `https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json?audit=${cache}`;
          const targets = [
            {
              code: '36405', name: '上板町',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/36405/?audit=${cache}`,
              summary: '2026年5月から上板町立さくら保育所でこども誰でも通園制度を実施',
              sourceUrl: 'https://www.townkamiita.jp/docs/2026043000027/'
            },
            {
              code: '42383', name: '小値賀町',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/42383/?audit=${cache}`,
              summary: '小値賀こども園で一時保育を実施。対象年齢・時間・料金は更新中のため要問い合わせ',
              sourceUrl: 'https://www.town.ojika.lg.jp/soshiki/hukushijumusho/1/6/179.html'
            },
            {
              code: '45403', name: '西米良村',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/45403/?audit=${cache}`,
              summary: '村公式の現行子育て一覧でこども誰でも通園制度の実施案内を公開',
              sourceUrl: 'https://www.vill.nishimera.lg.jp/village/category/a-00-villagelife/a-05/a-05-03'
            },
            {
              code: '45441', name: '高千穂町',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/45441/?audit=${cache}`,
              summary: '2026年4月からこども誰でも通園制度を開始。施設別条件は町窓口へ確認',
              sourceUrl: 'https://www.town-takachiho.jp/top/kosodate_kyoiku/kyoiku/4369.html'
            }
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let result = null;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const pages = {};
            let allPages = true;
            for (const target of targets) {
              try {
                const response = await fetch(target.pageUrl, { redirect: 'follow', cache: 'no-store' });
                const text = await response.text();
                const success = response.status === 200 && text.includes(target.summary) && text.includes(target.sourceUrl);
                pages[target.code] = {
                  code: target.code, name: target.name, url: target.pageUrl, status: response.status,
                  summaryPresent: text.includes(target.summary), sourceUrlPresent: text.includes(target.sourceUrl), success
                };
                allPages &&= success;
              } catch (error) {
                pages[target.code] = { code: target.code, name: target.name, url: target.pageUrl, success: false, error: String(error) };
                allPages = false;
              }
            }

            let generated = { url: generatedUrl, success: false };
            try {
              const response = await fetch(generatedUrl, { redirect: 'follow', cache: 'no-store' });
              const data = response.status === 200 ? await response.json() : null;
              const municipalities = Array.isArray(data) ? data : (data?.municipalities ?? []);
              const serviceCount = municipalities.reduce((sum, municipality) => sum + Object.keys(municipality.services ?? {}).length, 0);
              const checks = Object.fromEntries(targets.map((target) => {
                const municipality = municipalities.find((item) => item.code === target.code);
                const service = municipality?.services?.temporaryChildcare;
                return [target.code, Boolean(service && service.status === 'verified' && service.summary === target.summary && service.source?.url === target.sourceUrl)];
              }));
              generated = {
                url: generatedUrl, status: response.status, municipalityCount: municipalities.length, serviceCount, checks,
                success: response.status === 200 && municipalities.length === 1741 && serviceCount === 15669 && Object.values(checks).every(Boolean)
              };
            } catch (error) {
              generated = { url: generatedUrl, success: false, error: String(error) };
            }

            result = {
              schemaVersion: '1.0.0', auditId: 'west-b-anyone-public-verification-20260725',
              verifiedAt: new Date().toISOString(), attempt,
              relatedMainPullRequest: 3532, relatedMainCiRun: 8631, relatedMainMergeCommit: 'b296b1174425e3e618a31e80c0954c61cad254c0',
              relatedRegionPullRequest: 3561, relatedRegionCiRun: 8644, relatedRegionMergeCommit: '9970db98ecacdd93832640781caf50f5677b02dd',
              pages, generatedJson: generated, success: allPages && generated.success, unresolvedConfirmedErrorCount: 0
            };
            if (result.success) break;
            await sleep(10000);
          }
          if (!result?.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }

          const base = 'jichitai-compare';
          const publicPath = `${base}/operations/audits/west-b-anyone-public-verification-20260725.json`;
          fs.writeFileSync(publicPath, JSON.stringify(result, null, 2) + '\n');

          for (const fileName of [
            'west-b-anyone-crosscheck-20260725.json',
            'west-b-anyone-priority-review-20260725.json',
            'west-b-anyone-status-focus-review-20260725.json',
            'west-b-anyone-official-policy-review-20260725.json'
          ]) {
            const auditPath = `${base}/operations/audits/${fileName}`;
            const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
            audit.result = {
              ...(audit.result ?? {}),
              status: 'completed_public_verified_region_integrated',
              confirmedCorrectionCount: 4,
              correctedCount: 4,
              confirmedCorrectionCodes: ['36405', '42383', '45403', '45441'],
              unresolvedConfirmedErrorCount: 0,
              mainPullRequest: 3532,
              mainCiRun: 8631,
              mainMergeCommit: 'b296b1174425e3e618a31e80c0954c61cad254c0',
              regionPullRequest: 3561,
              regionCiRun: 8644,
              regionMergeCommit: '9970db98ecacdd93832640781caf50f5677b02dd',
              publicVerification: 'passed',
              publicVerificationId: result.auditId
            };
            fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          }

          const checkpointPath = `${base}/operations/control/session-checkpoints/west-b.json`;
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = result.verifiedAt;
          checkpoint.anyoneCrosscheck = {
            auditId: 'west-b-anyone-crosscheck-20260725',
            priorityReviewId: 'west-b-anyone-priority-review-20260725',
            statusFocusReviewId: 'west-b-anyone-status-focus-review-20260725',
            officialReviewId: 'west-b-anyone-official-policy-review-20260725',
            publicVerificationId: result.auditId,
            auditedMunicipalityCount: 250,
            mechanicalCandidateCount: 232,
            priorityCandidateCount: 77,
            statusFocusCandidateCount: 43,
            confirmedCorrectionCount: 4,
            correctedCount: 4,
            municipalityCodes: ['36405', '42383', '45403', '45441'],
            status: 'completed_public_verified_region_integrated',
            mainPullRequest: 3532,
            mainCiRun: 8631,
            mainMergeCommit: 'b296b1174425e3e618a31e80c0954c61cad254c0',
            regionPullRequest: 3561,
            regionCiRun: 8644,
            regionMergeCommit: '9970db98ecacdd93832640781caf50f5677b02dd',
            publicVerification: 'passed',
            unresolvedConfirmedErrorCount: 0,
            judgment: '全国給付化だけでは地域の利用可能性を断定せず、2026年度の自治体公式案内または現行施設情報を確認できた4件のみ訂正'
          };
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Validate final record
        working-directory: jichitai-compare
        run: npm run check
      - name: Commit and push verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare
          git commit -m 'audit: 西日本B誰でも通園4件の公開反映を確認'
          git push --force origin HEAD:audit/west-b-anyone-public-verification-20260725
