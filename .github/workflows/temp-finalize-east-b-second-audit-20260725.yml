name: Temporary finalize East B second audit 20260725

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize-audit:
    if: github.head_ref == 'audit/finalize-east-b-second-20260725' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-east-b-second-20260725
          fetch-depth: 0
      - name: Finalize audit, publication record, and checkpoint
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const auditPath = 'jichitai-compare/operations/control/quality-audit-east-b-second-20260725.json';
          const publishPath = 'jichitai-compare/operations/control/publish-audit-east-b-second-20260725.json';
          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/east-b.json';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const write = (path, value) => fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          const completedAt = '2026-07-25T11:27:00+09:00';

          const regionalIntegration = {
            status: 'merged',
            branch: 'region/east',
            pullRequestNumber: 3208,
            ciRunNumber: 7850,
            mergeCommitSha: 'e0debe4ef4f4a9f7638394128e0fd32541e3070f'
          };
          const nationalSync = {
            status: 'merged',
            branch: 'coord/sync-east-b-second-audit-20260725-v2',
            pullRequestNumber: 3227,
            ciRunNumber: 7880,
            mergeCommitSha: '6db1b6da1ac44f430a8243b232ed7c09f613c9af',
            generatedMunicipalityCount: 1741,
            generatedServiceCount: 15669,
            changedMunicipalityCodes: ['14100', '15100', '15218', '15223']
          };
          const publicVerification = {
            status: 'passed',
            checkedAt: completedAt,
            pullRequestNumber: 3233,
            workflowRunId: 30140415633,
            workflowRunNumber: 1,
            verifiedMunicipalityCodes: ['14100', '15100', '15218', '15223'],
            verifiedPageCount: 4,
            checks: [
              '公開生成JSONの全国1741自治体・15669制度維持',
              '4自治体ページのHTTP 200',
              '自治体名の表示',
              '修正後の病児・病後児保育要約の表示',
              '現行公式出典リンクの表示',
              '横浜市産後ケアのショートステイ料金',
              '阿賀野市の里帰り先訪問型産後ケア事前相談'
            ]
          };

          const audit = read(auditPath);
          audit.status = 'completed';
          audit.updatedAt = completedAt;
          audit.completedAt = completedAt;
          audit.regionIntegration = regionalIntegration;
          audit.nationalSync = nationalSync;
          audit.publicVerification = publicVerification;
          audit.aggregate = {
            sampledMunicipalityCount: 20,
            correctedMunicipalityCount: 4,
            correctedFindingCount: 5,
            unresolvedConfirmedErrorCount: 0,
            status: 'completed_main_region_public_verified'
          };
          audit.remainingActions = [];
          audit.blockers = [];
          write(auditPath, audit);

          const publish = read(publishPath);
          publish.status = 'completed';
          publish.updatedAt = completedAt;
          publish.regionalIntegration = regionalIntegration;
          publish.nationalSync = nationalSync;
          publish.publicVerification = publicVerification;
          publish.blockers = [];
          write(publishPath, publish);

          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = completedAt;
          checkpoint.status = 'completed';
          checkpoint.remainingUninvestigatedCount = 0;
          checkpoint.currentMunicipality = null;
          checkpoint.workingBranch = null;
          checkpoint.ciStatus = 'success';
          checkpoint.secondQualityAudit = {
            status: 'completed',
            issueNumber: 2908,
            startedAt: '2026-07-25T10:31:00+09:00',
            completedAt,
            auditPath,
            priorityMunicipalityCodes: ['12203', '14100', '13123', '15100', '15586'],
            sampledMunicipalityCount: 20,
            correctedMunicipalityCount: 4,
            correctedFindingCount: 5,
            correctedMunicipalityCodes: ['14100', '15100', '15218', '15223'],
            regionalIntegration,
            nationalSync,
            publicVerification,
            remainingUninvestigatedCount: 0,
            unresolvedConfirmedErrorCount: 0,
            nextAction: '新規の公式制度改定、リンク切れ、公開差分、または明示的な再割当が発生した場合のみ再開する。'
          };
          write(checkpointPath, checkpoint);
          NODE
      - name: Commit finalized records and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-finalize-east-b-second-audit-20260725.yml
          git add jichitai-compare/operations/control/quality-audit-east-b-second-20260725.json jichitai-compare/operations/control/publish-audit-east-b-second-20260725.json jichitai-compare/operations/control/session-checkpoints/east-b.json
          git commit -m "audit: 東日本B品質改善第2監査を公開確認済みとして確定"
          git push origin HEAD:audit/finalize-east-b-second-20260725
