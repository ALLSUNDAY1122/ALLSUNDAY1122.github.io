name: Toru Tango Generator CI

on:
  push:
    paths:
      - 'toru-tango/generator-v2.js'
      - 'toru-tango/generator-v2.test.cjs'
      - 'toru-tango/generator-test.html'
      - 'toru-tango/sw.js'
      - '.github/workflows/toru-tango-generator-ci.yml'
  pull_request:
    paths:
      - 'toru-tango/generator-v2.js'
      - 'toru-tango/generator-v2.test.cjs'
      - 'toru-tango/generator-test.html'
      - 'toru-tango/sw.js'
      - '.github/workflows/toru-tango-generator-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: JavaScript syntax
        run: node --check toru-tango/generator-v2.js && node --check toru-tango/sw.js
      - name: Regression test
        run: |
          mkdir -p toru-tango/ci-logs
          set -o pipefail
          node toru-tango/generator-v2.test.cjs 2>&1 | tee toru-tango/ci-logs/generator-regression.log
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-generator-diagnostics
          path: toru-tango/ci-logs
          if-no-files-found: error
          retention-days: 7
