name: Temporary North B Anyone Single Gap Batch 3 Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch3-public-verify.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch3-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public pages and generated JSON
        shell: bash
        run: |
          set -euo pipefail
          base='https://allsunday1122.github.io/jichitai-compare'
          verify_page() {
            code="$1"
            needle="$2"
            url="${base}/municipality/${code}/"
            for attempt in $(seq 1 20); do
              if body=$(curl -fsSL --max-time 30 "$url") && printf '%s' "$body" | grep -Fq "$needle"; then
                echo "verified ${code}: ${needle}"
                return 0
              fi
              echo "retry ${attempt}/20 for ${code}"
              sleep 15
            done
            echo "public verification failed: ${code} ${needle}" >&2
            return 1
          }

          verify_page '04445' '2026年度から全国の自治体で開始'
          verify_page '04505' '2026年4月から全国の自治体で実施'
          verify_page '04581' '2026年度から'
          verify_page '05202' '2026年4月から'
          verify_page '05206' '2026年4月1日から'
          verify_page '05207' '2024年度から市内で実施'
          verify_page '05209' '2026年度から'
          verify_page '05211' '2026年4月から'

          curl -fsSL --max-time 60 "${base}/data/generated/municipalities.json" -o /tmp/municipalities.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/municipalities.json', 'utf8'));
          const rows = Array.isArray(payload) ? payload : (payload.municipalities || payload.data || []);
          const expected = {
            '04445': '2026年度から全国の自治体で開始',
            '04505': '2026年4月から全国の自治体で実施',
            '04581': '2026年度から',
            '05202': '2026年4月から',
            '05206': '2026年4月1日から',
            '05207': '2024年度から市内で実施',
            '05209': '2026年度から',
            '05211': '2026年4月から'
          };
          for (const [code, needle] of Object.entries(expected)) {
            const row = rows.find((item) => String(item.code || item.municipalityCode || item.id) === code);
            if (!row) throw new Error(`generated municipality missing: ${code}`);
            if (!JSON.stringify(row).includes(needle)) throw new Error(`generated value missing: ${code} ${needle}`);
            console.log(`generated verified ${code}`);
          }
          NODE

      - name: Record public verification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('jichitai-compare');
          const now = new Date().toISOString();
          const codes = ['04445','04505','04581','05202','05206','05207','05209','05211'];
          const auditPath = path.join(root, 'operations', 'audits', 'north-b-anyone-single-gap-batch3-public-verification-20260725.json');
          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'north-b-anyone-single-gap-batch3-public-verification-20260725',
            sessionId: 'north-b',
            verifiedAt: now,
            status: 'verified',
            mainPullRequest: 3513,
            mainMergeCommit: '59108d9911bea78454caa811f281da25b7a49190',
            regionPullRequest: 3531,
            regionMergeCommit: '8fc6a5543c7da76bd550183112b6eb822272d232',
            scope: { municipalityPages: 8, generatedMunicipalitiesJson: true, statusChanges: 0 },
            municipalities: codes.map((code) => ({
              code,
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/${code}/`,
              result: 'expected corrected start content found'
            })),
            generatedUrl: 'https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json'
          };
          fs.writeFileSync(auditPath, `${JSON.stringify(audit, null, 2)}\n`);

          const checkpointPath = path.join(root, 'operations', 'control', 'session-checkpoints', 'north-b.json');
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = now;
          checkpoint.workingBranch = 'verify/north-b-anyone-single-gap-batch3-public-20260725';
          checkpoint.pullRequestNumber = null;
          checkpoint.ciStatus = 'pending';
          checkpoint.nextAction = '誰でも通園の単一条件欠落残り39件を優先度順に再確認する。';
          checkpoint.fiscalAnyoneAudit = {
            ...(checkpoint.fiscalAnyoneAudit || {}),
            status: 'single_gap_batch3_public_verified_pending_record_ci',
            singleGapBatch3MainPullRequest: 3513,
            singleGapBatch3MainMergeCommit: '59108d9911bea78454caa811f281da25b7a49190',
            singleGapBatch3RegionPullRequest: 3531,
            singleGapBatch3RegionMergeCommit: '8fc6a5543c7da76bd550183112b6eb822272d232',
            singleGapBatch3PublicVerificationFile: 'operations/audits/north-b-anyone-single-gap-batch3-public-verification-20260725.json',
            singleGapBatch3PublicVerifiedMunicipalities: codes,
            remainingAnyonePriorityBelow50: 39
          };
          fs.writeFileSync(checkpointPath, `${JSON.stringify(checkpoint, null, 2)}\n`);
          NODE

      - name: Commit verification record
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/north-b-anyone-single-gap-batch3-public-verification-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json
          if git diff --cached --quiet; then
            echo 'No verification record to commit.'
            exit 1
          fi
          git commit -m 'audit: 北日本B誰でも通園単一条件第3群の公開反映を確認 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
