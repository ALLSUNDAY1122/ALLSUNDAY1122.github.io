name: Temporary Sync Release Queue 245 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-245.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={'central':[('22100','静岡市')],'west':[('33100','岡山市')]}
          for entry in data['entries']:
              r=entry['region']; existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(r,[]):
                  if code not in existing: entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if r=='north': entry['pendingSinceLastRelease']=1
              elif r=='east': entry['pendingSinceLastRelease']=4
              elif r=='central':
                  entry['pendingSinceLastRelease']=3
                  entry['reason']='揖斐川町から白川町までの追加10自治体をPR #437でmainへ統合し、PR #439で公開234自治体へ更新。その後、東白川村・御嵩町・静岡市を地方統合'
              elif r=='west':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='浜田市から美郷町までの追加10自治体をPR #324でmainへ統合し、PR #325で公開134自治体へ更新。その後、邑南町・津和野町・吉賀町・岡山市を地方統合'
          data['updatedAt']='2026-07-22T04:16:00+09:00'
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[]
          s['auditBlockedRegions']=[]
          s['lastNationalIntegrationAt']='2026-07-22T03:50:48+09:00'
          s['lastNationalIntegrationPr']=437
          s['latestGeneratedMunicipalityCount']=234
          s['latestGeneratedPullRequest']=439
          s['latestPublicCountPullRequest']=439
          if s['regionalMergedMunicipalities'] != 245: raise SystemExit(s['regionalMergedMunicipalities'])
          data['nextAction']='東日本・西日本が4自治体、中日本3自治体、北日本1自治体。各地域をコード昇順で継続する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-245.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-245.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合245自治体・公開234自治体へ同期'
          git push origin main
