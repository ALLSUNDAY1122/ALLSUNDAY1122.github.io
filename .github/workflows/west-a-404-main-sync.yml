name: Temporary West A 404 Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-404-main-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'sync/west-a-404-blockers-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate national outputs
        working-directory: jichitai-compare
        run: npm run check

      - name: Commit generated outputs and remove temporary runner
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/west-a-404-main-sync-trigger-20260725.json
          rm -f .github/workflows/west-a-404-main-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/data/generated/municipalities.json \
                  jichitai-compare/municipality/43443/index.html \
                  jichitai-compare/municipality/46533/index.html \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/operations/control/west-a-404-main-sync-trigger-20260725.json \
                  .github/workflows/west-a-404-main-sync.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m "build: 益城町・和泊町修正後の全国生成物を更新"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
