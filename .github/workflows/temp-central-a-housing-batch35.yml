          ];
          function writePreservingStyle(file,obj){const raw=fs.readFileSync(file,'utf8');const compact=!raw.includes('\n  ');fs.writeFileSync(file,compact?JSON.stringify(obj)+'\n':JSON.stringify(obj,null,2)+'\n');}
          for(const d of decisions){
            const municipalityPath=path.join(root,'data/municipalities',d.pref,`${d.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(municipalityPath,'utf8'));
            const oldSource=municipality.services.housingSupport?.source?.url;
            const service={status:d.status,summary:d.summary,details:{},source:{url:d.source,checkedAt}};
            if(d.code==='23212')service.details={program:'安城市結婚新生活支援補助金',eligibleMarriage:'令和8年1月1日以降に婚姻届またはパートナーシップ宣誓届を提出',ageCondition:'夫婦等とも39歳以下',incomeCondition:'令和7年中の所得合計500万円未満等',coveredCosts:'令和8年4月1日から令和9年3月15日までに支払った住宅取得・リフォーム・賃借・引越費用',maximum:'夫婦等とも29歳以下は最大60万円、その他の39歳以下は最大30万円',applicationPeriod:'令和8年6月1日から令和9年3月15日'};
