            {code:'23302',pref:'23',name:'東郷町',status:'unavailable',type:'general_energy_support_misclassification',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.aichi-togo.lg.jp/hojokin_joseikin/sumai/13261.html',basis:'住宅用温暖化対策設備補助は設備導入を対象とする一般環境制度で、子育て等の要件がない'},
