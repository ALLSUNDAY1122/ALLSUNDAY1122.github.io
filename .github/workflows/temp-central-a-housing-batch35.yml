            if(d.code==='25209')service.details={program:'甲賀市民間賃貸住宅家賃補助事業',fiscalYear:'令和8年度は令和8年9月28日から募集開始予定',target:'市内の要件を満たす民間賃貸住宅に入居し、持ち家がなく住宅に困窮する世帯',incomeThreshold:'一般世帯は収入月額15万8,000円以下。就学前の子がいる世帯等の裁量世帯は21万4,000円以下',rentCondition:'家賃月額6万円以下。単身世帯は4万5,000円以下',amount:'家賃月額の2分の1、月額上限2万円',period:'最長24か月'};
            if(d.code==='28225')service.details={program:'朝来市結婚新生活支援補助金',eligibleMarriage:'令和8年1月1日から令和9年3月31日までに婚姻',ageCondition:'夫婦とも39歳以下',incomeCondition:'夫婦の合計所得500万円未満等',coveredCosts:'住宅取得費、住宅リフォーム費、賃貸住宅費、結婚に伴う引越費',maximum:'夫婦とも29歳以下は最大60万円、その他の39歳以下は最大30万円',applicationPeriod:'令和8年4月1日から令和9年3月31日'};
            municipality.services.housingSupport=service; municipality.updatedAt=checkedAt; writePreservingStyle(municipalityPath,municipality);
            const taskPath=path.join(root,'operations/tasks',`${d.code}.json`); const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='中日本調査班A';
            task.verifiedCount=keys.filter(k=>municipality.services[k]?.status==='verified').length;task.unavailableCount=keys.filter(k=>municipality.services[k]?.status==='unavailable').length;task.researchingCount=keys.filter(k=>municipality.services[k]?.status==='researching').length;task.needsMediumReviewCount=keys.filter(k=>municipality.services[k]?.status==='needs_medium_review').length;
            task.officialSources=Array.isArray(task.officialSources)?task.officialSources:[];if(oldSource&&task.officialSources.includes(oldSource))task.officialSources=task.officialSources.map(x=>x===oldSource?d.source:x);if(!task.officialSources.includes(d.source))task.officialSources.push(d.source);task.officialSources=[...new Set(task.officialSources)];
            task.notes=Array.isArray(task.notes)?task.notes:[];task.notes.push(`2026-07-26 中日本A住宅支援分類第35群: ${d.basis}。`);writePreservingStyle(taskPath,task);
          }
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch35-decisions-20260726',session:'中日本調査班A',generatedAt:updatedAt,category:'generalHousingMisclassification',previousRemainingCandidates:7,reviewedMunicipalityCount:7,remainingCandidates:0,confirmedCorrectionCount:7,statusToUnavailableCount:4,verifiedReplacementOrClarificationCount:3,verifiedMaintainedCount:0,decisions:decisions.map(d=>({code:d.code,name:d.name,type:d.type,beforeStatus:'verified',afterStatus:d.status,summary:d.summary,sourceUrl:d.source,basis:d.basis})),issue3141:{unresolvedItems:19,status:'unchanged_waiting_for_official_usage_conditions'},releaseBlocker:'none',regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'validated_pending_region_merge'};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch35-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='pending';checkpoint.nextAction='弱い主出典残33件を、制度に直接対応する利用者向け公式ページへ更新する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';checkpoint.qualityReaudit.latestCompletedAt=updatedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=231;checkpoint.qualityReaudit.primarySourceSlotsRechecked=663;checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=0;checkpoint.qualityReaudit.latestHousingBatch={batch:35,status:'validated_pending_region_merge',reviewedMunicipalityCount:7,confirmedCorrectionCount:7,statusToUnavailableCount:4,verifiedReplacementOrClarificationCount:3,verifiedMaintainedCount:0,remainingCandidates:0,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};checkpoint.lastAction='住宅支援分類第35群の安城市・甲賀市・朝来市を対象制度へ差し替え、みよし市・東郷町・日進市・大治町をunavailableへ修正して住宅支援分類候補をゼロにした。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          for(const trigger of ['central-a-housing-batch35-trigger-20260726.json']){const p=path.join(root,'operations/control',trigger);if(fs.existsSync(p))fs.rmSync(p);}
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第35群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
