            if(d.code==='23230')service.details={reviewedProgram:'愛知県移住支援事業・マッチング支援事業',generalSupport:'東京23区から移住し対象法人へ就業する人へ単身60万円・世帯100万円を支給',classificationReason:'一般的な移住・就業支援で、住宅費や子育て・新婚・三世代を対象要件としないため対象外'};
