name: Scan Lab P1 splat restore rollback one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-splat-restore-rollback.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Roll back collision restore when manifest rename fails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/ScanProjectStore.swift')
          s = p.read_text()
          old = '''        try fileManager.moveItem(at: source, to: destination)\n        if restoredID != id {\n            _ = try updateManifest(projectURL: destination) { $0.id = restoredID }\n        }\n'''
          new = '''        try fileManager.moveItem(at: source, to: destination)\n        if restoredID != id {\n            do {\n                _ = try updateManifest(projectURL: destination) { $0.id = restoredID }\n            } catch {\n                // The move and manifest-ID rewrite form one logical restore transaction. If the\n                // atomic manifest write fails, put the project back in Trash instead of leaving a\n                // Library folder whose directory ID and manifest ID disagree. Never overwrite a\n                // newly appeared source path while rolling back.\n                if !fileManager.fileExists(atPath: source.path),\n                   fileManager.fileExists(atPath: destination.path) {\n                    try? fileManager.moveItem(at: destination, to: source)\n                }\n                throw error\n            }\n        }\n'''
          if s.count(old) != 1:
              raise SystemExit('ScanProjectStore restore anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'one logical restore transaction' splat-native-ios/SplatNative/ScanProjectStore.swift
      - name: Commit repair and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-splat-restore-rollback.yml
          git add splat-native-ios/SplatNative/ScanProjectStore.swift
          git commit -m 'fix(splat): rollback failed collision restore'
          git push origin HEAD:feature/splat-post-build17-p1
