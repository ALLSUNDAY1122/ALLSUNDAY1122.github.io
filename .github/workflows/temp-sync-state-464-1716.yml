name: Temporary sync state 464 1716

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-state-464-1716.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync assignment-filtered state
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main region/north region/east region/central region/west
            git checkout -B main origin/main
            python3 - <<'PY'
          import json,re,subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root='jichitai-compare'
          queue_path=Path(root)/'operations/control/release-queue.json'
          global_path=Path(root)/'operations/control/global-state.json'
          audit_path=Path(root)/'operations/control/audit-log.jsonl'
          progress=json.loads((Path(root)/'operations/progress.json').read_text(encoding='utf-8'))
          assert progress['registeredMunicipalities']==464
          regions={
            'north':('region/north',lambda p:1<=p<=7,717),
            'east':('region/east',lambda p:8<=p<=15 or p in (19,20),708),
            'central':('region/central',lambda p:16<=p<=18 or 21<=p<=30,742),
            'west':('region/west',lambda p:31<=p<=47,716),
          }
          def load(ref,accept):
            paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,f'{root}/data/municipalities'],text=True)
            out=[]
            for path in paths.splitlines():
              m=re.fullmatch(rf'{re.escape(root)}/data/municipalities/(\d{{2}})/(\d{{5}})\.json',path)
              if not m: continue
              pref=int(m.group(1)); code=m.group(2)
              if not accept(pref): continue
              data=json.loads(subprocess.check_output(['git','show',f'{ref}:{path}'],text=True))
              out.append({'code':code,'name':data.get('name') or data.get('municipalityName') or code})
            return sorted(out,key=lambda x:x['code'])
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          entries={e['region']:e for e in queue['entries']}
          pending={}; counts={}; pending_rows={}; total=0; ready=[]
          for key,(branch,accept,pr) in regions.items():
            main=load('HEAD',accept); regional=load(f'origin/{branch}',accept)
            main_codes={x['code'] for x in main}; regional_codes={x['code'] for x in regional}
            rows=[x for x in regional if x['code'] not in main_codes]
            missing=main_codes-regional_codes
            pending[key]=len(rows); pending_rows[key]=rows; counts[key]=len(regional); total+=len(regional)
            if pending[key]>=10: ready.append(key)
            e=entries[key]
            e.update({
              'branch':branch,'municipalities':regional,'count':len(regional),
              'pendingSinceLastRelease':pending[key],
              'releaseStatus':'ready' if pending[key]>=10 else ('up_to_date' if pending[key]==0 else 'pending_threshold'),
              'reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending[key]}自治体'+(f'。mainのみ{len(missing)}自治体' if missing else ''),
              'mainIntegrationPr':pr,'generatedPullRequest':746,
              'auditStatus':'passed' if not missing else 'needs_review'
            })
          now=datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          queue['updatedAt']=now
          queue['summary']={
            'regionalMergedMunicipalities':total,
            'latestGeneratedMunicipalityCount':464,
            'latestGeneratedPullRequest':746,
            'latestPublicCountPullRequest':746,
            'releaseReadyRegions':ready,
            'nextAction':'10自治体到達地域を固定スナップショットで全国統合する。' if ready else '地方統合を継続。現在の公開後繰越: '+ '、'.join(f'{k} {pending[k]}' for k in ('north','east','central','west'))+'。'
          }
          queue['nextAction']=queue['summary']['nextAction']; queue['humanDecisionRequired']=False
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          gs=json.loads(global_path.read_text(encoding='utf-8'))
          gs.update({
            'updatedAt':now,'phase':'release-monitoring',
            'regionalCompletedSinceLastRelease':{**pending,'total':sum(pending.values())},
            'priority':{'type':'release-monitoring','nextAction':queue['summary']['nextAction']},
            'lastNationalIntegrationAt':'2026-07-22T17:06:50+09:00','lastNationalIntegrationPr':742,
            'latestGeneratedMunicipalityCount':464,'latestGeneratedPullRequest':746,
            'latestPublicCountPullRequest':746,'regionalMergedMunicipalities':total,
            'openPullRequests':[],'humanDecisionRequired':False
          })
          global_path.write_text(json.dumps(gs,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          record={'timestamp':now,'actor':'全国進行統括','action':'coordinator-sync-after-public-464','details':{
            'publicMunicipalityCount':464,'publicServices':4176,'regionalCounts':counts,
            'regionalMergedMunicipalities':total,'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},
            'pendingMunicipalities':pending_rows,'nationalIntegrationPullRequest':742,'publicationPullRequest':746,
            'releaseReadyRegions':ready},'humanDecisionRequired':False}
          text=audit_path.read_text(encoding='utf-8')
          if text and not text.endswith('\n'): text+='\n'
          audit_path.write_text(text+json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          Path('/tmp/state-summary').write_text(f"{total} {pending['north']} {pending['east']} {pending['central']} {pending['west']}")
          PY
            read total north east central west < /tmp/state-summary
            git add jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/audit-log.jsonl
            git rm .github/workflows/temp-sync-state-464-1716.yml
            git commit -m "統括管理: 公開464・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
