name: Temporary Sync Release Queue 232

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-232.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={
            'north':[('01429','栗山町'),('01430','月形町')],
            'central':[('21503','川辺町')],
          }
          for entry in data['entries']:
              region=entry['region']
              existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(region,[]):
                  if code not in existing:
                      entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if region=='north':
                  entry['pendingSinceLastRelease']=7
                  entry['reason']='倶知安町から赤井川村までの追加10自治体をPR #411でmainへ全国統合し、生成・公開をPR #415で214自治体へ更新。その後、南幌町・奈井江町・上砂川町・由仁町・長沼町・栗山町・月形町を地方統合'
              elif region=='central':
                  entry['pendingSinceLastRelease']=7
                  entry['reason']='下呂市から安八町までの追加10自治体をPR #404でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新。その後、揖斐川町・大野町・池田町・北方町・坂祝町・富加町・川辺町を地方統合'
              elif region=='east':
                  entry['pendingSinceLastRelease']=2
              elif region=='west':
                  entry['pendingSinceLastRelease']=3
          data['updatedAt']='2026-07-22T03:28:00+09:00'
          data['summary']['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities']=0
          data['summary']['releaseReadyRegions']=[]
          data['summary']['auditBlockedRegions']=[]
          data['summary']['latestGeneratedMunicipalityCount']=214
          data['summary']['latestGeneratedPullRequest']=415
          data['summary']['latestPublicCountPullRequest']=415
          if data['summary']['regionalMergedMunicipalities'] != 232:
              raise SystemExit(f"expected regional total 232, got {data['summary']['regionalMergedMunicipalities']}")
          data['nextAction']='北日本と中日本が前回全国統合後7自治体で先行。西日本3、東日本2。各地域をコード昇順で継続し、10自治体到達時に直ちに全国統合する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-232.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-232.yml
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/temp-sync-release-queue-232.yml','jichitai-compare/operations/control/release-queue.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual ^ expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合232自治体・公開214自治体へ同期'
          git push origin main
