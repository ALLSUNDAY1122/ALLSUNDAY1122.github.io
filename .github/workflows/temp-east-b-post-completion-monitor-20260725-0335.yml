name: East B Post Completion Monitor 20260725 0335

on:
  pull_request:
    branches: [region/east]

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    if: github.head_ref == 'ops/east-b-post-completion-monitor-20260725-0335'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Record post-completion monitoring
        env:
          MONITOR_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          checkpoint_path = Path('jichitai-compare/operations/control/session-checkpoints/east-b.json')
          with checkpoint_path.open(encoding='utf-8') as f:
              data = json.load(f)

          monitor = {
              'checkedAt': '2026-07-25T03:35:00+09:00',
              'openEastBPullRequestCount': 0,
              'openEastBIssueCount': 0,
              'checkpointStatus': 'completed',
              'remainingUninvestigatedCount': 0,
              'regionEastConcurrentPullRequest': {
                  'pullRequestNumber': 3065,
                  'assignedSession': '東日本調査班A',
                  'merged': True,
                  'affectsEastB': False
              },
              'nationwideCurrentState': {
                  'registeredMunicipalities': 1741,
                  'remainingMunicipalities': 0,
                  'completedServices': 15667,
                  'needsMediumReviewServices': 2,
                  'eastBAffected': False,
                  'notes': 'needsMediumReview 2件は東日本B担当外の自治体更新に由来し、東日本Bの担当自治体ファイルはmain更新差分に含まれない。'
              },
              'publicationVerification': {
                  'status': 'published_verified',
                  'publicSmokePullRequestNumber': 3062,
                  'verifiedPublicPageCount': 21
              },
              'nextAction': '新規の公式制度改定、リンク切れ、東日本B担当自治体の公開差分、または明示的な再割当が発生した場合のみ再開する。'
          }
          data['postCompletionMonitor'] = monitor
          data['updatedAt'] = '2026-07-25T03:35:00+09:00'
          data['pullRequestNumber'] = int(os.environ['MONITOR_PR'])
          data['ciStatus'] = 'pending'

          with checkpoint_path.open('w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')

          record = {
              'schemaVersion': '1.0.0',
              'sessionId': 'east-b',
              'checkedAt': '2026-07-25T03:35:00+09:00',
              'status': 'completed_waiting',
              'openPullRequests': 0,
              'openIssues': 0,
              'remainingUninvestigatedCount': 0,
              'publishedVerification': {
                  'status': 'success',
                  'pullRequestNumber': 3062,
                  'verifiedPublicPageCount': 21
              },
              'sharedBranchObservation': {
                  'pullRequestNumber': 3065,
                  'ownerSession': '東日本調査班A',
                  'merged': True,
                  'affectsEastB': False
              },
              'nationwideState': {
                  'registeredMunicipalities': 1741,
                  'remainingMunicipalities': 0,
                  'completedServices': 15667,
                  'needsMediumReviewServices': 2,
                  'eastBAffected': False
              },
              'monitorPullRequestNumber': int(os.environ['MONITOR_PR'])
          }
          record_path = Path('jichitai-compare/operations/audits/east-b-post-completion-monitor-20260725-0335.json')
          with record_path.open('w', encoding='utf-8') as f:
              json.dump(record, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit monitor record and remove temporary workflow
        run: |
          rm .github/workflows/temp-east-b-post-completion-monitor-20260725-0335.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jichitai-compare/operations/control/session-checkpoints/east-b.json \
            jichitai-compare/operations/audits/east-b-post-completion-monitor-20260725-0335.json \
            .github/workflows/temp-east-b-post-completion-monitor-20260725-0335.yml
          git commit -m "ops: 東日本B完了後監視を更新"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
