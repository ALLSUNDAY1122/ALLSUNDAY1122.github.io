name: Temporary Central A Housing Batch 14

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch14-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch14-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 14
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T02:04:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const standardUnavailable='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const corrections={
            '23237':{
              type:'unavailable_primary_source_upgrade',
              service:{
                status:'unavailable',
                summary:standardUnavailable,
                eligibility:{minAgeMonths:0,maxAgeYears:120},
                details:{
                  confirmedGeneralPrograms:'住宅耐震診断・改修、耐震シェルター、空家除却等の一般住宅施策を確認した。',
                  classificationReview:'現行公式ページで子どもの有無、新婚、三世代同居等を対象要件とする住宅取得・改修・家賃支援を確認できないため、一般住宅施策を子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/index.html',checkedAt},
                additionalSources:[{url:'https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/1002501.html',checkedAt,description:'令和8年度の一般住宅向け耐震シェルター整備費補助'}]
              }
            },
            '23238':{
              type:'unavailable_primary_source_upgrade',
              service:{
                status:'unavailable',
                summary:standardUnavailable,
                eligibility:{minAgeMonths:0,maxAgeYears:120},
                details:{
                  confirmedGeneralPrograms:'木造住宅耐震診断・改修・除却、住宅用地球温暖化対策設備等の一般住宅補助を確認した。',
                  classificationReview:'現行公式ページで子どもの有無、新婚、三世代同居等を対象要件とする住宅取得・改修・家賃支援を確認できないため、一般住宅施策を子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/index.html',checkedAt},
                additionalSources:[{url:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/1607.html',checkedAt,description:'令和8年度の一般住宅向け除却費補助'}]
              }
            },
            '23342':{
              type:'current_fiscal_year_newlywed_conditions_clarified',
              service:{
                status:'verified',
                summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',
                details:{
                  program:'豊山町結婚新生活支援事業',
                  marriagePeriod:'2026年1月1日から2027年3月31日までに婚姻届等が受理された世帯',
                  ageCondition:'夫婦とも婚姻日時点で39歳以下',
                  incomeCondition:'夫婦の合計所得が500万円未満等',
                  coveredCosts:'町内住宅の取得費、賃借費、リフォーム費、引越費用',
                  maximum:'夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',
                  residenceCondition:'対象住居が町内にあり、夫婦とも当該住居に住民票があること等',
                  currentStatus:'令和8年度の対象期間・要件を現行公式ページで確認'
                },
                source:{url:'https://www.town.toyoyama.lg.jp/kurashi/todokede/1000702/1004030/index.html',checkedAt}
              }
            },
            '23442':{
              type:'current_child_specific_source_upgrade',
              service:{
                status:'verified',
                summary:'小学生以下の子と同居し、新たに三世代同居または町内近居を始める49歳以下の夫婦世帯へ、住宅の新築・購入費を補助する。',
                details:{
                  program:'東浦町三世代近居等定住促進補助金',
                  target:'契約時に夫婦とも49歳以下で、申請時に小学生以下の子どもと同居する子世帯等',
                  parentCondition:'親世帯が申請日前3年以上継続して町内に居住していること',
                  housing:'市街化区域内の新築または中古の戸建て・マンション等で、耐震性や最低居住面積等の要件を満たすこと',
                  application:'同居・近居開始日から6か月以内。先着順で予算範囲内',
                  amount:'居住誘導区域、同居・近居、子どもの人数等の条件に応じて町の金額一覧で決定'
                },
                source:{url:'https://www.town.aichi-higashiura.lg.jp/life_event/kosodate/11380.html',checkedAt},
                additionalSources:[{url:'https://www.town.aichi-higashiura.lg.jp/kurashi/sumai/tatemono/11377.html',checkedAt,description:'令和8年度の結婚新生活支援補助金'}]
              }
            }
          };
          const noChanges=[{
            code:'28228',
            name:'加東市',
            reason:'令和8年度受付中の住宅型補助金（若年・子育て世帯タイプ）について、18歳年度末までの子ども等の要件と最大200万円の補助が現行公式ページで確認でき、登録内容と一致する。',
            expectedSource:'https://www.city.kato.lg.jp/kakukanogoannai/toshiseibibu/toshiseisakuka/akiya/16588.html'
          }];

          const corrected=[];
          for(const [code,entry] of Object.entries(corrections)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=structuredClone(municipality.services.housingSupport);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');
            corrected.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const unchanged=[];
          for(const item of noChanges){
            const municipality=JSON.parse(fs.readFileSync(path.join(root,'data/municipalities',item.code.slice(0,2),`${item.code}.json`),'utf8'));
            const service=municipality.services.housingSupport;
            if(service.status!=='verified')throw new Error(`${item.code}: expected verified`);
            if(service.source?.url!==item.expectedSource)throw new Error(`${item.code}: source changed unexpectedly`);
            unchanged.push({code:item.code,name:item.name,service:'housingSupport',status:service.status,summary:service.summary,officialSource:service.source.url,reason:item.reason});
          }

          const allCodes=[...Object.keys(corrections),...noChanges.map(item=>item.code)];
          for(const code of allCodes){
            const municipality=JSON.parse(fs.readFileSync(path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`),'utf8'));
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            const disposition=corrections[code]?.type||'verified_no_change';
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第14群で公式情報を再確認し、${disposition}として記録。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          const beforeCounters={correctedMunicipalitiesRechecked:checkpoint.qualityReaudit.correctedMunicipalitiesRechecked,primarySourceSlotsRechecked:checkpoint.qualityReaudit.primarySourceSlotsRechecked,generalHousingMisclassification:checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification};
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残104件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=124;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=556;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=104;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残104件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:14,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:4,noChangeCount:1,statusToUnavailableCount:0,verifiedClarificationOrSourceUpgradeCount:4,remainingCandidates:104,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.qualityReaudit.stateReconciliation={detectedAt:updatedAt,reason:'第13群完了後に並行して最終化された第12群がcheckpoint累計を第12群単独値へ戻していた',authoritativePriorResolution:'central-a-housing-batch13-resolution-20260726',authoritativePriorValues:{correctedMunicipalitiesRechecked:119,primarySourceSlotsRechecked:551,generalHousingMisclassification:109},observedRegressedValues:beforeCounters,resolvedValues:{correctedMunicipalitiesRechecked:124,primarySourceSlotsRechecked:556,generalHousingMisclassification:104},status:'resolved'};
          checkpoint.lastAction='住宅支援分類第14群として、あま市・長久手市のunavailable主出典を改善し、豊山町・東浦町の2026年度子育て・新婚住宅条件を更新、加東市を維持確認した。第12群・第13群の並行処理によるcheckpoint累計回帰も解消した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.centralAHousingStateReconciliation=checkpoint.qualityReaudit.stateReconciliation;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch14-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:4,noChangeCount:1,statusToUnavailableCount:0,verifiedClarificationOrSourceUpgradeCount:4,corrected,unchanged,stateReconciliation:checkpoint.qualityReaudit.stateReconciliation,causeScan:{authoritativePreviousRemainingCandidates:109,reviewedHighRiskCandidates:5,remainingCandidates:104},weakPrimarySource:{dedicatedCandidateCount:33,crossCategorySourceUpgradeCount:2,countChanged:false,reason:'専用の弱い主出典候補台帳との重複を未照合のため候補数は据え置く'},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般住宅制度の現行ページをunavailable判定の主出典とし、自治体トップページだけを根拠にしない','2026年度の新婚・三世代・子育て固有条件を現行利用者向けページで確認して要約する','並行処理でcheckpoint累計が回帰した場合は、完了済みresolutionの最大到達値を正本として復元する'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch14-decisions-20260726.json');
          fs.mkdirSync(path.dirname(auditPath),{recursive:true});
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch14-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/23/23237.json|jichitai-compare/data/municipalities/23/23238.json|jichitai-compare/data/municipalities/23/23342.json|jichitai-compare/data/municipalities/23/23442.json|jichitai-compare/operations/tasks/23237.json|jichitai-compare/operations/tasks/23238.json|jichitai-compare/operations/tasks/23342.json|jichitai-compare/operations/tasks/23442.json|jichitai-compare/operations/tasks/28228.json|jichitai-compare/operations/audits/central-a-housing-classification-batch14-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第14群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
