name: Test Jichitai Public Static Pages 20260724

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  smoke-public:
    if: github.head_ref == 'test/jichitai-public-static-pages-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jichitai-public-static-pages-20260724
          fetch-depth: 0
      - name: Verify current published site
        working-directory: jichitai-compare
        run: |
          node --check scripts/smoke-public-site.mjs
          npm run smoke:public
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/test-jichitai-public-static-pages-20260724.yml
          git commit -m "test: 公開個別ページのスモーク確認を完了"
          git push origin HEAD:test/jichitai-public-static-pages-20260724
