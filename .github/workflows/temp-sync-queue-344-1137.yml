name: Temporary sync queue 344 1137

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-queue-344-1137.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recalculate release queue from branch versus main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git fetch origin \
            region/north:refs/remotes/origin/region/north \
            region/east:refs/remotes/origin/region/east \
            region/central:refs/remotes/origin/region/central \
            region/west:refs/remotes/origin/region/west
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path, PurePosixPath

          root=Path('jichitai-compare')
          qpath=root/'operations/control/release-queue.json'
          data=json.loads(qpath.read_text(encoding='utf-8'))
          policy=json.loads((root/'operations/municipality-assignment-policy.json').read_text(encoding='utf-8'))
          teams={'north':'北日本調査班','east':'東日本調査班','central':'中日本調査班','west':'西日本調査班'}
          prefixes={t['team']:set(t['prefectureCodes']) for t in policy['teams']}
          latest={'north':562,'east':583,'central':574}
          def run(*args):
              return subprocess.check_output(args,text=True).strip()
          def codes(ref, allowed):
              out=run('git','ls-tree','-r','--name-only',ref,'--','jichitai-compare/data/municipalities')
              result=[]
              for p in out.splitlines():
                  if not p.endswith('.json'): continue
                  c=PurePosixPath(p).stem
                  if c.isdigit() and c[:2] in allowed:
                      result.append((c,p))
              return sorted(result)
          def name_for(ref,path,code):
              try:
                  obj=json.loads(run('git','show',f'{ref}:{path}'))
                  if isinstance(obj.get('municipality'),dict) and obj['municipality'].get('name'):
                      return obj['municipality']['name']
                  for k in ('municipalityName','name'):
                      if isinstance(obj.get(k),str) and obj[k]: return obj[k]
              except Exception:
                  pass
              return code
          for e in data['entries']:
              region=e['region']; allowed=prefixes[teams[region]]
              branch_ref=f"origin/{e['branch']}"
              branch_codes=codes(branch_ref,allowed)
              main_codes={c for c,_ in codes('HEAD',allowed)}
              e['municipalities']=[{'code':c,'name':name_for(branch_ref,p,c)} for c,p in branch_codes]
              e['count']=len(branch_codes)
              pending=sum(1 for c,_ in branch_codes if c not in main_codes)
              e['pendingSinceLastRelease']=pending
              e['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              e['reason']=f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体'
              if region in latest: e['mainIntegrationPr']=latest[region]
              e['generatedPullRequest']=587
              e['auditStatus']='passed'
          data['updatedAt']=datetime.now(timezone(timedelta(hours=9))).replace(second=0,microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          data['summary']['latestGeneratedMunicipalityCount']=344
          data['summary']['latestGeneratedPullRequest']=587
          data['summary']['latestPublicCountPullRequest']=587
          data['summary']['releaseReadyRegions']=[e['region'] for e in data['entries'] if e['pendingSinceLastRelease']>=10]
          data['summary']['auditBlockedRegions']=[]
          ordered=sorted(data['entries'],key=lambda e:e['pendingSinceLastRelease'],reverse=True)
          data['nextAction']='地方統合を継続。現在の公開後繰越: '+'、'.join(f"{e['region']} {e['pendingSinceLastRelease']}" for e in ordered)+'。10自治体到達地域を固定スナップショットで全国統合する。'
          data['humanDecisionRequired']=False
          qpath.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          labels={'north':'北','east':'東','central':'中','west':'西'}
          ptxt='・'.join(f"{labels[e['region']]}{e['pendingSinceLastRelease']}" for e in data['entries'])
          Path('/tmp/msg').write_text(f"統括管理: 地方統合{data['summary']['regionalMergedMunicipalities']}自治体・公開344自治体へ同期（{ptxt}）",encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-sync-queue-344-1137.yml
          git commit -m "$(cat /tmp/msg)"
          git push origin HEAD:main
