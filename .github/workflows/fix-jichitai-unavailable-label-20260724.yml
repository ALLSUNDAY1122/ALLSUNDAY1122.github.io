name: Fix Jichitai Unavailable Label 20260724

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix-copy:
    if: github.head_ref == 'fix/jichitai-unavailable-label-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jichitai-unavailable-label-20260724
          fetch-depth: 0
      - name: Correct unavailable semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'jichitai-compare/app.js';
          const cssPath = 'jichitai-compare/styles.css';
          let app = fs.readFileSync(appPath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');

          const replacements = [
            [
              `function unavailableCell(summary, source = {}) {\n  return \`<span class="status no">制度なし・対象外</span><span class="cell-main">\${escapeHtml(summary)}</span>\${sourceLink(source)}\`;\n}`,
              `function unavailableCell(summary, source = {}) {\n  return \`<span class="status review">公式情報で詳細未確認</span><span class="cell-main">\${escapeHtml(summary)}</span><span class="cell-detail">制度がないとは限りません。現行条件は自治体の公式サイトまたは担当窓口で確認してください。</span>\${sourceLink(source)}\`;\n}`
            ],
            [
              `elements.searchResults.textContent = '詳細データ登録済みの自治体には見つかりませんでした。';`,
              `elements.searchResults.textContent = '入力内容に一致する自治体が見つかりませんでした。';`
            ],
            [
              `: '公式リンク・比較データは順次追加します。';`,
              `: '自治体データの読み込み状態を確認してください。';`
            ],
            [
              `empty.textContent = '現在、この都道府県の詳細データは未登録です。';`,
              `empty.textContent = 'この都道府県の自治体データを読み込めませんでした。';`
            ]
          ];

          for (const [before, after] of replacements) {
            if (!app.includes(before)) throw new Error(`app.js replacement target missing: ${before.slice(0, 80)}`);
            app = app.replace(before, after);
          }

          const cssTarget = `.status.no { background: #fee2e2; color: #991b1b; }`;
          const cssReplacement = `${cssTarget}\n.status.review { background: #fef3c7; color: #92400e; }`;
          if (!css.includes(cssTarget)) throw new Error('styles.css replacement target missing');
          css = css.replace(cssTarget, cssReplacement);

          fs.writeFileSync(appPath, app);
          fs.writeFileSync(cssPath, css);
          NODE
          git rm .github/workflows/fix-jichitai-unavailable-label-20260724.yml
          git add jichitai-compare/app.js jichitai-compare/styles.css
          git commit -m "fix: unavailableを公式情報未確認として表示"
          git push origin HEAD:fix/jichitai-unavailable-label-20260724
