name: Temporary Central A Housing Batch 25 Main Sync

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch25-main-trigger-20260726.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/central-a-housing-batch25-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset and import regional records
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(
            jichitai-compare/data/municipalities/27/27227.json
            jichitai-compare/data/municipalities/27/27228.json
            jichitai-compare/data/municipalities/27/27229.json
            jichitai-compare/data/municipalities/27/27230.json
            jichitai-compare/data/municipalities/27/27232.json
            jichitai-compare/operations/tasks/27227.json
            jichitai-compare/operations/tasks/27228.json
            jichitai-compare/operations/tasks/27229.json
            jichitai-compare/operations/tasks/27230.json
            jichitai-compare/operations/tasks/27232.json
            jichitai-compare/operations/audits/central-a-housing-classification-batch25-decisions-20260726.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
            jichitai-compare/operations/control/regions/central.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/region/central:$file" > "$file"
          done
      - name: Regenerate and validate
        run: |
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
      - name: Validate scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/27/27227.json|jichitai-compare/data/municipalities/27/27228.json|jichitai-compare/data/municipalities/27/27229.json|jichitai-compare/data/municipalities/27/27230.json|jichitai-compare/data/municipalities/27/27232.json|jichitai-compare/operations/tasks/27227.json|jichitai-compare/operations/tasks/27228.json|jichitai-compare/operations/tasks/27229.json|jichitai-compare/operations/tasks/27230.json|jichitai-compare/operations/tasks/27232.json|jichitai-compare/operations/audits/central-a-housing-classification-batch25-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/27227/index.html|jichitai-compare/municipality/27228/index.html|jichitai-compare/municipality/27229/index.html|jichitai-compare/municipality/27230/index.html|jichitai-compare/municipality/27232/index.html|jichitai-compare/sitemap.xml) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
      - name: Record sync and commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='jichitai-compare/operations/audits/central-a-housing-classification-batch25-decisions-20260726.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          a.regionalMergePullRequestNumber=3849;
          a.nationalSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          a.nationalSyncWorkflowRunId=Number(process.env.RUN_ID);
          a.nationalSyncStatus='validated_pending_merge';
          fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          const t='jichitai-compare/operations/control/central-a-housing-batch25-main-trigger-20260726.json';
          if(fs.existsSync(t)) fs.rmSync(t);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'sync: 中日本A住宅支援分類第25群を全国反映'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
