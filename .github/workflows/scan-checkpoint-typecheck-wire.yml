name: Scan checkpoint typecheck one-shot

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scan-checkpoint-typecheck-wire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Split checkpoint expression
        run: python3 .github/scripts/scan_checkpoint_typecheck_patch.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          grep -q 'let checkpoint = ScanCaptureCheckpoint' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'storedLastTransform' splat-native-ios/SplatNative/ScanModel.swift
          git config user.name 'Scan Integration HQ'
          git config user.email 'actions@users.noreply.github.com'
          git add splat-native-ios/SplatNative/ScanModel.swift
          git diff --cached --check
          git commit -m 'Split cold resume checkpoint expression for Swift compiler'
          git push origin HEAD:feature/splat-native-ios-poc
