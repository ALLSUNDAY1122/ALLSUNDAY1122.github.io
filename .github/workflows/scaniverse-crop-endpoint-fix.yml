name: Scaniverse crop endpoint fix

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scaniverse-crop-endpoint-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Align viewer and output crop endpoint semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          export = Path('splat-native-ios/SplatNative/SplatExportService.swift')
          s = export.read_text()
          old = '''        if settings.cropXMin > 0.0001 || settings.cropXMax < 0.9999 {\n            if p.x < bounds.x.value(at: settings.cropXMin) || p.x > bounds.x.value(at: settings.cropXMax) { return false }\n        }\n        if settings.cropYMin > 0.0001 || settings.cropYMax < 0.9999 {\n            if p.y < bounds.y.value(at: settings.cropYMin) || p.y > bounds.y.value(at: settings.cropYMax) { return false }\n        }\n        if settings.cropZMin > 0.0001 || settings.cropZMax < 0.9999 {\n            if p.z < bounds.z.value(at: settings.cropZMin) || p.z > bounds.z.value(at: settings.cropZMax) { return false }\n        }\n'''
          new = '''        // Robust percentile bounds stabilize slider travel, but an untouched endpoint must\n        // remain open-ended. Otherwise moving only the lower handle would silently drop the\n        // upper 1% tail (and vice versa), so Viewer/export/video would not represent the UI.\n        if settings.cropXMin > 0.0001, p.x < bounds.x.value(at: settings.cropXMin) { return false }\n        if settings.cropXMax < 0.9999, p.x > bounds.x.value(at: settings.cropXMax) { return false }\n        if settings.cropYMin > 0.0001, p.y < bounds.y.value(at: settings.cropYMin) { return false }\n        if settings.cropYMax < 0.9999, p.y > bounds.y.value(at: settings.cropYMax) { return false }\n        if settings.cropZMin > 0.0001, p.z < bounds.z.value(at: settings.cropZMin) { return false }\n        if settings.cropZMax < 0.9999, p.z > bounds.z.value(at: settings.cropZMax) { return false }\n'''
          if old not in s:
              raise SystemExit('SplatExportService crop block not found')
          export.write_text(s.replace(old, new, 1))

          viewer = Path('splat-native-ios/SplatNative/SplatViewer.swift')
          s = viewer.read_text()
          old = '''        let cropX = settings.cropXMin > 0.0001 || settings.cropXMax < 0.9999\n        let cropY = settings.cropYMin > 0.0001 || settings.cropYMax < 0.9999\n        let cropZ = settings.cropZMin > 0.0001 || settings.cropZMax < 0.9999\n\n        var result: [SplatPoint] = []\n        result.reserveCapacity(points.count)\n        for point in points {\n            let p = point.position\n            guard p.x.isFinite, p.y.isFinite, p.z.isFinite else { continue }\n            if cropX && (p.x < xLow || p.x > xHigh) { continue }\n            if cropY && (p.y < yLow || p.y > yHigh) { continue }\n            if cropZ && (p.z < zLow || p.z > zHigh) { continue }\n'''
          new = '''        let cropXLow = settings.cropXMin > 0.0001\n        let cropXHigh = settings.cropXMax < 0.9999\n        let cropYLow = settings.cropYMin > 0.0001\n        let cropYHigh = settings.cropYMax < 0.9999\n        let cropZLow = settings.cropZMin > 0.0001\n        let cropZHigh = settings.cropZMax < 0.9999\n\n        var result: [SplatPoint] = []\n        result.reserveCapacity(points.count)\n        for point in points {\n            let p = point.position\n            guard p.x.isFinite, p.y.isFinite, p.z.isFinite else { continue }\n            if cropXLow && p.x < xLow { continue }\n            if cropXHigh && p.x > xHigh { continue }\n            if cropYLow && p.y < yLow { continue }\n            if cropYHigh && p.y > yHigh { continue }\n            if cropZLow && p.z < zLow { continue }\n            if cropZHigh && p.z > zHigh { continue }\n'''
          if old not in s:
              raise SystemExit('SplatViewer crop block not found')
          viewer.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- splat-native-ios/SplatNative/SplatExportService.swift splat-native-ios/SplatNative/SplatViewer.swift
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatExportService.swift splat-native-ios/SplatNative/SplatViewer.swift
          git commit -m 'fix(scaniverse): keep untouched crop endpoints open'
          git push origin HEAD:feature/splat-native-ios-poc
