name: Temporary Central A Weak Source Batch 2

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch2-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch2-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weak primary source batch 2
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T21:24:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const readJson=p=>{const raw=fs.readFileSync(p,'utf8');return{raw,obj:JSON.parse(raw)}};
          const writeJson=(p,raw,obj)=>fs.writeFileSync(p,(raw.startsWith('{\n')?JSON.stringify(obj,null,2):JSON.stringify(obj))+'\n');
          const addSource=(svc,entry)=>{const list=Array.isArray(svc.additionalSources)?svc.additionalSources:[];const i=list.findIndex(x=>x.url===entry.url);if(i>=0)list[i]={...list[i],...entry};else list.push(entry);svc.additionalSources=list;};
          const decisions=[
            {code:'22224',pref:'22',name:'菊川市',service:'housingSupport',outcome:'direct_user_page_maintained',previousUrl:'https://www.city.kikugawa.shizuoka.jp/toshikeikaku/jyuutakuhojyo.html',newUrl:'https://www.city.kikugawa.shizuoka.jp/toshikeikaku/jyuutakuhojyo.html',basis:'令和8年度の受付期間、若者・子育て世帯の対象条件、一般25万円・三世代40万円を直接掲載する現行利用者向けページを確認'},
            {code:'22325',pref:'22',name:'函南町',service:'sickChildCare',outcome:'primary_source_replaced_with_provider_page',previousUrl:'https://www.town.kannami.shizuoka.jp/material/files/group/11/3kikodomokosodatekeikaku.pdf',newUrl:'https://website2.infomity.net/8120000051/kidscare.html',basis:'函南平出クリニックの病児保育室について、6か月児から10歳程度、平日8時30分から17時30分、函南町民無料、事前登録制を直接確認'},
            {code:'22344',pref:'22',name:'小山町',service:'sickChildCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.fuji-oyama.jp/oyama/reiki/reiki_honbun/g340RG00000852.html',newUrl:'https://www.fuji-oyama.jp/oyama/reiki/reiki_honbun/g340RG00000852.html',basis:'町公式要綱を制度根拠として維持し、町公式こども園一覧と県公式子育て施設マップを利用者向け導線として追加'},
            {code:'23220',pref:'23',name:'稲沢市',service:'schoolMeals',outcome:'content_and_primary_source_corrected',previousUrl:'https://www.city.inazawa.aichi.jp/kosodate/0000001603.html',newUrl:'https://www.city.inazawa.aichi.jp/0000004483.html',basis:'令和8年度は小中学生の給食費を完全無償化し、食物アレルギー等で弁当持参の家庭にも同額補助する現行市公式案内を確認'},
            {code:'23561',pref:'23',name:'設楽町',service:'postpartumCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.town.shitara.lg.jp/online/reiki/reiki_honbun/r253RG00000697.html',newUrl:'https://www.town.shitara.lg.jp/online/reiki/reiki_honbun/r253RG00000697.html',basis:'令和7年12月施行改正を含む現行要綱を維持し、令和8年度暮らしの便利帳の利用者向け案内導線を追加'}
          ];
          for(const d of decisions){
            const municipalityPath=path.join(root,'data/municipalities',d.pref,`${d.code}.json`);
            const {raw,obj:m}=readJson(municipalityPath);
            const svc=m.services[d.service];
            if(!svc)throw new Error(`${d.code}:${d.service} missing`);
            if(d.code==='22224'){
              svc.source.checkedAt=checkedAt;
            }else if(d.code==='22325'){
              svc.summary='生後6か月から10歳程度までの病児を函南平出クリニックの専用保育室で預かり、函南さくら保育園では病後児保育を実施する。';
              svc.eligibility={minAgeMonths:6,maxAgeYears:10};
              svc.details={program:'病児・病後児保育事業',sickFacility:'函南ペンギン病児保育室（函南平出クリニック）',recoveryFacility:'函南さくら保育園（健康支援一時預り・病後児保育）',target:'函南平出クリニックは生後6か月から10歳程度までの急性期の病児',hours:'函南平出クリニックは月曜日から金曜日の8時30分から17時30分',capacity:'函南平出クリニックは定員15人',fee:'函南町民は函南平出クリニックの病児保育利用料無料。食事・送迎等は別途負担の場合あり',application:'事前登録後、施設へ予約。年齢相当の予防接種等の利用条件を確認'};
              svc.source={url:d.newUrl,checkedAt};
              addSource(svc,{url:'https://kannamisakura-h.com/info/',checkedAt,description:'函南さくら保育園が健康支援一時預り（病後児保育）を実施することを確認'});
              addSource(svc,{url:'https://www.town.kannami.shizuoka.jp/material/files/group/11/3kikodomokosodatekeikaku.pdf',checkedAt,description:'町計画における病児・病後児保育の実施施設と確保方策'});
            }else if(d.code==='22344'){
              svc.source.checkedAt=checkedAt;
              addSource(svc,{url:'https://www.fuji-oyama.jp/page/3167.html',checkedAt,description:'町公式の令和8年度こども園一覧と実施施設への導線'});
              addSource(svc,{url:'https://www.fujisancco.pref.shizuoka.jp/map/map_result.php?city%5B%5D=%E5%B0%8F%E5%B1%B1%E7%94%BA',checkedAt,description:'静岡県公式子育て支援施設マップの病児・病後児保育導線'});
            }else if(d.code==='23220'){
              svc.summary='令和8年度は市内小学校・中学校の学校給食費を完全無償化し、食物アレルギー等で弁当を持参する家庭にも給食費相当額を補助する。';
              svc.details={fiscalYear:'令和8年度',support:'小学校給食費は公立学校給食費負担軽減補助金、中学校給食費は国の臨時交付金等を活用して全額支援',parentBurden:'市内小中学校の学校給食費は0円',allergySupport:'食物アレルギー等で弁当を持参する家庭にも給食費相当額を補助',period:'令和8年4月1日から令和9年3月31日までの令和8年度措置',application:'市立学校の通常給食は学校案内に従う。弁当持参家庭の補助手続は学校または教育委員会へ確認'};
              svc.source={url:d.newUrl,checkedAt};
              addSource(svc,{url:'https://www.city.inazawa.aichi.jp/cmsfiles/contents/0000002/2491/R08_yosangaiyou.pdf',checkedAt,description:'令和8年度当初予算における小中学校給食費全額支援の根拠'});
            }else if(d.code==='23561'){
              svc.source.checkedAt=checkedAt;
              svc.details.usageLimit='宿泊型・デイサービス型・アウトリーチ型を合わせ原則7日、必要時はさらに7日まで延長可能';
              svc.details.fee='課税世帯は宿泊型1日2,400円または24時間1単位2,000円、デイサービス型1日1,300円、アウトリーチ型1日800円。生活保護・住民税非課税世帯は無料';
              addSource(svc,{url:'https://www.town.shitara.lg.jp/soshiki/5/1181.html',checkedAt,description:'町の行政サービスを案内する令和8年度暮らしの便利帳への利用者向け導線'});
            }
            m.updatedAt=checkedAt;
            writeJson(municipalityPath,raw,m);
            const taskPath=path.join(root,'operations/tasks',`${d.code}.json`);
            const {raw:taskRaw,obj:task}=readJson(taskPath);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='中日本調査班A';task.status='merged';task.completedServices=keys;
            task.verifiedCount=keys.filter(k=>m.services[k]?.status==='verified').length;task.researchingCount=keys.filter(k=>m.services[k]?.status==='researching').length;task.unavailableCount=keys.filter(k=>m.services[k]?.status==='unavailable').length;task.needsMediumReviewCount=keys.filter(k=>m.services[k]?.status==='needs_medium_review').length;
            const sources=[];for(const key of keys){const s=m.services[key];if(s?.source?.url)sources.push(s.source.url);}task.officialSources=[...new Set(sources)];
            task.notes=Array.isArray(task.notes)?task.notes:[];const note=`2026-07-26 弱い主出典第2群: ${d.service}を${d.outcome}として再確認。${d.basis}`;if(!task.notes.includes(note))task.notes.push(note);task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);
          }
          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));const done=new Set(decisions.map(d=>`${d.code}:${d.service}`));recovery.queue=(recovery.queue??[]).filter(x=>!done.has(`${x.code}:${x.service}`));recovery.queueCount=recovery.queue.length;recovery.nextBatch=recovery.queue.slice(0,5);recovery.status='active_queue_batch2_applied';recovery.lastAppliedBatch=2;recovery.lastAppliedAt=updatedAt;fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          const decision={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch2-decisions-20260726',session:'中日本調査班A',coordinatorSession:'統括B',checkedAt,updatedAt,category:'weakPrimarySource',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:1,contentCorrectionCount:1,remainingCandidates:23,decisions,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'regional_changes_validated',blocker:null};fs.writeFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch2-decisions-20260726.json'),JSON.stringify(decision,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));checkpoint.updatedAt=updatedAt;checkpoint.status='completed';checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.nextAction='弱い主出典残23件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';const q=checkpoint.qualityReaudit;q.latestCompletedAt=updatedAt;q.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);q.latestCiRunNumber=Number(process.env.RUN_ID);q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??236),241);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??668),673);q.candidateCounts.weakPrimarySource=23;q.latestWeakSourceBatch={batch:2,status:'regional_changes_validated',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:1,contentCorrectionCount:1,remainingCandidates:23,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};q.confirmedCorrections=Array.isArray(q.confirmedCorrections)?q.confirmedCorrections:[];for(const d of decisions)if(!q.confirmedCorrections.some(x=>x.type==='weak_primary_source_resolved'&&String(x.code)===d.code&&x.service===d.service))q.confirmedCorrections.push({type:'weak_primary_source_resolved',code:d.code,service:d.service,name:d.name,outcome:d.outcome});checkpoint.lastAction='弱い主出典第2群5制度を公式情報で再確認し、稲沢市学校給食を令和8年度完全無償化へ訂正、函南町病児保育の主出典を直接案内へ更新した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-trigger-20260726.json
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第2群を改善'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
