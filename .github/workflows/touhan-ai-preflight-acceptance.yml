name: Touhan AI Preflight Acceptance 599 (Pre-TestFlight)
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-ios/scripts/prepare_offline_web.py'
      - 'touroku-hanbaisha-ios/scripts/test_offline_candidate.py'
      - 'touroku-hanbaisha-ios/App.js'
      - 'touroku-hanbaisha-ios/app.json'
      - 'touroku-hanbaisha-ios/APP_STORE_METADATA.md'
      - 'touroku-hanbaisha-ios/scripts/validate_release.py'
      - 'touroku-hanbaisha-ios/scripts/repair_official_figure_links.py'
      - 'touroku-hanbaisha-ios/scripts/ai_preflight_acceptance.py'
      - 'touroku-hanbaisha-ios/native-ios/Sources/TouhanSprintApp.swift'
      - '.github/workflows/touhan-ai-preflight-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: touhan-ai-preflight-599
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax and Node JavaScript parsing
        id: syntax
        continue-on-error: true
        run: |
          python -m py_compile touroku-hanbaisha-ios/scripts/validate_release.py touroku-hanbaisha-ios/scripts/ai_preflight_acceptance.py
          node --check touroku-hanbaisha-sprint/app-v07.js
          node --check touroku-hanbaisha-sprint/r1-canonical-loader-v08.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('touroku-hanbaisha-sprint/official-practice.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/touhan-official-ui.js').write_text(scripts[0])
          PY
          node --check /tmp/touhan-official-ui.js
      - name: Restore missing source figure names with pinned SHA
        id: figure_repair
        continue-on-error: true
        run: python touroku-hanbaisha-ios/scripts/repair_official_figure_links.py
      - name: Generate canonical AppIcon
        id: icon_recovery
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check 'cairosvg==2.8.2'
          bash touroku-hanbaisha-ios/native-ios/prepare-ios.sh
      - name: Run existing legacy-360 release validator plus canonical-599 integration contract
        id: release_validation
        continue-on-error: true
        run: python touroku-hanbaisha-ios/scripts/validate_release.py
      - name: Install Chromium and run full 599-question real browser QA
        id: full_browser
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --directory touroku-hanbaisha-sprint >/tmp/touhan-preflight-web.log 2>&1 &
          sleep 2
          python touroku-hanbaisha-sprint/official-kansai/test_mobile_ui.py
      - name: Generate independent AI preflight acceptance result
        run: python touroku-hanbaisha-ios/scripts/ai_preflight_acceptance.py
      - name: Record observed checks in run-specific artifact (no repository writes)
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          RELEASE_VALIDATION: ${{ steps.release_validation.outcome }}
          FULL_BROWSER: ${{ steps.full_browser.outcome }}
          FIGURE_REPAIR: ${{ steps.figure_repair.outcome }}
          ICON_RECOVERY: ${{ steps.icon_recovery.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('touroku-hanbaisha-ios')
          p=b/'AI_PREFLIGHT_ACCEPTANCE_20261124.json'
          d=json.loads(p.read_text())
          names={'SYNTAX':'Q9_SYNTAX_AND_JS','RELEASE_VALIDATION':'Q10_LEGACY_AND_OFFICIAL_RELEASE_VALIDATOR','FULL_BROWSER':'Q11_CHROMIUM_FULL_BANK_375_430','FIGURE_REPAIR':'Q12_SOURCE_FIGURE_SHA','ICON_RECOVERY':'Q13_CANONICAL_APP_ICON'}
          for k,name in names.items():
              success=os.environ[k]=='success'
              d['checks'].append({'id':name,'status':'PASS' if success else 'FAIL',
                                  'detail':('GitHub Actions step success' if success else 'GitHub Actions step failed; inspect job logs'),
                                  'evidence':[f'https://github.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/actions/runs/{os.environ["RUN_ID"]}']})
          d['blocking']=[x['id'] for x in d['checks'] if x['status']!='PASS']
          d['overall']='BLOCKED' if d['blocking'] else 'PASS'
          d['actionsRunId']=int(os.environ['RUN_ID'])
          d['actionsHead']=os.environ['RUN_HEAD']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print(d['overall'],d['blocking'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-599-ai-preflight
          path: |
            touroku-hanbaisha-ios/AI_PREFLIGHT_ACCEPTANCE_20261124.json
            touroku-hanbaisha-ios/FIGURE_LINK_AUDIT_20261124.json
            /tmp/touhan_mobile_*.png
          if-no-files-found: ignore
      - name: Enforce acceptance verdict
        run: |
          python - <<'PY'
          import json
          d=json.load(open('touroku-hanbaisha-ios/AI_PREFLIGHT_ACCEPTANCE_20261124.json'))
          if d['overall']!='PASS':
              raise SystemExit('AI PREFLIGHT BLOCKED: '+', '.join(d['blocking']))
          print('AI PREFLIGHT PASS')
          PY
