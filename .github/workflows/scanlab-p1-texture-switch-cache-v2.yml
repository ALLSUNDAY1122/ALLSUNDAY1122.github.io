name: Scan Lab P1 texture switch cache v2 one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-texture-switch-cache-v2.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Patch bounded alternating-material sampler reuse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/MeshPointCloudExportService.swift')
          s = p.read_text()
          anchor = '''    private enum PointPlan {\n'''
          cache = '''    struct AlternatingTextureCache<Value> {\n        let cacheByteLimit: Int\n        private var activeURL: URL?\n        private var activeValue: Value?\n        private var cachedURL: URL?\n        private var cachedValue: Value?\n\n        init(cacheByteLimit: Int) {\n            self.cacheByteLimit = max(0, cacheByteLimit)\n        }\n\n        mutating func value(\n            for url: URL,\n            byteCount: (Value) -> Int,\n            load: (URL) throws -> Value\n        ) rethrows -> Value {\n            let key = url.standardizedFileURL\n            if activeURL == key, let activeValue { return activeValue }\n\n            if cachedURL == key, let cachedValue {\n                let previousURL = activeURL\n                let previousValue = activeValue\n                activeURL = key\n                activeValue = cachedValue\n                if let previousURL, let previousValue, byteCount(previousValue) <= cacheByteLimit {\n                    self.cachedURL = previousURL\n                    self.cachedValue = previousValue\n                } else {\n                    self.cachedURL = nil\n                    self.cachedValue = nil\n                }\n                return cachedValue\n            }\n\n            // Discard the secondary sampler before a decode miss so a material switch never\n            // retains three decoded atlases. This keeps peak memory close to the prior behavior.\n            cachedURL = nil\n            cachedValue = nil\n            let previousURL = activeURL\n            let previousValue = activeValue\n            let loaded = try load(key)\n            activeURL = key\n            activeValue = loaded\n            if let previousURL, let previousValue, byteCount(previousValue) <= cacheByteLimit {\n                cachedURL = previousURL\n                cachedValue = previousValue\n            }\n            return loaded\n        }\n    }\n\n'''
          if s.count(anchor) != 1: raise SystemExit('cache insertion anchor mismatch')
          s = s.replace(anchor, cache + anchor, 1)
          old = '''    private static let maxTextureSampleDimension = 4_096\n'''
          new = '''    private static let maxTextureSampleDimension = 4_096\n    // Retain only one small previous atlas. A/B/A/B no longer re-decodes small textures while\n    // large atlases keep the established one-active memory behavior.\n    private static let alternatingTextureCacheByteLimit = 8 * 1_024 * 1_024\n'''
          if s.count(old) != 1: raise SystemExit('constant anchor mismatch')
          s = s.replace(old, new, 1)
          old = '''        case .texturedCorners(let textures):\n            var activeTextureURL: URL?\n            var activeSampler: TextureSampler?\n            for triangle in geometry.triangles {\n                guard let textureURL = textures.textureURL(for: triangle.material) else {\n                    throw ExportError.invalidTexture\n                }\n                if activeTextureURL != textureURL {\n                    try Task.checkCancellation()\n                    guard let sampler = try loadTextureSampler(textureURL) else {\n                        throw ExportError.invalidTexture\n                    }\n                    activeSampler = sampler\n                    activeTextureURL = textureURL\n                }\n                guard let sampler = activeSampler else { throw ExportError.invalidTexture }\n                for corner in triangle.corners {\n'''
          new = '''        case .texturedCorners(let textures):\n            var samplerCache = AlternatingTextureCache<TextureSampler>(\n                cacheByteLimit: alternatingTextureCacheByteLimit\n            )\n            for triangle in geometry.triangles {\n                guard let textureURL = textures.textureURL(for: triangle.material) else {\n                    throw ExportError.invalidTexture\n                }\n                let sampler = try samplerCache.value(\n                    for: textureURL,\n                    byteCount: { $0.rgba.count }\n                ) { url in\n                    try Task.checkCancellation()\n                    guard let loaded = try loadTextureSampler(url) else {\n                        throw ExportError.invalidTexture\n                    }\n                    return loaded\n                }\n                for corner in triangle.corners {\n'''
          if s.count(old) != 1: raise SystemExit('forEachPoint anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          t = Path('splat-native-ios/SplatNativeTests/MeshPointCloudExportServiceTests.swift')
          tests = t.read_text()
          anchor = '''    func testPLYReloadsTextureWhenMaterialReturnsAfterSwitch() throws {\n'''
          insertion = '''    func testAlternatingTextureCacheReusesSmallPreviousSampler() {\n        var cache = MeshPointCloudExportService.AlternatingTextureCache<Int>(cacheByteLimit: 8)\n        let root = URL(fileURLWithPath: "/tmp")\n        let a = root.appendingPathComponent("a.png")\n        let b = root.appendingPathComponent("b.png")\n        var loads = 0\n        func load(_ url: URL) -> Int {\n            loads += 1\n            return url == a ? 4 : 4\n        }\n\n        _ = cache.value(for: a, byteCount: { $0 }, load: load)\n        _ = cache.value(for: b, byteCount: { $0 }, load: load)\n        _ = cache.value(for: a, byteCount: { $0 }, load: load)\n        _ = cache.value(for: b, byteCount: { $0 }, load: load)\n        XCTAssertEqual(loads, 2, "A/B/A/B should decode each small atlas only once")\n    }\n\n    func testAlternatingTextureCacheDoesNotRetainOversizedPreviousSampler() {\n        var cache = MeshPointCloudExportService.AlternatingTextureCache<Int>(cacheByteLimit: 8)\n        let root = URL(fileURLWithPath: "/tmp")\n        let a = root.appendingPathComponent("large-a.png")\n        let b = root.appendingPathComponent("large-b.png")\n        var loads = 0\n        func load(_ url: URL) -> Int { loads += 1; return 9 }\n\n        _ = cache.value(for: a, byteCount: { $0 }, load: load)\n        _ = cache.value(for: b, byteCount: { $0 }, load: load)\n        _ = cache.value(for: a, byteCount: { $0 }, load: load)\n        XCTAssertEqual(loads, 3, "Oversized atlases must keep the one-active decode behavior")\n    }\n\n'''
          if tests.count(anchor) != 1: raise SystemExit('test anchor mismatch')
          t.write_text(tests.replace(anchor, insertion + anchor, 1))
          PY
          grep -q 'AlternatingTextureCache' splat-native-ios/SplatNative/MeshPointCloudExportService.swift
          grep -q 'A/B/A/B should decode each small atlas only once' splat-native-ios/SplatNativeTests/MeshPointCloudExportServiceTests.swift
      - name: Commit product patch and retire one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/scanlab-p1-texture-switch-cache.yml \
            .github/workflows/scanlab-p1-texture-switch-cache-repair.yml \
            .github/workflows/scanlab-p1-texture-switch-cache-v2.yml
          git add splat-native-ios/SplatNative/MeshPointCloudExportService.swift \
            splat-native-ios/SplatNativeTests/MeshPointCloudExportServiceTests.swift
          git commit -m 'perf(mesh): reuse bounded alternating texture sampler'
          git push origin HEAD:feature/splat-post-build17-p1
