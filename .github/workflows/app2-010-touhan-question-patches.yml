name: APP2-010 Apply Touhan Question Patches

on:
  push:
    paths:
      - 'automation/app2-010-touhan-question-patches.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patches
        run: python scripts/app2_010_apply_question_patches.py
      - name: Validate changed JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('touroku-hanbaisha-sprint/questions').glob('exam-*/chapter-*.json'):
              json.load(open(p, encoding='utf-8'))
          print('PASS: all question JSON parses')
          PY
      - name: Commit patched questions
        run: |
          if git diff --quiet -- touroku-hanbaisha-sprint/questions; then
            echo 'No question changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-sprint/questions
          git commit -m 'Apply APP2-010 Touhan question quality patches'
          git push
