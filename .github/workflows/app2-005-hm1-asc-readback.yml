name: APP2-005 HealthManager1 ASC read-back

on:
  push:
    branches: [main]
    paths:
      - automation/app2-005-hm1-asc-command.json

permissions:
  contents: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Query App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set +e
          python3 scripts/app_store_connect_gateway.py \
            --command automation/app2-005-hm1-asc-command.json \
            --output /tmp/app2-005-asc-result.json \
            > /tmp/app2-005-asc-stdout.txt \
            2> /tmp/app2-005-asc-stderr.txt
          rc=$?
          echo "$rc" > /tmp/app2-005-asc-exit.txt
          exit 0
      - name: Persist scoped summary
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          command = json.loads(Path('automation/app2-005-hm1-asc-command.json').read_text(encoding='utf-8'))
          exit_code = int(Path('/tmp/app2-005-asc-exit.txt').read_text(encoding='utf-8').strip())
          result_path = Path('/tmp/app2-005-asc-result.json')
          stderr = Path('/tmp/app2-005-asc-stderr.txt').read_text(encoding='utf-8', errors='replace')[:4000]
          stdout = Path('/tmp/app2-005-asc-stdout.txt').read_text(encoding='utf-8', errors='replace')[:2000]
          safe_keys = (
              'name','bundleId','sku','primaryLocale','version','platform','uploadedDate',
              'processingState','expired','expirationDate','minOsVersion','betaReviewState',
              'referenceName','productId','state','subscriptionPeriod','inAppPurchaseType',
              'customerPrice','proceeds','startDate','endDate','manual','currency','locale','description'
          )

          def clean_resources(resources):
              if isinstance(resources, dict):
                  resources = [resources]
              clean = []
              for resource in resources or []:
                  attrs = resource.get('attributes') or {}
                  relationships = {}
                  for name, rel in (resource.get('relationships') or {}).items():
                      data = (rel or {}).get('data')
                      if isinstance(data, dict):
                          relationships[name] = {'type': data.get('type'), 'id': data.get('id')}
                      elif isinstance(data, list):
                          relationships[name] = [{'type': x.get('type'), 'id': x.get('id')} for x in data if isinstance(x, dict)]
                  item = {
                      'id': resource.get('id'),
                      'type': resource.get('type'),
                      'attributes': {k: attrs.get(k) for k in safe_keys if k in attrs},
                  }
                  if relationships:
                      item['relationships'] = relationships
                  clean.append(item)
              return clean

          out = {
              'request_id': command.get('request_id'),
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'query_exit_code': exit_code,
              'query_status': 'success' if exit_code == 0 and result_path.exists() else 'failed',
              'results': [],
          }
          if result_path.exists():
              src = json.loads(result_path.read_text(encoding='utf-8'))
              out['completed_at'] = src.get('completed_at') or out['completed_at']
              for result in src.get('results', []):
                  response = result.get('response') or {}
                  entry = {
                      'label': result.get('label'),
                      'http_status': result.get('http_status'),
                      'data': clean_resources(response.get('data')),
                  }
                  included = clean_resources(response.get('included'))
                  if included:
                      entry['included'] = included
                  out['results'].append(entry)
          else:
              out['error'] = stderr or stdout or 'ASC gateway produced no result file.'

          path = Path('automation/asc-results/app2-005-hm1-asc-readback-final.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/asc-results/app2-005-hm1-asc-readback-final.json
          git diff --cached --quiet || git commit -m "Persist APP2-005 HealthManager1 ASC read-back"
          cp automation/asc-results/app2-005-hm1-asc-readback-final.json /tmp/app2-005-summary.json
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p automation/asc-results
            cp /tmp/app2-005-summary.json automation/asc-results/app2-005-hm1-asc-readback-final.json
            git add automation/asc-results/app2-005-hm1-asc-readback-final.json
            git diff --cached --quiet || git commit -m "Persist APP2-005 HealthManager1 ASC read-back"
            sleep 2
          done
          exit 1
