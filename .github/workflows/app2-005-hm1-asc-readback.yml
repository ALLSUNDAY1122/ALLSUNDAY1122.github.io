name: APP2-005 HealthManager1 ASC read-back

on:
  push:
    branches: [main]
    paths:
      - automation/app2-005-hm1-asc-command.json

permissions:
  contents: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Query App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 scripts/app_store_connect_gateway.py --command automation/app2-005-hm1-asc-command.json --output /tmp/app2-005-asc-result.json
      - name: Persist scoped summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('/tmp/app2-005-asc-result.json').read_text(encoding='utf-8'))
          out={'request_id':src.get('request_id'),'completed_at':src.get('completed_at'),'results':[]}
          for result in src.get('results',[]):
              response=result.get('response') or {}
              data=response.get('data') or []
              if isinstance(data,dict): data=[data]
              clean=[]
              for resource in data:
                  attrs=resource.get('attributes') or {}
                  clean.append({'id':resource.get('id'),'type':resource.get('type'),'attributes':{k:attrs.get(k) for k in ('name','bundleId','sku','primaryLocale','version','platform','uploadedDate','processingState','expired','expirationDate','minOsVersion','betaReviewState') if k in attrs}})
              out['results'].append({'label':result.get('label'),'http_status':result.get('http_status'),'data':clean})
          path=Path('automation/asc-results/app2-005-hm1-asc-readback-final.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/asc-results/app2-005-hm1-asc-readback-final.json
          git commit -m "Persist APP2-005 HealthManager1 ASC read-back"
          cp automation/asc-results/app2-005-hm1-asc-readback-final.json /tmp/app2-005-summary.json
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p automation/asc-results
            cp /tmp/app2-005-summary.json automation/asc-results/app2-005-hm1-asc-readback-final.json
            git add automation/asc-results/app2-005-hm1-asc-readback-final.json
            git diff --cached --quiet || git commit -m "Persist APP2-005 HealthManager1 ASC read-back"
            sleep 2
          done
          exit 1
