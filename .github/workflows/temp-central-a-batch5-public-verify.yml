name: Temporary Central A Batch 5 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-batch5-public-verify-trigger-20260725.json

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-batch5-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Hamamatsu published page and generated JSON
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const pageUrl = `${base}/municipality/22130/`;
          const jsonUrl = `${base}/data/generated/municipalities.json`;
          const expectedPage = [
            '浜松市',
            '産後1年未満の母子へ、宿泊・1日通所・短時間通所・訪問型の産後ケアを提供する。',
            'https://www.hamamatsu-pippi.net/contents/7915.html'
          ];
          const expectedJson = [
            '"code":"22130"',
            '産後1年未満の母子へ、宿泊・1日通所・短時間通所・訪問型の産後ケアを提供する。',
            '宿泊型とデイサービス1日型を合わせて7日まで',
            '短時間型は1時間以内850円、1時間超1,700円',
            '訪問型は1回2,500円',
            'https://www.hamamatsu-pippi.net/contents/7915.html'
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = null;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const pageResponse = await fetch(pageUrl, { redirect: 'follow', signal: AbortSignal.timeout(20000), headers: { 'user-agent': 'CentralABatch5PublicVerification/1.0' } });
            const pageText = await pageResponse.text();
            const jsonResponse = await fetch(jsonUrl, { redirect: 'follow', signal: AbortSignal.timeout(30000), headers: { 'user-agent': 'CentralABatch5PublicVerification/1.0' } });
            const jsonText = await jsonResponse.text();
            const pageMissing = expectedPage.filter((value) => !pageText.includes(value));
            const jsonChecks = expectedJson.map((value) => value === '"code":"22130"' ? (jsonText.includes('"code":"22130"') || jsonText.includes('"code": "22130"')) : jsonText.includes(value));
            const ok = pageResponse.ok && jsonResponse.ok && pageMissing.length === 0 && jsonChecks.every(Boolean);
            last = { attempt, pageStatus: pageResponse.status, jsonStatus: jsonResponse.status, pageMissing, jsonChecks, ok };
            if (ok) {
              console.log(JSON.stringify({ passed: true, checkedAt: new Date().toISOString(), result: last }, null, 2));
              process.exit(0);
            }
            await sleep(10000);
          }
          console.log(JSON.stringify({ passed: false, checkedAt: new Date().toISOString(), result: last }, null, 2));
          process.exit(1);
          NODE
