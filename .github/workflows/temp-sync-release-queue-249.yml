name: Temporary Sync Release Queue 249

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-249.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={
            'north':[('01437','北竜町'),('01438','沼田町')],
            'central':[('22130','浜松市')],
          }
          for entry in data['entries']:
              r=entry['region']
              existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(r,[]):
                  if code not in existing:
                      entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if r=='north':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='南幌町から妹背牛町までの追加10自治体をPR #436でmainへ統合し、PR #439で公開234自治体へ更新。その後、秩父別町・雨竜町・北竜町・沼田町を地方統合'
              elif r=='east':
                  entry['pendingSinceLastRelease']=4
              elif r=='central':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='揖斐川町から白川町までの追加10自治体をPR #437でmainへ統合し、PR #439で公開234自治体へ更新。その後、東白川村・御嵩町・静岡市・浜松市を地方統合'
              elif r=='west':
                  entry['pendingSinceLastRelease']=4
          data['updatedAt']='2026-07-22T04:16:00+09:00'
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[]
          s['auditBlockedRegions']=[]
          s['lastNationalIntegrationAt']='2026-07-22T03:50:48+09:00'
          s['lastNationalIntegrationPr']=437
          s['latestGeneratedMunicipalityCount']=234
          s['latestGeneratedPullRequest']=439
          s['latestPublicCountPullRequest']=439
          if s['regionalMergedMunicipalities'] != 249:
              raise SystemExit(f"expected 249, got {s['regionalMergedMunicipalities']}")
          data['nextAction']='北日本・東日本・中日本・西日本が各4自治体。各地域をコード昇順で継続し、10自治体到達時に全国統合する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-249.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-249.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合249自治体・公開234自治体へ同期'
          git push origin main
