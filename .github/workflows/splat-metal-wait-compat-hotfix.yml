name: Splat Metal Completion Compatibility Hotfix

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/splat-metal-wait-compat-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Apply exact Metal completion patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('splat-native-ios/SplatNative/SplatVideoExporter.swift')
          text=p.read_text(encoding='utf-8')
          old='''                commandBuffer.commit()\n                commandBuffer.waitUntilCompleted()\n'''
          new='''                await withCheckedContinuation { (continuation: CheckedContinuation<Void, Never>) in\n                    commandBuffer.addCompletedHandler { _ in\n                        continuation.resume()\n                    }\n                    commandBuffer.commit()\n                }\n'''
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Metal wait block, found {count}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git diff -- splat-native-ios/SplatNative/SplatVideoExporter.swift
      - name: Commit scoped source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatVideoExporter.swift
          git diff --cached --quiet && { echo 'No source change produced'; exit 1; }
          git commit -m 'fix(splat): await Metal completion across Xcode versions'
          git push origin HEAD:feature/splat-native-ios-poc
