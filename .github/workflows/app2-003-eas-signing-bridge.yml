name: APP2-003 EAS Signing Bridge

on:
  push:
    branches: [main]
    paths:
      - automation/app2-003-eas-signing-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Probe or install exact Yoru signing key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: python3 scripts/app2_003_eas_signing_bridge.py

      - name: Persist sanitized bridge result
        if: always()
        run: |
          test -f /tmp/app2-003-eas-signing-result-path.txt || exit 0
          P="$(cat /tmp/app2-003-eas-signing-result-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P"
          git commit -m "Persist APP2-003 EAS signing bridge result" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$P")"
          cp /tmp/app2-003-eas-signing-result-copy.json "$P"
          git add "$P"
          git commit -m "Persist APP2-003 EAS signing bridge result" || exit 0
          git push origin HEAD:main
