name: Temporary West Four Blocker Fix

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-four-blocker-fix-trigger-20260725.json

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/west-four-source-blockers-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch municipality and task records
        shell: bash
        run: |
          cat > /tmp/fix_west_four_blockers.py <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = Path('jichitai-compare')
          CHECKED = '2026-07-25'
          NOW = '2026-07-25T13:06:00+09:00'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def municipality(code):
              return BASE / 'data/municipalities' / code[:2] / f'{code}.json'

          def task(code):
              return BASE / 'operations/tasks' / f'{code}.json'

          def sync_task(code, m, note):
              p = task(code)
              t = load(p)
              services = m['services']
              t['verifiedCount'] = sum(1 for s in services.values() if s.get('status') == 'verified')
              t['unavailableCount'] = sum(1 for s in services.values() if s.get('status') == 'unavailable')
              t['researchingCount'] = 0
              t['needsMediumReviewCount'] = 0
              t['status'] = 'merged'
              t['nextServiceIndex'] = 9
              t['completedServices'] = list(services.keys())
              t['officialSources'] = [s['source']['url'] for s in services.values() if isinstance(s, dict) and isinstance(s.get('source'), dict) and s['source'].get('url')]
              t['lastCheckedAt'] = CHECKED
              t['lastUpdatedAt'] = NOW
              t['lastUpdatedBy'] = '統括B②・西日本品質改善第2監査'
              t['currentBranch'] = 'fix/west-four-source-blockers-20260725'
              notes = t.setdefault('notes', [])
              if note not in notes:
                  notes.append(note)
              t['blockers'] = []
              save(p, t)

          changes = []

          # 益城町: region/west already contains the safe unavailable correction. Preserve and add tracking evidence.
          code = '43443'
          p = municipality(code)
          m = load(p)
          s = m['services']['bulkyWaste']
          before = {'status': s.get('status'), 'summary': s.get('summary'), 'source': s.get('source')}
          s['status'] = 'unavailable'
          s['summary'] = '粗大ごみ区分と自己搬入案内は確認できるが、現行の戸別収集料金・寸法上限を確定できない'
          s.setdefault('details', {})['trackingIssue'] = 3350
          s['source'] = {'url':'https://www.town.mashiki.lg.jp/dynamic/word_l/pub/default.aspx?c_id=20','checkedAt':CHECKED}
          s['additionalSources'] = [{'url':'https://www.town.mashiki.lg.jp/list00679.html','checkedAt':CHECKED}]
          m['updatedAt'] = CHECKED
          save(p, m)
          sync_task(code, m, '2026-07-25: 旧粗大ごみページ404のため、現行料金・寸法を推測せずunavailableとしてIssue #3350で継続確認。')
          changes.append({'code':code,'name':m['name'],'service':'bulkyWaste','before':before,'after':{'status':s['status'],'summary':s['summary'],'source':s['source']},'trackingIssue':3350})

          # 和泊町: current joint sanitation authority fee is 75 yen per 10kg, including bulky waste.
          code = '46533'
          p = municipality(code)
          m = load(p)
          s = m['services']['bulkyWaste']
          before = {'status':s.get('status'),'summary':s.get('summary'),'details':s.get('details'),'source':s.get('source')}
          s['status'] = 'verified'
          s['summary'] = '粗大ごみを含む個人ごみは沖永良部クリーンセンターへ直接搬入し、10kg当たり75円'
          s['details'] = {
              'target':'燃えるごみ、燃えないごみ、ペットボトル、発泡スチロール、ビン、粗大ごみ等の個人の一般廃棄物',
              'method':'沖永良部クリーンセンターへ直接搬入',
              'fee':'10kg当たり75円。10kg未満は10kgとして計算',
              'excluded':'施設が持込不可としているごみ、家電リサイクル対象品等は別の処理方法を確認',
              'authority':'和泊町・知名町で構成する沖永良部衛生管理組合の現行料金表を確認'
          }
          s['source'] = {'url':'https://www.okieikumiai.com/cleancenter','checkedAt':CHECKED}
          s.pop('additionalSources', None)
          m['updatedAt'] = CHECKED
          save(p, m)
          sync_task(code, m, '2026-07-25: 沖永良部衛生管理組合の現行料金表に基づき、粗大ごみを含む個人ごみを100円/10kgから75円/10kgへ訂正。')
          changes.append({'code':code,'name':m['name'],'service':'bulkyWaste','before':before,'after':{'status':s['status'],'summary':s['summary'],'details':s['details'],'source':s['source']}})

          # 日吉津村: preserve already-corrected live official hazard-map sources and synchronize task evidence.
          code = '31384'
          p = municipality(code)
          m = load(p)
          s = m['services']['disasterPrevention']
          before = {'status':s.get('status'),'summary':s.get('summary'),'source':s.get('source'),'additionalSources':s.get('additionalSources')}
          s['source'] = {'url':'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%A5%E6%B3%A2%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/','checkedAt':CHECKED}
          s['additionalSources'] = [
              {'url':'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%AA%E6%B0%B4%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/','checkedAt':CHECKED},
              {'url':'https://www.hiezu.jp/%E5%9C%B0%E5%9F%9F%E9%98%B2%E7%81%BD%E8%A8%88%E7%94%BB%E3%82%92%E8%A6%8B%E7%9B%B4%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F/','checkedAt':CHECKED}
          ]
          m['updatedAt'] = CHECKED
          save(p, m)
          sync_task(code, m, '2026-07-25: 404旧URLを現行の津波・洪水ハザードマップと地域防災計画へ更新。')
          changes.append({'code':code,'name':m['name'],'service':'disasterPrevention','before':before,'after':{'status':s['status'],'summary':s['summary'],'source':s['source'],'additionalSources':s['additionalSources']}})

          # 新富町: use the current 2026 official fund page and live application form, not the removed legacy detail page.
          code = '45402'
          p = municipality(code)
          m = load(p)
          s = m['services']['childMedical']
          before = {'status':s.get('status'),'summary':s.get('summary'),'eligibility':s.get('eligibility'),'details':s.get('details'),'source':s.get('source')}
          s['status'] = 'verified'
          s['summary'] = '町内の高校生まで（18歳未満）の医療費を全額助成'
          s['eligibility'] = {'minAgeMonths':0,'maxAgeYears':18}
          s['details'] = {
              'target':'新富町の高校生までの子ども（現行基金ページでは18歳未満と記載）',
              'support':'こども医療費を全額助成し、医療費の無償化を実施',
              'fundPeriod':'基金事業は令和6年3月から令和15年3月まで',
              'application':'子ども医療費受給資格登録申請・受給資格証交付申請が必要'
          }
          s['source'] = {'url':'https://www.town.shintomi.lg.jp/soshiki/zeisei/gyomu/1_1/586.html','checkedAt':CHECKED}
          s['additionalSources'] = [
              {'url':'https://www.town.shintomi.lg.jp/secure/1447/%E5%AD%90%E3%81%A9%E3%82%82%E5%8C%BB%E7%99%82%E8%B2%BB%E5%8F%97%E7%B5%A6%E8%B3%87%E6%A0%BC%E8%A8%BC%E4%BA%A4%E4%BB%98%E7%94%B3%E8%AB%8B%E6%9B%B8.pdf','checkedAt':CHECKED}
          ]
          m['updatedAt'] = CHECKED
          save(p, m)
          sync_task(code, m, '2026-07-25: 旧子ども医療費ページ404のため、現行基金ページと現行申請書へ出典更新し、live公式情報で確認できる範囲へ説明を整理。')
          changes.append({'code':code,'name':m['name'],'service':'childMedical','before':before,'after':{'status':s['status'],'summary':s['summary'],'eligibility':s['eligibility'],'details':s['details'],'source':s['source'],'additionalSources':s['additionalSources']}})

          evidence = {
              'schemaVersion':'1.0.0',
              'auditId':'west-four-source-blockers-regional-fix-20260725',
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'branch':'fix/west-four-source-blockers-20260725',
              'baseBranch':'region/west',
              'trackingIssues':[3189,3191,3193,3350],
              'sourceAudits':[3320,3338],
              'changes':changes,
              'expectedAfterFix':{
                  'brokenPrimarySourceCount':0,
                  'regionMainSynchronization':'pending',
                  'publicVerification':'pending',
                  'releaseBlocker':'active_until_main_and_public_verification'
              }
          }
          ep = BASE / 'operations/audits/west-four-source-blockers-regional-fix-20260725.json'
          ep.parent.mkdir(parents=True, exist_ok=True)
          save(ep, evidence)
          print(json.dumps({'changedRecords':len(changes),'codes':[c['code'] for c in changes]}, ensure_ascii=False, indent=2))
          PY
          python3 /tmp/fix_west_four_blockers.py

      - name: Validate JSON and source-task consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          codes=['43443','46533','31384','45402']
          for code in codes:
              m=json.loads((Path('jichitai-compare/data/municipalities')/code[:2]/f'{code}.json').read_text(encoding='utf-8'))
              t=json.loads((Path('jichitai-compare/operations/tasks')/f'{code}.json').read_text(encoding='utf-8'))
              assert len(m['services']) == 9
              assert t['status'] == 'merged'
              assert t['verifiedCount'] == sum(1 for s in m['services'].values() if s['status']=='verified')
              assert t['unavailableCount'] == sum(1 for s in m['services'].values() if s['status']=='unavailable')
              assert t['officialSources'] == [s['source']['url'] for s in m['services'].values() if s.get('source',{}).get('url')]
          assert json.loads((Path('jichitai-compare/data/municipalities/46/46533.json')).read_text(encoding='utf-8'))['services']['bulkyWaste']['details']['fee'].startswith('10kg当たり75円')
          assert json.loads((Path('jichitai-compare/data/municipalities/43/43443.json')).read_text(encoding='utf-8'))['services']['bulkyWaste']['status'] == 'unavailable'
          PY

      - name: Commit regional fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/data/municipalities/43/43443.json \
            jichitai-compare/data/municipalities/46/46533.json \
            jichitai-compare/data/municipalities/31/31384.json \
            jichitai-compare/data/municipalities/45/45402.json \
            jichitai-compare/operations/tasks/43443.json \
            jichitai-compare/operations/tasks/46533.json \
            jichitai-compare/operations/tasks/31384.json \
            jichitai-compare/operations/tasks/45402.json \
            jichitai-compare/operations/audits/west-four-source-blockers-regional-fix-20260725.json \
            jichitai-compare/operations/control/west-four-blocker-fix-trigger-20260725.json
          git commit -m 'fix: 西日本4自治体の出典blockerをregion/westで解消'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
