name: Prepare HealthManager1 final release workflow

on:
  push:
    branches: [main]
    paths:
      - automation/hm1-final-release-prep-command.json

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch root Codemagic HM1 workflow
        run: python3 scripts/patch_hm1_final_release.py
      - name: Enable HM1 preparation diagnostics
        run: python3 scripts/patch_hm1_prepare_logging.py
      - name: Validate HM1 release workflow contract
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          c=yaml.safe_load(Path('codemagic.yaml').read_text(encoding='utf-8'))
          w=c['workflows']['health-manager-1-testflight']
          names=[x['name'] for x in w['scripts']]
          required=[
            'Prepare audited 264-question bundle and icon',
            'Set CI build number and generate Xcode project',
            'Verify HM1 release inputs',
            'Verify packaged HM1 IPA content',
          ]
          for x in required: assert x in names, (x,names)
          prepare=next(x for x in w['scripts'] if x['name']=='Prepare audited 264-question bundle and icon')
          assert '/tmp/hm1-prepare.log' in prepare['script']
          assert '/tmp/hm1-prepare.log' in w['artifacts']
          assert w['environment']['ios_signing']['bundle_identifier']=='jp.allsunday1122.healthmanager1'
          assert w['publishing']['app_store_connect']['submit_to_testflight'] is True
          assert w['publishing']['app_store_connect']['submit_to_app_store'] is False
          print('PASS: root Codemagic HM1 final release contract with diagnostics')
          PY
      - name: Persist root Codemagic release gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml
          if git diff --cached --quiet; then
            echo "No HM1 Codemagic changes"
            exit 0
          fi
          git commit -m "Wire HM1 264-question final release build"
          cp codemagic.yaml /tmp/codemagic.yaml
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/codemagic.yaml codemagic.yaml
            git add codemagic.yaml
            git diff --cached --quiet || git commit -m "Wire HM1 264-question final release build"
            sleep 2
          done
          exit 1
