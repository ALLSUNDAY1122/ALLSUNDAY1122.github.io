name: Temporary North B Anyone Single Gap Batch 5 Current

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-current.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-current-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main based branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import confirmed source records
        shell: bash
        run: |
          git checkout 3faf9961948cb1f20aadae75cd2f6ea56ee17d15 -- \
            jichitai-compare/data/municipalities/06/06204.json \
            jichitai-compare/data/municipalities/06/06207.json \
            jichitai-compare/data/municipalities/06/06208.json \
            jichitai-compare/data/municipalities/06/06209.json \
            jichitai-compare/data/municipalities/06/06210.json \
            jichitai-compare/data/municipalities/06/06211.json \
            jichitai-compare/data/municipalities/06/06301.json \
            jichitai-compare/operations/tasks/06204.json \
            jichitai-compare/operations/tasks/06207.json \
            jichitai-compare/operations/tasks/06208.json \
            jichitai-compare/operations/tasks/06209.json \
            jichitai-compare/operations/tasks/06210.json \
            jichitai-compare/operations/tasks/06211.json \
            jichitai-compare/operations/tasks/06301.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          node <<'NODE'
          const fs = require('fs');
          const file = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.updatedAt = '2026-07-25T16:52:00+09:00';
          data.workingBranch = 'audit/north-b-anyone-single-gap-batch5-current-20260725';
          data.pullRequestNumber = null;
          data.ciStatus = 'pending';
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Regenerate and validate
        shell: bash
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit synchronized result
        shell: bash
        run: |
          rm -f .github/workflows/temp-north-b-anyone-single-gap-batch5-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch5-current.yml \
            jichitai-compare/data/municipalities/06/06204.json \
            jichitai-compare/data/municipalities/06/06207.json \
            jichitai-compare/data/municipalities/06/06208.json \
            jichitai-compare/data/municipalities/06/06209.json \
            jichitai-compare/data/municipalities/06/06210.json \
            jichitai-compare/data/municipalities/06/06211.json \
            jichitai-compare/data/municipalities/06/06301.json \
            jichitai-compare/operations/tasks/06204.json \
            jichitai-compare/operations/tasks/06207.json \
            jichitai-compare/operations/tasks/06208.json \
            jichitai-compare/operations/tasks/06209.json \
            jichitai-compare/operations/tasks/06210.json \
            jichitai-compare/operations/tasks/06211.json \
            jichitai-compare/operations/tasks/06301.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/municipality/06204/index.html \
            jichitai-compare/municipality/06207/index.html \
            jichitai-compare/municipality/06208/index.html \
            jichitai-compare/municipality/06209/index.html \
            jichitai-compare/municipality/06210/index.html \
            jichitai-compare/municipality/06211/index.html \
            jichitai-compare/municipality/06301/index.html \
            jichitai-compare/sitemap.xml
          git commit -m 'audit: 北日本B誰でも通園単一条件第5群を現行mainへ同期 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
