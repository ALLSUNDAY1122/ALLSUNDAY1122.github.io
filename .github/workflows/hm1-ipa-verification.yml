name: Verify HealthManager1 signed IPA

on:
  push:
    branches: [main]
    paths:
      - automation/hm1-ipa-verification-command.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Codemagic signed IPA
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import io,json,os,plistlib,urllib.request,zipfile
          from pathlib import Path
          command=json.loads(Path('automation/hm1-ipa-verification-command.json').read_text(encoding='utf-8'))
          build_id=command['build_id']
          token=os.environ['CM_API_TOKEN']
          req=urllib.request.Request(f'https://codemagic.io/api/v3/builds/{build_id}',headers={'x-auth-token':token})
          with urllib.request.urlopen(req,timeout=30) as r: raw=json.load(r)
          build=raw.get('data') or raw
          ipa=next(a for a in build.get('artifacts',[]) if a.get('type')=='ipa')
          with urllib.request.urlopen(ipa['short_lived_download_url'],timeout=60) as r: payload=r.read()
          z=zipfile.ZipFile(io.BytesIO(payload)); names=z.namelist()
          app_prefix=next(n for n in names if n.startswith('Payload/') and n.endswith('.app/'))
          index_path=app_prefix+'index.html'; info_path=app_prefix+'Info.plist'; assets_path=app_prefix+'Assets.car'
          index=z.read(index_path) if index_path in names else b''
          info=plistlib.loads(z.read(info_path))
          checks={
            'index_present':index_path in names,
            'index_bytes':len(index),
            'index_size_ok':len(index)>=100000,
            'app_marker_present':'第一種衛生管理者' in index.decode('utf-8',errors='ignore'),
            'assets_car_present':assets_path in names,
            'code_signature_present':any(n.startswith(app_prefix+'_CodeSignature/') for n in names),
            'embedded_provision_present':app_prefix+'embedded.mobileprovision' in names,
            'bundle_id':info.get('CFBundleIdentifier'),
            'version':info.get('CFBundleShortVersionString'),
            'build_number':info.get('CFBundleVersion'),
            'bundle_id_ok':info.get('CFBundleIdentifier')=='jp.allsunday1122.healthmanager1',
            'build_number_ok':info.get('CFBundleVersion')=='2026081901',
          }
          required=['index_present','index_size_ok','app_marker_present','assets_car_present','code_signature_present','embedded_provision_present','bundle_id_ok','build_number_ok']
          passed=all(checks[k] for k in required)
          summary={'request_id':command.get('request_id'),'build_id':build_id,'codemagic_status':build.get('status'),'app_store_connect_status':build.get('app_store_connect_status'),'ipa_size_in_bytes':len(payload),'checks':checks,'passed':passed}
          Path('automation/hm1-ipa-verification-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not passed: raise SystemExit('HealthManager1 signed IPA verification failed')
          PY
      - name: Read back App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          cat > /tmp/hm1-asc-command.json <<'JSON'
          {
            "request_id": "app2-005-hm1-asc-gate",
            "requests": [
              {"label":"app","path":"/v1/apps/6799581662"},
              {"label":"builds","path":"/v1/apps/6799581662/builds?sort=-uploadedDate&limit=10"},
              {"label":"prerelease-versions","path":"/v1/apps/6799581662/preReleaseVersions?limit=20"},
              {"label":"beta-groups","path":"/v1/apps/6799581662/betaGroups?limit=50"},
              {"label":"iap","path":"/v1/apps/6799581662/inAppPurchasesV2?limit=50"},
              {"label":"subscription-groups","path":"/v1/apps/6799581662/subscriptionGroups?limit=50"}
            ]
          }
          JSON
          python3 scripts/app_store_connect_gateway.py --command /tmp/hm1-asc-command.json --output /tmp/hm1-asc-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('automation/hm1-ipa-verification-summary.json').read_text(encoding='utf-8'))
          src=json.loads(Path('/tmp/hm1-asc-result.json').read_text(encoding='utf-8'))
          allowed=('name','bundleId','sku','primaryLocale','version','versionString','platform','uploadedDate','processingState','expired','expirationDate','minOsVersion','betaReviewState','productId','referenceName','state')
          results=[]
          for result in src.get('results',[]):
              data=(result.get('response') or {}).get('data') or []
              if isinstance(data,dict): data=[data]
              clean=[]
              for resource in data:
                  attrs=resource.get('attributes') or {}
                  clean.append({'id':resource.get('id'),'type':resource.get('type'),'attributes':{k:attrs.get(k) for k in allowed if k in attrs}})
              results.append({'label':result.get('label'),'http_status':result.get('http_status'),'data':clean})
          summary['asc_readback']={'completed_at':src.get('completed_at'),'results':results}
          Path('automation/hm1-ipa-verification-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist verification summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/hm1-ipa-verification-summary.json
          git commit -m "Record APP2-005 HealthManager1 IPA and ASC verification"
          cp automation/hm1-ipa-verification-summary.json /tmp/hm1-summary.json
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hm1-summary.json automation/hm1-ipa-verification-summary.json
            git add automation/hm1-ipa-verification-summary.json
            git diff --cached --quiet || git commit -m "Record APP2-005 HealthManager1 IPA and ASC verification"
            sleep 2
          done
          exit 1
