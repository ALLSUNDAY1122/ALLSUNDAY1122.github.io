name: West B Completion Finalizer v3

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'ops/west-b-finalize-v3-20260724' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Audit 250 municipalities and finalize state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.join(process.cwd(), 'jichitai-compare');
          const municipalityRoot = path.join(root, 'data', 'municipalities');
          const taskRoot = path.join(root, 'operations', 'tasks');
          const checkpointPath = path.join(root, 'operations', 'control', 'session-checkpoints', 'west-b.json');
          const auditDir = path.join(root, 'operations', 'control', 'audits');
          const finalAuditPath = path.join(auditDir, 'west-b-completion-20260724.json');
          const attemptPath = path.join(auditDir, 'west-b-completion-attempt-v3-20260724.json');
          const workflowPath = path.join(process.cwd(), '.github', 'workflows', 'west-b-finalize-v3-once.yml');

          const auditedAt = '2026-07-24T16:03:00+09:00';
          const prefectureCodes = ['31','32','34','35','36','38','41','42','44','45','47'];
          const expectedByPrefecture = {'31':19,'32':19,'34':23,'35':19,'36':24,'38':20,'41':20,'42':21,'44':18,'45':26,'47':41};
          const serviceIds = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const completedStatuses = new Set(['verified','unavailable']);
          const canonicalChecks = new Map([
            ['32206','安来市'],['36368','那賀町'],['36383','牟岐町'],['36387','美波町'],['36388','海陽町'],['36401','松茂町'],['47382','与那国町']
          ]);

          const errors = [];
          const records = [];
          const normalizedTasks = [];
          const actualByPrefecture = {};
          const unavailableByMunicipality = [];

          for (const prefectureCode of prefectureCodes) {
            const directory = path.join(municipalityRoot, prefectureCode);
            if (!fs.existsSync(directory)) {
              actualByPrefecture[prefectureCode] = 0;
              errors.push(`missing directory ${prefectureCode}`);
              continue;
            }
            const files = fs.readdirSync(directory).filter(name => /^\d{5}\.json$/.test(name)).sort();
            actualByPrefecture[prefectureCode] = files.length;
            if (files.length !== expectedByPrefecture[prefectureCode]) {
              errors.push(`prefecture ${prefectureCode}: expected ${expectedByPrefecture[prefectureCode]}, actual ${files.length}`);
            }

            for (const filename of files) {
              const code = filename.slice(0, -5);
              const municipality = JSON.parse(fs.readFileSync(path.join(directory, filename), 'utf8'));
              if (String(municipality.code) !== code) errors.push(`${code}: municipality.code mismatch`);
              if (String(municipality.prefectureCode) !== prefectureCode) errors.push(`${code}: prefectureCode mismatch`);
              if (!municipality.name) errors.push(`${code}: municipality name missing`);
              if (canonicalChecks.has(code) && municipality.name !== canonicalChecks.get(code)) {
                errors.push(`${code}: expected name ${canonicalChecks.get(code)}, actual ${municipality.name}`);
              }

              const services = municipality.services || {};
              const unavailableServices = [];
              if (Object.keys(services).length !== 9 || serviceIds.some(id => !services[id])) {
                errors.push(`${code}: mandatory 9 services mismatch`);
              }
              for (const serviceId of serviceIds) {
                const service = services[serviceId];
                if (!service) continue;
                if (!completedStatuses.has(service.status)) errors.push(`${code}/${serviceId}: unfinished ${service.status}`);
                if (service.status === 'unavailable') unavailableServices.push(serviceId);
                if (!service.source || typeof service.source.url !== 'string' || !service.source.url.startsWith('https://')) {
                  errors.push(`${code}/${serviceId}: invalid source URL`);
                }
                if (!service.source?.checkedAt) errors.push(`${code}/${serviceId}: checkedAt missing`);
              }
              if (unavailableServices.length) {
                unavailableByMunicipality.push({code, name: municipality.name, services: unavailableServices});
              }

              const taskPath = path.join(taskRoot, `${code}.json`);
              if (!fs.existsSync(taskPath)) {
                errors.push(`${code}: task missing`);
                continue;
              }
              const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
              const verifiedCount = serviceIds.filter(id => services[id]?.status === 'verified').length;
              const unavailableCount = serviceIds.filter(id => services[id]?.status === 'unavailable').length;

              if (String(task.municipalityCode) !== code) errors.push(`${code}: task code mismatch`);
              if (task.municipalityName !== municipality.name) errors.push(`${code}: task name mismatch`);
              if (!Array.isArray(task.completedServices) || task.completedServices.length !== 9 || serviceIds.some(id => !task.completedServices.includes(id))) {
                errors.push(`${code}: completedServices mismatch`);
              }
              if (Number(task.verifiedCount) !== verifiedCount || Number(task.unavailableCount) !== unavailableCount) {
                errors.push(`${code}: task verified/unavailable count mismatch`);
              }
              if (Number(task.researchingCount || 0) !== 0 || Number(task.needsMediumReviewCount || 0) !== 0) {
                errors.push(`${code}: unfinished task counts remain`);
              }
              if (!Number.isInteger(task.pullRequestNumber)) errors.push(`${code}: pullRequestNumber missing`);

              if (task.status !== 'merged' || task.currentService !== null || Number(task.nextServiceIndex) !== 9) {
                task.status = 'merged';
                task.currentService = null;
                task.nextServiceIndex = 9;
                task.lastCheckedAt = '2026-07-24';
                task.lastUpdatedAt = auditedAt;
                task.lastUpdatedBy = '西日本調査班B・最終完了監査';
                task.notes = Array.isArray(task.notes) ? task.notes : [];
                const note = '最終完了監査でregion/west統合済み・必須9制度完了を確認し、taskをmergedへ同期。';
                if (!task.notes.includes(note)) task.notes.push(note);
                fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');
                normalizedTasks.push(code);
              }

              records.push({
                code,
                name: municipality.name,
                prefectureCode,
                pullRequestNumber: task.pullRequestNumber,
                verifiedCount,
                unavailableCount
              });
            }
          }

          records.sort((a,b) => a.code.localeCompare(b.code));
          const expectedMunicipalityCount = Object.values(expectedByPrefecture).reduce((sum, value) => sum + value, 0);
          const actualCompletedServiceCount = records.reduce((sum, item) => sum + item.verifiedCount + item.unavailableCount, 0);
          if (records.length !== expectedMunicipalityCount) errors.push(`total municipalities: expected ${expectedMunicipalityCount}, actual ${records.length}`);
          if (new Set(records.map(item => item.code)).size !== records.length) errors.push('duplicate municipality codes');
          if (actualCompletedServiceCount !== expectedMunicipalityCount * 9) {
            errors.push(`completed services: expected ${expectedMunicipalityCount * 9}, actual ${actualCompletedServiceCount}`);
          }
          if (records[0]?.code !== '31201') errors.push(`first municipality mismatch: ${records[0]?.code}`);
          if (records.at(-1)?.code !== '47382') errors.push(`final municipality mismatch: ${records.at(-1)?.code}`);

          const result = errors.length === 0 ? 'completed' : 'failed';
          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'west-b-completion-20260724-v3',
            auditedAt,
            integrationBranch: 'region/west',
            prefectureCodes,
            expectedByPrefecture,
            actualByPrefecture,
            expectedMunicipalityCount,
            actualMunicipalityCount: records.length,
            mandatoryServiceCountPerMunicipality: 9,
            expectedCompletedServiceCount: expectedMunicipalityCount * 9,
            actualCompletedServiceCount,
            normalizedTaskCount: normalizedTasks.length,
            normalizedTasks,
            municipalitiesWithUnavailableServices: unavailableByMunicipality.length,
            unavailableByMunicipality,
            firstMunicipality: records[0] || null,
            finalMunicipality: records.at(-1) || null,
            errors,
            result
          };

          fs.mkdirSync(auditDir, {recursive: true});
          fs.writeFileSync(attemptPath, JSON.stringify(audit, null, 2) + '\n');

          if (result === 'completed') {
            const previous = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
            const oldEntries = Array.isArray(previous.completedSinceSplit) ? previous.completedSinceSplit : [];
            const oldMap = new Map(oldEntries.map(item => [String(typeof item === 'string' ? item : item.code || ''), item]));
            const completedSinceSplit = records.map(record => {
              const old = oldMap.get(record.code);
              const oldName = typeof old === 'object' ? old.name : null;
              return {
                code: record.code,
                name: record.name,
                pullRequestNumber: record.pullRequestNumber,
                ciRunNumber: oldName === record.name && Number.isInteger(old.ciRunNumber) ? old.ciRunNumber : null
              };
            });
            const checkpoint = {
              ...previous,
              updatedAt: auditedAt,
              status: 'completed',
              remainingUninvestigatedCount: 0,
              currentMunicipality: null,
              workingBranch: null,
              pullRequestNumber: records.at(-1)?.pullRequestNumber || null,
              ciStatus: 'success',
              completedSinceSplit,
              blocked: [],
              nextAction: '2026-07-24最終完了監査済み。担当11県250自治体・必須2,250制度・対応taskの完了、残件0を確認。新規調査を停止し、統括がregion/westの完了状態をmainと共有地域状態へ同期する。'
            };
            fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint) + '\n');
            fs.writeFileSync(finalAuditPath, JSON.stringify(audit, null, 2) + '\n');
            fs.unlinkSync(attemptPath);
          }

          if (fs.existsSync(workflowPath)) fs.unlinkSync(workflowPath);
          console.log(JSON.stringify({result, errors, municipalityCount: records.length, completedServiceCount: actualCompletedServiceCount, normalizedTaskCount: normalizedTasks.length}, null, 2));
          NODE

      - name: Commit audit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ops: 西日本B最終完了監査を保存 [west-b-finalized-v3]"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Require completed audit
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='jichitai-compare/operations/control/audits/west-b-completion-20260724.json';if(!fs.existsSync(p))process.exit(1);const a=JSON.parse(fs.readFileSync(p));if(a.result!=='completed'||a.actualMunicipalityCount!==250||a.actualCompletedServiceCount!==2250||a.errors.length)process.exit(1);"
