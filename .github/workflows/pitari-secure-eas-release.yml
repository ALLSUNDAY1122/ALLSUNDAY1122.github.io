name: Pitari Payload Assembly Bridge

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-secure-command.json

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assemble encrypted Pitari payload
        run: |
          set -euo pipefail
          RID=$(python -c "import json;print(json.load(open('automation/pitari-secure-command.json'))['request_id'])")
          DIR="automation/pitari-tar-exchange/$RID"
          cat "$DIR/source.part00" "$DIR/source.part01" "$DIR/source.part02" "$DIR/source.part03" "$DIR/source.part04" > "$DIR/source.b64"
          test "$(sha256sum "$DIR/source.b64" | awk '{print $1}')" = 'c5b2c720db125b2b4f3cc971e93811e23ea75e4f3c52952631934a7ec4f43442'
          printf '%s\n' '{"ready":true,"source_sha256":"3d9a0f25a7e5bf88a5dfd624af6823180dfb2e667e6cc4a5def0d8a122802dfb","encrypted_source_sha256":"a4c19282029356580bbc1f450a4a1085da338f3d51b6eff901e78bd9f29332ae","temporary_icon":true}' > "$DIR/ready.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR/source.b64" "$DIR/ready.json"
          git commit -m "Assemble Pitari encrypted payload $RID"
          git pull --rebase origin main
          git push origin HEAD:main
