name: Temporary Generate Public 474 Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-474.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove workflow then build generated branch
        run: |
          set -euxo pipefail
          BRANCH='coord/generated-474-20260722-1734'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm .github/workflows/temp-generate-public-474.yml
          git add .github/workflows/temp-generate-public-474.yml
          git commit -m '統括管理: 公開474自治体生成の一時処理を削除'
          git push origin main
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout -B "$BRANCH" origin/main
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '464自治体' not in s:
              raise SystemExit('expected 464 display not found')
          p.write_text(s.replace('464自治体','474自治体'),encoding='utf-8')
          PY
          node ./scripts/validate-data.mjs --require-generated
          git add data/generated/municipalities.json operations/progress.json index.html
          python3 - <<'PY'
          import subprocess
          expected={'jichitai-compare/data/generated/municipalities.json','jichitai-compare/operations/progress.json','jichitai-compare/index.html'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual)}')
          PY
          git commit -m '公開更新: 生成データと表示件数を474自治体へ同期'
          git push --force-with-lease origin "$BRANCH"
