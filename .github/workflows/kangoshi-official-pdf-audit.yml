name: Kangoshi Official PDF Text Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/scripts/audit_official_pdf.py'
      - 'kangoshi-sprint/scripts/run_official_pdf_audit.py'
      - 'kangoshi-sprint/audit/official-source-manifest-20261124.json'
      - '.github/workflows/kangoshi-official-pdf-audit.yml'
      - 'kangoshi-sprint/scripts/extract_official_drafts.py'
      - 'kangoshi-sprint/scripts/secondary_pdf_audit.py'
      - 'kangoshi-sprint/scripts/triage_media_rights.py'
      - 'kangoshi-sprint/scripts/run_staged_text_audit.py'
permissions:
  contents: write
jobs:
  official-pdf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Fetch official Ministry PDFs and audit existing question banks
        run: python kangoshi-sprint/scripts/run_official_pdf_audit.py
      - name: Stage 112 and 111 question extraction evidence
        run: python kangoshi-sprint/scripts/extract_official_drafts.py
      - name: Recheck mismatches using independent PDF extraction modes
        run: python kangoshi-sprint/scripts/secondary_pdf_audit.py
      - name: Audit 480 provisional drafts against official PDFs
        run: python kangoshi-sprint/scripts/run_staged_text_audit.py
      - name: Classify media rights candidates conservatively
        run: python kangoshi-sprint/scripts/triage_media_rights.py
      - name: Persist 480 draft items in isolated GitHub staging branch
        run: |
          set -euo pipefail
          mkdir -p kangoshi-sprint/product-content/raw-candidates
          cp kangoshi-sprint/audit/runs/exam111-*-draft.json kangoshi-sprint/product-content/raw-candidates/
          cp kangoshi-sprint/audit/runs/exam112-*-draft.json kangoshi-sprint/product-content/raw-candidates/
          mkdir -p kangoshi-sprint/audit/staging-evidence
          cp kangoshi-sprint/audit/runs/*-summary.json kangoshi-sprint/audit/staging-evidence/
          cp kangoshi-sprint/audit/runs/*-secondary.json kangoshi-sprint/audit/staging-evidence/
          cp kangoshi-sprint/audit/runs/*-draft-text-audit.json kangoshi-sprint/audit/staging-evidence/
          cp kangoshi-sprint/audit/runs/media-rights-triage.json kangoshi-sprint/audit/staging-evidence/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kangoshi-sprint/product-content/raw-candidates/ kangoshi-sprint/audit/staging-evidence/
          git commit -m "kangoshi: persist 480 provisional PDF drafts and 92 hold triage evidence"
          git push origin HEAD:refs/heads/feature/kangoshi-pdf-audit-run-${{ github.run_id }}
      - name: Upload evidence even when there are source access failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kangoshi-official-pdf-audit
          path: kangoshi-sprint/audit/runs/
          if-no-files-found: warn
