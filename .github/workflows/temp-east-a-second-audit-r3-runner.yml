name: Temporary East A Second Audit Round 3 Runner

on:
  push:
    branches:
      - audit/east-a-second-quality-20260725-r3

permissions:
  contents: write

jobs:
  patch-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/east-a-second-quality-20260725-r3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply audited corrections
        run: python jichitai-compare/operations/scripts/patch-east-a-second-audit-r3.py
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit corrections and remove branch-local temporary files
        shell: bash
        run: |
          rm -f .github/workflows/east-a-second-audit-r3.yml
          rm -f jichitai-compare/operations/scripts/patch-east-a-second-audit-r3.py
          rm -f jichitai-compare/operations/triggers/east-a-second-audit-r3.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare .github/workflows/east-a-second-audit-r3.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: apply East A second audit round 3 corrections"
          git push origin HEAD:audit/east-a-second-quality-20260725-r3
