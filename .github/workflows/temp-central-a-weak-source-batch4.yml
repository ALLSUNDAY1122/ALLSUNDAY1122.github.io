name: Temporary Central A Weak Source Batch 4

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch4-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch4-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply batch 4 decisions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T14:02:00+09:00';
          const municipalityPath = path.join(root, 'data', 'municipalities', '25', '25442.json');
          const taskPath = path.join(root, 'operations', 'tasks', '25442.json');
          const auditPath = path.join(root, 'operations', 'audits', 'central-a-weak-primary-source-batch4-decisions-20260725.json');
          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const writeJson = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');

          const municipality = readJson(municipalityPath);
          const task = readJson(taskPath);
          const service = municipality.services.sickChildCare;
          const oldSource = service.source;
          service.summary = '甲良町在住の概ね10歳未満の児童が、湖東定住自立圏の彦根市病児保育室こあらを利用できる。';
          service.details = {
            condition: '彦根市・愛荘町・豊郷町・甲良町・多賀町在住で、病気または回復期にあり、保護者の就労等により家庭保育が困難な概ね10歳未満の児童',
            facility: '病児保育室こあら（彦根市戸賀町36番地6、医療法人藤野こどもクリニック内）',
            hours: '平日8時30分～18時。土日祝、お盆、年末年始は休室',
            capacity: '6人',
            fee: '4時間以内1,000円、4時間超2,000円。生活保護世帯は全額、前年度市町村民税非課税世帯は利用後に半額助成。個別実費・診察費等は別途',
            application: '原則前日までに施設へ連絡し、当日の実施機関医師による診察後、利用可能と判断された場合に入室'
          };
          service.source = {
            url: 'https://www.city.hikone.lg.jp/kosodate/kosodate_shien/2/3/7/11495.html',
            checkedAt
          };
          service.additionalSources = [
            {
              url: oldSource.url,
              checkedAt,
              description: '甲良町民の利用助成と対象範囲を定める町要綱'
            }
          ];
          municipality.updatedAt = checkedAt;
          writeJson(municipalityPath, municipality);

          task.lastCheckedAt = checkedAt;
          task.lastUpdatedAt = updatedAt;
          task.officialSources = Object.values(municipality.services)
            .filter((item) => ['verified', 'unavailable'].includes(item?.status) && item?.source?.url)
            .map((item) => item.source.url);
          task.notes ??= [];
          const note = '病児保育の主出典を、湖東定住自立圏の利用者向け彦根市公式ページへ変更。甲良町民が対象であること、施設、平日8時30分～18時、定員6人、1,000円・2,000円、減免、前日連絡・当日診察を確認。町要綱は補助出典化。';
          if (!task.notes.includes(note)) task.notes.push(note);
          writeJson(taskPath, task);

          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'central-a-weak-primary-source-batch4-decisions-20260725',
            decidedAt: updatedAt,
            session: '中日本調査班A',
            category: 'weakPrimarySource',
            regionalPullRequestNumber: Number(process.env.PR_NUMBER),
            runnerRunId: Number(process.env.RUN_ID),
            reviewedSlotCount: 5,
            sourceCorrectionCount: 1,
            retainedNoChangeCount: 4,
            corrected: [
              {
                code: '25442',
                name: '甲良町',
                service: 'sickChildCare',
                type: 'regional_user_facing_source_upgrade',
                result: '湖東定住自立圏の彦根市利用者向けページへ主出典を変更し、甲良町民の対象・施設・時間・定員・料金・減免・利用手順を確定'
              }
            ],
            retainedNoChange: [
              { code: '22221', name: '湖西市', service: 'sickChildCare', reason: '体調不良児対応型の制度要綱は確認できるが、2026年度の実施施設一覧・利用条件を利用者向けページで確認できない' },
              { code: '22344', name: '小山町', service: 'sickChildCare', reason: '病後児保育補助要綱は確認できるが、指定施設・一般利用料・予約方法の現行利用者向け案内を確認できない' },
              { code: '24212', name: '熊野市', service: 'sickChildCare', reason: 'ファミリーサポート要綱に病児・病後児預かりの規定はあるが、現行の会員向け料金・利用手順を利用者向けページで確認できない' },
              { code: '28218', name: '小野市', service: 'sickChildCare', reason: '2026年6月改正の補助要綱は確認できるが、指定実施施設・利用料・予約方法の現行利用者向け案内を確認できない' }
            ],
            remainingWeakPrimarySourceCandidates: 34,
            evidencePolicy: [
              '広域利用制度は利用先自治体の公式利用者向けページを主出典として認め、居住自治体の要綱を補助出典とする',
              '補助要綱・実施要綱だけで指定施設、利用料、予約方法が現行運用されていると断定しない'
            ],
            nextPriority: ['病児保育の条例・要綱単独候補', '産後ケアのPDF・計画単独候補', '住宅支援の分類候補']
          };
          writeJson(auditPath, audit);
          NODE

      - name: Validate municipality data
        working-directory: jichitai-compare
        run: |
          npm run check
          node --check app.js

      - name: Commit batch 4 decisions
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch4-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/data/municipalities/25/25442.json \
            jichitai-compare/operations/tasks/25442.json \
            jichitai-compare/operations/audits/central-a-weak-primary-source-batch4-decisions-20260725.json \
            jichitai-compare/operations/control/central-a-weak-source-batch4-trigger-20260725.json
          git commit -m 'audit: 中日本A弱い主出典第4群を判定'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
