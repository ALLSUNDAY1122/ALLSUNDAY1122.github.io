name: Temporary Central A Weak Source Batch 4

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch4-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch4-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weak primary source batch 4
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T22:19:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const readJson=p=>{const raw=fs.readFileSync(p,'utf8');return{raw,obj:JSON.parse(raw)}};
          const writeJson=(p,raw,obj)=>fs.writeFileSync(p,(raw.startsWith('{\n')?JSON.stringify(obj,null,2):JSON.stringify(obj))+'\n');
          const addSource=(svc,entry)=>{const list=Array.isArray(svc.additionalSources)?svc.additionalSources:[];const i=list.findIndex(x=>x.url===entry.url);if(i>=0)list[i]={...list[i],...entry};else list.push(entry);svc.additionalSources=list;};
          const decisions=[
            {code:'25207',pref:'25',name:'守山市',service:'schoolMeals',outcome:'content_and_primary_source_corrected',previousUrl:'https://www2.city.moriyama.lg.jp/reiki_int/reiki_honbun/i400RG00002497.html',newUrl:'https://www.city.moriyama.lg.jp/shichoushitsu/shiseihoushin/1014271/1014395.html',basis:'令和8年度は市立小学校の学校給食費を実質無償化し、市立中学校は月額4,900円を据え置く現行市政運営方針を確認'},
            {code:'25210',pref:'25',name:'野洲市',service:'schoolMeals',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.city.yasu.lg.jp/section/reiki_int/reiki_honbun/r042RG00001018.html',newUrl:'https://www.city.yasu.lg.jp/section/reiki_int/reiki_honbun/r042RG00001018.html',basis:'小学校月4,200円・中学校月4,900円の現行規則を維持し、令和8年度献立ページで継続実施を確認'},
            {code:'25425',pref:'25',name:'愛荘町',service:'schoolMeals',outcome:'content_and_primary_source_corrected',previousUrl:'https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001218.html',newUrl:'https://www.town.aisho.shiga.jp/material/files/group/2/2026032306.pdf',basis:'令和8年度以降は小学校給食費を無償化し、中学校は月額4,400円の保護者負担を維持する町予算方針を確認'},
            {code:'25425',pref:'25',name:'愛荘町',service:'postpartumCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001467.html',newUrl:'https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001467.html',basis:'産後1年以内、3類型、通算7日、自己負担を現行要綱で確認し、令和8年度健康カレンダーへの利用者向け導線を追加'},
            {code:'25442',pref:'25',name:'甲良町',service:'schoolMeals',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001075.html',newUrl:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001075.html',basis:'令和10年3月まで町立小中学校給食費を徴収しない現行要綱を維持し、令和8年度予算案内を追加'}
          ];
          const grouped=new Map();
          for(const d of decisions){if(!grouped.has(d.code))grouped.set(d.code,[]);grouped.get(d.code).push(d);}
          for(const [code,items] of grouped){
            const municipalityPath=path.join(root,'data/municipalities',items[0].pref,`${code}.json`);
            const {raw,obj:m}=readJson(municipalityPath);
            for(const d of items){
              const svc=m.services[d.service];
              if(!svc)throw new Error(`${d.code}:${d.service} missing`);
              if(d.code==='25207'){
                svc.summary='令和8年度は市立小学校の学校給食費を実質無償化し、市立中学校は月額4,900円を据え置く。';
                svc.eligibility={minAgeMonths:72,maxAgeYears:15};
                svc.details={fiscalYear:'令和8年度',elementary:'市立小学校は国の給食費負担軽減策に市独自支援を加え、保護者負担を実質0円とする',middle:'市立中学校は月額4,900円を据え置く',previousFee:'現行の基準額は小学校月額4,300円、中学校月額4,900円',assistance:'要保護・準要保護児童生徒は学校給食費を含む就学援助の対象',application:'通常給食の支援は学校運用に従い、就学援助は学校または教育委員会へ申請'};
                svc.source={url:d.newUrl,checkedAt};
                addSource(svc,{url:'https://www.city.moriyama.lg.jp/kosodatekyouiku/gakkoukyouiku/1002268/1002397.html',checkedAt,description:'現行の小中学校給食費と徴収方法を案内する利用者向けページ'});
                addSource(svc,{url:'https://www2.city.moriyama.lg.jp/reiki_int/reiki_honbun/i400RG00002497.html',checkedAt,description:'学校給食費の基準額と日割り調整等を定める現行規則'});
                addSource(svc,{url:'https://www.city.moriyama.lg.jp/kosodatekyouiku/gakkoukyouiku/1002268/1002399.html',checkedAt,description:'経済的に就学困難な世帯への学校給食費を含む就学援助'});
              }else if(d.code==='25210'){
                svc.source.checkedAt=checkedAt;
                svc.details.currentOperation='令和8年度の小中学校献立表が継続公開されていることを確認。';
                addSource(svc,{url:'https://www.city.yasu.lg.jp/soshiki/kyushoku/kondate/reiwa8nenndo/index.html',checkedAt,description:'令和8年度の市立小中学校給食献立表'});
              }else if(d.code==='25425'&&d.service==='schoolMeals'){
                svc.summary='令和8年度以降は小学校給食費を無償化し、中学校は月額4,400円の保護者負担を維持する。';
                svc.eligibility={minAgeMonths:72,maxAgeYears:15};
                svc.details={fiscalYear:'令和8年度以降',elementary:'町立小学校は学校給食費を徴収しない',middle:'町立中学校は月額4,400円、年額48,400円の保護者負担を維持',nationalStandard:'小学校は国の月額5,200円標準額を活用し、不足分を町が負担',provider:'愛荘町学校給食センター',allergy:'一般食に加えアレルギー対応食を調理',assistance:'中学校等で経済的理由により就学困難な世帯は学校給食費等の就学援助対象となる場合がある'};
                svc.source={url:d.newUrl,checkedAt};
                addSource(svc,{url:'https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001218.html',checkedAt,description:'学校給食費の基準額・減免等を定める現行例規'});
                addSource(svc,{url:'https://www.town.aisho.shiga.jp/kosodate/kyushoku/gaiyou/1668.html',checkedAt,description:'学校給食センターの概要とアレルギー対応を案内するページ'});
                addSource(svc,{url:'https://www.town.aisho.shiga.jp/school/05_echisyou/topics/reiwa/index.html',checkedAt,description:'令和8年度の町立小学校給食・学校運営の現行導線'});
                addSource(svc,{url:'https://www.town.aisho.shiga.jp/soshiki/kyoiku/1/1/tetuduki/932.html',checkedAt,description:'学校給食費を含む就学援助の申請案内'});
              }else if(d.code==='25425'&&d.service==='postpartumCare'){
                svc.source.checkedAt=checkedAt;
                svc.details.userFacingNote='産後ケア専用の利用者向け申請ページは現時点で確認できないため、利用申請・委託施設は健康推進課へ確認する。';
                addSource(svc,{url:'https://www.town.aisho.shiga.jp/soshiki/kenko/2/1/4423.html',checkedAt,description:'令和8年度健康カレンダーと妊産婦・乳幼児保健サービスへの導線'});
              }else if(d.code==='25442'){
                svc.source.checkedAt=checkedAt;
                svc.details.userFacingNote='学校給食費不徴収の専用利用者ページは確認できないため、現行要綱を直接根拠とし、学校または教育委員会へ確認する。';
                addSource(svc,{url:'https://www.kouratown.jp/cyonososhiki/somuka/zaiseikakari/zaisei/1385622361935.html',checkedAt,description:'令和8年度当初予算概要と教育施策への公式導線'});
              }
            }
            m.updatedAt=checkedAt;
            writeJson(municipalityPath,raw,m);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const {raw:taskRaw,obj:task}=readJson(taskPath);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='中日本調査班A';task.status='merged';task.completedServices=keys;
            task.verifiedCount=keys.filter(k=>m.services[k]?.status==='verified').length;task.researchingCount=keys.filter(k=>m.services[k]?.status==='researching').length;task.unavailableCount=keys.filter(k=>m.services[k]?.status==='unavailable').length;task.needsMediumReviewCount=keys.filter(k=>m.services[k]?.status==='needs_medium_review').length;
            task.officialSources=[...new Set(keys.map(k=>m.services[k]?.source?.url).filter(Boolean))];
            task.notes=Array.isArray(task.notes)?task.notes:[];
            for(const d of items){const note=`2026-07-26 弱い主出典第4群: ${d.service}を${d.outcome}として再確認。${d.basis}`;if(!task.notes.includes(note))task.notes.push(note);}
            task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);
          }
          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));const done=new Set(decisions.map(d=>`${d.code}:${d.service}`));recovery.queue=(recovery.queue??[]).filter(x=>!done.has(`${x.code}:${x.service}`));recovery.queueCount=recovery.queue.length;recovery.nextBatch=recovery.queue.slice(0,5);recovery.status='active_queue_batch4_applied';recovery.lastAppliedBatch=4;recovery.lastAppliedAt=updatedAt;fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          const decision={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch4-decisions-20260726',session:'中日本調査班A',coordinatorSession:'統括B',checkedAt,updatedAt,category:'weakPrimarySource',reviewedMunicipalityCount:4,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,contentCorrectionCount:2,remainingCandidates:13,decisions,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'regional_changes_validated',blocker:null};fs.writeFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch4-decisions-20260726.json'),JSON.stringify(decision,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));checkpoint.updatedAt=updatedAt;checkpoint.status='completed';checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.nextAction='弱い主出典残13件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';const q=checkpoint.qualityReaudit;q.latestCompletedAt=updatedAt;q.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);q.latestCiRunNumber=Number(process.env.RUN_ID);q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??244),248);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??678),683);q.candidateCounts.weakPrimarySource=13;q.latestWeakSourceBatch={batch:4,status:'regional_changes_validated',reviewedMunicipalityCount:4,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,contentCorrectionCount:2,remainingCandidates:13,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};q.confirmedCorrections=Array.isArray(q.confirmedCorrections)?q.confirmedCorrections:[];for(const d of decisions)if(!q.confirmedCorrections.some(x=>x.type==='weak_primary_source_resolved'&&String(x.code)===d.code&&x.service===d.service))q.confirmedCorrections.push({type:'weak_primary_source_resolved',code:d.code,service:d.service,name:d.name,outcome:d.outcome});checkpoint.lastAction='弱い主出典第4群5制度を公式情報で再確認し、守山市・愛荘町の学校給食を令和8年度条件へ訂正し、残る3制度の利用者向け導線を補強した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch4-trigger-20260726.json
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第4群を改善'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
