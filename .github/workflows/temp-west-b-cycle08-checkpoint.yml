name: Temporary West B Cycle 08 Checkpoint

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'ops/west-b-cycle08-checkpoint-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/west-b-cycle08-checkpoint-20260725
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update West B checkpoint to cycle 8
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.updatedAt = '2026-07-25T03:44:00+09:00';
          data.nextAction = '概略検証第9回として、宮崎県の残り9自治体と沖縄県16自治体をコード順で検証する。全10回程度で担当250自治体を網羅する。';
          const rv = data.roughValidation;
          rv.status = 'in_progress';
          rv.plannedCycles = 10;
          rv.completedCycles = 8;
          rv.auditedMunicipalityCount = 200;
          rv.auditedServiceCount = 1800;
          rv.remainingMunicipalityCount = 50;
          rv.detectedResearchContentErrorCount = 2;
          rv.correctedResearchContentErrorCount = 2;
          rv.detectedSourceMaintenanceIssueCount = 9;
          rv.correctedSourceMaintenanceIssueCount = 9;
          rv.lastCycle = {
            cycle: 8,
            auditPullRequestNumber: 3095,
            auditCiRunNumber: 7575,
            auditMergeCommit: '6312db1251054f444c5e5b968ecebc81aeeea66b',
            auditFile: 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-08-20260725.json',
            reviewFile: 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-08-review-20260725.json',
            municipalityCount: 25,
            serviceCount: 225,
            prefectureCodes: ['44', '45'],
            manualSpotCheckCount: 5,
            contentErrorCount: 0,
            correctedContentErrorCount: 0,
            sourceMaintenanceIssueCount: 1,
            correctedSourceMaintenanceIssueCount: 1,
            correctionPullRequestNumbers: [3101],
            correctionCiRunNumbers: [7568],
            correctionMergeCommits: ['942bfb37cf6210cc542c46f08b9302abecaeffcf']
          };
          rv.cycleHistory = Array.isArray(rv.cycleHistory) ? rv.cycleHistory.filter(item => item.cycle !== 8) : [];
          rv.cycleHistory.push({
            cycle: 8,
            municipalityCount: 25,
            serviceCount: 225,
            contentErrorCount: 0,
            correctedContentErrorCount: 0,
            sourceMaintenanceIssueCount: 1,
            correctedSourceMaintenanceIssueCount: 1,
            auditPullRequestNumber: 3095,
            auditCiRunNumber: 7575,
            correctionPullRequestNumbers: [3101],
            correctionCiRunNumbers: [7568]
          });
          rv.cycleHistory.sort((a, b) => a.cycle - b.cycle);
          rv.nextCycle = {
            cycle: 9,
            plannedMunicipalityCount: 25,
            scopePolicy: '宮崎県の残り9自治体と沖縄県16自治体をコード順で検証する'
          };
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Validate checkpoint JSON
        run: node -e "JSON.parse(require('fs').readFileSync('jichitai-compare/operations/control/session-checkpoints/west-b.json','utf8')); console.log('checkpoint JSON valid')"
      - name: Commit checkpoint
        shell: bash
        run: |
          rm -f .github/west-b-cycle08-checkpoint.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/session-checkpoints/west-b.json
          git add .github/west-b-cycle08-checkpoint.trigger
          git commit -m "ops: 西日本B概略検証の進捗8/10を記録"
          git push origin HEAD:ops/west-b-cycle08-checkpoint-20260725
