name: HM2 Build Number Environment Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[HM2-BUILDNO-FIX]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply fail-closed repair
        run: |
          python3 scripts/patch_hm2_build_number_env.py
          grep -q 'RELEASE_BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_NUMBER:-}}"' ios/health-manager-2/prepare-web-assets.sh
          grep -q 'BUILD_NUMBER or CM_BUILD_NUMBER is required' ios/health-manager-2/prepare-web-assets.sh
      - name: Commit only HM2 release preparation repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ios/health-manager-2/prepare-web-assets.sh
          git diff --cached --exit-code && { echo 'No change required'; exit 0; } || true
          git commit -m 'fix(hm2): resolve Codemagic build number robustly'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`HM2 build-number repair finished. status=${{ job.status }}; run_id=${context.runId}`});
