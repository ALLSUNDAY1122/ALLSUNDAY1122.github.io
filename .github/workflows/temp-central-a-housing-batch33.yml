name: Temporary Central A Housing Batch 33

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch33-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch33-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 33
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T19:01:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions=[
            {code:'28210',name:'加古川市',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年度に新婚生活を始める39歳以下の夫婦へ、住宅取得・賃借・リフォーム・引越費用を最大60万円補助する。',source:'https://www.city.kakogawa.lg.jp/soshikikarasagasu/kodomo/kodomoseisaku/kekkonshinseikatsu/31177.html',basis:'令和8年度の結婚新生活支援として、対象費用、夫婦年齢、最大60万円、申請期間を確認'},
            {code:'28212',name:'赤穂市',type:'child_newlywed_public_housing_income_relaxation',status:'verified',summary:'市営住宅では、中学校卒業までの子がいる子育て世帯と、合計年齢80歳未満・婚姻後2年以内の新婚世帯について、入居収入基準を月額25万9,000円以下に緩和する。',source:'https://www.city.ako.lg.jp/shimin/juutaku/income.html',basis:'市営住宅の現行入居収入基準で、子育て世帯・新婚世帯の基準緩和と各世帯定義を確認'},
            {code:'28213',name:'西脇市',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住宅取得・賃借・リフォーム・引越費用を最大60万円補助する。',source:'https://www.city.nishiwaki.lg.jp/lifescenemokutekibetsudesagasu/kakusyutetsuzukijyosei/jutakuteate_josei/26478.html',basis:'令和8年度の新婚世帯支援について、婚姻期間、年齢、所得、対象費用、最大60万円を確認'},
            {code:'28214',name:'宝塚市',type:'general_seismic_retrofit_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.takarazuka.hyogo.jp/1060678/1060691/1061537/1010169/1000400.html',basis:'住宅耐震化促進事業は耐震性の低い住宅を対象とする一般制度で、子育て等を対象要件としない'},
            {code:'28215',name:'三木市',type:'current_young_newlywed_migrant_housing_replacement',status:'verified',summary:'39歳以下の新婚世帯・移住世帯へ、住宅取得・賃借・リフォーム・引越費用を原則最大30万円、条件により最大100万円支援する。',source:'https://www.city.miki.lg.jp/soshiki/6/1072.html',basis:'現行のトカイナカ三木新生活応援事業で、39歳以下の新婚・移住世帯、対象費用、30万から100万円の上限を確認'}
          ];

          function writePreservingStyle(file,obj){
            const raw=fs.readFileSync(file,'utf8');
            const compact=!raw.includes('\n  ');
            fs.writeFileSync(file,compact?JSON.stringify(obj)+'\n':JSON.stringify(obj,null,2)+'\n');
          }
          for(const d of decisions){
            const municipalityPath=path.join(root,'data/municipalities','28',`${d.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(municipalityPath,'utf8'));
            const oldSource=municipality.services.housingSupport?.source?.url;
            const service={status:d.status,summary:d.summary,details:{},source:{url:d.source,checkedAt}};
            if(d.code==='28210')service.details={program:'令和8年度加古川市結婚新生活支援補助金',target:'婚姻日時点で夫婦とも39歳以下の新婚世帯',coveredCosts:'住宅取得費、住宅賃借費、リフォーム費、引越費',maximum:'夫婦とも29歳以下は最大60万円、その他の39歳以下は最大30万円',paymentPeriod:'令和8年4月1日から令和9年3月31日までに支払った費用',applicationPeriod:'令和8年6月1日から令和9年3月31日まで'};
            if(d.code==='28212')service.details={program:'赤穂市営住宅の入居収入基準緩和',generalThreshold:'一般世帯は政令月収15万8,000円以下',relaxedThreshold:'子育て世帯・新婚世帯は政令月収25万9,000円以下',childHousehold:'入居者に中学校卒業までの子がいる世帯',newlywedHousehold:'夫婦の合計年齢が80歳未満で、婚姻成立後2年以内の世帯',note:'募集住宅、申込時期、その他資格要件は募集案内で確認'};
            if(d.code==='28213')service.details={program:'西脇市結婚新生活支援事業補助金',eligibleMarriage:'令和8年1月1日から令和9年3月31日までに婚姻',ageCondition:'婚姻日に夫婦とも39歳以下',incomeCondition:'夫婦の所得合計500万円未満等',coveredCosts:'住宅取得費、住宅賃借費、リフォーム費、引越費',maximum:'夫婦とも29歳以下は最大60万円、その他は最大30万円',applicationDeadline:'令和9年3月5日'};
            if(d.code==='28214')service.details={reviewedProgram:'宝塚市住宅耐震化促進事業',generalSupport:'耐震性の低い既存住宅の耐震改修計画・工事費等を補助',classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般耐震制度のため対象外'};
            if(d.code==='28215')service.details={program:'トカイナカ三木新生活応援事業',target:'39歳以下の新婚世帯または移住世帯。移住世帯には婚姻世帯、パートナー世帯、18歳未満の子を養育するひとり親世帯を含む',incomeCondition:'世帯所得500万円未満、ひとり親世帯250万円未満等',coveredCosts:'住宅取得費、住宅賃借費、引越費、一定のリフォーム費',maximum:'39歳以下は最大30万円、夫婦等とも29歳以下は最大60万円、中古戸建購入等の加算で最大100万円',residenceIntent:'申請翌年度から2年以上市内に居住'};
            municipality.services.housingSupport=service;
            municipality.updatedAt=checkedAt;
            writePreservingStyle(municipalityPath,municipality);

            const taskPath=path.join(root,'operations/tasks',`${d.code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.verifiedCount=keys.filter(k=>municipality.services[k]?.status==='verified').length;
            task.unavailableCount=keys.filter(k=>municipality.services[k]?.status==='unavailable').length;
            task.researchingCount=keys.filter(k=>municipality.services[k]?.status==='researching').length;
            task.needsMediumReviewCount=keys.filter(k=>municipality.services[k]?.status==='needs_medium_review').length;
            task.officialSources=Array.isArray(task.officialSources)?task.officialSources:[];
            if(oldSource && task.officialSources.includes(oldSource))task.officialSources=task.officialSources.map(x=>x===oldSource?d.source:x);
            if(!task.officialSources.includes(d.source))task.officialSources.push(d.source);
            task.officialSources=[...new Set(task.officialSources)];
            task.notes=Array.isArray(task.notes)?task.notes:[];
            task.notes.push(`2026-07-26 中日本A住宅支援分類第33群: ${d.basis}。`);
            writePreservingStyle(taskPath,task);
          }

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch33-decisions-20260726',session:'中日本調査班A',generatedAt:updatedAt,category:'generalHousingMisclassification',previousRemainingCandidates:14,reviewedMunicipalityCount:5,remainingCandidates:9,confirmedCorrectionCount:5,statusToUnavailableCount:1,verifiedReplacementOrClarificationCount:4,verifiedMaintainedCount:0,decisions:decisions.map(d=>({code:d.code,name:d.name,type:d.type,beforeStatus:'verified',afterStatus:d.status,summary:d.summary,sourceUrl:d.source,basis:d.basis})),issue3141:{unresolvedItems:19,status:'unchanged_waiting_for_official_usage_conditions'},releaseBlocker:'none',regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'validated_pending_region_merge'};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch33-decisions-20260726.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='pending';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残9件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=219;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=651;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=9;
          checkpoint.qualityReaudit.latestHousingBatch={batch:33,status:'validated_pending_region_merge',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:1,verifiedReplacementOrClarificationCount:4,verifiedMaintainedCount:0,remainingCandidates:9,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第33群の宝塚市をunavailableへ修正し、加古川市・赤穂市・西脇市・三木市を現行の新婚・子育て住宅支援へ差し替えた。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch33-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD~1)
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第33群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
