name: Scan cold resume integration one-shot

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scan-cold-resume-wire.yml'

permissions:
  contents: write

jobs:
  wire-cold-resume:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Wire durable cold resume
