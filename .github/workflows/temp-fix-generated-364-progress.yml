name: Temporary Fix Generated 364 Progress Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-generated-364-progress.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/fix-chita-status-20260722-1151
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate progress
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/update-progress.mjs
          node ./scripts/validate-data.mjs --require-generated
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('operations/progress.json','utf8'));
          if (p.registeredMunicipalities !== 364) throw new Error(`registered=${p.registeredMunicipalities}`);
          if (p.mergedMunicipalities !== 364) throw new Error(`merged=${p.mergedMunicipalities}`);
          if (p.prOpenMunicipalities !== 0) throw new Error(`prOpen=${p.prOpenMunicipalities}`);
          NODE
          git add operations/progress.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '進捗修正: 公開364自治体・PR作成中0へ再生成'
          git push origin HEAD:coord/fix-chita-status-20260722-1151
