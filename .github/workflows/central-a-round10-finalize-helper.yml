          const trackerPath=path.join(root,'operations','control','central-a-scope-verification-20260724.json'),tracker=JSON.parse(fs.readFileSync(trackerPath,'utf8'));tracker.branch='audit/central-a-scope-verification-round-10-20260725';tracker.batches=tracker.batches.filter(b=>b.batch!==10);tracker.batches.push({batch:10,prefectureCode:'28',prefectureName:'兵庫県',municipalityCount:41,status:'completed_with_corrections',checkedMunicipalities:41,checkedServices:369,initialStructuralFindingCount:1,structuralFindingCount:0,resolvedStructuralFindingCount:1,initialUnavailableCount:0,unavailableCount:0,initialSubstantiveSuspectCount:7,substantiveSuspectCount:0,report:'operations/control/central-a-scope-round-10-hyogo-20260725.json',confirmedErrors:2,correctedMunicipalityCodes:['28201','28212'],confirmedAccurateSuspectCodes:['28220','28225','28227','28228','28442','28585'],needsFurtherReviewCodes:[],nextStep:'10回監査完了。継続確認25件を統括へ共有する',completedAt:'2026-07-25T05:34:00+09:00'});tracker.summary={completedBatches:10,checkedMunicipalities:314,confirmedErrors:76,needsFurtherReview:25,correctedErrors:76};tracker.nextAction='10回監査完了。継続確認25件を統括へ共有する';tracker.auditStatus='completed';tracker.completedAt='2026-07-25T05:34:00+09:00';tracker.rebuiltRound10At='2026-07-25T05:34:00+09:00';write(trackerPath,tracker);
          NODE
          node /tmp/finalize-round10.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/28/28212.json jichitai-compare/operations/tasks/28201.json jichitai-compare/operations/tasks/28212.json jichitai-compare/operations/control/central-a-scope-round-10-hyogo-20260725.json jichitai-compare/operations/control/central-a-scope-verification-20260724.json
          git commit -m 'audit: 兵庫県監査の確定誤り2件を修正'
          git push origin HEAD:audit/central-a-round10-work-20260725
