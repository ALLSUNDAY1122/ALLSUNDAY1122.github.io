name: APP2-002 Build7 Status Probe
on:
  issues:
    types: [opened]
permissions:
  actions: read
  issues: write
jobs:
  probe:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[APP2-002-B7-STATUS]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'app2-002-nomidokoro-build-only.yml',
              per_page: 3
            });
            const runs=data.workflow_runs.map(r=>({id:r.id,status:r.status,conclusion:r.conclusion,head_sha:r.head_sha,created_at:r.created_at,updated_at:r.updated_at}));
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'```json\n'+JSON.stringify(runs,null,2)+'\n```'});
