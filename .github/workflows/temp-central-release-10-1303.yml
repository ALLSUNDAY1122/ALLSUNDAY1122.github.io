name: Temporary Central Release 10 1303

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-central-release-10-1303.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/central-release-10-20260722-1303
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy fixed central snapshot
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/central:refs/remotes/origin/region/central'
          codes='23225 23226 23227 23228 23229 23230 23231 23232 23233 23234'
          for code in $codes; do
            mkdir -p jichitai-compare/data/municipalities/23 jichitai-compare/operations/tasks
            git show origin/region/central:jichitai-compare/data/municipalities/23/${code}.json > jichitai-compare/data/municipalities/23/${code}.json
            git show origin/region/central:jichitai-compare/operations/tasks/${code}.json > jichitai-compare/operations/tasks/${code}.json
          done
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          test ${#changed[@]} -eq 20
          for path in "${changed[@]}"; do
            case "$path" in
              jichitai-compare/data/municipalities/23/23225.json|jichitai-compare/data/municipalities/23/23226.json|jichitai-compare/data/municipalities/23/23227.json|jichitai-compare/data/municipalities/23/23228.json|jichitai-compare/data/municipalities/23/23229.json|jichitai-compare/data/municipalities/23/23230.json|jichitai-compare/data/municipalities/23/23231.json|jichitai-compare/data/municipalities/23/23232.json|jichitai-compare/data/municipalities/23/23233.json|jichitai-compare/data/municipalities/23/23234.json|jichitai-compare/operations/tasks/23225.json|jichitai-compare/operations/tasks/23226.json|jichitai-compare/operations/tasks/23227.json|jichitai-compare/operations/tasks/23228.json|jichitai-compare/operations/tasks/23229.json|jichitai-compare/operations/tasks/23230.json|jichitai-compare/operations/tasks/23231.json|jichitai-compare/operations/tasks/23232.json|jichitai-compare/operations/tasks/23233.json|jichitai-compare/operations/tasks/23234.json) ;;
              *) echo "unexpected $path"; exit 1 ;;
            esac
          done
          git add jichitai-compare/data/municipalities/23 jichitai-compare/operations/tasks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 中日本10自治体の固定スナップショットを作成'
          git push origin coord/central-release-10-20260722-1303
