name: APP2-009 Kangoshi ASC Audit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app2-009-kangoshi-asc-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Write task-local read-only ASC command
        run: |
          cat > /tmp/app2-009-asc-command.json <<'JSON'
          {
            "request_id": "app2-009-kangoshi-asc-audit-20260819",
            "requests": [
              {"label":"app","path":"/v1/apps/6801792293"},
              {"label":"bundle-id","path":"/v1/bundleIds?filter[identifier]=jp.allsunday1122.kangoshi&limit=10"},
              {"label":"builds","path":"/v1/apps/6801792293/builds?sort=-uploadedDate&limit=50"},
              {"label":"prerelease-versions","path":"/v1/apps/6801792293/preReleaseVersions?limit=50"},
              {"label":"appstore-versions","path":"/v1/apps/6801792293/appStoreVersions?limit=50"},
              {"label":"beta-groups","path":"/v1/apps/6801792293/betaGroups?limit=50"},
              {"label":"app-infos","path":"/v1/apps/6801792293/appInfos?limit=20&include=appInfoLocalizations"},
              {"label":"iap-v2","path":"/v1/apps/6801792293/inAppPurchasesV2?limit=200"},
              {"label":"subscription-groups","path":"/v1/apps/6801792293/subscriptionGroups?limit=200&include=subscriptions"}
            ]
          }
          JSON
      - name: Execute read-only App Store Connect audit
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/app_store_connect_gateway.py --command /tmp/app2-009-asc-command.json --output /tmp/app2-009-asc-result.json
      - name: Persist sanitized APP2-009 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('/tmp/app2-009-asc-result.json').read_text(encoding='utf-8'))
          allow=('name','bundleId','sku','primaryLocale','identifier','platform','seedId','referenceName','productId','state','subscriptionPeriod','familySharable','availableInAllTerritories','version','versionString','appStoreState','betaReviewState','uploadedDate','processingState','expired','expirationDate','minOsVersion')
          out={'request_id':src.get('request_id'),'completed_at':src.get('completed_at'),'results':[]}
          for r in src.get('results',[]):
              resp=r.get('response') or {}
              item={'label':r.get('label'),'http_status':r.get('http_status'),'data':[],'included':[]}
              for bucket in ('data','included'):
                  values=resp.get(bucket) or []
                  if isinstance(values,dict): values=[values]
                  for x in values:
                      if not isinstance(x,dict): continue
                      attrs=x.get('attributes') or {}
                      item[bucket].append({'id':x.get('id'),'type':x.get('type'),'attributes':{k:attrs.get(k) for k in allow if k in attrs}})
              out['results'].append(item)
          p=Path('automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-asc.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit audit and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-asc.json
          git rm .github/workflows/app2-009-kangoshi-asc-once.yml
          git commit -m 'APP2-009: persist Kangoshi ASC audit'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
