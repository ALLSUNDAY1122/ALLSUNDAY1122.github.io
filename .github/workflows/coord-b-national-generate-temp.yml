name: Coordinator B National Generate Temp

on:
  push:
    branches:
      - coord/central-west-release-20260724
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' && github.head_ref == 'coord/central-west-release-20260724')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: coord/central-west-release-20260724
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch regional branches
        run: |
          git fetch origin region/central:refs/remotes/origin/region/central
          git fetch origin region/west:refs/remotes/origin/region/west

      - name: Import regional snapshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const root = process.cwd();
          const project = path.join(root, 'jichitai-compare');
          const serviceDefs = JSON.parse(fs.readFileSync(path.join(project, 'data/service-definitions.json'), 'utf8'));
          const serviceIds = serviceDefs.services.map((item) => item.id);
          const completed = new Set(['verified', 'unavailable']);
          const timestamp = '2026-07-24T02:45:00+09:00';

          const targets = [
            { region: 'central', branch: 'origin/region/central', code: '30422', sourcePullRequestNumber: 1463, mode: 'update' },
            { region: 'west', branch: 'origin/region/west', code: '33606', sourcePullRequestNumber: 1495, mode: 'update' },
            { region: 'west', branch: 'origin/region/west', code: '33643', sourcePullRequestNumber: 1495, mode: 'update' },
            { region: 'west', branch: 'origin/region/west', code: '37206', sourcePullRequestNumber: 1624, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '37207', sourcePullRequestNumber: 1624, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '37322', sourcePullRequestNumber: 1624, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '37386', sourcePullRequestNumber: 1640, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '37404', sourcePullRequestNumber: 1640, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '37406', sourcePullRequestNumber: 1640, mode: 'add' },
            { region: 'west', branch: 'origin/region/west', code: '39206', sourcePullRequestNumber: 1640, mode: 'add' }
          ];

          function showJson(ref, repoPath) {
            const text = execFileSync('git', ['show', `${ref}:${repoPath}`], { encoding: 'utf8' });
            return JSON.parse(text);
          }

          function writeJson(repoPath, value) {
            const full = path.join(root, repoPath);
            fs.mkdirSync(path.dirname(full), { recursive: true });
            fs.writeFileSync(full, `${JSON.stringify(value, null, 2)}\n`);
          }

          const manifestMunicipalities = [];
          for (const target of targets) {
            const prefectureCode = target.code.slice(0, 2);
            const municipalityPath = `jichitai-compare/data/municipalities/${prefectureCode}/${target.code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${target.code}.json`;
            const municipality = showJson(target.branch, municipalityPath);
            const sourceTask = showJson(target.branch, taskPath);

            const services = serviceIds.map((id) => municipality.services?.[id]);
            if (services.some((service) => !service || !completed.has(service.status))) {
              throw new Error(`${target.code}: 9制度が完了状態ではありません`);
            }

            municipality.status = 'verified';
            municipality.updatedAt = '2026-07-24';

            const completedServices = [...serviceIds];
            const verifiedCount = services.filter((service) => service.status === 'verified').length;
            const unavailableCount = services.filter((service) => service.status === 'unavailable').length;
            const officialSources = [...new Set(services.map((service) => service.source?.url).filter((url) => /^https:\/\//.test(url ?? '')))];

            const task = {
              ...sourceTask,
              status: 'merged',
              currentService: null,
              nextServiceIndex: serviceIds.length,
              completedServices,
              verifiedCount,
              researchingCount: 0,
              unavailableCount,
              needsMediumReviewCount: 0,
              pullRequestNumber: null,
              lastCheckedAt: '2026-07-24',
              lastUpdatedAt: timestamp,
              lastUpdatedBy: '統括B全国統合',
              officialSources,
              blockers: []
            };

            writeJson(municipalityPath, municipality);
            writeJson(taskPath, task);
            manifestMunicipalities.push({
              region: target.region,
              team: task.assignedTeam,
              code: target.code,
              name: municipality.name,
              prefecture: municipality.prefecture,
              mode: target.mode,
              sourcePullRequestNumber: target.sourcePullRequestNumber
            });
          }

          const manifest = {
            schemaVersion: '1.0.0',
            createdAt: timestamp,
            previousPublishedMunicipalities: 1153,
            addedMunicipalities: manifestMunicipalities.filter((item) => item.mode === 'add').length,
            updatedMunicipalities: manifestMunicipalities.filter((item) => item.mode === 'update').length,
            byRegion: {
              central: manifestMunicipalities.filter((item) => item.region === 'central').length,
              west: manifestMunicipalities.filter((item) => item.region === 'west').length
            },
            municipalities: manifestMunicipalities,
            excludedCount: 0,
            excluded: []
          };
          writeJson('jichitai-compare/operations/control/coord-b-release-central-west-20260724.json', manifest);
          NODE

      - name: Generate public data and progress
        working-directory: jichitai-compare
        run: |
          npm ci
          npm run generate
          npm run progress
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          if (progress.registeredMunicipalities !== 1160) {
            throw new Error(`公開自治体数が想定外です: ${progress.registeredMunicipalities}`);
          }
          const indexPath = 'index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/\d+自治体・9制度/u, `${progress.registeredMunicipalities}自治体・9制度`);
          fs.writeFileSync(indexPath, html);
          NODE
          npm run validate:generated

      - name: Commit generated release
        run: |
          git add \
            jichitai-compare/data/municipalities \
            jichitai-compare/operations/tasks \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/control/coord-b-release-central-west-20260724.json
          git commit -m "release: 中日本・西日本7自治体を1160自治体へ反映"
          git push origin HEAD:coord/central-west-release-20260724
