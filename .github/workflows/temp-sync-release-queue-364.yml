name: Temporary Sync Release Queue 364

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-364.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue and self-delete
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          qpath=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(qpath.read_text(encoding='utf-8'))
          entries={e['region']:e for e in q['entries']}
          state_fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          for region in ('north','east','central','west'):
              ref=f'origin/region/{region}'
              paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              municipalities=[]
              for path in paths:
                  if not re.search(r'/\d{5}\.json$',path):
                      continue
                  data=json.loads(show(ref,path))
                  if belongs(region,data['prefectureCode']):
                      municipalities.append({'code':data['code'],'name':data['name']})
              municipalities.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending=int(state.get(state_fields[region],0))
              entry=entries[region]
              entry['municipalities']=municipalities
              entry['count']=len(municipalities)
              entry['pendingSinceLastRelease']=pending
              entry['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              entry['reason']=f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体'
              entry['mainIntegrationPr']=state.get('lastNationalIntegrationPr')
              entry['generatedPullRequest']=606
              entry['auditStatus']='passed'
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          ready=[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10]
          q['updatedAt']='2026-07-22T12:18:00+09:00'
          q['status']='active'
          q['summary']={
              'regionalMergedMunicipalities':total,
              'latestGeneratedMunicipalityCount':364,
              'latestGeneratedPullRequest':606,
              'latestPublicCountPullRequest':606,
              'releaseReadyRegions':ready,
              'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合を実行する。' if ready else '10自治体到達地域なし。')
          }
          qpath.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print({'total':total,'pending':pending,'ready':ready})
          PY
          git rm .github/workflows/temp-sync-release-queue-364.yml
          git add jichitai-compare/operations/control/release-queue.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合状況を公開364自治体基準へ同期'
          git push origin main
