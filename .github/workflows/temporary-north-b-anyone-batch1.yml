name: Temporary North B Anyone Batch 1

on:
  pull_request:
    branches:
      - region/north
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: north-b-anyone-batch1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/north-b-anyone-low-priority-batch1-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect pending batch
        id: detect
        shell: bash
        run: |
          if [[ -f jichitai-compare/operations/triggers/north-b-anyone-batch1.txt ]]; then
            echo 'run_batch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_batch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply confirmed official conditions
        if: steps.detect.outputs.run_batch == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('jichitai-compare')
          now = '2026-07-25T14:40:00+09:00'
          today = '2026-07-25'

          def load(path):
              p = root / path
              raw = p.read_text(encoding='utf-8')
              return p, raw, json.loads(raw)

          def save(p, raw, data):
              if raw.count('\n') <= 3:
                  text = json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n'
              else:
                  text = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
              p.write_text(text, encoding='utf-8')

          changes = {
              '01607': {
                  'summary': '保育所等を利用していない生後6か月から満3歳未満児が、就労要件を問わず月10時間まで利用でき、基本1時間300円（世帯区分により0～150円）でこども誰でも通園制度を利用できる。',
                  'details': {
                      'fee': '基本1時間300円。生活保護世帯0円、住民税非課税世帯60円、年収360万円未満相当世帯90円、要支援世帯150円。給食は1食400円で、施設により追加負担あり',
                      'facilities': '町内すべての保育施設と浦河町地域子育て支援センター',
                      'payment': '施設でキャッシュレス決済。利用できない場合は後日納付書払い'
                  },
                  'source': 'https://www.town.urakawa.hokkaido.jp/gyosei/news/detail.html?content=843'
              },
              '01609': {
                  'summary': '2026年4月1日から、保育所に在籍していない生後6か月から3歳未満児を、就労要件を問わず月10時間まで基本1時間300円で預かるこども誰でも通園制度を実施する。',
                  'details': {
                      'start': '2026年4月1日',
                      'fee': '基本1時間300円。要支援世帯150円、町民税非課税世帯60円、生活保護世帯0円',
                      'availability': '余裕活用型のため、保育所入所児童数によって利用できない場合がある'
                  },
                  'source': 'https://www.town.erimo.lg.jp/section/choumin/sg6h94000000fas8.html'
              },
              '04444': {
                  'summary': '保育施設等に在籍していない生後6か月から3歳未満の子どもが、月10時間まで基本1時間300円程度でこども誰でも通園制度を利用できる。',
                  'details': {
                      'fee': '1時間300円程度。1時間以降は30分ごとに150円程度。給食費・おやつ代等は施設により別途必要',
                      'hours': '月10時間以内、1時間単位。開所日・時間は施設ごとに異なる',
                      'wideArea': '住所地に関係なく全国の実施施設を利用可能。ただし居住自治体で給付認定が必要'
                  },
                  'source': 'https://www.town.shikama.miyagi.jp/kurashi/3238.html'
              },
              '05204': {
                  'summary': '令和8年4月から、未就園の生後6か月から満3歳未満児が月10時間まで利用できるこども誰でも通園制度を実施する。通常の一時預かりも利用できる。',
                  'details': {
                      'anyoneStart': '2026年4月',
                      'fee': '市公式ページでは利用料金を公開していないため、子ども課または利用施設へ確認が必要'
                  },
                  'source': 'https://www.city.odate.lg.jp/kosodate/guide/birth/ikuji/p12801',
                  'additional': 'https://www.city.odate.lg.jp/kosodate/news/p10628'
              },
              '05434': {
                  'summary': '認定こども園の一時保育に加え、生後6か月から満3歳未満の未就園児が、町内3園で月10時間まで1時間300円でこども誰でも通園制度を利用できる。',
                  'details': {
                      'fee': '1時間300円。1時間以降は30分ごとに150円。生活保護世帯・町民税非課税世帯は減免あり',
                      'hours': '千畑なかよし園、六郷わくわく園、仙南すこやか園で月～土曜日9時～11時30分',
                      'reservation': '初回は施設面談が必要。利用希望日の14日前までにつうえんポータルで予約'
                  },
                  'source': 'https://www.town.misato.akita.jp/archive/p20260218092122'
              }
          }

          for code, spec in changes.items():
              pref = code[:2]
              p, raw, data = load(f'data/municipalities/{pref}/{code}.json')
              service = data['services']['temporaryChildcare']
              service['summary'] = spec['summary']
              service.setdefault('details', {}).update(spec['details'])
              service['source']['url'] = spec['source']
              service['source']['checkedAt'] = today
              if spec.get('additional'):
                  sources = service.setdefault('additionalSources', [])
                  if not any(item.get('url') == spec['additional'] for item in sources):
                      sources.append({'url': spec['additional'], 'checkedAt': today})
              data['updatedAt'] = today
              save(p, raw, data)

              tp, traw, task = load(f'operations/tasks/{code}.json')
              task['lastCheckedAt'] = today
              task['lastUpdatedAt'] = now
              task['lastUpdatedBy'] = '統括A③ / 北日本調査班B'
              for url in [spec['source'], spec.get('additional')]:
                  if url and url not in task.setdefault('officialSources', []):
                      task['officialSources'].append(url)
              note = '品質改善第2監査の誰でも通園低優先候補第1群で、現行公式ページに掲載済みの開始時期・料金・施設・利用条件を補完。status変更なし。'
              if note not in task.setdefault('notes', []):
                  task['notes'].append(note)
              save(tp, traw, task)

          audit = {
              'schemaVersion': '1.0.0',
              'auditId': 'north-b-anyone-low-priority-batch1-20260725',
              'sessionId': 'north-b',
              'reviewedAt': now,
              'issueNumber': 3398,
              'scope': {
                  'reviewedCandidates': 9,
                  'confirmedCorrectionMunicipalities': ['01607','01609','04444','05204','05434'],
                  'noChangeMunicipalities': ['04212','05361','06324','06364'],
                  'remainingCandidates': 65
              },
              'confirmedCorrections': [
                  {'code':'01607','municipality':'浦河町','fields':['fee','facilities','payment'],'statusChange':False},
                  {'code':'01609','municipality':'えりも町','fields':['start','fee','availability'],'statusChange':False},
                  {'code':'04444','municipality':'色麻町','fields':['fee','hours','wideArea'],'statusChange':False},
                  {'code':'05204','municipality':'大館市','fields':['start','feeUnpublishedNote'],'statusChange':False},
                  {'code':'05434','municipality':'美郷町','fields':['fee','hours','reservation'],'statusChange':False}
              ],
              'noChange': [
                  {'code':'04212','municipality':'登米市','decision':'現行JSONに施設別料金・対象・月10時間・施設を記録済み。機械抽出の偽陽性'},
                  {'code':'05361','municipality':'五城目町','decision':'2026年4月1日開始と実施予定施設は確認。対象月齢・料金の利用者向け公式条件は未公開のため推測しない'},
                  {'code':'06324','municipality':'大江町','decision':'制度案内索引は確認できるが、詳細ページを安定取得できず料金・開始時期を推測しない'},
                  {'code':'06364','municipality':'真室川町','decision':'公式カテゴリに制度ページは掲載されるが対象ページ取得が不安定。既存条件を維持'}
              ],
              'qualityGate': {
                  'statusChanges': 0,
                  'confirmedUnfixedErrors': 0,
                  'publicationBlocking': False
              },
              'nextAction': '残る低優先65候補を、通常一時預かりのみ・条件記録済み・利用者向け条件不足に分類して再確認する。'
          }
          ap = root / 'operations/audits/north-b-anyone-low-priority-batch1-20260725.json'
          ap.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cp, cpraw, checkpoint = load('operations/control/session-checkpoints/north-b.json')
          checkpoint['updatedAt'] = now
          checkpoint['workingBranch'] = 'audit/north-b-anyone-low-priority-batch1-20260725'
          checkpoint['nextAction'] = 'Issue #3398の残る誰でも通園低優先65候補を第2群以降で再確認する。'
          fa = checkpoint.setdefault('fiscalAnyoneAudit', {})
          fa['lowPriorityAnyoneBatch1Reviewed'] = 9
          fa['lowPriorityAnyoneBatch1Corrected'] = 5
          fa['remainingAnyonePriorityBelow50'] = 65
          fa['followUpIssue'] = 3398
          fa['status'] = 'low_priority_anyone_batch1_completed'
          save(cp, cpraw, checkpoint)
          PY

      - name: Validate changed data and capture output
        id: validate
        if: steps.detect.outputs.run_batch == 'true'
        working-directory: jichitai-compare
        shell: bash
        run: |
          set +e
          diagnostic='operations/audits/north-b-anyone-batch1-validation-diagnostic-20260725.txt'
          : > "$diagnostic"
          echo 'North B anyone batch 1 validation diagnostic' >> "$diagnostic"
          echo 'generatedAt=2026-07-25T14:44:00+09:00' >> "$diagnostic"
          echo '--- npm run generate ---' >> "$diagnostic"
          npm run generate >> "$diagnostic" 2>&1
          generate_status=$?
          echo "generate_status=$generate_status" >> "$diagnostic"
          echo '--- npm run progress ---' >> "$diagnostic"
          npm run progress >> "$diagnostic" 2>&1
          progress_status=$?
          echo "progress_status=$progress_status" >> "$diagnostic"
          echo '--- npm run validate:generated ---' >> "$diagnostic"
          npm run validate:generated >> "$diagnostic" 2>&1
          validate_status=$?
          echo "validate_status=$validate_status" >> "$diagnostic"
          cat "$diagnostic"
          if [[ $generate_status -eq 0 && $progress_status -eq 0 && $validate_status -eq 0 ]]; then
            echo 'validation_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'validation_ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Save diagnostic only when validation fails
        if: steps.detect.outputs.run_batch == 'true' && steps.validate.outputs.validation_ok != 'true'
        shell: bash
        run: |
          diagnostic='jichitai-compare/operations/audits/north-b-anyone-batch1-validation-diagnostic-20260725.txt'
          cp "$diagnostic" /tmp/north-b-anyone-batch1-diagnostic.txt
          git reset --hard HEAD
          rm -f jichitai-compare/operations/triggers/north-b-anyone-batch1.txt
          cp /tmp/north-b-anyone-batch1-diagnostic.txt "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic" jichitai-compare/operations/triggers/north-b-anyone-batch1.txt
          git commit -m 'diagnostic: capture North B anyone batch1 validation failure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Commit validated batch result
        if: steps.detect.outputs.run_batch == 'true' && steps.validate.outputs.validation_ok == 'true'
        shell: bash
        run: |
          rm -f jichitai-compare/operations/triggers/north-b-anyone-batch1.txt
          rm -f jichitai-compare/operations/audits/north-b-anyone-batch1-validation-diagnostic-20260725.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
            jichitai-compare/operations/tasks \
            jichitai-compare/operations/audits/north-b-anyone-low-priority-batch1-20260725.json \
            jichitai-compare/operations/audits/north-b-anyone-batch1-validation-diagnostic-20260725.txt \
            jichitai-compare/operations/control/session-checkpoints/north-b.json \
            jichitai-compare/operations/triggers/north-b-anyone-batch1.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'audit: review North B anyone low-priority batch 1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
