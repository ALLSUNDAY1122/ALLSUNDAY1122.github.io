name: Temporary Fix Sapporo Task Sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-sapporo-sources.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct task sources on both branches
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            '+refs/heads/fix/01100-sapporo-bulky-region:refs/remotes/origin/fix/01100-sapporo-bulky-region' \
            '+refs/heads/fix/01100-sapporo-bulky-main:refs/remotes/origin/fix/01100-sapporo-bulky-main'
          for branch in fix/01100-sapporo-bulky-region fix/01100-sapporo-bulky-main; do
            git checkout -B "$branch" "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('jichitai-compare/operations/tasks/01100.json')
          task = json.loads(path.read_text(encoding='utf-8'))
          task['officialSources'] = [
            'https://www.city.sapporo.jp/hoken-iryo/iryojosei/nyuyoji.html',
            'https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1140.html',
            'https://kosodate.city.sapporo.jp/mokuteki/azukeru/hoiku/ninka/941/941.html',
            'https://www.city.sapporo.jp/kyoiku/top/kyushoku/kyushokuhi.html',
            'https://kosodate.city.sapporo.jp/nenrei/ninshin_shussan/kenko/1036.html',
            'https://kosodate.city.sapporo.jp/mokuteki/azukeru/13027.html',
            'https://www.city.sapporo.jp/toshi/jutaku/01osumai/siju/kosodate.html',
            'https://www.city.sapporo.jp/seiso/gomi/oogatagomi.html',
            'https://www.city.sapporo.jp/kikikanri/higoro/hazardmap/hazardmap_index.html'
          ]
          path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add jichitai-compare/operations/tasks/01100.json
            git commit -m 'fix: 札幌市taskの主出典を制度データへ整合'
            git push origin "$branch"
          done
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-fix-sapporo-sources.yml
          git commit -m '統括管理: 札幌市出典補正一時ワークフローを削除'
          git push origin main
