name: Scan Lab Release Materialize 20260916

on:
  push:
    branches:
      - release/scanlab-testflight-20260916
    paths:
      - automation/scanlab-materialize-20260916.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-15
    steps:
      - name: Checkout pinned release branch
        uses: actions/checkout@v6
        with:
          ref: release/scanlab-testflight-20260916
          fetch-depth: 0

      - name: Validate release request and lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/scanlab-materialize-20260916.json').read_text(encoding='utf-8'))
          if d.get('source_sha') != 'da41f87a502b3943f72a5e3e192509a95fa8cc6c': raise SystemExit('source sha mismatch')
          if d.get('release_branch') != 'release/scanlab-testflight-20260916': raise SystemExit('release branch mismatch')
          if d.get('recipe_version') != 5: raise SystemExit('recipe version mismatch')
          if d.get('submit_to_app_store') is not False: raise SystemExit('App Store submission must remain false')
          PY
          git merge-base --is-ancestor da41f87a502b3943f72a5e3e192509a95fa8cc6c HEAD

      - name: Materialize reconstruction source
        run: |
          set -euo pipefail
          python3 splat-native-ios/scripts/apply_s13_depth_seed.py
          grep -q 'SplatDepthSeedBuilder.preparePointCloudPLY' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'let depthSeedFrames = captured.map' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'colorFrames: seedFrames' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'smoothedSceneDepth ?? frame.sceneDepth' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'restoreFinishedProjectForS13Reprocess' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'canReprocessTrusted' splat-native-ios/SplatNative/ScanLibraryView.swift

      - name: Verify S14 RGB dense seed contract
        run: |
          set -euo pipefail
          python3 splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py

      - name: Verify S15 pose trajectory contract
        run: |
          set -euo pipefail
          python3 splat-native-ios/scripts/diagnose_s15_pose_trajectory.py --self-test

      - name: Trace native validation contract
        run: |
          set +e
          bash -x splat-native-ios/scripts/validate.sh > automation/scanlab-validate-20260916.log 2>&1
          code=$?
          printf '%s\n' "$code" > automation/scanlab-validate-20260916.exitcode
          tail -n 80 automation/scanlab-validate-20260916.log > automation/scanlab-validate-20260916-tail.log
          cat automation/scanlab-validate-20260916-tail.log
          exit 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reproduce Xcode compile without signing
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/splat-native-ios"
          xcodegen generate > "$GITHUB_WORKSPACE/automation/scanlab-xcodegen-20260916.log" 2>&1
          gen_code=$?
          if [ "$gen_code" -ne 0 ]; then
            printf '%s\n' "$gen_code" > "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916.exitcode"
            tail -n 120 "$GITHUB_WORKSPACE/automation/scanlab-xcodegen-20260916.log" > "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916-tail.log"
            exit 0
          fi
          xcodebuild \
            -project SplatNative.xcodeproj \
            -scheme SplatNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916.exitcode"
          tail -n 160 "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916.log" > "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916-tail.log"
          cat "$GITHUB_WORKSPACE/automation/scanlab-xcodebuild-20260916-tail.log"
          exit 0

      - name: Verify immutable Codemagic release topology
        run: |
          set -euo pipefail
          grep -q 'Verify immutable materialized reconstruction source' codemagic.yaml
          if grep -q 'python3 splat-native-ios/scripts/apply_s13_depth_seed.py' codemagic.yaml; then
            echo 'Codemagic must not mutate reconstruction source' >&2
            exit 1
          fi

      - name: Persist materialized source and validation traces
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            splat-native-ios/SplatNative/ScanModel.swift \
            splat-native-ios/SplatNative/ScanLibraryView.swift \
            splat-native-ios/SplatNative/RootScanView.swift \
            splat-native-ios/SplatNative/SplatResultView.swift \
            automation/scanlab-validate-20260916.log \
            automation/scanlab-validate-20260916-tail.log \
            automation/scanlab-validate-20260916.exitcode \
            automation/scanlab-xcodegen-20260916.log \
            automation/scanlab-xcodebuild-20260916.log \
            automation/scanlab-xcodebuild-20260916-tail.log \
            automation/scanlab-xcodebuild-20260916.exitcode
          git commit -m 'scanlab: persist Xcode compile diagnostics' || true
          git push origin HEAD:release/scanlab-testflight-20260916

      - name: Enforce native validation result
        run: |
          set -euo pipefail
          test "$(cat automation/scanlab-validate-20260916.exitcode)" = "0"

      - name: Enforce Xcode compile result
        run: |
          set -euo pipefail
          test "$(cat automation/scanlab-xcodebuild-20260916.exitcode)" = "0"
