name: Temporary Central State Sync 21403

on:
  push:
    branches: [region/central]
    paths:
      - .github/workflows/temp-sync-central-state-21403.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/central
          fetch-depth: 0
      - name: Update central state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/regions/central.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt']='2026-07-22T02:41:00+09:00'
          data['status']='working'
          data['completedSinceLastRelease']=2
          data['completedMunicipalities']=['21401','21403']
          data['regionalQueue']=['21404']
          audit=data.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '21403' not in checked: checked.append('21403')
          checks=audit.setdefault('checks',[])
          line='大野町をPR #414・CI run #885で地方統合'
          if line not in checks: checks.append(line)
          data['lastAction']='下呂市から安八町までの10自治体を全国統合PR #404・生成更新PR #408で公開204自治体へ同期。その後、揖斐川町（21401）と大野町（21403）をregion/centralへ地方統合した。'
          data['nextAction']='池田町（21404）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する。'
          data['lastNationalIntegrationPr']=404
          data['lastNationalIntegrationAt']='2026-07-22T02:15:09+09:00'
          data['lastGeneratedPullRequest']=408
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-central-state-21403.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/control/regions/central.json .github/workflows/temp-sync-central-state-21403.yml
          git commit -m '統括管理: 中日本を全国統合後2自治体へ更新'
          git push origin region/central
