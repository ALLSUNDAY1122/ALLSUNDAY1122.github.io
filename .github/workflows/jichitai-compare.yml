name: Fix Setouchi Temporary Childcare Eligibility

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  fix-setouchi:
    if: github.head_ref == 'data/33212-setouchi-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Setouchi branch
        uses: actions/checkout@v4
        with:
          ref: data/33212-setouchi-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add required age eligibility
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/municipalities/33/33212.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.services.temporaryChildcare.eligibility = {
            minAgeMonths: 0,
            maxAgeYears: 5
          };
          data.services.temporaryChildcare.details.target = '未就学児を中心に、保護者の傷病、就労、負担軽減等で一時的な保育が必要な子ども。受入年齢・条件は施設ごとに異なるため利用先へ確認';
          fs.writeFileSync(path, JSON.stringify(data) + '\n');
          NODE
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions

      - name: Restore standard workflow and commit fix
        run: |
          git restore jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json
          git show HEAD^:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/data/municipalities/33/33212.json
          git commit -m 'Fix Setouchi temporary childcare eligibility range'
          git push origin HEAD:data/33212-setouchi-v2
