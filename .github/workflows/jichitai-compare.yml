name: Finalize Source-Backed Single Reviews

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove records without official source URL
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const P='jichitai-compare';
          const excluded=[
            {code:'33213',prefectureCode:'33',name:'赤磐市',serviceId:'sickChildCare'},
            {code:'33445',prefectureCode:'33',name:'里庄町',serviceId:'schoolMeals'},
            {code:'37207',prefectureCode:'37',name:'東かがわ市',serviceId:'schoolMeals'},
            {code:'37322',prefectureCode:'37',name:'土庄町',serviceId:'temporaryChildcare'},
            {code:'37324',prefectureCode:'37',name:'小豆島町',serviceId:'temporaryChildcare'},
            {code:'37364',prefectureCode:'37',name:'直島町',serviceId:'temporaryChildcare'},
            {code:'37403',prefectureCode:'37',name:'琴平町',serviceId:'sickChildCare'},
            {code:'39202',prefectureCode:'39',name:'室戸市',serviceId:'sickChildCare'}
          ];
          const before=JSON.parse(fs.readFileSync(`${P}/operations/progress.json`,'utf8')).registeredMunicipalities;
          for(const x of excluded){
            for(const file of [`${P}/data/municipalities/${x.prefectureCode}/${x.code}.json`,`${P}/operations/tasks/${x.code}.json`]){
              if(fs.existsSync(file))fs.unlinkSync(file);
            }
          }
          const manifestPath=`${P}/operations/control/normalized-single-review-all-20260723.json`;
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          manifest.municipalities=manifest.municipalities.filter(x=>!excluded.some(e=>e.code===x.code));
          manifest.normalizedMunicipalities=manifest.municipalities.length;
          manifest.byRegion={north:manifest.municipalities.filter(x=>x.region==='north').length,east:manifest.municipalities.filter(x=>x.region==='east').length,central:manifest.municipalities.filter(x=>x.region==='central').length,west:manifest.municipalities.filter(x=>x.region==='west').length};
          manifest.byService={};for(const x of manifest.municipalities)manifest.byService[x.serviceId]=(manifest.byService[x.serviceId]??0)+1;
          manifest.excludedNoOfficialSource=excluded.map(x=>({...x,reason:'needs_medium_review制度に公式HTTPS source.urlが未登録のため、推測補完せず公開対象外'}));
          manifest.branchRegisteredBeforeExclusion=before;
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          if(fs.existsSync(`${P}/operations/control/normalized-single-review-validation.log`))fs.unlinkSync(`${P}/operations/control/normalized-single-review-validation.log`);
          fs.writeFileSync(`${P}/operations/control/normalized-single-review-branch-before.txt`,String(before));
          NODE
      - name: Generate and validate final set
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js
      - name: Update displayed municipality count
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const oldCount=Number(fs.readFileSync('jichitai-compare/operations/control/normalized-single-review-branch-before.txt','utf8'));
          const progress=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8'));
          const file='jichitai-compare/index.html';let html=fs.readFileSync(file,'utf8');
          html=html.replace(new RegExp(`${oldCount}自治体`,'g'),`${progress.registeredMunicipalities}自治体`);
          fs.writeFileSync(file,html);
          fs.unlinkSync('jichitai-compare/operations/control/normalized-single-review-branch-before.txt');
          NODE
      - name: Restore workflow and commit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'release: keep only source-backed single-review normalizations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
