name: Coordinator Regional Missing Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-regional-missing:
    if: github.head_ref == 'coord/audit-regional-missing-20260723-1741'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: coord/audit-regional-missing-20260723-1741
          fetch-depth: 0

      - name: Fetch main and regional branches
        run: |
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Audit completed regional municipalities missing from main
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const regions = ['north', 'east', 'central', 'west'];
          const dataPrefix = 'jichitai-compare/data/municipalities/';
          const taskPrefix = 'jichitai-compare/operations/tasks/';

          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
          const exists = (ref, path) => {
            try {
              execFileSync('git', ['cat-file', '-e', `${ref}:${path}`], { stdio: 'ignore' });
              return true;
            } catch {
              return false;
            }
          };
          const readJson = (ref, path) => JSON.parse(git('show', `${ref}:${path}`));

          const report = {
            generatedAt: new Date().toISOString(),
            mainRegisteredCount: 0,
            totalCompletedMissing: 0,
            invalidMissing: [],
            duplicatesAcrossRegions: [],
            regions: {}
          };

          const mainFiles = git('ls-tree', '-r', '--name-only', 'origin/main', dataPrefix)
            .split('\n')
            .filter((path) => /^jichitai-compare\/data\/municipalities\/\d{2}\/\d{5}\.json$/u.test(path));
          report.mainRegisteredCount = mainFiles.length;

          const seenMissing = new Map();

          for (const region of regions) {
            const ref = `origin/region/${region}`;
            const dataFiles = git('ls-tree', '-r', '--name-only', ref, dataPrefix)
              .split('\n')
              .filter((path) => /^jichitai-compare\/data\/municipalities\/\d{2}\/\d{5}\.json$/u.test(path));

            const completedMissing = [];
            const skippedAlreadyMain = [];

            for (const dataPath of dataFiles) {
              const code = dataPath.match(/(\d{5})\.json$/u)?.[1];
              if (!code) continue;
              const taskPath = `${taskPrefix}${code}.json`;

              if (exists('origin/main', dataPath) || exists('origin/main', taskPath)) {
                skippedAlreadyMain.push(code);
                continue;
              }

              if (!exists(ref, taskPath)) {
                report.invalidMissing.push({ region, code, reason: 'task_missing' });
                continue;
              }

              try {
                const data = readJson(ref, dataPath);
                const task = readJson(ref, taskPath);
                const taskCode = task.municipalityCode ?? task.code;
                const completedCount = task.completedServices?.length ?? task.completedServiceCount ?? 0;
                const serviceCount = data.services ? Object.keys(data.services).length : 0;
                const completedStatuses = Object.values(data.services ?? {}).filter((service) => ['verified', 'unavailable'].includes(service?.status)).length;

                if (data.code !== code || taskCode !== code || task.status !== 'merged' || completedCount !== 9 || serviceCount !== 9 || completedStatuses !== 9) {
                  report.invalidMissing.push({
                    region,
                    code,
                    name: data.name ?? task.municipalityName ?? null,
                    reason: 'not_complete',
                    dataCode: data.code ?? null,
                    taskCode,
                    taskStatus: task.status ?? null,
                    completedCount,
                    serviceCount,
                    completedStatuses
                  });
                  continue;
                }

                const item = {
                  code,
                  name: data.name,
                  prefectureCode: data.prefectureCode,
                  prefecture: data.prefecture,
                  verifiedCount: task.verifiedCount,
                  unavailableCount: task.unavailableCount,
                  dataPath,
                  taskPath
                };
                completedMissing.push(item);

                if (seenMissing.has(code)) {
                  report.duplicatesAcrossRegions.push({ code, firstRegion: seenMissing.get(code), secondRegion: region });
                } else {
                  seenMissing.set(code, region);
                }
              } catch (error) {
                report.invalidMissing.push({ region, code, reason: 'parse_error', message: error.message });
              }
            }

            completedMissing.sort((a, b) => a.code.localeCompare(b.code));
            report.regions[region] = {
              regionalDataCount: dataFiles.length,
              alreadyInMainCount: skippedAlreadyMain.length,
              completedMissingCount: completedMissing.length,
              completedMissing
            };
            report.totalCompletedMissing += completedMissing.length;
          }

          fs.writeFileSync(
            'jichitai-compare/operations/control/regional-missing-audit-20260723.json',
            `${JSON.stringify(report, null, 2)}\n`
          );
          console.log(JSON.stringify({
            mainRegisteredCount: report.mainRegisteredCount,
            totalCompletedMissing: report.totalCompletedMissing,
            invalidMissingCount: report.invalidMissing.length,
            duplicateCount: report.duplicatesAcrossRegions.length,
            byRegion: Object.fromEntries(Object.entries(report.regions).map(([key, value]) => [key, value.completedMissingCount]))
          }, null, 2));
          NODE

      - name: Restore standard workflow and commit audit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/operations/control/regional-missing-audit-20260723.json
          git commit -m 'Audit completed regional municipalities missing from main'
          git push origin HEAD:coord/audit-regional-missing-20260723-1741
