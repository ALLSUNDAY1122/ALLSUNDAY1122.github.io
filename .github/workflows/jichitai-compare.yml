name: Build All Completed Municipalities Release

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: release-all-complete-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch regional integration branches
        run: |
          git fetch --no-tags origin \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Extract every complete unpublished municipality
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const project = 'jichitai-compare';
          const releaseAt = '2026-07-23T22:30:00+09:00';
          const checkedAt = '2026-07-23';
          const regions = [
            { region: 'north', team: '北日本調査班', ref: 'origin/region/north' },
            { region: 'east', team: '東日本調査班', ref: 'origin/region/east' },
            { region: 'central', team: '中日本調査班', ref: 'origin/region/central' },
            { region: 'west', team: '西日本調査班', ref: 'origin/region/west' }
          ];

          function git(...args) {
            return execFileSync('git', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          }

          function showJson(ref, file) {
            return JSON.parse(git('show', `${ref}:${file}`));
          }

          const progressPath = path.join(project, 'operations', 'progress.json');
          const previousProgress = JSON.parse(fs.readFileSync(progressPath, 'utf8'));
          const existingTaskDir = path.join(project, 'operations', 'tasks');
          const existingCodes = new Set(
            fs.readdirSync(existingTaskDir)
              .filter((name) => /^\d{5}\.json$/u.test(name))
              .map((name) => name.slice(0, 5))
          );

          const selected = [];
          const seen = new Set();
          const excluded = [];

          for (const region of regions) {
            const listing = git(
              'ls-tree', '-r', '--name-only', region.ref,
              `${project}/operations/tasks`
            ).trim();

            for (const taskPath of listing ? listing.split('\n') : []) {
              if (!/\/\d{5}\.json$/u.test(taskPath)) continue;

              let task;
              try {
                task = showJson(region.ref, taskPath);
              } catch (error) {
                excluded.push({ region: region.region, taskPath, reason: `task parse: ${error.message}` });
                continue;
              }

              const code = task?.municipalityCode;
              if (!/^\d{5}$/u.test(code ?? '')) continue;
              if (existingCodes.has(code) || seen.has(code)) continue;

              const blockers = Array.isArray(task.blockers) ? task.blockers : [];
              const completed = Array.isArray(task.completedServices) ? task.completedServices : [];
              if (blockers.length || completed.length !== 9) {
                excluded.push({ region: region.region, code, reason: 'task incomplete or blocked' });
                continue;
              }

              if (['todo', 'researching', 'needs_medium_review', 'needs_revision', 'needs_coordinator', 'blocked'].includes(task.status)) {
                excluded.push({ region: region.region, code, reason: `task status ${task.status}` });
                continue;
              }

              const prefectureCode = task.prefectureCode;
              const municipalityPath = `${project}/data/municipalities/${prefectureCode}/${code}.json`;
              let municipality;
              try {
                municipality = showJson(region.ref, municipalityPath);
              } catch (error) {
                excluded.push({ region: region.region, code, reason: `municipality missing: ${error.message}` });
                continue;
              }

              const services = Object.entries(municipality?.services ?? {});
              if (services.length !== 9 || !services.every(([, service]) => ['verified', 'unavailable'].includes(service?.status))) {
                excluded.push({ region: region.region, code, reason: 'service statuses are not fully publishable' });
                continue;
              }

              fs.mkdirSync(path.dirname(municipalityPath), { recursive: true });
              fs.writeFileSync(municipalityPath, `${JSON.stringify(municipality, null, 2)}\n`);

              const normalizedTask = {
                ...task,
                status: 'merged',
                currentService: null,
                nextServiceIndex: 9,
                pullRequestNumber: null,
                lastCheckedAt: checkedAt,
                lastUpdatedAt: releaseAt,
                lastUpdatedBy: `${task.lastUpdatedBy || region.team}・統括⑤全国統合`,
                blockers: [],
                notes: [
                  ...(Array.isArray(task.notes) ? task.notes : []),
                  '4地方全件監査によりmain未公開の完了自治体として全国統合。'
                ]
              };
              fs.writeFileSync(taskPath, `${JSON.stringify(normalizedTask, null, 2)}\n`);

              selected.push({
                region: region.region,
                team: region.team,
                code,
                name: municipality.name,
                prefectureCode,
                prefecture: municipality.prefecture,
                sourceTaskStatus: task.status,
                sourcePullRequestNumber: task.pullRequestNumber ?? null
              });
              seen.add(code);
            }
          }

          selected.sort((a, b) => a.code.localeCompare(b.code));
          if (!selected.length) {
            throw new Error('公開可能なmain未登録自治体がありません。');
          }

          const byRegion = Object.fromEntries(
            regions.map(({ region }) => [region, selected.filter((item) => item.region === region).length])
          );
          const manifest = {
            schemaVersion: '1.0.0',
            createdAt: releaseAt,
            previousPublishedMunicipalities: previousProgress.registeredMunicipalities,
            selectedMunicipalities: selected.length,
            byRegion,
            municipalities: selected,
            excludedCount: excluded.length,
            excluded
          };
          const manifestPath = path.join(project, 'operations', 'control', 'release-all-complete-manifest-20260723-2230.json');
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify({ selected: selected.length, byRegion }, null, 2));
          NODE

      - name: Generate and validate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js

      - name: Update displayed municipality count
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('jichitai-compare/operations/control/release-all-complete-manifest-20260723-2230.json', 'utf8'));
          const progress = JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json', 'utf8'));
          const oldCount = manifest.previousPublishedMunicipalities;
          const newCount = progress.registeredMunicipalities;
          const indexPath = 'jichitai-compare/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(new RegExp(`${oldCount}自治体`, 'g'), `${newCount}自治体`);
          fs.writeFileSync(indexPath, html);
          console.log(`${oldCount}自治体から${newCount}自治体へ表示を更新しました。`);
          NODE

      - name: Restore standard CI workflow
        run: git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml

      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          if git diff --cached --quiet; then
            echo '公開差分がありません。'
            exit 1
          fi
          git commit -m 'release: publish all completed municipalities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
