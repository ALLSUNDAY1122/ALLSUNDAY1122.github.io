name: Build East Remaining Audit 1230
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Audit east remaining municipalities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/east
          python <<'PY'
          import concurrent.futures, json, math, re, subprocess, time, urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup

          source_url='https://www.e-stat.go.jp/municipalities/cities/areacode?year=2026&month=1&day=1'
          prefectures={'01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県','08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県','15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県','22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県','29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県','36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県','43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'}
          excluded={'01695','01696','01697','01698','01699','01700'}
          east_prefectures={'08','09','10','11','12','13','14','15','19','20'}
          east_a_prefectures={'10','13','19','20'}

          def fetch_page(page):
              url=source_url+f'&page={page}'
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 municipality-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as response:
                          return page,response.read().decode('utf-8','replace')
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              pages=dict(executor.map(fetch_page,range(1,97)))

          text=BeautifulSoup(pages[1],'html.parser').get_text(' ',strip=True)
          match=re.search(r'全([\d,]+)件',text)
          if not match or math.ceil(int(match.group(1).replace(',',''))/20)!=96:
              raise RuntimeError('unexpected e-Stat result pagination')

          official={}
          for page in range(1,97):
              soup=BeautifulSoup(pages[page],'html.parser')
              left=soup.select_one('table.stat-areacode-list-table.__fix')
              right=next((table for table in soup.select('table.stat-areacode-list-table') if '__fix' not in (table.get('class') or [])),None)
              if left is None or right is None:
                  raise RuntimeError(f'page {page}: synchronized tables not found')
              codes=[cell.get_text(strip=True) for cell in left.select('tbody td.htCode')]
              detail_rows=right.select('tbody > tr')
              if len(codes)!=len(detail_rows):
                  raise RuntimeError(f'page {page}: code/detail row mismatch {len(codes)} != {len(detail_rows)}')
              for code,row in zip(codes,detail_rows):
                  if not re.fullmatch(r'\d{5}',code) or code in excluded or code[:2] not in prefectures:
                      continue
                  parent=(row.select_one('td.parentCityNm').get_text(strip=True) if row.select_one('td.parentCityNm') else '')
                  self_name=(row.select_one('td.selfCityNm').get_text(strip=True) if row.select_one('td.selfCityNm') else '')
                  name=self_name or parent
                  if not name:continue
                  if name.endswith('区') and not ('13101'<=code<='13123'):continue
                  if not (name.endswith(('市','町','村')) or ('13101'<=code<='13123')):continue
                  official[code]={'code':code,'name':name,'prefectureCode':code[:2],'prefecture':prefectures[code[:2]]}

          if len(official)!=1741:
              counts={p:sum(item['prefectureCode']==p for item in official.values()) for p in prefectures}
              raise RuntimeError(f'official municipality count mismatch: {len(official)}; {counts}')
          official_east={code:item for code,item in official.items() if item['prefectureCode'] in east_prefectures}
          if len(official_east)!=450:raise RuntimeError(f'east count mismatch: {len(official_east)}')

          main_codes={path.stem for path in Path('jichitai-compare/data/municipalities').glob('*/*.json')}
          region_files=subprocess.check_output(['git','ls-tree','-r','--name-only','origin/region/east','--','jichitai-compare/data/municipalities'],text=True).splitlines()
          region_codes={Path(path).stem for path in region_files if re.search(r'/\d{5}\.json$',path)}
          heads=subprocess.check_output(['git','ls-remote','--heads','origin','refs/heads/data/*'],text=True).splitlines()
          branches_by_code={}
          for line in heads:
              ref=line.split('\t',1)[1].removeprefix('refs/heads/')
              branch_match=re.search(r'(\d{5})',ref)
              if branch_match:branches_by_code.setdefault(branch_match.group(1),[]).append(ref)

          published=sorted(set(official_east)&main_codes)
          regional_codes=sorted((set(official_east)&region_codes)-main_codes)
          remaining_codes=sorted(set(official_east)-main_codes-set(regional_codes))

          def enrich(code,state=None):
              item=dict(official_east[code])
              item['sessionId']='east-a' if item['prefectureCode'] in east_a_prefectures else 'east-b'
              item['existingDataBranches']=sorted(branches_by_code.get(code,[]))
              item['state']=state or ('branch_exists' if item['existingDataBranches'] else 'unstarted')
              return item

          remaining=[enrich(code) for code in remaining_codes]
          regional=[enrich(code,'regional_complete_unpublished') for code in regional_codes]
          east_a=[item for item in remaining if item['sessionId']=='east-a']
          east_b=[item for item in remaining if item['sessionId']=='east-b']
          by_prefecture=[]
          for code in sorted(east_prefectures):
              assigned=sum(item['prefectureCode']==code for item in official_east.values())
              published_count=sum(item['prefectureCode']==code and item['code'] in main_codes for item in official_east.values())
              remaining_count=sum(item['prefectureCode']==code for item in remaining)
              by_prefecture.append({'prefectureCode':code,'prefecture':prefectures[code],'assigned':assigned,'published':published_count,'remaining':remaining_count})

          report={'schemaVersion':'1.0.0','createdAt':'2026-07-24T12:30:00+09:00','source':{'authority':'政府統計の総合窓口 e-Stat','asOf':'2026-01-01','url':source_url,'officialMunicipalityCount':len(official)},'scope':{'team':'東日本調査班','prefectureCodes':sorted(east_prefectures),'assignedMunicipalities':len(official_east)},'summary':{'publishedMunicipalities':len(published),'regionalCompleteUnpublishedMunicipalities':len(regional),'remainingMunicipalities':len(remaining),'eastARemaining':len(east_a),'eastBRemaining':len(east_b),'unstarted':sum(item['state']=='unstarted' for item in remaining),'branchExists':sum(item['state']=='branch_exists' for item in remaining)},'nextTargets':{'east-a':next((item for item in east_a if item['state']=='unstarted'),east_a[0] if east_a else None),'east-b':next((item for item in east_b if item['state']=='unstarted'),east_b[0] if east_b else None)},'byPrefecture':by_prefecture,'regionalCompleteUnpublished':regional,'remaining':remaining}
          if len(published)!=396 or len(remaining)+len(regional)!=54:
              raise RuntimeError(f'east progress mismatch: {report["summary"]}')
          Path('jichitai-compare/operations/control/east-remaining-audit-20260724.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          for debug in ['jichitai-compare/operations/control/east-remaining-audit-debug-20260724.json','jichitai-compare/operations/control/e-stat-dom-debug-20260724.json']:
              Path(debug).unlink(missing_ok=True)
          print(json.dumps(report['summary'],ensure_ascii=False))
          print(json.dumps(report['nextTargets'],ensure_ascii=False))
          PY
      - name: Validate project
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Commit audit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record authoritative east remaining municipality audit'
          git push origin HEAD
