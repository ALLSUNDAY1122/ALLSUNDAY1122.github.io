name: Publish West Four Municipalities

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch west branch
        run: git fetch --no-tags origin +refs/heads/region/west:refs/remotes/origin/region/west
      - name: Copy four municipalities
        run: |
          for code in 33213 33423 33445 42383; do
            pref="${code:0:2}"
            mkdir -p "jichitai-compare/data/municipalities/${pref}" jichitai-compare/operations/tasks
            git show "origin/region/west:jichitai-compare/data/municipalities/${pref}/${code}.json" > "jichitai-compare/data/municipalities/${pref}/${code}.json"
            git show "origin/region/west:jichitai-compare/operations/tasks/${code}.json" > "jichitai-compare/operations/tasks/${code}.json"
          done
          node <<'NODE'
          const fs=require('node:fs');
          const codes=['33213','33423','33445','42383'];
          const items=[];
          for(const code of codes){
            const taskFile=`jichitai-compare/operations/tasks/${code}.json`;
            const task=JSON.parse(fs.readFileSync(taskFile,'utf8'));
            const municipalityFile=`jichitai-compare/data/municipalities/${task.prefectureCode}/${code}.json`;
            const municipality=JSON.parse(fs.readFileSync(municipalityFile,'utf8'));
            const services=Object.entries(municipality.services??{});
            if(services.length!==9||!services.every(([,s])=>['verified','unavailable'].includes(s.status)))throw new Error(`${code}: 公開可能状態ではありません`);
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.pullRequestNumber=null;task.blockers=[];
            task.lastCheckedAt='2026-07-23';task.lastUpdatedAt='2026-07-23T23:56:00+09:00';task.lastUpdatedBy=`${task.lastUpdatedBy||'西日本調査班'}・統括⑤全国統合`;
            task.notes=[...(task.notes??[]),'公開除外解消または地方統合完了を確認しmainへ全国統合。'];
            fs.writeFileSync(taskFile,JSON.stringify(task,null,2)+'\n');
            items.push({code,name:municipality.name,prefecture:municipality.prefecture,sourcePullRequestNumber:code==='42383'?1486:1485});
          }
          const progress=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8'));
          const manifest={schemaVersion:'1.0.0',createdAt:'2026-07-23T23:56:00+09:00',previousPublishedMunicipalities:progress.registeredMunicipalities,selectedMunicipalities:items.length,byRegion:{west:items.length},municipalities:items};
          fs.writeFileSync('jichitai-compare/operations/control/release-west-4-manifest-20260723.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js
      - name: Update index
        working-directory: jichitai-compare
        run: node -e "const fs=require('fs');const m=require('./operations/control/release-west-4-manifest-20260723.json');const p=require('./operations/progress.json');let h=fs.readFileSync('index.html','utf8');h=h.replace(new RegExp(m.previousPublishedMunicipalities+'自治体','g'),p.registeredMunicipalities+'自治体');fs.writeFileSync('index.html',h)"
      - name: Restore workflow and commit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'release: publish four west municipalities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
