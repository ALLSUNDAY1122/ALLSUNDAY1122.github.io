name: Build North-East Release 0641

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch regional branches
        run: git fetch origin main region/north region/east
      - name: Extract publishable north/east municipalities
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/selected.tsv
          for region in north east; do
            git ls-tree -r --name-only "origin/region/$region" -- jichitai-compare/data/municipalities | grep -E '/[0-9]{5}\.json$' | while read -r file; do
              if ! git cat-file -e "HEAD:$file" 2>/dev/null; then
                mkdir -p "$(dirname "$file")"; git show "origin/region/$region:$file" > "$file"
                code="$(basename "$file" .json)"; task="jichitai-compare/operations/tasks/$code.json"
                mkdir -p "$(dirname "$task")"; git show "origin/region/$region:$task" > "$task"
                printf '%s\t%s\n' "$region" "$code" >> /tmp/selected.tsv
              fi
            done
          done
          node <<'NODE'
          const fs=require('fs');
          const rows=fs.readFileSync('/tmp/selected.tsv','utf8').trim().split(/\r?\n/).filter(Boolean).map(x=>x.split('\t'));
          const previous=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8')).registeredMunicipalities;
          const municipalities=[];
          for(const [region,code] of rows){const dp=`jichitai-compare/data/municipalities/${code.slice(0,2)}/${code}.json`;const tp=`jichitai-compare/operations/tasks/${code}.json`;const data=JSON.parse(fs.readFileSync(dp,'utf8'));const task=JSON.parse(fs.readFileSync(tp,'utf8'));task.status='merged';task.lastUpdatedAt='2026-07-24T06:42:00+09:00';const u='統括A';if(Array.isArray(task.lastUpdatedBy)){if(!task.lastUpdatedBy.includes(u))task.lastUpdatedBy.push(u)}else if(typeof task.lastUpdatedBy==='string'&&task.lastUpdatedBy){if(!task.lastUpdatedBy.includes(u))task.lastUpdatedBy+=`, ${u}`}else task.lastUpdatedBy=u;fs.writeFileSync(tp,JSON.stringify(task)+'\n');municipalities.push({region,team:region==='north'?'北日本調査班':'東日本調査班',code,name:data.name,prefecture:data.prefecture,sourcePullRequestNumber:task.pullRequestNumber??null});}
          municipalities.sort((a,b)=>a.code.localeCompare(b.code));
          const m={schemaVersion:'1.0.0',createdAt:'2026-07-24T06:42:00+09:00',previousPublishedMunicipalities:previous,selectedMunicipalities:municipalities.length,byRegion:{north:municipalities.filter(x=>x.region==='north').length,east:municipalities.filter(x=>x.region==='east').length},municipalities,excludedCount:0,excluded:[]};
          fs.writeFileSync('jichitai-compare/operations/control/coord-a-release-north-east-20260724-0641.json',JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Update homepage count
        run: node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8')),f='jichitai-compare/index.html';let h=fs.readFileSync(f,'utf8');fs.writeFileSync(f,h.replace(/\\d+自治体・9制度/g,p.registeredMunicipalities+'自治体・9制度'))"
      - name: Restore standard workflow and commit release
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'Publish latest north and east municipalities'; git push origin HEAD
