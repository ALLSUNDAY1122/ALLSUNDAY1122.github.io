name: Jichitai Compare CI

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'
  push:
    branches:
      - main
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jichitai-compare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rebuild and merge West-A final sync
    if: github.head_ref == 'sync/main-west-a-source-links-final-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild, validate, and merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          copy_west_a_files() {
            for path in \
              jichitai-compare/data/municipalities/33/33213.json \
              jichitai-compare/data/municipalities/33/33346.json \
              jichitai-compare/data/municipalities/37/37324.json \
              jichitai-compare/data/municipalities/40/40224.json \
              jichitai-compare/data/municipalities/40/40610.json \
              jichitai-compare/data/municipalities/40/40646.json \
              jichitai-compare/data/municipalities/43/43443.json \
              jichitai-compare/data/municipalities/46/46533.json \
              jichitai-compare/operations/tasks/33213.json \
              jichitai-compare/operations/tasks/33346.json \
              jichitai-compare/operations/tasks/37324.json \
              jichitai-compare/operations/tasks/40224.json \
              jichitai-compare/operations/tasks/40610.json \
              jichitai-compare/operations/tasks/40646.json \
              jichitai-compare/operations/tasks/43443.json \
              jichitai-compare/operations/tasks/46533.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-batch01-20260725.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-batch02-20260725.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-final-20260725.json
            do
              mkdir -p "$(dirname "$path")"
              git show "origin/region/west:$path" > "$path"
            done
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5
          do
            echo "Atomic rebuild attempt ${attempt}"
            git fetch origin main region/west
            BASE_SHA="$(git rev-parse origin/main)"
            git reset --hard "$BASE_SHA"
            copy_west_a_files

            cd jichitai-compare
            npm run generate
            npm run progress
            SCOPE_BASE_SHA="$BASE_SHA" SCOPE_HEAD_SHA=HEAD npm run check:scope
            npm run validate:generated
            node --check app.js
            node --check scripts/generate-municipality-pages.mjs
            node --check scripts/validate-municipality-pages.mjs
            node --check scripts/smoke-public-site.mjs
            cd ..

            git add \
              jichitai-compare/data/municipalities/33/33213.json \
              jichitai-compare/data/municipalities/33/33346.json \
              jichitai-compare/data/municipalities/37/37324.json \
              jichitai-compare/data/municipalities/40/40224.json \
              jichitai-compare/data/municipalities/40/40610.json \
              jichitai-compare/data/municipalities/40/40646.json \
              jichitai-compare/data/municipalities/43/43443.json \
              jichitai-compare/data/municipalities/46/46533.json \
              jichitai-compare/operations/tasks/33213.json \
              jichitai-compare/operations/tasks/33346.json \
              jichitai-compare/operations/tasks/37324.json \
              jichitai-compare/operations/tasks/40224.json \
              jichitai-compare/operations/tasks/40610.json \
              jichitai-compare/operations/tasks/40646.json \
              jichitai-compare/operations/tasks/43443.json \
              jichitai-compare/operations/tasks/46533.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-batch01-20260725.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-batch02-20260725.json \
              jichitai-compare/operations/audits/west-a-source-link-remediation-final-20260725.json \
              jichitai-compare/data/generated/municipalities.json \
              jichitai-compare/data/generated/municipality-pages.json \
              jichitai-compare/operations/progress.json \
              jichitai-compare/municipality/33213/index.html \
              jichitai-compare/municipality/33346/index.html \
              jichitai-compare/municipality/37324/index.html \
              jichitai-compare/municipality/40224/index.html \
              jichitai-compare/municipality/40610/index.html \
              jichitai-compare/municipality/40646/index.html \
              jichitai-compare/municipality/43443/index.html \
              jichitai-compare/municipality/46533/index.html \
              jichitai-compare/sitemap.xml

            git commit -m 'fix: 西日本A公式出典監査の全修正を最新mainへ同期'
            HEAD_SHA="$(git rev-parse HEAD)"
            git push --force-with-lease origin "HEAD:${{ github.event.pull_request.head.ref }}"

            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
              echo 'main advanced during validation; rebuilding again.'
              continue
            fi

            sleep 3
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/3106/merge" \
              -f merge_method=merge \
              -f sha="$HEAD_SHA"
            exit 0
          done

          echo 'main kept advancing through all rebuild attempts.'
          exit 1
