name: Publish Latest Completed Municipalities

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch regions
        run: |
          git fetch --no-tags origin \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
      - name: Extract complete municipalities
        working-directory: jichitai-compare
        env:
          RELEASE_AT: '2026-07-23T23:44:00+09:00'
          MANIFEST_NAME: 'release-all-complete-manifest-20260723-2344.json'
        run: node scripts/publish-complete-snapshot.mjs
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js
      - name: Update index
        working-directory: jichitai-compare
        run: |
          node -e "const fs=require('fs');const m=require('./operations/control/release-all-complete-manifest-20260723-2344.json');const p=require('./operations/progress.json');let h=fs.readFileSync('index.html','utf8');h=h.replace(new RegExp(m.previousPublishedMunicipalities+'自治体','g'),p.registeredMunicipalities+'自治体');fs.writeFileSync('index.html',h)"
      - name: Restore workflow and commit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          rm jichitai-compare/scripts/publish-complete-snapshot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'release: publish latest completed municipalities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
