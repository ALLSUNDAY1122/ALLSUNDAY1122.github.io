name: Rebuild Shirakawa Municipality PR

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-shirakawa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch source and base branches
        run: |
          git fetch --no-tags origin \
            +refs/heads/data/07205-shirakawa:refs/remotes/origin/data/07205-shirakawa \
            +refs/heads/region/north:refs/remotes/origin/region/north

      - name: Copy validated Shirakawa files
        run: |
          mkdir -p jichitai-compare/data/municipalities/07 jichitai-compare/operations/tasks
          git show origin/data/07205-shirakawa:jichitai-compare/data/municipalities/07/07205.json > jichitai-compare/data/municipalities/07/07205.json
          git show origin/data/07205-shirakawa:jichitai-compare/operations/tasks/07205.json > jichitai-compare/operations/tasks/07205.json
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'jichitai-compare/operations/tasks/07205.json';
          const task = JSON.parse(fs.readFileSync(file, 'utf8'));
          task.status = 'pr_open';
          task.currentService = null;
          task.nextServiceIndex = 9;
          task.pullRequestNumber = Number(process.env.PR_NUMBER);
          task.lastCheckedAt = '2026-07-23';
          task.lastUpdatedAt = '2026-07-23T23:04:00+09:00';
          task.lastUpdatedBy = `${task.lastUpdatedBy || '北日本調査班A'}・統括⑤競合解消`;
          task.blockers = [];
          task.notes = [
            ...(Array.isArray(task.notes) ? task.notes : []),
            '旧PR #1413がregion/northの並行更新で競合したため、最新region/northからクリーンブランチへ確定済み2ファイルを再配置。'
          ];
          fs.writeFileSync(file, `${JSON.stringify(task, null, 2)}\n`);
          NODE
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Restore standard regional CI
        run: git show origin/region/north:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml

      - name: Commit clean replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/data/municipalities/07/07205.json jichitai-compare/operations/tasks/07205.json
          git commit -m 'data: rebase Shirakawa municipality onto latest north'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
