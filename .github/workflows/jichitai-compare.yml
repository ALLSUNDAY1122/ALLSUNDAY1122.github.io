name: Build East Remaining Audit 1230
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch official municipality codes and audit east
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/east
          python <<'PY'
          import json, math, re, subprocess, time, urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup

          source_url = 'https://www.e-stat.go.jp/municipalities/cities/areacode?year=2026&month=1&day=1'
          prefectures = {
              '01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県',
              '08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県',
              '15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県',
              '22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県',
              '29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県',
              '36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県',
              '43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'
          }
          pref_names = set(prefectures.values())
          excluded = {'01695','01696','01697','01698','01699','01700'}
          official = {}
          total_pages = None
          headers = {'User-Agent':'Mozilla/5.0 municipality-audit/1.0'}

          for page in range(1, 97):
              url = source_url + f'&page={page}'
              last_error = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as response:
                          html = response.read().decode('utf-8', errors='replace')
                      break
                  except Exception as error:
                      last_error = error
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
              soup = BeautifulSoup(html, 'html.parser')
              if total_pages is None:
                  text = soup.get_text(' ', strip=True)
                  match = re.search(r'全([\d,]+)件', text)
                  if not match:
                      raise RuntimeError('e-Stat result count was not found')
                  total_rows = int(match.group(1).replace(',', ''))
                  total_pages = math.ceil(total_rows / 20)
                  if total_pages != 96:
                      raise RuntimeError(f'unexpected e-Stat page count: {total_pages}')
              for row in soup.find_all('tr'):
                  cells = [' '.join(cell.stripped_strings) for cell in row.find_all(['th','td'])]
                  code = next((cell for cell in cells if re.fullmatch(r'\d{5}', cell)), None)
                  if not code or code in excluded:
                      continue
                  prefecture = next((cell for cell in cells if cell in pref_names), None)
                  if not prefecture:
                      continue
                  names = [cell for cell in cells if re.fullmatch(r'[^\s]+[市区町村]', cell)]
                  if not names:
                      continue
                  name = names[-1]
                  if name.endswith('区') and not ('13101' <= code <= '13123'):
                      continue
                  if not (name.endswith(('市','町','村')) or ('13101' <= code <= '13123')):
                      continue
                  official[code] = {'code':code, 'name':name, 'prefectureCode':code[:2], 'prefecture':prefecture}

          if len(official) != 1741:
              counts = {}
              for item in official.values():
                  counts[item['prefectureCode']] = counts.get(item['prefectureCode'], 0) + 1
              raise RuntimeError(f'official municipality count mismatch: {len(official)}; byPrefecture={counts}')

          east_prefectures = {'08','09','10','11','12','13','14','15','19','20'}
          east_a_prefectures = {'10','13','19','20'}
          east_b_prefectures = east_prefectures - east_a_prefectures
          official_east = {code:item for code,item in official.items() if item['prefectureCode'] in east_prefectures}
          if len(official_east) != 450:
              raise RuntimeError(f'east municipality count mismatch: {len(official_east)}')

          main_codes = {path.stem for path in Path('jichitai-compare/data/municipalities').glob('*/*.json')}
          region_files = subprocess.check_output(['git','ls-tree','-r','--name-only','origin/region/east','--','jichitai-compare/data/municipalities'], text=True).splitlines()
          region_codes = {Path(path).stem for path in region_files if re.search(r'/\d{5}\.json$', path)}
          remote_heads = subprocess.check_output(['git','ls-remote','--heads','origin','refs/heads/data/*'], text=True).splitlines()
          branches_by_code = {}
          for line in remote_heads:
              ref = line.split('\t',1)[1].removeprefix('refs/heads/')
              match = re.search(r'(\d{5})', ref)
              if match:
                  branches_by_code.setdefault(match.group(1), []).append(ref)

          published = sorted(set(official_east) & main_codes)
          regional_unpublished = sorted((set(official_east) & region_codes) - main_codes)
          remaining_codes = sorted(set(official_east) - main_codes - set(regional_unpublished))

          def enrich(code):
              item = dict(official_east[code])
              item['sessionId'] = 'east-a' if item['prefectureCode'] in east_a_prefectures else 'east-b'
              item['existingDataBranches'] = sorted(branches_by_code.get(code, []))
              item['state'] = 'branch_exists' if item['existingDataBranches'] else 'unstarted'
              return item

          remaining = [enrich(code) for code in remaining_codes]
          regional = [enrich(code) | {'state':'regional_complete_unpublished'} for code in regional_unpublished]
          east_a = [item for item in remaining if item['sessionId']=='east-a']
          east_b = [item for item in remaining if item['sessionId']=='east-b']
          by_prefecture = []
          for code in sorted(east_prefectures):
              assigned = [item for item in official_east.values() if item['prefectureCode']==code]
              pub = [item for item in assigned if item['code'] in main_codes]
              rem = [item for item in remaining if item['prefectureCode']==code]
              by_prefecture.append({'prefectureCode':code,'prefecture':prefectures[code],'assigned':len(assigned),'published':len(pub),'remaining':len(rem)})

          report = {
              'schemaVersion':'1.0.0',
              'createdAt':'2026-07-24T12:30:00+09:00',
              'source':{'authority':'政府統計の総合窓口 e-Stat','asOf':'2026-01-01','url':source_url,'officialMunicipalityCount':len(official)},
              'scope':{'team':'東日本調査班','prefectureCodes':sorted(east_prefectures),'assignedMunicipalities':len(official_east)},
              'summary':{
                  'publishedMunicipalities':len(published),
                  'regionalCompleteUnpublishedMunicipalities':len(regional_unpublished),
                  'remainingMunicipalities':len(remaining),
                  'eastARemaining':len(east_a),
                  'eastBRemaining':len(east_b),
                  'unstarted':sum(item['state']=='unstarted' for item in remaining),
                  'branchExists':sum(item['state']=='branch_exists' for item in remaining)
              },
              'nextTargets':{
                  'east-a':next((item for item in east_a if item['state']=='unstarted'), east_a[0] if east_a else None),
                  'east-b':next((item for item in east_b if item['state']=='unstarted'), east_b[0] if east_b else None)
              },
              'byPrefecture':by_prefecture,
              'regionalCompleteUnpublished':regional,
              'remaining':remaining
          }
          if report['summary']['publishedMunicipalities'] != 396:
              raise RuntimeError(f"published east count mismatch: {report['summary']['publishedMunicipalities']}")
          if report['summary']['remainingMunicipalities'] + report['summary']['regionalCompleteUnpublishedMunicipalities'] != 54:
              raise RuntimeError(f"east remaining mismatch: {report['summary']}")

          output = Path('jichitai-compare/operations/control/east-remaining-audit-20260724.json')
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report['summary'], ensure_ascii=False))
          print(json.dumps(report['nextTargets'], ensure_ascii=False))
          PY
      - name: Validate project
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Commit audit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record authoritative east remaining municipality audit'
          git push origin HEAD
