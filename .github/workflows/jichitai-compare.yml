name: Jichitai Compare CI

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'
  push:
    branches:
      - main
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: jichitai-compare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate municipality data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply West-A source corrections batch02
        if: github.head_ref == 'fix/west-a-source-links-batch02-20260725'
        working-directory: jichitai-compare
        run: node scripts/apply-west-a-source-links-batch02.mjs

      - name: Commit applied West-A corrections batch02
        if: github.head_ref == 'fix/west-a-source-links-batch02-20260725'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/40/40610.json \
                  jichitai-compare/data/municipalities/40/40646.json \
                  jichitai-compare/data/municipalities/43/43443.json \
                  jichitai-compare/operations/tasks/40610.json \
                  jichitai-compare/operations/tasks/40646.json \
                  jichitai-compare/operations/tasks/43443.json \
                  jichitai-compare/operations/audits/west-a-source-link-remediation-batch02-20260725.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: 西日本Aの出典監査第2弾を反映'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Reject unrelated changes
        working-directory: jichitai-compare
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:scope

      - name: Generate public municipality data
        working-directory: jichitai-compare
        run: npm run generate

      - name: Generate national progress
        working-directory: jichitai-compare
        run: npm run progress

      - name: Validate source and generated data
        working-directory: jichitai-compare
        run: npm run validate:generated

      - name: Upload municipality identity errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: municipality-identity-errors
          path: jichitai-compare/identity-validation-errors.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Check JavaScript syntax
        working-directory: jichitai-compare
        run: |
          node --check app.js
          node --check scripts/apply-west-a-source-links-batch02.mjs

      - name: Confirm generated files are committed
        if: github.event_name == 'push'
        working-directory: jichitai-compare
        shell: bash
        run: |
          changed="$(git status --porcelain -- data/generated/municipalities.json operations/progress.json)"
          if [ -n "$changed" ]; then
            echo '生成済みファイルが最新ではありません。'
            git status --short -- data/generated/municipalities.json operations/progress.json
            exit 1
          fi

      - name: Verify published GitHub Pages site
        if: github.event_name == 'push'
        working-directory: jichitai-compare
        run: npm run smoke:public
