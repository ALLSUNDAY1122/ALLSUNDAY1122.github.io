name: Rebuild Taiji Kitayama Fix

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fetch source and base
        run: |
          git fetch --no-tags origin \
            +refs/heads/fix/central-publication-batch-6:refs/remotes/origin/fix/central-publication-batch-6 \
            +refs/heads/region/central:refs/remotes/origin/region/central
      - name: Copy four finalized files
        run: |
          for code in 30422 30427; do
            mkdir -p jichitai-compare/data/municipalities/30 jichitai-compare/operations/tasks
            git show origin/fix/central-publication-batch-6:jichitai-compare/data/municipalities/30/${code}.json > jichitai-compare/data/municipalities/30/${code}.json
            git show origin/fix/central-publication-batch-6:jichitai-compare/operations/tasks/${code}.json > jichitai-compare/operations/tasks/${code}.json
          done
          node <<'NODE'
          const fs=require('node:fs');
          for(const code of ['30422','30427']){
            const file=`jichitai-compare/operations/tasks/${code}.json`;
            const task=JSON.parse(fs.readFileSync(file,'utf8'));
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.pullRequestNumber=Number(process.env.PR_NUMBER);task.blockers=[];
            task.lastCheckedAt='2026-07-23';task.lastUpdatedAt='2026-07-23T23:38:00+09:00';task.lastUpdatedBy=`${task.lastUpdatedBy||'中日本調査班B'}・統括⑤競合解消`;
            task.notes=[...(task.notes??[]),'旧PR #1454がregion/central更新で競合したため、最新region/centralへ確定済み4ファイルを再配置。'];
            fs.writeFileSync(file,JSON.stringify(task,null,2)+'\n');
          }
          NODE
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Restore regional workflow and commit
        run: |
          git show origin/region/central:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/data/municipalities/30/30422.json jichitai-compare/data/municipalities/30/30427.json jichitai-compare/operations/tasks/30422.json jichitai-compare/operations/tasks/30427.json
          git commit -m 'fix: rebase Taiji and Kitayama publication fixes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
