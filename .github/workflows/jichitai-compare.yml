name: Coordinator Generate Public Data 545

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-public-data:
    if: github.head_ref == 'coord/generated-545-20260722-2226'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout generation branch
        uses: actions/checkout@v4
        with:
          ref: coord/generated-545-20260722-2226
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate public municipality data and progress
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress

      - name: Synchronize published municipality count
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          const count = progress.registeredMunicipalities;
          if (count !== 545) throw new Error(`expected 545 municipalities, found ${count}`);
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/<span>\d+自治体・9制度<\/span>/u, `<span>${count}自治体・9制度</span>`);
          html = html.replace(/<li>登録状況：\d+自治体の生成データを公開中<\/li>/u, `<li>登録状況：${count}自治体の生成データを公開中</li>`);
          fs.writeFileSync('index.html', html);
          NODE

      - name: Validate generated data
        working-directory: jichitai-compare
        run: |
          npm run validate:generated
          npm run validate:sessions
          node --check app.js

      - name: Restore standard workflow and commit
        run: |
          git show HEAD^:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/index.html
          git commit -m 'Synchronize public data for 545 municipalities'
          git push origin HEAD:coord/generated-545-20260722-2226
