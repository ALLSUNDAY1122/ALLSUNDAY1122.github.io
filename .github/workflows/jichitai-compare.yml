name: Build Central Final Six Municipalities

on:
  pull_request:
    branches: [region/central]
    paths: ['.github/workflows/jichitai-compare.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest central baseline
        run: git fetch origin region/central
      - name: Create final six municipality records
        working-directory: jichitai-compare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const checkedAt='2026-07-24';
          const branch='data/central-final-six-20260724';
          const ids=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const elig={childMedical:{minAgeMonths:0,maxAgeYears:18},sickChildCare:{minAgeMonths:0,maxAgeYears:12},childcareFee:{minAgeMonths:0,maxAgeYears:5},schoolMeals:{minAgeMonths:72,maxAgeYears:15},postpartumCare:{minAgeMonths:0,maxAgeYears:1},temporaryChildcare:{minAgeMonths:0,maxAgeYears:5},housingSupport:{minAgeMonths:0,maxAgeYears:120},bulkyWaste:{minAgeMonths:0,maxAgeYears:120},disasterPrevention:{minAgeMonths:0,maxAgeYears:120}};
