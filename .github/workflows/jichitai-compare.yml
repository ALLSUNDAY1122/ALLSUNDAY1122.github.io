name: Build Latest Completed Municipalities Release

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: latest-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch regional integration branches
        run: |
          git fetch --no-tags origin \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Extract all complete unpublished municipalities
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const project = 'jichitai-compare';
          const releaseAt = '2026-07-23T23:08:00+09:00';
          const regions = [
            { region: 'north', team: '北日本調査班', ref: 'origin/region/north' },
            { region: 'east', team: '東日本調査班', ref: 'origin/region/east' },
            { region: 'central', team: '中日本調査班', ref: 'origin/region/central' },
            { region: 'west', team: '西日本調査班', ref: 'origin/region/west' }
          ];
          function git(...args) { return execFileSync('git', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }); }
          function showJson(ref, file) { return JSON.parse(git('show', `${ref}:${file}`)); }
          const progress = JSON.parse(fs.readFileSync(`${project}/operations/progress.json`, 'utf8'));
          const existing = new Set(fs.readdirSync(`${project}/operations/tasks`).filter(n => /^\d{5}\.json$/u.test(n)).map(n => n.slice(0, 5)));
          const selected = [];
          const seen = new Set();
          for (const region of regions) {
            const listing = git('ls-tree', '-r', '--name-only', region.ref, `${project}/operations/tasks`).trim();
            for (const taskPath of listing ? listing.split('\n') : []) {
              if (!/\/\d{5}\.json$/u.test(taskPath)) continue;
              let task;
              try { task = showJson(region.ref, taskPath); } catch { continue; }
              const code = task?.municipalityCode;
              if (!/^\d{5}$/u.test(code ?? '') || existing.has(code) || seen.has(code)) continue;
              const completed = Array.isArray(task.completedServices) ? task.completedServices : [];
              const blockers = Array.isArray(task.blockers) ? task.blockers : [];
              if (completed.length !== 9 || blockers.length) continue;
              const municipalityPath = `${project}/data/municipalities/${task.prefectureCode}/${code}.json`;
              let municipality;
              try { municipality = showJson(region.ref, municipalityPath); } catch { continue; }
              const services = Object.entries(municipality?.services ?? {});
              if (services.length !== 9 || !services.every(([, s]) => ['verified', 'unavailable'].includes(s?.status))) continue;
              fs.mkdirSync(path.dirname(municipalityPath), { recursive: true });
              fs.writeFileSync(municipalityPath, `${JSON.stringify(municipality, null, 2)}\n`);
              const normalizedTask = {
                ...task,
                status: 'merged', currentService: null, nextServiceIndex: 9,
                pullRequestNumber: null, blockers: [],
                lastCheckedAt: '2026-07-23', lastUpdatedAt: releaseAt,
                lastUpdatedBy: `${task.lastUpdatedBy || region.team}・統括⑤全国統合`,
                notes: [...(Array.isArray(task.notes) ? task.notes : []), '最新地方統合済み全件監査によりmainへ全国統合。']
              };
              fs.writeFileSync(taskPath, `${JSON.stringify(normalizedTask, null, 2)}\n`);
              selected.push({ region: region.region, team: region.team, code, name: municipality.name, prefecture: municipality.prefecture, sourcePullRequestNumber: task.pullRequestNumber ?? null });
              seen.add(code);
            }
          }
          selected.sort((a, b) => a.code.localeCompare(b.code));
          if (!selected.length) throw new Error('公開可能な新規自治体がありません。');
          const byRegion = Object.fromEntries(regions.map(r => [r.region, selected.filter(x => x.region === r.region).length]));
          const manifest = { schemaVersion: '1.0.0', createdAt: releaseAt, previousPublishedMunicipalities: progress.registeredMunicipalities, selectedMunicipalities: selected.length, byRegion, municipalities: selected };
          fs.writeFileSync(`${project}/operations/control/release-all-complete-manifest-20260723-2308.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Generate and validate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js

      - name: Update displayed municipality count
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('jichitai-compare/operations/control/release-all-complete-manifest-20260723-2308.json', 'utf8'));
          const progress = JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json', 'utf8'));
          const file = 'jichitai-compare/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace(new RegExp(`${manifest.previousPublishedMunicipalities}自治体`, 'g'), `${progress.registeredMunicipalities}自治体`);
          fs.writeFileSync(file, html);
          NODE

      - name: Restore standard CI workflow
        run: git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml

      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'release: publish latest completed municipalities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
