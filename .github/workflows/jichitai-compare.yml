name: Build North-East Release 10

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: north-east-release-10-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event.pull_request.head.ref == 'coord/north-east-release-10-20260723-2215'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: coord/north-east-release-10-20260723-2215
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch regional snapshots
        shell: bash
        run: |
          git fetch origin main region/north region/east

          copy_file() {
            ref="$1"
            path="$2"
            mkdir -p "$(dirname "$path")"
            git show "origin/${ref}:${path}" > "$path"
          }

          for code in 07203 05215 07202 07201 05214; do
            pref="${code:0:2}"
            copy_file region/north "jichitai-compare/data/municipalities/${pref}/${code}.json"
            copy_file region/north "jichitai-compare/operations/tasks/${code}.json"
          done

          for code in 11231 19210 19209 19208 19207; do
            pref="${code:0:2}"
            copy_file region/east "jichitai-compare/data/municipalities/${pref}/${code}.json"
            copy_file region/east "jichitai-compare/operations/tasks/${code}.json"
          done

      - name: Normalize merged task state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const codes = ['07203','05215','07202','07201','05214','11231','19210','19209','19208','19207'];
          for (const code of codes) {
            const path = `jichitai-compare/operations/tasks/${code}.json`;
            const task = JSON.parse(fs.readFileSync(path, 'utf8'));
            task.status = 'merged';
            task.currentService = null;
            task.lastUpdatedAt = '2026-07-23T22:20:00+09:00';
            task.lastUpdatedBy = task.lastUpdatedBy?.includes('統括A') ? task.lastUpdatedBy : `${task.lastUpdatedBy || task.assignedTeam}・統括A`;
            task.blockers = [];
            fs.writeFileSync(path, `${JSON.stringify(task)}\n`);
          }
          NODE

      - name: Generate release manifest
        shell: bash
        run: |
          cat > jichitai-compare/operations/control/north-east-release-manifest-20260723-2215.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "releaseId": "north-east-release-10-20260723-2215",
            "coordinator": "統括A",
            "createdAt": "2026-07-23T22:20:00+09:00",
            "basePublishedMunicipalities": 874,
            "municipalityCodes": ["07203", "05215", "07202", "07201", "05214", "11231", "19210", "19209", "19208", "19207"],
            "regions": {
              "north": ["07203", "05215", "07202", "07201", "05214"],
              "east": ["11231", "19210", "19209", "19208", "19207"]
            }
          }
          JSON

      - name: Generate and validate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js

      - name: Update displayed municipality count
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json', 'utf8'));
          const count = progress.registeredMunicipalities;
          const path = 'jichitai-compare/index.html';
          const html = fs.readFileSync(path, 'utf8').replace(/\d+自治体・9制度/g, `${count}自治体・9制度`);
          fs.writeFileSync(path, html);
          console.log(`index.htmlを${count}自治体へ更新`);
          NODE

      - name: Restore standard CI workflow
        shell: bash
        run: git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml

      - name: Commit generated release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m 'release: 北日本・東日本10自治体を全国公開へ反映'
          git push origin HEAD:coord/north-east-release-10-20260723-2215
