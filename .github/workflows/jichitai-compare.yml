name: Publish Two Complete Municipalities

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch official regional branches
        run: git fetch origin main region/east region/west
      - name: Copy complete municipalities only
        shell: bash
        run: |
          set -euo pipefail
          for item in 'east 15586' 'west 46206'; do
            set -- $item
            region="$1"; code="$2"; pref="${code:0:2}"
            data="jichitai-compare/data/municipalities/$pref/$code.json"
            task="jichitai-compare/operations/tasks/$code.json"
            mkdir -p "$(dirname "$data")" "$(dirname "$task")"
            git show "origin/region/$region:$data" > "$data"
            git show "origin/region/$region:$task" > "$task"
          done
          node <<'NODE'
          const fs = require('fs');
          for (const code of ['15586','46206']) {
            const dataPath = `jichitai-compare/data/municipalities/${code.slice(0,2)}/${code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${code}.json`;
            const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            const services = data.services ?? {};
            const keys = Object.keys(services);
            const nonTerminal = keys.filter((key) => !['verified','unavailable'].includes(services[key]?.status));
            if (keys.length !== 9 || nonTerminal.length > 0) throw new Error(`${code} is not publication-ready: ${nonTerminal.join(',')}`);
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            task.status = 'merged';
            task.currentService = null;
            task.nextServiceIndex = 9;
            task.completedServices = keys;
            task.verifiedCount = keys.filter((key) => services[key]?.status === 'verified').length;
            task.researchingCount = 0;
            task.unavailableCount = keys.filter((key) => services[key]?.status === 'unavailable').length;
            task.needsMediumReviewCount = 0;
            task.lastUpdatedAt = '2026-07-24T21:05:00+09:00';
            task.lastUpdatedBy = '全国統括';
            task.blockers = [];
            fs.writeFileSync(taskPath, `${JSON.stringify(task)}\n`);
          }
          NODE
      - name: Install strengthened identity validation
        run: |
          git show origin/region/west:jichitai-compare/scripts/validate-municipality-identity.mjs > jichitai-compare/scripts/validate-municipality-identity.mjs
          git show origin/region/west:jichitai-compare/package.json > jichitai-compare/package.json
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('operations/progress.json','utf8'));
          if(p.registeredMunicipalities!==1660||p.remainingMunicipalities!==81) throw new Error(`unexpected progress ${p.registeredMunicipalities}/${p.remainingMunicipalities}`);
          if(p.needsMediumReviewServices!==0) throw new Error(`publication contains ${p.needsMediumReviewServices} review services`);
          NODE
      - name: Update release records
        run: |
          node <<'NODE'
          const fs=require('fs');
          const progress=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8'));
          const municipalities=['15586','46206'].map(code=>{
            const data=JSON.parse(fs.readFileSync(`jichitai-compare/data/municipalities/${code.slice(0,2)}/${code}.json`,'utf8'));
            const task=JSON.parse(fs.readFileSync(`jichitai-compare/operations/tasks/${code}.json`,'utf8'));
            return {code,name:data.name,prefecture:data.prefecture,sourcePullRequestNumber:task.pullRequestNumber??null};
          });
          fs.writeFileSync('jichitai-compare/operations/control/complete-two-release-20260724.json',JSON.stringify({schemaVersion:'1.0.0',createdAt:'2026-07-24T21:05:00+09:00',previousPublishedMunicipalities:1658,addedMunicipalities:2,municipalities,publishedMunicipalities:progress.registeredMunicipalities,remainingMunicipalities:progress.remainingMunicipalities},null,2)+'\n');
          const index='jichitai-compare/index.html';
          fs.writeFileSync(index,fs.readFileSync(index,'utf8').replace(/\d+自治体・9制度/g,`${progress.registeredMunicipalities}自治体・9制度`));
          NODE
      - name: Restore standard CI and commit
        run: |
          git show origin/region/west:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish Awashimaura and Akune as complete municipalities'
          git push origin HEAD
