name: Correct North-East Audit 1605
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Correct assigned counts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='jichitai-compare/operations/control/coord-a-completion-audit-20260724-1605.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.regions.east.expectedMunicipalities=450;
          r.regions.east.notYetInRegionCount=450-r.regions.east.regionMunicipalities;
          r.regions.east.unpublishedButInRegionCount=r.regions.east.missingInMain.length;
          r.summary.expectedMunicipalities=856;
          r.summary.notYetInRegionCount=r.regions.north.expectedMunicipalities-r.regions.north.regionMunicipalities+r.regions.east.notYetInRegionCount;
          r.summary.unpublishedButInRegionCount=r.regions.north.missingInMain.length+r.regions.east.missingInMain.length;
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
      - name: Restore CI and commit correction
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/operations/control/coord-a-completion-audit-20260724-1605.json
          git commit -m 'audit: 東日本450自治体の正式割当件数へ訂正'
          git push origin HEAD
