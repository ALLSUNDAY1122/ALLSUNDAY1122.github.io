name: Diagnose East Remaining Audit 1230
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Diagnose official code parsing
        run: |
          python <<'PY'
          import concurrent.futures, json, re, time, urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup
          source='https://www.e-stat.go.jp/municipalities/cities/areacode?year=2026&month=1&day=1'
          prefectures={'01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県','08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県','15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県','22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県','29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県','36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県','43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'}
          excluded={'01695','01696','01697','01698','01699','01700'}
          def fetch(page):
              url=source+f'&page={page}'
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 municipality-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return page,r.read().decode('utf-8','replace')
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex: pages=dict(ex.map(fetch,range(1,97)))
          official={}; raw=[]
          for page in range(1,97):
              soup=BeautifulSoup(pages[page],'html.parser')
              for row in soup.find_all('tr'):
                  cells=[' '.join(c.stripped_strings) for c in row.find_all(['th','td'])]
                  code=next((c for c in cells if re.fullmatch(r'\d{5}',c)),None)
                  if not code or code in excluded or code[:2] not in prefectures:continue
                  names=[c for c in cells if re.fullmatch(r'[^\s]+[市区町村]',c)]
                  raw.append({'page':page,'code':code,'cells':cells,'names':names})
                  if not names:continue
                  name=names[-1]
                  if name.endswith('区') and not ('13101'<=code<='13123'):continue
                  if not (name.endswith(('市','町','村')) or ('13101'<=code<='13123')):continue
                  official[code]={'code':code,'name':name,'prefectureCode':code[:2],'prefecture':prefectures[code[:2]]}
          by_pref={p:sum(x['prefectureCode']==p for x in official.values()) for p in prefectures}
          diagnostic={'source':source,'parsedCount':len(official),'byPrefecture':by_pref,'first20':list(official.values())[:20],'last20':list(official.values())[-20:],'rawRowsWithoutNames':[x for x in raw if not x['names']][:30],'rawRowCount':len(raw)}
          Path('jichitai-compare/operations/control/east-remaining-audit-debug-20260724.json').write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'parsedCount':len(official),'rawRowCount':len(raw),'byPrefecture':by_pref},ensure_ascii=False))
          PY
      - name: Commit diagnostics
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record e-Stat municipality parser diagnostics'
          git push origin HEAD
