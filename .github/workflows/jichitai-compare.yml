name: Audit Remaining Six Municipalities

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch regional branches
        run: git fetch origin main region/east region/central
      - name: Count prefecture municipality files
        run: |
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const expected={08:44,09:25,10:35,11:63,12:54,13:62,14:33,15:30,19:27,20:77,16:15,17:19,18:17,21:42,22:35,23:54,24:29,25:19,26:26,27:43,28:41,29:39,30:30};
          const regionFor=(p)=>['08','09','10','11','12','13','14','15','19','20'].includes(p)?'east':'central';
          const report=[];
          for(const [pref,count] of Object.entries(expected)){
            const region=regionFor(pref);
            const output=execFileSync('git',['ls-tree','-r','--name-only',`origin/region/${region}`,`jichitai-compare/data/municipalities/${pref}`],{encoding:'utf8'});
            const codes=output.split(/\r?\n/).map(x=>x.match(/\/([0-9]{5})\.json$/)?.[1]).filter(Boolean).sort();
            report.push({prefectureCode:pref,region,expected:count,actual:codes.length,deficit:count-codes.length,codes});
          }
          const deficits=report.filter(x=>x.deficit!==0);
          fs.mkdirSync('jichitai-compare/operations/control',{recursive:true});
          fs.writeFileSync('jichitai-compare/operations/control/remaining-six-prefecture-audit-20260724.json',JSON.stringify({schemaVersion:'1.0.0',createdAt:'2026-07-24T21:45:00+09:00',expectedEast:450,actualEast:report.filter(x=>x.region==='east').reduce((s,x)=>s+x.actual,0),expectedCentral:409,actualCentral:report.filter(x=>x.region==='central').reduce((s,x)=>s+x.actual,0),totalDeficit:deficits.reduce((s,x)=>s+x.deficit,0),deficits,prefectures:report},null,2)+'\n');
          console.log(JSON.stringify(deficits,null,2));
          if(deficits.reduce((s,x)=>s+x.deficit,0)!==6)throw new Error('deficit total is not six');
          NODE
      - name: Restore workflow and commit report
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: identify prefecture deficits for remaining six municipalities'
          git push origin HEAD
