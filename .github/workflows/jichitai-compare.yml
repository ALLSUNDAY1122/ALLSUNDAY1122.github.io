name: Build Blocker Cleanup 1220
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Generate and validate
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Confirm cleanup result
        working-directory: jichitai-compare
        run: node -e "const p=require('./operations/progress.json');if(p.assignmentSummary.blocked!==0||p.teams['東日本調査班'].blockedMunicipalities!==0)throw new Error('blocked count remains');console.log('blocked counts cleared')"
      - name: Commit generated progress
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clear stale municipality blockers and refresh progress'
          git push origin HEAD
