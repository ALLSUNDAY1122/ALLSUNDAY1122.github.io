name: Build Assignment Summary Fix 1225
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Fix assignment classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('jichitai-compare/scripts/update-progress.mjs')
          text = path.read_text()
          old = "  if (task.status === 'pr_open') return 'pr_open';\n  if (typeof task.currentBranch === 'string' && task.currentBranch.trim()) return 'assigned';"
          new = "  if (task.status === 'pr_open') return 'pr_open';\n  if (task.status === 'merged') return 'assigned';\n  if (typeof task.currentBranch === 'string' && task.currentBranch.trim()) return 'assigned';"
          if old not in text:
              raise SystemExit('target assignmentState block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Generate and validate
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Confirm assignment result
        working-directory: jichitai-compare
        run: node -e "const p=require('./operations/progress.json');if(p.assignmentSummary.unassigned!==0||p.assignmentSummary.assigned!==p.registeredMunicipalities)throw new Error(JSON.stringify(p.assignmentSummary));console.log('assignment summary normalized')"
      - name: Commit fix and generated progress
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Count merged municipalities as assigned'
          git push origin HEAD
