name: Jichitai Compare CI

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'
  push:
    branches:
      - main
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: jichitai-compare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate municipality data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject unrelated changes
        working-directory: jichitai-compare
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD_SHA: ${{ github.sha }}
        run: npm run check:scope

      - name: Generate public municipality data
        working-directory: jichitai-compare
        run: npm run generate

      - name: Generate national progress
        working-directory: jichitai-compare
        run: npm run progress

      - name: Validate source and generated data
        working-directory: jichitai-compare
        run: npm run validate:generated

      - name: Check JavaScript syntax
        working-directory: jichitai-compare
        run: node --check app.js

      - name: Commit generated files for coordinator queue
        if: github.event_name == 'pull_request' && github.head_ref == 'coord/seed-regional-queues'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated regional queue files [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Confirm generated files are committed
        working-directory: jichitai-compare
        shell: bash
        run: |
          changed="$(git status --porcelain -- data/generated/municipalities.json operations/progress.json)"
          if [ -n "$changed" ]; then
            echo '生成済みファイルが最新ではありません。'
            git status --short -- data/generated/municipalities.json operations/progress.json
            exit 1
          fi

      - name: Verify published GitHub Pages site
        if: github.event_name == 'push'
        working-directory: jichitai-compare
        run: npm run smoke:public
