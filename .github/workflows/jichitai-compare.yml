name: Publish Newly Completed Municipalities

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch regions
        run: |
          git fetch --no-tags origin \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
      - name: Copy every complete main-missing municipality
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const {execFileSync}=require('node:child_process');
          const P='jichitai-compare', at='2026-07-23T23:14:00+09:00';
          const regions=[['north','北日本調査班'],['east','東日本調査班'],['central','中日本調査班'],['west','西日本調査班']];
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8',maxBuffer:64*1024*1024});
          const show=(r,f)=>JSON.parse(git('show',`${r}:${f}`));
          const before=JSON.parse(fs.readFileSync(`${P}/operations/progress.json`,'utf8'));
          const existing=new Set(fs.readdirSync(`${P}/operations/tasks`).filter(n=>/^\d{5}\.json$/u.test(n)).map(n=>n.slice(0,5)));
          const selected=[],seen=new Set();
          for(const [region,team] of regions){
            const ref=`origin/region/${region}`;
            const list=git('ls-tree','-r','--name-only',ref,`${P}/operations/tasks`).trim();
            for(const taskPath of list?list.split('\n'):[]){
              if(!/\/\d{5}\.json$/u.test(taskPath)) continue;
              let task;try{task=show(ref,taskPath)}catch{continue}
              const code=task?.municipalityCode;
              if(!/^\d{5}$/u.test(code??'')||existing.has(code)||seen.has(code))continue;
              if((task.completedServices??[]).length!==9||(task.blockers??[]).length)continue;
              const mPath=`${P}/data/municipalities/${task.prefectureCode}/${code}.json`;
              let m;try{m=show(ref,mPath)}catch{continue}
              const services=Object.entries(m.services??{});
              if(services.length!==9||!services.every(([,s])=>['verified','unavailable'].includes(s.status)))continue;
              fs.mkdirSync(path.dirname(mPath),{recursive:true});fs.writeFileSync(mPath,JSON.stringify(m,null,2)+'\n');
              task={...task,status:'merged',currentService:null,nextServiceIndex:9,pullRequestNumber:null,blockers:[],lastCheckedAt:'2026-07-23',lastUpdatedAt:at,lastUpdatedBy:`${task.lastUpdatedBy||team}・統括⑤全国統合`,notes:[...(task.notes??[]),'最新完成自治体としてmainへ統合。']};
              fs.writeFileSync(taskPath,JSON.stringify(task,null,2)+'\n');
              selected.push({region,team,code,name:m.name,prefecture:m.prefecture,sourcePullRequestNumber:task.pullRequestNumber});seen.add(code);
            }
          }
          if(!selected.length)throw new Error('追加公開対象なし');
          selected.sort((a,b)=>a.code.localeCompare(b.code));
          const byRegion=Object.fromEntries(regions.map(([r])=>[r,selected.filter(x=>x.region===r).length]));
          const manifest={schemaVersion:'1.0.0',createdAt:at,previousPublishedMunicipalities:before.registeredMunicipalities,selectedMunicipalities:selected.length,byRegion,municipalities:selected};
          fs.writeFileSync(`${P}/operations/control/release-all-complete-manifest-20260723-2314.json`,JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js
      - name: Update index
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('jichitai-compare/operations/control/release-all-complete-manifest-20260723-2314.json','utf8'));
          const p=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json','utf8'));
          const f='jichitai-compare/index.html';let h=fs.readFileSync(f,'utf8');h=h.replace(new RegExp(`${m.previousPublishedMunicipalities}自治体`,'g'),`${p.registeredMunicipalities}自治体`);fs.writeFileSync(f,h);
          NODE
      - name: Restore workflow and commit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'release: publish newly completed municipalities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
