name: Sync Daito Audit 27218

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest sources
        run: git fetch origin main region/central
      - name: Apply regional audit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/region/central:jichitai-compare/data/municipalities/27/27218.json > jichitai-compare/data/municipalities/27/27218.json
          git show origin/region/central:jichitai-compare/operations/tasks/27218.json > jichitai-compare/operations/tasks/27218.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'jichitai-compare/operations/tasks/27218.json';
          const t = JSON.parse(fs.readFileSync(p, 'utf8'));
          t.status = 'merged';
          t.currentService = null;
          t.nextServiceIndex = 9;
          t.pullRequestNumber = 2800;
          t.lastUpdatedAt = '2026-07-24T22:30:00+09:00';
          const by = '全国統合';
          if (Array.isArray(t.lastUpdatedBy)) {
            if (!t.lastUpdatedBy.includes(by)) t.lastUpdatedBy.push(by);
          } else if (t.lastUpdatedBy) {
            if (!String(t.lastUpdatedBy).includes(by)) t.lastUpdatedBy += `, ${by}`;
          } else {
            t.lastUpdatedBy = by;
          }
          fs.writeFileSync(p, JSON.stringify(t) + '\n');
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('operations/progress.json'));
          if (p.registeredMunicipalities !== 1741 || p.remainingMunicipalities !== 0) throw new Error(JSON.stringify(p));
          for (const k of ['todoServices','researchingServices','needsMediumReviewServices','needsRevisionServices','needsCoordinatorServices','prOpenServices','blockedServices']) {
            if (p[k] !== 0) throw new Error(`${k}=${p[k]}`);
          }
          NODE
      - name: Commit synchronized audit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'quality: sync Daito City FY2026 audit to nationwide data'
          git push origin HEAD
