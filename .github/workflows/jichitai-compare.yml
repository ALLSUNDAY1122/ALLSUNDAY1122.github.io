name: Sync Niijima Audit

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest sources
        run: git fetch origin main region/east
      - name: Apply Niijima audit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/region/east:jichitai-compare/data/municipalities/13/13363.json > jichitai-compare/data/municipalities/13/13363.json
          git show origin/region/east:jichitai-compare/operations/tasks/13363.json > jichitai-compare/operations/tasks/13363.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/tasks/13363.json';
          const task = JSON.parse(fs.readFileSync(path, 'utf8'));
          task.status = 'merged';
          task.currentService = null;
          task.nextServiceIndex = 9;
          task.pullRequestNumber = 2815;
          task.lastUpdatedAt = '2026-07-24T22:56:00+09:00';
          const actor = '全国統合';
          if (Array.isArray(task.lastUpdatedBy)) {
            if (!task.lastUpdatedBy.includes(actor)) task.lastUpdatedBy.push(actor);
          } else if (task.lastUpdatedBy) {
            if (!String(task.lastUpdatedBy).includes(actor)) task.lastUpdatedBy += `, ${actor}`;
          } else task.lastUpdatedBy = actor;
          fs.writeFileSync(path, JSON.stringify(task) + '\n');
          NODE
      - name: Generate and validate nationwide output
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
          node --check scripts/generate-municipality-pages.mjs
          node --check scripts/validate-municipality-pages.mjs
          node --check scripts/smoke-public-site.mjs
          node - <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json'));
          const pages = JSON.parse(fs.readFileSync('data/generated/municipality-pages.json'));
          if (progress.registeredMunicipalities !== 1741 || progress.remainingMunicipalities !== 0) throw new Error(JSON.stringify(progress));
          if (progress.totalServices !== 15669 || progress.completedServices !== 15669) throw new Error(JSON.stringify(progress));
          if (pages.municipalityCount !== 1741) throw new Error(JSON.stringify(pages));
          for (const key of ['todoServices','researchingServices','needsMediumReviewServices','needsRevisionServices','needsCoordinatorServices','prOpenServices','blockedServices']) {
            if (progress[key] !== 0) throw new Error(`${key}=${progress[key]}`);
          }
          const page = 'municipality/13363/index.html';
          if (!fs.existsSync(page)) throw new Error(`missing ${page}`);
          const html = fs.readFileSync(page, 'utf8');
          if (!html.includes('もんもクラブ')) throw new Error('Niijima static page is not current');
          NODE
      - name: Restore standard workflow and commit
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'quality: sync Niijima audit nationwide'
          git push origin HEAD
