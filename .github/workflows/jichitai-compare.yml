name: Coordinator Diagnose A-B Release 12

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose-release:
    if: github.head_ref == 'coord/ab-release-12-20260722-2237'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: coord/ab-release-12-20260722-2237
          fetch-depth: 0

      - name: Fetch main and regional branches
        run: |
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Write release diagnostics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const entries = [
            ['region/north','04100'],
            ['region/east','10428'],['region/east','10429'],['region/east','11100'],
            ['region/central','25212'],['region/central','25213'],['region/central','26100'],['region/central','26201'],['region/central','26202'],
            ['region/west','32525'],['region/west','32526'],['region/west','33211']
          ];
          const show = (ref, path) => {
            try { return execFileSync('git',['show',`${ref}:${path}`],{encoding:'utf8',stdio:['ignore','pipe','pipe']}); }
            catch { return null; }
          };
          const report = entries.map(([branch, code]) => {
            const pref = code.slice(0,2);
            const dataPath = `jichitai-compare/data/municipalities/${pref}/${code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${code}.json`;
            const sourceDataText = show(`origin/${branch}`, dataPath);
            const sourceTaskText = show(`origin/${branch}`, taskPath);
            const mainDataText = show('origin/main', dataPath);
            const mainTaskText = show('origin/main', taskPath);
            let parsed = {};
            try {
              const data = sourceDataText ? JSON.parse(sourceDataText) : null;
              const task = sourceTaskText ? JSON.parse(sourceTaskText) : null;
              parsed = {
                dataCode: data?.code ?? null,
                serviceCount: data?.services ? Object.keys(data.services).length : null,
                taskCode: task?.code ?? task?.municipalityCode ?? null,
                taskStatus: task?.status ?? null,
                completedCount: task?.completedServiceCount ?? task?.completedServices?.length ?? null
              };
            } catch (error) {
              parsed = { parseError: error.message };
            }
            return {
              branch, code,
              sourceDataExists: sourceDataText !== null,
              sourceTaskExists: sourceTaskText !== null,
              mainDataExists: mainDataText !== null,
              mainTaskExists: mainTaskText !== null,
              ...parsed
            };
          });
          fs.writeFileSync('jichitai-compare/operations/release-diagnostic-854.json', JSON.stringify({generatedAt:new Date().toISOString(), report}, null, 2) + '\n');
          NODE

      - name: Restore workflow and commit diagnostic
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare/operations/release-diagnostic-854.json
          git commit -m 'Add diagnostic report for A-B release 12'
          git push origin HEAD:coord/ab-release-12-20260722-2237
