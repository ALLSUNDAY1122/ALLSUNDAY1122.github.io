name: Build North-East Sync Release 1836
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/jichitai-compare.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: git fetch origin main region/north region/east
      - name: Extract publishable differences
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const svc=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const at='2026-07-24T18:36:00+09:00',prev=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json')).registeredMunicipalities,selected=[],excluded=[];
          const show=(r,f)=>{try{return cp.execFileSync('git',['show',`${r}:${f}`],{encoding:'utf8',stdio:['ignore','pipe','ignore']})}catch{return null}};
          const canon=x=>{if(x==null)return null;try{return JSON.stringify(JSON.parse(x))}catch{return x.trim()}};
          for(const region of ['north','east']){const ref=`origin/region/${region}`,files=cp.execFileSync('git',['ls-tree','-r','--name-only',ref,'--','jichitai-compare/data/municipalities'],{encoding:'utf8'}).split(/\r?\n/).filter(f=>/\/[0-9]{5}\.json$/.test(f));for(const f of files){const rt=show(ref,f),mt=show('HEAD',f);if(canon(rt)===canon(mt))continue;let d;try{d=JSON.parse(rt)}catch{excluded.push({region,file:f,reason:'invalid_json'});continue}const st=svc.map(s=>d.services?.[s]?.status);if(!st.every(s=>s==='verified'||s==='unavailable')){excluded.push({region,code:d.code,name:d.name,reason:'incomplete_status'});continue}const code=String(d.code||path.basename(f,'.json')),tp=`jichitai-compare/operations/tasks/${code}.json`,tt=show(ref,tp);if(!tt){excluded.push({region,code,name:d.name,reason:'missing_task'});continue}const t=JSON.parse(tt);fs.mkdirSync(path.dirname(f),{recursive:true});fs.writeFileSync(f,JSON.stringify(d)+'\n');t.status='merged';t.currentService=null;t.nextServiceIndex=9;t.completedServices=svc;t.verifiedCount=st.filter(x=>x==='verified').length;t.researchingCount=0;t.unavailableCount=st.filter(x=>x==='unavailable').length;t.needsMediumReviewCount=0;t.blockers=[];t.lastUpdatedAt=at;const a='統括A';if(Array.isArray(t.lastUpdatedBy)){if(!t.lastUpdatedBy.includes(a))t.lastUpdatedBy.push(a)}else if(t.lastUpdatedBy){if(!String(t.lastUpdatedBy).includes(a))t.lastUpdatedBy+=`, ${a}`}else t.lastUpdatedBy=a;fs.writeFileSync(tp,JSON.stringify(t)+'\n');selected.push({type:mt?'refresh':'add',region,code,name:d.name,prefecture:d.prefecture,sourcePullRequestNumber:t.pullRequestNumber??null});}}
          selected.sort((a,b)=>a.code.localeCompare(b.code));fs.writeFileSync('jichitai-compare/operations/control/coord-a-release-north-east-sync-20260724-1836.json',JSON.stringify({schemaVersion:'1.0.0',createdAt:at,previousPublishedMunicipalities:prev,selectedMunicipalities:selected.length,addedMunicipalities:selected.filter(x=>x.type==='add').length,refreshedMunicipalities:selected.filter(x=>x.type==='refresh').length,byRegion:{north:selected.filter(x=>x.region==='north').length,east:selected.filter(x=>x.region==='east').length},municipalities:selected,excludedCount:excluded.length,excluded},null,2)+'\n');
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: npm run generate && npm run progress && npm run validate:generated && node --check app.js
      - name: Update homepage count
        run: node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json')),f='jichitai-compare/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/\\d+自治体・9制度/g,p.registeredMunicipalities+'自治体・9制度'))"
      - name: Commit release
        shell: bash
        run: |
          git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No publishable differences.'; exit 0; fi
          git commit -m 'Sync latest north and east municipality improvements'
          git push origin HEAD
