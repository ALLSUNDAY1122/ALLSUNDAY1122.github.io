name: Finalize Miyaki Regional Merge

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  finalize-miyaki:
    if: github.head_ref == 'data/41346-miyaki-westb'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Miyaki branch
        uses: actions/checkout@v4
        with:
          ref: data/41346-miyaki-westb
          fetch-depth: 0

      - name: Fetch regional base
        run: git fetch origin +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Finalize task and west-b checkpoint
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const taskPath = 'operations/tasks/41346.json';
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          task.status = 'merged';
          task.pullRequestNumber = 1325;
          task.lastUpdatedAt = '2026-07-23T18:24:00+09:00';
          task.lastUpdatedBy = '西日本調査班B・統括⑤';
          task.notes = Array.isArray(task.notes) ? task.notes : [];
          const taskNote = 'CI run #3733成功後、地方統合用statusへ更新。';
          if (!task.notes.includes(taskNote)) task.notes.push(taskNote);
          fs.writeFileSync(taskPath, `${JSON.stringify(task)}\n`);

          const checkpointPath = 'operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.completedSinceSplit = Array.isArray(checkpoint.completedSinceSplit) ? checkpoint.completedSinceSplit : [];
          if (!checkpoint.completedSinceSplit.some((item) => item?.code === '41346')) {
            checkpoint.completedSinceSplit.push({
              code: '41346',
              name: 'みやき町',
              pullRequestNumber: 1325,
              ciRunNumber: 3733
            });
            checkpoint.remainingUninvestigatedCount = Math.max(0, Number(checkpoint.remainingUninvestigatedCount ?? 0) - 1);
          }
          checkpoint.updatedAt = '2026-07-23T18:24:00+09:00';
          checkpoint.status = 'ready';
          checkpoint.currentMunicipality = null;
          checkpoint.workingBranch = null;
          checkpoint.pullRequestNumber = 1325;
          checkpoint.ciStatus = 'success';
          checkpoint.nextAction = '西日本調査班Bの次対象自治体についてtask・ブランチ・PR重複を確認し、未着手なら必須9制度調査を開始する。';
          fs.writeFileSync(checkpointPath, `${JSON.stringify(checkpoint)}\n`);
          NODE

      - name: Restore standard workflow and commit
        run: |
          git show origin/region/west:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml \
            jichitai-compare/operations/tasks/41346.json \
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          git commit -m 'Finalize Miyaki regional merge state'
          git push origin HEAD:data/41346-miyaki-westb
