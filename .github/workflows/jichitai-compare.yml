name: Jichitai Compare CI

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'
  push:
    branches:
      - main
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: read

concurrency:
  group: jichitai-compare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate municipality data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject unrelated changes
        working-directory: jichitai-compare
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD_SHA: ${{ github.sha }}
        run: npm run check:scope

      - name: Validate source data
        working-directory: jichitai-compare
        run: npm run validate

      - name: Generate public municipality data
        working-directory: jichitai-compare
        run: npm run generate

      - name: Validate generated data
        working-directory: jichitai-compare
        run: npm run validate:generated

      - name: Check JavaScript syntax
        working-directory: jichitai-compare
        run: node --check app.js

      - name: Confirm generated data is committed
        working-directory: jichitai-compare
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data/generated/municipalities.json)" ]; then
            echo 'data/generated/municipalities.json が最新ではありません。'
            git status --short -- data/generated/municipalities.json
            exit 1
          fi
