name: Audit And Rescue Review Backlog

on:
  pull_request:
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/jichitai-compare.yml'

permissions:
  contents: write

concurrency:
  group: review-backlog-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch regional branches
        run: |
          git fetch --no-tags origin \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west

      - name: Audit backlog and rescue stale metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const project = 'jichitai-compare';
          const auditAt = '2026-07-23T22:37:00+09:00';
          const regions = [
            { region: 'north', team: '北日本調査班', ref: 'origin/region/north' },
            { region: 'east', team: '東日本調査班', ref: 'origin/region/east' },
            { region: 'central', team: '中日本調査班', ref: 'origin/region/central' },
            { region: 'west', team: '西日本調査班', ref: 'origin/region/west' }
          ];

          function git(...args) {
            return execFileSync('git', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          }
          function showJson(ref, file) {
            return JSON.parse(git('show', `${ref}:${file}`));
          }

          const previousProgress = JSON.parse(fs.readFileSync(`${project}/operations/progress.json`, 'utf8'));
          const existingCodes = new Set(
            fs.readdirSync(`${project}/operations/tasks`)
              .filter((name) => /^\d{5}\.json$/u.test(name))
              .map((name) => name.slice(0, 5))
          );

          const entries = [];
          const rescued = [];
          const seen = new Set();
          const serviceBacklog = {};

          for (const region of regions) {
            const listing = git('ls-tree', '-r', '--name-only', region.ref, `${project}/operations/tasks`).trim();
            for (const taskPath of listing ? listing.split('\n') : []) {
              if (!/\/\d{5}\.json$/u.test(taskPath)) continue;

              let task;
              try {
                task = showJson(region.ref, taskPath);
              } catch (error) {
                continue;
              }
              const code = task?.municipalityCode;
              if (!/^\d{5}$/u.test(code ?? '') || existingCodes.has(code) || seen.has(code)) continue;
              seen.add(code);

              const municipalityPath = `${project}/data/municipalities/${task.prefectureCode}/${code}.json`;
              let municipality = null;
              try {
                municipality = showJson(region.ref, municipalityPath);
              } catch (error) {
                entries.push({
                  region: region.region,
                  team: region.team,
                  code,
                  name: task.municipalityName,
                  taskStatus: task.status,
                  classification: 'missing_municipality_json',
                  blockers: Array.isArray(task.blockers) ? task.blockers : []
                });
                continue;
              }

              const services = Object.entries(municipality?.services ?? {});
              const nonPublishable = services
                .filter(([, service]) => !['verified', 'unavailable'].includes(service?.status))
                .map(([serviceId, service]) => ({
                  serviceId,
                  status: service?.status ?? null,
                  summary: service?.summary ?? null,
                  sourceUrl: service?.source?.url ?? null
                }));

              for (const item of nonPublishable) {
                const key = `${item.serviceId}:${item.status}`;
                serviceBacklog[key] = (serviceBacklog[key] ?? 0) + 1;
              }

              let classification;
              if (services.length !== 9) classification = 'invalid_service_count';
              else if (nonPublishable.length === 0) classification = 'metadata_only_publishable';
              else if (nonPublishable.length === 1) classification = 'single_service_review';
              else classification = 'multiple_service_review';

              const entry = {
                region: region.region,
                team: region.team,
                code,
                name: municipality.name,
                prefectureCode: municipality.prefectureCode,
                prefecture: municipality.prefecture,
                taskStatus: task.status,
                taskCompletedServiceCount: Array.isArray(task.completedServices) ? task.completedServices.length : 0,
                taskVerifiedCount: task.verifiedCount ?? null,
                taskUnavailableCount: task.unavailableCount ?? null,
                taskNeedsMediumReviewCount: task.needsMediumReviewCount ?? null,
                serviceCount: services.length,
                nonPublishable,
                classification,
                blockers: Array.isArray(task.blockers) ? task.blockers : [],
                sourcePullRequestNumber: task.pullRequestNumber ?? null
              };
              entries.push(entry);

              if (classification === 'metadata_only_publishable') {
                fs.mkdirSync(path.dirname(municipalityPath), { recursive: true });
                fs.writeFileSync(municipalityPath, `${JSON.stringify(municipality, null, 2)}\n`);
                const normalizedTask = {
                  ...task,
                  status: 'merged',
                  currentService: null,
                  nextServiceIndex: 9,
                  completedServices: Object.keys(municipality.services),
                  verifiedCount: services.filter(([, service]) => service.status === 'verified').length,
                  unavailableCount: services.filter(([, service]) => service.status === 'unavailable').length,
                  researchingCount: 0,
                  needsMediumReviewCount: 0,
                  pullRequestNumber: null,
                  blockers: [],
                  lastCheckedAt: '2026-07-23',
                  lastUpdatedAt: auditAt,
                  lastUpdatedBy: `${task.lastUpdatedBy || region.team}・統括⑤管理情報救済`,
                  notes: [
                    ...(Array.isArray(task.notes) ? task.notes : []),
                    '自治体JSONの9制度が全件verified/unavailableであることを再確認し、古いtask管理情報を正規化して全国統合。'
                  ]
                };
                fs.writeFileSync(taskPath, `${JSON.stringify(normalizedTask, null, 2)}\n`);
                rescued.push({ region: region.region, code, name: municipality.name });
              }
            }
          }

          entries.sort((a, b) => a.code.localeCompare(b.code));
          rescued.sort((a, b) => a.code.localeCompare(b.code));
          const classificationCounts = entries.reduce((acc, entry) => {
            acc[entry.classification] = (acc[entry.classification] ?? 0) + 1;
            return acc;
          }, {});

          const report = {
            schemaVersion: '1.0.0',
            createdAt: auditAt,
            previousPublishedMunicipalities: previousProgress.registeredMunicipalities,
            auditedMainMissingMunicipalities: entries.length,
            rescuedMunicipalities: rescued.length,
            classificationCounts,
            serviceBacklog,
            rescued,
            municipalities: entries
          };
          fs.writeFileSync(
            `${project}/operations/control/review-backlog-audit-20260723-2237.json`,
            `${JSON.stringify(report, null, 2)}\n`
          );
          console.log(JSON.stringify({
            audited: entries.length,
            rescued: rescued.length,
            classificationCounts,
            serviceBacklog
          }, null, 2));
          NODE

      - name: Generate and validate rescued data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          npm run validate:sessions --if-present
          node --check app.js

      - name: Update displayed count when rescued
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('jichitai-compare/operations/control/review-backlog-audit-20260723-2237.json', 'utf8'));
          const progress = JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json', 'utf8'));
          const oldCount = report.previousPublishedMunicipalities;
          const newCount = progress.registeredMunicipalities;
          const indexPath = 'jichitai-compare/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(new RegExp(`${oldCount}自治体`, 'g'), `${newCount}自治体`);
          fs.writeFileSync(indexPath, html);
          console.log(`${oldCount}自治体から${newCount}自治体。救済${report.rescuedMunicipalities}件。`);
          NODE

      - name: Restore standard CI workflow
        run: git show origin/main:.github/workflows/jichitai-compare.yml > .github/workflows/jichitai-compare.yml

      - name: Commit audit and rescued data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jichitai-compare.yml jichitai-compare
          git commit -m 'audit: classify review backlog and rescue stale tasks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
