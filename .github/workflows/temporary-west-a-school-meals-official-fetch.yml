name: Temporary West A School Meals Official Fetch

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-official-fetch-trigger-20260725.json

permissions:
  contents: write

jobs:
  fetch:
    if: github.head_ref == 'audit/west-a-school-meals-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Fetch current official sources
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          node <<'NODE'
          const fs=require('fs'); const {execFileSync}=require('child_process');
          const priority=JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json','utf8'));
          const map=new Map();
          for(const category of ['staleTimeBoundWithoutContinuation','policyOnlyUniversalClaim']){
            for(const row of priority[category]||[]){const item=map.get(row.code)||{...row,categories:[]};item.categories.push(category);map.set(row.code,item);}
          }
          const targets=[...map.values()];
          const textify=html=>html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/\s+/g,' ').trim();
          const snippets=text=>{const out=[];for(const term of ['2026年度','令和8年度','令和８年度','2025年度','令和7年度','令和７年度','学校給食費','給食費','無償化','無料','全額','半額','補助','保護者負担','小学校','中学校','対象外','当分の間','継続']){let pos=0;while(out.length<30){const i=text.indexOf(term,pos);if(i<0)break;const s=text.slice(Math.max(0,i-120),Math.min(text.length,i+360)).replace(/\s+/g,' ');if(!out.some(x=>x.snippet===s))out.push({term,snippet:s});pos=i+term.length;}}return out;};
          const results=[];
          for(let i=0;i<targets.length;i++){
            const t=targets[i]; const raw=`/tmp/school-meal-${i}`;
            try{
              const headers=execFileSync('curl',['-LfsS','-A','Mozilla/5.0 West-A-Audit/2026','-D','-','-o',raw,t.sourceUrl],{encoding:'utf8'});
              const b=fs.readFileSync(raw); const pdf=b.slice(0,4).toString()==='%PDF'; let text='';
              if(pdf){try{execFileSync('pdftotext',['-layout',raw,raw+'.txt']);text=fs.readFileSync(raw+'.txt','utf8').replace(/\s+/g,' ').trim();}catch(e){text='';}}
              else{text=textify(b.toString('utf8'));}
              results.push({code:t.code,name:t.name,prefecture:t.prefecture,summary:t.summary,sourceUrl:t.sourceUrl,categories:t.categories,httpStatus:/HTTP\/\S+\s+(\d+)/g.test(headers)?Number([...headers.matchAll(/HTTP\/\S+\s+(\d+)/g)].at(-1)[1]):200,pdf,byteLength:b.length,textLength:text.length,markers:{current2026:/(2026|令和8|令和８)(?:年度|年)/.test(text),oldOnly:/(202[0-5]|令和[2-7２-７])(?:年度|年)/.test(text)&&!/(2026|令和8|令和８)(?:年度|年)/.test(text),universal:/完全無償|全額無償|全児童|全生徒|保護者負担なし|全額.{0,8}負担|無償化/.test(text),partial:/半額|一部|第[23三二]子|就学援助|対象世帯|小学校のみ|中学校のみ|対象外/.test(text),continuing:/当分の間|無期限|継続|引き続き|以降|条例|規則|要綱/.test(text)},excerpts:snippets(text)});
            }catch(e){results.push({code:t.code,name:t.name,prefecture:t.prefecture,summary:t.summary,sourceUrl:t.sourceUrl,categories:t.categories,error:String(e),httpStatus:null,excerpts:[]});}
          }
          const report={schemaVersion:'1.0.0',auditId:'west-a-school-meals-official-fetch-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),targetCount:targets.length,results,counts:{http200:results.filter(x=>x.httpStatus===200).length,fetchError:results.filter(x=>x.error).length,current2026:results.filter(x=>x.markers?.current2026).length,oldOnly:results.filter(x=>x.markers?.oldOnly).length,policyTargets:targets.filter(x=>x.categories.includes('policyOnlyUniversalClaim')).length,staleTargets:targets.filter(x=>x.categories.includes('staleTimeBoundWithoutContinuation')).length},status:'official_fetch_completed'};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report.counts));
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-official-fetch-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-official-fetch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json \
                  jichitai-compare/operations/control/west-a-school-meals-official-fetch-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-official-fetch.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A学校給食費高リスク候補を公式再取得'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
