name: Moises HQ Integration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swiftpm-regression:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Integrated SwiftPM tests
        working-directory: tech-assets/moises-audio
        run: swift test --parallel

  portable-lane2-io-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lane 2 IO source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(Shared/DomainContracts.swift Shared/LibraryContracts.swift IO/Sources/*.swift)
          swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library -typecheck "${sources[@]}"

  portable-lane2-io-library-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lane 2 IO plus Library source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(Shared/DomainContracts.swift Shared/LibraryContracts.swift IO/Sources/*.swift Library/Sources/*.swift)
          swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library -typecheck "${sources[@]}"

  portable-lane3-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lane 3 DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(Shared/DomainContracts.swift DSP/Sources/*.swift)
          swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library -typecheck "${sources[@]}"

  portable-lane3-playback-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lane 3 Playback plus DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(Shared/DomainContracts.swift DSP/Sources/*.swift Playback/Sources/*.swift)
          swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library -typecheck "${sources[@]}"
