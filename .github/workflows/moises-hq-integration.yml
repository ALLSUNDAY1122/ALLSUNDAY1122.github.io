name: Moises HQ Integration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swiftpm-regression:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Integrated SwiftPM tests
        id: swiftpm
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee "$GITHUB_WORKSPACE/swift-test.log"
      - name: Upload SwiftPM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moises-hq-swift-test-${{ github.run_id }}
          path: swift-test.log
          if-no-files-found: ignore
          retention-days: 3

  portable-lane2-io-library-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 2 IO plus Library source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            IO/Sources/*.swift
            Library/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 6 ]; then
            echo "Lane 2 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 2 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane3-playback-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 3 Playback plus DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 4 ]; then
            echo "Lane 3 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 3 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"
