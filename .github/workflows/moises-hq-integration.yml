name: Moises HQ Integration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swiftpm-regression:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Integrated SwiftPM tests
        working-directory: tech-assets/moises-audio
        run: swift test --parallel

  portable-lane2-io-library-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 2 IO plus Library source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            IO/Sources/*.swift
            Library/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 6 ]; then
            echo "Lane 2 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 2 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane3-playback-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 3 Playback plus DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 4 ]; then
            echo "Lane 3 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 3 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane2-aw53-native-selfcheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Lane 2 AW53 real-filesystem self-check
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            Library/Sources/*.swift
            Library/benchmarks/L2AW53SegmentedSteadyStateAuthoritySelfCheck.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            -o /tmp/l2-aw53-selfcheck
          /tmp/l2-aw53-selfcheck | tee /tmp/l2-aw53-selfcheck.out
          grep -q '^L2_AW53_SELF_TEST_PASS ' /tmp/l2-aw53-selfcheck.out

  portable-lane3-aw53-native-execution:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Lane 3 AW53 lifecycle self-test stress and benchmark
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          source_file='Playback/Sources/Lane3CandidatePhysicalSamplingLifecycle.swift'

          swiftc -swift-version 6 -warnings-as-errors -strict-concurrency=complete -O \
            "$source_file" \
            Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleSelfTest.swift \
            -o /tmp/l3-aw53-selftest
          /tmp/l3-aw53-selftest | tee /tmp/l3-aw53-selftest.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleSelfTest PASS ' /tmp/l3-aw53-selftest.out

          swiftc -swift-version 6 -warnings-as-errors -strict-concurrency=complete -O \
            "$source_file" \
            Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleStress.swift \
            -o /tmp/l3-aw53-stress
          /tmp/l3-aw53-stress | tee /tmp/l3-aw53-stress.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleStress PASS ' /tmp/l3-aw53-stress.out

          swiftc -swift-version 6 -warnings-as-errors -strict-concurrency=complete -O \
            "$source_file" \
            Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleBenchmark.swift \
            -o /tmp/l3-aw53-benchmark
          /tmp/l3-aw53-benchmark | tee /tmp/l3-aw53-benchmark.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleBenchmark iterations=20000 ' /tmp/l3-aw53-benchmark.out
