name: Moises HQ Integration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swiftpm-regression:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Integrated SwiftPM tests
        working-directory: tech-assets/moises-audio
        run: swift test --parallel

  portable-lane2-io-library-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 2 IO plus Library source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            IO/Sources/*.swift
            Library/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 6 ]; then
            echo "Lane 2 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 2 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane3-playback-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 3 Playback plus DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 4 ]; then
            echo "Lane 3 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 3 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  lane1-a36-exact-checkout-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANE1_EXPECTED_HEAD: 2e815c72288265501ef5cd697b9c178d6a4ca977
    steps:
      - name: Checkout exact Worker 1 A36 tip
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LANE1_EXPECTED_HEAD }}
          fetch-depth: 1
          clean: true
      - name: Verify checkout identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$LANE1_EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
          echo "Exact Worker 1 HEAD: $actual"
      - name: Install audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema
      - name: Run A26 exact dependency and provenance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tech-assets/moises-audio/Separation/Evaluation/lane1_dependency_audit.py \
            --audio-root tech-assets/moises-audio \
            --expected-git-head "$LANE1_EXPECTED_HEAD" \
            --output /tmp/l1-a26-exact-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/l1-a26-exact-audit.json').read_text())
          assert report['overall_state'] == 'PASS', report
          assert report['git_head_binding']['state'] == 'PASS', report['git_head_binding']
          assert report['owned_source_snapshot']['state'] == 'PASS', report['owned_source_snapshot']
          assert report['dependency_contracts']['state'] == 'PASS', report['dependency_contracts']
          assert report['unittest_discovery']['state'] == 'PASS', report['unittest_discovery']
          print('L1_A26_EXACT_AUDIT_PASS')
          PY
      - name: Diagnose full unittest errors
        if: failure()
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -o pipefail
          export PYTHONPATH="$PWD/Separation/Server:$PWD/Separation/Evaluation:$PWD/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest discover -v -s Separation/Tests -p 'test_*.py'
      - name: Upload exact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-a26-exact-audit-${{ env.LANE1_EXPECTED_HEAD }}
          path: /tmp/l1-a26-exact-audit.json
          if-no-files-found: error
          retention-days: 30
