name: Moises HQ Integration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/**'
      - '.github/workflows/moises-hq-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swiftpm-regression:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Integrated SwiftPM tests
        working-directory: tech-assets/moises-audio
        run: swift test --parallel

  portable-lane1-integrated-a26-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify integration checkout identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          echo "Integrated Lane1 audit HEAD: $actual"

      - name: Install Lane1 audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema

      - name: Run Lane1 A26 audit on integrated tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tech-assets/moises-audio/Separation/Evaluation/lane1_dependency_audit.py \
            --audio-root tech-assets/moises-audio \
            --expected-git-head "$GITHUB_SHA" \
            --output /tmp/l1-integrated-a26-audit.json
          cat /tmp/l1-integrated-a26-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/l1-integrated-a26-audit.json').read_text())
          assert report['overall_state'] == 'PASS', report
          assert report['git_head_binding']['state'] == 'PASS', report['git_head_binding']
          assert report['owned_source_snapshot']['state'] == 'PASS', report['owned_source_snapshot']
          assert report['dependency_contracts']['state'] == 'PASS', report['dependency_contracts']
          assert report['unittest_discovery']['state'] == 'PASS', report['unittest_discovery']
          print('L1_INTEGRATED_A26_AUDIT_PASS')
          PY

      - name: Repeat integrated Lane1 full discovery stability probe
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          for i in 1 2 3; do
            echo "===== integrated L1 full discovery stability pass ${i}/3 ====="
            python3 -m unittest discover -s Separation/Tests -p 'test_*.py'
            echo "L1_INTEGRATED_STABILITY_PASS_${i}_OK"
          done

      - name: Diagnose integrated Lane1 unittest failure verbosely
        if: failure()
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          python3 -m unittest discover -v -s Separation/Tests -p 'test_*.py'
          exit 0

      - name: Upload integrated Lane1 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-integrated-a26-audit-${{ github.sha }}
          path: /tmp/l1-integrated-a26-audit.json
          if-no-files-found: error
          retention-days: 30

  portable-lane2-io-library-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 2 IO plus Library source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            IO/Sources/*.swift
            Library/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 6 ]; then
            echo "Lane 2 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 2 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane3-playback-dsp-source-typecheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Lane 3 Playback plus DSP source typecheck
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 4 ]; then
            echo "Lane 3 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 3 typecheck source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -parse-as-library \
            -typecheck \
            "${sources[@]}"

  portable-lane2-aw53-native-selfcheck:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Lane 2 AW53 real-filesystem self-check
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            Shared/LibraryContracts.swift
            IO/Sources/*.swift
            Library/Sources/*.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Library/benchmarks/L2AW53SegmentedSteadyStateAuthoritySelfCheck.swift \
            -o /tmp/l2-aw53-selfcheck
          /tmp/l2-aw53-selfcheck | tee /tmp/l2-aw53-selfcheck.out
          grep -q '^L2_AW53_SELF_TEST_PASS ' /tmp/l2-aw53-selfcheck.out

  portable-lane3-aw53-native-execution:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Lane 3 AW53 lifecycle self-test stress and benchmark
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )

          cp Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleSelfTest.swift /tmp/L3AW53SelfTest.swift
          cp Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleStress.swift /tmp/L3AW53Stress.swift
          cp Playback/Tests/L3_AW53_CandidatePhysicalSamplingLifecycleBenchmark.swift /tmp/L3AW53Benchmark.swift
          sed -i '/^@main$/d' /tmp/L3AW53SelfTest.swift /tmp/L3AW53Stress.swift /tmp/L3AW53Benchmark.swift
          cat >/tmp/L3AW53CombinedRunner.swift <<'SWIFT'
          @main
          enum L3AW53CombinedRunner {
              static func main() throws {
                  try L3AW53CandidatePhysicalSamplingLifecycleSelfTest.main()
                  try L3AW53CandidatePhysicalSamplingLifecycleStress.main()
                  try L3AW53CandidatePhysicalSamplingLifecycleBenchmark.main()
              }
          }
          SWIFT

          swiftc -swift-version 6 -warnings-as-errors -strict-concurrency=complete -O \
            "${sources[@]}" \
            /tmp/L3AW53SelfTest.swift \
            /tmp/L3AW53Stress.swift \
            /tmp/L3AW53Benchmark.swift \
            /tmp/L3AW53CombinedRunner.swift \
            -o /tmp/l3-aw53-native
          /tmp/l3-aw53-native | tee /tmp/l3-aw53-native.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleSelfTest PASS ' /tmp/l3-aw53-native.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleStress PASS ' /tmp/l3-aw53-native.out
          grep -q '^L3_AW53_CandidatePhysicalSamplingLifecycleBenchmark iterations=20000 ' /tmp/l3-aw53-native.out
