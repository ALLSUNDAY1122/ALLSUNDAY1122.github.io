name: West B Missing Municipality Diagnostic

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.head_ref == 'ops/west-b-finalize-v2-20260724' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Compare canonical municipality names
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(),'jichitai-compare','data','municipalities');
          const expected = {
            '32':['松江市','浜田市','出雲市','益田市','大田市','安来市','江津市','雲南市','奥出雲町','飯南町','川本町','美郷町','邑南町','津和野町','吉賀町','海士町','西ノ島町','知夫村','隠岐の島町'],
            '36':['徳島市','鳴門市','小松島市','阿南市','吉野川市','阿波市','美馬市','三好市','勝浦町','上勝町','佐那河内村','石井町','神山町','那賀町','牟岐町','美波町','海陽町','松茂町','北島町','藍住町','板野町','上板町','つるぎ町','東みよし町']
          };
          const result={schemaVersion:'1.0.0',diagnosedAt:'2026-07-24T15:37:00+09:00',prefectures:{}};
          for(const [prefectureCode,names] of Object.entries(expected)){
            const files=fs.readdirSync(path.join(root,prefectureCode)).filter(n=>/^\d{5}\.json$/.test(n)).sort();
            const actual=files.map(filename=>{
              const municipality=JSON.parse(fs.readFileSync(path.join(root,prefectureCode,filename),'utf8'));
              return {code:filename.slice(0,-5),name:municipality.name};
            });
            const actualNames=new Set(actual.map(item=>item.name));
            result.prefectures[prefectureCode]={expectedCount:names.length,actualCount:actual.length,missingNames:names.filter(name=>!actualNames.has(name)),actual};
          }
          const out=path.join(process.cwd(),'jichitai-compare','operations','control','audits','west-b-missing-municipalities-20260724.json');
          fs.writeFileSync(out,JSON.stringify(result,null,2)+'\n');
          fs.unlinkSync(path.join(process.cwd(),'.github','workflows','west-b-missing-diagnostic-once.yml'));
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ops: 西日本B欠落自治体を特定 [west-b-missing-diagnostic]"
          git push origin HEAD:${GITHUB_HEAD_REF}
