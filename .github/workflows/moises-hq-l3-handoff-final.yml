name: Moises HQ Lane3 Final Handoff Gate

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Playback/**'
      - 'tech-assets/moises-audio/DSP/**'
      - 'tech-assets/moises-audio/Shared/DomainContracts.swift'
      - '.github/workflows/moises-hq-l3-handoff-final.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Playback/**'
      - 'tech-assets/moises-audio/DSP/**'
      - 'tech-assets/moises-audio/Shared/DomainContracts.swift'
      - '.github/workflows/moises-hq-l3-handoff-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l3-handoff-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lane3-final-handoff-acceptance:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Execute Lane 3 serialized final handoff acceptance self-test
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          printf 'Lane 3 final handoff source count: %s\n' "${#sources[@]}"
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift \
            -o /tmp/l3-hq-final-handoff
          /tmp/l3-hq-final-handoff | tee /tmp/l3-hq-final-handoff.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_HOST_VALIDATOR_SELF_TEST_PASS .*finalAcceptanceGate=true .*nonParity=true$' /tmp/l3-hq-final-handoff.out
