name: APP2-010 Managed Apple and Codemagic Signing

on:
  push:
    branches: [main]
    paths: ['automation/app2-010-managed-signing-command.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Provision managed signing identity
        id: provision
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          umask 077
          python3 scripts/app2_010_create_managed_signing.py
      - name: Persist sanitized signing result
        if: always() && hashFiles('app2-010-managed-signing-result.json') != ''
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('app2-010-managed-signing-result.json').read_text(encoding='utf-8'))
          rid=str(data.get('request_id',''))
          if not re.fullmatch(r'app2-010-managed-signing-[A-Za-z0-9._-]{1,60}',rid): raise SystemExit('invalid request id')
          # Result JSON is intentionally allow-listed and never contains key/CSR/certificate contents.
          forbidden=('PRIVATE KEY','CERTIFICATE REQUEST','profileContent','certificateContent')
          payload=json.dumps(data,ensure_ascii=False,indent=2)+'\n'
          if any(token in payload for token in forbidden): raise SystemExit('sensitive material detected in result')
          out=Path('automation/codemagic-results')/f'{rid}.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(payload,encoding='utf-8')
          Path('/tmp/signing-result.json').write_text(payload,encoding='utf-8'); Path('/tmp/signing-path.txt').write_text(str(out),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="$(cat /tmp/signing-path.txt)"; git add "$P"; git commit -m "Persist APP2-010 managed signing result" || true
          if git diff HEAD^ --quiet 2>/dev/null; then exit 0; fi
          if git push; then exit 0; fi
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/signing-result.json "$P"; git add "$P"; git commit -m "Persist APP2-010 managed signing result" || exit 0; git push origin HEAD:main
      - name: Enforce provisioning success
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app2-010-managed-signing-result.json')
          if not p.exists(): raise SystemExit('managed signing result missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          if data.get('ok') is not True: raise SystemExit('managed signing provisioning failed')
          print('PASS: APP2-010 managed signing provisioned')
          PY
