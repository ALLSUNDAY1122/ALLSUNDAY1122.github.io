name: APP2-010 Internal TestFlight Route

on:
  push:
    branches: [main]
    paths:
      - automation/app2-010-testflight-route-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit APP2-010 TestFlight route state
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, traceback
          from pathlib import Path
          sys.path.insert(0, str((Path.cwd() / 'scripts').resolve()))
          from app_store_connect_api import api_get, load_private_key, make_token

          cmd=json.loads(Path('automation/app2-010-testflight-route-command.json').read_text(encoding='utf-8'))
          rid=str(cmd['request_id']); app_id=str(cmd['app_id']); bundle=str(cmd['bundle_id']); build_no=str(cmd['build_number'])
          if not re.fullmatch(r'app2-010-[A-Za-z0-9._-]{1,90}',rid): raise SystemExit('invalid request id')
          summary={'request_id':rid,'app_id':app_id,'bundle_id':bundle,'target_build_number':build_no,'ok':False,'errors':[],
                   'known_builds':[],'internal_groups':[],'selected_group':None,'target_build':None,
                   'assigned_to_selected_group':False,'tester_count':None,'persisted_personal_tester_data':False,
                   'app_store_review_submitted':False}
          key_path=cleanup=None
          try:
              issuer=os.environ.get('ASC_ISSUER_ID'); kid=os.environ.get('ASC_KEY_ID')
              if not issuer or not kid: raise RuntimeError('missing ASC API credentials')
              key_path, cleanup=load_private_key(); token=make_token(issuer,kid,key_path)
              _,app=api_get(token,f'/v1/apps/{app_id}')
              actual=((((app or {}).get('data') or {}).get('attributes') or {}).get('bundleId'))
              if actual!=bundle: raise RuntimeError(f'app preflight mismatch: {actual!r}')

              _,br=api_get(token,f'/v1/builds?filter[app]={app_id}&sort=-uploadedDate&limit=200')
              builds=[x for x in ((br or {}).get('data') or []) if isinstance(x,dict)]
              for b in builds:
                  a=b.get('attributes') or {}
                  summary['known_builds'].append({'id':b.get('id'),'version':a.get('version'),'uploadedDate':a.get('uploadedDate'),
                                                  'processingState':a.get('processingState'),'expired':a.get('expired'),
                                                  'buildAudienceType':a.get('buildAudienceType')})
              candidates=[b for b in builds if str((b.get('attributes') or {}).get('version'))==build_no]
              if len(candidates)==1:
                  target=candidates[0]; ta=target.get('attributes') or {}; tid=str(target['id'])
                  detail={}
                  try:
                      _,dr=api_get(token,f'/v1/builds/{tid}/buildBetaDetail')
                      detail=(((dr or {}).get('data') or {}).get('attributes') or {})
                  except Exception as e:
                      summary['errors'].append('buildBetaDetail: '+str(e)[:700])
                  summary['target_build']={'id':tid,'version':ta.get('version'),'uploadedDate':ta.get('uploadedDate'),
                                           'processingState':ta.get('processingState'),'expired':ta.get('expired'),
                                           'buildAudienceType':ta.get('buildAudienceType'),
                                           'internalBuildState':detail.get('internalBuildState'),
                                           'externalBuildState':detail.get('externalBuildState')}
              else:
                  summary['errors'].append(f'expected one Build {build_no}; found {len(candidates)}')
                  tid=None

              _,gr=api_get(token,f'/v1/betaGroups?filter[app]={app_id}&limit=200')
              groups=[x for x in ((gr or {}).get('data') or []) if isinstance(x,dict)]
              for g in groups:
                  ga=g.get('attributes') or {}
                  if ga.get('isInternalGroup') is not True: continue
                  gid=str(g['id']); row={'id':gid,'name':ga.get('name'),'isInternalGroup':True,
                                         'hasAccessToAllBuilds':ga.get('hasAccessToAllBuilds'),'build_ids':[],'build_numbers':[]}
                  try:
                      _,rel=api_get(token,f'/v1/betaGroups/{gid}/relationships/builds?limit=200')
                      ids=[str(x.get('id')) for x in ((rel or {}).get('data') or []) if isinstance(x,dict) and x.get('id')]
                      row['build_ids']=ids
                      row['build_numbers']=sorted({str((b.get('attributes') or {}).get('version')) for b in builds if str(b.get('id')) in ids})
                  except Exception as e:
                      summary['errors'].append('group builds '+gid+': '+str(e)[:700])
                  summary['internal_groups'].append(row)

              preferred=[g for g in summary['internal_groups'] if g.get('name')=='App Store Connect Users']
              if len(preferred)==1: selected=preferred[0]
              else:
                  access=[g for g in summary['internal_groups'] if g.get('hasAccessToAllBuilds') is True]
                  selected=access[0] if len(access)==1 else (summary['internal_groups'][0] if len(summary['internal_groups'])==1 else None)
              if selected:
                  summary['selected_group']={k:selected.get(k) for k in ('id','name','hasAccessToAllBuilds')}
                  if tid: summary['assigned_to_selected_group']=tid in selected.get('build_ids',[])
                  try:
                      _,tr=api_get(token,f"/v1/betaGroups/{selected['id']}/betaTesters?limit=200")
                      summary['tester_count']=len([x for x in ((tr or {}).get('data') or []) if isinstance(x,dict)])
                  except Exception as e:
                      summary['errors'].append('group testers: '+str(e)[:700])
              summary['ok']=summary['target_build'] is not None and not any(x.startswith('expected one Build') for x in summary['errors'])
          except Exception as e:
              summary['errors'].append(type(e).__name__+': '+str(e)[:1200])
          finally:
              if cleanup: cleanup.unlink(missing_ok=True)

          out=Path('automation/asc-results')/f'{rid}.json'; out.parent.mkdir(parents=True,exist_ok=True)
          payload=json.dumps(summary,ensure_ascii=False,indent=2)+'\n'; out.write_text(payload,encoding='utf-8')
          Path('/tmp/app2-010-route-result.json').write_text(payload,encoding='utf-8')
          Path('/tmp/app2-010-route-result-path.txt').write_text(str(out),encoding='utf-8')
          print(json.dumps({'ok':summary['ok'],'target_build':summary['target_build'],'internal_groups':len(summary['internal_groups']),
                            'assigned':summary['assigned_to_selected_group'],'tester_count':summary['tester_count'],'errors':summary['errors']},ensure_ascii=False))
          PY
      - name: Persist sanitized route evidence
        if: always()
        run: |
          test -f /tmp/app2-010-route-result-path.txt || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="$(cat /tmp/app2-010-route-result-path.txt)"
          git add "$P"
          git commit -m "Persist APP2-010 internal TestFlight route" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$P")"
          cp /tmp/app2-010-route-result.json "$P"
          git add "$P"
          git commit -m "Persist APP2-010 internal TestFlight route" || exit 0
          git push origin HEAD:main
