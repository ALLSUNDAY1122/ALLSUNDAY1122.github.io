name: Temporary Jichitai Status Snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-status-snapshot-20260722.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build compact status
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          q=json.loads(Path('jichitai-compare/operations/control/release-queue.json').read_text())
          result={'queueUpdatedAt':q.get('updatedAt'),'public':json.loads(Path('jichitai-compare/operations/progress.json').read_text()).get('registeredMunicipalities'),'regions':[]}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          for r in ('north','east','central','west'):
            e=next(x for x in q['entries'] if x['region']==r)
            s=json.loads(subprocess.check_output(['git','show',f'origin/region/{r}:jichitai-compare/operations/control/regions/{r}.json'],text=True))
            result['regions'].append({'region':r,'count':e.get('count'),'pending':s.get(fields[r]),'nationalPr':s.get('lastNationalIntegrationPr'),'generatedPr':s.get('lastGeneratedPullRequest')})
          result['regionalTotal']=sum(x['count'] for x in result['regions'])
          Path('jichitai-compare/operations/control/status-snapshot-temp.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          rm .github/workflows/temp-status-snapshot-20260722.yml
          git add jichitai-compare/operations/control/status-snapshot-temp.json .github/workflows/temp-status-snapshot-20260722.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 自治体進行状況の一時スナップショットを作成'
          git push origin main
