name: Tsukanshi Codemagic workflow reconcile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tsukanshi-codemagic-integration-bootstrap.yml']
permissions: {contents: write}
jobs:
  reconcile:
    if: github.actor == 'ALLSUNDAY1122'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Reconcile existing workflow fail-closed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml'); s=p.read_text(encoding='utf-8'); marker='\n  tsukanshi-ios:'
          if s.count(marker)!=1: raise SystemExit(f'expected one tsukanshi workflow, found {s.count(marker)}')
          start=s.index(marker); rest=s[start+1:]; rel=rest.find('\n  ',len('  tsukanshi-ios:')); end=len(s) if rel<0 else start+1+rel; block=s[start:end]
          if 'jp.allsunday1122.tsukanshi' not in block: raise SystemExit('bundle mismatch')
          block=block.replace('app_store_connect: codemagic','app_store_connect: "Codemagic Shiwake Swipe"')
          block=block.replace('submit_to_testflight: true','submit_to_testflight: false')
          if 'Codemagic Shiwake Swipe' not in block or 'submit_to_testflight: false' not in block or 'submit_to_app_store: false' not in block: raise SystemExit('safety reconciliation failed')
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          v=Path('tsukanshi-sprint/validate-apple-preflight.mjs'); t=v.read_text(encoding='utf-8'); old="includes(block, 'app_store_connect: codemagic', 'Codemagic ASC integration');"; new="must(block.includes('Codemagic Shiwake Swipe'), 'missing: Codemagic ASC integration');"
          if old in t: t=t.replace(old,new,1)
          elif new not in t: raise SystemExit('unknown preflight assertion state')
          v.write_text(t,encoding='utf-8')
          PY
      - name: Validate safety contract
        run: |
          set -euo pipefail
          node tsukanshi-sprint/validate-apple-preflight.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('codemagic.yaml').read_text(); block=s.split('\n  tsukanshi-ios:',1)[1].split('\n  ',1)[0]
          assert 'Codemagic Shiwake Swipe' in block and 'submit_to_testflight: false' in block and 'submit_to_app_store: false' in block
          print('PASS: tsukanshi Codemagic contract fail-closed')
          PY
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add codemagic.yaml tsukanshi-sprint/validate-apple-preflight.mjs; git diff --cached --check; git diff --cached --quiet && exit 0; git commit -m 'fix(tsukanshi): reconcile Codemagic release safety'; git push origin HEAD:main
