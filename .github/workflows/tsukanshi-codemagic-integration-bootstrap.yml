name: Tsukanshi Codemagic workflow restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tsukanshi-codemagic-integration-bootstrap.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor == 'ALLSUNDAY1122'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore one fail-closed Pure SwiftUI workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('codemagic.yaml')
          s=root.read_text(encoding='utf-8')
          marker='\n  tsukanshi-ios:'
          if marker in s:
              raise SystemExit('tsukanshi-ios already exists; refusing duplicate restore')
          candidate=Path('tsukanshi-sprint/native-ios/codemagic-native-workflow.yaml').read_text(encoding='utf-8')
          block=candidate[candidate.index('tsukanshi-ios:'):]
          block=block.replace('app_store_connect: codemagic','app_store_connect: "Codemagic Shiwake Swipe"',1)
          block=block.replace('submit_to_testflight: true','submit_to_testflight: false',1)
          if block.count('tsukanshi-ios:') != 1: raise SystemExit('candidate workflow count mismatch')
          for required in ['TsukanshiNative.xcodeproj','TsukanshiNative','jp.allsunday1122.tsukanshi','testFlightInternalTestingOnly','submit_to_testflight: false','submit_to_app_store: false','Codemagic Shiwake Swipe']:
              if required not in block: raise SystemExit('missing required contract: '+required)
          indented='\n'.join(('  '+line if line else '') for line in block.splitlines())
          root.write_text(s.rstrip()+'\n\n'+indented+'\n',encoding='utf-8')
          v=Path('tsukanshi-sprint/validate-apple-preflight.mjs')
          t=v.read_text(encoding='utf-8')
          old="includes(block, 'app_store_connect: codemagic', 'Codemagic ASC integration');"
          new="must(block.includes('app_store_connect: Codemagic Shiwake Swipe') || block.includes('app_store_connect: \\\"Codemagic Shiwake Swipe\\\"'), 'missing: Codemagic ASC integration');"
          if t.count(old) != 1: raise SystemExit('preflight before-state mismatch')
          v.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate restored contract
        run: |
          set -euo pipefail
          node tsukanshi-sprint/validate-apple-preflight.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('codemagic.yaml').read_text(encoding='utf-8')
          assert s.count('\n  tsukanshi-ios:') == 1
          block=s.split('\n  tsukanshi-ios:',1)[1]
          assert 'Codemagic Shiwake Swipe' in block
          assert 'TsukanshiNative.xcodeproj' in block and 'XCODE_SCHEME: TsukanshiNative' in block
          assert 'submit_to_testflight: false' in block and 'submit_to_testflight: true' not in block
          assert 'submit_to_app_store: false' in block and 'submit_to_app_store: true' not in block
          print('PASS: restored fail-closed Pure SwiftUI Codemagic workflow')
          PY
      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml tsukanshi-sprint/validate-apple-preflight.mjs
          git diff --cached --quiet && { echo 'No change required'; exit 0; }
          git commit -m 'fix(tsukanshi): restore Pure SwiftUI Codemagic workflow'
          git push origin HEAD:main
