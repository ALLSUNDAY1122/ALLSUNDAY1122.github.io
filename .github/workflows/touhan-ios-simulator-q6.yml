name: Touhan Q6 iOS Simulator Build and Launch (PR-head verification v2)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-ios-simulator-q6.yml'
      - 'touroku-hanbaisha-ios/native-ios/Sources/TouhanSprintApp.swift'
      - 'touroku-hanbaisha-ios/native-ios/project.yml'
      - 'touroku-hanbaisha-ios/scripts/prepare_offline_web.py'
      - 'touroku-hanbaisha-ios/scripts/offline_learning.js'
      - 'touroku-hanbaisha-ios/scripts/offline_learning.css'
      - 'touroku-hanbaisha-ios/scripts/offline_learning_shell.html'
      - 'touroku-hanbaisha-sprint/official-practice.html'
      - 'touroku-hanbaisha-ios/scripts/test_offline_candidate.py'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - integration/explanation-ui-20261125
    paths:
      - '.github/workflows/touhan-ios-simulator-q6.yml'
      - 'touroku-hanbaisha-ios/native-ios/Sources/TouhanSprintApp.swift'
      - 'touroku-hanbaisha-ios/native-ios/project.yml'
      - 'touroku-hanbaisha-ios/scripts/prepare_offline_web.py'
      - 'touroku-hanbaisha-ios/scripts/offline_learning.js'
      - 'touroku-hanbaisha-ios/scripts/offline_learning.css'
      - 'touroku-hanbaisha-ios/scripts/offline_learning_shell.html'
      - 'touroku-hanbaisha-sprint/official-practice.html'
      - 'touroku-hanbaisha-ios/scripts/test_offline_candidate.py'
permissions:
  contents: write
concurrency:
  group: touhan-ios-sim-q6
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Xcode/Simulator environment and XcodeGen
        id: environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          brew install xcodegen
          xcodegen --version
          python3 -m venv "$RUNNER_TEMP/touhan-python"
          source "$RUNNER_TEMP/touhan-python/bin/activate"
          python -m pip install 'cairosvg==2.8.2'
          bash touroku-hanbaisha-ios/native-ios/prepare-ios.sh
          mkdir -p touroku-hanbaisha-ios/ci-evidence
      - name: Verify bundled OfflineWeb with all HTTP(S) requests blocked
        id: offline
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/touhan-playwright"
          source "$RUNNER_TEMP/touhan-playwright/bin/activate"
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install chromium webkit
          python touroku-hanbaisha-ios/scripts/test_offline_candidate.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('touroku-hanbaisha-ios/OFFLINE_Q4_BROWSER_20261125.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS' and d['bankCount']==599 and d['explanationsCount']==599
          assert d['browserEngines']=={'chromium':599,'webkit':599}
          assert d['externalRequests']==[] and d['pageErrors']==[]
          print('PASS: bundled file:// 599 questions + explanations, HTTP(S) blocked')
          PY
      - name: Generate Xcode project and build for iOS Simulator
        id: build
        run: |
          set -euxo pipefail
          cd touroku-hanbaisha-ios/native-ios
          xcodegen generate --spec project.yml
          xcodebuild -project TouhanSprint.xcodeproj -scheme TouhanSprint -configuration Debug -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/touhan-derived" CODE_SIGNING_ALLOWED=NO build >"$RUNNER_TEMP/touhan-xcodebuild.log" 2>&1 || { tail -160 "$RUNNER_TEMP/touhan-xcodebuild.log"; exit 1; }
          grep 'BUILD SUCCEEDED' "$RUNNER_TEMP/touhan-xcodebuild.log"
          APP="$RUNNER_TEMP/touhan-derived/Build/Products/Debug-iphonesimulator/TouhanSprint.app"
          test -d "$APP"
          test -s "$APP/OfflineWeb/official-practice.html"
          test -s "$APP/OfflineWeb/manifest.json"
          python3 - "$APP/OfflineWeb" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          m=json.loads((p/'manifest.json').read_text())
          h=(p/'official-practice.html').read_text()
          assert m['count']==599 and m['explanationsCount']==599
          assert 'id="offlineBank"' in h and 'id="offlineExplanations"' in h
          assert "connect-src 'none'" in h
          print('PASS: native .app contains 599-question and 599-explanation OfflineWeb bundle')
          PY
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.allsunday1122.tourokuhanbaisha'
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
      - name: Boot simulator, install app, launch and capture
        id: launch
        run: |
          set -euxo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for v in d.values() for x in v if x["isAvailable"] and "iPhone" in x["name"]]; print(a[0]["udid"] if a else "")')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "${{ steps.build.outputs.app_path }}"
          xcrun simctl launch "$DEVICE" com.allsunday1122.tourokuhanbaisha | tee "$RUNNER_TEMP/touhan-launch.txt"
          grep 'com.allsunday1122.tourokuhanbaisha:' "$RUNNER_TEMP/touhan-launch.txt"
          sleep 12
          xcrun simctl io "$DEVICE" screenshot touroku-hanbaisha-ios/ci-evidence/simulator-launch.png
          test -s touroku-hanbaisha-ios/ci-evidence/simulator-launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -F 'com.allsunday1122.tourokuhanbaisha' > "$RUNNER_TEMP/touhan-launchctl.txt"
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "TouhanSprint"' > "$RUNNER_TEMP/touhan-simulator.log" || true
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Verify native home, local records and resume after process restart
        id: learning
        run: |
          set -euxo pipefail
          DEVICE="${{ steps.launch.outputs.device }}"
          BUNDLE=com.allsunday1122.tourokuhanbaisha
          EVID=touroku-hanbaisha-ios/ci-evidence
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" --touhan-ui-smoke-write
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          for i in $(seq 1 30); do test -s "$DATA/Documents/touhan-smoke-write.json" && break; sleep 1; done
          cp "$DATA/Documents/touhan-smoke-write.json" "$EVID/smoke-write.json"
          cat "$EVID/smoke-write.json"
          python3 -c 'import json; d=json.load(open("touroku-hanbaisha-ios/ci-evidence/smoke-write.json")); assert d["status"]=="PASS" and d["progress"]==1 and d["position"]==1,d'
          xcrun simctl io "$DEVICE" screenshot "$EVID/learning-records.png"
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" --touhan-ui-smoke-read
          for i in $(seq 1 30); do test -s "$DATA/Documents/touhan-smoke-read.json" && break; sleep 1; done
          cp "$DATA/Documents/touhan-smoke-read.json" "$EVID/smoke-read.json"
          cat "$EVID/smoke-read.json"
          python3 -c 'import json; d=json.load(open("touroku-hanbaisha-ios/ci-evidence/smoke-read.json")); assert d["status"]=="PASS" and d["progress"]==2 and d["accuracy"]=="50%" and d["attempts"]==2,d'
          xcrun simctl io "$DEVICE" screenshot "$EVID/learning-restored.png"
      - name: Record current-head Q4/Q6 evidence to PR branch
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          DEVICE: ${{ steps.launch.outputs.device }}
        run: |
          set -euxo pipefail
          test "$TARGET_BRANCH" != "main"
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          b=Path('touroku-hanbaisha-ios')
          browser=json.loads((b/'OFFLINE_Q4_BROWSER_20261125.json').read_text())
          app=b/'native-ios/OfflineWeb'
          manifest=json.loads((app/'manifest.json').read_text())
          html=(app/'official-practice.html').read_text()
          assert manifest['count']==599 and manifest['explanationsCount']==599
          assert 'id="offlineBank"' in html and 'id="offlineExplanations"' in html
          assert browser['externalRequests']==[] and browser['pageErrors']==[]
          stamp=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat()
          q4={**browser,'timestampJST':stamp,'nativeSimulatorOfflineBundleVerified':True,
              'nativeBundleManifest':manifest,'githubRunId':int(os.environ['RUN_ID']),
              'testedHead':os.environ['HEAD_SHA'],
              'limits':['Simulator file:// bundle and browser HTTP(S)-blocked test passed.',
                        'Physical iPhone airplane-mode test not performed.',
                        'App Store Connect/TestFlight installation not performed.']}
          (b/'OFFLINE_Q4_20261125.json').write_text(json.dumps(q4,ensure_ascii=False,indent=2)+'\n')
          q6={'schema':'touhan-q6-ios-simulator-v1','timestampJST':stamp,'status':'PASS',
              'environment':'success','build':'success','installAndLaunch':'success',
              'learningPersistence':'PASS','offlineBundleVerified':True,
              'githubRunId':int(os.environ['RUN_ID']),'headSHA':os.environ['HEAD_SHA'],
              'device':os.environ['DEVICE'],'bankCount':599,'explanationsCount':599,
              'smokeWrite':json.loads((b/'ci-evidence/smoke-write.json').read_text()),
              'smokeRead':json.loads((b/'ci-evidence/smoke-read.json').read_text()),
              'limits':['No physical iPhone test','No TestFlight installation']}
          (b/'IOS_SIMULATOR_Q6_20261125.json').write_text(json.dumps(q6,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-ios/OFFLINE_Q4_20261125.json touroku-hanbaisha-ios/IOS_SIMULATOR_Q6_20261125.json touroku-hanbaisha-ios/OFFLINE_Q4_BROWSER_20261125.json
          git commit -m 'audit(touhan): record current-head native simulator and offline evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-q6-ios-simulator-evidence
          path: |
            touroku-hanbaisha-ios/ci-evidence/
            ${{ runner.temp }}/touhan-xcodebuild.log
            ${{ runner.temp }}/touhan-simulator.log
          if-no-files-found: ignore


# Current-branch validation trigger: keep offline 599 + native Simulator checks enabled.

# Re-run after moving per-question attribution into the answer feedback card.

# Re-run after explicit feedback-card attribution cleanup and reattachment fix.
