name: Central A Round08 Validation Debug v3

on:
  push:
    branches: ['audit/central-a-round08-audit-helper-20260725']
    paths: ['.github/workflows/central-a-round08-validation-helper.yml']

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-08-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture validation output
        shell: bash
        working-directory: jichitai-compare
        run: |
          set +e
          npm run generate > /tmp/round08-debug.txt 2>&1
          echo "generate_exit=$?" >> /tmp/round08-debug.txt
          npm run progress >> /tmp/round08-debug.txt 2>&1
          echo "progress_exit=$?" >> /tmp/round08-debug.txt
          npm run validate:generated >> /tmp/round08-debug.txt 2>&1
          echo "validate_exit=$?" >> /tmp/round08-debug.txt
          node --check app.js >> /tmp/round08-debug.txt 2>&1
          echo "syntax_exit=$?" >> /tmp/round08-debug.txt
          set -e
          cp /tmp/round08-debug.txt operations/control/central-a-scope-round-08-validation-debug.txt
          git checkout -- data/generated/municipalities.json operations/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/control/central-a-scope-round-08-validation-debug.txt
          git commit -m 'debug: 滋賀県監査の検証エラーを記録'
          git push origin HEAD:audit/central-a-round08-debug-output-20260725
