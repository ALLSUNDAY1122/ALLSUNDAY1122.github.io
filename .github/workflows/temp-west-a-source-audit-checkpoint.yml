name: Temporary West-A Source Audit Checkpoint

on:
  pull_request:
    paths:
      - '.github/workflows/temp-west-a-source-audit-checkpoint.yml'
      - 'jichitai-compare/operations/control/session-checkpoints/west-a.json'

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'ops/west-a-source-audit-checkpoint-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update checkpoint evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/west-a.json';
          const checkpoint = JSON.parse(fs.readFileSync(path, 'utf8'));
          const note1 = '西日本A担当6県226自治体の公式出典2,444 URLを横断監査し、404・410候補28 URLを修正9・CMS誤検出19・未解決0へ分類した。';
          const note2 = '和気町・益城町・小豆島町・和泊町を公開スモークへ追加し、代表14自治体の修正文言・新出典URL・旧情報不存在を恒久監視する。';

          checkpoint.updatedAt = '2026-07-25T04:10:00+09:00';
          checkpoint.nextAction = '公式情報更新、出典URL異常、CI異常、公開文言異常が発生した場合のみ再調査する。公式出典監査は未解決0件。';
          checkpoint.sourceLinkAudit = {
            auditFile: 'jichitai-compare/operations/audits/west-a-source-link-remediation-final-20260725.json',
            auditedAt: '2026-07-25T03:48:00+09:00',
            municipalityCount: 226,
            referenceCount: 2691,
            uniqueUrlCount: 2444,
            initialHardFailureUrlCount: 28,
            correctedUrlCount: 9,
            confirmedCmsFalsePositiveUrlCount: 19,
            unresolvedUrlCount: 0,
            materialResearchErrorCount: 3,
            sourceMisassignmentCount: 1,
            sourceMaintenanceOnlyCount: 5,
            status: 'completed_with_corrections'
          };

          checkpoint.completionEvidence.westASourceLinkAuditPullRequestNumber = 3051;
          checkpoint.completionEvidence.westASourceLinkAuditFirstCiRunNumber = 7451;
          checkpoint.completionEvidence.westASourceLinkAuditNormalGetCiRunNumber = 7470;
          checkpoint.completionEvidence.westASourceLinkRemediationPullRequestNumbers = [3074, 3089, 3100];
          checkpoint.completionEvidence.westASourceLinkNationalPullRequestNumber = 3119;
          checkpoint.completionEvidence.westASourceLinkNationalCiRunNumber = 7606;
          checkpoint.completionEvidence.westAPublicSmokeExtensionPullRequestNumber = 3123;
          checkpoint.completionEvidence.westAPublicSmokeExtensionLiveCiRunNumber = 7616;
          checkpoint.completionEvidence.westAPublicSmokeExtensionCleanCiRunNumber = 7619;
          checkpoint.completionEvidence.westAPublicSmokeSampleCount = 14;

          checkpoint.integrityAudit.auditedAt = '2026-07-25T04:10:00+09:00';
          checkpoint.integrityAudit.sourceLinkAudit = {
            scope: '西日本A担当6県226自治体の自治体公式URL・9制度主出典・追加出典',
            referenceCount: 2691,
            uniqueUrlCount: 2444,
            initialHardFailureUrlCount: 28,
            correctedUrlCount: 9,
            confirmedCmsFalsePositiveUrlCount: 19,
            unresolvedUrlCount: 0,
            remediationPullRequestNumbers: [3074, 3089, 3100],
            nationalPullRequestNumber: 3119,
            nationalCiRunNumber: 7606,
            status: 'completed_with_corrections'
          };

          const smoke = checkpoint.integrityAudit.publicCopyValidation.westAPublicSmoke;
          smoke.extensionPullRequestNumber = 3123;
          smoke.extensionLiveCiRunNumber = 7616;
          smoke.extensionCleanCiRunNumber = 7619;
          smoke.correctedMunicipalityCodes = [...new Set([
            ...(smoke.correctedMunicipalityCodes ?? []),
            '33346', '43443', '37324', '46533'
          ])];
          smoke.permanentSampleCount = 14;
          smoke.status = 'enabled';

          checkpoint.integrityAudit.notes = [...new Set([
            ...(checkpoint.integrityAudit.notes ?? []),
            note1,
            note2
          ])];

          fs.writeFileSync(path, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-west-a-source-audit-checkpoint.yml
          git add jichitai-compare/operations/control/session-checkpoints/west-a.json
          git commit -m 'ops: 西日本A公式出典監査と公開スモーク証跡を記録'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate checkpoint branch
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check scripts/smoke-public-site.mjs
