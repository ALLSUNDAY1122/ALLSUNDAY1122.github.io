name: HM1 exact eight Q101-Q110 rebuild regression
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - .github/workflows/hm1-exact-eight-q101-q110.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild baseline and revised bank and assert exact eight changes
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/hm1-q101-base 4622e8c429c7e3ed2b5655fdaf9469fa1608ec75
          node /tmp/hm1-q101-base/ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q101-base.log
          node ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q101-head.log
          node - <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('/tmp/hm1-q101-base/ios/health-manager-1/Resources/questions.json'));
          const head=JSON.parse(fs.readFileSync('ios/health-manager-1/Resources/questions.json'));
          const wanted=['2025-04-Q13','2025-04-Q14','2025-04-Q15','2025-04-Q18','2025-04-Q19','2025-04-Q20','2025-04-Q21','2025-04-Q22'].sort();
          const normalize=s=>String(s||'').normalize('NFKC').replace(/次の記述のうち/g,'').replace(/次のうち/g,'').replace(/法令上/g,'').replace(/正しいものはどれか/g,'').replace(/誤っているものはどれか/g,'').replace(/[\\s\\p{P}\\p{S}]/gu,'').toLowerCase();
          for(const [tag,bank] of [['baseline',base],['revised',head]]){
            if(bank.length!==264)throw Error(tag+' bank length '+bank.length);
            if(new Set(bank.map(q=>q.id)).size!==264)throw Error(tag+' duplicate IDs');
            if(new Set(bank.map(q=>normalize(q.stem))).size!==264)throw Error(tag+' duplicate normalized stems');
            for(const q of bank){
              if(!Array.isArray(q.choices)||q.choices.length!==5||new Set(q.choices).size!==5)throw Error(tag+' invalid choices '+q.id);
              if(!Number.isInteger(q.ans)||q.ans<0||q.ans>4)throw Error(tag+' invalid answer '+q.id);
            }
          }
          if(base.some((q,i)=>q.id!==head[i].id))throw Error('ID ordering changed');
          const actual=head.filter((q,i)=>JSON.stringify(q)!==JSON.stringify(base[i])).map(q=>q.id).sort();
          if(JSON.stringify(actual)!==JSON.stringify(wanted))throw Error('Wrong changed IDs '+JSON.stringify(actual));
          for(let i=0;i<head.length;i++){
            if(!wanted.includes(head[i].id))continue;
            if(base[i].ans!==head[i].ans)throw Error('Correct index changed '+head[i].id);
            for(const k of new Set([...Object.keys(base[i]),...Object.keys(head[i])])){
              if(JSON.stringify(base[i][k])!==JSON.stringify(head[i][k])&&!['stem','choices','short','detail','auditSourceURL'].includes(k))
                throw Error('Unapproved field '+head[i].id+' '+k);
            }
          }
          console.log('PASS: regenerated baseline and revised both 264; exact eight target IDs changed; other 256 byte-equivalent records; five distinct choices per question; order, uniqueness, answer indices preserved.');
          NODE
