name: Temporary sync public 504 1916

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-public-504-1916.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build assignment-filtered state
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
          git checkout -B coord/state-after-public-504-20260722-1916 origin/main
          echo '' | base64 -d > /tmp/sync.py
          python3 /tmp/sync.py
          read total north east central west < /tmp/queue-summary
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            jichitai-compare/operations/control/audit-log.jsonl
            jichitai-compare/operations/control/global-state.json
            jichitai-compare/operations/control/release-queue.json
          )
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}" | sort)" = "$(printf '%s\n' "${expected[@]}" | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${expected[@]}"
          git commit -m "統括管理: 公開504・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force origin HEAD:coord/state-after-public-504-20260722-1916
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-sync-public-504-1916.yml ]; then
            git rm .github/workflows/temp-sync-public-504-1916.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 公開504キュー同期一時ワークフローを削除'
            git push origin HEAD:main
          fi
