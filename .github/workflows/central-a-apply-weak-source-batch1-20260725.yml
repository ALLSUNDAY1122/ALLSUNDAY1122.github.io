name: Central A Apply Weak Source Batch 1 20260725

on:
  push:
    branches:
      - audit/central-a-weak-sources-20260725-1123

permissions:
  contents: write

concurrency:
  group: central-a-weak-source-batch1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply confirmed corrections
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ROOT = 'jichitai-compare';
          const serviceKeys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const read = p => JSON.parse(fs.readFileSync(p,'utf8'));
          const write = (p,v) => fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          function syncTask(code, municipality, note) {
            const taskPath = path.join(ROOT,'operations','tasks',`${code}.json`);
            const task = read(taskPath);
            task.officialSources = serviceKeys.map(k => municipality.services[k].source.url);
            task.lastCheckedAt = '2026-07-25';
            task.lastUpdatedAt = '2026-07-25T11:27:00+09:00';
            task.lastUpdatedBy = '中日本調査班A（原因別重点再監査）';
            if (!task.notes.includes(note)) task.notes.push(note);
            write(taskPath,task);
          }

          {
            const code='18481';
            const p=path.join(ROOT,'data','municipalities','18',`${code}.json`);
            const m=read(p);
            m.updatedAt='2026-07-25';
            m.services.temporaryChildcare={
              status:'verified',
              summary:'生後6～7か月から就学前までの未就園児を対象に、町内施設で通常の一時預かりを実施する。こども誰でも通園制度は条例整備を確認したが、利用者向けの対象・施設・料金・申請条件は確認できない。',
              eligibility:{minAgeMonths:6,maxAgeYears:5},
              details:{
                types:'一時預かり（一般型）',
                target:'7か月から小学校就学前までの未就園児。高浜キッズこども園は生後6か月から',
                reasons:'保護者の病気、出産、冠婚葬祭、育児疲れ等で一時的に家庭保育ができない場合',
                facilities:'町内の保育所・認定こども園',
                hours:'月曜日から金曜日。一部施設は土曜日も実施',
                fee:'1日2,000円、半日1,000円、食事代350円',
                application:'事前予約が必要',
                anyChildStatus:'乳児等通園支援事業の条例・認可制度は整備済みだが、2026年度の利用者向け対象月齢、実施施設、利用料、利用時間、予約方法は公式公開を確認できないため確定しない'
              },
              source:{url:'https://www.town.takahama.fukui.jp/page/sougouseisaku/p007556.html',checkedAt:'2026-07-25'},
              additionalSources:[{url:'https://www.town.takahama.fukui.jp/reiki/reiki_taikei/r_taikei_08.html',checkedAt:'2026-07-25',description:'乳児等通園支援事業の条例体系。利用可能な対象・施設・料金の確定根拠には使用しない'}]
            };
            write(p,m);
            syncTask(code,m,'2026-07-25の原因別重点再監査で、条例整備だけを根拠にこども誰でも通園制度を実施中と断定していた記録を訂正。通常の一時預かりをverified根拠とし、誰でも通園の利用者向け条件は未公開として分離した。');
          }

          {
            const code='18483';
            const p=path.join(ROOT,'data','municipalities','18',`${code}.json`);
            const m=read(p);
            m.updatedAt='2026-07-25';
            m.services.temporaryChildcare={
              status:'verified',
              summary:'生後6か月から就学前までの児童を対象に、本郷こども園・名田庄こども園で通常の一時預かりを実施する。こども誰でも通園制度は計画記載を確認したが、利用者向けの対象・施設・料金・申請条件は確認できない。',
              eligibility:{minAgeMonths:6,maxAgeYears:5},
              details:{
                types:'一時預かり（一般型）',
                target:'おおい町在住で保育所等を利用していない生後6か月から就学前までの児童。里帰り出産等による帰省児童も対象',
                facilities:'本郷こども園、名田庄こども園',
                hours:'平日8時～16時、土曜日8時～正午',
                fee:'1日2,000円、半日1,000円。町民は2025年4月1日から第1子を含め無料',
                limit:'原則週3日以内（緊急預かりを除く）',
                application:'原則前日までに実施施設へ申込書を提出',
                anyChildStatus:'町こども計画には乳児等通園支援事業の確保方針があるが、2026年度の利用者向け対象月齢、実施施設、利用料、利用時間、予約方法は公式公開を確認できないため実施中と確定しない'
              },
              source:{url:'https://www.town.ohi.fukui.jp/1201/lifeevent02/p24008.html',checkedAt:'2026-07-25'},
              additionalSources:[{url:'https://www.town.ohi.fukui.jp/1201/lifeevent02/p10199_d/fil/kodomokeikaku.pdf',checkedAt:'2026-07-25',description:'乳児等通園支援事業の計画記載。利用可能な対象・施設・料金の確定根拠には使用しない'}]
            };
            write(p,m);
            syncTask(code,m,'2026-07-25の原因別重点再監査で、計画だけを根拠にこども誰でも通園制度を令和8年度実施中と断定していた記録を訂正。通常の一時預かりをverified根拠とし、誰でも通園の利用者向け条件は未公開として分離した。');
          }

          {
            const code='21403';
            const p=path.join(ROOT,'data','municipalities','21',`${code}.json`);
            const m=read(p);
            m.updatedAt='2026-07-25';
            m.services.schoolMeals={
              status:'verified',
              summary:'令和8年4月1日から当面の間、町立小学校児童・中学校生徒の学校給食費を0円とする。',
              eligibility:{minAgeMonths:72,maxAgeYears:15},
              details:{
                support:'町立小学校児童・中学校生徒の学校給食費を0円とする特例',
                start:'令和8年4月1日',
                period:'当面の間',
                ordinaryUnitPrice:'特例前の規則上の1食単価は小学校児童250円、中学校生徒290円',
                excludedScope:'児童生徒と同様の給食提供を受けるその他利用者は、小学生相当310円・中学生相当350円の規定が残る',
                serviceEvidence:'町公式の小中学校・給食センター案内および献立ページで学校給食の実施を確認'
              },
              source:{url:'https://www.town-ono.jp/reiki_int/reiki_honbun/i333RG00000742.html',checkedAt:'2026-07-25'},
              additionalSources:[
                {url:'https://www.town-ono.jp/0000001092.html',checkedAt:'2026-07-25',description:'令和8年度の教育案内'},
                {url:'https://www.town-ono.jp/0000000173.html',checkedAt:'2026-07-25',description:'学校給食献立の利用者向け案内'}
              ]
            };
            write(p,m);
            syncTask(code,m,'2026-07-25の原因別重点再監査で、令和8年度の給食費を旧1食単価・月額のまま記録していた誤りを訂正。令和8年4月1日から当面、小学校児童・中学校生徒は0円。');
          }

          const auditPath=path.join(ROOT,'operations','audits','central-a-weak-primary-source-batch1-decisions-20260725.json');
          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-weak-primary-source-batch1-decisions-20260725',
            decidedAt:'2026-07-25T11:27:00+09:00',
            session:'中日本調査班A',
            category:'weakPrimarySource',
            reviewedCandidates:[
              {code:'18481',name:'高浜町',service:'temporaryChildcare',previousBasis:'条例体系',decision:'通常一時預かりだけをverified根拠にし、誰でも通園の実施中断定を撤回',followUpIssue3141:true},
              {code:'18483',name:'おおい町',service:'temporaryChildcare',previousBasis:'こども計画',decision:'通常一時預かりだけをverified根拠にし、誰でも通園の実施中断定を撤回',followUpIssue3141:true},
              {code:'21403',name:'大野町',service:'schoolMeals',previousBasis:'旧単価を含む施行規則',decision:'令和8年4月1日施行の特例により児童生徒0円へ訂正',followUpIssue3141:false}
            ],
            confirmedCorrectionCount:3,
            issue3141Additions:[
              {code:'18481',name:'高浜町',service:'temporaryChildcare',reason:'条例は確認済みだが、対象月齢・実施施設・料金・利用時間・予約条件の利用者向け案内を確認できない'},
              {code:'18483',name:'おおい町',service:'temporaryChildcare',reason:'計画は確認済みだが、対象月齢・実施施設・料金・利用時間・予約条件の利用者向け案内を確認できない'}
            ],
            evidence:[
              {code:'18481',officialUserPage:'https://www.town.takahama.fukui.jp/page/sougouseisaku/p007556.html',checkedAt:'2026-07-25'},
              {code:'18483',officialUserPage:'https://www.town.ohi.fukui.jp/1201/lifeevent02/p24008.html',checkedAt:'2026-07-25'},
              {code:'21403',currentRule:'https://www.town-ono.jp/reiki_int/reiki_honbun/i333RG00000742.html',servicePage:'https://www.town-ono.jp/0000000173.html',checkedAt:'2026-07-25'}
            ],
            policy:'条例・計画だけでは利用可能な誰でも通園制度と断定しない。複合制度キーは、通常一時預かりを確認できる場合のみverifiedを維持し、未確定の誰でも通園部分を明示する。'
          };
          write(auditPath,audit);

          const candidatePath=path.join(ROOT,'operations','audits','central-a-weak-primary-source-candidates-20260725.json');
          const candidates=read(candidatePath);
          function sourceType(url='') {
            let pathname='';
            try { pathname=new URL(url).pathname.toLowerCase(); } catch { pathname=url.toLowerCase(); }
            if (/\/reiki|reiki_|g-reiki|jourei|条例/.test(url.toLowerCase())) return 'ordinance';
            if (/yosan|予算/.test(url.toLowerCase())) return 'budget';
            if (/gian|議案/.test(url.toLowerCase())) return 'bill';
            if (/keikaku|plan|計画/.test(url.toLowerCase())) return 'plan';
            if (pathname==='/' || pathname==='') return 'municipality_root';
            return 'other';
          }
          for (const item of candidates.items) item.sourceType=sourceType(item.sourceUrl);
          candidates.firstBatch=candidates.items.slice(0,15);
          candidates.byType={};
          for(const item of candidates.items)candidates.byType[item.sourceType]=(candidates.byType[item.sourceType]??0)+1;
          candidates.classificationCorrectedAt='2026-07-25T11:27:00+09:00';
          candidates.resolvedInBatch1=['18481:temporaryChildcare','18483:temporaryChildcare','21403:schoolMeals'];
          write(candidatePath,candidates);
          NODE
      - name: Validate source JSON
        working-directory: jichitai-compare
        run: |
          node ./scripts/validate-data.mjs
          node --check app.js
          node -e "const a=require('./operations/audits/central-a-weak-primary-source-batch1-decisions-20260725.json');if(a.confirmedCorrectionCount!==3)process.exit(1)"
          node -e "const m=require('./data/municipalities/21/21403.json');if(!m.services.schoolMeals.summary.includes('0円'))process.exit(1)"
          node -e "const a=require('./data/municipalities/18/18481.json');if(a.services.temporaryChildcare.source.url.includes('/reiki/'))process.exit(1)"
          node -e "const a=require('./data/municipalities/18/18483.json');if(a.services.temporaryChildcare.source.url.endsWith('.pdf'))process.exit(1)"
      - name: Commit corrections and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/central-a-apply-weak-source-batch1-20260725.yml
          git add -A
          git commit -m "fix: 弱い主出典第1群の確定誤り3件を訂正"
          git push origin HEAD:audit/central-a-weak-sources-20260725-1123
