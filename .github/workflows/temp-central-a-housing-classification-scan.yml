name: Temporary Central A Housing Classification Scan

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-scan-trigger-20260725.json

permissions:
  contents: write

jobs:
  scan:
    if: github.head_ref == 'audit/central-a-housing-classification-scan-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scan branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract likely general housing misclassification candidates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare/data/municipalities';
          const outPath = 'jichitai-compare/operations/audits/central-a-housing-classification-candidates-20260725.json';
          const prefectures = new Set(['16','17','18','21','22','23','24','25','27','28']);
          const childTerms = /(子育て|子ども|こども|児童|多子|ひとり親|母子|父子|妊娠|出産|新婚|若年夫婦|義務教育終了前|18歳未満|中学生以下|高校生以下)/;
          const generalTerms = /(移住|定住|空き家|空家|耐震|住宅取得|新築|リフォーム|改修|除却|家財|引越|転入|結婚新生活|若者世帯|住宅ローン)/;
          const candidates = [];

          for (const pref of fs.readdirSync(root)) {
            if (!prefectures.has(pref)) continue;
            const dir = path.join(root, pref);
            for (const name of fs.readdirSync(dir)) {
              if (!name.endsWith('.json')) continue;
              const file = path.join(dir, name);
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const svc = data.services?.housingSupport;
              if (!svc || svc.status !== 'verified') continue;
              const text = JSON.stringify({ summary: svc.summary, eligibility: svc.eligibility, details: svc.details });
              const hasChildTerm = childTerms.test(text);
              const hasGeneralTerm = generalTerms.test(text);
              if (!hasGeneralTerm || hasChildTerm) continue;
              const riskTerms = [];
              for (const term of ['移住','定住','空き家','空家','耐震','住宅取得','新築','リフォーム','改修','除却','家財','引越','転入','結婚新生活','若者世帯','住宅ローン']) {
                if (text.includes(term)) riskTerms.push(term);
              }
              candidates.push({
                code: data.code,
                name: data.name,
                prefecture: data.prefecture,
                status: svc.status,
                summary: svc.summary,
                sourceUrl: svc.source?.url ?? null,
                riskTerms,
                reason: 'housingSupportの要約・条件に一般住宅制度の語がある一方、子育て・児童・多子・ひとり親・妊娠出産・新婚等の対象条件を確認できない'
              });
            }
          }

          candidates.sort((a, b) => b.riskTerms.length - a.riskTerms.length || a.code.localeCompare(b.code));
          const result = {
            schemaVersion: '1.0.0',
            auditId: 'central-a-housing-classification-candidates-20260725',
            generatedAt: new Date().toISOString(),
            session: '中日本調査班A',
            scopeMunicipalities: 314,
            candidateCount: candidates.length,
            criteria: {
              requiredStatus: 'verified',
              generalHousingTermsPresent: true,
              childOrFamilySpecificTermsAbsent: true,
              note: '機械抽出候補であり、公式利用者向けページによる独立確認前にunavailableへ変更しない'
            },
            candidates
          };
          fs.mkdirSync(path.dirname(outPath), { recursive: true });
          fs.writeFileSync(outPath, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify({ candidateCount: candidates.length, top: candidates.slice(0, 20) }, null, 2));
          NODE

      - name: Commit candidate report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/central-a-housing-classification-candidates-20260725.json
          git commit -m 'audit: 中日本A住宅支援分類候補を抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
