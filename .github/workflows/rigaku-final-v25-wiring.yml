name: Rigaku Final v2.5 Release Wiring

on:
  push:
    branches:
      - feat/15-rigaku-sprint-native
    paths:
      - rigaku-sprint/finalize_v25_release_wiring.py
      - .github/workflows/rigaku-final-v25-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/15-rigaku-sprint-native
          fetch-depth: 0
      - name: Apply final product and release wiring
        run: python3 rigaku-sprint/finalize_v25_release_wiring.py
      - name: Validate Codemagic YAML syntax
        run: ruby -e "require 'yaml'; YAML.load_file('codemagic.yaml'); puts 'PASS: codemagic.yaml parses'"
      - name: Commit final wiring
        run: |
          if git diff --quiet; then
            echo "No final wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml \
            rigaku-sprint/ios/Sources/RigakuAppModel.swift \
            rigaku-sprint/ios/Sources/RigakuStudyView.swift \
            rigaku-sprint/ios/Sources/RigakuRootViewV2.swift \
            rigaku-sprint/ios/static_audit.py \
            rigaku-sprint/metadata/APP_STORE_METADATA_JA.md
          git commit -m "feat(rigaku): finalize v2.5 Internal TestFlight wiring"
          git push origin HEAD:feat/15-rigaku-sprint-native
