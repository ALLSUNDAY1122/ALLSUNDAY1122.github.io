name: Temporary North B Anyone Single Gap Batch 7 Final

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch7-final.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch7-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply final confirmed corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('jichitai-compare');
          const today = '2026-07-25';
          const now = '2026-07-25T17:20:00+09:00';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => {
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
            console.log(`updated ${path.relative(root, file)}`);
          };
          const municipalityPath = (code) => path.join(root, 'data', 'municipalities', code.slice(0, 2), `${code}.json`);

          function dedupeSources(items, excludedUrl = null) {
            const seen = new Set();
            const result = [];
            for (const item of items || []) {
              const url = typeof item === 'string' ? item : item?.url;
              if (!url || url === excludedUrl || seen.has(url)) continue;
              seen.add(url);
              result.push({ url, checkedAt: today });
            }
            return result;
          }

          function updateTask(code, note) {
            const municipality = read(municipalityPath(code));
            const file = path.join(root, 'operations', 'tasks', `${code}.json`);
            const task = read(file);
            task.lastCheckedAt = today;
            task.lastUpdatedAt = now;
            task.lastUpdatedBy = '北日本調査班B・品質改善第2監査';
            task.officialSources = [...new Set(Object.values(municipality.services || {})
              .map((service) => service?.source?.url)
              .filter(Boolean))];
            task.notes = [...(task.notes || []), note];
            write(file, task);
          }

          {
            const code = '06426';
            const file = municipalityPath(code);
            const data = read(file);
            const service = data.services.temporaryChildcare;
            service.summary = '2026年4月1日から、三川町在住で保育所等に通っていない生後6か月から満3歳未満児が、みかわ保育園を月10時間まで1時間300円で利用できる。通常の一時預かりも実施する。';
            service.details = { ...(service.details || {}), start: '2026年4月1日' };
            service.source.checkedAt = today;
            data.updatedAt = today;
            write(file, data);
            updateTask(code, '2026-07-25誰でも通園単一条件最終群監査：三川町公式ページで実施期間を令和8年4月1日からと確認。');
          }

          {
            const code = '06461';
            const file = municipalityPath(code);
            const data = read(file);
            const service = data.services.temporaryChildcare;
            service.summary = '2026年度から、保育所等に通っていない生後6か月から満3歳未満児が、遊佐保育園または藤崎保育園を月10時間まで1時間300円で利用できる。';
            service.details = {
              ...(service.details || {}),
              start: '2026年度',
              facility: '遊佐保育園、藤崎保育園'
            };
            service.source = {
              url: 'https://www.town.yuza.yamagata.jp/archive/p20260205165911',
              checkedAt: today
            };
            service.additionalSources = dedupeSources(service.additionalSources, service.source.url);
            data.updatedAt = today;
            write(file, data);
            updateTask(code, '2026-07-25誰でも通園単一条件最終群監査：遊佐町の利用者向け公式ページで令和8年度から実施、遊佐保育園・藤崎保育園、月10時間、1時間300円と確認。主出典を制度直接ページへ更新。');
          }

          {
            const code = '04361';
            const file = municipalityPath(code);
            const data = read(file);
            const service = data.services.temporaryChildcare;
            const oldPrimary = service.source?.url;
            const oldAdditional = service.additionalSources || [];
            service.summary = '通常の一時保育に加え、2025年12月から先行実施したこども誰でも通園制度で、生後6か月から満3歳未満の未就園児を亘理保育所で月10時間まで1時間300円で受け入れる。2026年4月1日から本格実施・広域利用に移行した。';
            service.eligibility = { ...(service.eligibility || {}), minAgeMonths: 6, maxAgeYears: 6 };
            service.details = {
              ...(service.details || {}),
              anyChildTarget: '亘理町内在住の生後6か月から満3歳未満で、保育所・幼稚園・認定こども園等に通っていない子ども。2026年4月1日以降は町外からの広域利用も可能',
              anyChildFacility: '亘理町立亘理保育所',
              anyChildHours: '平日9時から12時。原則3時間単位',
              anyChildLimit: '子ども1人につき月10時間まで',
              anyChildFee: '1時間300円。世帯状況による減免あり',
              start: '2025年12月（先行実施。2026年4月1日から本格実施）'
            };
            delete service.details.otherProgram;
            service.source = {
              url: 'https://www.town.watari.miyagi.jp/education/detail.php?content=2153',
              checkedAt: today
            };
            service.additionalSources = dedupeSources([...oldAdditional, oldPrimary], service.source.url);
            data.updatedAt = today;
            write(file, data);
            updateTask(code, '2026-07-25誰でも通園単一条件最終群監査：亘理町公式ページで令和7年12月の先行開始、令和8年4月1日からの本格実施・広域利用、対象・施設・時間・料金・月上限を確認。主出典を制度直接ページへ更新。');
          }

          {
            const code = '04404';
            const file = municipalityPath(code);
            const data = read(file);
            const service = data.services.temporaryChildcare;
            const oldPrimary = service.source?.url;
            const oldAdditional = service.additionalSources || [];
            service.summary = '通常の一時保育に加え、2026年4月から、保育所等に通っていない生後6か月から満3歳未満児が月10時間まで利用できるこども誰でも通園制度を実施する。';
            service.eligibility = { ...(service.eligibility || {}), minAgeMonths: 6, maxAgeYears: 5 };
            service.details = {
              ...(service.details || {}),
              anyChildTarget: '保育所等に通っていない生後6か月から満3歳未満の子ども',
              anyChildLimit: '子ども1人につき月10時間まで',
              start: '2026年4月'
            };
            delete service.details.otherProgram;
            service.source = {
              url: 'https://www.shichigahama.com/benricho/oshirase/kodomo3-050-12494.html',
              checkedAt: today
            };
            service.additionalSources = dedupeSources([...oldAdditional, oldPrimary], service.source.url);
            data.updatedAt = today;
            write(file, data);
            updateTask(code, '2026-07-25誰でも通園単一条件最終群監査：七ヶ浜町公式ページで令和8年4月開始、対象月齢、月10時間上限を確認。主出典を制度直接ページへ更新し、通常一時保育との複合記録を整理。');
          }

          updateTask('06403', '2026-07-25誰でも通園単一条件最終群監査：飯豊町の現行利用者向け公式ページで対象・施設・料金・月上限を再確認したが、町固有の開始時期の明記がないため開始時期は推測せず現状維持。');

          const auditPath = path.join(root, 'operations', 'audits', 'north-b-anyone-single-gap-batch7-final-review-20260725.json');
          write(auditPath, {
            schemaVersion: '1.0.0',
            auditId: 'north-b-anyone-single-gap-batch7-final-review-20260725',
            sessionId: 'north-b',
            reviewedAt: now,
            status: 'anyone_candidate_audit_completed',
            sourceAudit: 'operations/audits/north-b-fiscal-anyone-triage-20260725.json',
            scope: {
              candidatesReviewed: 5,
              municipalitiesCorrected: 4,
              noChangeMunicipalities: 1,
              statusChanges: 0,
              remainingUnreviewedCandidates: 0
            },
            corrected: [
              { code: '06426', municipality: '三川町', result: '令和8年4月1日開始を追記' },
              { code: '06461', municipality: '遊佐町', result: '令和8年度開始と実施2施設を追記し、制度直接ページを主出典化' },
              { code: '04361', municipality: '亘理町', result: '令和7年12月先行開始、令和8年4月本格実施、対象・時間・料金・上限を追記' },
              { code: '04404', municipality: '七ヶ浜町', result: '令和8年4月開始と対象月齢・月上限を追記し、制度直接ページを主出典化' }
            ],
            noChange: [
              { code: '06403', municipality: '飯豊町', result: '現行条件は確認できるが町固有の開始時期の明記がないため現状維持' }
            ],
            candidateReconciliation: {
              anyoneCandidateCount: 78,
              phase1AnyoneReviewed: 4,
              multipleGapReviewed: 9,
              singleGapReviewed: 65,
              totalReviewed: 78,
              previousCheckpointRemaining: 12,
              correctedRemainingUnreviewed: 0,
              explanation: '従来の残件数は確認済み・変更なし候補を重複計上していた。監査台帳の78候補を、先行4件・複数条件13件・単一条件65件で再集計し、未着手0件を確認した。'
            },
            policy: 'ページ更新日を制度開始日とみなさない。開始時期が公式に明記された自治体のみ補正し、未公表自治体は確認済み・変更なしとして監査完了に含める。'
          });

          const checkpointPath = path.join(root, 'operations', 'control', 'session-checkpoints', 'north-b.json');
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = now;
          checkpoint.workingBranch = 'audit/north-b-anyone-single-gap-batch7-final-20260725';
          checkpoint.pullRequestNumber = null;
          checkpoint.ciStatus = 'pending';
          checkpoint.nextAction = '誰でも通園候補78件の全件再監査完了。自治体JSON・task・生成JSON・公開ページの最終一括整合を確認する。';
          checkpoint.fiscalAnyoneAudit = {
            ...(checkpoint.fiscalAnyoneAudit || {}),
            singleGapBatch7Reviewed: 5,
            singleGapBatch7CorrectedMunicipalities: ['06426','06461','04361','04404'],
            singleGapBatch7NoChangeMunicipalities: ['06403'],
            singleGapBatch7AuditFile: 'operations/audits/north-b-anyone-single-gap-batch7-final-review-20260725.json',
            singleGapReviewedTotal: 65,
            anyoneReviewedTotal: 78,
            remainingAnyonePriorityBelow50: 0,
            candidateCountReconciliation: {
              anyoneCandidateCount: 78,
              phase1AnyoneReviewed: 4,
              multipleGapReviewed: 9,
              singleGapReviewed: 65,
              totalReviewed: 78,
              remainingUnreviewed: 0
            },
            status: 'anyone_candidate_audit_completed'
          };
          write(checkpointPath, checkpoint);
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit final audit result
        shell: bash
        run: |
          rm .github/workflows/temp-north-b-anyone-single-gap-batch7-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch7-final.yml \
                     jichitai-compare/data/municipalities/04/04361.json \
                     jichitai-compare/data/municipalities/04/04404.json \
                     jichitai-compare/data/municipalities/06/06426.json \
                     jichitai-compare/data/municipalities/06/06461.json \
                     jichitai-compare/operations/tasks/04361.json \
                     jichitai-compare/operations/tasks/04404.json \
                     jichitai-compare/operations/tasks/06403.json \
                     jichitai-compare/operations/tasks/06426.json \
                     jichitai-compare/operations/tasks/06461.json \
                     jichitai-compare/operations/audits/north-b-anyone-single-gap-batch7-final-review-20260725.json \
                     jichitai-compare/operations/control/session-checkpoints/north-b.json \
                     jichitai-compare/data/generated \
                     jichitai-compare/operations/progress.json \
                     jichitai-compare/municipality \
                     jichitai-compare/sitemap.xml
          git commit -m 'fix: 北日本B誰でも通園候補78件の最終監査を完了'
          git push origin HEAD:"${{ github.head_ref }}"
