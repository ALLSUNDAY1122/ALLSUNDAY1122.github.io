name: FP3 Review Screenshot

on:
  push:
    branches: [main]
    paths:
      - 'fp3-manabi-sprint/ios/**'
      - '.github/workflows/fp3-review-screenshot.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  capture:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[FP3-REVIEW-CAPTURE]'))
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare audited offline bundle
        run: bash fp3-manabi-sprint/ios/prepare-ios.sh
      - name: Generate Xcode project
        working-directory: fp3-manabi-sprint/ios
        run: xcodegen generate
      - name: Choose simulator
        id: sim
        run: |
          set -euo pipefail
          LINE=$(xcrun simctl list devices available | grep -m1 'iPhone')
          DEVICE=$(printf '%s\n' "$LINE" | sed -E 's/^[[:space:]]*([^\(]+) \(.*/\1/' | sed 's/[[:space:]]*$//')
          UDID=$(printf '%s\n' "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$DEVICE"
          test -n "$UDID"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Reset simulator before paywall capture
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
      - name: Run isolated paywall UI capture
        working-directory: fp3-manabi-sprint/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FP3ManabiSprint.xcodeproj \
            -scheme FP3ManabiSprint \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FP3ManabiSprintUITests/FP3PaywallReviewUITests/testCapturePremiumPaywall \
            -resultBundlePath "$RUNNER_TEMP/FP3Review.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$RUNNER_TEMP/fp3-review-test.log"
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fp3-review-attachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/FP3Review.xcresult" \
            --output-path "$RUNNER_TEMP/fp3-review-attachments"
          find "$RUNNER_TEMP/fp3-review-attachments" -type f -maxdepth 3 -print
      - name: Require captured PNG
        run: |
          COUNT=$(find "$RUNNER_TEMP/fp3-review-attachments" -type f \( -name '*.png' -o -name '*.PNG' \) | wc -l | tr -d ' ')
          test "$COUNT" -ge 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fp3-iap-review-paywall
          path: |
            ${{ runner.temp }}/fp3-review-attachments
            ${{ runner.temp }}/fp3-review-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `FP3 Review Screenshot finished. status=${{ job.status }}; run_id=${context.runId}. No App Store upload or review submission was performed.`
            });