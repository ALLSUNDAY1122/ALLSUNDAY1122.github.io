name: Kangoshi Verified Numeric Glyphs and Scenario Reaudit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kangoshi-dual-engine-480.yml'
permissions:
  contents: write
jobs:
  dual-engine-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF engines and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<3' pillow cairosvg
      - name: Fetch MHLW official PDF texts and answer sources
        run: python kangoshi-sprint/scripts/run_official_pdf_audit.py
      - name: Read staged 480 keyed records from historic audit branch
        run: |
          set -euo pipefail
          mkdir -p kangoshi-sprint/product-content/keyed-candidates
          git fetch --no-tags --depth=1 origin feature/kangoshi-keyed-staging-45220877977
          for exam in 111 112; do
            for session in AM PM; do
              git show "FETCH_HEAD:kangoshi-sprint/product-content/keyed-candidates/exam${exam}-${session}-draft.json" > "kangoshi-sprint/product-content/keyed-candidates/exam${exam}-${session}-draft.json"
            done
          done
      - name: Generate visual evidence for remaining source-text and situation holds
        run: python kangoshi-sprint/scripts/context_control_visual_evidence.py
      - name: Overlay 22 independently confirmed quarantined text corrections
        run: python kangoshi-sprint/scripts/overlay_reextracted_pending.py
      - name: Diagnose PDF-number coordinates on source originals
        run: python kangoshi-sprint/scripts/debug_pdf_coordinates.py
      - name: Reextract original coordinate question regions by both independent PDF engines
        run: python kangoshi-sprint/scripts/reextract_coordinate_candidates.py
      - name: Save candidate before and after text comparisons
        run: cp kangoshi-sprint/audit/runs/dual-engine-20261124/coordinate-reextraction-evidence.json kangoshi-sprint/audit/coordinate-reextraction-evidence-20261124.json
      - name: Apply three PDF-and-image SHA-pinned numeric glyph repairs
        run: python kangoshi-sprint/scripts/apply_visual_glyph_evidence.py
      - name: Perform 480 question Poppler versus PyMuPDF dual engine and official key audit
        run: python kangoshi-sprint/scripts/bulk_dual_engine_verify.py
      - name: Produce 38 side-by-side source PDF versus image comparisons
        run: python kangoshi-sprint/scripts/build_media_comparison.py
      - name: Promote only independently verified items to nonpublishable canonical extension
        run: python kangoshi-sprint/scripts/promote_dual_engine.py
      - name: Update status from actual promotion and media audit evidence
        run: python kangoshi-sprint/scripts/write_release_audit_status.py
      - name: Persist canonical extensions and per-item PASS/HOLD evidence to GitHub main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kangoshi-sprint/product-content/verified-additions-20261124.json
          git add kangoshi-sprint/product-content/manifest.json
          git add kangoshi-sprint/audit/dual-engine-promotion-ledger-20261124.json
          git add kangoshi-sprint/audit/dual-engine-hold-20261124.json
          git add kangoshi-sprint/release-status.json kangoshi-sprint/RELEASE_STATUS.md
          git add kangoshi-sprint/audit/coordinate-reextraction-evidence-20261124.json
          git diff --cached --quiet || git commit -m "kangoshi: apply independent boundary/context recheck and persist source-only gates"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Upload source PDF visual evidence of pending cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kangoshi-context-control-visual-evidence
          path: kangoshi-sprint/audit/runs/context-control-visual-20261124/
          if-no-files-found: warn
      - name: Upload 480 record detailed gate report even when a failure occurs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kangoshi-480-dual-engine-evidence
          path: kangoshi-sprint/audit/runs/dual-engine-20261124/
          if-no-files-found: warn
      - name: Upload 38 media source-page visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kangoshi-media-38-visual-comparisons
          path: kangoshi-sprint/audit/runs/media-visual-20261124/
          if-no-files-found: warn
