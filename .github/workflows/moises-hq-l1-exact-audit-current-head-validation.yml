name: Moises HQ Lane1 Exact Audit Current Head Validation

on:
  push:
    branches:
      - moises/hq-l1-exact-audit-current-head-v1

permissions:
  contents: read

jobs:
  validate-current-head-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verify event head and target workflow binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          grep -F 'LANE1_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}' .github/workflows/moises-hq-lane1-exact-audit.yml

      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Run exact A26 on validation event head
        shell: bash
        run: |
          set -euo pipefail
          python3 tech-assets/moises-audio/Separation/Evaluation/lane1_dependency_audit.py \
            --audio-root tech-assets/moises-audio \
            --expected-git-head "$GITHUB_SHA" \
            --output /tmp/l1-current-head-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/l1-current-head-validation.json').read_text())
          assert report['overall_state'] == 'PASS', report
          assert report['git_head_binding']['state'] == 'PASS', report['git_head_binding']
          assert report['owned_source_snapshot']['state'] == 'PASS', report['owned_source_snapshot']
          assert report['dependency_contracts']['state'] == 'PASS', report['dependency_contracts']
          assert report['unittest_discovery']['state'] == 'PASS', report['unittest_discovery']
          print('L1_CURRENT_HEAD_A26_PASS')
          PY

      - name: Repeat full discovery 3x
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          for i in 1 2 3; do
            echo "===== validation full discovery ${i}/3 ====="
            python3 -m unittest discover -s Separation/Tests -p 'test_*.py'
          done

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane1-current-head-binding-validation
          path: /tmp/l1-current-head-validation.json
          if-no-files-found: error
          retention-days: 7
