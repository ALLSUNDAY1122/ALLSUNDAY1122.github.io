name: Release API Command Bus

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: release-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      (startsWith(github.event.issue.title, '[ASC-CMD]') || startsWith(github.event.issue.title, '[CM-CMD]') || startsWith(github.event.issue.title, '[PITARI-CMD]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Materialize non-secret command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(os.environ.get('ISSUE_BODY','').strip())
          if not isinstance(data,dict): raise SystemExit('Issue body must be one JSON object')
          forbidden=('secret','token','password','private_key','issuer_id','key_id','jwt','credential')
          if any(term in json.dumps(data,ensure_ascii=False).lower() for term in forbidden): raise SystemExit('Command issue must never contain credential fields or values')
          Path('/tmp/release-command.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Execute App Store Connect command
        if: startsWith(github.event.issue.title, '[ASC-CMD]')
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app_store_connect_gateway.py --command /tmp/release-command.json --output release-result.json
      - name: Execute APP2-003 Codemagic artifact readback
        if: startsWith(github.event.issue.title, '[CM-CMD] APP2-003 ARTIFACT')
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: python scripts/app2_003_codemagic_artifact_readback.py
      - name: Execute APP2-003 pinned Codemagic build
        if: startsWith(github.event.issue.title, '[CM-CMD] APP2-003 BUILD')
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: python scripts/app2_003_codemagic_build_start.py
      - name: Execute Codemagic command
        if: startsWith(github.event.issue.title, '[CM-CMD]') && !startsWith(github.event.issue.title, '[CM-CMD] APP2-003 ARTIFACT') && !startsWith(github.event.issue.title, '[CM-CMD] APP2-003 BUILD')
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: python scripts/codemagic_build_gateway.py --command /tmp/release-command.json --output release-result.json
      - name: Assemble Pitari encrypted payload
        if: startsWith(github.event.issue.title, '[PITARI-CMD] ASSEMBLE')
        run: |
          set -euo pipefail
          RID=$(python -c "import json;print(json.load(open('/tmp/release-command.json'))['request_id'])")
          case "$RID" in pitari-tar-eas-*) ;; *) echo invalid_request_id >&2; exit 2 ;; esac
          DIR="automation/pitari-tar-exchange/$RID"
          cat "$DIR/source.part00" "$DIR/source.part01" "$DIR/source.part02" "$DIR/source.part03" "$DIR/source.part04" > "$DIR/source.b64"
          ACTUAL=$(sha256sum "$DIR/source.b64" | awk '{print $1}')
          EXPECTED='c5b2c720db125b2b4f3cc971e93811e23ea75e4f3c52952631934a7ec4f43442'
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' '{"ready":true,"source_sha256":"3d9a0f25a7e5bf88a5dfd624af6823180dfb2e667e6cc4a5def0d8a122802dfb","encrypted_source_sha256":"a4c19282029356580bbc1f450a4a1085da338f3d51b6eff901e78bd9f29332ae","temporary_icon":true}' > "$DIR/ready.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR/source.b64" "$DIR/ready.json"
          git commit -m "Assemble Pitari encrypted payload $RID"
          git pull --rebase origin main
          git push origin HEAD:main
          printf '{"ok":true,"request_id":"%s","action":"pitari_assemble","source_b64_sha256":"%s","ready":true}\n' "$RID" "$ACTUAL" > release-result.json
      - name: Upload sanitized command result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-command-result-${{ github.event.issue.number }}-${{ github.run_id }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Report run locator to command issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const artifact = `release-command-result-${context.issue.number}-${context.runId}`;
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Release API command finished. status=${conclusion}; run_id=${context.runId}; artifact=${artifact}`});
