name: Release API Command Bus

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: release-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      (startsWith(github.event.issue.title, '[ASC-CMD]') || startsWith(github.event.issue.title, '[CM-CMD]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Materialize non-secret command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('ISSUE_BODY', '').strip()
          data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit('Issue body must be one JSON object')
          forbidden = ('secret','token','password','private_key','issuer_id','key_id','jwt','credential')
          lowered = json.dumps(data, ensure_ascii=False).lower()
          if any(term in lowered for term in forbidden):
              raise SystemExit('Command issue must never contain credential fields or values')
          Path('/tmp/release-command.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Execute App Store Connect command
        if: startsWith(github.event.issue.title, '[ASC-CMD]')
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python scripts/app_store_connect_gateway.py \
            --command /tmp/release-command.json \
            --output release-result.json

      - name: Execute Codemagic command
        if: startsWith(github.event.issue.title, '[CM-CMD]')
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          python scripts/codemagic_build_gateway.py \
            --command /tmp/release-command.json \
            --output release-result.json

      - name: Upload sanitized command result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-command-result-${{ github.event.issue.number }}-${{ github.run_id }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Report run locator to command issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const artifact = `release-command-result-${context.issue.number}-${context.runId}`;
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Release API command finished. status=${conclusion}; run_id=${context.runId}; artifact=${artifact}`
            });

  scan_hq_a2_gap_fix:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      github.event.issue.title == '[SCAN-HQ-CMD] A2 gap fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0

      - name: Apply audited A2 residual patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          Path('splat-native-ios/SplatNative/CaptureImageQuality.swift').write_text(r'''import CoreVideo
import Foundation

enum CaptureImageQualityRejection: String, Equatable, Sendable {
    case tooDark
    case tooBright
    case tooSoft

    var userMessage: String {
        switch self {
        case .tooDark: return "暗すぎるためこのフレームは保存しません。照明を増やすか、明るい方向から撮ってください"
        case .tooBright: return "白飛びが強いためこのフレームは保存しません。強い光を避けて撮ってください"
        case .tooSoft: return "手ブレまたはピンぼけが強いためこのフレームは保存しません。iPhoneをゆっくり動かしてください"
        }
    }
}

struct CaptureImageQualityStats: Equatable, Sendable {
    let meanLuma: Double
    let darkFraction: Double
    let highlightFraction: Double
    let lumaStandardDeviation: Double
    let laplacianScore: Double
    let sampleCount: Int
}

enum CaptureImageQualityPolicy {
    static func rejection(for stats: CaptureImageQualityStats) -> CaptureImageQualityRejection? {
        guard stats.sampleCount >= 64 else { return nil }
        if stats.meanLuma < 32, stats.darkFraction >= 0.60 { return .tooDark }
        if stats.meanLuma > 220, stats.highlightFraction >= 0.60 { return .tooBright }
        if stats.laplacianScore < 2.0, stats.lumaStandardDeviation < 14 { return .tooSoft }
        return nil
    }
}

enum CaptureImageQualityEvaluator {
    static func evaluate(pixelBuffer: CVPixelBuffer) -> CaptureImageQualityStats? {
        guard CVPixelBufferGetPlaneCount(pixelBuffer) > 0 else { return nil }
        CVPixelBufferLockBaseAddress(pixelBuffer, .readOnly)
        defer { CVPixelBufferUnlockBaseAddress(pixelBuffer, .readOnly) }
        guard let baseAddress = CVPixelBufferGetBaseAddressOfPlane(pixelBuffer, 0) else { return nil }
        let width = CVPixelBufferGetWidthOfPlane(pixelBuffer, 0)
        let height = CVPixelBufferGetHeightOfPlane(pixelBuffer, 0)
        let bytesPerRow = CVPixelBufferGetBytesPerRowOfPlane(pixelBuffer, 0)
        guard width >= 8, height >= 8, bytesPerRow >= width else { return nil }
        let bytes = baseAddress.assumingMemoryBound(to: UInt8.self)
        let stepX = max(4, width / 48)
        let stepY = max(4, height / 36)
        var count = 0
        var sum = 0.0
        var sumSquares = 0.0
        var dark = 0
        var highlight = 0
        var laplacianSum = 0.0
        var laplacianCount = 0
        var y = stepY
        while y < height - stepY {
            var x = stepX
            while x < width - stepX {
                let offset = y * bytesPerRow + x
                let center = Int(bytes[offset])
                count += 1
                sum += Double(center)
                sumSquares += Double(center * center)
                if center <= 22 { dark += 1 }
                if center >= 232 { highlight += 1 }
                let left = Int(bytes[y * bytesPerRow + x - 1])
                let right = Int(bytes[y * bytesPerRow + x + 1])
                let up = Int(bytes[(y - 1) * bytesPerRow + x])
                let down = Int(bytes[(y + 1) * bytesPerRow + x])
                laplacianSum += Double(abs(left + right + up + down - 4 * center))
                laplacianCount += 1
                x += stepX
            }
            y += stepY
        }
        guard count > 0 else { return nil }
        let mean = sum / Double(count)
        let variance = max(0, sumSquares / Double(count) - mean * mean)
        return CaptureImageQualityStats(
            meanLuma: mean,
            darkFraction: Double(dark) / Double(count),
            highlightFraction: Double(highlight) / Double(count),
            lumaStandardDeviation: variance.squareRoot(),
            laplacianScore: laplacianCount > 0 ? laplacianSum / Double(laplacianCount) : 0,
            sampleCount: count
        )
    }
}
''', encoding='utf-8')

          Path('splat-native-ios/SplatNativeTests/CaptureImageQualityTests.swift').write_text(r'''import XCTest

final class CaptureImageQualityTests: XCTestCase {
    func testRejectsSeverelyDarkFrame() {
        XCTAssertEqual(CaptureImageQualityPolicy.rejection(for: .init(meanLuma: 24, darkFraction: 0.82, highlightFraction: 0, lumaStandardDeviation: 10, laplacianScore: 4, sampleCount: 512)), .tooDark)
    }
    func testRejectsSeverelyClippedHighlights() {
        XCTAssertEqual(CaptureImageQualityPolicy.rejection(for: .init(meanLuma: 228, darkFraction: 0, highlightFraction: 0.76, lumaStandardDeviation: 12, laplacianScore: 5, sampleCount: 512)), .tooBright)
    }
    func testRejectsClearlySoftLowDetailFrame() {
        XCTAssertEqual(CaptureImageQualityPolicy.rejection(for: .init(meanLuma: 112, darkFraction: 0.02, highlightFraction: 0.02, lumaStandardDeviation: 9, laplacianScore: 1.2, sampleCount: 512)), .tooSoft)
    }
    func testAcceptsNormallyExposedDetailedFrame() {
        XCTAssertNil(CaptureImageQualityPolicy.rejection(for: .init(meanLuma: 116, darkFraction: 0.08, highlightFraction: 0.04, lumaStandardDeviation: 34, laplacianScore: 8, sampleCount: 512)))
    }
    func testSmallSampleFailsOpen() {
        XCTAssertNil(CaptureImageQualityPolicy.rejection(for: .init(meanLuma: 10, darkFraction: 1, highlightFraction: 0, lumaStandardDeviation: 0, laplacianScore: 0, sampleCount: 12)))
    }
}
''', encoding='utf-8')

          model = Path('splat-native-ios/SplatNative/ScanModel.swift')
          s = model.read_text(encoding='utf-8')
