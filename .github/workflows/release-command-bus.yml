          gate = '''        if let stats = CaptureImageQualityEvaluator.evaluate(pixelBuffer: frame.capturedImage),\n           let rejection = CaptureImageQualityPolicy.rejection(for: stats) {\n            trackingMessage = rejection.userMessage\n            return\n        }\n\n''' + jpeg
          if s.count(jpeg) != 1: raise SystemExit(f'jpeg anchor mismatch: {s.count(jpeg)}')
