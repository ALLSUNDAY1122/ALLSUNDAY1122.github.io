name: IT Passport IPA official PDF staging (non-release)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/itp-ipa-official-pdf-source-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itp-ipa-official-source-staging
  cancel-in-progress: false
jobs:
  source-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch IPA public PDFs and stage raw text with SHA-256, never mark audit PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/itp-ipa-pdf apps/it-passport-rebuild/questions/ipa-staging
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          out = Path('apps/it-passport-rebuild/questions/ipa-staging')
          rows = []
          for year in range(2022,2027):
              era = year - 2018
              row = {'year':year,'raw_text_only':True,'release_eligible':False,'files':{}}
              for typ in ('qs','ans'):
                  url=f'https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/pdf/questions/{year}r{era:02}_ip_{typ}.pdf'
                  pdf=Path(f'/tmp/itp-ipa-pdf/{year}-{typ}.pdf')
                  txt=out/f'{year}-{typ}-raw.txt'
                  command=['curl','--fail','--location','--silent','--show-error','--max-time','55','--retry','1','--user-agent','Mozilla/5.0 IT-Passport-Study-Source-Audit',url,'--output',str(pdf)]
                  run=subprocess.run(command,capture_output=True,text=True)
                  record={'status':'FETCH_FAILED','url_candidate':url,'http_exit_code':run.returncode}
                  if run.returncode == 0 and pdf.is_file() and pdf.read_bytes().startswith(b'%PDF'):
                      result=subprocess.run(['pdftotext','-layout',str(pdf),str(txt)],capture_output=True,text=True)
                      if result.returncode == 0 and txt.exists() and txt.stat().st_size > 100:
                          record={'status':'RAW_TEXT_EXTRACTED_NOT_AUDITED','verified_source_url':url,
                                  'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
                                  'pdf_bytes':pdf.stat().st_size,
                                  'raw_sha256':hashlib.sha256(txt.read_bytes()).hexdigest(),
                                  'raw_bytes':txt.stat().st_size,'raw_path':str(txt)}
                      else:
                          record={'status':'PDF_EXTRACT_FAILED','url_candidate':url}
                  elif run.returncode == 0:
                      record={'status':'NOT_PDF','url_candidate':url}
                  row['files'][typ]=record
              rows.append(row)
          p=out/'extraction-evidence.json'
          p.write_text(json.dumps({'official_source':'IPA','rights_conditions':'https://www.ipa.go.jp/shiken/faq.html','items':rows,'release_promoted':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps([{'year':r['year'],'qs':r['files']['qs']['status'],'ans':r['files']['ans']['status']} for r in rows],ensure_ascii=False))
          PY
      - name: Save staged evidence to canonical repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/it-passport-rebuild/questions/ipa-staging/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence(itp): preserve IPA official raw-PDF extraction, not audited'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Unable to push extracted evidence' >&2
          exit 1
