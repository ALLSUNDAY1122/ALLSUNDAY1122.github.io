name: Sync North B sanity audit round 03

on:
  push:
    branches:
      - coord/sync-north-b-sanity-round-03-20260725
    paths:
      - .github/workflows/sync-north-b-sanity-round-03.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: coord/sync-north-b-sanity-round-03-20260725
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync regional audit and regenerate public files
        shell: bash
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/04/04205.json \
            jichitai-compare/operations/tasks/04205.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          cd jichitai-compare
          npm run generate
          npm run progress
          cd ..
          rm .github/workflows/sync-north-b-sanity-round-03.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "全国品質同期: 北日本B誤調査再検証 第3回を反映"
          git push origin HEAD:coord/sync-north-b-sanity-round-03-20260725
