name: Temporary Sync Release Queue 241 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-241.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync release queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={
            'north':[('01433','妹背牛町')],
            'central':[('21505','八百津町'),('21506','白川町'),('21507','東白川村'),('21521','御嵩町')],
          }
          for entry in data['entries']:
              region=entry['region']
              existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(region,[]):
                  if code not in existing:
                      entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if region=='north':
                  entry['pendingSinceLastRelease']=0
                  entry['reason']='南幌町から妹背牛町までの追加10自治体を全国統合PR #436でmainへ統合し、生成・公開をPR #439で234自治体へ更新'
                  entry['mainIntegrationPr']=436
                  entry['generatedPullRequest']=439
              elif region=='central':
                  entry['pendingSinceLastRelease']=2
                  entry['reason']='揖斐川町から白川町までの追加10自治体を全国統合PR #437でmainへ統合し、生成・公開をPR #439で234自治体へ更新。その後、東白川村・御嵩町を地方統合'
                  entry['mainIntegrationPr']=437
                  entry['generatedPullRequest']=439
              elif region=='east':
                  entry['pendingSinceLastRelease']=3
              elif region=='west':
                  entry['pendingSinceLastRelease']=3
          data['updatedAt']='2026-07-22T03:58:00+09:00'
          summary=data['summary']
          summary['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          summary['waitingRegionalMergeMunicipalities']=0
          summary['releaseReadyRegions']=[]
          summary['auditBlockedRegions']=[]
          summary['lastNationalIntegrationAt']='2026-07-22T03:50:48+09:00'
          summary['lastNationalIntegrationPr']=437
          summary['latestGeneratedMunicipalityCount']=234
          summary['latestGeneratedPullRequest']=439
          summary['latestPublicCountPullRequest']=439
          if summary['regionalMergedMunicipalities'] != 241:
              raise SystemExit(f"expected 241, got {summary['regionalMergedMunicipalities']}")
          data['nextAction']='東日本・西日本が前回全国統合後3自治体で先行。中日本2、北日本0。各地域をコード昇順で継続し、10自治体到達時に全国統合する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-241.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-241.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合241自治体・公開234自治体へ同期'
          git push origin main
