name: Temporary Build East Release 10 1340

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-release-10-1340.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed East snapshot
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/coord/east-release-10-20260722-1340:refs/remotes/origin/coord/east-release-10-20260722-1340'
          git switch -C coord/east-release-10-20260722-1340 origin/coord/east-release-10-20260722-1340
          paths=(
            jichitai-compare/data/municipalities/09/09204.json
            jichitai-compare/operations/tasks/09204.json
            jichitai-compare/data/municipalities/09/09205.json
            jichitai-compare/operations/tasks/09205.json
            jichitai-compare/data/municipalities/09/09206.json
            jichitai-compare/operations/tasks/09206.json
            jichitai-compare/data/municipalities/09/09208.json
            jichitai-compare/operations/tasks/09208.json
            jichitai-compare/data/municipalities/09/09209.json
            jichitai-compare/operations/tasks/09209.json
            jichitai-compare/data/municipalities/09/09210.json
            jichitai-compare/operations/tasks/09210.json
            jichitai-compare/data/municipalities/09/09211.json
            jichitai-compare/operations/tasks/09211.json
            jichitai-compare/data/municipalities/09/09213.json
            jichitai-compare/operations/tasks/09213.json
            jichitai-compare/data/municipalities/09/09214.json
            jichitai-compare/operations/tasks/09214.json
            jichitai-compare/data/municipalities/09/09215.json
            jichitai-compare/operations/tasks/09215.json
          )
          git checkout origin/region/east -- "${paths[@]}"
          mapfile -t changed < <(git diff --name-only --cached | sort)
          printf '%s\n' "${paths[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "${#changed[@]}" -eq 20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 東日本10自治体の固定スナップショットを作成'
          git push origin coord/east-release-10-20260722-1340
