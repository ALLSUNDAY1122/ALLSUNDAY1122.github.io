name: Temporary Sync North 01428

on:
  push:
    branches: [region/north]
    paths:
      - .github/workflows/temp-sync-north-01428.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/north
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update task and region state
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          task_path=Path('jichitai-compare/operations/tasks/01428.json')
          task=json.loads(task_path.read_text(encoding='utf-8'))
          task['status']='merged'
          task['lastUpdatedAt']='2026-07-22T03:12:00+09:00'
          task['lastUpdatedBy']='統括'
          notes=task.setdefault('notes',[])
          for line in [
              '初回CI run #902はsickChildCareのeligibility欠落で失敗。',
              '病児・病後児保育に対象年齢0か月～12歳を追加し、CI run #903が成功。',
              'PR #423をregion/northへマージ。merge SHA: ae01489c959a379c2283f43cc4e3ec03e2aa8286'
          ]:
              if line not in notes: notes.append(line)
          task_path.write_text(json.dumps(task,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          state_path=Path('jichitai-compare/operations/control/regions/north.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          state.update({
              'currentMunicipalityCode':'01429',
              'currentMunicipalityName':'栗山町',
              'currentStage':'not_started',
              'completedServiceCount':0,
              'pendingServices':['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'],
              'workingBranch':None,
              'pullRequestNumber':None,
              'ciStatus':'not_started',
              'blockers':[],
              'lastAction':'倶知安町から赤井川村までの10自治体を全国統合PR #411・生成更新PR #415で公開214自治体へ同期。その後、南幌町、奈井江町、上砂川町、由仁町、長沼町をregion/northへ地方統合した。長沼町は年齢範囲を修正後、CI run #903成功でPR #423を統合した。',
              'nextAction':'栗山町（01429）の既存task・ブランチ・PR重複を確認し、未着手なら最新region/northからtaskと作業ブランチを作成して必須9制度を一括調査する。',
              'updatedAt':'2026-07-22T03:12:00+09:00',
              'completedMunicipalitiesSinceLastNationalMerge':5,
              'lastNationalIntegrationPr':411,
              'lastNationalIntegrationAt':'2026-07-22T02:37:27+09:00',
              'lastGeneratedPullRequest':415
          })
          state_path.write_text(json.dumps(state,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-north-01428.yml
          git add jichitai-compare/operations/tasks/01428.json jichitai-compare/operations/control/regions/north.json .github/workflows/temp-sync-north-01428.yml
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/temp-sync-north-01428.yml','jichitai-compare/operations/tasks/01428.json','jichitai-compare/operations/control/regions/north.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual ^ expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 長沼町統合後の北日本状態を更新'
          git push origin region/north
