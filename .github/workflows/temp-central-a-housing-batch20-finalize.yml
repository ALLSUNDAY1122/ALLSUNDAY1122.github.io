name: Temporary Central A Housing Batch 20 Finalize

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch20-finalize-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-housing-batch20-final-region-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          public_path=jichitai-compare/operations/audits/central-a-housing-classification-batch20-public-verification-20260726.json
          git show "origin/main:$public_path" > "$public_path"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const completedAt='2026-07-26T06:02:00+09:00';
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch20-decisions-20260726.json');
          const publicPath=path.join(root,'operations/audits/central-a-housing-classification-batch20-public-verification-20260726.json');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const publicEvidence=JSON.parse(fs.readFileSync(publicPath,'utf8'));
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(!publicEvidence.success)throw new Error('Public verification is not successful');
          audit.regionalMergePullRequestNumber=3795;audit.regionalWorkflowRunId=30174496683;audit.nationalSyncPullRequestNumber=3797;audit.nationalSyncWorkflowRunId=30174621284;audit.publicVerificationPullRequestNumber=3799;audit.publicVerificationWorkflowRunId=30174755042;audit.publicVerificationStatus='passed';audit.finalRegionPullRequestNumber=Number(process.env.PR_NUMBER);audit.finalRegionWorkflowRunId=Number(process.env.RUN_ID);audit.status='completed_public_verified_region_integrated';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          checkpoint.updatedAt=completedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.nextAction='一般住宅・移住制度の分類候補残74件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';checkpoint.qualityReaudit.latestCompletedAt=completedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=3795;checkpoint.qualityReaudit.latestCiRunNumber=30174496683;checkpoint.qualityReaudit.latestNationalPullRequestNumber=3797;checkpoint.qualityReaudit.latestPublicVerificationPullRequestNumber=3799;checkpoint.qualityReaudit.latestHousingBatch={batch:20,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:4,verifiedReplacementCount:1,remainingCandidates:74,regionalPullRequestNumber:3795,regionalWorkflowRunId:30174496683,nationalPullRequestNumber:3797,nationalWorkflowRunId:30174621284,publicVerificationPullRequestNumber:3799,publicVerificationWorkflowRunId:30174755042,finalRegionPullRequestNumber:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID),blocker:null};checkpoint.lastAction='住宅支援分類第20群の東栄町・桑名市・木曽岬町・菰野町・明和町を地域・全国へ反映し、公開5ページと全国JSONの一致を確認した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=completedAt;region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const resolution={schemaVersion:'1.0.0',resolutionId:'central-a-housing-batch20-resolution-20260726',session:'中日本調査班A',coordinatorSession:'統括B②',completedAt,category:'generalHousingMisclassification',scope:{reviewedMunicipalityCount:5,correctedMunicipalityCount:5,remainingHousingCandidates:74,correctedMunicipalitiesRechecked:154,primarySourceSlotsRechecked:586,weakPrimarySourceCandidates:33,issue3141UnresolvedItems:19},corrections:{statusToUnavailableCount:4,verifiedReplacementCount:1,codes:['23562','24205','24303','24341','24442']},evidence:{regionalPullRequest:3795,regionalWorkflowRunId:30174496683,nationalSyncPullRequest:3797,nationalSyncWorkflowRunId:30174621284,publicVerificationPullRequest:3799,publicVerificationWorkflowRunId:30174755042,finalRegionPullRequest:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID)},publicVerification:{pageCount:5,allPagesHttp200:true,statusSummarySourceMatch:true,publicMunicipalityCount:1741,publicServiceCount:15669},releaseGuard:{status:'resolved_no_release_blocker',blockers:[]},status:'completed_public_verified_region_integrated'};
          const resolutionPath=path.join(root,'operations/quality/central-a-housing-batch20-resolution-20260726.json');fs.mkdirSync(path.dirname(resolutionPath),{recursive:true});fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch20-finalize-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Remove regional runners and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temp-central-a-housing-batch20.yml \
            .github/workflows/temp-central-a-housing-batch20-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援第20群を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
