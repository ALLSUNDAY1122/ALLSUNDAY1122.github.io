name: APP Factory Platform Readback

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: app-factory-platform-readback
  cancel-in-progress: true

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.author_association == 'OWNER' && github.event.issue.title == '[APP-FACTORY] Platform Readback')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fresh read-only TestFlight and Codemagic state
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          FACTORY_PLATFORM_RESULT: factory-platform-readback.json
        run: python3 scripts/app_factory_platform_readback.py
      - name: Build concise canonical summary
        id: summary
        if: always() && hashFiles('factory-platform-readback.json') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('factory-platform-readback.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          lines=[f"completed_at={d.get('completed_at')} read_only={d.get('read_only')}"]
          workflows=(d.get('codemagic') or {}).get('workflow_latest') or {}
          # Drive the report from the fresh TestFlight set rather than a hard-coded four-app list.
          for label,tf in (d.get('testflight') or {}).items():
              s=(tf or {}).get('summary') or {}
              wf=workflows.get(label) or {}
              latest=wf.get('latest') or {}
              commit=latest.get('commit') or {}
              commit_hash=str(commit.get('hash') or '')[:12] or '-'
              msg=str(latest.get('message') or commit.get('message') or '').replace('\n',' ')[:120]
              lines.append(
                  f"{label}: TF build={s.get('latest_build')} state={s.get('latest_processing_state')} "
                  f"expired={s.get('latest_expired')} groups={s.get('beta_group_count')} | "
                  f"CM workflow={wf.get('workflow_id')} map={wf.get('mapping_source')} status={latest.get('status')} "
                  f"index={latest.get('index')} commit={commit_hash} branch={latest.get('branch')} "
                  f"started={latest.get('startedAt')} finished={latest.get('finishedAt')} "
                  f"actions={latest.get('actionCount')} artifacts={latest.get('artifactCount')} "
                  f"instance={latest.get('instanceType')} message={msg!r}"
              )
          summary='\n'.join(lines)
          print(summary)
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              f.write('text<<APP_FACTORY_EOF\n'+summary+'\nAPP_FACTORY_EOF\n')
          PY
      - name: Upload sanitized result
        if: always() && hashFiles('factory-platform-readback.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: app-factory-platform-readback
          path: factory-platform-readback.json
          if-no-files-found: error
          retention-days: 7
      - name: Report run
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v8
        env:
          READBACK_SUMMARY: ${{ steps.summary.outputs.text }}
        with:
          script: |
            const summary = process.env.READBACK_SUMMARY || 'summary unavailable';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Read-only platform readback finished. status=${{ job.status }}; run_id=${context.runId}\n\n\`\`\`text\n${summary}\n\`\`\``
            });
