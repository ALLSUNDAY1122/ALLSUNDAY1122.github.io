name: Temporary West State Evidence Sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/main-west-a-public-copy-guard-evidence-r2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate municipality project and state JSON
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check scripts/validate-municipality-pages.mjs

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/temp-west-state-evidence-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-west-state-evidence-sync.yml
          git commit -m 'ci: remove temporary West state validation workflow'
          git push origin HEAD:ops/main-west-a-public-copy-guard-evidence-r2
