name: Temporary West A School Meals Priority

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-priority-trigger-20260725.json

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'audit/west-a-school-meals-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Refine material risk candidates
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs'); const path=require('path');
          const prefs=['33','37','39','40','43','46'];
          const contradictions=[],staleTimeBound=[],policyOnly=[],weakUniversal=[],noConcrete=[];
          for(const pref of prefs){
            const dir=`jichitai-compare/data/municipalities/${pref}`;
            for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort()){
              const m=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8')); const s=m.services.schoolMeals;
              const summary=s.summary||''; const details=JSON.stringify(s.details||{}); const corpus=JSON.stringify(s); const url=s.source?.url||'';
              const summaryUniversal=/(学校給食費|給食費).{0,10}(完全無償|全額無償|無償化|無料|全額負担|実質0円)/.test(summary) && !/(小学校のみ|中学校のみ|第[23三二]子|半額|一部|就学援助|対象世帯|一定額|負担軽減|月額[0-9０-９]|1食[0-9０-９])/.test(summary);
              const restricted=/(第[23三二]子|多子|就学援助|要保護|準要保護|非課税|生活保護|ひとり親|半額|一部|上限|補助対象|対象世帯|所得|市外|町外|村外|小学校のみ|中学校のみ)/.test(details);
              const explicitUniversal=/(全児童|全生徒|全員|所得制限なし|一律|保護者負担なし|全額を.{0,8}負担|全額支援)/.test(details);
              const yearMatch=corpus.match(/(?:202[0-5]|令和[2-7２-７])(?:年度|年)/g)||[];
              const current=/(2026|令和8|令和８)(?:年度|年)/.test(corpus);
              const continuing=/(以降|当分の間|無期限|継続|恒久|毎年度|条例|規則|要綱|現在も|引き続き)/.test(corpus);
              const policy=/施政方針|市政方針|町政方針|村政方針|予算|計画|議会|所信表明|mayor|sisei|shisei/.test(url+' '+corpus);
              const weak=url===m.officialUrl || /\/$/.test(url) || /\/index\.(?:html?|php)$/.test(url);
              const concrete=/[0-9０-９][0-9０-９,，]*円|無償|無料|全額|半額|補助率|負担額|月額|一食|1食/.test(corpus);
              const row={code:m.code,prefectureCode:m.prefectureCode,prefecture:m.prefecture,name:m.name,status:s.status,summary,sourceUrl:url,checkedAt:s.source?.checkedAt||null,summaryUniversal,restricted,explicitUniversal,yearMarkers:[...new Set(yearMatch)],current,continuing,policy,weak,concrete};
              if(s.status==='verified'&&summaryUniversal&&restricted&&!explicitUniversal)contradictions.push(row);
              if(s.status==='verified'&&yearMatch.length&& !current&&!continuing)staleTimeBound.push(row);
              if(s.status==='verified'&&policy&&summaryUniversal)policyOnly.push(row);
              if(s.status==='verified'&&weak&&summaryUniversal)weakUniversal.push(row);
              if(s.status==='verified'&&!concrete)noConcrete.push(row);
            }
          }
          const unique=arr=>[...new Map(arr.map(x=>[x.code,x])).values()];
          const priority=unique([...contradictions,...staleTimeBound,...policyOnly,...weakUniversal,...noConcrete]);
          const report={schemaVersion:'1.0.0',auditId:'west-a-school-meals-priority-review-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),counts:{summaryUniversalDetailsRestricted:contradictions.length,staleTimeBoundWithoutContinuation:staleTimeBound.length,policyOnlyUniversalClaim:policyOnly.length,weakSourceUniversalClaim:weakUniversal.length,noConcreteCondition:noConcrete.length,priorityCandidateCount:priority.length},priorityCandidates:priority,summaryUniversalDetailsRestricted:contradictions,staleTimeBoundWithoutContinuation:staleTimeBound,policyOnlyUniversalClaim:policyOnly,weakSourceUniversalClaim:weakUniversal,noConcreteCondition:noConcrete,status:'priority_refinement_completed',unresolvedCount:priority.length};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report.counts));
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-priority-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-priority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json \
                  jichitai-compare/operations/control/west-a-school-meals-priority-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-priority.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A学校給食費候補を精密化'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
