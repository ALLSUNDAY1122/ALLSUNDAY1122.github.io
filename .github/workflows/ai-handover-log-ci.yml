name: AI Handover Log Flutter CI

on:
  push:
    branches:
      - agent/ai-handover-log-ci-v03
    paths:
      - apps/ai-handover-log/**
      - .github/workflows/ai-handover-log-ci.yml
  pull_request:
    paths:
      - apps/ai-handover-log/**
      - .github/workflows/ai-handover-log-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Decode source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          cat apps/ai-handover-log/source_chunks/chunk_*.b64 | base64 --decode > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/ai_handover_log_flutter/pubspec.yaml"

      - name: Generate clean Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=android,ios,web \
            --project-name=aihandoverlog \
            --org=jp.allsunday \
            "$RUNNER_TEMP/build"
          SOURCE="$RUNNER_TEMP/source/ai_handover_log_flutter"
          rm -rf "$RUNNER_TEMP/build/lib" "$RUNNER_TEMP/build/test"
          cp -R "$SOURCE/lib" "$RUNNER_TEMP/build/lib"
          cp -R "$SOURCE/test" "$RUNNER_TEMP/build/test"
          cp "$SOURCE/analysis_options.yaml" "$RUNNER_TEMP/build/analysis_options.yaml"
          cp apps/ai-handover-log/overrides/pubspec.yaml "$RUNNER_TEMP/build/pubspec.yaml"
          for item in docs scripts README.md CHANGELOG.md .gitignore; do
            if [ -e "$SOURCE/$item" ]; then
              cp -R "$SOURCE/$item" "$RUNNER_TEMP/build/$item"
            fi
          done
          if [ -d "$SOURCE/assets" ]; then
            rm -rf "$RUNNER_TEMP/build/assets"
            cp -R "$SOURCE/assets" "$RUNNER_TEMP/build/assets"
          fi
          flutter --version > "$RUNNER_TEMP/flutter-version.txt"
          cp "$RUNNER_TEMP/build/pubspec.yaml" "$RUNNER_TEMP/pubspec-used.yaml"

      - name: Apply product branding and v0.3 documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import plistlib

          root = Path(r'${{ runner.temp }}/build')

          plist_path = root / 'ios/Runner/Info.plist'
          with plist_path.open('rb') as f:
              plist = plistlib.load(f)
          plist['CFBundleDisplayName'] = 'AI引継ぎ帳'
          plist['CFBundleName'] = 'AI引継ぎ帳'
          with plist_path.open('wb') as f:
              plistlib.dump(plist, f, sort_keys=False)

          android_manifest = root / 'android/app/src/main/AndroidManifest.xml'
          text = android_manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="aihandoverlog"', 'android:label="AI引継ぎ帳"')
          android_manifest.write_text(text, encoding='utf-8')

          web_index = root / 'web/index.html'
          text = web_index.read_text(encoding='utf-8')
          text = text.replace('A new Flutter project.', '複数AIの長期作業を整理し、次のセッションへ引き継ぐオフラインアプリ。')
          text = text.replace('content="aihandoverlog"', 'content="AI引継ぎ帳"')
          text = text.replace('<title>aihandoverlog</title>', '<title>AI引継ぎ帳</title>')
          web_index.write_text(text, encoding='utf-8')

          manifest_path = root / 'web/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'AI引継ぎ帳'
          manifest['short_name'] = 'AI引継ぎ帳'
          manifest['description'] = '複数AIの長期作業を整理し、次のセッションへ引き継ぐオフラインアプリ。'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('# AI引継ぎ帳 — Flutter MVP v0.2', '# AI引継ぎ帳 — Flutter MVP v0.3')
          old_test = '''この環境にはFlutter SDKとXcodeがないため、実際の `flutter analyze`、`flutter test`、iOSビルドは未実行です。Dart全ファイルの構文区切り、JSON設計、YAML、参照関係は静的検査済みです。実行用テストコードとGitHub Actionsは同梱しています。'''
          new_test = '''GitHub ActionsのFlutter 3.44.7環境で依存解決、`dart format`、`flutter analyze`、9件の `flutter test --coverage`、`flutter build web --release` に成功しています。iOS標準プロジェクトは生成済みですが、XcodeによるiOSビルド、署名、iPhone実機、TestFlightは未実施です。'''
          readme = readme.replace(old_test, new_test)
          readme = readme.replace('v0.2は、App Store提出前のネイティブMVPです。', 'v0.3は、Flutter CI検証済みのApp Store提出前ネイティブMVPです。')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''# Changelog\n\n## 0.3.0 — 2026-07-22\n\n- Flutter 3.44.7 / Dart 3.12.2で依存解決を確認\n- `share_plus`を12.0.2へ変更し、`file_picker`との`win32`依存競合を解消\n- `flutter analyze`で問題なしを確認\n- モデル・引継ぎ・制御・画面の自動テスト9件に成功\n- Flutter Webリリースビルドに成功\n- iOS・Android・Webの標準プロジェクトを生成\n- iOS、Android、Webの表示名を「AI引継ぎ帳」に統一\n- CIログ、カバレッジ、検証済みプロジェクトZIPを生成\n\n'''
          if '## 0.3.0' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          status = '''# 開発状況 v0.3\n\n更新日：2026-07-22\n\n## 完了\n\n- Flutter 3.44.7 / Dart 3.12.2で依存解決\n- `dart format`\n- `flutter analyze`：問題なし\n- `flutter test --coverage`：9件成功\n- `flutter build web --release`：成功\n- iOS・Android・Web標準プロジェクト生成\n- iOS・Android・Web表示名設定\n- 端末内JSON保存、旧Web版移行、バックアップ・復元\n- 複数プロジェクト、AI担当、タスク、ログ、指示版、リスク、成果物\n- 引継ぎ生成、コピー、OS共有\n- 要件、設計、プライバシー、ストア資料\n\n## 未完了\n\n- XcodeでのiOSビルド\n- Apple Developer署名\n- iPhone実機動作\n- TestFlight\n- 正式アイコン\n- 初回説明画面\n- 機密情報注意表示\n- 課金方式の実装\n- App Store申請\n\n## 次の作業順\n\n1. iPhone向け初回説明と機密情報注意表示\n2. 正式アイコンと起動画面\n3. Mac / XcodeでiOSビルド\n4. iPhone実機テスト\n5. TestFlight\n6. 課金方式決定\n7. App Store提出\n\n## 現在のリスク\n\n- 市場規模と課金需要は未検証\n- iOS固有のファイル選択・共有動作は未検証\n- JSONバックアップは暗号化されない\n- 手動入力が多い場合、継続率が下がる可能性がある\n'''
          (root / 'docs/09_development_status.md').write_text(status, encoding='utf-8')

          report = '''# Flutter CI検証報告 v0.3\n\n検証日：2026-07-22\n\n- Flutter：3.44.7 stable\n- Dart：3.12.2\n- 依存解決：成功\n- 整形：成功\n- 静的解析：No issues found\n- 自動テスト：9件成功\n- Webリリースビルド：成功\n- iOS・Android・Web標準プロジェクト：生成済み\n\n初回CIでは `file_picker 11.0.2` と `share_plus 13.2.1` の `win32` 依存競合を検出しました。`share_plus 12.0.2`へ変更し解消しています。\n\n未検証項目は、macOS / XcodeでのiOSビルド、署名、iPhone実機、TestFlightです。\n'''
          (root / 'docs/11_ci_validation_v03.md').write_text(report, encoding='utf-8')
          PY

      - name: Resolve dependencies
        id: pubget
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-get.log"

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-handover-log-dependency-diagnostics
          path: |
            ${{ runner.temp }}/pub-get.log
            ${{ runner.temp }}/flutter-version.txt
            ${{ runner.temp }}/pubspec-used.yaml
          if-no-files-found: error

      - name: Stop when dependency resolution failed
        if: steps.pubget.outcome == 'failure'
        run: exit 1

      - name: Verify formatting
        working-directory: ${{ runner.temp }}/build
        run: dart format lib test

      - name: Analyze
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Test
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build web release
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee "$RUNNER_TEMP/web-build.log"

      - name: Package validated Flutter project
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          zip -qr "$RUNNER_TEMP/release/AI_Handover_Log_Flutter_v0.3_2026-07-22.zip" . \
            -x '.dart_tool/*' 'build/*' '.git/*' '.idea/*' '*.iml' \
               '.flutter-plugins-dependencies' 'android/local.properties' \
               'ios/Flutter/ephemeral/*' 'ios/Flutter/Generated.xcconfig' \
               'ios/Flutter/flutter_export_environment.sh'
          sha256sum "$RUNNER_TEMP/release/AI_Handover_Log_Flutter_v0.3_2026-07-22.zip" \
            > "$RUNNER_TEMP/release/AI_Handover_Log_Flutter_v0.3_2026-07-22.sha256"

      - name: Upload validated project, logs, web build and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-handover-log-ci-output
          path: |
            ${{ runner.temp }}/release/AI_Handover_Log_Flutter_v0.3_2026-07-22.zip
            ${{ runner.temp }}/release/AI_Handover_Log_Flutter_v0.3_2026-07-22.sha256
            ${{ runner.temp }}/analyze.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/web-build.log
            ${{ runner.temp }}/build/build/web
            ${{ runner.temp }}/build/coverage/lcov.info
          if-no-files-found: warn
