name: Temporary Sync Release Queue 408

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-408.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue from regional branches
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          entries={e['region']:e for e in q['entries']}
          state_fields={
            'north':'completedMunicipalitiesSinceLastNationalMerge',
            'east':'completedMunicipalitiesSinceLastNationalMerge',
            'central':'completedSinceLastRelease',
            'west':'completedMunicipalitiesSinceLastNationalMerge'
          }
          def show(ref,path):
            return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def assigned(region,pref):
            n=int(pref)
            return {
              'north':1<=n<=7,
              'east':8<=n<=15 or n in (19,20),
              'central':16<=n<=18 or 21<=n<=29,
              'west':31<=n<=47
            }[region]
          for region in ('north','east','central','west'):
            ref=f'origin/region/{region}'
            paths=subprocess.check_output(
              ['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],
              text=True
            ).splitlines()
            municipalities=[]
            for path in paths:
              if not re.search(r'/\d{5}\.json$',path):
                continue
              data=json.loads(show(ref,path))
              if assigned(region,data['prefectureCode']):
                municipalities.append({'code':data['code'],'name':data['name']})
            municipalities.sort(key=lambda x:x['code'])
            state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
            pending=int(state.get(state_fields[region],0))
            entry=entries[region]
            entry['municipalities']=municipalities
            entry['count']=len(municipalities)
            entry['pendingSinceLastRelease']=pending
            entry['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
            entry['reason']=f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
            entry['mainIntegrationPr']=state.get('lastNationalIntegrationPr')
            entry['generatedPullRequest']=640
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T13:34:00+09:00'
          q['status']='active'
          ready=[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10]
          q['summary']={
            'regionalMergedMunicipalities':total,
            'latestGeneratedMunicipalityCount':384,
            'latestGeneratedPullRequest':640,
            'latestPublicCountPullRequest':640,
            'releaseReadyRegions':ready,
            'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          }
          p.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(q['summary'],ensure_ascii=False))
          PY
          git add jichitai-compare/operations/control/release-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TOTAL=$(python3 -c "import json;print(json.load(open('jichitai-compare/operations/control/release-queue.json'))['summary']['regionalMergedMunicipalities'])")
          git commit -m "統括管理: 地方統合${TOTAL}自治体・公開384自治体へ同期"
          git push origin main
