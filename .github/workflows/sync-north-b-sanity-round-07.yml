name: Temporary main sync for North-B round 07

on:
  push:
    branches:
      - 'coord/sync-north-b-sanity-round-07-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[north-b-round07-main-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync regional corrections and audit
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/05/05349.json \
            jichitai-compare/data/municipalities/05/05363.json \
            jichitai-compare/data/municipalities/05/05434.json \
            jichitai-compare/operations/tasks/05349.json \
            jichitai-compare/operations/tasks/05363.json \
            jichitai-compare/operations/tasks/05434.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          cd jichitai-compare
          npm run generate
          npm run progress
      - name: Commit nationwide correction and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m '[north-b-round07-main-sync] audit: publish North-B round 07 corrections'
          git push
