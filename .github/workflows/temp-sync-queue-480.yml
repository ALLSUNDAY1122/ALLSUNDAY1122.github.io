name: Temporary Sync Queue 480 Final

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-sync-queue-480.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('jichitai-compare/operations/control/release-queue.json');q=json.loads(p.read_text());by={e['region']:e for e in q['entries']}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def owns(r,p):
              n=int(p);return {'north':1<=n<=7,'east':8<=n<=15 or n in(19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          for r in fields:
              ref=f'origin/region/{r}';items=[]
              for path in subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines():
                  if not re.search(r'/\d{5}\.json$',path):continue
                  d=json.loads(show(ref,path))
                  if owns(r,d['prefectureCode']):items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code']);s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json'));n=int(s.get(fields[r],0));e=by[r]
              e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':n,'releaseStatus':'release_ready' if n>=10 else 'pending_threshold','reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{n}自治体','mainIntegrationPr':s.get('lastNationalIntegrationPr'),'generatedPullRequest':746,'auditStatus':'passed'})
          total=sum(e['count'] for e in q['entries']);pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T17:21:00+09:00';q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':464,'latestGeneratedPullRequest':746,'latestPublicCountPullRequest':746,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。10自治体到達地域なし。"}
          if total<480:raise SystemExit(f'total too small {total}')
          p.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          if git diff --cached --quiet;then exit 0;fi
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合480自治体・公開464自治体へ同期'
          git push origin main
