name: Build East Audit Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.head_ref == 'coord/east-3-audit-release-20260724-r2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/east-3-audit-release-20260724-r2
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase audited files onto latest main and add Awashimaura
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/east-release
          for file in \
            jichitai-compare/data/municipalities/12/12203.json \
            jichitai-compare/data/municipalities/12/12227.json \
            jichitai-compare/data/municipalities/13/13123.json \
            jichitai-compare/operations/tasks/12203.json \
            jichitai-compare/operations/tasks/12227.json \
            jichitai-compare/operations/tasks/13123.json
          do
            mkdir -p "/tmp/east-release/$(dirname "$file")"
            cp "$file" "/tmp/east-release/$file"
          done
          git fetch origin main:refs/remotes/origin/main region/east:refs/remotes/origin/region/east
          git reset --hard origin/main
          cp -R /tmp/east-release/. .
          for file in \
            jichitai-compare/data/municipalities/15/15586.json \
            jichitai-compare/operations/tasks/15586.json
          do
            mkdir -p "$(dirname "$file")"
            git show "origin/region/east:$file" > "$file"
          done
          node <<'NODE'
          const fs=require('fs');
          const code='15586';
          const dataPath=`jichitai-compare/data/municipalities/15/${code}.json`;
          const taskPath=`jichitai-compare/operations/tasks/${code}.json`;
          const data=JSON.parse(fs.readFileSync(dataPath,'utf8'));
          const services=data.services??{};
          const keys=Object.keys(services);
          const nonTerminal=keys.filter(k=>!['verified','unavailable'].includes(services[k]?.status));
          if(keys.length!==9||nonTerminal.length) throw new Error(`15586 publication gate failure: ${nonTerminal.join(',')}`);
          const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
          task.status='merged'; task.currentService=null; task.nextServiceIndex=9; task.completedServices=keys;
          task.verifiedCount=keys.filter(k=>services[k]?.status==='verified').length;
          task.researchingCount=0; task.unavailableCount=keys.filter(k=>services[k]?.status==='unavailable').length;
          task.needsMediumReviewCount=0; task.lastUpdatedAt='2026-07-24T21:12:00+09:00'; task.lastUpdatedBy='全国統括'; task.blockers=[];
          fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
          NODE
          echo "BASE_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Generate national data and manifest
        working-directory: jichitai-compare
        run: |
          set -euo pipefail
          npm run generate
          npm run progress
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync('data/generated/municipalities.json', 'utf8'));
          const codes = ['12203', '12227', '13123', '15586'];
          const byCode = new Map(generated.municipalities.map((m) => [m.code, m]));
          for (const code of codes) if (!byCode.has(code)) throw new Error(`生成公開データに${code}が存在しません`);
          for (const code of ['12203', '12227', '13123']) {
            const services = Object.values(byCode.get(code).services ?? {});
            if (services.length !== 9) throw new Error(`${code}: 9制度ではありません`);
            if (services.some((service) => !service.eligibility)) throw new Error(`${code}: eligibility欠落`);
          }
          const awashima=Object.values(byCode.get('15586').services??{});
          if(awashima.some(service=>!['verified','unavailable'].includes(service.status))) throw new Error('15586: 非終端制度を含みます');
          if(progress.registeredMunicipalities!==1660||progress.remainingMunicipalities!==81) throw new Error(`進捗不整合 ${progress.registeredMunicipalities}/${progress.remainingMunicipalities}`);
          if(progress.needsMediumReviewServices!==0) throw new Error(`公開データに要確認${progress.needsMediumReviewServices}制度`);
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/\d+自治体・9制度/u, `${progress.registeredMunicipalities}自治体・9制度`);
          fs.writeFileSync('index.html', html);
          const manifest = {
            schemaVersion: '1.0.0', createdAt: new Date().toISOString(), baseMainSha: process.env.BASE_MAIN_SHA,
            sourceRegion: 'region/east', updatedMunicipalityCodes: ['12203','12227','13123'],
            addedMunicipalityCodes: ['15586'], registeredMunicipalities: progress.registeredMunicipalities,
            remainingMunicipalities: progress.remainingMunicipalities,
            validation: { municipalityData: 'pending_ci', identity: 'pending_ci', generatedData: 'regenerated', publicationGate: 'passed' }
          };
          fs.writeFileSync('operations/control/east-audit-national-sync-20260724.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Validate release
        working-directory: jichitai-compare
        run: |
          set -euo pipefail
          node ./scripts/validate-data.mjs --require-generated
          node ./scripts/validate-municipality-identity.mjs
          node --check app.js

      - name: Commit generated national release
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/east-3-audit-release.yml
          git add -A jichitai-compare
          git commit -m "release: 粟島浦村追加と東日本3自治体再監査版を全国同期"
          git push --force origin HEAD:coord/east-3-audit-release-20260724-r2
