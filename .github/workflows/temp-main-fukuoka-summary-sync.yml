name: Temporary Main Fukuoka Summary Sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sync-40130-public-summary-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jichitai-compare/package-lock.json

      - name: Update source and task
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          municipality_path = Path('jichitai-compare/data/municipalities/40/40130.json')
          municipality = json.loads(municipality_path.read_text(encoding='utf-8'))
          old_summary = '西日本調査班の初期登録対象。9制度すべてを公式情報で確認済み。PR提出前の最終検証を実施する。'
          new_summary = '福岡市の子育て、教育、住宅、生活、防災に関する9制度を自治体公式情報で確認済み。'
          current_summary = municipality.get('summary')
          if current_summary == old_summary:
              municipality['summary'] = new_summary
              municipality['updatedAt'] = '2026-07-24'
              municipality_path.write_text(json.dumps(municipality, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          elif current_summary != new_summary:
              raise SystemExit(f'Unexpected municipality summary: {current_summary!r}')

          task_path = Path('jichitai-compare/operations/tasks/40130.json')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          note = '公開ページに残っていた内部作業文言を除去し、利用者向け要約へ修正。'
          notes = task.setdefault('notes', [])
          changed = False
          if note not in notes:
              notes.append(note)
              changed = True
          if task.get('lastCheckedAt') != '2026-07-24':
              task['lastCheckedAt'] = '2026-07-24'
              changed = True
          if task.get('lastUpdatedBy') != '西日本調査班A（完了後品質監査）':
              task['lastUpdatedAt'] = '2026-07-24T23:02:00+09:00'
              task['lastUpdatedBy'] = '西日本調査班A（完了後品質監査）'
              changed = True
          if changed:
              task_path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate and validate public data
        working-directory: jichitai-compare
        run: |
          npm ci
          npm run check
          ! grep -R -F 'PR提出前の最終検証を実施する' data/generated/municipalities.json municipality/40130/index.html
          grep -F '福岡市の子育て、教育、住宅、生活、防災に関する9制度を自治体公式情報で確認済み。' municipality/40130/index.html

      - name: Commit synchronized public files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare
          if git diff --cached --quiet; then
            echo 'No public sync changes required.'
            exit 0
          fi
          git commit -m 'fix: publish corrected Fukuoka City summary'
          git push origin HEAD:coord/sync-40130-public-summary-cleanup
