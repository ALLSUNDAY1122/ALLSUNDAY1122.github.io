name: Temporary West B Second Audit Region Sync
on:
  push:
    branches: [sync/west-b-second-audit-region-west-20260725]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/west-b-second-audit-region-west-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy corrected municipality records from main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          files=(
            data/municipalities/31/31384.json
            data/municipalities/32/32528.json
            data/municipalities/34/34211.json
            data/municipalities/38/38442.json
            data/municipalities/38/38484.json
            data/municipalities/42/42210.json
            data/municipalities/42/42212.json
            data/municipalities/42/42308.json
            data/municipalities/42/42391.json
            data/municipalities/44/44210.json
            data/municipalities/45/45402.json
            data/municipalities/45/45442.json
            data/municipalities/45/45443.json
            data/municipalities/47/47302.json
            data/municipalities/47/47328.json
            data/municipalities/47/47350.json
            operations/tasks/31384.json
            operations/tasks/32528.json
            operations/tasks/34211.json
            operations/tasks/38442.json
            operations/tasks/38484.json
            operations/tasks/42210.json
            operations/tasks/42212.json
            operations/tasks/42308.json
            operations/tasks/42391.json
            operations/tasks/44210.json
            operations/tasks/45402.json
            operations/tasks/45442.json
            operations/tasks/45443.json
            operations/tasks/47302.json
            operations/tasks/47328.json
            operations/tasks/47350.json
            operations/audits/west-b-quality-improvement-second-audit-20260725.json
            operations/control/session-checkpoints/west-b.json
          )
          for rel in "${files[@]}"; do
            mkdir -p "jichitai-compare/$(dirname "$rel")"
            git show "origin/main:jichitai-compare/$rel" > "jichitai-compare/$rel"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const auditPath = 'jichitai-compare/operations/audits/west-b-quality-improvement-second-audit-20260725.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.branchStatus.main = 'merged_pr_3209_ci_7823';
          audit.branchStatus.regionWest = 'sync_branch_validated_pending_pr';
          audit.consistency.publicPage = 'pending_pages_deploy_verification';
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.qualityImprovementSecondAudit.mainPullRequestNumber = 3209;
          checkpoint.qualityImprovementSecondAudit.mainCiRunNumber = 7823;
          checkpoint.qualityImprovementSecondAudit.mainMergeCommit = 'f472f8464c73f955c002f93c0628392c64f2440f';
          checkpoint.qualityImprovementSecondAudit.regionSyncBranch = 'sync/west-b-second-audit-region-west-20260725';
          checkpoint.qualityImprovementSecondAudit.status = 'main_merged_region_sync_pending_pr';
          checkpoint.updatedAt = '2026-07-25T11:01:00+09:00';
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
      - name: Regenerate and validate region data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit region synchronization
        shell: bash
        run: |
          rm -f .github/workflows/temp-west-b-region-sync-second-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          git add .github/workflows/temp-west-b-region-sync-second-audit.yml
          git commit -m "sync: 西日本Bの過去訂正と第2監査結果をregion/westへ反映"
          git push origin HEAD:sync/west-b-second-audit-region-west-20260725
