name: Temporary sync release queue to 159

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-release-queue-159.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync release queue
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          by_region = {entry['region']: entry for entry in data['entries']}

          additions = {
              'north': [('01361', '江差町'), ('01362', '上ノ国町')],
              'east': [('08223', '潮来市')],
              'central': [('21206', '中津川市')],
          }
          for region, municipalities in additions.items():
              entry = by_region[region]
              existing = {m['code'] for m in entry['municipalities']}
              for code, name in municipalities:
                  if code not in existing:
                      entry['municipalities'].append({'code': code, 'name': name})
                      existing.add(code)
              entry['count'] = len(entry['municipalities'])

          by_region['north']['pendingSinceLastRelease'] = 6
          by_region['north']['releaseStatus'] = 'pending_threshold'
          by_region['north']['reason'] = '北日本の41自治体をPR #299までにmainへ全国統合し、生成・公開をPR #300で114自治体へ更新。その後、鹿部町・森町・八雲町・長万部町・江差町・上ノ国町を地方統合'

          by_region['east']['pendingSinceLastRelease'] = 2
          by_region['east']['releaseStatus'] = 'pending_threshold'
          by_region['east']['reason'] = '下妻市からひたちなか市までの追加10自治体をPR #328でmainへ全国統合し、生成・公開をPR #331で144自治体へ更新。その後、鹿嶋市・潮来市を地方統合'

          by_region['central']['pendingSinceLastRelease'] = 7
          by_region['central']['releaseStatus'] = 'pending_threshold'
          by_region['central']['reason'] = '中日本の51自治体をPR #315までにmainへ全国統合し、生成・公開をPR #316で124自治体へ更新。その後、若狭町・岐阜市・大垣市・高山市・多治見市・関市・中津川市を地方統合'
          by_region['central']['auditStatus'] = 'passed'

          by_region['west']['count'] = len(by_region['west']['municipalities'])
          by_region['west']['pendingSinceLastRelease'] = 1
          by_region['west']['releaseStatus'] = 'pending_threshold'

          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).replace(second=0, microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities'] = 0
          data['summary']['releaseReadyRegions'] = []
          data['summary']['auditBlockedRegions'] = []
          data['nextAction'] = '中日本が前回全国統合後7自治体で先行。北日本6、東日本2、西日本1。各地方班を監視し、最初に10自治体へ到達した地域を全国統合する。'
          data['humanDecisionRequired'] = False

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit synchronized queue and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-sync-release-queue-159.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-159.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '統括管理: 地方統合159自治体・公開144自治体へ同期'
          git push origin main
