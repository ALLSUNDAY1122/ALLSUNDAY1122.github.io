name: Temporary North B Anyone Single Gap Batch 6

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch6.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply confirmed corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('jichitai-compare');
          const today = '2026-07-25';
          const now = '2026-07-25T17:00:00+09:00';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => {
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
            console.log(`updated ${path.relative(root, file)}`);
          };
          const municipalityPath = (code) => path.join(root, 'data', 'municipalities', code.slice(0, 2), `${code}.json`);

          function updateMunicipality(code, summary, start, additionalSource = null) {
            const file = municipalityPath(code);
            const data = read(file);
            const service = data.services.temporaryChildcare;
            service.summary = summary;
            service.details = { ...(service.details || {}), start };
            service.source.checkedAt = today;
            if (additionalSource) {
              service.additionalSources = [...(service.additionalSources || [])];
              if (!service.additionalSources.some((item) => item.url === additionalSource)) {
                service.additionalSources.push({ url: additionalSource, checkedAt: today });
              } else {
                service.additionalSources = service.additionalSources.map((item) => item.url === additionalSource ? { ...item, checkedAt: today } : item);
              }
            }
            data.updatedAt = today;
            write(file, data);
          }

          function updateTask(code, note) {
            const municipality = read(municipalityPath(code));
            const file = path.join(root, 'operations', 'tasks', `${code}.json`);
            const task = read(file);
            task.lastCheckedAt = today;
            task.lastUpdatedAt = now;
            task.lastUpdatedBy = '北日本調査班B・品質改善第2監査';
            task.officialSources = [...new Set(Object.values(municipality.services || {})
              .map((service) => service?.source?.url)
              .filter(Boolean))];
            task.notes = [...(task.notes || []), note];
            write(file, task);
          }

          updateMunicipality(
            '06302',
            '2026年4月から、未就園の生後6か月から満3歳未満児が、中山町立なかやま保育園を月10時間まで1時間300円で利用できる。',
            '2026年4月',
            'https://www.town.nakayama.yamagata.jp/material/files/group/2/gikaidayori_36.pdf'
          );
          updateTask('06302', '2026-07-25誰でも通園単一条件第6群監査：中山町議会だよりで令和8年4月から制度開始と確認し、現行利用案内で対象・料金・施設を再確認。');

          updateMunicipality(
            '06321',
            '2026年度から、未就園の生後6か月から満3歳未満児が、町内の認定こども園等を月10時間まで1時間300円で利用できる。',
            '2026年度（施政方針で新年度開始を確認。厳密な開始日は未確認）',
            'https://www.town.kahoku.yamagata.jp/gyouseizyouhou/tyoutyounoheya/7676.html'
          );
          updateTask('06321', '2026-07-25誰でも通園単一条件第6群監査：令和8年度施政方針で新年度に制度をスタートすると確認。現行利用案内で対象・施設・料金を再確認し、厳密な開始日は断定しない。');

          updateMunicipality(
            '06323',
            '2026年4月から、未就園の生後6か月から満3歳未満児が、朝日町あさひ保育園を月10時間まで1時間300円で利用できる。',
            '2026年4月'
          );
          updateTask('06323', '2026-07-25誰でも通園単一条件第6群監査：朝日町公式ページで令和8年4月から実施と確認。');

          updateMunicipality(
            '06341',
            '2026年度から、未就園の生後6か月から満3歳未満児が、大石田保育園を月10時間まで1時間300円で利用できる。',
            '2026年度'
          );
          updateTask('06341', '2026-07-25誰でも通園単一条件第6群監査：大石田町公式ページで令和8年度から実施と確認。');

          updateMunicipality(
            '06361',
            '2026年4月から、未就園の生後6か月から満3歳未満児が、認定こども園めごたまを月10時間まで1時間300円で利用できる。通常の一時預かりも実施する。',
            '2026年4月',
            'https://www.town.kaneyama.yamagata.jp/material/files/group/5/chirashi2.pdf'
          );
          updateTask('06361', '2026-07-25誰でも通園単一条件第6群監査：金山町公式チラシで令和8年4月から認定こども園めごたまで実施と確認。');

          updateMunicipality(
            '06382',
            '2026年4月から、未就園の生後6か月から満3歳未満児を対象に、小松保育所でこども誰でも通園制度を実施する。通常の一時預かり・一時保育も実施する。',
            '2026年4月（町広報4月号で開始を案内）',
            'https://www.town.kawanishi.yamagata.jp/choho/202604chohokawanishi.pdf'
          );
          updateTask('06382', '2026-07-25誰でも通園単一条件第6群監査：町報かわにし2026年4月号と子育て支援センター4月号で制度開始を確認。');

          updateMunicipality(
            '06402',
            '2026年4月から、未就園の生後6か月から3歳未満児が、愛真こども園を月10時間まで利用できる。白鷹町在住者は利用料無料。',
            '2026年4月'
          );
          updateTask('06402', '2026-07-25誰でも通園単一条件第6群監査：白鷹町公式ページで令和8年4月から実施と確認。');

          const auditPath = path.join(root, 'operations', 'audits', 'north-b-anyone-single-gap-batch6-review-20260725.json');
          write(auditPath, {
            schemaVersion: '1.0.0',
            auditId: 'north-b-anyone-single-gap-batch6-review-20260725',
            sessionId: 'north-b',
            reviewedAt: now,
            status: 'corrections_applied',
            sourceAudit: 'operations/audits/north-b-fiscal-anyone-triage-20260725.json',
            scope: {
              candidatesReviewed: 10,
              municipalitiesCorrected: 7,
              noChangeMunicipalities: 3,
              statusChanges: 0,
              remainingSingleConditionCandidates: 12
            },
            corrected: [
              { code: '06302', municipality: '中山町', result: '令和8年4月開始を議会だよりから追記' },
              { code: '06321', municipality: '河北町', result: '令和8年度開始を施政方針から限定追記' },
              { code: '06323', municipality: '朝日町', result: '令和8年4月開始を追記' },
              { code: '06341', municipality: '大石田町', result: '令和8年度開始を追記' },
              { code: '06361', municipality: '金山町', result: '令和8年4月開始を公式チラシから追記' },
              { code: '06382', municipality: '川西町', result: '令和8年4月開始を町広報から追記' },
              { code: '06402', municipality: '白鷹町', result: '令和8年4月開始を追記' }
            ],
            noChange: [
              { code: '06322', municipality: '西川町', result: '現行制度ページは確認できるが自治体固有の開始時期の明記がないため現状維持' },
              { code: '06362', municipality: '最上町', result: '現行利用案内に自治体固有の開始時期の明記がないため現状維持' },
              { code: '06366', municipality: '鮭川村', result: '現行利用案内に自治体固有の開始時期の明記がないため現状維持' }
            ],
            policy: 'ページ更新日を制度開始日とみなさない。広報・施政方針・公式チラシに開始年度または開始月が明記された場合のみ補正する。'
          });

          const checkpointPath = path.join(root, 'operations', 'control', 'session-checkpoints', 'north-b.json');
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = now;
          checkpoint.workingBranch = 'audit/north-b-anyone-single-gap-batch6-20260725';
          checkpoint.pullRequestNumber = null;
          checkpoint.ciStatus = 'pending';
          checkpoint.nextAction = '誰でも通園の単一条件欠落残り12件を優先度順に再確認する。';
          checkpoint.fiscalAnyoneAudit = {
            ...(checkpoint.fiscalAnyoneAudit || {}),
            singleGapBatch6Reviewed: 10,
            singleGapBatch6CorrectedMunicipalities: ['06302','06321','06323','06341','06361','06382','06402'],
            singleGapBatch6NoChangeMunicipalities: ['06322','06362','06366'],
            remainingAnyonePriorityBelow50: 12,
            singleGapBatch6AuditFile: 'operations/audits/north-b-anyone-single-gap-batch6-review-20260725.json',
            status: 'single_gap_batch6_corrections_pending_ci'
          };
          write(checkpointPath, checkpoint);
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit batch result
        shell: bash
        run: |
          rm .github/workflows/temp-north-b-anyone-single-gap-batch6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch6.yml \
                     jichitai-compare/data/municipalities \
                     jichitai-compare/operations/tasks \
                     jichitai-compare/operations/audits/north-b-anyone-single-gap-batch6-review-20260725.json \
                     jichitai-compare/operations/control/session-checkpoints/north-b.json \
                     jichitai-compare/data/generated \
                     jichitai-compare/operations/progress.json \
                     jichitai-compare/municipality \
                     jichitai-compare/sitemap.xml
          git commit -m 'fix: 北日本B誰でも通園単一条件第6群を補正'
          git push origin HEAD:"${{ github.head_ref }}"
