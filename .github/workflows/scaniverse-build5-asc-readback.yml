name: Scaniverse Build 5 ASC Readback

on:
  push:
    branches:
      - testflight/splat-native-ios-20260825-build5
    paths:
      - .github/workflows/scaniverse-build5-asc-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_READBACK_BUILD_ID: 6a8d845c6269a1476e549bf2
    steps:
      - uses: actions/checkout@v4

      - name: Recover finished ASC readback and verify Build 5
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM_API_TOKEN:-}"
          python3 - <<'PY'
          import io, json, os, urllib.error, urllib.request, zipfile
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          build_id=os.environ['CM_READBACK_BUILD_ID']
          gateway=Path('/tmp/build5-asc-gateway.json')

          def api(url):
              req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          code,detail=api(f'https://codemagic.io/api/v3/builds/{build_id}')
          if not 200 <= code < 300:
              raise SystemExit(f'ASC readback inspect failed HTTP {code}: {detail}')
          details=detail.get('data') or detail
          if details.get('status')!='finished':
              raise SystemExit(f'ASC readback build is not finished: {details.get("status")}')

          result={'ok':False,'build_id':build_id,'status':'finished'}
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          wanted={'asc-readback.json','build5-beta-details.json','build5-list.json','build5-id.txt'}
          extracted=set()

          for artifact in details.get('artifacts') or []:
              name=artifact.get('name') or ''
              url=artifact.get('short_lived_download_url') or artifact.get('url')
              if not url:
                  continue
              with urllib.request.urlopen(url,timeout=60) as r:
                  payload=r.read()
              if name in wanted:
                  Path('/tmp',name).write_bytes(payload)
                  extracted.add(name)
                  continue
              if name.endswith('.zip') or payload[:4]==b'PK\x03\x04':
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      for member in archive.infolist():
                          leaf=Path(member.filename).name
                          if leaf in wanted and not member.is_dir():
                              Path('/tmp',leaf).write_bytes(archive.read(member))
                              extracted.add(leaf)

          asc_path=Path('/tmp/asc-readback.json')
          if not asc_path.exists():
              names=[a.get('name') for a in details.get('artifacts') or []]
              raise SystemExit(f'asc-readback.json missing after bundle extraction; artifacts={names}')
          asc=json.loads(asc_path.read_text())
          if not asc.get('ok') or int(asc.get('buildNumber',0))!=5 or asc.get('processingState')!='VALID':
              raise SystemExit(f'Build 5 ASC contract failed: {asc}')
          result.update({'ok':True,'status':'confirmed','asc':asc,'recovered_files':sorted(extracted)})
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD5_ASC_VALID',json.dumps(asc,separators=(',',':')))
          PY

      - name: Upload Build 5 ASC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaniverse-build5-asc-${{ github.run_id }}
          path: |
            /tmp/build5-asc-gateway.json
            /tmp/asc-readback.json
            /tmp/build5-beta-details.json
            /tmp/build5-list.json
            /tmp/build5-id.txt
          if-no-files-found: warn
          retention-days: 14
