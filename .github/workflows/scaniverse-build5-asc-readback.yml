name: Scaniverse Build 5 ASC Readback

on:
  push:
    branches:
      - testflight/splat-native-ios-20260825-build5
    paths:
      - .github/workflows/scaniverse-build5-asc-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_APP_ID: 6a769d81a1add9d06020b524
      CM_WORKFLOW_ID: splat-build5-asc-readback
      CM_BRANCH: testflight/splat-native-ios-20260825-build5
    steps:
      - uses: actions/checkout@v4

      - name: Start ASC readback and verify Build 5
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM_API_TOKEN:-}"
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          app_id=os.environ['CM_APP_ID']
          workflow=os.environ['CM_WORKFLOW_ID']
          branch=os.environ['CM_BRANCH']
          gateway=Path('/tmp/build5-asc-gateway.json')

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={
                  'Content-Type':'application/json','Accept':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          status,payload=api('https://api.codemagic.io/builds','POST',{
              'appId':app_id,'workflowId':workflow,'branch':branch})
          if not 200 <= status < 300:
              raise SystemExit(f'ASC readback start failed HTTP {status}: {payload}')
          build_id=payload.get('buildId') or payload.get('id')
          if not build_id:
              raise SystemExit(f'No readback build id: {payload}')
          result={'ok':False,'build_id':build_id,'status':'started','workflow_id':workflow,'branch':branch}
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          print(f'BUILD5_ASC_READBACK_STARTED id={build_id}')

          terminal={'finished','failed','canceled','timeout','skipped'}
          details={}
          deadline=time.time()+2100
          while time.time() < deadline:
              code,detail=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= code < 300:
                  raise SystemExit(f'ASC readback inspect failed HTTP {code}: {detail}')
              details=detail.get('data') or detail
              current=details.get('status')
              result['status']=current
              gateway.write_text(json.dumps(result,indent=2)+'\n')
              print('BUILD5_ASC_READBACK_STATUS',current)
              if current in terminal:
                  break
              time.sleep(15)
          else:
              raise SystemExit('ASC readback timed out')

          if details.get('status')!='finished':
              raise SystemExit(f'ASC readback ended {details.get("status")}')

          artifacts=details.get('artifacts') or []
          names={}
          for a in artifacts:
              name=a.get('name')
              url=a.get('short_lived_download_url') or a.get('url')
              if name and url:
                  names[name]=url
          for name in ('asc-readback.json','build5-beta-details.json','build5-list.json','build5-id.txt'):
              url=names.get(name)
              if not url:
                  continue
              with urllib.request.urlopen(url,timeout=30) as r:
                  Path('/tmp',name).write_bytes(r.read())
          asc_path=Path('/tmp/asc-readback.json')
          if not asc_path.exists():
              raise SystemExit(f'asc-readback.json missing; artifact names={sorted(names)}')
          asc=json.loads(asc_path.read_text())
          if not asc.get('ok') or int(asc.get('buildNumber',0))!=5 or asc.get('processingState')!='VALID':
              raise SystemExit(f'Build 5 ASC contract failed: {asc}')
          result.update({'ok':True,'status':'confirmed','asc':asc})
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD5_ASC_VALID',json.dumps(asc,separators=(',',':')))
          PY

      - name: Upload Build 5 ASC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaniverse-build5-asc-${{ github.run_id }}
          path: |
            /tmp/build5-asc-gateway.json
            /tmp/asc-readback.json
            /tmp/build5-beta-details.json
            /tmp/build5-list.json
            /tmp/build5-id.txt
          if-no-files-found: warn
          retention-days: 14
