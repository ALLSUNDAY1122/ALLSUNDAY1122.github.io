name: Fix 43215 Publication Readiness v2
on:
  pull_request:
    branches: [region/west]
permissions:
  contents: write
  pull-requests: read
jobs:
  fix:
    if: github.head_ref == 'fix/43215-publication-readiness-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/43215-publication-readiness-v2
          fetch-depth: 0
      - name: Import latest Amakusa audit and normalize
        shell: bash
        run: |
          git fetch origin data/43215-amakusa
          mkdir -p jichitai-compare/data/municipalities/43 jichitai-compare/operations/tasks
          git show origin/data/43215-amakusa:jichitai-compare/data/municipalities/43/43215.json > jichitai-compare/data/municipalities/43/43215.json
          git show origin/data/43215-amakusa:jichitai-compare/operations/tasks/43215.json > jichitai-compare/operations/tasks/43215.json
          node <<'NODE'
          const fs = require('fs');
          const municipalityPath = 'jichitai-compare/data/municipalities/43/43215.json';
          const taskPath = 'jichitai-compare/operations/tasks/43215.json';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
          municipality.status = 'verified';
          municipality.summary = '必須9制度を天草市公式情報で調査。8制度をverified、2026年度の中学校一般世帯負担条件を確定できない学校給食費をunavailableとして登録。';
          municipality.updatedAt = '2026-07-24';
          municipality.services.schoolMeals = {
            status: 'unavailable',
            summary: '2026年度の市立小学校給食費無償化は確認できるが、中学校の一般世帯負担条件を確定できない',
            notes: [
              '2026年度施政方針で市立小学校の学校給食費を無償化する方針を確認した。',
              '2026年度の市立中学校における一般世帯の給食費額、負担軽減・無償化の有無、徴収方法を示す市公式の利用者向け情報を確認できないため、比較条件は窓口確認事項として扱う。',
              '学校給食の不存在を意味するものではなく、中学校一般世帯の現行負担条件が公開情報から確定できないためunavailableとする。'
            ]
          };
          fs.writeFileSync(municipalityPath, JSON.stringify(municipality));
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          const order = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          task.status = 'pr_open';
          task.currentService = null;
          task.nextServiceIndex = 9;
          task.completedServices = order;
          task.verifiedCount = 8;
          task.researchingCount = 0;
          task.unavailableCount = 1;
          task.needsMediumReviewCount = 0;
          task.currentBranch = 'fix/43215-publication-readiness-v2';
          task.pullRequestNumber = 0;
          task.lastCheckedAt = '2026-07-24';
          task.lastUpdatedAt = '2026-07-24T10:30:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.notes = [
            '必須9制度を天草市公式情報で調査済み。',
            '18歳年度末まで子ども医療費を助成。',
            'ファミリーサポートセンターで生後6か月から小学6年生までの病後児を平日8時から18時、1時間450円で預かる。',
            '0～5歳児の保育料を市独自制度を含め無償化。',
            '2026年度は市立小学校給食費を無償化。中学校一般世帯の負担条件は公開情報から確定できないためunavailableとして窓口確認事項を残す。',
            '産後ケアの自己負担額を全利用者無料として宿泊・日帰り・訪問型を提供。',
            '誰でも通園制度は生後6か月から満3歳未満、月10時間、1時間300円。',
            '2026年度住宅リフォーム費を1～2割、上限10～20万円助成。',
            '大型ごみシール1,000円・小型ごみシール100円による粗大ごみ収集を実施。',
            '洪水・土砂災害・高潮・津波・地震等の総合防災マップを公開。',
            '統括Bが8 verified・1 unavailableの公開可能状態へ正規化。'
          ];
          task.blockers = [];
          fs.writeFileSync(taskPath, JSON.stringify(task));
          NODE
          rm -f .github/workflows/fix-43215-publication-readiness-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/43/43215.json jichitai-compare/operations/tasks/43215.json .github/workflows/fix-43215-publication-readiness-v2.yml
          git commit -m 'fix: 天草市を8 verified・1 unavailableへ正規化'
          git push origin HEAD:fix/43215-publication-readiness-v2
