name: Temporary Central B Final Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'audit/central-b-final-evidence-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch region central
        shell: bash
        run: git fetch origin region/central:refs/remotes/origin/region/central

      - name: Build final ledger and verify all surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import html
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('jichitai-compare')
          ledger_path = root / 'operations/quality/central-b-quality-ledger-20260725.json'
          final_ledger_path = root / 'operations/quality/central-b-quality-ledger-final-20260725.json'
          evidence_path = root / 'operations/audits/central-b-final-evidence-verification-20260725.json'

          if final_ledger_path.exists() and evidence_path.exists():
              print('Final evidence already exists; no rebuild required.')
              raise SystemExit(0)

          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          generated = json.loads((root / 'data/generated/municipalities.json').read_text(encoding='utf-8'))
          generated_by_code = {item['code']: item for item in generated['municipalities']}
          cause_catalog = ledger['causeCatalog']
          common = ledger['commonEvidence']

          def municipality_path(code):
              return root / 'data/municipalities' / code[:2] / f'{code}.json'

          def task_path(code):
              return root / 'operations/tasks' / f'{code}.json'

          def region_municipality(code):
              rel = f'jichitai-compare/data/municipalities/{code[:2]}/{code}.json'
              raw = subprocess.check_output(['git', 'show', f'origin/region/central:{rel}'])
              return json.loads(raw.decode('utf-8'))

          def source_list(service):
              result = []
              primary = service.get('source') if isinstance(service, dict) else None
              if isinstance(primary, dict) and primary.get('url'):
                  result.append({'role': 'primary', 'url': primary['url'], 'checkedAt': primary.get('checkedAt')})
              for item in service.get('additionalSources', []) if isinstance(service, dict) else []:
                  if isinstance(item, dict) and item.get('url'):
                      result.append({'role': 'additional', 'url': item['url'], 'checkedAt': item.get('checkedAt')})
              return result

          def expected_task_sources(services):
              return [service['source']['url'] for service in services.values() if isinstance(service, dict) and isinstance(service.get('source'), dict) and service['source'].get('url')]

          def fetch_url(url, read_all=False):
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 central-b-quality-audit'})
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      body = response.read() if read_all else response.read(131072)
                      return {
                          'status': response.status,
                          'finalUrl': response.geturl(),
                          'contentType': response.headers.get('content-type', ''),
                          'sizeRead': len(body),
                          'category': 'reachable',
                          'body': body,
                      }
              except urllib.error.HTTPError as exc:
                  category = 'broken' if exc.code in (404, 410) else 'access_warning'
                  return {'status': exc.code, 'finalUrl': exc.geturl(), 'contentType': '', 'sizeRead': 0, 'category': category, 'error': repr(exc), 'body': b''}
              except Exception as exc:
                  return {'status': None, 'finalUrl': url, 'contentType': '', 'sizeRead': 0, 'category': 'access_warning', 'error': repr(exc), 'body': b''}

          rows = []
          region_mismatches = []
          task_mismatches = []
          generated_mismatches = []
          static_mismatches = []
          codes = set()
          all_urls = set()

          for record in ledger['records']:
              code, name, service_key, classification, before, after, cause_code, checked_at, correction_pr, correction_ci = record
              codes.add(code)
              main_m = json.loads(municipality_path(code).read_text(encoding='utf-8'))
              region_m = region_municipality(code)
              task = json.loads(task_path(code).read_text(encoding='utf-8'))
              main_service = main_m['services'][service_key]
              region_service = region_m['services'].get(service_key)
              generated_service = generated_by_code.get(code, {}).get('services', {}).get(service_key)
              sources = source_list(main_service)
              for source in sources:
                  all_urls.add(source['url'])

              region_equal = region_service == main_service
              if not region_equal:
                  region_mismatches.append({'code': code, 'service': service_key})

              task_checks = {
                  'statusMerged': task.get('status') == 'merged',
                  'completedServiceCount9': len(task.get('completedServices', [])) == 9,
                  'verifiedCount': task.get('verifiedCount') == sum(1 for value in main_m['services'].values() if value.get('status') == 'verified'),
                  'unavailableCount': task.get('unavailableCount') == sum(1 for value in main_m['services'].values() if value.get('status') == 'unavailable'),
                  'officialSources': task.get('officialSources') == expected_task_sources(main_m['services']),
              }
              task_equal = all(task_checks.values())
              if not task_equal:
                  task_mismatches.append({'code': code, 'service': service_key, 'checks': task_checks})

              generated_equal = generated_service == main_service
              if not generated_equal:
                  generated_mismatches.append({'code': code, 'service': service_key})

              static_path = root / 'municipality' / code / 'index.html'
              static_text = html.unescape(static_path.read_text(encoding='utf-8'))
              primary_url = sources[0]['url'] if sources else None
              static_checks = {
                  'municipalityName': name in static_text,
                  'summary': main_service.get('summary', '') in static_text,
                  'primarySource': (primary_url in static_text) if primary_url else False,
              }
              static_equal = all(static_checks.values())
              if not static_equal:
                  static_mismatches.append({'code': code, 'service': service_key, 'checks': static_checks})

              rows.append({
                  'municipalityCode': code,
                  'municipalityName': name,
                  'prefectureCode': code[:2],
                  'team': 'central-b',
                  'service': service_key,
                  'classification': classification,
                  'before': before,
                  'after': after,
                  'cause': cause_catalog.get(cause_code, cause_code),
                  'causeCode': cause_code,
                  'officialSources': sources,
                  'checkedAt': (sources[0].get('checkedAt') if sources else checked_at) or checked_at,
                  'correctionPullRequest': correction_pr,
                  'correctionCiRun': correction_ci,
                  'regionBranch': 'region/central',
                  'regionVerification': 'semantic_equal' if region_equal else 'mismatch',
                  'mainVerification': {
                      'taskConsistent': task_equal,
                      'generatedServiceEqual': generated_equal,
                      'staticPageConsistent': static_equal,
                  },
                  'publicVerification': 'pending_runtime_check',
                  'trackingIssue': 3188,
                  'status': 'pending_runtime_check',
              })

          def check_official(url):
              result = fetch_url(url, read_all=False)
              result.pop('body', None)
              return url, result

          official_results = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(check_official, url) for url in sorted(all_urls)]
              for future in concurrent.futures.as_completed(futures):
                  url, result = future.result()
                  official_results[url] = result

          public_page_results = {}
          cache = int(time.time())

          def check_public(code):
              url = f'https://allsunday1122.github.io/jichitai-compare/municipality/{code}/?audit={cache}'
              result = fetch_url(url, read_all=True)
              text = html.unescape(result.pop('body', b'').decode('utf-8', errors='replace'))
              municipality_rows = [row for row in rows if row['municipalityCode'] == code]
              missing = []
              for row in municipality_rows:
                  main_m = json.loads(municipality_path(code).read_text(encoding='utf-8'))
                  service = main_m['services'][row['service']]
                  primary = row['officialSources'][0]['url'] if row['officialSources'] else None
                  if service.get('summary', '') not in text:
                      missing.append({'service': row['service'], 'field': 'summary'})
                  if primary and primary not in text:
                      missing.append({'service': row['service'], 'field': 'primarySource'})
              result['missing'] = missing
              result['success'] = result.get('status') == 200 and not missing
              return code, result

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              futures = [pool.submit(check_public, code) for code in sorted(codes)]
              for future in concurrent.futures.as_completed(futures):
                  code, result = future.result()
                  public_page_results[code] = result

          public_generated_url = f'https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json?audit={cache}'
          public_generated_result = fetch_url(public_generated_url, read_all=True)
          public_generated_body = public_generated_result.pop('body', b'')
          public_generated_checks = {}
          try:
              public_generated_data = json.loads(public_generated_body.decode('utf-8'))
              public_generated_municipalities = public_generated_data.get('municipalities', [])
              public_generated_service_count = sum(len(item.get('services', {})) for item in public_generated_municipalities)
              public_generated_by_code = {item.get('code'): item for item in public_generated_municipalities}
              corrected_equal = all(
                  public_generated_by_code.get(row['municipalityCode'], {}).get('services', {}).get(row['service'])
                  == json.loads(municipality_path(row['municipalityCode']).read_text(encoding='utf-8'))['services'][row['service']]
                  for row in rows
              )
              public_generated_checks = {
                  'http200': public_generated_result.get('status') == 200,
                  'municipalityCount1741': len(public_generated_municipalities) == 1741,
                  'serviceCount15669': public_generated_service_count == 15669,
                  'correctedServicesEqual': corrected_equal,
              }
              public_generated_result.update({
                  'municipalityCount': len(public_generated_municipalities),
                  'serviceCount': public_generated_service_count,
                  'checks': public_generated_checks,
                  'success': all(public_generated_checks.values()),
              })
          except Exception as exc:
              public_generated_result.update({'success': False, 'error': repr(exc), 'checks': {}})

          row_by_key = {(row['municipalityCode'], row['service']): row for row in rows}
          for row in rows:
              primary = row['officialSources'][0]['url'] if row['officialSources'] else None
              official = official_results.get(primary, {'category': 'missing'}) if primary else {'category': 'missing'}
              public_ok = public_page_results.get(row['municipalityCode'], {}).get('success', False)
              official_not_broken = official.get('category') != 'broken' and primary is not None
              row['publicVerification'] = 'passed' if public_ok else 'failed'
              if row['regionVerification'] == 'semantic_equal' and all(row['mainVerification'].values()) and public_ok and official_not_broken:
                  row['status'] = 'complete_with_access_warning' if official.get('category') == 'access_warning' else 'complete'
              else:
                  row['status'] = 'incomplete'
              row['officialPrimaryAccess'] = official

          sample_codes = {
              '26': ['26209', '26364', '26367'],
              '29': ['29203', '29425', '29449'],
              '30': ['30202', '30203', '30341'],
          }
          sample_results = []
          for prefecture, sample in sample_codes.items():
              for code in sample:
                  sample_rows = [row for row in rows if row['municipalityCode'] == code]
                  sample_results.append({
                      'prefectureCode': prefecture,
                      'municipalityCode': code,
                      'recordCount': len(sample_rows),
                      'allRowsComplete': bool(sample_rows) and all(row['status'] in ('complete', 'complete_with_access_warning') for row in sample_rows),
                      'primarySources': [row['officialSources'][0] for row in sample_rows if row['officialSources']],
                  })

          broken_official = [
              {'url': url, **result}
              for url, result in official_results.items()
              if result.get('category') == 'broken'
          ]
          access_warnings = [
              {'url': url, **result}
              for url, result in official_results.items()
              if result.get('category') == 'access_warning'
          ]
          public_failures = [
              {'code': code, **result}
              for code, result in public_page_results.items()
              if not result.get('success')
          ]

          summary = {
              'recordCount': len(rows),
              'uniqueMunicipalityCount': len(codes),
              'regionMismatchCount': len(region_mismatches),
              'taskMismatchCount': len(task_mismatches),
              'generatedMismatchCount': len(generated_mismatches),
              'staticMismatchCount': len(static_mismatches),
              'publicFailureCount': len(public_failures),
              'brokenOfficialSourceCount': len(broken_official),
              'officialAccessWarningCount': len(access_warnings),
              'sampleCount': len(sample_results),
              'samplePassCount': sum(1 for item in sample_results if item['allRowsComplete']),
              'incompleteRowCount': sum(1 for row in rows if row['status'] == 'incomplete'),
          }
          success = (
              summary['recordCount'] == 57
              and summary['uniqueMunicipalityCount'] == 55
              and summary['regionMismatchCount'] == 0
              and summary['taskMismatchCount'] == 0
              and summary['generatedMismatchCount'] == 0
              and summary['staticMismatchCount'] == 0
              and summary['publicFailureCount'] == 0
              and summary['brokenOfficialSourceCount'] == 0
              and summary['sampleCount'] == 9
              and summary['samplePassCount'] == 9
              and summary['incompleteRowCount'] == 0
              and public_generated_result.get('success') is True
          )

          final_ledger = {
              'schemaVersion': '1.0.0',
              'ledgerId': 'central-b-quality-ledger-final-20260725',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'team': 'central-b',
              'scope': {
                  'prefectureCodes': ['26', '29', '30'],
                  'auditedMunicipalityCount': 95,
                  'deepCheckedMunicipalityCount': 88,
                  'correctionRecordCount': 57,
                  'correctedMunicipalityCount': 55,
              },
              'evidence': {
                  'regionalAuditPullRequest': common['regionalAuditPullRequest'],
                  'regionalAuditCiRun': common['regionalAuditCiRun'],
                  'nationalSyncPullRequest': common['nationalSyncPullRequest'],
                  'nationalSyncCiRun': common['nationalSyncCiRun'],
                  'regionalCompletionPullRequest': common['regionalCompletionPullRequest'],
                  'regionalCompletionCiRun': common['regionalCompletionCiRun'],
                  'finalVerificationFile': str(evidence_path.relative_to(root)),
              },
              'summary': summary,
              'status': 'completed' if success else 'verification_failed',
              'records': rows,
          }
          evidence = {
              'schemaVersion': '1.0.0',
              'auditId': 'central-b-final-evidence-verification-20260725',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'trackingIssue': 3188,
              'summary': summary,
              'regionMismatches': region_mismatches,
              'taskMismatches': task_mismatches,
              'generatedMismatches': generated_mismatches,
              'staticMismatches': static_mismatches,
              'publicFailures': public_failures,
              'brokenOfficialSources': broken_official,
              'officialAccessWarnings': access_warnings,
              'officialSourceResults': official_results,
              'sampleResults': sample_results,
              'publicGeneratedJson': public_generated_result,
              'success': success,
              'releaseBlocker': 'none' if success else 'active',
          }

          final_ledger_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          final_ledger_path.write_text(json.dumps(final_ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'success': success, 'summary': summary}, ensure_ascii=False, indent=2))
          PY

      - name: Commit final evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jichitai-compare/operations/quality/central-b-quality-ledger-final-20260725.json \
            jichitai-compare/operations/audits/central-b-final-evidence-verification-20260725.json
          if git diff --cached --quiet; then
            echo "No evidence changes"
          else
            git commit -m "audit: build central B final evidence ledger"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Enforce verification result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('jichitai-compare/operations/audits/central-b-final-evidence-verification-20260725.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          if not result.get('success'):
              raise SystemExit('Central B final verification failed: ' + json.dumps(result.get('summary', {}), ensure_ascii=False))
          print('Central B final verification succeeded.')
          PY
