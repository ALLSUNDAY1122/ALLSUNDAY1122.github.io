name: Temporary West B Housing Priority Review

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-housing-priority-trigger-20260725.json

permissions:
  contents: write

jobs:
  prioritize:
    if: github.head_ref == 'audit/west-b-housing-crosscheck-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-housing-crosscheck-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch official sources and prioritize
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const auditPath = 'jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          const childTerms = /(子育て|子ども|こども|児童|18歳|高校生|中学生|小学生|未就学|多子|ひとり親|若年夫婦|若者夫婦|新婚|婚姻|結婚新生活|妊婦|妊娠|出産|三世代|扶養)/;
          const genericTerms = /(移住|定住|空き家|住宅取得|新築|購入|改修|リフォーム|家賃|賃貸|引越|転入|中古住宅)/;

          async function inspect(candidate) {
            const url = candidate.source?.url;
            const result = {url: url ?? null, status: null, contentType: null, fetched: false, finalUrl: null, officialTextHasChildTerms: null, officialTextHasGenericTerms: null, title: null, error: null};
            if (!url) return result;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 18000);
            try {
              const response = await fetch(url, {redirect: 'follow', signal: controller.signal, headers: {'user-agent': 'Mozilla/5.0 WestBAudit/1.0'}});
              result.status = response.status;
              result.contentType = response.headers.get('content-type');
              result.finalUrl = response.url;
              const buffer = Buffer.from(await response.arrayBuffer());
              result.fetched = response.ok;
              if ((result.contentType || '').includes('html') || (result.contentType || '').includes('text')) {
                const html = buffer.toString('utf8');
                const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
                result.title = titleMatch ? titleMatch[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200) : null;
                const text = html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&#160;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ');
                result.officialTextHasChildTerms = childTerms.test(text);
                result.officialTextHasGenericTerms = genericTerms.test(text);
              }
            } catch (error) {
              result.error = String(error?.name || error?.message || error).slice(0, 300);
            } finally {
              clearTimeout(timer);
            }
            return result;
          }

          const strict = audit.candidates.filter(c => c.status === 'verified' && c.reasons.includes('verified_without_explicit_child_or_family_condition'));
          const inspected = [];
          let cursor = 0;
          async function worker() {
            while (cursor < strict.length) {
              const index = cursor++;
              const candidate = strict[index];
              const sourceInspection = await inspect(candidate);
              let priorityScore = 0;
              if (candidate.reasons.includes('generic_migration_or_housing_program_may_be_misclassified')) priorityScore += 8;
              if (candidate.reasons.includes('verified_without_explicit_child_or_family_condition')) priorityScore += 5;
              if (candidate.reasons.includes('verified_missing_target_or_condition')) priorityScore += 3;
              if (candidate.reasons.includes('source_or_description_appears_pre_2025_without_current_basis')) priorityScore += 3;
              if (sourceInspection.fetched && sourceInspection.officialTextHasChildTerms === false) priorityScore += 5;
              if (sourceInspection.officialTextHasChildTerms === true) priorityScore -= 7;
              if (sourceInspection.fetched && sourceInspection.officialTextHasGenericTerms === true) priorityScore += 2;
              inspected.push({...candidate, sourceInspection, priorityScore});
            }
          }
          await Promise.all(Array.from({length: 8}, () => worker()));
          inspected.sort((a,b) => b.priorityScore - a.priorityScore || a.code.localeCompare(b.code));
          const priorityCandidates = inspected.filter(v => v.priorityScore >= 13).slice(0, 50);
          const output = {
            schemaVersion: '1.0.0',
            reviewId: 'west-b-housing-priority-review-20260725',
            sourceAuditId: audit.auditId,
            generatedAt: new Date().toISOString(),
            strictCandidateCount: strict.length,
            inspectedOfficialSourceCount: inspected.filter(v => v.sourceInspection.url).length,
            fetchedOfficialSourceCount: inspected.filter(v => v.sourceInspection.fetched).length,
            priorityCandidateCount: priorityCandidates.length,
            selectionRule: 'verifiedで子育て・子ども・若年夫婦・新婚等の条件が記録されず、一般移住・住宅・リフォーム語のみで、現行公式ページにも子育て条件が見つからない候補を優先',
            priorityCandidates,
            result: {status: 'priority_review_generated_pending_official_judgment', confirmedCorrectionCount: null, unresolvedConfirmedErrorCount: null}
          };
          const outPath = 'jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json';
          fs.mkdirSync(path.dirname(outPath), {recursive: true});
          fs.writeFileSync(outPath, JSON.stringify(output, null, 2) + '\n');
          NODE
      - name: Commit priority review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json
          git commit -m 'audit: 西日本B住宅支援優先候補を生成'
          git pull --rebase origin audit/west-b-housing-crosscheck-20260725
          git push origin HEAD:audit/west-b-housing-crosscheck-20260725
