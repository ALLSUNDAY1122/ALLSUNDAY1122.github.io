name: Temporary West B Cycle 08 Shintomi Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/west-b-cycle08-shintomi-child-medical-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-cycle08-shintomi-child-medical-20260725
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Shintomi child medical source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.cwd(), 'jichitai-compare');
          const oldUrl = 'https://www.town.shintomi.lg.jp/item/1602.htm';
          const newUrl = 'https://www.town.shintomi.lg.jp/1061.htm';
          const sourcePath = path.join(root, 'data', 'municipalities', '45', '45402.json');
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (source.services?.childMedical?.source?.url !== oldUrl) {
            throw new Error(`Unexpected childMedical source: ${source.services?.childMedical?.source?.url}`);
          }
          source.services.childMedical.source.url = newUrl;
          source.services.childMedical.source.checkedAt = '2026-07-25';
          source.updatedAt = '2026-07-25';
          fs.writeFileSync(sourcePath, JSON.stringify(source, null, 2) + '\n');

          const taskPath = path.join(root, 'operations', 'tasks', '45402.json');
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          task.officialSources = task.officialSources.map(url => url === oldUrl ? newUrl : url);
          task.lastCheckedAt = '2026-07-25';
          task.lastUpdatedAt = '2026-07-25T03:40:00+09:00';
          task.lastUpdatedBy = '西日本調査班B';
          task.notes = Array.isArray(task.notes) ? task.notes : [];
          const note = '概略検証第8回で子ども医療費の旧ページ失効を確認し、現行の福祉医療費助成ページへ主出典を更新。制度内容と判定は維持。';
          if (!task.notes.includes(note)) task.notes.push(note);
          fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit correction
        shell: bash
        run: |
          rm -f .github/west-b-cycle08-shintomi-fix.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/municipalities/45/45402.json
          git add jichitai-compare/operations/tasks/45402.json
          git add jichitai-compare/data/generated/municipalities.json
          git add jichitai-compare/municipality/45402/index.html
          git add jichitai-compare/operations/progress.json
          git add .github/west-b-cycle08-shintomi-fix.trigger
          git commit -m "fix: 新富町の子ども医療費出典を現行URLへ更新"
          git push origin HEAD:fix/west-b-cycle08-shintomi-child-medical-20260725
