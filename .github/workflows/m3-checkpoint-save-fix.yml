name: M3 Checkpoint Save Fix

on:
  push:
    branches:
      - 'scaniverse/s7-m3-reconstruction-telemetry'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'scaniverse/s7-m3-reconstruction-telemetry'
          fetch-depth: 0
      - name: Apply patch
        run: python3 splat-native-ios/scripts/m3_checkpoint_patch.py
      - name: Commit patch and remove one-shot helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/m3-checkpoint-save-fix.yml
          git rm splat-native-ios/scripts/m3_checkpoint_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/ScanModel.swift
          git diff --check --cached
          git commit -m 'S7-M3: fail closed on checkpoint save failure'
          git push origin HEAD:scaniverse/s7-m3-reconstruction-telemetry
