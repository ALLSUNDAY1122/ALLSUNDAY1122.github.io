name: Temporary Central A Housing Batch 31

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch31-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch31-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 31
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T18:27:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions=[
            {code:'21219',name:'郡上市',type:'general_migration_support_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.gujo.gifu.jp/life/detail/content-2.html',basis:'現行の移住支援補助金は49歳以下の転入者へ世帯人数等に応じて交付する一般移住支援で、住宅費や子育て世帯を対象要件としない'},
            {code:'21341',name:'養老町',type:'three_generation_child_housing_conditions_clarified',status:'verified',summary:'祖父母・父母・中学生以下の子どもを含む三世代が町内で同居または2キロメートル以内の近居を始め、住宅を取得する場合、35万円または40万円を補助する。',source:'https://www.town.yoro.gifu.jp/life/living/1001777/1002586.html',basis:'祖父母・父母・中学生以下の子を含む三世代、同居または2キロメートル以内の近居、住宅取得、35万円または40万円の現行条件を確認'},
            {code:'21404',name:'池田町',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住宅取得・賃借・リフォーム・引越費用を最大60万円助成する。',source:'https://www.town.gifu-ikeda.lg.jp/0000002652.html',basis:'令和8年度の結婚・妊娠・共育ての相談機会提供・支援プログラムで、婚姻期間・年齢・所得・対象住宅費・最大60万円を確認'},
            {code:'23563',name:'豊根村',type:'general_home_construction_remodel_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.vill.toyone.aichi.jp/iju/sumai/993.html',basis:'現行の新築リフォーム補助金は村内居住者・居住予定者の住宅新築・改修を対象とする一般住宅制度で、子育て等を対象要件としない'},
            {code:'24344',name:'川越町',type:'empty_house_information_service_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.kawagoe.mie.jp/kurashi/sumaiseikatsu/1002417/1001635/1001636.html',basis:'空家バンクは売買・賃貸物件情報を提供する一般情報サービスで、住宅費補助でも子育て世帯向け制度でもない'}
          ];

          function writePreservingStyle(file,obj){
            const raw=fs.readFileSync(file,'utf8');
            const pretty=raw.startsWith('{\n');
            fs.writeFileSync(file,JSON.stringify(obj,null,pretty?2:0)+'\n');
          }

          const reviewed=[];
          for(const decision of decisions){
            const pref=decision.code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${decision.code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${decision.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const svc=municipality.services?.housingSupport;
            if(!svc)throw new Error(`${decision.code}: missing housingSupport`);
            const before={status:svc.status,summary:svc.summary,source:svc.source?.url};
            svc.status=decision.status;
            svc.summary=decision.summary;
            svc.source={url:decision.source,checkedAt};
            if(decision.code==='21219'){
              svc.details={
                reviewedProgram:'郡上市移住支援補助金',
                generalSupport:'49歳以下の転入者へ2人以上世帯10万円、単身5万円、Uターン5万円加算を交付',
                classificationReason:'住宅取得・改修・家賃または子育て世帯を対象要件としない一般移住支援のため、子育て住宅支援としては対象外'
              };
            }
            if(decision.code==='21341'){
              svc.details={
                program:'養老町三世代同居・近居住宅取得支援補助金',
                familyTarget:'祖父母・父母・中学生以下の子どもを含む三世代世帯',
                residenceType:'町内で同居または直線距離2キロメートル以内の近居を開始',
                acquisitionCondition:'取得費500万円以上の住宅を取得し、登記完了後6か月以内に申請',
                amount:'令和8年4月1日以降に同居・近居を開始する場合40万円、令和8年3月31日以前に開始済みの場合35万円',
                restriction:'若者定住マイホーム取得支援事業補助金との併用不可'
              };
            }
            if(decision.code==='21404'){
              svc.details={
                program:'結婚・妊娠・共育ての相談機会提供・支援プログラム（旧 結婚新生活支援事業）',
                eligibleMarriage:'令和8年1月1日から令和9年3月31日までに婚姻した夫婦',
                ageCondition:'婚姻日の年齢が夫婦とも39歳以下',
                incomeCondition:'夫婦の所得合計額が500万円未満等',
                coveredCosts:'住宅取得費、住宅賃借費、リフォーム費、引越費',
                maximum:'夫婦とも29歳以下は最大60万円、その他の39歳以下は最大30万円',
                applicationPeriod:'令和8年度の町案内期間内に申請。予算到達時は受付終了の場合あり'
              };
            }
            if(decision.code==='23563'){
              svc.details={
                reviewedProgram:'豊根村新築リフォーム補助金',
                generalSupport:'住宅新築は一律100万円、リフォームは工事費の3分の1で上限25万円、55歳以下は上限40万円',
                classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般住宅新築・改修制度のため、子育て住宅支援としては対象外'
              };
            }
            if(decision.code==='24344'){
              svc.details={
                reviewedProgram:'川越町空家バンク',
                generalService:'町内空家の売買・賃貸情報を町ホームページで提供し、宅地建物取引業者が媒介する',
                classificationReason:'住宅費を助成する制度ではなく、子育て世帯・新婚世帯・三世代世帯を対象とする条件もない一般情報サービスのため対象外'
              };
            }
            municipality.updatedAt=checkedAt;
            writePreservingStyle(dataPath,municipality);

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第31群で公式利用者向けページを独立確認し、${decision.type}として判定。`];
            task.blockers=task.blockers||[];
            writePreservingStyle(taskPath,task);

            reviewed.push({code:decision.code,name:decision.name,service:'housingSupport',correctionType:decision.type,beforeStatus:before.status,afterStatus:decision.status,beforeSummary:before.summary,afterSummary:decision.summary,officialSource:decision.source,officialBasis:decision.basis,contentChanged:before.status!==decision.status||before.summary!==decision.summary||before.source!==decision.source});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch31-decisions-20260726',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:5,
            statusToUnavailableCount:3,
            verifiedReplacementOrClarificationCount:2,
            verifiedMaintainedCount:0,
            reviewed,
            causeScan:{previousRemainingCandidates:24,reviewedHighRiskCandidates:5,remainingCandidates:19},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般移住給付・一般住宅新築改修・空家情報サービスは子育て住宅支援へ分類しない',
              '中学生以下の子を含む三世代同居・近居住宅取得制度はverified対象に含める',
              '結婚新生活支援は新婚世帯向け住宅支援としてverified対象に含める'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch31-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残19件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=209;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=641;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=19;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残19件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:31,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:3,verifiedReplacementOrClarificationCount:2,verifiedMaintainedCount:0,remainingCandidates:19,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第31群として、郡上市・豊根村・川越町をunavailableへ修正し、養老町の三世代住宅条件を明確化、池田町を令和8年度結婚新生活支援へ差し替えた。';
          writePreservingStyle(checkpointPath,checkpoint);

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          writePreservingStyle(regionPath,region);

          const trigger=path.join(root,'operations/control/central-a-housing-batch31-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/21/21219.json|jichitai-compare/data/municipalities/21/21341.json|jichitai-compare/data/municipalities/21/21404.json|jichitai-compare/data/municipalities/23/23563.json|jichitai-compare/data/municipalities/24/24344.json|jichitai-compare/operations/tasks/21219.json|jichitai-compare/operations/tasks/21341.json|jichitai-compare/operations/tasks/21404.json|jichitai-compare/operations/tasks/23563.json|jichitai-compare/operations/tasks/24344.json|jichitai-compare/operations/audits/central-a-housing-classification-batch31-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/21219/index.html|jichitai-compare/municipality/21341/index.html|jichitai-compare/municipality/21404/index.html|jichitai-compare/municipality/23563/index.html|jichitai-compare/municipality/24344/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch31-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第31群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
