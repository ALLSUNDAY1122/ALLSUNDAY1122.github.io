name: APP2-005 HM1 difficulty audit

on:
  push:
    paths:
      - automation/app2-005-hm1-difficulty-audit-command.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden severe canonical questions
        run: node ios/health-manager-1/audit/harden-severe-difficulty-2026-08-22.cjs
      - name: Persist canonical hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/health-manager-1/Resources/questions.json
          git commit -m "Harden HM1 severe difficulty questions" || true
      - name: Expand bank to 264
        run: node ios/health-manager-1/augment-to-264.cjs
      - name: Run difficulty audit on all 264
        continue-on-error: true
        run: node ios/health-manager-1/audit/difficulty-audit-2026-08-21.cjs
      - name: Persist audit and canonical bank
        run: |
          git restore ios/health-manager-1/Resources/questions.json
          node ios/health-manager-1/audit/harden-severe-difficulty-2026-08-22.cjs
          rm -f ios/health-manager-1/audit/APP2_005_264_EXPANSION_2026-08-19.json
          git add ios/health-manager-1/Resources/questions.json ios/health-manager-1/audit/DIFFICULTY_AUDIT_2026-08-21.json ios/health-manager-1/audit/DIFFICULTY_FLAGGED_2026-08-21.tsv
          git commit -m "Record HM1 hardened difficulty audit" || true
          git push
