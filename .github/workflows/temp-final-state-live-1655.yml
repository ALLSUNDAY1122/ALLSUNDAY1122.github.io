name: Temporary final state live 1655

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-final-state-live-1655.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build current management snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main region/north region/east region/central region/west
          BASE=$(git rev-parse HEAD^)
          OUT=coord/final-state-454-live-20260722-1655
          git checkout -B "$OUT" "$BASE"
          python3 - <<'PY'
          import json,re,subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          root='jichitai-compare'
          ts=datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          progress=json.loads((Path(root)/'operations/progress.json').read_text(encoding='utf-8'))
          assert progress['registeredMunicipalities']==454
          regions={
            'north':('origin/region/north',lambda p:1<=p<=7,717),
            'east':('origin/region/east',lambda p:8<=p<=15 or p in (19,20),708),
            'central':('origin/region/central',lambda p:16<=p<=18 or 21<=p<=30,709),
            'west':('origin/region/west',lambda p:31<=p<=47,716),
          }
          def rows(ref,accept):
            paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,f'{root}/data/municipalities'],text=True).splitlines()
            out=[]
            for p in paths:
              m=re.fullmatch(rf'{root}/data/municipalities/(\d{{2}})/(\d{{5}})\.json',p)
              if not m or not accept(int(m.group(1))): continue
              d=json.loads(subprocess.check_output(['git','show',f'{ref}:{p}'],text=True))
              out.append({'code':m.group(2),'name':d.get('name') or d.get('municipalityName') or m.group(2)})
            return sorted(out,key=lambda x:x['code'])
          main_all={x['code'] for key,(ref,accept,pr) in regions.items() for x in rows('HEAD',accept)}
          region_rows={}; pending={}; counts={}
          for key,(ref,accept,pr) in regions.items():
            rr=rows(ref,accept); region_rows[key]=rr; counts[key]=len(rr)
            pending[key]=[x for x in rr if x['code'] not in main_all]
          pending_counts={k:len(v) for k,v in pending.items()}
          total=sum(counts.values()); pending_total=sum(pending_counts.values())
          queue_path=Path(root)/'operations/control/release-queue.json'
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          queue['updatedAt']=ts; queue['status']='active'
          for e in queue['entries']:
            k=e['region']; n=pending_counts[k]
            e.update({'municipalities':region_rows[k],'count':counts[k],'pendingSinceLastRelease':n,'releaseStatus':'ready' if n>=10 else ('up_to_date' if n==0 else 'pending_threshold'),'reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{n}自治体','mainIntegrationPr':regions[k][2],'generatedPullRequest':720,'auditStatus':'passed'})
          ready=[k for k,n in pending_counts.items() if n>=10]
          queue['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':454,'latestGeneratedPullRequest':720,'latestPublicCountPullRequest':720,'releaseReadyRegions':ready,'nextAction':'10自治体到達地域を固定スナップショットで全国統合する。' if ready else '地方統合を継続。'}
          queue['nextAction']='地方統合を継続。現在の公開後繰越: '+ '、'.join(f'{k} {pending_counts[k]}' for k in ('north','east','central','west'))+'。'
          queue['humanDecisionRequired']=False
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          global_path=Path(root)/'operations/control/global-state.json'
          gs=json.loads(global_path.read_text(encoding='utf-8'))
          gs.update({'updatedAt':ts,'phase':'release-monitoring','regionalCompletedSinceLastRelease':{**pending_counts,'total':pending_total},'priority':{'type':'release-monitoring','nextAction':('release_ready' if ready else max(pending_counts,key=pending_counts.get)+'_remaining_'+str(10-max(pending_counts.values())))},'lastNationalIntegrationPr':717,'latestGeneratedMunicipalityCount':454,'latestGeneratedPullRequest':720,'latestPublicCountPullRequest':720,'regionalMergedMunicipalities':total,'openPullRequests':[],'humanDecisionRequired':False})
          global_path.write_text(json.dumps(gs,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          audit_path=Path(root)/'operations/control/audit-log.jsonl'
          text=audit_path.read_text(encoding='utf-8'); text += '' if not text or text.endswith('\n') else '\n'
          rec={'timestamp':ts,'actor':'全国進行統括','action':'coordinator-live-reconciliation-454','details':{'publicMunicipalityCount':454,'publicServices':4086,'regionalCounts':counts,'regionalMergedMunicipalities':total,'pendingSinceLatestNationalIntegration':{**pending_counts,'total':pending_total},'pendingMunicipalities':pending,'nationalIntegrations':{'north':717,'east':708,'central':709,'west':716},'publication':{'pullRequest':720,'municipalityCount':454},'openMunicipalityPullRequests':0,'ignoredUnrelatedOpenPullRequests':[549]},'humanDecisionRequired':False}
          audit_path.write_text(text+json.dumps(rec,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          Path('/tmp/snapshot.txt').write_text(f"{total} {pending_counts['north']} {pending_counts['east']} {pending_counts['central']} {pending_counts['west']}")
          PY
          git add jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/audit-log.jsonl
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          read total north east central west < /tmp/snapshot.txt
          git commit -m "統括管理: 公開454・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force-with-lease origin "$OUT"
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-final-state-live-1655.yml ]; then
            git rm .github/workflows/temp-final-state-live-1655.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 最新状態同期一時ワークフローを削除'
            git push origin main
          fi
