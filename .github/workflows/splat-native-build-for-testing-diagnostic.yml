name: Splat Native build-for-testing diagnostic
on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-build-for-testing-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose-build-for-testing:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Generate project
        working-directory: splat-native-ios
        run: xcodegen generate
      - name: Resolve packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative
      - name: Build test bundle with captured diagnostics
        id: build_for_testing
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -f /tmp/splat-build-for-testing.log /tmp/splat-build-for-testing-diagnostics.txt
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee /tmp/splat-build-for-testing.log
          status=${PIPESTATUS[0]}
          grep -E '(^|:) error:|(^|:) warning:|fatal error:|BUILD FAILED|The following build commands failed:|Command .* failed|linker command failed|Undefined symbols|duplicate symbol|Could not|unable to' \
            /tmp/splat-build-for-testing.log | tail -300 > /tmp/splat-build-for-testing-diagnostics.txt || true
          if [ "$status" -ne 0 ] && [ ! -s /tmp/splat-build-for-testing-diagnostics.txt ]; then
            tail -300 /tmp/splat-build-for-testing.log > /tmp/splat-build-for-testing-diagnostics.txt
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload build-for-testing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splat-build-for-testing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: error
          path: |
            /tmp/splat-build-for-testing.log
            /tmp/splat-build-for-testing-diagnostics.txt
      - name: Fail if build-for-testing failed
        if: steps.build_for_testing.outcome == 'failure'
        run: exit 1
