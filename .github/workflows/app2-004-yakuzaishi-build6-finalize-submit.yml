name: APP2-004 Pharmacist Build 6 Finalize and Submit [SUPERSEDED]

# Historical Build 6 submission workflow.
#
# This route is intentionally fail-closed. It previously accepted stale device
# acceptance/authorization and exposed workflow_dispatch, which could bypass the
# current release Human Gate. All App Review submission must now use
# app2-004-yakuzaishi-submit-review.yml, whose command is pinned to the exact
# release commit and requires a fresh (<=24h) explicit user approval.
on:
  push:
    branches: [main]
    paths:
      - automation/app2-004-yakuzaishi-build6-finalize-submit-command.json
      - .github/workflows/app2-004-yakuzaishi-build6-finalize-submit.yml

permissions:
  contents: read

concurrency:
  group: app2-004-yakuzaishi-build6-finalize-submit-superseded
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block legacy App Review submission route
        run: |
          echo 'PROCESS_FAILURE_GUARD: legacy Build 6 submission route is superseded.' >&2
          echo 'Use APP2-004 Pharmacist Submit App Review with fresh commit-pinned human approval.' >&2
          exit 1
