name: SC Release Status Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[SC-RELEASE] Sync release status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize fresh release facts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('sc-manabi-sprint/RELEASE_STATUS.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            '更新基準日: 2026-08-10 18:43 JST':'更新基準日: 2026-09-12 11:32 JST',
            '- Bundle ID: `jp.allsunday1122.scmanabisprint` **（暫定。App Store Connect作成前のため最終確定扱いにしない）**':'- Bundle ID: `jp.allsunday1122.scmanabisprint` **（最終確定）**',
            '- App Store Connect App ID: **未発行 / 未確認**':'- App Store Connect App ID: **未発行**（2026-09-12 fresh API read: Bundle ID一致App=0）',
            '- root `codemagic.yaml`へのSC workflow統合: **未実施**':'- root `codemagic.yaml`へのSC workflow統合: **PASS**（2026-09-12 / Issue #4928 / run 34667781515 / YAML parse PASS）',
            '- GitHub `sc-manabi-sprint/native/AppIcon-1024.png`: **未配置（2026-08-10 18:43確認時 404）**':'- GitHub `sc-manabi-sprint/native/AppIcon-1024.png`: **未配置**。ただし2026-09-12にGoogle Drive正本を認証済み取得し、1024×1024 RGB・SHA-256一致を再確認済み。',
            '- 未完了内容: `sc-manabi-sprint/app-store/codemagic-sc-workflow.yaml` の `sc-manabi-sprint-ios` をroot `codemagic.yaml`へ統合。\n- FAIL理由: 候補定義のみでCodemagic実行条件が本番設定へ反映されていない。\n- ChatGPTで実行可能: root YAMLへの安全な統合、構文確認。\n- 本人操作が必要: Codemagic App Store Connect integration/署名プロファイルの実アカウント確認。\n- 次: AppIcon配置後にroot workflow統合。':'- **完了（2026-09-12）**：`sc-manabi-sprint-ios` をroot `codemagic.yaml`へ統合し、PyYAML parse、Bundle ID、Internal TestFlight有効、App Store提出無効を検証PASS。\n- Codemagic app resolveもfresh inspect #4926でPASS。\n- 残件はcanonical AppIconのGitHub配置後に署名Release Buildを実行すること。',
            '- Codemagic SC workflowがroot設定へ未統合\n':'',
            '- Bundle IDが最終確定扱いではない\n':'',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('expected release-status text missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit status synchronization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sc-manabi-sprint/RELEASE_STATUS.md
          git diff --cached --check
          git commit -m 'Sync SC release status after Codemagic integration'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `SC release status sync finished. status=${{ job.status }}; run_id=${context.runId}`});
