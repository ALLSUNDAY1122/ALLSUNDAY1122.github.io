name: Temporary West B Final Audit Integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == 'run-west-b-final-audit-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check correction is on main
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d = JSON.parse(fs.readFileSync('jichitai-compare/data/municipalities/47/47302.json', 'utf8'));
          const expected = 'https://www.vill.ogimi.okinawa.jp/section/reiki_int/reiki_honbun/q913RG00000549.html';
          if (d.services.childcareFee.source.url !== expected) process.exit(1);
          NODE
      - name: Build clean audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin audit/west-b-rough-validation-cycles-09-10-20260725
          git checkout -B audit/west-b-final-cycles09-10-review-20260725 origin/main
          git show origin/audit/west-b-rough-validation-cycles-09-10-20260725:jichitai-compare/operations/audits/west-b-rough-validation-cycle-09-20260725.json > jichitai-compare/operations/audits/west-b-rough-validation-cycle-09-20260725.json
          git show origin/audit/west-b-rough-validation-cycles-09-10-20260725:jichitai-compare/operations/audits/west-b-rough-validation-cycle-10-20260725.json > jichitai-compare/operations/audits/west-b-rough-validation-cycle-10-20260725.json
          export CORRECTION_REF=$(git log -1 --format=%H -- jichitai-compare/data/municipalities/47/47302.json)
          node .github/temp-west-b-final-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/west-b-rough-validation-cycle-09-20260725.json
          git add jichitai-compare/operations/audits/west-b-rough-validation-cycle-09-review-20260725.json
          git add jichitai-compare/operations/audits/west-b-rough-validation-cycle-10-20260725.json
          git add jichitai-compare/operations/audits/west-b-rough-validation-cycle-10-review-20260725.json
          git commit -m "audit: 西日本B概略検証 第9・10回を確定"
          git push --force origin HEAD:audit/west-b-final-cycles09-10-review-20260725
          gh issue close "${{ github.event.issue.number }}" --comment "第9・10回の監査ブランチを作成しました。"
