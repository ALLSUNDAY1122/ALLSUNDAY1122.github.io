name: 管理栄養士 Native SwiftUI Audit

on:
  pull_request:
    paths:
      - 'kanrieiyoushi-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/kanrieiyoushi-native-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanrieiyoushi-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and audit canonical 600 questions
        run: |
          python3 kanrieiyoushi-sprint/audit/build_round1_2_3_canonical.py
          python3 automation/learning-sprint-question-pipeline/validate_questions.py kanrieiyoushi-sprint/audit/learning-sprint-audit-round1-2-3.json
          python3 kanrieiyoushi-sprint/audit/audit_content_rights.py
      - name: Build native 600-question payload
        run: python3 kanrieiyoushi-sprint/scripts/build_native_questions.py
      - name: Native release static gate
        run: python3 kanrieiyoushi-sprint/scripts/validate_native_release.py
      - name: No WebView in app target
        run: |
          ! grep -R --line-number -E 'WKWebView|import WebKit|UIViewRepresentable' kanrieiyoushi-sprint/ios/KanriEiyoushiSprint/*.swift
          ! grep -q 'path: Web' kanrieiyoushi-sprint/ios/project.yml
      - name: Script syntax
        run: |
          python3 -m py_compile kanrieiyoushi-sprint/scripts/build_native_questions.py kanrieiyoushi-sprint/scripts/validate_native_release.py
          bash -n kanrieiyoushi-sprint/scripts/run_native_ui_tests.sh
          bash -n kanrieiyoushi-sprint/ios/prepare-ios.sh

  native-simulator:
    needs: static-audit
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Shared Native Core unit tests
        run: |
          cd native-ios/LearningSprintCore
          swift test
      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare native resources for Simulator
        run: KANRI_ICON_MODE=simulator-placeholder bash kanrieiyoushi-sprint/ios/prepare-ios.sh
      - name: Generate Xcode project
        run: |
          cd kanrieiyoushi-sprint/ios
          xcodegen generate
      - name: Unit and UI tests on two iPhone sizes
        run: bash kanrieiyoushi-sprint/scripts/run_native_ui_tests.sh
      - name: Release configuration compile without signing
        run: |
          cd kanrieiyoushi-sprint/ios
          xcodebuild build \
            -project KanriEiyoushiSprint.xcodeproj \
            -scheme KanriEiyoushiSprint \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=
