name: S8 one-shot S2 storage failure hotfix

on:
  push:
    branches:
      - scaniverse/s2-splat-reconstruction
    paths:
      - '.github/workflows/s8-hotfix-s2-storage.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scaniverse/s2-splat-reconstruction
          fetch-depth: 0
      - name: Apply exact S8 storage fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/ScanModel.swift')
          s = p.read_text()
          old = '''                self.isWritingFrame = false\n                guard success, self.phase == .capturing else { return }\n                self.captured.append(CapturedView(\n'''
          new = '''                self.isWritingFrame = false\n                guard self.phase == .capturing else { return }\n                guard success else {\n                    let message = "撮影データを保存できませんでした。iPhoneの空き容量を確認してください。"\n                    self.phase = .failed(message)\n                    self.trackingMessage = message\n                    self.session?.pause()\n                    UIApplication.shared.isIdleTimerDisabled = false\n                    return\n                }\n                self.captured.append(CapturedView(\n'''
          if s.count(old) != 1:
              raise SystemExit(f'patch anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'self.phase = .failed(message)' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'iPhoneの空き容量を確認してください' splat-native-ios/SplatNative/ScanModel.swift
      - name: Build patched S2 app
        run: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          cd splat-native-ios
          xcodegen generate
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name 'S8 Adversarial QA'
          git config user.email 'actions@users.noreply.github.com'
          git add splat-native-ios/SplatNative/ScanModel.swift
          git commit -m 'fix(s2): fail capture when frame storage fails'
          git push origin HEAD:scaniverse/s2-splat-reconstruction
