name: Temporary Central A Housing Batch 9 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch9-public-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch9-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const targets = [
            { code:'16210', name:'南砺市', status:'verified', summary:'39歳以下の新婚世帯へ、2026年度の住居費・引越費・リフォーム費を上限30万円または60万円補助する。', source:'https://www.city.nanto.toyama.jp/soshiki/shiminkyodo/4/410.html' },
            { code:'17461', name:'穴水町', status:'verified', summary:'県外から転入する子育て世帯へ、引越費用20万円と家賃月額最大3万円を補助する。', source:'https://www.town.anamizu.lg.jp/site/iju/100335.html' },
            { code:'17463', name:'能登町', status:'verified', summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・引越・リフォーム費を上限30万円または60万円補助する。', source:'https://www.town.noto.lg.jp/kakuka/1001/gyomu/7/1796.html' },
            { code:'21381', name:'神戸町', status:'unavailable', summary:'子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。', source:'https://www.town.godo.gifu.jp/life/other/other13.html' },
            { code:'23446', name:'美浜町', status:'verified', summary:'同一世帯に子どもが1人以上いる世帯、または夫婦のいずれかが40歳未満の世帯へ、新築・建売住宅の取得費を10万円補助する。', source:'https://www.town.aichi-mihama.lg.jp/kurashi-tetsuzuki/zumai/hojokin-joseikin/1487.html' }
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const auditPath = 'jichitai-compare/operations/audits/central-a-housing-classification-batch9-public-verification-20260725.json';
          fs.mkdirSync(path.dirname(auditPath), { recursive: true });

          let finalResult = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const cache = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const response = await fetch(`${base}/municipality/${target.code}/?audit=${cache}`, {
                  redirect: 'follow', signal: AbortSignal.timeout(25000),
                  headers: { 'user-agent': 'CentralAHousingBatch9PublicVerification/1.0' }
                });
                const text = await response.text();
                const unavailableMatches = target.status === 'unavailable' ? text.includes('公式情報で詳細未確認') : true;
                pageChecks.push({
                  code: target.code, name: target.name, expectedStatus: target.status,
                  url: response.url, httpStatus: response.status,
                  summaryMatches: text.includes(target.summary), sourceMatches: text.includes(target.source),
                  unavailableLabelMatches: target.status === 'unavailable' ? unavailableMatches : null,
                  success: response.ok && text.includes(target.summary) && text.includes(target.source) && unavailableMatches
                });
              } catch (error) {
                pageChecks.push({ code: target.code, name: target.name, httpStatus: null, success: false, error: String(error) });
              }
            }

            let wrongCodePage = { code:'21364', success:false };
            try {
              const response = await fetch(`${base}/municipality/21364/?audit=${cache}`, {
                redirect: 'manual', signal: AbortSignal.timeout(25000),
                headers: { 'user-agent': 'CentralAHousingBatch9PublicVerification/1.0' }
              });
              wrongCodePage = { code:'21364', httpStatus:response.status, success:response.status === 404 };
            } catch (error) {
              wrongCodePage = { code:'21364', success:false, error:String(error) };
            }

            let generated = { success:false };
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${cache}`, {
                redirect: 'follow', signal: AbortSignal.timeout(40000),
                headers: { 'user-agent': 'CentralAHousingBatch9PublicVerification/1.0' }
              });
              const payload = JSON.parse(await response.text());
              const municipalities = Array.isArray(payload) ? payload : Array.isArray(payload.municipalities) ? payload.municipalities : [];
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services ?? {}).length, 0);
              const checks = targets.map((target) => {
                const municipality = municipalities.find((item) => String(item.code) === target.code);
                const service = municipality?.services?.housingSupport;
                return {
                  code:target.code, found:Boolean(municipality), expectedStatus:target.status,
                  statusMatches:service?.status === target.status,
                  summaryMatches:service?.summary === target.summary,
                  sourceMatches:service?.source?.url === target.source,
                  success:Boolean(municipality) && service?.status === target.status && service?.summary === target.summary && service?.source?.url === target.source
                };
              });
              generated = {
                httpStatus:response.status,
                municipalityCount:municipalities.length,
                serviceCount,
                municipalityCount1741:municipalities.length === 1741,
                serviceCount15669:serviceCount === 15669,
                wrongCodeAbsent:!municipalities.some((item) => String(item.code) === '21364'),
                correctCodePresent:municipalities.some((item) => String(item.code) === '21381'),
                checks,
                success:response.ok && municipalities.length === 1741 && serviceCount === 15669 && !municipalities.some((item) => String(item.code) === '21364') && municipalities.some((item) => String(item.code) === '21381') && checks.every((item) => item.success)
              };
            } catch (error) {
              generated = { success:false, error:String(error) };
            }

            const success = pageChecks.every((item) => item.success) && wrongCodePage.success && generated.success;
            finalResult = {
              schemaVersion:'1.0.0', auditId:'central-a-housing-classification-batch9-public-verification-20260725',
              generatedAt:new Date().toISOString(), attempt,
              regionalPullRequest:3580, regionalCiRun:8703,
              stateSyncPullRequest:3587, stateSyncCiRun:8725,
              nationalSyncPullRequest:3590, nationalSyncWorkflowRunId:30150782971, nationalCiRun:8833,
              verificationPullRequest:Number(process.env.PR_NUMBER), verificationWorkflowRunId:Number(process.env.RUN_ID),
              pageChecks, wrongCodePage, publicGeneratedJson:generated,
              success, releaseBlocker:success ? 'none' : 'public_sync_pending'
            };
            fs.writeFileSync(auditPath, JSON.stringify(finalResult, null, 2) + '\n');
            if (success) break;
            await sleep(8000);
          }
          if (!finalResult?.success) process.exit(1);
          NODE

      - name: Commit public verification record
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch9-public-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/central-a-housing-classification-batch9-public-verification-20260725.json \
            jichitai-compare/operations/control/central-a-housing-batch9-public-trigger-20260725.json
          git commit -m 'verify: 中日本A住宅支援第9群の公開反映を確認'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
