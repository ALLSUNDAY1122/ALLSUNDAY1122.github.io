name: Josanshi Native Foundation

on:
  push:
    branches:
      - agent/josanshi-sprint-14-native
    paths:
      - 'josanshi-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/josanshi-native-foundation.yml'
  pull_request:
    paths:
      - 'josanshi-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/josanshi-native-foundation.yml'

jobs:
  native-foundation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate official-structure question blueprint
        run: python3 josanshi-sprint/scripts/validate_blueprint.py

      - name: Validate anti-padding generation slots
        run: python3 josanshi-sprint/scripts/generate_slots.py --check

      - name: Assert no WebView primary implementation
        shell: bash
        run: |
          if grep -R -n -E 'WKWebView|import WebKit|SFSafariViewController' josanshi-sprint/ios/JosanshiSprintFeature/Sources; then
            echo 'Web-based primary UI is prohibited for #14.' >&2
            exit 1
          fi

      - name: Run Swift package tests
        run: swift test --package-path josanshi-sprint/ios/JosanshiSprintFeature

      - name: Assert production identifiers are not guessed
        shell: bash
        run: |
          if grep -R -n -E 'jp\.allsunday1122\.[A-Za-z0-9._-]+|productID: "[^" ]+"|appStoreConnectAppID: "[0-9]+"' josanshi-sprint/ios/JosanshiSprintFeature/Sources; then
            echo 'A production identifier appears to have been hard-coded before canonical confirmation.' >&2
            exit 1
          fi
