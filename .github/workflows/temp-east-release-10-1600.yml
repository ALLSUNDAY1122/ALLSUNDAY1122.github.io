name: Temporary East Release 10 1600

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-east-release-10-1600.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/east-release-10-20260722-1600
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy fixed east snapshot
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/east:refs/remotes/origin/region/east'
          paths=(
            jichitai-compare/data/municipalities/09/09216.json jichitai-compare/operations/tasks/09216.json
            jichitai-compare/data/municipalities/09/09301.json jichitai-compare/operations/tasks/09301.json
            jichitai-compare/data/municipalities/09/09342.json jichitai-compare/operations/tasks/09342.json
            jichitai-compare/data/municipalities/09/09343.json jichitai-compare/operations/tasks/09343.json
            jichitai-compare/data/municipalities/09/09344.json jichitai-compare/operations/tasks/09344.json
            jichitai-compare/data/municipalities/09/09345.json jichitai-compare/operations/tasks/09345.json
            jichitai-compare/data/municipalities/09/09361.json jichitai-compare/operations/tasks/09361.json
            jichitai-compare/data/municipalities/09/09364.json jichitai-compare/operations/tasks/09364.json
            jichitai-compare/data/municipalities/09/09384.json jichitai-compare/operations/tasks/09384.json
            jichitai-compare/data/municipalities/09/09386.json jichitai-compare/operations/tasks/09386.json
          )
          git checkout origin/region/east -- "${paths[@]}"
          git add "${paths[@]}"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 東日本10自治体を固定スナップショット化'
          git push origin HEAD:coord/east-release-10-20260722-1600
