name: HM1 exact nine Q81-Q90 rebuild regression
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - .github/workflows/hm1-exact-nine-q81-q90.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild baseline and current to 264 and compare exact nine
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/hm1-q81-base 296a9bbf05033d67855dc9c5a3d1221eda591826
          node /tmp/hm1-q81-base/ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q81-base.log
          node ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q81-current.log
          node - <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('/tmp/hm1-q81-base/ios/health-manager-1/Resources/questions.json'));
          const cur=JSON.parse(fs.readFileSync('ios/health-manager-1/Resources/questions.json'));
          const wanted=['2025-10-Q37','2025-10-Q38','2025-10-Q39','2025-10-Q40','2025-10-Q41','2025-10-Q43','2025-10-Q44','2025-04-Q01','2025-04-Q02'].sort();
          if(base.length!==264||cur.length!==264) throw Error('Expected 264 questions both sides');
          for(const a of [base,cur]){
            if(new Set(a.map(q=>q.id)).size!==264)throw Error('ID duplication');
            if(new Set(a.map(q=>String(q.stem).normalize('NFKC').replace(/[\\s\\p{P}\\p{S}]/gu,'').toLowerCase())).size!==264)throw Error('normalized stem duplication');
            for(const q of a){
              if(!Array.isArray(q.choices)||q.choices.length!==5||new Set(q.choices).size!==5)throw Error('invalid choices '+q.id);
              if(!Number.isInteger(q.ans)||q.ans<0||q.ans>4)throw Error('invalid answer '+q.id);
            }
          }
          if(base.some((q,i)=>q.id!==cur[i].id))throw Error('Changed ID order');
          const changed=cur.filter((q,i)=>JSON.stringify(q)!==JSON.stringify(base[i])).map(q=>q.id).sort();
          if(JSON.stringify(changed)!==JSON.stringify(wanted))throw Error('Wrong changed IDs: '+JSON.stringify(changed));
          for(let i=0;i<cur.length;i++){
            if(!wanted.includes(cur[i].id))continue;
            if(cur[i].ans!==base[i].ans)throw Error('Changed correct answer '+cur[i].id);
            for(const k of new Set([...Object.keys(cur[i]),...Object.keys(base[i])])){
              if(JSON.stringify(cur[i][k])!==JSON.stringify(base[i][k])&&!['stem','choices','short','detail'].includes(k))
                throw Error('Changed unexpected field '+cur[i].id+' '+k);
            }
          }
          console.log('PASS: rebuilt 264 on both refs, changed exact nine IDs, other 255 identical; IDs in order unique, answer indices preserved, five unique choices per question.');
          NODE
