name: Scaniverse Build 4 Status Probe

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - .github/workflows/scaniverse-build4-status-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Read workflow runs for release trigger commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          sha='6408c333b73971510c0e80c5d9d9221d83215cf4'
          req=urllib.request.Request(
              f'https://api.github.com/repos/ALLSUNDAY1122/ALLSUNDAY1122.github.io/actions/runs?head_sha={sha}&per_page=100',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read().decode())
          runs=[]
          for x in payload.get('workflow_runs',[]):
              runs.append({k:x.get(k) for k in ('id','name','event','status','conclusion','workflow_id','head_sha','created_at','updated_at','html_url')})
          out={'head_sha':sha,'runs':runs}
          Path('/tmp/scaniverse-build4-actions-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist probe and remove one-shot workflow
        run: |
          set -euo pipefail
          git fetch origin feature/splat-native-ios-poc
          git reset --hard origin/feature/splat-native-ios-poc
          mkdir -p splat-native-ios/evidence
          cp /tmp/scaniverse-build4-actions-probe.json splat-native-ios/evidence/scaniverse-build4-actions-probe.json
          git rm -f .github/workflows/scaniverse-build4-status-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splat-native-ios/evidence/scaniverse-build4-actions-probe.json
          git commit -m "evidence(scaniverse): record Build 4 workflow state"
          git push origin HEAD:feature/splat-native-ios-poc
