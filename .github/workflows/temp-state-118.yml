name: Temp State 118

on:
  push:
    branches:
      - coord/state-118-jul21

permissions:
  contents: write

jobs:
  update-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/state-118-jul21
          fetch-depth: 0
      - name: Update control state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queuePath = 'jichitai-compare/operations/control/release-queue.json';
          const globalPath = 'jichitai-compare/operations/control/global-state.json';
          const auditPath = 'jichitai-compare/operations/control/audit-log.jsonl';
          const queue = JSON.parse(fs.readFileSync(queuePath, 'utf8'));
          const addUnique = (entry, items) => {
            const seen = new Set(entry.municipalities.map(x => x.code));
            for (const item of items) if (!seen.has(item.code)) entry.municipalities.push(item);
          };
          const north = queue.entries.find(x => x.region === 'north');
          const central = queue.entries.find(x => x.region === 'central');
          addUnique(north, [
            {code:'01231',name:'恵庭市'},
            {code:'01233',name:'伊達市'},
            {code:'01234',name:'北広島市'},
            {code:'01235',name:'石狩市'},
            {code:'01236',name:'北斗市'},
            {code:'01303',name:'当別町'}
          ]);
          addUnique(central, [
            {code:'17386',name:'宝達志水町'},
            {code:'17407',name:'中能登町'},
            {code:'17461',name:'穴水町'},
            {code:'17463',name:'能登町'},
            {code:'18201',name:'福井市'}
          ]);
          queue.updatedAt = '2026-07-21T03:26:00+09:00';
          north.count = 35;
          north.pendingSinceLastRelease = 5;
          north.releaseStatus = 'pending_threshold';
          north.reason = '北日本の初回10自治体をPR #186、追加10自治体をPR #244、さらに三笠市から恵庭市までの追加10自治体をPR #283でmainへ全国統合。生成・公開をPR #284で93自治体へ更新後、伊達市・北広島市・石狩市・北斗市・当別町の5自治体を地方統合';
          north.mainIntegrationPr = 283;
          north.generatedPullRequest = 284;
          central.count = 36;
          central.pendingSinceLastRelease = 5;
          central.releaseStatus = 'pending_threshold';
          central.reason = '中日本の初回11自治体をPR #150、追加10自治体をPR #217、さらに加賀市から志賀町までの追加10自治体をPR #267でmainへ全国統合。生成・公開をPR #269で83自治体へ更新後、宝達志水町・中能登町・穴水町・能登町・福井市の5自治体を地方統合';
          queue.summary.regionalMergedMunicipalities = 118;
          queue.summary.waitingRegionalMergeMunicipalities = 0;
          queue.summary.releaseReadyRegions = [];
          queue.summary.auditBlockedRegions = [];
          queue.summary.lastNationalIntegrationAt = '2026-07-21T03:21:14+09:00';
          queue.summary.lastNationalIntegrationPr = 283;
          queue.summary.latestGeneratedMunicipalityCount = 93;
          queue.summary.latestGeneratedPullRequest = 284;
          queue.summary.latestPublicCountPullRequest = 284;
          queue.nextAction = '東日本と西日本が前回全国統合後8自治体で並ぶ。各あと2自治体の地方統合を監視し、先に到達した地域を固定releaseブランチ経由でmainへ全国統合する。';
          queue.humanDecisionRequired = false;
          fs.writeFileSync(queuePath, JSON.stringify(queue));

          const global = JSON.parse(fs.readFileSync(globalPath, 'utf8'));
          global.updatedAt = '2026-07-21T03:26:00+09:00';
          global.regionalCompletedSinceLastRelease = {north:5,east:8,central:5,west:8,total:26};
          global.priority = {type:'release-monitoring',nextAction:'east_or_west_remaining_2'};
          global.lastNationalIntegrationAt = '2026-07-21T03:21:14+09:00';
          global.lastNationalIntegrationPr = 283;
          global.latestGeneratedMunicipalityCount = 93;
          global.latestGeneratedPullRequest = 284;
          global.latestPublicCountPullRequest = 284;
          global.regionalMergedMunicipalities = 118;
          global.openPullRequests = [];
          global.humanDecisionRequired = false;
          fs.writeFileSync(globalPath, JSON.stringify(global));

          const event = {
            timestamp:'2026-07-21T03:26:00+09:00',
            actor:'全国進行統括',
            action:'north-national-integration-and-regional-progress-118',
            details:{
              nationalIntegration:{region:'north',mainPullRequest:283,ciRun:611,mergedAt:'2026-07-21T03:21:14+09:00',generatedPullRequest:284,generatedCiRun:613,publicMunicipalityCount:93},
              releaseBoundary:{includedCodes:['01222','01223','01224','01225','01226','01227','01228','01229','01230','01231'],deferredCodes:['01233','01234','01235','01236','01303']},
              regionalCounts:{north:35,east:18,central:36,west:29,total:118},
              pendingSinceRegionalRelease:{north:5,east:8,central:5,west:8,total:26},
              nextNationalReleaseCandidates:[{region:'east',remainingMunicipalities:2},{region:'west',remainingMunicipalities:2}],
              latestGeneratedMunicipalityCount:93,
              openMunicipalityPullRequests:0,
              openExceptions:0
            },
            humanDecisionRequired:false
          };
          const existing = fs.readFileSync(auditPath, 'utf8').replace(/\s+$/, '');
          fs.writeFileSync(auditPath, existing + '\n' + JSON.stringify(event) + '\n');
          NODE
          rm -f .github/workflows/temp-state-118.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-state-118.yml
          git commit -m "統括管理: 118自治体へ更新"
          git push origin HEAD:coord/state-118-jul21
