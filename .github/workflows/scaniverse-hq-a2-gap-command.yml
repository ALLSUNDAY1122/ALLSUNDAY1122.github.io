          dataset = '''                let dataset = GaussianDataset(\n                    path: path,\n                    downscaleFactor: SplatReconstructionPolicy.datasetDownscale,\n                    evalMode: false\n                )\n'''
          preflight = '''                let preflightEvaluation = passResourceGuard.evaluate(splatCount: 0)\n                if let reason = preflightEvaluation.reason {\n                    let report = passResourceGuard.makeReport(\n                        startedAt: runStartedAt, startUptime: runStartUptime,\n                        passStartIteration: 0, targetIteration: requestedTarget,\n                        finalIteration: 0, finalSplatCount: 0,\n                        initialThermalState: initialThermalState,\n                        finalThermalState: splatThermalStateName(ProcessInfo.processInfo.thermalState),\n                        outcome: "preflight-\\(reason.rawValue)"\n                    )\n                    SplatReconstructionRunReport.write(report, projectURL: projectURL)\n                    Task { @MainActor [weak self] in self?.failTraining(reason.userMessage) }\n                    return\n                }\n\n''' + dataset
          if s.count(dataset) != 1: raise SystemExit('dataset anchor mismatch')
          model.write_text(s.replace(dataset, preflight, 1), encoding='utf-8')

          project = Path('splat-native-ios/project.yml')
          p = project.read_text(encoding='utf-8')
