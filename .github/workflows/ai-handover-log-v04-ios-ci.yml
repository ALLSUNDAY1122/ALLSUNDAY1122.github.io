# Registered workflow; this update triggers PR synchronization.
name: AI Handover Log v0.4 iOS CI

on:
  push:
    branches:
      - agent/ai-handover-log-v04-binary
  pull_request:
    paths:
      - source_parts/**
      - patches/**
      - .github/workflows/ai-handover-log-v04-ios-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          {
            sw_vers
            echo
            xcodebuild -version
            echo
            xcrun --sdk iphonesimulator --show-sdk-version
            echo
            ruby --version
            pod --version
          } | tee "$RUNNER_TEMP/logs/apple-toolchain.log"

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          : > "$RUNNER_TEMP/source.tar.xz"
          for part in source_parts/part_*.b64; do
            base64 --decode "$part" >> "$RUNNER_TEMP/source.tar.xz"
          done
          echo 'cdb7067a29385d346edadb7506f39f7e5cfd567a07e930e5b43344ae4f50e234  '"$RUNNER_TEMP/source.tar.xz" | shasum -a 256 -c -
          tar -tJf "$RUNNER_TEMP/source.tar.xz" > "$RUNNER_TEMP/logs/source-files.txt"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"
          python3 patches/fix_v04_migration.py "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/pubspec.yaml"
          test -f "$RUNNER_TEMP/source/lib/main.dart"

      - name: Generate clean iOS Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=ios \
            --project-name=aihandoverlog \
            --org=jp.allsunday \
            "$RUNNER_TEMP/build"
          SOURCE="$RUNNER_TEMP/source"
          rm -rf "$RUNNER_TEMP/build/lib" "$RUNNER_TEMP/build/test"
          cp -R "$SOURCE/lib" "$RUNNER_TEMP/build/lib"
          cp -R "$SOURCE/test" "$RUNNER_TEMP/build/test"
          cp "$SOURCE/pubspec.yaml" "$RUNNER_TEMP/build/pubspec.yaml"
          cp "$SOURCE/analysis_options.yaml" "$RUNNER_TEMP/build/analysis_options.yaml"
          flutter --version | tee "$RUNNER_TEMP/logs/flutter-version.log"

      - name: Apply iOS product settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          root = Path(r'${{ runner.temp }}/build')
          plist_path = root / 'ios/Runner/Info.plist'
          with plist_path.open('rb') as f:
              plist = plistlib.load(f)
          plist['CFBundleDisplayName'] = 'AI引継ぎ帳'
          plist['CFBundleName'] = 'AI引継ぎ帳'
          with plist_path.open('wb') as f:
              plistlib.dump(plist, f, sort_keys=False)
          PY

      - name: Resolve dependencies
        id: pubget
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/logs/pub-get.log"

      - name: Run Flutter tests on macOS
        id: test
        if: steps.pubget.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/logs/flutter-test-macos.log"

      - name: Build unsigned iOS Simulator app
        id: iosbuild
        if: steps.pubget.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/logs/flutter-ios-simulator-build.log"

      - name: Inspect generated iOS project
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set +e
          {
            echo '=== Podfile.lock ==='
            cat ios/Podfile.lock
            echo
            echo '=== Generated plugin registrant ==='
            find ios -name 'GeneratedPluginRegistrant.*' -maxdepth 8 -print
            echo
            echo '=== Simulator app ==='
            find build/ios/iphonesimulator -maxdepth 2 -type d -name '*.app' -print
            echo
            echo '=== Bundle identifier settings ==='
            grep -R 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj
            echo
            echo '=== Deployment targets ==='
            grep -R 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj
          } 2>&1 | tee "$RUNNER_TEMP/logs/ios-project-inspection.log"

      - name: Package iOS simulator result
        if: steps.pubget.outcome == 'success' && steps.test.outcome == 'success' && steps.iosbuild.outcome == 'success'
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "$RUNNER_TEMP/release/AI_Handover_Log_v0.4_iOS_Simulator_Runner.app.zip"
          shasum -a 256 "$RUNNER_TEMP/release/AI_Handover_Log_v0.4_iOS_Simulator_Runner.app.zip" \
            > "$RUNNER_TEMP/release/AI_Handover_Log_v0.4_iOS_Simulator_Runner.app.sha256"
          cat > "$RUNNER_TEMP/release/AI引継ぎ帳_v0.4_iOSシミュレーター検証報告.md" <<'EOF'
          # AI引継ぎ帳 v0.4 iOSシミュレーター検証報告

          - Flutter 3.44.7：セットアップ成功
          - macOS上のFlutterテスト：成功
          - CocoaPods依存解決：成功
          - 署名なしiOSシミュレータービルド：成功
          - Runner.app生成：成功
          - Apple署名、実機、TestFlight：未検証
          EOF

      - name: Upload iOS diagnostics and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-handover-log-v04-ios-simulator
          path: |
            ${{ runner.temp }}/logs
            ${{ runner.temp }}/release
            ${{ runner.temp }}/build/ios/Podfile.lock
            ${{ runner.temp }}/build/ios/Runner.xcworkspace
          if-no-files-found: warn

      - name: Stop when iOS validation failed
        if: steps.pubget.outcome == 'failure' || steps.test.outcome == 'failure' || steps.iosbuild.outcome == 'failure'
        run: exit 1
