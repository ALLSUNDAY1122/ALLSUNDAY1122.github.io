name: APP2-006 HM2 App Review Submission

on:
  push:
    branches: [main]
    paths:
      - automation/app2-006-hm2-submit-command.json

permissions:
  contents: write

concurrency:
  group: app2-006-hm2-submit-review
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Audit canonical release registry
        run: python3 scripts/app_release_registry_audit.py

      - name: Require explicit approval for exact current target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cmd=json.loads(Path('automation/app2-006-hm2-submit-command.json').read_text(encoding='utf-8'))
          if cmd.get('approved_by_user') is not True:
              raise SystemExit('HUMAN_GATE: approved_by_user must be true')
          if cmd.get('action') != 'submit_hm2_build22_for_review':
              raise SystemExit('HUMAN_GATE: unexpected submit action')
          expected={
              'app_id':'6799751657',
              'bundle_id':'jp.allsunday1122.healthmanager2',
              'build':'22',
              'build_id':'d97f10a1-dcce-40ed-be25-5e0a6563d7aa',
          }
          for key,value in expected.items():
              if str(cmd.get(key)) != value:
                  raise SystemExit(f'HUMAN_GATE: {key} mismatch: {cmd.get(key)} != {value}')
          print('PASS: explicit HM2 approval packet matches exact App ID / Bundle ID / Build 22.')
          PY

      - name: Validate canonical screenshot set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          root=Path('automation/release-assets/hm2')
          expected=[root/'01-home.png',root/'02-premium.png']
          manifest_path=root/'manifest.json'
          if not manifest_path.is_file():
              raise SystemExit('Canonical HM2 screenshot manifest missing. Run HM2 Review Screenshot first.')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('canonical') is not True:
              raise SystemExit('HM2 screenshot manifest is not canonical')
          manifest_files={x.get('name'):x for x in manifest.get('files',[]) if isinstance(x,dict)}
          for p in expected:
              if not p.is_file():
                  raise SystemExit(f'Canonical screenshot missing: {p}')
              raw=p.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Not PNG: {p}')
              size=struct.unpack('>II',raw[16:24])
              if size != (1260,2736):
                  raise SystemExit(f'Unexpected screenshot size {p.name}: {size}')
              sha=hashlib.sha256(raw).hexdigest()
              if (manifest_files.get(p.name) or {}).get('sha256') != sha:
                  raise SystemExit(f'Canonical screenshot hash mismatch: {p.name}')
              print(f'PASS {p.name}: {size[0]}x{size[1]} sha256={sha}')
          PY

      - name: Re-assert all machine-fixable App Store prerequisites
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/hm2_configure_standard_iap_prices.py
          python scripts/hm2_configure_iap_metadata.py
          python scripts/hm2_fill_review_contact_from_donor.py
          python scripts/hm2_fix_submission_prereqs.py \
            --source-screen automation/release-assets/hm2/01-home.png \
            --output /tmp/hm2-submission-prereqs.json

      - name: Submit Build 22 with monthly and lifetime products
        id: submit
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/app2_006_hm2_submit_review.py \
            --screens automation/release-assets/hm2 \
            --output /tmp/app2-006-hm2-submit-result.json \
            2>&1 | tee /tmp/app2-006-hm2-submit.log

      - name: Persist submission evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/asc-results
          if [ -f /tmp/app2-006-hm2-submit-result.json ]; then
            cp /tmp/app2-006-hm2-submit-result.json automation/asc-results/app2-006-hm2-submit-result.json
          else
            python - <<'PY'
          import json
          from pathlib import Path
          log=Path('/tmp/app2-006-hm2-submit.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/app2-006-hm2-submit.log').exists() else 'submission script did not run'
          prereq=Path('/tmp/hm2-submission-prereqs.json').read_text(encoding='utf-8',errors='replace') if Path('/tmp/hm2-submission-prereqs.json').exists() else ''
          Path('automation/asc-results/app2-006-hm2-submit-result.json').write_text(json.dumps({'task_id':'APP2-006','submitted':False,'error':(prereq+'\n'+log)[-6000:]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/asc-results/app2-006-hm2-submit-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist APP2-006 App Review submission evidence"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Enforce successful App Store Connect read-back
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/asc-results/app2-006-hm2-submit-result.json')
          if not p.exists():
              raise SystemExit('submission result missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          if not data.get('submitted'):
              raise SystemExit('APP2-006 submission did not complete: '+str(data.get('error')))
          state=str(data.get('review_submission_state'))
          if state not in {'WAITING_FOR_REVIEW','IN_REVIEW','COMPLETING'}:
              raise SystemExit('Unexpected submission state: '+state)
          print('PASS: APP2-006 submitted state='+state)
          PY
