name: Registered Seller 2022-2025 Official PDF Extraction
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/extract_year.py'
      - 'touroku-hanbaisha-sprint/official-kansai/build_year_app_candidate.py'
      - '.github/workflows/touhan-2022-2025-extract.yml'
permissions:
  contents: write
concurrency:
  group: touhan-2022-2025
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.5'
      - name: Extract 4 years
        run: |
          set -euo pipefail
          for y in 2022 2023 2024 2025; do
            EXAM_YEAR="$y" python touroku-hanbaisha-sprint/official-kansai/extract_year.py
            EXAM_YEAR="$y" python touroku-hanbaisha-sprint/official-kansai/build_year_app_candidate.py
          done
      - name: Verify structure, answer index, and Q90
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          for y in range(2022,2026):
            d=json.loads((b/f'QUESTIONS_{y}_APP_CANDIDATE.json').read_text())
            raw=json.loads((b/f'QUESTIONS_{y}_RAW_STAGING.json').read_text())
            keys=json.loads((b/f'ANSWERS_{y}_OFFICIAL.json').read_text())['questions']
            hashes=json.loads((b/f'PDF_SHA256_{y}.json').read_text())
            qs=d['questions']
            assert len(qs)==len(raw['questions'])==len(keys)==120
            assert [q['questionNo'] for q in qs]==list(range(1,121))
            assert len(hashes)==2 and all(len(f['sha256'])==64 for f in hashes)
            for q,k in zip(qs,keys):
              assert q['questionNo']==k['question_no']
              assert q['answerNumberOfficial']==k['official_answer']
              assert (q['choices'] is None or len(q['choices']) in (4,5)) and q['needsVisualReview'] and not q['renderReady']
              if y==2023 and q['questionNo']==90:
                assert q['answer'] is None and q['excludeFromAccuracyDenominator']
              else:
                assert q['answer']==k['official_answer']-1 and not q['excludeFromAccuracyDenominator']
            print(y,'120/120 candidates and answers PASS',*[h['sha256'] for h in hashes])
          PY
      - name: Commit staging JSON and hashes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for y in 2022 2023 2024 2025; do
            git add "touroku-hanbaisha-sprint/official-kansai/QUESTIONS_${y}_RAW_STAGING.json" "touroku-hanbaisha-sprint/official-kansai/QUESTIONS_${y}_APP_CANDIDATE.json" "touroku-hanbaisha-sprint/official-kansai/PDF_SHA256_${y}.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data(touhan): extract 2022-2025 480 official question candidates and hashes'
            git push
          fi
