name: Temporary Sync Central And Queue 257

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-central-257.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central state and release queue
        run: |
          set -euxo pipefail
          git fetch origin main region/central

          git checkout -B central-state origin/region/central
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/regions/central.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt']='2026-07-22T04:55:00+09:00'
          data['status']='working'
          data['completedSinceLastRelease']=7
          completed=data.setdefault('completedMunicipalities',[])
          if '22206' not in completed: completed.append('22206')
          data['regionalQueue']=['22207']
          audit=data.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '22206' not in checked: checked.append('22206')
          checks=audit.setdefault('checks',[])
          line='三島市をPR #455・CI run #969で地方統合'
          if line not in checks: checks.append(line)
          data['lastAction']='全国統合PR #437・生成更新PR #439で公開234自治体へ同期後、東白川村（21507）、御嵩町（21521）、静岡市（22100）、浜松市（22130）、沼津市（22203）、熱海市（22205）、三島市（22206）をregion/centralへ地方統合し、各taskをmergedへ更新'
          data['nextAction']='富士宮市（22207）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/regions/central.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 中日本を三島市まで7自治体へ更新'
          git push origin HEAD:region/central

          git checkout -B main-state origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          for entry in data['entries']:
              if entry['region']=='central':
                  if not any(m['code']=='22206' for m in entry['municipalities']):
                      entry['municipalities'].append({'code':'22206','name':'三島市'})
                  entry['municipalities'].sort(key=lambda x:x['code'])
                  entry['pendingSinceLastRelease']=7
                  entry['reason']='揖斐川町から白川町までの追加10自治体をPR #437でmainへ統合し、PR #439で公開234自治体へ更新。その後、東白川村・御嵩町・静岡市・浜松市・沼津市・熱海市・三島市を地方統合'
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
          data['updatedAt']='2026-07-22T04:55:00+09:00'
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[]
          s['auditBlockedRegions']=[]
          s['latestGeneratedMunicipalityCount']=234
          s['latestGeneratedPullRequest']=439
          s['latestPublicCountPullRequest']=439
          if s['regionalMergedMunicipalities'] != 257:
              raise SystemExit(f"expected 257, got {s['regionalMergedMunicipalities']}")
          data['nextAction']='北日本・中日本が7自治体、東日本6自治体、西日本4自治体。各地域をコード昇順で継続する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-central-257.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-central-257.yml
          git commit -m '統括管理: 地方統合257自治体・公開234自治体へ同期'
          git push origin main
