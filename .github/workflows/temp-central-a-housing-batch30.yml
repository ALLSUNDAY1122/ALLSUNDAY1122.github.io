name: Temporary Central A Housing Batch 30

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch30-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch30-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 30
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T17:43:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions=[
            {code:'24472',name:'南伊勢町',type:'child_household_age_exception_clarified',status:'verified',summary:'45歳以下、または18歳以下の子を監護する2親等以内の親族が町内で定住用住宅を取得する場合、新築200万円・中古50万円を交付する。',source:'https://www.town.minamiise.lg.jp/admin/shoshiki/machizukuri/ijuuteijuu/1472.html',basis:'46歳以上でも18歳以下の子を監護する2親等以内の親族は年齢要件の例外となる現行条件を確認'},
            {code:'27301',name:'島本町',type:'general_seismic_support_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.shimamoto.lg.jp/soshiki/14/2662.html',basis:'令和8年度の現行制度は旧耐震住宅等の耐震診断・設計・改修・除却を対象とする一般耐震支援で、子育て等を対象要件としない'},
            {code:'28207',name:'伊丹市',type:'general_seismic_support_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.itami.lg.jp/SOSIKI/TOSHIKATSURYOKU/KENTIKUSIDO/JUTAKU_TAISINKA/1569552891805.html',basis:'令和8年度の現行制度は旧耐震住宅の建替え・除却・耐震改修等を対象とする一般耐震支援で、子育て等を対象要件としない'},
            {code:'28216',name:'高砂市',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住宅取得・賃借・リフォーム・引越費用を最大60万円補助する。',source:'https://www.city.takasago.lg.jp/gyoseisite/raifushin/hikkoshi_sumai/8835.html',basis:'令和8年度の結婚新生活支援補助金について、対象婚姻期間・夫婦年齢・対象費用・最大60万円を確認'},
            {code:'21217',name:'飛騨市',type:'general_home_acquisition_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.hida.gifu.jp/soshiki/23/80985.html',basis:'令和8年度住宅新築・購入支援は定住住宅取得・転入・ZEH等を対象とする一般制度で、子育て等を対象要件とせず、令和8年度完成分は受付終了'}
          ];

          function writePreservingStyle(file,obj){
            const raw=fs.readFileSync(file,'utf8');
            const pretty=raw.startsWith('{\n');
            fs.writeFileSync(file,JSON.stringify(obj,null,pretty?2:0)+'\n');
          }

          const reviewed=[];
          for(const decision of decisions){
            const pref=decision.code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${decision.code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${decision.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const svc=municipality.services?.housingSupport;
            if(!svc)throw new Error(`${decision.code}: missing housingSupport`);
            const before={status:svc.status,summary:svc.summary,source:svc.source?.url};
            svc.status=decision.status;
            svc.summary=decision.summary;
            svc.source={url:decision.source,checkedAt};
            if(decision.code==='24472'){
              svc.details.program='新築及び中古住宅取得支援補助金';
              svc.details.newHousing='200万円';
              svc.details.usedHousing='50万円';
              svc.details.ageCondition='原則18歳以上45歳以下。46歳以上でも18歳以下の子を監護する2親等以内の親族は年齢要件の例外';
              svc.details.residency='取得した町内住宅に10年以上定住すること';
            }
            if(decision.code==='27301'){
              svc.details={
                reviewedProgram:'建物の耐震改修等補助',
                generalSupport:'昭和56年5月31日以前に建築された住宅等の耐震診断・設計・改修・除却費を補助',
                classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般耐震支援のため、子育て住宅支援としては対象外'
              };
            }
            if(decision.code==='28207'){
              svc.details={
                reviewedProgram:'伊丹市住宅耐震化促進事業',
                generalSupport:'昭和56年5月31日以前に着工し耐震性が低い住宅の建替え・除却・耐震改修等を工事種類別に補助',
                classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般耐震支援のため、子育て住宅支援としては対象外'
              };
            }
            if(decision.code==='28216'){
              svc.details={
                program:'高砂市結婚新生活支援補助金',
                eligibleMarriage:'令和8年1月1日から令和9年3月31日までに婚姻した夫婦',
                ageCondition:'婚姻日の年齢が夫婦とも39歳以下',
                incomeCondition:'夫婦の令和7年中の所得合計額が500万円未満等',
                coveredCosts:'住宅購入、リフォーム、賃借、引越費用',
                maximum:'夫婦とも29歳以下は最大60万円、その他の39歳以下は最大30万円',
                application:'令和8年6月1日から令和9年3月31日まで。予算到達時は変更の場合あり'
              };
            }
            if(decision.code==='21217'){
              svc.details={
                reviewedProgram:'令和8年度飛騨市住宅新築・購入支援助成金',
                generalSupport:'市内定住用住宅の新築・購入に基本10万～30万円、転入・市内施工・ZEH・住宅改修等の加算を設定',
                currentStatus:'令和8年度内完成分は予算上限到達で受付終了。令和9年度完成分の計画承認は受付中',
                classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般定住・住宅取得制度のため、子育て住宅支援としては対象外'
              };
            }
            municipality.updatedAt=checkedAt;
            writePreservingStyle(dataPath,municipality);

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第30群で公式利用者向けページを独立確認し、${decision.type}として判定。`];
            task.blockers=task.blockers||[];
            writePreservingStyle(taskPath,task);

            reviewed.push({code:decision.code,name:decision.name,service:'housingSupport',correctionType:decision.type,beforeStatus:before.status,afterStatus:decision.status,beforeSummary:before.summary,afterSummary:decision.summary,officialSource:decision.source,officialBasis:decision.basis,contentChanged:before.status!==decision.status||before.summary!==decision.summary||before.source!==decision.source});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch30-decisions-20260726',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:5,
            statusToUnavailableCount:3,
            verifiedReplacementOrClarificationCount:2,
            verifiedMaintainedCount:0,
            reviewed,
            causeScan:{previousRemainingCandidates:29,reviewedHighRiskCandidates:5,remainingCandidates:24},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般耐震・定住住宅取得制度は子育て等の対象要件がなければ子育て住宅支援に分類しない',
              '18歳以下の子を監護する世帯に適用される年齢要件例外は子育て世帯向け住宅支援として明記する',
              '結婚新生活支援は新婚世帯向け住宅支援としてverified対象に含める'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch30-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残24件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=204;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=636;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=24;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残24件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:30,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:3,verifiedReplacementOrClarificationCount:2,verifiedMaintainedCount:0,remainingCandidates:24,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第30群として、島本町・伊丹市・飛騨市をunavailableへ修正し、高砂市を結婚新生活支援へ差し替え、南伊勢町の子育て世帯年齢例外を明確化した。';
          writePreservingStyle(checkpointPath,checkpoint);

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          writePreservingStyle(regionPath,region);

          const trigger=path.join(root,'operations/control/central-a-housing-batch30-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/24/24472.json|jichitai-compare/data/municipalities/27/27301.json|jichitai-compare/data/municipalities/28/28207.json|jichitai-compare/data/municipalities/28/28216.json|jichitai-compare/data/municipalities/21/21217.json|jichitai-compare/operations/tasks/24472.json|jichitai-compare/operations/tasks/27301.json|jichitai-compare/operations/tasks/28207.json|jichitai-compare/operations/tasks/28216.json|jichitai-compare/operations/tasks/21217.json|jichitai-compare/operations/audits/central-a-housing-classification-batch30-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/24472/index.html|jichitai-compare/municipality/27301/index.html|jichitai-compare/municipality/28207/index.html|jichitai-compare/municipality/28216/index.html|jichitai-compare/municipality/21217/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch30-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第30群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
