name: Temporary Central A Weak Source Batch 5

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch5-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch5-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weak primary source batch 5
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T22:41:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const readJson=p=>{const raw=fs.readFileSync(p,'utf8');return{raw,obj:JSON.parse(raw)}};
          const writeJson=(p,raw,obj)=>fs.writeFileSync(p,(raw.startsWith('{\n')?JSON.stringify(obj,null,2):JSON.stringify(obj))+'\n');
          const addSource=(svc,entry)=>{const list=Array.isArray(svc.additionalSources)?svc.additionalSources:[];const i=list.findIndex(x=>x.url===entry.url);if(i>=0)list[i]={...list[i],...entry};else list.push(entry);svc.additionalSources=list;};
          const decisions=[
            {code:'25442',pref:'25',name:'甲良町',service:'postpartumCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00000927.html',newUrl:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00000927.html',basis:'出産後1年未満、宿泊・通所型、利用上限、料金、申請条件を現行要綱で確認し、伴走型相談支援と町子育て計画の導線を追加'},
            {code:'27219',pref:'27',name:'和泉市',service:'schoolMeals',outcome:'primary_source_replaced_with_direct_budget_document',previousUrl:'https://www.city.osaka-izumi.lg.jp/kakukano/soumubu/zaiseika/gyoumu/yosan.html',newUrl:'https://www.city.osaka-izumi.lg.jp/material/files/group/18/00_08_gaiyou.pdf',basis:'令和8年度予算概要で小学校給食無償化、中学校給食の値上げ分補助、事業費5億9,800万円を直接確認'},
            {code:'27225',pref:'27',name:'高石市',service:'schoolMeals',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.city.takaishi.lg.jp/section/reiki_int/reiki_honbun/k227RG00000831.html',newUrl:'https://www.city.takaishi.lg.jp/section/reiki_int/reiki_honbun/k227RG00000831.html',basis:'令和8年度分から当分の間、保護者から学校給食費を徴収しない現行規則を維持し、令和8年度献立ページを確認'},
            {code:'27225',pref:'27',name:'高石市',service:'housingSupport',outcome:'direct_user_page_maintained',previousUrl:'https://www.city.takaishi.lg.jp/kakuka/doboku/toshikeikaku_ka/jutaku/akiya/5306.html',newUrl:'https://www.city.takaishi.lg.jp/kakuka/doboku/toshikeikaku_ka/jutaku/akiya/5306.html',basis:'18歳未満の子を扶養・同居する世帯または39歳以下の若年世帯に空き家購入費の2分の1・上限200万円を補助する現行直接案内を確認'},
            {code:'27226',pref:'27',name:'藤井寺市',service:'schoolMeals',outcome:'direct_user_page_maintained',previousUrl:'https://www.city.fujiidera.lg.jp/soshiki/seisakukikaku/seisakusuishin/shisakukeikaku/kakusyukeikaku/20576.html',newUrl:'https://www.city.fujiidera.lg.jp/soshiki/seisakukikaku/seisakusuishin/shisakukeikaku/kakusyukeikaku/20576.html',basis:'令和8年度年間を通じて小学校給食を全額無償化し、中学校は令和6年度以降の値上げ分を助成する現行直接案内を確認'}
          ];
          const grouped=new Map();for(const d of decisions){if(!grouped.has(d.code))grouped.set(d.code,[]);grouped.get(d.code).push(d);}
          for(const [code,items] of grouped){
            const municipalityPath=path.join(root,'data/municipalities',items[0].pref,`${code}.json`);
            const {raw,obj:m}=readJson(municipalityPath);
            for(const d of items){
              const svc=m.services[d.service];if(!svc)throw new Error(`${d.code}:${d.service} missing`);
              if(d.code==='25442'){
                svc.source.checkedAt=checkedAt;
                svc.details.userFacingNote='産後ケア専用の利用者向け申請ページは確認できないため、妊娠期・出生後の面談時または保健福祉課へ利用希望を相談する。';
                addSource(svc,{url:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001160.html',checkedAt,description:'妊娠期・出生後の伴走型相談支援で産後ケア等の必要な支援サービスを案内する町要綱'});
                addSource(svc,{url:'https://www.kouratown.jp/gyosei/sogokakusyukeikau/2723.html',checkedAt,description:'妊娠から出産・子育てまで切れ目ない支援を推進する第3期子ども・子育て支援事業計画'});
              }else if(d.code==='27219'){
                svc.source={url:d.newUrl,checkedAt};
                svc.additionalSources=(svc.additionalSources??[]).filter(x=>x.url!==d.newUrl);
                addSource(svc,{url:'https://www.city.osaka-izumi.lg.jp/kakukano/soumubu/zaiseika/gyoumu/yosan.html',checkedAt,description:'令和8年度当初予算資料の公式入口'});
                addSource(svc,{url:'https://www.city.osaka-izumi.lg.jp/kakukano/kyouikubu/gakkoenkanri/gakkoukyuusyoku/gakkoukyuusyokukonndate/izumi_kondate.html',checkedAt,description:'令和8年度の市内統一献立・食育資料・使用物資成分配合表'});
                addSource(svc,{url:'https://www.city.osaka-izumi.lg.jp/material/files/group/74/20260416-2.pdf',checkedAt,description:'小学校給食費無償化の市独自追加支援を説明する教育委員会議案資料'});
              }else if(d.code==='27225'&&d.service==='schoolMeals'){
                svc.source.checkedAt=checkedAt;
                svc.details.currentOperation='令和8年度1学期の小中学校給食献立・給食だよりが継続公開されていることを確認。';
                addSource(svc,{url:'https://www.city.takaishi.lg.jp/kakuka/kyouiku/kyouiku_soumu/gakkoukyuushoku/5462.html',checkedAt,description:'令和8年度1学期の市立小中学校給食献立・給食だより'});
              }else if(d.code==='27225'&&d.service==='housingSupport'){
                svc.source.checkedAt=checkedAt;
                addSource(svc,{url:'https://www.city.takaishi.lg.jp/kakuka/doboku/toshikeikaku_ka/jutaku/akiya/5310.html',checkedAt,description:'令和8年度の子育て・若年世帯向け空き家支援拡充案内'});
              }else if(d.code==='27226'){
                svc.source.checkedAt=checkedAt;
                addSource(svc,{url:'https://www.city.fujiidera.lg.jp/soshiki/seisakukikaku/seisakusuishin/yokosofujiiderashihe/shinohoushin/10210.html',checkedAt,description:'令和8年度市政運営方針における小学校給食無償化・中学校値上げ分助成の説明'});
                addSource(svc,{url:'https://www.city.fujiidera.lg.jp/soshiki/kyoikuiinkai/kyoikusomu/kyoikubunkasupotsu/20556.html',checkedAt,description:'令和8年度就学援助制度の学校給食費支援案内'});
              }
            }
            m.updatedAt=checkedAt;writeJson(municipalityPath,raw,m);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);const {raw:taskRaw,obj:task}=readJson(taskPath);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='中日本調査班A';task.status='merged';task.completedServices=keys;
            task.verifiedCount=keys.filter(k=>m.services[k]?.status==='verified').length;task.researchingCount=keys.filter(k=>m.services[k]?.status==='researching').length;task.unavailableCount=keys.filter(k=>m.services[k]?.status==='unavailable').length;task.needsMediumReviewCount=keys.filter(k=>m.services[k]?.status==='needs_medium_review').length;
            task.officialSources=[...new Set(keys.map(k=>m.services[k]?.source?.url).filter(Boolean))];task.notes=Array.isArray(task.notes)?task.notes:[];
            for(const d of items){const note=`2026-07-26 弱い主出典第5群: ${d.service}を${d.outcome}として再確認。${d.basis}`;if(!task.notes.includes(note))task.notes.push(note);}
            task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);
          }
          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));const done=new Set(decisions.map(d=>`${d.code}:${d.service}`));recovery.queue=(recovery.queue??[]).filter(x=>!done.has(`${x.code}:${x.service}`));recovery.queueCount=recovery.queue.length;recovery.nextBatch=recovery.queue.slice(0,5);recovery.status='active_queue_batch5_applied';recovery.lastAppliedBatch=5;recovery.lastAppliedAt=updatedAt;fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          const decision={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch5-decisions-20260726',session:'中日本調査班A',coordinatorSession:'統括B',checkedAt,updatedAt,category:'weakPrimarySource',reviewedMunicipalityCount:4,reviewedServiceCount:5,confirmedSourceUpgradeCount:1,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:2,contentCorrectionCount:0,remainingCandidates:8,decisions,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'regional_changes_validated',blocker:null};fs.writeFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch5-decisions-20260726.json'),JSON.stringify(decision,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));checkpoint.updatedAt=updatedAt;checkpoint.status='completed';checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.nextAction='弱い主出典残8件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';const q=checkpoint.qualityReaudit;q.latestCompletedAt=updatedAt;q.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);q.latestCiRunNumber=Number(process.env.RUN_ID);q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??248),252);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??683),688);q.candidateCounts.weakPrimarySource=8;q.latestWeakSourceBatch={batch:5,status:'regional_changes_validated',reviewedMunicipalityCount:4,reviewedServiceCount:5,confirmedSourceUpgradeCount:1,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:2,contentCorrectionCount:0,remainingCandidates:8,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};q.confirmedCorrections=Array.isArray(q.confirmedCorrections)?q.confirmedCorrections:[];for(const d of decisions)if(!q.confirmedCorrections.some(x=>x.type==='weak_primary_source_resolved'&&String(x.code)===d.code&&x.service===d.service))q.confirmedCorrections.push({type:'weak_primary_source_resolved',code:d.code,service:d.service,name:d.name,outcome:d.outcome});checkpoint.lastAction='弱い主出典第5群5制度を公式情報で再確認し、和泉市学校給食を令和8年度予算概要へ主出典更新し、残る4制度の現行根拠を補強した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch5-trigger-20260726.json
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第5群を改善'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
