name: Revert Incomplete National Release 2752

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  revert:
    if: github.head_ref == 'coord/revert-incomplete-national-release-2752' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/revert-incomplete-national-release-2752
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revert PR 2752 merge commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert -m 1 --no-commit 9abf866ec450ccdd449d84d183b4d30ac479f08e

      - name: Regenerate and validate publication gate
        working-directory: jichitai-compare
        run: |
          set -euo pipefail
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          const failures = [];
          if (progress.needsMediumReviewServices !== 0) failures.push(`needs_medium_review=${progress.needsMediumReviewServices}`);
          if (progress.needsRevisionServices !== 0) failures.push(`needs_revision=${progress.needsRevisionServices}`);
          if (progress.needsCoordinatorServices !== 0) failures.push(`needs_coordinator=${progress.needsCoordinatorServices}`);
          if (progress.blockedMunicipalities !== 0) failures.push(`blockedMunicipalities=${progress.blockedMunicipalities}`);
          if ((progress.assignmentSummary?.blocked ?? 0) !== 0) failures.push(`assignmentBlocked=${progress.assignmentSummary.blocked}`);
          if (progress.completedServices !== progress.registeredMunicipalities * 9) failures.push(`completedServices=${progress.completedServices}/${progress.registeredMunicipalities * 9}`);
          if (failures.length) throw new Error(`公開ゲート違反: ${failures.join(', ')}`);
          console.log(`公開ゲート成功: ${progress.registeredMunicipalities}自治体・${progress.completedServices}制度`);
          NODE

      - name: Remove temporary workflow and push revert
        run: |
          set -euo pipefail
          git rm .github/workflows/revert-incomplete-national-release-2752.yml
          git add -A
          git commit -m 'revert: remove incomplete municipalities from national publication'
          git push origin HEAD:coord/revert-incomplete-national-release-2752
