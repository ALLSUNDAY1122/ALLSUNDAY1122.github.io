name: Temporary Reconcile Progress Status V2 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-reconcile-progress-status-v2.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconcile merged task statuses and progress logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import glob, json, os, subprocess
          from pathlib import Path

          changed=[]
          unresolved=[]
          for filename in glob.glob('jichitai-compare/operations/tasks/*.json'):
              path=Path(filename)
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('status') != 'pr_open':
                  continue
              pr=data.get('pullRequestNumber')
              if not isinstance(pr,int) or pr <= 0:
                  unresolved.append((path.name,'PR番号なし'))
                  continue
              raw=subprocess.check_output([
                  'gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{pr}',
                  '--jq','[.state,.merged_at] | @tsv'
              ],text=True).strip()
              state,merged_at=(raw.split('\t',1)+[''])[:2]
              if merged_at and merged_at != 'null':
                  data['status']='merged'
                  data['lastUpdatedAt']='2026-07-22T05:06:00+09:00'
                  data['lastUpdatedBy']='全国進行統括'
                  notes=data.setdefault('notes',[])
                  note=f'PR #{pr}のmerged_atをGitHub APIで再確認し、task.statusをmergedへ補正。'
                  if note not in notes:
                      notes.append(note)
                  path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  changed.append((path.name,pr))
              else:
                  unresolved.append((path.name,f'PR #{pr} state={state}'))
          print('changed=',changed)
          print('unresolved=',unresolved)

          script=Path('jichitai-compare/scripts/update-progress.mjs')
          text=script.read_text(encoding='utf-8')
          old="""  if (Number.isInteger(task.pullRequestNumber) && task.pullRequestNumber > 0) return 'pr_open';\n  if (typeof task.currentBranch === 'string' && task.currentBranch.trim()) return 'assigned';"""
          new="""  if (task.status === 'pr_open') return 'pr_open';\n  if (typeof task.currentBranch === 'string' && task.currentBranch.trim()) return 'assigned';"""
          if old not in text:
              raise SystemExit('assignmentState target not found')
          script.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

          cd jichitai-compare
          npm ci
          npm run progress
          cd ..

          rm .github/workflows/temp-reconcile-progress-status-v2.yml
          git add jichitai-compare/operations/tasks jichitai-compare/scripts/update-progress.mjs jichitai-compare/operations/progress.json .github/workflows/temp-reconcile-progress-status-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: マージ済みtask状態と進捗集計を補正'
          git push origin main
