name: Temporary Final Dynamic Sync 1216

on:
  push:
    branches: [main]
    paths:
      - .github/temp-final-sync-trigger-1216.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue dynamically
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(path.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,p): return subprocess.check_output(['git','show',f'{ref}:{p}'],text=True)
          def belongs(r,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          for r in ('north','east','central','west'):
              ref=f'origin/region/{r}'
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              items=[]
              for p in names:
                  if not re.search(r'/\d{5}\.json$',p): continue
                  d=json.loads(show(ref,p))
                  if belongs(r,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json'))
              pending=int(state.get(fields[r],0)); e=by[r]
              e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':pending,'releaseStatus':'release_ready' if pending>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体','mainIntegrationPr':state.get('lastNationalIntegrationPr'),'generatedPullRequest':606,'auditStatus':'passed'})
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T12:16:00+09:00'; q['status']='active'
          q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':364,'latestGeneratedPullRequest':606,'latestPublicCountPullRequest':606,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"}
          path.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('total',total,'pending',pending)
          PY
          rm .github/workflows/temp-final-sync-364-1207.yml .github/temp-final-sync-trigger-1216.txt
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-final-sync-364-1207.yml .github/temp-final-sync-trigger-1216.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 最新地方統合・公開364自治体へ動的同期'
          git push origin main
