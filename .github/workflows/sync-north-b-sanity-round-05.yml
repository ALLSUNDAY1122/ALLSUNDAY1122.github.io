name: Sync North B sanity audit round 05 latest main

on:
  push:
    branches:
      - coord/sync-north-b-sanity-round-05-20260725
    paths:
      - .github/workflows/sync-north-b-sanity-round-05.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sync-north-b-sanity-round-05-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync regional data and regenerate
        shell: bash
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/04/04406.json \
            jichitai-compare/data/municipalities/04/04445.json \
            jichitai-compare/data/municipalities/04/04505.json \
            jichitai-compare/data/municipalities/04/04581.json \
            jichitai-compare/data/municipalities/05/05203.json \
            jichitai-compare/operations/tasks/04406.json \
            jichitai-compare/operations/tasks/04445.json \
            jichitai-compare/operations/tasks/04505.json \
            jichitai-compare/operations/tasks/04581.json \
            jichitai-compare/operations/tasks/05203.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          cd jichitai-compare
          npm run generate
          npm run progress
          cd ..
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.updatedAt = '2026-07-25T02:00:00+09:00';
          data.workingBranch = 'coord/sync-north-b-sanity-round-05-20260725';
          data.pullRequestNumber = 2997;
          data.ciStatus = 'pending';
          data.nextAction = '北日本B第5回の地域PR #2993・CI #7247・#7254は成功済み。最新mainへ載せ直し、利府町、加美町、美里町、女川町、横手市の自治体JSON、task、監査記録、全国生成JSON、静的ページを再同期している。監査完了5/10回、55/107自治体、残り5回・52自治体。';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          rm .github/workflows/sync-north-b-sanity-round-05.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "全国品質同期: 北日本B第5回を最新mainへ反映"
          git push origin HEAD:coord/sync-north-b-sanity-round-05-20260725