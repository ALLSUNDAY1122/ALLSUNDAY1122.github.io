name: Temporary North B Anyone Single Gap Remaining

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-remaining.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract remaining single-gap candidates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const base = 'jichitai-compare/operations/audits';
          const triage = JSON.parse(fs.readFileSync(path.join(base, 'north-b-fiscal-anyone-triage-20260725.json'), 'utf8'));
          const candidates = (triage.anyonePriorityQueue || []).filter(item => item.category === 'single_condition_gap');
          const reviewed = new Set();
          const reviewFiles = [];
          for (let batch = 1; batch <= 6; batch++) {
            const file = path.join(base, `north-b-anyone-single-gap-batch${batch}-review-20260725.json`);
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            reviewFiles.push(file.replace('jichitai-compare/', ''));
            for (const key of ['corrected', 'noChange']) {
              for (const item of audit[key] || []) reviewed.add(String(item.code));
            }
          }
          const remaining = candidates.filter(item => !reviewed.has(String(item.code)));
          const output = {
            schemaVersion: '1.0.0',
            auditId: 'north-b-anyone-single-gap-remaining-20260725',
            sessionId: 'north-b',
            extractedAt: new Date().toISOString(),
            sourceAudit: 'operations/audits/north-b-fiscal-anyone-triage-20260725.json',
            checkpointExpectedRemaining: 12,
            reviewedAuditFiles: reviewFiles,
            counts: {
              singleConditionCandidates: candidates.length,
              reviewedThroughBatch6: reviewed.size,
              remaining: remaining.length,
              checkpointDifference: remaining.length - 12
            },
            remaining: remaining.map(item => ({
              code: String(item.code),
              municipality: item.municipality,
              status: item.status,
              missing: item.missing,
              summary: item.summary,
              sourceUrls: item.sourceUrls,
              priority: item.priority,
              category: item.category
            }))
          };
          fs.writeFileSync(path.join(base, 'north-b-anyone-single-gap-remaining-20260725.json'), `${JSON.stringify(output, null, 2)}\n`);
          console.log(JSON.stringify(output.counts));
          NODE

      - name: Remove workflow and commit extraction
        shell: bash
        run: |
          rm -f .github/workflows/temp-north-b-anyone-single-gap-remaining.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-remaining.yml \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-remaining-20260725.json
          git commit -m 'audit: 北日本B誰でも通園の残候補実数を確定 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
