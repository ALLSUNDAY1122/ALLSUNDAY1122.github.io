name: Sync Kagawa Publication Final
on:
  pull_request:
    branches: [region/west]
permissions:
  contents: write
  pull-requests: read
jobs:
  sync:
    if: github.head_ref == 'fix/kagawa-publication-readiness-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kagawa-publication-readiness-final
          fetch-depth: 0
      - name: Import and finalize Kagawa files
        shell: bash
        run: |
          git fetch origin fix/kagawa-37324-37364-37403-publication
          for code in 37324 37364 37403; do
            git show origin/fix/kagawa-37324-37364-37403-publication:jichitai-compare/data/municipalities/37/${code}.json > jichitai-compare/data/municipalities/37/${code}.json
            git show origin/fix/kagawa-37324-37364-37403-publication:jichitai-compare/operations/tasks/${code}.json > jichitai-compare/operations/tasks/${code}.json
          done
          node <<'NODE'
          const fs = require('fs');
          const date = '2026-07-24';
          const branch = 'fix/kagawa-publication-readiness-final';
          const order = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const municipalityPath = 'jichitai-compare/data/municipalities/37/37403.json';
          const taskPath = 'jichitai-compare/operations/tasks/37403.json';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
          municipality.summary = '必須9制度を琴平町公式情報で調査。8制度をverified、広域利用・利用料支援は確認できるが施設別対象年齢等を確定できない病児・病後児保育をunavailableとして登録。';
          municipality.services.sickChildCare = {
            status: 'unavailable',
            summary: '中讃圏域の利用可能施設と利用料支援は確認できるが、施設別の現行対象年齢等を確定できない',
            notes: [
              '丸亀市、坂出市、善通寺市、多度津町、綾川町の病児・病後児保育施設を利用可能とする町公式案内を確認した。',
              '第2子の3歳未満児と第3子以降の就学前児童の利用料無料化、丸亀市・善通寺市・多度津町の対象施設における町内料金との差額支給を確認した。',
              '利用先施設ごとの現行対象年齢、通常料金、開所時間、受入疾患、予約締切を琴平町公式情報だけでは確定できないため、比較条件は窓口確認事項として扱う。'
            ],
            source: {
              url: 'https://www.town.kotohira.kagawa.jp/site/child/1738.html',
              checkedAt: date
            },
            additionalSources: [{
              url: 'https://www.town.kotohira.kagawa.jp/site/tyuusanteijyuu/1679.html',
              checkedAt: date
            }]
          };
          fs.writeFileSync(municipalityPath, JSON.stringify(municipality));
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          task.verifiedCount = 8;
          task.unavailableCount = 1;
          task.currentBranch = branch;
          task.pullRequestNumber = 0;
          task.lastUpdatedAt = '2026-07-24T12:00:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.notes = [...task.notes.filter((note) => !String(note).startsWith('PR #') && !String(note).includes('verifiedとした')), '病児・病後児保育は広域利用・利用料支援を確認したが、施設別対象年齢等を確定できないためunavailableとした。'];
          task.blockers = [];
          const sources = [];
          for (const id of order) {
            const url = municipality.services[id].source.url;
            if (!sources.includes(url)) sources.push(url);
          }
          task.officialSources = sources;
          fs.writeFileSync(taskPath, JSON.stringify(task));
          for (const code of ['37324','37364']) {
            const p = `jichitai-compare/operations/tasks/${code}.json`;
            const t = JSON.parse(fs.readFileSync(p, 'utf8'));
            t.currentBranch = branch;
            t.pullRequestNumber = 0;
            t.lastUpdatedAt = '2026-07-24T12:00:00+09:00';
            t.lastUpdatedBy = '統括B';
            fs.writeFileSync(p, JSON.stringify(t));
          }
          NODE
          rm -f .github/workflows/sync-kagawa-publication-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/37/37324.json jichitai-compare/operations/tasks/37324.json jichitai-compare/data/municipalities/37/37364.json jichitai-compare/operations/tasks/37364.json jichitai-compare/data/municipalities/37/37403.json jichitai-compare/operations/tasks/37403.json .github/workflows/sync-kagawa-publication-final.yml
          git commit -m 'fix: 香川県3自治体を公開可能状態へクリーン同期'
          git push origin HEAD:fix/kagawa-publication-readiness-final
