name: Sync North B sanity audit round 04

on:
  push:
    branches:
      - coord/sync-north-b-sanity-round-04-20260725
    paths:
      - .github/workflows/sync-north-b-sanity-round-04.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: coord/sync-north-b-sanity-round-04-20260725
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync regional audit and regenerate public files
        shell: bash
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/04/04323.json \
            jichitai-compare/data/municipalities/04/04401.json \
            jichitai-compare/operations/tasks/04323.json \
            jichitai-compare/operations/tasks/04401.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          cd jichitai-compare
          npm run generate
          npm run progress
          cd ..
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.updatedAt = '2026-07-25T01:17:00+09:00';
          data.workingBranch = 'coord/sync-north-b-sanity-round-04-20260725';
          data.pullRequestNumber = 2969;
          data.ciStatus = 'pending';
          data.nextAction = '北日本B誤調査ざっくり再検証第4回の地域修正はPR #2958・CI #7160成功でregion/northへ統合済み。最新mainへ載せ直した全国同期PR #2969で柴田町・松島町の自治体JSON、task、監査記録、全国生成JSON、静的ページを更新し、通常CIを確認する。監査完了4/10回、44/107自治体、残り6回・63自治体。';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          rm .github/workflows/sync-north-b-sanity-round-04.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "全国品質同期: 北日本B誤調査再検証 第4回を最新mainへ反映"
          git push origin HEAD:coord/sync-north-b-sanity-round-04-20260725