name: Temporary West Four Final Public Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'audit/west-four-final-public-verify-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify GitHub Pages deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path('jichitai-compare/operations/audits/west-four-final-public-verification-20260725.json')
          if output.exists():
              print('Verification evidence already exists.')
              raise SystemExit(0)

          base = 'https://allsunday1122.github.io/jichitai-compare'
          page_expectations = {
              '43443': {
                  'required': ['益城町', '粗大ごみ区分と自己搬入案内は確認できるが、現行の戸別収集料金・寸法上限を確定できない', '公式情報で詳細未確認'],
                  'forbidden': ['1品目500円', '3辺合計400cm未満'],
              },
              '45402': {
                  'required': ['新富町', '18歳到達後最初の年度末まで入院・外来・調剤の保険診療自己負担なし', 'https://www.town.shintomi.lg.jp/item/1600.htm'],
                  'forbidden': [],
              },
              '46533': {
                  'required': ['和泊町', '10kg当たり75円', 'https://www.okieikumiai.com/cleancenter'],
                  'forbidden': ['10kg当たり100円'],
              },
              '31384': {
                  'required': ['日吉津村', '津波・洪水・土砂災害と避難場所を掲載したWeb・PDFハザードマップ、地域防災計画を公開'],
                  'forbidden': ['https://www.hiezu.jp/list/soumu/y121/u509/e970/'],
              },
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 municipality-quality-audit'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.geturl(), response.read().decode('utf-8', errors='replace')

          def inspect_once(attempt):
              cache = int(time.time())
              result = {
                  'schemaVersion': '1.0.0',
                  'auditId': 'west-four-final-public-verification-20260725',
                  'generatedAt': datetime.now(timezone.utc).isoformat(),
                  'attempt': attempt,
                  'pages': {},
                  'generatedJson': {},
                  'success': False,
                  'errors': [],
              }
              for code, expected in page_expectations.items():
                  url = f'{base}/municipality/{code}/?audit={cache}'
                  try:
                      status, final_url, text = fetch(url)
                      missing = [token for token in expected['required'] if token not in text]
                      forbidden = [token for token in expected['forbidden'] if token in text]
                      page_ok = status == 200 and not missing and not forbidden
                      result['pages'][code] = {
                          'url': url,
                          'status': status,
                          'finalUrl': final_url,
                          'requiredTokensPresent': not missing,
                          'missingTokens': missing,
                          'forbiddenTokensPresent': forbidden,
                          'success': page_ok,
                      }
                      if not page_ok:
                          result['errors'].append(f'{code}: public page mismatch')
                  except Exception as exc:
                      result['pages'][code] = {'url': url, 'success': False, 'error': repr(exc)}
                      result['errors'].append(f'{code}: {exc!r}')

              generated_url = f'{base}/data/generated/municipalities.json?audit={cache}'
              try:
                  status, final_url, text = fetch(generated_url)
                  data = json.loads(text)
                  municipalities = data.get('municipalities', [])
                  by_code = {item.get('code'): item for item in municipalities}
                  service_count = sum(len(item.get('services', {})) for item in municipalities)
                  checks = {
                      'http200': status == 200,
                      'municipalityCount1741': len(municipalities) == 1741,
                      'serviceCount15669': service_count == 15669,
                      '43443Unavailable': by_code.get('43443', {}).get('services', {}).get('bulkyWaste', {}).get('status') == 'unavailable',
                      '45402DirectSource': by_code.get('45402', {}).get('services', {}).get('childMedical', {}).get('source', {}).get('url') == 'https://www.town.shintomi.lg.jp/item/1600.htm',
                      '46533Fee75': '75円' in by_code.get('46533', {}).get('services', {}).get('bulkyWaste', {}).get('summary', ''),
                      '31384CurrentHazardSource': 'list/soumu/y121/u509/e970' not in by_code.get('31384', {}).get('services', {}).get('disasterPrevention', {}).get('source', {}).get('url', ''),
                  }
                  result['generatedJson'] = {
                      'url': generated_url,
                      'status': status,
                      'finalUrl': final_url,
                      'municipalityCount': len(municipalities),
                      'serviceCount': service_count,
                      'checks': checks,
                      'success': all(checks.values()),
                  }
                  if not all(checks.values()):
                      result['errors'].append('generated JSON mismatch')
              except Exception as exc:
                  result['generatedJson'] = {'url': generated_url, 'success': False, 'error': repr(exc)}
                  result['errors'].append(f'generated JSON: {exc!r}')

              result['success'] = all(page.get('success') for page in result['pages'].values()) and result['generatedJson'].get('success', False)
              return result

          final = None
          for attempt in range(1, 31):
              final = inspect_once(attempt)
              print(json.dumps({'attempt': attempt, 'success': final['success'], 'errors': final['errors']}, ensure_ascii=False))
              if final['success']:
                  break
              time.sleep(10)

          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(final, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit verification evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/west-four-final-public-verification-20260725.json
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            git commit -m "audit: record west four final public verification"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Enforce successful verification
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('jichitai-compare/operations/audits/west-four-final-public-verification-20260725.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          if not result.get('success'):
              raise SystemExit('Public verification failed: ' + json.dumps(result.get('errors', []), ensure_ascii=False))
          print('Public verification succeeded.')
          PY
