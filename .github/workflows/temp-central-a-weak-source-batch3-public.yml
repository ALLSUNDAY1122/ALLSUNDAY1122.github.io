name: Temporary Central A Weak Source Batch 3 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch3-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch3-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const pages=[
            {code:'23563',name:'豊根村'},
            {code:'24212',name:'熊野市'},
            {code:'24214',name:'いなべ市'}
          ];
          const expected=[
            {code:'23563',name:'豊根村',service:'postpartumCare',source:'https://www.vill.toyone.aichi.jp/section/reiki_int/reiki_honbun/i577RG00000795.html',additional:['https://www.vill.toyone.aichi.jp/soshiki/jumin/hoken/740.html'],summary:'出産退院後おおむね1年未満の母子へ、宿泊・日帰り型の産後ケアを提供する。'},
            {code:'24212',name:'熊野市',service:'sickChildCare',source:'https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00000826.html',additional:['https://www.city.kumano.lg.jp/childcare/?content=795','https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00000754.html'],summary:'ファミリーサポートセンターの提供会員が、入院治療を必要としない病児・病後児を預かる支援を行う。'},
            {code:'24212',name:'熊野市',service:'schoolMeals',source:'https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00001184.html',additional:['https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00001000.html','https://www.city.kumano.lg.jp/childcare/?category=36'],summary:'市内在住の児童生徒について、市立学校等の学校給食に係る保護者負担費用を市が全額補助する。'},
            {code:'24212',name:'熊野市',service:'postpartumCare',source:'https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00000978.html',additional:['https://www.city.kumano.lg.jp/childcare/?content=795','https://www.city.kumano.lg.jp/welfare/?content=2122'],summary:'出産後に育児支援や保健指導が必要な母子へ、医療機関・助産所で7日以内の産後ケアを提供する。'},
            {code:'24214',name:'いなべ市',service:'schoolMeals',source:'https://www2.city.inabe.mie.jp/reiki/reiki_honbun/r031RG00001258.html',additional:['https://www.city.inabe.mie.jp/kyoiku/kyoiku/school/1006855.html'],summary:'令和7年4月から、市立小中学校の児童生徒の保護者から学校給食費を徴収しない。'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;
              const pageChecks=[];
              for(const item of pages){
                const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});
                if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);
                const html=await response.text();
                if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);
                for(const service of expected.filter(x=>x.code===item.code))if(!html.includes(service.summary))throw new Error(`${item.code}:${service.service} page summary mismatch`);
                pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true,serviceSummariesMatched:expected.filter(x=>x.code===item.code).length});
              }
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});
              if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);
              if(!Array.isArray(municipalities)||municipalities.length!==1741)throw new Error(`published municipality count ${municipalities.length}`);
              let serviceCount=0;for(const municipality of municipalities)serviceCount+=Object.keys(municipality.services??{}).length;
              if(serviceCount!==15669)throw new Error(`published service count ${serviceCount}`);
              const serviceChecks=[];
              for(const item of expected){
                const municipality=municipalities.find(x=>String(x.code)===item.code);
                if(!municipality)throw new Error(`${item.code} missing`);
                const service=municipality.services?.[item.service];
                if(service?.status!=='verified')throw new Error(`${item.code}:${item.service} status ${service?.status}`);
                if(service.summary!==item.summary)throw new Error(`${item.code}:${item.service} summary mismatch`);
                if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch`);
                const additionalUrls=(service.additionalSources??[]).map(x=>x.url);
                for(const url of item.additional)if(!additionalUrls.includes(url))throw new Error(`${item.code}:${item.service} additional source missing ${url}`);
                serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,summaryMatched:true,sourceMatched:true,additionalSourcesMatched:item.additional.length});
              }
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch3-public-verification-20260726',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:3,reviewedServiceCount:5,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};
              fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch3-public-verification-20260726.json',JSON.stringify(audit,null,2)+'\n');
              process.exit(0);
            }catch(error){lastError=error;if(attempt<30)await sleep(20000);}
          }
          throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch3-public-trigger-20260726.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第3群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
