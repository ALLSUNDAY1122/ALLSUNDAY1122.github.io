name: Temporary West A Bulky Waste Priority Fetch

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-bulky-waste-priority-trigger-20260725.json

permissions:
  contents: write

jobs:
  refine-and-fetch:
    if: github.head_ref == 'audit/west-a-bulky-waste-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Refine candidates and fetch official sources
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const src=JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json','utf8'));
          const scoreRow=r=>{
            const f=r.flags||{};let score=0;const reasons=[];
            if(r.status==='unavailable'){score+=4;reasons.push('unavailablePositiveEvidence');}
            if(!f.methodPresent){score+=4;reasons.push('missingMethod');}
            if(!f.feePresent){score+=2;reasons.push('missingFee');}
            if(f.oldYear&&!f.currentYear){score+=4;reasons.push('staleFiscalYear');}
            if(f.external){score+=3;reasons.push('externalPrimarySource');}
            if(f.methodMismatch){score+=4;reasons.push('summaryMethodMismatch');}
            if(f.feeRisk){score+=4;reasons.push('feeExpressionRisk');}
            if(f.calendarOnly){score+=3;reasons.push('genericCalendarOnly');}
            if(f.weak){score+=1;reasons.push('weakPrimarySource');}
            return {...r,score,reasons};
          };
          const all=(src.priorityCandidates||[]).map(scoreRow);
          let selected=all.filter(r=>r.score>=4 || (r.score>=3&&r.flags?.weak)).sort((a,b)=>b.score-a.score||a.code.localeCompare(b.code));
          const mustCodes=new Set(all.filter(r=>r.status==='unavailable'||r.flags?.methodMismatch||r.flags?.feeRisk||r.flags?.external||(r.flags?.oldYear&&!r.flags?.currentYear)||!r.flags?.methodPresent).map(r=>r.code));
          const extra=all.filter(r=>mustCodes.has(r.code)&&!selected.some(x=>x.code===r.code));
          selected=[...selected,...extra].sort((a,b)=>b.score-a.score||a.code.localeCompare(b.code)).slice(0,70);
          function decode(s){return s.replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(Number(n)));}
          function strip(html){return decode(html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());}
          function excerpts(text){const terms=['粗大ごみ','大型ごみ','持ち込み','持込','搬入','戸別収集','収集','予約','申込','手数料','10kg','キログラム','無料','円'];const out=[];for(const term of terms){let from=0;for(let i=0;i<2;i++){const idx=text.indexOf(term,from);if(idx<0)break;out.push({term,snippet:text.slice(Math.max(0,idx-220),Math.min(text.length,idx+520))});from=idx+term.length;}}return out.slice(0,12);}
          const results=[];
          for(let i=0;i<selected.length;i++){
            const r=selected[i];const tmp='/tmp/bulky-'+i;let httpStatus=null,error=null,finalUrl=r.sourceUrl,text='';
            try{
              const cmd=`curl -LfsS --connect-timeout 12 --max-time 35 -A 'Mozilla/5.0 West-A-Bulky-Audit/2026' -w '\n__HTTP__%{http_code}\n__URL__%{url_effective}\n' -o '${tmp}' '${String(r.sourceUrl).replace(/'/g,"'%27")}'`;
              const meta=cp.execSync(cmd,{encoding:'utf8',stdio:['ignore','pipe','pipe']});
              httpStatus=Number((meta.match(/__HTTP__(\d+)/)||[])[1]||0)||null;finalUrl=(meta.match(/__URL__(.+)/)||[])[1]?.trim()||r.sourceUrl;
              text=strip(fs.readFileSync(tmp,'utf8'));
            }catch(e){error=String(e.stderr||e.message||e);try{if(fs.existsSync(tmp))text=strip(fs.readFileSync(tmp,'utf8'));}catch{}}
            const corpus=text;
            const markers={
              bulkyTerm:/粗大ごみ|大型ごみ|大型廃棄物/.test(corpus),
              collection:/戸別収集|収集日|収集する|ステーション|集積所/.test(corpus),
              carryIn:/持ち込み|持込|直接搬入|搬入先|清掃センター|クリーンセンター|環境センター/.test(corpus),
              reservation:/予約|申込|申し込み|事前連絡|電話受付/.test(corpus),
              fee:/\d[\d,]*円|無料|手数料|10kg|キログラム|１個|1個|一点|1点/.test(corpus),
              current2026:/2026年|2026年度|令和8年|令和８年|令和8年度|令和８年度/.test(corpus),
              old2025:/2025年|2025年度|令和7年|令和７年|令和7年度|令和７年度/.test(corpus),
              ongoing:/毎年|随時|通年|現在|実施しています|受け付けています|搬入できます|収集しています/.test(corpus)
            };
            results.push({code:r.code,name:r.name,prefecture:r.prefecture,status:r.status,summary:r.summary,sourceUrl:r.sourceUrl,finalUrl,score:r.score,reasons:r.reasons,httpStatus,error,markers,excerpts:excerpts(corpus)});
          }
          const counts={selected:selected.length,http200:results.filter(x=>x.httpStatus===200).length,fetchError:results.filter(x=>x.error).length,unavailable:results.filter(x=>x.status==='unavailable').length,methodMismatch:selected.filter(x=>x.reasons.includes('summaryMethodMismatch')).length,feeRisk:selected.filter(x=>x.reasons.includes('feeExpressionRisk')).length,stale:selected.filter(x=>x.reasons.includes('staleFiscalYear')).length,external:selected.filter(x=>x.reasons.includes('externalPrimarySource')).length};
          const report={schemaVersion:'1.0.0',auditId:'west-a-bulky-waste-priority-fetch-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),sourceAudit:'jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json',selectionPolicy:'状態矛盾、方法欠落、料金欠落、旧年度、外部主出典、方法不一致、料金単位、カレンダーのみを加点し、弱い出典単独候補を除外',counts,results,status:'priority_fetch_completed'};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(counts));
          NODE
          rm -f jichitai-compare/operations/control/west-a-bulky-waste-priority-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-bulky-waste-priority-fetch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json \
                  jichitai-compare/operations/control/west-a-bulky-waste-priority-trigger-20260725.json \
                  .github/workflows/temporary-west-a-bulky-waste-priority-fetch.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A粗大ごみ高リスク候補を公式再取得'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
