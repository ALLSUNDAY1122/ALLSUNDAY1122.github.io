name: Temporary Sync Public 464

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-public-464.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild live coordinator state and self-delete
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          regions=('north','east','central','west')
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          now=datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds')
          rq_path=Path('jichitai-compare/operations/control/release-queue.json')
          rq=json.loads(rq_path.read_text(encoding='utf-8')); entries={e['region']:e for e in rq['entries']}; states={}
          for region in regions:
              ref=f'origin/region/{region}'; state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json')); states[region]=state
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines(); items=[]
              for path in names:
                  if not re.search(r'/\d{5}\.json$',path): continue
                  data=json.loads(show(ref,path))
                  if belongs(region,data['prefectureCode']): items.append({'code':data['code'],'name':data['name']})
              items.sort(key=lambda x:x['code']); pending=int(state.get(fields[region],0)); e=entries[region]
              e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':pending,'releaseStatus':'release_ready' if pending>=10 else 'pending_threshold','reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体','mainIntegrationPr':state.get('lastNationalIntegrationPr'),'generatedPullRequest':746,'auditStatus':'passed'})
          total=sum(entries[r]['count'] for r in regions); pending={r:entries[r]['pendingSinceLastRelease'] for r in regions}; ready=[r for r in regions if pending[r]>=10]
          next_action=f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合条件到達: '+','.join(ready) if ready else '10自治体到達地域なし。')
          rq['updatedAt']=now; rq['status']='active'; rq['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':464,'latestGeneratedPullRequest':746,'latestPublicCountPullRequest':746,'releaseReadyRegions':ready,'nextAction':next_action}
          rq_path.write_text(json.dumps(rq,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          gs_path=Path('jichitai-compare/operations/control/global-state.json'); gs=json.loads(gs_path.read_text(encoding='utf-8'))
          latest=max(((s.get('lastNationalIntegrationAt') or '',s.get('lastNationalIntegrationPr')) for s in states.values()),key=lambda x:x[0])
          gs.update({'updatedAt':now,'phase':'release-monitoring','regionalCompletedSinceLastRelease':{**pending,'total':sum(pending.values())},'priority':{'type':'release-monitoring','nextAction':next_action},'lastNationalIntegrationAt':latest[0],'lastNationalIntegrationPr':latest[1],'latestGeneratedMunicipalityCount':464,'latestGeneratedPullRequest':746,'latestPublicCountPullRequest':746,'regionalMergedMunicipalities':total,'openPullRequests':[],'humanDecisionRequired':False})
          gs_path.write_text(json.dumps(gs,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps({'regionalMergedMunicipalities':total,'pending':pending,'ready':ready},ensure_ascii=False))
          PY
          rm .github/workflows/temp-sync-public-464.yml
          git add jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/global-state.json .github/workflows/temp-sync-public-464.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 公開464自治体へ全国状態を同期'
          git pull --rebase origin main
          git push origin main
