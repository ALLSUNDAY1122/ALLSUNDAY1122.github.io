name: Otsu4 TF1 Build Number Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-TF1-BUILDNUM-FIX]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only Otsu4 TF1 build-number derivation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          marker='  otsu4-testflight:'
          start=s.index(marker)
          m=re.search(r'(?m)^  [A-Za-z0-9_-]+:\s*$', s[start+len(marker):])
          end=(start+len(marker)+m.start()) if m else len(s)
          block=s[start:end]
          required=[
              'name: 危険物乙4 - Human Test #1 Candidate',
              'RELEASE_SOURCE_SHA: 8912ef194955900ee4d64b17d37910b7a2931eb8',
              'submit_to_testflight: true',
              'submit_to_app_store: false',
              'case "$BUILD_NUMBER" in',
              'python3 - "$PBX" "$BUILD_NUMBER"',
              '/usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER"',
              'python3 - "$APP_DIR" "$BUILD_NUMBER"',
          ]
          missing=[x for x in required if x not in block]
          if missing: raise SystemExit('TF1 contract drift: '+repr(missing))
          if 'UPLOAD_BUILD_NUMBER=' in block:
              raise SystemExit('repair already applied')
          old='          PBX="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj/project.pbxproj"\n          python3 - "$PBX" "$BUILD_NUMBER"'
          new='          UPLOAD_BUILD_NUMBER="$((100 + BUILD_NUMBER))"\n          PBX="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj/project.pbxproj"\n          python3 - "$PBX" "$UPLOAD_BUILD_NUMBER"'
          block=block.replace(old,new,1)
          old='          PLIST="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Info.plist"\n          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"\n          ACTUAL="$(/usr/libexec/PlistBuddy -c \'Print :CFBundleVersion\' "$PLIST")"\n          test "$ACTUAL" = "$BUILD_NUMBER"'
          new='          UPLOAD_BUILD_NUMBER="$((100 + BUILD_NUMBER))"\n          PLIST="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Info.plist"\n          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $UPLOAD_BUILD_NUMBER" "$PLIST"\n          ACTUAL="$(/usr/libexec/PlistBuddy -c \'Print :CFBundleVersion\' "$PLIST")"\n          test "$ACTUAL" = "$UPLOAD_BUILD_NUMBER"'
          block=block.replace(old,new,1)
          block=block.replace('          python3 - "$APP_DIR" "$BUILD_NUMBER" <<\'PY2\'', '          python3 - "$APP_DIR" "$((100 + BUILD_NUMBER))" <<\'PY2\'', 1)
          if block.count('UPLOAD_BUILD_NUMBER="$((100 + BUILD_NUMBER))"') != 2:
              raise SystemExit('unexpected upload build-number replacement count')
          if 'python3 - "$APP_DIR" "$((100 + BUILD_NUMBER))"' not in block:
              raise SystemExit('package gate expected build number was not patched')
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          print('PASS: Otsu4 TF1 maps workflow build n to ASC build 100+n; RC workflow untouched')
          PY
      - name: Validate YAML and contract
        run: |
          python - <<'PY'
          import re,yaml
          cfg=yaml.safe_load(open('codemagic.yaml',encoding='utf-8'))
          w=(cfg.get('workflows') or {})
          rc=w['otsu4-ios']; tf=w['otsu4-testflight']
          assert 'publishing' not in rc, 'RC must remain generation-only'
          pub=((tf.get('publishing') or {}).get('app_store_connect') or {})
          assert pub.get('submit_to_testflight') is True
          assert pub.get('submit_to_app_store') is False
          text=open('codemagic.yaml',encoding='utf-8').read()
          marker='  otsu4-testflight:'; a=text.index(marker)
          m=re.search(r'(?m)^  [A-Za-z0-9_-]+:\s*$', text[a+len(marker):])
          b=(a+len(marker)+m.start()) if m else len(text)
          block=text[a:b]
          assert block.count('UPLOAD_BUILD_NUMBER="$((100 + BUILD_NUMBER))"') == 2
          assert 'python3 - "$APP_DIR" "$((100 + BUILD_NUMBER))"' in block
          assert 'RELEASE_SOURCE_SHA: 8912ef194955900ee4d64b17d37910b7a2931eb8' in block
          print('PASS: guarded TF1 build numbering; exact source pinned; App Store submission disabled')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet -- codemagic.yaml; then
            echo 'No diff'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'fix(otsu4): avoid TestFlight build-number collision'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 TF1 build-number repair finished. status=${{ job.status }}; run_id=${context.runId}`});
