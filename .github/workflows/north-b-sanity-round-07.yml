name: North B sanity audit round 07

on:
  push:
    branches:
      - audit/north-b-sanity-round-07-20260725
    paths:
      - .github/workflows/north-b-sanity-round-07.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/north-b-sanity-round-07-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply round 07 corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const now = '2026-07-25T02:22:00+09:00';
          const checkedAt = '2026-07-25';

          const happoPath = `${root}/data/municipalities/05/05349.json`;
          const happo = read(happoPath);
          happo.updatedAt = checkedAt;
          happo.services.temporaryChildcare = {
            status: 'verified',
            summary: '通常の一時保育に加え、未就園の生後6か月から満3歳未満児が町内2園で月10時間まで無料利用できるこども誰でも通園制度を実施する。',
            eligibility: { minAgeMonths: 0, maxAgeYears: 5 },
            details: {
              temporaryFacilities: '八森子ども園、峰浜ポンポコ子ども園',
              temporaryReasons: '疾病、出産、病人の付き添い等で家庭保育が困難な場合',
              temporaryLimit: '月14日以内',
              temporaryFee: '1日1,500円',
              anyoneTarget: '保育所、認定こども園、幼稚園等に通っていない生後6か月から満3歳未満の子ども',
              anyoneFacilities: '八森子ども園、峰浜ポンポコ子ども園',
              anyoneLimit: '子ども1人につき月10時間まで',
              anyoneFee: '1時間300円だが、八峰町民は全額免除',
              application: '学校教育課へ利用認定を申請し、認定後に利用施設と面談・予約を行う'
            },
            source: {
              url: 'https://www.town.happo.lg.jp/uploads/public/archive_0000002863_00/%EF%BC%94%E6%9C%88%E5%8F%B7/240%5B01-28%5D.pdf',
              checkedAt
            },
            additionalSources: [
              { url: 'https://www.town.happo.lg.jp/archive/contents-165', checkedAt }
            ]
          };
          write(happoPath, happo);

          const hachirogataPath = `${root}/data/municipalities/05/05363.json`;
          const hachirogata = read(hachirogataPath);
          hachirogata.updatedAt = checkedAt;
          hachirogata.services.schoolMeals = {
            status: 'verified',
            summary: '全児童生徒を対象とする学校給食費助成を実施し、経済的に就学困難な世帯には別途就学援助を行う。',
            eligibility: { minAgeMonths: 72, maxAgeYears: 15 },
            details: {
              universalSupport: '令和8年度当初予算で、全児童生徒を対象とする学校給食費助成金を計上',
              overlap: '特別支援児童生徒援助費の給食費は国庫補助対象であり、町の学校給食費助成金と重複しないよう整理',
              amount: '助成率、保護者の最終自己負担額、町外通学者の取扱いは公開会議録では特定できない',
              meansTested: '経済的理由で就学困難な認定世帯には、給食費を含む就学援助を別途実施'
            },
            source: {
              url: 'https://www.town.hachirogata.akita.jp/_res/projects/default_project/_page_/001/004/489/kaigiroku0801.pdf',
              checkedAt
            },
            additionalSources: [
              { url: 'https://www.town.hachirogata.akita.jp/kosodate/1001490/1002472.html', checkedAt }
            ]
          };
          write(hachirogataPath, hachirogata);

          const misatoPath = `${root}/data/municipalities/05/05434.json`;
          const misato = read(misatoPath);
          misato.updatedAt = checkedAt;
          misato.services.schoolMeals = {
            status: 'verified',
            summary: '2026年1月から町立小中学校の給食費を無償化し、令和8年度も継続予定として案内する。対象外校通学者や弁当持参者には相当額を補助する。',
            eligibility: { minAgeMonths: 72, maxAgeYears: 15 },
            details: {
              start: '2026年1月分から町立小中学校の学校給食費を無償化',
              fiscal2026: '町公式広報で2026年4月から2027年3月までの継続予定を案内',
              alternativeSupport: '食物アレルギー等で弁当を持参する児童生徒や町外・特別支援学校等の対象者へ、町の1食当たり給食費相当額を上限に補助',
              meansTested: '就学援助認定世帯には給食費を含む就学援助も実施'
            },
            source: {
              url: 'https://www.town.misato.akita.jp/uploads/public/archive_0000002343_00/202601_koho-all.pdf',
              checkedAt
            },
            additionalSources: [
              { url: 'https://www.town.misato.akita.jp/uploads/public/archive_0000000155_00/r07-12t-03-1211.pdf', checkedAt },
              { url: 'https://www.town.misato.akita.jp/archive/contents-832/', checkedAt }
            ]
          };
          write(misatoPath, misato);

          const serviceOrder = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          for (const [code, municipality] of [['05349', happo], ['05363', hachirogata], ['05434', misato]]) {
            const taskPath = `${root}/operations/tasks/${code}.json`;
            const task = read(taskPath);
            task.verifiedCount = serviceOrder.filter(k => municipality.services[k].status === 'verified').length;
            task.researchingCount = serviceOrder.filter(k => municipality.services[k].status === 'researching').length;
            task.unavailableCount = serviceOrder.filter(k => municipality.services[k].status === 'unavailable').length;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = now;
            task.lastUpdatedBy = '北日本調査班B';
            task.officialSources = [...new Set(serviceOrder.map(k => municipality.services[k].source.url))];
            task.notes = task.notes || [];
            const note = code === '05349'
              ? '北日本B誤調査ざっくり再検証 第7回: 令和8年度開始のこども誰でも通園制度が未反映だったため、対象・施設・月上限・町民無料・申請方法を追加。'
              : code === '05363'
                ? '北日本B誤調査ざっくり再検証 第7回: 学校給食費を就学援助のみとしていたが、令和8年度予算資料で全児童生徒対象の給食費助成を確認し訂正。'
                : '北日本B誤調査ざっくり再検証 第7回: 学校給食費を就学援助のみとしていたが、2026年1月開始の無償化と令和8年度継続予定、対象外校等への相当額補助を反映。';
            if (!task.notes.includes(note)) task.notes.push(note);
            write(taskPath, task);
          }

          const auditPath = `${root}/operations/audits/north-b-research-sanity-20260725.json`;
          const audit = read(auditPath);
          audit.completedRounds = 7;
          audit.remainingRounds = 3;
          audit.auditedMunicipalityCount = 76;
          audit.remainingMunicipalityCount = 31;
          audit.auditedAt = now;
          audit.bookkeepingCorrections = audit.bookkeepingCorrections || [];
          if (!audit.bookkeepingCorrections.some(x => x.type === 'duplicate-audited-code' && x.code === '05215')) {
            audit.bookkeepingCorrections.push({
              type: 'duplicate-audited-code',
              code: '05215',
              municipality: '仙北市',
              duplicatedIn: ['round01', 'round06'],
              correction: '第6回終了時の集計66件には重複1件が含まれていたため、実質65件へ補正してから第7回の新規11自治体を加算し76件とした'
            });
          }
          audit.round07 = {
            codes: ['05327','05346','05348','05349','05361','05363','05366','05368','05434','05463','06202'],
            municipalityCount: 11,
            serviceCount: 99,
            highRiskChecks: 29,
            confirmedErrorCount: 3,
            confirmedErrors: [
              {
                code: '05349', municipality: '八峰町', service: 'temporaryChildcare',
                before: '通常の一時保育のみ',
                after: '町内2園のこども誰でも通園制度を併記',
                reason: '2026年4月開始の町公式制度が未反映'
              },
              {
                code: '05363', municipality: '八郎潟町', service: 'schoolMeals',
                before: '就学援助認定世帯への給食費支援のみ',
                after: '全児童生徒対象の学校給食費助成と就学援助を併記',
                reason: '令和8年度当初予算資料で全児童生徒対象の助成金を確認'
              },
              {
                code: '05434', municipality: '美郷町', service: 'schoolMeals',
                before: '就学援助認定世帯への給食費支援のみ',
                after: '2026年1月開始の無償化、令和8年度継続予定、対象外校等への相当額補助を反映',
                reason: '町公式広報・議会資料の現行制度が未反映'
              }
            ],
            evidenceLimitations: [
              { code: '05327', municipality: '上小阿仁村', service: 'temporaryChildcare', note: '令和8年度の利用者向けこども誰でも通園制度案内を確認できず、通常の一時保育情報を維持' },
              { code: '05366', municipality: '井川町', service: 'temporaryChildcare', note: '乳児等通園支援事業の運営規程制定は確認したが、対象・料金・時間・予約方法の利用者向け現行案内を取得できず変更しなかった' },
              { code: '05366', municipality: '井川町', service: 'schoolMeals', note: '義務教育学校給食費助成の存在は確認したが、令和8年度の助成額・対象条件を直接資料で特定できず、就学援助の記載を維持' }
            ],
            noConfirmedErrorCodes: ['05327','05346','05348','05361','05366','05368','05463','06202']
          };
          write(auditPath, audit);

          const checkpointPath = `${root}/operations/control/session-checkpoints/north-b.json`;
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = now;
          checkpoint.workingBranch = 'audit/north-b-sanity-round-07-20260725';
          checkpoint.pullRequestNumber = null;
          checkpoint.ciStatus = 'pending';
          checkpoint.nextAction = '北日本B誤調査ざっくり再検証第7回は11自治体・99制度、高リスク29項目を確認。八峰町のこども誰でも通園制度、八郎潟町の全児童生徒向け給食費助成、美郷町の学校給食無償化を訂正。仙北市の監査重複を補正し、監査完了7/10回・実質76/107自治体・残り31自治体。地域PR作成、CI、region/north統合、main同期を行う。';
          write(checkpointPath, checkpoint);
          NODE
          rm .github/workflows/north-b-sanity-round-07.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "audit: 北日本B誤調査再検証 第7回を反映"
          git push origin HEAD:audit/north-b-sanity-round-07-20260725
