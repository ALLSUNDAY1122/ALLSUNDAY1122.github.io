name: Kanri Eiyoushi iOS Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'kanrieiyoushi-sprint/**'
      - '.github/workflows/kanrieiyoushi-ios-release-gate.yml'
  workflow_dispatch:

jobs:
  static-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run 600 question audit
        run: |
          python kanrieiyoushi-sprint/audit/build_all600.py
          python automation/learning-sprint-question-pipeline/validate_questions.py kanrieiyoushi-sprint/audit/learning-sprint-audit-all600.json
          python kanrieiyoushi-sprint/audit/content_rights_audit.py
      - name: Apple and StoreKit preflight
        run: |
          node kanrieiyoushi-sprint/validate-apple-preflight.mjs
          bash -n kanrieiyoushi-sprint/ios/prepare-ios.sh
          python -m py_compile kanrieiyoushi-sprint/ios/apply-xcode-capabilities.py kanrieiyoushi-sprint/ios/ios_productization_audit.py
          python kanrieiyoushi-sprint/ios/ios_productization_audit.py
      - name: Privacy Manifest audit
        run: |
          python - <<'PY'
          import plistlib
          p='kanrieiyoushi-sprint/ios/PrivacyInfo.xcprivacy'
          with open(p,'rb') as f: d=plistlib.load(f)
          assert d.get('NSPrivacyTracking') is False
          assert d.get('NSPrivacyTrackingDomains') == []
          assert d.get('NSPrivacyCollectedDataTypes') == []
          assert d.get('NSPrivacyAccessedAPITypes') == []
          print('PASS: Privacy Manifest')
          PY

  macos-release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare local audited web bundle
        env:
          KANRI_ICON_MODE: simulator-placeholder
        run: bash kanrieiyoushi-sprint/ios/prepare-ios.sh
      - name: Generate Xcode project and IAP capability
        run: |
          cd kanrieiyoushi-sprint/ios
          xcodegen generate
          python3 apply-xcode-capabilities.py KanriEiyoushiSprint.xcodeproj/project.pbxproj
          grep -q 'com.apple.InAppPurchase' KanriEiyoushiSprint.xcodeproj/project.pbxproj
      - name: Build unsigned Release for iOS Simulator
        run: |
          xcodebuild -project kanrieiyoushi-sprint/ios/KanriEiyoushiSprint.xcodeproj -scheme KanriEiyoushiSprint -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/KanriDerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Inspect built .app
        run: |
          APP="$(find /tmp/KanriDerivedData/Build/Products -type d -name 'KanriEiyoushiSprint.app' | head -1)"
          test -n "$APP"
          test -f "$APP/Web/index.html"
          test -f "$APP/Web/native-storekit.js"
          test -f "$APP/Web/data-bootstrap-v061.js"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          grep -q 'jp.allsunday1122.kanrieiyoushi.premium' kanrieiyoushi-sprint/ios/App.swift
          echo 'PASS: unsigned Release Simulator build and bundled assets'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanrieiyoushi-xcode-release-logs
          path: /tmp/KanriDerivedData/Logs/**
          if-no-files-found: ignore

  canonical-icon-transport:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Try canonical Drive icon transport
        env:
          KANRI_ICON_MODE: canonical
        run: bash kanrieiyoushi-sprint/ios/prepare-ios.sh
