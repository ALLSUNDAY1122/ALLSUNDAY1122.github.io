name: Temporary West B Housing State Sync

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-b-housing-state-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-b-housing-state-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize West B housing audit state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const regionPath = 'jichitai-compare/operations/control/regions/west.json';
          const auditPath = 'jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json';
          const updatedAt = '2026-07-25T19:46:00+09:00';
          const codes = ['35203','35206','35207','35208','35305','36388','36403','36404','36405','36468','38205','38386','41208','41209','41346','45382','45403','45406','45430','47353','47359','47360','47362','47381'];
          const block = {
            auditId: 'west-b-housing-classification-crosscheck-20260725',
            priorityReviewId: 'west-b-housing-priority-review-20260725',
            officialReviewId: 'west-b-housing-official-review-20260725',
            correctionAuditId: 'west-b-housing-classification-corrections-20260725',
            auditedMunicipalityCount: 250,
            mechanicalCandidateCount: 118,
            strictCandidateCount: 100,
            officialSourceFetchedCount: 99,
            priorityCandidateCount: 25,
            confirmedCorrectionCount: 24,
            changedToUnavailableCount: 21,
            familySpecificReplacementCount: 3,
            retainedVerifiedCount: 1,
            correctedMunicipalityCodes: codes,
            retainedMunicipalityCode: '47326',
            sourceEvidencePullRequest: 3641,
            regionalCorrectionPullRequest: 3662,
            regionalCorrectionWorkflowRunId: 30154957954,
            regionalMergeCommit: '8a40f354166e460c94d27268a1ed4348c5fc6908',
            stateSyncPullRequest: Number(process.env.PR_NUMBER),
            stateSyncWorkflowRunId: Number(process.env.RUN_ID),
            status: 'regional_corrections_completed_pending_national_publication',
            unresolvedConfirmedErrorCount: 0,
            releaseBlocker: 'none',
            judgment: '子育て・新婚世帯の明示的対象・加算・優遇がない一般住宅施策はhousingSupportのverified根拠としない'
          };

          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = updatedAt;
          checkpoint.pullRequestNumber = 3662;
          checkpoint.ciStatus = 'success';
          checkpoint.workingBranch = null;
          checkpoint.currentMunicipality = null;
          checkpoint.lastAction = '西日本B担当250自治体の住宅支援を横断監査し、一般制度誤分類21件をunavailableへ修正、3件を2026年度新婚世帯向け制度へ差し替えた。北谷町は子育て世帯優遇を確認してverifiedを維持した。';
          checkpoint.nextAction = 'region/westの住宅支援訂正24件を最新mainへ同期し、全国生成JSON・24静的ページ・本番公開を確認する。';
          checkpoint.housingSupportCrosscheck = block;
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');

          const region = JSON.parse(fs.readFileSync(regionPath, 'utf8'));
          region.updatedAt = updatedAt;
          region.lastAction = checkpoint.lastAction;
          region.nextAction = checkpoint.nextAction;
          region.latestWestBHousingCrosscheck = block;
          region.lastRegionalQualityPr = 3662;
          fs.writeFileSync(regionPath, JSON.stringify(region, null, 2) + '\n');

          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.regionalMergeCommit = block.regionalMergeCommit;
          audit.regionalValidation = 'success';
          audit.stateSyncPullRequestNumber = Number(process.env.PR_NUMBER);
          audit.stateSyncWorkflowRunId = Number(process.env.RUN_ID);
          audit.stateSynchronizedAt = updatedAt;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js

      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/west-b-housing-state-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/control/session-checkpoints/west-b.json \
            jichitai-compare/operations/control/regions/west.json \
            jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json \
            jichitai-compare/operations/control/west-b-housing-state-trigger-20260725.json
          git commit -m 'state: 西日本B住宅支援横断監査を地域状態へ反映'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
