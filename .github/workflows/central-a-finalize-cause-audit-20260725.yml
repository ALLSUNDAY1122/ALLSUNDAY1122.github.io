name: Central A Finalize Cause Audit 20260725

on:
  push:
    branches:
      - audit/central-a-cause-final-20260725-1104

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy audit evidence from completed scan
        run: |
          git fetch origin audit/central-a-cause-scan-20260725-1031
          git checkout origin/audit/central-a-cause-scan-20260725-1031 -- \
            jichitai-compare/operations/audits/central-a-cause-based-rescan-20260725.json \
            jichitai-compare/operations/audits/central-a-cause-based-rescan-summary-20260725.json \
            jichitai-compare/operations/audits/central-a-cause-based-decisions-20260725.json
      - name: Apply confirmed corrections on latest region base
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'jichitai-compare';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          fs.rmSync(path.join(root,'data','municipalities','24','24361.json'), {force:true});
          fs.rmSync(path.join(root,'operations','tasks','24361.json'), {force:true});
          const updates = [
            ['16210','bulkyWaste','https://www.city.nanto.toyama.jp/kurashi-tetsuzuki/gomi-kankyo-pets/5/2825.html','2026-07-25の原因別再監査で、404となった粗大ごみ旧URLを現行の公式直接搬入案内へ更新。制度内容は変更なし。'],
            ['23342','bulkyWaste','https://www.town.toyoyama.lg.jp/kurashi/sigen/1007929/1000738.html','2026-07-25の原因別再監査で、404となった粗大ごみ旧URLを令和8年7月更新の公式申込ページへ更新。制度内容は変更なし。']
          ];
          for (const [code, serviceKey, newUrl, note] of updates) {
            const mPath = path.join(root,'data','municipalities',code.slice(0,2),`${code}.json`);
            const tPath = path.join(root,'operations','tasks',`${code}.json`);
            const m = read(mPath); const t = read(tPath);
            const oldUrl = m.services[serviceKey].source.url;
            m.services[serviceKey].source.url = newUrl;
            m.services[serviceKey].source.checkedAt = '2026-07-25';
            m.updatedAt = '2026-07-25';
            const idx = t.officialSources.indexOf(oldUrl);
            if (idx >= 0) t.officialSources[idx] = newUrl;
            else if (!t.officialSources.includes(newUrl)) throw new Error(`${code}: task source not found`);
            t.lastCheckedAt = '2026-07-25';
            t.lastUpdatedAt = '2026-07-25T11:04:00+09:00';
            t.lastUpdatedBy = '中日本調査班A（原因別重点再監査）';
            if (!t.notes.includes(note)) t.notes.push(note);
            write(mPath,m); write(tPath,t);
          }
          const prefs=['16','17','18','21','22','23','24','25','27','28'];
          const codes=prefs.flatMap(p=>fs.readdirSync(path.join(root,'data','municipalities',p)).filter(f=>/^\d{5}\.json$/.test(f)).map(f=>f.slice(0,5))).sort();
          if(codes.length!==314) throw new Error(`municipality count=${codes.length}`);
          const names=new Map();
          for(const code of codes){
            const m=read(path.join(root,'data','municipalities',code.slice(0,2),`${code}.json`));
            const key=`${m.prefecture}:${m.name}`;
            if(names.has(key)) throw new Error(`duplicate ${key}: ${names.get(key)},${code}`);
            names.set(key,code);
            if(!fs.existsSync(path.join(root,'operations','tasks',`${code}.json`))) throw new Error(`missing task ${code}`);
          }
          if(!fs.existsSync(path.join(root,'data','municipalities','24','24341.json'))) throw new Error('24341 missing');
          console.log(JSON.stringify({municipalities:codes.length,services:codes.length*9,duplicates:0,missingTasks:0}));
          NODE
      - name: Validate JavaScript
        run: node --check jichitai-compare/app.js
      - name: Commit final regional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/central-a-finalize-cause-audit-20260725.yml
          git add -A
          git commit -m "fix: 中日本A原因別重点再監査の確定訂正を統合準備"
          git push origin HEAD:audit/central-a-cause-final-20260725-1104
