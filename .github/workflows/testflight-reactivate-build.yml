name: TestFlight Reactivate Build

on:
  push:
    branches: [main]
    paths:
      - automation/testflight-reactivate-build-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reactivate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reactivate explicitly targeted expired build
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time
          from pathlib import Path
          sys.path.insert(0, str((Path.cwd()/'scripts').resolve()))
          from app_store_connect_api import api_get, api_request, load_private_key, make_token

          cmd=json.loads(Path('automation/testflight-reactivate-build-command.json').read_text(encoding='utf-8'))
          rid=str(cmd['request_id']); app_id=str(cmd['app_id']); build_id=str(cmd['build_id']); expected_version=str(cmd['build_version'])
          allowed_prefix=str(cmd.get('expected_expiration_prefix') or '')
          out={'request_id':rid,'app_id':app_id,'build_id':build_id,'build_version':expected_version,'ok':False,
               'before':None,'after':None,'before_beta':None,'after_beta':None,'patch_http_status':None,'errors':[],
               'safety':{'delete':False,'review_submit':False,'external_beta_submit':False,'only_patch_expired_false':True}}
          cleanup=None
          try:
            issuer=os.environ.get('ASC_ISSUER_ID'); kid=os.environ.get('ASC_KEY_ID')
            if not issuer or not kid: raise RuntimeError('missing ASC API credentials')
            kp,cleanup=load_private_key(); token=make_token(issuer,kid,kp)

            def read_build():
              _,r=api_get(token,f'/v1/builds/{build_id}?fields[builds]=version,uploadedDate,expirationDate,processingState,expired,buildAudienceType,usesNonExemptEncryption')
              return ((((r or {}).get('data') or {}).get('attributes') or {}))
            def read_beta():
              _,r=api_get(token,f'/v1/builds/{build_id}/buildBetaDetail?fields[buildBetaDetails]=internalBuildState,externalBuildState')
              return ((((r or {}).get('data') or {}).get('attributes') or {}))

            before=read_build(); out['before']=before; out['before_beta']=read_beta()
            if str(before.get('version')) != expected_version: raise RuntimeError(f'version mismatch: {before.get("version")!r}')
            if before.get('processingState') != 'VALID': raise RuntimeError(f'build is not VALID: {before.get("processingState")!r}')
            if before.get('expired') is not True: raise RuntimeError('build is not currently expired; refusing unnecessary mutation')
            exp=str(before.get('expirationDate') or '')
            if allowed_prefix and not exp.startswith(allowed_prefix): raise RuntimeError(f'expiration does not match guarded mass-expiry prefix: {exp!r}')

            payload={'data':{'type':'builds','id':build_id,'attributes':{'expired':False}}}
            hs,_=api_request(token,f'/v1/builds/{build_id}',method='PATCH',payload=payload)
            out['patch_http_status']=hs
            if hs not in (200,201,204): raise RuntimeError(f'PATCH expired=false returned HTTP {hs}')
            time.sleep(3)
            out['after']=read_build(); out['after_beta']=read_beta()
            out['ok']=(out['after'].get('expired') is False and out['after'].get('processingState')=='VALID' and
                       out['after_beta'].get('internalBuildState') in ('READY_FOR_BETA_TESTING','IN_BETA_TESTING'))
          except Exception as e:
            out['errors'].append(type(e).__name__+': '+str(e)[:1500])
          finally:
            if cleanup: cleanup.unlink(missing_ok=True)

          p=Path('automation/asc-results')/f'{rid}.json'; p.parent.mkdir(parents=True,exist_ok=True)
          payload=json.dumps(out,ensure_ascii=False,indent=2)+'\n'; p.write_text(payload,encoding='utf-8')
          Path('/tmp/testflight-reactivate-result.json').write_text(payload,encoding='utf-8'); Path('/tmp/testflight-reactivate-path.txt').write_text(str(p),encoding='utf-8')
          print(json.dumps({'ok':out['ok'],'before':out['before'],'after':out['after'],'before_beta':out['before_beta'],'after_beta':out['after_beta'],'patch_http_status':out['patch_http_status'],'errors':out['errors']},ensure_ascii=False))
          PY

      - name: Persist sanitized reactivation evidence
        if: always()
        run: |
          test -f /tmp/testflight-reactivate-path.txt || exit 1
          P="$(cat /tmp/testflight-reactivate-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P"; git commit -m "Persist TestFlight build reactivation evidence" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          cp "$P" /tmp/testflight-reactivate-copy.json
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/testflight-reactivate-copy.json "$P"
          git add "$P"; git commit -m "Persist TestFlight build reactivation evidence" || exit 0; git push origin HEAD:main
