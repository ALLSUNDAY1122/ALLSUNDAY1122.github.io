name: Temporary West-A round 7 audit update

on:
  push:
    branches:
      - 'audit/west-a-research-verification-r7-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[round7-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update round 7 audit evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'jichitai-compare';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const auditPath = `${base}/operations/audits/west-a-research-verification-20260725.json`;
          const audit = read(auditPath);
          audit.updatedAt = '2026-07-25T01:40:00+09:00';
          audit.completedRoundCount = 7;
          audit.rounds[audit.rounds.findIndex((r) => r.round === 7)] = {
            round: 7,
            title: '粗大ごみの料金、予約、持込条件監査',
            status: 'completed',
            method: '担当6県から各1自治体を抽出し、粗大ごみの料金、予約方法、直接搬入、本人・住所確認条件を自治体公式ページで再照合',
            sampleMunicipalityCount: 6,
            checkedServiceCount: 6,
            samples: [
              {
                code:'33100', name:'岡山市', result:'matched',
                registeredClaim:'戸別収集は200円・500円・1,000円・1,500円等、直接持込みは無料。電話・インターネットで予約し、東部・西部リサイクルプラザへ搬入',
                officialUrls:['https://www.city.okayama.jp/kurashi/0000005008.html','https://www.city.okayama.jp/kurashi/0000005299.html']
              },
              {
                code:'37202', name:'丸亀市', result:'matched',
                registeredClaim:'クリントピア丸亀へ平日・特別持込日の13時～16時に搬入。家庭ごみ10kg当たり100円、粗大ごみシール不要、住所確認、代理搬入は委任状',
                officialUrls:['https://www.city.marugame.lg.jp/page/2394.html']
              },
              {
                code:'39204', name:'南国市', result:'matched',
                registeredClaim:'一般廃棄物最終処分場へ事前予約して本人が搬入。10kg未満150円、10～20kg未満300円、以降10kgごと150円。受付カードと免許証を確認',
                officialUrls:['https://www.city.nankoku.lg.jp/life/life_dtl.php?hdnKey=3756','https://www.city.nankoku.lg.jp/life/life_dtl.php?hdnKey=9607']
              },
              {
                code:'40100', name:'北九州市', result:'matched',
                registeredClaim:'指定袋45Lに入らない物等を事前申込制で地区別に収集。1個300円・500円・700円・1,000円、納付券またはオンライン決済、朝8時30分までに排出',
                officialUrls:['https://www.city.kitakyushu.lg.jp/contents/924_10259.html']
              },
              {
                code:'43202', name:'八代市', result:'matched',
                registeredClaim:'エコエイトやつしろへ平日・土曜午前、月1回の日曜特別開設日に搬入。10kg当たり150円、品目別追加手数料の場合あり、免許証で住所確認',
                officialUrls:['https://www.city.yatsushiro.lg.jp/kiji0039012/index.html']
              },
              {
                code:'46218', name:'霧島市', result:'matched',
                registeredClaim:'地区別に霧島市クリーンセンターまたは牧園横川クリーンステーション等へ直接搬入。市内発生ごみ確認のため顔写真付き本人確認書類が必要',
                officialUrls:['https://www.city-kirishima.jp/kankyo/kurashi/gomi/shushu/mochikomi.html']
              }
            ],
            result:'passed',
            materialErrorCount:0
          };
          audit.summary.materialErrorCount = 1;
          audit.summary.correctionAppliedCount = 1;
          audit.summary.correctionRequiredCount = 0;
          audit.summary.roundsRemaining = 3;
          audit.summary.currentAssessment = '第7回は6自治体の粗大ごみ料金・予約・搬入条件が公式情報と一致。累計重大誤り1件は修正済みで、未修正0件。';
          audit.nextAction = '第8回として、防災マップの災害種別、避難所、公開URLを担当6県の複雑事例で再照合する。';
          write(auditPath, audit);

          const checkpointPath = `${base}/operations/control/session-checkpoints/west-a.json`;
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = '2026-07-25T01:40:00+09:00';
          checkpoint.nextAction = '10回の誤調査検証の第8回として、防災マップの災害種別、避難所、公開URLを担当6県の複雑事例で再照合する。';
          Object.assign(checkpoint.researchVerificationAudit, {completedRoundCount:7,lastCompletedRound:7,nextRound:8,materialErrorCount:1,correctionAppliedCount:1,correctionRequiredCount:0,lastAuditedAt:'2026-07-25T01:40:00+09:00'});
          checkpoint.integrityAudit.auditedAt = '2026-07-25T01:40:00+09:00';
          if (!checkpoint.integrityAudit.notes.some((n) => n.includes('第7回監査'))) checkpoint.integrityAudit.notes.push('第7回監査で6自治体の粗大ごみ料金・予約・直接搬入条件を再照合し、全件一致。');
          write(checkpointPath, checkpoint);
          NODE
      - name: Commit audit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-research-verification-20260725.json jichitai-compare/operations/control/session-checkpoints/west-a.json
          git commit -m '[round7-applied] audit: record West-A verification round 7'
          git push
