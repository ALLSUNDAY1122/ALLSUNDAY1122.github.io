name: Temporary sync release queue 1221

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync release queue by assignment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin region/north region/east region/central region/west
          python3 - <<'PY'
          import json, re, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          root='jichitai-compare'
          path=Path(root)/'operations/control/release-queue.json'
          queue=json.loads(path.read_text(encoding='utf-8'))
          regions={
            'north':('region/north',lambda p:1<=p<=7),
            'east':('region/east',lambda p:8<=p<=15 or p in (19,20)),
            'central':('region/central',lambda p:16<=p<=18 or 21<=p<=30),
            'west':('region/west',lambda p:31<=p<=47),
          }
          def items(ref,accept):
            out=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,f'{root}/data/municipalities'],text=True)
            result=[]
            for f in out.splitlines():
              m=re.fullmatch(rf'{re.escape(root)}/data/municipalities/(\d{{2}})/(\d{{5}})\.json',f)
              if not m: continue
              code=m.group(2)
              if not accept(int(code[:2])): continue
              data=json.loads(subprocess.check_output(['git','show',f'{ref}:{f}'],text=True))
              result.append({'code':code,'name':data.get('municipalityName') or data.get('name') or code})
            return sorted(result,key=lambda x:x['code'])
          main={k:{x['code'] for x in items('HEAD',a)} for k,(_,a) in regions.items()}
          entries={e['region']:e for e in queue['entries']}
          total=0; ready=[]; pending_text=[]
          for k,(branch,accept) in regions.items():
            municipalities=items(f'origin/{branch}',accept)
            pending=len({x['code'] for x in municipalities}-main[k])
            total+=len(municipalities)
            if pending>=10: ready.append(k)
            e=entries[k]
            e.update({'branch':branch,'municipalities':municipalities,'count':len(municipalities),'pendingSinceLastRelease':pending,'releaseStatus':'ready' if pending>=10 else 'pending_threshold','reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体','generatedPullRequest':606,'auditStatus':'passed'})
            pending_text.append(f'{k} {pending}')
          queue['updatedAt']=datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          summary=queue.setdefault('summary',{})
          summary.update({'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':364,'latestGeneratedPullRequest':606,'latestPublicCountPullRequest':606,'releaseReadyRegions':ready})
          action='10自治体到達地域を固定スナップショットで全国統合する。' if ready else '地方統合を継続。現在の公開後繰越: '+'、'.join(pending_text)+'。'
          summary['nextAction']=action; queue['nextAction']=action; queue['humanDecisionRequired']=False
          path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print({'total':total,'pending':pending_text,'ready':ready})
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json
          if ! git diff --cached --quiet; then
            git commit -m '統括管理: 地方統合状況を公開364自治体基準へ再同期'
            git push origin HEAD:main
          fi
