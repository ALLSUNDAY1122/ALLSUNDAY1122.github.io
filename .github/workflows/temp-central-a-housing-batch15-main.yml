name: Temporary Central A Housing Batch 15 Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch15-main-trigger-20260726.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/central-a-housing-batch15-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset to latest main and import regional records
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(
            jichitai-compare/data/municipalities/16/16205.json
            jichitai-compare/data/municipalities/16/16323.json
            jichitai-compare/data/municipalities/17/17206.json
            jichitai-compare/data/municipalities/18/18201.json
            jichitai-compare/data/municipalities/21/21204.json
            jichitai-compare/operations/tasks/16205.json
            jichitai-compare/operations/tasks/16323.json
            jichitai-compare/operations/tasks/17206.json
            jichitai-compare/operations/tasks/18201.json
            jichitai-compare/operations/tasks/21204.json
            jichitai-compare/operations/audits/central-a-housing-classification-batch15-decisions-20260726.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
            jichitai-compare/operations/control/regions/central.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/region/central:$file" > "$file"
          done
      - name: Regenerate and diagnose national outputs
        shell: bash
        run: |
          set -uo pipefail
          log_path="$GITHUB_WORKSPACE/batch15-validation.log"
          validation_path="$GITHUB_WORKSPACE/jichitai-compare/operations/audits/central-a-housing-classification-batch15-main-validation-20260726.json"
          : > "$log_path"
          cd jichitai-compare
          set +e
          npm run generate >> "$log_path" 2>&1
          generate_exit=$?
          npm run check >> "$log_path" 2>&1
          check_exit=$?
          node --check app.js >> "$log_path" 2>&1
          js_exit=$?
          set -e
          cd ..
          GENERATE_EXIT="$generate_exit" CHECK_EXIT="$check_exit" JS_EXIT="$js_exit" LOG_PATH="$log_path" VALIDATION_PATH="$validation_path" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const log=fs.readFileSync(process.env.LOG_PATH,'utf8');
          const lines=log.split(/\r?\n/);
          const generateExit=Number(process.env.GENERATE_EXIT);
          const checkExit=Number(process.env.CHECK_EXIT);
          const jsExit=Number(process.env.JS_EXIT);
          const result={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch15-main-validation-20260726',
            generatedAt:new Date().toISOString(),
            generateExit,
            checkExit,
            jsExit,
            success:generateExit===0&&checkExit===0&&jsExit===0,
            logTail:lines.slice(-180)
          };
          fs.mkdirSync(path.dirname(process.env.VALIDATION_PATH),{recursive:true});
          fs.writeFileSync(process.env.VALIDATION_PATH,JSON.stringify(result,null,2)+'\n');
          NODE
      - name: Reject unexpected changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/16/16205.json|jichitai-compare/data/municipalities/16/16323.json|jichitai-compare/data/municipalities/17/17206.json|jichitai-compare/data/municipalities/18/18201.json|jichitai-compare/data/municipalities/21/21204.json|jichitai-compare/operations/tasks/16205.json|jichitai-compare/operations/tasks/16323.json|jichitai-compare/operations/tasks/17206.json|jichitai-compare/operations/tasks/18201.json|jichitai-compare/operations/tasks/21204.json|jichitai-compare/operations/audits/central-a-housing-classification-batch15-decisions-20260726.json|jichitai-compare/operations/audits/central-a-housing-classification-batch15-main-validation-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/operations/progress.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/municipality/16205/index.html|jichitai-compare/municipality/16323/index.html|jichitai-compare/municipality/17206/index.html|jichitai-compare/municipality/18201/index.html|jichitai-compare/municipality/21204/index.html) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
      - name: Record national sync and commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='jichitai-compare/operations/audits/central-a-housing-classification-batch15-decisions-20260726.json';
          const validationPath='jichitai-compare/operations/audits/central-a-housing-classification-batch15-main-validation-20260726.json';
          const audit=JSON.parse(fs.readFileSync(path,'utf8'));
          const validation=JSON.parse(fs.readFileSync(validationPath,'utf8'));
          audit.nationalSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          audit.nationalSyncWorkflowRunId=Number(process.env.RUN_ID);
          audit.nationalSyncStatus=validation.success?'validated_pending_merge':'validation_failed_diagnostic_saved';
          audit.nationalValidationEvidence=validationPath;
          fs.writeFileSync(path,JSON.stringify(audit,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch15-main-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'sync: 中日本A住宅支援分類第15群を全国検証'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const validation=JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/central-a-housing-classification-batch15-main-validation-20260726.json','utf8'));
          if(!validation.success)process.exit(1);
          NODE
