name: Temporary West B Public Summary Cleanup R2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/west-b-public-summary-cleanup-31-32-r2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove remaining internal wording without reformatting JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          codes = [
              '31201', '31202', '31203', '31204', '31325', '31328', '31329',
              '31364', '31370', '31371', '31372', '31384', '31386', '31389',
              '31390', '31401', '31402', '31403', '32201', '32202', '32203',
              '32204', '32205', '32207', '32209', '32343', '32386'
          ]
          marker = '西日本調査班の調査対象。'
          needle = f'"summary": "{marker}'
          changed = []
          already_clean = []

          for code in codes:
              path = Path(f'jichitai-compare/data/municipalities/{code[:2]}/{code}.json')
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count > 1:
                  raise SystemExit(f'{code}: duplicated summary marker: {count}')
              if count == 1:
                  path.write_text(text.replace(needle, '"summary": "', 1), encoding='utf-8')
                  changed.append(code)
              elif marker in text:
                  raise SystemExit(f'{code}: marker remains outside expected summary field')
              else:
                  already_clean.append(code)

          audit_path = Path('jichitai-compare/operations/audits/west-b-public-summary-cleanup-20260724.json')
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit = {
              'schemaVersion': '1.0.0',
              'auditId': 'west-b-public-summary-cleanup-20260724',
              'sessionId': 'west-b',
              'auditedAt': '2026-07-24T23:23:00+09:00',
              'status': 'completed',
              'issue': '公開要約に内部運用文言「西日本調査班の調査対象。」が残存',
              'prefectureCodes': ['31', '32'],
              'municipalityCount': len(codes),
              'codes': codes,
              'changedCount': len(changed),
              'changedCodes': changed,
              'alreadyCleanCount': len(already_clean),
              'alreadyCleanCodes': already_clean,
              'sourceSummaryInternalTermRemainingCount': 0,
              'generatedPageInternalTermRemainingCount': 0,
              'previousPullRequestNumber': 2865
          }
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'changed={len(changed)} already_clean={len(already_clean)}')
          PY

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run validate:generated
          python - <<'PY'
          import json
          from pathlib import Path
          codes = [
              '31201', '31202', '31203', '31204', '31325', '31328', '31329',
              '31364', '31370', '31371', '31372', '31384', '31386', '31389',
              '31390', '31401', '31402', '31403', '32201', '32202', '32203',
              '32204', '32205', '32207', '32209', '32343', '32386'
          ]
          for code in codes:
              source = json.loads(Path(f'data/municipalities/{code[:2]}/{code}.json').read_text(encoding='utf-8'))
              if '調査班' in source.get('summary', ''):
                  raise SystemExit(f'{code}: internal wording remains in source summary')
              page = Path(f'municipality/{code}/index.html').read_text(encoding='utf-8')
              if '西日本調査班の調査対象' in page:
                  raise SystemExit(f'{code}: internal wording remains in generated page')
          PY

      - name: Remove workflow and commit minimal synchronized diff
        run: |
          rm .github/workflows/temp-west-b-public-summary-cleanup-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-west-b-public-summary-cleanup-r2.yml \
            jichitai-compare/data/municipalities/31 \
            jichitai-compare/data/municipalities/32 \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/municipality \
            jichitai-compare/operations/audits/west-b-public-summary-cleanup-20260724.json
          git commit -m 'fix: remove internal wording from Tottori and Shimane summaries'
          git push origin HEAD:coord/west-b-public-summary-cleanup-31-32-r2
