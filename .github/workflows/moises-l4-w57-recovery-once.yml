name: Moises L4 W57 Recovery Once

on:
  push:
    branches:
      - moises/wp4-analysis-platform
    paths:
      - '.github/workflows/moises-l4-w57-recovery-once.yml'
      - 'tech-assets/moises-audio/Package.swift'
      - 'tech-assets/moises-audio/Analysis/**'
      - 'tech-assets/moises-audio/iOS/HostCore/**'
      - 'tech-assets/moises-audio/Tests/MoisesAudioCoreTests/**'

permissions:
  contents: write

jobs:
  validate-recovered-l4:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moises/wp4-analysis-platform
          fetch-depth: 0

      - name: Validate exact worker package and persist diagnostics
        working-directory: tech-assets/moises-audio
        run: |
          swift --version
          set +e
          swift test --parallel > /tmp/l4-w57-swift-test.log 2>&1
          status=$?
          set -e
          cat /tmp/l4-w57-swift-test.log

          if [ "$status" -ne 0 ]; then
            diagnostic_rel="automation/chatgpt-dispatcher/moises-equivalence/recovery/L4-W57_SWIFTPM_DIAGNOSTIC.txt"
            diagnostic="$GITHUB_WORKSPACE/$diagnostic_rel"
            mkdir -p "$(dirname "$diagnostic")"
            {
              echo "L4-W57 exact Worker-branch SwiftPM diagnostic"
              echo "head_sha=$GITHUB_SHA"
              echo "swift_test_status=$status"
              echo
              echo "=== FIRST ERROR-LIKE LINES ==="
              grep -nE 'error:|fatal error:|FAIL|failed' /tmp/l4-w57-swift-test.log | head -n 250 || true
              echo
              echo "=== LOG TAIL (last 400 lines) ==="
              tail -n 400 /tmp/l4-w57-swift-test.log || true
            } > "$diagnostic"

            git -C "$GITHUB_WORKSPACE" config user.name 'chatgpt-l4-recovery'
            git -C "$GITHUB_WORKSPACE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$GITHUB_WORKSPACE" add -f "$diagnostic_rel"
            if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
              git -C "$GITHUB_WORKSPACE" commit -m 'diagnostics(moises-l4): persist W57 Swift failure summary'
              git -C "$GITHUB_WORKSPACE" push origin HEAD:moises/wp4-analysis-platform
            fi
          fi

          exit "$status"
