name: Moises L4 W57 Recovery Once

on:
  push:
    branches:
      - moises/wp4-analysis-platform
    paths:
      - '.github/workflows/moises-l4-w57-recovery-once.yml'

permissions:
  contents: read

jobs:
  validate-recovered-l4:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moises/wp4-analysis-platform

      - name: Validate exact worker package under Swift 6.0.3
        working-directory: tech-assets/moises-audio
        run: |
          swift --version
          swift test --parallel
