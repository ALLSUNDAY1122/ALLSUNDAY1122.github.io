name: Moises L4 W57 Recovery Once

on:
  push:
    branches:
      - moises/wp4-analysis-platform
    paths:
      - '.github/workflows/moises-l4-w57-recovery-once.yml'
      - 'tech-assets/moises-audio/Package.swift'
      - 'tech-assets/moises-audio/Analysis/**'
      - 'tech-assets/moises-audio/iOS/HostCore/**'
      - 'tech-assets/moises-audio/Tests/MoisesAudioCoreTests/**'

permissions:
  contents: write

jobs:
  validate-recovered-l4:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moises/wp4-analysis-platform
          fetch-depth: 0

      - name: Apply isolated Swift 6 test compile repairs
        working-directory: tech-assets/moises-audio
        run: |
          diagnostic_dir="$GITHUB_WORKSPACE/automation/chatgpt-dispatcher/moises-equivalence/recovery"
          repair_log="$diagnostic_dir/L4-W57_REPAIR_SCRIPT.txt"
          patch_file="$diagnostic_dir/L4-W57_PROPOSED_PATCH.diff"
          mkdir -p "$diagnostic_dir"
          : > "$repair_log"
          : > "$patch_file"

          parity_test='Tests/MoisesAudioCoreTests/AnalysisRealAudioParityAdjudicationTests.swift'
          chunked_test='Tests/MoisesAudioCoreTests/AnalysisChunkedInputPipelineTests.swift'
          p021_test='Tests/MoisesAudioCoreTests/AnalysisP021PhysicalEvidenceAdjudicationTests.swift'
          chord_test='Tests/MoisesAudioCoreTests/ChordVocabularyHardeningTests.swift'

          run_repair() {
            label="$1"
            shift
            set +e
            "$@"
            rc=$?
            set -e
            echo "$label rc=$rc" | tee -a "$repair_log"
          }

          run_repair parity sed -i 's/expectedCaptureSetSHA256: overrideCaptureRoot ?? (try AnalysisAnalysisParityAdjudicationRoot\.stableSHA256(captureSet))/expectedCaptureSetSHA256: try (overrideCaptureRoot ?? AnalysisAnalysisParityAdjudicationRoot.stableSHA256(captureSet))/g' "$parity_test"
          run_repair chunked sed -i 's/result\.inputDiagnostics/result.diagnostics/g; s/chunked\.inputDiagnostics/chunked.diagnostics/g' "$chunked_test"
          run_repair p021-w44 sed -i 's/w44CheckpointCertificateRootSHA256: checkpointRoot ?? checkpointCertificate\.declaredCertificateRootSHA256/w44CheckpointCertificateRootSHA256: try (checkpointRoot ?? checkpointCertificate.declaredCertificateRootSHA256)/g' "$p021_test"
          run_repair p021-w42 sed -i 's/w42AnchorReceiptRootSHA256: anchorRoot ?? anchorReceipt\.declaredAnchorReceiptRootSHA256/w42AnchorReceiptRootSHA256: try (anchorRoot ?? anchorReceipt.declaredAnchorReceiptRootSHA256)/g' "$p021_test"
          run_repair p021-w41 sed -i 's/w41TransferRootSHA256: transferRoot ?? transfer\.declaredTransferRootSHA256/w41TransferRootSHA256: try (transferRoot ?? transfer.declaredTransferRootSHA256)/g' "$p021_test"
          run_repair chord sed -i 's/events\.first?\.startSeconds/events.first?.startSeconds ?? .nan/g; s/events\.last?\.endSeconds/events.last?.endSeconds ?? .nan/g' "$chord_test"

          {
            echo
            echo '=== POST-REPAIR TARGET LINES ==='
            grep -nF 'expectedCaptureSetSHA256:' "$parity_test" | tail -n 5 || true
            grep -nE 'result\.(inputDiagnostics|diagnostics)|chunked\.(inputDiagnostics|diagnostics)' "$chunked_test" || true
            grep -nE 'w44CheckpointCertificateRootSHA256:|w42AnchorReceiptRootSHA256:|w41TransferRootSHA256:' "$p021_test" | tail -n 12 || true
            grep -nE 'events\.(first|last)' "$chord_test" | head -n 10 || true
          } | tee -a "$repair_log"

          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          set +e
          git -C "$GITHUB_WORKSPACE" diff -- \
            "tech-assets/moises-audio/$parity_test" \
            "tech-assets/moises-audio/$chunked_test" \
            "tech-assets/moises-audio/$p021_test" \
            "tech-assets/moises-audio/$chord_test" \
            > "$patch_file" 2>> "$repair_log"
          diff_rc=$?
          set -e
          echo "git_diff rc=$diff_rc" | tee -a "$repair_log"
          cat "$patch_file" || true
          cat "$repair_log"

      - name: Run exact worker SwiftPM and materialize diagnostics
        id: swiftpm
        working-directory: tech-assets/moises-audio
        run: |
          swift --version
          set +e
          swift test --parallel > /tmp/l4-w57-swift-test.log 2>&1
          status=$?
          set -e

          diagnostic_dir="$GITHUB_WORKSPACE/automation/chatgpt-dispatcher/moises-equivalence/recovery"
          diagnostic="$diagnostic_dir/L4-W57_SWIFTPM_DIAGNOSTIC.txt"
          full_log="$diagnostic_dir/L4-W57_SWIFTPM_FULL_LOG.txt"
          mkdir -p "$diagnostic_dir"
          cp /tmp/l4-w57-swift-test.log "$full_log"
          {
            echo "L4-W57 exact Worker-branch SwiftPM diagnostic"
            echo "head_sha=$GITHUB_SHA"
            echo "swift_test_status=$status"
            echo
            echo "=== FIRST ERROR-LIKE LINES ==="
            grep -nE 'error:|fatal error:|FAIL|failed' /tmp/l4-w57-swift-test.log | head -n 300 || true
            echo
            echo "=== LOG TAIL (last 500 lines) ==="
            tail -n 500 /tmp/l4-w57-swift-test.log || true
          } > "$diagnostic"

          cat "$diagnostic"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload W57 SwiftPM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-w57-swiftpm-diagnostic
          path: |
            automation/chatgpt-dispatcher/moises-equivalence/recovery/L4-W57_REPAIR_SCRIPT.txt
            automation/chatgpt-dispatcher/moises-equivalence/recovery/L4-W57_SWIFTPM_DIAGNOSTIC.txt
            automation/chatgpt-dispatcher/moises-equivalence/recovery/L4-W57_SWIFTPM_FULL_LOG.txt
            automation/chatgpt-dispatcher/moises-equivalence/recovery/L4-W57_PROPOSED_PATCH.diff
          if-no-files-found: error
          retention-days: 7

      - name: Persist verified W57 test compile repairs
        if: steps.swiftpm.outputs.status == '0'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git config user.name 'chatgpt-l4-recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tech-assets/moises-audio/Tests/MoisesAudioCoreTests/AnalysisRealAudioParityAdjudicationTests.swift \
            tech-assets/moises-audio/Tests/MoisesAudioCoreTests/AnalysisChunkedInputPipelineTests.swift \
            tech-assets/moises-audio/Tests/MoisesAudioCoreTests/AnalysisP021PhysicalEvidenceAdjudicationTests.swift \
            tech-assets/moises-audio/Tests/MoisesAudioCoreTests/ChordVocabularyHardeningTests.swift
          if ! git diff --cached --quiet; then
            git commit -m 'fix(moises-l4): repair Swift 6 test compatibility for W57'
            git push origin HEAD:moises/wp4-analysis-platform
          fi

      - name: Enforce SwiftPM result
        if: always()
        run: |
          status='${{ steps.swiftpm.outputs.status }}'
          if [ -z "$status" ]; then
            echo 'SwiftPM status was not produced.' >&2
            exit 2
          fi
          exit "$status"
