name: Moises L4 W57 Recovery Once

on:
  push:
    branches:
      - moises/wp4-analysis-platform
    paths:
      - '.github/workflows/moises-l4-w57-recovery-once.yml'
      - 'tech-assets/moises-audio/Package.swift'
      - 'tech-assets/moises-audio/Analysis/**'
      - 'tech-assets/moises-audio/iOS/HostCore/**'
      - 'tech-assets/moises-audio/Tests/MoisesAudioCoreTests/**'

permissions:
  contents: write

jobs:
  validate-recovered-l4:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moises/wp4-analysis-platform
          fetch-depth: 0

      - name: Validate exact worker package and persist diagnostics
        working-directory: tech-assets/moises-audio
        run: |
          swift --version
          set +e
          swift test --parallel > /tmp/l4-w57-swift-test.log 2>&1
          status=$?
          set -e
          cat /tmp/l4-w57-swift-test.log
          if [ "$status" -ne 0 ]; then
            log="../../automation/chatgpt-dispatcher/moises-equivalence/recovery/l4-w57-swift-test.log"
            cp /tmp/l4-w57-swift-test.log "$log"
            git config user.name 'chatgpt-l4-recovery'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$log"
            git commit -m 'diagnostics(moises-l4): persist W57 Swift compile failure'
            git push origin HEAD:moises/wp4-analysis-platform
          fi
          exit "$status"
