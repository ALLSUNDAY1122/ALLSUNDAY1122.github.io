name: HM2 IAP Price Once

on:
  push:
    paths:
      - 'automation/hm2-iap-price-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure HM2 IAP prices
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/hm2_configure_iap_prices.py
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hm2-iap-price-result-${{ github.run_id }}
          path: hm2-iap-price-result.json
          if-no-files-found: warn
          retention-days: 7
