name: Temporary Generate 294 20260722

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-294-20260722.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-294-20260722-0801
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public data
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('284自治体') != 2:
              raise SystemExit(f'unexpected 284 count: {s.count("284自治体")}')
          s=s.replace('284自治体','294自治体')
          p.write_text(s,encoding='utf-8')
          PY
          node ./scripts/validate-data.mjs --require-generated
          test "$(node -e "const d=require('./data/generated/municipalities.json'); console.log(Array.isArray(d)?d.length:d.municipalities.length)")" -eq 294
          cd ..
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/progress.json | sort)
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git commit -m '生成更新: 公開データを294自治体へ同期'
          git push origin coord/generated-294-20260722-0801
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-generate-294-20260722.yml ]; then
            git rm .github/workflows/temp-generate-294-20260722.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '統括管理: 公開294自治体生成一時ワークフローを削除'
            git push origin main
          fi
