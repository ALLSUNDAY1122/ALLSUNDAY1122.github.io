name: Temporary Central A Housing Batch 22 Public Verification V2

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch22-public-v2-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch22-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';

          const unavailable = '子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const targets = [
            {code:'27205', name:'吹田市', status:'verified', summary:'令和8年度の市営住宅募集で、新婚・子育て・ひとり親世帯向けの専用枠2戸を設ける。第1回募集は終了している。', source:'https://www.city.suita.osaka.jp/shisei/1018880/1018881/1041420/1044195/1044204.html'},
            {code:'27206', name:'泉大津市', status:'unavailable', summary:unavailable, source:'https://www.city.izumiotsu.lg.jp/hojyokin/shiminmukehozyo/11882.html'},
            {code:'27208', name:'貝塚市', status:'verified', summary:'39歳以下・合計所得500万円未満の新婚世帯へ、令和8年度の住宅取得・賃借・リフォーム・引越費用を上限30万円または60万円補助し、居住誘導区域内は10万円を加算する。', source:'https://www.city.kaizuka.lg.jp/kakuka/kodomo/kosodate/topics/kaizukashikekkonsinseikatusienhojyokin.html'},
            {code:'27210', name:'枚方市', status:'verified', summary:'合計所得500万円未満の新婚夫婦等へ、令和8年度の住宅取得・賃借・所有住宅のリフォーム・引越費用を上限30万円補助する。', source:'https://www.city.hirakata.osaka.jp/0000011510.html'},
            {code:'27211', name:'茨木市', status:'verified', summary:'中学生以下の子がいる子育て世帯または40歳未満の若年世帯等が、市内の親族と近居・同居する住宅取得・リフォーム費用を上限30万円補助する。', source:'https://www.city.ibaraki.osaka.jp/hojokin_joseikin/kurashi/sumai_koen/56544.html'}
          ];
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          let finalResult = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const nonce = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const url = `${base}/municipality/${target.code}/?audit=${nonce}`;
                const response = await fetch(url, {headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch22Audit/2.0'}});
                const html = await response.text();
                const sourceMatches = html.includes(target.source) || html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches = html.includes(target.summary);
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,success:response.status===200&&sourceMatches&&summaryMatches});
              } catch (error) {
                pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});
              }
            }
            let jsonCheck = {success:false};
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`, {headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch22Audit/2.0'}});
              const payload = await response.json();
              const municipalities = Array.isArray(payload) ? payload : (payload.municipalities || []);
              const records = targets.map(target => {
                const municipality = municipalities.find(item => item.code === target.code);
                const service = municipality?.services?.housingSupport;
                const success = Boolean(municipality) && service?.status === target.status && service?.summary === target.summary && service?.source?.url === target.source;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success};
              });
              const serviceCount = municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck = {httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(item=>item.success)};
            } catch (error) {
              jsonCheck = {error:String(error),success:false};
            }
            finalResult = {attempt,pageChecks,jsonCheck,success:pageChecks.every(item=>item.success)&&jsonCheck.success};
            if (finalResult.success) break;
            await sleep(10000);
          }
          const evidence = {schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch22-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3815,nationalSyncPullRequest:3817,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:1,expectedVerifiedCount:4,...finalResult,releaseBlocker:finalResult.success?'none':'public_verification_failed'};
          const outPath = 'jichitai-compare/operations/audits/central-a-housing-classification-batch22-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath), {recursive:true});
          fs.writeFileSync(outPath, JSON.stringify(evidence,null,2)+'\n');
          for (const trigger of [
            'jichitai-compare/operations/control/central-a-housing-batch22-public-trigger-20260726.json',
            'jichitai-compare/operations/control/central-a-housing-batch22-public-v2-trigger-20260726.json'
          ]) if (fs.existsSync(trigger)) fs.rmSync(trigger);
          if (!finalResult.success) throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第22群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
