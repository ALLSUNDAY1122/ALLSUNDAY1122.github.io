name: Temporary West-A Soft Warning Correction

on:
  pull_request:
    paths:
      - '.github/workflows/temp-west-a-soft-warning-correction.yml'
      - 'jichitai-compare/scripts/apply-west-a-soft-warning-correction.mjs'
      - 'jichitai-compare/data/municipalities/33/33643.json'
      - 'jichitai-compare/operations/tasks/33643.json'
      - 'jichitai-compare/operations/audits/west-a-source-link-soft-warning-review-20260725.json'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'fix/west-a-soft-warning-nishiawakura-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply correction and audit record
        working-directory: jichitai-compare
        run: node scripts/apply-west-a-soft-warning-correction.mjs

      - name: Remove temporary files and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-west-a-soft-warning-correction.yml
          git rm jichitai-compare/scripts/apply-west-a-soft-warning-correction.mjs
          git add \
            jichitai-compare/data/municipalities/33/33643.json \
            jichitai-compare/operations/tasks/33643.json \
            jichitai-compare/operations/audits/west-a-source-link-soft-warning-review-20260725.json
          git commit -m 'fix: 西粟倉村の幼稚園保育料を現行無償案内へ訂正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate corrected regional data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
