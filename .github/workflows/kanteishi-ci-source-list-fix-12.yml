name: Kanteishi CI Source List Fix

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-ci-source-list-fix-12.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0
      - name: Add access policy to explicit Swift typecheck
        run: |
          python3 -c "from pathlib import Path; p=Path('.github/workflows/kanteishi-shortanswer-12.yml'); s=p.read_text(); n='            kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/PremiumPurchaseStore.swift \\\\n'; r=n+'            kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/LearningAccessPolicy.swift \\\\n'; assert n in s; p.write_text(s.replace(n,r,1))"
      - name: Commit exact CI fix
        run: |
          rm .github/workflows/kanteishi-ci-source-list-fix-12.yml
          grep -Fq 'KanteishiShortAnswer/LearningAccessPolicy.swift' .github/workflows/kanteishi-shortanswer-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(#12): typecheck access policy source'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
