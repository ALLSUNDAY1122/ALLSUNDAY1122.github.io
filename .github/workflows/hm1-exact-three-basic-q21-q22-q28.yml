name: HM1 basic Q21 Q22 Q28 exact three regeneration
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - 'ios/health-manager-1/Resources/questions.json'
      - '.github/workflows/hm1-exact-three-basic-q21-q22-q28.yml'
  workflow_dispatch:
jobs:
  exact-three:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and compare both full banks
        shell: bash
        run: |
          set -euo pipefail
          BASE=a5a360f78038293070a1d8cf248d7ae97f5fba33
          git worktree add --detach /tmp/hm1-q21-old "$BASE"
          git worktree add --detach /tmp/hm1-q21-new HEAD
          (cd /tmp/hm1-q21-old && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q21-old.log)
          (cd /tmp/hm1-q21-new && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q21-new.log)
          python3 - <<'PY'
          import json,unicodedata
          from pathlib import Path
          rel='ios/health-manager-1/Resources/questions.json'
          a=json.loads((Path('/tmp/hm1-q21-old')/rel).read_text())
          b=json.loads((Path('/tmp/hm1-q21-new')/rel).read_text())
          target={'2026-04-Q21','2026-04-Q22','2026-04-Q28'}
          assert len(a)==len(b)==264,(len(a),len(b))
          assert [q['id'] for q in a]==[q['id'] for q in b],'ID/order changed'
          norm=lambda s:''.join(c for c in unicodedata.normalize('NFKC',s).casefold() if not c.isspace())
          assert len({q['id'] for q in b})==264,'duplicate IDs'
          assert len({norm(q['stem']) for q in b})==264,'duplicate stems'
          diffs={x['id'] for x,y in zip(a,b) if x!=y}
          assert diffs==target,{'actual':sorted(diffs),'expected':sorted(target)}
          for x,y in zip(a,b):
              if x['id'] not in target:assert x==y,x['id']
              assert len(y['choices'])==5,y['id']
              assert len({norm(s) for s in y['choices']})==5,y['id']
              assert type(y['ans']) is int and 0<=y['ans']<5,y['id']
              if y['id'] in target:
                  assert y['ans']=={'2026-04-Q21':1,'2026-04-Q22':2,'2026-04-Q28':1}[y['id']]
                  assert y['short'] and y['detail'] and y['auditSourceURL']
          print('PASS: both 264; Q21 Q22 Q28 only changed; other 261 identical')
          PY
