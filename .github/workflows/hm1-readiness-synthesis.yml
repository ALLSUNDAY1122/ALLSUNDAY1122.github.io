name: HM1 TestFlight Readiness Synthesis

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  synthesize:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[HM1-READINESS]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWN_VISUAL_PASS_SHA: 220a590eb55bd0b49be00f1e370fa6219b2cbbb0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prove no HM1 visual/product drift since visual PASS
        run: |
          set -euo pipefail
          git cat-file -e "$KNOWN_VISUAL_PASS_SHA^{commit}"
          changed="$(git diff --name-only "$KNOWN_VISUAL_PASS_SHA..HEAD" -- \
            ios/health-manager-1 \
            apps/sanitary-manager-1 \
            apps/sanitary-manager-2 \
            scripts/audit_hm1_product_preflight.py \
            scripts/audit_hm1_human_gate.py \
            scripts/audit_hm1_release_contract.py)"
          if [ -n "$changed" ]; then
            echo 'HM1 visual/product drift after known Visual Gate PASS:' >&2
            echo "$changed" >&2
            exit 1
          fi
          echo "PASS: no HM1 visual/product drift since $KNOWN_VISUAL_PASS_SHA"
      - name: Re-materialize and audit current release product
        env:
          HM1_PRODUCT_ONLY: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp
          python -m pip install --disable-pip-version-check Pillow
          bash ios/health-manager-1/prepare-ios.sh
          python3 scripts/audit_hm1_product_preflight.py
          python3 scripts/audit_hm1_human_gate.py
          python3 scripts/audit_hm1_release_contract.py
      - name: Fresh ASC release readback
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          from scripts.app_store_connect_api import api_get, load_private_key, make_token
          key, cleanup = load_private_key()
          try:
              token = make_token(__import__('os').environ['ASC_ISSUER_ID'], __import__('os').environ['ASC_KEY_ID'], key)
              _, versions = api_get(token, '/v1/apps/6799581662/appStoreVersions?filter[platform]=IOS&limit=20')
              _, iap = api_get(token, '/v2/inAppPurchases/6799583540')
          finally:
              if cleanup: cleanup.unlink(missing_ok=True)
          rows = versions.get('data') or []
          assert any((x.get('attributes') or {}).get('versionString') == '1.0' and (x.get('attributes') or {}).get('appStoreState') == 'PREPARE_FOR_SUBMISSION' for x in rows), rows
          attrs = (iap.get('data') or {}).get('attributes') or {}
          assert attrs.get('productId') == 'jp.allsunday1122.healthmanager1.lifetime', attrs
          assert attrs.get('state') == 'READY_TO_SUBMIT', attrs
          print('PASS: fresh ASC HM1 version and Lifetime IAP readback')
          PY
      - name: Mark TestFlight readiness PASS with evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, datetime
          p=Path('automation/hm1-testflight-readiness.json')
          data={
            'ready': True,
            'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'product_sha': '${{ github.sha }}',
            'visual_pass_sha': '220a590eb55bd0b49be00f1e370fa6219b2cbbb0',
            'evidence': [
              'no_visual_or_product_drift_since_visual_pass',
              'release_contract',
              'learning_acceptance_and_storekit_product_preflight',
              'human_gate_regression',
              'fresh_asc_version_1_0_prepare_for_submission',
              'fresh_asc_lifetime_iap_ready_to_submit'
            ]
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/hm1-testflight-readiness.json
          git diff --cached --exit-code && { echo 'Readiness already current'; exit 0; } || true
          git commit -m 'release(hm1): mark TestFlight readiness after fresh gates'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body:`HM1 readiness synthesis finished. status=${{ job.status }}; run_id=${context.runId}`});
