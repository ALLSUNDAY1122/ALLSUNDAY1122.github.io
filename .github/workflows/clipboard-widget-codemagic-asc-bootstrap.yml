name: Clipboard Widget Codemagic ASC Bootstrap

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-codemagic-asc-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Codemagic ASC record bootstrap workflow
        run: |
          set -euo pipefail
          python3 scripts/clipboard_widget_patch_asc_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'ci: broaden clipboard ASC credential alias probe' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Trigger Codemagic ASC record bootstrap and wait
        id: record
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-asc-record-bootstrap-20260829-r4","action":"build","workflow_id":"clipboard-widget-asc-record-bootstrap","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":2400,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-record-command.json
          python3 scripts/codemagic_build_gateway.py --command /tmp/cm-record-command.json --output /tmp/cm-record-result.json

      - name: Persist safe ASC bootstrap evidence
        if: always()
        run: |
          set -euo pipefail
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          python3 scripts/clipboard_widget_persist_cm_result.py --input /tmp/cm-record-result.json --output automation/clipboard-widget/evidence/asc-record-bootstrap-result.json --recover-diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence
          git commit -m 'chore: record clipboard ASC bootstrap evidence r4' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Trigger TestFlight build after app record creation
        id: tf
        if: steps.record.outcome == 'success'
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-phase0-testflight-20260829-r10","action":"build","workflow_id":"clipboard-widget-phase0","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":4200,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-tf-command.json
          python3 scripts/codemagic_build_gateway.py --command /tmp/cm-tf-command.json --output /tmp/cm-tf-result.json

      - name: Persist TestFlight retry result
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/cm-tf-result.json ]]; then exit 0; fi
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          python3 scripts/clipboard_widget_persist_cm_result.py --input /tmp/cm-tf-result.json --output automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git commit -m 'chore: record clipboard TestFlight retry r10' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Enforce ASC record creation
        if: steps.record.outcome != 'success'
        run: exit 1

      - name: Enforce TestFlight upload
        if: steps.record.outcome == 'success' && steps.tf.outcome != 'success'
        run: exit 1
