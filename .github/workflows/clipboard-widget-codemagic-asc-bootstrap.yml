name: Clipboard Widget Codemagic ASC Bootstrap

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-codemagic-asc-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add one-off Codemagic ASC record bootstrap workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          marker='\n  clipboard-widget-asc-record-bootstrap:\n'
          if marker in s:
              print('bootstrap workflow already present')
              raise SystemExit(0)
          block=r'''
  clipboard-widget-asc-record-bootstrap:
    name: Clipboard Widget - Create App Store Connect Record
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.clipboardwidget
        APP_NAME: クリップボードWidget
        APP_SKU: clipboard-widget-20260827
      xcode: latest
    scripts:
      - name: Create App Store Connect record with stored Apple web credentials
        script: |
          set -euo pipefail
          DIAG="$CM_BUILD_DIR/clipboard-widget-asc-record-bootstrap.log"
          : > "$DIAG"
          exec > >(tee -a "$DIAG") 2>&1
          echo 'STAGE credential-probe'
          USERNAME="${FASTLANE_USER:-${APPLE_ID:-${APP_STORE_CONNECT_USERNAME:-}}}"
          PASSWORD="${FASTLANE_PASSWORD:-${APPLE_ID_PASSWORD:-}}"
          SESSION="${FASTLANE_SESSION:-}"
          echo "has_username=$([[ -n "$USERNAME" ]] && echo true || echo false)"
          echo "has_password=$([[ -n "$PASSWORD" ]] && echo true || echo false)"
          echo "has_session=$([[ -n "$SESSION" ]] && echo true || echo false)"
          if [[ -z "$USERNAME" || ( -z "$PASSWORD" && -z "$SESSION" ) ]]; then
            echo 'BLOCKED: no stored Apple web-login credential/session usable by fastlane produce'
            exit 44
          fi
          echo 'STAGE fastlane'
          if ! command -v fastlane >/dev/null 2>&1; then
            gem install fastlane --no-document
          fi
          export FASTLANE_USER="$USERNAME"
          export FASTLANE_PASSWORD="$PASSWORD"
          export FASTLANE_SESSION="$SESSION"
          export FASTLANE_SKIP_UPDATE_CHECK=1
          export FASTLANE_HIDE_CHANGELOG=1
          export FASTLANE_DISABLE_COLORS=1
          RAW="$CM_BUILD_DIR/clipboard-widget-produce-raw.log"
          set +e
          fastlane produce \
            --username "$USERNAME" \
            --app_identifier "$BUNDLE_ID" \
            --app_name "$APP_NAME" \
            --sku "$APP_SKU" \
            --language 'ja-JP' \
            --platform ios \
            --skip_devcenter true \
            >"$RAW" 2>&1
          STATUS=$?
          set -e
          python3 - <<'PYSAN'
          from pathlib import Path
          import os,re
          src=Path(os.environ['CM_BUILD_DIR'])/'clipboard-widget-produce-raw.log'
          dst=Path(os.environ['CM_BUILD_DIR'])/'clipboard-widget-produce-safe.log'
          raw=src.read_text(errors='replace') if src.exists() else ''
          raw=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[REDACTED EMAIL]', raw)
          raw=re.sub(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----', '[REDACTED PEM]', raw, flags=re.S)
          raw=re.sub(r'eyJ[A-Za-z0-9._-]{20,}', '[REDACTED JWT]', raw)
          raw=re.sub(r'(?i)(session|cookie|password|token)(\s*[=:]\s*)\S+', r'\1\2[REDACTED]', raw)
          dst.write_text(raw[-20000:])
          PYSAN
          cat "$CM_BUILD_DIR/clipboard-widget-produce-safe.log"
          rm -f "$RAW"
          exit "$STATUS"
    artifacts:
      - clipboard-widget-asc-record-bootstrap.log
      - clipboard-widget-produce-safe.log
'''
          p.write_text(s.rstrip()+block+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'ci: add clipboard ASC record bootstrap workflow' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Trigger Codemagic ASC record bootstrap and wait
        id: record
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-asc-record-bootstrap-20260829-r1","action":"build","workflow_id":"clipboard-widget-asc-record-bootstrap","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":2400,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-record-command.json
          python scripts/codemagic_build_gateway.py --command /tmp/cm-record-command.json --output /tmp/cm-record-result.json

      - name: Recover safe Codemagic record diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/cm-record-artifact automation/clipboard-widget/evidence
          if [[ -f /tmp/cm-record-result.json ]]; then
            python3 - <<'PY'
          import json, pathlib, urllib.request, zipfile, io
          src=pathlib.Path('/tmp/cm-record-result.json')
          r=json.loads(src.read_text())
          keep={k:r.get(k) for k in ('request_id','ok','workflow_id','branch','build_id','status','app_id','error','build_details')}
          pathlib.Path('automation/clipboard-widget/evidence/asc-record-bootstrap-result.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2)+'\n')
          arts=((r.get('build_details') or {}).get('artifacts') or [])
          bundle=next((a for a in arts if a.get('type')=='bundle' and a.get('short_lived_download_url')),None)
          if bundle:
              data=urllib.request.urlopen(bundle['short_lived_download_url'],timeout=60).read()
              z=zipfile.ZipFile(io.BytesIO(data))
              for name in z.namelist():
                  if name.endswith('clipboard-widget-asc-record-bootstrap.log') or name.endswith('clipboard-widget-produce-safe.log'):
                      out=pathlib.Path('automation/clipboard-widget/evidence')/pathlib.Path(name).name
                      out.write_bytes(z.read(name))
          PY
          fi
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          # Restore generated evidence after reset from temp copies.
          mkdir -p automation/clipboard-widget/evidence
          if [[ -f /tmp/cm-record-result.json ]]; then
            python3 - <<'PY'
          import json, pathlib, urllib.request, zipfile, io
          r=json.loads(pathlib.Path('/tmp/cm-record-result.json').read_text())
          keep={k:r.get(k) for k in ('request_id','ok','workflow_id','branch','build_id','status','app_id','error','build_details')}
          pathlib.Path('automation/clipboard-widget/evidence/asc-record-bootstrap-result.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2)+'\n')
          arts=((r.get('build_details') or {}).get('artifacts') or [])
          bundle=next((a for a in arts if a.get('type')=='bundle' and a.get('short_lived_download_url')),None)
          if bundle:
              data=urllib.request.urlopen(bundle['short_lived_download_url'],timeout=60).read()
              z=zipfile.ZipFile(io.BytesIO(data))
              for name in z.namelist():
                  if name.endswith('clipboard-widget-asc-record-bootstrap.log') or name.endswith('clipboard-widget-produce-safe.log'):
                      (pathlib.Path('automation/clipboard-widget/evidence')/pathlib.Path(name).name).write_bytes(z.read(name))
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence
          git commit -m 'chore: record clipboard ASC bootstrap evidence' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Trigger TestFlight build after app record creation
        id: tf
        if: steps.record.outcome == 'success'
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-phase0-testflight-20260829-r8","action":"build","workflow_id":"clipboard-widget-phase0","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":4200,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-tf-command.json
          python scripts/codemagic_build_gateway.py --command /tmp/cm-tf-command.json --output /tmp/cm-tf-result.json

      - name: Persist TestFlight retry result
        if: always() && steps.tf.outcome != 'skipped'
        run: |
          set -euo pipefail
          test -f /tmp/cm-tf-result.json || exit 0
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          mkdir -p automation/clipboard-widget/evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cm-tf-result.json').read_text())
          keep={k:r.get(k) for k in ('request_id','ok','workflow_id','branch','build_id','status','app_id','error','build_details')}
          Path('automation/clipboard-widget/evidence/codemagic-phase0-testflight.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git commit -m 'chore: record clipboard TestFlight retry r8' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Enforce ASC record creation
        if: steps.record.outcome != 'success'
        run: exit 1

      - name: Enforce TestFlight upload
        if: steps.record.outcome == 'success' && steps.tf.outcome != 'success'
        run: exit 1
