name: TAKU CALC Upload App Store Screenshots

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  upload:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[TAKU-ASC] Upload screenshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse request and download screenshot artifact
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          d=json.loads(os.environ['ISSUE_BODY'])
          required={'request_id','artifact_url','source_sha'}
          if set(d) != required:
              raise SystemExit('Unexpected request fields')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,100}', d['request_id']):
              raise SystemExit('Invalid request_id')
          if not d['artifact_url'].startswith('https://'):
              raise SystemExit('artifact_url must be https')
          if not re.fullmatch(r'[0-9a-f]{40}', d['source_sha']):
              raise SystemExit('Invalid source_sha')
          Path('/tmp/request.json').write_text(json.dumps(d), encoding='utf-8')
          PY
          URL=$(python3 -c "import json;print(json.load(open('/tmp/request.json'))['artifact_url'])")
          curl --fail --location --retry 2 "$URL" -o /tmp/taku-screenshot-artifact.zip
          rm -rf /tmp/taku-shot
          mkdir -p /tmp/taku-shot
          unzip -q /tmp/taku-screenshot-artifact.zip -d /tmp/taku-shot
          mapfile -t IMAGES < <(find /tmp/taku-shot -type f -iname '*.png' | sort)
          test "${#IMAGES[@]}" -eq 3
          printf '%s\n' "${IMAGES[@]}" > /tmp/taku-image-list.txt
          python3 - <<'PY'
          import struct
          from pathlib import Path
          images=[Path(x) for x in Path('/tmp/taku-image-list.txt').read_text().splitlines()]
          if len(images) != 3:
              raise SystemExit(f'Expected 3 PNGs, got {len(images)}')
          for p in images:
              raw=p.read_bytes()
              if len(raw) < 40000 or raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid or unexpectedly small PNG: {p}')
              w,h=struct.unpack('>II', raw[16:24])
              print(f'{p.name}: {w}x{h}, bytes={len(raw)}')
              if (w,h) != (1242,2688):
                  raise SystemExit(f'Unexpected APP_IPHONE_65 dimensions for {p.name}: {w}x{h}')
          PY

      - name: Upload all screenshots to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ASC_ISSUER_ID:-}"
          test -n "${ASC_KEY_ID:-}"
          test -n "${ASC_PRIVATE_KEY:-}"
          mapfile -t IMAGES < /tmp/taku-image-list.txt
          python3 scripts/app2_011_upload_screenshot.py \
            --image "${IMAGES[0]}" \
            --image "${IMAGES[1]}" \
            --image "${IMAGES[2]}" \
            --output /tmp/taku-screenshot-upload-result.json

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taku-asc-screenshot-${{ github.run_id }}
          path: /tmp/taku-screenshot-upload-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let extra = '';
            try {
              const d = JSON.parse(fs.readFileSync('/tmp/taku-screenshot-upload-result.json', 'utf8'));
              extra = `; complete_count=${d.complete_count}; display_type=${d.display_type}`;
            } catch (_) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `TAKU screenshot upload status=${{ job.status }}; run_id=${context.runId}${extra}`
            });
