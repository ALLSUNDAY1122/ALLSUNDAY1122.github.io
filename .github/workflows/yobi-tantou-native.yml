name: Yobi Tantou Native iOS

on:
  pull_request:
    paths:
      - 'learning-sprint/yobi-tantou/**'
      - '.github/workflows/yobi-tantou-native.yml'
  workflow_dispatch:

concurrency:
  group: yobi-tantou-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native source contract
        run: python learning-sprint/yobi-tantou/audit_native.py
      - name: Candidate question preflight self-test
        run: python learning-sprint/yobi-tantou/content-loop/validate_candidates.py --self-test

  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: learning-sprint/yobi-tantou/ios
        run: xcodegen generate
      - name: XCTest and XCUITest on available iOS Simulator
        working-directory: learning-sprint/yobi-tantou/ios
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo 'No available iPhone Simulator found.' >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iOS Simulator: $DEVICE_ID"
          xcodebuild test \
            -project YobiTantouSprint.xcodeproj \
            -scheme YobiTantouSprint \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            YOBI_BUNDLE_ID=jp.ci.yobi.preview \
            YOBI_TEST_BUNDLE_ID=jp.ci.yobi.preview.tests \
            YOBI_UI_TEST_BUNDLE_ID=jp.ci.yobi.preview.uitests \
            | xcpretty
