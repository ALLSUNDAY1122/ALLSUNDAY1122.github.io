name: Temporary North A Shichinohe Summary Cleanup

on:
  pull_request:
    branches:
      - region/north
    paths:
      - jichitai-compare/operations/control/north-a-shichinohe-summary-cleanup-trigger-20260725.json

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/north-a-shichinohe-summary-cleanup-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove internal wording
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path('jichitai-compare')
          stamp = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0).isoformat()
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pr = event['pull_request']['number']

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          municipality_path = root / 'data/municipalities/02/02402.json'
          municipality = load(municipality_path)
          municipality['summary'] = '対象9制度を七戸町公式情報で確認済み。高校3年生相当までの医療費助成、病児・病後児保育、0～2歳児を含む保育料無償化、小中学校給食費無料化、産後ケア等を実施している。'
          save(municipality_path, municipality)

          task_path = root / 'operations/tasks/02402.json'
          task = load(task_path)
          note = '公開要約に残っていた内部作業文言「北日本調査班」を削除し、利用者向け表現へ修正。'
          if note not in task.setdefault('notes', []):
              task['notes'].append(note)
          task['lastUpdatedAt'] = stamp
          save(task_path, task)

          audit_path = root / 'operations/audits/north-a-quality-audit-2-20260725.json'
          audit = load(audit_path)
          followup = audit.setdefault('postCompletionFollowup', {})
          followup.update({
              'publicationHygieneCheckedAt': stamp,
              'publicationHygieneCorrection': '02402自治体summaryから内部作業文言を削除',
              'publicationHygieneRegionPullRequest': pr
          })
          audit['nextAction'] = '七戸町の公開要約修正をregion/northへ統合後、main同期と公開確認を再実行する。'
          save(audit_path, audit)

          checkpoint_path = root / 'operations/control/session-checkpoints/north-a.json'
          checkpoint = load(checkpoint_path)
          checkpoint['updatedAt'] = stamp
          checkpoint['pullRequestNumber'] = pr
          checkpoint['ciStatus'] = 'pending'
          checkpoint['nextAction'] = '七戸町の公開要約から内部文言を除去し、main同期を再実行する。'
          save(checkpoint_path, checkpoint)
          PY

      - name: Regenerate and validate regional outputs
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove trigger
        run: rm -f jichitai-compare/operations/control/north-a-shichinohe-summary-cleanup-trigger-20260725.json

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jichitai-compare
          git commit -m 'fix: 七戸町公開要約から内部作業文言を削除'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
