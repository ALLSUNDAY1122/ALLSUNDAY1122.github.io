name: Temporary Build North West Releases 1612

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-north-west-releases-1612.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed snapshots from municipalities absent on main
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/west:refs/remotes/origin/region/west' \
            '+refs/heads/coord/north-release-10-20260722-1612:refs/remotes/origin/coord/north-release-10-20260722-1612' \
            '+refs/heads/coord/west-release-10-20260722-1612:refs/remotes/origin/coord/west-release-10-20260722-1612'

          python3 - <<'PY'
          import json,re,subprocess
          def missing(region, pref_ok):
              ref=f'origin/region/{region}'
              paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              codes=[]
              for path in paths:
                  m=re.search(r'/(\d{5})\.json$',path)
                  if not m: continue
                  data=json.loads(subprocess.check_output(['git','show',f'{ref}:{path}'],text=True))
                  if not pref_ok(int(data['prefectureCode'])): continue
                  exists=subprocess.run(['git','cat-file','-e',f'origin/main:{path}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
                  if not exists: codes.append(data['code'])
              return sorted(codes)
          north=missing('north',lambda n:1<=n<=7)
          west=missing('west',lambda n:31<=n<=47)
          print('north',north)
          print('west',west)
          if len(north)!=10: raise SystemExit(f'north missing count {len(north)} != 10')
          if len(west)!=10: raise SystemExit(f'west missing count {len(west)} != 10')
          open('/tmp/north_codes','w').write('\n'.join(north)+'\n')
          open('/tmp/west_codes','w').write('\n'.join(west)+'\n')
          PY

          git checkout -B coord/north-release-10-20260722-1612 origin/coord/north-release-10-20260722-1612
          while read -r code; do
            git checkout origin/region/north -- \
              "jichitai-compare/data/municipalities/${code:0:2}/${code}.json" \
              "jichitai-compare/operations/tasks/${code}.json"
          done < /tmp/north_codes
          python3 - <<'PY'
          import json
          for code in open('/tmp/north_codes'):
              code=code.strip()
              task=json.load(open(f'jichitai-compare/operations/tasks/{code}.json'))
              if task.get('status')!='merged': raise SystemExit(f'{code} task not merged')
          PY
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m '全国統合: 北日本10自治体の固定スナップショット'
          git push origin coord/north-release-10-20260722-1612

          git checkout -B coord/west-release-10-20260722-1612 origin/coord/west-release-10-20260722-1612
          while read -r code; do
            git checkout origin/region/west -- \
              "jichitai-compare/data/municipalities/${code:0:2}/${code}.json" \
              "jichitai-compare/operations/tasks/${code}.json"
          done < /tmp/west_codes
          python3 - <<'PY'
          import json
          for code in open('/tmp/west_codes'):
              code=code.strip()
              task=json.load(open(f'jichitai-compare/operations/tasks/{code}.json'))
              if task.get('status')!='merged': raise SystemExit(f'{code} task not merged')
          PY
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m '全国統合: 西日本10自治体の固定スナップショット'
          git push origin coord/west-release-10-20260722-1612

          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-build-north-west-releases-1612.yml
          git commit -m '統括管理: 北西全国統合一時ワークフローを削除'
          git push origin main
