name: Temporary final sync queue 294

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-final-sync-queue-294-0829.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Final assigned queue sync
        shell: bash
        run: |
          git pull --rebase origin main
          git fetch origin \
            region/north:refs/remotes/origin/region/north \
            region/east:refs/remotes/origin/region/east \
            region/central:refs/remotes/origin/region/central \
            region/west:refs/remotes/origin/region/west
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path, PurePosixPath

          qpath = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(qpath.read_text(encoding='utf-8'))
          policy = json.loads(Path('jichitai-compare/operations/municipality-assignment-policy.json').read_text(encoding='utf-8'))
          team_for_region = {'north':'北日本調査班','east':'東日本調査班','central':'中日本調査班','west':'西日本調査班'}
          prefixes = {t['team']: set(t['prefectureCodes']) for t in policy['teams']}

          def run(*args): return subprocess.check_output(args, text=True).strip()
          def get_name(ref, path, code):
              try:
                  obj = json.loads(run('git','show',f'{ref}:{path}'))
                  if isinstance(obj.get('municipality'), dict) and obj['municipality'].get('name'):
                      return obj['municipality']['name']
                  for key in ('municipalityName','name'):
                      if isinstance(obj.get(key), str) and obj[key]: return obj[key]
              except Exception: pass
              return code

          for e in data['entries']:
              baseline = int(e.get('count',0)) - int(e.get('pendingSinceLastRelease',0))
              ref = f"origin/{e['branch']}"
              allowed = prefixes[team_for_region[e['region']]]
              old = {x['code']:x['name'] for x in e.get('municipalities',[])}
              out = run('git','ls-tree','-r','--name-only',ref,'--','jichitai-compare/data/municipalities')
              items=[]
              for path in out.splitlines():
                  if not path.endswith('.json'): continue
                  code=PurePosixPath(path).stem
                  if not code.isdigit() or code[:2] not in allowed: continue
                  items.append({'code':code,'name':old.get(code) or get_name(ref,path,code)})
              items.sort(key=lambda x:x['code'])
              e['municipalities']=items
              e['count']=len(items)
              pending=max(0,e['count']-baseline)
              e['pendingSinceLastRelease']=pending
              e['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              e['reason']=f'担当割当で地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              e['generatedPullRequest']=518

          data['updatedAt']=datetime.now(timezone(timedelta(hours=9))).replace(second=0,microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities']=0
          data['summary']['releaseReadyRegions']=[e['region'] for e in data['entries'] if e.get('pendingSinceLastRelease',0)>=10]
          data['summary']['auditBlockedRegions']=[]
          data['summary']['lastNationalIntegrationAt']='2026-07-22T07:59:35+09:00'
          data['summary']['lastNationalIntegrationPr']=517
          data['summary']['latestGeneratedMunicipalityCount']=294
          data['summary']['latestGeneratedPullRequest']=518
          data['summary']['latestPublicCountPullRequest']=518
          ordered=sorted(data['entries'],key=lambda e:e.get('pendingSinceLastRelease',0),reverse=True)
          data['nextAction']='地方統合を継続。現在の公開後繰越: '+'、'.join(f"{e['region']} {e.get('pendingSinceLastRelease',0)}" for e in ordered)+'。10自治体到達地域を固定スナップショットで全国統合する。'
          data['humanDecisionRequired']=False
          qpath.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-final-sync-queue-294-0829.yml
          git commit -m "統括管理: 公開294自治体後の地方キューを最終同期"
          git push origin HEAD:main
