name: Temporary Central A Housing Batch 18

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch18-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch18-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 18 decisions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T04:05:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const unavailableSummary='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const replacements={
            '17365':{
              type:'replace_with_current_newlywed_program',
              service:{status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',details:{program:'内灘町定住促進新婚世帯新居費用助成事業補助金',marriagePeriod:'2026年1月1日から2027年3月31日までに婚姻届を提出し受理された夫婦',target:'婚姻日に夫婦とも39歳以下、年間所得500万円未満、町税滞納なし等の要件を満たす新婚世帯',coveredCosts:'2026年4月1日から2027年3月31日までに支払った新居購入・建築費、賃借費最大6か月分、引越費用、リフォーム費用',amount:'夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',applicationDeadline:'2027年3月31日まで'},source:{url:'https://www.town.uchinada.lg.jp/soshiki/kikaku/2058.html',checkedAt},additionalSources:[{url:'https://www.town.uchinada.lg.jp/soshiki/kikaku/2073.html',checkedAt,description:'一般のマイホーム取得奨励金。子育て・新婚住宅支援の主制度には使用しない。'}]}
            },
            '21209':{
              type:'general_trial_housing_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'市外在住で移住を検討する人へ、リノベーション済み空き家の移住体験住宅を提供する。',classificationReview:'2026年度補助制度一覧および市の住宅・子育て案内で、子ども・新婚・三世代を対象要件とする住宅取得・改修・家賃支援を確認できない。移住体験住宅は一般の移住検討者向けであるため、子育て住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.hashima.lg.jp/1501.html',checkedAt},additionalSources:[{url:'https://www.city.hashima.lg.jp/1784.html',checkedAt,description:'一般移住者向けの空き家再生移住定住お試し住宅'}]}
            },
            '21502':{
              type:'replace_with_current_newlywed_program',
              service:{status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',details:{program:'令和8年度 富加町結婚新生活支援補助金',marriagePeriod:'2026年1月1日から2027年3月31日までに婚姻届を提出し受理された夫婦',target:'婚姻日に夫婦とも39歳以下、夫婦合算所得500万円未満、対象住宅が町内等の要件を満たす新婚世帯',coveredCosts:'2026年度中に支払った住宅取得費、賃貸住宅の家賃・敷金・礼金・共益費等、引越費用、リフォーム費用',amount:'夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',application:'事前相談後、年度末の2027年3月31日までに申請。予算の範囲内で交付。'},source:{url:'https://www.town.tomika.gifu.jp/docs/716963.html',checkedAt},additionalSources:[{url:'https://www.town.tomika.gifu.jp/docs/2070715.html',checkedAt,description:'一般の定住促進奨励金。新婚住宅支援の主制度には使用しない。'}]}
            },
            '21507':{
              type:'current_fiscal_period_unconfirmed',
              service:{status:'unavailable',summary:'結婚新生活支援の案内は確認できるが、2026年度の婚姻・支払・申請対象期間を現行公式情報で確定できない。',details:{confirmedPastProgram:'公式案内は2024年1月1日から2025年3月31日までに婚姻した夫婦を対象とし、所得400万円未満、夫婦とも39歳以下等の要件を掲載する。',currentReview:'2026年度補助金等一覧は公開されているが、利用者向け結婚新生活支援ページの対象期間は更新されておらず、2026年度の申請可否・対象費用期間を確定できない。',handling:'過年度条件を2026年度へ流用せず、村が現行対象期間を公開するまでunavailableとする。'},source:{url:'https://www.vill.higashishirakawa.gifu.jp/kurashi/teijuu/shinseikatsushien/',checkedAt},additionalSources:[{url:'https://www.vill.higashishirakawa.gifu.jp/sonsei/koukai/hojyokin/',checkedAt,description:'2026年度補助金等一覧の公開ページ。個別の結婚新生活支援条件は利用者向けページで確定できない。'},{url:'https://www.vill.higashishirakawa.gifu.jp/kurashi/teijuu/shien/',checkedAt,description:'一般の定住促進住宅支援'}]}
            },
            '22306':{
              type:'expired_young_household_program_and_general_vacant_home',
              service:{status:'unavailable',summary:'若者・ひとり親世帯向け家賃補助は転入対象期間が2023年3月31日までで終了しており、2026年度に利用できる子育て・新婚住宅支援は確認できない。',details:{expiredProgram:'若者転入世帯等定住促進補助金は、夫婦の一方が40歳未満の世帯またはひとり親世帯へ月1万円を24か月補助する制度。',expiredEligibility:'公式ページは2020年4月1日から2023年3月31日までに西伊豆町へ転入した世帯を対象と明記する。',confirmedGeneralProgram:'空き家バンク登録物件の改修費・家財処分費を補助する一般制度は現行一覧に掲載されている。',classificationReview:'現行の空き家改修制度には子ども・新婚・三世代の固有要件がないため、子育て住宅支援として登録しない。'},source:{url:'https://www.town.nishiizu.shizuoka.jp/kakuka/machizukuri/kikaku/wakamonosetaihojo.html',checkedAt},additionalSources:[{url:'https://www.town.nishiizu.shizuoka.jp/gyousei/hojo_josei.html',checkedAt,description:'現行の補助金・助成金一覧。一般空き家改修と期限終了済み若者転入世帯補助を掲載。'},{url:'https://www.town.nishiizu.shizuoka.jp/kakuka/machizukuri/kikaku/akiyahojo.html',checkedAt,description:'一般の空き家改修等補助金'}]}
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(replacements)){
            const dataPath=path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(before.status!=='verified')throw new Error(`${code}: expected verified before status`);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第18群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            records.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(checkpoint.qualityReaudit.correctedMunicipalitiesRechecked!==139||checkpoint.qualityReaudit.primarySourceSlotsRechecked!==571||checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification!==89)throw new Error('Unexpected batch17 baseline');
          checkpoint.updatedAt=updatedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残84件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=144;checkpoint.qualityReaudit.primarySourceSlotsRechecked=576;checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=84;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残84件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:18,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:3,verifiedReplacementCount:2,remainingCandidates:84,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第18群として内灘町・富加町を2026年度新婚住宅支援へ差し替え、羽島市・東白川村・西伊豆町をunavailableへ修正した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch18-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:3,verifiedReplacementCount:2,corrected:records,causeScan:{previousRemainingCandidates:89,reviewedHighRiskCandidates:5,remainingCandidates:84},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['現行年度の新婚住宅費支援が確認できる場合は一般住宅制度より直接的な制度を主制度とする','過年度の婚姻・転入対象期間を現行年度へ流用しない','一般の移住体験住宅・定住・空き家改修を子育て住宅支援として登録しない'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch18-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch18-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/17/17365.json|jichitai-compare/data/municipalities/21/21209.json|jichitai-compare/data/municipalities/21/21502.json|jichitai-compare/data/municipalities/21/21507.json|jichitai-compare/data/municipalities/22/22306.json|jichitai-compare/operations/tasks/17365.json|jichitai-compare/operations/tasks/21209.json|jichitai-compare/operations/tasks/21502.json|jichitai-compare/operations/tasks/21507.json|jichitai-compare/operations/tasks/22306.json|jichitai-compare/operations/audits/central-a-housing-classification-batch18-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/17365/index.html|jichitai-compare/municipality/21209/index.html|jichitai-compare/municipality/21502/index.html|jichitai-compare/municipality/21507/index.html|jichitai-compare/municipality/22306/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch18-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第18群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
