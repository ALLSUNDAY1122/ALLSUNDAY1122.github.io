name: Temporary Central A Batch 3 State Sync

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-batch3-state-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/central-a-batch3-state-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize checkpoint and region state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare/operations';
          const checkpointPath = `${root}/control/session-checkpoints/central-a.json`;
          const regionPath = `${root}/control/regions/central.json`;
          const auditPath = `${root}/audits/central-a-weak-primary-source-batch3-decisions-20260725.json`;
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          const timestamp = '2026-07-25T13:42:00+09:00';
          const audit = read(auditPath);
          const checkpoint = read(checkpointPath);
          const region = read(regionPath);
          const correction = {
            type: 'primary_source_upgrade',
            code: '24324',
            service: 'postpartumCare',
            name: '東員町'
          };

          checkpoint.updatedAt = timestamp;
          checkpoint.pullRequestNumber = 3403;
          checkpoint.ciStatus = 'success';
          checkpoint.ciRunNumber = 8266;
          checkpoint.nextAction = '原因別重点再監査を継続する。Issue #3141の21項目は変更せず、弱い主出典の残35候補から産後ケア、病児保育、住宅支援を利用者向け公式ページで判定する。';
          checkpoint.qualityReaudit.latestCompletedAt = timestamp;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber = 3403;
          checkpoint.qualityReaudit.latestCiRunNumber = 8266;
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked = 69;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked = 501;
          checkpoint.qualityReaudit.candidateCounts.weakPrimarySource = 35;
          checkpoint.qualityReaudit.confirmedCorrections ??= [];
          if (!checkpoint.qualityReaudit.confirmedCorrections.some((item) => item.type === correction.type && item.code === correction.code && item.service === correction.service)) {
            checkpoint.qualityReaudit.confirmedCorrections.push(correction);
          }

          region.updatedAt = timestamp;
          region.lastAction = '原因別重点再監査の弱い主出典第3群9制度枠をPR #3403・CI #8266成功後にregion/centralへ統合。東員町産後ケアを2026年6月更新の利用者向けページへ変更し、病児保育3件・産後ケア5件は公式条件未確認として判定を維持した。';
          region.nextAction = '弱い主出典の残35候補を、産後ケア、病児保育、住宅支援の順に利用者向け公式情報で確定判定する。';
          region.qualityReaudit.latestCompletedAt = timestamp;
          region.qualityReaudit.latestRegionalPullRequestNumber = 3403;
          region.qualityReaudit.latestCiRunNumber = 8266;
          region.qualityReaudit.correctedMunicipalitiesRechecked = 69;
          region.qualityReaudit.primarySourceSlotsRechecked = 501;
          region.qualityReaudit.candidateCounts.weakPrimarySource = 35;
          region.qualityReaudit.nextPriority = [
            '弱い主出典残35候補',
            '産後ケアの条例・要綱単独候補',
            '病児保育の計画・要綱単独候補',
            '住宅支援の分類候補'
          ];
          region.qualityReaudit.confirmedCorrections ??= [];
          if (!region.qualityReaudit.confirmedCorrections.some((item) => item.type === correction.type && item.code === correction.code && item.service === correction.service)) {
            region.qualityReaudit.confirmedCorrections.push(correction);
          }

          write(checkpointPath, checkpoint);
          write(regionPath, region);
          NODE

      - name: Validate data
        working-directory: jichitai-compare
        run: |
          npm run check
          node --check app.js

      - name: Commit synchronized state
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-batch3-state-sync-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/control/session-checkpoints/central-a.json \
            jichitai-compare/operations/control/regions/central.json \
            jichitai-compare/operations/control/central-a-batch3-state-sync-trigger-20260725.json
          git commit -m 'state: 中日本A第3群の監査状態を同期'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
