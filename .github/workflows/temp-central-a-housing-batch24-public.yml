name: Temporary Central A Housing Batch 24 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch24-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch24-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const unavailable='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const targets=[
            {code:'27220',name:'箕面市',status:'unavailable',summary:unavailable,source:'https://www.city.minoh.lg.jp/sidou/taisin/taisinkaisyuukoujihihojo.html'},
            {code:'27222',name:'羽曳野市',status:'unavailable',summary:unavailable,source:'https://www.city.habikino.lg.jp/soshiki/toshikaihatsu/kenchikujutaku/taishin/15407.html'},
            {code:'27223',name:'門真市',status:'unavailable',summary:unavailable,source:'https://www.city.kadoma.osaka.jp/machizukuri_rodo/kenchiku/7/hozyoseido/33834.html'},
            {code:'27224',name:'摂津市',status:'verified',summary:'市外から転入する中学生以下の子がいる世帯等が、市内の親世帯と同居・近居するため住宅を取得した場合、3年間で最大45万円を補助する。',source:'https://www.city.settsu.osaka.jp/soshiki/kensetsubu/kenchikuka/tasedai_doukyo/10298.html'},
            {code:'27226',name:'藤井寺市',status:'unavailable',summary:unavailable,source:'https://www.city.fujiidera.lg.jp/kurashi/jutakukenchiku/jutaku/1390265709101.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch24Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,success:response.status===200&&sourceMatches&&summaryMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch24Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>item.code===target.code);
                const service=municipality?.services?.housingSupport;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(record=>record.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(check=>check.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch24-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3839,nationalSyncPullRequest:3841,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:4,expectedVerifiedCount:1,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch24-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch24-public-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第24群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
