name: Temporary generated data sync 134

on:
  push:
    branches:
      - coord/generated-sync-134-20260721

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: coord/generated-sync-134-20260721
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and validate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/municipalities.json', 'utf8'));
          const municipalities = Array.isArray(data) ? data : data.municipalities;
          if (!Array.isArray(municipalities) || municipalities.length !== 134) {
            throw new Error(`Expected 134 municipalities, got ${municipalities?.length}`);
          }
          NODE

      - name: Update public count
        run: |
          sed -i 's/124自治体/134自治体/g' jichitai-compare/index.html
          grep -q '134自治体・9制度' jichitai-compare/index.html
          grep -q '登録状況：134自治体の生成データを公開中' jichitai-compare/index.html

      - name: Commit generated files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/generated/municipalities.json
          git add jichitai-compare/operations/progress.json
          git add jichitai-compare/index.html
          git rm .github/workflows/tmp-generate-sync-134.yml
          git commit -m "生成更新: 全国134自治体を公開データへ反映"
          git push origin HEAD:coord/generated-sync-134-20260721
