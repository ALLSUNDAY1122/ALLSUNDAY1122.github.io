name: Temporary Reset Central After 404

on:
  push:
    branches: [region/central]
    paths:
      - .github/workflows/temp-reset-central-after-404.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/central
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central state
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/regions/central.json';
          const state = JSON.parse(fs.readFileSync(path, 'utf8'));
          state.updatedAt = '2026-07-22T02:24:00+09:00';
          state.status = 'working';
          state.completedSinceLastRelease = 1;
          state.completedMunicipalities = ['21401'];
          state.regionalQueue = ['21403'];
          state.lastAction = '下呂市（21220）から安八町（21383）までの10自治体を全国統合PR #404・CI run #863でmainへ反映し、生成更新PR #408・CI run #871で公開204自治体へ同期。その後、揖斐川町（21401）をPR #405・CI run #866でregion/centralへ地方統合した。';
          state.nextAction = '大野町（21403）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する。';
          state.lastNationalIntegrationPr = 404;
          state.lastNationalIntegrationAt = '2026-07-22T02:15:09+09:00';
          state.lastGeneratedPullRequest = 408;
          state.humanDecisionRequired = false;
          state.completenessAudit ??= {status:'passed', checkedCodes:[], checks:[]};
          state.completenessAudit.status = 'passed';
          state.completenessAudit.checks ??= [];
          for (const check of [
            '下呂市から安八町までの追加10自治体を全国統合PR #404・CI run #863でmainへ統合',
            '生成更新PR #408・CI run #871で生成JSON・全国進捗・公開トップを204自治体へ同期'
          ]) if (!state.completenessAudit.checks.includes(check)) state.completenessAudit.checks.push(check);
          fs.writeFileSync(path, JSON.stringify(state));
          NODE
          rm .github/workflows/temp-reset-central-after-404.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/regions/central.json .github/workflows/temp-reset-central-after-404.yml
          git commit -m 'ops: 中日本の全国統合基準をPR #404後へ更新'
          git push origin region/central
