name: Temporary West A Bulky Waste Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-bulky-public-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/west-a-bulky-source-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';

          const targets = [
            {code:'39424', name:'大月町', source:'https://www.town.otsuki.kochi.jp/life/dtl.php?hdnKey=1119', additional:'https://www.town.otsuki.kochi.jp/life/dtl.php?hdnKey=1875'},
            {code:'40421', name:'桂川町', source:'https://www.town.keisen.fukuoka.jp/kurashi/benri/gomicalender.php', additional:'https://www.town.keisen.fukuoka.jp/kurashi/benri/gomidashi.php'},
            {code:'43208', name:'山鹿市', source:'https://www.city.yamaga.kumamoto.jp/kiji003556/index.html', additional:'https://www.city.yamaga.kumamoto.jp/kiji003523/index.html'}
          ];
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          let final = null;
          for (let attempt = 1; attempt <= 30; attempt++) {
            const nonce = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const url = `${base}/municipality/${target.code}/?audit=${nonce}`;
                const response = await fetch(url, {headers:{'cache-control':'no-cache','user-agent':'WestABulkyPublicAudit/1.0'}});
                const html = await response.text();
                const primary = html.includes(target.source) || html.includes(target.source.replaceAll('&','&amp;'));
                const additional = html.includes(target.additional) || html.includes(target.additional.replaceAll('&','&amp;'));
                pageChecks.push({code:target.code,name:target.name,url,httpStatus:response.status,primarySourceMatches:primary,additionalSourceMatches:additional,success:response.status===200&&primary&&additional});
              } catch (error) {
                pageChecks.push({code:target.code,name:target.name,httpStatus:null,error:String(error),success:false});
              }
            }

            let jsonCheck = {success:false};
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`, {headers:{'cache-control':'no-cache','user-agent':'WestABulkyPublicAudit/1.0'}});
              const payload = await response.json();
              const municipalities = Array.isArray(payload) ? payload : (payload.municipalities || []);
              const records = targets.map(target => {
                const municipality = municipalities.find(item => item.code === target.code);
                const service = municipality?.services?.bulkyWaste;
                return {code:target.code,found:Boolean(municipality),status:service?.status??null,statusMatches:service?.status==='verified',sourceMatches:service?.source?.url===target.source,additionalMatches:(service?.additionalSources||[]).some(v=>v.url===target.additional),success:Boolean(municipality)&&service?.status==='verified'&&service?.source?.url===target.source&&(service?.additionalSources||[]).some(v=>v.url===target.additional)};
              });
              const serviceCount = municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck = {httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            } catch (error) {
              jsonCheck = {error:String(error),success:false};
            }

            final = {attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if (final.success) break;
            await sleep(10000);
          }

          const evidence = {
            schemaVersion:'1.0.0',
            auditId:'west-a-bulky-waste-public-verification-20260725',
            generatedAt:new Date().toISOString(),
            regionalCorrectionPullRequest:3677,
            nationalSyncPullRequest:3679,
            verificationPullRequest:Number(process.env.PR_NUMBER),
            verificationWorkflowRunId:Number(process.env.RUN_ID),
            ...final,
            releaseBlocker:final.success?'none':'public_verification_failed'
          };
          const outPath='jichitai-compare/operations/audits/west-a-bulky-waste-public-verification-20260725.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/west-a-bulky-public-trigger-20260725.json';
          if(fs.existsSync(trigger)) fs.rmSync(trigger);
          if(!final.success) throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 西日本A粗大ごみ出典保守の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
