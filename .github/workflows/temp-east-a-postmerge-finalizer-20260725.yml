name: Temporary East A post-merge finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/east-a-postmerge-finalize-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ops/east-a-postmerge-finalize-20260725
      SOURCE_PR: '3130'
      SOURCE_MERGE_SHA: 8cbf05825b5b7941850d01f855f693d6be9995ca
      FINAL_CI_RUN_NUMBER: '7654'
      FINAL_CI_RUN_ID: '30121173097'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/east-a-postmerge-finalize-20260725
          fetch-depth: 0
      - name: Reset to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate repository baseline
        run: |
          cd jichitai-compare
          npm run validate:generated
          node --check app.js
      - name: Verify public East A data and pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const prefs = ['10','13','19','20'];
          const codes = prefs.flatMap(pref => fs.readdirSync(`jichitai-compare/data/municipalities/${pref}`)
            .filter(name => name.endsWith('.json')).map(name => name.replace(/\.json$/, ''))).sort();
          const mainData = JSON.parse(fs.readFileSync('jichitai-compare/data/generated/municipalities.json','utf8'));
          const mainByCode = new Map(mainData.municipalities.map(item => [item.code, item]));
          let publicData = null;
          for (let attempt = 1; attempt <= 24; attempt++) {
            const res = await fetch(`${base}/data/generated/municipalities.json?v=${Date.now()}`);
            if (res.ok) {
              const candidate = await res.json();
              const publicByCode = new Map(candidate.municipalities.map(item => [item.code, item]));
              if (codes.every(code => JSON.stringify(publicByCode.get(code)) === JSON.stringify(mainByCode.get(code)))) {
                publicData = candidate;
                break;
              }
            }
            await sleep(15000);
          }
          if (!publicData) throw new Error('Public East A generated data did not match latest main');

          const auditPath = 'jichitai-compare/operations/audits/east-a-final-consistency-20260725.json';
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const pageCodes = audit.correctedPageCodes;
          for (const code of pageCodes) {
            let ok = false;
            for (let attempt = 1; attempt <= 4; attempt++) {
              const res = await fetch(`${base}/municipality/${code}/?v=${Date.now()}`);
              if (res.ok) { await res.arrayBuffer(); ok = true; break; }
              await sleep(5000);
            }
            if (!ok) throw new Error(`${code}: public municipality page unavailable`);
          }

          const checkedAt = '2026-07-25T04:45:00+09:00';
          audit.finalCi = { workflowRunNumber: Number(process.env.FINAL_CI_RUN_NUMBER), workflowRunId: Number(process.env.FINAL_CI_RUN_ID), status: 'success' };
          audit.finalCiStatus = 'success';
          audit.publicVerification = 'success';
          audit.publicVerificationRun = { workflowRunId: Number(process.env.GITHUB_RUN_ID), status: 'success', municipalityCount: codes.length, checkedPageCount: pageCodes.length };
          audit.publicMainCommitSha = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          audit.publicGeneratedMunicipalityCount = publicData.municipalities.length;
          audit.finalizedAt = checkedAt;
          audit.status = 'published_verified';
          fs.writeFileSync(auditPath, JSON.stringify(audit,null,2)+'\n');

          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/east-a.json';
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.ciStatus = 'success';
          checkpoint.updatedAt = checkedAt;
          checkpoint.postMergePublication = {
            sourcePullRequestNumber: Number(process.env.SOURCE_PR),
            sourceMergeSha: process.env.SOURCE_MERGE_SHA,
            finalCiRunNumber: Number(process.env.FINAL_CI_RUN_NUMBER),
            finalCiRunId: Number(process.env.FINAL_CI_RUN_ID),
            publicVerificationRunId: Number(process.env.GITHUB_RUN_ID),
            municipalityCount: codes.length,
            checkedPageCount: pageCodes.length,
            status: 'success',
            checkedAt
          };
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint,null,2)+'\n');

          const evidence = {
            schemaVersion: '1.0.0',
            auditId: 'publish-audit-east-a-final-20260725',
            sourcePullRequestNumber: Number(process.env.SOURCE_PR),
            sourceMergeSha: process.env.SOURCE_MERGE_SHA,
            mainCommitSha: execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            finalCiRunNumber: Number(process.env.FINAL_CI_RUN_NUMBER),
            finalCiRunId: Number(process.env.FINAL_CI_RUN_ID),
            publicVerificationRunId: Number(process.env.GITHUB_RUN_ID),
            municipalityCount: codes.length,
            correctedPageCount: pageCodes.length,
            publicGeneratedMunicipalityCount: publicData.municipalities.length,
            status: 'success',
            checkedAt
          };
          fs.writeFileSync('jichitai-compare/operations/control/publish-audit-east-a-final-20260725.json', JSON.stringify(evidence,null,2)+'\n');
          NODE
      - name: Commit final evidence and remove runner
        run: |
          rm -f .github/workflows/temp-east-a-postmerge-finalizer-20260725.yml
          rm -f jichitai-compare/operations/control/east-a-postmerge-finalize-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'ops: 東日本A公開確認済み完了を確定'
          git push --force-with-lease origin HEAD:${TARGET_BRANCH}
