name: 管理栄養士 600 UI Integration Audit

on:
  pull_request:
    paths:
      - 'kanrieiyoushi-sprint/**'
      - 'automation/learning-sprint-question-pipeline/**'
      - '.github/workflows/kanrieiyoushi-ui600-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build runtime 600 questions
        run: python kanrieiyoushi-sprint/audit/build_runtime_600.py
      - name: Re-run 600 question structure audit
        run: python automation/learning-sprint-question-pipeline/validate_questions.py kanrieiyoushi-sprint/audit/learning-sprint-audit-round1-2-3.json
      - name: Re-run content and rights policy audit
        run: python kanrieiyoushi-sprint/audit/audit_content_rights.py
      - name: Check JavaScript syntax
        run: node --check kanrieiyoushi-sprint/app-v060.js && node --check kanrieiyoushi-sprint/questions600.js && node --check kanrieiyoushi-sprint/sw.js
      - name: Run UI integration acceptance audit
        run: python kanrieiyoushi-sprint/audit/ui600_acceptance.py
      - name: Persist generated runtime data to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanrieiyoushi-sprint/questions600.js
          if git diff --cached --quiet; then
            echo "questions600.js already up to date"
          else
            git commit -m "管理栄養士 監査済み600問ランタイムを生成"
            git push origin HEAD:${{ github.head_ref }}
          fi
