name: Temporary North A Shichinohe Follow-up V2

on:
  pull_request:
    branches:
      - region/north
    paths:
      - jichitai-compare/operations/control/north-a-shichinohe-followup-v2-trigger-20260725.json

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'audit/north-a-shichinohe-followup-v2-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply official availability correction
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path('jichitai-compare')
          now = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0)
          stamp = now.isoformat()
          today = now.date().isoformat()
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pr = event['pull_request']['number']

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          municipality_path = root / 'data/municipalities/02/02402.json'
          municipality = load(municipality_path)
          municipality['updatedAt'] = today
          service = municipality['services']['temporaryChildcare']
          service['summary'] = '町内6施設の一時預かりを実施。こども誰でも通園制度は3施設を予定しているが、町公式案内では準備中で現在は利用できない。'
          service['details'] = {
              'temporaryFacilities': '明照保育園、城南こども園、城北こども園、道ノ上こども園、榎林こども園、チビッコるーむ',
              'temporaryApplication': '利用日、対象年齢、料金、予約方法は各施設へ直接確認',
              'anyChildcare': '令和8年4月開始制度として案内しているが、2026年7月25日確認時点では準備中のため利用不可',
              'anyTarget': '認定こども園や保育所等に在籍していない生後6か月から満3歳未満（3歳の誕生日の2日前まで）の乳幼児。保護者の就労要件なし',
              'anyHours': '全施設合計で月10時間まで。未利用分の翌月繰越不可',
              'anyFacilities': '城南こども園、城北こども園、道ノ上こども園',
              'anyFee': '施設が設定した利用料。給食・おやつ等の実費負担が生じる場合あり',
              'anyAvailability': '準備中のため、まだ利用することができない',
              'anyApplication': '利用開始後は総合支援システムで利用認定申請、事前面談、利用予約を行う'
          }
          service['source'] = {
              'url': 'https://www.town.shichinohe.lg.jp/kurashi/dekigoto/nyuuen/post-562.html',
              'checkedAt': today
          }
          service['additionalSources'] = [
              {'url': 'https://www.town.shichinohe.lg.jp/kurashi/dekigoto/nyuuen/post-246.html', 'checkedAt': today},
              {'url': 'https://www.town.shichinohe.lg.jp/kurashi/dekigoto/nyuuen/index.html', 'checkedAt': today},
              {'url': 'https://www.town.shichinohe.lg.jp/kouhou/reiki/reiki_int/reiki_honbun/r111RG00000816.html', 'checkedAt': today}
          ]
          save(municipality_path, municipality)

          task_path = root / 'operations/tasks/02402.json'
          task = load(task_path)
          task['lastCheckedAt'] = today
          task['lastUpdatedAt'] = stamp
          task['lastUpdatedBy'] = '北日本調査班A'
          sources = [municipality['services'][name]['source']['url'] for name in task['completedServices']]
          task['officialSources'] = list(dict.fromkeys(sources))
          note = '品質改善第2監査の完了後再確認で、こども誰でも通園制度は3施設を予定しているが、町公式ページ上は準備中で現在利用不可と確認し、利用可能と誤認されないよう明記。'
          if note not in task.setdefault('notes', []):
              task['notes'].append(note)
          save(task_path, task)

          audit_path = root / 'operations/audits/north-a-quality-audit-2-20260725.json'
          audit = load(audit_path)
          finding = {
              'type': 'availability_condition_omission',
              'severity': 'medium',
              'code': '02402',
              'municipality': '七戸町',
              'service': 'temporaryChildcare',
              'before': '令和8年度こども誰でも通園制度の案内あり。利用不可の記載なし',
              'after': '3実施予定施設、月10時間、準備中で現在利用不可を明記',
              'cause': '制度案内ページの存在と対象条件を確認したが、現行の利用可否条件を自治体JSONへ転記していなかった',
              'officialBasis': '七戸町こども誰でも通園制度公式ページ（2026年4月1日更新）',
              'officialUrl': 'https://www.town.shichinohe.lg.jp/kurashi/dekigoto/nyuuen/post-562.html',
              'regionPullRequest': pr,
              'correctionStatus': 'corrected_in_region_pending_merge'
          }
          findings = audit.setdefault('confirmedFindings', [])
          if not any(item.get('type') == finding['type'] and item.get('code') == '02402' for item in findings):
              findings.append(finding)
          cross = audit.setdefault('crossMunicipalityChecks', {})
          errors = cross.setdefault('additionalConfirmedErrors', [])
          marker = '02402 temporaryChildcare availability condition omission'
          if marker not in errors:
              errors.append(marker)
          cross['openErrors'] = 0
          sampling = audit.setdefault('samplingAudit', {})
          notes = sampling.setdefault('highRiskNotes', [])
          revised = '七戸町のこども誰でも通園制度は3施設を予定しているが、公式ページ上で準備中・現在利用不可を再確認し、自治体JSONへ明記した'
          replaced = False
          for index, text in enumerate(notes):
              if text.startswith('七戸町のこども誰でも通園制度'):
                  notes[index] = revised
                  replaced = True
          if not replaced:
              notes.append(revised)
          final = audit.setdefault('finalResult', {})
          final.update({'confirmedNewErrors': 3, 'correctedNewErrors': 3, 'openErrors': 0, 'unfixedErrors': 0})
          audit['postCompletionFollowup'] = {
              'checkedAt': stamp,
              'code': '02402',
              'municipality': '七戸町',
              'service': 'temporaryChildcare',
              'result': 'availability_note_corrected_in_region_pending_main',
              'regionPullRequest': pr,
              'officialPageStatus': '準備中のため、まだ利用することができない',
              'mainPublication': 'pending'
          }
          audit['nextAction'] = '七戸町の利用可否注記をregion/northへ統合後、main・全国生成JSON・静的ページ・公開ページへ同期して再完了する。'
          save(audit_path, audit)

          checkpoint_path = root / 'operations/control/session-checkpoints/north-a.json'
          checkpoint = load(checkpoint_path)
          checkpoint.update({
              'updatedAt': stamp,
              'status': 'in_progress',
              'workingBranch': event['pull_request']['head']['ref'],
              'pullRequestNumber': pr,
              'ciStatus': 'pending'
          })
          quality = checkpoint.setdefault('qualitySecondAudit', {})
          quality.update({
              'status': 'followup_in_progress',
              'confirmedNewErrors': 3,
              'fixedNewErrors': 3,
              'openErrors': 0,
              'unfixedErrors': 0,
              'publicationStatus': 'region_correction_pending_merge',
              'followupMunicipality': '02402'
          })
          checkpoint['nextAction'] = '七戸町の準備中・現在利用不可の注記をregion/northへ統合し、その後mainと公開ページへ同期する。'
          save(checkpoint_path, checkpoint)
          PY

      - name: Regenerate and validate regional outputs
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove temporary runners and trigger
        run: |
          rm -f jichitai-compare/operations/control/north-a-shichinohe-followup-v2-trigger-20260725.json
          rm -f .github/workflows/temp-north-a-shichinohe-followup.yml
          rm -f .github/workflows/temp-north-a-shichinohe-followup-v2.yml

      - name: Commit corrected source and generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows jichitai-compare
          git commit -m 'fix: 七戸町誰でも通園の準備中・利用不可を明記'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
