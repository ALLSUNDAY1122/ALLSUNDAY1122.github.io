name: Kanteishi Settings Access Migration

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-settings-access-migrate-12.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0
      - name: Patch history and settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/HistorySettingsViews.swift')
          s = p.read_text()

          def r(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing: ' + old[:90])
              s = s.replace(old, new, 1)

          r('struct HistoryView: View {\n    @EnvironmentObject private var store: LearningStore',
            'struct HistoryView: View {\n    @EnvironmentObject private var store: LearningStore\n    @EnvironmentObject private var purchases: PremiumPurchaseStore')
          s = s.replace('store.weakQuestions', 'store.accessibleWeakQuestions(isPremium: purchases.isPremium)')
          r('Button { store.retryQuestions([q.id], title: q.topic) } label:',
            'Button { if !store.retryQuestions([q.id], title: q.topic, isPremium: purchases.isPremium) { store.currentTab = .settings } } label:')

          start_marker = '                    if purchases.isConfigured { settingsSection("プレミアム")'
          end_marker = '                    settingsSection("このアプリ")'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('premium settings markers missing')

          premium = '''                    settingsSection("プレミアム") {
                        VStack(alignment: .leading, spacing: 10) {
                            if purchases.isPremium {
                                Label("プレミアム利用中", systemImage: "checkmark.seal.fill")
                                    .foregroundStyle(AppTheme.midori)
                                Text("全240問・年度別80問模試・全科目演習を利用できます。")
                                    .appSans(11)
                                    .foregroundStyle(AppTheme.ink2)
                            } else {
                                Text("無料版は24問。プレミアムでは全240問と年度別80問模試を利用できます。")
                                    .appSans(12)
                                    .foregroundStyle(AppTheme.ink2)
                                if let price = purchases.displayPrice {
                                    HStack {
                                        Text("月額プラン")
                                        Spacer()
                                        Text(price).foregroundStyle(AppTheme.ai)
                                    }
                                    .appSans(13, weight: .bold)
                                    Button { Task { await purchases.purchase() } } label: {
                                        settingsAction("cart", "プレミアムを購読")
                                    }
                                    .buttonStyle(.plain)
                                } else {
                                    Text(purchases.isConfigured ? "App Storeの商品情報を確認中です。" : "App Store設定準備中です。")
                                        .appSans(11)
                                        .foregroundStyle(AppTheme.ink3)
                                }
                            }
                            if purchases.isConfigured {
                                Button { Task { await purchases.restorePurchases() } } label: {
                                    settingsAction("arrow.clockwise", "購入を復元")
                                }
                                .buttonStyle(.plain)
                            }
                            if let message = purchases.message {
                                Text(message).appSans(11).foregroundStyle(AppTheme.ink2)
                            }
                        }
                    }
'''
          s = s[:start] + premium + s[end:]
          s = s.replace(
              'infoRow("課金",purchases.isConfigured ? "StoreKit 2" : "Product ID 未設定（Release Gate）")',
              'infoRow("課金",purchases.isConfigured ? "StoreKit 2・月額プラン" : "Product ID 未設定（Release Gate）")'
          )
          p.write_text(s)

          status = Path('kanteishi-shortanswer-sprint/RELEASE_STATUS.md')
          t = status.read_text()
          if '## v2.5 monetization contract' not in t:
              t += '''\n\n## v2.5 monetization contract\n\n- Model: auto-renewing monthly subscription; Japan reference price 200 yen. In-app price display must use StoreKit `Product.displayPrice`.\n- Free tier: 24 / 240 canonical questions, exactly 4 per edition × subject cell, selected deterministically with domain diversity.\n- Premium: all 240 questions, full subject practice, and each 80-question yearly mock.\n- Introductory offer: none by default.\n- Planned Product ID: `jp.allsunday1122.kanteishishortanswer.monthly200`. Runtime remains unconfigured until the exact App Store Connect registration is confirmed.\n- Entitlement is fail-closed: verified matching and non-revoked only; purchase restore is required.\n'''
              status.write_text(t)

          Path('.github/workflows/kanteishi-settings-access-migrate-12.yml').unlink()
          PY
      - name: Commit settings patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'プレミアム利用中' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/HistorySettingsViews.swift
          grep -Fq 'Product.displayPrice' kanteishi-shortanswer-sprint/RELEASE_STATUS.md
          ! test -f .github/workflows/kanteishi-settings-access-migrate-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(#12): align premium settings and release contract'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
