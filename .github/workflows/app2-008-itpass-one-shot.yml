name: APP2-008 IT Passport One Shot

on:
  push:
    branches: [main]
    paths:
      - automation/app2-008-itpass-build-command.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Start and monitor IT Passport Codemagic build
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          target_repo='allsunday1122/it-passport-quiz-ios'
          workflow='ios-native'
          branch='main'
          request=json.loads(Path('automation/app2-008-itpass-build-command.json').read_text())
          request_id=request['request_id']

          def call(url, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'x-auth-token':token,'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode(); return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: body=json.loads(raw)
                  except: body={'error':raw[:1000]}
                  return e.code, body

          status,apps=call('https://api.codemagic.io/apps')
          if not 200 <= status < 300: raise SystemExit(f'GET apps failed {status}')
          rows=apps.get('applications') or apps.get('data') or []
          if isinstance(rows,dict): rows=rows.get('applications') or []
          matches=[]
          for app in rows:
              s=json.dumps(app).lower().replace('.git','')
              if target_repo in s or 'it-passport-quiz-ios' in s:
                  matches.append(app)
          ids=[]
          for a in matches:
              i=a.get('_id') or a.get('id')
              if i and i not in ids: ids.append(i)
          if len(ids)!=1: raise SystemExit(f'Could not uniquely resolve IT Passport Codemagic app: {ids}')
          app_id=ids[0]
          status,start=call('https://api.codemagic.io/builds','POST',{'appId':app_id,'workflowId':workflow,'branch':branch})
          if not 200 <= status < 300: raise SystemExit(f'POST builds failed {status}: {start}')
          build_id=start.get('buildId') or start.get('id')
          if not build_id: raise SystemExit('No buildId returned')
          result={'request_id':request_id,'app_id':app_id,'workflow_id':workflow,'branch':branch,'build_id':build_id,'status':'started','ok':False}
          out=Path(f'automation/codemagic-results/{request_id}.json'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2)+'\n')
          terminal={'finished','failed','canceled','timeout','skipped'}
          deadline=time.time()+4200
          while time.time()<deadline:
              time.sleep(20)
              s,b=call(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= s < 300: continue
              d=b.get('data') or b
              current=d.get('status')
              result['status']=current
              result['build_number']=d.get('buildNumber')
              result['started_at']=d.get('startedAt')
              result['finished_at']=d.get('finishedAt')
              result['commit']=d.get('commit') or d.get('commitId') or d.get('commitSha')
              result['ok']=current=='finished'
              out.write_text(json.dumps(result,indent=2)+'\n')
              print('Codemagic',build_id,current)
              if current in terminal:
                  if current!='finished': raise SystemExit(f'Build ended {current}')
                  break
          else: raise SystemExit('Timed out waiting for Codemagic build')
          PY
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/codemagic-results/app2-008-itpass-final-20260822-1903.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist APP2-008 Codemagic result"
          git pull --rebase origin main
          git push origin HEAD:main
