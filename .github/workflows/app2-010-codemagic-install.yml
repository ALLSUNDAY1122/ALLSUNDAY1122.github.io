name: APP2-010 Reconcile Codemagic Release Workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/app2-010-codemagic-install.json'

permissions:
  contents: write

concurrency:
  group: app2-010-codemagic-install
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconcile Touhan workflow on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git checkout -B app2-010-install origin/main
            python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('codemagic.yaml')
          text=path.read_text(encoding='utf-8')
          marker='\n  touhan-ios:\n'
          start=text.find(marker)
          if start < 0:
              raise SystemExit('touhan-ios workflow missing; do not invent release config')
          body_start=start+1
          search_from=body_start+len('  touhan-ios:\n')
          match=re.search(r'(?m)^  [A-Za-z0-9_-]+:\s*$', text[search_from:])
          end=search_from+match.start() if match else len(text)
          workflow=text[body_start:end]
          required=(
              'BUNDLE_ID: com.allsunday1122.tourokuhanbaisha',
              'APP_STORE_CONNECT_APP_ID: "6802119268"',
              'app-store-connect publish',
              '--type IOS_APP_STORE',
          )
          for token in required:
              if token not in workflow:
                  raise SystemExit(f'Touhan workflow contract changed; missing {token}')
          workflow=workflow.replace('name: 登録販売者 - iOS Internal TestFlight','name: 登録販売者 - iOS App Store Release Candidate')
          workflow=workflow.replace('Apply App Store signing profiles for internal TestFlight only','Apply App Store signing profiles for release candidate')
          workflow=workflow.replace("xcode-project use-profiles --custom-export-options='{\"testFlightInternalTestingOnly\": true}'",'xcode-project use-profiles')
          workflow=workflow.replace('Upload signed IPA to App Store Connect for Internal TestFlight','Upload signed release candidate IPA to App Store Connect')
          if 'testFlightInternalTestingOnly' in workflow:
              raise SystemExit('internal-only export flag remains in Touhan release workflow')
          if 'submit_to_app_store: true' in workflow:
              raise SystemExit('automatic App Store submission must remain disabled')
          path.write_text(text[:body_start]+workflow+text[end:],encoding='utf-8')
          print('PASS: touhan-ios now builds an App Store eligible release candidate without auto-submission')
          PY
            python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('codemagic.yaml').read_text(encoding='utf-8')
          start=text.index('  touhan-ios:\n')
          tail=text[start+len('  touhan-ios:\n'):]
          m=re.search(r'(?m)^  [A-Za-z0-9_-]+:\s*$',tail)
          wf=text[start:start+len('  touhan-ios:\n')+(m.start() if m else len(tail))]
          assert 'testFlightInternalTestingOnly' not in wf
          assert 'name: 登録販売者 - iOS App Store Release Candidate' in wf
          assert 'xcode-project use-profiles' in wf
          assert 'app-store-connect publish' in wf
          assert 'submit_to_app_store: true' not in wf
          print('PASS: release-candidate workflow static contract')
          PY
            if git diff --quiet -- codemagic.yaml; then
              echo "Touhan release workflow already reconciled"
              exit 0
            fi
            git add codemagic.yaml
            git commit -m "Make 登録販売者 build App Store release eligible"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during attempt $attempt; retrying"
            sleep 2
          done
          echo "Failed to reconcile touhan-ios after concurrency retries" >&2
          exit 1
