name: Temporary North B Generate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-generate.yml'
      - 'jichitai-compare/**'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate public data, pages, and progress
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Commit generated outputs to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json \
                  jichitai-compare/data/generated/municipality-pages.json \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/municipality \
                  jichitai-compare/sitemap.xml
          if git diff --cached --quiet; then
            echo 'Generated outputs are already current.'
            exit 0
          fi
          git commit -m 'chore: regenerate North B public outputs [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
