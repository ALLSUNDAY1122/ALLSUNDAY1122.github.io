name: Validate North B sanity audit round 04

on:
  push:
    branches:
      - audit/north-b-sanity-round-04-20260725
    paths:
      - .github/workflows/north-b-sanity-round-04-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/north-b-sanity-round-04-20260725
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate municipality data and generated outputs
        shell: bash
        run: |
          cd jichitai-compare
          npm run check
          cd ..
      - name: Record validation success
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.updatedAt = '2026-07-25T01:07:00+09:00';
          data.workingBranch = null;
          data.pullRequestNumber = 2958;
          data.ciStatus = 'success';
          data.nextAction = '北日本B担当107自治体の誤調査ざっくり再検証を10回に分けて実施中。第4回は富谷市、蔵王町、七ヶ宿町、大河原町、村田町、柴田町、川崎町、丸森町、亘理町、山元町、松島町の11自治体・99制度を確認。柴田町・松島町のこども誰でも通園制度反映漏れを訂正し、npm run check全工程成功。PR #2958をregion/northへ統合後、mainへ公開同期する。監査完了4/10回、44/107自治体、残り6回・63自治体。';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          fs.unlinkSync('.github/workflows/north-b-sanity-round-04-validate.yml');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "audit: 北日本B第4回の完全検証成功を記録"
          git push origin HEAD:audit/north-b-sanity-round-04-20260725