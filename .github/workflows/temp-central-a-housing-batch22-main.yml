name: Temporary Central A Housing Batch 22 Main Sync
on:
  pull_request:
    branches: [main]
    paths: [jichitai-compare/operations/control/central-a-housing-batch22-main-trigger-20260726.json]
permissions: {contents: write}
jobs:
  sync:
    if: github.head_ref == 'sync/central-a-housing-batch22-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', token: '${{ secrets.GITHUB_TOKEN }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Reset and import regional records
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(jichitai-compare/data/municipalities/27/27205.json jichitai-compare/data/municipalities/27/27206.json jichitai-compare/data/municipalities/27/27208.json jichitai-compare/data/municipalities/27/27210.json jichitai-compare/data/municipalities/27/27211.json jichitai-compare/operations/tasks/27205.json jichitai-compare/operations/tasks/27206.json jichitai-compare/operations/tasks/27208.json jichitai-compare/operations/tasks/27210.json jichitai-compare/operations/tasks/27211.json jichitai-compare/operations/audits/central-a-housing-classification-batch22-decisions-20260726.json jichitai-compare/operations/control/session-checkpoints/central-a.json jichitai-compare/operations/control/regions/central.json)
          for f in "${files[@]}"; do mkdir -p "$(dirname "$f")";git show "origin/region/central:$f" > "$f";done
      - name: Regenerate and validate
        run: cd jichitai-compare && npm run generate && npm run check && node --check app.js
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main)
          for f in "${changed[@]}"; do case "$f" in jichitai-compare/data/municipalities/27/27205.json|jichitai-compare/data/municipalities/27/27206.json|jichitai-compare/data/municipalities/27/27208.json|jichitai-compare/data/municipalities/27/27210.json|jichitai-compare/data/municipalities/27/27211.json|jichitai-compare/operations/tasks/27205.json|jichitai-compare/operations/tasks/27206.json|jichitai-compare/operations/tasks/27208.json|jichitai-compare/operations/tasks/27210.json|jichitai-compare/operations/tasks/27211.json|jichitai-compare/operations/audits/central-a-housing-classification-batch22-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/27205/index.html|jichitai-compare/municipality/27206/index.html|jichitai-compare/municipality/27208/index.html|jichitai-compare/municipality/27210/index.html|jichitai-compare/municipality/27211/index.html|jichitai-compare/sitemap.xml) ;; *) echo "Unexpected change: $f";exit 1;; esac;done
      - name: Record and commit
        env: {PR_NUMBER: '${{ github.event.pull_request.number }}', RUN_ID: '${{ github.run_id }}'}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const p='jichitai-compare/operations/audits/central-a-housing-classification-batch22-decisions-20260726.json';const a=JSON.parse(fs.readFileSync(p,'utf8'));a.nationalSyncPullRequestNumber=Number(process.env.PR_NUMBER);a.nationalSyncWorkflowRunId=Number(process.env.RUN_ID);a.nationalSyncStatus='validated_pending_merge';fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');const t='jichitai-compare/operations/control/central-a-housing-batch22-main-trigger-20260726.json';if(fs.existsSync(t))fs.rmSync(t);
          NODE
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add -A;git commit -m 'sync: 中日本A住宅支援分類第22群を全国反映';git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
