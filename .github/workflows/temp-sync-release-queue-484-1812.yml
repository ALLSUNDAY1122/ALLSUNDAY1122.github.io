name: Temporary sync release queue 484 1812

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-484-1812.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile assignment-filtered queue
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/region/north:refs/remotes/origin/region/north \
              +refs/heads/region/east:refs/remotes/origin/region/east \
              +refs/heads/region/central:refs/remotes/origin/region/central \
              +refs/heads/region/west:refs/remotes/origin/region/west
            git checkout -B main origin/main
            python3 - <<'PY'
          import json
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('jichitai-compare')
          queue_path = root / 'operations/control/release-queue.json'
          global_path = root / 'operations/control/global-state.json'
          audit_path = root / 'operations/control/audit-log.jsonl'
          progress = json.loads((root / 'operations/progress.json').read_text(encoding='utf-8'))
          assert progress['registeredMunicipalities'] == 484, progress['registeredMunicipalities']

          specs = {
              'north': ('origin/region/north', lambda p: 1 <= p <= 7, 757),
              'east': ('origin/region/east', lambda p: 8 <= p <= 15 or p in (19, 20), 768),
              'central': ('origin/region/central', lambda p: 16 <= p <= 18 or 21 <= p <= 30, 742),
              'west': ('origin/region/west', lambda p: 31 <= p <= 47, 716),
          }

          def municipality_rows(ref, accept):
              output = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', ref, str(root / 'data/municipalities')],
                  text=True,
              )
              rows = []
              for path in output.splitlines():
                  match = re.fullmatch(
                      r'jichitai-compare/data/municipalities/(\d{2})/(\d{5})\.json', path
                  )
                  if not match or not accept(int(match.group(1))):
                      continue
                  data = json.loads(subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True))
                  rows.append({'code': match.group(2), 'name': data.get('name') or data.get('municipalityName') or match.group(2)})
              return sorted(rows, key=lambda row: row['code'])

          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in queue['entries']}
          counts = {}
          pending = {}
          pending_rows = {}
          total = 0
          ready = []

          for region, (ref, accept, integration_pr) in specs.items():
              main_rows = municipality_rows('HEAD', accept)
              regional_rows = municipality_rows(ref, accept)
              main_codes = {row['code'] for row in main_rows}
              regional_codes = {row['code'] for row in regional_rows}
              missing_from_region = main_codes - regional_codes
              assert not missing_from_region, (region, sorted(missing_from_region))
              rows = [row for row in regional_rows if row['code'] not in main_codes]
              counts[region] = len(regional_rows)
              pending[region] = len(rows)
              pending_rows[region] = rows
              total += len(regional_rows)
              if len(rows) >= 10:
                  ready.append(region)
              entries[region].update({
                  'municipalities': regional_rows,
                  'count': len(regional_rows),
                  'pendingSinceLastRelease': len(rows),
                  'releaseStatus': 'release_ready' if len(rows) >= 10 else ('up_to_date' if not rows else 'pending_threshold'),
                  'reason': f'担当地方ブランチとmainを直接比較。公開484自治体後の未全国統合は{len(rows)}自治体',
                  'mainIntegrationPr': integration_pr,
                  'generatedPullRequest': 770,
                  'auditStatus': 'passed',
              })

          now = datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          next_action = (
              '10自治体到達地域を固定スナップショットで全国統合する。'
              if ready else
              '地方統合を継続。公開後繰越: ' +
              '、'.join(f'{region} {pending[region]}' for region in ('north', 'east', 'central', 'west')) + '。'
          )

          queue.update({
              'updatedAt': now,
              'status': 'active',
              'summary': {
                  'regionalMergedMunicipalities': total,
                  'latestGeneratedMunicipalityCount': 484,
                  'latestGeneratedPullRequest': 770,
                  'latestPublicCountPullRequest': 770,
                  'releaseReadyRegions': ready,
                  'nextAction': next_action,
              },
              'nextAction': next_action,
              'humanDecisionRequired': False,
          })
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          global_state = json.loads(global_path.read_text(encoding='utf-8'))
          global_state.update({
              'updatedAt': now,
              'phase': 'release-monitoring',
              'regionalCompletedSinceLastRelease': {**pending, 'total': sum(pending.values())},
              'priority': {'type': 'release-monitoring', 'nextAction': next_action},
              'lastNationalIntegrationAt': '2026-07-22T17:53:53+09:00',
              'lastNationalIntegrationPr': 768,
              'latestGeneratedMunicipalityCount': 484,
              'latestGeneratedPullRequest': 770,
              'latestPublicCountPullRequest': 770,
              'regionalMergedMunicipalities': total,
              'openPullRequests': [],
              'humanDecisionRequired': False,
          })
          global_path.write_text(json.dumps(global_state, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          record = {
              'timestamp': now,
              'actor': '全国進行統括',
              'action': 'coordinator-rescan-after-public-484',
              'details': {
                  'publicMunicipalityCount': 484,
                  'publicServices': 4356,
                  'regionalCounts': counts,
                  'regionalMergedMunicipalities': total,
                  'pendingSinceLatestNationalIntegration': {**pending, 'total': sum(pending.values())},
                  'pendingMunicipalities': pending_rows,
                  'latestNationalIntegrationPullRequest': 768,
                  'publicationPullRequest': 770,
                  'releaseReadyRegions': ready,
              },
              'humanDecisionRequired': False,
          }
          text = audit_path.read_text(encoding='utf-8')
          if text and not text.endswith('\n'):
              text += '\n'
          audit_path.write_text(text + json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          Path('/tmp/queue-summary').write_text(
              f"{total} {pending['north']} {pending['east']} {pending['central']} {pending['west']}"
          )
          PY
            read total north east central west < /tmp/queue-summary
            git add jichitai-compare/operations/control/release-queue.json \
              jichitai-compare/operations/control/global-state.json \
              jichitai-compare/operations/control/audit-log.jsonl
            git rm .github/workflows/temp-sync-release-queue-484-1812.yml
            git commit -m "統括管理: 公開484・地方統合${total}へ再同期（北${north} 東${east} 中${central} 西${west}）"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
