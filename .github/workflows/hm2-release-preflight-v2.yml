name: HM2 Release Preflight v2

on:
  push:
    branches: [main]
    paths:
      - 'automation/hm2-release-preflight-v2-trigger.txt'
      - '.github/workflows/hm2-release-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hm2-release-preflight-v2
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release preparation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick webp
          if ! command -v magick >/dev/null 2>&1 && command -v convert >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          exec convert "$@"
          SH
            chmod +x "$RUNNER_TEMP/bin/magick"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Audit canonical release registry
        run: python3 scripts/app_release_registry_audit.py

      - name: Prepare exact HM2 web bundle
        env:
          BUILD_NUMBER: '22'
        run: bash ios/health-manager-2/prepare-web-assets.sh

      - name: Install capture dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium

      - name: Capture canonical 6.7-inch App Store screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/release-assets/hm2
          python - <<'PY'
          import hashlib, http.server, json, socketserver, threading, traceback
          from pathlib import Path
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          root=Path('ios/health-manager-2/HealthManager2/Web').resolve()
          out=Path('automation/release-assets/hm2')
          diag_path=out/'capture-diagnostic.json'
          diag={
              'schema_version':1,
              'stage':'init',
              'root':str(root),
              'root_exists':root.exists(),
              'console':[],
              'page_errors':[],
              'files':{},
          }
          page=None
          browser=None

          def persist_diag():
              try:
                  if page is not None:
                      try:
                          diag['url']=page.url
                          diag['body_text']=page.locator('body').inner_text(timeout=2000)[:12000]
                      except Exception as e:
                          diag['body_read_error']=repr(e)
                  diag_path.write_text(json.dumps(diag,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
              except Exception:
                  pass

          def wait_text(text):
              page.wait_for_function(
                  "(t) => document.body && document.body.innerText.includes(t)",
                  arg=text,
                  timeout=10000,
              )

          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args): pass

          if not (root/'index.html').is_file():
              diag['stage']='precheck'
              diag['exception']='generated index.html missing'
              persist_diag()
              raise SystemExit('Generated HM2 index.html missing')

          handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
          server=socketserver.TCPServer(('127.0.0.1',0),handler)
          port=server.server_address[1]
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  diag['stage']='launch_browser'
                  browser=p.chromium.launch()
                  ctx=browser.new_context(
                      viewport={'width':420,'height':912},
                      device_scale_factor=3,
                      locale='ja-JP',
                      reduced_motion='reduce',
                  )
                  page=ctx.new_page()
                  page.on('console', lambda msg: diag['console'].append({'type':msg.type,'text':msg.text}))
                  page.on('pageerror', lambda exc: diag['page_errors'].append(str(exc)))
                  page.add_init_script("window.webkit={messageHandlers:{storekit:{postMessage:function(){}}}};")

                  diag['stage']='navigate'
                  response=page.goto(f'http://127.0.0.1:{port}/index.html',wait_until='load',timeout=15000)
                  diag['http_status']=response.status if response else None
                  diag['ready_state']=page.evaluate('document.readyState')

                  diag['stage']='wait_functions'
                  page.wait_for_function(
                      "() => typeof home==='function' && typeof showPaywall==='function'",
                      timeout=10000,
                  )

                  diag['stage']='render_home'
                  page.evaluate("""() => {
                    window.SM2_STORE={
                      isPremium:false,
                      entitlementSource:'none',
                      monthlyPrice:'¥200/月',
                      lifetimePrice:'¥800',
                      monthlyAvailable:true,
                      lifetimeAvailable:true,
                      message:''
                    };
                    home();
                  }""")
                  wait_text('今日のスプリント')
                  wait_text('全300問を解放')
                  page.wait_for_timeout(500)

                  diag['stage']='screenshot_home'
                  home_path=out/'01-home.png'
                  page.screenshot(path=str(home_path),full_page=False,animations='disabled')
                  diag['files']['01-home.png']={'exists':home_path.exists(),'bytes':home_path.stat().st_size if home_path.exists() else 0}

                  diag['stage']='render_paywall'
                  page.evaluate("showPaywall()")
                  for text in ('月額プラン','買い切り','¥200/月','¥800'):
                      wait_text(text)
                  page.wait_for_timeout(300)

                  diag['stage']='screenshot_premium'
                  premium_path=out/'02-premium.png'
                  page.screenshot(path=str(premium_path),full_page=False,animations='disabled')
                  diag['files']['02-premium.png']={'exists':premium_path.exists(),'bytes':premium_path.stat().st_size if premium_path.exists() else 0}

                  diag['stage']='browser_complete'
                  browser.close()
                  browser=None
          except Exception as e:
              diag['exception']=repr(e)
              diag['traceback']=traceback.format_exc()
              persist_diag()
              raise
          finally:
              try:
                  if browser is not None:
                      browser.close()
              except Exception:
                  pass
              server.shutdown(); server.server_close()

          diag['stage']='validate_images'
          files=[]
          try:
              for name in ('01-home.png','02-premium.png'):
                  path=out/name
                  im=Image.open(path).convert('RGB')
                  size=list(im.size)
                  variance=ImageStat.Stat(im).var
                  diag['files'].setdefault(name,{})
                  diag['files'][name].update({'size':size,'variance':variance})
                  if im.size != (1260,2736):
                      raise RuntimeError(f'Unexpected screenshot size {name}: {im.size}')
                  if max(variance) < 100:
                      raise RuntimeError(f'Screenshot appears blank/near-solid: {name}; variance={variance}')
                  raw=path.read_bytes()
                  files.append({'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'size':'1260x2736'})
                  print(f'PASS {name}: 1260x2736')
          except Exception as e:
              diag['exception']=repr(e)
              diag['traceback']=traceback.format_exc()
              persist_diag()
              raise

          (out/'manifest.json').write_text(json.dumps({
              'schema_version':2,
              'source':'hm2-release-preflight-v2.yml',
              'canonical':True,
              'app_id':'6799751657',
              'bundle_id':'jp.allsunday1122.healthmanager2',
              'version':'1.0',
              'build':'22',
              'monthly_display_price':'¥200/月',
              'lifetime_display_price':'¥800',
              'files':files
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          diag['stage']='complete'
          diag['status']='PASS'
          persist_diag()
          PY

      - name: Re-assert machine-fixable ASC prerequisites
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hm2_configure_standard_iap_prices.py
          python scripts/hm2_configure_iap_metadata.py
          python scripts/hm2_fill_review_contact_from_donor.py
          python scripts/hm2_fix_submission_prereqs.py \
            --source-screen automation/release-assets/hm2/01-home.png \
            --output /tmp/hm2-submission-prereqs.json
          mkdir -p automation/asc-results
          cp hm2-iap-metadata-result.json automation/asc-results/hm2-iap-metadata-result.json
          cp /tmp/hm2-submission-prereqs.json automation/asc-results/hm2-submission-prereqs.json

      - name: Fresh App Store Connect read-back
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          HM2_ASC_RESULT: automation/asc-results/hm2-release-readback.json
        run: python3 scripts/hm2_release_readback.py

      - name: Verify exact release target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/asc-results/hm2-release-readback.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('app_id')) != '6799751657':
              raise SystemExit('ASC app_id mismatch')
          versions=d.get('versions') or []
          v=next((x for x in versions if (x.get('attributes') or {}).get('versionString')=='1.0'),None)
          if not v:
              raise SystemExit('ASC version 1.0 missing')
          raw=p.read_text(encoding='utf-8')
          if 'd97f10a1-dcce-40ed-be25-5e0a6563d7aa' not in raw or '"version": "22"' not in raw:
              raise SystemExit('ASC Build 22 exact target missing from read-back')
          print('PASS: exact target App 6799751657 / Version 1.0 / Build 22 present in fresh ASC read-back')
          PY

      - name: Persist canonical release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/release-assets/hm2 automation/asc-results/hm2-iap-metadata-result.json automation/asc-results/hm2-submission-prereqs.json automation/asc-results/hm2-release-readback.json || true
          if git diff --cached --quiet; then
            echo 'HM2 preflight evidence unchanged.'
            exit 0
          fi
          git commit -m 'chore(hm2): persist verified release preflight evidence'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Failed to persist HM2 preflight evidence after retries.' >&2
          exit 1

      - name: Upload secondary evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hm2-release-preflight-v2
          path: |
            automation/release-assets/hm2
            automation/asc-results/hm2-iap-metadata-result.json
            automation/asc-results/hm2-submission-prereqs.json
            automation/asc-results/hm2-release-readback.json
          if-no-files-found: warn
          retention-days: 14
