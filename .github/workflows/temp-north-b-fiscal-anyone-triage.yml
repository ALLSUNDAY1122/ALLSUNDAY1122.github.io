name: Temporary North B Fiscal Anyone Triage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-fiscal-anyone-triage.yml'

permissions:
  contents: write

concurrency:
  group: north-b-fiscal-anyone-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build triage report
        run: node jichitai-compare/scripts/temp-north-b-fiscal-anyone-triage.mjs

      - name: Commit triage report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/north-b-fiscal-anyone-triage-20260725.json
          git commit -m 'audit: 北日本B旧年度・誰でも通園候補の優先度を記録 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
