name: FP3 EAS Readback

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[FP3-EAS-READ]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Expo account project inventory read-only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ['EXPO_TOKEN'].strip()
          endpoint = 'https://api.expo.dev/graphql'
          target_bundle = 'com.allsunday1122.fp3kakomoncoach'
          query = r'''
          query FP3AccountInventory($accountName: String!) {
            account {
              byName(accountName: $accountName) {
                id
                name
                appsPaginated(first: 100) {
                  edges {
                    node {
                      id
                      slug
                      ownerAccount { name }
                      iosAppCredentials {
                        appleAppIdentifier { bundleIdentifier }
                      }
                    }
                  }
                }
              }
            }
          }
          '''
          body=json.dumps({'query':query,'variables':{'accountName':'allsunday1122'}}, separators=(',',':')).encode()
          req=urllib.request.Request(endpoint,data=body,method='POST',headers={
              'Authorization':f'Bearer {token}',
              'Content-Type':'application/json',
              'Accept':'application/json',
          })
          result={'read_only':True,'target_bundle':target_bundle,'inventory_ok':False,'matches':[]}
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload=json.loads(r.read().decode())
              errors=payload.get('errors') or []
              if errors:
                  result['graphql_errors']=[str(e.get('message',''))[:220] for e in errors if isinstance(e,dict)][:5]
              account=(((payload.get('data') or {}).get('account') or {}).get('byName') or {})
              edges=(((account.get('appsPaginated') or {}).get('edges')) or []) if isinstance(account,dict) else []
              result['inventory_ok']=bool(account.get('id'))
              result['app_count_scanned']=len(edges)
              for edge in edges:
                  app=(edge or {}).get('node') or {}
                  bundles=sorted({
                      str((cred.get('appleAppIdentifier') or {}).get('bundleIdentifier'))
                      for cred in (app.get('iosAppCredentials') or [])
                      if isinstance(cred,dict) and (cred.get('appleAppIdentifier') or {}).get('bundleIdentifier')
                  }) if isinstance(app,dict) else []
                  if target_bundle in bundles:
                      result['matches'].append({
                          'project_id':str(app.get('id') or ''),
                          'slug':str(app.get('slug') or ''),
                          'owner':str(((app.get('ownerAccount') or {}).get('name')) or ''),
                          'bundle_id':target_bundle,
                      })
          except urllib.error.HTTPError as exc:
              result['http']=exc.code
          result['match_count']=len(result['matches'])
          Path('/tmp/fp3-eas-readback.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Report sanitized result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body = 'FP3 EAS read-only inspection failed before producing a sanitized result.';
            if (fs.existsSync('/tmp/fp3-eas-readback.json')) {
              const txt = fs.readFileSync('/tmp/fp3-eas-readback.json','utf8');
              body = `FP3 EAS read-only inspection finished.\n\n\`\`\`json\n${txt}\n\`\`\``;
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
