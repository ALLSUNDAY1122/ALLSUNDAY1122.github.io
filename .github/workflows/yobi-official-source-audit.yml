name: Yobi Official Source Audit

on:
  push:
    branches:
      - feature/yobi-tantou-native-swiftui
    paths:
      - 'learning-sprint/yobi-tantou/content-loop/**'
      - '.github/workflows/yobi-official-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yobi-official-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit dependencies
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1 pdfplumber==0.11.7
      - name: Discover official MOJ PDFs
        run: python learning-sprint/yobi-tantou/content-loop/probe_moj_pdfs.py
      - name: Verify official R6-R8 structure
        run: python learning-sprint/yobi-tantou/content-loop/audit_official_pdf_structure.py
      - name: Inspect scoring table layout
        run: python learning-sprint/yobi-tantou/content-loop/inspect_official_scoring_layout.py
      - name: Inspect question shapes and result scores
        run: python learning-sprint/yobi-tantou/content-loop/inspect_official_exam_shapes.py
      - name: Inspect missing R7 slot blocks
        run: python learning-sprint/yobi-tantou/content-loop/inspect_missing_r7_slots.py
      - name: Extract official answer tables with coordinates
        run: python learning-sprint/yobi-tantou/content-loop/extract_official_answer_tables.py
      - name: Build compact scoring-table summary
        run: python learning-sprint/yobi-tantou/content-loop/summarize_official_answer_tables.py
      - name: Build compact question-shape summary
        run: python learning-sprint/yobi-tantou/content-loop/summarize_official_question_shapes.py
      - name: Build R6-R7 canonical scoring data
        id: canonical
        continue-on-error: true
        run: python learning-sprint/yobi-tantou/content-loop/build_official_scoring_canonical_fixed.py
      - name: Copy verified canonical into iOS resources
        if: steps.canonical.outcome == 'success'
        run: |
          cp learning-sprint/yobi-tantou/content-loop/official-scoring-canonical.v1.json \
             learning-sprint/yobi-tantou/ios/Resources/official-scoring-canonical.v1.json
      - name: Persist verified canonical on source branch
        if: steps.canonical.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-sprint/yobi-tantou/content-loop/official-scoring-canonical.v1.json
          git add learning-sprint/yobi-tantou/ios/Resources/official-scoring-canonical.v1.json
          if git diff --cached --quiet; then
            echo 'Canonical scoring is already current.'
            exit 0
          fi

          git commit -m 'data(yobi): sync verified R6-R7 official scoring canonical'

          # This audit can overlap with a newer source commit. Never force-push an
          # old checkout: replay only the generated canonical commit onto the
          # latest remote branch, then fast-forward push. Any real conflict fails.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Persisted canonical scoring on latest source branch.'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "${attempt}" -lt 3 ]; then
              sleep 2
            fi
          done

          echo 'FAIL: could not safely fast-forward canonical scoring onto latest source branch.' >&2
          exit 1
      - name: Upload official-source summaries and canonical scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yobi-official-source-summaries
          path: |
            learning-sprint/yobi-tantou/content-loop/official-scoring-table-summary.json
            learning-sprint/yobi-tantou/content-loop/official-question-shapes-summary.json
            learning-sprint/yobi-tantou/content-loop/official-scoring-canonical.v1.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce canonical build success
        if: steps.canonical.outcome != 'success'
        run: |
          echo 'FAIL: canonical scoring build did not pass; summaries were preserved for diagnosis.' >&2
          exit 1
