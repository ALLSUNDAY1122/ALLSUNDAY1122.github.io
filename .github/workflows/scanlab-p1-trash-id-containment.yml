name: Scan Lab P1 trash ID containment one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-trash-id-containment.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Harden trash restore/delete ID containment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('splat-native-ios/SplatNative/MeshProjectStore.swift')
          s = p.read_text()
          old = '''    func restoreFromTrash(id: String) throws {\n        try ensureDirectories()\n        let source = trashURL.appendingPathComponent(id).appendingPathExtension(Self.projectExtension)\n        guard fileManager.fileExists(atPath: source.path) else { throw MeshProjectStoreError.archiveMissing }\n\n        var restoredID = id\n        var destination = libraryURL.appendingPathComponent(restoredID).appendingPathExtension(Self.projectExtension)\n        if fileManager.fileExists(atPath: destination.path) {\n            restoredID = UUID().uuidString\n            destination = libraryURL.appendingPathComponent(restoredID).appendingPathExtension(Self.projectExtension)\n        }\n        try fileManager.moveItem(at: source, to: destination)\n        if restoredID != id {\n            var manifest = try readLibraryManifest(projectURL: destination)\n            manifest.id = restoredID\n            try writeLibraryManifest(manifest, projectURL: destination)\n        }\n    }\n\n    func permanentlyDeleteFromTrash(id: String) throws {\n        let target = trashURL.appendingPathComponent(id).appendingPathExtension(Self.projectExtension)\n        guard fileManager.fileExists(atPath: target.path) else { throw MeshProjectStoreError.archiveMissing }\n        try fileManager.removeItem(at: target)\n    }\n'''
          new = '''    func restoreFromTrash(id: String) throws {\n        try ensureDirectories()\n        let source = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: source.path) else { throw MeshProjectStoreError.archiveMissing }\n\n        var restoredID = id\n        var destination = libraryURL.appendingPathComponent(restoredID).appendingPathExtension(Self.projectExtension)\n        if fileManager.fileExists(atPath: destination.path) {\n            restoredID = UUID().uuidString\n            destination = libraryURL.appendingPathComponent(restoredID).appendingPathExtension(Self.projectExtension)\n        }\n        try fileManager.moveItem(at: source, to: destination)\n        if restoredID != id {\n            var manifest = try readLibraryManifest(projectURL: destination)\n            manifest.id = restoredID\n            try writeLibraryManifest(manifest, projectURL: destination)\n        }\n    }\n\n    func permanentlyDeleteFromTrash(id: String) throws {\n        let target = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: target.path) else { throw MeshProjectStoreError.archiveMissing }\n        try fileManager.removeItem(at: target)\n    }\n\n    private func validatedTrashProjectURL(id: String) throws -> URL {\n        guard !id.isEmpty, id != ".", id != "..",\n              !id.contains("/"), !id.contains("\\\\"), !id.contains("\\0") else {\n            throw MeshProjectStoreError.invalidProject\n        }\n        let candidate = trashURL.appendingPathComponent(id).appendingPathExtension(Self.projectExtension).standardizedFileURL\n        guard candidate.deletingLastPathComponent().standardizedFileURL == trashURL.standardizedFileURL,\n              candidate.lastPathComponent == "\\(id).\\(Self.projectExtension)" else {\n            throw MeshProjectStoreError.invalidProject\n        }\n        return candidate\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'MeshProjectStore patch anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          t = Path('splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift')
          tests = t.read_text()
          anchor = '''    func testAdoptsLegacyCompletedWorkingProjectButIgnoresIncompleteOne() throws {\n'''
          insertion = '''    func testTrashRestoreRejectsTraversalIDWithoutMovingOutsideArchive() throws {\n        let outside = rootURL.appendingPathComponent("escape").appendingPathExtension(MeshProjectStore.projectExtension)\n        try FileManager.default.createDirectory(at: outside, withIntermediateDirectories: true)\n        try Data([0xAA]).write(to: outside.appendingPathComponent("sentinel"))\n\n        XCTAssertThrowsError(try store.restoreFromTrash(id: "../../escape")) { error in\n            guard case MeshProjectStoreError.invalidProject = error else {\n                return XCTFail("Expected invalidProject, got \\(error)")\n            }\n        }\n        XCTAssertTrue(FileManager.default.fileExists(atPath: outside.appendingPathComponent("sentinel").path))\n        XCTAssertTrue(FileManager.default.fileExists(atPath: outside.path))\n    }\n\n    func testTrashPermanentDeleteRejectsTraversalIDWithoutDeletingOutsideArchive() throws {\n        let outside = rootURL.appendingPathComponent("escape-delete").appendingPathExtension(MeshProjectStore.projectExtension)\n        try FileManager.default.createDirectory(at: outside, withIntermediateDirectories: true)\n        try Data([0xBB]).write(to: outside.appendingPathComponent("sentinel"))\n\n        XCTAssertThrowsError(try store.permanentlyDeleteFromTrash(id: "../../escape-delete")) { error in\n            guard case MeshProjectStoreError.invalidProject = error else {\n                return XCTFail("Expected invalidProject, got \\(error)")\n            }\n        }\n        XCTAssertTrue(FileManager.default.fileExists(atPath: outside.appendingPathComponent("sentinel").path))\n        XCTAssertTrue(FileManager.default.fileExists(atPath: outside.path))\n    }\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test anchor count={tests.count(anchor)}')
          t.write_text(tests.replace(anchor, insertion + anchor, 1))
          PY
          grep -q 'validatedTrashProjectURL' splat-native-ios/SplatNative/MeshProjectStore.swift
          grep -q 'testTrashPermanentDeleteRejectsTraversalID' splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
      - name: Build and run focused store tests
        run: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          cd splat-native-ios
          xcodegen generate
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:SplatNativeTests/MeshProjectStoreTests test
      - name: Commit verified containment patch and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/scanlab-p1-trash-id-containment.yml
          git add splat-native-ios/SplatNative/MeshProjectStore.swift splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
          git commit -m 'fix(mesh): contain trash restore and delete IDs'
          git push origin HEAD:feature/splat-post-build17-p1
