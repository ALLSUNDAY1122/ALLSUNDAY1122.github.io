name: Temporary Dynamic Release Queue Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-302.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue from latest regional branches
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess,datetime
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(path.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          state_field={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,p): return subprocess.check_output(['git','show',f'{ref}:{p}'],text=True)
          def assigned(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          for region in ('north','east','central','west'):
              ref=f'origin/region/{region}'
              files=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              items=[]
              for file in files:
                  if not re.search(r'/\d{5}\.json$',file): continue
                  data=json.loads(show(ref,file))
                  if assigned(region,data['prefectureCode']): items.append({'code':data['code'],'name':data['name']})
              items.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending=int(state.get(state_field[region],0))
              entry=by[region]
              entry.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':pending,'releaseStatus':'release_ready' if pending>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体','mainIntegrationPr':state.get('lastNationalIntegrationPr'),'generatedPullRequest':500})
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T07:48:00+09:00'
          q['status']='active'
          q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':284,'latestGeneratedPullRequest':500,'latestPublicCountPullRequest':500,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"}
          path.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(f'regional total={total}, pending={pending}')
          PY
          git rm .github/workflows/temp-sync-release-queue-302.yml
          git add jichitai-compare/operations/control/release-queue.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          total=$(python3 -c "import json;print(json.load(open('jichitai-compare/operations/control/release-queue.json'))['summary']['regionalMergedMunicipalities'])")
          git commit -m "統括管理: 地方統合${total}自治体・公開284自治体へ同期"
          git push origin main
