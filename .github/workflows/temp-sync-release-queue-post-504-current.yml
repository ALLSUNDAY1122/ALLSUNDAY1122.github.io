name: Temporary Sync Release Queue Post 504 Current

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-post-504-current.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild current queue, global state and audit
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          import json,re,subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root=Path('jichitai-compare')
          queue_path=root/'operations/control/release-queue.json'
          global_path=root/'operations/control/global-state.json'
          audit_path=root/'operations/control/audit-log.jsonl'
          q=json.loads(queue_path.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          fields={
            'north':'completedMunicipalitiesSinceLastNationalMerge',
            'east':'completedMunicipalitiesSinceLastNationalMerge',
            'central':'completedSinceLastRelease',
            'west':'completedMunicipalitiesSinceLastNationalMerge'
          }
          integration_pr={'north':800,'east':768,'central':780,'west':716}
          def show(ref,path):
            return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(r,pref):
            n=int(pref)
            return {
              'north':1<=n<=7,
              'east':8<=n<=15 or n in (19,20),
              'central':16<=n<=18 or 21<=n<=30,
              'west':31<=n<=47
            }[r]
          pending={}
          pending_rows={}
          counts={}
          for r in ('north','east','central','west'):
            ref=f'origin/region/{r}'
            names=subprocess.check_output(
              ['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True
            ).splitlines()
            items=[]
            for path in names:
              if not re.search(r'/\d{5}\.json$',path):
                continue
              d=json.loads(show(ref,path))
              if belongs(r,d['prefectureCode']):
                items.append({'code':d['code'],'name':d['name']})
            items.sort(key=lambda x:x['code'])
            state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json'))
            value=int(state.get(fields[r],0))
            pending[r]=value
            pending_rows[r]=items[-value:] if value else []
            counts[r]=len(items)
            e=by[r]
            e['municipalities']=items
            e['count']=len(items)
            e['pendingSinceLastRelease']=value
            e['releaseStatus']='release_ready' if value>=10 else ('up_to_date' if value==0 else 'pending_threshold')
            e['reason']=f'地方状態ファイルと担当地方ブランチを再走査。前回全国統合後の繰越は{value}自治体'
            e['mainIntegrationPr']=integration_pr[r]
            e['generatedPullRequest']=801
            e['auditStatus']='passed'
          total=sum(counts.values())
          ready=[r for r in ('north','east','central','west') if pending[r]>=10]
          now=datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          next_action=(
            '10自治体到達地域を固定スナップショットで全国統合する: '+', '.join(ready)
            if ready else
            f"地方統合を継続。北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"
          )
          q['updatedAt']=now
          q['status']='active'
          q['summary']={
            'regionalMergedMunicipalities':total,
            'latestGeneratedMunicipalityCount':504,
            'latestGeneratedPullRequest':801,
            'latestPublicCountPullRequest':801,
            'releaseReadyRegions':ready,
            'nextAction':next_action
          }
          q['nextAction']=next_action
          q['humanDecisionRequired']=False
          queue_path.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          g=json.loads(global_path.read_text(encoding='utf-8'))
          g.update({
            'updatedAt':now,
            'phase':'release-monitoring',
            'regionalCompletedSinceLastRelease':{**pending,'total':sum(pending.values())},
            'priority':{'type':'release-monitoring','nextAction':next_action},
            'lastNationalIntegrationAt':'2026-07-22T19:09:38+09:00',
            'lastNationalIntegrationPr':800,
            'latestGeneratedMunicipalityCount':504,
            'latestGeneratedPullRequest':801,
            'latestPublicCountPullRequest':801,
            'regionalMergedMunicipalities':total,
            'openPullRequests':[],
            'humanDecisionRequired':False
          })
          global_path.write_text(json.dumps(g,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          record={
            'timestamp':now,
            'actor':'全国進行統括',
            'action':'coordinator-sync-after-public-504-current',
            'details':{
              'publicMunicipalityCount':504,
              'publicServices':4536,
              'regionalCounts':counts,
              'regionalMergedMunicipalities':total,
              'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},
              'pendingMunicipalities':pending_rows,
              'nationalIntegrationPullRequest':800,
              'publicationPullRequest':801,
              'releaseReadyRegions':ready
            },
            'humanDecisionRequired':False
          }
          text=audit_path.read_text(encoding='utf-8')
          if text and not text.endswith('\n'):
            text+='\n'
          audit_path.write_text(text+json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          Path('/tmp/queue-total').write_text(str(total))
          Path('/tmp/pending').write_text(f"{pending['north']} {pending['east']} {pending['central']} {pending['west']}")
          PY
          TOTAL=$(cat /tmp/queue-total)
          read NORTH EAST CENTRAL WEST < /tmp/pending
          rm .github/workflows/temp-sync-release-queue-post-504-current.yml
          git add jichitai-compare/operations/control/release-queue.json \
            jichitai-compare/operations/control/global-state.json \
            jichitai-compare/operations/control/audit-log.jsonl \
            .github/workflows/temp-sync-release-queue-post-504-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "統括管理: 地方統合${TOTAL}・公開504へ同期（北${NORTH} 東${EAST} 中${CENTRAL} 西${WEST}）"
          git push origin main
