name: Central A Weak Sources Main Sync 20260725

on:
  push:
    branches:
      - sync/central-a-weak-sources-main-20260725-1156

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy regional source, task, audit and state files
        run: |
          git fetch origin region/central
          git checkout origin/region/central -- \
            jichitai-compare/data/municipalities/18/18481.json \
            jichitai-compare/data/municipalities/18/18483.json \
            jichitai-compare/data/municipalities/21/21403.json \
            jichitai-compare/data/municipalities/21/21505.json \
            jichitai-compare/operations/tasks/18481.json \
            jichitai-compare/operations/tasks/18483.json \
            jichitai-compare/operations/tasks/21403.json \
            jichitai-compare/operations/tasks/21505.json \
            jichitai-compare/operations/audits/central-a-weak-primary-source-batch1-decisions-20260725.json \
            jichitai-compare/operations/audits/central-a-weak-source-state-sync-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/central-a.json \
            jichitai-compare/operations/control/regions/central.json
      - name: Regenerate national data and public pages
        working-directory: jichitai-compare
        run: |
          npm run check
          node ./scripts/generate-municipality-pages.mjs
          node --check app.js
      - name: Verify synchronized content
        run: |
          node -e "const d=require('./jichitai-compare/data/generated/municipalities.json');for(const c of ['18481','18483','21403','21505'])if(!d.municipalities.some(x=>x.code===c))process.exit(1)"
          grep -q '利用者向けの対象・施設・料金・申請条件は確認できない' jichitai-compare/municipality/18481/index.html
          grep -q '利用者向けの対象・施設・料金・申請条件は確認できない' jichitai-compare/municipality/18483/index.html
          grep -q '令和8年4月1日から当面の間' jichitai-compare/municipality/21403/index.html
          grep -q '就学援助制度' jichitai-compare/municipality/21505/index.html
          node -e "const c=require('./jichitai-compare/operations/control/session-checkpoints/central-a.json');if(c.qualityReaudit.issue3141UnresolvedItemCount!==21||c.qualityReaudit.candidateCounts.weakPrimarySource!==42)process.exit(1)"
      - name: Commit national synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f jichitai-compare/operations/audits/.central-a-weak-sources-main-trigger
          git rm .github/workflows/central-a-weak-sources-main-sync-20260725.yml
          git add -A
          git commit -m "sync: 中日本A弱い主出典第1群をmain公開生成物へ反映"
          git push origin HEAD:sync/central-a-weak-sources-main-20260725-1156
