name: Temporary East A Public Verification V2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-publication:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/east-a-second-audit-public-v2-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect trigger
        id: detect
        shell: bash
        run: |
          if [[ -f jichitai-compare/operations/triggers/east-a-second-audit-public-verify-v2.txt ]]; then
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_verify=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.run_verify == 'true'
        with:
          node-version: '24'
      - name: Verify live publication
        if: steps.detect.outputs.run_verify == 'true'
        id: live
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const expected = new Map([
            ['10201', '5,000円'],
            ['13103', '2,000円'],
            ['19201', '子育て世帯住宅取得支援事業'],
            ['19202', '市外在住1日1,500円'],
            ['19205', '日額2,500円'],
            ['19206', '日額4,000円'],
            ['20201', '連続7日'],
            ['20202', '8時間以内2,600円'],
            ['20203', '1日1,000円'],
            ['20204', '受付一時中止'],
            ['20205', '実費400円']
          ]);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let passed = false;
          let successfulAttempt = 0;
          let finalChecks = [];

          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const token = `${Date.now()}-${attempt}`;
            const checks = [];
            let allOk = true;
            try {
              const jsonResponse = await fetch(`${base}/data/generated/municipalities.json?v=${token}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(30000),
                headers: { 'user-agent': 'EastAPublicVerificationV2/1.0' }
              });
              const raw = await jsonResponse.json();
              const municipalities = Array.isArray(raw) ? raw : raw.municipalities;
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services || {}).length, 0);
              let jsonOk = jsonResponse.ok && municipalities.length === 1741 && serviceCount === 15669;
              for (const [code, phrase] of expected) {
                const item = municipalities.find((entry) => String(entry.code) === code);
                if (!item || !JSON.stringify(item).includes(phrase)) jsonOk = false;
              }
              const sakae = municipalities.find((entry) => String(entry.code) === '20602');
              const sakaeStatuses = Object.values(sakae?.services || {}).map((service) => service.status);
              if (sakaeStatuses.length !== 9 || sakaeStatuses.some((status) => status !== 'unavailable')) jsonOk = false;
              checks.push({ target: 'generated', status: jsonResponse.status, municipalityCount: municipalities.length, serviceCount, ok: jsonOk });
              if (!jsonOk) allOk = false;
            } catch (error) {
              checks.push({ target: 'generated', ok: false, error: String(error?.message ?? error) });
              allOk = false;
            }

            for (const [code, phrase] of expected) {
              try {
                const response = await fetch(`${base}/municipality/${code}/?v=${token}`, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(20000),
                  headers: { 'user-agent': 'EastAPublicVerificationV2/1.0' }
                });
                const text = await response.text();
                const ok = response.ok && text.includes(phrase);
                checks.push({ target: code, status: response.status, phrase, ok });
                if (!ok) allOk = false;
              } catch (error) {
                checks.push({ target: code, phrase, ok: false, error: String(error?.message ?? error) });
                allOk = false;
              }
            }

            finalChecks = checks;
            if (allOk) {
              passed = true;
              successfulAttempt = attempt;
              break;
            }
            await sleep(10000);
          }

          fs.writeFileSync('/tmp/east-a-public-verification.json', JSON.stringify({ passed, successfulAttempt, checks: finalChecks }, null, 2));
          console.log(fs.readFileSync('/tmp/east-a-public-verification.json', 'utf8'));
          if (!passed) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `attempt=${successfulAttempt}\n`);
          NODE
      - name: Record verification
        if: steps.detect.outputs.run_verify == 'true'
        shell: bash
        env:
          VERIFY_PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY_RUN_ID: ${{ github.run_id }}
          VERIFY_ATTEMPT: ${{ steps.live.outputs.attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('jichitai-compare')
          checked_at = '2026-07-25T12:45:00+09:00'
          verify_pr = int(os.environ['VERIFY_PR_NUMBER'])
          verify_run = int(os.environ['VERIFY_RUN_ID'])
          verify_attempt = int(os.environ['VERIFY_ATTEMPT'])
          codes = ['10201','13103','19201','19202','19205','19206','20201','20202','20203','20204','20205']

          record = {
              'schemaVersion': '1.0.0',
              'auditId': 'east-a-public-verification-20260725',
              'sessionId': 'east-a',
              'targetMainPullRequestNumber': 3302,
              'targetMainMergeSha': '2942166a3e1d06009fcdf6ab31552553fa917bd3',
              'targetMainCiRunNumber': 8053,
              'targetMainCiRunId': 30142377954,
              'verificationPullRequestNumber': verify_pr,
              'verificationRunId': verify_run,
              'successfulAttempt': verify_attempt,
              'publishedBaseUrl': 'https://allsunday1122.github.io/jichitai-compare',
              'generatedJson': {
                  'status': 'success',
                  'municipalityCount': 1741,
                  'serviceCount': 15669,
                  'verifiedMunicipalityCodes': codes,
                  'sakaeUnavailableServices': 9,
                  'needsMediumReviewServices': 0
              },
              'municipalityPages': {
                  'status': 'success',
                  'verifiedCount': len(codes),
                  'expectedCount': len(codes),
                  'codes': codes
              },
              'status': 'success',
              'checkedAt': checked_at
          }
          (root / 'operations/audits/east-a-public-verification-20260725.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = root / 'operations/audits/east-a-quality-improvement-second-audit-20260725.json'
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          audit['status'] = 'completed_main_public_verified'
          audit['nextAction'] = '栄村公式サイト復旧時のみIssue #2847に基づき9制度を再調査する。通常の第2監査作業は完了。'
          audit['mainIntegration'] = {
              'pullRequestNumber': 3302,
              'sourceRegionalPullRequests': [3210, 3251, 3276, 3283],
              'ciRunNumber': 8053,
              'ciRunId': 30142377954,
              'ciStatus': 'success',
              'mergeSha': '2942166a3e1d06009fcdf6ab31552553fa917bd3',
              'status': 'success'
          }
          audit['publicVerification'] = {
              'pullRequestNumber': verify_pr,
              'runId': verify_run,
              'status': 'success',
              'verifiedMunicipalityCount': len(codes),
              'municipalityCount': 1741,
              'serviceCount': 15669,
              'checkedAt': checked_at
          }
          audit['updatedAt'] = checked_at
          audit['publicVerifiedAt'] = checked_at
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checkpoint_path = root / 'operations/control/session-checkpoints/east-a.json'
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          checkpoint['updatedAt'] = checked_at
          checkpoint['pullRequestNumber'] = verify_pr
          checkpoint['ciStatus'] = 'success'
          qa = checkpoint['qualityImprovementSecondAudit']
          qa.update({
              'status': 'completed_main_public_verified',
              'currentRound': 'completed',
              'nextAction': '栄村公式サイト復旧時のみIssue #2847に基づき再調査する。',
              'nationalPullRequestNumber': 3302,
              'nationalCiRunNumber': 8053,
              'nationalCiRunId': 30142377954,
              'nationalMergeSha': '2942166a3e1d06009fcdf6ab31552553fa917bd3',
              'nationalIntegrationStatus': 'success',
              'publicVerificationPullRequestNumber': verify_pr,
              'publicVerificationRunId': verify_run,
              'publicVerificationStatus': 'success',
              'completedAt': checked_at
          })
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runner_path = root / 'operations/audits/east-a-main-sync-runner-20260725.json'
          runner = json.loads(runner_path.read_text(encoding='utf-8'))
          runner.update({
              'mainMergeSha': '2942166a3e1d06009fcdf6ab31552553fa917bd3',
              'standardCiRunNumber': 8053,
              'standardCiRunId': 30142377954,
              'standardCiStatus': 'success',
              'status': 'main_merged_public_verified',
              'publicVerificationRunId': verify_run,
              'checkedAt': checked_at
          })
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit verification record
        if: steps.detect.outputs.run_verify == 'true'
        shell: bash
        run: |
          rm -f jichitai-compare/operations/triggers/east-a-second-audit-public-verify-v2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "audit: verify East A second audit publication v2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
