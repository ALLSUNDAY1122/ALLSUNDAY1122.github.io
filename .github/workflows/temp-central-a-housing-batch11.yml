name: Temporary Central A Housing Batch 11

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch11-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch11-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 11
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-25';
          const updatedAt='2026-07-25T22:17:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const replacements={
            '21421': {
              type:'general_migration_misclassification',
              service:{
                status:'unavailable',
                summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details:{
                  confirmedGeneralProgram:'東京圏からの移住者に、就業等の要件を満たす場合、世帯最大100万円・単身60万円の移住支援金を交付する。',
                  classificationReview:'東京圏からの一般移住・就業支援であり、子どもの有無、子育て世帯限定、住宅取得・改修・家賃の子育て加算を公式本文で確認できないため、子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.town.kitagata.gifu.jp/soshiki/seisakuzaisei/1/4/1/867.html',checkedAt}
              }
            },
            '23204': {
              type:'general_migration_misclassification',
              service:{
                status:'unavailable',
                summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details:{
                  confirmedGeneralProgram:'東京圏から瀬戸市へ移住し、就業・起業等の要件を満たす方へ世帯100万円・単身60万円の移住支援金を交付する。',
                  classificationReview:'東京一極集中是正と人材確保を目的とする一般移住支援で、子育て世帯固有の住宅条件・子ども加算を現行公式ページで確認できないため、子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.city.seto.aichi.jp/docs/2019/05/20/00096/',checkedAt}
              }
            },
            '24202': {
              type:'child_addition_clarification',
              service:{
                status:'verified',
                summary:'東京23区から要件を満たして移住する世帯へ100万円、単身者へ60万円を交付し、18歳未満の世帯員1人につき30万円を加算する。',
                details:{
                  program:'四日市市移住支援事業',
                  target:'東京23区の在住者または通勤者が四日市市へ移住し、就業・起業等の要件を満たす場合',
                  amount:'単身60万円、2人以上世帯100万円',
                  childAddition:'申請年度の4月1日時点で18歳未満の世帯員を帯同する場合、1人につき30万円を加算',
                  residence:'申請日から5年以上継続して居住する意思等が必要',
                  fiscalYear:'2026年4月1日改正後の条件'
                },
                source:{url:'https://www.city.yokkaichi.lg.jp/www/contents/1589692436765/index.html',checkedAt}
              }
            },
            '24212': {
              type:'replace_with_current_newlywed_program',
              service:{
                status:'verified',
                summary:'39歳以下の新婚世帯へ、住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',
                details:{
                  program:'熊野市結婚新生活支援事業',
                  target:'夫婦双方が39歳以下で、所得等の要件を満たし、対象住宅が熊野市内にある新婚世帯',
                  covered:'住宅取得費、住宅賃借費、住宅リフォーム費、引越費用',
                  amount:'1世帯上限30万円。夫婦とも婚姻日に29歳以下の場合は上限60万円',
                  currentStatus:'2026年度の地域少子化対策重点推進交付金実施計画で継続実施を確認',
                  application:'対象期間・必要書類は申請年度の市案内を確認し、福祉事務所児童福祉係へ申請する。'
                },
                source:{url:'https://www.city.kumano.lg.jp/administration/?content=2233',checkedAt},
                additionalSources:[
                  {url:'https://www.city.kumano.lg.jp/life/?category=139',checkedAt},
                  {url:'https://www.city.kumano.lg.jp/reiki_int/reiki_honbun/r314RG00001014.html',checkedAt}
                ]
              }
            },
            '21504': {
              type:'child_exception_and_addition_clarification',
              service:{
                status:'verified',
                summary:'移住定住世帯へ年5万円を最長5年交付し、中学生以下の子がいる世帯は世帯主年齢要件を緩和するとともに、初年度は子ども1人につき5万円を加算する。',
                details:{
                  program:'七宗町移住定住奨励金',
                  migration:'世帯主50歳以下の移住世帯へ年5万円を最長5年間交付',
                  childCondition:'世帯主が51歳以上でも中学生以下の子どもが属する世帯は年齢要件の例外',
                  childAddition:'最初の1年目は中学生以下の子ども1人につき5万円を加算',
                  housingAcquisition:'空き家バンクを利用した住宅取得は購入価格の2分の1。世帯主50歳以下は上限50万円、51歳以上は上限25万円',
                  newConstruction:'町内事業者による新築100万円、町外事業者による新築50万円'
                },
                source:{url:'https://www.hichiso.jp/top/kanko/settled/encourage/',checkedAt},
                additionalSources:[{url:'https://www.hichiso.jp/reiki_int/reiki_honbun/i364RG00000505.html',checkedAt}]
              }
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(replacements)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-25: 住宅支援分類第11群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');

            records.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch11-decisions-20260725',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B②',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:5,
            statusToUnavailableCount:2,
            verifiedClarificationOrReplacementCount:3,
            corrected:records,
            causeScan:{previousRemainingCandidates:124,reviewedHighRiskCandidates:5,remainingCandidates:119},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般移住・就業支援だけを子育て世帯向け住宅支援として登録しない',
              '子ども加算・子どもによる年齢要件緩和・新婚世帯向け住宅費支援は、現行公式本文で確認して明示する',
              '計画公開だけで利用条件を補完せず、現行制度ページ・要綱と組み合わせて記録する'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch11-decisions-20260725.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残119件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=109;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=541;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=119;
          checkpoint.qualityReaudit.confirmedCorrections.push(
            {type:'general_migration_misclassification',code:'21421',service:'housingSupport',name:'北方町'},
            {type:'general_migration_misclassification',code:'23204',service:'housingSupport',name:'瀬戸市'},
            {type:'child_addition_clarification',code:'24202',service:'housingSupport',name:'四日市市'},
            {type:'newlywed_housing_replacement',code:'24212',service:'housingSupport',name:'熊野市'},
            {type:'child_exception_and_addition_clarification',code:'21504',service:'housingSupport',name:'七宗町'}
          );
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残119件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.lastAction='原因別重点再監査の住宅支援分類第11群として、北方町・瀬戸市の一般移住制度をunavailableへ修正し、四日市市・熊野市・七宗町の子ども加算・新婚・子ども要件を現行公式情報で明確化した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch={batch:11,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,correctedMunicipalityCount:5,remainingCandidates:119,regionalPullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),blocker:null};
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch11-trigger-20260725.json');
          if(fs.existsSync(trigger)) fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/21/21421.json|jichitai-compare/data/municipalities/21/21504.json|jichitai-compare/data/municipalities/23/23204.json|jichitai-compare/data/municipalities/24/24202.json|jichitai-compare/data/municipalities/24/24212.json|jichitai-compare/operations/tasks/21421.json|jichitai-compare/operations/tasks/21504.json|jichitai-compare/operations/tasks/23204.json|jichitai-compare/operations/tasks/24202.json|jichitai-compare/operations/tasks/24212.json|jichitai-compare/operations/audits/central-a-housing-classification-batch11-decisions-20260725.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/21421/index.html|jichitai-compare/municipality/21504/index.html|jichitai-compare/municipality/23204/index.html|jichitai-compare/municipality/24202/index.html|jichitai-compare/municipality/24212/index.html|jichitai-compare/operations/control/central-a-housing-batch11-trigger-20260725.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第11群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
