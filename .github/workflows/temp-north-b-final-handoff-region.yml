name: Temporary North B Final Handoff Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-final-handoff-region.yml'

permissions:
  contents: write

concurrency:
  group: north-b-final-handoff-region-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout regional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import final handoff from main
        shell: bash
        run: |
          git checkout 1a74d93865856b2096183c894911055392a5a03a -- \
            jichitai-compare/operations/audits/north-b-quality-second-audit-final-handoff-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json

      - name: Regenerate and validate regional data
        shell: bash
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit final regional state
        shell: bash
        run: |
          rm -f .github/workflows/temp-north-b-final-handoff-region.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-final-handoff-region.yml \
            jichitai-compare/operations/audits/north-b-quality-second-audit-final-handoff-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          git commit -m 'sync: 北日本B最終引き渡しをregion/northへ反映 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
