name: Temporary Sync Release Queue 186

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-release-queue-186.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release queue and remove workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node - <<'NODE'
          import fs from 'node:fs';
          const path = 'jichitai-compare/operations/control/release-queue.json';
          const queue = JSON.parse(fs.readFileSync(path, 'utf8'));
          const addUnique = (entry, additions) => {
            const seen = new Set(entry.municipalities.map(x => x.code));
            for (const item of additions) {
              if (!seen.has(item.code)) {
                entry.municipalities.push(item);
                seen.add(item.code);
              }
            }
            entry.municipalities.sort((a, b) => a.code.localeCompare(b.code));
            entry.count = entry.municipalities.length;
          };
          const north = queue.entries.find(x => x.region === 'north');
          const east = queue.entries.find(x => x.region === 'east');
          const central = queue.entries.find(x => x.region === 'central');
          const west = queue.entries.find(x => x.region === 'west');
          if (!north || !east || !central || !west) throw new Error('region entry not found');

          addUnique(north, [
            {code:'01393',name:'黒松内町'},
            {code:'01394',name:'蘭越町'},
            {code:'01395',name:'ニセコ町'},
            {code:'01396',name:'真狩村'}
          ]);
          north.pendingSinceLastRelease = 7;
          north.releaseStatus = 'pending_threshold';
          north.reason = '鹿部町から今金町までの追加10自治体をPR #352でmainへ全国統合し、生成・公開をPR #355で164自治体へ更新。その後、せたな町・島牧村・寿都町・黒松内町・蘭越町・ニセコ町・真狩村を地方統合';
          north.mainIntegrationPr = 352;
          north.generatedPullRequest = 355;

          addUnique(east, [{code:'08226',name:'那珂市'}]);
          east.pendingSinceLastRelease = 5;
          east.releaseStatus = 'pending_threshold';
          east.reason = '下妻市からひたちなか市までの追加10自治体をPR #328でmainへ全国統合し、生成・公開をPR #331で144自治体へ更新。その後、鹿嶋市・潮来市・守谷市・常陸大宮市・那珂市を地方統合';

          addUnique(central, [
            {code:'21214',name:'可児市'},
            {code:'21215',name:'山県市'},
            {code:'21216',name:'瑞穂市'},
            {code:'21217',name:'飛騨市'},
            {code:'21218',name:'本巣市'}
          ]);
          central.pendingSinceLastRelease = 9;
          central.releaseStatus = 'pending_threshold';
          central.reason = '若狭町から羽島市までの追加10自治体をPR #348でmainへ全国統合し、生成・公開をPR #350で154自治体へ更新。その後、恵那市・美濃加茂市・土岐市・各務原市・可児市・山県市・瑞穂市・飛騨市・本巣市を地方統合';
          central.mainIntegrationPr = 348;
          central.generatedPullRequest = 350;

          west.pendingSinceLastRelease = 2;
          west.releaseStatus = 'pending_threshold';

          for (const entry of queue.entries) {
            entry.municipalities.sort((a, b) => a.code.localeCompare(b.code));
            entry.count = entry.municipalities.length;
          }
          queue.updatedAt = '2026-07-22T00:35:00+09:00';
          queue.summary.regionalMergedMunicipalities = queue.entries.reduce((sum, x) => sum + x.count, 0);
          queue.summary.waitingRegionalMergeMunicipalities = 0;
          queue.summary.releaseReadyRegions = [];
          queue.summary.auditBlockedRegions = [];
          queue.summary.lastNationalIntegrationAt = '2026-07-21T23:40:46+09:00';
          queue.summary.lastNationalIntegrationPr = 352;
          queue.summary.latestGeneratedMunicipalityCount = 164;
          queue.summary.latestGeneratedPullRequest = 355;
          queue.summary.latestPublicCountPullRequest = 355;
          queue.nextAction = '中日本が前回全国統合後9自治体で先行。北日本7、東日本5、西日本2。郡上市（21219）の地方統合で中日本10自治体に到達したら直ちに全国統合する。';
          queue.humanDecisionRequired = false;

          if (north.count !== 58) throw new Error(`north count mismatch: ${north.count}`);
          if (east.count !== 25) throw new Error(`east count mismatch: ${east.count}`);
          if (central.count !== 70) throw new Error(`central count mismatch: ${central.count}`);
          if (west.count !== 33) throw new Error(`west count mismatch: ${west.count}`);
          if (queue.summary.regionalMergedMunicipalities !== 186) throw new Error(`total mismatch: ${queue.summary.regionalMergedMunicipalities}`);
          fs.writeFileSync(path, JSON.stringify(queue));
          NODE
          git rm .github/workflows/temp-sync-release-queue-186.yml
          git add jichitai-compare/operations/control/release-queue.json
          git commit -m "統括管理: 地方統合186自治体・公開164自治体へ同期"
          git push origin main
