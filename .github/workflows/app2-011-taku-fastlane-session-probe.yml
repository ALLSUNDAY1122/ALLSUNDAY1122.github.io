name: APP2-011 TAKU Fastlane Session Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      github.event.issue.title == '[APP2-011] probe TAKU fastlane session'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      ASC_USERNAME: ${{ secrets.ASC_USERNAME }}
    steps:
      - name: Probe credential presence without exposing values
        id: probe
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          names=['FASTLANE_USER','FASTLANE_SESSION','FASTLANE_PASSWORD','APPLE_ID','APPLE_PASSWORD','ASC_USERNAME']
          for name in names:
              print(f"{name.lower()}={'true' if bool(os.environ.get(name)) else 'false'}")
          PY
      - name: Report safe presence flags
        uses: actions/github-script@v8
        env:
          P_FASTLANE_USER: ${{ steps.probe.outputs.fastlane_user }}
          P_FASTLANE_SESSION: ${{ steps.probe.outputs.fastlane_session }}
          P_FASTLANE_PASSWORD: ${{ steps.probe.outputs.fastlane_password }}
          P_APPLE_ID: ${{ steps.probe.outputs.apple_id }}
          P_APPLE_PASSWORD: ${{ steps.probe.outputs.apple_password }}
          P_ASC_USERNAME: ${{ steps.probe.outputs.asc_username }}
        with:
          script: |
            const flags = {
              FASTLANE_USER: process.env.P_FASTLANE_USER,
              FASTLANE_SESSION: process.env.P_FASTLANE_SESSION,
              FASTLANE_PASSWORD: process.env.P_FASTLANE_PASSWORD,
              APPLE_ID: process.env.P_APPLE_ID,
              APPLE_PASSWORD: process.env.P_APPLE_PASSWORD,
              ASC_USERNAME: process.env.P_ASC_USERNAME,
            };
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `APP2-011 Fastlane credential-presence probe: ${JSON.stringify(flags)}`
            });
