name: Temporary West B Final Corrections V2

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - fix/west-b-cycles09-10-corrections-20260725

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-cycles09-10-corrections-20260725
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrections
        run: node .github/temp-west-b-final-corrections.mjs
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit and open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/west-b-final-corrections.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/municipalities/45/45442.json
          git add jichitai-compare/data/municipalities/45/45443.json
          git add jichitai-compare/data/municipalities/47/47302.json
          git add jichitai-compare/data/municipalities/47/47328.json
          git add jichitai-compare/data/municipalities/47/47350.json
          git add jichitai-compare/operations/tasks/45442.json
          git add jichitai-compare/operations/tasks/45443.json
          git add jichitai-compare/operations/tasks/47302.json
          git add jichitai-compare/operations/tasks/47328.json
          git add jichitai-compare/operations/tasks/47350.json
          git add jichitai-compare/data/generated/municipalities.json
          git add jichitai-compare/municipality/45442/index.html
          git add jichitai-compare/municipality/45443/index.html
          git add jichitai-compare/municipality/47302/index.html
          git add jichitai-compare/municipality/47328/index.html
          git add jichitai-compare/municipality/47350/index.html
          git add jichitai-compare/operations/progress.json
          git add .github/west-b-final-corrections.trigger
          if ! git diff --cached --quiet; then
            git commit -m "fix: 西日本B最終監査の内容・出典修正を反映"
            git push origin HEAD:fix/west-b-cycles09-10-corrections-20260725
          fi
          if ! gh pr view fix/west-b-cycles09-10-corrections-20260725 --json number >/dev/null 2>&1; then
            gh pr create --base main --head fix/west-b-cycles09-10-corrections-20260725 \
              --title "fix: 西日本B第9・10回の内容・出典修正を反映" \
              --body "西日本B概略検証第9・10回で確定した内容訂正1件と出典保守5件を反映します。大宜味村の保育料・給食費無償化内容を現行規則へ訂正し、日之影町2件、五ヶ瀬町1件、中城村1件、南風原町1件の失効出典を現行公式URLへ更新します。自治体元データ、task、全国生成JSON、自治体ページ、進捗を再生成・検証済みです。"
          fi
