name: Kanteishi Monthly Access Migration #12

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-monetization-migrate-12.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0

      - name: Apply monthly 200 / free 24 access contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('kanteishi-shortanswer-sprint/ios')
          app = root / 'KanteishiShortAnswer'
          tests = root / 'KanteishiShortAnswerTests'

          access = r'''import Foundation

          enum LearningAccessPolicy {
              static let freeQuestionLimit = 24
              static let freePerEditionSubject = 4

              static func freeQuestionIDs(in questions: [AppQuestion]) -> Set<String> {
                  let groups = Dictionary(grouping: questions) { question in
                      "\(question.edition)|\(question.subject)"
                  }
                  var selected = Set<String>()

                  for key in groups.keys.sorted() {
                      guard let group = groups[key] else { continue }
                      let byDomain = Dictionary(grouping: group) { $0.domain }
                      let domains = byDomain.keys.sorted {
                          $0.localizedStandardCompare($1) == .orderedAscending
                      }
                      var offsets = Dictionary(uniqueKeysWithValues: domains.map { ($0, 0) })
                      var groupCount = 0

                      while groupCount < freePerEditionSubject {
                          var madeProgress = false
                          for domain in domains where groupCount < freePerEditionSubject {
                              let bucket = (byDomain[domain] ?? []).sorted {
                                  if $0.questionNo == $1.questionNo { return $0.id < $1.id }
                                  return $0.questionNo < $1.questionNo
                              }
                              let offset = offsets[domain, default: 0]
                              guard offset < bucket.count else { continue }
                              selected.insert(bucket[offset].id)
                              offsets[domain] = offset + 1
                              groupCount += 1
                              madeProgress = true
                          }
                          if !madeProgress { break }
                      }
                  }
                  return selected
              }

              static func accessibleQuestionIDs(
                  _ ids: [String],
                  allQuestions: [AppQuestion],
                  isPremium: Bool
              ) -> [String] {
                  guard !isPremium else { return ids }
                  let freeIDs = freeQuestionIDs(in: allQuestions)
                  return ids.filter { freeIDs.contains($0) }
              }

              static func requiresPremium(
                  questionIDs: [String],
                  allQuestions: [AppQuestion]
              ) -> Bool {
                  let freeIDs = freeQuestionIDs(in: allQuestions)
                  return questionIDs.contains { !freeIDs.contains($0) }
              }
          }

          @MainActor
          extension LearningStore {
              func accessibleQuestionIDs(_ ids: [String], isPremium: Bool) -> [String] {
                  LearningAccessPolicy.accessibleQuestionIDs(
                      ids,
                      allQuestions: repository.questions,
                      isPremium: isPremium
                  )
              }

              func accessibleQuestions(_ questions: [AppQuestion], isPremium: Bool) -> [AppQuestion] {
                  let allowed = Set(accessibleQuestionIDs(questions.map(\.id), isPremium: isPremium))
                  return questions.filter { allowed.contains($0.id) }
              }

              func accessibleQuestionCount(_ questions: [AppQuestion], isPremium: Bool) -> Int {
                  accessibleQuestions(questions, isPremium: isPremium).count
              }

              func accessibleWeakQuestions(isPremium: Bool) -> [AppQuestion] {
                  accessibleQuestions(weakQuestions, isPremium: isPremium)
              }

              func requiresPremium(questionIDs: [String]) -> Bool {
                  LearningAccessPolicy.requiresPremium(
                      questionIDs: questionIDs,
                      allQuestions: repository.questions
                  )
              }

              @discardableResult
              func startToday(isPremium: Bool) -> Bool {
                  guard !isPremium else {
                      startToday()
                      return true
                  }
                  let free = accessibleQuestions(repository.questions, isPremium: false).shuffled()
                  let selected = Array(free.prefix(min(todaySessionTarget, free.count)))
                  guard !selected.isEmpty else { return false }
                  retryQuestions(selected.map(\.id), title: "今日のスプリント")
                  return true
              }

              @discardableResult
              func startWeak(isPremium: Bool) -> Bool {
                  let questions = accessibleWeakQuestions(isPremium: isPremium).shuffled()
                  guard !questions.isEmpty else { return false }
                  retryQuestions(questions.map(\.id), title: "苦手をつぶす")
                  return true
              }

              @discardableResult
              func startDomain(_ domain: String, isPremium: Bool) -> Bool {
                  guard !isPremium else {
                      startDomain(domain)
                      return true
                  }
                  let questions = accessibleQuestions(repository.questions(domain: domain), isPremium: false)
                  guard !questions.isEmpty else { return false }
                  retryQuestions(
                      Array(questions.shuffled().prefix(settings.dailyGoal)).map(\.id),
                      title: domain
                  )
                  return true
              }

              @discardableResult
              func startEditionSubject(edition: Int, subject: String, isPremium: Bool) -> Bool {
                  guard !isPremium else {
                      startEditionSubject(edition: edition, subject: subject)
                      return true
                  }
                  let questions = repository.questions(edition: edition).filter { $0.subject == subject }
                  let allowed = accessibleQuestions(questions, isPremium: false)
                  guard !allowed.isEmpty else { return false }
                  retryQuestions(allowed.map(\.id), title: "令和\(edition - 2018)年・\(subject)")
                  return true
              }

              @discardableResult
              func startMock(edition: Int, isPremium: Bool) -> Bool {
                  guard isPremium else { return false }
                  startMock(edition: edition)
                  return true
              }

              @discardableResult
              func resumeSession(isPremium: Bool) -> Bool {
                  guard let inProgress = state.inProgress else { return false }
                  guard isPremium || !requiresPremium(questionIDs: inProgress.questionIDs) else { return false }
                  resumeSession()
                  return true
              }

              @discardableResult
              func retryQuestions(_ ids: [String], title: String, isPremium: Bool) -> Bool {
                  let allowed = accessibleQuestionIDs(ids, isPremium: isPremium)
                  guard !allowed.isEmpty else { return false }
                  retryQuestions(allowed, title: title)
                  return true
              }
          }
          '''
          # Remove indentation introduced only for YAML readability.
          access = '\n'.join(line[10:] if line.startswith('          ') else line for line in access.splitlines()) + '\n'
          (app / 'LearningAccessPolicy.swift').write_text(access)

          access_tests = r'''import XCTest
          @testable import KanteishiShortAnswer

          final class LearningAccessPolicyTests: XCTestCase {
              func testFreeTierIsExactlyTwentyFourAndFourPerEditionSubject() throws {
                  let repository = try QuestionRepository.load()
                  let free = LearningAccessPolicy.freeQuestionIDs(in: repository.questions)
                  XCTAssertEqual(free.count, 24)
                  for edition in [2026, 2025, 2024] {
                      for subject in ["不動産に関する行政法規", "不動産の鑑定評価に関する理論"] {
                          let count = repository.questions.filter {
                              $0.edition == edition && $0.subject == subject && free.contains($0.id)
                          }.count
                          XCTAssertEqual(count, 4, "\(edition) / \(subject)")
                      }
                  }
              }

              @MainActor
              func testFreeTodayNeverLeavesCanonicalFreeSet() {
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString + ".json")
                  let store = LearningStore(persistenceURL: url)
                  store.setDailyGoal(16)
                  XCTAssertTrue(store.startToday(isPremium: false))
                  XCTAssertEqual(store.session?.total, 16)
                  let free = LearningAccessPolicy.freeQuestionIDs(in: store.repository.questions)
                  XCTAssertTrue(store.session?.questionIDs.allSatisfy { free.contains($0) } ?? false)
              }

              @MainActor
              func testFreeEditionSubjectHasFourQuestionsAndMockIsLocked() {
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString + ".json")
                  let store = LearningStore(persistenceURL: url)
                  XCTAssertTrue(store.startEditionSubject(
                      edition: 2026,
                      subject: "不動産に関する行政法規",
                      isPremium: false
                  ))
                  XCTAssertEqual(store.session?.total, 4)
                  store.exitSessionToHome()
                  XCTAssertFalse(store.startMock(edition: 2026, isPremium: false))
                  XCTAssertNil(store.session)
                  XCTAssertTrue(store.startMock(edition: 2026, isPremium: true))
                  XCTAssertEqual(store.session?.total, 80)
              }

              func testPremiumAccessPolicyIsFailClosed() {
                  XCTAssertTrue(PremiumAccessPolicy.grantsAccess(for: .verifiedActive))
                  XCTAssertFalse(PremiumAccessPolicy.grantsAccess(for: .verifiedRevoked))
                  XCTAssertFalse(PremiumAccessPolicy.grantsAccess(for: .unverified))
                  XCTAssertFalse(PremiumAccessPolicy.grantsAccess(for: .pending))
                  XCTAssertFalse(PremiumAccessPolicy.grantsAccess(for: .cancelled))
                  XCTAssertEqual(PremiumPurchaseStore.plannedProductID, "jp.allsunday1122.kanteishishortanswer.monthly200")
              }
          }
          '''
          access_tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in access_tests.splitlines()) + '\n'
          (tests / 'LearningAccessPolicyTests.swift').write_text(access_tests)

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          purchase = app / 'PremiumPurchaseStore.swift'
          replace_once(
              purchase,
              '@MainActor\nfinal class PremiumPurchaseStore: ObservableObject {',
              '@MainActor\nfinal class PremiumPurchaseStore: ObservableObject {\n    static let plannedProductID = "jp.allsunday1122.kanteishishortanswer.monthly200"'
          )
          replace_once(purchase, 'item.type == .nonConsumable', 'item.type == .autoRenewable')
          replace_once(
              purchase,
              'message = "App Store Connectの非消耗型商品を確認できません。"',
              'message = "App Store Connectの自動更新サブスクリプションを確認できません。"'
          )

          content = app / 'ContentView.swift'
          replace_once(
              content,
              'struct KanteishiShortAnswerRootView: View {\n    @EnvironmentObject private var store: LearningStore',
              'struct KanteishiShortAnswerRootView: View {\n    @EnvironmentObject private var store: LearningStore\n    @EnvironmentObject private var purchases: PremiumPurchaseStore'
          )
          replace_once(
              content,
              '''            } else if let result = store.result {
                ResultScreen(result: result)
            } else if store.session != nil {
                QuizScreen()
            } else {''',
              '''            } else if let result = store.result {
                if purchases.isPremium || !store.requiresPremium(questionIDs: result.questionIDs) {
                    ResultScreen(result: result)
                } else {
                    PremiumSessionLockedView(title: result.title)
                }
            } else if let session = store.session {
                if purchases.isPremium || !store.requiresPremium(questionIDs: session.questionIDs) {
                    QuizScreen()
                } else {
                    PremiumSessionLockedView(title: session.title)
                }
            } else {'''
          )
          replace_once(
              content,
              'struct HomeView: View {\n    @EnvironmentObject private var store: LearningStore',
              '''private struct PremiumSessionLockedView: View {
    @EnvironmentObject private var store: LearningStore
    let title: String

    var body: some View {
        ZStack {
            AppTheme.paper.ignoresSafeArea()
            VStack(spacing: 14) {
                Image(systemName: "lock.fill")
                    .font(.system(size: 30, weight: .bold))
                    .foregroundStyle(AppTheme.ai)
                Text("プレミアム学習を一時停止中")
                    .appSerif(21, weight: .bold)
                    .foregroundStyle(AppTheme.ink)
                Text(title)
                    .appSans(13, weight: .bold)
                    .foregroundStyle(AppTheme.ink2)
                Text("購入状態を確認すると、全240問と年度別80問模試を再開できます。")
                    .appSans(12)
                    .foregroundStyle(AppTheme.ink3)
                    .multilineTextAlignment(.center)
                Button {
                    store.exitSessionToHome()
                    store.currentTab = .settings
                } label: {
                    Text("プレミアムを確認")
                        .appSans(15, weight: .bold)
                        .foregroundStyle(.white)
                        .frame(maxWidth: .infinity, minHeight: 50)
                        .background(AppTheme.ai)
                        .clipShape(RoundedRectangle(cornerRadius: 14, style: .continuous))
                }
                .buttonStyle(.plain)
            }
            .padding(22)
            .frame(maxWidth: 420)
        }
        .accessibilityIdentifier("premium.sessionLocked")
    }
}

struct HomeView: View {
    @EnvironmentObject private var store: LearningStore
    @EnvironmentObject private var purchases: PremiumPurchaseStore'''
          )
          replace_once(content, 'store.resumeSession()', 'if !store.resumeSession(isPremium: purchases.isPremium) { store.currentTab = .settings }')
          replace_once(content, 'store.startToday()', 'store.startToday(isPremium: purchases.isPremium)')
          replace_once(content, 'store.startWeak()', 'if !store.startWeak(isPremium: purchases.isPremium) { store.currentTab = .settings }')
          text = content.read_text().replace('store.weakQuestions', 'store.accessibleWeakQuestions(isPremium: purchases.isPremium)')
          content.write_text(text)
          replace_once(content, 'store.startDomain(domain)', 'if !store.startDomain(domain, isPremium: purchases.isPremium) { store.currentTab = .settings }')
          replace_once(
              content,
              'Text("\\(store.repository.questions(domain: domain).count)問")',
              'Text("\\(store.accessibleQuestionCount(store.repository.questions(domain: domain), isPremium: purchases.isPremium))問")'
          )
          replace_once(
              content,
              'struct MockView: View {\n    @EnvironmentObject private var store: LearningStore',
              'struct MockView: View {\n    @EnvironmentObject private var store: LearningStore\n    @EnvironmentObject private var purchases: PremiumPurchaseStore'
          )
          replace_once(
              content,
              '''                    Text("各年度は行政法規40問＋鑑定理論40問＝80問。3年度合計240問の公式過去問を収録しています。")
                        .appSans(12)
                        .foregroundStyle(AppTheme.ink2)
                        .padding(14)
                        .background(AppTheme.aiSoft)
                        .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))''',
              '''                    Text("各年度は行政法規40問＋鑑定理論40問＝80問。3年度合計240問の公式過去問を収録しています。")
                        .appSans(12)
                        .foregroundStyle(AppTheme.ink2)
                        .padding(14)
                        .background(AppTheme.aiSoft)
                        .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                    if !purchases.isPremium {
                        Label("無料版は24問。年度別80問模試と全240問はプレミアムで利用できます。", systemImage: "lock.fill")
                            .appSans(11, weight: .bold)
                            .foregroundStyle(AppTheme.ai)
                            .padding(12)
                            .frame(maxWidth: .infinity, alignment: .leading)
                            .background(AppTheme.aiSoft)
                            .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                    }'''
          )
          replace_once(
              content,
              'store.startMock(edition: edition)',
              'if !store.startMock(edition: edition, isPremium: purchases.isPremium) { store.currentTab = .settings }'
          )
          replace_once(
              content,
              'store.startEditionSubject(edition: edition, subject: subject)',
              'if !store.startEditionSubject(edition: edition, subject: subject, isPremium: purchases.isPremium) { store.currentTab = .settings }'
          )
          replace_once(
              content,
              'Text("\\(questions.count)問・完答 \\(store.completionCount(for: key))回")',
              'Text("\\(store.accessibleQuestionCount(questions, isPremium: purchases.isPremium))問・完答 \\(store.completionCount(for: key))回")'
          )

          hs = app / 'HistorySettingsViews.swift'
          replace_once(
              hs,
              'struct HistoryView: View {\n    @EnvironmentObject private var store: LearningStore',
              'struct HistoryView: View {\n    @EnvironmentObject private var store: LearningStore\n    @EnvironmentObject private var purchases: PremiumPurchaseStore'
          )
          hs_text = hs.read_text().replace('store.weakQuestions', 'store.accessibleWeakQuestions(isPremium: purchases.isPremium)')
          hs.write_text(hs_text)
          replace_once(
              hs,
              'Button { store.retryQuestions([q.id], title: q.topic) } label:',
              'Button { if !store.retryQuestions([q.id], title: q.topic, isPremium: purchases.isPremium) { store.currentTab = .settings } } label:'
          )
          hs_text = hs.read_text()
          start_marker = '                    if purchases.isConfigured { settingsSection("プレミアム")'
          end_marker = '                    settingsSection("このアプリ")'
          start = hs_text.find(start_marker)
          end = hs_text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('premium settings block markers not found')
          premium_block = '''                    settingsSection("プレミアム") {
                        VStack(alignment: .leading, spacing: 10) {
                            if purchases.isPremium {
                                Label("プレミアム利用中", systemImage: "checkmark.seal.fill")
                                    .foregroundStyle(AppTheme.midori)
                                Text("全240問・年度別80問模試・全科目演習を利用できます。")
                                    .appSans(11)
                                    .foregroundStyle(AppTheme.ink2)
                            } else {
                                Text("無料版は24問。プレミアムでは全240問と年度別80問模試を利用できます。")
                                    .appSans(12)
                                    .foregroundStyle(AppTheme.ink2)
                                if let price = purchases.displayPrice {
                                    HStack {
                                        Text("月額プラン")
                                        Spacer()
                                        Text(price).foregroundStyle(AppTheme.ai)
                                    }
                                    .appSans(13, weight: .bold)
                                    Button { Task { await purchases.purchase() } } label: {
                                        settingsAction("cart", "プレミアムを購読")
                                    }
                                    .buttonStyle(.plain)
                                } else {
                                    Text(purchases.isConfigured ? "App Storeの商品情報を確認中です。" : "App Store設定準備中です。")
                                        .appSans(11)
                                        .foregroundStyle(AppTheme.ink3)
                                }
                            }
                            if purchases.isConfigured {
                                Button { Task { await purchases.restorePurchases() } } label: {
                                    settingsAction("arrow.clockwise", "購入を復元")
                                }
                                .buttonStyle(.plain)
                            }
                            if let message = purchases.message {
                                Text(message).appSans(11).foregroundStyle(AppTheme.ink2)
                            }
                        }
                    }
'''
          hs_text = hs_text[:start] + premium_block + hs_text[end:]
          hs_text = hs_text.replace(
              'infoRow("課金",purchases.isConfigured ? "StoreKit 2" : "Product ID 未設定（Release Gate）")',
              'infoRow("課金",purchases.isConfigured ? "StoreKit 2・月額プラン" : "Product ID 未設定（Release Gate）")'
          )
          hs.write_text(hs_text)

          status = Path('kanteishi-shortanswer-sprint/RELEASE_STATUS.md')
          status_text = status.read_text()
          marker = '## v2.5 monetization contract'
          if marker not in status_text:
              status_text += '''\n\n## v2.5 monetization contract\n\n- Model: auto-renewing monthly subscription; Japan reference price 200 yen. UI price must come from StoreKit `Product.displayPrice`.\n- Free tier: 24 / 240 canonical questions, exactly 4 per edition × subject cell; deterministic and domain-diverse selection.\n- Premium: all 240 questions, full subject practice, and each 80-question yearly mock.\n- Introductory offer: none by default.\n- Planned Product ID: `jp.allsunday1122.kanteishishortanswer.monthly200`. Runtime remains unconfigured until the exact App Store Connect registration is confirmed; do not guess registration state.\n- StoreKit 2 entitlement remains fail-closed: verified matching, non-revoked entitlement only; purchase restore required.\n'''
              status.write_text(status_text)

          # One-shot workflow removes itself in the same atomic result commit.
          Path('.github/workflows/kanteishi-monetization-migrate-12.yml').unlink()
          PY

      - name: Static contract audit
        shell: bash
        run: |
          set -euo pipefail
          test -f kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/LearningAccessPolicy.swift
          test -f kanteishi-shortanswer-sprint/ios/KanteishiShortAnswerTests/LearningAccessPolicyTests.swift
          ! test -f .github/workflows/kanteishi-monetization-migrate-12.yml
          grep -Fq 'item.type == .autoRenewable' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/PremiumPurchaseStore.swift
          ! grep -Fq 'item.type == .nonConsumable' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/PremiumPurchaseStore.swift
          grep -Fq 'Product.displayPrice' kanteishi-shortanswer-sprint/RELEASE_STATUS.md
          grep -Fq 'jp.allsunday1122.kanteishishortanswer.monthly200' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/PremiumPurchaseStore.swift
          grep -Fq 'freeQuestionLimit = 24' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/LearningAccessPolicy.swift

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'feat(#12): add monthly premium and canonical free tier'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
