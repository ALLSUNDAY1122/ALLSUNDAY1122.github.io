name: Yorugatari fast runtime release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/tools/story-circulation-release.trigger
      - yorugatari/tools/normalize-engagement.mjs
      - yorugatari/tools/ensure-landing-sharing.mjs
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-start-20260724-001.js
      - .github/workflows/yorugatari-story-circulation-release.yml

concurrency:
  group: yorugatari-fast-runtime-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize and validate runtime release
        shell: bash
        run: |
          node --check yorugatari/tools/normalize-engagement.mjs
          node --check yorugatari/tools/ensure-landing-sharing.mjs
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js
          node --check yorugatari/assets/landing-start-20260724-001.js
          node yorugatari/tools/normalize-engagement.mjs
          node yorugatari/tools/ensure-landing-sharing.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const site = 'yorugatari';
          const release = '20260724-001';
          const staticVersions = {
            'index.html': '20260723-003',
            '5min-horror.html': '20260724-004',
            'bedtime-horror.html': '20260724-005',
            'archive.html': '20260723-003',
            'about.html': '20260723-003',
            'privacy.html': '20260723-003',
            'terms.html': '20260723-003',
            'contact.html': '20260723-003'
          };
          for (const [file, version] of Object.entries(staticVersions)) {
            const html = fs.readFileSync(path.join(site, file), 'utf8');
            if (!html.includes(`assets/analytics.js?v=${version}&r=${release}`)) throw new Error(`${file}: audit-filtered analytics runtime missing`);
          }
          for (const file of ['5min-horror.html', 'bedtime-horror.html']) {
            const html = fs.readFileSync(path.join(site, file), 'utf8');
            if (!html.includes(`assets/landing-start-20260724-001.js?r=${release}`)) throw new Error(`${file}: audit-filtered landing start missing`);
          }
          const root = path.join(site, 'stories');
          const files = fs.readdirSync(root).filter((file) => file.endsWith('.html')).sort();
          const auditedStories = new Set(['last-elevator.html', 'spare-key-returned.html', 'hired-with-your-experience.html']);
          if (files.length !== 100) throw new Error(`Expected 100 stories, found ${files.length}`);
          for (const file of files) {
            const html = fs.readFileSync(path.join(root, file), 'utf8');
            const five = (html.match(/href=["']\.\.\/5min-horror\.html["']/g) || []).length;
            const bedtime = (html.match(/href=["']\.\.\/bedtime-horror\.html["']/g) || []).length;
            if (five !== 1 || bedtime !== 1) throw new Error(`${file}: curated links ${five}/${bedtime}`);
            if (!html.includes('../assets/engagement.js?v=20260723-003')) throw new Error(`${file}: engagement runtime missing`);
            if (auditedStories.has(file) && !html.includes(`../assets/engagement.js?v=20260723-003&r=${release}`)) throw new Error(`${file}: audit cache release missing`);
          }
          const notFound = fs.readFileSync('404.html', 'utf8');
          if (!notFound.includes(`/yorugatari/assets/analytics.js?v=20260723-003&r=${release}`)) throw new Error('404 audit-filtered analytics runtime missing');
          const privacy = fs.readFileSync(path.join(site, 'privacy.html'), 'utf8');
          if (!privacy.includes('自動監査、Lighthouse、ヘッドレスブラウザ')) throw new Error('Audit filtering disclosure missing');
          console.log(`Validated audit-filtered runtime on ${Object.keys(staticVersions).length} static pages, ${auditedStories.size} audited stories, shared runtime on ${files.length - auditedStories.size} stories, and 404.`);
          NODE

      - name: Commit normalized runtime pages
        shell: bash
        run: |
          paths=(
            404.html
            yorugatari/index.html
            yorugatari/5min-horror.html
            yorugatari/bedtime-horror.html
            yorugatari/archive.html
            yorugatari/about.html
            yorugatari/privacy.html
            yorugatari/terms.html
            yorugatari/contact.html
            yorugatari/stories/last-elevator.html
            yorugatari/stories/spare-key-returned.html
            yorugatari/stories/hired-with-your-experience.html
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Audit-filtered runtime pages are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Publish Yorugatari audit-filtered analytics [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep 4
          done
          exit 1
