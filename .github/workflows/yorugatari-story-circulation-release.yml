name: Yorugatari story circulation release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/tools/story-circulation-release.trigger
      - yorugatari/tools/normalize-engagement.mjs
      - .github/workflows/yorugatari-story-circulation-release.yml

concurrency:
  group: yorugatari-story-circulation-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize and validate all story links
        shell: bash
        run: |
          node --check yorugatari/tools/normalize-engagement.mjs
          node yorugatari/tools/normalize-engagement.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'yorugatari/stories';
          const files = fs.readdirSync(root).filter((file) => file.endsWith('.html')).sort();
          if (files.length !== 100) throw new Error(`Expected 100 stories, found ${files.length}`);
          for (const file of files) {
            const html = fs.readFileSync(path.join(root, file), 'utf8');
            const five = (html.match(/href=["']\.\.\/5min-horror\.html["']/g) || []).length;
            const bedtime = (html.match(/href=["']\.\.\/bedtime-horror\.html["']/g) || []).length;
            if (five !== 1 || bedtime !== 1) throw new Error(`${file}: curated links ${five}/${bedtime}`);
            if (!html.includes('../assets/engagement.js?v=20260723-003')) throw new Error(`${file}: engagement runtime missing`);
          }
          console.log(`Validated curated landing links on ${files.length} stories.`);
          NODE

      - name: Commit all normalized stories
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/stories; then
            echo "All story circulation links are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/stories
          git commit -m "Publish curated links on all Yorugatari stories [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep 4
          done
          exit 1
