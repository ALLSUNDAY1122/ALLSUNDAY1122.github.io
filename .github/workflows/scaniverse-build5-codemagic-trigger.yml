name: Scaniverse Build 5 Codemagic Trigger

on:
  push:
    branches:
      - testflight/splat-native-ios-20260825-build5
    paths:
      - .github/workflows/scaniverse-build5-codemagic-trigger.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build5:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_APP_ID: 6a769d81a1add9d06020b524
      CM_WORKFLOW_ID: splat-native-ios
      CM_BRANCH: testflight/splat-native-ios-20260825-build5
    steps:
      - uses: actions/checkout@v4

      - name: Trigger and verify Codemagic Build 5
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM_API_TOKEN:-}"
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          app_id=os.environ['CM_APP_ID']
          workflow=os.environ['CM_WORKFLOW_ID']
          branch=os.environ['CM_BRANCH']
          out=Path('/tmp/scaniverse-build5-codemagic.json')

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={
                  'Content-Type':'application/json','Accept':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          status,payload=api('https://api.codemagic.io/builds','POST',{
              'appId':app_id,'workflowId':workflow,'branch':branch})
          if not 200 <= status < 300:
              raise SystemExit(f'Codemagic start failed HTTP {status}: {payload}')
          build_id=payload.get('buildId') or payload.get('id')
          if not build_id:
              raise SystemExit(f'Codemagic returned no build id: {payload}')
          result={'ok':False,'app_id':app_id,'workflow_id':workflow,'branch':branch,
                  'build_id':build_id,'status':'started'}
          out.write_text(json.dumps(result,indent=2)+'\n')
          print(f'BUILD5_CODEMAGIC_STARTED id={build_id}')

          terminal={'finished','failed','canceled','timeout','skipped'}
          deadline=time.time()+4200
          last=None
          while time.time() < deadline:
              code,detail=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= code < 300:
                  raise SystemExit(f'Codemagic inspect failed HTTP {code}: {detail}')
              data=detail.get('data') or detail
              current=data.get('status')
              if current != last:
                  print(f'BUILD5_CODEMAGIC_STATUS {current}')
                  last=current
              result['status']=current
              result['commit']=data.get('commit') or data.get('commitId') or data.get('commitHash')
              result['started_at']=data.get('startedAt')
              result['finished_at']=data.get('finishedAt')
              out.write_text(json.dumps(result,indent=2)+'\n')
              if current in terminal:
                  result['ok']=current=='finished'
                  out.write_text(json.dumps(result,indent=2)+'\n')
                  if current!='finished':
                      raise SystemExit(f'Codemagic Build 5 ended {current}')
                  print(f'BUILD5_CODEMAGIC_FINISHED id={build_id}')
                  break
              time.sleep(30)
          else:
              raise SystemExit('Timed out waiting for Codemagic Build 5')
          PY

      - name: Upload Build 5 Codemagic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaniverse-build5-codemagic-${{ github.run_id }}
          path: /tmp/scaniverse-build5-codemagic.json
          if-no-files-found: warn
          retention-days: 14
