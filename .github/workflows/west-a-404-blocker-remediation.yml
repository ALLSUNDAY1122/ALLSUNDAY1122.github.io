name: Temporary West A 404 Blocker Remediation

on:
  push:
    branches:
      - fix/west-a-404-blockers-20260725

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/west-a-404-blockers-20260725
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Mashiki and Wadomari records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('jichitai-compare')
          checked = '2026-07-25'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mashiki_path = root / 'data/municipalities/43/43443.json'
          mashiki = load(mashiki_path)
          mashiki['summary'] = '必須9制度を益城町公式情報で再監査。7制度をverified、学校給食費と粗大ごみは現行の具体条件を確定できないためunavailableとして登録。'
          mashiki['updatedAt'] = checked
          mashiki['services']['bulkyWaste'] = {
              'status': 'unavailable',
              'summary': '粗大ごみ区分と自己搬入案内は確認できるが、現行の戸別収集料金・寸法上限を確定できない',
              'notes': [
                  '現行の町公式ごみ出し早見表で、家具等が粗大ごみに分類され、品目により自己搬入できることを確認した。',
                  '従来主出典の「粗大ごみの出し方について」は2026年7月25日時点で404となり、1品目500円・3辺合計400cm未満・地区別指定業者という条件を現行公式ページで再確認できない。',
                  '制度不存在とは断定せず、比較に必要な料金・寸法・申込先の現行条件が未確定のためunavailableへ保守的に変更した。'
              ],
              'details': {
                  'confirmed': '町公式ごみ出し早見表で粗大ごみ区分と品目別の自己搬入可否を確認',
                  'unconfirmed': '戸別収集料金、寸法上限、地区別指定業者、申込受付時間',
                  'previousStatus': 'verified',
                  'previousSource': 'https://www.town.mashiki.lg.jp/kiji0032329/',
                  'reviewDisposition': '削除済みページの数値を現行条件として維持せず、自治体窓口で確認すべき項目として公開する。'
              },
              'source': {
                  'url': 'https://www.town.mashiki.lg.jp/dynamic/word_l/pub/default.aspx?c_id=20',
                  'checkedAt': checked
              },
              'additionalSources': [
                  {
                      'url': 'https://www.town.mashiki.lg.jp/list00679.html',
                      'checkedAt': checked
                  }
              ]
          }
          save(mashiki_path, mashiki)

          mashiki_task_path = root / 'operations/tasks/43443.json'
          mashiki_task = load(mashiki_task_path)
          mashiki_task['verifiedCount'] = 7
          mashiki_task['unavailableCount'] = 2
          mashiki_task['researchingCount'] = 0
          mashiki_task['needsMediumReviewCount'] = 0
          mashiki_task['currentBranch'] = 'fix/west-a-404-blockers-20260725'
          mashiki_task['pullRequestNumber'] = None
          mashiki_task['lastCheckedAt'] = checked
          mashiki_task['lastUpdatedAt'] = '2026-07-25T12:47:00+09:00'
          mashiki_task['lastUpdatedBy'] = '西日本調査班A第2監査・404再確認'
          mashiki_task['officialSources'] = [
              mashiki['services'][key]['source']['url']
              for key in ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention']
          ]
          mashiki_task.setdefault('notes', []).append(
              '2026-07-25 12:47: 旧粗大ごみ専用ページの404を独立確認。500円・400cm等を現行公式情報で再確認できないため、削除済み情報を維持せずbulkyWasteをunavailableへ変更。現行ごみ出し早見表を主出典とした。'
          )
          save(mashiki_task_path, mashiki_task)

          wadomari_path = root / 'data/municipalities/46/46533.json'
          wadomari = load(wadomari_path)
          bulky = wadomari['services']['bulkyWaste']
          bulky['source'] = {
              'url': 'https://www.town.wadomari.lg.jp/documents/4268/kaitei.pdf',
              'checkedAt': checked
          }
          bulky['additionalSources'] = [
              {
                  'url': 'https://www.town.wadomari.lg.jp/tyoumin/gomisyori.html',
                  'checkedAt': checked
              }
          ]
          bulky['details']['sourceNote'] = '町公式案内ページの添付「沖永良部クリーンセンター ごみ処分手数料改定のお知らせ」で粗大ごみ100円/10kgを確認。'
          wadomari['updatedAt'] = checked
          save(wadomari_path, wadomari)

          wadomari_task_path = root / 'operations/tasks/46533.json'
          wadomari_task = load(wadomari_task_path)
          wadomari_task['currentBranch'] = 'fix/west-a-404-blockers-20260725'
          wadomari_task['pullRequestNumber'] = None
          wadomari_task['lastCheckedAt'] = checked
          wadomari_task['lastUpdatedAt'] = '2026-07-25T12:47:00+09:00'
          wadomari_task['lastUpdatedBy'] = '西日本調査班A第2監査・404再確認'
          wadomari_task['officialSources'] = [
              wadomari['services'][key]['source']['url']
              for key in ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention']
          ]
          wadomari_task.setdefault('notes', []).append(
              '2026-07-25 12:47: 案内ページの自動404判定を再確認。町公式ページは閲覧可能で、添付PDFに粗大ごみ100円/10kgが明記されるため、より直接的で安定した公式PDFを主出典へ変更した。'
          )
          save(wadomari_task_path, wadomari_task)

          audit = {
              'schemaVersion': '1.0.0',
              'auditId': 'west-a-404-blocker-remediation-20260725-1243',
              'team': '西日本調査班A',
              'checkedAt': '2026-07-25T12:47:00+09:00',
              'triggerPullRequest': 3320,
              'findings': [
                  {
                      'municipalityCode': '43443',
                      'municipalityName': '益城町',
                      'service': 'bulkyWaste',
                      'finding': '旧主出典が404。現行公式公開情報では500円・400cm等を再確認できない。',
                      'resolution': 'bulkyWasteをverifiedからunavailableへ変更し、現行ごみ出し早見表を主出典に設定。',
                      'classification': 'deleted_source_and_unconfirmed_current_conditions',
                      'oldSource': 'https://www.town.mashiki.lg.jp/kiji0032329/',
                      'newSource': 'https://www.town.mashiki.lg.jp/dynamic/word_l/pub/default.aspx?c_id=20',
                      'status': 'corrected'
                  },
                  {
                      'municipalityCode': '46533',
                      'municipalityName': '和泊町',
                      'service': 'bulkyWaste',
                      'finding': '自動監査で案内ページを404判定したが、公式案内と添付PDFは閲覧可能。',
                      'resolution': '粗大ごみ100円/10kgを直接記載する町公式添付PDFを主出典に変更し、案内ページを追加出典化。',
                      'classification': 'automated_fetch_false_positive_and_source_hardening',
                      'oldSource': 'https://www.town.wadomari.lg.jp/tyoumin/gomisyori.html',
                      'newSource': 'https://www.town.wadomari.lg.jp/documents/4268/kaitei.pdf',
                      'status': 'corrected'
                  }
              ],
              'summary': {
                  'confirmedErrors': 1,
                  'sourceHardeningChanges': 1,
                  'statusChanges': 1,
                  'unresolved': 0,
                  'blocker': None,
                  'result': 'completed_with_two_remediations'
              }
          }
          audit_path = root / 'operations/audits/west-a-404-blocker-remediation-20260725-1243.json'
          save(audit_path, audit)
          PY

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: npm run check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/west-a-404-blocker-remediation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/data/municipalities/43/43443.json \
                  jichitai-compare/data/municipalities/46/46533.json \
                  jichitai-compare/operations/tasks/43443.json \
                  jichitai-compare/operations/tasks/46533.json \
                  jichitai-compare/operations/audits/west-a-404-blocker-remediation-20260725-1243.json \
                  jichitai-compare/data/generated/municipalities.json \
                  jichitai-compare/municipality/43443/index.html \
                  jichitai-compare/municipality/46533/index.html \
                  jichitai-compare/operations/progress.json \
                  .github/workflows/west-a-404-blocker-remediation.yml
          git commit -m "fix: 益城町と和泊町の粗大ごみ出典を再修正"
          git push origin HEAD:fix/west-a-404-blockers-20260725
