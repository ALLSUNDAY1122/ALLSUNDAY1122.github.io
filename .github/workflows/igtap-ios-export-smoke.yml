name: Loopforge iOS project export smoke

on:
  push:
    branches:
      - 'igtap/wp3-ios-integration'
      - 'igtap/integration'
    paths:
      - 'igtap-equivalent/project.godot'
      - 'igtap-equivalent/export_presets.cfg'
      - 'igtap-equivalent/Main.tscn'
      - 'igtap-equivalent/Platform/**'
      - 'igtap-equivalent/Integration/**'
      - 'igtap-equivalent/Game/**'
      - 'igtap-equivalent/Content/**'
      - '.github/workflows/igtap-ios-export-smoke.yml'
  workflow_dispatch:

jobs:
  ios-project-export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode environment
        run: xcodebuild -version
      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-export-templates
      - name: Install Godot 4.7.2 stable
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          xattr -dr com.apple.quarantine /tmp/godot/Godot.app || true
      - name: Install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
      - name: Verify iOS export template
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          ls -lah "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/ios.zip"
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --editor --path igtap-equivalent --quit 2>&1 | tee /tmp/loopforge-ios-import.log
          if grep -E 'SCRIPT ERROR: (Parse Error|Compile Error)|Failed to load script' /tmp/loopforge-ios-import.log; then
            echo 'Godot script compilation errors detected during iOS import.' >&2
            exit 1
          fi
      - name: Inject CI-only signing metadata and explicit template path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("igtap-equivalent/export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          team = 'application/app_store_team_id=""'
          template = 'custom_template/release=""'
          if team not in text or template not in text:
              raise SystemExit("expected release placeholders not found")
          ios_zip = Path.home() / "Library/Application Support/Godot/export_templates/4.7.2.stable/ios.zip"
          if not ios_zip.is_file():
              raise SystemExit(f"iOS export template missing: {ios_zip}")
          text = text.replace(team, 'application/app_store_team_id="CI00000000"', 1)
          text = text.replace(template, f'custom_template/release="{ios_zip}"', 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Export unsigned iOS Xcode project
        run: |
          rm -rf "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS"
          mkdir -p "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS"
          set +e
          /tmp/godot/Godot.app/Contents/MacOS/Godot --verbose --headless --path "$GITHUB_WORKSPACE/igtap-equivalent" --export-release "iOS Project" "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS/Loopforge"
          GODOT_EXIT=$?
          set -e
          PBXPROJ="$(find "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS" -name project.pbxproj -print -quit)"
          if [ -z "$PBXPROJ" ] || [ ! -s "$PBXPROJ" ]; then
            echo "Godot exit code: $GODOT_EXIT"
            echo "No generated Xcode project found"
            exit 1
          fi
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot returned $GODOT_EXIT after project-only generation; accepting only because the generated Xcode project is present and will be independently audited."
          fi
      - name: Audit generated Xcode project
        run: |
          PBXPROJ="$(find "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS" -name project.pbxproj -print -quit)"
          test -n "$PBXPROJ"
          grep -Eq 'TARGETED_DEVICE_FAMILY = "?1"?;' "$PBXPROJ"
          grep -Eq 'PRODUCT_BUNDLE_IDENTIFIER = "?jp\.allsunday1122\.loopforge"?;' "$PBXPROJ"
          grep -Eq 'IPHONEOS_DEPLOYMENT_TARGET = "?15\.0"?;' "$PBXPROJ"
          test -s "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS/PrivacyInfo.xcprivacy"
          test -d "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS/Loopforge.xcframework"
      - name: Package generated Xcode project
        run: |
          cd "$GITHUB_WORKSPACE/igtap-equivalent/Build/iOS"
          ditto -c -k --sequesterRsrc --keepParent . "$RUNNER_TEMP/Loopforge-iOS-Xcode-project.zip"
          test -s "$RUNNER_TEMP/Loopforge-iOS-Xcode-project.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: loopforge-ios-xcode-project
          path: ${{ runner.temp }}/Loopforge-iOS-Xcode-project.zip
          if-no-files-found: error
          retention-days: 3
