name: Temporary sync release queue 324 1040

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-queue-324-1040.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync assigned regional queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git fetch origin \
            region/north:refs/remotes/origin/region/north \
            region/east:refs/remotes/origin/region/east \
            region/central:refs/remotes/origin/region/central \
            region/west:refs/remotes/origin/region/west
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path, PurePosixPath

          qpath=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(qpath.read_text(encoding='utf-8'))
          policy=json.loads(Path('jichitai-compare/operations/municipality-assignment-policy.json').read_text(encoding='utf-8'))
          teams={'north':'北日本調査班','east':'東日本調査班','central':'中日本調査班','west':'西日本調査班'}
          prefixes={t['team']:set(t['prefectureCodes']) for t in policy['teams']}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def run(*a): return subprocess.check_output(a,text=True).strip()
          def show(ref,path): return run('git','show',f'{ref}:{path}')
          def name(ref,path,code):
              try:
                  obj=json.loads(show(ref,path))
                  if isinstance(obj.get('municipality'),dict) and obj['municipality'].get('name'): return obj['municipality']['name']
                  for k in ('municipalityName','name'):
                      if isinstance(obj.get(k),str) and obj[k]: return obj[k]
              except Exception: pass
              return code

          for e in data['entries']:
              region=e['region']; ref=f"origin/{e['branch']}"; allowed=prefixes[teams[region]]
              old={x['code']:x['name'] for x in e.get('municipalities',[])}
              paths=run('git','ls-tree','-r','--name-only',ref,'--','jichitai-compare/data/municipalities')
              items=[]
              for path in paths.splitlines():
                  if not path.endswith('.json'): continue
                  code=PurePosixPath(path).stem
                  if not code.isdigit() or code[:2] not in allowed: continue
                  items.append({'code':code,'name':old.get(code) or name(ref,path,code)})
              items.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending=0 if region=='north' else int(state.get(fields[region],0))
              e['municipalities']=items
              e['count']=len(items)
              e['pendingSinceLastRelease']=pending
              e['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              e['reason']=f'担当割当で地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              e['generatedPullRequest']=564
              e['auditStatus']='passed'
              if region=='north':
                  e['mainIntegrationPr']=562

          now=datetime.now(timezone(timedelta(hours=9))).replace(second=0,microsecond=0).isoformat()
          data['updatedAt']=now
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[e['region'] for e in data['entries'] if e['pendingSinceLastRelease']>=10]
          s['auditBlockedRegions']=[]
          s['lastNationalIntegrationAt']='2026-07-22T10:08:18+09:00'
          s['lastNationalIntegrationPr']=562
          s['latestGeneratedMunicipalityCount']=324
          s['latestGeneratedPullRequest']=564
          s['latestPublicCountPullRequest']=564
          ordered=sorted(data['entries'],key=lambda e:e['pendingSinceLastRelease'],reverse=True)
          data['nextAction']='地方統合を継続。現在の公開後繰越: '+'、'.join(f"{e['region']} {e['pendingSinceLastRelease']}" for e in ordered)+'。10自治体到達地域を固定スナップショットで全国統合する。'
          data['humanDecisionRequired']=False
          qpath.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          labels={'north':'北','east':'東','central':'中','west':'西'}
          pend='・'.join(f"{labels[e['region']]}{e['pendingSinceLastRelease']}" for e in data['entries'])
          Path('/tmp/msg').write_text(f"統括管理: 地方統合{s['regionalMergedMunicipalities']}自治体・公開324自治体へ同期（{pend}）",encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-sync-queue-324-1040.yml
          git commit -m "$(cat /tmp/msg)"
          git push origin HEAD:main
