name: Temporary West A Independent Sample Fix

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-independent-sample-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'fix/west-a-post-final-independent-sample-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply independent sample corrections
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T14:18:00+09:00';
          const branch = 'fix/west-a-post-final-independent-sample-20260725';

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          function writeJsonPreservingStyle(path, value) {
            const raw = fs.readFileSync(path, 'utf8');
            const pretty = raw.includes('\n  "');
            fs.writeFileSync(path, JSON.stringify(value, null, pretty ? 2 : 0) + (pretty ? '\n' : ''));
          }
          function sourceUrls(service) {
            const urls = [];
            if (service?.source?.url) urls.push(service.source.url);
            for (const item of service?.additionalSources ?? []) if (item?.url) urls.push(item.url);
            return urls;
          }
          function updateTask(code, data, note) {
            const path = `${root}/operations/tasks/${code}.json`;
            const task = readJson(path);
            const services = Object.values(data.services);
            task.verifiedCount = services.filter((s) => s.status === 'verified').length;
            task.researchingCount = services.filter((s) => s.status === 'researching').length;
            task.unavailableCount = services.filter((s) => s.status === 'unavailable').length;
            task.needsMediumReviewCount = services.filter((s) => s.status === 'needs_medium_review').length;
            task.currentBranch = branch;
            task.pullRequestNumber = null;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班A・完了後独立抜き取り監査';
            task.officialSources = [...new Set(services.flatMap(sourceUrls))];
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            if (!task.notes.includes(note)) task.notes.push(note);
            task.blockers = [];
            writeJsonPreservingStyle(path, task);
          }

          {
            const path = `${root}/data/municipalities/37/37203.json`;
            const data = readJson(path);
            data.summary = '必須9制度を坂出市公式情報で再監査。8制度をverified、子育て世帯固有の住宅取得・改修支援を確認できない住宅支援をunavailableとして登録。';
            data.updatedAt = checkedAt;
            data.services.housingSupport = {
              status: 'unavailable',
              summary: '一般の移住者・空き家利用者向け改修制度はあるが、子育て世帯固有の住宅支援条件を確認できない',
              notes: [
                '令和8年度坂出市移住促進・空き家改修補助金は、空き家バンク物件の購入者・賃借人を対象とする一般の移住・空き家活用制度である。',
                '子どもの有無、対象年齢、子育て世帯加算等を要件とする住宅取得・改修支援ではないため、子育て世帯向け住宅支援として登録しない。',
                '東京圏移住支援金の子育て加算は住宅費に用途を限定した制度ではなく、本比較項目の住宅支援には採用しない。'
              ],
              details: {
                confirmedGeneralProgram: '空き家バンク登録物件の改修費2分の1、条件により上限100万～200万円の一般制度を確認',
                unconfirmedChildSpecificCondition: '子ども要件、子育て世帯専用加算、子育て世帯限定の住宅取得・改修条件',
                previousStatus: 'verified',
                reviewDisposition: '一般移住・一般住宅制度を子育て世帯向け住宅支援として扱わず、現行公式情報で該当制度を確認できないためunavailableへ変更。'
              },
              source: {
                url: 'https://www.city.sakaide.lg.jp/soshiki/seisaku/akiyakaisyuu.html',
                checkedAt
              },
              additionalSources: [
                {
                  url: 'https://www.city.sakaide.lg.jp/soshiki/seisaku/tokyoujiturn.html',
                  checkedAt
                }
              ]
            };
            writeJsonPreservingStyle(path, data);
            updateTask('37203', data, '2026-07-25 14:18: 完了後独立抜き取り監査で、一般の移住促進・空き家改修制度を子育て世帯向け住宅支援として登録していた分類誤りを確認。housingSupportをunavailableへ変更。');
          }

          {
            const path = `${root}/data/municipalities/39/39210.json`;
            const data = readJson(path);
            data.summary = '四万十市の必須9制度を公式情報で再監査。8制度をverified、子育て世帯固有の住宅支援を確認できないため住宅支援をunavailableとして登録。';
            data.updatedAt = checkedAt;
            data.services.housingSupport = {
              status: 'unavailable',
              summary: '移住者向け空き家改修制度はあるが、子育て世帯固有の住宅取得・改修支援を確認できない',
              notes: [
                '移住支援住宅小規模改修・整備事業は、移住者へ提供する空き家の所有者等を対象とする一般の移住住宅制度である。',
                '子どもの有無、対象年齢、子育て世帯加算等を要件とする住宅支援ではないため、子育て世帯向け住宅支援として登録しない。',
                '市公式の住宅助成一覧も再確認したが、2026年度の子育て世帯固有の住宅取得・改修制度を確認できなかった。'
              ],
              details: {
                confirmedGeneralProgram: '移住者提供用空き家の小規模改修上限25万～50万円、整備事業のリフォーム上限270万円等を確認',
                unconfirmedChildSpecificCondition: '子ども要件、子育て世帯限定、子育て加算を伴う住宅取得・改修支援',
                previousStatus: 'verified',
                reviewDisposition: '一般移住住宅制度を子育て世帯向け住宅支援として扱わず、該当制度未確認のためunavailableへ変更。'
              },
              source: {
                url: 'https://www.city.shimanto.lg.jp/site/iju-teiju-subsite/3021.html',
                checkedAt
              },
              additionalSources: [
                {
                  url: 'https://www.city.shimanto.lg.jp/life/1/6/30/index.html',
                  checkedAt
                }
              ]
            };
            writeJsonPreservingStyle(path, data);
            updateTask('39210', data, '2026-07-25 14:18: 完了後独立抜き取り監査で、移住者向け空き家改修制度を子育て世帯向け住宅支援として登録していた分類誤りを確認。housingSupportをunavailableへ変更。');
          }

          {
            const path = `${root}/data/municipalities/43/43215.json`;
            const data = readJson(path);
            data.summary = '必須9制度を天草市公式情報で再監査。学校給食費は小学校無償・中学校の現行負担上限と納付方法を確認してverified、一般住宅改修制度のみの住宅支援はunavailableとして登録。';
            data.updatedAt = checkedAt;
            data.services.schoolMeals = {
              status: 'verified',
              summary: '2026年度は市立小学校の給食費を無償化し、中学校は一食単価上限390円で原則口座振替',
              eligibility: {
                minAgeMonths: 72,
                maxAgeYears: 15
              },
              details: {
                elementarySchool: '2026年4月から市立小学校の学校給食費を無償化',
                juniorHighSchool: '現行の学校給食費条例施行規則では、中学校の一食単価は1人390円を最大値とし、市長がその範囲内で決定',
                annualMaximum: '中学校の年間実施最大回数は200回',
                payment: '保護者納付額は一食単価に年間実施回数を乗じた額とし、原則口座振替',
                previousStatus: 'unavailable'
              },
              source: {
                url: 'https://www.city.amakusa.kumamoto.jp/kiji00313974/index.html',
                checkedAt
              },
              additionalSources: [
                {
                  url: 'https://www2.city.amakusa.kumamoto.jp/reiki/reiki_honbun/r351RG00001532.html',
                  checkedAt
                },
                {
                  url: 'https://www.city.amakusa.kumamoto.jp/kiji00313931/index.html',
                  checkedAt
                }
              ]
            };
            data.services.housingSupport = {
              status: 'unavailable',
              summary: '一般住宅のリフォーム助成はあるが、子育て世帯固有の住宅支援条件を確認できない',
              notes: [
                '令和8年度物価高騰対策住宅リフォーム助成事業は、市内住宅所有者等を対象とする一般住宅改修制度である。',
                '子どもの有無、対象年齢、子育て世帯加算等を要件とする住宅取得・改修支援ではないため、子育て世帯向け住宅支援として登録しない。',
                '公式サイト内を再探索したが、2026年度の子育て世帯固有の住宅取得・改修制度を確認できなかった。'
              ],
              details: {
                confirmedGeneralProgram: '対象リフォーム費の1～2割、初回上限20万円・2回目上限10万円の一般制度を確認',
                unconfirmedChildSpecificCondition: '子ども要件、子育て世帯限定、子育て加算を伴う住宅取得・改修支援',
                previousStatus: 'verified',
                reviewDisposition: '一般住宅改修制度を子育て世帯向け住宅支援として扱わず、該当制度未確認のためunavailableへ変更。'
              },
              source: {
                url: 'https://www.city.amakusa.kumamoto.jp/kiji00314159/index.html',
                checkedAt
              }
            };
            writeJsonPreservingStyle(path, data);
            updateTask('43215', data, '2026-07-25 14:18: 完了後独立抜き取り監査で、学校給食費をunavailableからverifiedへ変更し、一般住宅リフォーム制度を子育て世帯向け住宅支援としていた分類誤りを修正してhousingSupportをunavailableへ変更。');
          }

          const auditPath = `${root}/operations/audits/west-a-post-final-independent-sample-20260725.json`;
          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-post-final-independent-sample-20260725',
            team: '西日本調査班A',
            checkedAt: updatedAt,
            trigger: '西日本訂正26件の最終状態確定後の独立抜き取り監査',
            sample: {
              municipalityCount: 6,
              prefectureCodes: ['33', '37', '39', '40', '43', '46'],
              municipalities: [
                { code: '33202', name: '倉敷市', focus: 'schoolMeals', result: 'matched' },
                { code: '37203', name: '坂出市', focus: 'temporaryChildcare,housingSupport', result: 'housing_category_corrected' },
                { code: '39210', name: '四万十市', focus: 'schoolMeals,housingSupport', result: 'housing_category_corrected' },
                { code: '40202', name: '大牟田市', focus: 'childMedical,temporaryChildcare', result: 'matched' },
                { code: '43215', name: '天草市', focus: 'schoolMeals,housingSupport,temporaryChildcare', result: 'school_meal_and_housing_corrected' },
                { code: '46222', name: '奄美市', focus: 'temporaryChildcare,schoolMeals,housingSupport', result: 'matched' }
              ]
            },
            corrections: [
              {
                municipalityCode: '37203', municipalityName: '坂出市', service: 'housingSupport', classification: 'category_error', before: 'verified_general_migration_empty_house_program', after: 'unavailable_no_child_specific_housing_program', officialSources: ['https://www.city.sakaide.lg.jp/soshiki/seisaku/akiyakaisyuu.html', 'https://www.city.sakaide.lg.jp/soshiki/seisaku/tokyoujiturn.html']
              },
              {
                municipalityCode: '39210', municipalityName: '四万十市', service: 'housingSupport', classification: 'category_error', before: 'verified_general_migration_housing_program', after: 'unavailable_no_child_specific_housing_program', officialSources: ['https://www.city.shimanto.lg.jp/site/iju-teiju-subsite/3021.html', 'https://www.city.shimanto.lg.jp/life/1/6/30/index.html']
              },
              {
                municipalityCode: '43215', municipalityName: '天草市', service: 'schoolMeals', classification: 'status_judgement_error', before: 'unavailable_middle_school_conditions_unconfirmed', after: 'verified_elementary_free_middle_max390_account_transfer', officialSources: ['https://www.city.amakusa.kumamoto.jp/kiji00313974/index.html', 'https://www2.city.amakusa.kumamoto.jp/reiki/reiki_honbun/r351RG00001532.html', 'https://www.city.amakusa.kumamoto.jp/kiji00313931/index.html']
              },
              {
                municipalityCode: '43215', municipalityName: '天草市', service: 'housingSupport', classification: 'category_error', before: 'verified_general_home_renovation_program', after: 'unavailable_no_child_specific_housing_program', officialSources: ['https://www.city.amakusa.kumamoto.jp/kiji00314159/index.html']
              }
            ],
            summary: {
              sampledMunicipalityCount: 6,
              matchedMunicipalityCount: 3,
              correctedMunicipalityCount: 3,
              correctedServiceCount: 4,
              categoryErrorCount: 3,
              statusJudgementErrorCount: 1,
              unresolvedCount: 0,
              blocker: null,
              result: 'completed_with_four_corrections'
            }
          };
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          NODE

          rm -f jichitai-compare/operations/control/west-a-independent-sample-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-independent-sample-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/37/37203.json \
                  jichitai-compare/data/municipalities/39/39210.json \
                  jichitai-compare/data/municipalities/43/43215.json \
                  jichitai-compare/operations/tasks/37203.json \
                  jichitai-compare/operations/tasks/39210.json \
                  jichitai-compare/operations/tasks/43215.json \
                  jichitai-compare/operations/audits/west-a-post-final-independent-sample-20260725.json \
                  jichitai-compare/operations/control/west-a-independent-sample-trigger-20260725.json \
                  .github/workflows/temporary-west-a-independent-sample-fix.yml
          git diff --cached --check
          git commit -m 'fix: 西日本A完了後抜き取り4制度を訂正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
