name: Pharmacist Icon Materialize
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pharmacist-icon-materialize.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact canonical Drive PNG through temporary signed bridge
        shell: bash
        run: |
          set -euo pipefail
          out='pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          curl --fail --location --retry 3 --output "$out" 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-8b14-81f7-8a35-6aff77f9085e/raw?se=2026-08-09T08%3A41%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=6495074e-0a7b-57d1-aa68-da75e0d34a81&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T01%3A52%3A14Z&ske=2026-08-10T01%3A52%3A14Z&sks=b&skv=2026-02-06&sig=qmU4gS3s1rfK%2Fwn7q8AOXZOJC1%2BDtJdORpBdsTadu9s%3D'
          echo 'dfc7dfe4a1c13afbe98658cde591274e11665b016c39e2a4411de4dbe86127ec  '"$out" | sha256sum -c -
          python3 - "$out" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read();assert b[:8]==b'\x89PNG\r\n\x1a\n';assert struct.unpack('>II',b[16:24])==(1024,1024);assert b[25]==2
          print('PASS: canonical 1024x1024 RGB pharmacist icon')
          PY
      - name: Commit canonical icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          git commit -m 'pharmacist: materialize canonical AppIcon [skip ci]'
          git pull --rebase origin main
          git push
