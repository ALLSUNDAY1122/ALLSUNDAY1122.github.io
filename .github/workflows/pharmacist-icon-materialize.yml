name: Pharmacist Icon Materialize
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pharmacist-icon-materialize.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact canonical Drive PNG through temporary signed bridge
        shell: bash
        run: |
          set -euo pipefail
          out='pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          curl --fail --location --retry 3 --output "$out" 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-9af8-81f7-b695-8bdeb7df2245/raw?se=2026-08-09T08%3A27%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=f6abd3ee-5c26-53a8-b253-cde303349f40&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T01%3A38%3A05Z&ske=2026-08-10T01%3A38%3A05Z&sks=b&skv=2026-02-06&sig=6Wz9%2F79W9FpZrceThmgtLasyo6rB1JtZDwpOhyRqdRc%3D'
          echo 'dfc7dfe4a1c13afbe98658cde591274e11665b016c39e2a4411de4dbe86127ec  '"$out" | sha256sum -c -
          python3 - "$out" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read();assert b[:8]==b'\x89PNG\r\n\x1a\n';assert struct.unpack('>II',b[16:24])==(1024,1024);assert b[25]==2
          print('PASS: canonical 1024x1024 RGB pharmacist icon')
          PY
      - name: Commit canonical icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          git commit -m 'pharmacist: materialize canonical AppIcon [skip ci]'
          git pull --rebase origin main
          git push
