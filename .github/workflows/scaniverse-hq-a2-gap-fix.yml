# Triggered after initial workflow registration so the push event can execute this existing workflow.
name: Scaniverse HQ A2 gap fix

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scaniverse-hq-a2-gap-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Apply capture image quality gate and reconstruction preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
