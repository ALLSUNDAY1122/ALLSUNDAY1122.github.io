name: Scaniverse HQ A2 gap fix

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scaniverse-hq-a2-gap-fix.yml'

permissions:
  contents: write

concurrency:
  group: scaniverse-hq-a2-gap-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0

      - name: Wire quality rejection before JPEG persistence and resource preflight before dataset allocation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          model = Path('splat-native-ios/SplatNative/ScanModel.swift')
          s = model.read_text(encoding='utf-8')

          quality_marker = 'CaptureImageQualityEvaluator.evaluate(pixelBuffer: frame.capturedImage)'
          preflight_marker = 'let preflightEvaluation = passResourceGuard.evaluate(splatCount: 0)'

          if quality_marker not in s:
              jpeg_anchor = '''        guard let jpegData = makeJPEGData(pixelBuffer: frame.capturedImage) else {\n            trackingMessage = "画像を保存できません。もう一度ゆっくり動かしてください"\n            return\n        }\n'''
              if s.count(jpeg_anchor) != 1:
                  raise SystemExit(f'Unexpected JPEG anchor count: {s.count(jpeg_anchor)}')
              quality_gate = '''        if let stats = CaptureImageQualityEvaluator.evaluate(pixelBuffer: frame.capturedImage),\n           let rejection = CaptureImageQualityPolicy.rejection(for: stats) {\n            trackingMessage = rejection.userMessage\n            return\n        }\n\n''' + jpeg_anchor
              s = s.replace(jpeg_anchor, quality_gate, 1)

          if preflight_marker not in s:
              dataset_anchor = '''                let dataset = GaussianDataset(\n                    path: path,\n                    downscaleFactor: SplatReconstructionPolicy.datasetDownscale,\n                    evalMode: false\n                )\n'''
              if s.count(dataset_anchor) != 1:
                  raise SystemExit(f'Unexpected dataset anchor count: {s.count(dataset_anchor)}')
              preflight = '''                // Reject before GaussianDataset/GaussianTrainer allocation when the device is\n                // already under memory or thermal pressure. This protects the largest allocation spike.\n                let preflightEvaluation = passResourceGuard.evaluate(splatCount: 0)\n                if let reason = preflightEvaluation.reason {\n                    let report = passResourceGuard.makeReport(\n                        startedAt: runStartedAt,\n                        startUptime: runStartUptime,\n                        passStartIteration: 0,\n                        targetIteration: requestedTarget,\n                        finalIteration: 0,\n                        finalSplatCount: 0,\n                        initialThermalState: initialThermalState,\n                        finalThermalState: splatThermalStateName(ProcessInfo.processInfo.thermalState),\n                        outcome: "preflight-\\(reason.rawValue)"\n                    )\n                    SplatReconstructionRunReport.write(report, projectURL: projectURL)\n                    Task { @MainActor [weak self] in\n                        self?.failTraining(reason.userMessage)\n                    }\n                    return\n                }\n\n''' + dataset_anchor
              s = s.replace(dataset_anchor, preflight, 1)

          model.write_text(s, encoding='utf-8')
          PY

          grep -q 'CaptureImageQualityEvaluator.evaluate(pixelBuffer: frame.capturedImage)' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'let preflightEvaluation = passResourceGuard.evaluate(splatCount: 0)' splat-native-ios/SplatNative/ScanModel.swift
          git diff --check
          git diff -- splat-native-ios/SplatNative/ScanModel.swift

      - name: Commit ScanModel wiring
        run: |
          set -euo pipefail
          if git diff --quiet -- splat-native-ios/SplatNative/ScanModel.swift; then
            echo 'ScanModel wiring already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/ScanModel.swift
          git commit -m 'fix(scaniverse): wire capture quality and reconstruction preflight'
          git push origin HEAD:feature/splat-native-ios-poc
