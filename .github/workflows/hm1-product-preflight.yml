name: HM1 Product Preflight

on:
  push:
    branches: [main]
    paths:
      - 'ios/health-manager-1/Resources/questions.json'
      - 'ios/health-manager-1/Resources/index.html'
      - 'ios/health-manager-1/HealthManager1/StoreKitManager.swift'
      - 'ios/health-manager-1/HealthManager1/WebView.swift'
      - 'ios/health-manager-1/augment-to-264.cjs'
      - 'apps/sanitary-manager-2/**'
      - 'ios/health-manager-1/RELEASE_CHECKLIST.md'
      - 'scripts/audit_hm1_product_preflight.py'
      - 'scripts/audit_hm1_human_gate.py'
      - '.github/workflows/app2-005-hm1-submit-review.yml'
      - 'automation/app2-005-hm1-submit-command.json'
      - '.github/workflows/hm1-product-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Materialize audited 264-question release bundle
        run: node ios/health-manager-1/augment-to-264.cjs
      - name: Product quality preflight
        run: python3 scripts/audit_hm1_product_preflight.py
      - name: App Review Human Gate regression
        run: python3 scripts/audit_hm1_human_gate.py
