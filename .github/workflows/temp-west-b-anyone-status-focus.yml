name: Temporary West B Anyone Status Focus

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-anyone-status-focus-trigger-20260725.json

permissions:
  contents: write

jobs:
  focus:
    if: github.head_ref == 'audit/west-b-anyone-crosscheck-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-anyone-crosscheck-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build status contradiction review list
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'jichitai-compare/operations';
          const audit = JSON.parse(fs.readFileSync(`${base}/audits/west-b-anyone-crosscheck-20260725.json`, 'utf8'));
          const flatten = (value) => {
            if (value == null) return '';
            if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
            if (Array.isArray(value)) return value.map(flatten).join(' ');
            return Object.values(value).map(flatten).join(' ');
          };
          const explicitExclusion = /(未就園児向け.*ではなく|こども誰でも通園制度ではなく|誰でも通園ではなく|代替登録しない|通常保育を.*代替登録しない|親子参加.*代替登録しない)/;
          const focused = audit.candidates.filter((item) => {
            const reasons = item.reasons ?? [];
            const text = flatten(item);
            if (explicitExclusion.test(text)) return false;
            return reasons.includes('unavailable_but_record_contains_available_program') ||
              reasons.includes('verified_without_anyone_program_2026') ||
              reasons.includes('eligibility_min_age_exceeds_anyone_program_six_months') ||
              reasons.includes('anyone_program_age_upper_bound_may_be_wrong');
          }).map((item) => ({
            ...item,
            focusFlags: (item.reasons ?? []).filter((reason) => [
              'unavailable_but_record_contains_available_program',
              'verified_without_anyone_program_2026',
              'eligibility_min_age_exceeds_anyone_program_six_months',
              'anyone_program_age_upper_bound_may_be_wrong'
            ].includes(reason))
          })).sort((a, b) => a.status.localeCompare(b.status) || a.prefectureCode.localeCompare(b.prefectureCode) || a.code.localeCompare(b.code));

          const review = {
            schemaVersion: '1.0.0',
            reviewId: 'west-b-anyone-status-focus-review-20260725',
            sourceAuditId: audit.auditId,
            generatedAt: new Date().toISOString(),
            focusedCandidateCount: focused.length,
            exclusionRule: 'exclude records explicitly classifying the service as enrolled-kindergarten care, parent-child plaza, ordinary nursery, or otherwise not anyone-program',
            focusedCandidates: focused,
            result: {
              status: 'status_focus_generated_pending_official_review',
              confirmedCorrectionCount: null,
              unresolvedConfirmedErrorCount: null
            }
          };
          fs.writeFileSync(`${base}/audits/west-b-anyone-status-focus-review-20260725.json`, JSON.stringify(review, null, 2) + '\n');
          console.log(JSON.stringify({ focusedCandidateCount: focused.length, focused: focused.map((x) => ({ code: x.code, name: x.name, status: x.status, flags: x.focusFlags, summary: x.summary })) }, null, 2));
          NODE
      - name: Commit focused review list
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/west-b-anyone-status-focus-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/audits/west-b-anyone-status-focus-review-20260725.json \
                  jichitai-compare/operations/control/west-b-anyone-status-focus-trigger-20260725.json
          git commit -m 'audit: 西日本B誰でも通園制度の状態矛盾候補を抽出'
          git push origin HEAD:audit/west-b-anyone-crosscheck-20260725
