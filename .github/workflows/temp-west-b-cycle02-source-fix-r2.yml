name: Temporary West B Cycle 02 Source Maintenance R2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-cycle02-source-maintenance-r2-20260725
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update two stale evidence sources
        run: |
          node <<'NODE'
          const { readFile, writeFile } = require('node:fs/promises');
          (async () => {
            const readJson = async path => JSON.parse(await readFile(path, 'utf8'));
            const writeJson = async (path, value) => writeFile(path, JSON.stringify(value, null, 2) + '\n', 'utf8');

            const okiPath = 'jichitai-compare/data/municipalities/32/32528.json';
            const okiTaskPath = 'jichitai-compare/operations/tasks/32528.json';
            const oki = await readJson(okiPath);
            oki.services.bulkyWaste.source = {
              url: 'https://www.town.okinoshima.shimane.jp/kurashi/gomi-kankyo/katei_gomi/2/5013.html',
              checkedAt: '2026-07-25'
            };
            delete oki.services.bulkyWaste.additionalSources;
            oki.updatedAt = '2026-07-25';
            await writeJson(okiPath, oki);

            const okiTask = await readJson(okiTaskPath);
            const oldOki = 'https://www.town.okinoshima.shimane.jp/www/contents/1673928417591/simple/guidebook.pdf';
            const newOki = 'https://www.town.okinoshima.shimane.jp/kurashi/gomi-kankyo/katei_gomi/2/5013.html';
            okiTask.officialSources = [...new Set((okiTask.officialSources ?? []).map(url => url === oldOki ? newOki : url))];
            okiTask.lastCheckedAt = '2026-07-25';
            okiTask.lastUpdatedAt = '2026-07-25T00:47:00+09:00';
            if (!(okiTask.notes ?? []).some(note => note.includes('粗大ごみ旧PDF'))) {
              okiTask.notes = [...(okiTask.notes ?? []), '概略検証第2回で粗大ごみ旧PDFの404を確認し、現行の町公式ごみ案内ページへ出典を更新。制度内容・料金・判定は変更なし。'];
            }
            await writeJson(okiTaskPath, okiTask);

            const otakePath = 'jichitai-compare/data/municipalities/34/34211.json';
            const otakeTaskPath = 'jichitai-compare/operations/tasks/34211.json';
            const otake = await readJson(otakePath);
            otake.services.postpartumCare.summary = '令和8年度も産後ケア事業の継続を確認したが、現行の利用条件・料金を公式利用案内で確認できない';
            otake.services.postpartumCare.details = {
              confirmed: '令和8年度実施計画で産後ケア事業と家事育児支援事業の継続を確認',
              currentStatus: '令和8年度の対象月齢、利用形態別料金、回数上限を示す現行利用案内は公式サイト上で確認できないため、最新条件は要問い合わせ'
            };
            otake.services.postpartumCare.source = {
              url: 'https://www.city.otake.hiroshima.jp/material/files/group/3/R8jissikeikaku260316.pdf',
              checkedAt: '2026-07-25'
            };
            otake.updatedAt = '2026-07-25';
            await writeJson(otakePath, otake);

            const otakeTask = await readJson(otakeTaskPath);
            const oldOtake = 'https://www.city.otake.hiroshima.jp/material/files/group/25/sangokea2025.pdf';
            const newOtake = 'https://www.city.otake.hiroshima.jp/material/files/group/3/R8jissikeikaku260316.pdf';
            otakeTask.officialSources = [...new Set((otakeTask.officialSources ?? []).map(url => url === oldOtake ? newOtake : url))];
            otakeTask.lastCheckedAt = '2026-07-25';
            otakeTask.lastUpdatedAt = '2026-07-25T00:47:00+09:00';
            if (!(otakeTask.notes ?? []).some(note => note.includes('令和7年度産後ケアPDF'))) {
              otakeTask.notes = [...(otakeTask.notes ?? []), '概略検証第2回で令和7年度産後ケアPDFの404を確認。令和8年度実施計画へ根拠を更新し、現行条件未確認のためunavailable判定を維持。'];
            }
            await writeJson(otakeTaskPath, otakeTask);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Regenerate and validate
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit synchronized files
        run: |
          rm .github/workflows/temp-west-b-cycle02-source-fix-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'fix: refresh two West B evidence sources from audit cycle 02'
          git push origin HEAD:fix/west-b-cycle02-source-maintenance-r2-20260725
