name: Normalize Yorugatari story pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/tools/normalize-story-pages.mjs
      - .github/workflows/normalize-yorugatari-stories.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize and validate story pages
        run: node yorugatari/tools/normalize-story-pages.mjs

      - name: Check generated diff
        run: git diff --check

      - name: Commit normalized pages
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/stories; then
            echo "All story pages are already normalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/stories
          git commit -m "Normalize Yorugatari story pages [skip ci]"
          git push
