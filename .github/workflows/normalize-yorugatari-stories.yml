name: Normalize Yorugatari story pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/index.html
      - yorugatari/archive.html
      - yorugatari/stories/**
      - yorugatari/assets/app.js
      - yorugatari/assets/archive.js
      - yorugatari/assets/story.js
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/tools/normalize-story-pages.mjs
      - yorugatari/tools/ui-audit.cjs
      - .github/workflows/normalize-yorugatari-stories.yml

concurrency:
  group: yorugatari-normalize-ui
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize and validate story pages
        shell: bash
        run: |
          set +e
          node yorugatari/tools/normalize-story-pages.mjs > yorugatari-normalize.log 2>&1
          status=$?
          cat yorugatari-normalize.log

          if [ "$status" -ne 0 ]; then
            git checkout -- yorugatari/stories
            cp yorugatari-normalize.log yorugatari/tools/normalize-last-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yorugatari/tools/normalize-last-error.log
            git commit -m "Record Yorugatari normalization error [skip ci]"
            git push
            exit "$status"
          fi

      - name: Check generated diff
        run: git diff --check

      - name: Commit normalized pages
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/stories; then
            echo "All story pages are already normalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/stories
          git commit -m "Normalize Yorugatari story pages [skip ci]"
          git push

  verify-live:
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify published pages
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://allsunday1122.github.io/yorugatari';
          const targets = [
            ['top', `${base}/`, ['オリジナル怖い話100作品', 'class="skip-link"', 'id="readerPanel"', 'assets/stories-096-100.js?v=20260723-004', 'assets/app.js?v=20260723-007', 'assets/analytics.js?v=20260723-002']],
            ['archive', `${base}/archive.html`, ['全100話アーカイブ', '"numberOfItems":100', 'assets/archive.js?v=20260723-004', 'assets/analytics.js?v=20260723-002']],
            ['story-001', `${base}/stories/last-elevator.html`, ['YGT-001', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006', '../assets/engagement.js?v=20260723-002']],
            ['story-032', `${base}/stories/spare-key-returned.html`, ['YGT-032', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006', '../assets/engagement.js?v=20260723-002']],
            ['story-100', `${base}/stories/hired-with-your-experience.html`, ['YGT-100', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006', '../assets/engagement.js?v=20260723-002']],
            ['story-js', `${base}/assets/story.js?v=20260723-006`, ['function normalizeBasicPage()', 'const completeCatalog = loadedCount === catalogSources.length;', 'buildStoryPagination(stories, currentIndex, completeCatalog);']]
          ];
          const results = [];

          for (const [name, url, tokens] of targets) {
            try {
              const separator = url.includes('?') ? '&' : '?';
              const response = await fetch(`${url}${separator}verify=${Date.now()}`, {
                redirect: 'follow',
                headers: { 'cache-control': 'no-cache', 'user-agent': 'Yorugatari-Live-Check/1.4' }
              });
              const text = await response.text();
              const missingTokens = tokens.filter((token) => !text.includes(token));
              results.push({
                name,
                status: response.status,
                finalUrl: response.url,
                bytes: Buffer.byteLength(text),
                missingTokens,
                ok: response.status === 200 && missingTokens.length === 0
              });
            } catch (error) {
              results.push({ name, status: null, bytes: 0, missingTokens: tokens, error: String(error), ok: false });
            }
          }

          const report = {
            verifiedAt: new Date().toISOString(),
            baseUrl: base,
            success: results.every((result) => result.ok),
            results
          };
          console.log(`YORUGATARI_LIVE_REPORT=${JSON.stringify(report)}`);
          if (!report.success) process.exit(1);
          NODE

  ui-audit:
    needs: verify-live
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit published interactions
        id: audit
        continue-on-error: true
        run: node yorugatari/tools/ui-audit.cjs

      - name: Record UI audit report
        if: always()
        shell: bash
        run: |
          test -f yorugatari-ui-report.json
          cp yorugatari-ui-report.json /tmp/yorugatari-ui-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/yorugatari-ui-report.json yorugatari/tools/ui-audit-latest.json
          git add yorugatari/tools/ui-audit-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Yorugatari UI audit [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload UI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-ui-audit-report
          path: yorugatari-ui-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce UI audit result
        if: always()
        shell: bash
        run: |
          node -e "const report=require('./yorugatari-ui-report.json'); if(!report.success){console.error(JSON.stringify(report.failures,null,2)); process.exit(1)}"
