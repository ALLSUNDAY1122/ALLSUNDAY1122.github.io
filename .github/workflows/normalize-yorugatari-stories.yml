name: Normalize Yorugatari story pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/tools/normalize-story-pages.mjs
      - .github/workflows/normalize-yorugatari-stories.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize and validate story pages
        shell: bash
        run: |
          set +e
          node yorugatari/tools/normalize-story-pages.mjs > yorugatari-normalize.log 2>&1
          status=$?
          cat yorugatari-normalize.log

          if [ "$status" -ne 0 ]; then
            git checkout -- yorugatari/stories
            cp yorugatari-normalize.log yorugatari/tools/normalize-last-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yorugatari/tools/normalize-last-error.log
            git commit -m "Record Yorugatari normalization error [skip ci]"
            git push
            exit "$status"
          fi

      - name: Check generated diff
        run: git diff --check

      - name: Commit normalized pages
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/stories; then
            echo "All story pages are already normalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/stories
          git commit -m "Normalize Yorugatari story pages [skip ci]"
          git push

  verify-live:
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify published pages
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'https://allsunday1122.github.io/yorugatari';
          const targets = [
            ['top', `${base}/`, ['オリジナル怖い話100作品', 'assets/stories-096-100.js?v=20260723-004', 'assets/app.js?v=20260723-004']],
            ['archive', `${base}/archive.html`, ['全100話アーカイブ', '"numberOfItems":100', 'assets/archive.js?v=20260723-004']],
            ['story-001', `${base}/stories/last-elevator.html`, ['YGT-001', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006']],
            ['story-032', `${base}/stories/spare-key-returned.html`, ['YGT-032', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006']],
            ['story-100', `${base}/stories/hired-with-your-experience.html`, ['YGT-100', '"timeRequired":"PT5M"', 'class="breadcrumb"', '../assets/story.js?v=20260723-006']],
            ['story-js', `${base}/assets/story.js?v=20260723-006`, ['ensureBaseStoryMetadata', 'loadedSourceCount === catalogSources.length', 'ensureStoryPagination']]
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const results = [];

          for (const [name, url, tokens] of targets) {
            let result;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const separator = url.includes('?') ? '&' : '?';
                const response = await fetch(`${url}${separator}verify=${Date.now()}`, {
                  redirect: 'follow',
                  headers: { 'cache-control': 'no-cache', 'user-agent': 'Yorugatari-Live-Check/1.0' }
                });
                const text = await response.text();
                const missingTokens = tokens.filter((token) => !text.includes(token));
                result = {
                  name,
                  url,
                  attempt,
                  status: response.status,
                  finalUrl: response.url,
                  bytes: Buffer.byteLength(text),
                  missingTokens,
                  ok: response.status === 200 && missingTokens.length === 0
                };
              } catch (error) {
                result = { name, url, attempt, status: null, bytes: 0, missingTokens: tokens, error: String(error), ok: false };
              }
              if (result.ok) break;
              if (attempt < 12) await sleep(10000);
            }
            results.push(result);
          }

          const report = {
            verifiedAt: new Date().toISOString(),
            baseUrl: base,
            success: results.every((result) => result.ok),
            results
          };
          fs.writeFileSync('yorugatari/tools/live-verification.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          if (!report.success) process.exitCode = 1;
          NODE
          status=$?
          echo "$status" > yorugatari-live-status.txt
          exit 0

      - name: Commit verification report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/tools/live-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Yorugatari live verification [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Enforce verification result
        shell: bash
        run: |
          test "$(cat yorugatari-live-status.txt)" = "0"
