name: Temporary build east release 1748

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-release-1748.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed east snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/region/east:refs/remotes/origin/region/east
          git checkout -B coord/east-release-10-20260722-1748 origin/main
          python3 - <<'PY'
          import re, subprocess
          root='jichitai-compare/data/municipalities'
          def codes(ref):
              out=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,root],text=True)
              result=set()
              for path in out.splitlines():
                  m=re.fullmatch(r'jichitai-compare/data/municipalities/(\d{2})/(\d{5})\.json',path)
                  if not m: continue
                  pref=int(m.group(1))
                  if 8 <= pref <= 15 or pref in (19,20):
                      result.add(m.group(2))
              return result
          pending=sorted(codes('origin/region/east')-codes('HEAD'))
          assert len(pending) >= 10, pending
          selected=pending[:10]
          open('/tmp/east-codes','w').write(' '.join(selected))
          print('selected',selected)
          PY
          codes=$(cat /tmp/east-codes)
          for code in $codes; do
            pref=${code:0:2}
            mkdir -p "jichitai-compare/data/municipalities/$pref" jichitai-compare/operations/tasks
            git show "origin/region/east:jichitai-compare/data/municipalities/$pref/$code.json" > "jichitai-compare/data/municipalities/$pref/$code.json"
            git show "origin/region/east:jichitai-compare/operations/tasks/$code.json" > "jichitai-compare/operations/tasks/$code.json"
          done
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          test "${#changed[@]}" -eq 20
          for path in "${changed[@]}"; do
            case "$path" in
              jichitai-compare/data/municipalities/08/*.json|jichitai-compare/data/municipalities/09/*.json|jichitai-compare/data/municipalities/10/*.json|jichitai-compare/data/municipalities/11/*.json|jichitai-compare/data/municipalities/12/*.json|jichitai-compare/data/municipalities/13/*.json|jichitai-compare/data/municipalities/14/*.json|jichitai-compare/data/municipalities/15/*.json|jichitai-compare/data/municipalities/19/*.json|jichitai-compare/data/municipalities/20/*.json|jichitai-compare/operations/tasks/*.json) ;;
              *) echo "unexpected path: $path"; exit 1;;
            esac
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/data/municipalities jichitai-compare/operations/tasks
          git commit -m "全国統合: 東日本10自治体を固定スナップショット化 ($codes)"
          git push --force origin HEAD:coord/east-release-10-20260722-1748
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-build-east-release-1748.yml ]; then
            git rm .github/workflows/temp-build-east-release-1748.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 東日本固定統合一時ワークフローを削除'
            git push origin HEAD:main
          fi
