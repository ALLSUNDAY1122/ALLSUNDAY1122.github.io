name: Rigaku 600 Content Quality Gate

on:
  pull_request:
    paths:
      - 'rigaku-sprint/product-content/**'
      - '.github/workflows/rigaku-content-audit.yml'

permissions:
  contents: write

concurrency:
  group: rigaku-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply specific-evidence migration
        run: |
          python3 rigaku-sprint/product-content/fix_specific_evidence_refs.py
          if ! git diff --quiet -- rigaku-sprint/product-content/question-batches; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rigaku-sprint/product-content/question-batches
            git commit -m "fix(rigaku): pin specific evidence for seven questions"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Official 600-slot and scoring audit
        run: python3 rigaku-sprint/product-content/validate_exam_structure.py

      - name: Official 600-answer audit
        run: python3 rigaku-sprint/product-content/validate_official_answers.py

      - name: Audited 600-question release gate
        run: python3 rigaku-sprint/product-content/validate_question_batches.py

      - name: Evidence specificity audit
        run: python3 rigaku-sprint/product-content/validate_evidence_quality.py

      - name: Classification summary
        run: python3 rigaku-sprint/product-content/summarize_classification.py
