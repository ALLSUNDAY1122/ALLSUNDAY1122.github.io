name: Temporary West A School Meals Decision Summary

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-decision-summary-trigger-20260725.json

permissions:
  contents: write

jobs:
  summarize:
    if: github.head_ref == 'audit/west-a-school-meals-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Summarize official fetch decisions
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json','utf8'));
          const rows=src.results.map(r=>{
            const excerpts=(r.excerpts||[]).map(x=>x.snippet).join(' ');
            const direct2026=/(2026|令和8|令和８)(?:年度|年)/.test(excerpts);
            const implementation=/無償化|無料|全額.{0,10}(負担|補助|支援)|保護者負担.{0,8}(0円|なし)|納付免除/.test(excerpts);
            const userCondition=/対象者|対象となる|市立|町立|村立|小学校|中学校|児童|生徒|保護者/.test(excerpts);
            const onlyProposal=/予定|方針|検討|予算案|提案|目指す/.test(excerpts) && !/実施|開始|無償化しています|納付免除|対象者/.test(excerpts);
            const currentConfirmed=r.httpStatus===200&&direct2026&&implementation&&userCondition&&!onlyProposal;
            const ongoingConfirmed=r.httpStatus===200&&r.markers?.continuing&&implementation&&userCondition&&!onlyProposal;
            const resolution=currentConfirmed?'retained_current_2026':ongoingConfirmed?'retained_ongoing':r.error?'needs_refetch':onlyProposal?'needs_user_facing_source':'needs_manual_review';
            const preferred=(r.excerpts||[]).filter(x=>/(2026年度|令和8年度|令和８年度|学校給食費|給食費)/.test(x.term+' '+x.snippet)).slice(0,3);
            return {code:r.code,name:r.name,prefecture:r.prefecture,summary:r.summary,sourceUrl:r.sourceUrl,categories:r.categories,httpStatus:r.httpStatus??null,error:r.error||null,markers:r.markers||null,direct2026,implementation,userCondition,onlyProposal,resolution,keyExcerpts:preferred};
          });
          const counts=Object.fromEntries([...new Set(rows.map(x=>x.resolution))].sort().map(k=>[k,rows.filter(x=>x.resolution===k).length]));
          const report={schemaVersion:'1.0.0',auditId:'west-a-school-meals-decision-summary-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),targetCount:rows.length,counts,rows,status:'decision_summary_completed',manualReviewCount:rows.filter(x=>x.resolution.startsWith('needs_')).length};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(counts));
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-decision-summary-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-decision-summary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json \
                  jichitai-compare/operations/control/west-a-school-meals-decision-summary-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-decision-summary.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A学校給食費公式再取得結果を判定整理'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
