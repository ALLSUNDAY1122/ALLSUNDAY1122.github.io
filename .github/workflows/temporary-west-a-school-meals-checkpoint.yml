name: Temporary West A School Meals Checkpoint

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-checkpoint-trigger-20260725.json

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.head_ref == 'checkpoint/west-a-school-meals-final-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Import public evidence and update checkpoints
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          public_paths=(
            jichitai-compare/operations/audits/west-a-school-meals-main-clean-ci-trigger-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-public-clean-ci-trigger-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-public-verification-20260725.json
          )
          git checkout origin/main -- "${public_paths[@]}"
          node <<'NODE'
          const fs=require('fs');
          const completedAt='2026-07-25T17:16:00+09:00';
          const cp={
            schemaVersion:'1.0.0',
            checkpointId:'west-a-school-meals-crosscheck-20260725',
            sessionId:'west-a',
            displayName:'西日本調査班A',
            completedAt,
            status:'completed_with_source_maintenance',
            scope:{prefectureCodes:['33','37','39','40','43','46'],municipalityCount:226,service:'schoolMeals'},
            audit:{verifiedCount:155,unavailableCount:71,initialPriorityCandidateCount:64,refinedPriorityCandidateCount:50,officialFetchTargetCount:19,manualReviewCount:5,statusCorrectionCount:0,factValueCorrectionCount:0,sourceMaintenanceCount:2,factEnrichmentCount:1,unavailableImplementationOmissionCount:0,unresolvedCount:0},
            corrections:[
              {code:'43511',name:'五木村',change:'source_maintenance_and_fact_enrichment',condition:'現行学校給食費補助金交付要綱へ主出典を更新。村立学校は月額給食費全額、村外特別支援学校等は3分の2補助。'},
              {code:'46208',name:'出水市',change:'source_maintenance',condition:'議会会議一覧から令和8年度当初予算説明の具体ページへ主出典を更新。2026年1月開始・2026年度継続。'}
            ],
            retainedHighRisk:[
              {code:'43505',name:'多良木町',finding:'現行学校給食一覧と無償化ページで継続確認'},
              {code:'46203',name:'鹿屋市',finding:'現行利用者向けページで2024年4月から全額支援を確認'},
              {code:'46524',name:'宇検村',finding:'子育て支援ページと施政方針の継続記載が一致'}
            ],
            evidence:{
              initialAuditFile:'jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json',
              priorityAuditFile:'jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json',
              officialFetchAuditFile:'jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json',
              decisionSummaryFile:'jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json',
              manualReviewFile:'jichitai-compare/operations/audits/west-a-school-meals-manual-list-20260725.json',
              finalResolutionFile:'jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json',
              regionalPullRequestNumber:3584,regionalCiRunNumber:8762,regionalMergeSha:'38b8af8e135db8b049ee9b9f382bf8fec8eb7ac9',
              nationalPullRequestNumber:3604,nationalCiRunNumber:8778,nationalMergeSha:'e1f6a240f5f1040c63e6c5f2cca7d88643070ef0',
              publicVerificationPullRequestNumber:3609,publicVerificationCiRunNumber:8817,publicVerificationMergeSha:'65c66a6e5a2264df4e805a820914c2e705595602',
              publicVerificationFile:'jichitai-compare/operations/audits/west-a-school-meals-public-verification-20260725.json'
            },
            integrity:{publicPageTargetCount:2,publicPageHttp200Count:2,newPrimarySourceMatchCount:2,oldPrimarySourceRemainingCount:0,nationwideMunicipalityCount:1741,nationwideServiceCount:15669,remainingMunicipalityCount:0,prOpenMunicipalityCount:0,blockedMunicipalityCount:0,blockedServiceCount:0,temporaryWorkflowRemainingCount:0,blocker:null},
            nextAction:'学校給食費の状態・料金・対象に確定誤りはなく、主出典保守2件まで完了。新しい公式情報または再退行が検出された場合のみ個別再監査する。'
          };
          fs.writeFileSync('jichitai-compare/operations/control/session-checkpoints/west-a-school-meals-crosscheck-20260725.json',JSON.stringify(cp,null,2)+'\n');

          const p='jichitai-compare/operations/control/session-checkpoints/west-a.json';
          const w=JSON.parse(fs.readFileSync(p,'utf8'));
          w.updatedAt=completedAt;w.status='completed';w.pullRequestNumber=3584;w.ciStatus='success';
          w.nextAction='住宅支援分類38件、誰でも通園制度5件、学校給食費主出典2件の地域・全国・公開・checkpoint同期まで完了。新しい公式情報または再退行が検出された場合のみ再監査する。';
          w.completionEvidence=w.completionEvidence||{};
          Object.assign(w.completionEvidence,{schoolMealsCrosscheckFile:'jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json',schoolMealsRegionalPullRequestNumber:3584,schoolMealsRegionalCiRunNumber:8762,schoolMealsNationalPullRequestNumber:3604,schoolMealsNationalCiRunNumber:8778,schoolMealsPublicVerificationPullRequestNumber:3609,schoolMealsPublicVerificationCiRunNumber:8817,schoolMealsPublicVerificationFile:'jichitai-compare/operations/audits/west-a-school-meals-public-verification-20260725.json'});
          w.schoolMealsCrosscheck={status:'completed_with_source_maintenance',completedAt,municipalityCount:226,verifiedCount:155,unavailableCount:71,initialPriorityCandidateCount:64,refinedPriorityCandidateCount:50,officialFetchTargetCount:19,manualReviewCount:5,statusCorrectionCount:0,factValueCorrectionCount:0,sourceMaintenanceCount:2,factEnrichmentCount:1,unavailableImplementationOmissionCount:0,unresolvedCount:0,regionalPullRequestNumber:3584,regionalCiRunNumber:8762,regionalMergeSha:'38b8af8e135db8b049ee9b9f382bf8fec8eb7ac9',nationalPullRequestNumber:3604,nationalCiRunNumber:8778,nationalMergeSha:'e1f6a240f5f1040c63e6c5f2cca7d88643070ef0',publicVerificationPullRequestNumber:3609,publicVerificationCiRunNumber:8817,publicVerificationMergeSha:'65c66a6e5a2264df4e805a820914c2e705595602',publicPageCount:2,oldPrimarySourceRemainingCount:0,blocker:null};
          w.notes=w.notes||[];
          const note='2026-07-25 17:16: 担当226自治体の学校給食費を横断監査。状態・金額訂正0、五木村・出水市の主出典2件を現行根拠へ更新。地域PR #3584、全国PR #3604、公開PR #3609、未解決0。';
          if(!w.notes.includes(note))w.notes.push(note);
          fs.writeFileSync(p,JSON.stringify(w,null,2)+'\n');
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-checkpoint-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${public_paths[@]}" \
                  jichitai-compare/operations/control/session-checkpoints/west-a-school-meals-crosscheck-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/west-a.json \
                  jichitai-compare/operations/control/west-a-school-meals-checkpoint-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-checkpoint.yml
          git diff --cached --check
          git commit -m 'checkpoint: 西日本A学校給食費横断監査を確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
