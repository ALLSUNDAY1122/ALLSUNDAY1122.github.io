name: Temporary West A Bulky Waste Source Maintenance

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-bulky-source-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/west-a-bulky-source-maintenance-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply confirmed source maintenance
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T21:31:00+09:00';
          const keys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const updates = {
            '39424': {
              source: 'https://www.town.otsuki.kochi.jp/life/dtl.php?hdnKey=1119',
              additional: ['https://www.town.otsuki.kochi.jp/life/dtl.php?hdnKey=1875'],
              reason: '防災ページを誤って主出典にしていたため、粗大ごみの分け方・出し方と2026年度収集日程へ置換'
            },
            '40421': {
              source: 'https://www.town.keisen.fukuoka.jp/kurashi/benri/gomicalender.php',
              additional: ['https://www.town.keisen.fukuoka.jp/kurashi/benri/gomidashi.php'],
              reason: '地区別収集日と8月・1月の休止を直接示すごみカレンダーを主出典化'
            },
            '43208': {
              source: 'https://www.city.yamaga.kumamoto.jp/kiji003556/index.html',
              additional: ['https://www.city.yamaga.kumamoto.jp/kiji003523/index.html'],
              reason: '粗大ごみ専用ページを維持し、2026年度地域別収集日程を追加出典化'
            }
          };

          const records = [];
          for (const [code, update] of Object.entries(updates)) {
            const pref = code.slice(0, 2);
            const dataPath = path.join(root, 'data/municipalities', pref, `${code}.json`);
            const taskPath = path.join(root, 'operations/tasks', `${code}.json`);
            const municipality = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            const service = municipality.services.bulkyWaste;
            const before = JSON.parse(JSON.stringify(service));
            service.source = {url: update.source, checkedAt};
            service.additionalSources = update.additional.map(url => ({url, checkedAt}));
            municipality.updatedAt = checkedAt;
            fs.writeFileSync(dataPath, JSON.stringify(municipality) + '\n');

            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            const statuses = Object.values(municipality.services).map(v => v.status);
            task.status = 'merged';
            task.currentService = null;
            task.nextServiceIndex = 9;
            task.completedServices = keys;
            task.verifiedCount = statuses.filter(v => v === 'verified').length;
            task.researchingCount = statuses.filter(v => v === 'researching').length;
            task.unavailableCount = statuses.filter(v => v === 'unavailable').length;
            task.needsMediumReviewCount = statuses.filter(v => v === 'needs_medium_review').length;
            task.currentBranch = 'region/west';
            task.pullRequestNumber = Number(process.env.PR_NUMBER);
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '統括B②';
            task.officialSources = [...new Set(keys.map(key => municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes = [...(task.notes || []), `2026-07-25: 粗大ごみ主出典を公式利用者向け情報で再確認。${update.reason}。status・料金・処理方法は変更なし。`];
            task.blockers = task.blockers || [];
            fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');

            records.push({code, name: municipality.name, status: service.status, beforeSource: before.source?.url ?? null, afterSource: service.source.url, additionalSources: service.additionalSources.map(v => v.url), reason: update.reason, contentChanged: false, statusChanged: false});
          }

          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-bulky-waste-official-source-review-20260725',
            generatedAt: updatedAt,
            sourcePullRequests: [3634, 3674],
            correctionPullRequest: Number(process.env.PR_NUMBER),
            workflowRunId: Number(process.env.RUN_ID),
            scope: {municipalityCount: 226, priorityCandidateCount: 65, manuallyConfirmedSourceChanges: 3, statusChanges: 0},
            corrections: records,
            retainedNoChange: [
              {code: '40646', name: '上毛町', reason: '現行の分別ガイドブックページが2026年6月更新で直接対応'},
              {code: '46505', name: '屋久島町', reason: '現行のごみの出し方ページが粗大ごみ条件に直接対応'},
              {code: '43424', name: '小国町', reason: '現行の直接持ち込みページが粗大ごみ、受付日時、2025年10月以降の料金に直接対応'}
            ],
            continuationIssue: 3675,
            continuationMunicipalities: ['33203','43511','46502','33586'],
            result: {contentErrorCount: 0, sourceMisassignmentCount: 1, sourceEnrichmentCount: 2, statusChangeCount: 0, unresolvedConfirmedErrorCount: 0, releaseBlocker: 'none'}
          };
          const auditPath = path.join(root, 'operations/audits/west-a-bulky-waste-official-source-review-20260725.json');
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          const trigger = path.join(root, 'operations/control/west-a-bulky-source-trigger-20260725.json');
          if (fs.existsSync(trigger)) fs.rmSync(trigger);
          NODE

          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..

          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/39/39424.json|jichitai-compare/data/municipalities/40/40421.json|jichitai-compare/data/municipalities/43/43208.json|jichitai-compare/operations/tasks/39424.json|jichitai-compare/operations/tasks/40421.json|jichitai-compare/operations/tasks/43208.json|jichitai-compare/operations/audits/west-a-bulky-waste-official-source-review-20260725.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/39424/index.html|jichitai-compare/municipality/40421/index.html|jichitai-compare/municipality/43208/index.html|jichitai-compare/operations/control/west-a-bulky-source-trigger-20260725.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 西日本A粗大ごみ3件の主出典を保守'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
