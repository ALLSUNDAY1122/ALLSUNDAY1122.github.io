name: Apply Central A Scope Audit Batch 1

on:
  push:
    branches: ['audit/central-a-scope-verification-20260724']
    paths: ['.github/workflows/central-a-scope-audit-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-20260724
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Toyama audit corrections
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const root = 'jichitai-compare';
          const staleCodes = ['16202', '16204', '16205', '16206'];
          for (const code of staleCodes) {
            const path = `${root}/data/municipalities/16/${code}.json`;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.status = 'verified';
            data.summary = `${data.name}の子育て、教育、住宅、生活、防災に関する9制度を公式情報で確認済み。`;
            data.updatedAt = '2026-07-24';
            fs.writeFileSync(path, JSON.stringify(data) + '\n');
          }

          const nantoPath = `${root}/data/municipalities/16/16210.json`;
          const nanto = JSON.parse(fs.readFileSync(nantoPath, 'utf8'));
          const previousSource = nanto.services.temporaryChildcare.source;
          nanto.services.temporaryChildcare = {
            status: 'verified',
            summary: '満1歳以上の未就学児向け一時預かりに加え、未就園の生後6か月から満3歳未満を月10時間まで受け入れるこども誰でも通園制度を実施。',
            eligibility: { minAgeMonths: 6, maxAgeYears: 6 },
            details: {
              temporaryCare: '満1歳以上の未就学児を対象に一時預かり保育を実施。利用条件・料金は施設案内を確認',
              anyChildTarget: '保育園、認定こども園等に入園していない生後6か月から満3歳未満の子ども',
              employment: '保護者の就労等の要件なし',
              anyChildLimit: '子ども1人につき月10時間まで',
              anyChildHours: '月曜日から金曜日の9時から16時まで',
              anyChildFee: '1時間300円。とみいくデジタルポイントを利用可能',
              anyChildFacility: '認定こども園井波にじいろ保育園',
              meal: 'こども誰でも通園制度では給食・おやつの提供なし'
            },
            source: {
              url: 'https://www.city.nanto.toyama.jp/soshiki/kodomo/1/2/7002.html',
              checkedAt: '2026-07-24'
            },
            additionalSources: [
              {
                url: previousSource.url,
                checkedAt: '2026-07-24',
                description: '一時預かり保育'
              }
            ]
          };
          nanto.updatedAt = '2026-07-24';
          fs.writeFileSync(nantoPath, JSON.stringify(nanto) + '\n');

          const taskPath = `${root}/operations/tasks/16210.json`;
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          const url = 'https://www.city.nanto.toyama.jp/soshiki/kodomo/1/2/7002.html';
          task.officialSources = Array.isArray(task.officialSources) ? task.officialSources : [];
          if (!task.officialSources.includes(url)) task.officialSources.push(url);
          task.notes = Array.isArray(task.notes) ? task.notes : [];
          task.notes.push('2026-07-24の担当範囲再監査で、こども誰でも通園制度の記録漏れを修正。');
          task.lastCheckedAt = '2026-07-24';
          task.lastUpdatedAt = '2026-07-24T23:55:00+09:00';
          task.lastUpdatedBy = '中日本調査班A（担当範囲再監査）';
          fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');

          const auditPath = `${root}/operations/control/central-a-scope-verification-20260724.json`;
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.batches[0].status = 'corrected';
          audit.batches[0].correctedMunicipalityCodes = ['16202', '16204', '16205', '16206', '16210'];
          audit.batches[0].completedAt = '2026-07-24T23:55:00+09:00';
          audit.summary.completedBatches = 1;
          audit.summary.correctedErrors = 5;
          audit.nextAction = '第2回として石川県19自治体を監査する';
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          NODE

          rm .github/workflows/central-a-scope-audit-fix.yml
      - name: Commit audit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 富山県の状態不整合と制度情報漏れを修正'
          git push origin HEAD:audit/central-a-scope-verification-20260724
