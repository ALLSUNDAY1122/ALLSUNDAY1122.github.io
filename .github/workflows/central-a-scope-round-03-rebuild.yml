name: Rebuild Central A Scope Audit Round 03

on:
  push:
    branches: ['audit/central-a-scope-verification-round-03-r2-20260725']
    paths: ['.github/workflows/central-a-scope-round-03-rebuild.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-03-r2-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Fukui audit files to latest central
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/central-a-scope-verification-round-03-20260725
          git checkout origin/audit/central-a-scope-verification-round-03-20260725 -- \
            jichitai-compare/data/municipalities/18/18404.json \
            jichitai-compare/data/municipalities/18/18423.json \
            jichitai-compare/data/municipalities/18/18481.json \
            jichitai-compare/data/municipalities/18/18483.json \
            jichitai-compare/data/municipalities/18/18501.json \
            jichitai-compare/operations/control/central-a-scope-round-03-fukui-20260725.json \
            jichitai-compare/operations/control/central-a-scope-verification-20260724.json \
            jichitai-compare/operations/tasks/18404.json \
            jichitai-compare/operations/tasks/18423.json \
            jichitai-compare/operations/tasks/18481.json \
            jichitai-compare/operations/tasks/18483.json \
            jichitai-compare/operations/tasks/18501.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'jichitai-compare/operations/control/central-a-scope-verification-20260724.json';
          const audit = JSON.parse(fs.readFileSync(p,'utf8'));
          audit.branch = 'audit/central-a-scope-verification-round-03-r2-20260725';
          audit.rebuiltRound3At = '2026-07-25T00:37:00+09:00';
          fs.writeFileSync(p, JSON.stringify(audit,null,2)+'\n');
          NODE
          rm .github/workflows/central-a-scope-round-03-rebuild.yml
      - name: Commit rebuilt Fukui audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 最新centralへ福井県監査修正を再適用'
          git push origin HEAD:audit/central-a-scope-verification-round-03-r2-20260725
