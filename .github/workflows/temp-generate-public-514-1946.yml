name: Temporary generate public 514 1946

on:
  pull_request:
    branches: [main]
    paths:
      - .github/triggers/generate-public-514-1946.txt

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public data
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B coord/generated-514-20260722-1946 origin/main
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          progress=json.loads(Path('operations/progress.json').read_text(encoding='utf-8'))
          count=progress['registeredMunicipalities']
          assert count == 514, count
          assert progress['totalServices'] == 4626, progress['totalServices']
          assert progress['completedServices'] == 4626, progress['completedServices']
          assert progress['prOpenMunicipalities'] == 0, progress['prOpenMunicipalities']
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          text=re.sub(r'\d+自治体・9制度',f'{count}自治体・9制度',text)
          text=re.sub(r'登録状況：\d+自治体の生成データを公開中',f'登録状況：{count}自治体の生成データを公開中',text)
          path.write_text(text,encoding='utf-8')
          PY
          npm run validate:generated
          cd ..
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            jichitai-compare/data/generated/municipalities.json
            jichitai-compare/index.html
            jichitai-compare/operations/progress.json
          )
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}" | sort)" = "$(printf '%s\n' "${expected[@]}" | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${expected[@]}"
          git commit -m '公開更新: 生成データと表示件数を514自治体へ同期'
          git push --force origin HEAD:coord/generated-514-20260722-1946
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-generate-public-514-1946.yml ]; then
            git rm .github/workflows/temp-generate-public-514-1946.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 公開514生成一時ワークフローを削除'
            git push origin HEAD:main
          fi
