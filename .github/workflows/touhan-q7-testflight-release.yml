name: Touhan Q7 Signed IPA Upload and Internal TestFlight Readback
on:
  push:
    paths:
      - '.github/workflows/touhan-q7-testflight-release.yml'
      - 'touroku-hanbaisha-ios/OFFLINE_Q4_20261125.json'
      - 'touroku-hanbaisha-ios/IOS_SIMULATOR_Q6_20261125.json'
permissions:
  contents: write
concurrency:
  group: touhan-q7-testflight-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release-candidate:
    if: github.ref_name == 'main' || github.ref_name == 'feature/touhan-fp2-ui-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require fresh PASS evidence for the exact tested source before release
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          b=Path('touroku-hanbaisha-ios')
          q4=json.loads((b/'OFFLINE_Q4_20261125.json').read_text())
          q6=json.loads((b/'IOS_SIMULATOR_Q6_20261125.json').read_text())
          assert q4.get('status')=='PASS' and q4.get('count')==1198
          assert q4.get('bankCount')==599 and q4.get('explanationsCount')==599
          assert q4.get('externalRequests')==[] and q4.get('pageErrors')==[] and q4.get('consoleErrors')==[]
          assert q4.get('browserEngines')=={'chromium':599,'webkit':599}
          assert q6.get('status')=='PASS' and q6.get('bankCount')==599 and q6.get('explanationsCount')==599
          assert q6.get('installAndLaunch')=='success' and q6.get('learningPersistence')=='PASS' and q6.get('offlineBundleVerified') is True
          assert q4.get('testedHead')==q6.get('headSHA') and q4.get('githubRunId')==q6.get('githubRunId')
          tested=q6['headSHA']
          changed=subprocess.check_output(['git','diff','--name-only',tested+'..HEAD'],text=True).splitlines()
          allowed={'.github/workflows/touhan-ios-simulator-q6.yml','.github/workflows/touhan-q7-testflight-release.yml','touroku-hanbaisha-ios/scripts/ai_preflight_acceptance.py','touroku-hanbaisha-ios/scripts/audit_privacy_q5.py','touroku-hanbaisha-ios/ASC_METADATA_Q3_READBACK_20261125.json','touroku-hanbaisha-ios/ASC_Q5_PRIVACY_METADATA_READBACK_20261124.json','touroku-hanbaisha-ios/PRIVACY_Q5_AUDIT_20261124.json','touroku-hanbaisha-ios/Q5_CURRENT_20261125.json','touroku-hanbaisha-ios/OFFLINE_Q4_20261125.json','touroku-hanbaisha-ios/IOS_SIMULATOR_Q6_20261125.json','touroku-hanbaisha-ios/OFFLINE_Q4_BROWSER_20261125.json','touroku-hanbaisha-ios/Q7_CODEMAGIC_SIGNING_BUILD_20261125.json','touroku-hanbaisha-ios/Q7_TESTFLIGHT_READBACK_20261125.json','touroku-hanbaisha-ios/RELEASE_STATUS.md'}
          assert set(changed)<=allowed, {'testedHead':tested,'currentHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'changedSinceTest':changed}
          print(json.dumps({'status':'PASS','testedHead':tested,'changedSinceTest':changed,'q4RunId':q4['githubRunId'],'q6RunId':q6['githubRunId']},ensure_ascii=False))
          PY
      - name: Start Codemagic signed IPA and ASC upload workflow on this PR branch
        id: start
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          cat >/tmp/touhan-q7-testflight.json <<'JSON'
          {"request_id":"touhan-q7-testflight-${{ github.run_id }}","action":"build","app_id":"6a769d81a1add9d06020b524","repository":"ALLSUNDAY1122/ALLSUNDAY1122.github.io","workflow_id":"touhan-ios","branch":"${{ github.ref_name }}","wait":false}
          JSON
          python scripts/codemagic_build_gateway.py --command /tmp/touhan-q7-testflight.json --output touroku-hanbaisha-ios/Q7_CODEMAGIC_SIGNING_BUILD_20261125.json
      - name: Wait for exact Codemagic build, verify signed IPA, ASC processing and internal TestFlight group
        id: verify
        if: steps.start.outcome == 'success'
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python touroku-hanbaisha-ios/scripts/touhan_q7_testflight_readback.py
      - name: Preserve honest Q7 result and release status on PR branch only
        if: always()
        env:
          START_RESULT: ${{ steps.start.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('touroku-hanbaisha-ios')
          start=b/'Q7_CODEMAGIC_SIGNING_BUILD_20261125.json'
          if not start.exists():
              start.write_text(json.dumps({'ok':False,'error':'Codemagic start step did not produce a result',
                'githubActionsRunId':int(os.environ['RUN_ID']),'githubActionStepResult':os.environ['START_RESULT']},ensure_ascii=False,indent=2)+'\n')
          p=b/'Q7_TESTFLIGHT_READBACK_20261125.json'
          if os.environ['START_RESULT']!='success' or os.environ['VERIFY_RESULT']!='success':
              d={'schema':'touhan-q7-testflight-readback-v1','status':'BLOCKED',
                'error':'Fresh Q7 build/upload/readback did not complete in this workflow run; prior results are not reused.',
                'signedIpaVerified':False,'ascProcessingState':'NOT_VERIFIED',
                'testFlightAvailable':False,'testFlightDistributed':False,'appReviewSubmitted':False}
          elif not p.exists():
              d={'schema':'touhan-q7-testflight-readback-v1','status':'BLOCKED',
                'error':'Q7 verifier did not produce a readback result','signedIpaVerified':False,
                'ascProcessingState':'NOT_VERIFIED','testFlightAvailable':False,'testFlightDistributed':False,
                'appReviewSubmitted':False}
          else:
              d=json.loads(p.read_text())
          d['githubActionsRunId']=int(os.environ['RUN_ID'])
          d['startStepResult']=os.environ['START_RESULT']
          d['verifyStepResult']=os.environ['VERIFY_RESULT']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          md=b/'RELEASE_STATUS.md'
          md.write_text(md.read_text()+f"\n\n## Q7 署名付きIPA・TestFlight配信（2026-11-25）\n- Codemagic開始: {os.environ['START_RESULT']}、検証: {os.environ['VERIFY_RESULT']}、総合: **{d.get('status')}**。\n- ASC処理: {d.get('ascProcessingState')}、TestFlight利用可能: {d.get('testFlightAvailable')}、内部グループ配信: {d.get('testFlightDistributed')}。\n- App Review提出: **未実施**。証跡: Q7_TESTFLIGHT_READBACK_20261125.json。\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-ios/Q7_CODEMAGIC_SIGNING_BUILD_20261125.json touroku-hanbaisha-ios/Q7_TESTFLIGHT_READBACK_20261125.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          git commit -m 'audit(touhan): record signed IPA upload and TestFlight availability' || true
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-q7-testflight-release-readback
          path: |
            touroku-hanbaisha-ios/Q7_CODEMAGIC_SIGNING_BUILD_20261125.json
            touroku-hanbaisha-ios/Q7_TESTFLIGHT_READBACK_20261125.json
          if-no-files-found: ignore
