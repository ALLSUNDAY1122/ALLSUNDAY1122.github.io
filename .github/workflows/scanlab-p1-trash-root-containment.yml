name: Scan Lab P1 trash lifecycle containment one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-trash-root-containment.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Contain trash lifecycle to real project directories
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/ScanProjectStore.swift')
          s = p.read_text()
          old_move = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        let destination = trashURL.appendingPathComponent(projectURL.lastPathComponent)\n'''
          new_move = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        let normalizedProject = projectURL.standardizedFileURL\n        guard isSafeProjectDirectory(normalizedProject),\n              normalizedProject.deletingLastPathComponent() == rootURL.standardizedFileURL,\n              normalizedProject.pathExtension == Self.projectExtension else {\n            throw ScanProjectStoreError.invalidManifest\n        }\n        let destination = trashURL.appendingPathComponent(normalizedProject.lastPathComponent)\n'''
          if s.count(old_move) != 1: raise SystemExit('moveToTrash anchor mismatch')
          s = s.replace(old_move, new_move, 1)

          old_restore = '''        let source = try validatedProjectURL(id: id, in: trashURL)\n        guard fileManager.fileExists(atPath: source.path) else { throw ScanProjectStoreError.projectNotFound }\n        var restoredID = id\n'''
          new_restore = '''        let source = try validatedProjectURL(id: id, in: trashURL)\n        guard fileManager.fileExists(atPath: source.path) else { throw ScanProjectStoreError.projectNotFound }\n        guard isSafeProjectDirectory(source) else { throw ScanProjectStoreError.invalidManifest }\n        var restoredID = id\n'''
          if s.count(old_restore) != 1: raise SystemExit('restore safety anchor mismatch')
          s = s.replace(old_restore, new_restore, 1)

          old_delete = '''        let url = try validatedProjectURL(id: id, in: trashURL)\n        guard fileManager.fileExists(atPath: url.path) else { throw ScanProjectStoreError.projectNotFound }\n        try fileManager.removeItem(at: url)\n'''
          new_delete = '''        let url = try validatedProjectURL(id: id, in: trashURL)\n        guard fileManager.fileExists(atPath: url.path) else { throw ScanProjectStoreError.projectNotFound }\n        guard isSafeProjectDirectory(url) else { throw ScanProjectStoreError.invalidManifest }\n        try fileManager.removeItem(at: url)\n'''
          if s.count(old_delete) != 1: raise SystemExit('delete safety anchor mismatch')
          p.write_text(s.replace(old_delete, new_delete, 1))
          PY
          grep -q 'normalizedProject.deletingLastPathComponent() == rootURL.standardizedFileURL' splat-native-ios/SplatNative/ScanProjectStore.swift
      - name: Commit repair and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-trash-root-containment.yml
          git add splat-native-ios/SplatNative/ScanProjectStore.swift
          git commit -m 'fix(splat): contain trash lifecycle to project roots'
          git push origin HEAD:feature/splat-post-build17-p1
