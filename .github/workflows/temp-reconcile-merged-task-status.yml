name: Temporary Reconcile Merged Task Status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-reconcile-merged-task-status.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconcile task statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import glob, json, os, subprocess
          from pathlib import Path

          changed=[]
          unresolved=[]
          for filename in glob.glob('jichitai-compare/operations/tasks/*.json'):
              path=Path(filename)
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('status') != 'pr_open':
                  continue
              pr=data.get('pullRequestNumber')
              if not isinstance(pr, int):
                  unresolved.append((path.name, 'PR番号なし'))
                  continue
              try:
                  raw=subprocess.check_output([
                      'gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{pr}',
                      '--jq','[.state,.merged_at] | @tsv'
                  ], text=True).strip()
                  state, merged_at=(raw.split('\t',1)+[''])[:2]
              except Exception as exc:
                  unresolved.append((path.name, f'API確認失敗: {exc}'))
                  continue
              if merged_at and merged_at != 'null':
                  data['status']='merged'
                  data['lastUpdatedAt']='2026-07-22T04:41:00+09:00'
                  data['lastUpdatedBy']='全国進行統括'
                  notes=data.setdefault('notes',[])
                  line=f'PR #{pr}のmerged_atをGitHub APIで再確認し、task.statusをmergedへ補正。'
                  if line not in notes:
                      notes.append(line)
                  path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
                  changed.append((path.name,pr))
              else:
                  unresolved.append((path.name, f'PR #{pr} state={state} merged_at={merged_at}'))

          print('changed=',changed)
          print('unresolved=',unresolved)
          Path('/tmp/task-status-changed').write_text(str(len(changed)),encoding='utf-8')
          PY

          if [ "$(cat /tmp/task-status-changed)" != "0" ]; then
            cd jichitai-compare
            npm ci
            npm run progress
            cd ..
          fi

          rm .github/workflows/temp-reconcile-merged-task-status.yml
          git add jichitai-compare/operations/tasks jichitai-compare/operations/progress.json .github/workflows/temp-reconcile-merged-task-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '統括管理: マージ済みtask状態と全国進捗を補正'
          git push origin main
