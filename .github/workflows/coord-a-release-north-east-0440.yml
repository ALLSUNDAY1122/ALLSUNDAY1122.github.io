name: Coord A Release North East 0440

on:
  pull_request:
    paths:
      - '.github/workflows/coord-a-release-north-east-0440.yml'
      - 'jichitai-compare/scripts/coord-a-release-north-east-0440.mjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch regional branches
        run: git fetch origin region/north region/east main
      - name: Extract publishable north/east municipalities
        working-directory: jichitai-compare
        env:
          RELEASE_AT: '2026-07-24T04:40:00+09:00'
        run: node ./scripts/coord-a-release-north-east-0440.mjs
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Update homepage count
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const progress = JSON.parse(readFileSync('operations/progress.json', 'utf8'));
          const path = 'index.html';
          const html = readFileSync(path, 'utf8').replace(/\d+自治体・9制度/u, `${progress.registeredMunicipalities}自治体・9制度`);
          writeFileSync(path, html);
          NODE
      - name: Remove temporary automation and commit release
        run: |
          git rm .github/workflows/coord-a-release-north-east-0440.yml
          git rm jichitai-compare/scripts/coord-a-release-north-east-0440.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m '全国統合: 北日本・東日本の完成自治体を最新mainへ公開'
          git push origin HEAD:${{ github.head_ref }}
