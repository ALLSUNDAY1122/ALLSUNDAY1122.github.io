name: Temporary Central Release 10

on:
  push:
    branches:
      - coord/central-release-10-20260722-0211
    paths:
      - .github/workflows/temp-central-release-10-0211.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: coord/central-release-10-20260722-0211
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy fixed municipality snapshot
        run: |
          set -euxo pipefail
          SOURCE_COMMIT=5839e08dcee42cde71a04c4432a4bebb65f49b7b
          git fetch origin region/central
          git cat-file -e "${SOURCE_COMMIT}^{commit}"

          paths=(
            jichitai-compare/data/municipalities/21/21220.json
            jichitai-compare/operations/tasks/21220.json
            jichitai-compare/data/municipalities/21/21221.json
            jichitai-compare/operations/tasks/21221.json
            jichitai-compare/data/municipalities/21/21302.json
            jichitai-compare/operations/tasks/21302.json
            jichitai-compare/data/municipalities/21/21303.json
            jichitai-compare/operations/tasks/21303.json
            jichitai-compare/data/municipalities/21/21341.json
            jichitai-compare/operations/tasks/21341.json
            jichitai-compare/data/municipalities/21/21361.json
            jichitai-compare/operations/tasks/21361.json
            jichitai-compare/data/municipalities/21/21362.json
            jichitai-compare/operations/tasks/21362.json
            jichitai-compare/data/municipalities/21/21364.json
            jichitai-compare/operations/tasks/21364.json
            jichitai-compare/data/municipalities/21/21382.json
            jichitai-compare/operations/tasks/21382.json
            jichitai-compare/data/municipalities/21/21383.json
            jichitai-compare/operations/tasks/21383.json
          )

          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${SOURCE_COMMIT}:${path}" > "$path"
          done

          rm .github/workflows/temp-central-release-10-0211.yml
          git add "${paths[@]}" .github/workflows/temp-central-release-10-0211.yml

          python3 - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/temp-central-release-10-0211.yml',
            'jichitai-compare/data/municipalities/21/21220.json',
            'jichitai-compare/operations/tasks/21220.json',
            'jichitai-compare/data/municipalities/21/21221.json',
            'jichitai-compare/operations/tasks/21221.json',
            'jichitai-compare/data/municipalities/21/21302.json',
            'jichitai-compare/operations/tasks/21302.json',
            'jichitai-compare/data/municipalities/21/21303.json',
            'jichitai-compare/operations/tasks/21303.json',
            'jichitai-compare/data/municipalities/21/21341.json',
            'jichitai-compare/operations/tasks/21341.json',
            'jichitai-compare/data/municipalities/21/21361.json',
            'jichitai-compare/operations/tasks/21361.json',
            'jichitai-compare/data/municipalities/21/21362.json',
            'jichitai-compare/operations/tasks/21362.json',
            'jichitai-compare/data/municipalities/21/21364.json',
            'jichitai-compare/operations/tasks/21364.json',
            'jichitai-compare/data/municipalities/21/21382.json',
            'jichitai-compare/operations/tasks/21382.json',
            'jichitai-compare/data/municipalities/21/21383.json',
            'jichitai-compare/operations/tasks/21383.json',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged files: {sorted(actual ^ expected)}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "全国統合: 中日本10自治体の固定スナップショット"
          git push origin coord/central-release-10-20260722-0211
