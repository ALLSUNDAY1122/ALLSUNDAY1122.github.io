name: Registered Seller Official Mobile Browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/test_mobile_ui.py'
      - 'touroku-hanbaisha-sprint/official-practice.html'
      - 'touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json'
      - '.github/workflows/touhan-mobile-ui-qa.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run 375 and 430 px browser QA
        run: |
          python -m http.server 8765 --directory touroku-hanbaisha-sprint >/tmp/touhan-web.log 2>&1 &
          sleep 2
          python touroku-hanbaisha-sprint/official-kansai/test_mobile_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-official-mobile-screenshots
          path: /tmp/touhan_mobile_*.png
          if-no-files-found: ignore
      - name: Write readbackable mobile QA evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          report={'status':'PASS','checked_at_utc':datetime.now(timezone.utc).isoformat(),
                  'approved_bank_count':bank['count'],'mobile_widths_px':[375,430],
                  'checks':['all approved records rendered','4-choice preserved','source URL visible','score complete','no horizontal overflow',
                            '2023 Q90 synthetic response excluded from score denominator'],
                  'note':'Q90 was test fixture only, not promoted; Chromium not iOS Safari or physical-device certification'}
          (b/'MOBILE_QA_RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-sprint/official-kansai/MOBILE_QA_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(touhan): record real mobile browser QA pass'
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
