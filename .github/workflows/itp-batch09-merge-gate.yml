# Registered trigger v6: validate and merge only after all batch09 checks pass.
# Topic reuse across rounds is allowed; novelty is enforced on IDs/questions, while batch-internal topic duplication remains blocked.
# Explanation grounding accepts compound correct answers when every component is explicitly explained.
name: IT Passport batch 09 merge gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/itp-batch09-merge-gate.yml']

permissions:
  contents: write

jobs:
  validate-and-merge:
    if: github.actor == 'ALLSUNDAY1122'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Validate staged batch09 and cross-batch novelty
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,re,unicodedata
          from pathlib import Path
          root=Path('apps/it-passport-rebuild'); qp=root/'questions'; old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-09.json').read_text()); manifest=json.loads((qp/'manifest.json').read_text()); config=json.loads((root/'quality/exam-config.json').read_text())
          norm=lambda s: re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s)).lower())
          assert len(old)==160, f'canonical length={len(old)} expected=160'; assert manifest['canonical']['original_mock']['current']==160, f'manifest current={manifest["canonical"]["original_mock"]["current"]} expected=160'; assert len(batch)==20, f'batch length={len(batch)} expected=20'
          ids={q['id'] for q in old}; texts={norm(q['question']) for q in old}; subjects=collections.Counter(); answers=collections.Counter(); req=set(config['required_fields']); seen_ids=set(); seen_texts=set(); seen_topics=set()
          for q in batch:
            missing=req-set(q); assert not missing, f'{q.get("id")}: missing fields={sorted(missing)}'; assert q['id'] not in ids, f'duplicate canonical id={q["id"]}'; assert q['id'] not in seen_ids, f'duplicate batch id={q["id"]}'
            qt=norm(q['question']); tp=norm(q['topic']); assert qt not in texts, f'duplicate canonical question={q["id"]}'; assert qt not in seen_texts, f'duplicate batch question={q["id"]}'; assert tp not in seen_topics, f'duplicate batch topic={q["id"]}:{q["topic"]}'
            assert q['subject'] in config['subjects'], f'{q["id"]}: bad subject={q["subject"]}'; assert q['round']==2, f'{q["id"]}: round={q["round"]}'; assert len(q['choices'])==4 and len({norm(x) for x in q['choices']})==4, f'{q["id"]}: invalid choices'
            assert isinstance(q['correct_index'],int) and 0<=q['correct_index']<4, f'{q["id"]}: bad correct_index'; assert q['syllabus_version']==manifest['current_syllabus_version']=='6.5', f'{q["id"]}: syllabus mismatch'
            assert q['origin_type']=='original' and q['rights_basis']=='original_question_based_on_public_syllabus', f'{q["id"]}: provenance mismatch'; assert q['source_url']=='https://www.ipa.go.jp/shiken/syllabus/gaiyou.html' and q['reference_date']=='2026-09-15', f'{q["id"]}: source/date mismatch'
            assert len(q['question'])>=20 and len(q['explanation'])>=35, f'{q["id"]}: text too short'
            correct=str(q['choices'][q['correct_index']]); exp=norm(q['explanation']); parts=[norm(x) for x in re.split(r'[と・/／,、\s]+',correct) if norm(x)]
            grounded=norm(correct) in exp or tp in exp or (len(parts)>1 and all(x in exp for x in parts))
            assert grounded, f'{q["id"]}: explanation grounding weak for correct={correct!r}'
            subjects[q['subject']]+=1; answers[q['correct_index']]+=1; seen_ids.add(q['id']); seen_texts.add(qt); seen_topics.add(tp)
          assert subjects=={'ストラテジ系':7,'マネジメント系':4,'テクノロジ系':9}, f'subject distribution={subjects}'; assert answers=={0:5,1:5,2:5,3:5}, f'answer distribution={answers}'; print('PASS batch09 premerge',subjects,answers)
          PY
      - name: Merge and validate canonical 180
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          qp=Path('apps/it-passport-rebuild/questions'); old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-09.json').read_text()); manifest=json.loads((qp/'manifest.json').read_text()); merged=old+batch; assert len(merged)==180
          (qp/'original-mock.json').write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n'); manifest['baseline_date']='2026-09-15'; manifest['canonical']['original_mock']['current']=180; manifest['canonical']['original_mock']['status']='BUILDING'; manifest['canonical']['original_mock']['audit_status']='EXPECTED_FAIL_UNTIL_COMPLETE'; (qp/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 apps/it-passport-rebuild/quality/validate-question-dataset.py
          if python3 apps/it-passport-rebuild/quality/validate-question-dataset.py --release; then echo 'unexpected release PASS below 300' >&2; exit 1; else echo 'PASS: release remains fail-closed below 300'; fi
      - name: Commit canonical progress
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add apps/it-passport-rebuild/questions/original-mock.json apps/it-passport-rebuild/questions/manifest.json; git diff --cached --check; git commit -m 'content(itp): merge audited batch 09 to 180 questions'; git push origin HEAD:main
