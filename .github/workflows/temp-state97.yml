name: Temp State 97
on:
  push:
    branches: [coord/state-92-jul21]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('jichitai-compare/operations/control')
          qpath = base / 'release-queue.json'
          q = json.loads(qpath.read_text(encoding='utf-8'))
          q['updatedAt'] = '2026-07-21T01:34:00+09:00'
          by_region = {e['region']: e for e in q['entries']}
          north = by_region['north']
          if not any(x['code'] == '01225' for x in north['municipalities']):
              north['municipalities'].append({'code':'01225','name':'滝川市'})
          north['count'] = 24
          north['pendingSinceLastRelease'] = 4
          north['reason'] = '北日本の初回10自治体をPR #186、追加10自治体をPR #244でmainへ全国統合。生成・公開をPR #249で73自治体へ更新後、三笠市・根室市・千歳市・滝川市を地方統合'
          west = by_region['west']
          if not any(x['code'] == '32386' for x in west['municipalities']):
              west['municipalities'].append({'code':'32386','name':'飯南町'})
          west['count'] = 29
          west['pendingSinceLastRelease'] = 8
          west['reason'] = '西日本の初回11自治体をPR #177、追加10自治体をPR #226でmainへ全国統合。生成データをPR #228で63自治体へ更新後、浜田市・出雲市・益田市・大田市・江津市・雲南市・奥出雲町・飯南町を地方統合'
          q['summary']['regionalMergedMunicipalities'] = 97
          q['nextAction'] = '東日本と西日本が前回全国統合後8自治体で並ぶ。各あと2自治体の地方統合を監視し、先に到達した地域を固定releaseブランチ経由でmainへ全国統合する。'
          qpath.write_text(json.dumps(q, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          gpath = base / 'global-state.json'
          g = json.loads(gpath.read_text(encoding='utf-8'))
          g['updatedAt'] = '2026-07-21T01:34:00+09:00'
          g['regionalCompletedSinceLastRelease'] = {'north':4,'east':8,'central':5,'west':8,'total':25}
          g['priority'] = {'type':'release-monitoring','nextAction':'east_or_west_remaining_2'}
          g['regionalMergedMunicipalities'] = 97
          gpath.write_text(json.dumps(g, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          with (base / 'audit-log.jsonl').open('a', encoding='utf-8') as f:
              f.write('\n' + json.dumps({'timestamp':'2026-07-21T01:34:00+09:00','actor':'全国進行統括','action':'regional-progress-97','details':{'mergedMunicipalities':[{'region':'north','code':'01225','name':'滝川市','pullRequest':254},{'region':'west','code':'32386','name':'飯南町','pullRequest':255}],'regionalCounts':{'north':24,'east':18,'central':26,'west':29,'total':97},'pendingSinceRegionalRelease':{'north':4,'east':8,'central':5,'west':8,'total':25},'nextNationalReleaseCandidates':[{'region':'east','remainingMunicipalities':2},{'region':'west','remainingMunicipalities':2}],'latestGeneratedMunicipalityCount':73,'openMunicipalityPullRequests':0,'openExceptions':0},'humanDecisionRequired':False}, ensure_ascii=False, separators=(',', ':')))
          PY
          rm .github/workflows/temp-state97.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-state97.yml
          git commit -m "統括管理: 97自治体へ更新 [skip ci]"
          git push
