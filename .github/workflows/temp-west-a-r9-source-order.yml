name: Temporary West-A round 9 source order fix

on:
  push:
    branches:
      - 'audit/west-a-research-verification-r9-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[west-a-r9-source-order]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalculate task source ordering
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare';
          const definitions = JSON.parse(fs.readFileSync(`${root}/data/service-definitions.json`, 'utf8'));
          const ids = definitions.services.map(s => s.id);
          for (const code of ['40448', '46530']) {
            const pref = code.slice(0, 2);
            const municipality = JSON.parse(fs.readFileSync(`${root}/data/municipalities/${pref}/${code}.json`, 'utf8'));
            const taskPath = `${root}/operations/tasks/${code}.json`;
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            task.officialSources = [...new Set(ids
              .map(id => municipality.services[id])
              .filter(service => ['verified', 'unavailable'].includes(service?.status) && /^https:\/\//.test(service?.source?.url || ''))
              .map(service => service.source.url))];
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          }
          NODE
      - name: Commit source order fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/tasks/40448.json jichitai-compare/operations/tasks/46530.json
          git commit -m '[west-a-r9-source-order] audit: normalize task official source order'
          git push
