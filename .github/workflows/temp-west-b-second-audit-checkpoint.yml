name: Temporary West B Second Audit Checkpoint
on:
  push:
    branches: [fix/west-b-second-audit-ogimi-sick-child-20260725]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-second-audit-ogimi-sick-child-20260725
      - name: Update checkpoint
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.qualityImprovementSecondAudit = {
            auditId: 'west-b-quality-improvement-second-audit-20260725',
            auditedAt: '2026-07-25T10:48:00+09:00',
            pastCorrectionServiceRecheckCount: 17,
            stratifiedSampleMunicipalityCount: 28,
            detectedResearchContentErrorCount: 1,
            correctedResearchContentErrorCount: 1,
            detectedSourceMaintenanceIssueCount: 0,
            unresolvedConfirmedErrorCount: 0,
            correctionMunicipalityCode: '47302',
            correctionService: 'sickChildCare',
            correctionBranch: 'fix/west-b-second-audit-ogimi-sick-child-20260725',
            status: 'correction_branch_validated_pending_pr'
          };
          data.updatedAt = '2026-07-25T10:48:00+09:00';
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Commit checkpoint
        run: |
          rm -f .github/workflows/temp-west-b-second-audit-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/session-checkpoints/west-b.json .github/workflows/temp-west-b-second-audit-checkpoint.yml
          git commit -m "checkpoint: 西日本B品質改善第2監査を記録"
          git push origin HEAD:fix/west-b-second-audit-ogimi-sick-child-20260725
