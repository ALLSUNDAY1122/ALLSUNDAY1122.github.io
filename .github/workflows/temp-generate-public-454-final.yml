name: Temporary Generate Public 454 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-454-final.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-454-20260722-1613
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and validate public 454
        shell: bash
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          sed -i 's/434自治体/454自治体/g' index.html
          test "$(grep -o '454自治体' index.html | wc -l)" -eq 2
          node ./scripts/validate-data.mjs --require-generated
          cd ..
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/progress.json | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/index.html jichitai-compare/operations/progress.json
          git commit -m '公開更新: 生成データと表示件数を454自治体へ同期'
          git push origin coord/generated-454-20260722-1613
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-generate-public-454-final.yml ]; then
            git rm .github/workflows/temp-generate-public-454-final.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '統括管理: 公開454自治体生成一時ワークフローを削除'
            git push origin main
          fi
