name: Kangoshi Prepare Codemagic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kangoshi-prepare-codemagic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Kangoshi Internal TestFlight workflow
        run: python3 kangoshi-sprint/ios/tools/patch_codemagic.py
      - name: Validate patched root config
        run: |
          grep -q '^  kangoshi-ios:' codemagic.yaml
          grep -q 'bundle_identifier: jp.allsunday1122.kangoshi' codemagic.yaml
          grep -q 'CODEMAGIC_PROFILE_REF: kangoshi_appstore' codemagic.yaml
          grep -q 'IAP_PRODUCT_ID: jp.allsunday1122.kangoshi.monthly' codemagic.yaml
          grep -q 'submit_to_testflight: false' codemagic.yaml
          grep -q 'submit_to_app_store: false' codemagic.yaml
      - name: Commit Codemagic preparation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: add Internal TestFlight Codemagic workflow [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = '1'
          fi
