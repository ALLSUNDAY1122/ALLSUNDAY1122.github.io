name: Temporary Sync Release Queue 0907
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-sync-release-queue-0907.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          f=Path('jichitai-compare/operations/control/release-queue.json'); q=json.loads(f.read_text()); by={e['region']:e for e in q['entries']}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(r,p): return subprocess.check_output(['git','show',f'{r}:{p}'],text=True)
          def valid(r,p):
              n=int(p); return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          for r in by:
              ref=f'origin/region/{r}'; items=[]
              for p in subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines():
                  if not re.search(r'/\d{5}\.json$',p): continue
                  d=json.loads(show(ref,p))
                  if valid(r,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code']); s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json')); n=int(s.get(fields[r],0)); by[r].update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':n,'releaseStatus':'release_ready' if n>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{n}自治体','mainIntegrationPr':s.get('lastNationalIntegrationPr'),'generatedPullRequest':534})
          total=sum(e['count'] for e in q['entries']); p={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}; q['updatedAt']='2026-07-22T09:07:00+09:00'; q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':304,'latestGeneratedPullRequest':534,'latestPublicCountPullRequest':534,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{p['north']}、東日本{p['east']}、中日本{p['central']}、西日本{p['west']}。"}; f.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n'); Path('/tmp/t').write_text(str(total))
          PY
          T=$(cat /tmp/t); git rm .github/workflows/temp-sync-release-queue-0907.yml; git add jichitai-compare/operations/control/release-queue.json; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m "統括管理: 地方統合${T}自治体・公開304自治体へ同期"; git push origin main
