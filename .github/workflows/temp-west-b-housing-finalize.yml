name: Temporary West B Housing Finalize

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-b-housing-finalize-trigger-20260725.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/west-b-housing-final-region-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          public='jichitai-compare/operations/audits/west-b-housing-public-verification-20260725.json'
          mkdir -p "$(dirname "$public")"
          git show "origin/main:$public" > "$public"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const regionPath = 'jichitai-compare/operations/control/regions/west.json';
          const correctionPath = 'jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json';
          const publicPath = 'jichitai-compare/operations/audits/west-b-housing-public-verification-20260725.json';
          const resolutionPath = 'jichitai-compare/operations/audits/west-b-housing-final-resolution-20260725.json';
          const completedAt = '2026-07-25T19:56:00+09:00';
          const publicAudit = JSON.parse(fs.readFileSync(publicPath, 'utf8'));
          if (!publicAudit.success || publicAudit.targetCount !== 24 || publicAudit.publicGeneratedJson?.municipalityCount !== 1741 || publicAudit.publicGeneratedJson?.serviceCount !== 15669) {
            throw new Error('Public verification evidence is not complete.');
          }

          const finalFields = {
            publicVerificationId: publicAudit.auditId,
            nationalSyncPullRequest: 3666,
            nationalSyncWorkflowRunId: 30155174139,
            nationalMergeCommit: 'df9ed477a2c96a3ba9cdbb2835cd9e0ed16ee7bb',
            publicVerificationPullRequest: 3668,
            publicVerificationWorkflowRunId: 30155274314,
            finalRegionSyncPullRequest: Number(process.env.PR_NUMBER),
            finalRegionSyncWorkflowRunId: Number(process.env.RUN_ID),
            publicVerification: 'passed',
            status: 'completed_public_verified_region_integrated',
            unresolvedConfirmedErrorCount: 0,
            releaseBlocker: 'none',
            completedAt
          };

          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = completedAt;
          checkpoint.lastAction = '西日本B住宅支援横断監査の訂正24件をregion/west・main・公開24ページへ反映し、全国1,741自治体・15,669制度を維持した。';
          checkpoint.nextAction = '住宅支援の残候補は新たな公式更新時のみ再監査し、他の高リスク制度の横断監査を継続する。';
          checkpoint.housingSupportCrosscheck = { ...checkpoint.housingSupportCrosscheck, ...finalFields };
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');

          const region = JSON.parse(fs.readFileSync(regionPath, 'utf8'));
          region.updatedAt = completedAt;
          region.lastAction = checkpoint.lastAction;
          region.nextAction = checkpoint.nextAction;
          region.latestWestBHousingCrosscheck = { ...region.latestWestBHousingCrosscheck, ...finalFields };
          region.lastNationalQualityPr = 3666;
          fs.writeFileSync(regionPath, JSON.stringify(region, null, 2) + '\n');

          const correction = JSON.parse(fs.readFileSync(correctionPath, 'utf8'));
          Object.assign(correction, {
            nationalSyncPullRequestNumber: 3666,
            nationalSyncWorkflowRunId: 30155174139,
            nationalMergeCommit: 'df9ed477a2c96a3ba9cdbb2835cd9e0ed16ee7bb',
            publicVerificationPullRequestNumber: 3668,
            publicVerificationWorkflowRunId: 30155274314,
            publicVerificationFile: publicPath,
            finalRegionSyncPullRequestNumber: Number(process.env.PR_NUMBER),
            finalRegionSyncWorkflowRunId: Number(process.env.RUN_ID),
            status: 'completed_public_verified_region_integrated',
            completedAt,
            releaseBlocker: 'none'
          });
          fs.writeFileSync(correctionPath, JSON.stringify(correction, null, 2) + '\n');

          const resolution = {
            schemaVersion: '1.0.0',
            resolutionId: 'west-b-housing-final-resolution-20260725',
            completedAt,
            scope: {
              auditedMunicipalityCount: 250,
              mechanicalCandidateCount: 118,
              strictCandidateCount: 100,
              officialSourceFetchedCount: 99,
              priorityCandidateCount: 25,
              confirmedCorrectionCount: 24,
              changedToUnavailableCount: 21,
              familySpecificReplacementCount: 3,
              retainedVerifiedCount: 1,
              publicPageCount: 24
            },
            evidence: {
              sourceReviewPullRequest: 3641,
              regionalCorrectionPullRequest: 3662,
              regionalCorrectionWorkflowRunId: 30154957954,
              regionalStatePullRequest: 3664,
              regionalStateWorkflowRunId: 30155086155,
              nationalSyncPullRequest: 3666,
              nationalSyncWorkflowRunId: 30155174139,
              publicVerificationPullRequest: 3668,
              publicVerificationWorkflowRunId: 30155274314,
              finalRegionSyncPullRequest: Number(process.env.PR_NUMBER),
              finalRegionSyncWorkflowRunId: Number(process.env.RUN_ID)
            },
            publicVerification: {
              attempt: publicAudit.attempt,
              allPagesPassed: publicAudit.pageChecks.every((item) => item.success),
              publicGeneratedJsonPassed: publicAudit.publicGeneratedJson.success,
              municipalityCount: publicAudit.publicGeneratedJson.municipalityCount,
              serviceCount: publicAudit.publicGeneratedJson.serviceCount
            },
            releaseBlocker: 'none',
            status: 'completed_public_verified_region_integrated'
          };
          fs.writeFileSync(resolutionPath, JSON.stringify(resolution, null, 2) + '\n');
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run check
          node --check app.js

      - name: Remove temporary regional workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            jichitai-compare/operations/control/west-b-housing-finalize-trigger-20260725.json \
            .github/workflows/temp-west-b-housing-corrections.yml \
            .github/workflows/temp-west-b-housing-state-sync.yml \
            .github/workflows/temp-west-b-housing-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 西日本B住宅支援監査を地域で最終確定'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
