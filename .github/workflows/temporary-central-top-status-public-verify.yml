name: Temporary Central Top Status Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-top-status-public-verify-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'audit/central-top-status-public-verify-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public generated data and pages
        shell: bash
        run: |
          cat > /tmp/verify_central_top_status_public.py <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = 'https://allsunday1122.github.io/jichitai-compare'
          targets = [
              {'code':'16202','name':'高岡市','newSummary':'公式情報で確認済み。'},
              {'code':'16204','name':'魚津市','newSummary':'公式情報で確認済み。'},
              {'code':'16205','name':'氷見市','newSummary':'公式情報で確認済み。'},
              {'code':'16206','name':'滑川市','newSummary':'公式情報で確認済み。'},
              {'code':'23100','name':'名古屋市','newSummary':'9制度を調査済み。'},
          ]
          forbidden = ['全国統括による確認待ち', 'needs_coordinator']

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent':'jichitai-quality-audit/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode('utf-8')

          attempts = []
          final = None
          for attempt in range(1, 19):
              timestamp = int(time.time())
              result = {'attempt':attempt,'checkedAt':datetime.now(timezone.utc).isoformat(),'generated':{},'pages':[]}
              try:
                  status, body = fetch(f'{base}/data/generated/municipalities.json?quality={timestamp}')
                  document = json.loads(body)
                  if isinstance(document, list):
                      municipalities = document
                  elif isinstance(document, dict) and isinstance(document.get('municipalities'), list):
                      municipalities = document['municipalities']
                  elif isinstance(document, dict) and isinstance(document.get('data'), dict) and isinstance(document['data'].get('municipalities'), list):
                      municipalities = document['data']['municipalities']
                  else:
                      municipalities = [value for value in document.values() if isinstance(value, dict)] if isinstance(document, dict) else []
                  by_code = {str(item.get('code') or item.get('municipalityCode')): item for item in municipalities}
                  generated_checks = []
                  for target in targets:
                      item = by_code.get(target['code'])
                      generated_checks.append({
                          'code': target['code'],
                          'found': item is not None,
                          'status': item.get('status') if item else None,
                          'summary': item.get('summary') if item else None,
                          'passed': bool(item and item.get('status') == 'verified' and target['newSummary'] in (item.get('summary') or '') and not any(p in json.dumps(item, ensure_ascii=False) for p in forbidden)),
                      })
                  result['generated'] = {'httpStatus':status,'checks':generated_checks,'passed':status == 200 and all(check['passed'] for check in generated_checks)}
              except Exception as error:
                  result['generated'] = {'passed':False,'error':repr(error)}

              for target in targets:
                  url = f"{base}/municipality/{target['code']}/?quality={timestamp}"
                  canonical = f"{base}/municipality/{target['code']}/"
                  page = {'code':target['code'],'name':target['name'],'url':url}
                  try:
                      status, html = fetch(url)
                      checks = {
                          'http200': status == 200,
                          'municipalityName': target['name'] in html,
                          'canonical': canonical in html,
                          'forbiddenAbsent': not any(phrase in html for phrase in forbidden),
                      }
                      page.update({'httpStatus':status,'checks':checks,'passed':all(checks.values())})
                  except Exception as error:
                      page.update({'passed':False,'error':repr(error)})
                  result['pages'].append(page)

              result['passed'] = bool(result['generated'].get('passed') and all(page['passed'] for page in result['pages']))
              attempts.append(result)
              final = result
              if result['passed']:
                  break
              time.sleep(10)

          output = {
              'schemaVersion':'1.0.0',
              'auditId':'central-top-status-public-verification-20260725',
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'sourcePullRequests':[3281,3288,3292],
              'targetCount':len(targets),
              'attemptCount':len(attempts),
              'status':'passed' if final and final['passed'] else 'failed',
              'finalResult':final,
              'attempts':attempts,
              'releaseBlocker':'resolved' if final and final['passed'] else 'active',
          }
          path = Path('jichitai-compare/operations/audits/central-top-status-public-verification-20260725.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status':output['status'],'attemptCount':output['attemptCount'],'releaseBlocker':output['releaseBlocker']}, ensure_ascii=False, indent=2))
          PY
          python3 /tmp/verify_central_top_status_public.py

      - name: Commit public verification evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/central-top-status-public-verification-20260725.json \
            jichitai-compare/operations/control/central-top-status-public-verify-trigger-20260725.json
          git commit -m 'audit: 中日本5自治体の公開反映を確認'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Require successful public verification
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('jichitai-compare/operations/audits/central-top-status-public-verification-20260725.json').read_text(encoding='utf-8'))
          if result.get('status') != 'passed':
              raise SystemExit('Public verification failed; release blocker remains active.')
          PY
