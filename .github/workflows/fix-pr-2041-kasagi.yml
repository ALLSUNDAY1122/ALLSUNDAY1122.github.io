name: Fix PR 2041 Kasagi validation

on:
  pull_request:
    branches: [region/central]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/26364-current-fy2026-details' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/26364-current-fy2026-details
          fetch-depth: 0
      - name: Normalize unavailable service and task
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs = require('fs');
          const municipalityPath = 'jichitai-compare/data/municipalities/26/26364.json';
          const taskPath = 'jichitai-compare/operations/tasks/26364.json';
          const workflowPath = '.github/workflows/fix-pr-2041-kasagi.yml';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
          municipality.services.sickChildCare.status = 'unavailable';
          municipality.services.sickChildCare.summary = '現行の実施施設、対象年齢、料金、予約方法を町公式の利用者向け案内で確認できないため、利用前に保健福祉課への確認が必要。';
          municipality.services.sickChildCare.details.verificationStatus = '第3期計画で定住自立圏連携の事業方針は確認したが、2026年度の具体的利用条件は未確認';
          municipality.services.sickChildCare.details.contact = '笠置町保健福祉課へ実施施設、対象年齢、料金、登録・予約方法を確認';
          fs.writeFileSync(municipalityPath, JSON.stringify(municipality) + '\n');

          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          task.verifiedCount = 8;
          task.unavailableCount = 1;
          task.needsMediumReviewCount = 0;
          task.lastUpdatedAt = '2026-07-24T08:10:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.notes = (task.notes || []).filter((note) => !note.includes('unavailableからverified') && !note.includes('病児保育の施設名'));
          task.notes.push('病児保育は定住自立圏連携の事業方針を確認したが、2026年度の施設・対象年齢・料金・予約方法を利用者向け公式案内で確定できないためunavailableへ正規化。');
          task.blockers = [];
          fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');
          fs.unlinkSync(workflowPath);
          NODE
          git add jichitai-compare/data/municipalities/26/26364.json jichitai-compare/operations/tasks/26364.json .github/workflows/fix-pr-2041-kasagi.yml
          git commit -m "fix: 笠置町の病児保育を確認待ちへ正規化"
          git push origin HEAD:fix/26364-current-fy2026-details
