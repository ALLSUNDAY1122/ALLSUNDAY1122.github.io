name: Central A Weak Source State Sync 20260725

on:
  push:
    branches:
      - ops/central-a-weak-source-state-20260725-1154

permissions:
  contents: write

jobs:
  sync-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize checkpoint and regional state
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare/operations';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const items = [
            ['18481','temporaryChildcare'],['18483','temporaryChildcare'],
            ['21207','temporaryChildcare'],['21504','temporaryChildcare'],
            ['22219','temporaryChildcare'],['22305','temporaryChildcare'],['22424','temporaryChildcare'],['22429','temporaryChildcare'],
            ['23235','schoolMeals'],['23427','schoolMeals'],['23563','temporaryChildcare'],
            ['24205','temporaryChildcare'],['24212','temporaryChildcare'],['24441','schoolMeals'],['24461','temporaryChildcare'],['24543','schoolMeals'],
            ['25441','temporaryChildcare'],['25442','temporaryChildcare'],
            ['27232','sickChildCare'],['27321','sickChildCare'],['27366','sickChildCare']
          ].map(([code,service]) => ({code,service}));
          const checkpointPath = `${root}/control/session-checkpoints/central-a.json`;
          const regionPath = `${root}/control/regions/central.json`;
          const checkpoint = read(checkpointPath);
          const region = read(regionPath);
          const latest = {
            mode:'cause_based_focused_reaudit',
            status:'in_progress',
            startedAt:'2026-07-25T10:30:00+09:00',
            latestCompletedAt:'2026-07-25T11:54:00+09:00',
            latestRegionalPullRequestNumber:3256,
            latestCiRunNumber:7952,
            scopeMunicipalities:314,
            scopeServices:2826,
            correctedMunicipalitiesRechecked:54,
            primarySourceSlotsRechecked:486,
            confirmedCorrections:[
              {type:'municipality_code_duplicate',wrongCode:'24361',correctCode:'24341',name:'菰野町'},
              {type:'stale_official_url',code:'16210',service:'bulkyWaste'},
              {type:'stale_official_url',code:'23342',service:'bulkyWaste'},
              {type:'availability_assertion',code:'18481',service:'temporaryChildcare',name:'高浜町'},
              {type:'availability_assertion',code:'18483',service:'temporaryChildcare',name:'おおい町'},
              {type:'fiscal_year_amount',code:'21403',service:'schoolMeals',name:'大野町'},
              {type:'primary_source_upgrade',code:'21505',service:'schoolMeals',name:'八百津町'}
            ],
            issue3141UnresolvedItemCount:21,
            issue3141UnresolvedMunicipalityCount:21,
            issue3141Items:items,
            issue3141AuthoritativeStateCheckedAt:'2026-07-25T11:54:00+09:00',
            candidateCounts:{weakPrimarySource:42,numericOrConditionCompleteness:81,generalHousingMisclassification:149,fiscalYearRisk:33,schoolMealScopeAmbiguity:24,verifiedUnavailableRisk:1},
            resolvedSinceInitialCauseScan:[
              {code:'23561',name:'設楽町',service:'schoolMeals',regionalPr:3242,ciRun:7932},
              {code:'24205',name:'桑名市',service:'schoolMeals',regionalPr:3226,nationalPr:3230}
            ],
            nextPriority:['弱い主出典残42候補','子育て固有条件のない住宅支援候補','学校給食費の範囲候補']
          };
          checkpoint.updatedAt='2026-07-25T11:54:00+09:00';
          checkpoint.pullRequestNumber=3256;
          checkpoint.ciStatus='success';
          checkpoint.ciRunNumber=7952;
          checkpoint.qualityReaudit=latest;
          checkpoint.nextAction='原因別重点再監査を継続する。Issue #3141の現行21項目は利用者向け公式情報が揃うまで変更せず、次は弱い主出典の残42候補を公式利用者向けページで判定する。';
          region.updatedAt='2026-07-25T11:54:00+09:00';
          region.qualityReaudit=latest;
          region.lastAction='原因別重点再監査の弱い主出典第1群をPR #3256・CI #7952成功後にregion/centralへ統合。高浜町・おおい町の誰でも通園実施中断定を撤回し、大野町給食費を令和8年度0円へ訂正、八百津町の主出典を改善。Issue #3141を21項目・21自治体へ同期した。';
          region.nextAction='弱い主出典の残42候補を、学校給食費、病児保育、産後ケア、住宅支援の順に利用者向け公式情報で確定判定する。';
          write(checkpointPath,checkpoint);
          write(regionPath,region);
          write(`${root}/audits/central-a-weak-source-state-sync-20260725.json`,{
            schemaVersion:'1.0.0',
            auditId:'central-a-weak-source-state-sync-20260725',
            synchronizedAt:'2026-07-25T11:54:00+09:00',
            regionalPullRequestNumber:3256,
            regionalCiRunNumber:7952,
            issue3141:{unresolvedItemCount:21,unresolvedMunicipalityCount:21,items},
            removedStaleItems:[{code:'23561',service:'schoolMeals'},{code:'24205',service:'schoolMeals'}],
            addedItems:[{code:'18481',service:'temporaryChildcare'},{code:'18483',service:'temporaryChildcare'}],
            remainingWeakPrimarySourceCandidates:42
          });
          NODE
      - name: Validate state JSON
        run: |
          node -e "const c=require('./jichitai-compare/operations/control/session-checkpoints/central-a.json');if(c.qualityReaudit.issue3141Items.length!==21||c.qualityReaudit.candidateCounts.weakPrimarySource!==42)process.exit(1)"
          node -e "const r=require('./jichitai-compare/operations/control/regions/central.json');if(r.qualityReaudit.latestRegionalPullRequestNumber!==3256)process.exit(1)"
      - name: Commit state synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f jichitai-compare/operations/audits/.central-a-weak-source-state-trigger
          git rm .github/workflows/central-a-weak-source-state-sync-20260725.yml
          git add -A
          git commit -m "checkpoint: 弱い主出典第1群後の現行状態へ同期"
          git push origin HEAD:ops/central-a-weak-source-state-20260725-1154
