name: Temporary North B URL Public Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-url-public-check.yml'
      - 'jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json'
      - 'jichitai-compare/operations/control/session-checkpoints/north-b.json'

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify corrected primary links on public pages
        shell: bash
        run: |
          set -euo pipefail
          verify_text() {
            local url="$1"
            local expected="$2"
            local file
            file="$(mktemp)"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location --max-time 45 "$url" -o "$file" && grep -Fq "$expected" "$file"; then
                echo "Verified: $url -> $expected"
                rm -f "$file"
                return 0
              fi
              sleep 10
            done
            echo "Expected public text not found: $expected"
            rm -f "$file"
            return 1
          }

          base='https://allsunday1122.github.io/jichitai-compare/municipality'
          verify_text "$base/04215/" 'https://www.city.osaki.miyagi.jp/shisei/soshikikarasagasu/minseibu/kosodateshienka/3/6/1_1/15981.html'
          verify_text "$base/04401/" 'https://www.town.miyagi-matsushima.lg.jp/uploaded/attachment/5524.pdf'
          verify_text "$base/04421/" 'https://www.town.taiwa.miyagi.jp/material/files/group/15/r7-8sangokeajigyotirasi.pdf'
          verify_text "$base/04445/" 'https://www.town.kami.miyagi.jp/soshikikarasagasu/kikikanrishitsu/syobobosai/hazardmap/3505.html'
          verify_text "$base/05206/" 'https://www.city.oga.akita.jp/ijuteiju/live/support_R7.html'
          verify_text "$base/06202/" 'https://www.city.yonezawa.yamagata.jp/soshiki/4/1016/ninshin/1750.html'
          verify_text "$base/06301/" 'https://www.town.yamanobe.yamagata.jp/uploaded/attachment/8508.pdf'

      - name: Verify additional-source maintenance in public generated data
        shell: bash
        run: |
          set -euo pipefail
          file="$(mktemp)"
          url='https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json'
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 90 "$url" -o "$file" \
              && grep -Fq 'https://www.town.zao.miyagi.jp/kurashi_guide/sangyo_kensetsu/nougyou/bousaizyuutentameike.html' "$file" \
              && grep -Fq 'https://www.village.ohira.miyagi.jp/9/9/148.html' "$file" \
              && ! grep -Fq 'https://www.town.ogawara.miyagi.jp/7788.htm' "$file"; then
              echo 'Verified public generated data URL maintenance.'
              rm -f "$file"
              exit 0
            fi
            sleep 10
          done
          echo 'Public generated data has not reflected all URL maintenance.'
          rm -f "$file"
          exit 1
