name: Temporary West A Housing 38 Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-housing-38-public-verify-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify-public:
    if: github.head_ref == 'audit/west-a-housing-38-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify 38 published municipality pages and generated JSON
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const plan = JSON.parse(fs.readFileSync(`${root}/operations/audits/west-a-housing-classification-correction-plan-20260725.json`, 'utf8'));
          const followup = JSON.parse(fs.readFileSync(`${root}/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json`, 'utf8'));
          const targets = [...new Map([
            ...(plan.appliedCorrections ?? []).map((item) => [item.municipalityCode, { code: item.municipalityCode, name: item.municipalityName }]),
            ...(followup.corrections ?? []).map((item) => [item.municipalityCode, { code: item.municipalityCode, name: item.municipalityName }])
          ]).values()].sort((a, b) => a.code.localeCompare(b.code));
          if (targets.length !== 38) throw new Error(`expected 38 targets, got ${targets.length}`);

          async function fetchText(url, timeoutMs = 20000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                signal: controller.signal,
                headers: { 'user-agent': 'west-a-housing-public-audit/1.0' }
              });
              return { status: response.status, finalUrl: response.url, text: await response.text() };
            } finally {
              clearTimeout(timer);
            }
          }

          async function mapLimit(items, limit, fn) {
            const results = new Array(items.length);
            let cursor = 0;
            async function worker() {
              while (true) {
                const index = cursor++;
                if (index >= items.length) return;
                results[index] = await fn(items[index], index);
              }
            }
            await Promise.all(Array.from({ length: Math.min(limit, items.length || 1) }, () => worker()));
            return results;
          }

          let finalResult = null;
          const attempts = 12;
          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const cacheBust = `${Date.now()}-${attempt}`;
            let generatedCheck;
            try {
              const generatedUrl = `${base}/data/generated/municipalities.json?audit=${cacheBust}`;
              const fetched = await fetchText(generatedUrl);
              let data = null;
              try { data = JSON.parse(fetched.text); } catch {}
              const municipalities = Array.isArray(data?.municipalities) ? data.municipalities : [];
              const byCode = new Map(municipalities.map((item) => [item.code, item]));
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services ?? {}).length, 0);
              const targetChecks = targets.map((target) => {
                const service = byCode.get(target.code)?.services?.housingSupport;
                return {
                  code: target.code,
                  name: target.name,
                  found: Boolean(service),
                  status: service?.status ?? null,
                  summary: service?.summary ?? null,
                  childSpecificConditionConfirmed: service?.details?.childSpecificConditionConfirmed ?? null,
                  success: service?.status === 'unavailable'
                    && String(service?.summary ?? '').includes('子育て世帯固有')
                    && service?.details?.childSpecificConditionConfirmed === false
                };
              });
              generatedCheck = {
                url: generatedUrl,
                httpStatus: fetched.status,
                finalUrl: fetched.finalUrl,
                municipalityCount: municipalities.length,
                serviceCount,
                targetChecks,
                failedCodes: targetChecks.filter((item) => !item.success).map((item) => item.code),
                success: fetched.status === 200
                  && municipalities.length === 1741
                  && serviceCount === 15669
                  && targetChecks.every((item) => item.success)
              };
            } catch (error) {
              generatedCheck = { success: false, error: String(error), failedCodes: targets.map((item) => item.code) };
            }

            const pageChecks = await mapLimit(targets, 8, async (target) => {
              const url = `${base}/municipality/${target.code}/?audit=${cacheBust}`;
              try {
                const fetched = await fetchText(url);
                const requiredTokens = ['子育て世帯固有', '確認できない'];
                const missingTokens = requiredTokens.filter((token) => !fetched.text.includes(token));
                return {
                  code: target.code,
                  name: target.name,
                  url,
                  httpStatus: fetched.status,
                  finalUrl: fetched.finalUrl,
                  missingTokens,
                  success: fetched.status === 200 && missingTokens.length === 0
                };
              } catch (error) {
                return { code: target.code, name: target.name, url, httpStatus: null, finalUrl: null, missingTokens: ['fetch_failed'], success: false, error: String(error) };
              }
            });

            finalResult = {
              schemaVersion: '1.0.0',
              auditId: 'west-a-housing-classification-38-public-verification-20260725',
              generatedAt: new Date().toISOString(),
              relatedRegionalPullRequest: 3476,
              relatedRegionalCiRun: 8480,
              relatedRegionalMergeSha: '740441982462d0cd0c17a0b536ccfc409a5d0ba1',
              relatedNationalPullRequest: 3498,
              relatedNationalCiRun: 8494,
              relatedNationalMergeSha: 'c3c7b9f474cede030828538f9b40702a5e3e82aa',
              targetCount: targets.length,
              attempt,
              generatedJson: generatedCheck,
              pages: pageChecks,
              successfulPageCount: pageChecks.filter((item) => item.success).length,
              failedPageCodes: pageChecks.filter((item) => !item.success).map((item) => item.code),
              success: generatedCheck.success && pageChecks.every((item) => item.success),
              errors: []
            };
            if (finalResult.success) break;
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 15000));
          }

          if (!finalResult.success) {
            finalResult.errors = [
              ...(finalResult.generatedJson?.success ? [] : [{ generatedJson: finalResult.generatedJson }]),
              ...finalResult.pages.filter((item) => !item.success)
            ];
          }
          const outputPath = `${root}/operations/audits/west-a-housing-classification-38-public-verification-20260725.json`;
          fs.writeFileSync(outputPath, JSON.stringify(finalResult, null, 2) + '\n');
          if (!finalResult.success) process.exitCode = 1;
          NODE
      - name: Commit verification result and remove temporary runner
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -f jichitai-compare/operations/control/west-a-housing-38-public-verify-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-38-public-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-housing-classification-38-public-verification-20260725.json \
                  jichitai-compare/operations/control/west-a-housing-38-public-verify-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-38-public-verify.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A住宅支援38件の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
