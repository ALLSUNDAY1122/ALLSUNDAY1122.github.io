name: App Store Connect API Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/asc-check-trigger'
      - '.github/workflows/app-store-connect-api-check.yml'

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify App Store Connect API credentials
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/app_store_connect_api.py
