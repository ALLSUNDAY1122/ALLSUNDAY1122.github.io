name: Patch Sprint Study alert sound once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sprint-sound-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-off sprint sound patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.1.1 with clearer alerts
        shell: python
        run: |
          from pathlib import Path
          src = Path('sprint-study/app-v1.1.0.html')
          dst = Path('sprint-study/app-v1.1.1.html')
          text = src.read_text(encoding='utf-8')
          text = text.replace('<title>学びスプリント v1.1.0</title>', '<title>学びスプリント v1.1.1</title>')
          text = text.replace('v1.1.0</span>', 'v1.1.1</span>')
          old = """function beep(freq=720,dur=.07,vol=.05){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function vibrate(pattern){if(session?.settings.vibration&&navigator.vibrate)try{navigator.vibrate(pattern)}catch{}}
function cue(type){if(!session)return;const s=session.settings;if(type==='work'&&s.transitionSound){beep(780,.07);vibrate(25)}if(type==='switch'&&s.transitionSound){beep(500,.08);vibrate(35)}if(type==='rest'&&s.transitionSound){beep(430,.1);vibrate([30,35,30])}if(type==='countdown'&&s.countdownSound)beep(630,.04,.03);if(type==='finish'&&s.completeSound){beep(720,.09);setTimeout(()=>beep(920,.12),130);vibrate([40,45,70])}}"""
          new = """function beep(freq=880,dur=.08,vol=.085,wave='square'){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type=wave;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function pattern(notes){notes.forEach(([delay,freq,dur,vol,wave])=>setTimeout(()=>beep(freq,dur,vol,wave),delay))}
function vibrate(patternValue){if(session?.settings.vibration&&navigator.vibrate)try{navigator.vibrate(patternValue)}catch{}}
function cue(type){if(!session)return;const s=session.settings;if(type==='work'){if(s.transitionSound)pattern([[0,900,.07,.07,'triangle']]);vibrate(28)}if(type==='switch'){if(s.transitionSound)pattern([[0,1180,.085,.095,'square'],[145,1180,.085,.095,'square']]);vibrate([65,55,65])}if(type==='rest'){if(s.transitionSound)pattern([[0,760,.09,.08,'square'],[150,520,.11,.08,'square']]);vibrate([70,55,110])}if(type==='countdown'&&s.countdownSound)beep(720,.045,.055,'square');if(type==='finish'){if(s.completeSound)pattern([[0,880,.08,.09,'square'],[140,1175,.08,.09,'square'],[280,1568,.12,.10,'square']]);vibrate([70,55,70,55,140])}}"""
          if old not in text:
              raise SystemExit('Target audio block not found; refusing to patch')
          text = text.replace(old, new)
          dst.write_text(text, encoding='utf-8')

          index = Path('sprint-study/index.html')
          index_text = index.read_text(encoding='utf-8')
          index_text = index_text.replace('./app-v1.1.0.html?v=110', './app-v1.1.1.html?v=111')
          index_text = index_text.replace('学びスプリント v1.1.0を開く', '学びスプリント v1.1.1を開く')
          index.write_text(index_text, encoding='utf-8')
      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('sprint-study/app-v1.1.1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>', text)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/sprint-study.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sprint-study.js
          grep -q "pattern(\[\[0,1180" sprint-study/app-v1.1.1.html
          grep -q "app-v1.1.1.html?v=111" sprint-study/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint-study/app-v1.1.1.html sprint-study/index.html
          git commit -m 'Make Sprint Study alerts more noticeable'
          git push
