name: APP2-010 Fetch Codemagic Upload Log

on:
  push:
    branches: [main]
    paths: ['automation/app2-010-fetch-upload-log-command.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Fetch sanitized upload log from Codemagic artifact bundle
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path

          cmd=json.loads(Path('automation/app2-010-fetch-upload-log-command.json').read_text(encoding='utf-8'))
          rid=str(cmd.get('request_id','')); build_id=str(cmd.get('build_id',''))
          if not re.fullmatch(r'app2-010-upload-log-[A-Za-z0-9._-]{1,70}',rid): raise SystemExit('invalid request id')
          if build_id!='6a861f2e68c24c24844d3f66': raise SystemExit('unexpected build id')
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token: raise SystemExit('missing CM_API_TOKEN')

          def fetch(url,auth=True):
              headers={'Accept':'application/json'}
              if auth: headers['x-auth-token']=token
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return r.read()

          details=json.loads(fetch(f'https://codemagic.io/api/v3/builds/{build_id}').decode('utf-8'))
          data=details.get('data') if isinstance(details,dict) else None
          if not isinstance(data,dict): data=details if isinstance(details,dict) else {}
          artifacts=data.get('artifacts') or []
          bundle=next((a for a in artifacts if isinstance(a,dict) and a.get('type')=='bundle' and a.get('short_lived_download_url')),None)
          if bundle is None: raise RuntimeError('artifact bundle not found')
          raw_zip=fetch(str(bundle['short_lived_download_url']),auth=False)
          with zipfile.ZipFile(io.BytesIO(raw_zip)) as z:
              names=z.namelist()
              target=next((n for n in names if n.endswith('app2-010-asc-publish-sanitized.log')),None)
              if target is None:
                  safe_names=[n for n in names if not any(x in n.lower() for x in ('key','secret','token','credential'))]
                  raise RuntimeError('sanitized upload log missing; artifact files='+repr(safe_names[:50]))
              text=z.read(target).decode('utf-8','replace')
          text=re.sub(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----','[REDACTED PEM]',text,flags=re.S)
          text=re.sub(r'eyJ[A-Za-z0-9._-]{20,}','[REDACTED JWT]',text)
          text=re.sub(r'(?i)(api[_ -]?key|private[_ -]?key|token|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          out=Path('automation/codemagic-results')/f'{rid}.txt'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(text[-30000:],encoding='utf-8')
          meta=Path('automation/codemagic-results')/f'{rid}.json'; meta.write_text(json.dumps({'request_id':rid,'ok':True,'build_id':build_id,'artifact_log_found':True,'persisted_secret_values':False,'log_path':str(out)},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/result-path.txt').write_text(str(out),encoding='utf-8'); Path('/tmp/meta-path.txt').write_text(str(meta),encoding='utf-8'); Path('/tmp/log-copy.txt').write_text(out.read_text(encoding='utf-8'),encoding='utf-8'); Path('/tmp/meta-copy.json').write_text(meta.read_text(encoding='utf-8'),encoding='utf-8')
          print('PASS: sanitized Codemagic upload log recovered')
          PY
      - name: Persist sanitized log and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="$(cat /tmp/result-path.txt)"; M="$(cat /tmp/meta-path.txt)"; git add "$P" "$M"; git commit -m "Persist APP2-010 sanitized upload log" || exit 0
          if git push; then exit 0; fi
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/log-copy.txt "$P"; cp /tmp/meta-copy.json "$M"; git add "$P" "$M"; git commit -m "Persist APP2-010 sanitized upload log" || exit 0; git push origin HEAD:main
