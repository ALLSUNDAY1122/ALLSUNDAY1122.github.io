name: Diagnose HealthManager1 264 prebuild

on:
  push:
    branches: [main]
    paths:
      - automation/hm1-prebuild-diagnose-command.json

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ImageMagick for exact prepare reproduction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v magick || command -v convert
      - name: Provide ImageMagick 7 compatible magick shim when runner has IM6
        run: |
          if ! command -v magick >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          exec convert "$@"
          SH
            chmod +x "$HOME/bin/magick"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Run exact HM1 prepare script
        run: bash -x ios/health-manager-1/prepare-ios.sh
      - name: Validate final prepared outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections,json,re,struct
          root=Path('ios/health-manager-1')
          q=json.loads((root/'Resources/questions.json').read_text(encoding='utf-8'))
          html=(root/'Resources/index.html').read_text(encoding='utf-8')
          assert len(q)==264
          assert len({x['id'] for x in q})==264
          assert collections.Counter(x['round'] for x in q)=={'2026-04':44,'2025-10':44,'2025-04':44,'practice-A':44,'practice-B':44,'practice-C':44}
          assert 'const ROUNDS=' in html and 'practice-C-Q44' in html and '合計264問' in html
          icon=root/'Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png'
          b=icon.read_bytes(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(1024,1024)
          print('PASS: exact HM1 prepare script produced release-ready 264 bundle and icon')
          PY
