name: FP3 Preflight

on:
  push:
    branches: [main]
    paths:
      - 'fp3-manabi-sprint/**'
      - '.github/workflows/fp3-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit canonical learning bank
        run: python fp3-manabi-sprint/tools/audit_learning_bank.py
      - name: Extract and syntax-check product JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('fp3-manabi-sprint/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          if len(blocks) != 1:
              raise SystemExit(f'expected one inline product script, got {len(blocks)}')
          Path('/tmp/fp3-product.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/fp3-product.js
      - name: Product contract static gates
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('fp3-manabi-sprint/index.html').read_text(encoding='utf-8')
          required=[
            "12問スプリント","60問チャレンジ","苦手復習","続きから",
            "迷ったので復習に入れる","詳しい解説を見る","学習記録",
            "v===q.answer-1","st.weak[q.id].streak>=3",
            "q.status==='archived_law_changed'","active!==178","tf!==90","mc!==90"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing contract markers: '+repr(missing))
          prohibited=["v===q.answer||v===q.answer-1","legacy `fp3-12mon-knock`"]
          found=[x for x in prohibited if x in s]
          if found: raise SystemExit('prohibited markers: '+repr(found))
          print('PASS: FP3 core static contract')
          PY
      - name: Release identity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fp3-manabi-sprint/ios/project.yml').read_text(encoding='utf-8')
          expected='PRODUCT_BUNDLE_IDENTIFIER: com.allsunday1122.fp3kakomoncoach'
          if expected not in p:
              raise SystemExit('release bundle ID drift: expected existing ASC app com.allsunday1122.fp3kakomoncoach')
          print('PASS: FP3 release identity matches App Store Connect app 6796733578')
          PY
      - name: Native premium-boundary regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('fp3-manabi-sprint/ios/App.swift').read_text(encoding='utf-8')
          required=[
            'com.allsunday1122.fp3kakomoncoach.premium.lifetime',
            'window.__nativeStoreKitUpdate',
            "post('purchase')", "post('restore')",
            "String(q.year)==='2026'",
            "el.id === 'startWeak'",
            "el.closest('#domains')",
            "t.includes('2024') || t.includes('2025')",
            'FP3級 学科', '2026-04-01基準',
            '出典：日本FP協会・金融財政事情研究会',
            '学習用に表現・解説・法令基準を加工しています。'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing premium-boundary markers: '+repr(missing))
          if 'jp.allsunday1122.fp3manabisprint.premium' in s:
              raise SystemExit('stale StoreKit product ID drift detected')
          premium_path = re.search(
              r'window\.balanced12\s*=\s*function\s*\(\)\s*\{(?:(?!\n\s*\};).){0,800}?if\s*\(\s*state\.premium\s*\)\s*return\s+originalBalanced12\s*\(\s*\)\s*;',
              s,
              flags=re.S,
          )
          if not premium_path:
              raise SystemExit('premium 12-question path missing: balanced12 must route premium users to originalBalanced12()')
          if 'if(!state.premium && premiumTarget(el))' not in s:
              raise SystemExit('free lock interception missing')
          print('PASS: FP3 native premium boundary contract')
          PY

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare audited offline bundle
        run: bash fp3-manabi-sprint/ios/prepare-ios.sh
      - name: Generate Xcode project
        working-directory: fp3-manabi-sprint/ios
        run: xcodegen generate
      - name: Build iOS simulator target
        working-directory: fp3-manabi-sprint/ios
        run: |
          xcodebuild \
            -project FP3ManabiSprint.xcodeproj \
            -scheme FP3ManabiSprint \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
