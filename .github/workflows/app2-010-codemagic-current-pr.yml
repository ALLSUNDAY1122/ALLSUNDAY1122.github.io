name: APP2-010 Codemagic Current Readback

on:
  pull_request:
    branches: [main]
    paths:
      - automation/app2-010-codemagic-current-pr-trigger.txt

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Inspect current Touhan Codemagic build
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          cat > /tmp/app2-010-cm-command.json <<'EOF'
          {"request_id":"app2-010-codemagic-current-20260822-2014","action":"inspect_build","build_id":"6a861f2e68c24c24844d3f66"}
          EOF
          python scripts/codemagic_build_gateway.py --command /tmp/app2-010-cm-command.json --output /tmp/app2-010-cm-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/app2-010-cm-result.json').read_text(encoding='utf-8'))
          d=r.get('build_details') or {}
          summary={
            'request_id':r.get('request_id'),'ok':r.get('ok'),'build_id':r.get('build_id'),'status':r.get('status'),
            'build':{k:d.get(k) for k in ('_id','id','status','startedAt','finishedAt','workflowId','index','buildVersion','buildNumber','branch') if k in d},
            'app_id':'6a769d81a1add9d06020b524','workflow_id':'touhan-ios','new_build_started':False
          }
          p=Path('automation/codemagic-results/app2-010-codemagic-current-20260822-2014.json')
          p.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/app2-010-cm-summary.json').write_text(p.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          P=automation/codemagic-results/app2-010-codemagic-current-20260822-2014.json
          git add "$P"
          git commit -m 'Persist APP2-010 current Codemagic readback' || exit 0
          git push origin HEAD:main
