name: APP2-010 Install Touhan Codemagic

on:
  push:
    branches:
      - main
    paths:
      - automation/app2-010-codemagic-install-trigger.json

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Touhan workflow on latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git checkout -B app2-010-install-touhan origin/main
            REQUEST_ID="$(python3 -c "import json;print(json.load(open('automation/app2-010-codemagic-install-trigger.json',encoding='utf-8'))['request_id'])")"
            python3 scripts/install_touhan_codemagic.py
            RESULT_PATH="automation/codemagic-results/${REQUEST_ID}.json"
            git add codemagic.yaml "$RESULT_PATH"
            if git diff --cached --quiet; then
              echo "Touhan workflow already installed and result unchanged"
              exit 0
            fi
            git commit -m "Install 登録販売者 Codemagic Internal TestFlight workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during attempt ${attempt}; retrying"
            sleep 2
          done
          echo "Failed to install Touhan workflow after concurrency retries" >&2
          exit 1
