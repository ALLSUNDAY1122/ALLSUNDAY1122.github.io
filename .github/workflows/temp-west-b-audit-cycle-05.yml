name: Temporary West B Rough Validation Cycle 05

on:
  push:
    branches:
      - audit/west-b-rough-validation-cycle-05-20260725

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-rough-validation-cycle-05-20260725
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit next 25 West B municipalities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const projectRoot = path.join(process.cwd(), 'jichitai-compare');
          const municipalityRoot = path.join(projectRoot, 'data', 'municipalities');
          const auditRoot = path.join(projectRoot, 'operations', 'audits');
          const assignedPrefectures = ['31','32','34','35','36','38','41','42','44','45','47'];
          const requiredServices = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const allowedStatuses = new Set(['verified','unavailable','researching','needs_medium_review']);

          const priorCodes = new Set();
          for (const cycle of [1,2,3,4]) {
            const filename = `west-b-rough-validation-cycle-${String(cycle).padStart(2,'0')}-20260725.json`;
            const audit = JSON.parse(fs.readFileSync(path.join(auditRoot, filename), 'utf8'));
            for (const code of audit.scope.codes) priorCodes.add(String(code));
          }
          if (priorCodes.size !== 100) throw new Error(`Expected 100 prior codes, found ${priorCodes.size}`);

          const records = [];
          for (const pref of assignedPrefectures) {
            const dir = path.join(municipalityRoot, pref);
            for (const filename of fs.readdirSync(dir).filter(v => /^\d{5}\.json$/.test(v)).sort()) {
              const filePath = path.join(dir, filename);
              const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              records.push({pref, filename, filePath, data});
            }
          }
          records.sort((a,b) => String(a.data.code).localeCompare(String(b.data.code), 'ja'));
          const remaining = records.filter(r => !priorCodes.has(String(r.data.code)));
          if (remaining.length !== 150) throw new Error(`Expected 150 unaudited records, found ${remaining.length}`);
          const selected = remaining.slice(0,25);

          const fetchOne = async (item) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            try {
              const response = await fetch(item.url, {
                redirect:'follow',
                signal:controller.signal,
                headers:{'user-agent':'Mozilla/5.0 WestBAudit/1.0','accept':'text/html,application/pdf,*/*'}
              });
              try { await response.body?.cancel(); } catch {}
              return {...item, status:response.status, ok:response.ok, finalUrl:response.url};
            } catch (error) {
              return {...item, status:null, ok:false, error:error?.name === 'AbortError' ? 'timeout' : String(error?.message || error)};
            } finally {
              clearTimeout(timer);
            }
          };

          const runPool = async (items, limit = 16) => {
            const output = new Array(items.length);
            let cursor = 0;
            const workers = Array.from({length:Math.min(limit, items.length)}, async () => {
              while (true) {
                const i = cursor++;
                if (i >= items.length) return;
                output[i] = await fetchOne(items[i]);
              }
            });
            await Promise.all(workers);
            return output;
          };

          const structuralErrors = [];
          const urls = [];
          const outputRecords = [];
          for (const r of selected) {
            const data = r.data;
            const code = String(data.code || '');
            if (code !== r.filename.slice(0,5)) structuralErrors.push({code,field:'code',problem:'filename_mismatch'});
            if (String(data.prefectureCode || '') !== r.pref) structuralErrors.push({code,field:'prefectureCode',problem:'directory_mismatch'});
            if (!data.name) structuralErrors.push({code,field:'name',problem:'missing'});
            if (!/^https:\/\//.test(String(data.officialUrl || ''))) structuralErrors.push({code,field:'officialUrl',problem:'missing_or_non_https'});
            urls.push({code,name:data.name,field:'officialUrl',url:data.officialUrl});

            const keys = Object.keys(data.services || {});
            for (const required of requiredServices) {
              if (!keys.includes(required)) structuralErrors.push({code,field:`services.${required}`,problem:'missing'});
            }
            for (const key of keys) {
              if (!requiredServices.includes(key)) structuralErrors.push({code,field:`services.${key}`,problem:'unexpected'});
            }

            let verifiedCount = 0;
            let unavailableCount = 0;
            let missingPrimarySourceCount = 0;
            let nonHttpsPrimarySourceCount = 0;
            let futureCheckedAtCount = 0;
            const serviceSnapshots = {};
            for (const serviceKey of requiredServices) {
              const service = data.services?.[serviceKey];
              if (!service) continue;
              if (!allowedStatuses.has(service.status)) structuralErrors.push({code,field:`services.${serviceKey}.status`,problem:'invalid_status',value:service.status});
              if (!service.summary) structuralErrors.push({code,field:`services.${serviceKey}.summary`,problem:'missing'});
              if (service.status === 'verified') verifiedCount++;
              if (service.status === 'unavailable') unavailableCount++;
              const source = service.source;
              if (!source?.url) {
                missingPrimarySourceCount++;
                structuralErrors.push({code,field:`services.${serviceKey}.source.url`,problem:'missing'});
              } else {
                if (!/^https:\/\//.test(source.url)) nonHttpsPrimarySourceCount++;
                urls.push({code,name:data.name,field:`services.${serviceKey}.source`,service:serviceKey,url:source.url});
              }
              if (!source?.checkedAt) {
                structuralErrors.push({code,field:`services.${serviceKey}.source.checkedAt`,problem:'missing'});
              } else if (source.checkedAt > '2026-07-25') {
                futureCheckedAtCount++;
                structuralErrors.push({code,field:`services.${serviceKey}.source.checkedAt`,problem:'future_date',value:source.checkedAt});
              }
              serviceSnapshots[serviceKey] = {status:service.status,summary:service.summary,sourceUrl:source?.url || null,checkedAt:source?.checkedAt || null};
            }
            outputRecords.push({
              code,
              name:data.name,
              prefectureCode:r.pref,
              officialUrl:data.officialUrl,
              serviceCount:keys.length,
              verifiedCount,
              unavailableCount,
              missingPrimarySourceCount,
              nonHttpsPrimarySourceCount,
              futureCheckedAtCount,
              serviceSnapshots
            });
          }

          const networkResults = await runPool(urls);
          const networkWarnings = networkResults.filter(v => !v.ok);
          const sampleIndexes = [0,6,12,18,24];
          const manualSpotCheckCandidates = sampleIndexes.map(i => ({
            code:outputRecords[i].code,
            name:outputRecords[i].name,
            prefectureCode:outputRecords[i].prefectureCode,
            officialUrl:outputRecords[i].officialUrl,
            services:outputRecords[i].serviceSnapshots
          }));

          const report = {
            schemaVersion:'1.0.0',
            auditId:'west-b-rough-validation-cycle-05-20260725',
            sessionId:'west-b',
            cycle:5,
            plannedCycles:10,
            auditedAt:'2026-07-25T01:51:00+09:00',
            scope:{
              municipalityCount:selected.length,
              codes:outputRecords.map(v=>v.code),
              prefectureCodes:[...new Set(outputRecords.map(v=>v.prefectureCode))],
              serviceCount:selected.length * 9
            },
            methodology:[
              '既存第1〜4回監査の100自治体を除外し、担当コード順で次の25自治体を選定',
              '自治体コード・都道府県コード・自治体名・公式URLを確認',
              '必須9制度、状態、要約、主出典URL、確認日を確認',
              '公式URL25件と制度主出典225件をHTTP取得',
              '5自治体を手動抜き取り候補として記録'
            ],
            structuralErrorCount:structuralErrors.length,
            structuralErrors,
            networkCheckedUrlCount:networkResults.length,
            networkWarningCount:networkWarnings.length,
            networkWarnings,
            manualSpotCheckCandidates,
            records:outputRecords,
            conclusion:'pending_manual_review'
          };
          fs.writeFileSync(path.join(auditRoot,'west-b-rough-validation-cycle-05-20260725.json'), JSON.stringify(report,null,2) + '\n');
          NODE
      - name: Remove temporary workflow and commit report
        shell: bash
        run: |
          rm .github/workflows/temp-west-b-audit-cycle-05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/west-b-rough-validation-cycle-05-20260725.json
          git add .github/workflows/temp-west-b-audit-cycle-05.yml
          git commit -m "audit: 西日本B概略検証第5回の機械監査記録"
          git push origin HEAD:audit/west-b-rough-validation-cycle-05-20260725
