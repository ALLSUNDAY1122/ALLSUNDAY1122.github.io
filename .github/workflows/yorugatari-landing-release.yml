name: Yorugatari curated landing release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/assets/landing-share.js
      - yorugatari/tools/ensure-landing-sharing.mjs
      - .github/workflows/yorugatari-landing-release.yml

concurrency:
  group: yorugatari-curated-landing-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize current landing release
        shell: bash
        run: |
          node --check yorugatari/assets/landing-share.js
          node --check yorugatari/tools/ensure-landing-sharing.mjs
          node yorugatari/tools/ensure-landing-sharing.mjs
          grep -q 'assets/landing-share.js?v=20260724-002' yorugatari/5min-horror.html
          grep -q 'assets/landing-share.js?v=20260724-002' yorugatari/bedtime-horror.html
          grep -q '特集単位の合計だけを匿名で集計します' yorugatari/5min-horror.html
          grep -q '特集単位の合計だけを匿名で集計します' yorugatari/bedtime-horror.html

      - name: Commit released pages
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/5min-horror.html yorugatari/bedtime-horror.html; then
            echo "Landing release is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/5min-horror.html yorugatari/bedtime-horror.html
          git commit -m "Release Yorugatari landing story start tracking [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep 2
          done
          exit 1
