name: HM1 exact eight Q91-Q100 rebuild regression
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - .github/workflows/hm1-exact-eight-q91-q100.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild 264 on baseline and revised head and compare exact eight
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/hm1-q91-base 2bb5f205261fb1a2dd2e562f4130beccbac3489a
          node /tmp/hm1-q91-base/ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q91-base.log
          node ios/health-manager-1/augment-to-264.cjs >/tmp/hm1-q91-head.log
          node - <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('/tmp/hm1-q91-base/ios/health-manager-1/Resources/questions.json'));
          const head=JSON.parse(fs.readFileSync('ios/health-manager-1/Resources/questions.json'));
          const wanted=['2025-04-Q03','2025-04-Q04','2025-04-Q05','2025-04-Q07','2025-04-Q08','2025-04-Q09','2025-04-Q10','2025-04-Q12'].sort();
          if(base.length!==264||head.length!==264)throw Error('Expected 264 each');
          for(const bank of [base,head]){
            if(new Set(bank.map(q=>q.id)).size!==264)throw Error('Duplicate IDs');
            const normalize=s=>String(s||'').normalize('NFKC').replace(/次の記述のうち/g,'').replace(/次のうち/g,'').replace(/法令上/g,'').replace(/正しいものはどれか/g,'').replace(/誤っているものはどれか/g,'').replace(/[\\s\\p{P}\\p{S}]/gu,'').toLowerCase();
            if(new Set(bank.map(q=>normalize(q.stem))).size!==264)throw Error('Duplicate normalized stems');
            for(const q of bank)if(!Array.isArray(q.choices)||q.choices.length!==5||new Set(q.choices).size!==5||!Number.isInteger(q.ans)||q.ans<0||q.ans>4)throw Error('Bad choices or answer '+q.id);
          }
          if(base.some((q,i)=>q.id!==head[i].id))throw Error('ID ordering changed');
          const changed=head.filter((q,i)=>JSON.stringify(q)!==JSON.stringify(base[i])).map(q=>q.id).sort();
          if(JSON.stringify(changed)!==JSON.stringify(wanted))throw Error('Unexpected changed IDs '+JSON.stringify(changed));
          for(let i=0;i<264;i++){
            if(!wanted.includes(head[i].id))continue;
            if(head[i].ans!==base[i].ans)throw Error('Answer changed '+head[i].id);
            for(const k of new Set([...Object.keys(base[i]),...Object.keys(head[i])]))
              if(JSON.stringify(base[i][k])!==JSON.stringify(head[i][k])&&!['stem','choices','short','detail','auditSourceURL'].includes(k))
                throw Error('Unexpected field '+head[i].id+' '+k);
          }
          console.log('PASS: both builds 264, exact eight modified, other 256 identical, IDs/order unique, five distinct choices, answer indices retained.');
          NODE
