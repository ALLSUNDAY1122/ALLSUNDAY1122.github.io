name: Temporary Central A Housing Batch 13 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch13-public-trigger-20260726.json
permissions:
  contents: write
jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch13-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', token: '${{ secrets.GITHUB_TOKEN }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify public pages and generated JSON
        env: {PR_NUMBER: '${{ github.event.pull_request.number }}', RUN_ID: '${{ github.run_id }}'}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'16202',name:'高岡市',status:'verified',summary:'令和8年度、対象区域の住宅取得・リフォーム等を補助し、若年子育て世帯・新婚世帯・三世代同居等には加算がある。',source:'https://www.city.takaoka.toyama.jp/soshiki/kenchikuseisakuka/2/3/4/2521.html'},
            {code:'17201',name:'金沢市',status:'verified',summary:'18歳年度末までの子がいる子育て世帯等だけが応募できる市営住宅募集枠を設ける場合があり、令和8年度の定期・随時募集を実施する。',source:'https://www4.city.kanazawa.lg.jp/soshikikarasagasu/jutakuseisakuka/yokuarushitsumon_1/3116.html'},
            {code:'23100',name:'名古屋市',status:'verified',summary:'18歳以下の子がいる世帯等へ、定住促進住宅・公社賃貸住宅の家賃20％減額を最大10年間行い、家賃補助付き子育て世帯専用住戸等も提供する。',source:'https://www.city.nagoya.jp/kurashi/juutaku/1014573/1014580.html'},
            {code:'24216',name:'伊賀市',status:'verified',summary:'市外から移住する若者・子育て世帯の中古住宅取得費を補助する。',source:'https://iga-style.com/?page_id=861'},
            {code:'25442',name:'甲良町',status:'unavailable',summary:'結婚新生活支援の現行要綱は確認できるが、2026年度の婚姻・支払・申請対象期間を利用者向け公式情報で確定できない。',source:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001041.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;const pageChecks=[];
            for(const target of targets){
              try{const url=`${base}/municipality/${target.code}/?audit=${nonce}`;const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch13Audit/1.0'}});const html=await response.text();const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));const summaryMatches=html.includes(target.summary);const statusMatches=html.includes(target.status==='unavailable'?'公式情報で詳細未確認':'確認済み');pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});}catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch13Audit/1.0'}});const payload=await response.json();const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);const records=targets.map(target=>{const municipality=municipalities.find(item=>item.code===target.code);const service=municipality?.services?.housingSupport;return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};});const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};}catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};if(final.success)break;await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch13-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3709,nationalSyncPullRequest:3711,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:1,expectedVerifiedCount:4,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const out='jichitai-compare/operations/audits/central-a-housing-classification-batch13-public-verification-20260726.json';fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch13-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第13群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
