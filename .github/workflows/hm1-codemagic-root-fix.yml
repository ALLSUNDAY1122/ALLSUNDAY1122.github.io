name: Fix HealthManager1 Codemagic root workflow

on:
  push:
    branches:
      - main
    paths:
      - automation/hm1-codemagic-root-fix-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch HealthManager1 root Codemagic workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codemagic.yaml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  health-manager-1-testflight:')
          end = text.index('\n  health-manager-2-ios:', start)
          current = text[start:end]
          replacement = '''  health-manager-1-testflight:
            name: Health Manager 1 - iOS TestFlight
            max_build_duration: 60
            instance_type: mac_mini_m2
            integrations:
              app_store_connect: Codemagic Shiwake Swipe
            environment:
              ios_signing:
                distribution_type: app_store
                bundle_identifier: jp.allsunday1122.healthmanager1
              vars:
                BUNDLE_ID: jp.allsunday1122.healthmanager1
                XCODE_PROJECT: ios/health-manager-1/HealthManager1.xcodeproj
                XCODE_SCHEME: HealthManager1
              xcode: latest
            scripts:
              - name: Install XcodeGen
                script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
              - name: Set CI build number and generate Xcode project
                script: |
                  cd "$CM_BUILD_DIR/ios/health-manager-1"
                  BUILD_NUM="${CM_BUILD_NUMBER:?CM_BUILD_NUMBER is required}"
                  python3 - "$BUILD_NUM" <<'PY2'
                  from pathlib import Path
                  import re
                  import sys
                  path = Path('project.yml')
                  source = path.read_text(encoding='utf-8')
                  updated, count = re.subn(
                      r'CURRENT_PROJECT_VERSION:\\s*\\d+',
                      f'CURRENT_PROJECT_VERSION: {sys.argv[1]}',
                      source,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('CURRENT_PROJECT_VERSION replacement failed')
                  path.write_text(updated, encoding='utf-8')
                  PY2
                  xcodegen generate
              - name: Verify release inputs
                script: |
                  test -f "$CM_BUILD_DIR/ios/health-manager-1/Resources/index.html"
                  test -f "$CM_BUILD_DIR/ios/health-manager-1/Resources/PrivacyInfo.xcprivacy"
                  test -f "$CM_BUILD_DIR/ios/health-manager-1/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
                  INDEX_BYTES="$(wc -c < "$CM_BUILD_DIR/ios/health-manager-1/Resources/index.html" | tr -d ' ')"
                  test "$INDEX_BYTES" -ge 100000
                  grep -q "第一種衛生管理者" "$CM_BUILD_DIR/ios/health-manager-1/Resources/index.html"
              - name: Apply App Store signing profiles
                script: |
                  cd "$CM_BUILD_DIR/ios/health-manager-1"
                  xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
              - name: Build signed IPA
                script: |
                  xcode-project build-ipa \\
                    --project "$CM_BUILD_DIR/$XCODE_PROJECT" \\
                    --scheme "$XCODE_SCHEME"
              - name: Verify packaged learning content
                script: |
                  IPA_PATH="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
                  if [ -z "$IPA_PATH" ]; then
                    echo "HealthManager1 IPA not found"
                    exit 1
                  fi
                  VERIFY_DIR="$(mktemp -d)"
                  unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
                  APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
                  INDEX_PATH="$APP_DIR/index.html"
                  if [ ! -f "$INDEX_PATH" ]; then
                    echo "index.html is missing from the packaged app"
                    exit 1
                  fi
                  INDEX_BYTES="$(wc -c < "$INDEX_PATH" | tr -d ' ')"
                  if [ "$INDEX_BYTES" -lt 100000 ]; then
                    echo "index.html is unexpectedly small: ${INDEX_BYTES} bytes"
                    exit 1
                  fi
                  if ! grep -q "第一種衛生管理者" "$INDEX_PATH"; then
                    echo "index.html does not contain the expected app marker"
                    exit 1
                  fi
                  echo "Packaged learning content verified: ${INDEX_BYTES} bytes"
            artifacts:
              - build/ios/ipa/*.ipa
              - /tmp/xcodebuild_logs/*.log
            publishing:
              app_store_connect:
                auth: integration
                submit_to_testflight: true
                submit_to_app_store: false
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if current.strip() == replacement.strip():
              print('PASS: HealthManager1 root workflow already matches hardened release gate')
              raise SystemExit(0)
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          print('PASS: hardened HealthManager1 root workflow synced')
          PY

      - name: Validate Codemagic YAML
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          config = yaml.safe_load(Path('codemagic.yaml').read_text(encoding='utf-8')) or {}
          workflow = (config.get('workflows') or {}).get('health-manager-1-testflight') or {}
          names = [step.get('name') for step in workflow.get('scripts', [])]
          assert 'Set CI build number and generate Xcode project' in names
          assert 'Verify release inputs' in names
          assert 'Verify packaged learning content' in names
          asc = (workflow.get('publishing') or {}).get('app_store_connect') or {}
          assert asc.get('submit_to_testflight') is True
          assert asc.get('submit_to_app_store') is False
          print('PASS: HealthManager1 hardened root workflow validates')
          PY

      - name: Commit root workflow correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml
          if git diff --cached --quiet; then
            echo "No root Codemagic change"
            exit 0
          fi
          git commit -m "Harden HealthManager1 Codemagic release gate"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
