name: Kangoshi Native iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/ios/**'
      - 'kangoshi-sprint/product-content/enriched-draft/**'
      - 'kangoshi-sprint/product-content/scoring-runtime-audit.json'
      - 'kangoshi-sprint/media/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/kangoshi-native-ios.yml'

concurrency:
  group: kangoshi-native-ios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen cairo pango
          python3 -m pip install --break-system-packages 'CairoSVG>=2.7,<3'
      - name: Normalize Swift numeric literals
        run: |
          python3 kangoshi-sprint/ios/tools/normalize_swift_numeric_literals.py
          git diff --check
      - name: Validate privacy manifest
        run: plutil -lint kangoshi-sprint/ios/PrivacyInfo.xcprivacy
      - name: Prepare canonical 720-question resources
        run: python3 kangoshi-sprint/ios/tools/prepare_native_content.py
      - name: Validate native resources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('kangoshi-sprint/ios/GeneratedResources')
          a=json.loads((root/'native-content-audit.json').read_text(encoding='utf-8'))
          q=json.loads((root/'questions.generated.json').read_text(encoding='utf-8'))
          assert a['pass'] and a['questions']==720 and a['uniqueIds']==720
          assert a['byExam']=={'115':240,'114':240,'113':240}
          assert a['mediaQuestions']==38 and a['svgRedrawsRasterized']==23
          assert a['freeSampleQuestions']==24 and a['scoringExceptions']==8
          assert a['officialExcludedWithoutAcceptedAnswer']==2
          assert len(q['questions'])==720 and len(q['freeSampleQuestionIds'])==24
          assert len(list((root/'Media').iterdir()))==38
          print(a)
          PY
      - name: StoreKit and privacy source gate
        run: |
          grep -q 'jp.allsunday1122.kangoshi.monthly' kangoshi-sprint/ios/Sources/KangoshiSprintApp.swift
          grep -q 'Product.displayPrice\|product?.displayPrice' native-ios/LearningSprintCore/Sources/LearningSprintCore/PurchaseController.swift
          grep -q 'Transaction.currentEntitlements' native-ios/LearningSprintCore/Sources/LearningSprintCore/PurchaseController.swift
          grep -q '購入を復元' kangoshi-sprint/ios/Sources/PaywallView.swift
          grep -q '購入を復元' kangoshi-sprint/ios/Sources/MainViews.swift
          grep -q 'CA92.1' kangoshi-sprint/ios/PrivacyInfo.xcprivacy
          if grep -R -E '¥[[:space:]]*200|￥[[:space:]]*200|200円' kangoshi-sprint/ios/Sources; then
            echo 'Hard-coded display price detected'; exit 1
          fi
      - name: Generate Xcode project
        working-directory: kangoshi-sprint/ios
        run: xcodegen generate
      - name: Debug simulator build
        working-directory: kangoshi-sprint/ios
        run: |
          set -o pipefail
          xcodebuild -project KangoshiSprint.xcodeproj -scheme KangoshiSprint -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | xcpretty
      - name: Release simulator build
        working-directory: kangoshi-sprint/ios
        run: |
          set -o pipefail
          xcodebuild -project KangoshiSprint.xcodeproj -scheme KangoshiSprint -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | xcpretty
      - name: Verify release bundle
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/KangoshiSprint.app' -type d | head -1)
          test -n "$APP"
          test -f "$APP/questions.generated.json"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -d "$APP/Media"
          test "$(find "$APP/Media" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '38'
          plutil -p "$APP/Info.plist" | tee /tmp/kangoshi-info.txt
          grep -q 'jp.allsunday1122.kangoshi' /tmp/kangoshi-info.txt
      - name: Write native audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('kangoshi-sprint/ios/native-build-audit.json')
          out.write_text(json.dumps({
            'schemaVersion':2,'bundleId':'jp.allsunday1122.kangoshi',
            'productId':'jp.allsunday1122.kangoshi.monthly','questions':720,'examSets':3,
            'mediaAssets':38,'storeKit2CodeReady':True,'displayPriceFromStoreKit':True,
            'privacyManifest':True,'debugSimulatorBuild':True,'releaseSimulatorBuild':True,'pass':True
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit normalized sources and native audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/ios/Sources kangoshi-sprint/ios/native-build-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: persist native build fixes and PASS audit [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
