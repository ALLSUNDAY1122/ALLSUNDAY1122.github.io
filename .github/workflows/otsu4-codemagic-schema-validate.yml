name: Otsu4 Codemagic Schema Validate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-SCHEMA]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/otsu4-720-internal-testflight
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate against official Codemagic schema
        run: |
          python -m pip install --disable-pip-version-check PyYAML jsonschema requests
          python - <<'PY'
          import json, yaml, requests
          from jsonschema import Draft7Validator
          cfg=yaml.safe_load(open('codemagic.yaml',encoding='utf-8'))
          schema=requests.get('https://codemagic.io/codemagic-schema.json',timeout=30).json()
          errors=sorted(Draft7Validator(schema).iter_errors(cfg),key=lambda e:list(e.absolute_path))
          report=[]
          for e in errors:
              path='.'.join(str(x) for x in e.absolute_path) or '<root>'
              report.append({'path':path,'message':e.message})
          print(json.dumps({'ok':not errors,'error_count':len(errors),'errors':report},ensure_ascii=False,indent=2))
          open('otsu4-codemagic-schema-report.json','w',encoding='utf-8').write(json.dumps({'ok':not errors,'error_count':len(errors),'errors':report},ensure_ascii=False,indent=2))
          if errors: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otsu4-codemagic-schema-${{ github.run_id }}
          path: otsu4-codemagic-schema-report.json
          retention-days: 7
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 Codemagic schema validation finished. status=${{ job.status }}; run_id=${context.runId}`});
