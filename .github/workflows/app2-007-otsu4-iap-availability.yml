name: APP2-007 Otsu4 IAP Availability

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  configure:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[ASC-CMD] APP2-007 OTSU4 IAP AVAILABILITY')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - name: Configure Japan availability
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_007_otsu4_iap_availability.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app2-007-otsu4-iap-availability-${{ github.run_id }}
          path: automation/app2-007-otsu4-iap-availability-result.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-007 Otsu4 IAP availability finished. status=${{ job.status }}; run_id=${context.runId}; artifact=app2-007-otsu4-iap-availability-${context.runId}`});
