name: Pitari Codemagic Status Readback

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-codemagic-status-command.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Codemagic build and actions
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          sha=os.environ['GITHUB_SHA']
          cmd_url=f'https://raw.githubusercontent.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/{sha}/automation/pitari-codemagic-status-command.json'
          with urllib.request.urlopen(cmd_url,timeout=30) as r:
            cmd=json.loads(r.read().decode())
          bid=cmd['build_id']
          token=os.environ['CM_API_TOKEN']
          def get(url):
            req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: body=json.loads(raw) if raw else {}
              except Exception: body={'parse_error':True}
              return e.code,body
          bcode,bobj=get(f'https://codemagic.io/api/v3/builds/{bid}')
          acode,aobj=get(f'https://codemagic.io/api/v3/builds/{bid}/actions')
          def compact(v):
            if isinstance(v,list): return [compact(x) for x in v]
            if not isinstance(v,dict): return v if isinstance(v,(str,int,float,bool)) or v is None else str(type(v).__name__)
            allowed=('id','name','status','type','started_at','finished_at','startedAt','finishedAt','conclusion','result','message','error','error_message','exit_code','index','title','action_type')
            out={k:compact(v[k]) for k in allowed if k in v}
            out['_keys']=sorted(v.keys())
            return out
          details=bobj.get('data',bobj) if isinstance(bobj,dict) else bobj
          actions=aobj.get('data',aobj) if isinstance(aobj,dict) else aobj
          print('PITARI_CODEMAGIC_DIAGNOSTIC='+json.dumps({
            'request_id':cmd.get('request_id'),
            'build_id':bid,
            'build_http':bcode,
            'build':compact(details),
            'actions_http':acode,
            'actions':compact(actions)
          },ensure_ascii=False))
          PY
