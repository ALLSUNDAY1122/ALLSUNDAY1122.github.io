name: Pitari Codemagic Status Readback

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-codemagic-status-command.json

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect Codemagic build and actions
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/codemagic_build_gateway.py --command automation/pitari-codemagic-status-command.json --output /tmp/pitari-cm-status.json
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          cmd=json.loads(Path('automation/pitari-codemagic-status-command.json').read_text())
          bid=cmd['build_id']
          req=urllib.request.Request(f'https://codemagic.io/api/v3/builds/{bid}/actions',headers={'x-auth-token':os.environ['CM_API_TOKEN'],'Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read().decode('utf-8','replace'); code=r.status
          except urllib.error.HTTPError as e:
            raw=e.read().decode('utf-8','replace'); code=e.code
          try: obj=json.loads(raw) if raw else {}
          except Exception: obj={'parse_error':True}
          def compact(v):
            if isinstance(v,list): return [compact(x) for x in v]
            if not isinstance(v,dict): return v if isinstance(v,(str,int,float,bool)) or v is None else str(type(v).__name__)
            allowed=('id','name','status','type','started_at','finished_at','startedAt','finishedAt','conclusion','result','message','error','error_message','exit_code','index')
            out={k:compact(v[k]) for k in allowed if k in v}
            out['_keys']=sorted(v.keys())
            return out
          status=json.loads(Path('/tmp/pitari-cm-status.json').read_text())
          status['actions_http_status']=code
          status['actions_root_keys']=sorted(obj.keys()) if isinstance(obj,dict) else []
          status['actions_diagnostic']=compact(obj.get('data',obj) if isinstance(obj,dict) else obj)
          Path('/tmp/pitari-cm-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist sanitized status
        if: always()
        run: |
          RID=$(python -c "import json;print(json.load(open('automation/pitari-codemagic-status-command.json'))['request_id'])")
          mkdir -p automation/codemagic-pitari-status
          if [ -f /tmp/pitari-cm-status.json ]; then cp /tmp/pitari-cm-status.json "automation/codemagic-pitari-status/${RID}.json"; else printf '{"request_id":"%s","error":"status readback failed before output"}\n' "$RID" > "automation/codemagic-pitari-status/${RID}.json"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "automation/codemagic-pitari-status/${RID}.json"
          git commit -m "Persist Pitari Codemagic status ${RID}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
