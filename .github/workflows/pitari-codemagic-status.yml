name: Pitari Codemagic Status Readback

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-codemagic-status-command.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Codemagic build, actions, and failed-step log
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          sha=os.environ['GITHUB_SHA']
          cmd_url=f'https://raw.githubusercontent.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/{sha}/automation/pitari-codemagic-status-command.json'
          with urllib.request.urlopen(cmd_url,timeout=30) as r:
            cmd=json.loads(r.read().decode())
          bid=cmd['build_id']; token=os.environ['CM_API_TOKEN']
          def get_json(url):
            req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: body=json.loads(raw) if raw else {}
              except Exception: body={'parse_error':True}
              return e.code,body
          def get_text(url):
            req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'text/plain'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.read().decode('utf-8','replace')
            except urllib.error.HTTPError as e: return e.code,e.read().decode('utf-8','replace')
          bcode,bobj=get_json(f'https://codemagic.io/api/v3/builds/{bid}')
          acode,aobj=get_json(f'https://codemagic.io/api/v3/builds/{bid}/actions')
          actions=aobj.get('data',[]) if isinstance(aobj,dict) else []
          failed=next((a for a in actions if a.get('status')=='failed'),None)
          lcode=None; log=''
          if failed:
            lcode,log=get_text(f'https://api.codemagic.io/builds/{bid}/step/{failed.get("id")}')
            log=log.replace(token,'[REDACTED]')
            log=re.sub(r'https://[^\s/@]+:[^\s/@]+@', 'https://[REDACTED]@', log)
            log=re.sub(r'(?i)(authorization:\s*(?:bearer|token)\s+)\S+', r'\1[REDACTED]', log)
            log=re.sub(r'(?i)(x-auth-token[^\n:=]*[:=]\s*)\S+', r'\1[REDACTED]', log)
            log='\n'.join(log.splitlines()[-120:])[-12000:]
          print('PITARI_CODEMAGIC_STEP_DIAGNOSTIC='+json.dumps({
            'request_id':cmd.get('request_id'),'build_id':bid,'build_http':bcode,
            'failed_action':{k:failed.get(k) for k in ('id','name','status','type','started_at','finished_at')} if failed else None,
            'step_log_http':lcode,'step_log_tail':log
          },ensure_ascii=False))
          PY
