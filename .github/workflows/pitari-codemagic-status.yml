name: Pitari Codemagic Release Gateway

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-codemagic-status-command.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute Codemagic release command
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          sha=os.environ['GITHUB_SHA']
          cmd_url=f'https://raw.githubusercontent.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/{sha}/automation/pitari-codemagic-status-command.json'
          with urllib.request.urlopen(cmd_url,timeout=30) as r:
            cmd=json.loads(r.read().decode())
          token=os.environ['CM_API_TOKEN']; action=cmd['action']
          def request(url, method='GET', payload=None, accept='application/json'):
            data=None if payload is None else json.dumps(payload).encode()
            headers={'x-auth-token':token,'Accept':accept}
            if payload is not None: headers['Content-Type']='application/json'
            req=urllib.request.Request(url,data=data,method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.read().decode('utf-8','replace')
            except urllib.error.HTTPError as e: return e.code,e.read().decode('utf-8','replace')
          def parsed(body):
            try: return json.loads(body) if body else {}
            except Exception: return {'parse_error':True}
          def sanitize_log(log):
            log=log.replace(token,'[REDACTED]')
            log=re.sub(r'https://[^\s/@]+:[^\s/@]+@', 'https://[REDACTED]@', log)
            log=re.sub(r'(?i)(authorization:\s*(?:bearer|token)\s+)\S+', r'\1[REDACTED]', log)
            log=re.sub(r'(?i)(x-auth-token[^\n:=]*[:=]\s*)\S+', r'\1[REDACTED]', log)
            return '\n'.join(log.splitlines()[-180:])[-20000:]
          if action == 'start_build':
            payload={
              'appId':cmd.get('app_id','6a769d81a1add9d06020b524'),
              'workflowId':cmd.get('workflow_id','pitari-direct-testflight'),
              'branch':cmd.get('branch','release/pitari-testflight-direct-20260830'),
              'labels':cmd.get('labels',['pitari-log-handoff-20260830'])
            }
            code,body=request('https://api.codemagic.io/builds','POST',payload)
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,'response':parsed(body)}
          elif action == 'cancel_build':
            bid=cmd['build_id']
            code,body=request(f'https://api.codemagic.io/builds/{bid}/cancel','POST')
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,'build_id':bid,'response':parsed(body)}
          elif action == 'inspect_build':
            bid=cmd['build_id']
            bcode,bbody=request(f'https://codemagic.io/api/v3/builds/{bid}')
            acode,abody=request(f'https://codemagic.io/api/v3/builds/{bid}/actions')
            bobj=parsed(bbody); aobj=parsed(abody)
            actions=aobj.get('data',[]) if isinstance(aobj,dict) else []
            out={'request_id':cmd['request_id'],'action':action,'build_http':bcode,'actions_http':acode,
                 'build':bobj.get('data',bobj) if isinstance(bobj,dict) else bobj,
                 'actions':[{k:a.get(k) for k in ('id','name','status','type','started_at','finished_at')} for a in actions]}
          elif action == 'step_log':
            bid=cmd['build_id']; sid=cmd['step_id']
            code,body=request(f'https://api.codemagic.io/builds/{bid}/step/{sid}',accept='text/plain')
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,'build_id':bid,'step_id':sid,'log_tail':sanitize_log(body)}
          elif action == 'list_apps':
            code,body=request('https://api.codemagic.io/apps')
            obj=parsed(body)
            apps=obj.get('applications',[]) if isinstance(obj,dict) else []
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,
                 'applications':[{k:a.get(k) for k in ('_id','appName','repositoryUrl','repoUrl','teamId','workflowIds')} for a in apps]}
          elif action == 'get_app':
            aid=cmd['app_id']
            code,body=request(f'https://api.codemagic.io/apps/{aid}')
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,'response':parsed(body)}
          elif action == 'add_app':
            payload={'repositoryUrl':cmd['repository_url']}
            if cmd.get('team_id'): payload['teamId']=cmd['team_id']
            code,body=request('https://api.codemagic.io/apps','POST',payload)
            out={'request_id':cmd['request_id'],'action':action,'http_status':code,'response':parsed(body)}
          else:
            raise SystemExit(f'unsupported action: {action}')
          print('PITARI_CODEMAGIC_GATEWAY='+json.dumps(out,ensure_ascii=False))
          if any(out.get(k,200) >= 300 for k in ('http_status','build_http','actions_http')): raise SystemExit(1)
          PY
