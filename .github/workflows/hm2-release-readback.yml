name: HM2 Release Readback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hm2_release_readback.py'
      - '.github/workflows/hm2-release-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hm2-release-readback
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read App Store Connect directly
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          HM2_ASC_RESULT: hm2-release-readback.json
        run: python3 scripts/hm2_release_readback.py
      - name: Upload sanitized result
        if: always() && hashFiles('hm2-release-readback.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: hm2-release-readback
          path: hm2-release-readback.json
          if-no-files-found: error
          retention-days: 14
