name: Temporary state snapshot 474 1742

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-state-474-1742.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build assignment-filtered state snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
          git checkout -B coord/state-after-public-474-20260722-1742 origin/main
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = 'jichitai-compare'
          queue_path = Path(root) / 'operations/control/release-queue.json'
          global_path = Path(root) / 'operations/control/global-state.json'
          audit_path = Path(root) / 'operations/control/audit-log.jsonl'
          progress = json.loads((Path(root) / 'operations/progress.json').read_text(encoding='utf-8'))
          assert progress['registeredMunicipalities'] == 474

          regions = {
              'north': ('origin/region/north', lambda p: 1 <= p <= 7, 757),
              'east': ('origin/region/east', lambda p: 8 <= p <= 15 or p in (19, 20), 708),
              'central': ('origin/region/central', lambda p: 16 <= p <= 18 or 21 <= p <= 30, 742),
              'west': ('origin/region/west', lambda p: 31 <= p <= 47, 716),
          }

          def load(ref, accept):
              output = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', ref, f'{root}/data/municipalities'],
                  text=True,
              )
              rows = []
              for path in output.splitlines():
                  match = re.fullmatch(
                      rf'{re.escape(root)}/data/municipalities/(\d{{2}})/(\d{{5}})\.json', path
                  )
                  if not match:
                      continue
                  prefecture = int(match.group(1))
                  code = match.group(2)
                  if not accept(prefecture):
                      continue
                  data = json.loads(subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True))
                  rows.append({'code': code, 'name': data.get('name') or data.get('municipalityName') or code})
              return sorted(rows, key=lambda row: row['code'])

          main_rows = {}
          regional_rows = {}
          pending_rows = {}
          pending = {}
          counts = {}
          ready = []
          total = 0

          for region, (ref, accept, _) in regions.items():
              main_rows[region] = load('HEAD', accept)
              regional_rows[region] = load(ref, accept)
              main_codes = {row['code'] for row in main_rows[region]}
              regional_codes = {row['code'] for row in regional_rows[region]}
              missing = main_codes - regional_codes
              assert not missing, (region, sorted(missing))
              pending_rows[region] = [row for row in regional_rows[region] if row['code'] not in main_codes]
              pending[region] = len(pending_rows[region])
              counts[region] = len(regional_rows[region])
              total += counts[region]
              if pending[region] >= 10:
                  ready.append(region)

          now = datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          next_action = (
              '10自治体到達地域を固定スナップショットで全国統合する。'
              if ready else
              '地方統合を継続。現在の公開後繰越: ' +
              '、'.join(f'{key} {pending[key]}' for key in ('north', 'east', 'central', 'west')) + '。'
          )

          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in queue['entries']}
          for region, (_, _, integration_pr) in regions.items():
              entries[region].update({
                  'municipalities': regional_rows[region],
                  'count': counts[region],
                  'pendingSinceLastRelease': pending[region],
                  'releaseStatus': 'ready' if pending[region] >= 10 else ('up_to_date' if pending[region] == 0 else 'pending_threshold'),
                  'reason': f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending[region]}自治体',
                  'mainIntegrationPr': integration_pr,
                  'generatedPullRequest': 759,
                  'auditStatus': 'passed',
              })
          queue.update({
              'updatedAt': now,
              'summary': {
                  'regionalMergedMunicipalities': total,
                  'latestGeneratedMunicipalityCount': 474,
                  'latestGeneratedPullRequest': 759,
                  'latestPublicCountPullRequest': 759,
                  'releaseReadyRegions': ready,
                  'nextAction': next_action,
              },
              'nextAction': next_action,
              'humanDecisionRequired': False,
          })
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          global_state = json.loads(global_path.read_text(encoding='utf-8'))
          global_state.update({
              'updatedAt': now,
              'phase': 'release-monitoring',
              'regionalCompletedSinceLastRelease': {**pending, 'total': sum(pending.values())},
              'priority': {'type': 'release-monitoring', 'nextAction': next_action},
              'lastNationalIntegrationAt': '2026-07-22T17:33:49+09:00',
              'lastNationalIntegrationPr': 757,
              'latestGeneratedMunicipalityCount': 474,
              'latestGeneratedPullRequest': 759,
              'latestPublicCountPullRequest': 759,
              'regionalMergedMunicipalities': total,
              'openPullRequests': [],
              'humanDecisionRequired': False,
          })
          global_path.write_text(json.dumps(global_state, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          record = {
              'timestamp': now,
              'actor': '全国進行統括',
              'action': 'coordinator-sync-after-public-474',
              'details': {
                  'publicMunicipalityCount': 474,
                  'publicServices': 4266,
                  'regionalCounts': counts,
                  'regionalMergedMunicipalities': total,
                  'pendingSinceLatestNationalIntegration': {**pending, 'total': sum(pending.values())},
                  'pendingMunicipalities': pending_rows,
                  'nationalIntegrationPullRequest': 757,
                  'publicationPullRequest': 759,
                  'releaseReadyRegions': ready,
              },
              'humanDecisionRequired': False,
          }
          text = audit_path.read_text(encoding='utf-8')
          if text and not text.endswith('\n'):
              text += '\n'
          audit_path.write_text(text + json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          Path('/tmp/state-summary').write_text(
              f"{total} {pending['north']} {pending['east']} {pending['central']} {pending['west']}"
          )
          PY
          read total north east central west < /tmp/state-summary
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json \
            jichitai-compare/operations/control/global-state.json \
            jichitai-compare/operations/control/audit-log.jsonl
          git commit -m "統括管理: 公開474・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force origin HEAD:coord/state-after-public-474-20260722-1742
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-state-474-1742.yml ]; then
            git rm .github/workflows/temp-state-474-1742.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 公開474状態一時ワークフローを削除'
            git push origin HEAD:main
          fi
