name: Temporary generated data sync 124

on:
  push:
    branches:
      - coord/generated-sync-124-20260721

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: coord/generated-sync-124-20260721
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Verify generated municipality count
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/municipalities.json', 'utf8'));
          const municipalities = Array.isArray(data) ? data : data.municipalities;
          if (!Array.isArray(municipalities)) throw new Error('Generated municipality array not found');
          if (municipalities.length !== 124) throw new Error(`Expected 124 municipalities, got ${municipalities.length}`);
          console.log(`Verified ${municipalities.length} municipalities`);
          NODE

      - name: Commit generated files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/generated/municipalities.json
          git add jichitai-compare/operations/progress.json
          git add jichitai-compare/index.html
          git rm .github/workflows/tmp-generate-sync-124.yml
          git commit -m "生成更新: 全国124自治体を公開データへ反映"
          git push origin HEAD:coord/generated-sync-124-20260721
