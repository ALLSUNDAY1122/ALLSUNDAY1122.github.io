name: Temporary Central A Weak Source Batch 6

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch6-trigger-20260727.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch6-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weak primary source batch 6
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-27';
          const updatedAt='2026-07-27T06:27:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const readJson=p=>{const raw=fs.readFileSync(p,'utf8');return{raw,obj:JSON.parse(raw)}};
          const writeJson=(p,raw,obj)=>fs.writeFileSync(p,(raw.startsWith('{\n')?JSON.stringify(obj,null,2):JSON.stringify(obj))+'\n');
          const addSource=(svc,entry)=>{const list=Array.isArray(svc.additionalSources)?svc.additionalSources:[];const i=list.findIndex(x=>x.url===entry.url);if(i>=0)list[i]={...list[i],...entry};else list.push(entry);svc.additionalSources=list;};
          const decisions=[
            {code:'27381',pref:'27',name:'太子町',service:'schoolMeals',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.town.taishi.osaka.jp/busyo/seisakusoumubu/soumuzaiseika/yosankesanjokyohoukokusho/toushoyosannitsuite/6669.html',newUrl:'https://www.town.taishi.osaka.jp/busyo/seisakusoumubu/soumuzaiseika/yosankesanjokyohoukokusho/toushoyosannitsuite/6669.html',basis:'令和8年度の学校園給食費無償化を予算案内で維持し、令和8年度献立・給食だよりと給食物資調達の現行導線を追加'},
            {code:'28214',pref:'28',name:'宝塚市',service:'schoolMeals',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.city.takarazuka.hyogo.jp/_res/projects/default_project/_page_/001/012/635/r8_takarazukanoyosan.pdf',newUrl:'https://www.city.takarazuka.hyogo.jp/_res/projects/default_project/_page_/001/012/635/r8_takarazukanoyosan.pdf',basis:'小学校1食30円・中学校1食345円の令和8年度負担額を予算資料で維持し、物価高騰対策と令和8年度献立の直接案内を追加'},
            {code:'28218',pref:'28',name:'小野市',service:'sickChildCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.city.ono.hyogo.jp/section/~somu/reiki/reiki_honbun/v400RG00000870.html',newUrl:'https://www.city.ono.hyogo.jp/section/~somu/reiki/reiki_honbun/v400RG00000870.html',basis:'病児対応型の対象年齢・事業要件を現行要綱で維持し、病後児保育を含む利用者向け子育て案内と令和8年6月改正告示の導線を追加'},
            {code:'23237',pref:'23',name:'あま市',service:'housingSupport',outcome:'unavailable_confirmed_current_general_programs',previousUrl:'https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/index.html',newUrl:'https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/index.html',basis:'令和8年度の耐震・省エネ等の一般住宅制度を再確認したが、子育て・新婚・三世代世帯を対象要件とする住宅支援は確認できない'},
            {code:'23238',pref:'23',name:'長久手市',service:'housingSupport',outcome:'unavailable_confirmed_current_general_programs',previousUrl:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/index.html',newUrl:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/index.html',basis:'令和8年度の耐震改修・除却・住宅省エネ設備補助を再確認したが、子育て・新婚・三世代世帯を対象要件とする住宅支援は確認できない'}
          ];
          const grouped=new Map();for(const d of decisions){if(!grouped.has(d.code))grouped.set(d.code,[]);grouped.get(d.code).push(d);}
          for(const [code,items] of grouped){
            const municipalityPath=path.join(root,'data/municipalities',items[0].pref,`${code}.json`);
            const {raw,obj:m}=readJson(municipalityPath);
            for(const d of items){
              const svc=m.services[d.service];if(!svc)throw new Error(`${d.code}:${d.service} missing`);
              if(d.code==='27381'){
                svc.source.checkedAt=checkedAt;
                svc.details.currentOperation='令和8年度7月分まで小中学校の献立表・給食だよりが継続公開されていることを確認。';
                addSource(svc,{url:'https://www.town.taishi.osaka.jp/busyo/kyouiku_jimu/kyusyokusenta/kondatehyou/2kondate_8/index.html',checkedAt,description:'令和8年度の小中学校献立表・給食だより'});
                addSource(svc,{url:'https://www.town.taishi.osaka.jp/busyo/kyouiku_jimu/kyusyokusenta/2337.html',checkedAt,description:'令和8年度から令和10年度の学校給食用物資調達を案内する現行ページ'});
              }else if(d.code==='28214'){
                svc.source.checkedAt=checkedAt;
                addSource(svc,{url:'https://www.city.takarazuka.hyogo.jp/1060682/1060706/seikatsushien/1055135.html',checkedAt,description:'令和8年度の小中学校給食費負担軽減を案内する物価高騰対策ページ'});
                addSource(svc,{url:'https://www.city.takarazuka.hyogo.jp/1060680/1060699/kyoikuiinkai/gakkorecipe/1020803/1062944.html',checkedAt,description:'令和8年度の小中学校給食献立'});
              }else if(d.code==='28218'){
                svc.source.checkedAt=checkedAt;
                svc.details.userFacingNote='病児対応型の実施施設、予約、利用料は公開要綱だけでは確定できないため、子育て支援課または実施事業者へ確認する。ファミリーサポートの病後児保育は別の利用形態として扱う。';
                addSource(svc,{url:'https://www.city.ono.hyogo.jp/soshikikarasagasu/shiminfukushibu_kosodateshienka/gyomuannai/1/1/3070.html',checkedAt,description:'病後児保育を含む現行の子育て支援利用者向け案内'});
                addSource(svc,{url:'https://www.city.ono.hyogo.jp/densi_keji/index.html',checkedAt,description:'令和8年6月24日の病児・病後児保育事業補助金交付要綱改正告示'});
              }else if(d.code==='23237'){
                svc.source.checkedAt=checkedAt;
                svc.details.reviewedAt=checkedAt;
                addSource(svc,{url:'https://www.city.ama.aichi.jp/kurashi/kankyo/ondanka/1002443.html',checkedAt,description:'令和8年度の一般住宅向け省エネ設備補助。子育て世帯固有制度ではない'});
              }else if(d.code==='23238'){
                svc.source.checkedAt=checkedAt;
                svc.details.reviewedAt=checkedAt;
                addSource(svc,{url:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/1607.html',checkedAt,description:'令和8年度の一般住宅向け木造住宅除却工事費補助'});
                addSource(svc,{url:'https://www.city.nagakute.lg.jp/soshiki/kurashibunkabu/kankyoka/kurashi/gomi/josei/1564.html',checkedAt,description:'令和8年度の一般住宅向け省エネ設備補助'});
              }
            }
            m.updatedAt=checkedAt;writeJson(municipalityPath,raw,m);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);const {raw:taskRaw,obj:task}=readJson(taskPath);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='中日本調査班A';task.status='merged';task.completedServices=keys;
            task.verifiedCount=keys.filter(k=>m.services[k]?.status==='verified').length;task.researchingCount=keys.filter(k=>m.services[k]?.status==='researching').length;task.unavailableCount=keys.filter(k=>m.services[k]?.status==='unavailable').length;task.needsMediumReviewCount=keys.filter(k=>m.services[k]?.status==='needs_medium_review').length;
            task.officialSources=[...new Set(keys.map(k=>m.services[k]?.source?.url).filter(Boolean))];task.notes=Array.isArray(task.notes)?task.notes:[];
            for(const d of items){const note=`2026-07-27 弱い主出典第6群: ${d.service}を${d.outcome}として再確認。${d.basis}`;if(!task.notes.includes(note))task.notes.push(note);}
            task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);
          }
          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));const done=new Set(decisions.map(d=>`${d.code}:${d.service}`));recovery.queue=(recovery.queue??[]).filter(x=>!done.has(`${x.code}:${x.service}`));recovery.queueCount=recovery.queue.length;recovery.nextBatch=recovery.queue.slice(0,5);recovery.status='active_queue_batch6_applied';recovery.lastAppliedBatch=6;recovery.lastAppliedAt=updatedAt;fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          const decision={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch6-decisions-20260727',session:'中日本調査班A',coordinatorSession:'統括B',checkedAt,updatedAt,category:'weakPrimarySource',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:0,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,unavailableConfirmedCount:2,contentCorrectionCount:0,remainingCandidates:3,decisions,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'regional_changes_validated',blocker:null};fs.writeFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch6-decisions-20260727.json'),JSON.stringify(decision,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));checkpoint.updatedAt=updatedAt;checkpoint.status='in_progress';checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.nextAction='弱い主出典残3件を公式情報で確認し、利用者向け直接ページまたは要綱と利用導線の組合せへ改善する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';const q=checkpoint.qualityReaudit;q.latestCompletedAt=updatedAt;q.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);q.latestCiRunNumber=Number(process.env.RUN_ID);q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??0),257);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??0),693);q.candidateCounts.weakPrimarySource=3;q.latestWeakSourceBatch={batch:6,status:'regional_data_updated_ci_success',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:0,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,unavailableConfirmedCount:2,contentCorrectionCount:0,remainingCandidates:3,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};checkpoint.lastAction='弱い主出典第6群5制度を公式情報で再確認し、現行利用者向け導線を補強した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const progressPath=path.join(root,'operations/progress.json');const progress=JSON.parse(fs.readFileSync(progressPath,'utf8'));progress.updatedAt=updatedAt;if(progress.qualityReaudit){progress.qualityReaudit.correctedMunicipalitiesRechecked=Math.max(Number(progress.qualityReaudit.correctedMunicipalitiesRechecked??0),257);progress.qualityReaudit.primarySourceSlotsRechecked=Math.max(Number(progress.qualityReaudit.primarySourceSlotsRechecked??0),693);progress.qualityReaudit.weakPrimarySourceCandidates=3;}fs.writeFileSync(progressPath,JSON.stringify(progress,null,2)+'\n');
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch6-trigger-20260727.json
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第6群を改善'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
