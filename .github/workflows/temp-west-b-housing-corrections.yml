name: Temporary West B Housing Corrections

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-b-housing-corrections-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/west-b-housing-corrections-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import audit evidence from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for path in \
            jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-official-review-20260725.json
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/main:$path" > "$path"
          done

      - name: Apply confirmed housing corrections
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T19:39:00+09:00';
          const keys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const reviewPath = path.join(root, 'operations/audits/west-b-housing-official-review-20260725.json');
          const review = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));

          const replacements = {
            '35305': {
              status: 'verified',
              summary: '夫婦とも39歳以下の新婚世帯へ、住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下は上限60万円補助する。',
              details: {
                program: '令和8年度周防大島町結婚新生活支援事業補助金',
                target: '2026年1月1日以後に婚姻し、夫婦とも39歳以下、夫婦の合計所得が500万円未満などの要件を満たす新婚世帯',
                covered: '住宅取得費、住宅賃借費、リフォーム費、引越費',
                amount: '夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',
                condition: '対象住宅が町内にあり、夫婦双方または一方が対象住宅に住所を有すること等',
                excludedGeneralProgram: '一般空き家バンク改修・家財処分制度を子育て住宅支援の主制度とする登録を解消'
              },
              source: { url: 'https://www.town.suo-oshima.lg.jp/soshiki/19/15054.html', checkedAt },
              additionalSources: [
                { url: 'https://www1.g-reiki.net/town.suo-oshima/reiki_honbun/r050RG00001389.html', checkedAt, description: '結婚新生活支援事業補助金交付要綱' }
              ]
            },
            '36405': {
              status: 'verified',
              summary: '2026年度に婚姻した39歳以下の新婚世帯へ、住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下は上限60万円補助する。',
              details: {
                program: '令和8年度上板町結婚・妊娠・共育て応援事業',
                target: '2026年4月1日から2027年3月31日までに婚姻し、夫婦とも39歳以下、世帯所得500万円未満などの要件を満たす世帯',
                covered: '住宅取得費、賃料・敷金・礼金・共益費・仲介手数料、リフォーム費、引越費',
                amount: '夫婦とも29歳以下は上限60万円、30歳から39歳は上限30万円',
                additionalCondition: '乳幼児・子育て世帯との交流等を含むライフデザイン講座を受講すること',
                excludedGeneralProgram: '一般住宅・移住施策を子育て住宅支援の主制度とする登録を解消'
              },
              source: { url: 'https://www.townkamiita.jp/docs/2026030400014/', checkedAt }
            },
            '41209': {
              status: 'verified',
              summary: '2026年1月1日から2027年3月31日までに婚姻した39歳以下の新婚世帯へ、住宅取得・賃借・リフォーム・引越費用を上限30万円または60万円補助する。',
              details: {
                program: '令和8年度嬉野市結婚新生活支援事業',
                target: '対象期間に婚姻し、夫婦とも39歳以下、夫婦の合計所得が500万円未満などの要件を満たす世帯',
                covered: '住宅取得費、住宅賃借費、引越費、リフォーム費',
                amount: '夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',
                applicationPeriod: '2026年4月1日から2027年2月末まで。予算到達時は受付終了',
                excludedGeneralProgram: '一般住宅制度を子育て住宅支援の主制度とする登録を解消'
              },
              source: { url: 'https://www.city.ureshino.lg.jp/kurashi/deai/_32808.html', checkedAt }
            }
          };

          const beforeAfter = [];
          const done = new Set(['verified','unavailable']);

          function updateTask(municipality, task, note) {
            const entries = keys.map((key) => [key, municipality.services[key]]);
            const statuses = entries.map(([, service]) => service.status);
            task.completedServices = entries.filter(([, service]) => done.has(service.status)).map(([key]) => key);
            task.verifiedCount = statuses.filter((status) => status === 'verified').length;
            task.researchingCount = statuses.filter((status) => status === 'researching').length;
            task.unavailableCount = statuses.filter((status) => status === 'unavailable').length;
            task.needsMediumReviewCount = statuses.filter((status) => status === 'needs_medium_review').length;
            const next = entries.findIndex(([, service]) => !done.has(service.status));
            task.nextServiceIndex = next === -1 ? keys.length : next;
            task.currentService = keys[task.nextServiceIndex] ?? null;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班B';
            task.officialSources = [...new Set(entries.filter(([, service]) => done.has(service.status) && service.source?.url).map(([, service]) => service.source.url))];
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            if (!task.notes.includes(note)) task.notes.push(note);
          }

          for (const decision of review.decisions.changeToUnavailable) {
            const pref = decision.code.slice(0, 2);
            const municipalityPath = path.join(root, 'data/municipalities', pref, `${decision.code}.json`);
            const taskPath = path.join(root, 'operations/tasks', `${decision.code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            const before = municipality.services.housingSupport;
            const after = {
              status: 'unavailable',
              summary: '子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
              details: {
                reason: `${decision.judgment}。確認できた制度は一般制度で、子育て・新婚世帯固有の対象・加算・優遇がない。`,
                excludedProgramEvidence: decision.judgment,
                auditPolicy: '一般住宅・移住・耐震・省エネ・空き家・公営住宅施策のみを、子育て世帯向け住宅支援として登録しない。'
              },
              source: { url: decision.officialUrl, checkedAt }
            };
            municipality.updatedAt = checkedAt;
            municipality.services.housingSupport = after;
            updateTask(municipality, task, '2026年7月25日の原因別重点再監査で、一般住宅・移住等の制度を子育て住宅支援から除外し、housingSupportをunavailableへ修正した。');
            fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
            beforeAfter.push({ code: decision.code, name: decision.name, correctionType: 'general_housing_misclassification', beforeStatus: before.status, beforeSummary: before.summary, afterStatus: after.status, afterSummary: after.summary, officialSource: decision.officialUrl, judgment: decision.judgment });
          }

          for (const decision of review.decisions.replaceWithFamilySpecificProgram) {
            const pref = decision.code.slice(0, 2);
            const municipalityPath = path.join(root, 'data/municipalities', pref, `${decision.code}.json`);
            const taskPath = path.join(root, 'operations/tasks', `${decision.code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            const before = municipality.services.housingSupport;
            const after = replacements[decision.code];
            if (!after) throw new Error(`Missing replacement data for ${decision.code}`);
            municipality.updatedAt = checkedAt;
            municipality.services.housingSupport = after;
            updateTask(municipality, task, '2026年7月25日の原因別重点再監査で、一般住宅制度から2026年度の新婚・家族向け住宅支援へ主制度を差し替えた。');
            fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
            beforeAfter.push({ code: decision.code, name: decision.name, correctionType: 'replace_with_family_specific_program', beforeStatus: before.status, beforeSummary: before.summary, afterStatus: after.status, afterSummary: after.summary, officialSource: after.source.url, judgment: decision.judgment });
          }

          const retained = review.decisions.retainVerified.map((decision) => {
            const pref = decision.code.slice(0, 2);
            const municipalityPath = path.join(root, 'data/municipalities', pref, `${decision.code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const service = municipality.services.housingSupport;
            return { code: decision.code, name: decision.name, status: service.status, summary: service.summary, officialSource: decision.officialUrl, judgment: decision.judgment, changed: false };
          });

          if (beforeAfter.length !== 24 || retained.length !== 1) {
            throw new Error(`Unexpected decision counts: corrections=${beforeAfter.length}, retained=${retained.length}`);
          }

          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'west-b-housing-classification-corrections-20260725',
            correctedAt: updatedAt,
            session: '西日本調査班B',
            regionalPullRequestNumber: Number(process.env.PR_NUMBER),
            runnerWorkflowRunId: Number(process.env.RUN_ID),
            sourceAuditFiles: [
              'jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json',
              'jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json',
              'jichitai-compare/operations/audits/west-b-housing-official-review-20260725.json'
            ],
            scope: { auditedMunicipalities: 250, priorityReviewed: 25, confirmedCorrections: 24, changedToUnavailable: 21, replacedWithFamilySpecificProgram: 3, retainedVerified: 1 },
            corrections: beforeAfter,
            retained,
            validation: { expectedCorrectionCount: 24, expectedRetainedCount: 1, taskRecalculationApplied: true, generatedValidationPending: true },
            releaseBlocker: 'pending_regional_validation'
          };
          fs.writeFileSync(path.join(root, 'operations/audits/west-b-housing-classification-corrections-20260725.json'), JSON.stringify(audit, null, 2) + '\n');
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js

      - name: Record validation and commit corrections
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json';
          const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
          audit.validation.generatedValidationPending = false;
          audit.validation.generatedValidation = 'success';
          audit.releaseBlocker = 'none';
          fs.writeFileSync(file, JSON.stringify(audit, null, 2) + '\n');
          NODE
          rm -f jichitai-compare/operations/control/west-b-housing-corrections-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          codes='35203 35206 35207 35208 35305 36388 36403 36404 36405 36468 38205 38386 41208 41209 41346 45382 45403 45406 45430 47353 47359 47360 47362 47381'
          for code in $codes; do
            pref="${code:0:2}"
            git add "jichitai-compare/data/municipalities/$pref/$code.json" "jichitai-compare/operations/tasks/$code.json"
          done
          git add \
            jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-official-review-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json \
            jichitai-compare/operations/control/west-b-housing-corrections-trigger-20260725.json
          git commit -m 'fix: 西日本B住宅支援分類24件を訂正'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
