name: Temporary Build North Release 20260722 1001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-north-release-20260722-1001.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed 10-municipality snapshot
        run: |
          set -euxo pipefail
          BRANCH='coord/north-release-10-20260722-1001'
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north'
          git checkout -b "$BRANCH"
          paths=(
            jichitai-compare/data/municipalities/01/01511.json
            jichitai-compare/operations/tasks/01511.json
            jichitai-compare/data/municipalities/01/01512.json
            jichitai-compare/operations/tasks/01512.json
            jichitai-compare/data/municipalities/01/01513.json
            jichitai-compare/operations/tasks/01513.json
            jichitai-compare/data/municipalities/01/01514.json
            jichitai-compare/operations/tasks/01514.json
            jichitai-compare/data/municipalities/01/01516.json
            jichitai-compare/operations/tasks/01516.json
            jichitai-compare/data/municipalities/01/01517.json
            jichitai-compare/operations/tasks/01517.json
            jichitai-compare/data/municipalities/01/01518.json
            jichitai-compare/operations/tasks/01518.json
            jichitai-compare/data/municipalities/01/01519.json
            jichitai-compare/operations/tasks/01519.json
            jichitai-compare/data/municipalities/01/01543.json
            jichitai-compare/operations/tasks/01543.json
            jichitai-compare/data/municipalities/01/01544.json
            jichitai-compare/operations/tasks/01544.json
          )
          git checkout origin/region/north -- "${paths[@]}"
          rm .github/workflows/temp-build-north-release-20260722-1001.yml
          actual=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' "${paths[@]}" | sort)
          test "$actual" = "$expected"
          for code in 01511 01512 01513 01514 01516 01517 01518 01519 01543 01544; do
            grep -q '"status"[[:space:]]*:[[:space:]]*"merged"' "jichitai-compare/operations/tasks/${code}.json"
          done
          git add "${paths[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 北日本の追加10自治体を固定スナップショット化'
          git push origin "$BRANCH"
          git checkout main
          git rm .github/workflows/temp-build-north-release-20260722-1001.yml
          git commit -m '統括管理: 北日本統合一時ワークフローを削除'
          git push origin main
