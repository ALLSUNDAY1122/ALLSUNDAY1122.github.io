name: Temporary post-sync Miyake smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-public:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main snapshot
        uses: actions/checkout@v4
        with:
          ref: ops/post-sync-13381-smoke-20260725
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify published GitHub Pages site
        working-directory: jichitai-compare
        run: npm run smoke:public
      - name: Verify Miyake published correction
        working-directory: jichitai-compare
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const generated = JSON.parse(await readFile('data/generated/municipalities.json', 'utf8'));
          const item = generated.municipalities.find((entry) => entry.code === '13381');
          if (!item || item.services?.postpartumCare?.status !== 'unavailable') throw new Error('main generated data is not corrected');
          const response = await fetch(`${base}/municipality/13381/`, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow' });
          if (!response.ok) throw new Error(`public page HTTP ${response.status}`);
          const html = await response.text();
          if (!html.includes('産後ケア事業を確認できない')) throw new Error('public page does not contain corrected postpartum wording');
          if (!html.includes('公式情報で詳細未確認')) throw new Error('public page does not show safe unavailable label');
          console.log('Miyake postpartum correction is published');
          NODE
