name: APP2-003 Yoru Codemagic Build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: startsWith(github.event.issue.title, '[YORU-CM-BUILD]')
    runs-on: ubuntu-latest
    steps:
      - name: Start pinned Yoru signed Build 4
        id: cm
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CM_API_TOKEN"
          body='{"appId":"6a8af6e5a5c86907b00c2efd","workflowId":"yoru-ios","branch":"main"}'
          response=$(curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: $CM_API_TOKEN" \
            -d "$body" \
            https://api.codemagic.io/builds)
          build_id=$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("buildId") or d.get("id") or "")')
          test -n "$build_id"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Report locator
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BUILD_ID: ${{ steps.cm.outputs.build_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "APP2-003 Codemagic signed Build 4 started. build_id=$BUILD_ID"
