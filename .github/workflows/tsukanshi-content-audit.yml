name: Tsukanshi content audit

on:
  push:
    paths:
      - 'tsukanshi-sprint/questions*.js'
      - 'tsukanshi-sprint/sources*.js'
      - 'tsukanshi-sprint/validate-*.mjs'
      - 'tsukanshi-sprint/index.html'
      - 'tsukanshi-sprint/bootstrap-v21.js'
      - 'tsukanshi-sprint/app-v21.js'
      - 'tsukanshi-sprint/style-v21.css'
      - 'tsukanshi-sprint/manifest.json'
      - 'tsukanshi-sprint/sw.js'
      - 'tsukanshi-sprint/icon.svg'
      - '.github/workflows/tsukanshi-content-audit.yml'
  pull_request:
    paths:
      - 'tsukanshi-sprint/questions*.js'
      - 'tsukanshi-sprint/sources*.js'
      - 'tsukanshi-sprint/validate-*.mjs'
      - 'tsukanshi-sprint/index.html'
      - 'tsukanshi-sprint/bootstrap-v21.js'
      - 'tsukanshi-sprint/app-v21.js'
      - 'tsukanshi-sprint/style-v21.css'
      - 'tsukanshi-sprint/manifest.json'
      - 'tsukanshi-sprint/sw.js'
      - 'tsukanshi-sprint/icon.svg'
      - '.github/workflows/tsukanshi-content-audit.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate customs broker source content
        run: node tsukanshi-sprint/validate-content.mjs
      - name: Validate all 480 editorial-final questions
        run: node tsukanshi-sprint/validate-editorial-final.mjs
      - name: Validate Golden Master UI JavaScript syntax
        run: |
          node --check tsukanshi-sprint/bootstrap-v21.js
          node --check tsukanshi-sprint/app-v21.js
          node --check tsukanshi-sprint/sw.js
          node --check tsukanshi-sprint/questions-v03-audit1.js
          node --check tsukanshi-sprint/questions-v03-audit1-order.js
          node --check tsukanshi-sprint/questions-v03-audit1-polish.js
          node --check tsukanshi-sprint/questions-editorial-audit2-7.js
      - name: Validate UI question bootstrap
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['questions.js','sources-v02.js','questions-v02-tb.js','questions-v02-ks1.js','questions-v02-ks2.js','questions-v02-ks3.js','questions-v02-ks4.js','questions-v02-jm1.js','questions-v02-jm2.js','questions-v02-jm3.js','questions-v02-jm4.js','sources-v03.js','questions-v03-tb.js','questions-v03-audit1.js','questions-v03-audit1-order.js','questions-v03-audit1-polish.js','questions-editorial-audit2-7.js'];
          const context=vm.createContext({window:{},console});
          for(const file of files) vm.runInContext(fs.readFileSync('tsukanshi-sprint/'+file,'utf8'),context,{filename:file});
          vm.runInContext(fs.readFileSync('tsukanshi-sprint/bootstrap-v21.js','utf8'),context,{filename:'bootstrap-v21.js'});
          const questions=context.window.TSUKANSHI_QUESTIONS||[];
          if(questions.length!==492) throw new Error(`UI bootstrap question count ${questions.length}; expected 492`);
          const study=questions.filter(q=>q.answerType!=='declaration');
          const decl=questions.filter(q=>q.answerType==='declaration');
          if(study.filter(q=>q.editorialStatus==='final').length!==480) throw new Error('UI does not expose 480 editorial-final study questions');
          if(decl.filter(q=>q.editorialStatus==='final').length!==12) throw new Error('UI does not expose 12 editorial-final declaration sets');
          if(!context.window.TSUKANSHI_CONTENT_VERSION) throw new Error('content version not exposed to UI');
          if(!context.window.TSUKANSHI_LAW_BASELINE) throw new Error('law baseline not exposed to UI');
          console.log(`UI bootstrap ok: ${questions.length}; study final 480/480; declaration final 12/12`);
          NODE
      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('tsukanshi-sprint/manifest.json','utf8')); console.log('manifest ok')"
      - name: Validate v2.1 UI references
        run: |
          grep -q 'style-v21.css?v=20260809-1034' tsukanshi-sprint/index.html
          grep -q 'questions-v03-audit1.js?v=20260809-1141' tsukanshi-sprint/index.html
          grep -q 'questions-v03-audit1-order.js?v=20260809-1141' tsukanshi-sprint/index.html
          grep -q 'questions-v03-audit1-polish.js?v=20260809-1150' tsukanshi-sprint/index.html
          grep -q 'questions-editorial-audit2-7.js?v=20260809-1153' tsukanshi-sprint/index.html
          grep -q 'bootstrap-v21.js?v=20260809-1034' tsukanshi-sprint/index.html
          grep -q 'app-v21.js?v=20260809-1034' tsukanshi-sprint/index.html
          grep -q 'manifest.json' tsukanshi-sprint/index.html
          grep -q 'grid-template-columns:repeat(4,1fr)' tsukanshi-sprint/style-v21.css
          grep -q 'dailyGoal:8' tsukanshi-sprint/app-v21.js
          grep -q "tsukanshi-sprint-v25-editorial-final" tsukanshi-sprint/sw.js
