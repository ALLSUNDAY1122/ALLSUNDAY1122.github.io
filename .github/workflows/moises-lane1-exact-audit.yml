name: Moises Lane1 Exact A40 Audit

on:
  pull_request:
    branches:
      - main

jobs:
  exact-lane1-a40:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Worker 1 A40 tip
        uses: actions/checkout@v4
        with:
          ref: 6514ab8eea1570c18e75f012254db48c3a0418e6
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run exact A40 dependency closure audit
        id: audit
        continue-on-error: true
        run: |
          python tech-assets/moises-audio/Separation/Evaluation/lane1_dependency_audit.py \
            --expected-git-head 6514ab8eea1570c18e75f012254db48c3a0418e6 \
            --timeout-seconds 300 \
            --output /tmp/l1-a40-audit.json
          rc=$?
          cat /tmp/l1-a40-audit.json
          exit $rc
      - name: Identify differential_common contaminator
        if: always()
        run: |
          python - <<'PY'
          import importlib
          import pathlib
          import sys
          import traceback

          root = pathlib.Path.cwd() / 'tech-assets/moises-audio/Separation'
          tests = root / 'Tests'
          for path in (root / 'Server', root / 'Evaluation', tests):
              sys.path.insert(0, str(path))

          missing = object()
          previous = sys.modules.get('differential_common', missing)
          print('INITIAL', previous is missing)
          for file in sorted(tests.glob('test_*.py')):
              name = file.stem
              try:
                  importlib.import_module(name)
              except Exception:
                  print('IMPORT_ERROR', name)
                  traceback.print_exc()
                  break
              current = sys.modules.get('differential_common', missing)
              if current is not previous:
                  print(
                      'MODULE_CHANGE', name,
                      'id=', id(current) if current is not missing else None,
                      'file=', getattr(current, '__file__', None) if current is not missing else None,
                      'validate_plan=', hasattr(current, 'validate_plan') if current is not missing else None,
                      'validate_run=', hasattr(current, 'validate_run') if current is not missing else None,
                  )
                  previous = current
          PY
      - name: Direct unittest traceback diagnostic
        if: always()
        run: |
          export PYTHONPATH="$PWD/tech-assets/moises-audio/Separation/Server:$PWD/tech-assets/moises-audio/Separation/Evaluation:$PWD/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          python -m unittest discover \
            -s tech-assets/moises-audio/Separation/Tests \
            -p 'test_*.py' 2>&1 | tee /tmp/l1-a40-unittest.log
          exit 0
      - name: Enforce exact audit result
        if: always()
        run: |
          python - <<'PY'
          import json
          with open('/tmp/l1-a40-audit.json', encoding='utf-8') as f:
              report = json.load(f)
          print('overall_state=', report['overall_state'])
          raise SystemExit(0 if report['overall_state'] == 'PASS' else 1)
          PY
