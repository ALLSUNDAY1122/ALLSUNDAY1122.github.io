name: Coordinator B Minabe Hiji Generate Temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.head_ref == 'coord/central-west-release-minabe-hiji-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: coord/central-west-release-minabe-hiji-20260724
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import regional snapshots
        run: |
          git fetch origin region/central:refs/remotes/origin/region/central
          git fetch origin region/west:refs/remotes/origin/region/west
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const root = process.cwd();
          const project = path.join(root, 'jichitai-compare');
          const serviceIds = JSON.parse(fs.readFileSync(path.join(project, 'data/service-definitions.json'), 'utf8')).services.map((item) => item.id);
          const targets = [
            { code: '30391', prefectureCode: '30', ref: 'origin/region/central', region: 'central', mode: 'update', sourcePullRequestNumber: 1679 },
            { code: '44341', prefectureCode: '44', ref: 'origin/region/west', region: 'west', mode: 'add', sourcePullRequestNumber: 1680 }
          ];
          const show = (ref, repoPath) => JSON.parse(execFileSync('git', ['show', `${ref}:${repoPath}`], { encoding: 'utf8' }));
          const write = (repoPath, value) => {
            const full = path.join(root, repoPath);
            fs.mkdirSync(path.dirname(full), { recursive: true });
            fs.writeFileSync(full, `${JSON.stringify(value, null, 2)}\n`);
          };
          const municipalities = [];
          for (const target of targets) {
            const municipalityPath = `jichitai-compare/data/municipalities/${target.prefectureCode}/${target.code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${target.code}.json`;
            const municipality = show(target.ref, municipalityPath);
            const sourceTask = show(target.ref, taskPath);
            const services = serviceIds.map((id) => municipality.services?.[id]);
            if (services.some((service) => !service || !['verified', 'unavailable'].includes(service.status))) throw new Error(`${target.code}: 9制度が未完了です`);
            municipality.status = 'verified';
            municipality.updatedAt = '2026-07-24';
            const task = {
              ...sourceTask,
              status: 'merged',
              currentService: null,
              nextServiceIndex: 9,
              completedServices: [...serviceIds],
              verifiedCount: services.filter((service) => service.status === 'verified').length,
              researchingCount: 0,
              unavailableCount: services.filter((service) => service.status === 'unavailable').length,
              needsMediumReviewCount: 0,
              pullRequestNumber: null,
              lastCheckedAt: '2026-07-24',
              lastUpdatedAt: '2026-07-24T04:35:00+09:00',
              lastUpdatedBy: '統括B全国統合',
              officialSources: [...new Set(services.map((service) => service.source?.url).filter((url) => /^https:\/\//.test(url ?? ''))) ],
              blockers: []
            };
            write(municipalityPath, municipality);
            write(taskPath, task);
            municipalities.push({ region: target.region, team: task.assignedTeam, code: target.code, name: municipality.name, prefecture: municipality.prefecture, mode: target.mode, sourcePullRequestNumber: target.sourcePullRequestNumber });
          }
          write('jichitai-compare/operations/control/coord-b-release-minabe-hiji-20260724.json', {
            schemaVersion: '1.0.0',
            createdAt: '2026-07-24T04:35:00+09:00',
            previousPublishedMunicipalities: 1162,
            addedMunicipalities: 1,
            updatedMunicipalities: 1,
            byRegion: { central: 1, west: 1 },
            municipalities,
            excludedCount: 0,
            excluded: []
          });
          NODE

      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          if (progress.registeredMunicipalities !== 1163) throw new Error(`公開自治体数が想定外です: ${progress.registeredMunicipalities}`);
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/\d+自治体・9制度/u, `${progress.registeredMunicipalities}自治体・9制度`);
          fs.writeFileSync('index.html', html);
          NODE
          npm run validate:generated

      - name: Commit generated release
        run: |
          git add \
            jichitai-compare/data/municipalities/30/30391.json \
            jichitai-compare/operations/tasks/30391.json \
            jichitai-compare/data/municipalities/44/44341.json \
            jichitai-compare/operations/tasks/44341.json \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/control/coord-b-release-minabe-hiji-20260724.json
          git commit -m "release: みなべ町更新・日出町追加を1163自治体へ反映"
          git push origin HEAD:coord/central-west-release-minabe-hiji-20260724
