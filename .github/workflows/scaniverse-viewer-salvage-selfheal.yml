name: Scaniverse Viewer Salvage Self-Heal Patch
on:
  push:
    branches: [feature/splat-post-build17-p1]
    paths: [.github/scaniverse-viewer-salvage-selfheal-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Patch last-resort viewer salvage durability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('splat-native-ios/SplatNative/SplatViewerState.swift')
          text = source.read_text()
          old = '''        if let primaryData = partiallyCorruptPrimaryData,
           let salvaged = SplatEditSettings.salvagingPartiallyCorruptJSON(primaryData) {
            return (salvaged, false)
        }
'''
          new = '''        if let primaryData = partiallyCorruptPrimaryData,
           let salvaged = SplatEditSettings.salvagingPartiallyCorruptJSON(primaryData) {
            // No healthy backup exists, but at least one field from the newest generation survived.
            // Persist the normalized salvage immediately so the corrupt primary is not reparsed on
            // every open. `save` also seeds a new known-good backup when none exists, turning this
            // one-time last-resort recovery back into the normal durable two-generation state.
            if writeDestinationIsSafeOrMissing(at: primary, fileManager: fileManager) {
                try? save(salvaged, sourceURL: sourceURL, fileManager: fileManager)
            }
            return (salvaged, false)
        }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one salvage block, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('splat-native-ios/SplatNativeTests/SplatViewerPartialCorruptionTests.swift')
          t = test.read_text()
          old_t = '''        XCTAssertEqual(loaded.settings.cropXMin, 0, accuracy: 0.0001)
        XCTAssertEqual(loaded.settings.cropXMax, 1, accuracy: 0.0001)
    }
'''
          new_t = '''        XCTAssertEqual(loaded.settings.cropXMin, 0, accuracy: 0.0001)
        XCTAssertEqual(loaded.settings.cropXMax, 1, accuracy: 0.0001)

        // Last-resort salvage should be a one-time recovery. Reopening must decode the repaired
        // primary normally, and save() should have established a healthy backup generation too.
        let reopened = try XCTUnwrap(SplatViewerEditStore.load(sourceURL: source))
        XCTAssertFalse(reopened.recoveredFromBackup)
        XCTAssertEqual(reopened.settings, loaded.settings)
        XCTAssertTrue(fileManager.fileExists(atPath: SplatViewerEditStore.backupURL(for: source).path))
    }
'''
          if t.count(old_t) != 1:
              raise SystemExit(f'expected exactly one weak-salvage test tail, found {t.count(old_t)}')
          test.write_text(t.replace(old_t, new_t))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatViewerState.swift splat-native-ios/SplatNativeTests/SplatViewerPartialCorruptionTests.swift
          git diff --cached --check
          git commit -m 'Self-heal last-resort viewer edit salvage'
          git push origin HEAD:feature/splat-post-build17-p1
