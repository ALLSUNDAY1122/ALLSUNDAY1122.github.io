name: Temporary West B Housing Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-housing-public-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/west-b-housing-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const correctionPath = path.join(root, 'operations/audits/west-b-housing-classification-corrections-20260725.json');
          const correction = JSON.parse(fs.readFileSync(correctionPath, 'utf8'));
          const codes = correction.corrections.map((item) => item.code);
          const targets = codes.map((code) => {
            const pref = code.slice(0, 2);
            const municipality = JSON.parse(fs.readFileSync(path.join(root, 'data/municipalities', pref, `${code}.json`), 'utf8'));
            const service = municipality.services.housingSupport;
            return { code, name: municipality.name, status: service.status, summary: service.summary, source: service.source.url };
          });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const outputPath = path.join(root, 'operations/audits/west-b-housing-public-verification-20260725.json');
          let finalResult = null;

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const cache = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const response = await fetch(`${base}/municipality/${target.code}/?audit=${cache}`, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(25000),
                  headers: { 'user-agent': 'WestBHousingPublicVerification/1.0' }
                });
                const text = await response.text();
                const unavailableLabelMatches = target.status === 'unavailable' ? text.includes('公式情報で詳細未確認') : null;
                const success = response.ok && text.includes(target.summary) && text.includes(target.source) && (target.status !== 'unavailable' || unavailableLabelMatches === true);
                pageChecks.push({ code: target.code, name: target.name, expectedStatus: target.status, url: response.url, httpStatus: response.status, summaryMatches: text.includes(target.summary), sourceMatches: text.includes(target.source), unavailableLabelMatches, success });
              } catch (error) {
                pageChecks.push({ code: target.code, name: target.name, expectedStatus: target.status, httpStatus: null, success: false, error: String(error) });
              }
            }

            let generated = { success: false };
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${cache}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(45000),
                headers: { 'user-agent': 'WestBHousingPublicVerification/1.0' }
              });
              const payload = JSON.parse(await response.text());
              const municipalities = Array.isArray(payload) ? payload : Array.isArray(payload.municipalities) ? payload.municipalities : Array.isArray(payload.items) ? payload.items : [];
              const checks = targets.map((target) => {
                const municipality = municipalities.find((item) => String(item.code) === target.code);
                const service = municipality?.services?.housingSupport;
                const success = Boolean(municipality) && service?.status === target.status && service?.summary === target.summary && service?.source?.url === target.source;
                return { code: target.code, found: Boolean(municipality), expectedStatus: target.status, statusMatches: service?.status === target.status, summaryMatches: service?.summary === target.summary, sourceMatches: service?.source?.url === target.source, success };
              });
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services ?? {}).length, 0);
              generated = {
                httpStatus: response.status,
                municipalityCount: municipalities.length,
                serviceCount,
                municipalityCount1741: municipalities.length === 1741,
                serviceCount15669: serviceCount === 15669,
                unavailableCount: checks.filter((item) => item.expectedStatus === 'unavailable' && item.success).length,
                verifiedCount: checks.filter((item) => item.expectedStatus === 'verified' && item.success).length,
                checks,
                success: response.ok && municipalities.length === 1741 && serviceCount === 15669 && checks.every((item) => item.success)
              };
            } catch (error) {
              generated = { success: false, error: String(error) };
            }

            const success = pageChecks.every((item) => item.success) && generated.success;
            finalResult = {
              schemaVersion: '1.0.0',
              auditId: 'west-b-housing-public-verification-20260725',
              generatedAt: new Date().toISOString(),
              attempt,
              targetCount: targets.length,
              expectedUnavailableCount: 21,
              expectedVerifiedCount: 3,
              sourceEvidencePullRequest: 3641,
              regionalCorrectionPullRequest: 3662,
              regionalStatePullRequest: 3664,
              nationalSyncPullRequest: 3666,
              verificationPullRequest: Number(process.env.PR_NUMBER),
              verificationWorkflowRunId: Number(process.env.RUN_ID),
              pageChecks,
              publicGeneratedJson: generated,
              success,
              releaseBlocker: success ? 'none' : 'public_mismatch'
            };
            fs.writeFileSync(outputPath, JSON.stringify(finalResult, null, 2) + '\n');
            if (success) break;
            await sleep(10000);
          }
          NODE

      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/west-b-housing-public-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/west-b-housing-public-verification-20260725.json \
            jichitai-compare/operations/control/west-b-housing-public-trigger-20260725.json
          git commit -m 'audit: 西日本B住宅支援24件の公開反映を確認'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Enforce verification result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/west-b-housing-public-verification-20260725.json', 'utf8'));
          if (!result.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({success: result.success, targetCount: result.targetCount, attempt: result.attempt, releaseBlocker: result.releaseBlocker}, null, 2));
          NODE
