name: Coordinator B Central West Delta 0646

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.head_ref == 'coord/central-west-delta-20260724-0646' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/central-west-delta-20260724-0646
          fetch-depth: 0
      - name: Configure and fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git fetch origin region/central:refs/remotes/origin/region/central
          git fetch origin region/west:refs/remotes/origin/region/west
      - name: Import fixed completed delta
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const root = process.cwd();
          const project = path.join(root, 'jichitai-compare');
          const serviceIds = JSON.parse(fs.readFileSync(path.join(project, 'data/service-definitions.json'), 'utf8')).services.map((x) => x.id);
          const timestamp = '2026-07-24T06:46:00+09:00';
          const targets = [
            { code: '26210', pref: '26', ref: 'origin/region/central', region: 'central', mode: 'update', pr: 1922 },
            { code: '40341', pref: '40', ref: 'origin/region/west', region: 'west', mode: 'add', pr: 1918 },
            { code: '40342', pref: '40', ref: 'origin/region/west', region: 'west', mode: 'add', pr: 1926 },
            { code: '45402', pref: '45', ref: 'origin/region/west', region: 'west', mode: 'add', pr: 1921 }
          ];
          const git = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const showJson = (ref, p) => JSON.parse(git(['show', `${ref}:${p}`]));
          const exists = (ref, p) => { try { execFileSync('git', ['cat-file', '-e', `${ref}:${p}`], { stdio: 'ignore' }); return true; } catch { return false; } };
          const writeJson = (p, value) => { const full = path.join(root, p); fs.mkdirSync(path.dirname(full), { recursive: true }); fs.writeFileSync(full, `${JSON.stringify(value, null, 2)}\n`); };
          const progress = JSON.parse(fs.readFileSync(path.join(project, 'operations/progress.json'), 'utf8'));
          if (progress.registeredMunicipalities !== 1360) throw new Error(`基点変化: ${progress.registeredMunicipalities}`);
          const items = [];
          for (const t of targets) {
            const municipalityPath = `jichitai-compare/data/municipalities/${t.pref}/${t.code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${t.code}.json`;
            if (t.mode === 'add' && exists('origin/main', municipalityPath)) throw new Error(`${t.code}: mainに既存`);
            if (t.mode === 'update' && !exists('origin/main', municipalityPath)) throw new Error(`${t.code}: mainに更新元なし`);
            const municipality = showJson(t.ref, municipalityPath);
            const sourceTask = showJson(t.ref, taskPath);
            const services = serviceIds.map((id) => municipality.services?.[id]);
            if (services.some((s) => !s || !['verified', 'unavailable'].includes(s.status))) throw new Error(`${t.code}: 未完了制度あり`);
            municipality.status = 'verified';
            municipality.updatedAt = '2026-07-24';
            const verifiedCount = services.filter((s) => s.status === 'verified').length;
            const unavailableCount = services.filter((s) => s.status === 'unavailable').length;
            const task = {
              ...sourceTask,
              status: 'merged', currentService: null, nextServiceIndex: serviceIds.length,
              completedServices: [...serviceIds], verifiedCount, researchingCount: 0, unavailableCount,
              needsMediumReviewCount: 0, pullRequestNumber: null, lastCheckedAt: '2026-07-24',
              lastUpdatedAt: timestamp, lastUpdatedBy: '統括B全国差分統合',
              officialSources: [...new Set(services.map((s) => s.source?.url).filter((u) => /^https:\/\//.test(u ?? '')))], blockers: []
            };
            writeJson(municipalityPath, municipality);
            writeJson(taskPath, task);
            items.push({ region: t.region, team: task.assignedTeam, code: t.code, name: municipality.name, prefecture: municipality.prefecture, mode: t.mode, verifiedCount, unavailableCount, sourcePullRequestNumber: t.pr });
          }
          writeJson('jichitai-compare/operations/control/coord-b-delta-20260724-0646.json', {
            schemaVersion: '1.0.0', createdAt: timestamp, baseMainSha: git(['rev-parse', 'origin/main']),
            centralSha: git(['rev-parse', 'origin/region/central']), westSha: git(['rev-parse', 'origin/region/west']),
            previousPublishedMunicipalities: 1360, addedMunicipalities: 3, updatedMunicipalities: 1,
            expectedPublishedMunicipalities: 1363, municipalities: items, excludedCount: 0, excluded: []
          });
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          if (p.registeredMunicipalities !== 1363) throw new Error(`自治体数 ${p.registeredMunicipalities}`);
          if (p.completedServices !== 12267) throw new Error(`制度数 ${p.completedServices}`);
          if (p.needsMediumReviewServices || p.needsRevisionServices || p.needsCoordinatorServices || p.blockedServices) throw new Error('未完了混入');
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/\d+自治体・9制度/u, '1363自治体・9制度');
          fs.writeFileSync('index.html', html);
          NODE
          npm run validate:generated
      - name: Commit release
        run: |
          git add jichitai-compare/data/municipalities/26/26210.json jichitai-compare/operations/tasks/26210.json jichitai-compare/data/municipalities/40/40341.json jichitai-compare/operations/tasks/40341.json jichitai-compare/data/municipalities/40/40342.json jichitai-compare/operations/tasks/40342.json jichitai-compare/data/municipalities/45/45402.json jichitai-compare/operations/tasks/45402.json jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html jichitai-compare/operations/control/coord-b-delta-20260724-0646.json
          git commit -m "release: 八幡市更新・宇美町・篠栗町・新富町を全国反映"
          git push origin HEAD:coord/central-west-delta-20260724-0646
