name: Temporary Generate Public 374 20260722 1257 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-374-20260722-1257.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-374-20260722-1257
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public data
        run: |
          set -euxo pipefail
          git fetch origin main
          git reset --hard origin/main
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('364自治体') != 2:
              raise SystemExit(f'unexpected 364 count: {s.count("364自治体")}')
          s=s.replace('364自治体','374自治体')
          p.write_text(s,encoding='utf-8')
          PY
          npm run validate:generated
          cd ..
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          mapfile -t actual < <(git diff --cached --name-only | sort)
          expected=(
            jichitai-compare/data/generated/municipalities.json
            jichitai-compare/index.html
            jichitai-compare/operations/progress.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test "${#actual[@]}" -eq 3
          python3 - <<'PY'
          import json
          p=json.load(open('jichitai-compare/operations/progress.json',encoding='utf-8'))
          assert p['registeredMunicipalities']==374,p['registeredMunicipalities']
          assert p['mergedMunicipalities']==374,p['mergedMunicipalities']
          assert p['prOpenMunicipalities']==0,p['prOpenMunicipalities']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データを374自治体へ同期'
          git push --force-with-lease origin HEAD:coord/generated-374-20260722-1257
