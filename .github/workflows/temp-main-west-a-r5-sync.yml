name: Temporary main sync for West-A audit round 5

on:
  push:
    branches:
      - 'audit/main-west-a-r5-kirishima-correction-r2'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[west-a-r5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync regional correction and regenerate public data
        run: |
          git fetch origin region/west
          git checkout origin/region/west -- \
            jichitai-compare/data/municipalities/46/46218.json \
            jichitai-compare/operations/tasks/46218.json \
            jichitai-compare/operations/audits/west-a-research-verification-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/west-a.json
          cd jichitai-compare
          npm run generate
          npm run progress
      - name: Commit nationwide correction and audit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m '[west-a-r5-applied] audit: sync Kirishima correction and West-A verification 5 of 10'
          git push
