name: Scaniverse S11 Apply

on:
  push:
    branches:
      - scaniverse/s11-physical-diagnostics
    paths:
      - .github/workflows/scaniverse-s11-apply.yml
      - splat-native-ios/scripts/apply_s11_physical_diagnostics.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scaniverse/s11-physical-diagnostics
      - name: Apply diagnostic patch
        run: python3 splat-native-ios/scripts/apply_s11_physical_diagnostics.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splat-native-ios/SplatNative/SplatResourceGuard.swift splat-native-ios/SplatNative/ScanModel.swift splat-native-ios/SplatNative/RootScanView.swift
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(scaniverse): expose reconstruction stop diagnostics"
          git push origin HEAD:scaniverse/s11-physical-diagnostics
