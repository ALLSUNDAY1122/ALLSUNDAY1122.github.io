name: Tsukanshi release foundation

on:
  push:
    paths:
      - 'tsukanshi-sprint/**'
      - 'codemagic.yaml'
      - '.github/workflows/tsukanshi-release-foundation.yml'
      - '.github/workflows/tsukanshi-xcode-build.yml'
  pull_request:
    paths:
      - 'tsukanshi-sprint/**'
      - 'codemagic.yaml'
      - '.github/workflows/tsukanshi-release-foundation.yml'
      - '.github/workflows/tsukanshi-xcode-build.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Re-run content release gates
        run: |
          node tsukanshi-sprint/validate-content.mjs
          node tsukanshi-sprint/validate-editorial-final.mjs
      - name: Validate JavaScript, Python and shell syntax
        run: |
          node --check tsukanshi-sprint/validate-apple-preflight.mjs
          python3 -m py_compile tsukanshi-sprint/ios/apply-xcode-capabilities.py
          bash -n tsukanshi-sprint/native-ios/prepare-native.sh
      - name: Validate native privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib
          with open('tsukanshi-sprint/native-ios/PrivacyInfo.xcprivacy','rb') as f: data=plistlib.load(f)
          assert data['NSPrivacyTracking'] is False
          assert data['NSPrivacyCollectedDataTypes']==[]
          print('PASS: native PrivacyInfo.xcprivacy')
          PY
      - name: Validate Pure SwiftUI release configuration
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.tsukanshi' tsukanshi-sprint/native-ios/project.yml
          grep -q 'MARKETING_VERSION: 1.0.0' tsukanshi-sprint/native-ios/project.yml
          grep -q 'com.apple.InAppPurchase' tsukanshi-sprint/ios/apply-xcode-capabilities.py
          ! grep -R -n -E 'WKWebView|import WebKit|UIViewRepresentable' tsukanshi-sprint/native-ios --include='*.swift'
          test -f tsukanshi-sprint/native-ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test "$(sha256sum tsukanshi-sprint/native-ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '{print $1}')" = 'ff9fd508930e8728ef54907ec64a7835dcffb69a1a773edc645b79715fbfccaa'
      - name: Validate public submission pages and metadata
        run: |
          test -f tsukanshi-sprint/support.html
          test -f tsukanshi-sprint/privacy.html
          test -f tsukanshi-sprint/APP_STORE_METADATA_JA.md
          test -f tsukanshi-sprint/APP_REVIEW_NOTES_JA.md
          test -f tsukanshi-sprint/APPLE_CONNECT_PACKET.md
          grep -q 'jp.allsunday1122.tsukanshi.premium' tsukanshi-sprint/APP_STORE_METADATA_JA.md
          grep -q '本アプリは税関・財務省の公式アプリではありません' tsukanshi-sprint/APP_STORE_METADATA_JA.md
      - name: Validate Apple signing and TestFlight preflight contract
        run: node tsukanshi-sprint/validate-apple-preflight.mjs
      - name: Validate canonical Codemagic safety gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('codemagic.yaml').read_text(encoding='utf-8')
          marker='\n  tsukanshi-native-ios:'; start=text.find(marker); assert start>=0
          rest=text[start+len(marker):]; m=re.search(r'\n  [A-Za-z0-9_-]+:\s*\n',rest); block=rest[:m.start()] if m else rest
          for token in ['app_store_connect: "Codemagic Shiwake Swipe"','provisioning_profiles:','- tsukanshi_appstore','BUNDLE_ID: jp.allsunday1122.tsukanshi','TsukanshiNative.xcodeproj','apply-xcode-capabilities.py','testFlightInternalTestingOnly','submit_to_testflight: false','submit_to_app_store: false']:
              assert token in block, token
          assert 'submit_to_testflight: true' not in block and 'submit_to_app_store: true' not in block
          print('PASS: canonical Pure SwiftUI Codemagic release contract')
          PY
