name: Temporary West B Housing Classification Crosscheck

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-housing-crosscheck-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-b-housing-crosscheck-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-housing-crosscheck-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate housing classification candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare/data/municipalities';
          const prefectureCodes = ['31','32','34','35','36','38','41','42','44','45','47'];
          const childTerms = /(子育て|子ども|こども|児童|18歳|高校生|中学生|小学生|未就学|多子|ひとり親|若年夫婦|若者夫婦|新婚|婚姻|結婚新生活|妊婦|妊娠|出産|三世代|同居|扶養)/;
          const genericTerms = /(移住|定住|空き家|住宅取得|新築|購入|改修|リフォーム|家賃|賃貸|引越|転入|中古住宅)/;
          const currentTerms = /(令和8|2026|令和7年度から継続|2026年度)/;
          const oldTerms = /(令和6年度|令和5年度|2024年度|2023年度|令和6年3月|令和5年3月)/;
          const statusCounts = {};
          const candidates = [];
          for (const pref of prefectureCodes) {
            const dir = path.join(root, pref);
            for (const name of fs.readdirSync(dir).filter(v => v.endsWith('.json')).sort()) {
              const filePath = path.join(dir, name);
              const municipality = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              const service = municipality.services?.housingSupport;
              if (!service) continue;
              const status = service.status || 'other';
              statusCounts[status] = (statusCounts[status] || 0) + 1;
              const text = JSON.stringify({summary: service.summary, details: service.details, source: service.source, additionalSources: service.additionalSources});
              const reasons = [];
              const hasChild = childTerms.test(text);
              const hasGeneric = genericTerms.test(text);
              if (status === 'verified' && !hasChild) reasons.push('verified_without_explicit_child_or_family_condition');
              if (status === 'verified' && hasGeneric && !hasChild) reasons.push('generic_migration_or_housing_program_may_be_misclassified');
              if (status === 'verified' && !service.details?.target && !service.details?.conditions && !service.details?.eligibility) reasons.push('verified_missing_target_or_condition');
              if (status === 'verified' && oldTerms.test(text) && !currentTerms.test(text)) reasons.push('source_or_description_appears_pre_2025_without_current_basis');
              if (status === 'unavailable' && hasChild && hasGeneric) reasons.push('unavailable_contains_child_specific_housing_language');
              if (status === 'unavailable' && service.source?.url && /(support|subsid|hojo|jyosei|teiju|iju|sumai|jutaku|house|akiya)/i.test(service.source.url)) reasons.push('unavailable_has_direct_looking_housing_source');
              if (reasons.length) {
                candidates.push({
                  code: municipality.code,
                  prefectureCode: municipality.prefectureCode,
                  prefecture: municipality.prefecture,
                  name: municipality.name,
                  status,
                  summary: service.summary,
                  details: service.details ?? null,
                  source: service.source ?? null,
                  additionalSources: service.additionalSources ?? [],
                  classificationSignals: {hasChildOrFamilyCondition: hasChild, hasGenericHousingTerms: hasGeneric},
                  reasons
                });
              }
            }
          }
          const reasonCounts = {};
          for (const candidate of candidates) for (const reason of candidate.reasons) reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
          const output = {
            schemaVersion: '1.0.0',
            auditId: 'west-b-housing-classification-crosscheck-20260725',
            sessionId: 'west-b',
            generatedAt: new Date().toISOString(),
            scope: {prefectureCodes, municipalityCount: Object.values(statusCounts).reduce((a,b)=>a+b,0), serviceId: 'housingSupport', statusCounts},
            classificationRule: '子育て世帯・子ども・若年夫婦・新婚等の明示要件がない一般移住、一般住宅取得、一般リフォーム、一般空き家施策を子育て世帯向け住宅支援として扱わない',
            candidateCount: candidates.length,
            reasonCounts,
            candidates,
            result: {status: 'mechanical_candidates_generated_pending_official_review', confirmedCorrectionCount: null, unresolvedConfirmedErrorCount: null}
          };
          const outPath = 'jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json';
          fs.mkdirSync(path.dirname(outPath), {recursive: true});
          fs.writeFileSync(outPath, JSON.stringify(output, null, 2) + '\n');
          NODE
      - name: Commit audit candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json
          git commit -m 'audit: 西日本B住宅支援分類候補を生成'
          git push origin HEAD:audit/west-b-housing-crosscheck-20260725
