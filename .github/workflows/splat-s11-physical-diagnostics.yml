name: Splat S11 Physical Diagnostics Contract

on:
  push:
    branches:
      - scaniverse/s11-physical-diagnostics
    paths:
      - .github/workflows/splat-s11-physical-diagnostics.yml
      - splat-native-ios/SplatNative/SplatResourceGuard.swift
      - splat-native-ios/SplatNative/ScanModel.swift
      - splat-native-ios/SplatNative/RootScanView.swift
      - splat-native-ios/SplatNative/SplatReconstructionPolicy.swift
      - splat-native-ios/SplatNativeTests/SplatPhysicalDiagnosticTests.swift
      - splat-native-ios/scripts/test_s11_physical_diagnostics.py
  pull_request:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - .github/workflows/splat-s11-physical-diagnostics.yml
      - splat-native-ios/SplatNative/SplatResourceGuard.swift
      - splat-native-ios/SplatNative/ScanModel.swift
      - splat-native-ios/SplatNative/RootScanView.swift
      - splat-native-ios/SplatNative/SplatReconstructionPolicy.swift
      - splat-native-ios/SplatNativeTests/SplatPhysicalDiagnosticTests.swift
      - splat-native-ios/scripts/test_s11_physical_diagnostics.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reason-specific physical diagnostics and protected quality
        run: python3 splat-native-ios/scripts/test_s11_physical_diagnostics.py
