name: Otsu4 RC Integration Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: otsu4-rc-integration-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[OTS4-RC] Repair ASC integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Guard and repair only Otsu4 RC integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('codemagic.yaml')
          text=path.read_text(encoding='utf-8')
          cfg=yaml.safe_load(text) or {}
          wf=(cfg.get('workflows') or {}).get('otsu4-ios')
          assert wf, 'otsu4-ios workflow missing'
          integ=((wf.get('integrations') or {}).get('app_store_connect'))
          assert integ in {'codemagic','Codemagic Shiwake Swipe'}, integ
          signing=((wf.get('environment') or {}).get('ios_signing') or {})
          assert signing.get('distribution_type')=='app_store'
          assert signing.get('bundle_identifier')=='jp.allsunday1122.otsu4'
          pub=((wf.get('publishing') or {}).get('app_store_connect') or {})
          assert pub.get('submit_to_testflight') is False
          assert pub.get('submit_to_app_store') is False
          start=text.index('\n  otsu4-ios:')
          nxt=text.find('\n  ',start+3)
          while nxt!=-1 and text[nxt:nxt+3]=='\n  ' and not text[nxt+3:nxt+4].isalnum():
              nxt=text.find('\n  ',nxt+3)
          if nxt==-1: nxt=len(text)
          block=text[start:nxt]
          if 'app_store_connect: codemagic' in block:
              block=block.replace('app_store_connect: codemagic','app_store_connect: "Codemagic Shiwake Swipe"',1)
              text=text[:start]+block+text[nxt:]
              path.write_text(text,encoding='utf-8')
          cfg2=yaml.safe_load(path.read_text(encoding='utf-8')) or {}
          wf2=(cfg2.get('workflows') or {}).get('otsu4-ios') or {}
          assert ((wf2.get('integrations') or {}).get('app_store_connect'))=='Codemagic Shiwake Swipe'
          pub2=((wf2.get('publishing') or {}).get('app_store_connect') or {})
          assert pub2.get('submit_to_testflight') is False and pub2.get('submit_to_app_store') is False
          print('PASS: Otsu4 RC uses confirmed ASC integration and remains no-upload/no-submit')
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- codemagic.yaml; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'fix(otsu4): use confirmed Codemagic ASC integration'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 RC integration repair finished. status=${{ job.status }}; run_id=${context.runId}. No Codemagic build, TestFlight upload, or App Store submission was performed.`});
