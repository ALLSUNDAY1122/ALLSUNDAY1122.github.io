name: Splat HQ memory budget

on:
  push:
    branches: [automation/splat-memory-budget-20260920]
    paths: ['.github/workflows/splat-hq-memory-budget.yml']

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/splat-memory-budget-20260920
          fetch-depth: 0
      - name: Patch low-memory budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('splat-native-ios/SplatNative/SplatResourceGuard.swift')
          s=p.read_text()
          old='''        let splatBudget = max(300_000, min(900_000, Int(memoryBudget / UInt64(perSplatBytes * 2))))'''
          new='''        // Never force a 300k floor above the modeled memory budget on lower-memory devices.\n        // A 50k floor keeps a usable preview while allowing the trainer to stay inside the same\n        // conservative resident-memory envelope that the runtime guard enforces.\n        let splatBudget = max(50_000, min(900_000, Int(memoryBudget / UInt64(perSplatBytes * 2))))'''
          if s.count(old)!=1: raise SystemExit('resource budget anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('splat-native-ios/SplatNativeTests/SplatS12ResourceGuardTests.swift')
          s=p.read_text()
          old='XCTAssertGreaterThanOrEqual(limits.maxSplatCount, 300_000)'
          if s.count(old)!=1: raise SystemExit('existing expectation anchor mismatch')
          s=s.replace(old,'XCTAssertGreaterThanOrEqual(limits.maxSplatCount, 50_000)',1)
          insert='''\n    func testLowMemoryDeviceDoesNotForceSplatFloorAboveBudget() {\n        let limits = SplatResourceLimits.conservative(physicalMemoryBytes: 2 * 1024 * 1024 * 1024)\n        let modeledSplatBytes = UInt64(limits.maxSplatCount) * UInt64(SplatResourceLimits.estimatedBytesPerSplat) * 2\n        XCTAssertLessThanOrEqual(modeledSplatBytes, limits.memoryBudgetBytes)\n        XCTAssertGreaterThanOrEqual(limits.maxSplatCount, 50_000)\n    }\n'''
          idx=s.rfind('\n}')
          if idx<0: raise SystemExit('test class close not found')
          s=s[:idx]+insert+s[idx:]
          p.write_text(s)
          PY
      - name: Verify build and tests
        run: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          cd splat-native-ios
          xcodegen generate
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Commit verified memory budget
        run: |
          set -euo pipefail
          git config user.name 'Splat HQ'
          git config user.email 'actions@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatResourceGuard.swift splat-native-ios/SplatNativeTests/SplatS12ResourceGuardTests.swift
          git commit -m 'fix(splat): keep low-memory splat budget within envelope'
          git push origin HEAD:automation/splat-memory-budget-20260920