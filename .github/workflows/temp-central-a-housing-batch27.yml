name: Temporary Central A Housing Batch 27

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch27-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch27-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record housing classification batch 27
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T15:30:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const targets=[
            {code:'23214',name:'蒲郡市',decisionType:'current_newlywed_housing_verified_maintained',source:'https://www.city.gamagori.lg.jp/site/iijangamagori/kekkonshien.html',basis:'令和8年中に婚姻等をした39歳以下の夫婦等を対象とし、住宅取得・リフォーム・賃借・引越費を補助する現行制度を確認'},
            {code:'21203',name:'高山市',decisionType:'current_newlywed_housing_verified_maintained',source:'https://www.city.takayama.lg.jp/kurashi/1006064/1006088/1010738.html',basis:'令和8年1月1日から令和9年3月31日までに婚姻等をした39歳以下の世帯を対象とする現行制度を確認'},
            {code:'21204',name:'多治見市',decisionType:'current_newlywed_housing_verified_maintained',source:'https://www.city.tajimi.lg.jp/shisei/shisaku_keikaku/1007314/1007315.html',basis:'2026年1月1日から2027年3月31日までに入籍した39歳以下の夫婦を対象とする現行制度を確認'},
            {code:'21361',name:'垂井町',decisionType:'current_child_addition_verified_maintained',source:'https://www.town.tarui.lg.jp/site/townpromotion/6526.html',basis:'住宅取得20万円に加え、18歳以下の世帯員1人につき3万円を加算する子育て条件を確認'},
            {code:'23209',name:'碧南市',decisionType:'current_three_generation_child_household_verified_maintained',source:'https://www.city.hekinan.lg.jp/soshiki/kensetsu/kenchiku/kakuhojyo/18546.html',basis:'18歳以下の子どもと同居する子世帯を含む三世代同居・移住同居・近居制度を確認'}
          ];

          const reviewed=[];
          for(const target of targets){
            const pref=target.code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${target.code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${target.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const svc=municipality.services?.housingSupport;
            if(!svc || svc.status!=='verified') throw new Error(`${target.code}: housingSupport is not verified`);
            if(svc.source?.url!==target.source) throw new Error(`${target.code}: source mismatch ${svc.source?.url}`);
            svc.source.checkedAt=checkedAt;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第27群で公式利用者向けページを独立確認し、${target.decisionType}としてverified維持。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');

            reviewed.push({code:target.code,name:target.name,service:'housingSupport',decisionType:target.decisionType,statusBefore:'verified',statusAfter:'verified',summary:svc.summary,officialSource:target.source,officialBasis:target.basis,contentChanged:false});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch27-decisions-20260726',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:0,
            verifiedMaintainedCount:5,
            reviewed,
            mechanicalRescan:{pullRequestNumber:3877,workflowRunId:30190775077,candidateCount:48,note:'機械抽出は結婚新生活、18歳以下、三世代等を子育て・新婚条件として十分に除外できないため、authoritative queue countはcheckpointの44件を継承'},
            causeScan:{previousRemainingCandidates:44,reviewedHighRiskCandidates:5,remainingCandidates:39},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '結婚新生活支援は新婚世帯向け住宅支援としてverified対象に含める',
              '一般住宅制度でも18歳以下の子ども加算が明示される場合は子育て住宅支援としてverified対象に含める',
              '三世代制度は子世帯に18歳以下の子ども要件がある場合にverified対象に含める'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch27-decisions-20260726.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残39件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=189;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=621;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=39;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残39件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:27,status:'regional_reviewed_pending_national_sync',reviewedMunicipalityCount:5,confirmedCorrectionCount:0,verifiedMaintainedCount:5,remainingCandidates:39,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第27群として、蒲郡市・高山市・多治見市の新婚住宅支援、垂井町の18歳以下加算、碧南市の三世代子世帯要件を公式情報で再確認し、5件ともverifiedを維持した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch27-trigger-20260726.json');
          if(fs.existsSync(trigger)) fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/23/23214.json|jichitai-compare/data/municipalities/21/21203.json|jichitai-compare/data/municipalities/21/21204.json|jichitai-compare/data/municipalities/21/21361.json|jichitai-compare/data/municipalities/23/23209.json|jichitai-compare/operations/tasks/23214.json|jichitai-compare/operations/tasks/21203.json|jichitai-compare/operations/tasks/21204.json|jichitai-compare/operations/tasks/21361.json|jichitai-compare/operations/tasks/23209.json|jichitai-compare/operations/audits/central-a-housing-classification-batch27-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/23214/index.html|jichitai-compare/municipality/21203/index.html|jichitai-compare/municipality/21204/index.html|jichitai-compare/municipality/21361/index.html|jichitai-compare/municipality/23209/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch27-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援分類第27群を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
