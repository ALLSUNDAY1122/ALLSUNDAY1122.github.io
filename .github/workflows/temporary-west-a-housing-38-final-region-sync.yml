name: Temporary West A Housing 38 Final Region Sync

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-housing-38-final-region-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'checkpoint/west-a-housing-38-final-evidence-region-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout region branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Copy final main checkpoint files
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          for path in \
            jichitai-compare/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/west-a.json; do
            git show "origin/main:$path" > "$path"
          done
          rm -f jichitai-compare/operations/control/west-a-housing-38-final-region-sync-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-38-final-region-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/west-a.json \
                  jichitai-compare/operations/control/west-a-housing-38-final-region-sync-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-38-final-region-sync.yml
          git diff --cached --check
          git commit -m 'checkpoint: 西日本A住宅支援38件の最終証跡をregionへ同期'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
