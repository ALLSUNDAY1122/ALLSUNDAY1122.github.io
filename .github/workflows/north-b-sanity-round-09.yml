name: North B sanity audit round 09

on:
  push:
    branches:
      - 'audit/north-b-sanity-round-09-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[north-b-round09-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply round 09 correction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('jichitai-compare')
          checked = '2026-07-25'
          updated = '2026-07-25T04:01:00+09:00'
          order = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention']

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))
          def save(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 金山町: 通常の一時預かりに2026年度こども誰でも通園制度を追加
          mp = root / 'data/municipalities/06/06361.json'
          m = load(mp)
          s = m['services']['temporaryChildcare']
          old_source = s['source']['url']
          s['summary'] = '生後3か月から就学前児の一時預かりに加え、未就園の生後6か月から満3歳未満児が月10時間まで利用できるこども誰でも通園制度を実施する。'
          s['eligibility'] = {'minAgeMonths': 3, 'maxAgeYears': 5}
          s['details'] = {
              'temporaryCare': '地域子育て支援センターおひさまで、保育施設に在籍していない生後3か月から就学前までの子どもを平日8時30分から17時まで一時預かりする',
              'temporaryFee': '世帯区分により1時間0円、200円または400円',
              'anyChildTarget': '金山町民で、認定こども園・保育所・幼稚園等に通っていない生後6か月から満3歳未満の子ども。認可外保育施設利用児は対象となる',
              'anyChildFacility': '認定こども園めごたま',
              'anyChildHours': '平日8時から16時のうち施設と調整',
              'anyChildLimit': '子ども1人につき月10時間。未利用時間の翌月繰越なし',
              'anyChildFee': '1時間300円。給食費・おやつ代等が別途必要な場合があり、生活保護・非課税世帯等は減免対象',
              'anyChildApplication': '町へオンラインまたは書面で認定申請し、認定後に総合支援システムで事前面談と利用予約を行う'
          }
          s['source'] = {'url': 'https://www.town.kaneyama.yamagata.jp/machinososhiki/kenkofukushika/kosodateshienshitu/4/4627.html', 'checkedAt': checked}
          sources = s.get('additionalSources', [])
          if old_source != s['source']['url'] and all(x.get('url') != old_source for x in sources):
              sources.append({'url': old_source, 'checkedAt': checked})
          s['additionalSources'] = sources
          m['updatedAt'] = checked
          save(mp, m)

          # task
          tp = root / 'operations/tasks/06361.json'
          task = load(tp)
          statuses = [m['services'][k]['status'] for k in order]
          task['verifiedCount'] = statuses.count('verified')
          task['researchingCount'] = statuses.count('researching')
          task['unavailableCount'] = statuses.count('unavailable')
          task['needsMediumReviewCount'] = statuses.count('needs_medium_review')
          task['currentBranch'] = 'audit/north-b-sanity-round-09-20260725'
          task['pullRequestNumber'] = None
          task['lastCheckedAt'] = checked
          task['lastUpdatedAt'] = updated
          task['lastUpdatedBy'] = '北日本調査班B'
          task['officialSources'] = list(dict.fromkeys(m['services'][k]['source']['url'] for k in order))
          note = '北日本B誤調査ざっくり再検証 第9回: 2026年4月開始のこども誰でも通園制度が未反映だったため、対象、施設、月10時間上限、料金、申請方法を追加。'
          if note not in task['notes']:
              task['notes'].append(note)
          save(tp, task)

          # audit
          ap = root / 'operations/audits/north-b-research-sanity-20260725.json'
          audit = load(ap)
          audit['completedRounds'] = 9
          audit['remainingRounds'] = 1
          audit['auditedMunicipalityCount'] = 97
          audit['remainingMunicipalityCount'] = 10
          audit['auditedAt'] = updated
          audit['round09'] = {
              'codes': ['06302','06321','06322','06323','06324','06341','06361','06362','06363','06364'],
              'municipalityCount': 10,
              'serviceCount': 90,
              'highRiskChecks': 28,
              'confirmedErrorCount': 1,
              'confirmedErrors': [
                  {'code':'06361','municipality':'金山町','service':'temporaryChildcare','before':'通常の一時預かりのみ','after':'2026年度のこども誰でも通園制度を併記','reason':'2026年3月31日更新の町公式利用案内が未反映'}
              ],
              'evidenceLimitations': [
                  {'code':'06302','municipality':'中山町','service':'schoolMeals','note':'令和7年度無償化要綱は2026年5月31日で失効し、令和8年度の継続を直接確認できないためunavailableを維持'},
                  {'code':'06322','municipality':'西川町','service':'schoolMeals','note':'令和8年度予算に給食費負担軽減交付金を確認したが、対象範囲・保護者負担額・申請要否を利用者向け直接資料で確定できず変更しなかった'},
                  {'code':'06341','municipality':'大石田町','service':'schoolMeals','note':'令和8年度予算書・教育方針は公開されているが、全児童生徒向け無償化・一律補助の条件を直接確認できずunavailableを維持'},
                  {'code':'06362','municipality':'最上町','service':'schoolMeals','note':'教育長挨拶の公立小学校給食無償化は国全体の動向を示す記述で、町独自の対象・保護者負担を確定できず変更しなかった'},
                  {'code':'06363','municipality':'舟形町','service':'temporaryChildcare','note':'令和8年度の利用者向けこども誰でも通園制度案内を町公式サイトで取得できず、通常の一時保育情報を維持'},
                  {'code':'06363','municipality':'舟形町','service':'sickChildCare','note':'町公式支援一覧に病後児保育の存在はあるが、施設・対象年齢・料金・申込方法を確定できずunavailableを維持'}
              ],
              'noConfirmedErrorCodes': ['06302','06321','06322','06323','06324','06341','06362','06363','06364']
          }
          save(ap, audit)

          # checkpoint
          cp = root / 'operations/control/session-checkpoints/north-b.json'
          checkpoint = load(cp)
          checkpoint['updatedAt'] = updated
          checkpoint['workingBranch'] = 'audit/north-b-sanity-round-09-20260725'
          checkpoint['pullRequestNumber'] = None
          checkpoint['ciStatus'] = 'pending'
          checkpoint['nextAction'] = '北日本B誤調査ざっくり再検証第9回は10自治体・90制度、高リスク28項目を確認。金山町のこども誰でも通園制度を訂正。地域PR作成、CI、region/north統合、main同期を行う。監査完了9/10回・97/107自治体・残り10自治体。'
          save(cp, checkpoint)
          PY
      - name: Commit correction
        run: |
          rm .github/workflows/north-b-sanity-round-09.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare .github/workflows/north-b-sanity-round-09.yml
          git commit -m '[north-b-round09-apply] audit: apply North-B sanity round 09'
          git push
