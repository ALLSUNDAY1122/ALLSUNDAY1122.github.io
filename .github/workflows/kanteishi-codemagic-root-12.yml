name: Kanteishi Codemagic Root Setup

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-codemagic-root-12.yml

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0
      - name: Append staged Codemagic workflow
        run: |
          set -euo pipefail
          test -f kanteishi-shortanswer-sprint/codemagic-workflow-fragment.yml
          if ! grep -q '^  kanteishi-shortanswer-ios:' codemagic.yaml; then
            printf '\n' >> codemagic.yaml
            cat kanteishi-shortanswer-sprint/codemagic-workflow-fragment.yml >> codemagic.yaml
          fi
          grep -q '^  kanteishi-shortanswer-ios:' codemagic.yaml
          grep -q 'submit_to_testflight: true' codemagic.yaml
          grep -q 'submit_to_app_store: false' codemagic.yaml
          ruby -e "require 'yaml'; YAML.load_file('codemagic.yaml'); puts 'codemagic.yaml YAML PASS'"
      - name: Commit root workflow and remove bootstrap files
        run: |
          set -euo pipefail
          rm .github/workflows/kanteishi-codemagic-root-12.yml
          rm kanteishi-shortanswer-sprint/codemagic-workflow-fragment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(#12): prepare Codemagic Internal TestFlight workflow'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
