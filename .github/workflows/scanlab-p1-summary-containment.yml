name: Scan Lab P1 summary containment one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-summary-containment.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Keep summary asset resolution inside project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/ScanProjectStore.swift')
          s = p.read_text()
          old = '''    var thumbnailURL: URL? {\n        guard let name = manifest.thumbnailFileName else { return nil }\n        let url = projectURL.appendingPathComponent(name)\n        return FileManager.default.fileExists(atPath: url.path) ? url : nil\n    }\n\n    var resultURL: URL? {\n        guard let name = manifest.splatFileName else { return nil }\n        let url = projectURL.appendingPathComponent(name)\n        return FileManager.default.fileExists(atPath: url.path) ? url : nil\n    }\n'''
          new = '''    var thumbnailURL: URL? {\n        guard let name = manifest.thumbnailFileName else { return nil }\n        return containedRegularFileURL(named: name)\n    }\n\n    var resultURL: URL? {\n        guard let name = manifest.splatFileName else { return nil }\n        return containedRegularFileURL(named: name)\n    }\n\n    private func containedRegularFileURL(named name: String) -> URL? {\n        // Manifest filenames are durable metadata and may be stale/corrupt. Never let `../`, an\n        // absolute path, or an in-project symlink turn a library summary into an external file read.\n        guard !name.isEmpty,\n              !name.contains("/"),\n              !name.contains("\\\\"),\n              name != ".", name != ".." else { return nil }\n        let root = projectURL.standardizedFileURL\n        let candidate = root.appendingPathComponent(name).standardizedFileURL\n        guard candidate.deletingLastPathComponent() == root,\n              let values = try? candidate.resourceValues(forKeys: [.isRegularFileKey, .isSymbolicLinkKey]),\n              values.isRegularFile == true,\n              values.isSymbolicLink != true else { return nil }\n        return candidate\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('ScanProjectSummary asset URL anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'containedRegularFileURL' splat-native-ios/SplatNative/ScanProjectStore.swift
      - name: Commit repair and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-summary-containment.yml
          git add splat-native-ios/SplatNative/ScanProjectStore.swift
          git commit -m 'fix(splat): contain summary asset resolution'
          git push origin HEAD:feature/splat-post-build17-p1
