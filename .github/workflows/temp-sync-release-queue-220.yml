name: Temporary Sync Release Queue 220

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-220.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize release queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          entries={e['region']:e for e in data['entries']}
          def add(region, code, name):
              arr=entries[region]['municipalities']
              if not any(m['code']==code for m in arr): arr.append({'code':code,'name':name})
              arr.sort(key=lambda m:m['code'])
              entries[region]['count']=len(arr)
          add('north','01408','余市町')
          add('north','01409','赤井川村')
          add('north','01423','南幌町')
          north=entries['north']
          north['pendingSinceLastRelease']=1
          north['releaseStatus']='pending_threshold'
          north['reason']='倶知安町から赤井川村までの追加10自治体をPR #411でmainへ全国統合し、生成・公開をPR #415で214自治体へ更新。その後、南幌町を地方統合'
          north['mainIntegrationPr']=411
          north['generatedPullRequest']=415
          add('east','08232','神栖市')
          east=entries['east']
          east['pendingSinceLastRelease']=1
          east['releaseStatus']='pending_threshold'
          east['reason']='鹿嶋市から桜川市までの追加10自治体をPR #407でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新。その後、神栖市を地方統合'
          add('central','21403','大野町')
          central=entries['central']
          central['pendingSinceLastRelease']=2
          central['releaseStatus']='pending_threshold'
          central['reason']='下呂市から安八町までの追加10自治体をPR #404でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新。その後、揖斐川町・大野町を地方統合'
          central['auditStatus']='passed'
          data['updatedAt']='2026-07-22T02:42:00+09:00'
          summary=data['summary']
          summary['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          summary['releaseReadyRegions']=[e['region'] for e in data['entries'] if e['pendingSinceLastRelease']>=10]
          summary['lastNationalIntegrationAt']='2026-07-22T02:37:27+09:00'
          summary['lastNationalIntegrationPr']=411
          summary['latestGeneratedMunicipalityCount']=214
          summary['latestGeneratedPullRequest']=415
          summary['latestPublicCountPullRequest']=415
          data['nextAction']='西日本3自治体で先行。中日本2、北日本1、東日本1。各地域をコード昇順で継続し、10自治体到達時に直ちに全国統合する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-220.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-220.yml
          git commit -m '統括管理: 地方統合220自治体・公開214自治体へ同期'
          git push origin main
