name: Temporary West A Anyone Care Official Fetch

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-anyone-care-official-fetch-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-a-anyone-care-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Fetch current official pages
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targets = [
            ['39301','東洋町','https://www.town.toyo.kochi.jp/contents/info0559.php'],
            ['39304','安田町','https://www.town.yasuda.kochi.jp/life/dtl.php?hdnKey=1935'],
            ['39307','芸西村','https://www.vill.geisei.kochi.jp/pages/m001969.php'],
            ['39387','仁淀川町','https://www.town.niyodogawa.lg.jp/life/life_dtl.php?hdnKey=3315'],
            ['39402','佐川町','https://www.town.sakawa.lg.jp/life/dtl.php?hdnKey=3193'],
            ['39411','津野町','https://town.kochi-tsuno.lg.jp/department/department_kyouiku'],
            ['40213','行橋市','https://www.city.yukuhashi.fukuoka.jp/site/kosodate/42336.html'],
            ['40605','川崎町','https://www.town-kawasaki.com/%E6%9C%AA%E5%88%86%E9%A1%9E/323097'],
            ['40608','大任町','https://www.town.oto.fukuoka.jp/kiji003688/index.html'],
            ['43432','西原村','https://www.vill.nishihara.kumamoto.jp/'],
            ['46216','日置市','https://www.city.hioki.kagoshima.jp/jifuku/kogomokosodatekaigikekka.html'],
            ['46303','三島村','https://mishimamura.com/book/pageindices/index24.html'],
            ['46404','長島町','https://www.town.nagashima.lg.jp/info_fukushi/%E4%B9%B3%E5%85%90%E7%AD%89%E9%80%9A%E5%9C%92%E6%94%AF%E6%8F%B4%E4%BA%8B%E6%A5%AD%EF%BC%88%E3%81%93%E3%81%A9%E3%82%82%E8%AA%B0%E3%81%A7%E3%82%82%E9%80%9A%E5%9C%92%E5%88%B6%E5%BA%A6%EF%BC%89%E3%81%AB/']
          ];
          const entity = s => s
            .replace(/&nbsp;|&#160;/g,' ')
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
            .replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'")
            .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n)))
            .replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)));
          const textify = html => entity(html
            .replace(/<script[\s\S]*?<\/script>/gi,' ')
            .replace(/<style[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]+>/g,' ')
            .replace(/\s+/g,' ')).trim();
          const excerpts = text => {
            const terms = ['こども誰でも通園','子ども誰でも通園','乳児等通園','対象','0歳6か月','１歳児','1歳児','月10時間','月３時間','月3時間','300円','利用料金','実施施設','施設はありません','決まり次第','未決定','保育所','認定こども園'];
            const out=[];
            for (const term of terms) {
              let from=0;
              while (out.length<20) {
                const i=text.indexOf(term,from); if(i<0) break;
                const snippet=text.slice(Math.max(0,i-100),Math.min(text.length,i+220));
                if(!out.some(x=>x.snippet===snippet)) out.push({term,snippet});
                from=i+term.length;
              }
            }
            return out;
          };
          async function fetchOne([code,name,url]) {
            try {
              const res=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 West-A-Audit/2026'}});
              const buf=Buffer.from(await res.arrayBuffer());
              const ct=res.headers.get('content-type')||'';
              let text='';
              if(/html|text|json|xml/i.test(ct) || !ct) text=textify(buf.toString('utf8'));
              return {code,name,url,httpStatus:res.status,finalUrl:res.url,contentType:ct,byteLength:buf.length,textLength:text.length,
                markers:{
                  anyone:/誰でも通園|乳児等通園/.test(text),
                  age:/0歳6か月|０歳６か月|1歳児|１歳児|満3歳未満|満３歳未満/.test(text),
                  monthly10:/月.{0,5}(10|１０)時間|(10|１０)時間.{0,5}月/.test(text),
                  monthly3:/月.{0,5}(3|３)時間|(3|３)時間.{0,5}月/.test(text),
                  fee:/300円|３００円|利用料金|利用料/.test(text),
                  facility:/実施施設|施設名|保育所|認定こども園/.test(text),
                  noFacility:/施設はありません|実施施設.*ない|決まり次第|未決定/.test(text)
                },
                excerpts:excerpts(text)};
            } catch(e) {return {code,name,url,error:String(e),httpStatus:null,excerpts:[]};}
          }
          (async()=>{
            const results=[];
            for(const t of targets){results.push(await fetchOne(t));}
            const report={schemaVersion:'1.0.0',auditId:'west-a-anyone-care-official-fetch-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),targetCount:targets.length,results,
              counts:{http200:results.filter(r=>r.httpStatus===200).length,fetchError:results.filter(r=>r.error).length,anyoneMarker:results.filter(r=>r.markers?.anyone).length,fullCoreMarkers:results.filter(r=>r.markers?.age&&(r.markers?.monthly10||r.markers?.monthly3)&&r.markers?.fee&&r.markers?.facility&&!r.markers?.noFacility).length,noFacility:results.filter(r=>r.markers?.noFacility).length},
              status:'official_fetch_completed'};
            fs.writeFileSync('jichitai-compare/operations/audits/west-a-anyone-care-official-fetch-20260725.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report.counts));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          rm -f jichitai-compare/operations/control/west-a-anyone-care-official-fetch-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-anyone-care-official-fetch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-anyone-care-official-fetch-20260725.json \
                  jichitai-compare/operations/control/west-a-anyone-care-official-fetch-trigger-20260725.json \
                  .github/workflows/temporary-west-a-anyone-care-official-fetch.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A誰でも通園制度13自治体を公式再取得'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
