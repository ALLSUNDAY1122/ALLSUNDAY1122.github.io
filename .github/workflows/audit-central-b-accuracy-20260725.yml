name: Audit Central B Accuracy 20260725

on:
  pull_request:
    branches: [region/central]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: audit-central-b-accuracy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  audit-round:
    if: github.head_ref == 'quality/central-b-accuracy-audit-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Round 5 audit batch
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'operations/audits/central-b-accuracy-audit-20260725.json';
          const audit = JSON.parse(await readFile(path, 'utf8'));
          const round = audit.batches.find((item) => item.round === 5);
          if (round?.status === 'pending') {
            round.status = 'in_progress';
            await writeFile(path, JSON.stringify(audit, null, 2) + '\n', 'utf8');
            console.log('Round 5 moved to in_progress.');
          } else {
            console.log(`Round 5 already ${round?.status ?? 'missing'}.`);
          }
          NODE
      - name: Regenerate and validate municipality data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Audit current Central B batch
        working-directory: jichitai-compare
        run: node scripts/audit-central-b-accuracy-round.mjs
      - name: Upload audit round result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-b-accuracy-round-result
          path: jichitai-compare/operations/audits/central-b-accuracy-round-output.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit Round 5 audit state
        run: |
          git restore --source=origin/region/central -- \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json
          rm -f jichitai-compare/operations/audits/central-b-accuracy-round-output.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/central-b-accuracy-audit-20260725.json
          if git diff --cached --quiet; then
            echo 'No Round 5 state changes to commit.'
          else
            git commit -m 'audit: 中日本B第5回を監査中へ更新'
            git push origin HEAD:${{ github.head_ref }}
          fi
