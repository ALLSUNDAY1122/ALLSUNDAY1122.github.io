name: Audit Central B Accuracy 20260725

on:
  pull_request:
    branches: [region/central]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: audit-central-b-accuracy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  audit-round:
    if: github.head_ref == 'quality/central-b-accuracy-audit-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin region/central
      - name: Apply Round 10 confirmed corrections
        working-directory: jichitai-compare
        run: |
          node scripts/fix-central-b-accuracy-round10.mjs apply
      - name: Regenerate and validate corrected audit branch
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Audit current Central B batch
        working-directory: jichitai-compare
        run: node scripts/audit-central-b-accuracy-round.mjs
      - name: Upload audit round result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-b-accuracy-round-result
          path: jichitai-compare/operations/audits/central-b-accuracy-round-output.json
          if-no-files-found: error
          retention-days: 14
      - name: Finalize Round 10 audit record
        working-directory: jichitai-compare
        run: node scripts/fix-central-b-accuracy-round10.mjs finalize
      - name: Build correction overlay
        working-directory: jichitai-compare
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('operations/audits/central-b-accuracy-audit-20260725.json', 'utf8'));
          const changes = {};
          for (const finding of audit.findings ?? []) {
            for (const error of finding.confirmedErrors ?? []) {
              const code = error.code;
              const municipality = JSON.parse(await readFile(`data/municipalities/${code.slice(0, 2)}/${code}.json`, 'utf8'));
              const task = JSON.parse(await readFile(`operations/tasks/${code}.json`, 'utf8'));
              changes[code] ??= {
                summary: municipality.summary,
                updatedAt: municipality.updatedAt,
                services: {},
                auditNotes: (task.notes ?? []).filter((note) => note.includes('精度監査'))
              };
              changes[code].services[error.service] = municipality.services[error.service];
            }
          }
          await writeFile('/tmp/central-b-audit-overlay.json', JSON.stringify({ audit, changes }), 'utf8');
          NODE
      - name: Commit complete audit state
        run: |
          rm -f jichitai-compare/operations/audits/central-b-accuracy-round-output.json
          git add -A
          git commit -m 'audit: 中日本B第10回の誤調査を訂正'
          echo "AUDIT_FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASE_HEAD=$(git rev-parse origin/region/central)" >> "$GITHUB_ENV"
      - name: Reapply corrections onto latest region central
        run: |
          git reset --hard origin/region/central
          cd jichitai-compare
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const overlay = JSON.parse(await readFile('/tmp/central-b-audit-overlay.json', 'utf8'));
          for (const [code, change] of Object.entries(overlay.changes)) {
            const municipalityPath = `data/municipalities/${code.slice(0, 2)}/${code}.json`;
            const taskPath = `operations/tasks/${code}.json`;
            const municipality = JSON.parse(await readFile(municipalityPath, 'utf8'));
            const task = JSON.parse(await readFile(taskPath, 'utf8'));
            for (const [service, value] of Object.entries(change.services)) municipality.services[service] = value;
            municipality.summary = change.summary;
            municipality.updatedAt = '2026-07-25';
            const values = Object.values(municipality.services);
            task.status = 'merged';
            task.currentBranch = 'region/central';
            task.pullRequestNumber = 2926;
            task.verifiedCount = values.filter((service) => service.status === 'verified').length;
            task.unavailableCount = values.filter((service) => service.status === 'unavailable').length;
            task.researchingCount = 0;
            task.needsMediumReviewCount = 0;
            task.lastCheckedAt = '2026-07-25';
            task.lastUpdatedAt = '2026-07-25T03:22:00+09:00';
            task.lastUpdatedBy = '中日本調査班B';
            task.officialSources = [...new Set(values.map((service) => service?.source?.url).filter(Boolean))];
            task.notes = [...new Set([...(task.notes ?? []), ...(change.auditNotes ?? [])])];
            await writeFile(municipalityPath, JSON.stringify(municipality) + '\n', 'utf8');
            await writeFile(taskPath, JSON.stringify(task) + '\n', 'utf8');
          }
          await mkdir('operations/audits', { recursive: true });
          await writeFile('operations/audits/central-b-accuracy-audit-20260725.json', JSON.stringify(overlay.audit, null, 2) + '\n', 'utf8');
          NODE
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Create clean merge commit and push
        run: |
          git add -A
          TREE_SHA=$(git write-tree)
          FINAL_SHA=$(printf '%s\n' 'audit: 中日本B担当95自治体の精度監査を完了' | git commit-tree "$TREE_SHA" -p "$AUDIT_FINAL_HEAD" -p "$BASE_HEAD")
          git reset --hard "$FINAL_SHA"
          git push origin HEAD:${{ github.head_ref }}
