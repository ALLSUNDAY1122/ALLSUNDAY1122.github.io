name: Audit Central B Accuracy 20260725

on:
  pull_request:
    branches: [region/central]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: audit-central-b-accuracy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  audit-round:
    if: github.head_ref == 'quality/central-b-accuracy-audit-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Round 7 corrections for diagnosis
        working-directory: jichitai-compare
        run: node scripts/fix-central-b-accuracy-round7.mjs apply
      - name: Generate data and capture validation log
        working-directory: jichitai-compare
        run: |
          set +e
          npm run generate 2>&1 | tee operations/audits/round7-generate.log
          echo ${PIPESTATUS[0]} > operations/audits/round7-generate-status.txt
          npm run progress 2>&1 | tee operations/audits/round7-progress.log
          echo ${PIPESTATUS[0]} > operations/audits/round7-progress-status.txt
          npm run validate:generated 2>&1 | tee operations/audits/round7-validation.log
          echo ${PIPESTATUS[0]} > operations/audits/round7-validation-status.txt
          exit 0
      - name: Upload Round 7 validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: central-b-round7-validation-diagnostics
          path: |
            jichitai-compare/operations/audits/round7-*.log
            jichitai-compare/operations/audits/round7-*-status.txt
          if-no-files-found: error
          retention-days: 14