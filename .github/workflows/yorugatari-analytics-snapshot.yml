name: Yorugatari analytics snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths:
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-share.js
      - yorugatari/assets/landing-start-20260724-001.js
      - yorugatari/sitemap.xml
      - yorugatari/tools/campaigns.json
      - yorugatari/tools/external-launch-kit.md
      - yorugatari/tools/generate-sitemap.mjs
      - yorugatari/tools/analytics-snapshot.mjs
      - yorugatari/tools/landing-conversion-snapshot.mjs
      - .github/workflows/yorugatari-analytics-snapshot.yml

concurrency:
  group: yorugatari-analytics-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate analytics configuration
        shell: bash
        run: |
          node --check yorugatari/tools/analytics-snapshot.mjs
          node --check yorugatari/tools/landing-conversion-snapshot.mjs
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js
          node --check yorugatari/assets/landing-share.js
          node --check yorugatari/assets/landing-start-20260724-001.js
          node -e "const c=require('./yorugatari/tools/campaigns.json'); if(c.definitions.length!==8||!c.onsiteShare)process.exit(1)"
          node <<'NODE'
          const fs = require('node:fs');
          const runtime = fs.readFileSync('yorugatari/assets/landing-start-20260724-001.js', 'utf8');
          for (const token of ['/yorugatari/__landing-start/five-minute', '/yorugatari/__landing-start/bedtime', 'window.YORUGATARI_LANDING_START']) {
            if (!runtime.includes(token)) throw new Error(`Missing landing conversion token: ${token}`);
          }
          for (const file of ['5min-horror.html', 'bedtime-horror.html']) {
            const html = fs.readFileSync(`yorugatari/${file}`, 'utf8');
            if (!html.includes('assets/landing-start-20260724-001.js')) throw new Error(`Landing conversion runtime not loaded: ${file}`);
          }
          const privacy = fs.readFileSync('yorugatari/privacy.html', 'utf8');
          if (!privacy.includes('開いた作品名や作品URLはこの集計へ含めません')) throw new Error('Landing conversion privacy disclosure is missing');
          NODE

      - name: Generate analytics snapshots
        run: |
          node yorugatari/tools/analytics-snapshot.mjs
          node yorugatari/tools/landing-conversion-snapshot.mjs

      - name: Commit analytics reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp yorugatari/tools/analytics-snapshot-latest.json /tmp/analytics-snapshot-latest.json
          cp yorugatari/tools/analytics-history.json /tmp/analytics-history.json
          cp yorugatari/tools/analytics-insights-latest.md /tmp/analytics-insights-latest.md
          cp yorugatari/tools/landing-conversion-baseline.json /tmp/landing-conversion-baseline.json
          cp yorugatari/tools/landing-conversion-latest.json /tmp/landing-conversion-latest.json
          cp yorugatari/tools/landing-conversion-history.json /tmp/landing-conversion-history.json
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/analytics-snapshot-latest.json yorugatari/tools/analytics-snapshot-latest.json
            cp /tmp/analytics-history.json yorugatari/tools/analytics-history.json
            cp /tmp/analytics-insights-latest.md yorugatari/tools/analytics-insights-latest.md
            cp /tmp/landing-conversion-baseline.json yorugatari/tools/landing-conversion-baseline.json
            cp /tmp/landing-conversion-latest.json yorugatari/tools/landing-conversion-latest.json
            cp /tmp/landing-conversion-history.json yorugatari/tools/landing-conversion-history.json
            git add \
              yorugatari/tools/analytics-snapshot-latest.json \
              yorugatari/tools/analytics-history.json \
              yorugatari/tools/analytics-insights-latest.md \
              yorugatari/tools/landing-conversion-baseline.json \
              yorugatari/tools/landing-conversion-latest.json \
              yorugatari/tools/landing-conversion-history.json
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari analytics and landing conversion [skip ci]"
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            sleep 3
          done
          test "$saved" = true

      - name: Upload analytics reports
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-analytics-reports
          path: |
            yorugatari/tools/analytics-snapshot-latest.json
            yorugatari/tools/analytics-history.json
            yorugatari/tools/analytics-insights-latest.md
            yorugatari/tools/landing-conversion-baseline.json
            yorugatari/tools/landing-conversion-latest.json
            yorugatari/tools/landing-conversion-history.json
          if-no-files-found: error
          retention-days: 30
