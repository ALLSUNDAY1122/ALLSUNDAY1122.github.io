name: Yorugatari analytics snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths:
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-share.js
      - yorugatari/assets/landing-start-20260724-001.js
      - yorugatari/sitemap.xml
      - yorugatari/tools/campaigns.json
      - yorugatari/tools/external-launch-kit.md
      - yorugatari/tools/external-launch-status.json
      - yorugatari/tools/generate-sitemap.mjs
      - yorugatari/tools/analytics-snapshot.mjs
      - yorugatari/tools/analytics-clean-snapshot.mjs
      - yorugatari/tools/landing-conversion-snapshot.mjs
      - yorugatari/tools/build-analytics-insights.mjs
      - .github/workflows/yorugatari-analytics-snapshot.yml

concurrency:
  group: yorugatari-analytics-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate analytics configuration
        shell: bash
        run: |
          node --check yorugatari/tools/analytics-snapshot.mjs
          node --check yorugatari/tools/analytics-clean-snapshot.mjs
          node --check yorugatari/tools/landing-conversion-snapshot.mjs
          node --check yorugatari/tools/build-analytics-insights.mjs
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js
          node --check yorugatari/assets/landing-share.js
          node --check yorugatari/assets/landing-start-20260724-001.js
          node <<'NODE'
          const fs = require('node:fs');
          const campaigns = require('./yorugatari/tools/campaigns.json');
          const launchStatus = require('./yorugatari/tools/external-launch-status.json');
          if (campaigns.definitions.length !== 8 || !campaigns.onsiteShare) throw new Error('Campaign definitions are incomplete');
          if (!Array.isArray(launchStatus.campaigns) || launchStatus.campaigns.length !== 8) throw new Error('Launch status must contain eight external campaigns');
          const campaignIds = new Set(campaigns.definitions.map((row) => row.id));
          const statusIds = new Set(launchStatus.campaigns.map((row) => row.id));
          if (campaignIds.size !== statusIds.size || [...campaignIds].some((id) => !statusIds.has(id))) throw new Error('Launch status IDs do not match campaign definitions');
          if (!campaignIds.has(launchStatus.nextCampaignId)) throw new Error('Next campaign ID is not registered');
          for (const row of launchStatus.campaigns) {
            if (row.status === 'published' && (!row.publishedAt || !row.postUrl)) throw new Error(`Published campaign lacks evidence: ${row.id}`);
            if (row.status === 'ready_not_posted' && (row.publishedAt || row.postUrl)) throw new Error(`Unposted campaign contains publication evidence: ${row.id}`);
          }
          const runtime = fs.readFileSync('yorugatari/assets/landing-start-20260724-001.js', 'utf8');
          for (const token of ['/yorugatari/__landing-start/five-minute', '/yorugatari/__landing-start/bedtime', 'window.YORUGATARI_LANDING_START', 'isAutomatedRequest']) {
            if (!runtime.includes(token)) throw new Error(`Missing landing conversion token: ${token}`);
          }
          const analytics = fs.readFileSync('yorugatari/assets/analytics.js', 'utf8');
          if (!analytics.includes('isAutomatedRequest') || !analytics.includes('if (!isYorugatari || automated) return')) throw new Error('Automated analytics exclusion is missing');
          for (const file of ['5min-horror.html', 'bedtime-horror.html']) {
            const html = fs.readFileSync(`yorugatari/${file}`, 'utf8');
            if (!html.includes('assets/landing-start-20260724-001.js')) throw new Error(`Landing conversion runtime not loaded: ${file}`);
          }
          const privacy = fs.readFileSync('yorugatari/privacy.html', 'utf8');
          if (!privacy.includes('開いた作品名や作品URLはこの集計へ含めません')) throw new Error('Landing conversion privacy disclosure is missing');
          NODE

      - name: Generate raw, audit-filtered, and conversion snapshots
        run: |
          node yorugatari/tools/analytics-snapshot.mjs
          node yorugatari/tools/analytics-clean-snapshot.mjs
          node yorugatari/tools/landing-conversion-snapshot.mjs
          node yorugatari/tools/build-analytics-insights.mjs

      - name: Commit analytics reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            analytics-snapshot-latest.json analytics-history.json analytics-insights-latest.md \
            analytics-clean-baseline.json analytics-clean-latest.json analytics-clean-history.json \
            landing-conversion-baseline.json landing-conversion-latest.json landing-conversion-history.json; do
            cp "yorugatari/tools/$file" "/tmp/$file"
          done
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for file in \
              analytics-snapshot-latest.json analytics-history.json analytics-insights-latest.md \
              analytics-clean-baseline.json analytics-clean-latest.json analytics-clean-history.json \
              landing-conversion-baseline.json landing-conversion-latest.json landing-conversion-history.json; do
              cp "/tmp/$file" "yorugatari/tools/$file"
              git add "yorugatari/tools/$file"
            done
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari raw and audit-filtered analytics [skip ci]"
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            sleep 3
          done
          test "$saved" = true

      - name: Upload analytics reports
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-analytics-reports
          path: |
            yorugatari/tools/analytics-snapshot-latest.json
            yorugatari/tools/analytics-history.json
            yorugatari/tools/analytics-insights-latest.md
            yorugatari/tools/analytics-clean-baseline.json
            yorugatari/tools/analytics-clean-latest.json
            yorugatari/tools/analytics-clean-history.json
            yorugatari/tools/landing-conversion-baseline.json
            yorugatari/tools/landing-conversion-latest.json
            yorugatari/tools/landing-conversion-history.json
          if-no-files-found: error
          retention-days: 30
