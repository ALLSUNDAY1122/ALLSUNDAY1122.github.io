name: Temporary Central A Weak Source Batch 2 Diagnose

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch2-diagnose-trigger-20260726.json

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'diagnose/central-a-weak-source-batch2-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reapply batch and capture validation output
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /node --input-type=module <<'"'"'NODE'"'"'/ {capture=1; next}
            capture && /^[[:space:]]*NODE$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/temp-central-a-weak-source-batch2.yml > /tmp/central-a-batch2-apply.mjs
          node /tmp/central-a-batch2-apply.mjs
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-trigger-20260726.json
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-diagnose-trigger-20260726.json
          cd jichitai-compare
          log=operations/audits/central-a-weak-primary-source-batch2-validation-20260726.log
          status=operations/audits/central-a-weak-primary-source-batch2-validation-status-20260726.json
          set +e
          npm run generate > "$log" 2>&1
          generate_status=$?
          npm run check >> "$log" 2>&1
          check_status=$?
          node --check app.js >> "$log" 2>&1
          app_status=$?
          set -e
          printf '{"schemaVersion":"1.0.0","generatedAt":"%s","generateStatus":%s,"checkStatus":%s,"appStatus":%s}\n' "$(date -u +%FT%TZ)" "$generate_status" "$check_status" "$app_status" > "$status"
          cat "$log"
          cd ..
      - name: Commit diagnostic state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'diagnose: 中日本A弱い主出典第2群の検証失敗を記録'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
