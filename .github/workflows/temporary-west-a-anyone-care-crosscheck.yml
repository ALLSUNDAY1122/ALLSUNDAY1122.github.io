name: Temporary West A Anyone Care Crosscheck

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-anyone-care-crosscheck-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-a-anyone-care-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract anyone-care risks from 226 municipalities
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefectures = ['33','37','39','40','43','46'];
          const root = 'jichitai-compare/data/municipalities';
          const rows = [];
          const text = value => JSON.stringify(value ?? {}, null, 0);
          const has = (s, re) => re.test(s);

          for (const pref of prefectures) {
            const dir = path.join(root, pref);
            for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()) {
              const full = path.join(dir, file);
              const municipality = JSON.parse(fs.readFileSync(full, 'utf8'));
              const service = municipality.services?.temporaryChildcare;
              if (!service) continue;
              const corpus = text(service);
              const sourceUrl = service.source?.url || '';
              const anyoneTerms = has(corpus, /誰でも通園|こども誰でも|乳児等通園支援|就労要件.{0,8}(問わない|不要)|月.{0,3}10時間|10時間.{0,3}月/);
              const startRecorded = has(corpus, /202[4-6]年|令和[678]年|開始|試行|本格実施|法定給付/);
              const ageRecorded = has(corpus, /6か月|６か月|0歳6か月|０歳６か月|満3歳未満|満３歳未満|3歳未満|３歳未満/);
              const limitRecorded = has(corpus, /月.{0,4}10時間|月.{0,4}１０時間|10時間.{0,4}月|１０時間.{0,4}月/);
              const feeRecorded = has(corpus, /[0-9０-９,，]+円|無料|無償/);
              const regularTemporaryTerms = has(corpus, /一時預かり|一時保育|冠婚葬祭|通院|リフレッシュ|緊急|私的理由/);
              const planLikeSource = /\.pdf(?:$|\?)/i.test(sourceUrl) && has(corpus, /計画|予算|施政方針|事業計画/);
              const flags = [];
              if (service.status === 'unavailable' && anyoneTerms) flags.push('unavailable_but_anyone_terms_present');
              if (service.status === 'verified' && anyoneTerms && !startRecorded) flags.push('anyone_start_timing_missing');
              if (service.status === 'verified' && anyoneTerms && !ageRecorded) flags.push('anyone_age_range_missing');
              if (service.status === 'verified' && anyoneTerms && !limitRecorded) flags.push('anyone_monthly_limit_missing');
              if (service.status === 'verified' && anyoneTerms && !feeRecorded) flags.push('anyone_fee_missing');
              if (service.status === 'verified' && anyoneTerms && !regularTemporaryTerms) flags.push('anyone_only_may_replace_regular_temporary_care');
              if (planLikeSource) flags.push('plan_or_budget_pdf_as_primary_source');
              rows.push({
                code: municipality.code,
                prefectureCode: municipality.prefectureCode,
                prefecture: municipality.prefecture,
                name: municipality.name,
                status: service.status,
                summary: service.summary || '',
                sourceUrl,
                checkedAt: service.source?.checkedAt || null,
                anyoneTerms,
                startRecorded,
                ageRecorded,
                limitRecorded,
                feeRecorded,
                regularTemporaryTerms,
                flags
              });
            }
          }

          const flagged = rows.filter(r => r.flags.length);
          const report = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-anyone-care-crosscheck-20260725',
            team: '西日本調査班A',
            generatedAt: new Date().toISOString(),
            scope: { prefectureCodes: prefectures, municipalityCount: rows.length },
            counts: {
              verified: rows.filter(r => r.status === 'verified').length,
              unavailable: rows.filter(r => r.status === 'unavailable').length,
              anyoneTermDetected: rows.filter(r => r.anyoneTerms).length,
              flagged: flagged.length,
              unavailableButAnyoneTerms: rows.filter(r => r.flags.includes('unavailable_but_anyone_terms_present')).length,
              missingStart: rows.filter(r => r.flags.includes('anyone_start_timing_missing')).length,
              missingAge: rows.filter(r => r.flags.includes('anyone_age_range_missing')).length,
              missingLimit: rows.filter(r => r.flags.includes('anyone_monthly_limit_missing')).length,
              missingFee: rows.filter(r => r.flags.includes('anyone_fee_missing')).length,
              anyoneOnly: rows.filter(r => r.flags.includes('anyone_only_may_replace_regular_temporary_care')).length,
              planLikePrimarySource: rows.filter(r => r.flags.includes('plan_or_budget_pdf_as_primary_source')).length
            },
            policy: {
              targetService: 'temporaryChildcare',
              anyoneCareRequiredFields: ['開始・年度', '対象年齢', '月10時間', '料金'],
              note: '機械抽出結果は訂正確定ではなく、公式利用者向けページの独立確認対象を絞るためのもの。'
            },
            flagged,
            allMunicipalities: rows,
            unresolvedCount: flagged.length,
            status: 'candidate_extraction_completed'
          };
          const out = 'jichitai-compare/operations/audits/west-a-anyone-care-crosscheck-20260725.json';
          fs.writeFileSync(out, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report.counts));
          if (rows.length !== 226) {
            throw new Error(`expected 226 municipalities, got ${rows.length}`);
          }
          NODE

          rm -f jichitai-compare/operations/control/west-a-anyone-care-crosscheck-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-anyone-care-crosscheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-anyone-care-crosscheck-20260725.json \
                  jichitai-compare/operations/control/west-a-anyone-care-crosscheck-trigger-20260725.json \
                  .github/workflows/temporary-west-a-anyone-care-crosscheck.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A誰でも通園制度候補を226自治体から抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
