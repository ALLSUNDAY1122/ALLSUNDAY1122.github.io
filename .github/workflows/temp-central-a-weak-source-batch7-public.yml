name: Temporary Central A Weak Source Batch 7 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch7-public-trigger-20260727.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch7-public-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const pages=[{code:'22214',name:'藤枝市'},{code:'21206',name:'中津川市'},{code:'23302',name:'東郷町'}];
          const expected=[
            {code:'22214',name:'藤枝市',service:'housingSupport',status:'verified',source:'https://www.city.fujieda.shizuoka.jp/mokuteki/sumai_hikkoshi/shien/1484116616343.html',additional:['https://www.city.fujieda.shizuoka.jp/soshiki/toshikensetsu/akiya/gyomu/hojyokin/1450661881654.html','https://www.city.fujieda.shizuoka.jp/mokuteki/teate_josei/kurashi/iju_teiju/22775.html'],summary:'18歳以下の子どもがいる世帯の市内住宅取得・転居・中古住宅改修費を補助する。'},
            {code:'21206',name:'中津川市',service:'housingSupport',status:'verified',source:'https://www.city.nakatsugawa.lg.jp/life/life/4/38702.html',additional:['https://www.city.nakatsugawa.lg.jp/soshikikarasagasu/tiikidukurikyodoka/4/2/38700.html','https://www.city.nakatsugawa.lg.jp/life/life/1/index.html'],summary:'新婚・子育て・移住世帯等の空き家取得に30万円、空き家改修に工事費の2分の1・上限50万円を助成する。'},
            {code:'23302',name:'東郷町',service:'schoolMeals',status:'verified',source:'https://www.town.aichi-togo.lg.jp/material/files/group/27/gikaidayori159sokuhou.pdf',additional:['https://www.town.aichi-togo.lg.jp/soshikikarasagasu/kyushokucenter/gyomuannai/4/3015.html','https://www.town.aichi-togo.lg.jp/kosodate_ouen/nenrei/shochugakusei/kyushoku/8963.html','https://www.town.aichi-togo.lg.jp/kosodate_kyoiku/ikuji_shochugakusei/shochugakko/1/5744.html'],summary:'令和8年4月から町立小学校の学校給食費を無償化する。中学校の給食費は別途保護者負担とする。'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;const pageChecks=[];
              for(const item of pages){const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);const html=await response.text();if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);for(const service of expected.filter(x=>x.code===item.code))if(!html.includes(service.summary))throw new Error(`${item.code}:${service.service} page summary mismatch`);pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true,serviceSummariesMatched:1});}
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);const payload=await response.json();const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);if(!Array.isArray(municipalities)||municipalities.length!==1741)throw new Error(`published municipality count ${municipalities.length}`);let serviceCount=0;for(const municipality of municipalities)serviceCount+=Object.keys(municipality.services??{}).length;if(serviceCount!==15669)throw new Error(`published service count ${serviceCount}`);
              const serviceChecks=[];for(const item of expected){const municipality=municipalities.find(x=>String(x.code)===item.code);if(!municipality)throw new Error(`${item.code} missing`);const service=municipality.services?.[item.service];if(service?.status!==item.status)throw new Error(`${item.code}:${item.service} status ${service?.status}`);if(service.summary!==item.summary)throw new Error(`${item.code}:${item.service} summary mismatch`);if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch`);const additionalUrls=(service.additionalSources??[]).map(x=>x.url);for(const url of item.additional)if(!additionalUrls.includes(url))throw new Error(`${item.code}:${item.service} additional source missing ${url}`);serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,summaryMatched:true,sourceMatched:true,additionalSourcesMatched:item.additional.length});}
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch7-public-verification-20260727',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:3,reviewedServiceCount:3,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch7-public-verification-20260727.json',JSON.stringify(audit,null,2)+'\n');process.exit(0);
            }catch(error){lastError=error;if(attempt<30)await sleep(20000);}
          }
          throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch7-public-trigger-20260727.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第7群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
