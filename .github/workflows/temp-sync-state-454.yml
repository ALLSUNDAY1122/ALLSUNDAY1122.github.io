name: Temporary Sync State 454 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-state-454.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue and global state
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          regions=('north','east','central','west')
          state_fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          queue_path=Path('jichitai-compare/operations/control/release-queue.json')
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          entries={e['region']:e for e in queue['entries']}
          pending={}; last_pr={}; counts={}
          for region in regions:
              ref=f'origin/region/{region}'
              files=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              items=[]
              for path in files:
                  if not re.search(r'/\d{5}\.json$',path): continue
                  data=json.loads(show(ref,path))
                  if belongs(region,data['prefectureCode']): items.append({'code':data['code'],'name':data['name']})
              items.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              p=int(state.get(state_fields[region],0)); pending[region]=p
              last_pr[region]=state.get('lastNationalIntegrationPr'); counts[region]=len(items)
              entry=entries[region]
              entry['municipalities']=items; entry['count']=len(items); entry['pendingSinceLastRelease']=p
              entry['releaseStatus']='release_ready' if p>=10 else 'pending_threshold'
              entry['reason']=f'最新地方ブランチを再走査。前回全国統合後の繰越は{p}自治体'
              entry['auditStatus']='passed'; entry['mainIntegrationPr']=last_pr[region]; entry['generatedPullRequest']=720
          total=sum(counts.values()); ready=[r for r in regions if pending[r]>=10]
          next_action=f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。10自治体到達地域なし。" if not ready else '10自治体到達地域を優先して全国統合する。'
          queue['updatedAt']='2026-07-22T16:15:00+09:00'; queue['status']='active'
          queue['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':454,'latestGeneratedPullRequest':720,'latestPublicCountPullRequest':720,'releaseReadyRegions':ready,'nextAction':next_action}
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          global_path=Path('jichitai-compare/operations/control/global-state.json')
          global_state=json.loads(global_path.read_text(encoding='utf-8'))
          global_state['updatedAt']='2026-07-22T16:15:00+09:00'; global_state['phase']='release-monitoring'
          global_state['regionalCompletedSinceLastRelease']={**pending,'total':sum(pending.values())}
          global_state['priority']={'type':'release-monitoring','nextAction':next_action}
          global_state['lastNationalIntegrationAt']='2026-07-22T16:08:48+09:00'; global_state['lastNationalIntegrationPr']=717
          global_state['latestGeneratedMunicipalityCount']=454; global_state['latestGeneratedPullRequest']=720; global_state['latestPublicCountPullRequest']=720
          global_state['regionalMergedMunicipalities']=total; global_state['openPullRequests']=[]; global_state['humanDecisionRequired']=False
          global_path.write_text(json.dumps(global_state,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps({'counts':counts,'pending':pending,'total':total},ensure_ascii=False))
          PY
          git rm .github/workflows/temp-sync-state-454.yml
          git add jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/global-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 公開454自治体・最新地方統合へ全国状態を同期'
          git push origin main
