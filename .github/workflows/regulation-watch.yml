name: Regulation Watch

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST every day
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: regulation-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/regulation-watch/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/regulation-watch/requirements.txt

      - name: Check official sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/regulation-watch/watch.py

      - name: Persist baselines and changes
        run: |
          if git diff --quiet -- automation/regulation-watch/state.json automation/regulation-watch/snapshots automation/regulation-watch/changes; then
            echo "No monitor state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/regulation-watch/state.json automation/regulation-watch/snapshots automation/regulation-watch/changes
          git commit -m "chore: update regulation watch state"
          git push
