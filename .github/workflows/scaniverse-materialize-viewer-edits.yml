name: Scaniverse materialize viewer edits

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scaniverse-materialize-viewer-edits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Apply persisted viewer edits to export share and video
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('splat-native-ios/SplatNative/SplatExportService.swift')
          s = service_path.read_text(encoding='utf-8')
          if 'enum SplatPersistedEditMaterializer {' in s:
              raise SystemExit('materializer already present')
          s = s.replace('import SplatIO\n', 'import SplatIO\nimport simd\n', 1)
          marker = 'enum SplatExportService {\n'
          if marker not in s:
              raise SystemExit('service insertion marker missing')
          materializer = r'''enum SplatPersistedEditMaterializer {
    struct AxisRange: Sendable {
        let low: Float
        let high: Float

        var extent: Float { max(0.0001, high - low) }
        func value(at fraction: Double) -> Float {
            low + extent * Float(min(1, max(0, fraction)))
        }
    }

    struct CropBounds: Sendable {
        let x: AxisRange
        let y: AxisRange
        let z: AxisRange
    }

    struct Plan: Sendable {
        let settings: SplatEditSettings
        let bounds: CropBounds?
        let outputPointCount: Int

        var isIdentity: Bool { settings == .default }
    }

    enum MaterializeError: LocalizedError {
        case emptyEditedScene

        var errorDescription: String? {
            switch self {
            case .emptyEditedScene:
                return "現在の切り抜き範囲には書き出せるGaussianがありません。切り抜きを調整してください。"
            }
        }
    }

    static func makePlan(sourceURL: URL, sourcePointCount: Int) async throws -> Plan {
        let settings = loadSettings(sourceURL: sourceURL)
        guard settings != .default else {
            return Plan(settings: settings, bounds: nil, outputPointCount: sourcePointCount)
        }

        let bounds = settings.hasCrop
            ? try await sampledCropBounds(sourceURL: sourceURL, sourcePointCount: sourcePointCount)
            : nil
        let reader = try DotSplatSceneReader(sourceURL)
        let stream = try reader.read()
        var outputPointCount = 0
        for try await points in stream {
            try Task.checkCancellation()
            outputPointCount += eligiblePointCount(points, settings: settings, bounds: bounds)
        }
        guard outputPointCount > 0 else { throw MaterializeError.emptyEditedScene }
        return Plan(settings: settings, bounds: bounds, outputPointCount: outputPointCount)
    }

    static func materializeInMemory(sourceURL: URL, points: [SplatPoint]) throws -> [SplatPoint] {
        let settings = loadSettings(sourceURL: sourceURL)
        guard settings != .default else { return points }
        let bounds = settings.hasCrop ? robustCropBounds(for: points) : nil
        let plan = Plan(settings: settings, bounds: bounds, outputPointCount: points.count)
        let edited = apply(points, plan: plan)
        guard !edited.isEmpty else { throw MaterializeError.emptyEditedScene }
        return edited
    }

    static func apply(_ points: [SplatPoint], plan: Plan) -> [SplatPoint] {
        guard !plan.isIdentity else { return points }
        let settings = plan.settings
        let exposureGain = Float(pow(2.0, settings.exposureEV))
        let contrast = Float(settings.contrast)
        let needsColorAdjustment = abs(settings.exposureEV) > 0.0001 || abs(settings.contrast - 1) > 0.0001

        var result: [SplatPoint] = []
        result.reserveCapacity(points.count)
        for point in points {
            guard isEligible(point, settings: settings, bounds: plan.bounds) else { continue }
            guard needsColorAdjustment else {
                result.append(point)
                continue
            }

            var edited = point
            let base = point.color.asSRGBFloat
            let exposed = base * exposureGain
            let midpoint = SIMD3<Float>(repeating: 0.5)
            let adjusted = simd_clamp((exposed - midpoint) * contrast + midpoint, .zero, .one)
            switch point.color {
            case .sphericalHarmonicFloat(var coefficients):
                if !coefficients.isEmpty {
                    coefficients[0] = (adjusted - midpoint) * SplatPoint.Color.INV_SH_C0
                    edited.color = .sphericalHarmonicFloat(coefficients)
                }
            case .sRGBUInt8:
                edited.color = .sRGBUInt8(SIMD3<UInt8>(
                    byte(adjusted.x), byte(adjusted.y), byte(adjusted.z)
                ))
            }
            result.append(edited)
        }
        return result
    }

    static func loadSettings(sourceURL: URL) -> SplatEditSettings {
        let sidecar = sourceURL.deletingPathExtension().appendingPathExtension("viewer.json")
        guard let data = try? Data(contentsOf: sidecar),
              let decoded = try? JSONDecoder().decode(SplatEditSettings.self, from: data) else {
            return .default
        }
        return decoded.normalized()
    }

    private static func sampledCropBounds(sourceURL: URL, sourcePointCount: Int) async throws -> CropBounds {
        let sampleStride = max(1, sourcePointCount / 8_000)
        let reader = try DotSplatSceneReader(sourceURL)
        let stream = try reader.read()
        var xs: [Float] = []
        var ys: [Float] = []
        var zs: [Float] = []
        xs.reserveCapacity(min(sourcePointCount, 8_001))
        ys.reserveCapacity(min(sourcePointCount, 8_001))
        zs.reserveCapacity(min(sourcePointCount, 8_001))
        var globalIndex = 0

        for try await points in stream {
            try Task.checkCancellation()
            for point in points {
                if globalIndex % sampleStride == 0 {
                    let p = point.position
                    if p.x.isFinite, p.y.isFinite, p.z.isFinite {
                        xs.append(p.x); ys.append(p.y); zs.append(p.z)
                    }
                }
                globalIndex += 1
            }
        }
        return CropBounds(x: percentileRange(xs), y: percentileRange(ys), z: percentileRange(zs))
    }

    private static func robustCropBounds(for points: [SplatPoint]) -> CropBounds {
        let strideSize = max(1, points.count / 8_000)
        var xs: [Float] = []
        var ys: [Float] = []
        var zs: [Float] = []
        for index in stride(from: 0, to: points.count, by: strideSize) {
            let p = points[index].position
            guard p.x.isFinite, p.y.isFinite, p.z.isFinite else { continue }
            xs.append(p.x); ys.append(p.y); zs.append(p.z)
        }
        return CropBounds(x: percentileRange(xs), y: percentileRange(ys), z: percentileRange(zs))
    }

    private static func percentileRange(_ values: [Float]) -> AxisRange {
        guard !values.isEmpty else { return AxisRange(low: -1, high: 1) }
        let sorted = values.sorted()
        let lowIndex = min(sorted.count - 1, Int(Double(sorted.count - 1) * 0.01))
        let highIndex = min(sorted.count - 1, Int(Double(sorted.count - 1) * 0.99))
        var low = sorted[lowIndex]
        var high = sorted[highIndex]
        if !low.isFinite || !high.isFinite || high - low < 0.0001 {
            low = sorted.first ?? -1
            high = sorted.last ?? 1
        }
        if high - low < 0.0001 { high = low + 0.0001 }
        return AxisRange(low: low, high: high)
    }

    private static func eligiblePointCount(
        _ points: [SplatPoint],
        settings: SplatEditSettings,
        bounds: CropBounds?
    ) -> Int {
        points.reduce(into: 0) { count, point in
            if isEligible(point, settings: settings, bounds: bounds) { count += 1 }
        }
    }

    private static func isEligible(
        _ point: SplatPoint,
        settings: SplatEditSettings,
        bounds: CropBounds?
    ) -> Bool {
        let p = point.position
        guard p.x.isFinite, p.y.isFinite, p.z.isFinite else { return false }
        guard let bounds else { return true }

        if settings.cropXMin > 0.0001 || settings.cropXMax < 0.9999 {
            if p.x < bounds.x.value(at: settings.cropXMin) || p.x > bounds.x.value(at: settings.cropXMax) { return false }
        }
        if settings.cropYMin > 0.0001 || settings.cropYMax < 0.9999 {
            if p.y < bounds.y.value(at: settings.cropYMin) || p.y > bounds.y.value(at: settings.cropYMax) { return false }
        }
        if settings.cropZMin > 0.0001 || settings.cropZMax < 0.9999 {
            if p.z < bounds.z.value(at: settings.cropZMin) || p.z > bounds.z.value(at: settings.cropZMax) { return false }
        }
        return true
    }

    private static func byte(_ value: Float) -> UInt8 {
        UInt8(clamping: Int((max(0, min(1, value)) * 255).rounded()))
    }
}

'''
          s = s.replace(marker, materializer + marker, 1)
          old = '''        let pointCount = try sourcePointCount(sourceURL)
        let directory = destinationDirectory ?? sourceURL.deletingLastPathComponent()
'''
          new = '''        let sourcePointCount = try sourcePointCount(sourceURL)
        let editPlan = try await SplatPersistedEditMaterializer.makePlan(
            sourceURL: sourceURL,
            sourcePointCount: sourcePointCount
        )
        let pointCount = editPlan.outputPointCount
        let directory = destinationDirectory ?? sourceURL.deletingLastPathComponent()
'''
          if old not in s:
              raise SystemExit('export point-count marker missing')
          s = s.replace(old, new, 1)
          old_write = '''                    try await writer.write(points)
                    pointsWritten += points.count
'''
          new_write = '''                    let outputPoints = SplatPersistedEditMaterializer.apply(points, plan: editPlan)
                    if !outputPoints.isEmpty {
                        try await writer.write(outputPoints)
                        pointsWritten += outputPoints.count
                    }
'''
          if s.count(old_write) != 2:
              raise SystemExit(f'expected 2 writer loops, found {s.count(old_write)}')
          s = s.replace(old_write, new_write)
          service_path.write_text(s, encoding='utf-8')

          video_path = Path('splat-native-ios/SplatNative/SplatVideoExporter.swift')
          v = video_path.read_text(encoding='utf-8')
          old = '''        let reader = try AutodetectSceneReader(sourceURL)
        let points = try await reader.readAll()
        guard !points.isEmpty else { throw ExportError.emptyScene }
        try Task.checkCancellation()

        let framing = SplatCameraGeometry.robustFraming(for: points)
        let chunk = try SplatChunk(device: device, from: points)
'''
          new = '''        let reader = try AutodetectSceneReader(sourceURL)
        let sourcePoints = try await reader.readAll()
        guard !sourcePoints.isEmpty else { throw ExportError.emptyScene }
        try Task.checkCancellation()
        let points = try SplatPersistedEditMaterializer.materializeInMemory(
            sourceURL: sourceURL,
            points: sourcePoints
        )
        guard !points.isEmpty else { throw ExportError.emptyScene }
        try Task.checkCancellation()

        let framing = SplatCameraGeometry.robustFraming(for: points)
        let chunk = try SplatChunk(device: device, from: points)
'''
          if old not in v:
              raise SystemExit('video materialization marker missing')
          v = v.replace(old, new, 1)
          video_path.write_text(v, encoding='utf-8')

          tests_path = Path('splat-native-ios/SplatNativeTests/SplatExportServiceTests.swift')
          t = tests_path.read_text(encoding='utf-8')
          insert = '''
    func testPersistedViewerCropAndColorEditsAreMaterializedIntoExports() async throws {
        let root = FileManager.default.temporaryDirectory
            .appendingPathComponent("splat-edited-export-\\(UUID().uuidString)", isDirectory: true)
        try FileManager.default.createDirectory(at: root, withIntermediateDirectories: true)
        defer { try? FileManager.default.removeItem(at: root) }

        let source = root.appendingPathComponent("result.splat")
        let sourcePoints = (0..<101).map { index in
            SplatPoint(
                position: SIMD3<Float>(Float(index) / 100, 0, 0),
                color: .sRGBUInt8(SIMD3<UInt8>(40, 60, 80)),
                opacity: .linearFloat(0.75),
                scale: .linearFloat(SIMD3<Float>(repeating: 0.02)),
                rotation: simd_quatf(angle: 0.1, axis: SIMD3<Float>(0, 1, 0))
            )
        }
        let writer = try DotSplatSceneWriter(toFileAtPath: source.path)
        try await writer.write(sourcePoints)
        try await writer.close()

        let edits = SplatEditSettings(
            exposureEV: 1,
            contrast: 1,
            cropXMin: 0.50,
            cropXMax: 1,
            cropYMin: 0,
            cropYMax: 1,
            cropZMin: 0,
            cropZMax: 1
        )
        let sidecar = source.deletingPathExtension().appendingPathExtension("viewer.json")
        try JSONEncoder().encode(edits).write(to: sidecar, options: .atomic)

        let output = try await SplatExportService.export(sourceURL: source, format: .ply)
        let decoded = try await AutodetectSceneReader(output).readAll()
        XCTAssertGreaterThan(decoded.count, 0)
        XCTAssertLessThan(decoded.count, sourcePoints.count)
        XCTAssertTrue(decoded.allSatisfy { $0.position.x >= 0.48 })
        XCTAssertTrue(decoded.allSatisfy { $0.color.asSRGBFloat.x > 0.20 })
        XCTAssertTrue(decoded.allSatisfy { abs($0.opacity.asLinearFloat - 0.75) < 0.03 })
    }

    func testBrowserSharePackageUsesPersistedViewerCrop() async throws {
        let root = FileManager.default.temporaryDirectory
            .appendingPathComponent("splat-edited-browser-share-\\(UUID().uuidString)", isDirectory: true)
        try FileManager.default.createDirectory(at: root, withIntermediateDirectories: true)
        defer { try? FileManager.default.removeItem(at: root) }

        let source = try await makeCommittedProjectResult(in: root)
        let edits = SplatEditSettings(
            exposureEV: 0,
            contrast: 1,
            cropXMin: 0.50,
            cropXMax: 1,
            cropYMin: 0,
            cropYMax: 1,
            cropZMin: 0,
            cropZMax: 1
        )
        let sidecar = source.deletingPathExtension().appendingPathExtension("viewer.json")
        try JSONEncoder().encode(edits).write(to: sidecar, options: .atomic)

        let package = try await SplatExportService.makeBrowserSharePackage(
            sourceURL: source,
            rootDirectory: root
        )
        let decoded = try await AutodetectSceneReader(package.assetURL).readAll()
        XCTAssertEqual(decoded.count, 2)
        XCTAssertTrue(decoded.allSatisfy { $0.position.x >= -0.05 })
    }

    func testInMemoryMaterializerMatchesVideoEditBoundary() async throws {
        let root = FileManager.default.temporaryDirectory
            .appendingPathComponent("splat-edited-video-boundary-\\(UUID().uuidString)", isDirectory: true)
        try FileManager.default.createDirectory(at: root, withIntermediateDirectories: true)
        defer { try? FileManager.default.removeItem(at: root) }

        let source = root.appendingPathComponent("result.splat")
        let sourcePoints = makePoints()
        let writer = try DotSplatSceneWriter(toFileAtPath: source.path)
        try await writer.write(sourcePoints)
        try await writer.close()
        let edits = SplatEditSettings(
            exposureEV: 0.5,
            contrast: 1.1,
            cropXMin: 0.50,
            cropXMax: 1,
            cropYMin: 0,
            cropYMax: 1,
            cropZMin: 0,
            cropZMax: 1
        )
        let sidecar = source.deletingPathExtension().appendingPathExtension("viewer.json")
        try JSONEncoder().encode(edits).write(to: sidecar, options: .atomic)

        let edited = try SplatPersistedEditMaterializer.materializeInMemory(
            sourceURL: source,
            points: sourcePoints
        )
        XCTAssertEqual(edited.count, 2)
        XCTAssertTrue(edited.allSatisfy { $0.position.x >= -0.05 })
    }

'''
          marker = '    private func makeCommittedProjectResult(in root: URL) async throws -> URL {\n'
          if marker not in t:
              raise SystemExit('test insertion marker missing')
          t = t.replace(marker, insert + marker, 1)
          tests_path.write_text(t, encoding='utf-8')
          PY

          git diff --check
          grep -q 'enum SplatPersistedEditMaterializer' splat-native-ios/SplatNative/SplatExportService.swift
          grep -q 'materializeInMemory' splat-native-ios/SplatNative/SplatVideoExporter.swift
          grep -q 'testBrowserSharePackageUsesPersistedViewerCrop' splat-native-ios/SplatNativeTests/SplatExportServiceTests.swift
      - name: Commit parity fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatExportService.swift \
                  splat-native-ios/SplatNative/SplatVideoExporter.swift \
                  splat-native-ios/SplatNativeTests/SplatExportServiceTests.swift
          git commit -m 'fix(scaniverse): materialize viewer edits in shared outputs'
          git push origin HEAD:feature/splat-native-ios-poc
