name: Temporary main sync for West-A final audit

on:
  push:
    branches:
      - 'audit/main-west-a-ten-round-verification-final-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[west-a-final-main-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync regional corrections and final audit
        run: |
          git fetch origin region/west
          git checkout origin/region/west -- \
            jichitai-compare/data/municipalities/40/40448.json \
            jichitai-compare/data/municipalities/46/46530.json \
            jichitai-compare/operations/tasks/40448.json \
            jichitai-compare/operations/tasks/46530.json \
            jichitai-compare/operations/audits/west-a-research-verification-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/west-a.json
          cd jichitai-compare
          npm run generate
          npm run progress
      - name: Commit nationwide correction and final audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m '[west-a-final-main-sync] audit: publish final West-A verification corrections'
          git push
