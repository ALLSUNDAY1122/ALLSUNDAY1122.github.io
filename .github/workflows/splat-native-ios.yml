name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
concurrency:
  group: splat-native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Static checks
        run: |
          bash splat-native-ios/scripts/validate.sh
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | grep -q '1024'
      - name: Generate project and verify bundled resources
        working-directory: splat-native-ios
        run: |
          xcodegen generate
          grep -q 'msplat-APACHE-2.0.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MetalSplatter-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nanoflann-BSD.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nlohmann-json-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MsplatRuntimeSmokeTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatExportServiceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshExportServiceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatVideoConfigurationTests.swift' SplatNative.xcodeproj/project.pbxproj
      - name: Resolve packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative
      - name: Build test bundle for iOS Simulator
        timeout-minutes: 8
        working-directory: splat-native-ios
        run: |
          set -euo pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run S6 export regression tests on iOS Simulator
        timeout-minutes: 10
        working-directory: splat-native-ios
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/simulators.json
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/simulators.json'))
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if '.iOS-' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      candidates.append((runtime, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "Using simulator: $SIMULATOR_ID"
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test \
            -only-testing:SplatNativeTests/SplatExportServiceTests \
            -only-testing:SplatNativeTests/MeshExportServiceTests \
            -only-testing:SplatNativeTests/SplatVideoConfigurationTests
      - name: Compile for iPhone without signing
        id: compile
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/splat-build.log
          status=${PIPESTATUS[0]}
          grep -E '(^|:) error:|(^|:) warning:' /tmp/splat-build.log | tail -200 > /tmp/splat-diagnostics.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish compile diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- splat-native-build-diagnostics -->'
            echo '### Splat Native build diagnostics'
            echo '```text'
            if [ -s /tmp/splat-diagnostics.txt ]; then
              cat /tmp/splat-diagnostics.txt
            else
              echo 'No compiler error/warning lines captured.'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Fail if compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
