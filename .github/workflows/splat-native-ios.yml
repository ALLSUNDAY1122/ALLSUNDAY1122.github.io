name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
concurrency:
  group: splat-native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCANLAB_E2E_EMAIL: ${{ secrets.SCANLAB_E2E_EMAIL }}
      SCANLAB_E2E_PASSWORD: ${{ secrets.SCANLAB_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Static checks
        run: |
          bash splat-native-ios/scripts/validate.sh
          python3 splat-native-ios/scripts/test_auth_workflow_contract.py
          python3 splat-native-ios/scripts/d2_trusted_upload_gate.py
          python3 splat-native-ios/scripts/test_mesh_durability_contract.py
          python3 splat-native-ios/scripts/test_worldmap_durability_contract.py
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | grep -q '1024'
      - name: Hosted ScanLab auth readiness gate
        shell: bash
        run: |
          set -euo pipefail
          node splat-native-ios/scripts/scanlab_auth_readiness.mjs | tee /tmp/scanlab-auth-readiness.json
          grep -q '"status":"PASS"' /tmp/scanlab-auth-readiness.json
      - name: Live ScanLab auth/session/profile E2E gate
        if: ${{ env.SCANLAB_E2E_EMAIL != '' && env.SCANLAB_E2E_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node splat-native-ios/scripts/scanlab_auth_e2e.mjs | tee /tmp/scanlab-auth-e2e.json
          grep -q '"status":"PASS"' /tmp/scanlab-auth-e2e.json
          echo 'LIVE_E2E_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Live ScanLab auth E2E blocked by missing test identity
        if: ${{ env.SCANLAB_E2E_EMAIL == '' || env.SCANLAB_E2E_PASSWORD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'LIVE_E2E_BLOCKED_BY_TEST_IDENTITY' | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'SCANLAB_E2E_EMAIL / SCANLAB_E2E_PASSWORD are not configured; no fake production identity will be created.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: S2 reconstruction contracts
        run: python3 splat-native-ios/scripts/test_reconstruction_contracts.py
      - name: D2 browser viewer contracts
        run: python3 splat-native-ios/scripts/test_browser_viewer_contracts.py
      - name: D2 live viewer readiness
        run: python3 splat-native-ios/scripts/test_browser_viewer_live_readiness.py
      - name: Generate project and verify bundled resources
        working-directory: splat-native-ios
        run: |
          xcodegen generate
          grep -q 'msplat-APACHE-2.0.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MetalSplatter-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nanoflann-BSD.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nlohmann-json-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MsplatRuntimeSmokeTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatReconstructionPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatCompletionVerifierTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatPreviousResultEvidenceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatProjectTrustRecoveryTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanTrashLifecycleTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanColdResumePersistenceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanPersistenceIntegrationTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatVideoConfigurationTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatVideoExporterTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatTransientExportWorkspaceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshExportServiceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshThirdPartyReaderCompatibilityTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshExportAdmissionTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshExportMemoryPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshProjectStoreTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshProjectIntegrityTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'CaptureMotionQualityTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatResourceGuardAdaptiveTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatSeedColorizerMultiViewTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatSkySeederDedupTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanLabSessionPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanLabPublishPackageTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanLabGeotagPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'ScanReportPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
      - name: Resolve packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative
      - name: Build msplat smoke-test bundle for iOS Simulator
        timeout-minutes: 8
        working-directory: splat-native-ios
        run: |
          set -euo pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run integrated A2 and C2 regressions
        timeout-minutes: 12
        working-directory: splat-native-ios
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for runtime,devices in data.get("devices",{}).items() if "iOS" in runtime for d in devices if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "$SIMULATOR_ID"
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building \
            -only-testing:SplatNativeTests/CaptureMotionQualityTests \
            -only-testing:SplatNativeTests/SplatResourceGuardAdaptiveTests \
            -only-testing:SplatNativeTests/SplatSeedColorizerMultiViewTests \
            -only-testing:SplatNativeTests/SplatSkySeederDedupTests \
            -only-testing:SplatNativeTests/ScanProjectStoreTests \
            -only-testing:SplatNativeTests/ScanColdResumePersistenceTests \
            -only-testing:SplatNativeTests/ScanPersistenceIntegrationTests \
            -only-testing:SplatNativeTests/SplatCompletionVerifierTests \
            -only-testing:SplatNativeTests/SplatPreviousResultEvidenceTests \
            -only-testing:SplatNativeTests/SplatProjectTrustRecoveryTests \
            -only-testing:SplatNativeTests/SplatExportAdmissionTests \
            -only-testing:SplatNativeTests/SplatExportServiceTests \
            -only-testing:SplatNativeTests/SplatTransientExportWorkspaceTests \
            -only-testing:SplatNativeTests/ScanTrashLifecycleTests \
            -only-testing:SplatNativeTests/SplatVideoConfigurationTests \
            -only-testing:SplatNativeTests/SplatVideoExporterTests \
            -only-testing:SplatNativeTests/MeshExportServiceTests \
            -only-testing:SplatNativeTests/MeshExportAdmissionTests \
            -only-testing:SplatNativeTests/MeshExportMemoryPolicyTests \
            -only-testing:SplatNativeTests/MeshProjectStoreTests \
            -only-testing:SplatNativeTests/MeshProjectIntegrityTests
      - name: Reader compatibility OBJ
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testOBJReopensThroughAssimp
      - name: Reader compatibility FBX
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testFBXReopensThroughAssimp
      - name: Reader compatibility GLB
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testGLBReopensThroughAssimp
      - name: Reader compatibility STL
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testSTLReopensThroughAssimp
      - name: Reader compatibility PLY
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testPLYReopensThroughAssimp
      - name: Reader compatibility USDZ
        timeout-minutes: 4
        working-directory: splat-native-ios
        run: bash scripts/run_mesh_reader_compat_test.sh testUSDZReopensThroughModelIOWhenAdvertised
      - name: Compile for iPhone without signing
        id: compile
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/splat-build.log
          status=${PIPESTATUS[0]}
          grep -E '(^|:) error:|(^|:) warning:|fatal error:|BUILD FAILED|The following build commands failed:|Command .* failed|linker command failed|Undefined symbols|duplicate symbol|Could not|unable to' /tmp/splat-build.log | tail -240 > /tmp/splat-diagnostics.txt || true
          if [ "$status" -ne 0 ] && [ ! -s /tmp/splat-diagnostics.txt ]; then
            {
              echo 'xcodebuild exited non-zero without a matched compiler diagnostic. Last 240 build-log lines:'
              tail -240 /tmp/splat-build.log
            } > /tmp/splat-diagnostics.txt
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish compile diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- splat-native-build-diagnostics -->'
            echo '### Splat Native build diagnostics'
            echo '```text'
            if [ -s /tmp/splat-diagnostics.txt ]; then
              cat /tmp/splat-diagnostics.txt
            else
              echo 'No compiler error/warning lines captured.'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Fail if compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1