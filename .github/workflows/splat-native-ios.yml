name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
concurrency:
  group: splat-native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Static checks
        run: |
          bash splat-native-ios/scripts/validate.sh
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | grep -q '1024'
      - name: D2 durable asset self-contained live E2E
        if: github.ref_name == 'scaniverse/d2-w06-durable-url'
        env:
          SUPABASE_URL: https://gybchnyqlqwmajwkhsly.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --check splat-native-ios/scripts/live_scanlab_durable_asset_selftest.mjs
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo 'D2_DURABLE_ASSET_LIVE_E2E=BLOCKED_BY_SERVER_CREDENTIALS' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          D2_DURABLE_ASSET_E2E=1 SCANLAB_DURABLE_WAIT_SECONDS=125 \
            node splat-native-ios/scripts/live_scanlab_durable_asset_selftest.mjs
          echo 'D2_DURABLE_ASSET_LIVE_E2E=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: S2 reconstruction contracts
        run: python3 splat-native-ios/scripts/test_reconstruction_contracts.py
      - name: Generate project and verify bundled resources
        working-directory: splat-native-ios
        run: |
          xcodegen generate
          grep -q 'msplat-APACHE-2.0.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MetalSplatter-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nanoflann-BSD.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nlohmann-json-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MsplatRuntimeSmokeTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatReconstructionPolicyTests.swift' SplatNative.xcodeproj/project.pbxproj
      - name: Resolve packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative
      - name: Build msplat smoke-test bundle for iOS Simulator
        timeout-minutes: 8
        working-directory: splat-native-ios
        run: |
          set -euo pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Compile for iPhone without signing
        id: compile
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/splat-build.log
          status=${PIPESTATUS[0]}
          grep -E '(^|:) error:|(^|:) warning:|fatal error:|BUILD FAILED|The following build commands failed:|Command .* failed|linker command failed|Undefined symbols|duplicate symbol|Could not|unable to' /tmp/splat-build.log | tail -240 > /tmp/splat-diagnostics.txt || true
          if [ "$status" -ne 0 ] && [ ! -s /tmp/splat-diagnostics.txt ]; then
            {
              echo 'xcodebuild exited non-zero without a matched compiler diagnostic. Last 240 build-log lines:'
              tail -240 /tmp/splat-build.log
            } > /tmp/splat-diagnostics.txt
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish compile diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- splat-native-build-diagnostics -->'
            echo '### Splat Native build diagnostics'
            echo '```text'
            if [ -s /tmp/splat-diagnostics.txt ]; then
              cat /tmp/splat-diagnostics.txt
            else
              echo 'No compiler error/warning lines captured.'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Fail if compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
