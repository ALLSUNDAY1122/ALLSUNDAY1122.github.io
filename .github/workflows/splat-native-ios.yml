name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
concurrency:
  group: splat-native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Static checks
        run: |
          bash splat-native-ios/scripts/validate.sh
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | grep -q '1024'
      - name: Generate project and verify bundled resources
        working-directory: splat-native-ios
        run: |
          xcodegen generate
          grep -q 'msplat-APACHE-2.0.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MetalSplatter-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nanoflann-BSD.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nlohmann-json-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MsplatRuntimeSmokeTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatExportServiceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MeshExportServiceTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatVideoConfigurationTests.swift' SplatNative.xcodeproj/project.pbxproj
          grep -q 'SplatVideoExporterTests.swift' SplatNative.xcodeproj/project.pbxproj
      - name: Resolve packages
        id: resolve
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project SplatNative.xcodeproj -scheme SplatNative \
            2>&1 | tee /tmp/s6-resolve.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Build test bundle for iOS Simulator
        id: testbundle
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee /tmp/s6-testbundle.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Run S6 export regression tests on iOS Simulator
        id: runtime
        if: steps.resolve.outcome == 'success' && steps.testbundle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: splat-native-ios
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/simulators.json
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/simulators.json'))
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if '.iOS-' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      candidates.append((runtime, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "Using simulator: $SIMULATOR_ID"
          set +e
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test \
            -only-testing:SplatNativeTests/SplatExportServiceTests \
            -only-testing:SplatNativeTests/MeshExportServiceTests \
            -only-testing:SplatNativeTests/SplatVideoConfigurationTests \
            -only-testing:SplatNativeTests/SplatVideoExporterTests \
            2>&1 | tee /tmp/s6-runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Compile for iPhone without signing
        id: compile
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/s6-build.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Collect S6 xcodebuild diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          : > /tmp/s6-diagnostics.txt
          for spec in \
            'Package resolve:/tmp/s6-resolve.log' \
            'Simulator test bundle:/tmp/s6-testbundle.log' \
            'S6 runtime tests:/tmp/s6-runtime.log' \
            'iPhone Release compile:/tmp/s6-build.log'; do
            label="${spec%%:*}"
            file="${spec#*:}"
            if [ ! -s "$file" ]; then
              continue
            fi
            {
              echo "===== $label ====="
              grep -E '(^|:) error:|fatal error:|Undefined symbols|ld: |No such module|module map|Command .* failed|BUILD FAILED|TEST FAILED' "$file" | tail -200
            } >> /tmp/s6-diagnostics.txt
          done
          if [ ! -s /tmp/s6-diagnostics.txt ]; then
            echo 'No xcodebuild error lines captured; all executed xcodebuild gates may have succeeded.' > /tmp/s6-diagnostics.txt
          fi
      - name: Publish S6 diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- splat-native-build-diagnostics -->'
            echo '### Splat Native S6 xcodebuild diagnostics'
            echo '```text'
            cat /tmp/s6-diagnostics.txt
            echo '```'
            echo "resolve=${{ steps.resolve.outcome }} testbundle=${{ steps.testbundle.outcome }} runtime=${{ steps.runtime.outcome }} compile=${{ steps.compile.outcome }}"
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Fail if any S6 xcodebuild gate failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.resolve.outcome }}" = "success"
          test "${{ steps.testbundle.outcome }}" = "success"
          test "${{ steps.runtime.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
