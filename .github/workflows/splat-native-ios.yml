name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
concurrency:
  group: splat-native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PoC AppIcon
        run: python3 splat-native-ios/scripts/make_test_icon.py
      - name: Static checks
        run: |
          bash splat-native-ios/scripts/validate.sh
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | grep -q '1024'
      - name: Generate project and verify bundled resources
        working-directory: splat-native-ios
        run: |
          xcodegen generate
          grep -q 'msplat-APACHE-2.0.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MetalSplatter-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nanoflann-BSD.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'nlohmann-json-MIT.txt' SplatNative.xcodeproj/project.pbxproj
          grep -q 'MsplatRuntimeSmokeTests.swift' SplatNative.xcodeproj/project.pbxproj
      - name: Resolve packages
        id: resolve
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project SplatNative.xcodeproj -scheme SplatNative \
            2>&1 | tee /tmp/splat-resolve.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Run msplat runtime smoke test on iOS Simulator
        id: runtime
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        working-directory: splat-native-ios
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime, candidates in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in candidates:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          '
          )"
          test -n "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          set +e
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee /tmp/splat-runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Compile for iPhone without signing
        id: compile
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/splat-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Collect xcodebuild diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          : > /tmp/splat-diagnostics.txt
          for spec in \
            'Package resolve:/tmp/splat-resolve.log' \
            'Runtime XCTest:/tmp/splat-runtime.log' \
            'iPhone Release compile:/tmp/splat-build.log'; do
            label="${spec%%:*}"
            file="${spec#*:}"
            if [ ! -s "$file" ]; then
              continue
            fi
            {
              echo "===== $label ====="
              grep -E '(^|:) error:|fatal error:|Undefined symbols|ld: |No such module|module map|Command .* failed|BUILD FAILED|TEST FAILED' "$file" | tail -200
            } >> /tmp/splat-diagnostics.txt
          done
          if [ ! -s /tmp/splat-diagnostics.txt ]; then
            echo 'No xcodebuild error lines captured; all executed xcodebuild gates may have succeeded.' > /tmp/splat-diagnostics.txt
          fi
      - name: Publish xcodebuild diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- splat-native-build-diagnostics -->'
            echo '### Splat Native xcodebuild diagnostics'
            echo '```text'
            cat /tmp/splat-diagnostics.txt
            echo '```'
            echo "resolve=${{ steps.resolve.outcome }} runtime=${{ steps.runtime.outcome }} compile=${{ steps.compile.outcome }}"
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Fail if any xcodebuild gate failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.resolve.outcome }}" = "success"
          test "${{ steps.runtime.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
