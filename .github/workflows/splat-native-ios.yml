name: Splat Native iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-ios.yml'
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git LFS smudge for SwiftPM source checkout
        run: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Static checks
        run: bash splat-native-ios/scripts/validate.sh
      - name: Generate project
        working-directory: splat-native-ios
        run: xcodegen generate
      - name: Resolve packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative
      - name: Compile for iPhone without signing
        working-directory: splat-native-ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/splat-build.log
          status=${PIPESTATUS[0]}
          echo '===== SPLAT BUILD DIAGNOSTICS ====='
          grep -E '(^|:) error:|(^|:) warning:' /tmp/splat-build.log | tail -200 || true
          {
            echo '## Splat Native build diagnostics'
            echo '```text'
            grep -E '(^|:) error:|(^|:) warning:' /tmp/splat-build.log | tail -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
