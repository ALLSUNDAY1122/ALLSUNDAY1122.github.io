name: Temporary West B Postpartum Care Region Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-postpartum-region-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ops/run-west-b-postpartum-region-sync-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/west
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync postpartum care corrections from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/west
          git switch -C sync/west-b-postpartum-corrections-20260725 origin/region/west
          paths=(
            jichitai-compare/data/municipalities/35/35502.json
            jichitai-compare/data/municipalities/36/36301.json
            jichitai-compare/data/municipalities/38/38214.json
            jichitai-compare/operations/tasks/35502.json
            jichitai-compare/operations/tasks/36301.json
            jichitai-compare/operations/tasks/38214.json
            jichitai-compare/operations/audits/west-b-postpartum-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-b-postpartum-priority-review-20260725.json
            jichitai-compare/operations/audits/west-b-postpartum-status-focus-review-20260725.json
            jichitai-compare/operations/audits/west-b-postpartum-official-review-20260725.json
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/main:$path" > "$path"
          done
          git show origin/main:jichitai-compare/operations/control/session-checkpoints/west-b.json > /tmp/main-west-b.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const regionPath = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const region = JSON.parse(fs.readFileSync(regionPath, 'utf8'));
          const main = JSON.parse(fs.readFileSync('/tmp/main-west-b.json', 'utf8'));
          region.postpartumCareCrosscheck = main.postpartumCareCrosscheck;
          region.updatedAt = main.updatedAt;
          fs.writeFileSync(regionPath, JSON.stringify(region, null, 2) + '\n');
          NODE
      - name: Regenerate and validate region
        working-directory: jichitai-compare
        run: npm run check
      - name: Commit and push regional sync branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare
          git commit -m 'sync: 西日本B産後ケア3件をregion/westへ反映'
          git push --force origin HEAD:sync/west-b-postpartum-corrections-20260725
