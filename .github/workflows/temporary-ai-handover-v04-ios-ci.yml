name: Temporary macOS Smoke CI

on:
  pull_request:
    paths:
      - patches/**
      - .github/workflows/temporary-ai-handover-v04-ios-ci.yml

permissions:
  contents: read

jobs:
  macos-smoke:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record macOS and Xcode
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
