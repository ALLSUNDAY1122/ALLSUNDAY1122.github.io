name: Otsu4 Build Number Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-BUILDNUM-FIX]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Replace agvtool mutation with numeric pbxproj mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          old='''      - name: Set build number\n        script: |\n          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"\n          agvtool new-version -all "$CM_BUILD_NUMBER"\n'''
          new='''      - name: Set numeric build number\n        script: |\n          set -euo pipefail\n          case "$CM_BUILD_NUMBER" in\n            ''|*[!0-9]*) echo "CM_BUILD_NUMBER must be numeric: $CM_BUILD_NUMBER" >&2; exit 1 ;;\n          esac\n          PBX="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj/project.pbxproj"\n          python3 - "$PBX" "$CM_BUILD_NUMBER" <<'PY2'\n          from pathlib import Path\n          import re,sys\n          path=Path(sys.argv[1]); number=sys.argv[2]\n          if not number.isdigit(): raise SystemExit('non-numeric build number')\n          text=path.read_text(encoding='utf-8')\n          text,n=re.subn(r'CURRENT_PROJECT_VERSION = [^;]+;', f'CURRENT_PROJECT_VERSION = {number};', text)\n          if n < 1: raise SystemExit('CURRENT_PROJECT_VERSION not found')\n          if re.search(r'CURRENT_PROJECT_VERSION = (YES|NO);', text): raise SystemExit('boolean build number remains')\n          path.write_text(text,encoding='utf-8')\n          print(f'PASS: CURRENT_PROJECT_VERSION={number} replacements={n}')\n          PY2\n'''
          if old not in s:
              raise SystemExit('expected otsu4 agvtool block not found; refusing broad edit')
          if s.count(old) != 1:
              raise SystemExit(f'expected one otsu4 agvtool block, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          grep -A20 -B2 'Set numeric build number' codemagic.yaml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'fix(otsu4): force numeric CURRENT_PROJECT_VERSION in RC build'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 build-number repair finished. status=${{ job.status }}; run_id=${context.runId}`});
