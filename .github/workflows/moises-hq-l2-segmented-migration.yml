name: Moises HQ Lane2 Segmented Migration

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Shared/**'
      - 'tech-assets/moises-audio/IO/**'
      - 'tech-assets/moises-audio/Library/Sources/**'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedMigrationTests.swift'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedMigrationPathAuthorityTests.swift'
      - '.github/workflows/moises-hq-l2-segmented-migration.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Shared/**'
      - 'tech-assets/moises-audio/IO/**'
      - 'tech-assets/moises-audio/Library/Sources/**'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedMigrationTests.swift'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedMigrationPathAuthorityTests.swift'
      - '.github/workflows/moises-hq-l2-segmented-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l2-segmented-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lane2-segmented-migration-xctest:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Lane2 segmented migration filesystem regressions
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/l2-segmented-migration-xctest
          rm -rf "$tmp"
          mkdir -p "$tmp/Sources/Lane2Migration/Shared" "$tmp/Sources/Lane2Migration/IO" "$tmp/Sources/Lane2Migration/Library" "$tmp/Tests/Lane2MigrationTests"
          cp Shared/DomainContracts.swift Shared/LibraryContracts.swift "$tmp/Sources/Lane2Migration/Shared/"
          cp IO/Sources/*.swift "$tmp/Sources/Lane2Migration/IO/"
          cp Library/Sources/*.swift "$tmp/Sources/Lane2Migration/Library/"
          for file in \
            Library/Tests/ManagedArtifactSegmentedMigrationTests.swift \
            Library/Tests/ManagedArtifactSegmentedMigrationPathAuthorityTests.swift
          do
            out="$tmp/Tests/Lane2MigrationTests/$(basename "$file")"
            printf '@testable import Lane2Migration\n' > "$out"
            cat "$file" >> "$out"
          done
          cat > "$tmp/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Lane2SegmentedMigrationCI",
              targets: [
                  .target(name: "Lane2Migration", path: "Sources/Lane2Migration"),
                  .testTarget(name: "Lane2MigrationTests", dependencies: ["Lane2Migration"], path: "Tests/Lane2MigrationTests")
              ]
          )
          SWIFT
          swift test --package-path "$tmp" --parallel
