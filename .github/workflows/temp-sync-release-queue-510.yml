name: Temporary Sync Release Queue 510
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-sync-release-queue-510.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync queue and self-delete
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('jichitai-compare/operations/control/release-queue.json'); q=json.loads(p.read_text()); es={e['region']:e for e in q['entries']}
          fs={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(r,x): return subprocess.check_output(['git','show',f'{r}:{x}'],text=True)
          def own(r,n):
            n=int(n); return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          for r in es:
            ref=f'origin/region/{r}'; items=[]
            for x in subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines():
              if re.search(r'/\d{5}\.json$',x):
                d=json.loads(show(ref,x))
                if own(r,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
            items.sort(key=lambda x:x['code']); s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json')); n=int(s.get(fs[r],0)); e=es[r]
            e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':n,'releaseStatus':'release_ready' if n>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の繰越は{n}自治体','mainIntegrationPr':s.get('lastNationalIntegrationPr'),'generatedPullRequest':783,'auditStatus':'passed'})
          total=sum(e['count'] for e in q['entries']); pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T18:53:00+09:00'; q['status']='active'; q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':494,'latestGeneratedPullRequest':783,'latestPublicCountPullRequest':783,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。10自治体到達地域なし。"}
          p.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n'); Path('/tmp/total').write_text(str(total))
          PY
          total=$(cat /tmp/total)
          git rm .github/workflows/temp-sync-release-queue-510.yml
          git add jichitai-compare/operations/control/release-queue.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "統括管理: 地方統合${total}自治体・公開494自治体へ同期"
          for i in 1 2 3 4 5; do git fetch origin main; git rebase origin/main; git push origin HEAD:main && exit 0; sleep 2; done
          exit 1
