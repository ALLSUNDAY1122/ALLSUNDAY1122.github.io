name: Clipboard Widget Resume TestFlight

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-resume-testflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read App Store Connect app by Bundle ID
        id: asc
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.app_store_connect_api import api_get, load_private_key, make_token

          issuer=os.environ['ASC_ISSUER_ID']
          key_id=os.environ['ASC_KEY_ID']
          key_path, cleanup=load_private_key()
          try:
              token=make_token(issuer,key_id,key_path)
              status,payload=api_get(token,'/v1/apps?filter%5BbundleId%5D=jp.allsunday1122.clipboardwidget&limit=10')
          finally:
              if cleanup:
                  cleanup.unlink(missing_ok=True)
          data=(payload or {}).get('data') or []
          matches=[]
          for item in data:
              attrs=item.get('attributes') or {}
              if attrs.get('bundleId')=='jp.allsunday1122.clipboardwidget':
                  matches.append({'id':item.get('id'),'name':attrs.get('name'),'bundleId':attrs.get('bundleId'),'sku':attrs.get('sku'),'primaryLocale':attrs.get('primaryLocale')})
          evidence={'http_status':status,'bundle_id':'jp.allsunday1122.clipboardwidget','match_count':len(matches),'matches':matches}
          Path('/tmp/clipboard-asc-read.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          if len(matches)==1 and matches[0].get('id'):
              Path('/tmp/clipboard-asc-app-id.txt').write_text(str(matches[0]['id']))
          PY
          if [[ -f /tmp/clipboard-asc-app-id.txt ]]; then
            echo "app_exists=true" >> "$GITHUB_OUTPUT"
            echo "app_id=$(cat /tmp/clipboard-asc-app-id.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "app_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist ASC read evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          mkdir -p automation/clipboard-widget/evidence
          cp /tmp/clipboard-asc-read.json automation/clipboard-widget/evidence/asc-app-record-readback.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/asc-app-record-readback.json
          git commit -m 'chore: record clipboard ASC app readback' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Stop at true human gate when App record is absent
        if: steps.asc.outputs.app_exists != 'true'
        run: |
          echo 'HUMAN_REQUIRED: App Store Connect app record is still absent for jp.allsunday1122.clipboardwidget.' >&2
          exit 42

      - name: Trigger signed TestFlight build
        id: tf
        if: steps.asc.outputs.app_exists == 'true'
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-phase0-testflight-20260830-r12","action":"build","workflow_id":"clipboard-widget-phase0","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":4200,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-tf-command.json
          python3 scripts/codemagic_build_gateway.py --command /tmp/cm-tf-command.json --output /tmp/cm-tf-result.json

      - name: Persist Codemagic TestFlight result
        if: always() && steps.asc.outputs.app_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/cm-tf-result.json || exit 0
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          mkdir -p automation/clipboard-widget/evidence
          python3 scripts/clipboard_widget_persist_cm_result.py --input /tmp/cm-tf-result.json --output automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git commit -m 'chore: record clipboard TestFlight r12' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Verify Apple build appears for app
        if: steps.asc.outputs.app_exists == 'true' && steps.tf.outcome == 'success'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ steps.asc.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from scripts.app_store_connect_api import api_get, load_private_key, make_token

          key_path, cleanup=load_private_key()
          try:
              token=make_token(os.environ['ASC_ISSUER_ID'],os.environ['ASC_KEY_ID'],key_path)
              found=[]
              last_status=None
              for _ in range(30):
                  last_status,payload=api_get(token,f"/v1/apps/{os.environ['ASC_APP_ID']}/builds?limit=20")
                  data=(payload or {}).get('data') or []
                  if data:
                      found=[]
                      for item in data:
                          attrs=item.get('attributes') or {}
                          found.append({'id':item.get('id'),'version':attrs.get('version'),'uploadedDate':attrs.get('uploadedDate'),'processingState':attrs.get('processingState'),'expired':attrs.get('expired'),'minOsVersion':attrs.get('minOsVersion')})
                      break
                  time.sleep(20)
          finally:
              if cleanup:
                  cleanup.unlink(missing_ok=True)
          Path('/tmp/clipboard-apple-build-readback.json').write_text(json.dumps({'http_status':last_status,'app_id':os.environ['ASC_APP_ID'],'builds':found},ensure_ascii=False,indent=2)+'\n')
          if not found:
              raise SystemExit('No Apple build resource appeared within polling window')
          PY

      - name: Persist Apple build readback
        if: always() && steps.asc.outputs.app_exists == 'true' && hashFiles('/tmp/clipboard-apple-build-readback.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          mkdir -p automation/clipboard-widget/evidence
          cp /tmp/clipboard-apple-build-readback.json automation/clipboard-widget/evidence/apple-build-readback.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/apple-build-readback.json
          git commit -m 'chore: record clipboard Apple build readback' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc
