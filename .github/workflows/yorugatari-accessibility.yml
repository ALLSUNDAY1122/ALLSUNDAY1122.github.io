name: Audit Yorugatari accessibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/index.html
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/archive.html
      - yorugatari/privacy.html
      - yorugatari/stories/spare-key-returned.html
      - yorugatari/assets/app.js
      - yorugatari/assets/archive.js
      - yorugatari/assets/story.js
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-share.js
      - yorugatari/assets/landing-start-20260724-001.js
      - yorugatari/assets/styles.css
      - yorugatari/tools/campaigns.json
      - yorugatari/tools/normalize-engagement.mjs
      - yorugatari/tools/live-release-audit.mjs
      - yorugatari/tools/accessibility-audit.cjs
      - .github/workflows/yorugatari-accessibility.yml

concurrency:
  group: yorugatari-accessibility-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate audit syntax
        shell: bash
        run: |
          node --check yorugatari/tools/live-release-audit.mjs
          node --check yorugatari/tools/accessibility-audit.cjs
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js

      - name: Wait for published accessibility release
        run: node yorugatari/tools/live-release-audit.mjs

      - name: Install accessibility browser tools
        shell: bash
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Audit published accessibility
        id: audit
        continue-on-error: true
        run: node yorugatari/tools/accessibility-audit.cjs

      - name: Record accessibility report
        if: always()
        shell: bash
        run: |
          test -f yorugatari-accessibility-report.json
          cp yorugatari-accessibility-report.json /tmp/yorugatari-accessibility-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/yorugatari-accessibility-report.json yorugatari/tools/accessibility-audit-latest.json
            git add yorugatari/tools/accessibility-audit-latest.json
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari accessibility audit [skip ci]"
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            sleep 3
          done
          test "$saved" = true

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-accessibility-report
          path: yorugatari-accessibility-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce accessibility result
        if: always()
        shell: bash
        run: |
          node -e "const report=require('./yorugatari-accessibility-report.json'); if(!report.success){console.error(JSON.stringify(report.failures,null,2)); process.exit(1)}"
