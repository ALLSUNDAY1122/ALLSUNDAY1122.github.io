name: Temporary West B School Meals Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-school-meals-public-verify-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'ops/run-west-b-school-meals-public-verify-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published pages and generated JSON
        shell: bash
        run: |
          set -euo pipefail
          git switch -C audit/west-b-school-meals-public-verification-20260725
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const cache = Date.now();
          const generatedUrl = `https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json?audit=${cache}`;
          const targets = [
            {
              code: '31390',
              name: '伯耆町',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/31390/?audit=${cache}`,
              summary: '令和8年度は小学校・中学校の学校給食費を無償化',
              sourceUrl: 'https://www.houki-town.jp/new1/10/3/3/u521/'
            },
            {
              code: '36204',
              name: '阿南市',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/36204/?audit=${cache}`,
              summary: '令和8年度は幼稚園・小学校・中学3年生の給食費を無償化し、中学1・2年生の物価高騰分を補助',
              sourceUrl: 'https://www.city.anan.tokushima.jp/docs/2026032300022/file_contents/ANAN202604No813_Part6-9.pdf'
            },
            {
              code: '47303',
              name: '東村',
              pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/47303/?audit=${cache}`,
              summary: '村内在住児童生徒の保護者へ学校給食費の一部を助成',
              sourceUrl: 'https://www.vill.higashi.okinawa.jp/material/files/group/5/gakkoukyuusyokuhijyosei.pdf'
            }
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let result = null;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const pages = {};
            let allPages = true;
            for (const target of targets) {
              try {
                const response = await fetch(target.pageUrl, { redirect: 'follow', cache: 'no-store' });
                const text = await response.text();
                const success = response.status === 200 && text.includes(target.summary) && text.includes(target.sourceUrl);
                pages[target.code] = {
                  code: target.code,
                  name: target.name,
                  url: target.pageUrl,
                  status: response.status,
                  summaryPresent: text.includes(target.summary),
                  sourceUrlPresent: text.includes(target.sourceUrl),
                  success
                };
                allPages &&= success;
              } catch (error) {
                pages[target.code] = { code: target.code, name: target.name, url: target.pageUrl, status: null, success: false, error: String(error) };
                allPages = false;
              }
            }

            let generated = { url: generatedUrl, success: false };
            try {
              const response = await fetch(generatedUrl, { redirect: 'follow', cache: 'no-store' });
              const text = await response.text();
              const data = response.status === 200 ? JSON.parse(text) : null;
              const municipalities = Array.isArray(data) ? data : (data?.municipalities ?? []);
              const serviceCount = municipalities.reduce((sum, municipality) => sum + Object.keys(municipality.services ?? {}).length, 0);
              const checks = Object.fromEntries(targets.map((target) => {
                const municipality = municipalities.find((item) => item.code === target.code);
                return [target.code, Boolean(municipality && municipality.services?.schoolMeals?.summary === target.summary && municipality.services?.schoolMeals?.source?.url === target.sourceUrl)];
              }));
              generated = {
                url: generatedUrl,
                status: response.status,
                municipalityCount: municipalities.length,
                serviceCount,
                checks,
                success: response.status === 200 && municipalities.length === 1741 && serviceCount === 15669 && Object.values(checks).every(Boolean)
              };
            } catch (error) {
              generated = { url: generatedUrl, success: false, error: String(error) };
            }

            result = {
              schemaVersion: '1.0.0',
              auditId: 'west-b-school-meals-public-verification-20260725',
              verifiedAt: new Date().toISOString(),
              attempt,
              relatedMainPullRequest: 3454,
              relatedMainCiRun: 8399,
              relatedMainMergeCommit: '180b13e4a006d81a523784e0704e9d077fe2094e',
              relatedRegionPullRequest: 3463,
              relatedRegionCiRun: 8409,
              relatedRegionMergeCommit: '8bc2cea39759e765cf90f00b2801f5f3711c0cd3',
              pages,
              generatedJson: generated,
              success: allPages && generated.success,
              unresolvedConfirmedErrorCount: 0
            };
            if (result.success) break;
            await sleep(10000);
          }

          if (!result?.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }

          const base = 'jichitai-compare';
          const auditPath = `${base}/operations/audits/west-b-school-meals-public-verification-20260725.json`;
          fs.writeFileSync(auditPath, JSON.stringify(result, null, 2) + '\n');

          const officialPath = `${base}/operations/audits/west-b-school-meals-official-review-20260725.json`;
          const official = JSON.parse(fs.readFileSync(officialPath, 'utf8'));
          official.result = {
            status: 'completed_public_verified_region_integrated',
            confirmedCorrectionCount: 3,
            correctedCount: 3,
            unresolvedConfirmedErrorCount: 0,
            mainPullRequest: 3454,
            mainCiRun: 8399,
            mainMergeCommit: '180b13e4a006d81a523784e0704e9d077fe2094e',
            regionPullRequest: 3463,
            regionCiRun: 8409,
            regionMergeCommit: '8bc2cea39759e765cf90f00b2801f5f3711c0cd3',
            publicVerification: 'passed',
            publicVerificationId: result.auditId
          };
          fs.writeFileSync(officialPath, JSON.stringify(official, null, 2) + '\n');

          const checkpointPath = `${base}/operations/control/session-checkpoints/west-b.json`;
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = result.verifiedAt;
          checkpoint.schoolMealsCrosscheck = {
            auditId: 'west-b-school-meals-crosscheck-20260725',
            priorityReviewId: 'west-b-school-meals-priority-review-20260725',
            officialReviewId: 'west-b-school-meals-official-review-20260725',
            publicVerificationId: result.auditId,
            auditedMunicipalityCount: 250,
            mechanicalCandidateCount: 120,
            priorityCandidateCount: 26,
            confirmedCorrectionCount: 3,
            correctedCount: 3,
            municipalityCodes: ['31390', '47303', '36204'],
            status: 'completed_public_verified_region_integrated',
            mainPullRequest: 3454,
            mainCiRun: 8399,
            mainMergeCommit: '180b13e4a006d81a523784e0704e9d077fe2094e',
            regionPullRequest: 3463,
            regionCiRun: 8409,
            regionMergeCommit: '8bc2cea39759e765cf90f00b2801f5f3711c0cd3',
            publicVerification: 'passed',
            unresolvedConfirmedErrorCount: 0
          };
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Validate final record
        working-directory: jichitai-compare
        run: npm run check
      - name: Commit and push public verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare
          git commit -m 'audit: 西日本B学校給食費3件の公開反映を確認'
          git push --force origin HEAD:audit/west-b-school-meals-public-verification-20260725
