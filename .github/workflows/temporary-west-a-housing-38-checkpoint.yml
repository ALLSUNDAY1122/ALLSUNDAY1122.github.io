name: Temporary West A Housing 38 Checkpoint

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-housing-38-checkpoint-trigger-20260725.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'checkpoint/west-a-housing-classification-38-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Finalize regional audit and checkpoint records
        shell: bash
        env:
          CHECKPOINT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euxo pipefail
          git fetch origin main
          for path in \
            jichitai-compare/operations/audits/west-a-housing-classification-38-public-verification-20260725.json \
            jichitai-compare/operations/audits/west-a-housing-classification-38-public-summary-20260725.json; do
            mkdir -p "$(dirname "$path")"
            git show "origin/main:$path" > "$path"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const recordedAt = '2026-07-25T15:18:00+09:00';
          const checkpointPr = Number(process.env.CHECKPOINT_PR_NUMBER);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const write = (path, value) => fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');

          const crossPath = `${root}/operations/audits/west-a-housing-classification-crosscheck-20260725.json`;
          const cross = read(crossPath);
          cross.integration = {
            regionalPullRequestNumber: 3476,
            regionalCiRunNumber: 8480,
            regionalMergeSha: '740441982462d0cd0c17a0b536ccfc409a5d0ba1',
            nationalPullRequestNumber: 3498,
            nationalCiRunNumber: 8494,
            nationalMergeSha: 'c3c7b9f474cede030828538f9b40702a5e3e82aa',
            publicVerificationPullRequestNumber: 3505,
            publicVerificationCiRunNumber: 8509,
            publicVerificationMergeSha: 'd43d1f21e6be9d21bdaaec65e6a9db0031dc2876',
            checkpointPullRequestNumber: checkpointPr,
            status: 'regional_checkpoint_ci_pending'
          };
          cross.totalAppliedCorrectionCount = 38;
          cross.manualReviewPendingCount = 0;
          cross.fetchProblemPendingCount = 0;
          cross.unresolvedCount = 0;
          cross.status = 'completed_with_38_corrections_public_verified';
          cross.blocker = null;
          write(crossPath, cross);

          const highRiskPath = `${root}/operations/audits/west-a-housing-high-risk-summary-20260725.json`;
          const highRisk = read(highRiskPath);
          highRisk.totalAppliedCorrectionCount = 38;
          highRisk.manualReviewResolvedCount = highRisk.manualReviewRequiredCount;
          highRisk.fetchProblemResolvedCount = highRisk.fetchProblemCount;
          highRisk.publicVerificationPullRequestNumber = 3505;
          highRisk.unresolvedCount = 0;
          highRisk.status = 'completed_with_all_candidates_resolved';
          highRisk.blocker = null;
          write(highRiskPath, highRisk);

          const planPath = `${root}/operations/audits/west-a-housing-classification-correction-plan-20260725.json`;
          const plan = read(planPath);
          plan.totalAppliedCorrectionCount = 38;
          plan.manualReviewResolvedCount = plan.manualReviewCount;
          plan.fetchProblemResolvedCount = plan.fetchProblemCount;
          plan.regionalPullRequestNumber = 3476;
          plan.regionalCiRunNumber = 8480;
          plan.nationalPullRequestNumber = 3498;
          plan.nationalCiRunNumber = 8494;
          plan.publicVerificationPullRequestNumber = 3505;
          plan.publicVerificationCiRunNumber = 8509;
          plan.unresolvedCount = 0;
          plan.status = 'completed';
          plan.blocker = null;
          write(planPath, plan);

          const batch29Path = `${root}/operations/audits/west-a-housing-classification-29-corrections-20260725.json`;
          const batch29 = read(batch29Path);
          batch29.followupCorrectionCount = 9;
          batch29.totalCorrectionCount = 38;
          batch29.publicVerificationPullRequestNumber = 3505;
          batch29.unresolvedCount = 0;
          batch29.status = 'completed';
          batch29.blocker = null;
          write(batch29Path, batch29);

          const followupPath = `${root}/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json`;
          const followup = read(followupPath);
          followup.integration = {
            ...(followup.integration ?? {}),
            regionalPullRequestNumber: 3476,
            regionalCiRunNumber: 8480,
            regionalMergeSha: '740441982462d0cd0c17a0b536ccfc409a5d0ba1',
            nationalPullRequestNumber: 3498,
            nationalRegenerationRunnerRunId: 30146999714,
            nationalCiRunNumber: 8494,
            nationalMergeSha: 'c3c7b9f474cede030828538f9b40702a5e3e82aa',
            publicVerificationPullRequestNumber: 3505,
            publicVerificationWorkflowRunId: 30147154065,
            publicVerificationCiRunNumber: 8509,
            publicVerificationMergeSha: 'd43d1f21e6be9d21bdaaec65e6a9db0031dc2876',
            temporaryWorkflowsRemoved: true,
            checkpointPullRequestNumber: checkpointPr,
            status: 'regional_checkpoint_ci_pending'
          };
          followup.unresolvedCount = 0;
          followup.status = 'completed';
          followup.blocker = null;
          write(followupPath, followup);

          const publicSummaryPath = `${root}/operations/audits/west-a-housing-classification-38-public-summary-20260725.json`;
          const publicSummary = read(publicSummaryPath);
          publicSummary.publicVerificationCiRunNumber = 8509;
          publicSummary.publicVerificationMergeSha = 'd43d1f21e6be9d21bdaaec65e6a9db0031dc2876';
          publicSummary.checkpointPullRequestNumber = checkpointPr;
          publicSummary.unresolvedCount = 0;
          publicSummary.status = 'completed';
          publicSummary.blocker = null;
          write(publicSummaryPath, publicSummary);

          const newCheckpoint = {
            schemaVersion: '1.0.0',
            checkpointId: 'west-a-housing-classification-crosscheck-20260725',
            sessionId: 'west-a',
            displayName: '西日本調査班A',
            recordedAt,
            status: 'completed_with_38_housing_classification_corrections',
            scope: {
              prefectureCodes: ['33', '37', '39', '40', '43', '46'],
              municipalityCount: 226,
              housingSupportVerifiedBeforeAudit: 217,
              housingSupportUnavailableBeforeAudit: 9,
              initialCandidateCount: 143,
              officialPageChildTermsAbsentCount: 33,
              strongGeneralOnlyCandidateCount: 29,
              manualOrFetchFollowupCount: 9,
              correctedMunicipalityCount: 38,
              correctedServiceCount: 38,
              unresolvedCount: 0
            },
            classification: {
              before: '一般移住・空き家・住宅取得・リフォーム・耐震・除却等を子育て世帯向け住宅支援としてverified登録',
              after: '一般制度の事実と公式出典を保持し、子育て世帯固有条件が確認できない場合はhousingSupportをunavailable登録',
              policy: '子どもの有無、対象年齢、子育て世帯限定または子ども加算が公式情報で確認できる場合のみverified'
            },
            evidence: {
              crosscheckAudit: `${root}/operations/audits/west-a-housing-classification-crosscheck-20260725.json`,
              highRiskSummary: `${root}/operations/audits/west-a-housing-high-risk-summary-20260725.json`,
              correctionPlan: `${root}/operations/audits/west-a-housing-classification-correction-plan-20260725.json`,
              correction29Audit: `${root}/operations/audits/west-a-housing-classification-29-corrections-20260725.json`,
              followup9Audit: `${root}/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json`,
              publicVerificationAudit: `${root}/operations/audits/west-a-housing-classification-38-public-verification-20260725.json`,
              publicVerificationSummary: `${root}/operations/audits/west-a-housing-classification-38-public-summary-20260725.json`,
              regionalPullRequestNumber: 3476,
              regionalCiRunNumber: 8480,
              regionalMergeSha: '740441982462d0cd0c17a0b536ccfc409a5d0ba1',
              nationalPullRequestNumber: 3498,
              nationalCiRunNumber: 8494,
              nationalMergeSha: 'c3c7b9f474cede030828538f9b40702a5e3e82aa',
              publicVerificationPullRequestNumber: 3505,
              publicVerificationCiRunNumber: 8509,
              publicVerificationMergeSha: 'd43d1f21e6be9d21bdaaec65e6a9db0031dc2876',
              checkpointPullRequestNumber: checkpointPr
            },
            integrity: {
              publicPageTargetCount: 38,
              publicPageHttp200Count: 38,
              publicPageContentMatchCount: 38,
              publicGeneratedJsonMunicipalityCount: 1741,
              publicGeneratedJsonServiceCount: 15669,
              publicGeneratedJsonCorrectedStatusCount: 38,
              taskStatusMergedCount: 38,
              temporaryWorkflowRemainingCount: 0,
              unresolvedCount: 0,
              blocker: null
            },
            nextAction: '新しい公式情報または子育て世帯固有条件が確認された場合のみ個別再判定する。一般制度だけを根拠にverifiedへ戻さない。'
          };
          const newCheckpointPath = `${root}/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json`;
          write(newCheckpointPath, newCheckpoint);

          const sessionPath = `${root}/operations/control/session-checkpoints/west-a.json`;
          const session = read(sessionPath);
          session.updatedAt = recordedAt;
          session.pullRequestNumber = 3476;
          session.nextAction = '住宅支援分類横断監査38件・全国同期・公開検証は完了。新しい公式情報または再退行が検出された場合のみ再監査する。';
          session.housingClassificationCrosscheck = {
            status: 'completed_with_38_corrections',
            auditedMunicipalityCount: 226,
            initialCandidateCount: 143,
            correctedMunicipalityCount: 38,
            correctedServiceCount: 38,
            unresolvedCount: 0,
            regionalPullRequestNumber: 3476,
            regionalCiRunNumber: 8480,
            nationalPullRequestNumber: 3498,
            nationalCiRunNumber: 8494,
            publicVerificationPullRequestNumber: 3505,
            publicVerificationCiRunNumber: 8509,
            checkpointPullRequestNumber: checkpointPr,
            checkpointFile: newCheckpointPath,
            blocker: null
          };
          session.notes = Array.isArray(session.notes) ? session.notes : [];
          const note = '2026-07-25 15:18: 一般移住・一般住宅制度の分類誤りを担当226自治体で横断監査し、38自治体のhousingSupportをverifiedからunavailableへ訂正。地域・全国・公開38ページを確認し未解決0。';
          if (!session.notes.includes(note)) session.notes.push(note);
          write(sessionPath, session);
          NODE

          rm -f jichitai-compare/operations/control/west-a-housing-38-checkpoint-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-38-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-high-risk-summary-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-correction-plan-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-29-corrections-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-38-public-verification-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-38-public-summary-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/west-a.json \
                  jichitai-compare/operations/control/west-a-housing-38-checkpoint-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-38-checkpoint.yml
          git diff --cached --check
          git commit -m 'checkpoint: 西日本A住宅支援38件の横断監査を確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
