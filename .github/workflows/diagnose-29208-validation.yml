name: Diagnose 29208 Validation
on:
  pull_request:
    branches: [region/central]
permissions:
  contents: write
  pull-requests: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/29208-current-fy2026-details-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/29208-current-fy2026-details-final
          fetch-depth: 0
      - name: Capture validation errors
        shell: bash
        run: |
          cd jichitai-compare
          node ./scripts/validate-data.mjs > operations/control/diagnose-29208-validation.txt 2>&1 || true
          cd ..
          rm -f .github/workflows/diagnose-29208-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/control/diagnose-29208-validation.txt .github/workflows/diagnose-29208-validation.yml
          git commit -m 'chore: 御所市validator診断を記録'
          git push origin HEAD:fix/29208-current-fy2026-details-final
