name: Temporary fix public count 124

on:
  push:
    branches:
      - coord/generated-sync-124-20260721

permissions:
  contents: write

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: coord/generated-sync-124-20260721
          fetch-depth: 0

      - name: Update public count
        run: |
          sed -i 's/114自治体/124自治体/g' jichitai-compare/index.html
          grep -q '124自治体・9制度' jichitai-compare/index.html
          grep -q '登録状況：124自治体の生成データを公開中' jichitai-compare/index.html

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/index.html
          git rm .github/workflows/tmp-fix-index-count-124.yml
          git commit -m "公開表示: 124自治体へ更新"
          git push origin HEAD:coord/generated-sync-124-20260721
