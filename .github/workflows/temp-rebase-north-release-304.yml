name: Temporary Rebase North Release 304 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-rebase-north-release-304.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete workflow then rebuild snapshot on latest main
        run: |
          set -euxo pipefail
          target='coord/north-release-10-20260722-0838'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-rebase-north-release-304.yml
          git add .github/workflows/temp-rebase-north-release-304.yml
          git commit -m '統括管理: 北日本固定枝再構築ワークフローを削除'
          git push origin main
          git fetch origin main region/north "$target"
          git checkout -B "$target" origin/main
          codes='01470 01471 01472 01481 01482 01483 01484 01485 01486 01487'
          for code in $codes; do
            git checkout origin/region/north -- "jichitai-compare/data/municipalities/01/$code.json" "jichitai-compare/operations/tasks/$code.json"
          done
          git add jichitai-compare/data/municipalities/01 jichitai-compare/operations/tasks
          python3 - <<'PY'
          import subprocess
          codes=['01470','01471','01472','01481','01482','01483','01484','01485','01486','01487']
          expected=sorted([f'jichitai-compare/data/municipalities/01/{c}.json' for c in codes]+[f'jichitai-compare/operations/tasks/{c}.json' for c in codes])
          actual=sorted(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual!=expected: raise SystemExit(f'unexpected diff: {actual}')
          PY
          git commit -m '全国統合準備: 北日本追加10自治体を最新main上に固定'
          git push --force-with-lease origin "$target"
