name: Temporary Build East Release 1749

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-release-1749.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove workflow then build snapshot
        run: |
          set -euxo pipefail
          BRANCH='coord/east-release-10-20260722-1749'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm .github/workflows/temp-build-east-release-1749.yml
          git add .github/workflows/temp-build-east-release-1749.yml
          git commit -m '統括管理: 東日本統合枝構築の一時処理を削除'
          git push origin main
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/region/east:refs/remotes/origin/region/east'
          git checkout -B "$BRANCH" origin/main
          paths=(
            jichitai-compare/data/municipalities/09/09407.json jichitai-compare/operations/tasks/09407.json
            jichitai-compare/data/municipalities/09/09411.json jichitai-compare/operations/tasks/09411.json
            jichitai-compare/data/municipalities/10/10201.json jichitai-compare/operations/tasks/10201.json
            jichitai-compare/data/municipalities/10/10202.json jichitai-compare/operations/tasks/10202.json
            jichitai-compare/data/municipalities/10/10203.json jichitai-compare/operations/tasks/10203.json
            jichitai-compare/data/municipalities/10/10204.json jichitai-compare/operations/tasks/10204.json
            jichitai-compare/data/municipalities/10/10205.json jichitai-compare/operations/tasks/10205.json
            jichitai-compare/data/municipalities/10/10206.json jichitai-compare/operations/tasks/10206.json
            jichitai-compare/data/municipalities/10/10207.json jichitai-compare/operations/tasks/10207.json
            jichitai-compare/data/municipalities/10/10208.json jichitai-compare/operations/tasks/10208.json
          )
          git checkout origin/region/east -- "${paths[@]}"
          git add "${paths[@]}"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m '全国統合: 東日本の追加10自治体を固定スナップショット化'
          git push --force-with-lease origin "$BRANCH"
