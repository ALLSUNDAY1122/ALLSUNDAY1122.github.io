name: Temporary West B Sick Child Corrections PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'fix/west-b-sick-child-crosscheck-corrections-v2-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-sick-child-crosscheck-corrections-v2-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrections
        run: node .github/scripts/west-b-sick-child-corrections.mjs
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit correction set and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/temp-west-b-sick-child-corrections.yml
          rm -f .github/workflows/temp-west-b-sick-child-corrections-pr.yml
          rm -f .github/scripts/west-b-sick-child-corrections.mjs
          rm -f .github/west-b-sick-child-corrections.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 西日本B病児保育6自治体の判定を訂正"
          git push origin HEAD:fix/west-b-sick-child-crosscheck-corrections-v2-20260725
