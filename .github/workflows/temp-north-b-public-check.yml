name: Temporary North B Public Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-public-check.yml'
      - 'jichitai-compare/operations/audits/north-b-quality-second-audit-20260725.json'
      - 'jichitai-compare/operations/control/session-checkpoints/north-b.json'

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run public site smoke test
        working-directory: jichitai-compare
        run: npm run smoke:public

      - name: Verify North B corrected public text
        shell: bash
        run: |
          set -euo pipefail
          verify_text() {
            local url="$1"
            local expected="$2"
            local file
            file="$(mktemp)"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 30 "$url" -o "$file" && grep -Fq "$expected" "$file"; then
                echo "Verified: $url"
                rm -f "$file"
                return 0
              fi
              sleep 10
            done
            echo "Expected text was not found: $expected"
            cat "$file"
            rm -f "$file"
            return 1
          }

          verify_text \
            'https://allsunday1122.github.io/jichitai-compare/municipality/06367/' \
            '戸沢村の子育て・暮らしに関する9制度のうち7制度を確認済みで、2制度は公式情報で詳細未確認です。'

          verify_text \
            'https://allsunday1122.github.io/jichitai-compare/municipality/06212/' \
            '令和8年度主要事業にはこども誰でも通園制度の新規実施が記載されるが、施設・料金・利用時間・申請方法は利用者向け公式案内で未確認。'
