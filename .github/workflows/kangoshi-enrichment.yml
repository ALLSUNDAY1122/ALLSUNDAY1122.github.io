name: Kangoshi Explanation Evidence Loop

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Kangoshi 11 Subject Classification Loop']
    types: [completed]
  push:
    paths:
      - 'kangoshi-sprint/product-content/build_enrichment_drafts.py'
      - 'kangoshi-sprint/product-content/apply_explanation_batches.py'
      - 'kangoshi-sprint/product-content/apply_canonical_l3_fallback.py'
      - 'kangoshi-sprint/product-content/dynamic-evidence-overrides.json'
      - 'kangoshi-sprint/product-content/apply_dynamic_evidence_overrides.py'
      - 'kangoshi-sprint/product-content/release-review-resolutions.json'
      - 'kangoshi-sprint/product-content/apply_release_review_resolutions.py'
      - 'kangoshi-sprint/product-content/scoring-runtime-audit.json'
      - 'kangoshi-sprint/product-content/apply_scoring_exception_resolutions.py'
      - 'kangoshi-sprint/product-content/media-release-resolutions.generated.json'
      - 'kangoshi-sprint/product-content/media-redraw-resolutions.json'
      - 'kangoshi-sprint/product-content/apply_media_release_resolutions.py'
      - 'kangoshi-sprint/product-content/build_enrichment_queues.py'
      - 'kangoshi-sprint/product-content/write_dynamic_pending_report.py'
      - 'kangoshi-sprint/product-content/write_release_queue_ids.py'
      - 'kangoshi-sprint/product-content/write_media_audit_packet.py'
      - 'kangoshi-sprint/product-content/validate_enrichment.py'
      - 'kangoshi-sprint/product-content/enrichment-trigger.json'
      - '.github/workflows/kangoshi-enrichment.yml'

concurrency:
  group: kangoshi-explanation-evidence
  cancel-in-progress: false

env:
  PIPELINE_SCHEMA: '13'

permissions:
  contents: write

jobs:
  enrich:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic drafts
        run: python3 kangoshi-sprint/product-content/build_enrichment_drafts.py
      - name: Apply explanation batches
        run: python3 kangoshi-sprint/product-content/apply_explanation_batches.py
      - name: Apply final canonical L3 fallback and resolved expert state
        run: python3 kangoshi-sprint/product-content/apply_canonical_l3_fallback.py
      - name: Apply audited dynamic-evidence overrides
        run: python3 kangoshi-sprint/product-content/apply_dynamic_evidence_overrides.py
      - name: Apply audited release-review resolutions
        run: python3 kangoshi-sprint/product-content/apply_release_review_resolutions.py
      - name: Apply official scoring-exception resolutions
        run: python3 kangoshi-sprint/product-content/apply_scoring_exception_resolutions.py
      - name: Apply audited media release resolutions
        run: python3 kangoshi-sprint/product-content/apply_media_release_resolutions.py
      - name: Build compact pending queues
        run: python3 kangoshi-sprint/product-content/build_enrichment_queues.py
      - name: Write compact dynamic-evidence report
        run: python3 kangoshi-sprint/product-content/write_dynamic_pending_report.py
      - name: Write compact release-queue ID report
        run: python3 kangoshi-sprint/product-content/write_release_queue_ids.py
      - name: Write media-audit packet
        run: python3 kangoshi-sprint/product-content/write_media_audit_packet.py
      - name: Validate enrichment
        shell: bash
        run: |
          set +e
          python3 kangoshi-sprint/product-content/validate_enrichment.py > kangoshi-sprint/product-content/enriched-draft/enrichment.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/enriched-draft/enrichment.log
          echo "$code" > kangoshi-sprint/product-content/enriched-draft/enrichment.exit
      - name: Record manifest L3 state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('kangoshi-sprint/product-content'); manifest=root/'manifest.json'
          d=json.loads(manifest.read_text(encoding='utf-8'))
          audit=json.loads((root/'enriched-draft/enrichment-audit.json').read_text(encoding='utf-8'))
          queues=json.loads((root/'enriched-draft/pending-queues.json').read_text(encoding='utf-8')).get('summary',{})
          code=int((root/'enriched-draft/enrichment.exit').read_text().strip())
          d['explanationEvidenceLoop']={**audit.get('counts',{}),'queues':queues,'auditExit':code,'status':'pass' if code==0 else 'fail'}
          manifest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit L3 result and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/product-content/enriched-draft kangoshi-sprint/product-content/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: explanation evidence loop result [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
      - name: Enforce L3 gate
        run: test "$(cat kangoshi-sprint/product-content/enriched-draft/enrichment.exit)" = "0"
