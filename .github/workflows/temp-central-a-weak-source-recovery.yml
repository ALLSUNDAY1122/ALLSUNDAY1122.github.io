name: Temporary Central A Weak Source Recovery

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-recovery-trigger-20260726.json

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'audit/central-a-weak-source-recovery-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover weak primary source queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const ops=path.join(root,'operations');
          const dataRoot=path.join(root,'data/municipalities');
          const assignedPrefs=new Set(['16','17','18','21','22','23','24','25','27','28']);
          const services=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const checkpointPath=path.join(ops,'control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const authoritativeCount=checkpoint.qualityReaudit?.candidateCounts?.weakPrimarySource ?? 33;

          const allJson=[];
          const walk=(dir)=>{
            if(!fs.existsSync(dir)) return;
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name);
              const st=fs.statSync(p);
              if(st.isDirectory()) walk(p);
              else if(name.endsWith('.json')) allJson.push(p);
            }
          };
          walk(path.join(ops,'audits'));
          walk(path.join(ops,'quality'));
          walk(path.join(ops,'control'));

          const resolved=new Set();
          for(const correction of checkpoint.qualityReaudit?.confirmedCorrections ?? []){
            if(/source_upgrade|user_facing_source|primary_source/i.test(String(correction.type??'')) && correction.code && correction.service){
              resolved.add(`${correction.code}:${correction.service}`);
            }
          }

          const recovered=[];
          const addRecovered=(value,sourceFile,context)=>{
            if(!value || typeof value!=='object' || Array.isArray(value)) return;
            const code=String(value.code??value.municipalityCode??'');
            const service=String(value.service??value.serviceKey??'');
            if(!/^\d{5}$/.test(code) || !services.includes(service)) return;
            const text=JSON.stringify(value);
            const contextText=String(context).toLowerCase();
            if(!/(weak|primary.?source|source.?candidate|主出典|出典)/i.test(contextText+' '+text)) return;
            const key=`${code}:${service}`;
            if(resolved.has(key)) return;
            recovered.push({code,service,name:value.name??value.municipalityName??null,currentUrl:value.currentUrl??value.sourceUrl??value.url??null,reason:value.reason??value.issue??value.type??'operational record',sourceRecord:path.relative(root,sourceFile),context});
          };
          const inspect=(value,sourceFile,context='root')=>{
            if(Array.isArray(value)){
              value.forEach((item,index)=>inspect(item,sourceFile,`${context}[${index}]`));
              return;
            }
            if(!value || typeof value!=='object') return;
            addRecovered(value,sourceFile,context);
            for(const [key,item] of Object.entries(value)) inspect(item,sourceFile,`${context}.${key}`);
          };
          for(const file of allJson){
            try{ inspect(JSON.parse(fs.readFileSync(file,'utf8')),file); }catch{}
          }

          const uniqueRecovered=[];
          const recoveredSeen=new Set();
          for(const item of recovered){
            const key=`${item.code}:${item.service}`;
            if(recoveredSeen.has(key)) continue;
            recoveredSeen.add(key);
            uniqueRecovered.push(item);
          }

          const weakSignals=(url)=>{
            let score=0; const reasons=[];
            const u=String(url??''); const lower=u.toLowerCase();
            if(/\.pdf(?:$|[?#])/.test(lower)){score+=9;reasons.push('pdf');}
            if(/uploaded\/attachment|material\/files|cmsfiles|\/files\//.test(lower)){score+=4;reasons.push('attachment-path');}
            if(/yosan|budget|予算|gikai|議会|kaigi|会議|keikaku|計画|jorei|reiki|条例|youkou|要綱/.test(lower)){score+=8;reasons.push('planning-regulation-budget');}
            if(/\/news\/|\/topics\/|\/oshirase\//.test(lower)){score+=2;reasons.push('news-page');}
            try{
              const parsed=new URL(u);
              const segments=parsed.pathname.split('/').filter(Boolean);
              if(segments.length<=1){score+=5;reasons.push('site-root-or-broad-page');}
              if(/index\.(html?|php)$/.test(lower) && segments.length<=3){score+=3;reasons.push('broad-index');}
            }catch{score+=10;reasons.push('invalid-url');}
            return {score,reasons};
          };

          const scanCandidates=[];
          for(const pref of fs.readdirSync(dataRoot)){
            if(!assignedPrefs.has(pref)) continue;
            const dir=path.join(dataRoot,pref);
            for(const filename of fs.readdirSync(dir)){
              if(!filename.endsWith('.json')) continue;
              const municipality=JSON.parse(fs.readFileSync(path.join(dir,filename),'utf8'));
              for(const service of services){
                const svc=municipality.services?.[service];
                if(!svc || svc.status!=='verified') continue;
                const url=svc.source?.url;
                const key=`${municipality.code}:${service}`;
                if(resolved.has(key)) continue;
                const signals=weakSignals(url);
                if(signals.score<4) continue;
                scanCandidates.push({code:String(municipality.code),name:municipality.name,prefecture:municipality.prefecture,service,currentUrl:url??null,summary:svc.summary??null,score:signals.score,reasons:signals.reasons});
              }
            }
          }
          scanCandidates.sort((a,b)=>b.score-a.score||a.code.localeCompare(b.code)||a.service.localeCompare(b.service));

          const queue=[]; const queueSeen=new Set();
          for(const item of uniqueRecovered){
            const key=`${item.code}:${item.service}`;
            if(queueSeen.has(key)) continue;
            queueSeen.add(key); queue.push({...item,selectionBasis:'recovered-operational-record'});
          }
          for(const item of scanCandidates){
            if(queue.length>=authoritativeCount) break;
            const key=`${item.code}:${item.service}`;
            if(queueSeen.has(key)) continue;
            queueSeen.add(key); queue.push({...item,selectionBasis:'mechanical-weak-source-scan'});
          }

          const result={
            schemaVersion:'1.0.0',
            auditId:'central-a-weak-primary-source-recovery-20260726',
            generatedAt:new Date().toISOString(),
            session:'中日本調査班A',
            authoritativeCandidateCount:authoritativeCount,
            resolvedSourceUpgradeCount:resolved.size,
            recoveredOperationalRecordCount:uniqueRecovered.length,
            mechanicalCandidateCount:scanCandidates.length,
            queueCount:queue.length,
            nextBatch:queue.slice(0,5),
            queue,
            recoveredOperationalRecords:uniqueRecovered,
            mechanicalCandidates:scanCandidates.slice(0,80),
            note:'候補は判定前。制度に直接対応する現行の利用者向け公式ページで独立確認してから変更する。'
          };
          const out=path.join(ops,'audits/central-a-weak-primary-source-recovery-20260726.json');
          fs.writeFileSync(out,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({authoritativeCount,queueCount:queue.length,nextBatch:queue.slice(0,5)},null,2));
          NODE
      - name: Commit recovered queue
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-weak-source-recovery-trigger-20260726.json
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典候補を復元'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
