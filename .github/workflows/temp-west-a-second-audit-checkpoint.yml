name: West A Second Audit Checkpoint Update

on:
  push:
    branches:
      - ops/west-a-second-audit-checkpoint-20260725

permissions:
  contents: write

jobs:
  update-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/west-a-second-audit-checkpoint-20260725
          fetch-depth: 0

      - name: Record second-audit completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/session-checkpoints/west-a.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt'] = '2026-07-25T12:08:00+09:00'
          data['status'] = 'completed'
          data['workingBranch'] = None
          data['pullRequestNumber'] = 3246
          data['ciStatus'] = 'success'
          data['nextAction'] = '品質改善第2監査完了。公式情報更新、出典URL異常、CI異常、公開文言異常が発生した場合のみ再調査する。未解決URL・確定未修正誤りとも0件。'

          evidence = data.setdefault('completionEvidence', {})
          evidence.update({
              'qualityImprovementSecondAuditIssueNumber': 3189,
              'qualityImprovementSecondAuditFile': 'jichitai-compare/operations/audits/west-a-quality-improvement-second-audit-20260725.json',
              'qualityImprovementSecondAuditRegionalPullRequestNumber': 3246,
              'qualityImprovementSecondAuditRegionalCiRunNumber': 7938,
              'qualityImprovementSecondAuditNationalPullRequestNumber': 3257,
              'qualityImprovementSecondAuditNationalCiRunNumber': 7957,
              'qualityImprovementSecondAuditPublicVerificationPullRequestNumber': 3265,
              'qualityImprovementSecondAuditPublicVerificationCiRunNumber': 7978,
              'qualityImprovementSecondAuditLiveVerificationFile': 'jichitai-compare/operations/audits/west-a-quality-improvement-second-audit-live-verification-20260725.json'
          })

          data['qualityImprovementSecondAudit'] = {
              'status': 'completed_with_additional_correction',
              'completedAt': '2026-07-25T12:00:00+09:00',
              'assignedMunicipalityCount': 226,
              'correctionRecheckCount': 9,
              'sampleMunicipalityCount': 25,
              'newCorrectionCount': 1,
              'newCorrectionMunicipalityCode': '37322',
              'newCorrectionMunicipalityName': '土庄町',
              'newCorrectionService': 'temporaryChildcare',
              'regionalPullRequestNumber': 3246,
              'regionalCiRunNumber': 7938,
              'nationalPullRequestNumber': 3257,
              'nationalCiRunNumber': 7957,
              'publicVerificationPullRequestNumber': 3265,
              'publicVerificationCiRunNumber': 7978,
              'unresolvedUrlCount': 0,
              'confirmedUnfixedErrorCount': 0,
              'nationwideMunicipalityCount': 1741,
              'nationwideServiceCount': 15669,
              'unfinishedStateIncrease': 0,
              'regionMainSourceShaMatched': True,
              'regionMainTaskShaMatched': True,
              'regionMainAuditShaMatched': True,
              'blocker': None
          }

          integrity = data.setdefault('integrityAudit', {})
          integrity['auditedAt'] = '2026-07-25T12:08:00+09:00'
          integrity['nationwidePublishedMunicipalityCount'] = 1741
          integrity['nationwideRemainingMunicipalityCount'] = 0

          note = '品質改善第2監査で過去訂正9件と6県25自治体を再確認し、土庄町こども誰でも通園制度の月10時間・1時間300円・現行主出典を追加訂正。region/west・main・公開を同期し、未解決0件。'
          notes = integrity.setdefault('notes', [])
          if note not in notes:
              notes.append(note)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit checkpoint and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/session-checkpoints/west-a.json
          git rm .github/workflows/temp-west-a-second-audit-checkpoint.yml
          git commit -m "chore: record West A second-audit completion"
          git push origin HEAD:ops/west-a-second-audit-checkpoint-20260725
