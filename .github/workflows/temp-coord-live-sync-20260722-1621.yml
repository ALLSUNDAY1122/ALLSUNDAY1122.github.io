name: Temporary Coordinator Live Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-coord-live-sync-20260722-1621.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild live release queue and self-delete
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          queue_path=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(queue_path.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          state_fields={
            'north':'completedMunicipalitiesSinceLastNationalMerge',
            'east':'completedMunicipalitiesSinceLastNationalMerge',
            'central':'completedSinceLastRelease',
            'west':'completedMunicipalitiesSinceLastNationalMerge',
          }
          def show(ref,path):
            return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
            n=int(pref)
            return {
              'north':1 <= n <= 7,
              'east':8 <= n <= 15 or n in (19,20),
              'central':16 <= n <= 18 or 21 <= n <= 29,
              'west':31 <= n <= 47,
            }[region]
          pending={}
          for region in ('north','east','central','west'):
            ref=f'origin/region/{region}'
            paths=subprocess.check_output([
              'git','ls-tree','-r','--name-only',ref,
              'jichitai-compare/data/municipalities'
            ],text=True).splitlines()
            items=[]
            for path in paths:
              if not re.search(r'/\d{5}\.json$',path):
                continue
              data=json.loads(show(ref,path))
              if belongs(region,data['prefectureCode']):
                items.append({'code':data['code'],'name':data['name']})
            items.sort(key=lambda x:x['code'])
            state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
            count=int(state.get(state_fields[region],0))
            pending[region]=count
            entry=by[region]
            entry['municipalities']=items
            entry['count']=len(items)
            entry['pendingSinceLastRelease']=count
            entry['releaseStatus']='release_ready' if count >= 10 else 'pending_threshold'
            entry['reason']=f'最新地方ブランチを再走査。前回全国統合後の繰越は{count}自治体'
            entry['mainIntegrationPr']=state.get('lastNationalIntegrationPr')
            entry['generatedPullRequest']=720
            entry['auditStatus']='passed'
          total=sum(e['count'] for e in q['entries'])
          ready=[e['region'] for e in q['entries'] if e['pendingSinceLastRelease'] >= 10]
          q['updatedAt']='2026-07-22T16:23:00+09:00'
          q['status']='active'
          q['summary']={
            'regionalMergedMunicipalities':total,
            'latestGeneratedMunicipalityCount':454,
            'latestGeneratedPullRequest':720,
            'latestPublicCountPullRequest':720,
            'releaseReadyRegions':ready,
            'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          }
          queue_path.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps({'regionalMergedMunicipalities':total,'pending':pending,'ready':ready},ensure_ascii=False))
          PY
          rm .github/workflows/temp-coord-live-sync-20260722-1621.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-coord-live-sync-20260722-1621.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 最新地方統合と公開454自治体へ全国キューを同期'
          git push origin main
