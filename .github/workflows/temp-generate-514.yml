name: Temporary Generate Public 514

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-514.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-514-20260722-1939
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate 514 municipality public data
        run: |
          set -euxo pipefail
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '504自治体' not in s:
              raise SystemExit('expected 504 municipality text not found')
          s=s.replace('504自治体','514自治体')
          p.write_text(s,encoding='utf-8')
          PY
          npm run validate:generated
          git add data/generated/municipalities.json operations/progress.json index.html
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データと表示件数を514自治体へ同期'
          git push origin HEAD:coord/generated-514-20260722-1939
