name: Central A Cause Audit State 20260725

on:
  push:
    branches:
      - ops/central-a-cause-state-20260725-1108

permissions:
  contents: write

jobs:
  update-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update checkpoint and regional state
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='jichitai-compare/operations/control';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const checkpointPath=`${root}/session-checkpoints/central-a.json`;
          const regionPath=`${root}/regions/central.json`;
          const checkpoint=read(checkpointPath);
          const region=read(regionPath);
          const qualityReaudit={
            mode:'cause_based_focused_reaudit',
            status:'in_progress',
            startedAt:'2026-07-25T10:30:00+09:00',
            latestCompletedAt:'2026-07-25T11:08:00+09:00',
            latestRegionalPullRequestNumber:3219,
            latestCiRunNumber:7854,
            scopeMunicipalities:314,
            scopeServices:2826,
            correctedMunicipalitiesRechecked:54,
            primarySourceSlotsRechecked:486,
            confirmedCorrections:[
              {type:'municipality_code_duplicate',wrongCode:'24361',correctCode:'24341',name:'菰野町'},
              {type:'stale_official_url',code:'16210',service:'bulkyWaste'},
              {type:'stale_official_url',code:'23342',service:'bulkyWaste'}
            ],
            issue3141UnresolvedItemCount:23,
            candidateCounts:{weakPrimarySource:46,numericOrConditionCompleteness:81,generalHousingMisclassification:149,fiscalYearRisk:33,schoolMealScopeAmbiguity:24,verifiedUnavailableRisk:1},
            nextPriority:['弱い主出典46候補','子育て固有条件のない住宅支援候補','学校給食費の範囲候補24件']
          };
          checkpoint.updatedAt='2026-07-25T11:08:00+09:00';
          checkpoint.pullRequestNumber=3219;
          checkpoint.ciStatus='success';
          checkpoint.ciRunNumber=7854;
          checkpoint.qualityReaudit=qualityReaudit;
          checkpoint.nextAction='原因別重点再監査を継続する。Issue #3141の23項目は利用者向け公式情報が揃うまで変更せず、次は条例・計画・予算案のみを主出典とする46候補から公式利用案内の有無を確認する。';
          region.updatedAt='2026-07-25T11:08:00+09:00';
          region.qualityReaudit=qualityReaudit;
          region.lastAction='原因別重点再監査の第1次処理をPR #3219・CI #7854成功後にregion/centralへ統合。314自治体・2,826制度、自治体名重複0、task欠落0を確認し、菰野町の誤コード24361重複と南砺市・豊山町の404主出典を訂正した。Issue #3141は23項目を維持した。';
          region.nextAction='原因別重点再監査を継続し、弱い主出典46候補、子育て固有条件のない住宅支援候補、学校給食費の範囲候補24件を公式利用者向け情報で確定判定する。';
          write(checkpointPath,checkpoint);
          write(regionPath,region);
          NODE
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('jichitai-compare/operations/control/session-checkpoints/central-a.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('jichitai-compare/operations/control/regions/central.json','utf8'))"
      - name: Commit state and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/central-a-cause-state-20260725.yml
          git add -A
          git commit -m "checkpoint: 中日本A原因別重点再監査の現在地を記録"
          git push origin HEAD:ops/central-a-cause-state-20260725-1108
