name: Temp Append State 95 Audit
on:
  push:
    branches: [coord/state-92-jul21]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat >> jichitai-compare/operations/control/audit-log.jsonl <<'EOF'
          {"timestamp":"2026-07-21T01:31:00+09:00","actor":"全国進行統括","action":"regional-progress-95","details":{"mergedMunicipalities":[{"region":"north","code":"01224","name":"千歳市","pullRequest":250},{"region":"central","code":"17211","name":"能美市","pullRequest":252},{"region":"west","code":"32343","name":"奥出雲町","pullRequest":251}],"regionalCounts":{"north":23,"east":18,"central":26,"west":28,"total":95},"pendingSinceRegionalRelease":{"north":3,"east":8,"central":5,"west":7,"total":23},"nextNationalReleaseCandidate":{"region":"east","remainingMunicipalities":2},"latestGeneratedMunicipalityCount":73,"openMunicipalityPullRequests":0,"openExceptions":0},"humanDecisionRequired":false}
          EOF
          rm .github/workflows/temp-append-state95-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-append-state95-audit.yml
          git commit -m "統括監査: 地方統合95自治体を記録 [skip ci]"
          git push
