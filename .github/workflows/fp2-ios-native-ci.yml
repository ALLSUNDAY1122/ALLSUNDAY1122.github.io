name: FP2 SwiftUI WKWebView native source and simulator build
on:
  push:
    branches:
      - feature/fp2-swiftui-wkwebview-release-20261123
    paths:
      - "fp2-manabi-sprint/**"
      - "automation/app-release-registry.json"
      - ".github/workflows/fp2-ios-native-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-native-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source consistency and offline bundle
        run: |
          python3 fp2-manabi-sprint/ios/prepare-ios.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('automation/app-release-registry.json').read_text())['apps']['fp2']
          evidence=json.loads(Path('fp2-manabi-sprint/ios/Web/bundle-evidence.json').read_text())
          for field in ('app_id','bundle_id','version','build'):
              assert str(registry[field])==str(evidence[field]),field
          assert registry['iap'] is False and evidence['iap_product_ids']==[]
          assert evidence['publication_release_clear']==0
          assert evidence['content_approved_questions']==122
          assert Path('fp2-manabi-sprint/ios/Web/index.html').is_file()
          print('FP2 registry / offline asset / IAP contract PASS')
          PY
          test -f fp2-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight fp2-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build unsigned iOS Simulator app
        run: |
          cd fp2-manabi-sprint/ios
          xcodegen generate
          xcodebuild -project FP2ManabiSprint.xcodeproj -scheme FP2ManabiSprint -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/fp2-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Read back compiled Info.plist and bundled bank
        run: |
          python3 - <<'PY'
          import os,plistlib,json
          from pathlib import Path
          app=Path(os.environ['RUNNER_TEMP'])/'fp2-derived/Build/Products/Debug-iphonesimulator/FP2ManabiSprint.app'
          p=plistlib.loads((app/'Info.plist').read_bytes())
          assert p['CFBundleIdentifier']=='com.allsunday1122.fp2manabisprint'
          assert p['CFBundleShortVersionString']=='1.0.0'
          assert p['CFBundleVersion']=='1'
          assert (app/'Web/index.html').exists(), 'Bundled web HTML missing'
          assert (app/'Web/bundle-evidence.json').exists(), 'Bundled evidence missing'
          e=json.loads((app/'Web/bundle-evidence.json').read_text())
          assert e['content_approved_questions']==122
          assert e['publication_release_clear']==0
          print('iOS Simulator bundle readback PASS')
          PY
