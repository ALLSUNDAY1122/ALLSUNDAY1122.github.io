name: Temporary Regenerate Progress 384 Direct Main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-regenerate-progress-384-20260722-1317.yml

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate progress on main
        run: |
          set -euxo pipefail
          git pull --ff-only origin main
          cd jichitai-compare
          npm run progress
          cd ..
          python3 - <<'PY'
          import json
          p=json.load(open('jichitai-compare/operations/progress.json',encoding='utf-8'))
          assert p['registeredMunicipalities']==384,p['registeredMunicipalities']
          assert p['mergedMunicipalities']==384,p['mergedMunicipalities']
          assert p['prOpenMunicipalities']==0,p['prOpenMunicipalities']
          PY
          git add jichitai-compare/operations/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m '進捗補正: 公開384自治体を全件mergedへ同期'
            git push origin main
          fi
