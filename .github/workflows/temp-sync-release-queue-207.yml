name: Temporary Sync Release Queue 207

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-207.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release queue
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/release-queue.json';
          const q = JSON.parse(fs.readFileSync(path, 'utf8'));
          const north = q.entries.find(e => e.region === 'north');
          if (!north.municipalities.some(m => m.code === '01405')) north.municipalities.push({code:'01405', name:'積丹町'});
          north.municipalities.sort((a,b) => a.code.localeCompare(b.code));
          north.count = north.municipalities.length;
          north.pendingSinceLastRelease = 6;
          north.releaseStatus = 'pending_threshold';
          north.reason = 'せたな町から京極町までの追加10自治体をPR #384でmainへ全国統合し、生成・公開をPR #386で184自治体へ更新。その後、倶知安町から積丹町まで6自治体を地方統合';
          q.updatedAt = '2026-07-22T02:07:00+09:00';
          q.summary.regionalMergedMunicipalities = q.entries.reduce((sum,e) => sum + e.count,0);
          q.summary.waitingRegionalMergeMunicipalities = 0;
          q.summary.releaseReadyRegions = [];
          q.summary.auditBlockedRegions = [];
          q.nextAction = '東日本が前回全国統合後9自治体で先行。中日本7、北日本6、西日本2。桜川市（08231）の地方統合で東日本10自治体に到達したら直ちに全国統合する。';
          q.humanDecisionRequired = false;
          if (north.count !== 67) throw new Error(`north count mismatch: ${north.count}`);
          if (q.summary.regionalMergedMunicipalities !== 207) throw new Error(`total mismatch: ${q.summary.regionalMergedMunicipalities}`);
          fs.writeFileSync(path, JSON.stringify(q));
          NODE
          rm .github/workflows/temp-sync-release-queue-207.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-207.yml
          git commit -m "統括管理: 地方統合207自治体・公開184自治体へ同期"
          git push
