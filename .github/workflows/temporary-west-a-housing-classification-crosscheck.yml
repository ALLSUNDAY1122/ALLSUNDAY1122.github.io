name: Temporary West A Housing Classification Crosscheck

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-housing-classification-crosscheck-trigger-20260725.json

permissions:
  contents: write

jobs:
  crosscheck:
    if: github.head_ref == 'audit/west-a-housing-classification-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate report and normalize stale task notes
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const prefectures = ['33', '37', '39', '40', '43', '46'];
          const generalTerms = ['空き家', '移住', '定住', 'リフォーム', '住宅改修', '改修費', '住宅取得', '新築', '中古住宅', '住まい'];
          const childTerms = ['子育て', '子ども', '子供', 'こども', '多子', '18歳未満', '高校生以下', '児童', '扶養する子', '子育て世帯'];
          const sourceHints = ['akiya', 'akiy', 'iju', 'teiju', 'reform', 'renovation', 'sumai'];
          const checkedAt = '2026-07-25T14:47:00+09:00';

          const records = [];
          let municipalityCount = 0;
          let verifiedCount = 0;
          let unavailableCount = 0;
          let otherCount = 0;

          for (const pref of prefectures) {
            const dir = `${root}/data/municipalities/${pref}`;
            if (!fs.existsSync(dir)) continue;
            for (const filename of fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort()) {
              const filePath = path.join(dir, filename);
              const municipality = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              municipalityCount += 1;
              const service = municipality.services?.housingSupport;
              if (!service) continue;
              if (service.status === 'verified') verifiedCount += 1;
              else if (service.status === 'unavailable') unavailableCount += 1;
              else otherCount += 1;

              if (service.status !== 'verified') continue;
              const text = JSON.stringify({
                summary: service.summary,
                notes: service.notes,
                details: service.details
              });
              const sourceUrl = service.source?.url ?? '';
              const generalMatches = generalTerms.filter((term) => text.includes(term));
              const childMatches = childTerms.filter((term) => text.includes(term));
              const sourceHintMatches = sourceHints.filter((term) => sourceUrl.toLowerCase().includes(term));
              const candidate = (generalMatches.length > 0 || sourceHintMatches.length > 0) && childMatches.length === 0;
              if (!candidate) continue;
              records.push({
                municipalityCode: municipality.code,
                municipalityName: municipality.name,
                prefectureCode: municipality.prefectureCode,
                prefecture: municipality.prefecture,
                status: service.status,
                summary: service.summary ?? null,
                sourceUrl,
                generalMatches,
                sourceHintMatches,
                childSpecificMatches: childMatches,
                candidateReason: '一般移住・空き家・住宅改修系の記述またはURLを含む一方、子育て世帯固有の明示語を含まない',
                requiredDisposition: '公式ページで子ども要件・対象年齢・子育て世帯限定または加算の有無を独立確認する'
              });
            }
          }

          records.sort((a, b) => a.prefectureCode.localeCompare(b.prefectureCode) || a.municipalityCode.localeCompare(b.municipalityCode));

          const report = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-housing-classification-crosscheck-20260725',
            team: '西日本調査班A',
            generatedAt: checkedAt,
            purpose: '一般移住・一般住宅制度を子育て世帯向け住宅支援として登録していないか、担当6県226自治体を横断抽出する',
            scope: {
              prefectureCodes: prefectures,
              municipalityCount,
              expectedMunicipalityCount: 226,
              municipalityCountMatched: municipalityCount === 226
            },
            housingSupportStatusCounts: {
              verified: verifiedCount,
              unavailable: unavailableCount,
              other: otherCount
            },
            detectionRule: {
              generalTerms,
              childSpecificTerms: childTerms,
              sourceUrlHints: sourceHints,
              note: '候補抽出は確定誤り判定ではない。候補ごとに自治体公式情報を独立確認する。'
            },
            candidateCount: records.length,
            candidates: records,
            knownCorrectedRecords: [
              { municipalityCode: '37203', municipalityName: '坂出市', disposition: 'housingSupport unavailableへ訂正済み' },
              { municipalityCode: '39210', municipalityName: '四万十市', disposition: 'housingSupport unavailableへ訂正済み' },
              { municipalityCode: '43215', municipalityName: '天草市', disposition: 'housingSupport unavailableへ訂正済み' }
            ],
            status: records.length === 0 ? 'completed_no_candidates' : 'candidate_review_required',
            blocker: null
          };
          const reportPath = `${root}/operations/audits/west-a-housing-classification-crosscheck-20260725.json`;
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');

          const noteReplacements = {
            '37203': new Map([
              ['空き家改修は費用の2分の1、条件により上限100万～200万円。', '旧記録（2026-07-25訂正済み）: 一般の移住促進・空き家改修制度であり、子育て世帯向け住宅支援としては採用しない。']
            ]),
            '39210': new Map([
              ['移住者向け空き家改修は補助率10分の10、リフォーム上限270万円。', '旧記録（2026-07-25訂正済み）: 一般の移住者向け空き家改修制度であり、子育て世帯向け住宅支援としては採用しない。']
            ]),
            '43215': new Map([
              ['2026年度は市立小学校給食費を無償化。中学校一般世帯の負担条件は公開情報から確定できないためunavailableとして窓口確認事項を残す。', '旧記録（2026-07-25訂正済み）: 中学校は現行例規で一食単価上限390円・原則口座振替を確認し、学校給食費をverifiedへ変更。'],
              ['2026年度住宅リフォーム費を1～2割、上限10～20万円助成。', '旧記録（2026-07-25訂正済み）: 一般住宅リフォーム制度であり、子育て世帯向け住宅支援としては採用しない。']
            ])
          };

          for (const [code, replacements] of Object.entries(noteReplacements)) {
            const taskPath = `${root}/operations/tasks/${code}.json`;
            const raw = fs.readFileSync(taskPath, 'utf8');
            const task = JSON.parse(raw);
            task.notes = (task.notes ?? []).map((note) => replacements.get(note) ?? note);
            task.lastUpdatedAt = checkedAt;
            task.lastUpdatedBy = '西日本調査班A・住宅支援分類横断監査';
            const marker = '2026-07-25 14:47: 訂正前のtask要約を「旧記録（訂正済み）」へ明示し、現行制度状態との混同を解消。';
            if (!task.notes.includes(marker)) task.notes.push(marker);
            const pretty = raw.includes('\n  "');
            fs.writeFileSync(taskPath, JSON.stringify(task, null, pretty ? 2 : 0) + (pretty ? '\n' : ''));
          }
          NODE

          rm -f jichitai-compare/operations/control/west-a-housing-classification-crosscheck-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-classification-crosscheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/tasks/37203.json \
                  jichitai-compare/operations/tasks/39210.json \
                  jichitai-compare/operations/tasks/43215.json \
                  jichitai-compare/operations/control/west-a-housing-classification-crosscheck-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-classification-crosscheck.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A住宅支援分類を226自治体横断抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
