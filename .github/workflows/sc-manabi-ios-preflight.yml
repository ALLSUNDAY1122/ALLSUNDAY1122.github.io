name: SC Manabi Sprint iOS Preflight

on:
  push:
    branches: [main]
    paths:
      - 'sc-manabi-sprint/native/**'
      - 'sc-manabi-sprint/full/**'
      - 'sc-manabi-sprint/q*.txt'
      - '.github/workflows/sc-manabi-ios-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-preflight:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sc-manabi-sprint/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled offline web assets
        run: npm run prepare:web

      - name: Validate bundled content and IAP layer
        run: |
          test -f www/index.html
          test -f www/full/index.html
          test -f www/full/app.js
          test -f www/full/patch-2140.js
          test -f www/full/iap-v1.js
          test -f www/full/style.css
          for i in 0 1 2 3 4 5; do test -s "www/q${i}.txt"; done
          node --check www/full/iap-v1.js
          grep -q '325' www/full/app.js
          grep -q '13問' www/full/patch-2140.js
          grep -q '12問' www/full/patch-2140.js
          grep -q 'resetLearningData' www/full/patch-2140.js
          grep -q 'privacy.html' www/full/patch-2140.js
          grep -q 'jp.allsunday1122.scmanabisprint.premium' www/full/iap-v1.js
          grep -q 'restorePremium' www/full/iap-v1.js
          grep -q 'priceString' www/full/iap-v1.js
          grep -q '@capgo/native-purchases' package.json

      - name: Validate privacy manifest
        run: plutil -lint PrivacyInfo.xcprivacy

      - name: Generate and configure iOS project
        run: npm run ios:add

      - name: Sync bundled assets and re-apply target config
        run: npm run ios:sync

      - name: Verify generated project configuration
        run: |
          test -d ios/App/App.xcodeproj
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/PrivacyInfo.xcprivacy
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/App/App/Info.plist)" = "false"
          grep -q 'TARGETED_DEVICE_FAMILY = 1;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 1.0.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 1;' ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/public/full/iap-v1.js
          find ios/App -maxdepth 4 -name Package.swift -print || true

      - name: Unsigned iOS simulator build
        run: |
          rm -rf build/simulator
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Inspect simulator bundle
        run: |
          APP=$(find build/simulator/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "Built bundle: $APP"
          find "$APP" -name PrivacyInfo.xcprivacy -print -quit | grep -q .
          find "$APP" -name q0.txt -print -quit | grep -q .
          find "$APP" -name patch-2140.js -print -quit | grep -q .
          find "$APP" -name iap-v1.js -print -quit | grep -q .
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = "false"

      - name: Unsigned physical-device build
        run: |
          rm -rf build/device
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Inspect device bundle
        run: |
          APP=$(find build/device/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP"
          find "$APP" -name PrivacyInfo.xcprivacy -print -quit | grep -q .
          find "$APP" -name q5.txt -print -quit | grep -q .
          find "$APP" -name iap-v1.js -print -quit | grep -q .
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = "false"

      - name: Record preflight result
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git pull --rebase origin main
          mkdir -p sc-manabi-sprint/build-results
          cat > sc-manabi-sprint/build-results/ios-preflight.txt <<EOF
          workflow=SC Manabi Sprint iOS Preflight
          status=${{ job.status }}
          source_sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add sc-manabi-sprint/build-results/ios-preflight.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record SC iOS preflight result'
            git push
          fi
