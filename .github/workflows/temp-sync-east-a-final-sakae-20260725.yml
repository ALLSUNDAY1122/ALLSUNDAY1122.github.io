name: Temporary sync East A final Sakae

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'coord/sync-east-a-final-sakae-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sync-east-a-final-sakae-20260725
          fetch-depth: 0
      - name: Sync latest region east final state into main candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "sync attempt ${attempt}"
            git fetch origin main region/east
            base_sha="$(git rev-parse origin/main)"
            git reset --hard "${base_sha}"

            git checkout origin/region/east -- \
              jichitai-compare/data/municipalities/20/20602.json \
              jichitai-compare/operations/tasks/20602.json \
              jichitai-compare/operations/control/session-checkpoints/east-a.json

            pushd jichitai-compare
            npm run generate
            npm run progress
            npm run validate:generated
            node --check app.js
            popd

            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "${base_sha}" ]; then
              echo 'main advanced during generation; retrying from latest main'
              continue
            fi

            rm -f .github/workflows/temp-sync-east-a-final-sakae-20260725.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'No sync differences remain.'
              exit 0
            fi
            git commit -m '全国品質同期: 東日本A最終栄村更新を反映'
            git push --force-with-lease origin HEAD:coord/sync-east-a-final-sakae-20260725
            exit 0
          done
          echo 'main kept advancing; sync was not committed' >&2
          exit 1
