name: Yorugatari performance audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/index.html
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/archive.html
      - yorugatari/assets/app.js
      - yorugatari/assets/archive.js
      - yorugatari/assets/story.js
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-share.js
      - yorugatari/assets/landing-start-20260724-001.js
      - yorugatari/assets/styles.css
      - yorugatari/assets/stories*.js
      - yorugatari/tools/performance-audit.mjs
      - .github/workflows/yorugatari-performance-audit.yml

concurrency:
  group: yorugatari-performance-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate performance audit syntax
        run: |
          node --check yorugatari/tools/performance-audit.mjs
          node --check yorugatari/assets/landing-start-20260724-001.js

      - name: Install Lighthouse tools
        run: npm install --no-save lighthouse chrome-launcher

      - name: Audit published performance
        id: audit
        continue-on-error: true
        run: node yorugatari/tools/performance-audit.mjs

      - name: Record performance report
        if: always()
        shell: bash
        run: |
          test -f yorugatari-performance-report.json
          cp yorugatari-performance-report.json /tmp/yorugatari-performance-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/yorugatari-performance-report.json yorugatari/tools/performance-audit-latest.json
            git add yorugatari/tools/performance-audit-latest.json
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari performance audit [skip ci]"
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            sleep 3
          done
          test "$saved" = true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-performance-report
          path: yorugatari-performance-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce completed audit
        if: always()
        shell: bash
        run: |
          node -e "const report=require('./yorugatari-performance-report.json'); if(!report.success){console.error(JSON.stringify({failures:report.failures,errors:report.errors},null,2)); process.exit(1)}"
