name: Josanshi Content Checkpoint

on:
  push:
    branches:
      - agent/josanshi-sprint-14-native
    paths:
      - 'josanshi-sprint/data/authored-batches/**'
      - 'josanshi-sprint/data/audit-approvals*.json'
      - 'josanshi-sprint/data/source-registry*.json'
      - 'josanshi-sprint/data/content-stage.json'
      - 'josanshi-sprint/docs/audits/**'
      - 'josanshi-sprint/scripts/**'
      - '.github/workflows/josanshi-content-checkpoint.yml'
  pull_request:
    paths:
      - 'josanshi-sprint/data/authored-batches/**'
      - 'josanshi-sprint/data/audit-approvals*.json'
      - 'josanshi-sprint/data/source-registry*.json'
      - 'josanshi-sprint/data/content-stage.json'
      - 'josanshi-sprint/docs/audits/**'
      - 'josanshi-sprint/scripts/**'
      - '.github/workflows/josanshi-content-checkpoint.yml'

concurrency:
  group: josanshi-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-content-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Validate modular sources
        run: python3 josanshi-sprint/scripts/validate_sources.py

      - name: Validate 66-topic evidence coverage
        run: python3 josanshi-sprint/scripts/validate_topic_sources.py

      - name: Validate 330 semantic intents, generation plan, and linked scenarios
        run: |
          python3 josanshi-sprint/scripts/build_intent_seeds.py --check
          python3 josanshi-sprint/scripts/build_generation_plan.py --check
          python3 josanshi-sprint/scripts/build_scenario_authoring_plan.py --check --print-cases

      - name: Materialize source registry
        run: python3 josanshi-sprint/scripts/materialize_source_registry.py

      - name: Materialize authored bank
        run: python3 josanshi-sprint/scripts/materialize_question_bank.py --output josanshi-sprint/data/questions.json

      - name: Apply all independent audit approvals
        run: python3 josanshi-sprint/scripts/apply_all_audit_approvals.py

      - name: Audit current question bank
        run: python3 josanshi-sprint/scripts/audit_question_bank.py

      - name: Validate current monotonic content stage
        run: python3 josanshi-sprint/scripts/validate_content_stage.py
