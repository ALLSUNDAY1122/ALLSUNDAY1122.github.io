name: Temporary Build Central Release 20260722 1032 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-central-release-20260722-1032.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed central snapshot
        run: |
          set -euxo pipefail
          BRANCH='coord/central-release-10-20260722-1032'
          git fetch origin '+refs/heads/region/central:refs/remotes/origin/region/central'
          git checkout -b "$BRANCH"
          paths=(
            jichitai-compare/data/municipalities/23/23204.json jichitai-compare/operations/tasks/23204.json
            jichitai-compare/data/municipalities/23/23205.json jichitai-compare/operations/tasks/23205.json
            jichitai-compare/data/municipalities/23/23206.json jichitai-compare/operations/tasks/23206.json
            jichitai-compare/data/municipalities/23/23207.json jichitai-compare/operations/tasks/23207.json
            jichitai-compare/data/municipalities/23/23208.json jichitai-compare/operations/tasks/23208.json
            jichitai-compare/data/municipalities/23/23209.json jichitai-compare/operations/tasks/23209.json
            jichitai-compare/data/municipalities/23/23210.json jichitai-compare/operations/tasks/23210.json
            jichitai-compare/data/municipalities/23/23211.json jichitai-compare/operations/tasks/23211.json
            jichitai-compare/data/municipalities/23/23212.json jichitai-compare/operations/tasks/23212.json
            jichitai-compare/data/municipalities/23/23213.json jichitai-compare/operations/tasks/23213.json
          )
          git checkout origin/region/central -- "${paths[@]}"
          rm .github/workflows/temp-build-central-release-20260722-1032.yml
          actual=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' "${paths[@]}" | sort)
          test "$actual" = "$expected"
          for code in 23204 23205 23206 23207 23208 23209 23210 23211 23212 23213; do
            grep -q '"status"[[:space:]]*:[[:space:]]*"merged"' "jichitai-compare/operations/tasks/${code}.json"
          done
          git add "${paths[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 中日本・瀬戸市から西尾市までの追加10自治体を固定スナップショット化'
          git push origin "$BRANCH"
          git checkout main
          git rm .github/workflows/temp-build-central-release-20260722-1032.yml
          git commit -m '統括管理: 中日本統合一時ワークフローを削除'
          git push origin main
