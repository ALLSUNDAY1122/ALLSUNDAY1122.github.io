name: Kangoshi Required Canonical Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/product-content/build_required_canonical.py'
      - 'kangoshi-sprint/product-content/validate_required_canonical.py'
      - 'kangoshi-sprint/product-content/classified/set1-classified.json'
      - 'kangoshi-sprint/product-content/classified/set2-classified.json'
      - 'kangoshi-sprint/product-content/classified/set3-classified.json'
      - 'kangoshi-sprint/product-content/required-150/**'
      - 'kangoshi-sprint/product-content/explanation-batches/**'
      - '.github/workflows/kangoshi-required-canonical.yml'

concurrency:
  group: kangoshi-required-canonical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  canonicalize-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build required canonical JSON
        shell: bash
        run: |
          set +e
          python3 kangoshi-sprint/product-content/build_required_canonical.py \
            > kangoshi-sprint/product-content/required-150/canonical-build.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/required-150/canonical-build.log
          echo "$code" > kangoshi-sprint/product-content/required-150/canonical-build.exit

      - name: Validate canonical JSON
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/required-150/canonical-build.exit)" != "0" ]; then
            echo "1" > kangoshi-sprint/product-content/required-150/canonical-audit.exit
            echo "canonical build failed; validator skipped" \
              > kangoshi-sprint/product-content/required-150/canonical-audit.log
          else
            set +e
            python3 kangoshi-sprint/product-content/validate_required_canonical.py \
              > kangoshi-sprint/product-content/required-150/canonical-audit.log 2>&1
            code=$?
            set -e
            echo "$code" > kangoshi-sprint/product-content/required-150/canonical-audit.exit
          fi
          cat kangoshi-sprint/product-content/required-150/canonical-audit.log

      - name: Commit canonical result and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kangoshi-sprint/product-content/questions \
            kangoshi-sprint/product-content/required-150/canonical-build-report.json \
            kangoshi-sprint/product-content/required-150/canonical-build.log \
            kangoshi-sprint/product-content/required-150/canonical-build.exit \
            kangoshi-sprint/product-content/required-150/canonical-audit.json \
            kangoshi-sprint/product-content/required-150/canonical-audit.log \
            kangoshi-sprint/product-content/required-150/canonical-audit.exit
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: required canonical audit result [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Enforce required canonical gate
        shell: bash
        run: |
          test "$(cat kangoshi-sprint/product-content/required-150/canonical-build.exit)" = "0"
          test "$(cat kangoshi-sprint/product-content/required-150/canonical-audit.exit)" = "0"
