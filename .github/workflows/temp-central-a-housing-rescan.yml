name: Temporary Central A Housing Classification Rescan

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-rescan-trigger-20260726.json

permissions:
  contents: write

jobs:
  scan:
    if: github.head_ref == 'audit/central-a-housing-rescan-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scan branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract current housing classification candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare/data/municipalities';
          const outPath = 'jichitai-compare/operations/audits/central-a-housing-classification-candidates-current-20260726.json';
          const prefectures = new Set(['16','17','18','21','22','23','24','25','27','28']);
          const childTerms = /(子育て|子ども|こども|児童|多子|ひとり親|母子|父子|妊娠|出産|新婚|若年夫婦|義務教育終了前|18歳未満|中学生以下|高校生以下)/;
          const generalTerms = /(移住|定住|空き家|空家|耐震|住宅取得|新築|リフォーム|改修|除却|家財|引越|転入|結婚新生活|若者世帯|住宅ローン)/;
          const candidates = [];

          for (const pref of fs.readdirSync(root)) {
            if (!prefectures.has(pref)) continue;
            const dir = path.join(root, pref);
            for (const filename of fs.readdirSync(dir)) {
              if (!filename.endsWith('.json')) continue;
              const file = path.join(dir, filename);
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const svc = data.services?.housingSupport;
              if (!svc || svc.status !== 'verified') continue;
              const text = JSON.stringify({summary: svc.summary, eligibility: svc.eligibility, details: svc.details});
              if (!generalTerms.test(text) || childTerms.test(text)) continue;
              const riskTerms = [];
              for (const term of ['移住','定住','空き家','空家','耐震','住宅取得','新築','リフォーム','改修','除却','家財','引越','転入','結婚新生活','若者世帯','住宅ローン']) {
                if (text.includes(term)) riskTerms.push(term);
              }
              candidates.push({
                code: data.code,
                name: data.name,
                prefecture: data.prefecture,
                status: svc.status,
                summary: svc.summary,
                sourceUrl: svc.source?.url ?? null,
                riskTerms,
                reason: 'housingSupportの要約・条件に一般住宅制度の語がある一方、子育て・児童・多子・ひとり親・妊娠出産・新婚等の対象条件を確認できない'
              });
            }
          }

          candidates.sort((a,b)=>b.riskTerms.length-a.riskTerms.length||a.code.localeCompare(b.code));
          const result = {
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-candidates-current-20260726',
            generatedAt:new Date().toISOString(),
            session:'中日本調査班A',
            scopeMunicipalities:314,
            candidateCount:candidates.length,
            criteria:{
              requiredStatus:'verified',
              generalHousingTermsPresent:true,
              childOrFamilySpecificTermsAbsent:true,
              note:'現行region/centralからの機械抽出候補。公式利用者向けページによる独立確認前に判定変更しない'
            },
            nextBatch:candidates.slice(0,5),
            candidates
          };
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({candidateCount:candidates.length,nextBatch:candidates.slice(0,5)},null,2));
          NODE

      - name: Commit current candidate report
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-housing-rescan-trigger-20260726.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 中日本A住宅支援分類候補を再抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
