name: APP2-009 Submission Build

on:
  push:
    branches: [main]
    paths: ['automation/app2-009-submit-build-command.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install explicit Kangoshi submission workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/app2_009_install_submission_codemagic.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'APP2-009: install App Store submission workflow' || true
          if ! git diff HEAD^ --quiet 2>/dev/null; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Trigger Codemagic and wait
        id: codemagic
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          cat >/tmp/cmd.json <<'JSON'
          {"request_id":"app2-009-submission-build-20260823","action":"build","workflow_id":"kangoshi-ios","branch":"main","wait":true,"timeout_seconds":4200}
          JSON
          python3 scripts/codemagic_build_gateway.py --command /tmp/cmd.json --output /tmp/result.json
      - name: Persist sanitized result
        if: always() && hashFiles('/tmp/result.json') != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/result.json').read_text(encoding='utf-8'))
          keep={k:r.get(k) for k in ('request_id','ok','workflow_id','branch','resolved_app_id','build_id','status','app_id','error','build_details')}
          Path('/tmp/safe.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/codemagic-results
          cp /tmp/safe.json automation/codemagic-results/app2-009-submission-build-20260823.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/codemagic-results/app2-009-submission-build-20260823.json
          git commit -m 'APP2-009: persist submission build result' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Enforce success
        if: steps.codemagic.outcome != 'success'
        run: exit 1
