name: Temporary Central A Weak Source Batch 2 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch2-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch2-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const expected=[
            {code:'22224',name:'菊川市',service:'housingSupport',source:'https://www.city.kikugawa.shizuoka.jp/toshikeikaku/jyuutakuhojyo.html',summary:'40歳未満の若者・子育て世帯の市内住宅取得へ、一般世帯最大25万円、三世代同居・隣接住宅最大40万円を補助する。'},
            {code:'22325',name:'函南町',service:'sickChildCare',source:'https://website2.infomity.net/8120000051/kidscare.html',additional:['https://kannamisakura-h.com/info/','https://www.town.kannami.shizuoka.jp/material/files/group/11/3kikodomokosodatekeikaku.pdf'],summary:'生後6か月から10歳程度までの病児を函南平出クリニックの専用保育室で預かり、函南さくら保育園では病後児保育を実施する。'},
            {code:'22344',name:'小山町',service:'sickChildCare',source:'https://www.fuji-oyama.jp/oyama/reiki/reiki_honbun/g340RG00000852.html',additional:['https://www.fuji-oyama.jp/page/3167.html','https://www.fujisancco.pref.shizuoka.jp/map/map_result.php?city%5B%5D=%E5%B0%8F%E5%B1%B1%E7%94%BA'],summary:'病気の回復期で集団保育が困難な就学前児童を、町が指定する病後児保育施設で保育する。'},
            {code:'23220',name:'稲沢市',service:'schoolMeals',source:'https://www.city.inazawa.aichi.jp/0000004483.html',additional:['https://www.city.inazawa.aichi.jp/cmsfiles/contents/0000002/2491/R08_yosangaiyou.pdf'],summary:'令和8年度は市内小学校・中学校の学校給食費を完全無償化し、食物アレルギー等で弁当を持参する家庭にも給食費相当額を補助する。'},
            {code:'23561',name:'設楽町',service:'postpartumCare',source:'https://www.town.shitara.lg.jp/online/reiki/reiki_honbun/r253RG00000697.html',additional:['https://www.town.shitara.lg.jp/soshiki/5/1181.html'],summary:'出産後1年未満の母子へ、宿泊・日帰り・訪問型の産後ケアを提供する。'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;
              const pageChecks=[];
              for(const item of expected){
                const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});
                if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);
                const html=await response.text();
                if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);
                if(!html.includes(item.summary))throw new Error(`${item.code} page summary mismatch`);
                pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true,summaryMatched:true});
              }
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});
              if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);
              if(!Array.isArray(municipalities)||municipalities.length!==1741)throw new Error(`published municipality count ${municipalities.length}`);
              let serviceCount=0;
              for(const municipality of municipalities)serviceCount+=Object.keys(municipality.services??{}).length;
              if(serviceCount!==15669)throw new Error(`published service count ${serviceCount}`);
              const serviceChecks=[];
              for(const item of expected){
                const municipality=municipalities.find(x=>String(x.code)===item.code);
                if(!municipality)throw new Error(`${item.code} missing`);
                const service=municipality.services?.[item.service];
                if(service?.status!=='verified')throw new Error(`${item.code}:${item.service} status ${service?.status}`);
                if(service.summary!==item.summary)throw new Error(`${item.code}:${item.service} summary mismatch`);
                if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch`);
                const additionalUrls=(service.additionalSources??[]).map(x=>x.url);
                for(const url of item.additional??[])if(!additionalUrls.includes(url))throw new Error(`${item.code}:${item.service} additional source missing ${url}`);
                serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,summaryMatched:true,sourceMatched:true,additionalSourcesMatched:(item.additional??[]).length});
              }
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch2-public-verification-20260726',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:5,reviewedServiceCount:5,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};
              fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch2-public-verification-20260726.json',JSON.stringify(audit,null,2)+'\n');
              process.exit(0);
            }catch(error){
              lastError=error;
              if(attempt<30)await sleep(20000);
            }
          }
          throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-public-trigger-20260726.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第2群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
