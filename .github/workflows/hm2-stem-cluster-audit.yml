name: HM2 stem cluster audit
on:
  push:
    branches: [audit/hm2-quality-20261110]
    paths:
      - scripts/audit_sm2_question_stem_clusters.cjs
      - scripts/verify_sm2_cluster_a_law_redesign.cjs
      - scripts/verify_sm2_cluster_a_hyg_phy_26.cjs
      - scripts/verify_sm2_cluster_b_law_14.cjs
      - scripts/verify_sm2_cluster_b_hyg_first10.cjs
      - scripts/verify_sm2_cluster_b_next10_hyg_phy.cjs
      - scripts/verify_sm2_cluster_b_final5.cjs
      - scripts/verify_sm2_cluster_c_law_first10.cjs
      - scripts/verify_sm2_cluster_c_next10.cjs
      - scripts/verify_sm2_cluster_c_third10.cjs
      - scripts/verify_sm2_cluster_c_final8.cjs
      - scripts/verify_sm2_cluster_d_law_first10.cjs
      - scripts/verify_sm2_cluster_d_next10.cjs
      - scripts/verify_sm2_cluster_d_third10.cjs
      - scripts/verify_sm2_cluster_d_final8.cjs
      - apps/sanitary-manager-2/audit-fixes.js
      - .github/workflows/hm2-stem-cluster-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate duplicate clusters and IDs
        run: node scripts/audit_sm2_question_stem_clusters.cjs
      - name: Verify largest-cluster 14 law redesign
        run: node scripts/verify_sm2_cluster_a_law_redesign.cjs
      - name: Verify remaining 26 cluster A hygiene and physiology rewrites
        run: node scripts/verify_sm2_cluster_a_hyg_phy_26.cjs
      - name: Verify fourteen cluster B legal scenarios and regenerated question sets
        run: node scripts/verify_sm2_cluster_b_law_14.cjs
      - name: Verify B hygiene first ten and reconstituted questions
        run: node scripts/verify_sm2_cluster_b_hyg_first10.cjs
      - name: Verify next ten cluster B cases and reconstructed sets
        run: node scripts/verify_sm2_cluster_b_next10_hyg_phy.cjs
      - name: Verify cluster B final five and completed group
        run: node scripts/verify_sm2_cluster_b_final5.cjs
      - name: Verify C first ten law cases and rebuilt 300-question bank
        run: node scripts/verify_sm2_cluster_c_law_first10.cjs
      - name: Verify C next ten legal hygiene cases and regenerated question sets
        run: node scripts/verify_sm2_cluster_c_next10.cjs
      - name: Verify third ten C hygiene physiology cases and 300-question reconstruction
        run: node scripts/verify_sm2_cluster_c_third10.cjs
      - name: Verify cluster C final eight and completion
        run: node scripts/verify_sm2_cluster_c_final8.cjs
      - name: Verify first ten cluster D law cases and rebuilt question bank
        run: node scripts/verify_sm2_cluster_d_law_first10.cjs
      - name: Verify cluster D next ten law and hygiene cases
        run: node scripts/verify_sm2_cluster_d_next10.cjs
      - name: Verify cluster D third ten hygiene and physiology scenarios
        run: node scripts/verify_sm2_cluster_d_third10.cjs
      - name: Verify cluster D final eight physiology scenarios
        run: node scripts/verify_sm2_cluster_d_final8.cjs
      - name: Verify previous seven source fixes
        run: node scripts/verify_sm2_seven_primary_sources.cjs
      - name: Verify previous fifteen multiple-answer fixes
        run: node scripts/verify_sm2_15_unique_answers.cjs
