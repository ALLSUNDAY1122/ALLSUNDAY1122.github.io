name: Temporary rescan release queue 294

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-rescan-release-queue-294-0811.yml

permissions:
  contents: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rescan regional branches and update queue
        shell: bash
        run: |
          git pull --rebase origin main
          git fetch origin \
            region/north:refs/remotes/origin/region/north \
            region/east:refs/remotes/origin/region/east \
            region/central:refs/remotes/origin/region/central \
            region/west:refs/remotes/origin/region/west
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path, PurePosixPath

          queue_path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in data['entries']}
          release_delta = {'central': 10}

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def municipality_name(ref, path, code):
              try:
                  obj = json.loads(run('git', 'show', f'{ref}:{path}'))
                  if isinstance(obj, dict):
                      if isinstance(obj.get('municipality'), dict):
                          name = obj['municipality'].get('name')
                          if name:
                              return name
                      for key in ('municipalityName', 'name'):
                          value = obj.get(key)
                          if isinstance(value, str) and value:
                              return value
              except Exception:
                  pass
              return code

          for region, entry in entries.items():
              old_count = int(entry.get('count', len(entry.get('municipalities', []))))
              old_pending = int(entry.get('pendingSinceLastRelease', 0))
              integrated_baseline = old_count - old_pending + release_delta.get(region, 0)
              ref = f"origin/{entry['branch']}"
              output = run(
                  'git', 'ls-tree', '-r', '--name-only', ref, '--',
                  'jichitai-compare/data/municipalities'
              )
              paths = [line for line in output.splitlines() if line.endswith('.json')]
              existing = {item['code']: item['name'] for item in entry.get('municipalities', [])}
              municipalities = []
              for path in paths:
                  code = PurePosixPath(path).stem
                  if not code.isdigit():
                      continue
                  name = existing.get(code) or municipality_name(ref, path, code)
                  municipalities.append({'code': code, 'name': name})
              municipalities.sort(key=lambda item: item['code'])
              entry['municipalities'] = municipalities
              entry['count'] = len(municipalities)
              pending = max(0, entry['count'] - integrated_baseline)
              entry['pendingSinceLastRelease'] = pending
              entry['releaseStatus'] = 'release_ready' if pending >= 10 else 'pending_threshold'
              entry['reason'] = f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              entry['generatedPullRequest'] = 518

          central = entries['central']
          central['mainIntegrationPr'] = 517
          central['auditStatus'] = 'passed'

          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).replace(second=0, microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities'] = 0
          data['summary']['releaseReadyRegions'] = [
              entry['region'] for entry in data['entries']
              if entry.get('pendingSinceLastRelease', 0) >= 10
          ]
          data['summary']['auditBlockedRegions'] = []
          data['summary']['lastNationalIntegrationAt'] = '2026-07-22T07:59:35+09:00'
          data['summary']['lastNationalIntegrationPr'] = 517
          data['summary']['latestGeneratedMunicipalityCount'] = 294
          data['summary']['latestGeneratedPullRequest'] = 518
          data['summary']['latestPublicCountPullRequest'] = 518
          pending_text = '、'.join(
              f"{entry['region']} {entry.get('pendingSinceLastRelease', 0)}"
              for entry in sorted(data['entries'], key=lambda item: item.get('pendingSinceLastRelease', 0), reverse=True)
          )
          data['nextAction'] = f'地方統合を継続。現在の公開後繰越: {pending_text}。10自治体到達地域を固定スナップショットで全国統合する。'
          data['humanDecisionRequired'] = False

          queue_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-rescan-release-queue-294-0811.yml
          git commit -m "統括管理: 公開294自治体後の全国キューを再走査"
          git push origin HEAD:main
