name: Record North B round 10 PR metadata

on:
  push:
    branches:
      - 'audit/north-b-sanity-round-10-20260725'

permissions:
  contents: write

jobs:
  record:
    if: ${{ !contains(github.event.head_commit.message, '[north-b-round10-pr-recorded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record PR metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('jichitai-compare')
          for code in ['06367','06382','06403','06426']:
              path = root / f'operations/tasks/{code}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              data['pullRequestNumber'] = 3121
              data['lastUpdatedAt'] = '2026-07-25T04:08:00+09:00'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          path = root / 'operations/control/session-checkpoints/north-b.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt'] = '2026-07-25T04:08:00+09:00'
          data['pullRequestNumber'] = 3121
          data['ciStatus'] = 'pending'
          data['nextAction'] = '北日本Bの10回精度監査は107/107自治体で完了。第10回の戸沢村、川西町、飯豊町、三川町の4件訂正を地域PR #3121で検証し、CI成功後にregion/northへ統合してmain同期する。確定誤り28件を訂正済み。'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit metadata
        run: |
          rm .github/workflows/north-b-round10-pr-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare .github/workflows/north-b-round10-pr-metadata.yml
          git commit -m '[north-b-round10-pr-recorded] ops: record final audit PR metadata'
          git push
