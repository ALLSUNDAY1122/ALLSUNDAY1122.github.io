name: Temporary North B Fiscal Anyone Finalize

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-fiscal-finalize.yml'

permissions:
  contents: write

concurrency:
  group: north-b-fiscal-anyone-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fresh branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import phase1 confirmed files
        shell: bash
        run: |
          git fetch origin audit/north-b-fiscal-anyone-triage-20260725
          git checkout origin/audit/north-b-fiscal-anyone-triage-20260725 -- \
            jichitai-compare/data/municipalities/01/01604.json \
            jichitai-compare/data/municipalities/04/04606.json \
            jichitai-compare/data/municipalities/06/06428.json \
            jichitai-compare/operations/tasks/01604.json \
            jichitai-compare/operations/tasks/04606.json \
            jichitai-compare/operations/tasks/06428.json \
            jichitai-compare/operations/audits/north-b-fiscal-anyone-triage-20260725.json

      - name: Apply phase2 confirmed corrections
        run: node jichitai-compare/scripts/temp-north-b-fiscal-finalize.mjs

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Commit finalized audit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-fiscal-anyone-triage-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json \
                  jichitai-compare/data/generated \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/municipality \
                  jichitai-compare/sitemap.xml
          if git diff --cached --quiet; then
            echo 'No finalized changes to commit.'
            exit 1
          fi
          git commit -m 'fix: 北日本B旧年度・誰でも通園の確定不整合を修正 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
