name: Temporary Central A Housing Batch 12 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch12-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch12-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'21208',name:'瑞浪市',status:'verified',summary:'岐阜県外から移住して住宅を新築・購入する、18歳未満の子がいる世帯または夫婦の一方が40歳未満の世帯へ30万円を交付する。',source:'https://www.city.mizunami.lg.jp/kurashi/1008553/shoureikin/1001522.html'},
            {code:'21521',name:'御嵩町',status:'unavailable',summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.mitake.lg.jp/portal/town/measure/other-various-plan/post0076762/'},
            {code:'22209',name:'島田市',status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',source:'https://www.city.shimada.shizuoka.jp/kurashi-docs/kekkonsinseikatsusien.html'},
            {code:'23207',name:'豊川市',status:'verified',summary:'都市機能誘導区域内に住宅を取得して転入・転居する世帯へ、固定資産税相当額と子育て奨励金を交付する。',source:'https://www.city.toyokawa.lg.jp/shisei/seisaku/10/1/16698.html'},
            {code:'22225',name:'伊豆の国市',status:'verified',summary:'東京圏からの移住者へ、単身60万円、2人以上世帯100万円、18歳未満1人につき100万円を加算する。',source:'https://www.city.izunokuni.shizuoka.jp/seisaku/ijuu/shiennkinn.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch12Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const expectedLabel=target.status==='unavailable'?'公式情報で詳細未確認':'確認済み';
                const statusMatches=html.includes(expectedLabel);
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch12Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>item.code===target.code);
                const service=municipality?.services?.housingSupport;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch12-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3721,nationalSyncPullRequest:3723,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:1,expectedVerifiedCount:4,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch12-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch12-public-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第12群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
