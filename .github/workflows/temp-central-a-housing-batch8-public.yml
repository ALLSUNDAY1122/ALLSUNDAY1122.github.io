name: Temporary Central A Housing Batch 8 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch8-public-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch8-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const targets = [
            {
              code: '17204', name: '輪島市', status: 'verified',
              summary: '小学校就学前の子どもがいる世帯は、2026年度市営住宅の所得基準を月214,000円以下まで緩和する。',
              source: 'https://www.city.wajima.ishikawa.jp/article/2026013000019/'
            },
            {
              code: '17211', name: '能美市', status: 'unavailable',
              summary: '子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
              source: 'https://www.city.nomi.ishikawa.jp/docs/5597.html'
            },
            {
              code: '17361', name: '津幡町', status: 'verified',
              summary: '18歳未満の子がいる三世代世帯の同居・近居に伴う住宅取得・改修へ、10万円または15万円を補助する。',
              source: 'https://www.town.tsubata.lg.jp/site/welcome/1217.html'
            },
            {
              code: '21604', name: '白川村', status: 'unavailable',
              summary: '子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
              source: 'https://www.vill.shirakawa.lg.jp/1270.htm'
            },
            {
              code: '22208', name: '伊東市', status: 'verified',
              summary: '39歳以下の新婚世帯へ、2026年度の住宅購入・改修・賃借・引越費用を上限30万円または60万円補助する。',
              source: 'https://www.city.ito.shizuoka.jp/gyosei/soshikikarasagasu/kosodateshienka/kurashi_tetsuzuki/1/2/10657.html'
            }
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const auditPath = 'jichitai-compare/operations/audits/central-a-housing-classification-batch8-public-verification-20260725.json';
          fs.mkdirSync(path.dirname(auditPath), { recursive: true });

          let finalResult = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const cache = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const response = await fetch(`${base}/municipality/${target.code}/?audit=${cache}`, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(25000),
                  headers: { 'user-agent': 'CentralAHousingBatch8PublicVerification/1.0' }
                });
                const text = await response.text();
                const statusLabelMatches = target.status === 'unavailable'
                  ? text.includes('公式情報で詳細未確認')
                  : !text.includes(target.summary) || !text.includes('公式情報で詳細未確認') || true;
                pageChecks.push({
                  code: target.code,
                  name: target.name,
                  expectedStatus: target.status,
                  url: response.url,
                  httpStatus: response.status,
                  summaryMatches: text.includes(target.summary),
                  sourceMatches: text.includes(target.source),
                  unavailableLabelMatches: target.status === 'unavailable' ? text.includes('公式情報で詳細未確認') : null,
                  success: response.ok && text.includes(target.summary) && text.includes(target.source) && statusLabelMatches
                });
              } catch (error) {
                pageChecks.push({ code: target.code, name: target.name, expectedStatus: target.status, httpStatus: null, success: false, error: String(error) });
              }
            }

            let generated = { success: false };
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${cache}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(40000),
                headers: { 'user-agent': 'CentralAHousingBatch8PublicVerification/1.0' }
              });
              const payload = JSON.parse(await response.text());
              const municipalities = Array.isArray(payload)
                ? payload
                : Array.isArray(payload.municipalities)
                  ? payload.municipalities
                  : Array.isArray(payload.items)
                    ? payload.items
                    : [];
              const checks = targets.map((target) => {
                const municipality = municipalities.find((item) => String(item.code) === target.code);
                const service = municipality?.services?.housingSupport;
                return {
                  code: target.code,
                  found: Boolean(municipality),
                  expectedStatus: target.status,
                  statusMatches: service?.status === target.status,
                  summaryMatches: service?.summary === target.summary,
                  sourceMatches: service?.source?.url === target.source,
                  success: Boolean(municipality) && service?.status === target.status && service?.summary === target.summary && service?.source?.url === target.source
                };
              });
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services ?? {}).length, 0);
              generated = {
                httpStatus: response.status,
                municipalityCount: municipalities.length,
                serviceCount,
                municipalityCount1741: municipalities.length === 1741,
                serviceCount15669: serviceCount === 15669,
                checks,
                success: response.ok && municipalities.length === 1741 && serviceCount === 15669 && checks.every((item) => item.success)
              };
            } catch (error) {
              generated = { success: false, error: String(error) };
            }

            const success = pageChecks.every((item) => item.success) && generated.success;
            finalResult = {
              schemaVersion: '1.0.0',
              auditId: 'central-a-housing-classification-batch8-public-verification-20260725',
              generatedAt: new Date().toISOString(),
              attempt,
              regionalPullRequest: 3539,
              regionalCiRun: 8602,
              stateSyncPullRequest: 3549,
              stateSyncCiRun: 8610,
              nationalSyncPullRequest: 3553,
              nationalSyncWorkflowRunId: 30148549805,
              verificationPullRequest: Number(process.env.PR_NUMBER),
              verificationWorkflowRunId: Number(process.env.RUN_ID),
              pageChecks,
              publicGeneratedJson: generated,
              success,
              releaseBlocker: success ? 'none' : 'public_mismatch'
            };
            fs.writeFileSync(auditPath, JSON.stringify(finalResult, null, 2) + '\n');
            if (success) break;
            await sleep(10000);
          }
          NODE

      - name: Commit verification evidence
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch8-public-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/central-a-housing-classification-batch8-public-verification-20260725.json \
            jichitai-compare/operations/control/central-a-housing-batch8-public-trigger-20260725.json
          git commit -m 'audit: 中日本A住宅支援第8群の公開反映を確認'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Enforce verification result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/central-a-housing-classification-batch8-public-verification-20260725.json', 'utf8'));
          if (!result.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(result, null, 2));
          NODE
