name: IT Passport batch 12 novelty repair
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  repair:
    if: startsWith(github.event.issue.title, '[ITP-B12-NOVELTY-REPAIR]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Replace duplicate-topic questions with original syllabus-grounded items
        run: |
          python3 - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          qp=Path('apps/it-passport-rebuild/questions')
          old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-12.json').read_text())
          norm=lambda s: re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s)).lower())
          old_topics={norm(q.get('topic','')) for q in old}; old_questions={norm(q['question']) for q in old}
          base={"round":3,"source_url":"https://www.ipa.go.jp/shiken/syllabus/gaiyou.html","reference_date":"2026-09-16","origin_type":"original","rights_basis":"original_question_based_on_public_syllabus","syllabus_version":"6.5"}
          repl={
          'ip-r3-str-043':('ストラテジ系','PEST分析','企業を取り巻く外部環境を、政治・経済・社会・技術の四つの観点から整理して事業への影響を分析する手法はどれか。',['PEST分析','ABC分析','E-R分析','デルファイ法'],0,'PEST分析は、Politics、Economy、Society、Technologyの四観点からマクロな外部環境を整理し、事業機会や脅威の把握に用いる。'),
          'ip-r3-str-045':('ストラテジ系','バリューチェーン','企業活動を購買物流、製造、出荷物流、販売、サービスなどの連鎖として捉え、どこで価値が生まれるかを分析する考え方はどれか。',['バリューチェーン','データマイニング','正規化','PERT'],0,'バリューチェーンは企業活動を価値を生み出す一連の主活動と支援活動として捉え、競争優位の源泉や改善箇所を分析する考え方である。'),
          'ip-r3-str-046':('ストラテジ系','アンゾフの成長マトリクス','企業の成長戦略を、既存・新規の市場と既存・新規の製品という二つの軸で整理するフレームワークはどれか。',['PPM','アンゾフの成長マトリクス','SWOT分析','バランススコアカード'],1,'アンゾフの成長マトリクスは市場と製品を既存・新規に分け、市場浸透、市場開拓、製品開発、多角化という成長方向を整理する。'),
          'ip-r3-str-047':('ストラテジ系','フリーミアム','基本機能を無料で提供し、追加機能や高度なサービスを利用する顧客から料金を得るビジネスモデルはどれか。',['フランチャイズ','ファブレス','フリーミアム','OEM'],2,'フリーミアムは基本的なサービスを無料で広く提供し、追加機能や上位サービスを必要とする利用者から課金して収益化するモデルである。'),
          'ip-r3-str-048':('ストラテジ系','損益分岐点','売上高と総費用が等しくなり、利益も損失も生じない売上高を表す用語はどれか。',['固定費','限界利益率','営業利益','損益分岐点'],3,'損益分岐点は売上高と固定費・変動費を合わせた総費用が一致して利益がゼロになる点で、採算性の判断に利用される。'),
          'ip-r3-str-049':('ストラテジ系','意匠権','物品や建築物、画像などのデザインについて、視覚を通じて美感を起こさせる創作を保護する知的財産権はどれか。',['意匠権','特許権','著作権','営業秘密'],0,'意匠権は物品、建築物、画像などの形状・模様・色彩等によるデザインを保護する産業財産権で、登録を経て権利が発生する。'),
          'ip-r3-mgt-025':('マネジメント系','クリティカルパス','プロジェクトの作業順序と所要時間から、遅延するとプロジェクト全体の完了日が直接遅れる最長経路を何というか。',['クリティカルパス','サービスデスク','ベースライン','マイルストーン'],0,'クリティカルパスは作業ネットワーク上で所要時間が最長となる経路で、その経路上の作業が遅れるとプロジェクト全体の完了も遅れる。'),
          'ip-r3-mgt-026':('マネジメント系','EVM','プロジェクトの進捗を、計画価値・出来高・実コストを用いてコストとスケジュールの両面から定量評価する管理手法はどれか。',['ITIL','EVM','SLA','DFD'],1,'EVMはEarned Value Managementの略で、計画価値、出来高、実コストを比較し、コスト差異やスケジュール差異を定量的に把握する手法である。'),
          'ip-r3-mgt-027':('マネジメント系','RACIチャート','プロジェクトの各作業について、実行責任者・説明責任者・協議先・報告先の役割分担を明確にする表はどれか。',['ガントチャート','パレート図','RACIチャート','管理図'],2,'RACIチャートはResponsible、Accountable、Consulted、Informedの区分で、各作業に対する関係者の役割と責任を明確化する。'),
          'ip-r3-tech-055':('テクノロジ系','コンテナ型仮想化','ホストOSのカーネルを共有しながら、アプリケーションと必要なライブラリを隔離された実行環境として動かす仮想化方式はどれか。',['コンテナ型仮想化','RAID','デュアルシステム','パイプライン処理'],0,'コンテナ型仮想化はホストOSのカーネルを共有しつつ、アプリケーションと依存ライブラリを隔離した環境で実行するため、一般に仮想マシンより軽量である。'),
          'ip-r3-tech-056':('テクノロジ系','CDN','Webコンテンツを地理的に分散した複数の配信拠点へ配置し、利用者に近い拠点から配信して応答時間や回線負荷を抑える仕組みはどれか。',['VPN','CDN','DHCP','NAT'],1,'CDNはContent Delivery Networkの略で、コンテンツを複数拠点へ分散配置し、利用者に近い拠点から配信することで遅延やオリジンサーバ負荷を軽減する。'),
          'ip-r3-tech-057':('テクノロジ系','データベースのインデックス','データベースで検索対象の列の値と格納位置などを別構造で保持し、検索を高速化するために利用するものはどれか。',['トリガ','ビュー','インデックス','ジャーナル'],2,'インデックスは検索キーとデータ位置などを管理する索引構造で、追加の記憶領域や更新コストと引き換えに条件検索を高速化する。'),
          'ip-r3-tech-058':('テクノロジ系','メッセージキュー','送信側と受信側を時間的に分離し、処理要求を一時的に蓄えて受信側が順次取り出せる非同期連携の仕組みはどれか。',['ロードバランサ','キャッシュ','メッセージキュー','DNS'],2,'メッセージキューはメッセージを一時保存する待ち行列を介して送信側と受信側を疎結合にし、非同期処理や負荷平準化を実現する。'),
          'ip-r3-tech-060':('テクノロジ系','ソルト付きハッシュ','パスワード保存時に利用者ごとのランダム値を加えてからハッシュ化し、同じパスワードでも同一のハッシュ値になりにくくする対策はどれか。',['ソルト付きハッシュ','公開鍵暗号','電子署名','ステガノグラフィ'],0,'ソルト付きハッシュはパスワードごとに異なるランダム値を加えてハッシュ化することで、同一パスワードの一致や事前計算表による解析を困難にする。'),
          'ip-r3-tech-061':('テクノロジ系','OAuth','利用者のパスワードそのものを第三者アプリへ渡さず、限定された権限をアクセストークンとして委譲するための認可の仕組みはどれか。',['S/MIME','OAuth','SNMP','IPsec'],1,'OAuthは利用者の認証情報を第三者アプリへ直接渡さず、許可された範囲のアクセス権をトークンとして委譲するための認可フレームワークである。'),
          'ip-r3-tech-063':('テクノロジ系','エッジコンピューティング','IoT機器などが生成するデータをクラウドへ全て送る前に、データ発生源に近い場所で処理して遅延や通信量を抑える考え方はどれか。',['グリッドコンピューティング','バッチ処理','エッジコンピューティング','タイムシェアリング'],2,'エッジコンピューティングは端末やネットワークの端に近い場所でデータを処理し、クラウドとの通信量削減やリアルタイム性向上を図る考え方である。')}
          byid={q['id']:q for q in batch}
          assert set(repl)<=set(byid)
          for qid,(subject,topic,question,choices,ci,exp) in repl.items():
            q={"id":qid,**base,"subject":subject,"topic":topic,"question":question,"choices":choices,"correct_index":ci,"explanation":exp}
            assert norm(topic) not in old_topics, f'{qid}: replacement topic already canonical: {topic}'
            assert norm(question) not in old_questions, f'{qid}: replacement question already canonical'
            byid[qid]=q
          repaired=[byid[q['id']] for q in batch]
          topics=[norm(q['topic']) for q in repaired]; questions=[norm(q['question']) for q in repaired]
          assert len(set(topics))==20 and not (set(topics)&old_topics), 'cross-batch topic novelty failed'
          assert len(set(questions))==20 and not (set(questions)&old_questions), 'cross-batch question novelty failed'
          (qp/'batch-12.json').write_text(json.dumps(repaired,ensure_ascii=False,indent=2)+'\n')
          print('PASS: repaired 16 duplicate-topic items; all 20 topics/questions novel vs canonical')
          PY
      - name: Run original Batch12 premerge contract plus cross-batch topic novelty
        run: |
          python3 - <<'PY'
          import collections,json,re,unicodedata
          from pathlib import Path
          root=Path('apps/it-passport-rebuild'); qp=root/'questions'; old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-12.json').read_text()); manifest=json.loads((qp/'manifest.json').read_text()); config=json.loads((root/'quality/exam-config.json').read_text())
          norm=lambda s: re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s)).lower())
          assert len(old)==220 and len(batch)==20 and manifest['canonical']['original_mock']['current']==220
          ids={q['id'] for q in old}; texts={norm(q['question']) for q in old}; old_topics={norm(q['topic']) for q in old}; req=set(config['required_fields']); subjects=collections.Counter(); answers=collections.Counter(); seen_ids=set(); seen_texts=set(); seen_topics=set()
          for q in batch:
            assert not (req-set(q)), (q['id'],req-set(q)); assert q['id'] not in ids|seen_ids; qt=norm(q['question']); tp=norm(q['topic']); assert qt not in texts|seen_texts; assert tp not in old_topics|seen_topics, (q['id'],q['topic']); assert q['subject'] in config['subjects'] and q['round']==3; assert len(q['choices'])==4 and len({norm(x) for x in q['choices']})==4; assert isinstance(q['correct_index'],int) and 0<=q['correct_index']<4; assert q['syllabus_version']==manifest['current_syllabus_version']=='6.5'; assert q['origin_type']=='original' and q['rights_basis']=='original_question_based_on_public_syllabus'; assert q['source_url']=='https://www.ipa.go.jp/shiken/syllabus/gaiyou.html' and q['reference_date']=='2026-09-16'; assert len(q['question'])>=20 and len(q['explanation'])>=35
            correct=str(q['choices'][q['correct_index']]); exp=norm(q['explanation']); parts=[norm(x) for x in re.split(r'[と・/／,、\s]+',correct) if norm(x)]; assert norm(correct) in exp or tp in exp or (len(parts)>1 and all(x in exp for x in parts)), q['id']
            subjects[q['subject']]+=1; answers[q['correct_index']]+=1; seen_ids.add(q['id']); seen_texts.add(qt); seen_topics.add(tp)
          assert subjects=={'ストラテジ系':7,'マネジメント系':4,'テクノロジ系':9},subjects; assert answers=={0:5,1:5,2:5,3:5},answers
          print('PASS: Batch12 repaired premerge + cross-batch topic novelty',subjects,answers)
          PY
      - name: Commit staged repair only
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/it-passport-rebuild/questions/batch-12.json
          git diff --cached --check
          git commit -m 'content(itp): repair batch12 cross-batch novelty'
          git push origin HEAD:main
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment '${{ github.event.issue.number }}' --body "Batch12 novelty repair workflow completed with job status: ${{ job.status }}. Canonical merge is intentionally separate; run the existing Batch12 merge gate only after this repair passes."
