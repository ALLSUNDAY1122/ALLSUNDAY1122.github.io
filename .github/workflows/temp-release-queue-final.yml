name: Temporary Release Queue Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-release-queue-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue and self-delete
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          regions=('north','east','central','west')
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          path=Path('jichitai-compare/operations/control/release-queue.json'); q=json.loads(path.read_text(encoding='utf-8')); entries={e['region']:e for e in q['entries']}
          for region in regions:
              ref=f'origin/region/{region}'; state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines(); items=[]
              for p in names:
                  if not re.search(r'/\d{5}\.json$',p): continue
                  d=json.loads(show(ref,p))
                  if belongs(region,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code']); pending=int(state.get(fields[region],0)); e=entries[region]
              e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':pending,'releaseStatus':'release_ready' if pending>=10 else 'pending_threshold','reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体','mainIntegrationPr':state.get('lastNationalIntegrationPr'),'generatedPullRequest':720,'auditStatus':'passed'})
          total=sum(entries[r]['count'] for r in regions); pending={r:entries[r]['pendingSinceLastRelease'] for r in regions}; ready=[r for r in regions if pending[r]>=10]
          q['updatedAt']=datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'); q['status']='active'; q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':454,'latestGeneratedPullRequest':720,'latestPublicCountPullRequest':720,'releaseReadyRegions':ready,'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合条件到達: '+','.join(ready) if ready else '10自治体到達地域なし。')}
          path.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps({'total':total,'pending':pending},ensure_ascii=False))
          PY
          rm .github/workflows/temp-release-queue-final.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-release-queue-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 最新地方統合を全国キューへ同期'
          git pull --rebase origin main
          git push origin main
