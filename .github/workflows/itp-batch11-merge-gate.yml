name: IT Passport batch 11 merge gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/itp-batch11-merge-gate.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/itp-batch11-merge-gate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-merge:
    if: github.actor == 'ALLSUNDAY1122'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Validate staged batch11 and cross-batch novelty
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,re,unicodedata
          from pathlib import Path
          root=Path('apps/it-passport-rebuild'); qp=root/'questions'
          old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-11.json').read_text()); manifest=json.loads((qp/'manifest.json').read_text()); config=json.loads((root/'quality/exam-config.json').read_text())
          norm=lambda s: re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s)).lower())
          assert len(old)==200, f'canonical length={len(old)} expected=200'
          assert manifest['canonical']['original_mock']['current']==200, f'manifest current={manifest["canonical"]["original_mock"]["current"]} expected=200'
          assert len(batch)==20, f'batch length={len(batch)} expected=20'
          ids={q['id'] for q in old}; texts={norm(q['question']) for q in old}; subjects=collections.Counter(); answers=collections.Counter(); req=set(config['required_fields']); seen_ids=set(); seen_texts=set(); seen_topics=set()
          for q in batch:
            missing=req-set(q); assert not missing, f'{q.get("id")}: missing fields={sorted(missing)}'
            assert q['id'] not in ids and q['id'] not in seen_ids, f'duplicate id={q["id"]}'
            qt=norm(q['question']); tp=norm(q['topic']); assert qt not in texts and qt not in seen_texts, f'duplicate question={q["id"]}'; assert tp not in seen_topics, f'duplicate batch topic={q["id"]}:{q["topic"]}'
            assert q['subject'] in config['subjects'] and q['round']==2
            assert len(q['choices'])==4 and len({norm(x) for x in q['choices']})==4
            assert isinstance(q['correct_index'],int) and 0<=q['correct_index']<4
            assert q['syllabus_version']==manifest['current_syllabus_version']=='6.5'
            assert q['origin_type']=='original' and q['rights_basis']=='original_question_based_on_public_syllabus'
            assert q['source_url']=='https://www.ipa.go.jp/shiken/syllabus/gaiyou.html' and q['reference_date']=='2026-09-15'
            assert len(q['question'])>=20 and len(q['explanation'])>=35
            correct=str(q['choices'][q['correct_index']]); exp=norm(q['explanation']); parts=[norm(x) for x in re.split(r'[と・/／,、\s]+',correct) if norm(x)]
            assert norm(correct) in exp or tp in exp or (len(parts)>1 and all(x in exp for x in parts)), f'{q["id"]}: weak explanation grounding'
            subjects[q['subject']]+=1; answers[q['correct_index']]+=1; seen_ids.add(q['id']); seen_texts.add(qt); seen_topics.add(tp)
          assert subjects=={'ストラテジ系':7,'マネジメント系':4,'テクノロジ系':9}, subjects
          assert answers=={0:5,1:5,2:5,3:5}, answers
          print('PASS batch11 premerge',subjects,answers)
          PY
      - name: Merge and validate canonical 220
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          qp=Path('apps/it-passport-rebuild/questions'); old=json.loads((qp/'original-mock.json').read_text()); batch=json.loads((qp/'batch-11.json').read_text()); manifest=json.loads((qp/'manifest.json').read_text()); merged=old+batch; assert len(merged)==220
          (qp/'original-mock.json').write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n'); manifest['baseline_date']='2026-09-15'; manifest['canonical']['original_mock']['current']=220; manifest['canonical']['original_mock']['status']='BUILDING'; manifest['canonical']['original_mock']['audit_status']='EXPECTED_FAIL_UNTIL_COMPLETE'; (qp/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 apps/it-passport-rebuild/quality/validate-question-dataset.py
          if python3 apps/it-passport-rebuild/quality/validate-question-dataset.py --release; then echo 'unexpected release PASS below 300' >&2; exit 1; else echo 'PASS: release remains fail-closed below 300'; fi
      - name: Commit canonical progress
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/it-passport-rebuild/questions/original-mock.json apps/it-passport-rebuild/questions/manifest.json
          git diff --cached --check
          git commit -m 'content(itp): merge audited batch 11 to 220 questions'
          git push origin HEAD:main
