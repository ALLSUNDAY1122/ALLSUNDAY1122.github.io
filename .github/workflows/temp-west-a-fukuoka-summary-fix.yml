name: Temporary West A Fukuoka Summary Fix

on:
  push:
    branches:
      - audit/40130-public-summary-cleanup

permissions:
  contents: write

jobs:
  fix-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/40130-public-summary-cleanup
          fetch-depth: 0

      - name: Remove internal workflow wording
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          municipality_path = Path('jichitai-compare/data/municipalities/40/40130.json')
          municipality = json.loads(municipality_path.read_text(encoding='utf-8'))
          old_summary = '西日本調査班の初期登録対象。9制度すべてを公式情報で確認済み。PR提出前の最終検証を実施する。'
          if municipality.get('summary') != old_summary:
              raise SystemExit(f'Unexpected municipality summary: {municipality.get("summary")!r}')
          municipality['summary'] = '福岡市の子育て、教育、住宅、生活、防災に関する9制度を自治体公式情報で確認済み。'
          municipality['updatedAt'] = '2026-07-24'
          municipality_path.write_text(json.dumps(municipality, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          task_path = Path('jichitai-compare/operations/tasks/40130.json')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          note = '公開ページに残っていた内部作業文言を除去し、利用者向け要約へ修正。'
          notes = task.setdefault('notes', [])
          if note not in notes:
              notes.append(note)
          task['lastCheckedAt'] = '2026-07-24'
          task['lastUpdatedAt'] = '2026-07-24T22:55:00+09:00'
          task['lastUpdatedBy'] = '西日本調査班A（完了後品質監査）'
          task_path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit corrected source records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/data/municipalities/40/40130.json jichitai-compare/operations/tasks/40130.json
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'audit: remove internal wording from Fukuoka City summary'
          git push origin HEAD:audit/40130-public-summary-cleanup
