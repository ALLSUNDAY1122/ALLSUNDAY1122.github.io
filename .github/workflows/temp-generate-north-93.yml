name: Temp Generate North 93

on:
  push:
    branches:
      - coord/generated-north-93

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-north-93
          fetch-depth: 0
      - name: Generate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated
          cd ..
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const generated = JSON.parse(fs.readFileSync('jichitai-compare/data/generated/municipalities.json', 'utf8'));
          const count = generated.meta.municipalityCount;
          if (count !== 93) throw new Error(`Expected 93 municipalities, got ${count}`);
          const path = 'jichitai-compare/index.html';
          const source = fs.readFileSync(path, 'utf8');
          const updated = source.replace(/\d+自治体・9制度/g, `${count}自治体・9制度`);
          fs.writeFileSync(path, updated);
          NODE
          rm -f .github/workflows/temp-generate-north-93.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html .github/workflows/temp-generate-north-93.yml
          git commit -m "生成更新: 北日本全国統合後の93自治体を同期"
          git push origin HEAD:coord/generated-north-93
