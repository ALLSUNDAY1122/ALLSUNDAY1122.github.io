name: APP2-004 Pharmacist IAP Bootstrap

on:
  push:
    branches: [main]
    paths:
      - automation/app2-004-yakuzaishi-iap-command.json
      - scripts/app2_004_yakuzaishi_iap_bootstrap.py
      - scripts/app2_004_yakuzaishi_iap_v2_runner.py
      - scripts/app2_004_yakuzaishi_metadata_probe.py
      - .github/workflows/app2-004-yakuzaishi-iap-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: app2-004-yakuzaishi-iap-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate command
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('automation/app2-004-yakuzaishi-iap-command.json').read_text(encoding='utf-8'))
          if data.get('task_id') != 'APP2-004' or data.get('action') != 'ensure_iap':
              raise SystemExit('Unexpected APP2-004 command payload')
          PY
      - name: Ensure pharmacist App Store Connect products
        id: ensure
        continue-on-error: true
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set +e
          python scripts/app2_004_yakuzaishi_iap_v2_runner.py > /tmp/app2-004-iap.log 2>&1
          code=$?
          python - "$code" <<'PY'
          import json, re, sys
          from pathlib import Path
          code = int(sys.argv[1])
          raw = Path('/tmp/app2-004-iap.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/app2-004-iap.log').exists() else ''
          raw = re.sub(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----', '[REDACTED KEY]', raw, flags=re.S)
          raw = re.sub(r'Bearer\s+[A-Za-z0-9._-]+', 'Bearer [REDACTED]', raw)
          raw = re.sub(r'eyJ[A-Za-z0-9._-]{40,}', '[REDACTED JWT]', raw)
          Path('automation/app2-004-yakuzaishi-iap-diagnostic.json').write_text(
              json.dumps({
                  'task_id': 'APP2-004',
                  'step': 'iap_bootstrap_v2',
                  'exit_code': code,
                  'ok': code == 0,
                  'log_tail': raw[-12000:],
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          exit 0
      - name: Probe purchase metadata completeness
        if: always()
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_004_yakuzaishi_metadata_probe.py
      - name: Persist sanitized IAP result, diagnostic, and metadata probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/app2-004-state
          cp automation/app2-004-yakuzaishi-iap-diagnostic.json /tmp/app2-004-state/diagnostic.json
          cp automation/app2-004-yakuzaishi-metadata-probe.json /tmp/app2-004-state/metadata-probe.json
          if test -f automation/app2-004-yakuzaishi-iap-result.json; then
            cp automation/app2-004-yakuzaishi-iap-result.json /tmp/app2-004-state/result.json
          fi
          git restore automation/app2-004-yakuzaishi-iap-diagnostic.json 2>/dev/null || true
          git restore automation/app2-004-yakuzaishi-metadata-probe.json 2>/dev/null || true
          rm -f automation/app2-004-yakuzaishi-iap-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp /tmp/app2-004-state/diagnostic.json automation/app2-004-yakuzaishi-iap-diagnostic.json
          cp /tmp/app2-004-state/metadata-probe.json automation/app2-004-yakuzaishi-metadata-probe.json
          if test -f /tmp/app2-004-state/result.json; then
            cp /tmp/app2-004-state/result.json automation/app2-004-yakuzaishi-iap-result.json
          fi
          git add automation/app2-004-yakuzaishi-iap-diagnostic.json automation/app2-004-yakuzaishi-metadata-probe.json
          if test -f automation/app2-004-yakuzaishi-iap-result.json; then
            git add automation/app2-004-yakuzaishi-iap-result.json
          fi
          if git diff --cached --quiet; then
            echo "No APP2-004 diagnostic/result/probe change"
          else
            git commit -m "Persist APP2-004 pharmacist purchase metadata probe"
            git push origin HEAD:main
          fi
      - name: Assert bootstrap success
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('automation/app2-004-yakuzaishi-iap-diagnostic.json')
          if not p.exists():
              raise SystemExit('APP2-004 diagnostic missing')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not data.get('ok'):
              raise SystemExit(f"APP2-004 IAP bootstrap failed with exit_code={data.get('exit_code')}")
          PY
