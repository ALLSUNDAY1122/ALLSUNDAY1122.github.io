name: Hokenshi Sprint Native Foundation

on:
  pull_request:
    paths:
      - 'hokenshi-sprint/NativePackage/**'
      - 'hokenshi-sprint/content/**'
      - 'hokenshi-sprint/scripts/**'
      - 'hokenshi-sprint/ios/**'
      - 'hokenshi-sprint/prototype/**'
      - 'native-ios/LearningSprintCore/**'
      - 'codemagic.yaml'
      - '.github/workflows/hokenshi-sprint-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hokenshi-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            hokenshi-sprint/scripts/build_question_plan.py \
            hokenshi-sprint/scripts/validate_question_plan.py \
            hokenshi-sprint/scripts/build_canonical_questions.py \
            hokenshi-sprint/scripts/validate_canonical_questions.py \
            hokenshi-sprint/scripts/validate_current_guidance_canonical.py \
            hokenshi-sprint/scripts/promote_release_resource.py \
            hokenshi-sprint/scripts/validate_native_product_shell.py \
            hokenshi-sprint/ios/apply-xcode-capabilities.py
      - name: Build 330-question structural inventory
        run: python3 hokenshi-sprint/scripts/build_question_plan.py
      - name: Validate exam/subject/scenario allocation
        run: python3 hokenshi-sprint/scripts/validate_question_plan.py
      - name: Build canonical 330 questions
        run: python3 hokenshi-sprint/scripts/build_canonical_questions.py
      - name: Audit canonical 330 questions
        run: python3 hokenshi-sprint/scripts/validate_canonical_questions.py
      - name: Recheck current PHN guidance in canonical content
        run: python3 hokenshi-sprint/scripts/validate_current_guidance_canonical.py
      - name: Promote audited bank to release-ready resources
        run: python3 hokenshi-sprint/scripts/promote_release_resource.py
      - name: Verify release resource identity
        run: |
          cmp \
            hokenshi-sprint/content/questions.release-ready.json \
            hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/Resources/questions.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('hokenshi-sprint/content/questions.release-ready.json').read_text(encoding='utf-8'))
          assert len(rows) == 330
          assert all(r.get('audit_status') == 'release_ready' for r in rows)
          assert all(r.get('origin_type') == 'original_from_primary_source' for r in rows)
          free=[r for r in rows if not r.get('premium')]
          premium=[r for r in rows if r.get('premium')]
          assert len(free) == 30 and len(premium) == 300
          subjects={}
          for row in free:
              subjects[row['subject']]=subjects.get(row['subject'],0)+1
          assert len(subjects) == 10 and set(subjects.values()) == {3}
          print('PASS: release resource is 330/330 release_ready; free=30 balanced across 10 subjects; premium=300')
          PY
      - name: Native product shell audit
        run: python3 hokenshi-sprint/scripts/validate_native_product_shell.py
      - name: Verify delegated monetization and identifiers
        run: |
          grep -q 'jp.allsunday1122.hokenshi.premium' hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/HokenshiMonetization.swift
          grep -q 'public static let freeQuestionCount = 30' hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/HokenshiMonetization.swift
          grep -q 'public static let premiumQuestionCount = 300' hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/HokenshiMonetization.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.hokenshi' hokenshi-sprint/ios/project.yml
          grep -q 'DEVELOPMENT_TEAM: MN3D2ZM44N' hokenshi-sprint/ios/project.yml
          if grep -R --line-number -E 'App Store Connect App ID[^0-9]*[0-9]{6,}|APP_STORE_CONNECT_APP_ID[^0-9]*[0-9]{6,}' hokenshi-sprint; then
            echo 'A numeric App Store Connect App ID was added before an Apple-issued value was recorded.'
            exit 1
          fi
          echo 'PASS: delegated Bundle/IAP identifiers are canonical; numeric ASC App ID remains unset until Apple issues it.'
      - name: Safari prototype static smoke
        run: |
          node --check hokenshi-sprint/prototype/app.js
          test -s hokenshi-sprint/prototype/index.html
          test -s hokenshi-sprint/prototype/style.css
          grep -q '8問をはじめる' hokenshi-sprint/prototype/index.html
          grep -q 'わからない' hokenshi-sprint/prototype/index.html
          grep -q 'ここだけ覚える' hokenshi-sprint/prototype/index.html
      - name: Upload audited release resources
        uses: actions/upload-artifact@v4
        with:
          name: hokenshi-release-resources
          retention-days: 7
          if-no-files-found: error
          path: |
            hokenshi-sprint/content/questions.release-ready.json
            hokenshi-sprint/content/release-manifest.json
            hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/Resources/questions.json

  native-foundation:
    needs: content-plan
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited release resources
        uses: actions/download-artifact@v4
        with:
          name: hokenshi-release-resources
          path: hokenshi-sprint
      - name: Show Swift version
        run: swift --version
      - name: Shared LearningSprintCore tests
        run: |
          cd native-ios/LearningSprintCore
          swift test
      - name: Hokenshi native feature tests
        run: |
          cd hokenshi-sprint/NativePackage
          swift test
      - name: Block WebView based implementation
        run: |
          if grep -R --line-number -E 'WKWebView|import WebKit|UIViewRepresentable' hokenshi-sprint/NativePackage/Sources hokenshi-sprint/ios; then
            echo 'WebView-based implementation is forbidden for this app.'
            exit 1
          fi
      - name: Verify canonical App Store identifiers
        run: |
          grep -q 'public static let productID = "jp.allsunday1122.hokenshi.premium"' hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/HokenshiMonetization.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.hokenshi' hokenshi-sprint/ios/project.yml
          grep -q 'DEVELOPMENT_TEAM: MN3D2ZM44N' hokenshi-sprint/ios/project.yml
          echo 'PASS: Bundle ID, Team ID and IAP Product ID match the delegated canonical values.'
      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate iOS project and normalize IAP capability
        run: |
          cd hokenshi-sprint/ios
          xcodegen generate
          python3 apply-xcode-capabilities.py HokenshiSprint.xcodeproj/project.pbxproj
          grep -q 'com.apple.InAppPurchase' HokenshiSprint.xcodeproj/project.pbxproj
          ! grep -q 'SystemCapabilities = "' HokenshiSprint.xcodeproj/project.pbxproj
      - name: Build iOS app target for Simulator
        run: |
          cd hokenshi-sprint/ios
          xcodebuild build \
            -project HokenshiSprint.xcodeproj \
            -scheme HokenshiSprint \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=

  persist-release-resources:
    needs: [content-plan, native-foundation]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore audited release resources
        uses: actions/download-artifact@v4
        with:
          name: hokenshi-release-resources
          path: hokenshi-sprint
      - name: Persist generated release bank
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hokenshi-sprint/content/questions.release-ready.json \
            hokenshi-sprint/content/release-manifest.json \
            hokenshi-sprint/NativePackage/Sources/HokenshiSprintFeature/Resources/questions.json
          if git diff --cached --quiet; then
            echo 'No generated release resource changes.'
            exit 0
          fi
          git commit -m 'chore(hokenshi): persist audited release resources [skip ci]'
          git push origin HEAD:"${HEAD_BRANCH}"
