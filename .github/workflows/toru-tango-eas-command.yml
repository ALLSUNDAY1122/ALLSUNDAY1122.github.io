name: Toru Tango EAS Delivery Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: toru-tango-eas-build-8-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[EAS-CMD] Toru Tango Build 8 delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - name: Checkout release candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/on-device-ai-card-generation

      - name: Record source and verify Build 8
        run: |
          mkdir -p release-logs
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD | tee release-logs/source-sha.txt
          grep -q "buildNumber: '8'" app.config.ts
          grep -q "bundleIdentifier: 'com.allsunday1122.torutango'" app.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::EXPO_TOKEN repository secret is not configured'
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate release candidate
        run: npm run check

      - name: Verify Expo account
        run: eas whoami | tee release-logs/eas-whoami.txt

      - name: Build iOS production
        id: build
        run: |
          set -o pipefail
          eas build --platform ios --profile production --non-interactive --json 2>&1 | tee release-logs/eas-build.log

      - name: Resolve exact EAS build ID
        id: resolve
        run: |
          eas build:list --platform ios --limit 5 --json --non-interactive > release-logs/eas-build-list.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          source_sha = Path('release-logs/source-sha.txt').read_text().strip()
          data = json.loads(Path('release-logs/eas-build-list.json').read_text())
          rows = data if isinstance(data, list) else [data]
          matches = []
          for row in rows:
              git = row.get('gitCommitHash') or row.get('gitCommit') or row.get('commitHash')
              if git == source_sha or (isinstance(git, str) and source_sha.startswith(git)):
                  matches.append(row)
          if not matches:
              raise SystemExit(f'No EAS build found for source SHA {source_sha}')
          build = matches[0]
          build_id = build.get('id')
          if not build_id:
              raise SystemExit('Matched EAS build has no id')
          Path('release-logs/eas-build-id.txt').write_text(build_id)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'build_id={build_id}\n')
          print(f'EAS build id: {build_id}')
          PY

      - name: Submit exact Build 8 to App Store Connect
        id: submit
        run: |
          set -o pipefail
          eas submit --platform ios --profile production --id "${{ steps.resolve.outputs.build_id }}" --non-interactive 2>&1 | tee release-logs/eas-submit.log

      - name: Upload delivery logs
        id: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-build8-delivery-${{ github.run_id }}
          path: toru-tango-mobile/release-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Report delivery result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              'Toru Tango Build 8 delivery finished.',
              `status=${{ toJSON(job.status) }}`,
              `run_id=${context.runId}`,
              `build=${{ toJSON(steps.build.outcome) }}`,
              `resolve=${{ toJSON(steps.resolve.outcome) }}`,
              `submit=${{ toJSON(steps.submit.outcome) }}`,
              `eas_build_id=${{ toJSON(steps.resolve.outputs.build_id) }}`,
              `artifact=toru-tango-build8-delivery-${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
