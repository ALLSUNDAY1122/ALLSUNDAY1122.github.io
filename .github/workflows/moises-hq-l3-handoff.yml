name: Moises HQ Lane3 Handoff

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Shared/DomainContracts.swift'
      - 'tech-assets/moises-audio/DSP/**'
      - 'tech-assets/moises-audio/Playback/**'
      - '.github/workflows/moises-hq-l3-handoff.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Shared/DomainContracts.swift'
      - 'tech-assets/moises-audio/DSP/**'
      - 'tech-assets/moises-audio/Playback/**'
      - '.github/workflows/moises-hq-l3-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l3-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lane3-hq-handoff-native-execution:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Execute Lane 3 physical evidence handoff manifest and host validator self-tests
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          if [ "${#sources[@]}" -lt 4 ]; then
            echo "Lane 3 source discovery unexpectedly small: ${#sources[@]}" >&2
            exit 1
          fi
          printf 'Lane 3 handoff source count: %s\n' "${#sources[@]}"

          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift /tmp/L3HQHandoffManifestSelfTest.swift
          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift /tmp/L3HQHandoffHostValidatorSelfTest.swift
          sed -i '/^@main$/d' /tmp/L3HQHandoffManifestSelfTest.swift /tmp/L3HQHandoffHostValidatorSelfTest.swift

          cat >/tmp/L3HQHandoffCombinedRunner.swift <<'SWIFT'
          @main
          enum L3HQHandoffCombinedRunner {
              static func main() throws {
                  try L3HQPhysicalEvidenceHandoffManifestSelfTestMain.main()
                  try L3HQPhysicalEvidenceHandoffHostValidatorSelfTestMain.main()
              }
          }
          SWIFT

          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            /tmp/L3HQHandoffManifestSelfTest.swift \
            /tmp/L3HQHandoffHostValidatorSelfTest.swift \
            /tmp/L3HQHandoffCombinedRunner.swift \
            -o /tmp/l3-hq-handoff-native

          /tmp/l3-hq-handoff-native | tee /tmp/l3-hq-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_MANIFEST_SELF_TEST_PASS ' /tmp/l3-hq-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_HOST_VALIDATOR_SELF_TEST_PASS ' /tmp/l3-hq-handoff-native.out
