name: Moises HQ Lane3 Handoff

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoff*.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoff*.swift'
      - '.github/workflows/moises-hq-l3-handoff.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoff*.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoff*.swift'
      - '.github/workflows/moises-hq-l3-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l3-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lane3-handoff-native-execution:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Execute Lane3 handoff manifest host expected-plan commitment and persisted-receipt self-tests
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )

          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift /tmp/L3HandoffManifest.swift
          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift /tmp/L3HandoffHost.swift
          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffExpectedPlanHostValidatorSelfTest.swift /tmp/L3HandoffExpectedPlan.swift
          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffExpectedPlanCommitmentSelfTest.swift /tmp/L3HandoffExpectedPlanCommitment.swift
          cp Playback/Tests/L3_HQ_PhysicalEvidenceHandoffCommittedPlanReceiptValidatorSelfTest.swift /tmp/L3HandoffCommittedPlanReceipt.swift
          sed -i '/^@main$/d' \
            /tmp/L3HandoffManifest.swift \
            /tmp/L3HandoffHost.swift \
            /tmp/L3HandoffExpectedPlan.swift \
            /tmp/L3HandoffExpectedPlanCommitment.swift \
            /tmp/L3HandoffCommittedPlanReceipt.swift

          cat >/tmp/L3HandoffCombinedRunner.swift <<'SWIFT'
          @main
          enum L3HandoffCombinedRunner {
              static func main() throws {
                  try L3HQPhysicalEvidenceHandoffManifestSelfTestMain.main()
                  try L3HQPhysicalEvidenceHandoffHostValidatorSelfTestMain.main()
                  try L3HQPhysicalEvidenceHandoffExpectedPlanHostValidatorSelfTestMain.main()
                  try L3HQPhysicalEvidenceHandoffExpectedPlanCommitmentSelfTestMain.main()
                  try L3HQPhysicalEvidenceHandoffCommittedPlanReceiptValidatorSelfTestMain.main()
              }
          }
          SWIFT

          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            /tmp/L3HandoffManifest.swift \
            /tmp/L3HandoffHost.swift \
            /tmp/L3HandoffExpectedPlan.swift \
            /tmp/L3HandoffExpectedPlanCommitment.swift \
            /tmp/L3HandoffCommittedPlanReceipt.swift \
            /tmp/L3HandoffCombinedRunner.swift \
            -o /tmp/l3-handoff-native

          /tmp/l3-handoff-native | tee /tmp/l3-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_MANIFEST_SELF_TEST_PASS ' /tmp/l3-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_HOST_VALIDATOR_SELF_TEST_PASS ' /tmp/l3-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_EXPECTED_PLAN_HOST_VALIDATOR_SELF_TEST_PASS ' /tmp/l3-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_EXPECTED_PLAN_COMMITMENT_SELF_TEST_PASS ' /tmp/l3-handoff-native.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_COMMITTED_PLAN_RECEIPT_VALIDATOR_SELF_TEST_PASS ' /tmp/l3-handoff-native.out
