name: Temporary Build East Central Releases 1603

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-central-releases-1603.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed snapshots
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/coord/east-release-10-20260722-1603:refs/remotes/origin/coord/east-release-10-20260722-1603' \
            '+refs/heads/coord/central-release-10-20260722-1603:refs/remotes/origin/coord/central-release-10-20260722-1603'

          git checkout -B coord/east-release-10-20260722-1603 origin/coord/east-release-10-20260722-1603
          for code in 09216 09301 09342 09343 09344 09345 09386 09361 09364 09384; do
            git checkout origin/region/east -- \
              "jichitai-compare/data/municipalities/${code:0:2}/${code}.json" \
              "jichitai-compare/operations/tasks/${code}.json"
          done
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m '全国統合: 東日本10自治体の固定スナップショット'
          git push origin coord/east-release-10-20260722-1603

          git checkout -B coord/central-release-10-20260722-1603 origin/coord/central-release-10-20260722-1603
          for code in 23442 23445 23446 23447 23501 23561 23562 23563 24201 24202; do
            git checkout origin/region/central -- \
              "jichitai-compare/data/municipalities/${code:0:2}/${code}.json" \
              "jichitai-compare/operations/tasks/${code}.json"
          done
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m '全国統合: 中日本10自治体の固定スナップショット'
          git push origin coord/central-release-10-20260722-1603

          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-build-east-central-releases-1603.yml
          git commit -m '統括管理: 全国統合スナップショット一時ワークフローを削除'
          git push origin main
