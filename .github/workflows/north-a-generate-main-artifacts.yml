name: North A Generate Main Artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'jichitai-compare/data/municipalities/07/07405.json'
      - 'jichitai-compare/operations/tasks/07405.json'
      - 'jichitai-compare/operations/audits/north-a-quality-audit-2-20260725.json'
      - 'jichitai-compare/operations/control/session-checkpoints/north-a.json'
      - '.github/workflows/north-a-generate-main-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: north-a-generate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'agent/north-a-quality-audit-2-main-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate publication artifacts
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json \
                  jichitai-compare/municipality \
                  jichitai-compare/sitemap.xml \
                  jichitai-compare/operations/progress.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: regenerate North A second-audit publication artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
