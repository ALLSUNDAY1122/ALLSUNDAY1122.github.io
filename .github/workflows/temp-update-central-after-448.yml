name: Temporary Update Central After 448

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-update-central-after-448.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central state and clean workflow
        run: |
          set -euxo pipefail
          git fetch origin main region/central
          git checkout -B central-state origin/region/central
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/regions/central.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt']='2026-07-22T04:22:00+09:00'
          data['status']='working'
          data['completedSinceLastRelease']=5
          completed=data.setdefault('completedMunicipalities',[])
          if '22203' not in completed: completed.append('22203')
          data['regionalQueue']=['22205']
          audit=data.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '22203' not in checked: checked.append('22203')
          checks=audit.setdefault('checks',[])
          line='沼津市をPR #448・CI run #956で地方統合'
          if line not in checks: checks.append(line)
          data['lastAction']='全国統合PR #437・生成更新PR #439で公開234自治体へ同期後、東白川村（21507）、御嵩町（21521）、静岡市（22100）、浜松市（22130）、沼津市（22203）をregion/centralへ地方統合し、各taskをmergedへ更新'
          data['nextAction']='熱海市（22205）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/regions/central.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 中日本を沼津市まで5自治体へ更新'
          git push origin HEAD:region/central

          git checkout -B main origin/main
          rm .github/workflows/temp-update-central-after-448.yml
          git add .github/workflows/temp-update-central-after-448.yml
          git commit -m '統括管理: 中日本状態更新の一時処理を削除'
          git push origin main
