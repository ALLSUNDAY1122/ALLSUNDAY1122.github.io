name: Otsu4 Codemagic Xcode Error Inspect

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-XCODE-INSPECT]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract sanitized Xcode failure lines from Codemagic artifact bundle
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token: raise SystemExit('CM_API_TOKEN missing')
          body=json.loads(os.environ.get('ISSUE_BODY','{}'))
          build_id=str(body.get('build_id',''))
          if not re.fullmatch(r'[A-Za-z0-9_-]{8,120}',build_id): raise SystemExit('invalid build_id')
          def get(url):
              req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))
          build=get(f'https://codemagic.io/api/v3/builds/{build_id}')
          data=build.get('data') or build
          archive_names=[]
          excerpts=[]
          patterns=re.compile(r'(error:|fatal error|exportArchive|provision|signing|No profiles|requires a provisioning profile|failed|ARCHIVE FAILED|EXPORT FAILED)',re.I)
          for art in data.get('artifacts',[]) or []:
              if art.get('type')!='bundle' or not art.get('short_lived_download_url'): continue
              with urllib.request.urlopen(art['short_lived_download_url'],timeout=30) as r: raw=r.read()
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  archive_names.extend(z.namelist())
                  for name in z.namelist():
                      base=name.rsplit('/',1)[-1]
                      if not base.lower().endswith('.log'): continue
                      text=z.read(name).decode('utf-8',errors='replace')
                      hits=[]
                      for line in text.splitlines():
                          if patterns.search(line):
                              line=re.sub(r'(?i)(token|password|secret|api[_-]?key)\s*[=:]\s*\S+',r'\1=[REDACTED]',line)
                              hits.append(line[:1600])
                      if hits:
                          excerpts.append({'file':base,'lines':hits[-120:]})
          out={'build_id':build_id,'status':data.get('status'),'bundle_entries':[x.rsplit('/',1)[-1] for x in archive_names],'xcode_error_excerpts':excerpts}
          Path('otsu4-xcode-errors.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PASS: sanitized Xcode diagnostics extracted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: otsu4-xcode-errors-${{ github.run_id }}
          path: otsu4-xcode-errors.json
          retention-days: 7
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 Xcode inspect finished. status=${{ job.status }}; run_id=${context.runId}`});
