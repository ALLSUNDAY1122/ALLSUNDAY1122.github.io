name: Splat TestFlight Failure Diagnostic

on:
  push:
    branches:
      - 'testflight/splat-native-ios-20260820'
    paths:
      - '.github/workflows/splat-testflight-failure-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Download failed build artifact and extract safe diagnostics
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, urllib.error, urllib.request, zipfile
          from pathlib import Path

          build_id='6a87f5fa38e916af4c805bea'
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token:
              raise SystemExit('missing CM_API_TOKEN')

          def get_json(url):
              req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          payload=get_json(f'https://codemagic.io/api/v3/builds/{build_id}')
          build=payload.get('data') if isinstance(payload,dict) and isinstance(payload.get('data'),dict) else payload
          artifacts=build.get('artifacts') or []
          bundle=next((a for a in artifacts if isinstance(a,dict) and a.get('type')=='bundle' and a.get('short_lived_download_url')),None)
          if not bundle:
              raise SystemExit('diagnostic artifact bundle not found')
          url=bundle['short_lived_download_url']
          req=urllib.request.Request(url,headers={'x-auth-token':token})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read()

          interesting=re.compile(r'(error:|fatal error|archive failed|build failed|codesign|code ?sign|provision|signing|no profiles|requires a provisioning profile|failed)',re.I)
          secretish=re.compile(r'(token|password|private[_ -]?key|issuer[_ -]?id|api[_ -]?key)',re.I)
          files=[]
          hits=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  info=z.getinfo(name)
                  files.append({'name':name,'size':info.file_size})
                  if info.file_size > 5_000_000 or info.is_dir():
                      continue
                  try:
                      text=z.read(name).decode('utf-8','replace')
                  except Exception:
                      continue
                  for line in text.splitlines():
                      if interesting.search(line):
                          clean=line.strip()
                          if secretish.search(clean):
                              continue
                          clean=re.sub(r'/Users/[^/]+','/Users/[USER]',clean)
                          clean=re.sub(r'/tmp/[^ ]+','/tmp/[PATH]',clean)
                          hits.append({'file':name,'line':clean[:1200]})
                          if len(hits)>=200:
                              break
                  if len(hits)>=200:
                      break

          result={
              'request_id':'splat-testflight-failure-diagnostic-20260821',
              'ok':True,
              'build_id':build_id,
              'build_status':build.get('status'),
              'artifact_files':files[:100],
              'diagnostic_lines':hits,
          }
          Path('/tmp/splat-failure-diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'PASS: extracted {len(hits)} diagnostic lines')
          PY

      - name: Persist sanitized diagnostic
        run: |
          set -euo pipefail
          BRANCH='testflight/splat-native-ios-20260820'
          RESULT_PATH='automation/codemagic-results/splat-testflight-failure-diagnostic-20260821.json'
          cp /tmp/splat-failure-diagnostic.json /tmp/splat-failure-diagnostic.saved.json
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            mkdir -p "$(dirname "$RESULT_PATH")"
            cp /tmp/splat-failure-diagnostic.saved.json "$RESULT_PATH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$RESULT_PATH"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'release: persist Splat TestFlight failure diagnostic'
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
          exit 1
