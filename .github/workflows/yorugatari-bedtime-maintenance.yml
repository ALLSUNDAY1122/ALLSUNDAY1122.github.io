name: Yorugatari bedtime landing maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - yorugatari/bedtime-horror.html
      - yorugatari/5min-horror.html
      - yorugatari/index.html
      - yorugatari/archive.html
      - yorugatari/categories/**
      - yorugatari/sitemap.xml
      - yorugatari/tools/generate-discovery-pages.mjs
      - yorugatari/tools/generate-sitemap.mjs
      - yorugatari/tools/ensure-bedtime-links.mjs
      - yorugatari/tools/seo-audit.mjs
      - yorugatari/tools/live-release-audit.mjs
      - .github/workflows/yorugatari-bedtime-maintenance.yml

concurrency:
  group: yorugatari-bedtime-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore curated landing links
        shell: bash
        run: |
          node --check yorugatari/tools/ensure-bedtime-links.mjs
          node --check yorugatari/tools/generate-sitemap.mjs
          node --check yorugatari/tools/seo-audit.mjs
          node --check yorugatari/tools/live-release-audit.mjs
          node yorugatari/tools/ensure-bedtime-links.mjs
          node yorugatari/tools/generate-sitemap.mjs
          node yorugatari/tools/seo-audit.mjs

      - name: Commit maintained discovery files
        shell: bash
        run: |
          if git diff --quiet -- yorugatari/index.html yorugatari/5min-horror.html yorugatari/archive.html yorugatari/categories yorugatari/sitemap.xml; then
            echo "Bedtime landing discovery files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yorugatari/index.html yorugatari/5min-horror.html yorugatari/archive.html yorugatari/categories yorugatari/sitemap.xml
          git commit -m "Maintain Yorugatari bedtime discovery links [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep 3
          done
          exit 1

      - name: Verify published bedtime landing
        run: node yorugatari/tools/live-release-audit.mjs

      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-bedtime-live-report
          path: yorugatari-live-report.json
          if-no-files-found: error
          retention-days: 14
