name: Temporary Sync Release Queue 284 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-284.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue from regional branches
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          queue_path = Path('jichitai-compare/operations/control/release-queue.json')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in queue['entries']}

          def git_show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)

          def municipality_paths(ref):
              out = subprocess.check_output([
                  'git','ls-tree','-r','--name-only',ref,
                  'jichitai-compare/data/municipalities'
              ], text=True)
              return [p for p in out.splitlines() if re.search(r'/\d{5}\.json$', p)]

          def allowed(region, prefecture_code):
              p = int(prefecture_code)
              return {
                  'north': 1 <= p <= 7,
                  'east': 8 <= p <= 15 or p in (19, 20),
                  'central': 16 <= p <= 18 or 21 <= p <= 29,
                  'west': 31 <= p <= 47,
              }[region]

          pending_fields = {
              'north': 'completedMunicipalitiesSinceLastNationalMerge',
              'east': 'completedMunicipalitiesSinceLastNationalMerge',
              'central': 'completedSinceLastRelease',
              'west': 'completedMunicipalitiesSinceLastNationalMerge',
          }

          for region in ('north','east','central','west'):
              ref = f'origin/region/{region}'
              municipalities = []
              for path in municipality_paths(ref):
                  item = json.loads(git_show(ref, path))
                  if allowed(region, item['prefectureCode']):
                      municipalities.append({'code': item['code'], 'name': item['name']})
              municipalities.sort(key=lambda item: item['code'])
              state = json.loads(git_show(ref, f'jichitai-compare/operations/control/regions/{region}.json'))
              pending = int(state.get(pending_fields[region], 0))
              entry = entries[region]
              entry['municipalities'] = municipalities
              entry['count'] = len(municipalities)
              entry['pendingSinceLastRelease'] = pending
              entry['releaseStatus'] = 'release_ready' if pending >= 10 else 'pending_threshold'
              entry['reason'] = f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              entry['mainIntegrationPr'] = state.get('lastNationalIntegrationPr')
              entry['generatedPullRequest'] = 490

          regional_total = sum(e['count'] for e in queue['entries'])
          ready = [e['region'] for e in queue['entries'] if e['pendingSinceLastRelease'] >= 10]
          queue['updatedAt'] = '2026-07-22T06:42:00+09:00'
          queue['status'] = 'active'
          queue['summary'] = {
              'regionalMergedMunicipalities': regional_total,
              'latestGeneratedMunicipalityCount': 264,
              'latestGeneratedPullRequest': 490,
              'latestPublicCountPullRequest': 490,
              'releaseReadyRegions': ready,
              'nextAction': '北日本8、中日本8、西日本5、東日本0。北日本と中日本は各2自治体で全国統合基準10に到達。'
          }
          print('regional counts:', {e['region']: e['count'] for e in queue['entries']})
          print('regional total:', regional_total)
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          if git diff --cached --quiet; then
            echo 'release queue already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合284自治体・公開264自治体へ同期'
          git push origin main
