name: Temporary Sync Release Queue 284

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-284.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue from regional branches
        run: |
          set -euxo pipefail
          git fetch origin region/north region/east region/central region/west
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root = Path('jichitai-compare')
          queue_path = root / 'operations/control/release-queue.json'
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in queue['entries']}
          state_path = 'jichitai-compare/operations/control/regions/{region}.json'

          def show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)

          def paths(ref):
              output = subprocess.check_output([
                  'git','ls-tree','-r','--name-only',ref,
                  'jichitai-compare/data/municipalities'
              ], text=True)
              return [line for line in output.splitlines() if re.search(r'/\d{5}\.json$', line)]

          def allowed(region, pref):
              p = int(pref)
              if region == 'north': return 1 <= p <= 7
              if region == 'east': return 8 <= p <= 15 or p in (19,20)
              if region == 'central': return 16 <= p <= 18 or 21 <= p <= 29
              if region == 'west': return 31 <= p <= 47
              return False

          pending_fields = {
              'north': 'completedMunicipalitiesSinceLastNationalMerge',
              'east': 'completedMunicipalitiesSinceLastNationalMerge',
              'central': 'completedSinceLastRelease',
              'west': 'completedMunicipalitiesSinceLastNationalMerge',
          }

          for region in ('north','east','central','west'):
              ref = f'origin/region/{region}'
              municipalities = []
              for path in paths(ref):
                  data = json.loads(show(ref, path))
                  if allowed(region, data['prefectureCode']):
                      municipalities.append({'code': data['code'], 'name': data['name']})
              municipalities.sort(key=lambda item: item['code'])
              state = json.loads(show(ref, state_path.format(region=region)))
              pending = int(state.get(pending_fields[region], 0))
              entry = entries[region]
              entry['municipalities'] = municipalities
              entry['count'] = len(municipalities)
              entry['pendingSinceLastRelease'] = pending
              entry['releaseStatus'] = 'release_ready' if pending >= 10 else 'pending_threshold'
              entry['reason'] = f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              entry['mainIntegrationPr'] = state.get('lastNationalIntegrationPr')
              entry['generatedPullRequest'] = 490

          queue['updatedAt'] = '2026-07-22T06:39:00+09:00'
          queue['status'] = 'active'
          regional_total = sum(entry['count'] for entry in queue['entries'])
          ready = [entry['region'] for entry in queue['entries'] if entry['pendingSinceLastRelease'] >= 10]
          queue['summary'] = {
              'regionalMergedMunicipalities': regional_total,
              'latestGeneratedMunicipalityCount': 264,
              'latestGeneratedPullRequest': 490,
              'latestPublicCountPullRequest': 490,
              'releaseReadyRegions': ready,
              'nextAction': '北日本8、中日本8、西日本5、東日本0。北日本と中日本は各2自治体で全国統合基準10に到達。'
          }
          if regional_total != 284:
              raise SystemExit(f'unexpected regional total: {regional_total}')
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          git diff --cached --exit-code && exit 0 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合284自治体・公開264自治体へ同期'
          git push origin main
