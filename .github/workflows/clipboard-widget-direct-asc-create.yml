name: Clipboard Widget Direct ASC Create

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-direct-asc-create.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attempt direct App Store Connect app creation
        id: create
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_CREATE_OUTPUT: /tmp/clipboard-asc-create-result.json
        run: python3 scripts/clipboard_widget_direct_asc_create.py

      - name: Persist direct-create evidence
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/clipboard-asc-create-result.json || exit 0
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          mkdir -p automation/clipboard-widget/evidence
          cp /tmp/clipboard-asc-create-result.json automation/clipboard-widget/evidence/asc-direct-create-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/asc-direct-create-result.json
          git commit -m 'chore: record clipboard direct ASC create result' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Trigger TestFlight after successful app creation
        id: tf
        if: steps.create.outcome == 'success'
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"request_id":"clipboard-widget-phase0-testflight-20260831-r14","action":"build","workflow_id":"clipboard-widget-phase0","branch":"feature/clipboard-widget-poc","wait":true,"timeout_seconds":4200,"app_id":"6a769d81a1add9d06020b524"}' > /tmp/cm-tf-command.json
          python3 scripts/codemagic_build_gateway.py --command /tmp/cm-tf-command.json --output /tmp/cm-tf-result.json

      - name: Persist TestFlight result
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/cm-tf-result.json ]]; then exit 0; fi
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          python3 scripts/clipboard_widget_persist_cm_result.py --input /tmp/cm-tf-result.json --output automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/codemagic-phase0-testflight.json
          git commit -m 'chore: record clipboard TestFlight retry r14' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc

      - name: Require app creation
        if: steps.create.outcome != 'success'
        run: exit 1

      - name: Require TestFlight upload
        if: steps.create.outcome == 'success' && steps.tf.outcome != 'success'
        run: exit 1
