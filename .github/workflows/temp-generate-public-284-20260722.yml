name: Temporary Generate Public 284 20260722

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-284-20260722.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-284-20260722-0652
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and push public artifacts
        run: |
          set -euxo pipefail
          cd jichitai-compare
          npm run generate
          npm run progress
          cd ..
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('jichitai-compare/index.html')
          text = path.read_text(encoding='utf-8')
          text, hero = re.subn(r'<span>\d+自治体・9制度</span>', '<span>284自治体・9制度</span>', text, count=1)
          text, status = re.subn(r'登録状況：\d+自治体', '登録状況：284自治体', text, count=1)
          if hero != 1 or status != 1:
              raise SystemExit(f'count targets not found: hero={hero}, status={status}')
          path.write_text(text, encoding='utf-8')
          PY
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          actual=$(git diff --name-only --cached | sort)
          expected=$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/progress.json | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データと表示件数を284自治体へ同期'
          git push origin coord/generated-284-20260722-0652
