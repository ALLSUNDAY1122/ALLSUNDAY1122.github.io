name: Temporary Sync Release Queue 162

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-release-queue-162.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release queue and remove workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node - <<'NODE'
          import fs from 'node:fs';
          const path = 'jichitai-compare/operations/control/release-queue.json';
          const queue = JSON.parse(fs.readFileSync(path, 'utf8'));
          const addUnique = (entry, additions) => {
            const seen = new Set(entry.municipalities.map(x => x.code));
            for (const item of additions) {
              if (!seen.has(item.code)) {
                entry.municipalities.push(item);
                seen.add(item.code);
              }
            }
            entry.count = entry.municipalities.length;
          };
          const north = queue.entries.find(x => x.region === 'north');
          const east = queue.entries.find(x => x.region === 'east');
          const central = queue.entries.find(x => x.region === 'central');
          const west = queue.entries.find(x => x.region === 'west');
          if (!north || !east || !central || !west) throw new Error('region entry not found');

          addUnique(north, [
            {code:'01363',name:'厚沢部町'},
            {code:'01364',name:'乙部町'}
          ]);
          north.pendingSinceLastRelease = 8;
          north.releaseStatus = 'pending_threshold';
          north.reason = '北日本の41自治体をPR #299までにmainへ全国統合し、生成・公開をPR #300で114自治体へ更新。その後、鹿部町・森町・八雲町・長万部町・江差町・上ノ国町・厚沢部町・乙部町を地方統合';

          addUnique(central, [{code:'21207',name:'美濃市'}]);
          central.pendingSinceLastRelease = 8;
          central.releaseStatus = 'pending_threshold';
          central.reason = '中日本の51自治体をPR #315までにmainへ全国統合し、生成・公開をPR #317で124自治体へ更新。その後、若狭町・岐阜市・大垣市・高山市・多治見市・関市・中津川市・美濃市を地方統合';
          central.generatedPullRequest = 317;

          for (const entry of queue.entries) entry.count = entry.municipalities.length;
          queue.updatedAt = '2026-07-21T23:14:00+09:00';
          queue.summary.regionalMergedMunicipalities = queue.entries.reduce((sum, x) => sum + x.count, 0);
          queue.summary.waitingRegionalMergeMunicipalities = 0;
          queue.summary.releaseReadyRegions = [];
          queue.summary.auditBlockedRegions = [];
          queue.nextAction = '北日本と中日本が前回全国統合後8自治体で並走。東日本2、西日本1。北日本または中日本が10自治体へ到達し次第、該当地域を全国統合する。';
          queue.humanDecisionRequired = false;

          if (north.count !== 49) throw new Error(`north count mismatch: ${north.count}`);
          if (east.count !== 22) throw new Error(`east count mismatch: ${east.count}`);
          if (central.count !== 59) throw new Error(`central count mismatch: ${central.count}`);
          if (west.count !== 32) throw new Error(`west count mismatch: ${west.count}`);
          if (queue.summary.regionalMergedMunicipalities !== 162) throw new Error(`total mismatch: ${queue.summary.regionalMergedMunicipalities}`);
          fs.writeFileSync(path, JSON.stringify(queue));
          NODE
          git rm .github/workflows/temp-sync-release-queue-162.yml
          git add jichitai-compare/operations/control/release-queue.json
          git commit -m "統括管理: 地方統合162自治体・公開144自治体へ同期"
          git push origin main
