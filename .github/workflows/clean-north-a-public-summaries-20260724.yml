name: Clean North A Public Summaries 20260724

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  clean-public-summaries:
    if: github.head_ref == 'quality/north-a-public-summary-cleanup-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/north-a-public-summary-cleanup-20260724
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit and clean North A public summaries
        working-directory: jichitai-compare
        env:
          TARGET_PREFECTURES: '02,03,07'
          EXPECTED_MUNICIPALITY_COUNT: '132'
          APPLY_FIXES: 'true'
          AUDIT_AT: '2026-07-24T23:35:00+09:00'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUDIT_FILE: 'operations/control/north-a-public-summary-audit-20260724.json'
          CHECKPOINT_FILE: 'operations/control/session-checkpoints/north-a.json'
        run: node scripts/audit-public-summaries.mjs

      - name: Regenerate and validate published data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node scripts/validate-municipality-pages.mjs
          node --check scripts/audit-public-summaries.mjs

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-north-a-public-summaries-20260724.yml
          git add \
            jichitai-compare/scripts/audit-public-summaries.mjs \
            jichitai-compare/data/municipalities/02 \
            jichitai-compare/data/municipalities/03 \
            jichitai-compare/data/municipalities/07 \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/data/generated/municipality-pages.json \
            jichitai-compare/municipality \
            jichitai-compare/sitemap.xml \
            jichitai-compare/operations/progress.json \
            jichitai-compare/operations/control/north-a-public-summary-audit-20260724.json \
            jichitai-compare/operations/control/session-checkpoints/north-a.json
          if git diff --cached --quiet; then
            echo "Expected public-summary cleanup changes were not produced"
            exit 1
          fi
          git commit -m "quality: remove internal wording from North A public summaries"
          git push origin HEAD:quality/north-a-public-summary-cleanup-20260724
