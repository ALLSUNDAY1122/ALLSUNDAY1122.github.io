name: TestFlight Branch Route Audit

on:
  push:
    branches: [main]
    paths:
      - automation/testflight-branch-route-audit-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan all remote branches for iOS build routes
        run: |
          git fetch --all --prune
          python3 - <<'PY'
          import json, subprocess, yaml
          from pathlib import Path

          cmd=json.loads(Path('automation/testflight-branch-route-audit-command.json').read_text(encoding='utf-8'))
          rid=str(cmd['request_id']); targets=cmd.get('targets') or []
          raw=subprocess.check_output(['git','for-each-ref','--format=%(refname:short)','refs/remotes/origin'],text=True)
          branches=[b[len('origin/'):] for b in raw.splitlines() if b.startswith('origin/') and b!='origin/HEAD']
          rows={str(t['bundle_id']):{'name':t.get('name'),'bundle_id':str(t['bundle_id']),'app_id':str(t.get('app_id') or ''),'codemagic_routes':[],'github_workflow_hits':[],'source_hits':[]} for t in targets}

          def run(args):
            return subprocess.run(args,text=True,capture_output=True)

          for br in branches:
            ref=f'origin/{br}'
            # Parse codemagic.yaml once per branch, then match every target.
            p=run(['git','show',f'{ref}:codemagic.yaml'])
            if p.returncode==0:
              try: cfg=yaml.safe_load(p.stdout) or {}
              except Exception: cfg={}
              for wid,w in (cfg.get('workflows') or {}).items():
                w=w or {}; env=w.get('environment') or {}; sign=env.get('ios_signing') or {}; vars_=env.get('vars') or {}
                wb=str(sign.get('bundle_identifier') or vars_.get('BUNDLE_ID') or '')
                text=yaml.safe_dump(w,allow_unicode=True)
                asc=((w.get('publishing') or {}).get('app_store_connect') or {})
                for bundle,row in rows.items():
                  appid=row['app_id']
                  if wb==bundle or bundle in text or (appid and appid in text):
                    row['codemagic_routes'].append({'branch':br,'workflow_id':wid,'workflow_name':w.get('name'),'bundle_id':wb or None,'submit_to_testflight':asc.get('submit_to_testflight'),'submit_to_app_store':asc.get('submit_to_app_store'),'has_asc_integration':bool((w.get('integrations') or {}).get('app_store_connect'))})

            # git grep jumps directly to matching workflow/source files instead of reading every workflow.
            for bundle,row in rows.items():
              appid=row['app_id']
              patterns=[bundle] + ([appid] if appid else [])
              wf_paths=set(); src_paths=set()
              for pattern in patterns:
                q=run(['git','grep','-l','-F',pattern,ref,'--','.github/workflows/*.yml','.github/workflows/*.yaml'])
                if q.returncode==0:
                  for ln in q.stdout.splitlines():
                    wf_paths.add(ln.split(':',1)[-1])
                g=run(['git','grep','-l','-F',pattern,ref,'--','*.pbxproj','*.yml','*.yaml','*.json','*.plist','*.swift','*.gradle','app.json','app.config.*'])
                if g.returncode==0:
                  for ln in g.stdout.splitlines()[:40]:
                    src_paths.add(ln.split(':',1)[-1])
              for path in sorted(wf_paths):
                z=run(['git','show',f'{ref}:{path}'])
                if z.returncode!=0: continue
                sig=[]
                for line in z.stdout.splitlines():
                  s=line.strip(); low=s.lower()
                  if bundle in s or (appid and appid in s) or any(k in low for k in ['codemagic','submit_to_testflight','app-store-connect','altool','transporter','eas build','eas submit','workflow_id','build_number']):
                    sig.append(s[:400])
                row['github_workflow_hits'].append({'branch':br,'path':path,'signals':sig[:30]})
              if src_paths:
                row['source_hits'].append({'branch':br,'paths':sorted(src_paths)[:30]})

          out={'request_id':rid,'branch_count':len(branches),'targets':list(rows.values())}
          p=Path('automation/asc-results')/f'{rid}.json'; p.parent.mkdir(parents=True,exist_ok=True)
          payload=json.dumps(out,ensure_ascii=False,indent=2)+'\n'; p.write_text(payload,encoding='utf-8')
          Path('/tmp/tf-branch-route-result.json').write_text(payload,encoding='utf-8')
          Path('/tmp/tf-branch-route-path.txt').write_text(str(p),encoding='utf-8')
          print(json.dumps({'branch_count':len(branches),'targets':[{'name':r['name'],'codemagic':len(r['codemagic_routes']),'actions':len(r['github_workflow_hits']),'sources':len(r['source_hits'])} for r in rows.values()]},ensure_ascii=False))
          PY
      - name: Persist branch route audit
        if: always()
        run: |
          test -f /tmp/tf-branch-route-path.txt || exit 1
          P="$(cat /tmp/tf-branch-route-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P"; git commit -m "Persist TestFlight branch route audit" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          cp "$P" /tmp/tf-branch-route-copy.json
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/tf-branch-route-copy.json "$P"
          git add "$P"; git commit -m "Persist TestFlight branch route audit" || exit 0; git push origin HEAD:main
