name: Temporary Central A Housing Batch 25 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch25-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch25-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: node jichitai-compare/scripts/temp-central-a-housing-batch25-public.mjs
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第25群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
