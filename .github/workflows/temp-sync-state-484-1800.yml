name: Temporary sync state 484 1800

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-state-484-1800.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build state snapshot branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/region/north:refs/remotes/origin/region/north +refs/heads/region/east:refs/remotes/origin/region/east +refs/heads/region/central:refs/remotes/origin/region/central +refs/heads/region/west:refs/remotes/origin/region/west
          git checkout -B coord/state-after-public-484-20260722-1800 origin/main
          echo '' | base64 -d > /tmp/sync-state.py
          python3 /tmp/sync-state.py
          read total north east central west < /tmp/state-summary
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/audit-log.jsonl
          git commit -m "統括管理: 公開484・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force origin HEAD:coord/state-after-public-484-20260722-1800
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-sync-state-484-1800.yml ]; then
            git rm .github/workflows/temp-sync-state-484-1800.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 公開484状態同期一時ワークフローを削除'
            git push origin HEAD:main
          fi
