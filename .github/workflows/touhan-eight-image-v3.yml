name: Touhan Eight Original Crop Release With Mobile QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-eight-image-v3.yml'
      - 'touroku-hanbaisha-sprint/official-kansai/promote_eight_image_v3.py'
permissions:
  contents: write
concurrency:
  group: touhan-eight-image-v3
  cancel-in-progress: false
jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0' 'pillow==11.3.0'
      - name: Start local app server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory touroku-hanbaisha-sprint >/tmp/touhan-eight-server.log 2>&1 &
          sleep 2
      - name: QA four ingredient-table and four manual exception source images and promote on PASS
        run: python touroku-hanbaisha-sprint/official-kansai/promote_eight_image_v3.py
      - name: Verify state and promotion invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          state=json.loads(Path('touroku-hanbaisha-ios/release-status.json').read_text())
          qa=json.loads((b/'EIGHT_IMAGE_RELEASE_QA_20261124.json').read_text())
          assert bank['count']==476==len(bank['questions'])==len(set(bank['approvedIds']))
          assert len(qa['records'])==8 and qa['testCases']==16 and qa['status']=='PASS'
          assert all(x['status']=='PASS' for x in qa['chromium'])
          assert state['question_bank']['production_official_bank_count']==476
          assert state['unapproved_id_reconciliation_after_image_v3']['unapproved']==124
          assert state['release_gate']=='BLOCKED' and not state['app_review_submitted']
          assert 'KSAI-2023-090' not in bank['approvedIds']
          print('PASS 476 approved, 124 remain, no App Review send')
          PY
      - name: Save eight-image promotion and both release state sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json
          git add -f touroku-hanbaisha-sprint/official-kansai/EIGHT_IMAGE_RELEASE_QA_20261124.json
          git add -f touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2022-005-p4-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2022-104-p28-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2024-028-p21-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2024-040-p27-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2025-044-p34-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2025-052-p39-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2026-028-p25-1.png touroku-hanbaisha-sprint/official-kansai/layout-crops/KSAI-2026-036-p29-1.png
          git add -f touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          git commit -m 'audit(touhan): promote eight SHA-pinned official image questions after Chrome QA'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
