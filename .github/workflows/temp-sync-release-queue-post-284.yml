name: Temporary Sync Release Queue Post 284

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-post-284.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          queue_path = Path('jichitai-compare/operations/control/release-queue.json')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          entries = {e['region']: e for e in queue['entries']}
          def show(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
          def data_paths(ref):
              out = subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'], text=True)
              return [p for p in out.splitlines() if re.search(r'/\d{5}\.json$', p)]
          def allowed(region, pref):
              p=int(pref)
              return {'north':1<=p<=7,'east':8<=p<=15 or p in (19,20),'central':16<=p<=18 or 21<=p<=29,'west':31<=p<=47}[region]
          pending_field={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          for region in ('north','east','central','west'):
              ref=f'origin/region/{region}'
              items=[]
              for p in data_paths(ref):
                  d=json.loads(show(ref,p))
                  if allowed(region,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code'])
              s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending=int(s.get(pending_field[region],0))
              e=entries[region]
              e['municipalities']=items
              e['count']=len(items)
              e['pendingSinceLastRelease']=pending
              e['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              e['reason']=f'最新地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              e['mainIntegrationPr']=s.get('lastNationalIntegrationPr')
              e['generatedPullRequest']=500
          total=sum(e['count'] for e in queue['entries'])
          ready=[e['region'] for e in queue['entries'] if e['pendingSinceLastRelease']>=10]
          pending={e['region']:e['pendingSinceLastRelease'] for e in queue['entries']}
          queue['updatedAt']='2026-07-22T07:08:00+09:00'
          queue['status']='active'
          queue['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':284,'latestGeneratedPullRequest':500,'latestPublicCountPullRequest':500,'releaseReadyRegions':ready,'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。10自治体到達地域なし。"}
          print(total,pending)
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          git add jichitai-compare/operations/control/release-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 公開284自治体後の全国キューを同期'
          git push origin main
