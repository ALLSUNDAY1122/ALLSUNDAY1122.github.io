name: Temporary West B Final Region Record Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-final-region-record-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ops/run-west-b-final-region-record-sync-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/west-b-final-record-region-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy final records from main
        shell: bash
        run: |
          git fetch origin main
          files=(
            jichitai-compare/operations/audits/west-b-sick-child-public-verification-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/main:$file" > "$file"
          done
      - name: Validate regional data
        working-directory: jichitai-compare
        run: npm run validate:generated
      - name: Commit final regional records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/west-b-sick-child-public-verification-20260725.json jichitai-compare/operations/control/session-checkpoints/west-b.json
          if git diff --cached --quiet; then
            echo "No final regional record changes"
            exit 0
          fi
          git commit -m "sync: 西日本B公開確認記録をregion/westへ同期"
          git push origin HEAD:sync/west-b-final-record-region-20260725
