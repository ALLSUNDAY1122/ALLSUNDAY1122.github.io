name: Temporary Generate 484

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-484.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public data
        run: |
          set -euxo pipefail
          TARGET='coord/generated-484-20260722-1753'
          git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
          git switch -C "$TARGET" "origin/$TARGET"
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '474自治体' not in s:
              raise SystemExit('474自治体 display not found')
          s=s.replace('474自治体','484自治体')
          p.write_text(s,encoding='utf-8')
          data=json.loads(Path('data/generated/municipalities.json').read_text(encoding='utf-8'))
          count=len(data if isinstance(data,list) else data.get('municipalities',[]))
          if count!=484: raise SystemExit(f'generated count {count}')
          progress=json.loads(Path('operations/progress.json').read_text(encoding='utf-8'))
          if progress.get('registeredMunicipalities')!=484: raise SystemExit(progress.get('registeredMunicipalities'))
          PY
          npm run validate:generated
          cd ..
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データと表示件数を484自治体へ同期'
          git push origin "$TARGET"
          git switch main
          git pull --ff-only origin main
          rm -f .github/workflows/temp-generate-484.yml
          git add .github/workflows/temp-generate-484.yml
          git commit -m '統括管理: 公開484生成一時ワークフローを削除'
          git push origin main
