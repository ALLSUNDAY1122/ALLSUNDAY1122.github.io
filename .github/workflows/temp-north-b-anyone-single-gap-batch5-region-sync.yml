name: Temporary North B Anyone Single Gap Batch 5 Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-region-sync.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-region-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-records:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout region sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy confirmed batch 5 records from main
        shell: bash
        run: |
          git fetch origin main
          files=(
            jichitai-compare/data/municipalities/06/06204.json
            jichitai-compare/data/municipalities/06/06207.json
            jichitai-compare/data/municipalities/06/06208.json
            jichitai-compare/data/municipalities/06/06209.json
            jichitai-compare/data/municipalities/06/06210.json
            jichitai-compare/data/municipalities/06/06211.json
            jichitai-compare/data/municipalities/06/06301.json
            jichitai-compare/operations/tasks/06204.json
            jichitai-compare/operations/tasks/06207.json
            jichitai-compare/operations/tasks/06208.json
            jichitai-compare/operations/tasks/06209.json
            jichitai-compare/operations/tasks/06210.json
            jichitai-compare/operations/tasks/06211.json
            jichitai-compare/operations/tasks/06301.json
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/main:$file" > "$file"
          done

      - name: Commit region records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/06 \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json
          if git diff --cached --quiet; then
            echo 'No region records to sync.'
            exit 1
          fi
          git commit -m 'sync: 北日本B誰でも通園単一条件第5群をregion/northへ反映 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
