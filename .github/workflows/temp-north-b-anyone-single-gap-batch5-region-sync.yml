name: Temporary North B Anyone Single Gap Batch 5 Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-region-sync.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-region-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout regional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import confirmed files from main
        shell: bash
        run: |
          git checkout d7dde1d363bfb04a77166b45b605b3dce9722599 -- \
            jichitai-compare/data/municipalities/06/06204.json \
            jichitai-compare/data/municipalities/06/06207.json \
            jichitai-compare/data/municipalities/06/06208.json \
            jichitai-compare/data/municipalities/06/06209.json \
            jichitai-compare/data/municipalities/06/06210.json \
            jichitai-compare/data/municipalities/06/06211.json \
            jichitai-compare/data/municipalities/06/06301.json \
            jichitai-compare/operations/tasks/06204.json \
            jichitai-compare/operations/tasks/06207.json \
            jichitai-compare/operations/tasks/06208.json \
            jichitai-compare/operations/tasks/06209.json \
            jichitai-compare/operations/tasks/06210.json \
            jichitai-compare/operations/tasks/06211.json \
            jichitai-compare/operations/tasks/06301.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          node <<'NODE'
          const fs = require('fs');
          const file = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.updatedAt = '2026-07-25T17:06:00+09:00';
          data.workingBranch = 'sync/north-b-anyone-single-gap-batch5-records-1704';
          data.pullRequestNumber = null;
          data.ciStatus = 'pending';
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Validate regional data
        shell: bash
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit synchronization
        shell: bash
        run: |
          rm -f .github/workflows/temp-north-b-anyone-single-gap-batch5-region-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch5-region-sync.yml \
            jichitai-compare/data/municipalities/06/06204.json \
            jichitai-compare/data/municipalities/06/06207.json \
            jichitai-compare/data/municipalities/06/06208.json \
            jichitai-compare/data/municipalities/06/06209.json \
            jichitai-compare/data/municipalities/06/06210.json \
            jichitai-compare/data/municipalities/06/06211.json \
            jichitai-compare/data/municipalities/06/06301.json \
            jichitai-compare/operations/tasks/06204.json \
            jichitai-compare/operations/tasks/06207.json \
            jichitai-compare/operations/tasks/06208.json \
            jichitai-compare/operations/tasks/06209.json \
            jichitai-compare/operations/tasks/06210.json \
            jichitai-compare/operations/tasks/06211.json \
            jichitai-compare/operations/tasks/06301.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          git commit -m 'sync: 北日本B誰でも通園単一条件第5群をregion/northへ反映 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
