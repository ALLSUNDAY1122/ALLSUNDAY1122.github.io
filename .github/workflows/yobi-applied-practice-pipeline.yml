name: Yobi Applied Practice Pipeline

on:
  pull_request:
    paths:
      - 'learning-sprint/yobi-tantou/content-loop/questions.practice.release.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/questions.applied.candidates.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/applied-source-locks.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/applied-answer-audit.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/audit_candidate_sources.py'
      - 'learning-sprint/yobi-tantou/content-loop/audit_candidate_answers.py'
      - 'learning-sprint/yobi-tantou/content-loop/stage_practice_release_candidates.py'
      - 'learning-sprint/yobi-tantou/content-loop/audit_practice_release_quality.py'
      - 'learning-sprint/yobi-tantou/content-loop/promote_practice_release.py'
      - 'learning-sprint/yobi-tantou/content-loop/combine_practice_release.py'
      - 'learning-sprint/yobi-tantou/content-loop/build_native_release.py'
      - '.github/workflows/yobi-applied-practice-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yobi-applied-practice-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-applied-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Applied candidate preflight
        run: >-
          python learning-sprint/yobi-tantou/content-loop/validate_candidates.py
          learning-sprint/yobi-tantou/content-loop/questions.applied.candidates.v1.json
      - name: Applied exact-date statutory source audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_candidate_sources.py
          --bank learning-sprint/yobi-tantou/content-loop/questions.applied.candidates.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/applied-source-locks.v1.json
      - name: Applied answer and explanation audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_candidate_answers.py
          --bank learning-sprint/yobi-tantou/content-loop/questions.applied.candidates.v1.json
          --audit learning-sprint/yobi-tantou/content-loop/applied-answer-audit.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/applied-source-locks.v1.json
      - name: Build non-release applied staging
        run: >-
          python learning-sprint/yobi-tantou/content-loop/stage_practice_release_candidates.py
          --candidates learning-sprint/yobi-tantou/content-loop/questions.applied.candidates.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/applied-source-locks.v1.json
          --answers learning-sprint/yobi-tantou/content-loop/applied-answer-audit.v1.json
          --output learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json
      - name: Applied editorial quality release audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_practice_release_quality.py
          --input learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json
          --report learning-sprint/yobi-tantou/content-loop/practice-applied-quality-audit.v1.json
          --require-pass
      - name: Promote applied practice only after clean PASS
        run: >-
          python learning-sprint/yobi-tantou/content-loop/promote_practice_release.py
          --staging learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json
          --quality learning-sprint/yobi-tantou/content-loop/practice-applied-quality-audit.v1.json
          --output learning-sprint/yobi-tantou/content-loop/questions.applied.release.v1.json
      - name: Combine all audited practice tiers
        run: >-
          python learning-sprint/yobi-tantou/content-loop/combine_practice_release.py
          --tier foundation=learning-sprint/yobi-tantou/content-loop/questions.practice.release.v1.json
          --tier standard=learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json
          --tier applied=learning-sprint/yobi-tantou/content-loop/questions.applied.release.v1.json
          --output learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
      - name: Build native 42-question formal practice bank
        run: >-
          python learning-sprint/yobi-tantou/content-loop/build_native_release.py
          learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
          learning-sprint/yobi-tantou/ios/Resources/questions.release.json
      - name: Verify applied and combined invariants
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('learning-sprint/yobi-tantou/content-loop')
          quality = json.loads((root / 'practice-applied-quality-audit.v1.json').read_text())
          applied = json.loads((root / 'questions.applied.release.v1.json').read_text())
          combined = json.loads((root / 'questions.practice.combined.v1.json').read_text())
          native = json.loads(Path('learning-sprint/yobi-tantou/ios/Resources/questions.release.json').read_text())
          assert quality['checkedAt'] == '2026-08-14'
          assert quality['overallVerdict'] == 'PASS'
          assert quality['summary'] == {'total': 14, 'pass': 14, 'hold': 0, 'nearDuplicatePairs': 0}
          assert len(applied) == 14
          assert len({q['subject'] for q in applied}) == 7
          assert all(q['difficulty'] == 'applied' for q in applied)
          assert len(combined) == len(native) == 42
          expected = Counter({'foundation': 14, 'standard': 14, 'applied': 14})
          assert Counter(q['difficulty'] for q in combined) == expected
          assert Counter(q['difficulty'] for q in native) == expected
          assert len({q['id'] for q in combined}) == 42
          assert len({q['id'] for q in native}) == 42
          assert all(q['content_use'] == 'practice' and q['release_eligible'] is True and q.get('exam_year') is None for q in combined)
          assert all(q['contentUse'] == 'practice' and q['releaseEligible'] is True and q.get('examYear') is None for q in native)
          for tier in ('foundation', 'standard', 'applied'):
              counts = Counter(q['subject'] for q in combined if q['difficulty'] == tier)
              assert len(counts) == 7 and all(count == 2 for count in counts.values())
          print('PASS: 42 formal practice items = foundation14 + standard14 + applied14; 7 subjects x 2 each tier')
          PY
      - name: Release pipeline self-tests
        run: |
          python learning-sprint/yobi-tantou/content-loop/combine_practice_release.py --self-test
          python learning-sprint/yobi-tantou/content-loop/build_native_release.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: yobi-applied-practice-release
          path: |
            learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json
            learning-sprint/yobi-tantou/content-loop/practice-applied-quality-audit.v1.json
            learning-sprint/yobi-tantou/content-loop/questions.applied.release.v1.json
            learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
            learning-sprint/yobi-tantou/ios/Resources/questions.release.json
          if-no-files-found: error
      - name: Persist audited applied and 42-question canonical files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          GENERATED="$RUNNER_TEMP/yobi-applied-generated"
          mkdir -p "$GENERATED/content-loop" "$GENERATED/Resources"
          cp learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/practice-applied-quality-audit.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/questions.applied.release.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/ios/Resources/questions.release.json "$GENERATED/Resources/"

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp "$GENERATED/content-loop/practice-applied-staging.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/practice-applied-quality-audit.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/questions.applied.release.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/questions.practice.combined.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/Resources/questions.release.json" learning-sprint/yobi-tantou/ios/Resources/
          git add \
            learning-sprint/yobi-tantou/content-loop/practice-applied-staging.v1.json \
            learning-sprint/yobi-tantou/content-loop/practice-applied-quality-audit.v1.json \
            learning-sprint/yobi-tantou/content-loop/questions.applied.release.v1.json \
            learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json \
            learning-sprint/yobi-tantou/ios/Resources/questions.release.json

          if git diff --cached --quiet; then
            echo 'PASS: committed 42-question practice canonical already matches regenerated output.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(yobi): persist 42-question audited practice bank'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
