name: Temporary West B Housing Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-housing-main-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-b-housing-main-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to latest main and fetch region
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/west
          git reset --hard origin/main

      - name: Copy audited West B files
        shell: bash
        run: |
          set -euo pipefail
          codes='35203 35206 35207 35208 35305 36388 36403 36404 36405 36468 38205 38386 41208 41209 41346 45382 45403 45406 45430 47353 47359 47360 47362 47381'
          for code in $codes; do
            pref="${code:0:2}"
            for path in \
              "jichitai-compare/data/municipalities/$pref/$code.json" \
              "jichitai-compare/operations/tasks/$code.json"
            do
              mkdir -p "$(dirname "$path")"
              git show "origin/region/west:$path" > "$path"
            done
          done
          for path in \
            jichitai-compare/operations/audits/west-b-housing-classification-crosscheck-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-priority-review-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-official-review-20260725.json \
            jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/west-b.json \
            jichitai-compare/operations/control/regions/west.json
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/region/west:$path" > "$path"
          done

      - name: Regenerate and validate national outputs
        working-directory: jichitai-compare
        run: |
          npm run check
          node --check app.js

      - name: Reject unexpected changes
        shell: bash
        run: |
          set -euo pipefail
          codes='35203|35206|35207|35208|35305|36388|36403|36404|36405|36468|38205|38386|41208|41209|41346|45382|45403|45406|45430|47353|47359|47360|47362|47381'
          allowed="^(jichitai-compare/(data/municipalities/(35/(35203|35206|35207|35208|35305)|36/(36388|36403|36404|36405|36468)|38/(38205|38386)|41/(41208|41209|41346)|45/(45382|45403|45406|45430)|47/(47353|47359|47360|47362|47381))\\.json|operations/tasks/($codes)\\.json|operations/audits/west-b-housing-(classification-crosscheck|priority-review|official-review|classification-corrections)-20260725\\.json|operations/control/session-checkpoints/west-b\\.json|operations/control/regions/west\\.json|data/generated/(municipalities|municipality-pages)\\.json|operations/progress\\.json|municipality/($codes)/index\\.html|sitemap\\.xml))$"
          unexpected=$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changes:'
            echo "$unexpected"
            exit 1
          fi

      - name: Record national sync and create clean commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'jichitai-compare/operations/audits/west-b-housing-classification-corrections-20260725.json';
          const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
          audit.nationalSyncPullRequestNumber = Number(process.env.PR_NUMBER);
          audit.nationalSyncWorkflowRunId = Number(process.env.RUN_ID);
          audit.nationalSyncValidation = 'success';
          audit.nationalSyncRecordedAt = '2026-07-25T19:49:00+09:00';
          audit.releaseBlocker = 'none';
          fs.writeFileSync(file, JSON.stringify(audit, null, 2) + '\n');
          NODE
          rm -f jichitai-compare/operations/control/west-b-housing-main-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No synchronization changes.'
            exit 0
          fi
          git commit -m 'sync: 西日本B住宅支援分類24件を全国反映'
          git push --force origin "HEAD:${GITHUB_HEAD_REF}"
