name: HM2 canonical iOS question JSON rebuild
on:
  push:
    branches: [audit/hm2-quality-20261110]
    paths:
      - apps/sanitary-manager-2/audit-fixes.js
      - ios/health-manager-2/export-audit-data-core.cjs
      - ios/health-manager-2/export-audit-data.cjs
      - ios/health-manager-2/verify-difficulty-gate.cjs
      - ios/health-manager-2/prepare-web-assets.sh
      - .github/workflows/hm2-canonical-json-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 300 stems are unique
        run: node scripts/verify_sm2_cluster_e_final7.cjs
      - name: Rebuild canonical iOS JSON and verify browser-release parity
        run: node ios/health-manager-2/export-audit-data.cjs
      - name: Commit generated canonical JSON to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ios/health-manager-2/release-questions.json
          if git diff --cached --quiet; then
            echo "PASS: canonical 300-question JSON already matches committed snapshot"
          else
            git commit -m "Regenerate canonical HM2 iOS 300-question JSON"
            git push origin "HEAD:audit/hm2-quality-20261110"
          fi
