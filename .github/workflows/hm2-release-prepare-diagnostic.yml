name: HM2 Release Prepare Diagnostic

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[HM2-PREPARE-DIAG]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_NUMBER: '20260914999'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install release preparation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick webp
          if ! command -v magick >/dev/null 2>&1 && command -v convert >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          exec convert "$@"
          SH
            chmod +x "$RUNNER_TEMP/bin/magick"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Audit HM2 StoreKit UI
        run: |
          set -euo pipefail
          command -v magick
          python3 scripts/audit_sm2_storekit_ui.py

      - name: Audit HM2 learning contract
        run: |
          set -euo pipefail
          python3 scripts/audit_sm2_learning_contract.py

      - name: Audit HM2 release drift
        run: |
          set -euo pipefail
          python3 scripts/audit_sm2_release_drift.py

      - name: Verify HM2 web source inventory
        run: |
          set -euo pipefail
          root=apps/sanitary-manager-2
          for file in \
            index.html gm-style.css \
            q1.js q2.js q3.js q4.js q5.js q6.js q7.js q8.js q9.js q10.js q11.js q12.js \
            difficulty-patch-v5.js \
            audit-patch-v2.js audit-patch-v3.js audit-patch-v4.js audit-fixes.js question-order-v1.js \
            gm1.js gm2.js gm3.js gm4.js manifest.json icon.svg; do
            test -f "$root/$file" || { echo "Missing $root/$file" >&2; exit 1; }
          done
          echo 'PASS: HM2 web source inventory complete'

      - name: Verify approved icon transport independently
        run: |
          set -euo pipefail
          source=apps/sanitary-manager-2/approved-app-icon.png
          parts=apps/sanitary-manager-2/approved-icon-v4
          expected=4cefe840198dde91fddb6c5fe0fdece7d41a8bebfed415eb034752491cd7977c
          if [ -f "$source" ]; then
            echo 'PASS: canonical approved-app-icon.png already present'
            exit 0
          fi
          test -d "$parts"
          test "$(find "$parts" -maxdepth 1 -type f -name 'part*.b64' | wc -l | tr -d ' ')" = '4'
          tmp="$RUNNER_TEMP/hm2-approved-icon.webp"
          cat "$parts"/part01.b64 "$parts"/part02.b64 "$parts"/part03.b64 "$parts"/part04.b64 | tr -d '\r\n' | base64 --decode > "$tmp"
          python3 - "$tmp" "$expected" <<'PY'
          from pathlib import Path
          import hashlib, struct, sys
          p=Path(sys.argv[1]); expected=sys.argv[2]
          b=p.read_bytes()
          assert len(b)==28904, len(b)
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          assert struct.unpack('<I', b[4:8])[0]+8 == len(b)
          assert hashlib.sha256(b).hexdigest()==expected
          print('PASS: approved icon transport bytes/hash verified')
          PY
          magick "$tmp" -alpha off "$RUNNER_TEMP/hm2-approved-icon.png"
          test -s "$RUNNER_TEMP/hm2-approved-icon.png"
          echo 'PASS: approved icon transport decodes through installed ImageMagick'

      - name: Run release asset preparation with explicit diagnostic build number
        run: |
          set -euo pipefail
          bash -x ios/health-manager-2/prepare-web-assets.sh 2>&1 | tee /tmp/hm2-prepare-diagnostic.log

      - name: Verify generated release inputs
        run: |
          set -euo pipefail
          test -f ios/health-manager-2/HealthManager2/Web/index.html
          test -f ios/health-manager-2/HealthManager2/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          grep -q 'CURRENT_PROJECT_VERSION: 20260914999' ios/health-manager-2/project.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hm2-release-prepare-diagnostic
          path: /tmp/hm2-prepare-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body:`HM2 release prepare diagnostic finished. status=${{ job.status }}; run_id=${context.runId}. No build, TestFlight upload, or App Store submission was performed.`});
