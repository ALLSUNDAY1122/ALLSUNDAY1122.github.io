name: Temporary Sync Release Queue 225

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-225.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={
            'north':[('01424','奈井江町'),('01425','上砂川町'),('01427','由仁町')],
            'central':[('21404','池田町'),('21421','北方町')],
          }
          for entry in data['entries']:
              region=entry['region']
              existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(region,[]):
                  if code not in existing:
                      entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if region=='north':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='倶知安町から赤井川村までの追加10自治体をPR #411でmainへ全国統合し、生成・公開をPR #415で214自治体へ更新。その後、南幌町・奈井江町・上砂川町・由仁町を地方統合'
                  entry['mainIntegrationPr']=411
                  entry['generatedPullRequest']=415
              elif region=='central':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='下呂市から安八町までの追加10自治体をPR #404でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新。その後、揖斐川町・大野町・池田町・北方町を地方統合'
                  entry['mainIntegrationPr']=404
                  entry['generatedPullRequest']=408
              elif region=='east':
                  entry['pendingSinceLastRelease']=1
              elif region=='west':
                  entry['pendingSinceLastRelease']=3
          data['updatedAt']='2026-07-22T03:03:00+09:00'
          data['summary']={
            'regionalMergedMunicipalities':sum(e['count'] for e in data['entries']),
            'waitingRegionalMergeMunicipalities':0,
            'releaseReadyRegions':[],
            'auditBlockedRegions':[],
            'lastNationalIntegrationAt':'2026-07-22T02:37:27+09:00',
            'lastNationalIntegrationPr':411,
            'latestGeneratedMunicipalityCount':214,
            'latestGeneratedPullRequest':415,
            'latestPublicCountPullRequest':415,
          }
          if data['summary']['regionalMergedMunicipalities'] != 225:
              raise SystemExit(f"expected regional total 225, got {data['summary']['regionalMergedMunicipalities']}")
          data['nextAction']='北日本と中日本が前回全国統合後4自治体で先行。西日本3、東日本1。各地域をコード昇順で継続し、10自治体到達時に直ちに全国統合する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-225.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-225.yml
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/temp-sync-release-queue-225.yml','jichitai-compare/operations/control/release-queue.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual ^ expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合225自治体・公開214自治体へ同期'
          git push origin main
