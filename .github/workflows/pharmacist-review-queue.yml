name: Pharmacist Final Review Queue

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Pharmacist Official Source Import']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/tools/prepare_final_review.py'
      - '.github/workflows/pharmacist-review-queue.yml'

concurrency:
  group: pharmacist-final-review-queue
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  queue:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final review queues
        run: python3 pharmacist-manabi-sprint/tools/prepare_final_review.py
      - name: Commit review queues
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/content/review/
          if git diff --cached --quiet; then
            echo 'No review queue changes.'
          else
            git commit -m 'pharmacist: prepare 1035-question final review queues [skip ci]'
            git pull --rebase origin main
            git push
          fi
