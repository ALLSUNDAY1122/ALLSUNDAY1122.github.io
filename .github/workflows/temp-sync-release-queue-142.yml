name: Temporary Sync Release Queue 142

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-release-queue-142.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release queue and remove workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node - <<'NODE'
          import fs from 'node:fs';
          const path = 'jichitai-compare/operations/control/release-queue.json';
          const queue = JSON.parse(fs.readFileSync(path, 'utf8'));
          const addUnique = (entry, additions) => {
            const seen = new Set(entry.municipalities.map(x => x.code));
            for (const item of additions) {
              if (!seen.has(item.code)) {
                entry.municipalities.push(item);
                seen.add(item.code);
              }
            }
            entry.count = entry.municipalities.length;
          };

          const central = queue.entries.find(x => x.region === 'central');
          const west = queue.entries.find(x => x.region === 'west');
          if (!central || !west) throw new Error('region entry not found');

          addUnique(central, [{code:'18501',name:'若狭町'}]);
          central.pendingSinceLastRelease = 1;
          central.releaseStatus = 'pending_threshold';
          central.reason = '中日本の51自治体をPR #315までにmainへ全国統合し、生成・公開をPR #316で124自治体へ更新。その後、若狭町をPR #318で地方統合';
          central.mainIntegrationPr = 315;
          central.generatedPullRequest = 316;
          central.auditStatus = 'passed';

          addUnique(west, [
            {code:'32441',name:'川本町'},
            {code:'32448',name:'美郷町'}
          ]);
          west.pendingSinceLastRelease = 0;
          west.releaseStatus = 'released';
          west.reason = '西日本の初回11自治体をPR #177、追加10自治体をPR #226、浜田市から美郷町までの追加10自治体をPR #324でmainへ全国統合。生成・公開をPR #325で134自治体へ更新';
          west.mainIntegrationPr = 324;
          west.generatedPullRequest = 325;

          for (const entry of queue.entries) entry.count = entry.municipalities.length;
          queue.updatedAt = '2026-07-21T22:20:00+09:00';
          queue.summary = {
            regionalMergedMunicipalities: queue.entries.reduce((sum, x) => sum + x.count, 0),
            waitingRegionalMergeMunicipalities: 0,
            releaseReadyRegions: [],
            auditBlockedRegions: [],
            lastNationalIntegrationAt: '2026-07-21T22:15:44+09:00',
            lastNationalIntegrationPr: 324,
            latestGeneratedMunicipalityCount: 134,
            latestGeneratedPullRequest: 325,
            latestPublicCountPullRequest: 325
          };
          queue.nextAction = '東日本は前回全国統合後8自治体で、あと2自治体で閾値到達。中日本は若狭町1自治体、西日本・北日本は0自治体から次周期を開始する。';
          queue.humanDecisionRequired = false;

          if (central.count !== 52) throw new Error(`central count mismatch: ${central.count}`);
          if (west.count !== 31) throw new Error(`west count mismatch: ${west.count}`);
          if (queue.summary.regionalMergedMunicipalities !== 142) {
            throw new Error(`regional total mismatch: ${queue.summary.regionalMergedMunicipalities}`);
          }
          fs.writeFileSync(path, JSON.stringify(queue));
          NODE
          git rm .github/workflows/temp-sync-release-queue-142.yml
          git add jichitai-compare/operations/control/release-queue.json
          git commit -m "統括管理: 地方統合142自治体・公開134自治体へ同期"
          git push origin main
