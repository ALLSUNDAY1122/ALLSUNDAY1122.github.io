name: Fix Kagawa Publication Readiness 20260724
on:
  pull_request:
    branches: [region/west]
permissions:
  contents: write
  pull-requests: read
jobs:
  fix:
    if: github.head_ref == 'fix/kagawa-37324-37364-37403-publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kagawa-37324-37364-37403-publication
          fetch-depth: 0
      - name: Normalize three Kagawa municipalities
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const order = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const date = '2026-07-24';
          const dateTime = '2026-07-24T11:45:00+09:00';
          const branch = 'fix/kagawa-37324-37364-37403-publication';

          function load(code) {
            const municipalityPath = `jichitai-compare/data/municipalities/37/${code}.json`;
            const taskPath = `jichitai-compare/operations/tasks/${code}.json`;
            return {
              municipalityPath,
              taskPath,
              municipality: JSON.parse(fs.readFileSync(municipalityPath, 'utf8')),
              task: JSON.parse(fs.readFileSync(taskPath, 'utf8'))
            };
          }

          function finalize(record, note) {
            const { municipality, task, municipalityPath, taskPath } = record;
            municipality.status = 'verified';
            municipality.updatedAt = date;
            const sources = [];
            for (const id of order) {
              const url = municipality.services[id]?.source?.url;
              if (typeof url === 'string' && !sources.includes(url)) sources.push(url);
            }
            task.status = 'pr_open';
            task.currentService = null;
            task.nextServiceIndex = 9;
            task.completedServices = order;
            task.verifiedCount = order.filter((id) => municipality.services[id].status === 'verified').length;
            task.researchingCount = 0;
            task.unavailableCount = order.filter((id) => municipality.services[id].status === 'unavailable').length;
            task.needsMediumReviewCount = 0;
            task.currentBranch = branch;
            task.pullRequestNumber = 0;
            task.lastCheckedAt = date;
            task.lastUpdatedAt = dateTime;
            task.lastUpdatedBy = '統括B';
            task.officialSources = sources;
            task.notes = [
              ...(Array.isArray(task.notes) ? task.notes.filter((item) => !String(item).startsWith('PR #') && !String(item).includes('needs_medium_review')) : []),
              note,
              '統括Bが必須9制度をverifiedまたはunavailableの公開可能状態へ同期。'
            ];
            task.blockers = [];
            fs.writeFileSync(municipalityPath, JSON.stringify(municipality));
            fs.writeFileSync(taskPath, JSON.stringify(task));
          }

          {
            const record = load('37324');
            record.municipality.summary = '必須9制度を小豆島町公式情報で調査。8制度をverified、町内の現行利用料金・実施施設・申請予約条件を確定できない乳児等通園支援事業をunavailableとして登録。';
            record.municipality.services.temporaryChildcare = {
              status: 'unavailable',
              summary: '乳児等通園支援事業の制度整備は確認できるが、町内の現行利用条件を確定できない',
              notes: [
                '町の子ども・子育て支援計画と条例整備により、未就園児を保護者の就労要件を問わず預かる乳児等通園支援事業の実施方針を確認した。',
                '2026年度の町内実施施設、正確な月間利用上限、利用料金、利用時間、認定・面談・予約方法をまとめた利用者向け公式案内を確認できない。',
                '制度が存在しないとは断定せず、比較に必要な現行利用条件を窓口確認事項として扱う。'
              ],
              source: {
                url: 'https://www.town.shodoshima.lg.jp/material/files/group/27/action-plan-3.pdf',
                checkedAt: date
              }
            };
            finalize(record, '乳児等通園支援事業は制度方針を確認したが、町内の料金・施設・利用時間・申請予約条件を確定できないためunavailableとした。');
          }

          {
            const record = load('37364');
            record.municipality.summary = '必須9制度を直島町公式情報で調査。8制度をverified、2026年度の対象概要は確認できるが料金・実施施設・予約条件を確定できないこども誰でも通園制度をunavailableとして登録。';
            record.municipality.services.temporaryChildcare = {
              status: 'unavailable',
              summary: '2026年4月開始のこども誰でも通園制度は確認できるが、比較に必要な全利用条件を確定できない',
              notes: [
                '町広報で、保育所等に通っていない満3歳未満の子どもを対象として2026年4月から開始し、月10時間まで利用する制度概要を確認した。',
                '利用料金、実施施設、利用可能な曜日・時間、認定・面談・予約・取消方法を示す現行の利用者向け公式案内を確認できない。',
                '従来の一時預かりとこども誰でも通園制度を混同せず、未確認の比較条件を窓口確認事項として扱う。'
              ],
              source: {
                url: 'https://www.town.naoshima.lg.jp/about/item/092a2d2d7ff80598ce6e84092b0d76512c832acc.pdf',
                checkedAt: date
              }
            };
            finalize(record, 'こども誰でも通園制度の開始・対象概要・月10時間上限は確認したが、料金・施設・予約条件を確定できないためunavailableとした。');
          }

          {
            const record = load('37403');
            record.municipality.summary = '必須9制度を琴平町公式情報で調査し、広域病児・病後児保育の利用可能施設、利用料無料化・差額支給を含む9制度をverifiedとして登録。';
            record.municipality.services.sickChildCare = {
              status: 'verified',
              summary: '中讃圏域の病児・病後児保育施設を利用でき、対象児の利用料無料化や町内料金との差額支給を実施',
              details: {
                facilities: '丸亀市のおひさま、坂出市の回生病院病児保育室、善通寺市のげんきになあれ・らっこ、多度津町のみのり倶楽部、綾川町のうぐいす等を利用可能',
                freeProgram: '第2子の3歳未満児と第3子以降の就学前児童は、事前登録等の要件を満たす場合に利用料無料',
                reimbursement: '丸亀市・善通寺市・多度津町の対象施設では、町外利用者料金と施設所在自治体住民料金の差額を町が支給',
                application: '施設ごとの事前登録・予約を行い、無料化または差額支給は町への所定手続きが必要',
                confirmation: '対象年齢、開所時間、空き状況等の施設固有条件は利用先施設へ確認する'
              },
              source: {
                url: 'https://www.town.kotohira.kagawa.jp/site/child/1738.html',
                checkedAt: date
              },
              additionalSources: [
                {
                  url: 'https://www.town.kotohira.kagawa.jp/site/tyuusanteijyuu/1679.html',
                  checkedAt: date
                }
              ]
            };
            finalize(record, '病児・病後児保育は広域利用可能施設、対象児の無料化、町内料金との差額支給を公式ページで確認しverifiedとした。');
          }
          NODE
          rm -f .github/workflows/fix-kagawa-publication-readiness-20260724.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/37/37324.json jichitai-compare/operations/tasks/37324.json jichitai-compare/data/municipalities/37/37364.json jichitai-compare/operations/tasks/37364.json jichitai-compare/data/municipalities/37/37403.json jichitai-compare/operations/tasks/37403.json .github/workflows/fix-kagawa-publication-readiness-20260724.yml
          git commit -m 'fix: 香川県3自治体の公開除外状態を解消'
          git push origin HEAD:fix/kagawa-37324-37364-37403-publication
