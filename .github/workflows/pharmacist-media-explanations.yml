name: Pharmacist Media Explanation Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/tools/media_explanation_fallback.py'
      - 'pharmacist-manabi-sprint/tools/media-explanation-trigger.txt'
      - '.github/workflows/pharmacist-media-explanations.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build media explanation overlay
        run: python3 pharmacist-manabi-sprint/tools/media_explanation_fallback.py
      - name: Commit overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/content/reviewed/media-anchor/ pharmacist-manabi-sprint/content/review/media-explanation-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'pharmacist: build media explanation fallback [skip ci]'
          git pull --rebase origin main
          git push
