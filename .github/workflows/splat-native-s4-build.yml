name: Splat Native S4 Mesh Build

on:
  push:
    branches:
      - scaniverse/s4-mesh-photogrammetry
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-s4-build.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-s4-build.yml'

concurrency:
  group: splat-native-s4-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Disable LFS smudge for SwiftPM dependency checkout
        run: git lfs install --skip-smudge --skip-repo

      - name: Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          cd splat-native-ios
          xcodegen generate

      - name: S4 real-mesh anti-placeholder audit
        run: |
          set -euxo pipefail
          test -f splat-native-ios/SplatNative/MeshScanModel.swift
          test -f splat-native-ios/SplatNative/MeshScanView.swift
          test -f splat-native-ios/SplatNative/MeshDepthRecorder.swift
          test -f splat-native-ios/SplatNative/MeshRawReprocess.swift
          test -f splat-native-ios/SplatNative/MeshSimplifier.swift
          test -f splat-native-ios/SplatNative/MeshVisualFallback.swift
          test -f splat-native-ios/SplatNative/MeshAssetContract.swift
          test -f splat-native-ios/SplatNative/MeshRGBTextureBaker.swift
          test -f splat-native-ios/SplatNative/MeshARViewer.swift
          grep -q 'ARMeshAnchor' splat-native-ios/SplatNative/MeshScanModel.swift
          grep -q 'PhotogrammetrySession' splat-native-ios/SplatNative/MeshScanModel.swift
          grep -q 'smoothedSceneDepth' splat-native-ios/SplatNative/MeshDepthRecorder.swift
          grep -q 'rawFeaturePoints' splat-native-ios/SplatNative/MeshVisualFallback.swift
          grep -q 'vertex-cluster simplified mesh' splat-native-ios/SplatNative/MeshSimplifier.swift
          grep -q 'ARKit world space; Y-up; right-handed' splat-native-ios/SplatNative/MeshAssetContract.swift
          grep -q 'mesh-textured-atlas.jpg' splat-native-ios/SplatNative/MeshRGBTextureBaker.swift
          grep -q 'mesh-texture-bake.json' splat-native-ios/SplatNative/MeshRGBTextureBaker.swift
          grep -q '8192' splat-native-ios/SplatNative/MeshRGBTextureBaker.swift
          grep -q 'ARSCNView' splat-native-ios/SplatNative/MeshARViewer.swift
          grep -q 'currentMeshHasMetricScale' splat-native-ios/SplatNative/MeshAdvancedSupervisor.swift
          ! grep -R -nE 'TODO.*Mesh|placeholder.*Mesh|fake.*mesh|mock.*mesh' splat-native-ios/SplatNative/Mesh*.swift
          ! grep -R -n 'URLSession' splat-native-ios/SplatNative/Mesh*.swift

      - name: Build iOS device target without signing
        shell: bash
        run: |
          set +e
          xcodebuild -quiet \
            -project splat-native-ios/SplatNative.xcodeproj \
            -scheme SplatNative \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/s4-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '--- S4 compiler diagnostics ---'
            grep -E ':[0-9]+:[0-9]+: error:|(^|[[:space:]])error:' /tmp/s4-build.log | tail -n 80 | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done
            grep -E ':[0-9]+:[0-9]+: (error|warning):' /tmp/s4-build.log | tail -n 160 || true
            exit "$status"
          fi
