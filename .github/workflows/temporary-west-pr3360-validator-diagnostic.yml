name: Temporary West PR3360 Validator Diagnostic

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'fix/west-four-source-blockers-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Capture validator output once
        shell: bash
        run: |
          set +e
          cd jichitai-compare
          OUTPUT="operations/audits/west-pr3360-validator-diagnostic-20260725.txt"
          if [ -f "$OUTPUT" ]; then
            echo "Diagnostic evidence already exists; no recapture needed."
            exit 0
          fi
          npm run generate > /tmp/west-pr3360-generate.log 2>&1
          GENERATE_STATUS=$?
          npm run progress > /tmp/west-pr3360-progress.log 2>&1
          PROGRESS_STATUS=$?
          npm run validate:generated > /tmp/west-pr3360-validate.log 2>&1
          VALIDATE_STATUS=$?
          mkdir -p operations/audits
          {
            echo "schemaVersion: 1.0.0"
            echo "auditId: west-pr3360-validator-diagnostic-20260725"
            echo "generatedAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "generateExitCode: ${GENERATE_STATUS}"
            echo "progressExitCode: ${PROGRESS_STATUS}"
            echo "validateExitCode: ${VALIDATE_STATUS}"
            echo
            echo "===== generate ====="
            cat /tmp/west-pr3360-generate.log
            echo
            echo "===== progress ====="
            cat /tmp/west-pr3360-progress.log
            echo
            echo "===== validate ====="
            cat /tmp/west-pr3360-validate.log
          } > "$OUTPUT"
          exit 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/west-pr3360-validator-diagnostic-20260725.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "audit: capture PR3360 validator output"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
