name: Clipboard Widget Apple Web Auth Probe

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-apple-web-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe known Apple web-auth variable names without exposing values
        env:
          S_FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_ASC_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          S_FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          S_FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          V_FASTLANE_USER: ${{ vars.FASTLANE_USER }}
          V_APPLE_ID: ${{ vars.APPLE_ID }}
          V_ASC_USERNAME: ${{ vars.APP_STORE_CONNECT_USERNAME }}
          V_APPLE_USERNAME: ${{ vars.APPLE_USERNAME }}
          V_APPLE_EMAIL: ${{ vars.APPLE_EMAIL }}
          V_FASTLANE_PASSWORD: ${{ vars.FASTLANE_PASSWORD }}
          V_APPLE_PASSWORD: ${{ vars.APPLE_ID_PASSWORD }}
          V_FASTLANE_SESSION: ${{ vars.FASTLANE_SESSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/clipboard-widget/evidence
          python3 - <<'PY'
          import json, os
          keys = [
            'S_FASTLANE_USER','S_APPLE_ID','S_ASC_USERNAME','S_FASTLANE_PASSWORD','S_APPLE_PASSWORD','S_FASTLANE_SESSION',
            'V_FASTLANE_USER','V_APPLE_ID','V_ASC_USERNAME','V_APPLE_USERNAME','V_APPLE_EMAIL','V_FASTLANE_PASSWORD','V_APPLE_PASSWORD','V_FASTLANE_SESSION'
          ]
          present = {k: bool(os.getenv(k,'')) for k in keys}
          evidence = {
            'probe': present,
            'secret_web_auth_ready': bool((present['S_FASTLANE_USER'] or present['S_APPLE_ID'] or present['S_ASC_USERNAME']) and (present['S_FASTLANE_PASSWORD'] or present['S_APPLE_PASSWORD'] or present['S_FASTLANE_SESSION'])),
            'variable_web_auth_ready': bool((present['V_FASTLANE_USER'] or present['V_APPLE_ID'] or present['V_ASC_USERNAME'] or present['V_APPLE_USERNAME'] or present['V_APPLE_EMAIL']) and (present['V_FASTLANE_PASSWORD'] or present['V_APPLE_PASSWORD'] or present['V_FASTLANE_SESSION']))
          }
          with open('automation/clipboard-widget/evidence/apple-web-auth-probe.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Persist probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/clipboard-widget-poc
          git reset --hard origin/feature/clipboard-widget-poc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/apple-web-auth-probe.json
          git commit -m 'chore: record clipboard Apple web auth probe' || true
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc
