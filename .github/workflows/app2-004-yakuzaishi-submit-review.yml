name: APP2-004 Pharmacist Submit App Review

on:
  push:
    branches: [main]
    paths:
      - automation/app2-004-yakuzaishi-final-submit-command.json

permissions:
  contents: write

concurrency:
  group: app2-004-yakuzaishi-submit-review
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require fresh explicit human approval and exact-build device acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          cmd=json.loads(Path('automation/app2-004-yakuzaishi-final-submit-command.json').read_text(encoding='utf-8'))
          if cmd.get('action') != 'submit_app_review': raise SystemExit('HUMAN_GATE: unexpected submit action')
          if str(cmd.get('app_id')) != '6799753724' or str(cmd.get('bundle_id')) != 'jp.allsunday1122.yakuzaishi': raise SystemExit('HUMAN_GATE: target mismatch')
          build=str(cmd.get('build') or '').strip()
          if not build.isdigit(): raise SystemExit('HUMAN_GATE: approved build missing or invalid')
          auth=cmd.get('authorization') or {}
          if auth.get('status') != 'APPROVED' or auth.get('source') != 'user': raise SystemExit('HUMAN_GATE: explicit user approval missing')
          acceptance=cmd.get('human_device_acceptance') or {}
          if acceptance.get('status') != 'PASS' or acceptance.get('source') != 'user': raise SystemExit('HUMAN_GATE: device acceptance missing')
          accepted_build=str(acceptance.get('build') or '').strip()
          if accepted_build != build: raise SystemExit(f'HUMAN_GATE: device acceptance build mismatch; accepted={accepted_build or "[missing]"} approved={build}')
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if str(cmd.get('approved_commit') or '') != parent: raise SystemExit('HUMAN_GATE: approval is not pinned to exact release commit')
          raw=str(cmd.get('approved_at') or '').replace('Z','+00:00')
          try: approved_at=datetime.fromisoformat(raw)
          except Exception: raise SystemExit('HUMAN_GATE: approved_at missing or invalid')
          if approved_at.tzinfo is None: raise SystemExit('HUMAN_GATE: approved_at timezone missing')
          age=datetime.now(timezone.utc)-approved_at.astimezone(timezone.utc)
          if age < timedelta(minutes=-5) or age > timedelta(hours=24): raise SystemExit(f'HUMAN_GATE: approval stale/future; age={age}')
          print(f'PASS: fresh approval and device acceptance both pinned to Build {build}')
          PY

      - name: Submit exact approved build to App Review
        id: submit
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PHARMACIST_SUBMIT_OUTPUT: /tmp/app2-004-yakuzaishi-submit-result.json
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/app2_004_yakuzaishi_submit_review.py 2>&1 | tee /tmp/app2-004-yakuzaishi-submit.log

      - name: Persist submission evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/asc-results
          if [ -f /tmp/app2-004-yakuzaishi-submit-result.json ]; then
            cp /tmp/app2-004-yakuzaishi-submit-result.json automation/asc-results/app2-004-yakuzaishi-submit-review-result.json
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          log=Path('/tmp/app2-004-yakuzaishi-submit.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/app2-004-yakuzaishi-submit.log').exists() else 'submitter did not run'
          Path('automation/asc-results/app2-004-yakuzaishi-submit-review-result.json').write_text(json.dumps({'task_id':'APP2-004','submitted':False,'error':log[-4000:]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/asc-results/app2-004-yakuzaishi-submit-review-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist APP2-004 App Review submission evidence'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Enforce submitted state
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/asc-results/app2-004-yakuzaishi-submit-review-result.json')
          if not p.exists(): raise SystemExit('submission result missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          if not data.get('submitted'): raise SystemExit('APP2-004 submission did not complete: '+str(data.get('error')))
          print('PASS: submitted state='+str(data.get('review_submission_state')))
          PY
