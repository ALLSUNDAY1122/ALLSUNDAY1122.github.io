name: Temporary state snapshot 474 1745

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-state-474-1745.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build state branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
          git checkout -B coord/state-after-public-474-20260722-1745 origin/main
          cat > /tmp/state.py <<'PY'
          import json, re, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('jichitai-compare')
          progress = json.loads((root/'operations/progress.json').read_text(encoding='utf-8'))
          if progress['registeredMunicipalities'] != 474:
              raise SystemExit(f"unexpected public count {progress['registeredMunicipalities']}")

          specs = {
              'north': ('origin/region/north', lambda p: 1 <= p <= 7, 757),
              'east': ('origin/region/east', lambda p: 8 <= p <= 15 or p in (19,20), 708),
              'central': ('origin/region/central', lambda p: 16 <= p <= 18 or 21 <= p <= 30, 742),
              'west': ('origin/region/west', lambda p: 31 <= p <= 47, 716),
          }

          def rows(ref, accept):
              output = subprocess.check_output(['git','ls-tree','-r','--name-only',ref,str(root/'data/municipalities')], text=True)
              result=[]
              for path in output.splitlines():
                  m=re.fullmatch(r'jichitai-compare/data/municipalities/(\d{2})/(\d{5})\.json',path)
                  if not m or not accept(int(m.group(1))):
                      continue
                  data=json.loads(subprocess.check_output(['git','show',f'{ref}:{path}'],text=True))
                  result.append({'code':m.group(2),'name':data.get('name') or data.get('municipalityName') or m.group(2)})
              return sorted(result,key=lambda row:row['code'])

          main={key:rows('HEAD',accept) for key,(_,accept,_) in specs.items()}
          regional={key:rows(ref,accept) for key,(ref,accept,_) in specs.items()}
          pending_rows={key:[row for row in regional[key] if row['code'] not in {x['code'] for x in main[key]}] for key in specs}
          pending={key:len(value) for key,value in pending_rows.items()}
          counts={key:len(regional[key]) for key in specs}
          total=sum(counts.values())
          ready=[key for key in specs if pending[key]>=10]
          now=datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          next_action=('10自治体到達地域を固定スナップショットで全国統合する。' if ready else
              '地方統合を継続。現在の公開後繰越: '+ '、'.join(f'{key} {pending[key]}' for key in ('north','east','central','west'))+'。')

          queue_path=root/'operations/control/release-queue.json'
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          entries={e['region']:e for e in queue['entries']}
          for key,(_,_,integration_pr) in specs.items():
              entries[key].update({
                  'municipalities':regional[key], 'count':counts[key],
                  'pendingSinceLastRelease':pending[key],
                  'releaseStatus':'ready' if pending[key]>=10 else ('up_to_date' if pending[key]==0 else 'pending_threshold'),
                  'reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending[key]}自治体',
                  'mainIntegrationPr':integration_pr,'generatedPullRequest':759,'auditStatus':'passed'})
          queue.update({'updatedAt':now,'summary':{
              'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':474,
              'latestGeneratedPullRequest':759,'latestPublicCountPullRequest':759,
              'releaseReadyRegions':ready,'nextAction':next_action},
              'nextAction':next_action,'humanDecisionRequired':False})
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          global_path=root/'operations/control/global-state.json'
          state=json.loads(global_path.read_text(encoding='utf-8'))
          state.update({'updatedAt':now,'phase':'release-monitoring',
              'regionalCompletedSinceLastRelease':{**pending,'total':sum(pending.values())},
              'priority':{'type':'release-monitoring','nextAction':next_action},
              'lastNationalIntegrationAt':'2026-07-22T17:33:49+09:00','lastNationalIntegrationPr':757,
              'latestGeneratedMunicipalityCount':474,'latestGeneratedPullRequest':759,
              'latestPublicCountPullRequest':759,'regionalMergedMunicipalities':total,
              'openPullRequests':[],'humanDecisionRequired':False})
          global_path.write_text(json.dumps(state,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          audit_path=root/'operations/control/audit-log.jsonl'
          record={'timestamp':now,'actor':'全国進行統括','action':'coordinator-sync-after-public-474',
              'details':{'publicMunicipalityCount':474,'publicServices':4266,'regionalCounts':counts,
              'regionalMergedMunicipalities':total,'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},
              'pendingMunicipalities':pending_rows,'nationalIntegrationPullRequest':757,
              'publicationPullRequest':759,'releaseReadyRegions':ready},'humanDecisionRequired':False}
          text=audit_path.read_text(encoding='utf-8')
          if text and not text.endswith('\n'): text+='\n'
          audit_path.write_text(text+json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          Path('/tmp/summary').write_text(f"{total} {pending['north']} {pending['east']} {pending['central']} {pending['west']}")
          PY
          python3 /tmp/state.py
          read total north east central west < /tmp/summary
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json \
            jichitai-compare/operations/control/global-state.json \
            jichitai-compare/operations/control/audit-log.jsonl
          git commit -m "統括管理: 公開474・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force origin HEAD:coord/state-after-public-474-20260722-1745
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          if [ -f .github/workflows/temp-state-474-1745.yml ]; then
            git rm .github/workflows/temp-state-474-1745.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '統括管理: 公開474状態ワークフローを削除'
            git push origin HEAD:main
          fi
