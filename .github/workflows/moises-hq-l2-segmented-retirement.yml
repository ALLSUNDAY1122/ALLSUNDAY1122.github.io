name: Moises HQ Lane2 Segmented Retirement

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Library/Sources/ManagedArtifactSegmentedGenerationRetirement.swift'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedGenerationRetirementTests.swift'
      - '.github/workflows/moises-hq-l2-segmented-retirement.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Library/Sources/ManagedArtifactSegmentedGenerationRetirement.swift'
      - 'tech-assets/moises-audio/Library/Tests/ManagedArtifactSegmentedGenerationRetirementTests.swift'
      - '.github/workflows/moises-hq-l2-segmented-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l2-segmented-retirement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lane2-segmented-retirement-xctest:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Execute Lane2 bounded generation retirement XCTest
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/l2-segmented-retirement-xctest
          rm -rf "$tmp"
          mkdir -p "$tmp/Sources/Lane2Retirement/Shared" "$tmp/Sources/Lane2Retirement/IO" "$tmp/Sources/Lane2Retirement/Library" "$tmp/Tests/Lane2RetirementTests"
          cp Shared/DomainContracts.swift Shared/LibraryContracts.swift "$tmp/Sources/Lane2Retirement/Shared/"
          cp IO/Sources/*.swift "$tmp/Sources/Lane2Retirement/IO/"
          cp Library/Sources/*.swift "$tmp/Sources/Lane2Retirement/Library/"
          test_file="$tmp/Tests/Lane2RetirementTests/ManagedArtifactSegmentedGenerationRetirementTests.swift"
          printf '@testable import Lane2Retirement\n' > "$test_file"
          cat Library/Tests/ManagedArtifactSegmentedGenerationRetirementTests.swift >> "$test_file"
          cat > "$tmp/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Lane2SegmentedRetirementCI",
              targets: [
                  .target(name: "Lane2Retirement", path: "Sources/Lane2Retirement"),
                  .testTarget(
                      name: "Lane2RetirementTests",
                      dependencies: ["Lane2Retirement"],
                      path: "Tests/Lane2RetirementTests"
                  )
              ]
          )
          SWIFT
          swift test --package-path "$tmp" --parallel
