name: Temporary Central A Housing Batch 19

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch19-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch19-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 19 decisions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T05:31:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const unavailableSummary='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const replacements={
            '23201':{
              type:'general_area_settlement_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'歩いて暮らせるまち区域で住宅を取得して定住する人へ、家屋・土地の固定資産税相当額を最大3年間補助する。',classificationReview:'居住誘導区域への一般定住促進制度であり、子ども、新婚、三世代を対象要件とする条件や加算を現行公式ページで確認できないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.toyohashi.lg.jp/37006.htm',checkedAt}}
            },
            '23216':{
              type:'general_vacant_home_renovation_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'空き家バンク登録物件を居宅等として改修する場合、一般住宅は対象経費の2分の1・上限50万円、地域活性化用途は3分の2・上限100万円を補助する。',classificationReview:'空き家の一般利活用制度であり、子ども、新婚、三世代を対象要件とする条件や加算を現行公式ページで確認できないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.tokoname.aichi.jp/kurashi/sumai/1003159/1007062.html',checkedAt}}
            },
            '23228':{
              type:'general_migration_and_expired_child_program',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'東京圏から岩倉市へ移住し就業・テレワーク・関係人口・起業等の要件を満たす人へ、単身60万円・2人以上世帯100万円の移住支援金を交付する。',expiredChildProgram:'三世代同居・近居住宅支援補助金は2024年3月に終了したと公式ページに明記されている。',classificationReview:'現行の移住支援金には子ども・新婚・住宅費の固有条件を確認できず、過去の三世代住宅支援も終了済みのため、2026年度の子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.iwakura.aichi.jp/0000006017.html',checkedAt},additionalSources:[{url:'https://www.city.iwakura.aichi.jp/0000003998.html',checkedAt,description:'現行の一般就業者移住支援事業'},{url:'https://www.city.iwakura.aichi.jp/brand/0000003078.html',checkedAt,description:'2024年3月に終了した三世代同居・近居住宅支援'}]}
            },
            '23425':{
              type:'general_seismic_assistance_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'旧耐震基準の木造住宅について、耐震改修・段階的耐震改修・耐震シェルター整備等の費用を補助する。',classificationReview:'住宅の耐震化を対象とする一般制度であり、子ども、新婚、三世代を対象要件とする条件や加算を現行公式ページで確認できないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.town.kanie.aichi.jp/soshiki/14/taishin-kaishu.html',checkedAt}}
            },
            '23427':{
              type:'general_new_build_acquisition_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'村内で自己または2親等以内の家族が居住する新築住宅を取得する契約者へ、定額50万円を補助する。',classificationReview:'新築住宅取得による一般定住促進制度であり、子ども、新婚、三世代を対象要件とする条件や加算を現行公式ページで確認できないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.vill.tobishima.aichi.jp/kurashi/seikatsu/1001687/1001688/1003104.html',checkedAt}}
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(replacements)){
            const dataPath=path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(before.status!=='verified')throw new Error(`${code}: expected verified before status, got ${before.status}`);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第19群で公式情報を独立確認し、${entry.type}としてhousingSupportをunavailableへ修正。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            records.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(checkpoint.qualityReaudit.correctedMunicipalitiesRechecked!==144||checkpoint.qualityReaudit.primarySourceSlotsRechecked!==576||checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification!==84)throw new Error('Unexpected batch18 baseline');
          checkpoint.updatedAt=updatedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残79件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=149;checkpoint.qualityReaudit.primarySourceSlotsRechecked=581;checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=79;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残79件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:19,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:5,remainingCandidates:79,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第19群として豊橋市・常滑市・岩倉市・蟹江町・飛島村の一般定住・空き家・移住・耐震・新築取得制度をunavailableへ修正した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch19-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:5,corrected:records,causeScan:{previousRemainingCandidates:84,reviewedHighRiskCandidates:5,remainingCandidates:79},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般の地域定住・空き家改修・東京圏移住・耐震・新築取得制度を子育て住宅支援として登録しない','終了済みの三世代住宅支援を2026年度の現行制度として扱わない','子ども・新婚・三世代の現行対象要件または加算を公式本文で確認できる場合のみverifiedとする'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch19-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch19-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/23/23201.json|jichitai-compare/data/municipalities/23/23216.json|jichitai-compare/data/municipalities/23/23228.json|jichitai-compare/data/municipalities/23/23425.json|jichitai-compare/data/municipalities/23/23427.json|jichitai-compare/operations/tasks/23201.json|jichitai-compare/operations/tasks/23216.json|jichitai-compare/operations/tasks/23228.json|jichitai-compare/operations/tasks/23425.json|jichitai-compare/operations/tasks/23427.json|jichitai-compare/operations/audits/central-a-housing-classification-batch19-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/23201/index.html|jichitai-compare/municipality/23216/index.html|jichitai-compare/municipality/23228/index.html|jichitai-compare/municipality/23425/index.html|jichitai-compare/municipality/23427/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch19-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第19群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
