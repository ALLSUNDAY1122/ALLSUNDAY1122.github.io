name: Moises HQ Lane1 Privacy Delete Race Diagnostic v6

on:
  push:
    branches:
      - moises/hq-l1-privacy-delete-race-diagnostic-v6
    paths:
      - '.github/workflows/moises-hq-l1-privacy-delete-race-diagnostic-v6.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate local-delete serialization patch locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf 'base=%s\n' "$(git rev-parse HEAD^)" > diagnostics/context.txt
          printf 'workflow_head=%s\n' "$(git rev-parse HEAD)" >> diagnostics/context.txt
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tech-assets/moises-audio/Separation/Server/privacy_retention.py')
          text = source.read_text()
          method = text.index('    def _delete_local_artifacts(self, logical_job_id: str) -> None:')
          start = text.index('        targets = (', method)
          end = text.index('\n\n    def _artifact_directory', start)
          replacement = '''        targets = (
              self._artifact_directory(logical_job_id),
              self._artifact_directory(logical_job_id, suffix=".staging"),
          )
          try:
              with self.resume_cache_manager.lease(logical_job_id) as acquired:
                  if not acquired:
                      raise OrchestratorError("SEP_OUTPUT_RESUME_CACHE_LOCK_FAILED", retryable=True)
                  for target in targets:
                      try:
                          shutil.rmtree(target)
                      except FileNotFoundError:
                          pass
                      except OSError as exc:
                          raise PrivacyRetentionError(
                              "SEP_PRIVACY_LOCAL_DELETE_FAILED", retryable=True
                          ) from exc

                  cache_root = self.resume_cache_manager.cache_root(logical_job_id)
                  if any(target.exists() for target in targets) or cache_root.exists():
                      raise PrivacyRetentionError(
                          "SEP_PRIVACY_LOCAL_DELETE_UNCONFIRMED", retryable=True
                      )
                  if not self.resume_cache_manager.is_deleted(logical_job_id):
                      raise PrivacyRetentionError(
                          "SEP_PRIVACY_LOCAL_DELETE_UNCONFIRMED", retryable=True
                      )
          except OrchestratorError as exc:
              raise PrivacyRetentionError("SEP_PRIVACY_LOCAL_DELETE_FAILED", retryable=True) from exc'''
          source.write_text(text[:start] + replacement + text[end:])
          PY
          python3 -m py_compile tech-assets/moises-audio/Separation/Server/privacy_retention.py
          git diff -- tech-assets/moises-audio/Separation/Server/privacy_retention.py > diagnostics/candidate.patch

      - name: Add isolated serialization regression locally
        shell: bash
        run: |
          set -euo pipefail
          cat > tech-assets/moises-audio/Separation/Tests/test_privacy_retention_delete_serialization_v6.py <<'PYTEST'
          import shutil
          import tempfile
          import threading
          import time
          import unittest
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from unittest import mock

          from privacy_retention import PrivacyRetentionService, audioshake_documented_policy


          class PrivacyRetentionDeleteSerializationV6Tests(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  self.root = Path(self.tmp.name)
                  self.artifacts = self.root / "artifacts"
                  self.registry = self.root / "privacy" / "registry.json"
                  self.now = 1_700_000_000

              def tearDown(self):
                  self.tmp.cleanup()

              def service(self):
                  return PrivacyRetentionService(
                      artifact_root=self.artifacts,
                      registry_path=self.registry,
                      provider=object(),
                      now_epoch=lambda: self.now,
                  )

              def test_concurrent_local_artifact_delete_uses_per_job_lease(self):
                  job = "f" * 32
                  self.service().register(
                      logical_job_id=job,
                      provider_asset_id=None,
                      provider_task_id=None,
                      policy=audioshake_documented_policy(),
                      created_at_epoch=self.now,
                  )
                  directory = self.artifacts / job
                  staging = self.artifacts / f"{job}.staging"
                  for root in (directory, staging):
                      root.mkdir(parents=True, exist_ok=True)
                      for index in range(16):
                          (root / f"stem-{index}.wav").write_bytes(b"audio")

                  barrier = threading.Barrier(10)
                  guard = threading.Lock()
                  active = 0
                  max_active = 0
                  original_rmtree = shutil.rmtree
                  measured = {directory.resolve(), staging.resolve()}

                  def tracked_rmtree(path, *args, **kwargs):
                      nonlocal active, max_active
                      resolved = Path(path).resolve()
                      if resolved not in measured:
                          return original_rmtree(path, *args, **kwargs)
                      with guard:
                          active += 1
                          max_active = max(max_active, active)
                      try:
                          time.sleep(0.01)
                          return original_rmtree(path, *args, **kwargs)
                      finally:
                          with guard:
                              active -= 1

                  class PrivacyShutilProxy:
                      rmtree = staticmethod(tracked_rmtree)

                  def delete(_):
                      barrier.wait()
                      return self.service().request_delete(job, delete_provider=False)

                  with mock.patch("privacy_retention.shutil", PrivacyShutilProxy):
                      with ThreadPoolExecutor(max_workers=10) as pool:
                          list(pool.map(delete, range(10)))

                  self.assertEqual(max_active, 1)
                  self.assertFalse(directory.exists())
                  self.assertFalse(staging.exists())
                  self.assertTrue(self.service().snapshot(job)["localDeleteConfirmed"])


          if __name__ == "__main__":
              unittest.main()
          PYTEST
          python3 -m py_compile tech-assets/moises-audio/Separation/Tests/test_privacy_retention_delete_serialization_v6.py

      - name: Stress existing real race and retain every traceback
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          failures=0
          : > "$GITHUB_WORKSPACE/diagnostics/existing-failures.txt"
          for i in $(seq 1 30); do
            log="$GITHUB_WORKSPACE/diagnostics/existing-${i}.log"
            python3 -m unittest -v test_privacy_retention_concurrency.PrivacyRetentionConcurrencyTests.test_concurrent_delete_reserves_provider_side_effect_once >"$log" 2>&1
            rc=$?
            printf 'iteration=%s rc=%s\n' "$i" "$rc" >> "$GITHUB_WORKSPACE/diagnostics/existing-summary.txt"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
              printf '%s\n' "$i" >> "$GITHUB_WORKSPACE/diagnostics/existing-failures.txt"
            fi
          done
          printf '%s\n' "$failures" > "$GITHUB_WORKSPACE/diagnostics/existing-failure-count.txt"
          exit 0

      - name: Stress isolated serialization regression and retain every traceback
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          failures=0
          : > "$GITHUB_WORKSPACE/diagnostics/isolated-failures.txt"
          for i in $(seq 1 30); do
            log="$GITHUB_WORKSPACE/diagnostics/isolated-${i}.log"
            python3 -m unittest -v test_privacy_retention_delete_serialization_v6.PrivacyRetentionDeleteSerializationV6Tests.test_concurrent_local_artifact_delete_uses_per_job_lease >"$log" 2>&1
            rc=$?
            printf 'iteration=%s rc=%s\n' "$i" "$rc" >> "$GITHUB_WORKSPACE/diagnostics/isolated-summary.txt"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
              printf '%s\n' "$i" >> "$GITHUB_WORKSPACE/diagnostics/isolated-failures.txt"
            fi
          done
          printf '%s\n' "$failures" > "$GITHUB_WORKSPACE/diagnostics/isolated-failure-count.txt"
          exit 0

      - name: Run direct concurrent state harness
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Server:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Evaluation:$GITHUB_WORKSPACE/tech-assets/moises-audio/Separation/Tests${PYTHONPATH:+:$PYTHONPATH}"
          cd "$GITHUB_WORKSPACE/tech-assets/moises-audio"
          python3 - <<'PY' > "$GITHUB_WORKSPACE/diagnostics/direct-harness.log" 2>&1
          import json
          import tempfile
          import threading
          import traceback
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from test_privacy_retention_concurrency import SlowProvider
          from privacy_retention import AtomicPrivacyRegistry, PrivacyRetentionService, audioshake_documented_policy

          failures = 0
          for iteration in range(1, 21):
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  artifacts = root / "artifacts"
                  registry = root / "privacy" / "registry.json"
                  provider = SlowProvider()
                  now = 1_700_000_000
                  job = "b" * 32
                  asset = "asset-b"
                  task = "task-b"

                  def service():
                      return PrivacyRetentionService(
                          artifact_root=artifacts,
                          registry_path=registry,
                          provider=provider,
                          now_epoch=lambda: now,
                      )

                  service().register(
                      logical_job_id=job,
                      provider_asset_id=asset,
                      provider_task_id=task,
                      policy=audioshake_documented_policy(),
                      created_at_epoch=now,
                  )
                  directory = artifacts / job
                  staging = artifacts / f"{job}.staging"
                  directory.mkdir(parents=True, exist_ok=True)
                  (directory / "stem.wav").write_bytes(b"audio")
                  barrier = threading.Barrier(10)

                  def delete_one(index):
                      barrier.wait()
                      try:
                          record = service().request_delete(job, provider_asset_id=asset, provider_task_id=task)
                          return {"index": index, "ok": True, "local": record.local_delete_confirmed}
                      except Exception as exc:
                          return {
                              "index": index,
                              "ok": False,
                              "type": type(exc).__name__,
                              "repr": repr(exc),
                              "code": getattr(exc, "code", None),
                              "retryable": getattr(exc, "retryable", None),
                              "traceback": traceback.format_exc(),
                          }

                  with ThreadPoolExecutor(max_workers=10) as pool:
                      results = list(pool.map(delete_one, range(10)))
                  failed = [item for item in results if not item["ok"]]
                  snapshot = None
                  snapshot_error = None
                  try:
                      snapshot = service().snapshot(job)
                  except Exception as exc:
                      snapshot_error = repr(exc)
                  record = AtomicPrivacyRegistry(registry).get(job)
                  state = {
                      "iteration": iteration,
                      "failed_threads": failed,
                      "provider_asset_calls": provider.asset_calls,
                      "provider_task_calls": provider.task_calls,
                      "normal_exists": directory.exists(),
                      "staging_exists": staging.exists(),
                      "cache_root_exists": service().resume_cache_manager.cache_root(job).exists(),
                      "tombstone": service().resume_cache_manager.is_deleted(job),
                      "snapshot": snapshot,
                      "snapshot_error": snapshot_error,
                      "registry_record": None if record is None else record.to_dict(),
                  }
                  print(json.dumps(state, sort_keys=True, default=str))
                  if failed:
                      failures += 1
          print(json.dumps({"direct_harness_failure_iterations": failures}))
          raise SystemExit(1 if failures else 0)
          PY
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/diagnostics/direct-harness-rc.txt"
          exit 0

      - name: Upload Lane1 race diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane1-privacy-race-diagnostic-v6
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Fail diagnostic if any race reproduced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          existing="$(cat diagnostics/existing-failure-count.txt 2>/dev/null || echo 999)"
          isolated="$(cat diagnostics/isolated-failure-count.txt 2>/dev/null || echo 999)"
          harness="$(cat diagnostics/direct-harness-rc.txt 2>/dev/null || echo 999)"
          echo "existing_failures=$existing isolated_failures=$isolated direct_harness_rc=$harness"
          if [ "$existing" -ne 0 ] || [ "$isolated" -ne 0 ] || [ "$harness" -ne 0 ]; then
            exit 1
          fi
