name: Temporary Central A Housing Batch 21

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch21-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch21-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 21
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T07:36:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const unavailable='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const decisions={
            '24443':{changed:true,type:'replace_with_child_specific_trial_housing_intake_closed',service:{status:'verified',summary:'18歳以下の子がいる世帯等を対象に、令和8年度は家具・家電付きのお試し住宅を月額3万円で貸し付ける。募集は終了している。',details:{program:'令和8年度 大台町お試し住宅事業',target:'大台町への移住を検討し、18歳以下の子が1人以上いる世帯、母子手帳交付者がいる世帯、または将来の子育てを視野に入れ夫婦とも40歳以下の世帯',period:'令和8年4月から令和9年3月まで。短期は1か月未満、長期は1か月以上',rent:'月額3万円。1か月未満は日割り。光熱水費等は入居者負担',housing:'家具・家電付き6LDK、駐車場あり',intakeStatus:'募集期間は令和7年12月15日から令和8年2月13日までで、現時点では募集終了'},source:{url:'https://www.odaitown.jp/soshiki/yakuba/8/4/2_2/2_2_3/3037.html',checkedAt}}},
            '24471':{changed:true,type:'general_vacant_home_support_misclassification',service:{status:'unavailable',summary:unavailable,details:{confirmedGeneralProgram:'空き家バンク成約物件の不要物処理や簡易改修に対し上限10万円を助成する一般的な空き家活用制度を確認した。',classificationReview:'子どもの有無、新婚、三世代同居等を対象要件または加算条件とする現行住宅支援を公式情報で確認できないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.town.taiki.mie.jp/soshiki/somukikaku/gyomu/som_hojo-all/1522.html',checkedAt}}},
            '24561':{changed:true,type:'replace_with_current_newlywed_program',service:{status:'verified',summary:'39歳以下・合計所得500万円未満の新婚世帯へ、令和8年度の住宅取得・賃借・リフォーム・引越費用を上限30万円または60万円補助する。',details:{program:'御浜町結婚新生活支援補助金',target:'令和8年4月1日から令和9年3月31日までに婚姻し、夫婦とも39歳以下、合計所得500万円未満等の要件を満たす世帯',coveredCosts:'住宅取得費、住宅賃借費、リフォーム費、引越費用',amount:'1世帯上限30万円。夫婦とも29歳以下の場合は上限60万円',paymentPeriod:'令和8年4月1日から令和9年3月31日までに支払った対象経費',residence:'対象住宅が御浜町内にあること'},source:{url:'https://www.town.mihama.mie.jp/soshikikarasagasu/kikakuka/kurashinojoho/2/1464.html',checkedAt}}},
            '25201':{changed:false,type:'retained_verified_child_household_reform_addition',review:'令和8年度定住促進リフォーム補助金は、転入世帯に15歳未満の子または出産予定者がいる場合、補助率20％・上限60万円へ拡充され、申請期間は令和8年4月20日から12月28日までと現行公式ページで確認したためverifiedを維持する。'},
            '27204':{changed:true,type:'general_seismic_support_misclassification',service:{status:'unavailable',summary:unavailable,details:{confirmedGeneralProgram:'令和8年度の木造住宅耐震診断・設計・改修補助を確認した。',classificationReview:'旧耐震基準住宅を対象とする一般的な耐震化制度であり、子育て・新婚・三世代世帯固有の対象要件や加算を確認できない。住宅確保要配慮者向け居住支援協議会は相談・入居支援で、子育て世帯向け住宅費補助としては扱わない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.ikeda.osaka.jp/kurashi_tetsuduki/soudan/kenchikubutu/18057.html',checkedAt},additionalSources:[{url:'https://www.city.ikeda.osaka.jp/soshiki/toshiseibibu/toshiseisaku/jutaku/1497512302371.html',checkedAt,description:'住宅確保要配慮者向け居住相談・入居支援'}]}}
          };
          const records=[];
          for(const [code,entry] of Object.entries(decisions)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(entry.changed){municipality.services.housingSupport=entry.service;municipality.updatedAt=checkedAt;fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');}
            const after=entry.changed?entry.service:before;
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;task.researchingCount=statuses.filter(v=>v==='researching').length;task.unavailableCount=statuses.filter(v=>v==='unavailable').length;task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';task.pullRequestNumber=Number(process.env.PR_NUMBER);task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='統括B②';task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第21群で公式情報を独立確認し、${entry.type}として判定。`];task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            records.push({code,name:municipality.name,service:'housingSupport',decisionType:entry.type,changed:entry.changed,beforeStatus:before.status,afterStatus:after.status,beforeSummary:before.summary,afterSummary:after.summary,officialSource:after.source?.url||before.source?.url,review:entry.review||null});
          }
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch21-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:4,retainedNoChangeCount:1,statusToUnavailableCount:2,verifiedReplacementCount:2,decisions:records,causeScan:{previousRemainingCandidates:74,reviewedHighRiskCandidates:5,remainingCandidates:69},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般空き家・耐震制度だけを子育て世帯向け住宅支援として登録しない','新婚世帯向け住宅費支援と子育て世帯向け低廉住宅は、年度・受付状態を明示して記録する','募集終了制度は利用受付終了を明記し、制度内容と現在の受付状態を混同しない'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch21-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.nextAction='一般住宅・移住制度の分類候補残69件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=159;checkpoint.qualityReaudit.primarySourceSlotsRechecked=591;checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=69;
          checkpoint.qualityReaudit.confirmedCorrections.push({type:'child_trial_housing_replacement',code:'24443',service:'housingSupport',name:'大台町'},{type:'general_vacant_home_misclassification',code:'24471',service:'housingSupport',name:'大紀町'},{type:'newlywed_housing_replacement',code:'24561',service:'housingSupport',name:'御浜町'},{type:'general_seismic_misclassification',code:'27204',service:'housingSupport',name:'池田市'});
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残69件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];checkpoint.lastAction='住宅支援分類第21群として、大台町・大紀町・御浜町・大津市・池田市を独立確認し、4件を修正、1件を維持判定した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAHousingBatch={batch:21,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,correctedMunicipalityCount:4,retainedNoChangeCount:1,remainingCandidates:69,regionalPullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),blocker:null};region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch21-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/24/24443.json|jichitai-compare/data/municipalities/24/24471.json|jichitai-compare/data/municipalities/24/24561.json|jichitai-compare/data/municipalities/27/27204.json|jichitai-compare/operations/tasks/24443.json|jichitai-compare/operations/tasks/24471.json|jichitai-compare/operations/tasks/24561.json|jichitai-compare/operations/tasks/25201.json|jichitai-compare/operations/tasks/27204.json|jichitai-compare/operations/audits/central-a-housing-classification-batch21-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/24443/index.html|jichitai-compare/municipality/24471/index.html|jichitai-compare/municipality/24561/index.html|jichitai-compare/municipality/27204/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch21-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第21群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
