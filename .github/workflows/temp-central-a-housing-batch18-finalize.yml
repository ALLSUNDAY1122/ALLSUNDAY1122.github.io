name: Temporary Central A Housing Batch 18 Finalize

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch18-finalize-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-housing-batch18-final-region-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          public_path=jichitai-compare/operations/audits/central-a-housing-classification-batch18-public-verification-20260726.json
          git show "origin/main:$public_path" > "$public_path"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const completedAt='2026-07-26T04:18:00+09:00';
          const decisionPath=path.join(root,'operations/audits/central-a-housing-classification-batch18-decisions-20260726.json');
          const publicPath=path.join(root,'operations/audits/central-a-housing-classification-batch18-public-verification-20260726.json');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const audit=JSON.parse(fs.readFileSync(decisionPath,'utf8'));
          const publicEvidence=JSON.parse(fs.readFileSync(publicPath,'utf8'));
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(!publicEvidence.success)throw new Error('Public verification is not successful');
          audit.regionalMergePullRequestNumber=3775;
          audit.regionalWorkflowRunId=30171029042;
          audit.nationalSyncPullRequestNumber=3777;
          audit.nationalSyncWorkflowRunId=30171144464;
          audit.publicVerificationPullRequestNumber=3779;
          audit.publicVerificationWorkflowRunId=30171263638;
          audit.publicVerificationStatus='passed';
          audit.finalRegionPullRequestNumber=Number(process.env.PR_NUMBER);
          audit.finalRegionWorkflowRunId=Number(process.env.RUN_ID);
          audit.status='completed_public_verified_region_integrated';
          fs.writeFileSync(decisionPath,JSON.stringify(audit,null,2)+'\n');

          checkpoint.updatedAt=completedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残84件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=completedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=3775;
          checkpoint.qualityReaudit.latestCiRunNumber=30171029042;
          checkpoint.qualityReaudit.latestNationalPullRequestNumber=3777;
          checkpoint.qualityReaudit.latestPublicVerificationPullRequestNumber=3779;
          checkpoint.qualityReaudit.latestHousingBatch={batch:18,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:3,verifiedReplacementCount:2,remainingCandidates:84,regionalPullRequestNumber:3775,regionalWorkflowRunId:30171029042,nationalPullRequestNumber:3777,nationalWorkflowRunId:30171144464,publicVerificationPullRequestNumber:3779,publicVerificationWorkflowRunId:30171263638,finalRegionPullRequestNumber:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第18群で内灘町・富加町を2026年度新婚住宅費支援へ差し替え、羽島市・東白川村・西伊豆町をunavailableへ修正した。地域・全国・公開5ページの一致を確認した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=completedAt;region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const resolution={schemaVersion:'1.0.0',resolutionId:'central-a-housing-batch18-resolution-20260726',session:'中日本調査班A',coordinatorSession:'統括B②',completedAt,category:'generalHousingMisclassification',scope:{reviewedMunicipalityCount:5,correctedMunicipalityCount:5,remainingHousingCandidates:84,correctedMunicipalitiesRechecked:144,primarySourceSlotsRechecked:576,weakPrimarySourceCandidates:33,issue3141UnresolvedItems:19},corrections:{statusToUnavailableCount:3,verifiedReplacementCount:2,codes:['17365','21209','21502','21507','22306']},evidence:{regionalPullRequest:3775,regionalWorkflowRunId:30171029042,nationalSyncPullRequest:3777,nationalSyncWorkflowRunId:30171144464,publicVerificationPullRequest:3779,publicVerificationWorkflowRunId:30171263638,finalRegionPullRequest:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID)},publicVerification:{pageCount:5,allPagesHttp200:true,statusSummarySourceMatch:true,publicMunicipalityCount:1741,publicServiceCount:15669},releaseGuard:{status:'resolved_no_release_blocker',blockers:[]},status:'completed_public_verified_region_integrated'};
          const resolutionPath=path.join(root,'operations/quality/central-a-housing-batch18-resolution-20260726.json');
          fs.mkdirSync(path.dirname(resolutionPath),{recursive:true});
          fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch18-finalize-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Remove regional runners and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-central-a-housing-batch18.yml .github/workflows/temp-central-a-housing-batch18-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援第18群を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
