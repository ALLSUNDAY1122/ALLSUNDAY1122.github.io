name: Otsu4 Content Audit

on:
  pull_request:
    paths:
      - 'kikenbutsu-otsu4-sprint/**'
      - 'tools/otsu4-build-content-v2.mjs'
      - 'tools/otsu4-build-content-v3.mjs'
      - 'tools/otsu4-apply-difficulty-hardening.mjs'
      - 'tools/otsu4-difficulty-audit.mjs'
      - 'tools/otsu4-difficulty-audit-v3.mjs'
      - '.github/workflows/otsu4-content-audit.yml'
  push:
    branches: [ main, feat/otsu4-360-productization ]
    paths:
      - 'kikenbutsu-otsu4-sprint/**'
      - 'tools/otsu4-build-content-v2.mjs'
      - 'tools/otsu4-build-content-v3.mjs'
      - 'tools/otsu4-apply-difficulty-hardening.mjs'
      - 'tools/otsu4-difficulty-audit.mjs'
      - 'tools/otsu4-difficulty-audit-v3.mjs'
      - '.github/workflows/otsu4-content-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Foundation-only notice
        if: ${{ hashFiles('tools/otsu4-build-content-v3.mjs') == '' }}
        run: echo 'Otsu4 final product files are not present yet; audit will run on the product PR.'
      - name: Validate audited final 720-question bank
        if: ${{ hashFiles('tools/otsu4-build-content-v3.mjs') != '' }}
        run: node tools/otsu4-build-content-v3.mjs --check
      - name: Generate native 720-question JSON
        if: ${{ hashFiles('tools/otsu4-build-content-v3.mjs') != '' }}
        run: node tools/otsu4-build-content-v3.mjs
      - name: Apply deterministic exam-difficulty hardening
        if: ${{ hashFiles('tools/otsu4-apply-difficulty-hardening.mjs') != '' }}
        run: node tools/otsu4-apply-difficulty-hardening.mjs
      - name: Final exam-level difficulty and six-mock gate
        if: ${{ hashFiles('tools/otsu4-difficulty-audit-v3.mjs') != '' }}
        run: node tools/otsu4-difficulty-audit-v3.mjs
      - name: Upload native question JSON
        if: ${{ hashFiles('tools/otsu4-build-content-v3.mjs') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: otsu4-questions-final-720
          path: kikenbutsu-otsu4-sprint/questions.generated.json
          if-no-files-found: error
          retention-days: 30
