name: Temporary North Release 10 1137

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-north-release-10-1137.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed snapshot
        run: |
          set -euxo pipefail
          TARGET='coord/north-release-10-20260722-1137'
          SOURCE='9a207d7429003cf9d0788f8bab28a8a8248d864f'
          git fetch origin "$TARGET" region/north main
          git checkout "$TARGET"
          codes='01520 01545 01546 01547 01549 01550 01552 01555 01559 01560'
          for code in $codes; do
            pref=${code:0:2}
            mkdir -p "jichitai-compare/data/municipalities/$pref" jichitai-compare/operations/tasks
            git show "$SOURCE:jichitai-compare/data/municipalities/$pref/$code.json" > "jichitai-compare/data/municipalities/$pref/$code.json"
            git show "$SOURCE:jichitai-compare/operations/tasks/$code.json" > "jichitai-compare/operations/tasks/$code.json"
          done
          changed=$(git status --short | wc -l)
          test "$changed" -eq 20
          git add jichitai-compare/data/municipalities jichitai-compare/operations/tasks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 北日本追加10自治体の固定スナップショット'
          git push origin "$TARGET"
          git checkout main
          git pull --ff-only origin main
          rm .github/workflows/temp-north-release-10-1137.yml
          git add .github/workflows/temp-north-release-10-1137.yml
          git commit -m '統括管理: 北日本固定スナップショット一時処理を削除'
          git push origin main
