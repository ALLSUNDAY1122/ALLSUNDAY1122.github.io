name: Touhan Source-Order Unattached Ruby 102 Promotion
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/promote_ordered_unattached_ruby_102.py'
      - '.github/workflows/touhan-ruby-102-source-order.yml'
permissions:
  contents: write
concurrency:
  group: touhan-ruby-102-source-order
  cancel-in-progress: false
jobs:
  ordered-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and Chrome audit environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk fontconfig
          sudo fc-cache -f
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.5' 'playwright==1.56.0' 'pillow==11.3.0'
          python -m py_compile touroku-hanbaisha-sprint/official-kansai/promote_ordered_unattached_ruby_102.py touroku-hanbaisha-sprint/official-kansai/test_source_order_102_ui.py
          google-chrome --version
      - name: Promote only PDF-verified unattached source-order ruby
        run: python touroku-hanbaisha-sprint/official-kansai/promote_ordered_unattached_ruby_102.py
      - name: Exercise actual practice UI in 375 and 430px Chrome
        run: python touroku-hanbaisha-sprint/official-kansai/test_source_order_102_ui.py
      - name: Check canonical count, evidence and blocked release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          report=json.loads((b/'RUBY_102_SOURCE_ORDER_PROMOTION_20261124.json').read_text())
          qa=json.loads((b/'RUBY_102_SOURCE_ORDER_BROWSER_QA_20261124.json').read_text())
          status=json.loads(Path('touroku-hanbaisha-ios/release-status.json').read_text())
          assert report['sourceHolds']==102 and report['promoted']+report['held']+report.get('alreadyApproved',0)==102
          assert bank['count']==report['canonicalCount']==status['question_bank']['production_official_bank_count']
          assert len(bank['questions'])==len(bank['approvedIds'])==len(set(bank['approvedIds']))==bank['count']
          assert 'KSAI-2023-090' not in bank['approvedIds']
          assert qa['result']=='PASS' and qa['productionBankLoaded']==bank['count']
          assert qa['browserCases']==2*report['promoted']
          assert status['release_gate']=='BLOCKED' and status['app_review_submitted']==False
          assert all((r['status'] in ('SOURCE_ORDER_PASS','ALREADY_APPROVED'))==(not r['reasons']) for r in report['records'])
          print('PASS source-order promotions',report['promoted'],'held',report['held'],'canonical',bank['count'])
          PY
      - name: Commit canonical bank and both release statuses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json
          git add -f touroku-hanbaisha-sprint/official-kansai/RUBY_102_SOURCE_ORDER_PROMOTION_20261124.json
          git add -f touroku-hanbaisha-sprint/official-kansai/RUBY_102_SOURCE_ORDER_BROWSER_QA_20261124.json
          git add touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit(touhan): promote verified unattached source-ordered rubies and reconcile bank'
            for retry in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-source-ordered-ruby-102-evidence
          path: |
            touroku-hanbaisha-sprint/official-kansai/RUBY_102_SOURCE_ORDER_PROMOTION_20261124.json
            touroku-hanbaisha-sprint/official-kansai/RUBY_102_SOURCE_ORDER_BROWSER_QA_20261124.json
          if-no-files-found: ignore
