name: Temporary Central A Housing Batch 19 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch19-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch19-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const summary='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const targets=[
            {code:'23201',name:'豊橋市',status:'unavailable',summary,source:'https://www.city.toyohashi.lg.jp/37006.htm'},
            {code:'23216',name:'常滑市',status:'unavailable',summary,source:'https://www.city.tokoname.aichi.jp/kurashi/sumai/1003159/1007062.html'},
            {code:'23228',name:'岩倉市',status:'unavailable',summary,source:'https://www.city.iwakura.aichi.jp/0000006017.html'},
            {code:'23425',name:'蟹江町',status:'unavailable',summary,source:'https://www.town.kanie.aichi.jp/soshiki/14/taishin-kaishu.html'},
            {code:'23427',name:'飛島村',status:'unavailable',summary,source:'https://www.vill.tobishima.aichi.jp/kurashi/seikatsu/1001687/1001688/1003104.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch19Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const statusMatches=html.includes('公式情報で詳細未確認')||html.includes('利用可能な制度情報を確認できません')||html.includes('未確認');
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch19Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>item.code===target.code);
                const service=municipality?.services?.housingSupport;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch19-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3785,nationalSyncPullRequest:3787,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:5,expectedVerifiedCount:0,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch19-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch19-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第19群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
