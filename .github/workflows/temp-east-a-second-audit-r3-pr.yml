name: Temporary East A Second Audit Round 3 PR Runner

on:
  pull_request:
    branches:
      - region/east
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/east-a-second-quality-20260725-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect completed or diagnosed run
        id: detect
        shell: bash
        run: |
          SCRIPT=jichitai-compare/operations/scripts/patch-east-a-second-audit-r3.py
          DIAG=jichitai-compare/operations/audits/east-a-second-audit-r3-validation.log
          if [[ -f "$SCRIPT" && ! -f "$DIAG" ]]; then
            echo "run_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_patch=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.run_patch == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.run_patch == 'true'
        with:
          node-version: '24'
      - name: Apply, regenerate, validate, and preserve diagnostics
        if: steps.detect.outputs.run_patch == 'true'
        shell: bash
        run: |
          set +e
          python jichitai-compare/operations/scripts/patch-east-a-second-audit-r3.py
          PATCH_STATUS=$?
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('jichitai-compare/operations/tasks/19202.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          supplemental = 'https://www.city.fujiyoshida.yamanashi.jp/site/kosodate/2732.html'
          data['officialSources'] = [url for url in data.get('officialSources', []) if url != supplemental]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          NORMALIZE_STATUS=$?
          LOG="$GITHUB_WORKSPACE/jichitai-compare/operations/audits/east-a-second-audit-r3-validation.log"
          : > "$LOG"
          cd jichitai-compare
          npm run generate >> "$LOG" 2>&1
          GENERATE_STATUS=$?
          npm run progress >> "$LOG" 2>&1
          PROGRESS_STATUS=$?
          npm run validate:generated >> "$LOG" 2>&1
          VALIDATE_STATUS=$?
          cd "$GITHUB_WORKSPACE"
          printf '\npatch=%s normalize=%s generate=%s progress=%s validate=%s\n' "$PATCH_STATUS" "$NORMALIZE_STATUS" "$GENERATE_STATUS" "$PROGRESS_STATUS" "$VALIDATE_STATUS" >> "$LOG"
          cat "$LOG"

          STATUS=0
          for CODE in "$PATCH_STATUS" "$NORMALIZE_STATUS" "$GENERATE_STATUS" "$PROGRESS_STATUS" "$VALIDATE_STATUS"; do
            if [[ "$CODE" -ne 0 ]]; then STATUS=1; fi
          done

          if [[ "$STATUS" -eq 0 ]]; then
            rm -f "$LOG"
            rm -f .github/workflows/east-a-second-audit-r3.yml
            rm -f jichitai-compare/operations/scripts/patch-east-a-second-audit-r3.py
            rm -f jichitai-compare/operations/triggers/east-a-second-audit-r3.txt
            COMMIT_MESSAGE="fix: apply East A second audit round 3 corrections"
          else
            COMMIT_MESSAGE="audit: capture East A round 3 validation failure"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MESSAGE"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          exit 0
