name: Temporary North B Fiscal Anyone Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-fiscal-anyone-fixes.yml'

permissions:
  contents: write

concurrency:
  group: north-b-fiscal-anyone-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply confirmed corrections
        run: node jichitai-compare/scripts/temp-north-b-fiscal-anyone-fixes.mjs

      - name: Regenerate and validate public data
        id: validation
        working-directory: jichitai-compare
        shell: bash
        run: |
          set +e
          npm run generate 2>&1 | tee /tmp/north-b-generate.log
          generate_status=${PIPESTATUS[0]}
          npm run progress 2>&1 | tee /tmp/north-b-progress.log
          progress_status=${PIPESTATUS[0]}
          npm run validate:generated 2>&1 | tee /tmp/north-b-validate.log
          validate_status=${PIPESTATUS[0]}
          status=0
          if [ "$generate_status" -ne 0 ] || [ "$progress_status" -ne 0 ] || [ "$validate_status" -ne 0 ]; then
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-b-fiscal-anyone-validation
          path: |
            /tmp/north-b-generate.log
            /tmp/north-b-progress.log
            /tmp/north-b-validate.log
          if-no-files-found: warn

      - name: Commit corrected data and generated outputs
        if: steps.validation.outputs.status == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-fiscal-anyone-triage-20260725.json \
                  jichitai-compare/data/generated \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/municipality \
                  jichitai-compare/sitemap.xml
          if git diff --cached --quiet; then
            echo 'No corrections to commit.'
            exit 1
          fi
          git commit -m 'fix: 北日本B旧年度・誰でも通園の確定不整合を修正 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
