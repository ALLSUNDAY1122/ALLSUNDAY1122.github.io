name: Touhan Q7 Start Codemagic Auto Provisioned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-q7-autoprovision-start.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request separate auto-provisioning App Store signed-IPA only
        id: start
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python -m pip install PyYAML==6.0.2
          cat >/tmp/touhan-q7-auto.json <<'JSON'
          {"request_id":"touhan-q7-envsigning-fixnum-20261124","action":"build","app_id":"6a769d81a1add9d06020b524","repository":"ALLSUNDAY1122/ALLSUNDAY1122.github.io","workflow_id":"touhan-q7-auto-provision","branch":"main","wait":false}
          JSON
          python scripts/codemagic_build_gateway.py --command /tmp/touhan-q7-auto.json --output touroku-hanbaisha-ios/Q7_AUTO_PROVISION_ENV_ATTEMPT2_START_20261124.json
      - name: Persist start status and manual gate if blocked
        if: always()
        env:
          START_RESULT: ${{ steps.start.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('touroku-hanbaisha-ios')
          p=b/'Q7_AUTO_PROVISION_ENV_ATTEMPT2_START_20261124.json'
          d=json.loads(p.read_text()) if p.exists() else {'ok':False,'error':'No start record'}
          d['githubRunId']=int(os.environ['RUN_ID'])
          d['startStepResult']=os.environ['START_RESULT']
          d['signedIpaStatus']='NOT_VERIFIED'
          d['testflightUploaded']=False;d['appReviewSubmitted']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          f=b/'release-status.json';s=json.loads(f.read_text())
          s['q7_env_signing_attempt2_20261124']={'start':'STARTED' if d.get('ok') else 'FAILED',
            'buildId':d.get('build_id'),'signing':'NOT_VERIFIED',
            'evidence':'touroku-hanbaisha-ios/Q7_AUTO_PROVISION_ENV_ATTEMPT2_START_20261124.json',
            'githubRunId':d['githubRunId']}
          s['gates']['internal_testflight']='Q7_AUTO_PROVISION_RUNNING' if d.get('ok') else 'Q7_AUTO_PROVISION_START_FAILED'
          s['release_gate']='BLOCKED';s['app_review_submitted']=False
          f.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          m=b/'RELEASE_STATUS.md'
          m.write_text(m.read_text()+f"\n\n## Q7自動プロビジョニング試行（2026-11-24）\n- 結果: {d.get('ok')} / build ID: {d.get('build_id','なし')}、署名完了は未実測。\n- CodemagicによるIOS_APP_STOREプロファイル取得/必要時生成を試行。署名付きIPAのみが対象でASCアップロード・本審査送信はなし。\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-ios/Q7_AUTO_PROVISION_ENV_ATTEMPT2_START_20261124.json touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          git commit -m 'audit(touhan): record Codemagic auto-provision signing start' || true
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; done
          exit 1
