name: APP2-007 Privacy API Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-PRIVACY-API-PROBE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - name: Probe JWT data-usage endpoints read-only
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json, os, urllib.error, urllib.request
          from app_store_connect_api import BASE_URL, load_private_key, make_token
          app='6799755566'
          key, cleanup=load_private_key()
          try:
            token=make_token(os.environ['ASC_ISSUER_ID'],os.environ['ASC_KEY_ID'],key)
            paths=[
              f'/v1/appDataUsages?filter[app]={app}&limit=10',
              '/v1/appDataUsageDataProtections?limit=20',
              '/v1/appDataUsageCategories?limit=20',
              '/v1/appDataUsagePurposes?limit=20',
              f'/v1/apps/{app}/dataUsagePublishState',
            ]
            out={}
            for path in paths:
              req=urllib.request.Request(BASE_URL+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode('utf-8','replace')
                  parsed=json.loads(raw) if raw else {}
                  data=parsed.get('data') if isinstance(parsed,dict) else None
                  out[path]={'status':r.status,'data_type':type(data).__name__,'count':len(data) if isinstance(data,list) else (1 if isinstance(data,dict) else 0)}
              except urllib.error.HTTPError as e:
                raw=e.read().decode('utf-8','replace')
                try:
                  p=json.loads(raw); err=(p.get('errors') or [{}])[0]
                  out[path]={'status':e.code,'code':err.get('code'),'title':err.get('title'),'detail':err.get('detail')}
                except Exception:
                  out[path]={'status':e.code,'error':raw[:500]}
            open('/tmp/privacy-probe.json','w').write(json.dumps(out,ensure_ascii=False))
            print(json.dumps(out,ensure_ascii=False))
          finally:
            if cleanup: cleanup.unlink(missing_ok=True)
          PY
      - name: Report
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('/tmp/privacy-probe.json','utf8'));
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'APP2-007 Privacy JWT API probe (read-only):\n```json\n'+JSON.stringify(d,null,2)+'\n```'});
