name: Temporary West A Housing 38 Final Main Sync Rebased

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-housing-38-final-main-sync-rebased-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-a-housing-38-final-checkpoint-rebased-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Copy final regional records onto latest main
        shell: bash
        env:
          FINAL_MAIN_SYNC_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euxo pipefail
          git fetch origin region/west
          paths=(
            jichitai-compare/operations/audits/west-a-housing-classification-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-a-housing-high-risk-summary-20260725.json
            jichitai-compare/operations/audits/west-a-housing-classification-correction-plan-20260725.json
            jichitai-compare/operations/audits/west-a-housing-classification-29-corrections-20260725.json
            jichitai-compare/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json
            jichitai-compare/operations/audits/west-a-housing-classification-38-public-verification-20260725.json
            jichitai-compare/operations/audits/west-a-housing-classification-38-public-summary-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-a.json
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/region/west:$path" > "$path"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const prNumber = Number(process.env.FINAL_MAIN_SYNC_PR_NUMBER);
          const checkpointPath = `${root}/operations/control/session-checkpoints/west-a-housing-classification-crosscheck-20260725.json`;
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.evidence.supersededMainSyncPullRequestNumber = 3515;
          checkpoint.evidence.finalMainSyncPullRequestNumber = prNumber;
          checkpoint.evidence.finalMainSyncStatus = 'clean_ci_pending';
          checkpoint.evidence.finalMainSyncPreparedAt = '2026-07-25T15:27:00+09:00';
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');

          const sessionPath = `${root}/operations/control/session-checkpoints/west-a.json`;
          const session = JSON.parse(fs.readFileSync(sessionPath, 'utf8'));
          session.housingClassificationCrosscheck = {
            ...(session.housingClassificationCrosscheck ?? {}),
            supersededMainSyncPullRequestNumber: 3515,
            finalMainSyncPullRequestNumber: prNumber,
            finalMainSyncStatus: 'clean_ci_pending'
          };
          fs.writeFileSync(sessionPath, JSON.stringify(session, null, 2) + '\n');
          NODE

          rm -f jichitai-compare/operations/control/west-a-housing-38-final-main-sync-rebased-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-38-final-main-sync-rebased.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}" \
                  jichitai-compare/operations/control/west-a-housing-38-final-main-sync-rebased-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-38-final-main-sync-rebased.yml
          git diff --cached --check
          git commit -m 'sync: 西日本A住宅支援38件の最終checkpointを最新mainへ反映'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
