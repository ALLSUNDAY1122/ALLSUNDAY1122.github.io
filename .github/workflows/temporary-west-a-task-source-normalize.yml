name: Temporary West A Task Source Normalize

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-task-source-normalize-trigger-20260725.json

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'fix/west-a-post-final-independent-sample-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize task primary sources
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const definitions = JSON.parse(fs.readFileSync(`${root}/data/service-definitions.json`, 'utf8'));
          const serviceIds = definitions.services.map((item) => item.id);
          for (const code of ['37203', '39210', '43215']) {
            const municipalityPath = `${root}/data/municipalities/${code.slice(0,2)}/${code}.json`;
            const taskPath = `${root}/operations/tasks/${code}.json`;
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const taskRaw = fs.readFileSync(taskPath, 'utf8');
            const task = JSON.parse(taskRaw);
            task.officialSources = [...new Set(serviceIds
              .map((id) => municipality.services[id])
              .filter((service) => ['verified', 'unavailable'].includes(service?.status))
              .map((service) => service?.source?.url)
              .filter((url) => typeof url === 'string' && url.startsWith('https://')))];
            const pretty = taskRaw.includes('\n  "');
            fs.writeFileSync(taskPath, JSON.stringify(task, null, pretty ? 2 : 0) + (pretty ? '\n' : ''));
          }
          NODE
          rm -f jichitai-compare/operations/control/west-a-task-source-normalize-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-task-source-normalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/tasks/37203.json \
                  jichitai-compare/operations/tasks/39210.json \
                  jichitai-compare/operations/tasks/43215.json \
                  jichitai-compare/operations/control/west-a-task-source-normalize-trigger-20260725.json \
                  .github/workflows/temporary-west-a-task-source-normalize.yml
          git diff --cached --check
          git commit -m 'fix: 西日本A抜き取りtask主出典を正規化'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
