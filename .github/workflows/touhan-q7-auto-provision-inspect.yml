name: Touhan Q7 Inspect Automatic Signing Read Only
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-q7-auto-provision-inspect.yml'
      - 'touroku-hanbaisha-ios/scripts/inspect_q7_auto_provision.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read signed IPA auto provision result
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: python touroku-hanbaisha-ios/scripts/inspect_q7_auto_provision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-q7-auto-provision-result
          path: touroku-hanbaisha-ios/Q7_ENV_SIGNING_RESULT_20261124.json
          if-no-files-found: ignore
