name: Temporary West B PR3360 Regression Fix

on:
  pull_request_target:
    branches:
      - region/west
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - jichitai-compare/operations/control/west-b-pr3360-regression-fix-trigger.json

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/west-four-source-blockers-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-four-source-blockers-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh after coordinator runner
        shell: bash
        run: |
          sleep 75
          git fetch origin fix/west-four-source-blockers-20260725
          git reset --hard origin/fix/west-four-source-blockers-20260725
      - name: Restore direct child medical source and audit evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const municipalityPath = 'jichitai-compare/data/municipalities/45/45402.json';
          const municipality = read(municipalityPath);
          municipality.services.childMedical = {
            status: 'verified',
            summary: '18歳到達後最初の年度末まで入院・外来・調剤の保険診療自己負担なし',
            eligibility: { minAgeMonths: 0, maxAgeYears: 18 },
            details: {
              target: '新富町に住所がある乳幼児、小中学生、高校生等（18歳到達後最初の3月31日まで）',
              coverage: '保険診療の入院・外来・調剤に係る自己負担額',
              copay: '2023年1月1日以降、自己負担なし',
              application: '子ども医療費受給資格登録申請と資格証交付申請が必要',
              exclusion: '予防接種、入院時食事代等の保険外費用、高額療養費・附加給付等は対象外'
            },
            source: {
              url: 'https://www.town.shintomi.lg.jp/item/1600.htm',
              checkedAt: '2026-07-25'
            },
            additionalSources: [
              {
                url: 'https://www.town.shintomi.lg.jp/soshiki/zeisei/gyomu/1_1/586.html',
                checkedAt: '2026-07-25'
              }
            ]
          };
          write(municipalityPath, municipality);

          const taskPath = 'jichitai-compare/operations/tasks/45402.json';
          const task = read(taskPath);
          task.currentBranch = 'fix/west-four-source-blockers-20260725';
          task.officialSources = [...new Set([
            'https://www.town.shintomi.lg.jp/item/1600.htm',
            ...task.officialSources.filter((url) => url !== 'https://www.town.shintomi.lg.jp/item/1600.htm')
          ])];
          task.lastUpdatedAt = '2026-07-25T13:40:00+09:00';
          task.lastUpdatedBy = '西日本調査班B';
          task.notes = Array.isArray(task.notes) ? task.notes : [];
          const badNote = '2026-07-25: 旧子ども医療費ページ404のため、現行基金ページと現行申請書へ出典更新し、live公式情報で確認できる範囲へ説明を整理。';
          task.notes = task.notes.filter((note) => note !== badNote);
          const note = '2026-07-25: item/1600.htmの現行直接制度ページで18歳年度末・入院外来調剤0円・申請条件を再確認。基金ページは補足出典として維持。';
          if (!task.notes.includes(note)) task.notes.push(note);
          write(taskPath, task);

          const auditPath = 'jichitai-compare/operations/audits/west-four-source-blockers-regional-fix-20260725.json';
          const audit = read(auditPath);
          const item = audit.changes.find((entry) => entry.code === '45402' && entry.service === 'childMedical');
          if (!item) throw new Error('45402 childMedical audit entry missing');
          const service = municipality.services.childMedical;
          item.before = JSON.parse(JSON.stringify(service));
          item.after = JSON.parse(JSON.stringify(service));
          item.alreadyResolvedBy = {
            mainPullRequest: 3333,
            mainCiRun: 8111,
            regionPullRequest: 3340,
            regionCiRun: 8121,
            publicVerification: 'passed'
          };
          item.note = '利用者向け直接制度ページを主出典として維持。基金ページは制度財源の補足出典。';
          audit.generatedAt = new Date().toISOString();
          write(auditPath, audit);

          const requestPath = 'jichitai-compare/operations/audits/west-four-source-blockers-regional-validation-request-20260725.json';
          const request = read(requestPath);
          request.checks = request.checks.map((check) => check === '新富町 current child-medical official sources' ? '新富町 item/1600.htm direct child-medical page retained; fund page supplemental' : check);
          write(requestPath, request);
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit regression prevention
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: PR3360の新富町子ども医療退行を防止"
          git push origin HEAD:fix/west-four-source-blockers-20260725
