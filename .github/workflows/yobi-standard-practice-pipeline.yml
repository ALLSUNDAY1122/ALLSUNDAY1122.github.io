name: Yobi Standard Practice Pipeline

on:
  pull_request:
    paths:
      - 'learning-sprint/yobi-tantou/content-loop/questions.practice.release.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/questions.standard.candidates.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/standard-source-locks.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/standard-answer-audit.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json'
      - 'learning-sprint/yobi-tantou/content-loop/audit_candidate_sources.py'
      - 'learning-sprint/yobi-tantou/content-loop/audit_candidate_answers.py'
      - 'learning-sprint/yobi-tantou/content-loop/stage_practice_release_candidates.py'
      - 'learning-sprint/yobi-tantou/content-loop/audit_practice_release_quality.py'
      - 'learning-sprint/yobi-tantou/content-loop/promote_practice_release.py'
      - 'learning-sprint/yobi-tantou/content-loop/combine_practice_release.py'
      - 'learning-sprint/yobi-tantou/content-loop/build_native_release.py'
      - 'learning-sprint/yobi-tantou/ios/Resources/questions.release.json'
      - '.github/workflows/yobi-standard-practice-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yobi-standard-practice-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-standard-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard candidate preflight
        run: >-
          python learning-sprint/yobi-tantou/content-loop/validate_candidates.py
          learning-sprint/yobi-tantou/content-loop/questions.standard.candidates.v1.json
      - name: Standard exact-date statutory source audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_candidate_sources.py
          --bank learning-sprint/yobi-tantou/content-loop/questions.standard.candidates.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/standard-source-locks.v1.json
      - name: Standard answer and explanation audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_candidate_answers.py
          --bank learning-sprint/yobi-tantou/content-loop/questions.standard.candidates.v1.json
          --audit learning-sprint/yobi-tantou/content-loop/standard-answer-audit.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/standard-source-locks.v1.json
      - name: Build non-release standard staging
        run: >-
          python learning-sprint/yobi-tantou/content-loop/stage_practice_release_candidates.py
          --candidates learning-sprint/yobi-tantou/content-loop/questions.standard.candidates.v1.json
          --locks learning-sprint/yobi-tantou/content-loop/standard-source-locks.v1.json
          --answers learning-sprint/yobi-tantou/content-loop/standard-answer-audit.v1.json
          --output learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json
      - name: Standard editorial quality release audit
        run: >-
          python learning-sprint/yobi-tantou/content-loop/audit_practice_release_quality.py
          --input learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json
          --report learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json
          --require-pass
      - name: Promote standard practice only after clean PASS
        run: >-
          python learning-sprint/yobi-tantou/content-loop/promote_practice_release.py
          --staging learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json
          --quality learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json
          --output learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json
      - name: Combine audited foundation and standard tiers
        run: >-
          python learning-sprint/yobi-tantou/content-loop/combine_practice_release.py
          --tier foundation=learning-sprint/yobi-tantou/content-loop/questions.practice.release.v1.json
          --tier standard=learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json
          --output learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
      - name: Build native 28-question formal practice bank
        run: >-
          python learning-sprint/yobi-tantou/content-loop/build_native_release.py
          learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
          learning-sprint/yobi-tantou/ios/Resources/questions.release.json
      - name: Verify combined release invariants
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('learning-sprint/yobi-tantou/content-loop')
          staging = json.loads((root / 'practice-standard-staging.v1.json').read_text())
          quality = json.loads((root / 'practice-standard-quality-audit.v1.json').read_text())
          standard = json.loads((root / 'questions.standard.release.v1.json').read_text())
          combined = json.loads((root / 'questions.practice.combined.v1.json').read_text())
          native = json.loads(Path('learning-sprint/yobi-tantou/ios/Resources/questions.release.json').read_text())
          assert len(staging) == len(standard) == 14
          assert quality['checkedAt'] == '2026-08-14'
          assert quality['overallVerdict'] == 'PASS'
          assert quality['summary'] == {'total': 14, 'pass': 14, 'hold': 0, 'nearDuplicatePairs': 0}
          assert len(combined) == len(native) == 28
          assert Counter(q['difficulty'] for q in combined) == Counter({'foundation': 14, 'standard': 14})
          assert Counter(q['difficulty'] for q in native) == Counter({'foundation': 14, 'standard': 14})
          assert all(q['content_use'] == 'practice' and q['release_eligible'] is True for q in combined)
          assert all(q.get('exam_year') is None for q in combined)
          assert all(q['contentUse'] == 'practice' and q['releaseEligible'] is True for q in native)
          assert all(q.get('examYear') is None for q in native)
          assert len({q['id'] for q in combined}) == 28
          assert len({q['id'] for q in native}) == 28
          assert len({q['subject'] for q in combined}) == 7
          print('PASS: 28 formal practice items = foundation14 + standard14; 7 subjects; official mock isolation intact')
          PY
      - name: Release pipeline script self-tests
        run: |
          python learning-sprint/yobi-tantou/content-loop/combine_practice_release.py --self-test
          python learning-sprint/yobi-tantou/content-loop/build_native_release.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: yobi-standard-practice-release
          path: |
            learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json
            learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json
            learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json
            learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json
            learning-sprint/yobi-tantou/ios/Resources/questions.release.json
          if-no-files-found: error
      - name: Persist audited practice canonical files to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          GENERATED="$RUNNER_TEMP/yobi-standard-generated"
          mkdir -p "$GENERATED/content-loop" "$GENERATED/Resources"
          cp learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json "$GENERATED/content-loop/"
          cp learning-sprint/yobi-tantou/ios/Resources/questions.release.json "$GENERATED/Resources/"

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp "$GENERATED/content-loop/practice-standard-staging.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/practice-standard-quality-audit.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/questions.standard.release.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/content-loop/questions.practice.combined.v1.json" learning-sprint/yobi-tantou/content-loop/
          cp "$GENERATED/Resources/questions.release.json" learning-sprint/yobi-tantou/ios/Resources/
          git add \
            learning-sprint/yobi-tantou/content-loop/practice-standard-staging.v1.json \
            learning-sprint/yobi-tantou/content-loop/practice-standard-quality-audit.v1.json \
            learning-sprint/yobi-tantou/content-loop/questions.standard.release.v1.json \
            learning-sprint/yobi-tantou/content-loop/questions.practice.combined.v1.json \
            learning-sprint/yobi-tantou/ios/Resources/questions.release.json

          if git diff --cached --quiet; then
            echo 'PASS: committed 28-question practice canonical already matches regenerated output.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(yobi): persist 28-question audited practice bank'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
