name: Temporary North B Anyone Single Gap Batch 6 Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch6-region-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout regional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import confirmed files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            jichitai-compare/data/municipalities/06/06302.json \
            jichitai-compare/data/municipalities/06/06321.json \
            jichitai-compare/data/municipalities/06/06323.json \
            jichitai-compare/data/municipalities/06/06341.json \
            jichitai-compare/data/municipalities/06/06361.json \
            jichitai-compare/data/municipalities/06/06382.json \
            jichitai-compare/data/municipalities/06/06402.json \
            jichitai-compare/operations/tasks/06302.json \
            jichitai-compare/operations/tasks/06321.json \
            jichitai-compare/operations/tasks/06323.json \
            jichitai-compare/operations/tasks/06341.json \
            jichitai-compare/operations/tasks/06361.json \
            jichitai-compare/operations/tasks/06382.json \
            jichitai-compare/operations/tasks/06402.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch6-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json

      - name: Validate imported regional data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit synchronization
        shell: bash
        run: |
          rm .github/workflows/temp-north-b-anyone-single-gap-batch6-region-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch6-region-sync.yml \
                     jichitai-compare/data/municipalities/06/06302.json \
                     jichitai-compare/data/municipalities/06/06321.json \
                     jichitai-compare/data/municipalities/06/06323.json \
                     jichitai-compare/data/municipalities/06/06341.json \
                     jichitai-compare/data/municipalities/06/06361.json \
                     jichitai-compare/data/municipalities/06/06382.json \
                     jichitai-compare/data/municipalities/06/06402.json \
                     jichitai-compare/operations/tasks/06302.json \
                     jichitai-compare/operations/tasks/06321.json \
                     jichitai-compare/operations/tasks/06323.json \
                     jichitai-compare/operations/tasks/06341.json \
                     jichitai-compare/operations/tasks/06361.json \
                     jichitai-compare/operations/tasks/06382.json \
                     jichitai-compare/operations/tasks/06402.json \
                     jichitai-compare/operations/audits/north-b-anyone-single-gap-batch6-review-20260725.json \
                     jichitai-compare/operations/control/session-checkpoints/north-b.json
          git commit -m 'sync: 北日本B誰でも通園単一条件第6群をregion/northへ反映'
          git push origin HEAD:"${{ github.head_ref }}"
