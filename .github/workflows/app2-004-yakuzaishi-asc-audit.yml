name: APP2-004 Pharmacist ASC Audit

on:
  push:
    branches: [main]
    paths:
      - automation/app2-004-yakuzaishi-asc-audit-command.json

permissions:
  contents: write

concurrency:
  group: app2-004-yakuzaishi-asc-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit pharmacist App Store Connect state
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_004_yakuzaishi_asc_audit.py
      - name: Persist APP2-004 ASC audit
        run: |
          set -euo pipefail
          cp automation/app2-004-yakuzaishi-asc-final.json /tmp/app2-004-yakuzaishi-asc-final.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp /tmp/app2-004-yakuzaishi-asc-final.json automation/app2-004-yakuzaishi-asc-final.json
          git add automation/app2-004-yakuzaishi-asc-final.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist APP2-004 App Store Connect audit"
            git push origin HEAD:main
          fi
