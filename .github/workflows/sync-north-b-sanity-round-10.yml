name: Temporary main sync for North-B final audit

on:
  push:
    branches:
      - 'coord/sync-north-b-sanity-round-10-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[north-b-round10-main-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync regional final audit
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/06/06367.json \
            jichitai-compare/data/municipalities/06/06382.json \
            jichitai-compare/data/municipalities/06/06403.json \
            jichitai-compare/data/municipalities/06/06426.json \
            jichitai-compare/operations/tasks/06367.json \
            jichitai-compare/operations/tasks/06382.json \
            jichitai-compare/operations/tasks/06403.json \
            jichitai-compare/operations/tasks/06426.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('jichitai-compare')
          updated = '2026-07-25T04:34:00+09:00'
          for code in ['06367','06382','06403','06426']:
              path = root / f'operations/tasks/{code}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              data['currentBranch'] = None
              data['pullRequestNumber'] = 3121
              data['lastUpdatedAt'] = updated
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          path = root / 'operations/control/session-checkpoints/north-b.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt'] = updated
          data['workingBranch'] = 'coord/sync-north-b-sanity-round-10-20260725'
          data['pullRequestNumber'] = None
          data['ciStatus'] = 'pending'
          data['nextAction'] = '北日本Bの10回精度監査は地域PR #3121・CI #7615・#7618成功でregion/northへ統合済み。最新mainへ戸沢村、川西町、飯豊町、三川町の4件訂正と最終監査記録を全国同期する。107/107自治体、確定誤り28件訂正。'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd jichitai-compare
          npm run generate
          npm run progress
      - name: Commit nationwide synchronization
        run: |
          rm .github/workflows/sync-north-b-sanity-round-10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare .github/workflows/sync-north-b-sanity-round-10.yml
          git commit -m '[north-b-round10-main-sync] audit: publish completed North-B review on latest main'
          git push
