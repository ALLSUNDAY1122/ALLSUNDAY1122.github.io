name: Temporary Central A Weak Source Batch 2 Workflow Fix

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch2-workflow-fix-trigger-20260726.json

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/central-a-weak-source-batch2-official-sources-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix task source calculation and rerun safety
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/workflows/temp-central-a-weak-source-batch2.yml';
          let text=fs.readFileSync(file,'utf8');
          const replacements=[
            [
              "const sources=[];for(const key of keys){const s=m.services[key];if(s?.source?.url)sources.push(s.source.url);for(const extra of s?.additionalSources??[])if(extra?.url)sources.push(extra.url);}task.officialSources=[...new Set(sources)];",
              "const sources=[];for(const key of keys){const s=m.services[key];if(s?.source?.url)sources.push(s.source.url);}task.officialSources=[...new Set(sources)];"
            ],
            [
              "task.notes=Array.isArray(task.notes)?task.notes:[];task.notes.push(`2026-07-26 弱い主出典第2群: ${d.service}を${d.outcome}として再確認。${d.basis}`);task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);",
              "task.notes=Array.isArray(task.notes)?task.notes:[];const note=`2026-07-26 弱い主出典第2群: ${d.service}を${d.outcome}として再確認。${d.basis}`;if(!task.notes.includes(note))task.notes.push(note);task.mergedViaPR=Number(process.env.PR_NUMBER);task.lastWorkflowRunId=Number(process.env.RUN_ID);writeJson(taskPath,taskRaw,task);"
            ],
            [
              "q.correctedMunicipalitiesRechecked=Number(q.correctedMunicipalitiesRechecked??236)+5;q.primarySourceSlotsRechecked=Number(q.primarySourceSlotsRechecked??668)+5;",
              "q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??236),241);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??668),673);"
            ],
            [
              "for(const d of decisions)q.confirmedCorrections.push({type:'weak_primary_source_resolved',code:d.code,service:d.service,name:d.name,outcome:d.outcome});",
              "for(const d of decisions)if(!q.confirmedCorrections.some(x=>x.type==='weak_primary_source_resolved'&&String(x.code)===d.code&&x.service===d.service))q.confirmedCorrections.push({type:'weak_primary_source_resolved',code:d.code,service:d.service,name:d.name,outcome:d.outcome});"
            ]
          ];
          for(const [from,to] of replacements){
            if(!text.includes(from)) throw new Error(`replacement target missing: ${from.slice(0,80)}`);
            text=text.replace(from,to);
          }
          fs.writeFileSync(file,text);
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-workflow-fix-trigger-20260726.json
      - name: Commit workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A弱い主出典第2群のtask出典計算を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
