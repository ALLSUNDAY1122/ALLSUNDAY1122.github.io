name: Temporary Sync Release Queue 519

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-519.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild release queue and remove workflow
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          qpath=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(qpath.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          state_fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          for region in ('north','east','central','west'):
              ref=f'origin/region/{region}'
              files=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              municipalities=[]
              for path in files:
                  if not re.search(r'/\d{5}\.json$',path): continue
                  data=json.loads(show(ref,path))
                  if belongs(region,data['prefectureCode']):
                      municipalities.append({'code':data['code'],'name':data['name']})
              municipalities.sort(key=lambda x:x['code'])
              state=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending=int(state.get(state_fields[region],0))
              entry=by[region]
              entry['municipalities']=municipalities
              entry['count']=len(municipalities)
              entry['pendingSinceLastRelease']=pending
              entry['releaseStatus']='release_ready' if pending>=10 else 'pending_threshold'
              entry['reason']=f'最新地方ブランチを再走査。前回全国統合後の繰越は{pending}自治体'
              entry['mainIntegrationPr']=state.get('lastNationalIntegrationPr')
              entry['generatedPullRequest']=801
              entry['auditStatus']='passed'
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          if total != 519: raise SystemExit(f'unexpected total {total}')
          q['updatedAt']='2026-07-22T19:24:00+09:00'
          q['status']='active'
          q['summary']={
              'regionalMergedMunicipalities':total,
              'latestGeneratedMunicipalityCount':504,
              'latestGeneratedPullRequest':801,
              'latestPublicCountPullRequest':801,
              'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],
              'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"
          }
          qpath.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-519.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-519.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合519自治体・公開504自治体へ同期'
          git push origin main
