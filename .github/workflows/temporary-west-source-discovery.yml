name: Temporary West Source Discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-source-discovery-trigger-20260725.json

permissions:
  contents: write

jobs:
  discover:
    if: github.head_ref == 'audit/west-source-discovery-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout discovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover current official URLs
        shell: bash
        run: |
          cat > /tmp/west_source_discovery.py <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          UA = {'User-Agent':'Mozilla/5.0 jichitai-quality-audit/1.0','Cache-Control':'no-cache'}

          def fetch(url, timeout=35):
              request=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(request,timeout=timeout) as response:
                      body=response.read()
                      ctype=response.headers.get('Content-Type','')
                      text=body.decode('utf-8','replace') if 'text' in ctype or 'html' in ctype or not ctype else ''
                      return {'url':url,'status':response.status,'finalUrl':response.geturl(),'contentType':ctype,'body':text,'size':len(body),'error':None}
              except urllib.error.HTTPError as error:
                  return {'url':url,'status':error.code,'finalUrl':error.geturl(),'contentType':'','body':'','size':0,'error':repr(error)}
              except Exception as error:
                  return {'url':url,'status':None,'finalUrl':url,'contentType':'','body':'','size':0,'error':repr(error)}

          def slim(response):
              return {k:v for k,v in response.items() if k!='body'}

          def contains_all(body,tokens):
              normalized=html.unescape(re.sub(r'<[^>]+>',' ',body))
              return all(token in normalized for token in tokens)

          def extract_links(base,body):
              links=[]
              for match in re.finditer(r'href=["\']([^"\']+)["\']',body,re.I):
                  url=urllib.parse.urljoin(base,html.unescape(match.group(1)))
                  if url.startswith('http'): links.append(url)
              return sorted(set(links))

          targets=[]

          # 益城町: new CMS form and legacy form; require fee and size tokens.
          mashiki_candidates=[
              'https://www.town.mashiki.lg.jp/kiji0032329/index.html',
              'https://www.town.mashiki.lg.jp/kiji0032329/',
              'https://www.town.mashiki.lg.jp/list00679.html',
          ]
          mashiki_results=[]
          for url in mashiki_candidates:
              r=fetch(url)
              r['contentMatch']=r['status']==200 and contains_all(r['body'],['500円','400cm'])
              mashiki_results.append(slim(r))
          best=next((r['finalUrl'] for r in mashiki_results if r['contentMatch']),None)
          targets.append({'code':'43443','name':'益城町','service':'bulkyWaste','expectedTokens':['500円','400cm'],'candidates':mashiki_results,'bestUrl':best,'status':'resolved' if best else 'unresolved'})

          # 和泊町: current official attachment contains the fee table.
          wadomari_candidates=[
              'https://www.town.wadomari.lg.jp/documents/4268/kaitei.pdf',
              'https://www.town.wadomari.lg.jp/tyoumin/gomisyori.html',
          ]
          wadomari_results=[]
          for url in wadomari_candidates:
              r=fetch(url)
              r['contentMatch']=r['status']==200 and (url.endswith('.pdf') or contains_all(r['body'],['ごみ処分手数料','令和5年4月1日']))
              wadomari_results.append(slim(r))
          best=next((r['finalUrl'] for r in wadomari_results if r['contentMatch'] and str(r['finalUrl']).endswith('.pdf')),None) or next((r['finalUrl'] for r in wadomari_results if r['contentMatch']),None)
          targets.append({'code':'46533','name':'和泊町','service':'bulkyWaste','expected':'official fee table PDF, coarse waste 100 yen/10kg','candidates':wadomari_results,'bestUrl':best,'status':'resolved' if best else 'unresolved'})

          # 日吉津村: current Japanese-slug hazard-map pages.
          hiezu_candidates=[
              'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%AA%E6%B0%B4%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/',
              'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%A5%E6%B3%A2%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/',
          ]
          hiezu_results=[]
          for url in hiezu_candidates:
              r=fetch(url)
              r['contentMatch']=r['status']==200 and ('ハザードマップ' in html.unescape(re.sub(r'<[^>]+>',' ',r['body'])))
              hiezu_results.append(slim(r))
          best=next((r['finalUrl'] for r in hiezu_results if r['contentMatch']),None)
          targets.append({'code':'31384','name':'日吉津村','service':'disasterPrevention','expectedTokens':['ハザードマップ'],'candidates':hiezu_results,'bestUrl':best,'status':'resolved' if best else 'unresolved'})

          # 新富町: try known migration patterns, then crawl official medical-subsidy category links.
          shintomi_candidates=[
              'https://www.town.shintomi.lg.jp/soshiki/fukushi/gyomu/3/1061.html',
              'https://www.town.shintomi.lg.jp/iryo_kenko_fukushi/iryohijosei/1061.html',
              'https://www.town.shintomi.lg.jp/iryo_kenko_fukushi/iryohijosei/index.html',
              'https://www.town.shintomi.lg.jp/item/1600.htm',
              'https://www.town.shintomi.lg.jp/1061.htm',
          ]
          category=fetch('https://www.town.shintomi.lg.jp/iryo_kenko_fukushi/iryohijosei/index.html')
          for link in extract_links(category['finalUrl'],category['body']):
              if urllib.parse.urlparse(link).netloc.endswith('town.shintomi.lg.jp') and any(part in link for part in ['/iryohijosei/','/soshiki/fukushi/','/item/']):
                  shintomi_candidates.append(link)
          shintomi_results=[]
          for url in sorted(set(shintomi_candidates)):
              r=fetch(url)
              normalized=html.unescape(re.sub(r'<[^>]+>',' ',r['body']))
              r['contentMatch']=r['status']==200 and '18歳' in normalized and ('自己負担なし' in normalized or '医療費助成' in normalized) and ('高校生' in normalized or '子ども' in normalized)
              shintomi_results.append(slim(r))
          best=next((r['finalUrl'] for r in shintomi_results if r['contentMatch'] and '/soshiki/' in str(r['finalUrl'])),None) or next((r['finalUrl'] for r in shintomi_results if r['contentMatch']),None)
          targets.append({'code':'45402','name':'新富町','service':'childMedical','expectedTokens':['18歳','自己負担なし','医療費助成'],'category':slim(category),'candidates':shintomi_results,'bestUrl':best,'status':'resolved' if best else 'unresolved'})

          output={
              'schemaVersion':'1.0.0',
              'auditId':'west-source-discovery-20260725',
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'targetCount':len(targets),
              'resolvedCount':sum(1 for target in targets if target['status']=='resolved'),
              'unresolvedCount':sum(1 for target in targets if target['status']!='resolved'),
              'targets':targets,
              'policy':'Only URLs with HTTP 200 and expected official content are selected. No URL is inferred from path shape alone.'
          }
          path=Path('jichitai-compare/operations/audits/west-source-discovery-20260725.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'resolvedCount':output['resolvedCount'],'unresolvedCount':output['unresolvedCount'],'bestUrls':{t['code']:t['bestUrl'] for t in targets}},ensure_ascii=False,indent=2))
          PY
          python3 /tmp/west_source_discovery.py

      - name: Commit discovery evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/west-source-discovery-20260725.json \
            jichitai-compare/operations/control/west-source-discovery-trigger-20260725.json
          git commit -m 'audit: 西日本4自治体の現行公式出典URLを特定'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
