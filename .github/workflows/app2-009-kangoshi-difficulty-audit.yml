name: APP2-009 Kangoshi Difficulty Audit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  audit:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[APP2-009] Run Kangoshi official difficulty audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run official difficulty gate
        id: gate
        continue-on-error: true
        run: |
          set +e
          node kangoshi-sprint/audit-official-difficulty.mjs > /tmp/kangoshi-difficulty.log 2>&1
          code=$?
          cat /tmp/kangoshi-difficulty.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist audit result
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          log=Path('/tmp/kangoshi-difficulty.log').read_text(encoding='utf-8',errors='replace')
          code=int('${{ steps.gate.outputs.exit_code }}')
          out=Path('/tmp/kangoshi-difficulty-audit.json')
          out.write_text(json.dumps({
            'task_id':'APP2-009',
            'audit':'official_exam_difficulty_gate',
            'official_exams':[113,114,115],
            'expected_questions':720,
            'exit_code':code,
            'pass':code==0,
            'log':log[-20000:]
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/chatgpt-dispatcher/app-development-2/evidence
          cp /tmp/kangoshi-difficulty-audit.json automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-kangoshi-difficulty-audit.json
          git add automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-kangoshi-difficulty-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'APP2-009: persist Kangoshi difficulty audit result'
            for n in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              test "$n" != 5
              sleep 2
            done
          fi
      - name: Fail when audit fails
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-009 difficulty audit finished. status=${{ job.status }}; exit_code=${{ steps.gate.outputs.exit_code }}; run_id=${context.runId}`});
