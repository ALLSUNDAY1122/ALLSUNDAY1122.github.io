name: Scan Lab S7 iOS

on:
  push:
    branches:
      - scaniverse/s7-map-discover-backend
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/scanlab-s7-ios.yml'
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/scanlab-s7-ios.yml'

permissions:
  contents: read

concurrency:
  group: scanlab-s7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Audit web and privacy inputs
        run: |
          set -euo pipefail
          node --check splat-native-ios/viewer/viewer.js
          plutil -lint splat-native-ios/SplatNative/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeEmailAddress' splat-native-ios/SplatNative/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypePreciseLocation' splat-native-ios/SplatNative/PrivacyInfo.xcprivacy
          grep -q '位置情報は自動取得しません' splat-native-ios/privacy.html
          grep -q 'sharedMemoryForWorkers: false' splat-native-ios/viewer/viewer.js
          ! grep -R -nE 'service_role|SUPABASE_SERVICE_ROLE_KEY' splat-native-ios/SplatNative splat-native-ios/viewer

      - name: Generate Xcode project
        working-directory: splat-native-ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: splat-native-ios
        run: xcodebuild -resolvePackageDependencies -project SplatNative.xcodeproj -scheme SplatNative

      - name: Build iOS Simulator app
        working-directory: splat-native-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SplatNative.xcodeproj \
            -scheme SplatNative \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/scanlab-s7-xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanlab-s7-xcodebuild-log
          path: /tmp/scanlab-s7-xcodebuild.log
          if-no-files-found: ignore
