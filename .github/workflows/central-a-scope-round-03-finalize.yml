name: Finalize Central A Scope Audit Round 03

on:
  push:
    branches: ['audit/central-a-scope-verification-round-03-20260725']
    paths: ['.github/workflows/central-a-scope-round-03-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-03-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correct Fukui omissions and finalize audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T00:34:00+09:00';

          const corrections = {
            '18404': {
              source: 'https://www.town.minamiechizen.lg.jp/kurasi/102/121/p011052.html',
              summary: '通常の一時預かりに加え、未就園の生後6か月から満3歳未満を就労要件なしで受け入れるこども誰でも通園制度を令和8年度から実施する。',
              eligibility: {minAgeMonths: 6, maxAgeYears: 5},
              details: {
                types: '一時預かり、こども誰でも通園制度（乳児等通園支援事業）',
                temporaryCare: '保育施設に在籍していない生後6か月から就学前までを、非定型・緊急・リフレッシュ目的で一時的に受け入れる',
                anyChildTarget: '町内在住で、保育所・認定こども園等に在籍していない生後6か月から満3歳未満の子ども',
                employment: '保護者の就労要件なし',
                start: '令和8年度から実施',
                annualCapacity: '町計画では令和8年度の確保量を年間648人日としている',
                usage: '国の令和8年度利用枠は月10時間。施設・利用手続は町またはこども誰でも通園制度総合支援システムで確認'
              },
              extra: [{url:'https://www.town.minamiechizen.lg.jp/kurasi/102/121/p011052_d/fil/kodomokeikaku.pdf',description:'南越前町こども計画の実施・確保量'}]
            },
            '18423': {
              source: 'https://www.town.echizen.fukui.jp/kodomo/02/02/p009852.html',
              summary: '通常の一時預かりに加え、保育所等に在籍していない生後6か月から満3歳未満を就労要件なしで月10時間まで受け入れるこども誰でも通園制度を実施する。',
              eligibility: {minAgeMonths: 6, maxAgeYears: 5},
              details: {
                types: '一時預かり、こども誰でも通園制度（乳児等通園支援事業）',
                temporaryCare: '就労・疾病・出産・看護・冠婚葬祭・育児負担軽減等により一時保育が必要な未就園児を受け入れる',
                anyChildTarget: '保育所・認定こども園等に在籍していない生後6か月から満3歳未満の子ども',
                employment: '保護者の就労要件なし',
                anyChildLimit: '子ども1人につき月10時間まで',
                implementation: '町内保育施設の空き定員等を活用して実施',
                application: '町の案内に従い認定申請、施設面談、利用予約を行う'
              },
              extra: [{url:'https://www.town.echizen.fukui.jp/chousei/11/04/p009290_d/fil/kodomokeikaku.pdf',description:'越前町こども計画'}]
            },
            '18481': {
              source: 'https://www.town.takahama.fukui.jp/reiki/reiki_taikei/r_taikei_08.html',
              summary: '通常の一時預かりに加え、令和8年度から乳児等通園支援事業（こども誰でも通園制度）を実施するための町条例・事業者認可制度を整備している。',
              eligibility: {minAgeMonths: 6, maxAgeYears: 5},
              details: {
                types: '一時預かり、乳児等通園支援事業（こども誰でも通園制度）',
                temporaryCare: '保護者の疾病・出産・冠婚葬祭・育児疲れ等で家庭保育が困難な未就園児を町内施設で一時預かりする',
                localBasis: '令和8年4月施行の設備運営基準条例、特定乳児等通園支援事業条例、事業者認可規則を整備',
                nationalTarget: '国制度では保育所等に在籍していない生後6か月から満3歳未満が対象',
                employment: '保護者の就労要件なし',
                usage: '国の令和8年度利用枠は月10時間。実施施設・利用料・申請方法は町の最新案内または総合支援システムで確認'
              },
              extra: []
            },
            '18483': {
              source: 'https://www.town.ohi.fukui.jp/1201/lifeevent02/p10199_d/fil/kodomokeikaku.pdf',
              summary: '通常の一時預かりに加え、保育所等に在籍していない満3歳未満の子どもを就労要件なしで受け入れる乳児等通園支援事業を令和8年度から実施する。',
              eligibility: {minAgeMonths: 6, maxAgeYears: 5},
              details: {
                types: '一時預かり、乳児等通園支援事業（こども誰でも通園制度）',
                temporaryCare: '保護者の病気・出産・勤務・育児疲れ等で一時的に保育が必要な就学前児童を受け入れ、町民の利用料を無料とする',
                anyChildTarget: '保育所・認定こども園等に在籍していない満3歳未満の子ども',
                employment: '保護者の就労要件なし',
                start: '町こども計画で令和8年度からの実施・確保を計画',
                facilities: '町内の認定こども園等で実施予定',
                usage: '国の令和8年度利用枠は月10時間。実施園、料金、申請手続は町の最新案内または総合支援システムで確認'
              },
              extra: []
            },
            '18501': {
              source: 'https://www.town.fukui-wakasa.lg.jp/kosodate_kyoiku/jidofukushi_hitorioyafukushi/3846.html',
              summary: '通常の一時預かりに加え、保育所等に在籍していない生後6か月から満3歳未満を就労要件なしで月10時間まで受け入れるこども誰でも通園制度を令和8年度から実施する。',
              eligibility: {minAgeMonths: 0, maxAgeYears: 5},
              details: {
                types: 'すみずみ子育てサポート、一時預かり、こども誰でも通園制度',
                temporaryCare: '就職活動、通院、冠婚葬祭、各種行事、リフレッシュ等で家庭養育が困難な場合に事業所・保育園で一時預かりを行う',
                anyChildTarget: '若狭町に住所があり、保育所・幼稚園・認定こども園等に在籍していない生後6か月から満3歳未満の子ども',
                employment: '保護者の就労要件なし',
                anyChildLimit: '子ども1人につき月10時間まで',
                fee: '1時間300円',
                facilities: 'ののはな保育園、とばっ子保育園',
                hours: '月曜日から金曜日の9時から11時30分まで。施設の休園日等を除く',
                application: '町へ利用認定申請後、総合支援システムで施設面談と利用予約を行う'
              },
              extra: []
            }
          };

          for (const [code, correction] of Object.entries(corrections)) {
            const dataPath = `${root}/data/municipalities/18/${code}.json`;
            const data = JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const previous = data.services.temporaryChildcare;
            const oldPrimary = previous.source?.url;
            const additionalSources = [
              ...(oldPrimary ? [{url:oldPrimary,checkedAt,description:'通常の一時預かりの利用条件・料金'}] : []),
              ...(previous.additionalSources || []),
              ...correction.extra.map(x => ({...x,checkedAt}))
            ];
            const seen = new Set();
            const deduped = additionalSources.filter(x => x.url && x.url !== correction.source && !seen.has(x.url) && seen.add(x.url));
            data.services.temporaryChildcare = {
              status:'verified',summary:correction.summary,eligibility:correction.eligibility,
              details:correction.details,source:{url:correction.source,checkedAt},additionalSources:deduped
            };
            data.updatedAt = checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(data,null,2)+'\n');

            const taskPath = `${root}/operations/tasks/${code}.json`;
            const task = JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const sources = Array.isArray(task.officialSources) ? task.officialSources : [];
            task.officialSources = [...new Set(sources.map(url => url === oldPrimary ? correction.source : url))];
            if (!task.officialSources.includes(correction.source)) task.officialSources.push(correction.source);
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            task.notes.push('2026-07-25の担当範囲再監査で、こども誰でも通園制度（乳児等通園支援事業）の記録漏れを修正。通常の一時預かりは自治体JSONの補助出典として保持。');
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '中日本調査班A（担当範囲再監査）';
            fs.writeFileSync(taskPath,JSON.stringify(task,null,2)+'\n');
          }

          const reportPath = `${root}/operations/control/central-a-scope-round-03-fukui-20260725.json`;
          const report = JSON.parse(fs.readFileSync(reportPath,'utf8'));
          report.substantiveResolutions = [
            {code:'18209',name:'越前市',service:'postpartumCare',result:'confirmed_accurate',detail:'宿泊・通所は産後1年未満、訪問型は産後6か月未満という現行公式案内と一致。',checkedAt},
            {code:'18404',name:'南越前町',service:'temporaryChildcare',result:'corrected_current_program_omission'},
            {code:'18423',name:'越前町',service:'temporaryChildcare',result:'corrected_current_program_omission'},
            {code:'18481',name:'高浜町',service:'temporaryChildcare',result:'corrected_current_program_omission'},
            {code:'18483',name:'おおい町',service:'temporaryChildcare',result:'corrected_current_program_omission'},
            {code:'18501',name:'若狭町',service:'temporaryChildcare',result:'corrected_current_program_omission'}
          ];
          report.finalResult = {
            status:'completed_with_corrections',structuralErrors:0,substantiveErrors:5,
            correctedMunicipalityCodes:['18404','18423','18481','18483','18501'],
            confirmedAccurateSuspectCodes:['18209'],needsFurtherReview:0,completedAt:updatedAt
          };
          fs.writeFileSync(reportPath,JSON.stringify(report,null,2)+'\n');

          const auditPath = `${root}/operations/control/central-a-scope-verification-20260724.json`;
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const batch = audit.batches.find(x => x.batch === 3);
          batch.status = 'completed_with_corrections';
          batch.structuralFindingCount = 0;
          batch.confirmedErrors = 5;
          batch.correctedMunicipalityCodes = ['18404','18423','18481','18483','18501'];
          batch.confirmedAccurateSuspectCodes = ['18209'];
          batch.completedAt = updatedAt;
          batch.nextStep = '第4回として岐阜県42自治体を監査する';
          audit.summary.completedBatches = 3;
          audit.summary.checkedMunicipalities = 51;
          audit.summary.confirmedErrors = 11;
          audit.summary.correctedErrors = 11;
          audit.summary.needsFurtherReview = 0;
          audit.nextAction = '第4回として岐阜県42自治体を監査する';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          NODE
          rm .github/workflows/central-a-scope-round-03-finalize.yml
      - name: Commit completed Fukui audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 福井県5自治体の誰でも通園漏れを修正'
          git push origin HEAD:audit/central-a-scope-verification-round-03-20260725
