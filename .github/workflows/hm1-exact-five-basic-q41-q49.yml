name: HM1 basic Q41 Q43 Q44 Q47 Q49 exact five regeneration
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - 'ios/health-manager-1/Resources/questions.json'
      - '.github/workflows/hm1-exact-five-basic-q41-q49.yml'
  workflow_dispatch:
jobs:
  exact-five:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate both full banks, compare exact five
        shell: bash
        run: |
          set -euo pipefail
          BASE=34bc2caffa2694f17729e0a7c556f00ad7eaf287
          git worktree add --detach /tmp/hm1-q41-before "$BASE"
          git worktree add --detach /tmp/hm1-q41-after HEAD
          (cd /tmp/hm1-q41-before && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q41-before.log)
          (cd /tmp/hm1-q41-after && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q41-after.log)
          python3 - <<'PY'
          import json,unicodedata
          from pathlib import Path
          rel='ios/health-manager-1/Resources/questions.json'
          a=json.loads((Path('/tmp/hm1-q41-before')/rel).read_text())
          b=json.loads((Path('/tmp/hm1-q41-after')/rel).read_text())
          target={'2026-04-Q41','2026-04-Q43','2026-04-Q44','2025-10-Q03','2025-10-Q05'}
          answers={'2026-04-Q41':2,'2026-04-Q43':1,'2026-04-Q44':4,'2025-10-Q03':0,'2025-10-Q05':3}
          assert len(a)==len(b)==264,(len(a),len(b))
          assert [q['id'] for q in a]==[q['id'] for q in b],'ID/order changed'
          norm=lambda s:''.join(c for c in unicodedata.normalize('NFKC',s).casefold() if not c.isspace())
          assert len({q['id'] for q in b})==264,'duplicate IDs'
          assert len({norm(q['stem']) for q in b})==264,'duplicate normalized stems'
          diff={x['id'] for x,y in zip(a,b) if x!=y}
          assert diff==target,{'actual':sorted(diff),'expected':sorted(target)}
          for x,y in zip(a,b):
              if x['id'] not in target:assert x==y,x['id']
              assert len(y['choices'])==5,y['id']
              assert len({norm(c) for c in y['choices']})==5,y['id']
              assert type(y['ans']) is int and 0<=y['ans']<5,y['id']
              if y['id'] in target:
                  assert y['ans']==answers[y['id']],y['id']
                  assert y['short'] and y['detail'] and y['auditSourceURL'],y['id']
          print('PASS: 264 both, exactly five target changes, 259 other questions fully identical')
          PY
