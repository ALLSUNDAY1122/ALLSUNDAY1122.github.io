name: Toru Tango lockfile sync
on:
  push:
    branches: [main]
    paths: [.github/workflows/toru-tango-lockfile-sync.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0}
      - name: Generate deterministic npm lock without lifecycle scripts
        working-directory: toru-tango-mobile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Verify dependency alignment before commit
        working-directory: toru-tango-mobile
        run: |
          npm install --ignore-scripts --legacy-peer-deps
          npm run interaction-gate
          npm run typecheck
          npm run lint
          npm run doctor
      - name: Commit lockfile only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add toru-tango-mobile/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'package-lock.json is already deterministic and aligned; nothing to commit.'
            exit 0
          fi
          git commit -m 'build(toru-tango): pin Expo 57 dependency graph'
          git push origin HEAD:main
