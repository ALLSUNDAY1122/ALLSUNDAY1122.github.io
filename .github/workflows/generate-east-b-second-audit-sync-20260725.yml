name: Generate East B Second Audit Sync 20260725

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-sync:
    if: github.head_ref == 'coord/sync-east-b-second-audit-20260725-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sync-east-b-second-audit-20260725-v2
          fetch-depth: 0
      - name: Generate and validate national artifacts
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          node scripts/generate-municipality-pages.mjs
          npm run validate:generated
          node scripts/validate-municipality-pages.mjs
          node --check scripts/generate-municipality-pages.mjs
          node --check scripts/validate-municipality-pages.mjs
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-east-b-second-audit-sync-20260725.yml
          git add jichitai-compare/municipality jichitai-compare/data/generated/municipalities.json jichitai-compare/data/generated/municipality-pages.json jichitai-compare/sitemap.xml jichitai-compare/operations/progress.json
          git commit -m "generate: 東日本B第2監査を全国公開へ同期"
          git push origin HEAD:coord/sync-east-b-second-audit-20260725-v2
