name: Yorugatari engagement audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 404.html
      - yorugatari/index.html
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/archive.html
      - yorugatari/about.html
      - yorugatari/privacy.html
      - yorugatari/terms.html
      - yorugatari/contact.html
      - yorugatari/stories/last-elevator.html
      - yorugatari/stories/spare-key-returned.html
      - yorugatari/stories/hired-with-your-experience.html
      - yorugatari/assets/story.js
      - yorugatari/assets/analytics.js
      - yorugatari/assets/engagement.js
      - yorugatari/assets/landing-share.js
      - yorugatari/assets/landing-start-20260724-001.js
      - yorugatari/assets/yorugatari-share.png
      - yorugatari/tools/campaigns.json
      - yorugatari/tools/external-launch-kit.md
      - yorugatari/tools/normalize-legacy-story-attributes.mjs
      - yorugatari/tools/normalize-engagement.mjs
      - yorugatari/tools/ensure-landing-sharing.mjs
      - yorugatari/tools/live-release-audit.mjs
      - yorugatari/tools/engagement-audit.cjs
      - yorugatari/tools/landing-share-audit.cjs
      - .github/workflows/yorugatari-engagement-audit.yml

concurrency:
  group: yorugatari-engagement-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize campaign runtime and audited circulation
        shell: bash
        run: |
          node --check yorugatari/tools/normalize-legacy-story-attributes.mjs
          node --check yorugatari/tools/normalize-engagement.mjs
          node --check yorugatari/tools/ensure-landing-sharing.mjs
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js
          node --check yorugatari/assets/landing-share.js
          node --check yorugatari/assets/landing-start-20260724-001.js
          node yorugatari/tools/normalize-legacy-story-attributes.mjs
          node yorugatari/tools/normalize-engagement.mjs
          node yorugatari/tools/ensure-landing-sharing.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const site = 'yorugatari';
          const release = '20260724-001';
          const staticFiles = ['index.html','5min-horror.html','bedtime-horror.html','archive.html','about.html','privacy.html','terms.html','contact.html'];
          for (const file of staticFiles) {
            const html = fs.readFileSync(path.join(site, file), 'utf8');
            const expectedVersion = file === '5min-horror.html' ? '20260724-004' : file === 'bedtime-horror.html' ? '20260724-005' : '20260723-003';
            if (!html.includes(`assets/analytics.js?v=${expectedVersion}&r=${release}`) || html.includes('assets/engagement.js')) throw new Error(`Static runtime mismatch: ${file}`);
          }
          for (const file of ['5min-horror.html', 'bedtime-horror.html']) {
            const html = fs.readFileSync(path.join(site, file), 'utf8');
            if (!html.includes('assets/landing-share.js?v=20260724-002')) throw new Error(`Landing share runtime mismatch: ${file}`);
            if (!html.includes(`assets/landing-start-20260724-001.js?r=${release}`)) throw new Error(`Landing start runtime mismatch: ${file}`);
            if (!html.includes('特集単位の合計だけを匿名で集計します')) throw new Error(`Landing privacy copy mismatch: ${file}`);
          }
          for (const file of ['analytics.js', 'engagement.js', 'landing-start-20260724-001.js']) {
            const runtime = fs.readFileSync(path.join(site, 'assets', file), 'utf8');
            for (const token of ['isAutomatedRequest', 'HeadlessChrome', 'automatedQuery']) {
              if (!runtime.includes(token)) throw new Error(`Automated traffic filter missing from ${file}: ${token}`);
            }
          }
          const landingStart = fs.readFileSync(path.join(site, 'assets', 'landing-start-20260724-001.js'), 'utf8');
          for (const token of ['/yorugatari/__landing-start/five-minute', '/yorugatari/__landing-start/bedtime', "const VERSION = '20260724-001'", 'window.YORUGATARI_LANDING_START', 'sessionStorage.setItem(storageKey']) {
            if (!landingStart.includes(token)) throw new Error(`Landing story start token missing: ${token}`);
          }
          const stories = fs.readdirSync(path.join(site, 'stories')).filter((file) => file.endsWith('.html'));
          const auditedStories = new Set(['last-elevator.html', 'spare-key-returned.html', 'hired-with-your-experience.html']);
          if (stories.length !== 100) throw new Error(`Expected 100 stories, found ${stories.length}`);
          for (const file of stories) {
            const html = fs.readFileSync(path.join(site, 'stories', file), 'utf8');
            if (!html.includes('../assets/engagement.js?v=20260723-003') || html.includes('../assets/analytics.js')) throw new Error(`Story runtime mismatch: ${file}`);
            if (auditedStories.has(file) && !html.includes(`../assets/engagement.js?v=20260723-003&r=${release}`)) throw new Error(`Audit story cache release mismatch: ${file}`);
            if ((html.match(/href=["']\.\.\/5min-horror\.html["']/g) || []).length !== 1) throw new Error(`Five-minute landing link mismatch: ${file}`);
            if ((html.match(/href=["']\.\.\/bedtime-horror\.html["']/g) || []).length !== 1) throw new Error(`Bedtime landing link mismatch: ${file}`);
          }
          const privacy = fs.readFileSync(path.join(site, 'privacy.html'), 'utf8');
          if (!privacy.includes('固定キャンペーンコード') || !privacy.includes('登録済みコードに一致しない値は破棄') || !privacy.includes('開いた作品名や作品URLはこの集計へ含めません') || !privacy.includes('自動監査、Lighthouse、ヘッドレスブラウザ')) throw new Error('Privacy campaign, conversion, or audit-filter disclosure is missing');
          const notFound = fs.readFileSync('404.html', 'utf8');
          if (!notFound.includes(`/yorugatari/assets/analytics.js?v=20260723-003&r=${release}`)) throw new Error('404 runtime mismatch');
          NODE

      - name: Commit normalized audited pages
        shell: bash
        run: |
          paths=(
            404.html
            yorugatari/index.html
            yorugatari/5min-horror.html
            yorugatari/bedtime-horror.html
            yorugatari/archive.html
            yorugatari/about.html
            yorugatari/privacy.html
            yorugatari/terms.html
            yorugatari/contact.html
            yorugatari/stories/last-elevator.html
            yorugatari/stories/spare-key-returned.html
            yorugatari/stories/hired-with-your-experience.html
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Campaign, landing, and audited story runtimes are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Normalize Yorugatari audit-filtered analytics [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep 4
          done
          exit 1

  engagement-audit:
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate audit syntax
        shell: bash
        run: |
          node --check yorugatari/tools/live-release-audit.mjs
          node --check yorugatari/tools/engagement-audit.cjs
          node --check yorugatari/tools/landing-share-audit.cjs
          node --check yorugatari/assets/story.js
          node --check yorugatari/assets/analytics.js
          node --check yorugatari/assets/engagement.js
          node --check yorugatari/assets/landing-share.js
          node --check yorugatari/assets/landing-start-20260724-001.js
          node -e "const c=require('./yorugatari/tools/campaigns.json'); if(c.definitions.length!==8||!c.onsiteShare)process.exit(1)"

      - name: Wait for published filtered release
        run: node yorugatari/tools/live-release-audit.mjs

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit published engagement
        id: engagement_audit
        continue-on-error: true
        run: node yorugatari/tools/engagement-audit.cjs

      - name: Audit published landing sharing and starts
        id: landing_audit
        continue-on-error: true
        run: node yorugatari/tools/landing-share-audit.cjs

      - name: Preserve audit reports
        if: always()
        shell: bash
        run: |
          test -f yorugatari-engagement-report.json
          test -f yorugatari-landing-share-report.json
          cp yorugatari-engagement-report.json /tmp/yorugatari-engagement-report.json
          cp yorugatari-landing-share-report.json /tmp/yorugatari-landing-share-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/yorugatari-engagement-report.json yorugatari/tools/engagement-audit-latest.json
            cp /tmp/yorugatari-landing-share-report.json yorugatari/tools/landing-share-audit-latest.json
            git add yorugatari/tools/engagement-audit-latest.json yorugatari/tools/landing-share-audit-latest.json
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari engagement and landing audits [skip ci]"
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            sleep 4
          done
          test "$saved" = true

      - name: Upload engagement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-engagement-report
          path: |
            yorugatari-engagement-report.json
            yorugatari-landing-share-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce audit results
        if: always()
        run: |
          test "${{ steps.engagement_audit.outcome }}" = "success"
          test "${{ steps.landing_audit.outcome }}" = "success"
