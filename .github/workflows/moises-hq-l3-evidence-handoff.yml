name: Moises HQ Lane3 Evidence Handoff

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffManifest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift'
      - '.github/workflows/moises-hq-l3-evidence-handoff.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffManifest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift'
      - '.github/workflows/moises-hq-l3-evidence-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l3-evidence-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-handoff-manifest-self-test:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Compile and execute Lane3 handoff manifest self-test
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift \
            -o /tmp/l3-hq-evidence-handoff-self-test
          /tmp/l3-hq-evidence-handoff-self-test | tee /tmp/l3-hq-evidence-handoff-self-test.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_SELF_TEST_PASS ' /tmp/l3-hq-evidence-handoff-self-test.out
