name: Temporary Central A Housing Batch 17 Final Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch17-final-main-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-housing-batch17-final-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset to latest main and import final regional records
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(
            jichitai-compare/operations/audits/central-a-housing-batch17-candidate-ranking-20260726.json
            jichitai-compare/operations/audits/central-a-housing-classification-batch17-decisions-20260726.json
            jichitai-compare/operations/audits/central-a-housing-classification-batch17-public-verification-20260726.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
            jichitai-compare/operations/control/regions/central.json
            jichitai-compare/operations/quality/central-a-housing-batch17-resolution-20260726.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/region/central:$file" > "$file"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const completedAt='2026-07-26T03:58:00+09:00';
          const resolutionPath='jichitai-compare/operations/quality/central-a-housing-batch17-resolution-20260726.json';
          const resolution=JSON.parse(fs.readFileSync(resolutionPath,'utf8'));
          resolution.completedAt=completedAt;
          resolution.evidence.finalMainPullRequest=Number(process.env.PR_NUMBER);
          resolution.evidence.finalMainWorkflowRunId=Number(process.env.RUN_ID);
          resolution.temporaryRunnerCleanup={regionPaths:['.github/workflows/temp-central-a-housing-batch17-scan.yml','.github/workflows/temp-central-a-housing-batch17.yml','.github/workflows/temp-central-a-housing-batch17-finalize.yml'],mainPaths:['.github/workflows/temp-central-a-housing-batch17-main.yml','.github/workflows/temp-central-a-housing-batch17-public.yml','.github/workflows/temp-central-a-housing-batch17-final-main.yml'],regionCleanupPullRequest:3771,mainCleanupPullRequest:Number(process.env.PR_NUMBER),status:'cleanup_completed'};
          fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch17-final-main-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Remove main runners and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-central-a-housing-batch17-main.yml .github/workflows/temp-central-a-housing-batch17-public.yml .github/workflows/temp-central-a-housing-batch17-final-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援第17群を最終確定'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
