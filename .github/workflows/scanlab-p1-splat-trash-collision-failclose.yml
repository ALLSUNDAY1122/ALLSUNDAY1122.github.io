name: Scan Lab P1 splat trash collision fail-close one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-splat-trash-collision-failclose.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Preserve both sides on occupied Splat trash destination
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('splat-native-ios/SplatNative/ScanProjectStore.swift')
          s = p.read_text()
          old = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        let destination = trashURL.appendingPathComponent(projectURL.lastPathComponent)\n        if fileManager.fileExists(atPath: destination.path) { try fileManager.removeItem(at: destination) }\n        try fileManager.moveItem(at: projectURL, to: destination)\n    }\n'''
          new = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        let destination = trashURL.appendingPathComponent(projectURL.lastPathComponent)\n        // A duplicate project ID in Trash is an integrity collision. Never destroy the existing\n        // recoverable copy implicitly; preserve both sides and let the caller surface the failure.\n        guard !fileManager.fileExists(atPath: destination.path) else {\n            throw ScanProjectStoreError.invalidManifest\n        }\n        try fileManager.moveItem(at: projectURL, to: destination)\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('ScanProjectStore moveToTrash anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          t = Path('splat-native-ios/SplatNativeTests/ScanProjectStoreTests.swift')
          tests = t.read_text()
          anchor = '''    func testTrashIsRecoverableAcrossRelaunchBeforePermanentDelete() throws {\n'''
          insertion = '''    func testMoveToTrashPreservesBothProjectsWhenDestinationAlreadyExists() throws {\n        let created = try store.createProject(title: "live")\n        let destination = store.trashURL.appendingPathComponent(created.0.lastPathComponent)\n        try FileManager.default.createDirectory(at: destination, withIntermediateDirectories: true)\n        let sentinel = destination.appendingPathComponent("sentinel")\n        try Data([0xAC]).write(to: sentinel)\n\n        XCTAssertThrowsError(try store.moveToTrash(projectURL: created.0))\n        XCTAssertTrue(FileManager.default.fileExists(atPath: created.0.path))\n        XCTAssertEqual(try Data(contentsOf: sentinel), Data([0xAC]))\n    }\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('ScanProjectStore test anchor mismatch')
          t.write_text(tests.replace(anchor, insertion + anchor, 1))
          PY
          grep -q 'duplicate project ID in Trash is an integrity collision' splat-native-ios/SplatNative/ScanProjectStore.swift
          grep -q 'testMoveToTrashPreservesBothProjectsWhenDestinationAlreadyExists' splat-native-ios/SplatNativeTests/ScanProjectStoreTests.swift
      - name: Commit repair and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-splat-trash-collision-failclose.yml
          git add splat-native-ios/SplatNative/ScanProjectStore.swift \
            splat-native-ios/SplatNativeTests/ScanProjectStoreTests.swift
          git commit -m 'fix(splat): preserve occupied trash collision'
          git push origin HEAD:feature/splat-post-build17-p1
