name: Append Hokenshi Codemagic workflow

on:
  push:
    branches:
      - feat/hokenshi-sprint-native-foundation
    paths:
      - '.github/workflows/hokenshi-append-codemagic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hokenshi-sprint-native-foundation
          fetch-depth: 0
      - name: Append Hokenshi workflow once
        run: python3 hokenshi-sprint/scripts/append_codemagic_workflow.py
      - name: Commit Codemagic configuration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          if git diff --cached --quiet; then
            echo 'No codemagic.yaml changes.'
            exit 0
          fi
          git commit -m 'ci(hokenshi): add Internal TestFlight Codemagic workflow [skip ci]'
          git push origin HEAD:feat/hokenshi-sprint-native-foundation
