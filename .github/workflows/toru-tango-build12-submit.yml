name: Toru Tango Build12 TestFlight and App Review

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: toru-tango-build12-submit
  cancel-in-progress: false

env:
  APP_BUNDLE_ID: com.allsunday1122.torutango
  CI: '1'

jobs:
  build12:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[TORU-TANGO] Build12 TestFlight and App Review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Build 12 source
        uses: actions/checkout@v4
        with:
          ref: release/toru-tango-build12-20260923

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: toru-tango-mobile/package-lock.json

      - name: Validate exact Build 12 source
        working-directory: toru-tango-mobile
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/toru-build12-sha.txt
          grep -q "buildNumber: '12'" app.config.ts
          grep -q 'renameDeck' src/context/AppStore.tsx
          grep -q 'deleteDeck' src/context/AppStore.tsx
          grep -q 'reorderCards' src/context/AppStore.tsx
          grep -q '並べ替え完了' 'app/(tabs)/cards.tsx'
          grep -q 'フォルダ名を編集' 'app/(tabs)/cards.tsx'
          npm ci
          npm run typecheck
          npm run lint
          npx expo-doctor

      - name: Start and wait for Codemagic Build 12
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token:
              raise SystemExit('CM_API_TOKEN missing')
          app_id='6a769d81a1add9d06020b524'
          workflow='toru-tango-ios-testflight'
          branch='release/toru-tango-build12-20260923'

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method)
              req.add_header('Content-Type','application/json')
              req.add_header('x-auth-token',token)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          status,started=api('https://api.codemagic.io/builds','POST',{
              'appId':app_id,
              'workflowId':workflow,
              'branch':branch,
          })
          if not 200 <= status < 300:
              raise SystemExit(f'Codemagic start failed HTTP {status}: {started}')
          build_id=started.get('buildId') or started.get('id')
          if not build_id:
              raise SystemExit(f'Codemagic did not return buildId: {started}')
          Path('/tmp/toru-cm-build-id.txt').write_text(str(build_id))
          print(f'Codemagic Build 12 started: {build_id}')

          terminal={'finished','failed','canceled','timeout','skipped'}
          deadline=time.time()+3000
          final=None
          while time.time()<deadline:
              s,payload=api(f'https://api.codemagic.io/builds?appId={app_id}')
              if not 200 <= s < 300:
                  raise SystemExit(f'Codemagic inspect failed HTTP {s}: {payload}')
              rows=payload.get('builds') or payload.get('data') or []
              if isinstance(rows,dict): rows=rows.get('builds') or []
              match=next((b for b in rows if str(b.get('_id') or b.get('id') or '')==str(build_id)),None)
              if match and match.get('status') in terminal:
                  final=match
                  break
              time.sleep(20)
          if final is None:
              raise SystemExit('Codemagic Build 12 timeout')
          result={'build_id':str(build_id),'status':final.get('status'),'branch':branch,'workflow':workflow}
          Path('/tmp/toru-cm-result.json').write_text(json.dumps(result,indent=2))
          if final.get('status')!='finished':
              raise SystemExit(f"Codemagic Build 12 ended {final.get('status')}")
          print(f'Codemagic Build 12 finished: {build_id}')
          PY

      - name: Upload Build 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-build12-codemagic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/toru-build12-sha.txt
            /tmp/toru-cm-build-id.txt
            /tmp/toru-cm-result.json
          if-no-files-found: warn
          retention-days: 30

  finalize:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[TORU-TANGO] Build12 TestFlight and App Review'
    needs: build12
    runs-on: macos-15
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_SCREENSHOT_FIXTURES: '1'
    steps:
      - name: Checkout main tooling
        uses: actions/checkout@v4
        with:
          path: main-src

      - name: Checkout exact Build 12 source
        uses: actions/checkout@v4
        with:
          ref: release/toru-tango-build12-20260923
          path: release-src

      - name: Select newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -1)
          test -n "$latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: release-src/toru-tango-mobile/package-lock.json

      - name: Install dependencies
        working-directory: release-src/toru-tango-mobile
        run: npm ci

      - name: Inject screenshot-only sample cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('release-src/toru-tango-mobile/src/repositories/storage.ts')
          text = p.read_text(encoding='utf-8')
          marker = "  return {\n    cards,\n    history,\n    decks: normalizeDecks([...storedDecks, ...decksFromCards]),\n    studyDays: normalizeStudyDays([...storedStudyDays, ...legacyStudyDays])\n  };"
          if marker not in text:
              raise SystemExit('storage fixture injection marker not found')
          lines = [
              "  if (!cards.length && process.env.EXPO_PUBLIC_SCREENSHOT_FIXTURES === '1') {",
              "    const now = '2026-09-23T00:00:00.000Z';",
              "    const fixtureCards: Card[] = [",
              "      { id:'e1', question:'abandon', answer:'捨てる・断念する', deckName:'英単語 TOEIC', correct:5, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now },",
              "      { id:'e2', question:'accurate', answer:'正確な', deckName:'英単語 TOEIC', correct:4, wrong:0, lastStudiedAt:now, createdAt:now, updatedAt:now },",
              "      { id:'j1', question:'鎌倉幕府を開いた人物は？', answer:'源頼朝', deckName:'日本史', correct:6, wrong:0, lastStudiedAt:now, createdAt:now, updatedAt:now },",
              "      { id:'b1', question:'DNAを構成する糖は？', answer:'デオキシリボース', deckName:'生物', correct:3, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now }",
              "    ];",
              "    const fixtureHistory: StudyHistory[] = [",
              "      { id:'h1', cardId:'e1', answeredAt:now, dateKey:'2026-09-23', correct:true },",
              "      { id:'h2', cardId:'j1', answeredAt:now, dateKey:'2026-09-23', correct:true }",
              "    ];",
              "    return { cards: fixtureCards, history: fixtureHistory, decks: ['英単語 TOEIC','日本史','生物'], studyDays: ['2026-09-23'] };",
              "  }",
              "",
          ]
          p.write_text(text.replace(marker, "\n".join(lines) + marker), encoding='utf-8')
          PY

      - name: Validate Build 12 UI source
        working-directory: release-src/toru-tango-mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "buildNumber: '12'" app.config.ts
          grep -q 'フォルダ名を編集' 'app/(tabs)/cards.tsx'
          grep -q '並べ替え完了' 'app/(tabs)/cards.tsx'
          npm run typecheck
          npm run lint

      - name: Generate native iOS project
        working-directory: release-src/toru-tango-mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: release-src/toru-tango-mobile/ios
        run: pod install

      - name: Pick App Store screenshot simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          rows=[]
          for runtime,items in data.get('devices',{}).items():
              if 'iOS' in runtime:
                  rows.extend([x for x in items if x.get('isAvailable') and str(x.get('name','')).startswith('iPhone')])
          preferred=['iPhone 16 Pro Max','iPhone 16 Plus','iPhone 15 Pro Max','iPhone 15 Plus','iPhone 14 Pro Max']
          hit=None
          for name in preferred:
              hit=next((x for x in rows if x.get('name')==name),None)
              if hit: break
          if not hit: raise SystemExit('No accepted large-iPhone simulator available')
          Path('/tmp/toru-shot-udid').write_text(hit['udid'])
          Path('/tmp/toru-shot-device').write_text(hit['name'])
          print(hit['name'],hit['udid'])
          PY

      - name: Build app for Simulator
        working-directory: release-src/toru-tango-mobile
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 2 -name '*.xcworkspace' -print | head -1)
          test -n "$workspace"
          scheme=$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          udid=$(cat /tmp/toru-shot-udid)
          EXPO_PUBLIC_SCREENSHOT_FIXTURES=1 xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath /tmp/toru-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=$(find /tmp/toru-derived/Build/Products -path '*Release-iphonesimulator/*.app' -print | head -1)
          test -n "$app"
          echo "$app" > /tmp/toru-app-path

      - name: Capture real Build 12 App Store screenshot
        shell: bash
        run: |
          set -euo pipefail
          udid=$(cat /tmp/toru-shot-udid)
          app=$(cat /tmp/toru-app-path)
          mkdir -p /tmp/toru-final-screens
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time '9:41' --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --terminate-running-process "$udid" "$APP_BUNDLE_ID"
          sleep 8
          out=/tmp/toru-final-screens/01-folders.png
          xcrun simctl io "$udid" screenshot "$out"
          width=$(sips -g pixelWidth "$out" | awk '/pixelWidth/{print $2}')
          height=$(sips -g pixelHeight "$out" | awk '/pixelHeight/{print $2}')
          echo "screenshot=${width}x${height} device=$(cat /tmp/toru-shot-device)"
          case "${width}x${height}" in
            1260x2736|1290x2796|1320x2868|1284x2778|1242x2688) ;;
            *) echo "Unexpected screenshot size: ${width}x${height}"; exit 1 ;;
          esac

      - name: Wait for Apple Build 12 to become VALID
        working-directory: main-src
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import os, time
          from app_store_connect_api import api_get, load_private_key, make_token
          app_id='6795968222'
          target='12'
          issuer=os.environ['ASC_ISSUER_ID']
          key_id=os.environ['ASC_KEY_ID']
          key_path, cleanup = load_private_key()
          try:
              token=make_token(issuer,key_id,key_path)
              deadline=time.time()+1500
              last=[]
              while time.time()<deadline:
                  _,payload=api_get(token,f'/v1/apps/{app_id}/builds?sort=-uploadedDate&limit=100')
                  rows=(payload or {}).get('data') or []
                  matches=[x for x in rows if str((x.get('attributes') or {}).get('version'))==target]
                  last=[((x.get('attributes') or {}).get('processingState'),(x.get('attributes') or {}).get('expired')) for x in matches]
                  if any((x.get('attributes') or {}).get('processingState')=='VALID' and not (x.get('attributes') or {}).get('expired',False) for x in matches):
                      print('Apple Build 12 VALID')
                      break
                  time.sleep(20)
              else:
                  raise SystemExit(f'Apple Build 12 did not become VALID: {last}')
          finally:
              if cleanup:
                  cleanup.unlink(missing_ok=True)
          PY

      - name: Upload screenshot and submit Build 12 for App Review
        id: submit
        working-directory: main-src
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import sys
          import toru_tango_finalize_submission as submitter
          submitter.BUILD='12'
          sys.argv=[
              'toru_tango_finalize_submission.py',
              '--screens','/tmp/toru-final-screens',
              '--output','/tmp/toru-build12-final-result.json',
          ]
          submitter.main()
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-build12-app-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/toru-final-screens
            /tmp/toru-build12-final-result.json
            /tmp/toru-shot-device
          if-no-files-found: warn
          retention-days: 30

      - name: Report final result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const lines=['撮る単語帳 Build 12 / TestFlight + App Review result.'];
            if(fs.existsSync('/tmp/toru-build12-final-result.json')) {
              const r=JSON.parse(fs.readFileSync('/tmp/toru-build12-final-result.json','utf8'));
              lines.push(`submitted=${r.submitted}`);
              lines.push(`review_submission_state=${r.review_submission_state||''}`);
              lines.push(`apple_build_id=${r.build_id||''}`);
              lines.push(`build_processing_state=${r.build_processing_state||''}`);
              lines.push(`build_attached=${r.build_attached||false}`);
              lines.push(`complete_screenshot_count=${r.complete_screenshot_count||0}`);
              lines.push(`screenshots_uploaded_new=${r.screenshots_uploaded_new||0}`);
              lines.push(`release_type=${r.release_type||''}`);
              lines.push(`release_performed=${r.release_performed}`);
              if(r.error) lines.push(`error=${r.error}`);
            } else {
              lines.push('submitted=false');
              lines.push('error=pipeline_failed_before_final_submission_result');
            }
            lines.push(`job_status=${{ toJSON(job.status) }}`);
            lines.push(`run_id=${context.runId}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: lines.join('\n')
            });
