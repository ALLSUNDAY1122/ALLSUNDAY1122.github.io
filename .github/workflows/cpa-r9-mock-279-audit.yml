name: CPA R9 mock and 279 integration audit

on:
  push:
    branches:
      - feature/cpa-r9-mock-279-loop-v1
    paths:
      - 'learning-sprint/cpa-short-answer/**'
      - '.github/workflows/cpa-r9-mock-279-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'learning-sprint/cpa-short-answer/**'
      - '.github/workflows/cpa-r9-mock-279-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cpa-r9-mock-279-loop-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import previously audited R8 official corpus
        run: |
          git fetch origin feature/cpa-r8-content-loop-v3:refs/remotes/origin/cpa-r8-audit
          mkdir -p learning-sprint/cpa-short-answer/r8-content
          git show origin/cpa-r8-audit:learning-sprint/cpa-short-answer/r8-content/questions-r8-official.json > learning-sprint/cpa-short-answer/r8-content/questions-r8-official.json
          git show origin/cpa-r8-audit:learning-sprint/cpa-short-answer/r8-content/audit-result.json > learning-sprint/cpa-short-answer/r8-content/audit-result.json
      - name: Generate and audit R9 independent mock
        run: python learning-sprint/cpa-short-answer/r9-mock/generate_and_audit_r9.py
      - name: Integrate 279 questions
        run: python learning-sprint/cpa-short-answer/integration/integrate_279.py
      - name: Run common Learning Sprint audit
        run: python automation/learning-sprint-question-pipeline/validate_questions.py learning-sprint/cpa-short-answer/integration/learning-sprint-audit.json
      - name: Persist audited artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-sprint/cpa-short-answer/r8-content/questions-r8-official.json \
                  learning-sprint/cpa-short-answer/r8-content/audit-result.json \
                  learning-sprint/cpa-short-answer/r9-mock/questions-r9-mock.json \
                  learning-sprint/cpa-short-answer/r9-mock/audit-r9-mock.json \
                  learning-sprint/cpa-short-answer/r9-mock/topic-map-r9.json \
                  learning-sprint/cpa-short-answer/integration/questions-all-279.json \
                  learning-sprint/cpa-short-answer/integration/audit-integration-279.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate audited CPA 279-question bank"
            git push origin HEAD:feature/cpa-r9-mock-279-loop-v1
          fi
