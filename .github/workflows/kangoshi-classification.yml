name: Kangoshi 11 Subject Classification Loop

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Kangoshi Official Exam Import']
    types: [completed]
  push:
    paths:
      - 'kangoshi-sprint/product-content/raw/set1-raw.json'
      - 'kangoshi-sprint/product-content/raw/set2-raw.json'
      - 'kangoshi-sprint/product-content/raw/set3-raw.json'
      - 'kangoshi-sprint/product-content/classify_questions.py'
      - 'kangoshi-sprint/product-content/refine_classification*.py'
      - 'kangoshi-sprint/product-content/apply_situation_classification_corrections.py'
      - 'kangoshi-sprint/product-content/situation-audit/classification-corrections.json'
      - 'kangoshi-sprint/product-content/run_classification_loop.py'
      - 'kangoshi-sprint/product-content/validate_classification.py'
      - 'kangoshi-sprint/product-content/audit_classification_semantics.py'
      - 'kangoshi-sprint/product-content/audit_situation_group_semantics.py'
      - 'kangoshi-sprint/product-content/summarize_situation_groups.py'
      - 'kangoshi-sprint/product-content/validate_classification_warnings.py'
      - 'kangoshi-sprint/product-content/classification-warning-resolutions.json'
      - '.github/workflows/kangoshi-classification.yml'

concurrency:
  group: kangoshi-classification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run classification loop
        shell: bash
        run: |
          mkdir -p kangoshi-sprint/product-content/classified
          set +e
          python3 kangoshi-sprint/product-content/run_classification_loop.py > kangoshi-sprint/product-content/classified/loop.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/classified/loop.log
          echo "$code" > kangoshi-sprint/product-content/classified/loop.exit
      - name: Record manifest classification state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('kangoshi-sprint/product-content'); manifest=root/'manifest.json'
          d=json.loads(manifest.read_text(encoding='utf-8'))
          rp=root/'classified/classification-report.json'; report=json.loads(rp.read_text(encoding='utf-8')) if rp.exists() else {}
          loop_exit=int((root/'classified/loop.exit').read_text().strip())
          warn=root/'classified/warning-resolution-audit.json'
          wr=json.loads(warn.read_text(encoding='utf-8')) if warn.exists() else {}
          corr=root/'classified/situation-classification-correction-report.json'
          cr=json.loads(corr.read_text(encoding='utf-8')) if corr.exists() else {}
          d['classificationLoop']={
              'method':report.get('method','unknown'),
              'high':report.get('high',0),
              'medium':report.get('medium',0),
              'low':report.get('low',0),
              'unclassified':report.get('unclassified',0),
              'needsReview':len(report.get('needsReview',[])),
              'warningCount':wr.get('warningCount'),
              'resolvedWarnings':wr.get('resolvedCount'),
              'situationSpecialistCorrectionsApplied':cr.get('appliedCount',0),
              'auditExit':loop_exit,
              'status':'pass' if loop_exit==0 else 'fail'
          }
          manifest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit classification result and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/product-content/classified kangoshi-sprint/product-content/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: classification loop result [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
      - name: Enforce classification gate
        shell: bash
        run: test "$(cat kangoshi-sprint/product-content/classified/loop.exit)" = "0"
