name: APP2-009 Kangoshi Codemagic Fix and Build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix-and-build:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[APP2-009] Fix Codemagic and build TestFlight'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install explicit managed-signing Kangoshi workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('codemagic.yaml'); s=p.read_text(encoding='utf-8')
          block=r'''  kangoshi-ios:
    name: 看護師国家試験 - iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.kangoshi
        APP_STORE_CONNECT_APP_ID: "6801792293"
        CODEMAGIC_PROFILE_REF: kangoshi_appstore_20260822
        IAP_PRODUCT_ID: jp.allsunday1122.kangoshi.monthly
        IAP_LIFETIME_PRODUCT_ID: jp.allsunday1122.kangoshi.lifetime
        APPICON_SHA256: 6afe16483852c98e0e030874ce7829f0e1a42fe017bb2f854eee1d9410f8ee80
        XCODE_PROJECT: kangoshi-sprint/ios/KangoshiSprint.xcodeproj
        XCODE_SCHEME: KangoshiSprint
      xcode: latest
    scripts:
      - name: Install native build tools
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2'
      - name: Audit Kangoshi release inputs
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"
          test -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}"
          test -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test "$BUNDLE_ID" = "jp.allsunday1122.kangoshi"
          test "$IAP_PRODUCT_ID" = "jp.allsunday1122.kangoshi.monthly"
          test "$IAP_LIFETIME_PRODUCT_ID" = "jp.allsunday1122.kangoshi.lifetime"
          node kangoshi-sprint/audit-official-difficulty.mjs
          python3 kangoshi-sprint/ios/tools/normalize_swift_numeric_literals.py
          python3 kangoshi-sprint/ios/tools/prepare_native_content.py
          test -f kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          echo "$APPICON_SHA256  kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" | shasum -a 256 -c -
          python3 -c "import json;d=json.load(open('kangoshi-sprint/ios/GeneratedResources/native-content-audit.json',encoding='utf-8'));assert d['pass'] and d['questions']==720 and d['byExam']=={'115':240,'114':240,'113':240};print('PASS: canonical 720-question payload')"
      - name: Set CI build number and generate native project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/kangoshi-sprint/ios"
          BUILD_NUM="${CM_BUILD_NUMBER:?CM_BUILD_NUMBER is required}"
          python3 - "$BUILD_NUM" <<'PYBUILD'
          from pathlib import Path
          import re,sys
          p=Path('project.yml'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'CURRENT_PROJECT_VERSION:\s*\d+', 'CURRENT_PROJECT_VERSION: '+sys.argv[1], text, count=1)
          if n!=1: raise RuntimeError('CURRENT_PROJECT_VERSION replacement failed')
          p.write_text(text,encoding='utf-8')
          PYBUILD
          xcodegen generate
      - name: Initialize signing keychain
        script: |
          set -euo pipefail
          keychain initialize
      - name: Fetch managed App Store signing files
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
      - name: Add signing certificate to keychain
        script: |
          set -euo pipefail
          keychain add-certificates
      - name: Apply App Store signing profile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/kangoshi-sprint/ios"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Upload signed IPA to App Store Connect
        script: |
          set -euo pipefail
          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          app-store-connect publish --path "$IPA_PATH" --altool-retries 3 --altool-retry-wait 2
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
'''
          m=re.search(r'(?ms)^  kangoshi-ios:\n.*?(?=^  \S[^\n]*:\n|\Z)',s)
          if not m: raise SystemExit('kangoshi-ios block not found')
          out=s[:m.start()]+block+s[m.end():]
          p.write_text(out,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          required=['- app2_010_touhan_signing','CERTIFICATE_PRIVATE_KEY','fetch-signing-files "$BUNDLE_ID"','keychain add-certificates','xcode-project use-profiles','app-store-connect publish','jp.allsunday1122.kangoshi.lifetime']
          for token in required:
            if token not in check: raise SystemExit('missing token: '+token)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'APP2-009: use explicit managed signing for Kangoshi'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build Kangoshi and wait
        id: build
        continue-on-error: true
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          cat >/tmp/app2-009-command.json <<'JSON'
          {"request_id":"app2-009-kangoshi-explicit-signing-20260822","action":"build","workflow_id":"kangoshi-ios","branch":"main","wait":true,"timeout_seconds":4200}
          JSON
          python scripts/codemagic_build_gateway.py --command /tmp/app2-009-command.json --output /tmp/app2-009-result.json
      - name: Persist sanitized build result
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/app2-009-result.json ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/app2-009-result.json').read_text(encoding='utf-8'))
          allowed={k:r.get(k) for k in ('request_id','ok','workflow_id','branch','resolved_app_id','build_id','status','app_id','error','build_details','actions')}
          Path('/tmp/app2-009-sanitized.json').write_text(json.dumps(allowed,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/codemagic-results
          cp /tmp/app2-009-sanitized.json automation/codemagic-results/app2-009-kangoshi-explicit-signing-20260822.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/codemagic-results/app2-009-kangoshi-explicit-signing-20260822.json
          if ! git diff --cached --quiet; then
            git commit -m 'APP2-009: persist explicit-signing Kangoshi build result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-009 explicit-signing build finished. status=${{ job.status }}; build_outcome=${{ steps.build.outcome }}; run_id=${context.runId}`});
