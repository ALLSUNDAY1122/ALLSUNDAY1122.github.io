name: Temporary sync release queue 208

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-release-queue-208.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize release queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          central = next(entry for entry in data['entries'] if entry['region'] == 'central')
          if not any(m['code'] == '21364' for m in central['municipalities']):
              central['municipalities'].append({'code': '21364', 'name': '神戸町'})
          central['count'] = len(central['municipalities'])
          central['pendingSinceLastRelease'] = 8
          central['releaseStatus'] = 'pending_threshold'
          central['reason'] = '恵那市から郡上市までの追加10自治体をPR #377でmainへ全国統合し、生成・公開をPR #380で174自治体へ更新。その後、下呂市・海津市・岐南町・笠松町・養老町・垂井町・関ケ原町・神戸町を地方統合'
          central['auditStatus'] = 'passed'

          data['updatedAt'] = '2026-07-22T02:00:00+09:00'
          summary = data['summary']
          summary['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          summary['releaseReadyRegions'] = [entry['region'] for entry in data['entries'] if entry['pendingSinceLastRelease'] >= 10]
          data['nextAction'] = '東日本が前回全国統合後9自治体で先行。中日本8、北日本6、西日本2。桜川市（08231）の地方統合で東日本10自治体に到達したら直ちに全国統合する。'
          data['humanDecisionRequired'] = False
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-sync-release-queue-208.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-208.yml
          git commit -m '統括管理: 地方統合208自治体・公開184自治体へ同期'
          git push origin main
