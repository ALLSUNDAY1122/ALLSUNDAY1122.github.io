name: Temporary North B Anyone Multiple Gap Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-anyone-multiple-gap-region-sync.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-multiple-gap-region-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout regional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import confirmed files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            jichitai-compare/data/municipalities/01/01607.json \
            jichitai-compare/data/municipalities/01/01609.json \
            jichitai-compare/data/municipalities/04/04212.json \
            jichitai-compare/data/municipalities/04/04444.json \
            jichitai-compare/data/municipalities/05/05204.json \
            jichitai-compare/data/municipalities/05/05361.json \
            jichitai-compare/data/municipalities/05/05434.json \
            jichitai-compare/data/municipalities/06/06364.json \
            jichitai-compare/operations/tasks/01607.json \
            jichitai-compare/operations/tasks/01609.json \
            jichitai-compare/operations/tasks/04212.json \
            jichitai-compare/operations/tasks/04444.json \
            jichitai-compare/operations/tasks/05204.json \
            jichitai-compare/operations/tasks/05361.json \
            jichitai-compare/operations/tasks/05434.json \
            jichitai-compare/operations/tasks/06364.json \
            jichitai-compare/operations/audits/north-b-anyone-multiple-gap-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json

      - name: Commit regional synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-anyone-multiple-gap-review-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json
          if git diff --cached --quiet; then
            echo 'No regional changes to commit.'
            exit 1
          fi
          git commit -m 'sync: 北日本B誰でも通園補正をregion/northへ反映 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
