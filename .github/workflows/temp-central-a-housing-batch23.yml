name: Temporary Central A Housing Batch 23

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch23-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch23-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 23
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T08:33:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const unavailable='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const decisions={
            '27214':{
              type:'general_seismic_support_misclassification',
              service:{
                status:'unavailable',
                summary:unavailable,
                details:{
                  confirmedGeneralProgram:'旧耐震基準の住宅等を対象とする耐震診断・改修・除却補助を確認した。',
                  classificationReview:'一般的な耐震化制度であり、子育て・新婚・三世代世帯固有の対象要件や加算を現行公式情報で確認できないため、子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.city.tondabayashi.lg.jp/soshiki/32/44454.html',checkedAt}
              }
            },
            '27215':{
              type:'ended_newlywed_program_general_seismic_only',
              service:{
                status:'unavailable',
                summary:unavailable,
                details:{
                  endedProgram:'寝屋川市結婚新生活支援補助金は市公式ページで終了と明記されている。',
                  confirmedGeneralProgram:'旧耐震基準等の住宅を対象とする耐震診断・改修・除却補助を確認した。',
                  classificationReview:'終了済みの新婚支援を現行制度として扱わず、府営住宅の新婚・子育て世帯向け募集も大阪府制度であるため、市独自の子育て住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.city.neyagawa.osaka.jp/organization_list/kodomo/kosodatesienka/bosi_kenkou/18759.html',checkedAt},
                additionalSources:[{url:'https://www.city.neyagawa.osaka.jp/kurashi/sumai_kenchiku/taishin/10600.html',checkedAt,description:'令和8年度の一般耐震補助'}]
              }
            },
            '27216':{
              type:'replace_with_current_child_nearby_home_acquisition',
              service:{
                status:'verified',
                summary:'就学前の子がいる世帯または夫婦とも40歳未満の子のいない世帯が、市内親族と近居・同居する住宅取得へ最大30万円の補助を受けられる。制度は2026年9月30日で終了する。',
                details:{
                  program:'河内長野市近居同居促進マイホーム取得補助制度',
                  target:'申請時に就学前の子がいる世帯、または夫婦とも40歳未満で子がいない世帯',
                  condition:'市内に1年以上居住する祖父母・親・兄弟姉妹世帯との近居または同居を目的に住宅を取得し、住宅借入金500万円以上等の要件を満たすこと',
                  amount:'近居10万円、同居20万円、市外からの転入は最大30万円',
                  programEnd:'補助対象要件の基準日は2026年9月30日まで',
                  applicationDeadline:'2027年3月31日まで。予算上限で早期終了する場合あり'
                },
                source:{url:'https://www.city.kawachinagano.lg.jp/soshiki/2/4120.html',checkedAt},
                additionalSources:[{url:'https://www.city.kawachinagano.lg.jp/soshiki/20/121423.html',checkedAt,description:'2026年4月から市営住宅の子育て世帯年齢要件を18歳年度末までへ拡大'}]
              }
            },
            '27217':{
              type:'replace_with_current_newlywed_program',
              service:{
                status:'verified',
                summary:'39歳以下の新婚・パートナーシップ世帯へ、令和8年度の住宅取得・賃借・リフォーム・引越費用を上限30万円または60万円補助し、住宅購入時は上限50万円または100万円とする。',
                details:{
                  program:'令和8年度松原市結婚等新生活応援補助金',
                  target:'令和8年1月1日から令和9年3月31日までに婚姻等をし、夫婦等が39歳以下等の要件を満たす世帯',
                  coveredCosts:'住宅取得費、住宅賃借費、リフォーム費、引越費用',
                  amount:'双方29歳以下は上限60万円、その他39歳以下は上限30万円',
                  purchaseAmount:'住宅購入世帯は双方29歳以下で上限100万円、その他39歳以下で上限50万円',
                  intake:'2026年5月1日からオンラインで先着順受付。予算範囲内'
                },
                source:{url:'https://www.city.matsubara.lg.jp/docs/2554071.html',checkedAt},
                additionalSources:[{url:'https://www.city.matsubara.lg.jp/docs/2547981.html',checkedAt,description:'市外から転入して購入住宅へ入居する子育て世帯向け応援補助金'}]
              }
            },
            '27218':{
              type:'replace_with_current_child_newlywed_municipal_housing',
              service:{
                status:'verified',
                summary:'大東市営もりねき住宅で、新婚・子育て世帯向け区分を設けて募集する。令和8年6月随時募集では1戸を募集し、抽選結果を公表した。',
                details:{
                  program:'大東市営もりねき住宅 新婚・子育て世帯向け区分',
                  target:'共通申込資格に加え、婚姻届出から募集期間末日まで1年以内の新婚世帯、婚約世帯、子育て世帯、ひとり親世帯等の区分要件を満たす世帯',
                  currentRecruitment:'令和8年6月随時募集では、なら棟201号の1戸を新婚・子育て世帯向け区分として募集',
                  result:'2026年7月6日に抽選結果を公表。申込者が複数でなかったため無抽選',
                  nextIntake:'今後の募集は大東市営住宅の公式募集案内を確認する。'
                },
                source:{url:'https://www.city.daito.lg.jp/soshiki/73/47693.html',checkedAt},
                additionalSources:[{url:'https://www.city.daito.lg.jp/soshiki/73/27827.html',checkedAt,description:'新婚・子育て世帯向け区分の世帯基準'}]
              }
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(decisions)){
            const dataPath=path.join(root,'data/municipalities','27',`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=structuredClone(municipality.services.housingSupport);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(value=>value.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(value=>value==='verified').length;
            task.researchingCount=statuses.filter(value=>value==='researching').length;
            task.unavailableCount=statuses.filter(value=>value==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(value=>value==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第23群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            records.push({code,name:municipality.name,service:'housingSupport',decisionType:entry.type,changed:true,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch23-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:2,verifiedReplacementCount:3,decisions:records,causeScan:{previousRemainingCandidates:64,reviewedHighRiskCandidates:5,remainingCandidates:59},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般耐震制度だけを子育て世帯向け住宅支援として登録しない','終了済み新婚支援を現行制度として扱わない','子育て・新婚世帯向け住宅取得・家賃・市営住宅募集は年度と受付状態を明記する'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch23-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残59件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=169;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=601;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=59;
          checkpoint.qualityReaudit.confirmedCorrections.push(...records.map(record=>({type:record.decisionType,code:record.code,service:'housingSupport',name:record.name})));
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残59件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.lastAction='住宅支援分類第23群として、富田林市・寝屋川市・河内長野市・松原市・大東市のhousingSupportを現行公式情報で再分類した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch={batch:23,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,correctedMunicipalityCount:5,remainingCandidates:59,regionalPullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),blocker:null};
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch23-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/27/27214.json|jichitai-compare/data/municipalities/27/27215.json|jichitai-compare/data/municipalities/27/27216.json|jichitai-compare/data/municipalities/27/27217.json|jichitai-compare/data/municipalities/27/27218.json|jichitai-compare/operations/tasks/27214.json|jichitai-compare/operations/tasks/27215.json|jichitai-compare/operations/tasks/27216.json|jichitai-compare/operations/tasks/27217.json|jichitai-compare/operations/tasks/27218.json|jichitai-compare/operations/audits/central-a-housing-classification-batch23-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/27214/index.html|jichitai-compare/municipality/27215/index.html|jichitai-compare/municipality/27216/index.html|jichitai-compare/municipality/27217/index.html|jichitai-compare/municipality/27218/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch23-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第23群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
