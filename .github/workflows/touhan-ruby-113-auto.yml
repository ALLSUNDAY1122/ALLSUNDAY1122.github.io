name: Touhan 113 Raw PDF Ruby Auto Rebuild
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/auto_rebuild_ruby_113.py'
      - '.github/workflows/touhan-ruby-113-auto.yml'
permissions:
  contents: write
concurrency:
  group: touhan-ruby-113-auto
  cancel-in-progress: false
jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser and Japanese rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk fontconfig
          sudo fc-cache -f
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.5' 'playwright==1.56.0' 'pillow==11.3.0'
          google-chrome --version
          fc-match 'Noto Sans CJK JP'
      - name: Rebuild ruby from raw PDF and certify rendered DOM
        run: python touroku-hanbaisha-sprint/official-kansai/auto_rebuild_ruby_113.py
      - name: Validate pass, hold and canonical counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          report=json.loads((b/'RUBY_113_AUTO_REBUILD_20261124.json').read_text())
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          st=json.loads(Path('touroku-hanbaisha-ios/release-status.json').read_text())
          assert report['processed']==113
          assert report['autoPassed']+report['held']+report.get('previouslyApproved',0)==113
          assert len(report['records'])==113
          assert bank['count']==report['baseline']+report['autoPassed']
          assert bank['count']==len(bank['approvedIds'])==len(bank['questions'])
          assert len(set(bank['approvedIds']))==bank['count']
          assert bank['count']==st['question_bank']['production_official_bank_count']
          assert 'KSAI-2023-090' not in bank['approvedIds']
          assert st['release_gate']=='BLOCKED' and not st['app_review_submitted']
          assert all((r['status'] in ('AUTO_PASS','ALREADY_APPROVED')) == (len(r['reasons'])==0) for r in report['records'])
          print('PASS',report['autoPassed'],'HOLD',report['held'],'bank',bank['count'])
          PY
      - name: Commit evidence and status after all checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f touroku-hanbaisha-sprint/official-kansai/RUBY_113_AUTO_REBUILD_20261124.json
          git add -f touroku-hanbaisha-sprint/official-kansai/ruby-auto-113/
          git add -f touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json
          git add touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit(touhan): auto-promote strictly verified ruby questions and persist holds'
            for retry in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-ruby-113-auto-evidence
          path: |
            touroku-hanbaisha-sprint/official-kansai/RUBY_113_AUTO_REBUILD_20261124.json
            touroku-hanbaisha-sprint/official-kansai/ruby-auto-113/
          if-no-files-found: ignore
