name: Temporary Fix Hiezu Hazard Source

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/31384-hazard-source-url-20260725
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Replace stale source URL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old = 'https://www.hiezu.jp/list/soumu/y121/u509/e970/z228/'
          new = 'https://www.hiezu.jp/list/soumu/y121/u509/e970/'

          source_path = Path('jichitai-compare/data/municipalities/31/31384.json')
          source = json.loads(source_path.read_text(encoding='utf-8'))
          service = source['services']['disasterPrevention']
          if service['source']['url'] != old:
              raise SystemExit(f'unexpected source URL: {service["source"]["url"]}')
          service['source']['url'] = new
          service['source']['checkedAt'] = '2026-07-25'
          source['updatedAt'] = '2026-07-25'
          source_path.write_text(json.dumps(source, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          task_path = Path('jichitai-compare/operations/tasks/31384.json')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          task['officialSources'] = [new if url == old else url for url in task.get('officialSources', [])]
          task['lastCheckedAt'] = '2026-07-25'
          task['lastUpdatedAt'] = '2026-07-25T00:20:00+09:00'
          task['lastUpdatedBy'] = '西日本調査班B（概略検証第1回）'
          note = '概略検証第1回で防災出典の旧個別URLが404となったため、内容を維持したまま現行の公式ハザードマップ一覧URLへ更新。'
          if note not in task.get('notes', []):
              task.setdefault('notes', []).append(note)
          task_path.write_text(json.dumps(task, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check scripts/generate-municipality-pages.mjs
          node --check scripts/validate-municipality-pages.mjs

      - name: Remove workflow and commit synchronized files
        run: |
          rm .github/workflows/temp-fix-31384-hazard-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-fix-31384-hazard-source.yml jichitai-compare
          git commit -m 'fix: update Hiezu hazard map source URL'
          git push origin HEAD:fix/31384-hazard-source-url-20260725
