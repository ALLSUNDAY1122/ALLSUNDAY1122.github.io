name: APP2-002 Nomidokoro Build Only

on:
  push:
    branches: [main]
    paths:
      - automation/app2-002-nomidokoro-build-command.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Start and monitor scoped Codemagic build
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path
          TOKEN=os.environ['CM_API_TOKEN'].strip()
          APP_ID='6a66134ea9f671d548da335a'
          WORKFLOW='ios-native'
          BRANCH='codex/nomikai-arcade-ios-release'
          TERMINAL={'finished','failed','canceled','timeout','skipped'}
          def call(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(url,data=body,method=method,headers={'Content-Type':'application/json','Accept':'application/json','x-auth-token':TOKEN})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8'); return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8',errors='replace')
                  raise RuntimeError(f'Codemagic HTTP {e.code}: {raw[:1200]}')
          status,resp=call('https://api.codemagic.io/builds','POST',{'appId':APP_ID,'workflowId':WORKFLOW,'branch':BRANCH})
          build_id=resp.get('buildId') or resp.get('id')
          if not build_id: raise SystemExit(f'No build id: {resp}')
          result={'task_id':'APP2-002','app_id':APP_ID,'workflow_id':WORKFLOW,'branch':BRANCH,'codemagic_build_id':build_id,'start_http_status':status,'requested_apple_build_number':6,'submit_to_app_store':False}
          out=Path('automation/app2-002-build-result.json')
          deadline=time.time()+2400
          while time.time()<deadline:
              _,details=call(f'https://codemagic.io/api/v3/builds/{build_id}')
              data=details.get('data') or details
              state=data.get('status')
              result['status']=state
              result['finished_at']=data.get('finishedAt')
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('Codemagic status:',state)
              if state in TERMINAL:
                  if state!='finished': raise SystemExit(f'Codemagic build ended: {state}')
                  break
              time.sleep(30)
          else:
              raise SystemExit('Codemagic monitoring timeout')
          print('PASS: Codemagic build finished',build_id)
          PY
      - name: Persist sanitized build result
        if: always() && hashFiles('automation/app2-002-build-result.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/app2-002-build-result.json
          git commit -m "Persist APP2-002 Codemagic build result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
