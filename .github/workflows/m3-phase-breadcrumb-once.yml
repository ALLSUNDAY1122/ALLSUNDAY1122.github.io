name: M3 Phase Breadcrumb One Shot

on:
  push:
    branches:
      - scaniverse/s7-m3-reconstruction-telemetry
    paths:
      - .github/workflows/m3-phase-breadcrumb-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scaniverse/s7-m3-reconstruction-telemetry
          fetch-depth: 0
      - name: Apply fail-closed M3 breadcrumb patch
        run: |
          python3 splat-native-ios/scripts/apply_m3_phase_breadcrumbs.py
          python3 splat-native-ios/scripts/test_reconstruction_contracts.py
      - name: Remove one-shot helpers and commit production patch
        run: |
          rm splat-native-ios/scripts/apply_m3_phase_breadcrumbs.py
          rm .github/workflows/m3-phase-breadcrumb-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splat-native-ios/SplatNative/ScanModel.swift splat-native-ios/scripts/test_reconstruction_contracts.py splat-native-ios/scripts/apply_m3_phase_breadcrumbs.py .github/workflows/m3-phase-breadcrumb-once.yml
          git commit -m "feat(scaniverse): persist reconstruction phase breadcrumbs"
          git push origin HEAD:scaniverse/s7-m3-reconstruction-telemetry
