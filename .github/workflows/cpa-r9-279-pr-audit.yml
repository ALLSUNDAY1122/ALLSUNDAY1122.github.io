name: CPA R9 279-question PR audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'automation/learning-sprint-question-pipeline/**'
      - 'learning-sprint/cpa-short-answer/**'
      - '.github/workflows/cpa-r9-279-pr-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and audit R9 independent mock
        run: python learning-sprint/cpa-short-answer/r9-mock/generate_and_audit_r9.py
      - name: Integrate all 279 questions
        run: python learning-sprint/cpa-short-answer/integration/integrate_279.py
      - name: Common Learning Sprint anti-padding gate
        run: python automation/learning-sprint-question-pipeline/validate_questions.py learning-sprint/cpa-short-answer/integration/learning-sprint-audit.json
      - name: CPA-aware cross-check
        run: python learning-sprint/cpa-short-answer/integration/validate_279_cpa.py
      - name: Show audit summaries
        if: always()
        run: |
          test -f learning-sprint/cpa-short-answer/r9-mock/audit-r9-mock.json && cat learning-sprint/cpa-short-answer/r9-mock/audit-r9-mock.json || true
          test -f learning-sprint/cpa-short-answer/integration/audit-integration-279.json && cat learning-sprint/cpa-short-answer/integration/audit-integration-279.json || true
          test -f learning-sprint/cpa-short-answer/integration/audit-cpa-aware-279.json && cat learning-sprint/cpa-short-answer/integration/audit-cpa-aware-279.json || true
          test -f learning-sprint/cpa-short-answer/integration/canonical-map-279.json && cat learning-sprint/cpa-short-answer/integration/canonical-map-279.json || true
