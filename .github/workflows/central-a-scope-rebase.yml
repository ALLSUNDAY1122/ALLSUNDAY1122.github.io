name: Rebuild Central A Scope Audit on Latest Region

on:
  push:
    branches: ['audit/central-a-scope-verification-r2-20260725']
    paths: ['.github/workflows/central-a-scope-rebase.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-r2-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy corrected Toyama files and normalize task
        shell: bash
        run: |
          set -euo pipefail
          old='audit/central-a-scope-verification-20260724'
          git fetch origin "$old"
          for code in 16202 16204 16205 16206 16210; do
            git show "origin/$old:jichitai-compare/data/municipalities/16/${code}.json" > "jichitai-compare/data/municipalities/16/${code}.json"
          done
          git show "origin/$old:jichitai-compare/operations/control/central-a-scope-verification-20260724.json" > jichitai-compare/operations/control/central-a-scope-verification-20260724.json
          git show "origin/$old:jichitai-compare/operations/tasks/16210.json" > jichitai-compare/operations/tasks/16210.json
          node <<'NODE'
          const fs = require('fs');
          const taskPath = 'jichitai-compare/operations/tasks/16210.json';
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          const oldUrl = 'https://www.city.nanto.toyama.jp/soshiki/kodomo/1/2/5066.html';
          const newUrl = 'https://www.city.nanto.toyama.jp/soshiki/kodomo/1/2/7002.html';
          task.officialSources = task.officialSources.filter((url) => url !== oldUrl && url !== newUrl);
          task.officialSources.splice(5, 0, newUrl);
          task.lastCheckedAt = '2026-07-25';
          task.lastUpdatedAt = '2026-07-25T00:11:00+09:00';
          fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');

          const auditPath = 'jichitai-compare/operations/control/central-a-scope-verification-20260724.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.branch = 'audit/central-a-scope-verification-r2-20260725';
          audit.rebuiltFrom = 'audit/central-a-scope-verification-20260724';
          audit.rebuiltAt = '2026-07-25T00:11:00+09:00';
          audit.nextAction = '富山県修正の通常CIを確認後、第2回として石川県19自治体を監査する';
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          NODE
          rm .github/workflows/central-a-scope-rebase.yml
      - name: Commit rebuilt audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 富山県修正を最新region基点へ再構成'
          git push origin HEAD:audit/central-a-scope-verification-r2-20260725
