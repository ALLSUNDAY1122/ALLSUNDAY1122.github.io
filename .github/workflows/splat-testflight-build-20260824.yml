name: Splat Internal TestFlight 20260824

on:
  push:
    branches:
      - 'testflight/splat-native-ios-20260824'
    paths:
      - '.github/workflows/splat-testflight-build-20260824.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove release source matches current HQ
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin feature/splat-native-ios-poc
          HQ_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$HQ_HEAD" = "091840c13c50c0a1fbf62b63f508e978dca3bf5f"
          if ! git diff --quiet "$HQ_HEAD" HEAD -- splat-native-ios; then
            echo 'Release branch splat-native-ios differs from the validated HQ HEAD.' >&2
            git diff --stat "$HQ_HEAD" HEAD -- splat-native-ios >&2
            exit 1
          fi
          grep -q '^  splat-native-ios:$' codemagic.yaml
          grep -q 'BUNDLE_ID: jp.allsunday1122.splatlab' codemagic.yaml
          grep -q 'APP_STORE_CONNECT_APP_ID: 6803778932' codemagic.yaml
          grep -q 'submit_to_testflight: true' codemagic.yaml
          grep -q 'submit_to_app_store: false' codemagic.yaml
          ! grep -q 'submit_to_app_store: true' codemagic.yaml
          echo "PASS: release source matches HQ $HQ_HEAD"

      - name: Start exact Codemagic Internal TestFlight build
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token:
              raise SystemExit('Missing CM_API_TOKEN')
          app_id='6a769d81a1add9d06020b524'
          workflow_id='splat-native-ios'
          branch='testflight/splat-native-ios-20260824'
          payload=json.dumps({'appId':app_id,'workflowId':workflow_id,'branch':branch}).encode()
          req=urllib.request.Request('https://api.codemagic.io/builds',data=payload,method='POST',headers={
              'x-auth-token':token,'Content-Type':'application/json','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read().decode('utf-8')
                  data=json.loads(raw) if raw else {}
                  status=response.status
          except urllib.error.HTTPError as exc:
              raw=exc.read().decode('utf-8',errors='replace')
              raise SystemExit(f'Codemagic build start failed HTTP {exc.code}: {raw[:1000]}')
          build_id=data.get('buildId') or data.get('id')
          if not build_id:
              raise SystemExit(f'No build id returned: HTTP {status}')
          out={
              'request_id':'scanlab-testflight-20260824',
              'ok':True,
              'status':'started',
              'codemagic_app_id':app_id,
              'workflow_id':workflow_id,
              'branch':branch,
              'release_commit':os.environ.get('GITHUB_SHA'),
              'validated_hq_head':'091840c13c50c0a1fbf62b63f508e978dca3bf5f',
              'build_id':build_id,
              'app_store_connect_app_id':'6803778932',
              'bundle_id':'jp.allsunday1122.splatlab',
              'submit_to_testflight':True,
              'submit_to_app_store':False,
          }
          pathlib.Path('/tmp/scanlab-testflight-build.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print('PASS: Codemagic build started:',build_id)
          PY

      - name: Persist sanitized build locator
        shell: bash
        run: |
          set -euo pipefail
          RESULT='automation/codemagic-results/scanlab-testflight-20260824.json'
          mkdir -p "$(dirname "$RESULT")"
          cp /tmp/scanlab-testflight-build.json "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'release(splat): persist TestFlight candidate locator'
          git push origin HEAD:testflight/splat-native-ios-20260824
