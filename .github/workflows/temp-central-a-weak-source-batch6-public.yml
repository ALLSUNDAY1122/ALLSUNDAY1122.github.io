name: Temporary Central A Weak Source Batch 6 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch6-public-trigger-20260727.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch6-public-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const pages=[
            {code:'27381',name:'太子町'},
            {code:'28214',name:'宝塚市'},
            {code:'28218',name:'小野市'},
            {code:'23237',name:'あま市'},
            {code:'23238',name:'長久手市'}
          ];
          const expected=[
            {code:'27381',name:'太子町',service:'schoolMeals',status:'verified',source:'https://www.town.taishi.osaka.jp/busyo/seisakusoumubu/soumuzaiseika/yosankesanjokyohoukokusho/toushoyosannitsuite/6669.html',additional:['https://www.town.taishi.osaka.jp/material/files/group/8/R8ippan_omonajigyoichiran.pdf','https://www.town.taishi.osaka.jp/busyo/kyouiku_jimu/kyusyokusenta/kondatehyou/2kondate_8/index.html','https://www.town.taishi.osaka.jp/busyo/kyouiku_jimu/kyusyokusenta/2337.html'],summary:'町立幼稚園・小中学校の給食費を無償化し、安全で安心な給食を提供する。'},
            {code:'28214',name:'宝塚市',service:'schoolMeals',status:'verified',source:'https://www.city.takarazuka.hyogo.jp/_res/projects/default_project/_page_/001/012/635/r8_takarazukanoyosan.pdf',additional:['https://www.city.takarazuka.hyogo.jp/1060682/1060706/seikatsushien/1055135.html','https://www.city.takarazuka.hyogo.jp/1060680/1060699/kyoikuiinkai/gakkorecipe/1020803/1062944.html'],summary:'2026年度は給食食材費を引き上げつつ交付金で負担を軽減し、小学校は1食30円、中学校は1食345円を保護者負担とする。'},
            {code:'28218',name:'小野市',service:'sickChildCare',status:'verified',source:'https://www.city.ono.hyogo.jp/section/~somu/reiki/reiki_honbun/v400RG00000870.html',additional:['https://www.city.ono.hyogo.jp/soshikikarasagasu/shiminfukushibu_kosodateshienka/gyomuannai/1/1/3070.html','https://www.city.ono.hyogo.jp/densi_keji/index.html'],summary:'生後6か月から小学校6年生までの病児を、指定医療機関等の専用施設で一時的に預かる。'},
            {code:'23237',name:'あま市',service:'housingSupport',status:'unavailable',source:'https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/index.html',additional:['https://www.city.ama.aichi.jp/kurashi/kotsu/sumai/1005979/1002501.html','https://www.city.ama.aichi.jp/kurashi/kankyo/ondanka/1002443.html'],summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。'},
            {code:'23238',name:'長久手市',service:'housingSupport',status:'unavailable',source:'https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/index.html',additional:['https://www.city.nagakute.lg.jp/soshiki/kensetsubu/toshikeikakuka/3/1/tashinn/hojyokinn/1607.html','https://www.city.nagakute.lg.jp/soshiki/kurashibunkabu/kankyoka/kurashi/gomi/josei/1564.html'],summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;
              const pageChecks=[];
              for(const item of pages){
                const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});
                if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);
                const html=await response.text();
                if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);
                for(const service of expected.filter(x=>x.code===item.code))if(!html.includes(service.summary))throw new Error(`${item.code}:${service.service} page summary mismatch`);
                pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true,serviceSummariesMatched:expected.filter(x=>x.code===item.code).length});
              }
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});
              if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);
              if(!Array.isArray(municipalities)||municipalities.length!==1741)throw new Error(`published municipality count ${municipalities.length}`);
              let serviceCount=0;for(const municipality of municipalities)serviceCount+=Object.keys(municipality.services??{}).length;
              if(serviceCount!==15669)throw new Error(`published service count ${serviceCount}`);
              const serviceChecks=[];
              for(const item of expected){
                const municipality=municipalities.find(x=>String(x.code)===item.code);
                if(!municipality)throw new Error(`${item.code} missing`);
                const service=municipality.services?.[item.service];
                if(service?.status!==item.status)throw new Error(`${item.code}:${item.service} status ${service?.status}`);
                if(service.summary!==item.summary)throw new Error(`${item.code}:${item.service} summary mismatch`);
                if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch`);
                const additionalUrls=(service.additionalSources??[]).map(x=>x.url);
                for(const url of item.additional)if(!additionalUrls.includes(url))throw new Error(`${item.code}:${item.service} additional source missing ${url}`);
                serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,summaryMatched:true,sourceMatched:true,additionalSourcesMatched:item.additional.length});
              }
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch6-public-verification-20260727',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:5,reviewedServiceCount:5,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};
              fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch6-public-verification-20260727.json',JSON.stringify(audit,null,2)+'\n');
              process.exit(0);
            }catch(error){lastError=error;if(attempt<30)await sleep(20000);}
          }
          throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch6-public-trigger-20260727.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第6群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
