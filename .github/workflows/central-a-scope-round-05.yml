name: Central A Scope Audit Round 05

on:
  push:
    branches: ['audit/central-a-scope-verification-round-05-20260725']
    paths: ['.github/workflows/central-a-scope-round-05.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-05-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Shizuoka municipalities
        run: node jichitai-compare/operations/scripts/audit-round05-shizuoka.mjs
      - name: Commit audit result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/central-a-scope-round-05.yml
          rm jichitai-compare/operations/scripts/audit-round05-shizuoka.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 静岡県35自治体の構造監査結果を記録'
          git push origin HEAD:audit/central-a-scope-verification-round-05-20260725
