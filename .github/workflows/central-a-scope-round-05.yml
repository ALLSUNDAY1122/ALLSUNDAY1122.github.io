name: Central A Scope Audit Round 05

on:
  push:
    branches: ['audit/central-a-scope-verification-round-05-20260725']
    paths: ['.github/workflows/central-a-scope-round-05.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-05-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Shizuoka municipalities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit-round05.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const prefectureCode = '22';
          const prefectureName = '静岡県';
          const expected = {
            '22100':'静岡市','22130':'浜松市','22203':'沼津市','22205':'熱海市','22206':'三島市','22207':'富士宮市','22208':'伊東市','22209':'島田市','22210':'富士市','22211':'磐田市','22212':'焼津市','22213':'掛川市','22214':'藤枝市','22215':'御殿場市','22216':'袋井市','22219':'下田市','22220':'裾野市','22221':'湖西市','22222':'伊豆市','22223':'御前崎市','22224':'菊川市','22225':'伊豆の国市','22226':'牧之原市','22301':'東伊豆町','22302':'河津町','22304':'南伊豆町','22305':'松崎町','22306':'西伊豆町','22325':'函南町','22341':'清水町','22342':'長泉町','22344':'小山町','22424':'吉田町','22429':'川根本町','22461':'森町'
          };
          const serviceKeys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const highRiskKeys = ['schoolMeals','postpartumCare','temporaryChildcare','housingSupport'];
          const findings = [];
          const unavailable = [];
          const substantiveSuspects = [];
          const municipalities = [];
          const dataDir = path.join(root,'data','municipalities',prefectureCode);
          const taskDir = path.join(root,'operations','tasks');

          function uniqueSources(data) {
            const out = [];
            const seen = new Set();
            for (const key of serviceKeys) {
              const svc = data.services?.[key];
              const urls = [];
              if (svc?.source?.url) urls.push(svc.source.url);
              if (Array.isArray(svc?.additionalSources)) {
                for (const item of svc.additionalSources) if (item?.url) urls.push(item.url);
              }
              for (const u of urls) if (!seen.has(u)) { seen.add(u); out.push(u); }
            }
            return out;
          }
          function eqArray(a,b){return JSON.stringify(a)===JSON.stringify(b);}
          function addFinding(severity,type,code,extra={}){findings.push({severity,type,code,...extra});}

          for (const [code,name] of Object.entries(expected)) {
            const dataPath = path.join(dataDir,`${code}.json`);
            const taskPath = path.join(taskDir,`${code}.json`);
            if (!fs.existsSync(dataPath)) { addFinding('high','missing_municipality_file',code,{name}); continue; }
            if (!fs.existsSync(taskPath)) { addFinding('high','missing_task_file',code,{name}); continue; }
            let data, task;
            try { data=JSON.parse(fs.readFileSync(dataPath,'utf8')); } catch(e){ addFinding('high','invalid_municipality_json',code,{error:e.message}); continue; }
            try { task=JSON.parse(fs.readFileSync(taskPath,'utf8')); } catch(e){ addFinding('high','invalid_task_json',code,{error:e.message}); continue; }

            if (String(data.code)!==code) addFinding('high','code_mismatch',code,{actual:data.code});
            if (data.name!==name) addFinding('high','name_mismatch',code,{actual:data.name});
            if (String(data.prefectureCode)!==prefectureCode || data.prefecture!==prefectureName) addFinding('high','prefecture_mismatch',code,{actualCode:data.prefectureCode,actualName:data.prefecture});
            if (String(task.municipalityCode)!==code || task.municipalityName!==name) addFinding('high','task_identity_mismatch',code,{actualCode:task.municipalityCode,actualName:task.municipalityName});
            if (String(task.prefectureCode)!==prefectureCode || task.prefectureName!==prefectureName) addFinding('high','task_prefecture_mismatch',code,{actualCode:task.prefectureCode,actualName:task.prefectureName});

            const actualKeys = Object.keys(data.services||{}).sort();
            const expectedKeys = [...serviceKeys].sort();
            if (!eqArray(actualKeys,expectedKeys)) addFinding('high','service_key_mismatch',code,{actualKeys});

            const counts={verified:0,unavailable:0,needs_medium_review:0,researching:0,other:0};
            for (const key of serviceKeys) {
              const svc=data.services?.[key];
              if (!svc) continue;
              if (Object.hasOwn(counts,svc.status)) counts[svc.status]++; else counts.other++;
              if (svc.status==='unavailable') unavailable.push({code,name,service:key,summary:svc.summary||''});
            }
            const completed = serviceKeys.filter(k=>['verified','unavailable','needs_medium_review'].includes(data.services?.[k]?.status));
            if (!eqArray(task.completedServices||[],completed)) addFinding('medium','completed_services_mismatch',code,{expected:completed,actual:task.completedServices||[]});
            if ((task.verifiedCount??null)!==counts.verified) addFinding('medium','verified_count_mismatch',code,{expected:counts.verified,actual:task.verifiedCount});
            if ((task.unavailableCount??null)!==counts.unavailable) addFinding('medium','unavailable_count_mismatch',code,{expected:counts.unavailable,actual:task.unavailableCount});
            if ((task.needsMediumReviewCount??null)!==counts.needs_medium_review) addFinding('medium','review_count_mismatch',code,{expected:counts.needs_medium_review,actual:task.needsMediumReviewCount});
            if ((task.researchingCount??null)!==counts.researching) addFinding('medium','researching_count_mismatch',code,{expected:counts.researching,actual:task.researchingCount});
            const expectedSources=uniqueSources(data);
            if (!eqArray(task.officialSources||[],expectedSources)) addFinding('medium','official_sources_mismatch',code,{expectedCount:expectedSources.length,actualCount:(task.officialSources||[]).length,expectedSources,actualSources:task.officialSources||[]});
            const allCompleted=completed.length===9;
            if (allCompleted && !['verified','needs_medium_review'].includes(data.status)) addFinding('medium','top_level_status_mismatch',code,{actual:data.status});
            if (allCompleted && task.status!=='merged') addFinding('medium','task_status_mismatch',code,{actual:task.status});

            const temp=data.services?.temporaryChildcare;
            if (temp?.status==='verified' && !/(誰でも通園|乳児等通園|月\s*10\s*時間|就労要件を問わ)/.test(`${temp.summary||''} ${JSON.stringify(temp.details||{})}`)) {
              substantiveSuspects.push({severity:'review',type:'possible_any_child_access_omission',code,name,summary:temp.summary||'',source:temp.source?.url||''});
            }
            const meal=data.services?.schoolMeals;
            if (meal?.status==='verified' && /(令和8|2026|無償|無料|当面|年度)/.test(`${meal.summary||''} ${JSON.stringify(meal.details||{})}`)) substantiveSuspects.push({severity:'review',type:'school_meal_currentness_check',code,name,summary:meal.summary||'',source:meal.source?.url||''});
            const post=data.services?.postpartumCare;
            if (post?.status==='verified' && !/(1年|12か月|宿泊|通所|訪問)/.test(`${post.summary||''} ${JSON.stringify(post.details||{})}`)) substantiveSuspects.push({severity:'review',type:'postpartum_scope_check',code,name,summary:post.summary||'',source:post.source?.url||''});
            const house=data.services?.housingSupport;
            if (house?.status==='verified' && /(令和8|2026|受付|年度|予算)/.test(`${house.summary||''} ${JSON.stringify(house.details||{})}`)) substantiveSuspects.push({severity:'review',type:'housing_currentness_check',code,name,summary:house.summary||'',source:house.source?.url||''});

            const highRisk={};
            for(const key of highRiskKeys){const s=data.services?.[key]; highRisk[key]={status:s?.status||null,summary:s?.summary||'',source:s?.source?.url||'',checkedAt:s?.source?.checkedAt||null};}
            municipalities.push({code,name,status:data.status,updatedAt:data.updatedAt,taskStatus:task.status,taskLastCheckedAt:task.lastCheckedAt,verifiedCount:counts.verified,unavailableCount:counts.unavailable,needsMediumReviewCount:counts.needs_medium_review,officialSourceCount:expectedSources.length,taskOfficialSourceCount:(task.officialSources||[]).length,highRisk});
          }

          const report={
            schemaVersion:'1.0.0',auditId:'central-a-scope-round-05-shizuoka-20260725',prefectureCode,prefectureName,
            expectedMunicipalityCount:Object.keys(expected).length,checkedMunicipalityCount:municipalities.length,checkedServiceCount:municipalities.length*9,
            generatedAt:'2026-07-25T01:24:00+09:00',structuralFindingCount:findings.length,unavailableCount:unavailable.length,substantiveSuspectCount:substantiveSuspects.length,
            findings,unavailable,substantiveSuspects,municipalities
          };
          const out=path.join(root,'operations','control','central-a-scope-round-05-shizuoka-20260725.json');
          fs.writeFileSync(out,JSON.stringify(report,null,2)+'\n');
          NODE
          node /tmp/audit-round05.mjs
          rm .github/workflows/central-a-scope-round-05.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 静岡県35自治体の構造監査結果を記録'
          git push origin HEAD:audit/central-a-scope-verification-round-05-20260725
