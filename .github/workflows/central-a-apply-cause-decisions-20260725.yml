name: Central A Apply Cause Decisions 20260725

on:
  push:
    branches:
      - audit/central-a-cause-scan-20260725-1031

permissions:
  contents: write

concurrency:
  group: central-a-apply-cause-decisions-20260725-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply confirmed corrections and record decisions
        run: node jichitai-compare/scripts/apply-central-a-cause-decisions-20260725.mjs
      - name: Validate audit scripts and source counts
        run: |
          node --check jichitai-compare/app.js
          node --check jichitai-compare/scripts/apply-central-a-cause-decisions-20260725.mjs
          test -f jichitai-compare/data/municipalities/24/24341.json
          test ! -f jichitai-compare/data/municipalities/24/24361.json
          test ! -f jichitai-compare/operations/tasks/24361.json
      - name: Commit decisions and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/central-a-apply-cause-decisions-20260725.yml
          git rm jichitai-compare/scripts/apply-central-a-cause-decisions-20260725.mjs
          git commit -m "fix: 中日本A原因別再監査の確定訂正を反映"
          git push origin HEAD:audit/central-a-cause-scan-20260725-1031
