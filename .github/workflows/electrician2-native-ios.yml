name: Electrician2 Native iOS
on:
  pull_request:
    paths:
      - 'electrician2-sprint/ios/**'
      - '.github/workflows/electrician2-native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Generate Xcode project
        working-directory: electrician2-sprint/ios
        run: xcodegen generate
      - name: Debug simulator compile
        working-directory: electrician2-sprint/ios
        run: |
          set -o pipefail
          xcodebuild -project Electrician2Sprint.xcodeproj -scheme Electrician2Sprint -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/electrician2-debug-build.log"
      - name: Run learning-state regression tests
        working-directory: electrician2-sprint/ios
        run: |
          set -o pipefail
          xcodebuild -project Electrician2Sprint.xcodeproj -scheme Electrician2Sprint -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/electrician2-learning-tests.log"
      - name: Release simulator compile
        working-directory: electrician2-sprint/ios
        run: |
          set -o pipefail
          xcodebuild -project Electrician2Sprint.xcodeproj -scheme Electrician2Sprint -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/electrician2-release-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrician2-native-build-logs
          path: ${{ runner.temp }}/electrician2-*-build.log
          if-no-files-found: warn
          retention-days: 7
