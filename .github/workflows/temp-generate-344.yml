name: Temporary Generate 344

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-344.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public files
        run: |
          set -euxo pipefail
          target='coord/generated-344-20260722-1107'
          git fetch origin "$target"
          git switch "$target"
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('334自治体', '344自治体')
          p.write_text(s, encoding='utf-8')
          PY
          npm run validate:generated
          cd ..
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            jichitai-compare/data/generated/municipalities.json
            jichitai-compare/index.html
            jichitai-compare/operations/progress.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git add "${expected[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データを344自治体へ同期'
          git push origin "$target"
          git switch main
          git pull --ff-only origin main
          git rm .github/workflows/temp-generate-344.yml
          git commit -m '統括管理: 344自治体生成一時ワークフローを削除'
          git push origin main
