name: Temporary North B Region URL Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-region-url-sync.yml'

permissions:
  contents: write

concurrency:
  group: north-b-region-url-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout region sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy confirmed files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            jichitai-compare/data/municipalities/04/04215.json \
            jichitai-compare/data/municipalities/04/04301.json \
            jichitai-compare/data/municipalities/04/04321.json \
            jichitai-compare/data/municipalities/04/04401.json \
            jichitai-compare/data/municipalities/04/04421.json \
            jichitai-compare/data/municipalities/04/04424.json \
            jichitai-compare/data/municipalities/04/04445.json \
            jichitai-compare/data/municipalities/05/05206.json \
            jichitai-compare/data/municipalities/06/06202.json \
            jichitai-compare/data/municipalities/06/06301.json \
            jichitai-compare/operations/tasks/04215.json \
            jichitai-compare/operations/tasks/04301.json \
            jichitai-compare/operations/tasks/04321.json \
            jichitai-compare/operations/tasks/04401.json \
            jichitai-compare/operations/tasks/04421.json \
            jichitai-compare/operations/tasks/04424.json \
            jichitai-compare/operations/tasks/04445.json \
            jichitai-compare/operations/tasks/05206.json \
            jichitai-compare/operations/tasks/06202.json \
            jichitai-compare/operations/tasks/06301.json \
            jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json

      - name: Commit limited region sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json
          if git diff --cached --quiet; then
            echo 'Region files are already synchronized.'
            exit 0
          fi
          git commit -m 'sync: 北日本B URL横断監査をregion/northへ限定反映 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
