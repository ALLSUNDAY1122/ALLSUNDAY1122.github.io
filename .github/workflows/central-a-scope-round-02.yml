name: Central A Scope Audit Round 02

on:
  push:
    branches: ['audit/central-a-scope-verification-round-02-20260725']
    paths: ['.github/workflows/central-a-scope-round-02.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-02-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Ishikawa municipality data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'jichitai-compare';
          const codes = ['17201','17202','17203','17204','17205','17206','17207','17209','17210','17211','17212','17324','17361','17365','17384','17386','17407','17461','17463'];
          const expectedServices = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const highRiskServices = ['schoolMeals','postpartumCare','temporaryChildcare','housingSupport'];
          const municipalities = [];
          const findings = [];
          const unavailable = [];
          const sourceDomains = new Set();

          for (const code of codes) {
            const dataPath = `${root}/data/municipalities/17/${code}.json`;
            const taskPath = `${root}/operations/tasks/${code}.json`;
            if (!fs.existsSync(dataPath)) {
              findings.push({severity:'high',type:'missing_municipality_file',code,path:dataPath});
              continue;
            }
            if (!fs.existsSync(taskPath)) {
              findings.push({severity:'high',type:'missing_task_file',code,path:taskPath});
              continue;
            }
            const data = JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const task = JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const keys = Object.keys(data.services || {});
            const serviceStatuses = {};
            for (const key of expectedServices) {
              const svc = data.services?.[key];
              serviceStatuses[key] = svc?.status || 'missing';
              if (!svc) findings.push({severity:'high',type:'missing_service',code,service:key});
              if (svc?.status === 'unavailable') unavailable.push({code,name:data.name,service:key,summary:svc.summary,source:svc.source?.url});
              const urls = [svc?.source?.url, ...(svc?.additionalSources || []).map(x => x.url)].filter(Boolean);
              for (const url of urls) {
                try { sourceDomains.add(new URL(url).hostname); } catch {}
              }
            }
            const allVerified = expectedServices.every(key => data.services?.[key]?.status === 'verified');
            if (data.code !== code) findings.push({severity:'high',type:'code_mismatch',code,actual:data.code});
            if (data.prefectureCode !== '17') findings.push({severity:'high',type:'prefecture_mismatch',code,actual:data.prefectureCode});
            if (task.municipalityCode !== code) findings.push({severity:'high',type:'task_code_mismatch',code,actual:task.municipalityCode});
            if (task.municipalityName !== data.name) findings.push({severity:'high',type:'name_mismatch',code,dataName:data.name,taskName:task.municipalityName});
            if (keys.length !== 9) findings.push({severity:'high',type:'service_count_mismatch',code,count:keys.length,keys});
            if (allVerified && task.status === 'merged' && data.status !== 'verified') findings.push({severity:'medium',type:'top_level_status_mismatch',code,name:data.name,dataStatus:data.status});
            if (task.status !== 'merged') findings.push({severity:'medium',type:'task_status_not_merged',code,name:data.name,status:task.status});
            if (!Array.isArray(task.completedServices) || task.completedServices.length !== 9) findings.push({severity:'medium',type:'completed_services_count',code,count:task.completedServices?.length});
            if (!Array.isArray(task.officialSources) || task.officialSources.length !== 9) findings.push({severity:'medium',type:'official_sources_count',code,count:task.officialSources?.length});
            const taskTotal = Number(task.verifiedCount||0)+Number(task.researchingCount||0)+Number(task.unavailableCount||0)+Number(task.needsMediumReviewCount||0);
            if (taskTotal !== 9) findings.push({severity:'medium',type:'task_status_total',code,total:taskTotal});
            const highRisk = {};
            for (const key of highRiskServices) {
              const svc = data.services?.[key] || {};
              highRisk[key] = {status:svc.status,summary:svc.summary,source:svc.source?.url,checkedAt:svc.source?.checkedAt};
            }
            municipalities.push({
              code,
              name:data.name,
              status:data.status,
              updatedAt:data.updatedAt,
              taskStatus:task.status,
              taskLastCheckedAt:task.lastCheckedAt,
              verifiedCount:task.verifiedCount,
              unavailableCount:task.unavailableCount,
              needsMediumReviewCount:task.needsMediumReviewCount,
              officialSourceCount:task.officialSources?.length,
              serviceStatuses,
              highRisk
            });
          }

          const report = {
            schemaVersion:'1.0.0',
            auditId:'central-a-scope-round-02-ishikawa-20260725',
            prefectureCode:'17',
            prefectureName:'石川県',
            expectedMunicipalityCount:19,
            checkedMunicipalityCount:municipalities.length,
            checkedServiceCount:municipalities.length * 9,
            generatedAt:'2026-07-25T00:16:00+09:00',
            structuralFindingCount:findings.length,
            unavailableCount:unavailable.length,
            findings,
            unavailable,
            sourceDomains:[...sourceDomains].sort(),
            municipalities
          };
          const reportPath = `${root}/operations/control/central-a-scope-round-02-ishikawa-20260725.json`;
          fs.writeFileSync(reportPath, JSON.stringify(report,null,2)+'\n');

          const auditPath = `${root}/operations/control/central-a-scope-verification-20260724.json`;
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          audit.branch = 'audit/central-a-scope-verification-round-02-20260725';
          audit.batches = audit.batches.filter(x => x.batch !== 2);
          audit.batches.push({
            batch:2,
            prefectureCode:'17',
            prefectureName:'石川県',
            municipalityCount:19,
            status:'structural_checked',
            checkedMunicipalities:municipalities.length,
            checkedServices:municipalities.length * 9,
            structuralFindingCount:findings.length,
            unavailableCount:unavailable.length,
            report:'operations/control/central-a-scope-round-02-ishikawa-20260725.json',
            nextStep:'学校給食・産後ケア・こども誰でも通園・住宅支援とunavailable判定を公式情報で重点照合する'
          });
          audit.summary.checkedMunicipalities = 15 + municipalities.length;
          audit.nextAction = '石川県の構造監査結果を確認し、公式情報の重点照合と明確な誤りの修正を行う';
          fs.writeFileSync(auditPath, JSON.stringify(audit,null,2)+'\n');
          NODE
          rm .github/workflows/central-a-scope-round-02.yml
      - name: Commit Ishikawa audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 石川県19自治体の構造監査を実施'
          git push origin HEAD:audit/central-a-scope-verification-round-02-20260725
