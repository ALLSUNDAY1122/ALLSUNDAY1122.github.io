name: Temporary West-A round 4 audit update

on:
  push:
    branches:
      - 'audit/west-a-research-verification-r4-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[round4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update round 4 audit evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'jichitai-compare';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const auditPath = `${base}/operations/audits/west-a-research-verification-20260725.json`;
          const audit = read(auditPath);
          audit.updatedAt = '2026-07-25T01:15:00+09:00';
          audit.completedRoundCount = 4;
          const round4 = {
            round: 4,
            title: '保育料・学校給食費の令和8年度条件監査',
            status: 'completed',
            method: '担当6県から各1自治体を抽出し、保育料と令和8年度学校給食費の計12項目を自治体公式ページで再照合',
            sampleMunicipalityCount: 6,
            checkedServiceCount: 12,
            samples: [
              {
                code: '33100', name: '岡山市', result: 'matched',
                childcareFeeClaim: '3～5歳児クラスと住民税非課税世帯の0～2歳児クラスは無償、その他は市町村民税額等で決定',
                schoolMealsClaim: '令和8年度は小学校等0円、中学校等1食377円',
                officialUrls: ['https://www.city.okayama.jp/kurashi/0000012934.html','https://www.city.okayama.jp/kurashi/0000052441.html']
              },
              {
                code: '37202', name: '丸亀市', result: 'matched',
                childcareFeeClaim: '3歳児以上は無償、3歳未満は市町村民税額と保育時間区分で決定',
                schoolMealsClaim: '市立小中学校の学校給食費を無期限で無償化',
                officialUrls: ['https://www.city.marugame.lg.jp/page/2932.html','https://www.city.marugame.lg.jp/page/15593.html']
              },
              {
                code: '39204', name: '南国市', result: 'matched',
                childcareFeeClaim: '3～5歳児等と非課税世帯の0～2歳児を無償化し、その他は認定・年齢・市町村民税額で決定',
                schoolMealsClaim: '令和8年度は小学校1日23円、中学校1日300円',
                officialUrls: ['https://www.city.nankoku.lg.jp/life/life_dtl.php?hdnKey=8948','https://www.city.nankoku.lg.jp/reiki/reiki_honbun/i900RG00001132.html']
              },
              {
                code: '40100', name: '北九州市', result: 'matched',
                childcareFeeClaim: '3～5歳児と非課税世帯の0～2歳児、第2子以降の保育料を無償化',
                schoolMealsClaim: '令和8年度は市立小学校等を無償化し、中学校月5,400円、特別支援学校中高等部月5,100円',
                officialUrls: ['https://www.city.kitakyushu.lg.jp/contents/28800022.html','https://www.city.kitakyushu.lg.jp/kyouiku/02600192.html','https://www.city.kitakyushu.lg.jp/kyouiku/02600207.html']
              },
              {
                code: '43202', name: '八代市', result: 'matched',
                childcareFeeClaim: '0～5歳のすべての子どもの保育料を無償化',
                schoolMealsClaim: '令和8年度は幼稚園1,400円、小学校5,200円、中学校等3,000円を市負担',
                officialUrls: ['https://www.city.yatsushiro.lg.jp/kiji00319794/index.html','https://www.city.yatsushiro.lg.jp/kiji00326132/index.html']
              },
              {
                code: '46218', name: '霧島市', result: 'matched',
                childcareFeeClaim: '3～5歳児と住民税非課税世帯の0～2歳児の利用料を無償化',
                schoolMealsClaim: '令和8年度は小学校0円、中学1・2年月5,000円、中学3年月4,800円',
                officialUrls: ['https://www.city-kirishima.jp/jidou/hoikuen/documents/musyouka.html','https://www.city-kirishima.jp/hayato-kyushoku/kokubu-nanbu/20230329kyusyoku.html']
              }
            ],
            result: 'passed',
            materialErrorCount: 0
          };
          audit.rounds[audit.rounds.findIndex((r) => r.round === 4)] = round4;
          audit.summary.materialErrorCount = 1;
          audit.summary.correctionAppliedCount = 1;
          audit.summary.correctionRequiredCount = 0;
          audit.summary.roundsRemaining = 6;
          audit.summary.currentAssessment = '第4回は6自治体12項目が公式情報と一致。累計では第3回の霧島市1件を修正済みで、未修正0件。';
          audit.nextAction = '第5回として、産後ケア・一時預かりの対象月齢、利用回数、料金を担当6県の複雑事例で再照合する。';
          write(auditPath, audit);

          const checkpointPath = `${base}/operations/control/session-checkpoints/west-a.json`;
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = '2026-07-25T01:15:00+09:00';
          checkpoint.nextAction = '10回の誤調査検証の第5回として、産後ケア・一時預かりの対象月齢、利用回数、料金を担当6県の複雑事例で再照合する。';
          checkpoint.researchVerificationAudit.completedRoundCount = 4;
          checkpoint.researchVerificationAudit.lastCompletedRound = 4;
          checkpoint.researchVerificationAudit.nextRound = 5;
          checkpoint.researchVerificationAudit.materialErrorCount = 1;
          checkpoint.researchVerificationAudit.correctionAppliedCount = 1;
          checkpoint.researchVerificationAudit.correctionRequiredCount = 0;
          checkpoint.researchVerificationAudit.lastAuditedAt = '2026-07-25T01:15:00+09:00';
          checkpoint.integrityAudit.auditedAt = '2026-07-25T01:15:00+09:00';
          if (!checkpoint.integrityAudit.notes.some((note) => note.includes('第4回監査'))) checkpoint.integrityAudit.notes.push('第4回監査で6自治体の保育料・令和8年度学校給食費12項目を再照合し、全件一致。');
          write(checkpointPath, checkpoint);
          NODE
      - name: Commit audit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-research-verification-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/west-a.json
          git commit -m '[round4-applied] audit: record West-A verification round 4'
          git push
