name: Splat S22 Truthful Training Stage Once

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - automation/scanlab-truthful-training-stage-request.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace progress-fiction stage labels with truthful pipeline state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('splat-native-ios/SplatNative/ScanModel.swift')
          text=p.read_text(encoding='utf-8')
          old='''    var trainingStageText: String {\n        switch trainingProgress {\n        case ..<0.18: return "写真の位置関係を確認しています"\n        case ..<0.58: return "立体の形を組み立てています"\n        case ..<0.88: return "色と細部を整えています"\n        default: return "見返せる形に仕上げています"\n        }\n    }\n'''
          new='''    var trainingStageText: String {\n        guard trainingIteration > 0 else {\n            return "初期3Dデータと学習データを準備しています"\n        }\n        return "Splatを最適化しています（\\(trainingIteration) / \\(max(1, pendingTrainingTarget))）"\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy trainingStageText block')
          p.write_text(text.replace(old,new,1), encoding='utf-8')
          PY
          grep -q '初期3Dデータと学習データを準備しています' splat-native-ios/SplatNative/ScanModel.swift
          grep -q 'Splatを最適化しています' splat-native-ios/SplatNative/ScanModel.swift
          if grep -q '写真の位置関係を確認しています' splat-native-ios/SplatNative/ScanModel.swift; then
            echo 'legacy fictitious stage label remains' >&2
            exit 1
          fi

      - name: Persist source patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/ScanModel.swift
          git commit -m 'scanlab: report truthful reconstruction stage' || exit 0
          if git push origin HEAD:feature/splat-native-ios-poc; then exit 0; fi
          git fetch origin feature/splat-native-ios-poc
          git rebase origin/feature/splat-native-ios-poc
          git push origin HEAD:feature/splat-native-ios-poc
