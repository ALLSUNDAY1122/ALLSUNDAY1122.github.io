name: Loopforge contract validation

on:
  push:
    branches:
      - 'igtap/**'
    paths:
      - 'igtap-equivalent/**'
      - '.github/workflows/igtap-equivalent-contract.yml'
  pull_request:
    paths:
      - 'igtap-equivalent/**'
      - '.github/workflows/igtap-equivalent-contract.yml'

concurrency:
  group: loopforge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project contract
        run: python igtap-equivalent/Build/validate_project.py
      - name: Run integration bootstrap tests
        run: python -m unittest discover -s igtap-equivalent/Tests/Integration -p 'test_*.py' -v
      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Parse/import Godot project headlessly
        run: godot --headless --editor --path igtap-equivalent --quit
      - name: Run save corruption and migration self-test
        run: timeout 30s godot --headless --path igtap-equivalent res://Tests/Integration/SaveSelfTest.tscn
      - name: Boot mock integration headlessly
        run: godot --headless --path igtap-equivalent --quit-after 120
