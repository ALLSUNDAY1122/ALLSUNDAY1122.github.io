name: Scaniverse Build 4 Ledger Refresh

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - .github/workflows/scaniverse-build4-ledger-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Promote current candidate evidence to Build 4 without promoting parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('splat-native-ios/SCANIVERSE_PARITY_PLAN.md')
          s=p.read_text(encoding='utf-8')
          start=s.index('## Current integration evidence —')
          end=s.index('## Historical integration evidence —')
          new='''## Current integration evidence — 2026-08-24 14:42 JST｜Build 4

This section supersedes Build 3 as the current release-candidate evidence. Build 3 remains historical because app source changed afterward.

Current integration branch: `feature/splat-native-ios-poc`

Current validated app-source: `595c1d1d3468dd85594a958d8750264d9db91f50`

Post-Build 3 app-source corrections included:

- persisted viewer edits are materialized into export / video / publish outputs
- edit persistence is immediate before external actions can consume stale viewer state
- untouched crop endpoints remain open-ended when only one crop handle is changed

Automated evidence on the validated app source:

- Splat Native Privacy Preflight: PASS
- Splat Smoke Diagnostic: PASS
- Splat Native iOS Build: PASS
- A2/B2/C2/D2 fresh branch compare: all `ahead_by=0`
- production auth/session/profile E2E: previously PASS and backend remains deployed

Latest Internal TestFlight candidate: **Build 4**

- release branch `testflight/splat-native-ios-20260824-build4`
- release commit `bdb1488b101c3855edc52687b5dd230748297a62`
- release branch differs from validated app-source only by TestFlight `codemagic.yaml`
- Codemagic build `6a8bd803c391bffc3d7617ce`: `finished`
- App Store Connect build resource `219264e6-587a-49f2-96b1-0850d5a8ad4c`
- `processingState=VALID`
- `buildAudienceType=INTERNAL_ONLY`
- `expired=false`
- `usesNonExemptEncryption=false`
- `internalBuildState=IN_BETA_TESTING`
- internal beta group `sun`: assigned, one tester present
- no App Store Review submission and no external beta review submission

Current parity ledger:

| Area | State | Remaining proof | Owner |
|---|---|---|---|
| ARKit capture / tracking / live coverage guidance | PARTIAL | Build 4 real-device continuity, responsiveness, image-quality rejection behavior and Golden comparison | A/HQ |
| On-device Gaussian Splat reconstruction | PARTIAL | representative-object physical output quality, processing time, thermal/memory recovery | A |
| Splat viewer / edit / measure | PARTIAL | Build 4 real-device usability, edit persistence/output materialization and one-sided crop behavior | B/HQ |
| Mesh reconstruction / texture / edit / measure / AR | PARTIAL | physical result quality and device workflow proof | B |
| Local library / raw retention / process later / reopen / reprocess | NEAR_PARITY | Build 4 cold-reopen and process-later physical proof | C/HQ |
| Export / video interoperability | NEAR_PARITY | Build 4 device-generated edited asset/video and memory proof remain | C/B |
| Auth / session / profile | NEAR_PARITY | production live E2E passes; Build 4 device UX proof remains | D/HQ |
| Publish / durable browser URL / visibility / Map / Discover | PARTIAL | real Build 4 generated trusted scan production publish/share/discover lifecycle E2E | D/HQ |
| Integrated release candidate | NEAR_PARITY | Build 4 is VALID and internally distributed; physical end-to-end parity gate remains | HQ |
| Integrated full app flow | PARTIAL | `capture → coverage → finish → processing → 3D result → save → library reopen` on Build 4 | HQ/A-D |

No row may be promoted to `PARITY` solely from compile, simulator, fixture, CI, signed build, or TestFlight distribution. Physical-quality rows require representative real-device evidence against the Scaniverse Golden Reference.

Supabase production at the Build 4 gate remains `ACTIVE_HEALTHY` with `auth.users=1 / scanlab_profiles=1 / scanlab_scans=0 / scanlab_reports=0 / scanlab_blocks=0`; seven ScanLab Edge Functions are ACTIVE. A real Build 4 generated scan is still required before publish/share lifecycle E2E.

The next blocking gate is therefore **Build 4 physical-device evidence**, not additional branch integration work.

'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
          git diff --check
          grep -q 'Build 4 physical-device evidence' splat-native-ios/SCANIVERSE_PARITY_PLAN.md
      - name: Commit refresh and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SCANIVERSE_PARITY_PLAN.md
          git rm -f .github/workflows/scaniverse-build4-ledger-refresh.yml
          git commit -m 'docs(scaniverse): set verified Build 4 as current parity candidate'
          git push origin HEAD:feature/splat-native-ios-poc
