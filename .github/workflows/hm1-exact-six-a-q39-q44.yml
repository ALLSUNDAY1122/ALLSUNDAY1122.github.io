name: HM1 exact six practice-A Q39-Q44 regeneration
on:
  push:
    branches:
      - codex/hm1-integrate-basic-a-b-c-20261111
    paths:
      - 'ios/health-manager-1/audit/practice_a_fixes_01_10.json'
      - '.github/workflows/hm1-exact-six-a-q39-q44.yml'
  workflow_dispatch:
jobs:
  regenerate-and-compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate baseline and edited 264-question banks
        shell: bash
        run: |
          set -euo pipefail
          BASE=1eee7695e9a29390d927dec43f9bc477f25870ba
          git worktree add --detach /tmp/hm1-q39-before "$BASE"
          git worktree add --detach /tmp/hm1-q39-after HEAD
          (cd /tmp/hm1-q39-before && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q39-before.log)
          (cd /tmp/hm1-q39-after && node ios/health-manager-1/augment-to-264.cjs > /tmp/hm1-q39-after.log)
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          rel='ios/health-manager-1/Resources/questions.json'
          old=json.loads((Path('/tmp/hm1-q39-before')/rel).read_text())
          new=json.loads((Path('/tmp/hm1-q39-after')/rel).read_text())
          target={f'practice-A-Q{i:02d}' for i in range(39,45)}
          assert len(old)==len(new)==264,(len(old),len(new))
          assert [x['id'] for x in old]==[x['id'] for x in new], 'ID/order changed'
          assert len({x['id'] for x in new})==264, 'Duplicate IDs'
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFKC',s) if not c.isspace()).casefold()
          assert len({norm(x['stem']) for x in new})==264, 'Duplicate normalized stems'
          changed={a['id'] for a,b in zip(old,new) if a!=b}
          assert changed==target, f'Changed IDs: {sorted(changed)}'
          for a,b in zip(old,new):
              if a['id'] not in target: assert a==b,a['id']
          for x in new:
              assert isinstance(x['choices'],list) and len(x['choices'])==5,x['id']
              assert len(set(x['choices']))==5,x['id']
              assert type(x['ans']) is int and 0<=x['ans']<5,x['id']
          expected={'practice-A-Q39':2,'practice-A-Q40':1,'practice-A-Q41':3,'practice-A-Q42':2,'practice-A-Q43':0,'practice-A-Q44':0}
          for x in new:
              if x['id'] in target:
                  assert x['ans']==expected[x['id']],x['id']
                  assert x['short']=='正解は「'+x['choices'][x['ans']]+'」です。',x['id']
          print('PASS: both 264 regenerated, six exact modified IDs, other 258 completely identical')
          PY
