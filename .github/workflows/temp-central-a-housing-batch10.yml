name: Temporary Central A Housing Batch 10

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch10-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch10-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply housing classification batch 10
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-25';
          const updatedAt='2026-07-25T17:45:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const corrections=[
            {code:'28381',pref:'28',name:'稲美町',kind:'family_target_clarification',service:{status:'verified',summary:'子育て・介護など親子間の支え合いを目的に、町内の親元へ近居する子世帯の住宅取得・一定の増改築等へ18万円分の商品券を交付する。',details:{program:'親元近居住宅取得等支援補助金（親元に住もう補助金）',target:'直系尊属が町内に5年以上居住し、子世帯全員が町内へ居住・住民登録して親元近居するなどの要件を満たす世帯',purpose:'子育てや介護など親子間等の支え合いを後押しする制度',minorChildRequirement:'18歳以下の子どもの同居は必須要件として明記されていない',housing:'自己居住用の新築・中古住宅取得、または対象部分300万円以上の増改築・リフォーム',amount:'18万円分の稲美町共通商品券を一括交付',application:'住宅取得等の日または子世帯の転入・転居日から1年以内'},source:{url:'https://www.town.hyogo-inami.lg.jp/0000001615.html',checkedAt}}},
            {code:'17203',pref:'17',name:'小松市',kind:'replace_with_three_generation_program',service:{status:'verified',summary:'3世代同居・隣接・近居となる住宅の新築・増築・購入へ、同居20万円、隣接・近居10万円を交付する。',details:{program:'3世代家族住宅建築奨励金制度',target:'3世代同居世帯、親世帯の敷地内・隣地の3世代隣接世帯、親世帯から半径150メートル以内の3世代近居世帯',support:'同居20万円、隣接・近居10万円',housingCondition:'自己居住用一戸建てで住戸専用面積50平方メートル以上等',fiscalYear:'2026年度。申請受付は2026年4月1日から2027年3月19日',application:'新築・増築は基礎工事着工前の認定申請、購入は最終金支払日から3か月以内の交付申請',excludedGeneralProgram:'一般転入者向け「ようこそ小松」定住促進奨励金を主制度とする登録を解消'},source:{url:'https://www.city.komatsu.lg.jp/soshiki/1027/teijuusokushinshienseido/3235.html',checkedAt}}},
            {code:'21220',pref:'21',name:'下呂市',kind:'replace_with_newlywed_program',service:{status:'verified',summary:'2026年1月1日から2027年3月31日までに婚姻等をした新婚世帯へ、住宅取得・賃借・リフォーム・引越費用を上限60万円補助する。',details:{program:'令和8年度下呂市結婚新生活支援補助金',target:'対象期間に婚姻または岐阜県パートナーシップ宣誓書受領証の交付を受け、夫婦等の合算所得500万円未満、市内住宅に住民登録する世帯',covered:'新居購入費、賃料・敷金・礼金・共益費・仲介手数料、リフォーム費、引越費',amount:'1世帯上限60万円',marriagePeriod:'2026年1月1日から2027年3月31日',applicationDeadline:'2027年3月10日必着',excludedGeneralProgram:'一般U・I・Jターン住宅購入・改修補助を主制度とする登録を解消'},source:{url:'https://www.city.gero.lg.jp/soshiki/49/37216.html',checkedAt}}},
            {code:'22130',pref:'22',name:'浜松市',kind:'clarify_family_eligibility_and_child_addition',service:{status:'verified',summary:'市外から移住する50歳未満の夫婦等または50歳未満のひとり親世帯へ住宅取得・改修・引越費を最大100万円補助し、まちなかの3世代同居等には上乗せ支援がある。',details:{program:'浜松市ハマライフ住宅取得費等助成事業費補助金',target:'市内移住から2年以内で、申請者が配偶者等を有し双方50歳未満、または50歳未満のひとり親世帯などの要件を満たす世帯',covered:'住宅の新築・取得、増築・改修、住宅賃借、引越移転の対象経費',amount:'対象経費の2分の1以内、上限100万円',applicationDeadline:'2027年2月26日',additionalProgram:'まちなか定住促進・子育て応援環境づくり補助金',threeGenerationAddition:'小学生以下の子と暮らす子世帯が親世帯と新たに同居または隣接居住する場合、上乗せ補助の対象',clarification:'単なる全移住者向け制度ではなく、年齢・夫婦等・ひとり親の世帯要件がある'},source:{url:'https://www.city.hamamatsu.shizuoka.jp/hamalife/oshirase/hamalifejyutakusyutokuhitouhojyokin.html',checkedAt},additionalSources:[{url:'https://www.city.hamamatsu.shizuoka.jp/jutaku/matinaka_kosodate.html',checkedAt,description:'小学生以下の子を含む3世代同居等の上乗せ補助'}]}},
            {code:'23445',pref:'23',name:'南知多町',kind:'general_empty_house_only',service:{status:'unavailable',summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',details:{reason:'確認できた空き家バンク制度補助金は、空き家バンク登録・契約・10年以上の定住等を要件とする一般移住・空き家制度で、子育て・新婚世帯固有の対象要件がない。',excludedProgram:'南知多町空き家バンク制度補助金',excludedConditions:'居住者・物件の空き家バンク登録、契約成立、税滞納なし、10年以上定住意思等',evidence:'2026年度の利用者向け公式子育て情報と住宅情報から、子育て・新婚世帯固有の住宅制度を確認できない'},source:{url:'https://www.town.minamichita.lg.jp/akiya/1000973.html',checkedAt},additionalSources:[{url:'https://www.town.minamichita.lg.jp/kosodate/shien/1001282.html',checkedAt,description:'2026年度子育て支援案内の入口'}]}}
          ];
          for(const item of corrections){
            const mp=path.join(root,'data/municipalities',item.pref,`${item.code}.json`);
            const tp=path.join(root,'operations/tasks',`${item.code}.json`);
            const m=JSON.parse(fs.readFileSync(mp,'utf8'));
            const t=JSON.parse(fs.readFileSync(tp,'utf8'));
            m.updatedAt=checkedAt;
            m.services.housingSupport=item.service;
            const entries=keys.map(k=>[k,m.services[k]]);
            const done=new Set(['verified','unavailable']);
            const statuses=entries.map(([,s])=>s.status);
            t.completedServices=entries.filter(([,s])=>done.has(s.status)).map(([k])=>k);
            t.verifiedCount=statuses.filter(s=>s==='verified').length;
            t.researchingCount=statuses.filter(s=>s==='researching').length;
            t.unavailableCount=statuses.filter(s=>s==='unavailable').length;
            t.needsMediumReviewCount=statuses.filter(s=>s==='needs_medium_review').length;
            const next=entries.findIndex(([,s])=>!done.has(s.status));
            t.nextServiceIndex=next===-1?keys.length:next;
            t.currentService=keys[t.nextServiceIndex]??null;
            t.lastCheckedAt=checkedAt;
            t.lastUpdatedAt=updatedAt;
            t.lastUpdatedBy='中日本調査班A';
            t.officialSources=[...new Set(entries.filter(([,s])=>done.has(s.status)).map(([,s])=>s.source.url))];
            t.notes=Array.isArray(t.notes)?t.notes:[];
            const note=item.service.status==='unavailable'?'2026年7月25日の原因別重点再監査で、一般空き家・移住制度を子育て住宅支援から除外し、housingSupportをunavailableへ修正した。':'2026年7月25日の原因別重点再監査で、住宅支援の家族・新婚・3世代対象条件を現行公式情報に合わせて修正した。';
            if(!t.notes.includes(note))t.notes.push(note);
            fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
            fs.writeFileSync(tp,JSON.stringify(t,null,2)+'\n');
          }
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch10-decisions-20260725',decidedAt:updatedAt,session:'中日本調査班A',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:1,verifiedClarificationOrReplacementCount:4,corrected:corrections.map(i=>({code:i.code,name:i.name,service:'housingSupport',correctionType:i.kind,afterStatus:i.service.status,officialSource:i.service.source.url,summary:i.service.summary})),causeScan:{previousRemainingCandidates:129,reviewedHighRiskCandidates:5,remainingCandidates:124},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般空き家・移住制度を子育て住宅支援の主制度にしない','家族・新婚・3世代の対象要件を利用者向け現行公式ページで確認する','未成年者要件がない親子近居制度はその点を明示する']};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch10-decisions-20260725.json'),JSON.stringify(audit,null,2)+'\n');
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js

      - name: Commit corrections
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch10-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/17/17203.json jichitai-compare/data/municipalities/21/21220.json jichitai-compare/data/municipalities/22/22130.json jichitai-compare/data/municipalities/23/23445.json jichitai-compare/data/municipalities/28/28381.json jichitai-compare/operations/tasks/17203.json jichitai-compare/operations/tasks/21220.json jichitai-compare/operations/tasks/22130.json jichitai-compare/operations/tasks/23445.json jichitai-compare/operations/tasks/28381.json jichitai-compare/operations/audits/central-a-housing-classification-batch10-decisions-20260725.json jichitai-compare/operations/control/central-a-housing-batch10-trigger-20260725.json
          git commit -m 'audit: 中日本A住宅支援分類第10群を修正'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
