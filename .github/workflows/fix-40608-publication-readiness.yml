name: Fix 40608 Publication Readiness

on:
  pull_request:
    branches: [region/west]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/40608-publication-readiness-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/40608-publication-readiness-20260724
          fetch-depth: 0
      - name: Normalize municipality and task
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs = require('fs');
          const municipalityPath = 'jichitai-compare/data/municipalities/40/40608.json';
          const taskPath = 'jichitai-compare/operations/tasks/40608.json';
          const workflowPath = '.github/workflows/fix-40608-publication-readiness.yml';
          const postpartumUrl = 'https://www.town.oto.fukuoka.jp/kiji003458/index.html';
          const temporaryUrl = 'https://www.town.oto.fukuoka.jp/kiji003688/index.html';
          const housingUrl = 'https://www.town.oto.fukuoka.jp/list00134.html';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));

          municipality.services.postpartumCare = {
            status: 'verified',
            summary: '町公式の産後ケア事業でショートステイ・デイサービスを実施',
            eligibility: { minAgeMonths: 0, maxAgeYears: 0 },
            details: {
              types: 'ショートステイ（宿泊型）・デイサービス（通所型）',
              target: '産後の体調や育児に不安があり、家族等から十分な支援を受けにくい産婦と乳児',
              support: '母体の休養、母乳・授乳相談、育児相談等',
              application: '大任町住民課衛生係へ事前相談・申請',
              contact: '0947-63-3003',
              verificationNote: '町公式の現行カテゴリに産後ケア事業ページが掲載されている。料金・利用日数等は利用前に窓口確認が必要。'
            },
            source: { url: postpartumUrl, checkedAt: '2026-07-24' }
          };

          municipality.services.temporaryChildcare = {
            status: 'unavailable',
            summary: '2026年度の制度案内掲載は確認したが、比較に必要な利用条件を公式本文で確定できない',
            details: {
              verificationStatus: '2026年3月16日更新の「こども誰でも通園制度について」の掲載を確認',
              unconfirmed: '対象年齢、月間利用上限、料金、実施施設、利用時間、認定・面談・予約方法',
              contact: '大任町福祉課へ利用前に確認'
            },
            notes: ['制度不存在とは判断せず、公開情報から比較条件を確定できないためunavailableとして窓口確認事項を記録。'],
            source: { url: temporaryUrl, checkedAt: '2026-07-24' }
          };

          municipality.services.housingSupport = {
            status: 'unavailable',
            summary: '2026年度に利用可能な住宅取得・改修補助を町公式情報で確認できない',
            details: {
              currentInformation: '町公式の住まい・土地一覧では空き家・空き地情報バンクと令和7年度結婚新生活支援補助金を掲載',
              expiredProgram: '確認できた結婚新生活支援補助金は令和7年度分で、令和8年度の募集条件は未掲載',
              contact: '2026年度の住宅取得・改修・家賃・引越支援の有無を町へ確認'
            },
            notes: ['空き家情報バンクや町営住宅の存在を、子育て世帯向け住宅補助の代替として扱わない。'],
            source: { url: housingUrl, checkedAt: '2026-07-24' }
          };

          municipality.status = 'verified';
          municipality.summary = '必須9制度を大任町公式情報で調査。7制度をverified、利用条件未確定のこども誰でも通園制度と2026年度住宅支援をunavailableとして登録。';
          municipality.updatedAt = '2026-07-24';
          fs.writeFileSync(municipalityPath, JSON.stringify(municipality) + '\n');

          const serviceIds = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          task.status = 'pr_open';
          task.currentService = null;
          task.nextServiceIndex = 9;
          task.completedServices = serviceIds;
          task.verifiedCount = 7;
          task.researchingCount = 0;
          task.unavailableCount = 2;
          task.needsMediumReviewCount = 0;
          task.currentBranch = 'fix/40608-publication-readiness-20260724';
          task.pullRequestNumber = Number(process.env.PR_NUMBER);
          task.lastCheckedAt = '2026-07-24';
          task.lastUpdatedAt = '2026-07-24T09:18:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.officialSources = serviceIds.map((id) => municipality.services[id].source?.url).filter(Boolean);
          task.notes = (task.notes || []).filter((note) => !note.includes('3制度') && !note.includes('産後ケア、こども誰でも通園制度'));
          task.notes.push('産後ケアは町公式の現行掲載からショートステイ・デイサービスをverified。');
          task.notes.push('こども誰でも通園制度と2026年度住宅支援は比較条件を確定できないためunavailableへ正規化。');
          task.blockers = [];
          fs.writeFileSync(taskPath, JSON.stringify(task) + '\n');
          fs.unlinkSync(workflowPath);
          NODE
          git add jichitai-compare/data/municipalities/40/40608.json jichitai-compare/operations/tasks/40608.json .github/workflows/fix-40608-publication-readiness.yml
          git commit -m "fix: 大任町の公開除外3制度を正規化"
          git push origin HEAD:fix/40608-publication-readiness-20260724
