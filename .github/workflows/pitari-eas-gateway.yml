name: Pitari EAS Gateway

on:
  push:
    branches: [main]
    paths:
      - automation/pitari-eas-command.json
      - .github/workflows/pitari-eas-gateway.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitari-eas-gateway
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout gateway repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Verify Expo robot token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::EXPO_TOKEN repository secret is not configured'
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare Pitari project context
        run: |
          rm -rf /tmp/pitari-eas
          mkdir -p /tmp/pitari-eas/.eas/workflows release-logs
          cat > /tmp/pitari-eas/app.json <<'JSON'
          {
            "expo": {
              "name": "ぴたりサイズ",
              "slug": "pitari-resize",
              "version": "0.1.0",
              "owner": "allsunday1122",
              "ios": {
                "bundleIdentifier": "jp.allsunday.pitariresize"
              },
              "extra": {
                "eas": {
                  "projectId": "d7480022-0db3-48dd-906e-43a12438ecdb"
                }
              }
            }
          }
          JSON
          cat > /tmp/pitari-eas/eas.json <<'JSON'
          {
            "cli": {
              "version": ">= 16.0.0",
              "appVersionSource": "remote"
            },
            "build": {
              "production": {
                "autoIncrement": true
              }
            },
            "submit": {
              "production": {
                "ios": {
                  "ascAppId": "6795941132"
                }
              }
            }
          }
          JSON
          cat > /tmp/pitari-eas/.eas/workflows/release-ios.yml <<'YAML'
          name: Pitari iOS validation and TestFlight

          jobs:
            validate:
              name: Validate mobile
              steps:
                - uses: eas/checkout
                - uses: eas/install_node_modules
                - name: TypeScript
                  run: pnpm typecheck
                - name: Unit tests
                  run: pnpm test
                - name: Expo doctor
                  run: pnpm doctor

            build_ios:
              name: Build iOS production
              needs: [validate]
              type: build
              params:
                platform: ios
                profile: production
                message: 'TestFlight: video selection and long-video compression fixes'

            testflight:
              name: Upload to TestFlight
              needs: [build_ios]
              type: testflight
              params:
                build_id: ${{ needs.build_ios.outputs.build_id }}
                profile: production
                changelog: |
                  - 動画選択済み状態を明確化
                  - 長尺動画向け容量指定を1MB〜1GBへ拡張
                  - 動画容量の初期値を元ファイル容量に連動
                  - 課金表示・購入検証フローを再監査
          YAML

      - name: Execute Pitari EAS command
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          REQUEST_ID="$(python -c "import json;print(json.load(open('automation/pitari-eas-command.json'))['request_id'])")"
          ACTION="$(python -c "import json;print(json.load(open('automation/pitari-eas-command.json'))['action'])")"
          if ! [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo '::error::invalid request_id'
            exit 1
          fi
          printf '%s' "$REQUEST_ID" > /tmp/pitari-request-id.txt
          cd /tmp/pitari-eas
          eas whoami | tee "$GITHUB_WORKSPACE/release-logs/eas-whoami.txt"
          eas project:info | tee "$GITHUB_WORKSPACE/release-logs/eas-project-info.txt"
          eas build:list --platform ios --limit 10 --json --non-interactive > "$GITHUB_WORKSPACE/release-logs/eas-build-list.json"
          eas workflow:runs --limit 10 --json > "$GITHUB_WORKSPACE/release-logs/eas-workflow-runs.json"
          if [ "$ACTION" = "inspect" ]; then
            exit 0
          fi
          if [ "$ACTION" = "run_workflow" ]; then
            eas workflow:validate .eas/workflows/release-ios.yml --non-interactive | tee "$GITHUB_WORKSPACE/release-logs/eas-workflow-validate.txt"
            eas workflow:run .eas/workflows/release-ios.yml --ref main --non-interactive --json > "$GITHUB_WORKSPACE/release-logs/eas-workflow-start.json"
            exit 0
          fi
          echo "::error::unsupported action: $ACTION"
          exit 1

      - name: Persist sanitized result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cmd=json.loads(Path('automation/pitari-eas-command.json').read_text())
          rid=cmd.get('request_id','unknown')
          out={'request_id':rid,'action':cmd.get('action')}
          for name in ('eas-build-list.json','eas-workflow-runs.json','eas-workflow-start.json'):
              p=Path('release-logs')/name
              if p.exists():
                  try: out[name.removesuffix('.json').replace('-','_')]=json.loads(p.read_text())
                  except Exception: out[name.removesuffix('.json').replace('-','_')]=p.read_text()[:12000]
          for name in ('eas-whoami.txt','eas-project-info.txt','eas-workflow-validate.txt'):
              p=Path('release-logs')/name
              if p.exists(): out[name.removesuffix('.txt').replace('-','_')]=p.read_text()[:4000]
          target=Path('automation/eas-results')/f'{rid}.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/pitari-result-copy.json').write_text(target.read_text())
          print(target)
          PY
          REQUEST_ID="$(cat /tmp/pitari-request-id.txt 2>/dev/null || python -c "import json;print(json.load(open('automation/pitari-eas-command.json'))['request_id'])")"
          RESULT="automation/eas-results/${REQUEST_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Persist Pitari EAS result ${REQUEST_ID}" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/eas-results
          cp /tmp/pitari-result-copy.json "$RESULT"
          git add "$RESULT"
          git commit -m "Persist Pitari EAS result ${REQUEST_ID}" || exit 0
          git push origin HEAD:main

      - name: Upload EAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitari-eas-${{ github.run_id }}
          path: release-logs
          if-no-files-found: warn
          retention-days: 7
