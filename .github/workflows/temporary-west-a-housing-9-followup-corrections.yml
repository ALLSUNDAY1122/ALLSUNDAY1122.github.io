name: Temporary West A Housing 9 Followup Corrections

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-housing-9-followup-corrections-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply-followups:
    if: github.head_ref == 'audit/west-a-housing-classification-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply 9 independently verified followup corrections
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T15:10:00+09:00';
          const pullRequestNumber = 3476;
          const definitions = JSON.parse(fs.readFileSync(`${root}/data/service-definitions.json`, 'utf8'));
          const serviceIds = definitions.services.map((item) => item.id);
          const resolutions = [
            {
              code: '33622', name: '勝央町', pref: '33',
              sourceUrl: 'https://www.town.shoo.lg.jp/site/iju/1390.html',
              additional: ['https://www.town.shoo.lg.jp/site/iju/1367.html', 'https://www.town.shoo.lg.jp/uploaded/attachment/3177.pdf'],
              title: '勝央町新築住宅普及促進事業',
              finding: '町内で自ら居住する新築住宅の完成・購入と5年以上の定住を対象とする一般制度。町外在住者20万円、町内在住者10万円で、子ども要件はない。',
              verification: 'manual_official_html'
            },
            {
              code: '43206', name: '玉名市', pref: '43',
              sourceUrl: 'https://www.city.tamana.lg.jp/q/aview/596/28799.html', additional: [],
              title: '玉名市空き家取得補助事業',
              finding: '空き家バンクを通じて空き家を購入し転入・転居した利用希望登録者を対象に取得額の1割・上限100万円を補助する一般制度。子ども要件はない。',
              verification: 'manual_official_html'
            },
            {
              code: '43444', name: '甲佐町', pref: '43',
              sourceUrl: 'https://www.town.kosa.lg.jp/q/aview/225/3030.html', additional: ['https://www.town.kosa.lg.jp/reiki_int/reiki_honbun/q457RG00000794.html?id=y7'],
              title: '甲佐町空き家利活用促進補助金',
              finding: '空き家バンク物件の購入・賃借者へ改修費5分の4・上限100万円等を補助する一般の移住定住制度。子ども要件はない。',
              verification: 'manual_official_html_and_reiki'
            },
            {
              code: '43510', name: '相良村', pref: '43',
              sourceUrl: 'https://www.vill.sagara.lg.jp/q/aview/3/1709.html', additional: ['https://www.vill.sagara.lg.jp/reiki/reiki_honbun/q479RG00000769.html'],
              title: '相良村移住定住促進事業補助金',
              finding: '村内で住宅を新築・購入する移住者・定住者を対象とする一般の移住定住支援。子ども要件はない。',
              verification: 'manual_official_html_and_reiki'
            },
            {
              code: '33461', name: '矢掛町', pref: '33',
              sourceUrl: 'https://www.town.yakage.okayama.jp/life/teijyu/teijuujosei.html', additional: ['https://www.town.yakage.okayama.jp/life/teijyu/hojyo.html'],
              title: '矢掛町定住促進助成金制度',
              finding: '住宅新築と10年以上の定住を対象とし、三世代同居等で上限が変わる一般定住制度。未成年の子ども・子育て世帯を必須とする制度ではない。',
              verification: 'search_recovered_official_html'
            },
            {
              code: '39301', name: '東洋町', pref: '39',
              sourceUrl: 'https://www.town.toyo.kochi.jp/contents/info0559.php', additional: ['https://web.town.toyo.kochi.jp/joho/reiki_int/reiki_honbun/g900RG00000776.html'],
              title: '東洋町空き家改修費補助金',
              finding: '空き家所有者または20歳以上の移住者等を対象とする一般の空き家改修制度。子ども要件はない。',
              verification: 'search_recovered_official_html_and_reiki'
            },
            {
              code: '43214', name: '阿蘇市', pref: '43',
              sourceUrl: 'https://www.city.aso.kumamoto.jp/citizens/town_planning/akiya_rifo-mu/', additional: ['https://www.city.aso.kumamoto.jp/akiya/living/'],
              title: '阿蘇市空き家活用のためのリフォーム等支援事業補助金',
              finding: '熊本県外からの移住者が空き家バンク物件を購入した場合のリフォーム・家財処分支援。子ども要件はない。',
              verification: 'search_recovered_official_html'
            },
            {
              code: '46524', name: '宇検村', pref: '46',
              sourceUrl: 'https://www.uken.net/kouhoutoukei/kurashi/sumai/akiyakaisyuu.html', additional: [],
              title: '定住促進を目的とした空き家改修',
              finding: '村が所有者から無償貸与された空き家を改修し移住希望者へ貸し出す一般の移住定住施策。子ども要件はない。',
              verification: 'search_recovered_official_html'
            },
            {
              code: '46530', name: '徳之島町', pref: '46',
              sourceUrl: 'https://www.tokunoshima-town.org/kensetsuka/kurashi/machi/sumai/jyutakureform.html', additional: [],
              title: '令和8年度徳之島町住宅リフォーム助成事業',
              finding: '町内居住・住民登録等を条件とする一般世帯の住宅リフォーム助成で、補助率15％・上限24万円。子ども要件はない。',
              verification: 'search_recovered_official_html'
            }
          ];

          function writeJson(path, value, pretty = true) {
            fs.writeFileSync(path, JSON.stringify(value, null, pretty ? 2 : 0) + (pretty ? '\n' : ''));
          }
          function primaryUrls(services) {
            return [...new Set(serviceIds
              .map((id) => services[id])
              .filter((service) => ['verified', 'unavailable'].includes(service?.status))
              .map((service) => service?.source?.url)
              .filter((url) => typeof url === 'string' && url.startsWith('https://')))];
          }

          const applied = [];
          for (const item of resolutions) {
            const municipalityPath = `${root}/data/municipalities/${item.pref}/${item.code}.json`;
            const municipalityRaw = fs.readFileSync(municipalityPath, 'utf8');
            const municipality = JSON.parse(municipalityRaw);
            const service = municipality.services?.housingSupport;
            if (!service || service.status !== 'verified') throw new Error(`${item.code}: expected verified housingSupport`);
            const previous = JSON.parse(JSON.stringify(service));
            service.status = 'unavailable';
            service.summary = `一般制度「${item.title}」は確認できるが、子育て世帯固有の住宅支援条件を確認できない`;
            service.notes = [
              `2026年7月25日に公式情報で「${item.title}」を独立確認した。`,
              item.finding,
              '一般制度の事実は保持するが、子育て世帯向け住宅支援として登録しない。'
            ];
            service.details = {
              ...(previous.details ?? {}),
              confirmedGeneralProgramSummary: previous.summary ?? null,
              previousStatus: 'verified',
              classificationReview: '一般移住・一般住宅制度を子育て世帯向け住宅支援として登録していた分類誤りを訂正',
              childSpecificConditionConfirmed: false,
              independentVerificationMethod: item.verification
            };
            service.source = { url: item.sourceUrl, checkedAt };
            if (item.additional.length) service.additionalSources = item.additional.map((url) => ({ url, checkedAt }));
            else delete service.additionalSources;

            municipality.updatedAt = checkedAt;
            const services = Object.values(municipality.services);
            const verifiedCount = services.filter((entry) => entry.status === 'verified').length;
            const unavailableCount = services.filter((entry) => entry.status === 'unavailable').length;
            municipality.summary = `必須9制度を公式情報で再監査。${verifiedCount}制度をverified、${unavailableCount}制度をunavailableとして登録。住宅支援は一般制度のみ確認され、子育て世帯固有条件を確認できないためunavailableへ訂正。`;
            writeJson(municipalityPath, municipality, municipalityRaw.includes('\n  "'));

            const taskPath = `${root}/operations/tasks/${item.code}.json`;
            const taskRaw = fs.readFileSync(taskPath, 'utf8');
            const task = JSON.parse(taskRaw);
            task.status = 'merged';
            task.currentBranch = 'region/west';
            task.pullRequestNumber = pullRequestNumber;
            task.verifiedCount = verifiedCount;
            task.unavailableCount = unavailableCount;
            task.researchingCount = services.filter((entry) => entry.status === 'researching').length;
            task.needsMediumReviewCount = services.filter((entry) => entry.status === 'needs_medium_review').length;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班A・住宅支援分類横断監査追跡確認';
            task.officialSources = primaryUrls(municipality.services);
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            const note = `2026-07-25 15:10: 公式情報を独立確認し、${item.title}は子育て世帯固有条件を持たない一般制度と判定。housingSupportをverifiedからunavailableへ訂正（PR #3476）。`;
            if (!task.notes.includes(note)) task.notes.push(note);
            task.blockers = [];
            writeJson(taskPath, task, taskRaw.includes('\n  "'));

            applied.push({
              municipalityCode: item.code,
              municipalityName: item.name,
              prefectureCode: item.pref,
              service: 'housingSupport',
              before: 'verified',
              after: 'unavailable',
              officialSource: item.sourceUrl,
              additionalSources: item.additional,
              programTitle: item.title,
              finding: item.finding,
              verificationMethod: item.verification
            });
          }

          const followup = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-housing-classification-9-followup-corrections-20260725',
            team: '西日本調査班A',
            appliedAt: updatedAt,
            regionalPullRequestNumber: pullRequestNumber,
            correctionCount: applied.length,
            corrections: applied,
            unresolvedCount: 0,
            status: 'regional_ci_pending',
            blocker: null
          };
          writeJson(`${root}/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json`, followup);

          const planPath = `${root}/operations/audits/west-a-housing-classification-correction-plan-20260725.json`;
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          plan.followupAppliedAt = updatedAt;
          plan.followupCorrectionCount = applied.length;
          plan.totalAppliedCorrectionCount = (plan.appliedCorrectionCount ?? 0) + applied.length;
          plan.followupCorrections = applied;
          plan.manualReviewResolvedCount = plan.manualReviewCount;
          plan.fetchProblemResolvedCount = plan.fetchProblemCount;
          plan.unresolvedCount = 0;
          plan.status = 'all_38_corrections_applied_regional_ci_pending';
          writeJson(planPath, plan);

          const crossPath = `${root}/operations/audits/west-a-housing-classification-crosscheck-20260725.json`;
          const cross = JSON.parse(fs.readFileSync(crossPath, 'utf8'));
          cross.followupCorrectionCount = applied.length;
          cross.totalAppliedCorrectionCount = (cross.appliedCorrectionCount ?? 0) + applied.length;
          cross.manualReviewPendingCount = 0;
          cross.fetchProblemPendingCount = 0;
          cross.unresolvedCount = 0;
          cross.status = '38_corrections_applied_regional_ci_pending';
          writeJson(crossPath, cross);

          const highRiskPath = `${root}/operations/audits/west-a-housing-high-risk-summary-20260725.json`;
          const highRisk = JSON.parse(fs.readFileSync(highRiskPath, 'utf8'));
          highRisk.followupCorrectionCount = applied.length;
          highRisk.totalAppliedCorrectionCount = (highRisk.appliedCorrectionCount ?? 0) + applied.length;
          highRisk.manualReviewResolvedCount = highRisk.manualReviewRequiredCount;
          highRisk.fetchProblemResolvedCount = highRisk.fetchProblemCount;
          highRisk.unresolvedCount = 0;
          highRisk.status = 'all_high_risk_and_fetch_problems_resolved_regional_ci_pending';
          writeJson(highRiskPath, highRisk);

          const batch29Path = `${root}/operations/audits/west-a-housing-classification-29-corrections-20260725.json`;
          const batch29 = JSON.parse(fs.readFileSync(batch29Path, 'utf8'));
          batch29.manualReviewPending = [];
          batch29.fetchProblemsPending = [];
          batch29.followupAudit = `${root}/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json`;
          batch29.unresolvedCount = 0;
          batch29.status = 'followups_resolved_regional_ci_pending';
          writeJson(batch29Path, batch29);
          NODE

          rm -f jichitai-compare/operations/control/west-a-housing-9-followup-corrections-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-9-followup-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-high-risk-summary-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-correction-plan-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-29-corrections-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-9-followup-corrections-20260725.json \
                  jichitai-compare/operations/control/west-a-housing-9-followup-corrections-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-9-followup-corrections.yml
          git diff --cached --check
          git commit -m 'fix: 西日本A住宅支援の残り9件を公式確認で訂正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
