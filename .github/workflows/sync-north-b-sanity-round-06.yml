name: Sync North B sanity audit round 06

on:
  push:
    branches:
      - coord/sync-north-b-sanity-round-06-20260725
    paths:
      - .github/workflows/sync-north-b-sanity-round-06.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sync-north-b-sanity-round-06-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync regional data and regenerate public files
        shell: bash
        run: |
          git fetch origin region/north
          git checkout origin/region/north -- \
            jichitai-compare/data/municipalities/05/05204.json \
            jichitai-compare/data/municipalities/05/05206.json \
            jichitai-compare/data/municipalities/05/05207.json \
            jichitai-compare/data/municipalities/05/05209.json \
            jichitai-compare/data/municipalities/05/05211.json \
            jichitai-compare/data/municipalities/05/05212.json \
            jichitai-compare/operations/tasks/05204.json \
            jichitai-compare/operations/tasks/05206.json \
            jichitai-compare/operations/tasks/05207.json \
            jichitai-compare/operations/tasks/05209.json \
            jichitai-compare/operations/tasks/05211.json \
            jichitai-compare/operations/tasks/05212.json \
            jichitai-compare/operations/audits/north-b-research-sanity-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json
          cd jichitai-compare
          npm run generate
          npm run progress
          cd ..
          node <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.updatedAt = '2026-07-25T02:01:00+09:00';
          data.workingBranch = 'coord/sync-north-b-sanity-round-06-20260725';
          data.pullRequestNumber = null;
          data.ciStatus = 'pending';
          data.nextAction = '北日本B誤調査ざっくり再検証第6回は地域PR #3007・CI #7297成功でregion/northへ統合済み。大館市、男鹿市、湯沢市、鹿角市、潟上市、大仙市の自治体JSON、task、監査記録、全国生成JSON、静的ページをmainへ同期する。監査完了6/10回、66/107自治体、残り4回・41自治体。';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          rm .github/workflows/sync-north-b-sanity-round-06.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "全国品質同期: 北日本B誤調査再検証 第6回を反映"
          git push origin HEAD:coord/sync-north-b-sanity-round-06-20260725