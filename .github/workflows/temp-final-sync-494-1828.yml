name: Temporary final sync 494 1828

on:
  pull_request:
    branches: [main]
    paths:
      - .github/triggers/final-sync-494-1831.txt

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final control state branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/region/north:refs/remotes/origin/region/north \
            +refs/heads/region/east:refs/remotes/origin/region/east \
            +refs/heads/region/central:refs/remotes/origin/region/central \
            +refs/heads/region/west:refs/remotes/origin/region/west
          git checkout -B coord/state-after-public-494-20260722-1841 origin/main
          echo '' | base64 -d > /tmp/final-sync.py
          python3 /tmp/final-sync.py
          read total north east central west < /tmp/final-queue-summary
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json \
            jichitai-compare/operations/control/global-state.json \
            jichitai-compare/operations/control/audit-log.jsonl
          git commit -m "統括管理: 公開494・地方統合${total}へ同期（北${north} 東${east} 中${central} 西${west}）"
          git push --force origin HEAD:coord/state-after-public-494-20260722-1841
