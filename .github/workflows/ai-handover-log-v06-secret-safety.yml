name: AI Handover Log Apple Secret Safety

on:
  push:
    branches:
      - agent/ai-handover-log-v04-binary
    paths:
      - '.github/workflows/ai-handover-log-v06-secret-safety.yml'
      - '.github/workflows/ai-handover-log-v06-signed-testflight-upload.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'source_parts/**'
  pull_request:
    paths:
      - '.github/workflows/ai-handover-log-v06-secret-safety.yml'
      - '.github/workflows/ai-handover-log-v06-signed-testflight-upload.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'source_parts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-secret-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for Apple signing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scan_forbidden_apple_secrets.py

      - name: Verify upload workflow references GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/ai-handover-log-v06-signed-testflight-upload.yml"
          test -f "$FILE"

          required=(
            'secrets.APPLE_TEAM_ID'
            'secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64'
            'secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD'
            'secrets.APPLE_PROVISIONING_PROFILE_BASE64'
            'secrets.APPLE_TEMP_KEYCHAIN_PASSWORD'
            'secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64'
            'secrets.APP_STORE_CONNECT_API_KEY_ID'
            'secrets.APP_STORE_CONNECT_ISSUER_ID'
          )
          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$FILE" || {
              echo "Required GitHub secret reference missing: $marker" >&2
              exit 1
            }
          done

          grep -Fq 'environment: testflight-production' "$FILE"
          grep -Fq "confirmation == 'UPLOAD'" "$FILE"
          grep -Fq 'Delete temporary signing credentials' "$FILE"

      - name: Verify no signed binary is configured as artifact
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/ai-handover-log-v06-signed-testflight-upload.yml"
          artifact_section="$(
            awk '
              /Upload non-secret verification reports/ {capture=1}
              capture {print}
              /Delete temporary signing credentials/ {exit}
            ' "$FILE"
          )"
          if printf '%s\n' "$artifact_section" | grep -Eiq '\.ipa|\.xcarchive|\.p12|\.mobileprovision|AuthKey_.*\.p8'; then
            echo "A sensitive or signed binary path is configured for artifact upload." >&2
            exit 1
          fi
          echo "Only non-secret reports are configured for artifact upload."
