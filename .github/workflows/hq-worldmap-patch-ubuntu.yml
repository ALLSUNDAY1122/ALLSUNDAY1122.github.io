name: HQ WorldMap Durability Patch Linux

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - .github/workflows/hq-worldmap-patch-ubuntu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Apply staged patch deterministically
        shell: bash
        run: |
          set -euo pipefail
          if [ -f splat-native-ios/SplatNative/ScanWorldMapArchiveStore.swift ] && \
             [ -f splat-native-ios/scripts/test_worldmap_durability_contract.py ]; then
            echo 'WorldMap patch already applied by the earlier runner.'
            exit 0
          fi
          test -f .github/workflows/hq-worldmap-patch.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/hq-worldmap-patch.yml').read_text().splitlines()
          marker = '      - name: Apply WorldMap durability patch'
          next_marker = '      - name: Commit patched source'
          start = source.index(marker)
          end = source.index(next_marker)
          run_index = next(i for i in range(start, end) if source[i].strip() == 'run: |')
          body = source[run_index + 1:end]
          script = textwrap.dedent('\n'.join(body)) + '\n'
          if 'Apply WorldMap durability patch' in script or not script.startswith('python3'):
              raise SystemExit('failed to extract staged patch script')
          Path('/tmp/worldmap-patch.sh').write_text(script)
          PY
          bash /tmp/worldmap-patch.sh
          python3 splat-native-ios/scripts/test_worldmap_durability_contract.py
          git diff --check
      - name: Commit patch and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Scaniverse HQ Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/hq-worldmap-patch-ubuntu.yml
          if [ -f .github/workflows/hq-worldmap-patch.yml ]; then
            git rm -f .github/workflows/hq-worldmap-patch.yml
          fi
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "fix(hq): make worldmap persistence transition-safe"
          git push origin HEAD:feature/splat-native-ios-poc
