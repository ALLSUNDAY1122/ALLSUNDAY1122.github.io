name: Pharmacist Build Number Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[PHARMACIST-BUILDNO-FIX]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed patch
        run: |
          python3 scripts/patch_pharmacist_unique_build_number.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('codemagic.yaml').read_text(encoding='utf-8')
          a=s.index('  pharmacist-ios:')
          b=s.index('\n  shoshi-ios:',a)
          block=s[a:b]
          assert 'RELEASE_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"' in block
          assert "submit_to_app_store: false" in block
          assert 'Set unique release build number and generate native project' in block
          print('PASS: pharmacist workflow repaired and App Store review submission remains disabled')
          PY
      - name: Commit only codemagic repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codemagic.yaml
          git diff --cached --exit-code && { echo 'No change required'; exit 0; } || true
          git commit -m 'fix(pharmacist): ensure unique App Store build number'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Pharmacist build-number repair finished. status=${{ job.status }}; run_id=${context.runId}`
            });
