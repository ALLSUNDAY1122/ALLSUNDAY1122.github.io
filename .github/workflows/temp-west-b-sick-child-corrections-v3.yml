name: Temporary West B Region Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-region-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ops/run-west-b-region-sync-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/west-b-sick-child-region-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy main source of truth
        shell: bash
        run: |
          git fetch origin main
          files=(
            jichitai-compare/data/municipalities/35/35321.json
            jichitai-compare/data/municipalities/35/35502.json
            jichitai-compare/data/municipalities/36/36342.json
            jichitai-compare/data/municipalities/42/42214.json
            jichitai-compare/data/municipalities/45/45341.json
            jichitai-compare/data/municipalities/45/45382.json
            jichitai-compare/operations/tasks/35321.json
            jichitai-compare/operations/tasks/35502.json
            jichitai-compare/operations/tasks/36342.json
            jichitai-compare/operations/tasks/42214.json
            jichitai-compare/operations/tasks/45341.json
            jichitai-compare/operations/tasks/45382.json
            jichitai-compare/operations/audits/west-b-sick-child-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-b-sick-child-crosscheck-review-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/main:$file" > "$file"
          done
      - name: Mark regional sync and regenerate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(p, 'utf8'));
          checkpoint.sickChildCareCrosscheck = {
            ...(checkpoint.sickChildCareCrosscheck ?? {}),
            status: 'region_sync_validated_pending_pr',
            mainPullRequest: 3279,
            mainMergeCommit: '18ba59a96f0afe7856e2d5df6dea5e33eba22aae',
            regionBranch: 'sync/west-b-sick-child-region-20260725'
          };
          checkpoint.updatedAt = '2026-07-25T12:19:00+09:00';
          fs.writeFileSync(p, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit regional sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jichitai-compare
          git status --short
          if git diff --cached --quiet; then
            echo "No regional changes to commit"
            exit 0
          fi
          git commit -m "sync: 西日本B病児保育6自治体をregion/westへ同期"
          git push origin HEAD:sync/west-b-sick-child-region-20260725
