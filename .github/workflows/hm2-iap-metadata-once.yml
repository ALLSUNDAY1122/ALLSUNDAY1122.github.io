name: HM2 IAP Metadata Once

on:
  push:
    branches: [main]
    paths:
      - 'automation/hm2-iap-metadata-trigger.txt'
      - '.github/workflows/hm2-iap-metadata-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hm2-iap-metadata-once
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure HM2 IAP metadata
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/hm2_configure_iap_metadata.py
      - name: Persist sanitized ASC read-back
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f hm2-iap-metadata-result.json ]; then
            echo 'No result file produced; see workflow log.'
            exit 0
          fi
          mkdir -p automation/asc-results
          cp hm2-iap-metadata-result.json automation/asc-results/hm2-iap-metadata-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/asc-results/hm2-iap-metadata-result.json
          if git diff --cached --quiet; then
            echo 'ASC read-back unchanged.'
            exit 0
          fi
          git commit -m 'chore(hm2): persist IAP metadata read-back'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Failed to persist HM2 IAP metadata read-back after retries.' >&2
          exit 1
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hm2-iap-metadata-result-${{ github.run_id }}
          path: hm2-iap-metadata-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4471,
              body: `HM2 IAP metadata job finished. status=${{ job.status }}; run_id=${context.runId}`
            });
