name: Temporary Generate 334

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-334.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public files
        run: |
          set -euxo pipefail
          git fetch origin coord/generated-334-20260722-1040
          git checkout coord/generated-334-20260722-1040
          git reset --hard origin/main
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('324自治体・9制度','334自治体・9制度')
          s=s.replace('登録状況：324自治体の生成データを公開中','登録状況：334自治体の生成データを公開中')
          p.write_text(s,encoding='utf-8')
          PY
          npm run validate:generated
          cd ..
          test "$(git diff --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git commit -m '公開更新: 生成データと表示件数を334自治体へ同期'
          git push --force-with-lease origin coord/generated-334-20260722-1040
