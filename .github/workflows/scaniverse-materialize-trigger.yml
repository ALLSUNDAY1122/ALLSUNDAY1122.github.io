name: Scaniverse materialize edit trigger

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/scaniverse-materialize-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-native-ios-poc
          fetch-depth: 0
      - name: Execute canonical patch body
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/scaniverse-materialize-viewer-edits.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n          git diff --check"
          if start not in workflow or end not in workflow:
              raise SystemExit('canonical patch body markers not found')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          body = textwrap.dedent(body)
          exec(compile(body, 'scaniverse-materialize-viewer-edits', 'exec'), {})
          PY
          git diff --check
          grep -q 'enum SplatPersistedEditMaterializer' splat-native-ios/SplatNative/SplatExportService.swift
          grep -q 'materializeInMemory' splat-native-ios/SplatNative/SplatVideoExporter.swift
          grep -q 'testBrowserSharePackageUsesPersistedViewerCrop' splat-native-ios/SplatNativeTests/SplatExportServiceTests.swift
      - name: Commit parity fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SplatNative/SplatExportService.swift \
                  splat-native-ios/SplatNative/SplatVideoExporter.swift \
                  splat-native-ios/SplatNativeTests/SplatExportServiceTests.swift
          git commit -m 'fix(scaniverse): materialize viewer edits in shared outputs'
          git push origin HEAD:feature/splat-native-ios-poc
