name: Temporary North Release 10 20260722 0645

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-north-release-10-20260722-0645.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/north-release-10-20260722-0645
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy fixed north snapshot
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north'
          paths=(
            jichitai-compare/data/municipalities/01/01458.json
            jichitai-compare/operations/tasks/01458.json
            jichitai-compare/data/municipalities/01/01459.json
            jichitai-compare/operations/tasks/01459.json
            jichitai-compare/data/municipalities/01/01460.json
            jichitai-compare/operations/tasks/01460.json
            jichitai-compare/data/municipalities/01/01461.json
            jichitai-compare/operations/tasks/01461.json
            jichitai-compare/data/municipalities/01/01462.json
            jichitai-compare/operations/tasks/01462.json
            jichitai-compare/data/municipalities/01/01463.json
            jichitai-compare/operations/tasks/01463.json
            jichitai-compare/data/municipalities/01/01464.json
            jichitai-compare/operations/tasks/01464.json
            jichitai-compare/data/municipalities/01/01465.json
            jichitai-compare/operations/tasks/01465.json
            jichitai-compare/data/municipalities/01/01468.json
            jichitai-compare/operations/tasks/01468.json
            jichitai-compare/data/municipalities/01/01469.json
            jichitai-compare/operations/tasks/01469.json
          )
          git checkout origin/region/north -- "${paths[@]}"
          actual=$(git diff --name-only --cached | sort)
          expected=$(printf '%s\n' "${paths[@]}" | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 北日本10自治体を固定スナップショット化'
          git push origin coord/north-release-10-20260722-0645
