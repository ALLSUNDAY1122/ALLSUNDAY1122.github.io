name: Temporary North Release 10

on:
  push:
    branches:
      - coord/north-release-10-20260722-0235
    paths:
      - .github/workflows/temp-north-release-10-0235.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/north-release-10-20260722-0235
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy fixed municipality snapshot
        run: |
          set -euxo pipefail
          SOURCE_COMMIT=e6fa04272a031d6015686185fdb6521133d91297
          git fetch origin region/north
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          paths=(
            jichitai-compare/data/municipalities/01/01400.json
            jichitai-compare/operations/tasks/01400.json
            jichitai-compare/data/municipalities/01/01401.json
            jichitai-compare/operations/tasks/01401.json
            jichitai-compare/data/municipalities/01/01402.json
            jichitai-compare/operations/tasks/01402.json
            jichitai-compare/data/municipalities/01/01403.json
            jichitai-compare/operations/tasks/01403.json
            jichitai-compare/data/municipalities/01/01404.json
            jichitai-compare/operations/tasks/01404.json
            jichitai-compare/data/municipalities/01/01405.json
            jichitai-compare/operations/tasks/01405.json
            jichitai-compare/data/municipalities/01/01406.json
            jichitai-compare/operations/tasks/01406.json
            jichitai-compare/data/municipalities/01/01407.json
            jichitai-compare/operations/tasks/01407.json
            jichitai-compare/data/municipalities/01/01408.json
            jichitai-compare/operations/tasks/01408.json
            jichitai-compare/data/municipalities/01/01409.json
            jichitai-compare/operations/tasks/01409.json
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${SOURCE_COMMIT}:${path}" > "$path"
          done
          rm .github/workflows/temp-north-release-10-0235.yml
          git add "${paths[@]}" .github/workflows/temp-north-release-10-0235.yml
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/temp-north-release-10-0235.yml'}
          for code in ['01400','01401','01402','01403','01404','01405','01406','01407','01408','01409']:
              expected.add(f'jichitai-compare/data/municipalities/01/{code}.json')
              expected.add(f'jichitai-compare/operations/tasks/{code}.json')
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged files: {sorted(actual ^ expected)}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "418982chi+github-actions[bot]@users.noreply.github.com"
          git commit -m "全国統合: 北日本10自治体の固定スナップショット"
          git push origin coord/north-release-10-20260722-0235
