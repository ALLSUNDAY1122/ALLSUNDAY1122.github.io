name: Temporary Central A Housing Batch 34 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch34-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch34-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'28217',name:'川西市',status:'verified',summary:'令和8年度、子育て住宅促進区域内で若年世帯・子育て世帯が新築住宅または中古住宅を取得する場合、新築100万円、中古60万円を補助する。',source:'https://www.city.kawanishi.hyogo.jp/kurashi/1017490/sumai/1021174/1021177.html'},
            {code:'21202',name:'大垣市',status:'verified',summary:'中学生以下の子がいる世帯または夫婦の一方が40歳未満の世帯が、新たに取得した中古住宅を改修する場合、費用の3分の1・上限30万円、一定の移住空家は上限50万円を補助する。',source:'https://www.city.ogaki.lg.jp/0000030637.html'},
            {code:'21382',name:'輪之内町',status:'verified',summary:'令和8年度から住宅新築・建替え・購入支援を拡充し、固定資産税3年相当分に加え、18歳未満の子の人数に応じ20万～40万円を加算する。',source:'https://town.wanouchi.gifu.jp/portal/life-process/subsidy-allowance/about-residence/post0021693/'},
            {code:'22304',name:'南伊豆町',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住居・リフォーム・引越費用を最大50万円補助する。',source:'https://www.town.minamiizu.shizuoka.jp/docs/2024051300016/'},
            {code:'22305',name:'松崎町',status:'verified',summary:'申請年度を基準とする結婚新生活支援として、39歳以下の新婚世帯へ住宅購入・賃借・リフォーム・引越費用を最大60万円補助する。年度別予算状況は申請前に町へ確認が必要。',source:'https://www.town.matsuzaki.shizuoka.jp/docs/2022053000026/'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch34Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const statusMatches=html.includes('確認済み');
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){
                pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});
              }
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch34Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>String(item.code??item.municipalityCode)===target.code);
                const service=municipality?.services?.housingSupport;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){
              jsonCheck={error:String(error),success:false};
            }
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch34-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3950,nationalSyncPullRequest:3952,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:0,expectedVerifiedCount:5,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const out='jichitai-compare/operations/audits/central-a-housing-classification-batch34-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(out),{recursive:true});
          fs.writeFileSync(out,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch34-public-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第34群の公開反映を確認'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
