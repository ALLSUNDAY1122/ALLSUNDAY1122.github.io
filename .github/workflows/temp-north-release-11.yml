name: Temporary North Release 11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-north-release-11.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  build-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create fixed snapshot branch
        env:
          BRANCH: coord/north-release-11-20260721-0615
        run: |
          set -euo pipefail
          git fetch origin main region/north
          git switch -C "$BRANCH" origin/main
          codes=(01233 01234 01235 01236 01303 01304 01331 01332 01333 01334 01337)
          for code in "${codes[@]}"; do
            pref="${code:0:2}"
            data_path="jichitai-compare/data/municipalities/${pref}/${code}.json"
            task_path="jichitai-compare/operations/tasks/${code}.json"
            mkdir -p "$(dirname "$data_path")" "$(dirname "$task_path")"
            git show "origin/region/north:${data_path}" > "$data_path"
            git show "origin/region/north:${task_path}" > "$task_path"
          done
          git add jichitai-compare/data/municipalities/01 jichitai-compare/operations/tasks
          git commit -m "全国統合: 北日本の追加11自治体を固定スナップショット化"
          git push --force-with-lease origin "$BRANCH"

      - name: Validate snapshot
        working-directory: jichitai-compare
        run: npm run validate

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: coord/north-release-11-20260721-0615
        run: |
          set -euo pipefail
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          cat > /tmp/pr-body.md <<'EOF'
          ## 目的
          北日本調査班で前回全国統合後に地方統合された11自治体がリリース条件へ到達したため、最新main基準の固定スナップショットとして自治体JSON・taskだけを移植します。

          ## 対象自治体
          - 伊達市（01233）
          - 北広島市（01234）
          - 石狩市（01235）
          - 北斗市（01236）
          - 当別町（01303）
          - 新篠津村（01304）
          - 松前町（01331）
          - 福島町（01332）
          - 知内町（01333）
          - 木古内町（01334）
          - 七飯町（01337）

          ## 変更範囲
          各自治体の自治体JSONとtask、合計22ファイルのみです。地域状態、全国管理、生成データ、公開表示は含めません。

          ## 検証
          - region/northで各地方PRのCI成功後に統合済み
          - 最新mainを親とする固定スナップショット
          - npm run validate 成功

          ## リリース後
          本PR成功後、生成データ・全国進捗・公開件数・全国管理を別PRで同期します。
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "全国統合: 北日本の追加11自治体をmainへ反映" --body-file /tmp/pr-body.md

      - name: Remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git switch main
          git pull --ff-only origin main
          git rm .github/workflows/temp-north-release-11.yml
          git commit -m "ci: 北日本11自治体全国統合用の一時ワークフローを削除"
          git push origin main
