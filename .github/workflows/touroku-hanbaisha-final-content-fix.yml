name: Fix Touhan Final Content Audit Findings

on:
  push:
    paths:
      - '.github/workflows/touroku-hanbaisha-final-content-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply finite content-audit fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('touroku-hanbaisha-sprint/questions/exam-1')

          p1=root/'chapter-1.json'
          rows=json.loads(p1.read_text(encoding='utf-8'))
          q=next(x for x in rows if x['id']=='RS26-065')
          q['point']='サリドマイド製剤の妊婦等による使用で、出生児に四肢欠損や耳の障害等の先天異常が生じた。'
          q['detail']='サリドマイド製剤を妊婦等が使用したことにより、出生児に四肢欠損や耳の障害等の先天異常が生じました。この薬害は、市販後の副作用情報収集と安全対策の重要性を示す事例の一つです。'
          q['explanation']=q['detail']
          q['reference_date']='2026-08-15'
          p1.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p4=root/'chapter-4.json'
          rows=json.loads(p4.read_text(encoding='utf-8'))
          q=next(x for x in rows if x['id']=='RS26-107')
          q['topic']='要指導医薬品・特定要指導医薬品'
          q['question']='令和8年5月1日施行後の要指導医薬品の販売・情報提供に関する記述のうち、正しいものはどれか。'
          q['choices']=[
            '要指導医薬品は薬剤師が販売し、必要な情報提供・指導は対面等で行う。特定要指導医薬品は薬剤師による対面販売が必要である。',
            '要指導医薬品は登録販売者だけで販売できる。',
            '要指導医薬品はすべて無制限にインターネット販売できる。',
            '令和8年5月1日以降、すべての要指導医薬品で対面販売が禁止された。',
            '要指導医薬品では、使用者の状況に応じた情報提供・指導は不要である。'
          ]
          q['correct_index']=0
          q['answer']=0
          q['point']='要指導医薬品は薬剤師が販売し、情報提供・指導は対面等で行う。特定要指導医薬品は薬剤師による対面販売が必要である。'
          q['detail']='令和8年5月1日施行後、要指導医薬品は薬剤師が販売し、必要な情報提供・指導を対面等で行います。そのうち特定要指導医薬品は、薬剤師による対面での販売・授与が必要です。'
          q['explanation']=q['detail']
          q['source_url']='https://www.mhlw.go.jp/web/t_doc?dataId=81004000&dataType=0&pageNo=3'
          q['reference_date']='2026-08-15'
          p4.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-sprint/questions/exam-1/chapter-1.json touroku-hanbaisha-sprint/questions/exam-1/chapter-4.json
          git commit -m 'Fix final Touhan content audit findings'
          git push origin HEAD:main
