name: Temporary Build East Release 10 1947

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-release-10-1947.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed 10-municipality snapshot
        run: |
          set -euxo pipefail
          git fetch origin region/east coord/east-release-10-20260722-1947
          git checkout coord/east-release-10-20260722-1947
          files=(
            jichitai-compare/data/municipalities/10/10209.json
            jichitai-compare/operations/tasks/10209.json
            jichitai-compare/data/municipalities/10/10210.json
            jichitai-compare/operations/tasks/10210.json
            jichitai-compare/data/municipalities/10/10211.json
            jichitai-compare/operations/tasks/10211.json
            jichitai-compare/data/municipalities/10/10212.json
            jichitai-compare/operations/tasks/10212.json
            jichitai-compare/data/municipalities/10/10344.json
            jichitai-compare/operations/tasks/10344.json
            jichitai-compare/data/municipalities/10/10345.json
            jichitai-compare/operations/tasks/10345.json
            jichitai-compare/data/municipalities/10/10366.json
            jichitai-compare/operations/tasks/10366.json
            jichitai-compare/data/municipalities/10/10367.json
            jichitai-compare/operations/tasks/10367.json
            jichitai-compare/data/municipalities/10/10382.json
            jichitai-compare/operations/tasks/10382.json
            jichitai-compare/data/municipalities/10/10383.json
            jichitai-compare/operations/tasks/10383.json
          )
          git checkout origin/region/east -- "${files[@]}"
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          test "${#changed[@]}" -eq 20
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m '全国統合: 東日本10自治体の固定スナップショット'
          git push origin coord/east-release-10-20260722-1947
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-build-east-release-10-1947.yml
          git commit -m '統括管理: 東日本統合一時ワークフローを削除'
          git push origin main
