name: Registered Seller Official Crop Mobile Embedding QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-crop-mobile-qa.yml'
      - 'touroku-hanbaisha-sprint/official-kansai/test_crop_embed_ui.py'
permissions:
  contents: write
concurrency:
  group: touhan-crop-mobile-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test original PDF crop in 375/430 mobile layout
        run: |
          python -m http.server 8765 --directory touroku-hanbaisha-sprint >/tmp/touhan-crop-http.log 2>&1 &
          sleep 2
          python touroku-hanbaisha-sprint/official-kansai/test_crop_embed_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-official-crop-mobile-preview
          path: /tmp/touhan-crop-mobile-*.png
          if-no-files-found: ignore
      - name: Save only successful test results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f touroku-hanbaisha-sprint/official-kansai/CROP_EMBED_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(touhan): source-PDF crop embedded on 375 and 430px browser (QA only)'
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$n" -eq 3 ]; then exit 1; fi
            done
          fi
