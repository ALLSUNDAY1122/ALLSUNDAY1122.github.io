name: Temporary Sync Release Queue 524 Final Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-524-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/north:refs/remotes/origin/region/north' '+refs/heads/region/east:refs/remotes/origin/region/east' '+refs/heads/region/central:refs/remotes/origin/region/central' '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('jichitai-compare/operations/control/release-queue.json'); q=json.loads(p.read_text()); by={e['region']:e for e in q['entries']}
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def own(r,n): return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          pending={}
          for r in ('north','east','central','west'):
            ref=f'origin/region/{r}'; items=[]
            for path in subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines():
              if not re.search(r'/\d{5}\.json$',path): continue
              d=json.loads(show(ref,path))
              if own(r,int(d['prefectureCode'])): items.append({'code':d['code'],'name':d['name']})
            items.sort(key=lambda x:x['code']); s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json')); c=int(s.get(fields[r],0)); pending[r]=c; e=by[r]
            e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':c,'releaseStatus':'release_ready' if c>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の繰越は{c}自治体','mainIntegrationPr':s.get('lastNationalIntegrationPr'),'generatedPullRequest':820,'auditStatus':'passed'})
          total=sum(e['count'] for e in q['entries']); q['updatedAt']='2026-07-22T20:10:00+09:00'; q['status']='active'; q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':524,'latestGeneratedPullRequest':820,'latestPublicCountPullRequest':820,'releaseReadyRegions':[r for r,c in pending.items() if c>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"}; p.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n')
          print(total,pending)
          PY
          git add jichitai-compare/operations/control/release-queue.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m '統括管理: 地方統合534自治体・公開524自治体へ同期'; git push origin main; fi
          git pull --ff-only origin main
          git rm .github/workflows/temp-sync-release-queue-524-final.yml
          git commit -m '統括管理: 最終キュー同期一時ワークフローを削除'
          git push origin main
