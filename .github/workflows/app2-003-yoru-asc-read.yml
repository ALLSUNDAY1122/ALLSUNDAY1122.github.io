name: APP2-003 夜の書架 ASC Read

on:
  push:
    branches:
      - automation/app-development-2-session-dispatcher
    paths:
      - automation/chatgpt-dispatcher/app-development-2/runtime/APP2-003-asc-command.json

permissions:
  contents: write

jobs:
  read:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Execute ASC read command
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 scripts/app_store_connect_gateway.py \
            --command automation/chatgpt-dispatcher/app-development-2/runtime/APP2-003-asc-command.json \
            --output app2-003-asc-result.json
      - name: Persist sanitized APP2-003 result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('app2-003-asc-result.json').read_text(encoding='utf-8'))
          out = {'request_id': src.get('request_id'), 'completed_at': src.get('completed_at'), 'results': []}
          for r in src.get('results', []):
              response = r.get('response') or {}
              data = response.get('data')
              if isinstance(data, dict):
                  data = [data]
              elif not isinstance(data, list):
                  data = []
              clean = []
              for x in data:
                  if not isinstance(x, dict):
                      continue
                  attrs = x.get('attributes') or {}
                  clean.append({
                      'id': x.get('id'),
                      'type': x.get('type'),
                      'attributes': {k: attrs.get(k) for k in (
                          'name','bundleId','sku','primaryLocale','version','versionString','platform',
                          'appStoreState','betaReviewState','externalBuildState','internalBuildState',
                          'uploadedDate','processingState','expired','expirationDate','minOsVersion'
                      ) if k in attrs}
                  })
              out['results'].append({
                  'label': r.get('label'),
                  'path': r.get('path'),
                  'http_status': r.get('http_status'),
                  'data': clean,
              })
          p = Path('automation/chatgpt-dispatcher/app-development-2/evidence/APP2-003-asc.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/chatgpt-dispatcher/app-development-2/evidence/APP2-003-asc.json
          git commit -m "Persist APP2-003 ASC read evidence" || exit 0
          git push
