name: Temporary Finalize West B Audit Cycle 02

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-rough-validation-cycle-02-20260725
          fetch-depth: 0

      - name: Finalize audit classification
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-02-20260725.json';
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const spot = report.manualSpotChecks.find(item => item.code === '34207');
          if (spot) spot.status = 'passed';
          report.conclusion = 'no_research_content_error_detected_two_source_maintenance_issues_corrected';
          report.reviewedAt = '2026-07-25T00:50:00+09:00';
          report.detectedResearchContentErrorCount = 0;
          report.detectedSourceMaintenanceIssueCount = 2;
          report.correctedSourceMaintenanceIssueCount = 2;
          report.warningReview = [
            {
              code: '32525', name: '海士町', service: 'childcareFee',
              classification: 'transient_or_bot_http_warning',
              result: '町公式ページは自動取得できなかったが、登録済みの保育料階層制・第3子以降無料の根拠と保守的な記載に矛盾なし'
            },
            {
              code: '32527', name: '知夫村', service: 'officialUrl_and_five_sources',
              classification: 'site_access_or_tls_warning',
              result: '村公式サイト6件がGitHub Actionsから取得不能。県公式根拠、村例規・総合戦略を用いたunavailable中心の保守的判定で、内容誤りは検出せず'
            },
            {
              code: '32528', name: '隠岐の島町', service: 'bulkyWaste',
              classification: 'stale_source_url_corrected',
              result: '404の旧ガイドブックPDFを現行公式ごみ案内ページへ更新。制度内容・料金・判定は変更なし',
              correctionPullRequestNumber: 2951,
              correctionCiRunNumber: 7070,
              correctionMergeCommit: '702a8cb7b7247a9a089df277a14d8409313fecac'
            },
            {
              code: '34211', name: '大竹市', service: 'postpartumCare',
              classification: 'stale_source_url_corrected',
              result: '404の令和7年度利用案内を令和8年度実施計画へ更新。現行の詳細条件未確認のためunavailable判定を維持',
              correctionPullRequestNumber: 2951,
              correctionCiRunNumber: 7070,
              correctionMergeCommit: '702a8cb7b7247a9a089df277a14d8409313fecac'
            },
            {
              code: '34214', name: '安芸高田市', service: 'schoolMeals',
              classification: 'bot_http_403_warning',
              result: '公式例規サイトの403。学校給食費を無償とする市条例本文を確認し、登録内容と一致'
            }
          ];
          report.nextCycle = {
            cycle: 3,
            plannedMunicipalityCount: 25,
            scopePolicy: '広島県の残り自治体から開始し、山口県へ進む'
          };
          writeFileSync(path, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Remove workflow and commit report
        run: |
          rm .github/workflows/temp-finalize-west-b-audit-cycle-02.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-finalize-west-b-audit-cycle-02.yml \
            jichitai-compare/operations/audits/west-b-rough-validation-cycle-02-20260725.json
          git commit -m 'audit: finalize West B rough validation cycle 02'
          git push origin HEAD:audit/west-b-rough-validation-cycle-02-20260725
