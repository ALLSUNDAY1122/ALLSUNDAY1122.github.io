name: Temporary West B Wadomari Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-wadomari-public-verify-trigger-20260725.json

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/run-west-b-wadomari-public-verify-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published municipality page and generated JSON
        shell: bash
        run: |
          set -euo pipefail
          page='https://allsunday1122.github.io/jichitai-compare/municipality/46533/'
          generated='https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json'
          expected='粗大ごみを含む個人ごみは沖永良部クリーンセンターへ直接搬入し、10kg当たり75円'
          source='https://www.okieikumiai.com/cleancenter'
          passed=0
          for attempt in $(seq 1 24); do
            page_file=$(mktemp)
            generated_file=$(mktemp)
            page_status=$(curl -L -sS -o "$page_file" -w '%{http_code}' --max-time 30 "$page" || true)
            generated_status=$(curl -L -sS -o "$generated_file" -w '%{http_code}' --max-time 45 "$generated" || true)
            if [[ "$page_status" == '200' ]] \
              && [[ "$generated_status" == '200' ]] \
              && grep -Fq "$expected" "$page_file" \
              && grep -Fq "$source" "$page_file" \
              && grep -Eq '"code"[[:space:]]*:[[:space:]]*"46533"' "$generated_file" \
              && grep -Fq "$expected" "$generated_file" \
              && grep -Fq "$source" "$generated_file"; then
              echo "public verification passed on attempt $attempt"
              passed=1
              break
            fi
            echo "attempt=$attempt page=$page_status generated=$generated_status"
            sleep 10
          done
          test "$passed" -eq 1
