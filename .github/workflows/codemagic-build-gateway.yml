name: Codemagic Build Gateway

on:
  push:
    branches:
      - main
    paths:
      - automation/codemagic-build-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gateway dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Execute Codemagic command
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          python scripts/codemagic_build_gateway.py \
            --command automation/codemagic-build-command.json \
            --output codemagic-result.json

      - name: Inspect Codemagic build actions
        if: always()
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          result_path = Path('codemagic-result.json')
          if not result_path.exists():
              raise SystemExit(0)
          result = json.loads(result_path.read_text(encoding='utf-8'))
          build_id = result.get('build_id')
          token = os.environ.get('CM_API_TOKEN', '').strip()
          if not build_id or not token:
              raise SystemExit(0)

          req = urllib.request.Request(
              f'https://codemagic.io/api/v3/builds/{build_id}/actions',
              headers={'x-auth-token': token, 'Accept': 'application/json'},
              method='GET',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode('utf-8', errors='replace')
              payload = {'http_status': exc.code, 'error': raw[:2000]}

          sensitive = ('secret', 'token', 'password', 'credential', 'private', 'apikey', 'api_key', 'environment', 'variable')
          def clean(value):
              if isinstance(value, dict):
                  out = {}
                  for key, child in value.items():
                      if any(part in str(key).lower() for part in sensitive):
                          out[key] = '[REDACTED]'
                      else:
                          out[key] = clean(child)
                  return out
              if isinstance(value, list):
                  return [clean(item) for item in value]
              return value

          Path('codemagic-actions.json').write_text(
              json.dumps(clean(payload), ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(f'PASS: collected action diagnostics for Codemagic build {build_id}')
          PY

      - name: Persist request-scoped sanitized result
        if: always() && hashFiles('codemagic-result.json') != ''
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          command=json.loads(Path('automation/codemagic-build-command.json').read_text(encoding='utf-8'))
          result=json.loads(Path('codemagic-result.json').read_text(encoding='utf-8'))
          request_id=str(command.get('request_id') or result.get('request_id') or 'unknown')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,120}', request_id):
              raise SystemExit('invalid request_id')
          allowed={
              'request_id': request_id,
              'action': command.get('action'),
              'workflow_id': command.get('workflow_id'),
              'branch': command.get('branch'),
              'build_id': result.get('build_id'),
              'status': result.get('status'),
              'started_at': result.get('started_at'),
              'finished_at': result.get('finished_at'),
              'app_id': result.get('app_id'),
              'error': result.get('error'),
              'apps': result.get('apps') if command.get('action') == 'inspect' else None,
          }
          actions=Path('codemagic-actions.json')
          if actions.exists():
              allowed['actions']=json.loads(actions.read_text(encoding='utf-8'))
          payload=json.dumps(allowed, ensure_ascii=False, indent=2)+'\n'
          out=Path('automation/codemagic-results')/f'{request_id}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(payload, encoding='utf-8')
          Path('/tmp/codemagic-summary.json').write_text(payload, encoding='utf-8')
          Path('/tmp/codemagic-request-id.txt').write_text(request_id, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REQUEST_ID="$(cat /tmp/codemagic-request-id.txt)"
          RESULT_PATH="automation/codemagic-results/${REQUEST_ID}.json"
          git add "$RESULT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Codemagic result for ${REQUEST_ID}"
          if git push; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/codemagic-results
          cp /tmp/codemagic-summary.json "$RESULT_PATH"
          git add "$RESULT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Codemagic result for ${REQUEST_ID}"
          git push origin HEAD:main

      - name: Upload Codemagic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemagic-result-${{ github.run_id }}
          path: |
            codemagic-result.json
            codemagic-actions.json
          if-no-files-found: error
          retention-days: 7
