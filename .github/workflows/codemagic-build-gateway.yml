name: Codemagic Build Gateway

on:
  push:
    branches:
      - main
    paths:
      - automation/codemagic-build-command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gateway dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Prepare requested Codemagic workflow
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          command=json.loads(Path('automation/codemagic-build-command.json').read_text(encoding='utf-8'))
          if command.get('prepare_network_specialist'):
              subprocess.run(['python','scripts/prepare_network_specialist_codemagic.py'],check=True)
          if command.get('prepare_network_specialist_signing_preflight'):
              subprocess.run(['python','scripts/prepare_network_specialist_signing_preflight.py'],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Prepare requested Codemagic workflow"
            git push origin HEAD:main
          fi

      - name: Execute Codemagic command
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          python scripts/codemagic_build_gateway.py \
            --command automation/codemagic-build-command.json \
            --output codemagic-result.json

      - name: Inspect Codemagic build actions
        if: always()
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          result_path = Path('codemagic-result.json')
          if not result_path.exists(): raise SystemExit(0)
          result = json.loads(result_path.read_text(encoding='utf-8'))
          build_id = result.get('build_id')
          token = os.environ.get('CM_API_TOKEN', '').strip()
          if not build_id or not token: raise SystemExit(0)
          req = urllib.request.Request(f'https://codemagic.io/api/v3/builds/{build_id}/actions',headers={'x-auth-token': token, 'Accept': 'application/json'},method='GET')
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              payload = {'http_status': exc.code, 'error': exc.read().decode('utf-8', errors='replace')[:2000]}
          # Also read the legacy build detail endpoint used by Codemagic's UI;
          # it may contain the publishing error that the v3 action summary omits.
          detail_req = urllib.request.Request(f'https://api.codemagic.io/builds/{build_id}',headers={'x-auth-token': token, 'Accept': 'application/json'},method='GET')
          try:
              with urllib.request.urlopen(detail_req, timeout=30) as response:
                  payload['legacy_build_detail'] = json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              payload['legacy_build_detail_error'] = str(exc)[:1000]
          action_rows = payload.get('data', []) if isinstance(payload, dict) else []
          failed_logs = []
          for action in action_rows:
              if not isinstance(action, dict) or str(action.get('status','')).lower() not in ('failed','failure','error'):
                  continue
              action_id = action.get('id') or action.get('_id')
              if not action_id:
                  continue
              log_req = urllib.request.Request(f'https://codemagic.io/builds/{build_id}/step/{action_id}',headers={'x-auth-token': token, 'Accept': 'text/plain,*/*'},method='GET')
              try:
                  with urllib.request.urlopen(log_req, timeout=30) as response:
                      log_text = response.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  log_text = f'LOG_FETCH_ERROR: {str(exc)}'
              for secret_value in (token,):
                  if secret_value:
                      log_text = log_text.replace(secret_value, '[REDACTED]')
              failed_logs.append({'action_id': action_id, 'name': action.get('name'), 'status': action.get('status'), 'log_tail': log_text[-12000:]})
          if failed_logs:
              payload['failed_action_logs'] = failed_logs
          sensitive = ('secret','token','password','credential','private','apikey','api_key','environment','variable')
          def clean(value):
              if isinstance(value,dict): return {k:('[REDACTED]' if any(p in str(k).lower() for p in sensitive) else clean(v)) for k,v in value.items()}
              if isinstance(value,list): return [clean(v) for v in value]
              return value
          Path('codemagic-actions.json').write_text(json.dumps(clean(payload),ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'PASS: collected action diagnostics for Codemagic build {build_id}')
          PY

      - name: Persist request-scoped sanitized result
        if: always() && hashFiles('codemagic-result.json') != ''
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          command=json.loads(Path('automation/codemagic-build-command.json').read_text(encoding='utf-8'))
          result=json.loads(Path('codemagic-result.json').read_text(encoding='utf-8'))
          request_id=str(command.get('request_id') or result.get('request_id') or 'unknown')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,120}',request_id): raise SystemExit('invalid request_id')
          allowed={
              'request_id':request_id,'ok':result.get('ok'),'action':command.get('action'),
              'workflow_id':command.get('workflow_id') or result.get('workflow_id'),
              'branch':command.get('branch') or result.get('branch'),'resolved_app_id':result.get('resolved_app_id'),
              'application_candidates':result.get('application_candidates'),'note':result.get('note'),
              'build_id':result.get('build_id'),'status':result.get('status'),'app_id':result.get('app_id'),
              'error':result.get('error'),'build':result.get('build'),'build_details':result.get('build_details')}
          actions=Path('codemagic-actions.json')
          if actions.exists(): allowed['actions']=json.loads(actions.read_text(encoding='utf-8'))
          payload=json.dumps(allowed,ensure_ascii=False,indent=2)+'\n'
          out=Path('automation/codemagic-results')/f'{request_id}.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(payload,encoding='utf-8')
          Path('/tmp/codemagic-summary.json').write_text(payload,encoding='utf-8'); Path('/tmp/codemagic-request-id.txt').write_text(request_id,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REQUEST_ID="$(cat /tmp/codemagic-request-id.txt)"
          RESULT_PATH="automation/codemagic-results/${REQUEST_ID}.json"
          git add "$RESULT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Codemagic result for ${REQUEST_ID}"
          if git push; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/codemagic-results
          cp /tmp/codemagic-summary.json "$RESULT_PATH"
          git add "$RESULT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Codemagic result for ${REQUEST_ID}"
          git push origin HEAD:main

      - name: Upload Codemagic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemagic-result-${{ github.run_id }}
          path: |
            codemagic-result.json
            codemagic-actions.json
          if-no-files-found: error
          retention-days: 7
