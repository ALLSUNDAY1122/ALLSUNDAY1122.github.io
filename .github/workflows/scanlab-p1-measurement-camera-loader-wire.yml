name: Scan Lab P1 measurement camera loader wiring one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-measurement-camera-loader-wire.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Reuse bounded camera metadata for measurement scale
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/SplatViewerState.swift')
          s = p.read_text()
          structs = '''private struct MeasurementTransforms: Decodable { let frames: [MeasurementFrame] }\nprivate struct MeasurementFrame: Decodable {\n    let transformMatrix: [[Float]]\n    enum CodingKeys: String, CodingKey { case transformMatrix = "transform_matrix" }\n}\n\n'''
          if s.count(structs) != 1: raise SystemExit('measurement structs anchor mismatch')
          s = s.replace(structs, '', 1)
          old = '''    private static func measurementScale(for splatURL: URL) -> Float {\n        let transformsURL = splatURL.deletingLastPathComponent().appendingPathComponent("transforms.json")\n        guard let values = try? transformsURL.resourceValues(forKeys: [.isRegularFileKey, .isSymbolicLinkKey]),\n              values.isRegularFile == true,\n              values.isSymbolicLink != true,\n              let data = try? Data(contentsOf: transformsURL, options: .mappedIfSafe),\n              let dataset = try? JSONDecoder().decode(MeasurementTransforms.self, from: data) else {\n            return 1\n        }\n        let positions = dataset.frames.compactMap { frame -> SIMD3<Float>? in\n            let matrix = frame.transformMatrix\n            guard matrix.count >= 3, matrix[0].count >= 4, matrix[1].count >= 4, matrix[2].count >= 4 else { return nil }\n            let position = SIMD3<Float>(matrix[0][3], matrix[1][3], matrix[2][3])\n            guard position.x.isFinite, position.y.isFinite, position.z.isFinite else { return nil }\n            return position\n        }\n        return SplatSceneNormalization(cameraPositions: positions).metersPerSceneUnit\n    }\n'''
          new = '''    private static func measurementScale(for splatURL: URL) -> Float {\n        let positions = SplatViewerCameraDatasetLoader.cameraPositions(for: splatURL)\n        return SplatSceneNormalization(cameraPositions: positions).metersPerSceneUnit\n    }\n'''
          if s.count(old) != 1: raise SystemExit('measurementScale anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'SplatViewerCameraDatasetLoader.cameraPositions(for: splatURL)' splat-native-ios/SplatNative/SplatViewerState.swift
      - name: Commit wiring and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-measurement-camera-loader-wire.yml
          git add splat-native-ios/SplatNative/SplatViewerState.swift
          git commit -m 'fix(splat): bound measurement camera metadata'
          git push origin HEAD:feature/splat-post-build17-p1
