name: Temporary West A School Meals Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-main-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-a-school-meals-main-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Copy regional truth and regenerate public files
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin region/west
          paths=(
            jichitai-compare/data/municipalities/43/43511.json
            jichitai-compare/data/municipalities/46/46208.json
            jichitai-compare/operations/tasks/43511.json
            jichitai-compare/operations/tasks/46208.json
            jichitai-compare/operations/audits/west-a-school-meals-clean-ci-trigger-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-manual-list-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json
            jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json
          )
          git checkout origin/region/west -- "${paths[@]}"
          cd jichitai-compare
          npm run generate
          npm run progress
          node ./scripts/generate-municipality-pages.mjs
          cd ..
          rm -f jichitai-compare/operations/control/west-a-school-meals-main-sync-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-main-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}" \
                  jichitai-compare/data/generated/municipalities.json \
                  jichitai-compare/data/generated/municipality-pages.json \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/municipality/43511/index.html \
                  jichitai-compare/municipality/46208/index.html \
                  jichitai-compare/sitemap.xml \
                  jichitai-compare/operations/control/west-a-school-meals-main-sync-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-main-sync.yml
          git diff --cached --check
          git commit -m 'sync: 西日本A学校給食費監査を全国公開へ反映'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
