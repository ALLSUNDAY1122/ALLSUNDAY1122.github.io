name: North B sanity audit round 04

on:
  push:
    branches:
      - audit/north-b-sanity-round-04-20260725
    paths:
      - .github/workflows/north-b-sanity-round-04.yml

permissions:
  contents: write

jobs:
  apply-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/north-b-sanity-round-04-20260725
          fetch-depth: 0
      - name: Apply round 04 corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const shibataPath = 'jichitai-compare/data/municipalities/04/04323.json';
          const shibata = read(shibataPath);
          shibata.updatedAt = '2026-07-25';
          shibata.services.temporaryChildcare = {
            status: 'verified',
            summary: '満10か月から就学前までの一時保育に加え、未就園の生後6か月から満3歳未満児が月10時間まで利用できるこども誰でも通園制度を実施する。',
            eligibility: { minAgeMonths: 6, maxAgeYears: 5 },
            details: {
              temporaryTarget: '柴田町内在住で、保育所や幼稚園に在籍していない満10か月から小学校就学前までの児童',
              temporaryTypes: '週2～3日以内の特定保育、緊急時やリフレッシュ等の一時保育',
              temporaryFacilities: '船岡保育所、槻木保育所、西船迫保育所',
              temporaryHours: '月曜日から金曜日の8時30分から15時30分',
              temporaryFee: '児童1人日額1,100円。給食費は3歳未満360円、3歳以上230円',
              anyChildTarget: '保育所、幼稚園、認定こども園等に在籍していない生後6か月から満3歳未満の子ども',
              anyChildFacility: '柴田町立槻木保育所。月曜日から金曜日の9時から12時',
              anyChildLimit: '子ども1人につき月10時間まで',
              anyChildFee: '1時間300円。生活保護世帯は0円、一定所得未満世帯等は1時間100円',
              application: '町への利用認定申請後、総合支援システムで子どもの情報登録、施設面談、利用予約を行う'
            },
            source: {
              url: 'https://www.town.shibata.miyagi.jp/index.cfm/90%2C67881%2C200%2C393%2Chtml',
              checkedAt: '2026-07-25'
            },
            additionalSources: [
              {
                url: 'https://www02.town.shibata.miyagi.jp/index.cfm/90%2C59298%2C200%2C393%2Chtml',
                checkedAt: '2026-07-25'
              }
            ]
          };
          write(shibataPath, shibata);

          const matsushimaPath = 'jichitai-compare/data/municipalities/04/04401.json';
          const matsushima = read(matsushimaPath);
          matsushima.updatedAt = '2026-07-25';
          matsushima.services.temporaryChildcare = {
            status: 'verified',
            summary: '1歳以上の未就学児向け一時預かりに加え、未就園の生後6か月から3歳未満児が月10時間まで利用できるこども誰でも通園制度を実施する。',
            eligibility: { minAgeMonths: 6, maxAgeYears: 6 },
            details: {
              temporaryTarget: '町内在住の1歳以上から就学前までの健康な児童。幼稚園児を含む',
              temporaryReasons: '就労・職業訓練、入院・出産・介護・冠婚葬祭、育児疲れや学校行事等',
              temporaryFacility: '高城保育所。平日8時30分から17時、1日おおむね6人',
              temporaryFee: '一般世帯は半日1,000円、1日2,000円、給食300円。生活保護世帯は保育料0円',
              anyChildTarget: '松島町内在住で、保育所、幼稚園、認定こども園等に通っていない生後6か月から3歳未満の子ども',
              anyChildFacility: '高城保育所。余裕活用型で平日9時から11時',
              anyChildLimit: '子ども1人につき月10時間まで。未利用時間の翌月繰越は不可',
              anyChildFee: '標準1時間300円。生活保護世帯は無料、一定所得未満世帯または要支援家庭は1時間100円',
              application: 'こども誰でも通園制度総合支援システムで認定申請、子どもの情報登録、初回面談、利用予約を行う'
            },
            source: {
              url: 'https://www.town.miyagi-matsushima.lg.jp/page/5229.html',
              checkedAt: '2026-07-25'
            },
            additionalSources: [
              {
                url: 'https://www.town.miyagi-matsushima.lg.jp/page/1104.html',
                checkedAt: '2026-07-25'
              }
            ]
          };
          write(matsushimaPath, matsushima);

          for (const [code, municipality, note] of [
            ['04323', shibata, '北日本B誤調査ざっくり再検証 第4回: 令和8年4月開始のこども誰でも通園制度が未反映だったため、生後6か月から満3歳未満、月10時間、1時間300円等の現行条件をtemporaryChildcareへ追加。'],
            ['04401', matsushima, '北日本B誤調査ざっくり再検証 第4回: 令和8年6月更新のこども誰でも通園制度が未反映だったため、生後6か月から3歳未満、月10時間、高城保育所、1時間300円等の現行条件をtemporaryChildcareへ追加。']
          ]) {
            const taskPath = `jichitai-compare/operations/tasks/${code}.json`;
            const task = read(taskPath);
            task.currentBranch = null;
            task.pullRequestNumber = null;
            task.lastCheckedAt = '2026-07-25';
            task.lastUpdatedAt = '2026-07-25T01:08:00+09:00';
            task.lastUpdatedBy = '北日本調査班B';
            task.officialSources = Object.values(municipality.services).map((s) => s.source?.url).filter(Boolean);
            task.notes.push(note);
            write(taskPath, task);
          }

          const auditPath = 'jichitai-compare/operations/audits/north-b-research-sanity-20260725.json';
          const audit = read(auditPath);
          audit.completedRounds = 4;
          audit.remainingRounds = 6;
          audit.auditedMunicipalityCount = 44;
          audit.remainingMunicipalityCount = 63;
          audit.auditedAt = '2026-07-25T01:08:00+09:00';
          audit.round04 = {
            codes: ['04216','04301','04302','04321','04322','04323','04324','04341','04361','04362','04401'],
            municipalityCount: 11,
            serviceCount: 99,
            highRiskChecks: 26,
            confirmedErrorCount: 2,
            confirmedErrors: [
              {
                code: '04323',
                municipality: '柴田町',
                service: 'temporaryChildcare',
                before: '満10か月以上の一時保育のみを掲載、minAgeMonths 10',
                after: 'こども誰でも通園制度を併記、minAgeMonths 6',
                reason: '2026年4月開始の町公式制度は未就園の生後6か月から満3歳未満を月10時間まで対象としている'
              },
              {
                code: '04401',
                municipality: '松島町',
                service: 'temporaryChildcare',
                before: '1歳以上の一時預かりのみを掲載、minAgeMonths 12',
                after: 'こども誰でも通園制度を併記、minAgeMonths 6',
                reason: '2026年6月更新の町公式制度は未就園の生後6か月から3歳未満を月10時間まで対象としている'
              }
            ],
            evidenceLimitations: [
              {
                code: '04301',
                municipality: '蔵王町',
                service: 'temporaryChildcare',
                note: '2026年4月1日のこども誰でも通園制度開始告知は確認したが、対象・料金・実施施設等の利用者向け直接本文を取得できず、推測によるデータ変更は行わなかった'
              }
            ],
            noConfirmedErrorCodes: ['04216','04301','04302','04321','04322','04324','04341','04361','04362']
          };
          write(auditPath, audit);

          const checkpointPath = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = '2026-07-25T01:08:00+09:00';
          checkpoint.workingBranch = 'audit/north-b-sanity-round-04-20260725';
          checkpoint.pullRequestNumber = null;
          checkpoint.ciStatus = 'pending';
          checkpoint.nextAction = '北日本B担当107自治体の誤調査ざっくり再検証を10回に分けて実施中。第4回は富谷市、蔵王町、七ヶ宿町、大河原町、村田町、柴田町、川崎町、丸森町、亘理町、山元町、松島町の11自治体・99制度を構造確認し、高リスク26項目を公式情報で重点照合。柴田町・松島町で2026年度のこども誰でも通園制度の反映漏れを確認し、temporaryChildcareへ追加。監査完了4/10回、44/107自治体、残り6回・63自治体。';
          write(checkpointPath, checkpoint);

          fs.unlinkSync('.github/workflows/north-b-sanity-round-04.yml');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "audit: 北日本B誤調査再検証 第4回を反映"
          git push origin HEAD:audit/north-b-sanity-round-04-20260725