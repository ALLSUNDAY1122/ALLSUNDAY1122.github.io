name: Scanner Parity Apple Validation

on:
  push:
    branches:
      - scanner-parity/integration
    paths:
      - 'scanner-parity/**'
      - '.github/workflows/scanner-parity-apple-validation.yml'
  pull_request:
    branches:
      - scanner-parity/integration
    paths:
      - 'scanner-parity/**'
      - '.github/workflows/scanner-parity-apple-validation.yml'

permissions:
  contents: read

jobs:
  apple-sdk-compile:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate harness contract
        run: python3 scanner-parity/Tests/AppleValidation/harness_contract_test.py

      - name: Validate HQ Golden runner contract
        run: python3 scanner-parity/Tests/HQGoldenRunner/runner_contract_test.py

      - name: Validate HQ Golden failure launcher contract
        run: python3 scanner-parity/Tests/HQGoldenRunner/failure_launcher_contract_test.py

      - name: Build HQ Formal Golden runner on macOS
        run: swift build --package-path scanner-parity --product scanner-hq-golden-runner

      - name: Build HQ Formal Golden finalizer on macOS
        run: swift build --package-path scanner-parity --product scanner-hq-golden-finalizer

      - name: Build HQ Formal Golden failure recorder on macOS
        run: swift build --package-path scanner-parity --product scanner-hq-golden-failure-recorder

      - name: Test HQ Golden reference metrics
        run: swift test --package-path scanner-parity --filter ReferenceAlignmentTests

      - name: Test HQ Golden machine gate semantics
        run: swift test --package-path scanner-parity --filter FormalGoldenMachineGateTests

      - name: Test HQ Golden visual/OCR review bundle
        run: swift test --package-path scanner-parity --filter GoldenReviewBundleBuilderTests

      - name: Test HQ Formal Golden review finalizer
        run: swift test --package-path scanner-parity --filter FormalGoldenReviewFinalizerTests

      - name: Test HQ Golden failure evidence
        run: |
          set -euo pipefail
          swift test --package-path scanner-parity --filter GoldenExecutionFailureSanitizerTests
          TMP="$(mktemp -d)"
          VIDEO="$TMP/raw/RPReplay_Final1787451151.mp4"
          PDF="$TMP/raw/本 2026-08-23 0842.pdf"
          WORKSPACE="$TMP/workspace"
          STDERR_LOG="$TMP/raw-runner-stderr.log"
          mkdir -p "$TMP/raw" "$WORKSPACE/01-frame-extraction" "$WORKSPACE/05-book-package/demo"
          printf 'synthetic-video-bytes' > "$VIDEO"
          printf 'synthetic-pdf-bytes' > "$PDF"
          printf '{}' > "$WORKSPACE/01-frame-extraction/candidates.json"
          printf '{}' > "$WORKSPACE/05-book-package/demo/integrity-report.json"
          printf 'pipeline failure reading %s with reference %s in workspace %s\n' "$VIDEO" "$PDF" "$WORKSPACE" > "$STDERR_LOG"
          VIDEO_SHA="$(shasum -a 256 "$VIDEO" | awk '{print $1}')"
          PDF_SHA="$(shasum -a 256 "$PDF" | awk '{print $1}')"
          swift run --package-path scanner-parity scanner-hq-golden-failure-recorder \
            --video "$VIDEO" \
            --pdf "$PDF" \
            --workspace "$WORKSPACE" \
            --book-id golden-v2-current-project-20260823 \
            --expected-video-sha "$VIDEO_SHA" \
            --expected-pdf-sha "$PDF_SHA" \
            --stderr-log "$STDERR_LOG" \
            --runner-exit-code 17
          python3 scanner-parity/Tests/HQGoldenRunner/failure_report_fixture_test.py \
            "$WORKSPACE/hq-golden-execution-failure.json" "$TMP"

      - name: Test searchable PDF generation on macOS
        run: swift test --package-path scanner-parity --filter SearchablePDFWriterTests

      - name: Compile Apple adapters with iPhoneOS SDK
        run: bash scanner-parity/AppleValidation/run-apple-sdk-compile.sh "$RUNNER_TEMP/scanner-parity-apple-validation"

      - name: Compile final product modules and run release gates
        run: bash scanner-parity/Tests/AppShell/run-apple-product-compile.sh "$RUNNER_TEMP/scanner-parity-product-apple"

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Validate application privacy manifest
        run: plutil -lint scanner-parity/iOSApp/PrivacyInfo.xcprivacy

      - name: Generate real iOS application project
        working-directory: scanner-parity/iOSApp
        run: xcodegen generate

      - name: Build unsigned Release app for iPhoneOS
        run: |
          set -o pipefail
          xcodebuild \
            -project scanner-parity/iOSApp/ScannerParity.xcodeproj \
            -scheme ScannerParity \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SCANNER_PARITY_BUNDLE_ID=com.invalid.scannerparity.ci \
            SCANNER_PARITY_MARKETING_VERSION=0.0.0 \
            SCANNER_PARITY_BUILD_NUMBER=1 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/scanner-parity-app-xcodebuild.log"

      - name: Verify generated application bundle
        run: |
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'ScannerParity.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "Built app: $APP_PATH"
          test -f "$APP_PATH/ScannerParity"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_PATH/Info.plist" | grep -qi false
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -qx 'com.invalid.scannerparity.ci'
          echo 'IOS_APPLICATION_BUNDLE_PASS'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-parity-apple-validation
          path: |
            ${{ runner.temp }}/scanner-parity-apple-validation/report.json
            ${{ runner.temp }}/scanner-parity-apple-validation/compile.log
            ${{ runner.temp }}/scanner-parity-product-apple/report.json
            ${{ runner.temp }}/scanner-parity-product-apple/compile.log
            ${{ runner.temp }}/scanner-parity-app-xcodebuild.log
          if-no-files-found: warn
