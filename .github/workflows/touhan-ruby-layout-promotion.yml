name: Registered Seller Ruby and Special Layout Promotion
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/reconstruct_ruby.py'
      - 'touroku-hanbaisha-sprint/official-kansai/layout_exception_triage.py'
      - 'touroku-hanbaisha-sprint/official-kansai/run_ruby_pipeline.py'
      - 'touroku-hanbaisha-sprint/official-kansai/write_ruby_release_status.py'
      - 'touroku-hanbaisha-sprint/official-kansai/build_approved_bank.py'
      - 'touroku-hanbaisha-sprint/official-kansai/test_ruby_dom.py'
      - 'touroku-hanbaisha-sprint/official-practice.html'
      - '.github/workflows/touhan-ruby-layout-promotion.yml'
permissions:
  contents: write
concurrency:
  group: touhan-ruby-layout-promotion
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF and browser engines
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.5' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run 600 question Ruby/other-layout classification
        run: python touroku-hanbaisha-sprint/official-kansai/run_ruby_pipeline.py
      - name: Rebuild the strict official release bank
        run: |
          python touroku-hanbaisha-sprint/official-kansai/build_approved_bank.py
          python touroku-hanbaisha-sprint/official-kansai/write_auto_release_status.py
          python touroku-hanbaisha-sprint/official-kansai/write_geometry_release_status.py
          python touroku-hanbaisha-sprint/official-kansai/write_ruby_release_status.py
      - name: Check JavaScript syntax and ruby DOM on small and large smartphones
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('touroku-hanbaisha-sprint/official-practice.html').read_text()
          script=re.search(r'<script>([\s\S]*?)</script>',html)
          assert script
          Path('/tmp/touhan-ruby-ui.js').write_text(script.group(1))
          PY
          node --check /tmp/touhan-ruby-ui.js
          python -m http.server 8765 --directory touroku-hanbaisha-sprint >/tmp/touhan-ruby-server.log 2>&1 &
          sleep 2
          python touroku-hanbaisha-sprint/official-kansai/test_ruby_dom.py
      - name: Final safety verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          status=json.loads(Path('touroku-hanbaisha-ios/release-status.json').read_text())
          ids=set(bank['approvedIds'])
          assert len(ids)==bank['count']==len(bank['questions'])
          assert 'KSAI-2023-090' not in ids
          assert bank['count']==status['question_bank']['production_official_bank_count']
          assert status['release_gate']=='BLOCKED'
          assert status['app_review_submitted'] is False
          for year in range(2022,2027):
            ruby=json.loads((b/f'RUBY_RECON_{year}.json').read_text())
            layout=json.loads((b/f'LAYOUT_TRIAGE_{year}.json').read_text())
            assert ruby['total']==layout['total']==120
            assert len(ruby['records'])==len(layout['records'])==120
          for q in bank['questions']:
            if q['audit']['method']=='AUTO_PDF_GLYPH_XY_RUBY_DOM_RECONSTRUCTION':
              assert 'questionParts' in q and 'choicesParts' in q
              assert any(p.get('rubyBase') for parts in [q['questionParts'],*q['choicesParts']] for p in parts)
          print('PASS: 600 per-question decisions / no invalid Q90 / no auto App Review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-ruby-mobile-screenshots
          path: /tmp/touhan-ruby-*.png
          if-no-files-found: ignore
      - name: Commit actual outcomes or failure diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          b=touroku-hanbaisha-sprint/official-kansai
          git add -f "$b/RUBY_PIPELINE_DIAGNOSTICS.json" 2>/dev/null || true
          git add -f "$b/RUBY_DOM_QA_RESULT.json" 2>/dev/null || true
          for y in 2022 2023 2024 2025 2026; do
            git add -f "$b/RUBY_RECON_${y}.json" 2>/dev/null || true
            git add -f "$b/LAYOUT_TRIAGE_${y}.json" 2>/dev/null || true
          done
          git add "$b/APPROVED_OFFICIAL_BANK.json" 2>/dev/null || true
          git add touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit(touhan): verify and promote ruby alignment and special layouts with QA evidence'
            for retry in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$retry" -eq 3 ]; then exit 1; fi
            done
          fi
