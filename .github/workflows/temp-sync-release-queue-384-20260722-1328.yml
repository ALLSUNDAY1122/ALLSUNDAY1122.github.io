name: Temporary Sync Release Queue 384 20260722 1328

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-384-20260722-1328.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild queue and self-delete
        run: |
          set -euxo pipefail
          git pull --ff-only origin main
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          qpath=Path('jichitai-compare/operations/control/release-queue.json')
          q=json.loads(qpath.read_text(encoding='utf-8'))
          by={e['region']:e for e in q['entries']}
          field={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def assigned(r,p):
              n=int(p)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          for r in ('north','east','central','west'):
              ref=f'origin/region/{r}'
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              items=[]
              for path in names:
                  if not re.search(r'/\d{5}\.json$',path): continue
                  d=json.loads(show(ref,path))
                  if assigned(r,d['prefectureCode']): items.append({'code':d['code'],'name':d['name']})
              items.sort(key=lambda x:x['code'])
              s=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json'))
              pending=int(s.get(field[r],0)); e=by[r]
              e.update({'municipalities':items,'count':len(items),'pendingSinceLastRelease':pending,'releaseStatus':'release_ready' if pending>=10 else 'pending_threshold','reason':f'担当地方ブランチとmainを直接比較。公開後の未全国統合は{pending}自治体','mainIntegrationPr':s.get('lastNationalIntegrationPr'),'generatedPullRequest':640,'auditStatus':'passed'})
          total=sum(e['count'] for e in q['entries'])
          pending={e['region']:e['pendingSinceLastRelease'] for e in q['entries']}
          q['updatedAt']='2026-07-22T13:28:00+09:00'
          q['status']='active'
          q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':384,'latestGeneratedPullRequest':640,'latestPublicCountPullRequest':640,'releaseReadyRegions':[e['region'] for e in q['entries'] if e['pendingSinceLastRelease']>=10],'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。10自治体到達地域を全国統合する。"}
          qpath.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(total,pending)
          PY
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-sync-release-queue-384-20260722-1328.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          total=$(python3 -c "import json;print(json.load(open('jichitai-compare/operations/control/release-queue.json'))['summary']['regionalMergedMunicipalities'])")
          git commit -m "統括管理: 地方統合${total}自治体・公開384自治体へ同期"
          git push origin main
