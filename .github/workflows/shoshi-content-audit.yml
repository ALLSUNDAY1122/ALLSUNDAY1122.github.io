name: Shoshi official 210 content audit

on:
  push:
    branches:
      - feature/shoshi-content-loop
      - feature/shoshi-mvp-loop3
    paths:
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v3.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v4.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v5.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v6.py'
      - '.github/workflows/shoshi-content-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v3.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v4.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v5.py'
      - 'learning-sprint/shoshi/content-loop/official_pdf_loop_v6.py'
      - '.github/workflows/shoshi-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf pymupdf
      - name: Import, clean and audit 210 questions from MOJ official PDFs
        id: import
        shell: bash
        run: |
          set +e
          cd learning-sprint/shoshi/content-loop
          python official_pdf_loop_v6.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run common learning-sprint validator
        id: common
        shell: bash
        run: |
          set +e
          python automation/learning-sprint-question-pipeline/validate_questions.py learning-sprint/shoshi/content-loop/learning-sprint-audit.json | tee learning-sprint/shoshi/content-loop/common-validator.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist audit artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in \
            learning-sprint/shoshi/content-loop/questions.generated.json \
            learning-sprint/shoshi/content-loop/content-audit-report.json \
            learning-sprint/shoshi/content-loop/learning-sprint-audit.json \
            learning-sprint/shoshi/content-loop/official-pdf-probe.json \
            learning-sprint/shoshi/content-loop/common-validator.log \
            learning-sprint/shoshi/content-loop/official-media; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "司法書士210問の問題境界監査結果を更新"
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}" || true
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}" || true
          fi
      - name: Enforce PASS
        shell: bash
        run: |
          test "${{ steps.import.outputs.exit_code }}" = "0"
          test "${{ steps.common.outputs.exit_code }}" = "0"
