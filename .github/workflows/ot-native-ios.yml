name: OT Native iOS

on:
  pull_request:
    paths:
      - 'sagyo-ryohoshi-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/ot-native-ios.yml'
  workflow_dispatch:

jobs:
  native-gate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build 600-question native payload
        run: python3 sagyo-ryohoshi-sprint/ios/tools/build_native_payload.py
      - name: Audit generated payload
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          p='sagyo-ryohoshi-sprint/ios/GeneratedResources/questions.generated.json'
          q=json.load(open(p, encoding='utf-8'))
          assert len(q)==600
          assert len({x['id'] for x in q})==600
          assert Counter(x['premium'] for x in q)=={False:200, True:400}
          assert all(x['prompt'].strip() and x['explanation'].strip() for x in q)
          assert all(x['choices'] for x in q)
          assert all(x['answerType'] in ('singleChoice','multiChoice') for x in q)
          print('OT_NATIVE_PAYLOAD_AUDIT_PASS total=600 free=200 premium=400')
          PY
      - name: Validate privacy manifest
        run: |
          plutil -lint sagyo-ryohoshi-sprint/ios/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyTracking' sagyo-ryohoshi-sprint/ios/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' sagyo-ryohoshi-sprint/ios/PrivacyInfo.xcprivacy
          grep -q 'CA92.1' sagyo-ryohoshi-sprint/ios/PrivacyInfo.xcprivacy
      - name: Materialize canonical AppIcon
        run: python3 sagyo-ryohoshi-sprint/ios/tools/materialize_appicon.py
      - name: Verify canonical AppIcon
        run: |
          test -f sagyo-ryohoshi-sprint/ios/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test "$(shasum -a 256 sagyo-ryohoshi-sprint/ios/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '{print $1}')" = "0da95e08cbc366cc17ced44aaf28d46a08cd4219d328be389e31666d32d7c45c"
          grep -q 'AppIcon-1024.png' sagyo-ryohoshi-sprint/ios/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: sagyo-ryohoshi-sprint/ios
        run: xcodegen generate
      - name: Verify privacy manifest is bundled
        working-directory: sagyo-ryohoshi-sprint/ios
        run: grep -q 'PrivacyInfo.xcprivacy' SagyoRyohoshiSprint.xcodeproj/project.pbxproj
      - name: Verify AppIcon asset catalog is bundled
        working-directory: sagyo-ryohoshi-sprint/ios
        run: |
          grep -q 'Assets.xcassets' SagyoRyohoshiSprint.xcodeproj/project.pbxproj
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon' SagyoRyohoshiSprint.xcodeproj/project.pbxproj
      - name: Compile iOS 16+ release candidate scaffold
        working-directory: sagyo-ryohoshi-sprint/ios
        run: |
          xcodebuild \
            -project SagyoRyohoshiSprint.xcodeproj \
            -scheme SagyoRyohoshiSprint \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
