name: Temporary release queue sync 246

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-release-queue-246.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update release queue
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = {entry['region']: entry for entry in data['entries']}

          west = entries['west']
          if not any(item['code'] == '33100' for item in west['municipalities']):
              west['municipalities'].append({'code': '33100', 'name': '岡山市'})
          west['municipalities'].sort(key=lambda item: item['code'])
          west['count'] = len(west['municipalities'])
          west['pendingSinceLastRelease'] = 4
          west['releaseStatus'] = 'pending_threshold'
          west['reason'] = '浜田市から美郷町までの追加10自治体をPR #324でmainへ全国統合し、生成・公開をPR #325で134自治体へ更新。その後、邑南町・津和野町・吉賀町・岡山市を地方統合'
          west['mainIntegrationPr'] = 324
          west['generatedPullRequest'] = 325

          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).replace(second=0, microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities'] = 0
          data['summary']['releaseReadyRegions'] = [entry['region'] for entry in data['entries'] if entry.get('pendingSinceLastRelease', 0) >= 10]
          data['summary']['auditBlockedRegions'] = []
          data['summary']['latestGeneratedMunicipalityCount'] = 234
          data['summary']['latestGeneratedPullRequest'] = 439
          data['summary']['latestPublicCountPullRequest'] = 439
          data['nextAction'] = '東日本・西日本が前回全国統合後4自治体で先行。中日本3、北日本2。各地域をコード昇順で継続し、10自治体到達時に全国統合する。'
          data['humanDecisionRequired'] = False

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-sync-release-queue-246.yml
          git commit -m "統括管理: 地方統合246自治体・公開234自治体へ同期"
          git push origin HEAD:main
