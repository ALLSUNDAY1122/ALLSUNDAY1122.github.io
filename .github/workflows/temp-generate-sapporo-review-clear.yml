name: Temporary Generate Sapporo Review Clear Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-sapporo-review-clear.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/sapporo-review-clear-20260722-1558
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate public data and progress
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          node ./scripts/validate-data.mjs --require-generated
          cd ..
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json
          git commit -m '生成更新: 札幌市レビュー解消を公開進捗へ同期'
          git push origin coord/sapporo-review-clear-20260722-1558
      - name: Remove temporary workflow
        if: always()
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-generate-sapporo-review-clear.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 札幌市生成一時ワークフローを削除'
          git push origin main
