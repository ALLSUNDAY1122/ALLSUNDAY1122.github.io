name: Temporary Central A Weak Source Batch 4 Main Sync

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch4-main-trigger-20260726.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/central-a-weak-source-batch4-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import regional batch and regenerate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(
            jichitai-compare/data/municipalities/25/25207.json
            jichitai-compare/data/municipalities/25/25210.json
            jichitai-compare/data/municipalities/25/25425.json
            jichitai-compare/data/municipalities/25/25442.json
            jichitai-compare/operations/tasks/25207.json
            jichitai-compare/operations/tasks/25210.json
            jichitai-compare/operations/tasks/25425.json
            jichitai-compare/operations/tasks/25442.json
            jichitai-compare/operations/audits/central-a-weak-primary-source-recovery-20260726.json
            jichitai-compare/operations/audits/central-a-weak-primary-source-batch4-decisions-20260726.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
            jichitai-compare/operations/control/regions/central.json
          )
          git checkout origin/region/central -- "${files[@]}"
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch4-main-trigger-20260726.json
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'sync: 中日本A弱い主出典第4群を全国反映'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
