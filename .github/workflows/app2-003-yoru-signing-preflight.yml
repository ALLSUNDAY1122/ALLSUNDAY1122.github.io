name: APP2-003 夜の書架 Signing Preflight

on:
  push:
    branches:
      - automation/app-development-2-session-dispatcher
    paths:
      - automation/chatgpt-dispatcher/app-development-2/runtime/APP2-003-signing-preflight-command.json

permissions:
  contents: write

jobs:
  inspect-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect Apple signing inventory
        id: inspect
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_003_signing_preflight.py
      - name: Persist sanitized signing evidence
        if: always()
        run: |
          if [ -f app2-003-signing-preflight-result.json ]; then
            mkdir -p automation/chatgpt-dispatcher/app-development-2/evidence
            cp app2-003-signing-preflight-result.json automation/chatgpt-dispatcher/app-development-2/evidence/APP2-003-signing-preflight.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/chatgpt-dispatcher/app-development-2/evidence/APP2-003-signing-preflight.json
            git commit -m "Persist APP2-003 signing preflight evidence" || exit 0
            git pull --rebase origin automation/app-development-2-session-dispatcher
            git push origin HEAD:automation/app-development-2-session-dispatcher
          fi
      - name: Enforce preflight success
        if: steps.inspect.outcome == 'failure'
        run: exit 1
