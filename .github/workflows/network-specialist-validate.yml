name: Network Specialist Validate

on:
  push:
    branches: [main]
    paths:
      - 'network-specialist-sprint/**'
      - '.github/workflows/network-specialist-validate.yml'
  pull_request:
    paths:
      - 'network-specialist-sprint/**'
      - '.github/workflows/network-specialist-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-specialist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native question payload
        run: python3 network-specialist-sprint/scripts/build_native_questions.py

      - name: Materialize exact canonical AppIcon
        run: python3 network-specialist-sprint/scripts/materialize_appicon.py

      - name: Legacy content and rights validation
        run: python3 network-specialist-sprint/scripts/validate_release.py

      - name: Native static validation with canonical icon
        run: python3 network-specialist-sprint/scripts/validate_native_release.py --require-icon

      - name: JavaScript syntax validation
        run: |
          node --check network-specialist-sprint/app-v21.js
          node --check network-specialist-sprint/questions-meta.js
          node --check network-specialist-sprint/questions-2025-a.js
          node --check network-specialist-sprint/questions-2025-b.js
          node --check network-specialist-sprint/questions-2024-a.js
          node --check network-specialist-sprint/questions-2024-b.js
          node --check network-specialist-sprint/questions-2023-a.js
          node --check network-specialist-sprint/questions-2023-b.js
          node --check network-specialist-sprint/questions-difficulty-overrides.js
          node --check network-specialist-sprint/questions-ui-fixes.js
          node --check network-specialist-sprint/sw.js

      - name: Verify question counts and exam difficulty floor
        run: |
          node <<'NODE'
          global.window = {};
          const fs = require('fs');
          const vm = require('vm');
          for (const f of [
            'questions-meta.js','questions-2025-a.js','questions-2025-b.js',
            'questions-2024-a.js','questions-2024-b.js','questions-2023-a.js','questions-2023-b.js',
            'questions-difficulty-overrides.js','questions-ui-fixes.js'
          ]) vm.runInThisContext(fs.readFileSync('network-specialist-sprint/' + f, 'utf8'), {filename:f});
          const occ = window.NW_EXAM_OCCURRENCES || [];
          const uniq = window.NW_UNIQUE_IDS || [];
          const perYear = [2025,2024,2023].map(y => occ.filter(q => q.examYear === y).length);
          const examLevel = occ.filter(q => q.difficultyLevel === 'NW_A2_EXAM').length;
          if (occ.length !== 75) throw new Error(`exam occurrences=${occ.length}, expected 75`);
          if (uniq.length !== 68) throw new Error(`unique ids=${uniq.length}, expected 68`);
          if (perYear.some(n => n !== 25)) throw new Error(`per-year counts=${perYear.join(',')}, expected 25 each`);
          if (examLevel < 40) throw new Error(`exam-level audited=${examLevel}, expected >=40`);
          const ids = new Set(occ.map(q => q.id));
          for (const id of uniq) if (!ids.has(id)) throw new Error(`unique id missing from occurrences: ${id}`);
          console.log('PASS', {occurrences:occ.length, unique:uniq.length, perYear, examLevel});
          NODE

      - name: Native source policy
        run: |
          ! grep -R --line-number -E 'WKWebView|import WebKit' network-specialist-sprint/ios/NetworkSpecialist/*.swift
          grep -R --line-number 'わからない' network-specialist-sprint/ios/NetworkSpecialist/*.swift
          grep -R --line-number '3連続正解で解除' network-specialist-sprint/ios/NetworkSpecialist/*.swift
          grep -R --line-number 'JSONバックアップ' network-specialist-sprint/ios/NetworkSpecialist/*.swift
          python3 -m py_compile \
            network-specialist-sprint/scripts/build_native_questions.py \
            network-specialist-sprint/scripts/materialize_appicon.py \
            network-specialist-sprint/scripts/validate_native_release.py
          bash -n network-specialist-sprint/scripts/run_native_ui_tests.sh

  native-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build native question payload
        run: python3 network-specialist-sprint/scripts/build_native_questions.py

      - name: Materialize exact canonical AppIcon
        run: python3 network-specialist-sprint/scripts/materialize_appicon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd network-specialist-sprint/ios
          xcodegen generate

      - name: SwiftUI unit and UI tests on two iPhone sizes
        timeout-minutes: 30
        run: |
          cd network-specialist-sprint
          bash scripts/run_native_ui_tests.sh

      - name: Unsigned device Release build
        timeout-minutes: 10
        run: |
          cd network-specialist-sprint
          xcodebuild build \
            -project ios/NetworkSpecialist.xcodeproj \
            -scheme NetworkSpecialist \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
