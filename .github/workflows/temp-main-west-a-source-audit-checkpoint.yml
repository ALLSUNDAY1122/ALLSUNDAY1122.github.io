name: Temporary West-A Checkpoint Main Sync

on:
  pull_request:
    paths:
      - '.github/workflows/temp-main-west-a-source-audit-checkpoint.yml'
      - 'jichitai-compare/operations/control/session-checkpoints/west-a.json'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ops/main-west-a-source-audit-checkpoint-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Copy checkpoint from region/west
        shell: bash
        run: |
          git fetch origin region/west
          git show origin/region/west:jichitai-compare/operations/control/session-checkpoints/west-a.json > jichitai-compare/operations/control/session-checkpoints/west-a.json

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-main-west-a-source-audit-checkpoint.yml
          git add jichitai-compare/operations/control/session-checkpoints/west-a.json
          git commit -m 'ops: 西日本A公式出典監査証跡をmainへ同期'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate synchronized checkpoint
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check scripts/smoke-public-site.mjs
