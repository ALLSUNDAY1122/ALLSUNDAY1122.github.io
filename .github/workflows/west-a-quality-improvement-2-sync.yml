name: West A Quality Improvement 2 Sync

on:
  push:
    branches:
      - sync/west-a-quality-improvement-2-20260725
    paths:
      - 'jichitai-compare/**'
      - '.github/workflows/west-a-quality-improvement-2-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: west-a-quality-improvement-2-sync
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/west-a-quality-improvement-2-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
          node --check scripts/generate-municipality-pages.mjs
          node --check scripts/validate-municipality-pages.mjs
          node --check scripts/smoke-public-site.mjs
      - name: Commit generated files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/west-a-quality-improvement-2-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'sync: 西日本A第2監査を全国生成物へ反映'
            git push origin HEAD:sync/west-a-quality-improvement-2-20260725
          fi
