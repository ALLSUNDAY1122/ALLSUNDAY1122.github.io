name: Temporary Central A Housing Batch 8

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch8-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch8-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply housing classification batch 8
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T15:42:00+09:00';
          const serviceKeys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];

          const corrections = [
            {
              code: '17204', pref: '17', name: '輪島市', kind: 'replace_with_child_specific_program',
              service: {
                status: 'verified',
                summary: '小学校就学前の子どもがいる世帯は、2026年度市営住宅の所得基準を月214,000円以下まで緩和する。',
                details: {
                  program: '令和8年度市営住宅入居者・入居補欠者募集',
                  target: '小学校就学前の子どもがいる世帯で、市営住宅の一般的な申込資格を満たす世帯',
                  support: '一般世帯の所得基準月158,000円以下に対し、就学前児童がいる世帯は月214,000円以下まで緩和',
                  housing: '公営住宅（標準）等。住宅困窮、親族同居、市税滞納なし等の要件あり',
                  period: '2026年度。定期募集後は2026年12月31日まで随時募集',
                  excludedGeneralPrograms: '空き家購入・改修、新築・定住促進住宅等の一般移住制度は子育て世帯向け制度として扱わない'
                },
                source: { url: 'https://www.city.wajima.ishikawa.jp/article/2026013000019/', checkedAt }
              }
            },
            {
              code: '17211', pref: '17', name: '能美市', kind: 'general_housing_misclassification',
              service: {
                status: 'unavailable',
                summary: '子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details: {
                  reason: '確認できた定住促進補助金は、住宅を取得する45歳未満の申請者を対象とする一般の定住制度であり、子育て世帯を対象要件としない。',
                  excludedProgram: '令和8年度定住促進補助金',
                  excludedTarget: '市内で新たに住宅を取得する45歳未満の申請者',
                  evidence: '2026年7月1日更新の利用者向けページ本文で対象要件を確認。補助額画像・Q&Aだけから子育て固有要件を推測しない。'
                },
                source: { url: 'https://www.city.nomi.ishikawa.jp/docs/5597.html', checkedAt }
              }
            },
            {
              code: '17361', pref: '17', name: '津幡町', kind: 'replace_with_child_specific_program',
              service: {
                status: 'verified',
                summary: '18歳未満の子がいる三世代世帯の同居・近居に伴う住宅取得・改修へ、10万円または15万円を補助する。',
                details: {
                  program: '三世代ファミリー同居等促進事業補助金',
                  target: '親子と子の祖父母による三世代世帯。子は妊娠中を含み、同居等開始年度の4月1日時点で18歳未満',
                  housing: '三世代同居・準同居のための住宅新築、購入、増改築、改修。契約費用100万円以上等の要件あり',
                  amount: '10万円または15万円',
                  nearResidence: '準同居は親子世帯と祖父母世帯の住宅が直線50メートル以内',
                  deadline: '2026年中に同居等を開始した場合、2027年1月15日まで',
                  excludedGeneralProgram: '定住促進住宅取得等奨励金は一般の定住制度のため、本比較項目の主制度にしない'
                },
                source: { url: 'https://www.town.tsubata.lg.jp/site/welcome/1217.html', checkedAt }
              }
            },
            {
              code: '21604', pref: '21', name: '白川村', kind: 'general_housing_misclassification',
              service: {
                status: 'unavailable',
                summary: '子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details: {
                  reason: '確認できた親雪補助金、空き家再生活用補助、民間賃貸住宅居住助成は、定住者・移住者一般を対象とし、子育て世帯を対象要件としない。',
                  excludedPrograms: '白川村定住対策親雪補助金、白川村空き家再生活用事業補助金、白川村民間賃貸住宅居住助成金',
                  excludedRentalTarget: '村外から移住後2年以内等の民間賃貸住宅入居者',
                  evidence: '利用者向け公式ページの対象者・助成額を確認し、一般定住制度として比較対象外に整理'
                },
                source: { url: 'https://www.vill.shirakawa.lg.jp/1270.htm', checkedAt },
                additionalSources: [
                  { url: 'https://www.vill.shirakawa.lg.jp/2767.htm', checkedAt, description: '一般の定住者向け親雪補助金' },
                  { url: 'https://www.vill.shirakawa.lg.jp/1259.htm', checkedAt, description: '一般の移住者向け空き家再生活用補助金' }
                ]
              }
            },
            {
              code: '22208', pref: '22', name: '伊東市', kind: 'replace_with_newlywed_specific_program',
              service: {
                status: 'verified',
                summary: '39歳以下の新婚世帯へ、2026年度の住宅購入・改修・賃借・引越費用を上限30万円または60万円補助する。',
                details: {
                  program: '令和8年度伊東市結婚新生活支援補助金',
                  target: '2026年1月1日から2027年3月31日までに婚姻し、夫婦とも39歳以下、合算所得500万円未満等の要件を満たす世帯',
                  covered: '住宅購入費、住宅リフォーム費、住宅賃料・敷金・礼金・共益費・仲介手数料、引越費用',
                  amount: '夫婦とも29歳以下は上限60万円、夫婦とも39歳以下は上限30万円',
                  period: '2026年4月1日から2027年3月31日までに要し、支払った対象経費',
                  additionalCondition: '市指定の結婚・妊娠・出産・子育てに関する講座の受講等が必要',
                  excludedGeneralProgram: '45歳未満移住者向け住宅ローン利子補給は一般移住制度のため、本比較項目の主制度にしない'
                },
                source: { url: 'https://www.city.ito.shizuoka.jp/gyosei/soshikikarasagasu/kosodateshienka/kurashi_tetsuzuki/1/2/10657.html', checkedAt }
              }
            }
          ];

          for (const item of corrections) {
            const municipalityPath = path.join(root, 'data/municipalities', item.pref, `${item.code}.json`);
            const taskPath = path.join(root, 'operations/tasks', `${item.code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            municipality.updatedAt = checkedAt;
            municipality.services.housingSupport = item.service;

            const statuses = Object.values(municipality.services).map((service) => service.status);
            task.verifiedCount = statuses.filter((status) => status === 'verified').length;
            task.researchingCount = statuses.filter((status) => status === 'researching').length;
            task.unavailableCount = statuses.filter((status) => status === 'unavailable').length;
            task.needsMediumReviewCount = statuses.filter((status) => status === 'needs_medium_review').length;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '中日本調査班A';
            task.officialSources = [...new Set(serviceKeys.map((key) => municipality.services[key].source.url))];
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            const note = item.service.status === 'unavailable'
              ? '2026年7月25日の原因別重点再監査で、housingSupportに登録されていた制度は子育て世帯を対象要件としない一般制度と確認し、verifiedからunavailableへ修正した。'
              : '2026年7月25日の原因別重点再監査で、一般住宅制度を主制度とする登録を解消し、現行の子育て・三世代・新婚世帯向け住宅支援へ差し替えた。';
            if (!task.notes.includes(note)) task.notes.push(note);

            fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          }

          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'central-a-housing-classification-batch8-decisions-20260725',
            decidedAt: updatedAt,
            session: '中日本調査班A',
            category: 'generalHousingMisclassification',
            reviewedMunicipalityCount: 5,
            confirmedCorrectionCount: 5,
            statusToUnavailableCount: 2,
            childSpecificReplacementCount: 3,
            corrected: corrections.map((item) => ({
              code: item.code,
              name: item.name,
              service: 'housingSupport',
              correctionType: item.kind,
              afterStatus: item.service.status,
              officialSource: item.service.source.url,
              summary: item.service.summary
            })),
            causeScan: {
              previousRemainingCandidates: 139,
              reviewedHighRiskCandidates: 5,
              remainingCandidates: 134
            },
            issue3141: { unresolvedItemCount: 19, unresolvedMunicipalityCount: 19, changed: false },
            policy: [
              '一般制度が登録されていても、現行の子育て・三世代・新婚世帯向け住宅制度が別に存在する場合は、一般制度を除外して対象制度へ差し替える',
              '年齢要件のみの若年・定住制度は、子育て世帯を対象要件としない限り子育て世帯向け住宅支援として登録しない'
            ]
          };
          fs.writeFileSync(path.join(root, 'operations/audits/central-a-housing-classification-batch8-decisions-20260725.json'), JSON.stringify(audit, null, 2) + '\n');
          NODE

      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js

      - name: Commit batch 8 corrections
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch8-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/data/municipalities/17/17204.json \
            jichitai-compare/data/municipalities/17/17211.json \
            jichitai-compare/data/municipalities/17/17361.json \
            jichitai-compare/data/municipalities/21/21604.json \
            jichitai-compare/data/municipalities/22/22208.json \
            jichitai-compare/operations/tasks/17204.json \
            jichitai-compare/operations/tasks/17211.json \
            jichitai-compare/operations/tasks/17361.json \
            jichitai-compare/operations/tasks/21604.json \
            jichitai-compare/operations/tasks/22208.json \
            jichitai-compare/operations/audits/central-a-housing-classification-batch8-decisions-20260725.json \
            jichitai-compare/operations/control/central-a-housing-batch8-trigger-20260725.json
          git commit -m 'audit: 住宅支援分類第8群5件を修正'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
