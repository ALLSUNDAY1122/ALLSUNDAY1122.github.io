name: APP2-007 Dispatcher Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-DISPATCHER-SYNC]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/app-development-2-session-dispatcher
          fetch-depth: 1
      - name: Update APP2-007 only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/chatgpt-dispatcher/app-development-2/queue.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          matches=[t for t in d['tasks'] if t.get('id')=='APP2-007']
          assert len(matches)==1, len(matches)
          t=matches[0]
          t['status']='HUMAN_REQUIRED'
          t['human_gate']=True
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/chatgpt-dispatcher/app-development-2/queue.json
          git commit -m 'APP2-007: mark App Privacy publish human gate'
          git push origin HEAD:automation/app-development-2-session-dispatcher
      - name: Report
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-007 dispatcher queue synchronized to HUMAN_REQUIRED. run_id=${context.runId}`});
