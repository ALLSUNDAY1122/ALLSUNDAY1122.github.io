name: Touhan Q5 Privacy WebView Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/touhan-privacy-q5-audit.yml'
      - 'touroku-hanbaisha-ios/scripts/audit_privacy_q5.py'
      - 'touroku-hanbaisha-sprint/privacy.html'
      - 'touroku-hanbaisha-sprint/official-practice.html'
permissions:
  contents: write
concurrency:
  group: touhan-q5-privacy-audit
  cancel-in-progress: false
jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium runtime privacy and manifest audit
        id: audit
        continue-on-error: true
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python touroku-hanbaisha-ios/scripts/audit_privacy_q5.py
      - name: Commit Q5 evidence and conservative gate
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          p=Path('touroku-hanbaisha-ios')
          report=p/'PRIVACY_Q5_AUDIT_20261124.json'
          d=json.loads(report.read_text()) if report.exists() else {'schema':'touhan-q5-privacy-audit-v1','sourceAndBrowserAudit':'FAIL','appStoreConnectReconciliation':'NOT_VERIFIED','gate':'FAIL'}
          if os.environ['AUDIT_RESULT']!='success':d['sourceAndBrowserAudit']='FAIL';d['gate']='FAIL'
          d['githubRunId']=int(os.environ['RUN_ID'])
          report.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          sp=p/'release-status.json';s=json.loads(sp.read_text())
          s['q5_privacy_audit_20261124']={'sourceAndBrowserAudit':d['sourceAndBrowserAudit'],'appStoreConnect':'NOT_VERIFIED','gate':d['gate'],'evidence':'touroku-hanbaisha-ios/PRIVACY_Q5_AUDIT_20261124.json','githubRunId':d['githubRunId']}
          s['gates']['privacy_and_metadata']='ASC_PENDING' if d['sourceAndBrowserAudit']=='PASS' else 'BLOCKED'
          s['gates']['app_privacy']='NOT_VERIFIED_ASC' if d['sourceAndBrowserAudit']=='PASS' else 'FAIL'
          s['release_gate']='BLOCKED';s['app_review_submitted']=False
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          md=p/'RELEASE_STATUS.md'
          md.write_text(md.read_text()+f"\n\n## Q5 App Privacy 独立再照合（2026-11-24）\n- WebViewのHTML/JS・Chromium通信と端末保存・プライバシー文書の監査：**{d['sourceAndBrowserAudit']}**。App Store Connectの実回答：**NOT_VERIFIED**、総合：**{d['gate']}**。\n- Run https://github.com/ALLSUNDAY1122/ALLSUNDAY1122.github.io/actions/runs/{d['githubRunId']}、詳細 `PRIVACY_Q5_AUDIT_20261124.json`。GitHub Pagesのログ保持・利用目的とASCの申告照合が残る。\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-ios/PRIVACY_Q5_AUDIT_20261124.json touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          git commit -m 'audit(touhan): preserve Q5 observed privacy and ASC hold' || true
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touhan-q5-privacy-evidence
          path: touroku-hanbaisha-ios/PRIVACY_Q5_AUDIT_20261124.json
          if-no-files-found: ignore
      - name: Require source audit pass, not ASC approval
        run: |
          python - <<'PY'
          import json
          j=json.load(open('touroku-hanbaisha-ios/PRIVACY_Q5_AUDIT_20261124.json'))
          assert j['sourceAndBrowserAudit']=='PASS'
          assert j['appStoreConnectReconciliation']=='NOT_VERIFIED'
          PY
