name: West B Tokushima Task PR Number

on:
  pull_request:
    branches:
      - region/west

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.head_ref == 'fix/west-b-tokushima-completeness-20260724' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update task PR numbers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const pr=Number(process.env.PR_NUMBER);
          for(const code of ['36368','36383','36387','36388','36401']){
            const file=path.join('jichitai-compare','operations','tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(file,'utf8'));
            task.pullRequestNumber=pr;
            task.lastUpdatedAt='2026-07-24T15:56:00+09:00';
            task.notes=Array.isArray(task.notes)?task.notes:[];
            const note=`修正PR #${pr}をregion/west向けに作成。`;
            if(!task.notes.includes(note)) task.notes.push(note);
            fs.writeFileSync(file,JSON.stringify(task)+'\n');
          }
          NODE
          rm -f .github/workflows/west-b-tokushima-pr-number-once.yml
      - name: Commit task updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "task: 徳島県修正PR番号を反映"
          git push origin HEAD:${GITHUB_HEAD_REF}
