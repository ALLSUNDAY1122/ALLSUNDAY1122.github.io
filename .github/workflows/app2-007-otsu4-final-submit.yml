name: APP2-007 Otsu4 Final Submit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: app2-007-otsu4-final-submit
  cancel-in-progress: false

jobs:
  submit:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-SUBMIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ASC dependencies
        run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - name: Validate and submit App + first IAP for review
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          OTS4_FINAL_SUBMIT_OUTPUT: automation/app2-007-otsu4-final-submit-result.json
        run: python scripts/app2_007_otsu4_finalize_submit.py
      - name: Upload sanitized final result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app2-007-otsu4-final-submit-${{ github.run_id }}
          path: automation/app2-007-otsu4-final-submit-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-007 Otsu4 final submit finished. status=${{ job.status }}; run_id=${context.runId}; artifact=app2-007-otsu4-final-submit-${context.runId}`});
