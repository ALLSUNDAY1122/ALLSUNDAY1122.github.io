name: Temporary West A School Meals Crosscheck

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-crosscheck-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-a-school-meals-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Extract school meal risk candidates
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs'); const path=require('path');
          const prefs=['33','37','39','40','43','46'];
          const all=[]; const universal=[]; const unavailablePositive=[]; const oldYear=[]; const weakSource=[]; const ambiguous=[]; const numericMissing=[];
          const corpusOf=s=>JSON.stringify(s||{});
          for(const pref of prefs){
            const dir=`jichitai-compare/data/municipalities/${pref}`;
            for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort()){
              const m=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
              const s=m.services?.schoolMeals; if(!s)continue;
              const corpus=corpusOf(s); const summary=s.summary||''; const url=s.source?.url||'';
              const positive=/無償|無料|全額|補助|助成|支援|減免|給食費.{0,8}(0円|ゼロ)/.test(corpus);
              const negative=/確認できない|確定できない|未確認|不明|見当たらない|推測しない|制度がないとは限らない/.test(corpus);
              const universalMarker=/完全無償|全額無償|全児童|全生徒|全員|所得制限なし|一律無償|保護者負担なし/.test(corpus);
              const partialMarker=/第[23三二]子|多子|就学援助|要保護|準要保護|非課税|生活保護|ひとり親|一部|半額|上限|補助金|交付|対象世帯/.test(corpus);
              const currentMarker=/2026年度|2026年|令和8年度|令和８年度|令和8年|令和８年/.test(corpus);
              const oldMarker=/202[0-5]年度|202[0-5]年|令和[2-7]年度|令和[２-７]年度|令和[2-7]年|令和[２-７]年/.test(corpus);
              const numeric=/[0-9０-９][0-9０-９,，]*円|月額|日額|1食|一食|全額|無料|無償/.test(corpus);
              const topPage=url===m.officialUrl || /\/index\.(?:html?|php)$/.test(url) || /\/$/.test(url);
              const row={code:m.code,prefectureCode:m.prefectureCode,prefecture:m.prefecture,name:m.name,status:s.status,summary,sourceUrl:url,checkedAt:s.source?.checkedAt||null,positive,negative,universalMarker,partialMarker,currentMarker,oldMarker,numeric};
              all.push(row);
              if(s.status==='verified' && universalMarker) universal.push(row);
              if(s.status==='unavailable' && positive && !negative) unavailablePositive.push(row);
              if(s.status==='verified' && oldMarker && !currentMarker) oldYear.push(row);
              if(s.status==='verified' && topPage) weakSource.push(row);
              if(s.status==='verified' && /無償|無料/.test(corpus) && partialMarker && !universalMarker) ambiguous.push(row);
              if(s.status==='verified' && !numeric) numericMissing.push(row);
            }
          }
          const uniqueByCode=arr=>[...new Map(arr.map(x=>[x.code,x])).values()];
          const priority=uniqueByCode([...unavailablePositive,...oldYear,...weakSource,...ambiguous,...numericMissing]);
          const report={schemaVersion:'1.0.0',auditId:'west-a-school-meals-crosscheck-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),scope:{prefectureCodes:prefs,municipalityCount:all.length,service:'schoolMeals'},counts:{verified:all.filter(x=>x.status==='verified').length,unavailable:all.filter(x=>x.status==='unavailable').length,universalClaim:universal.length,unavailablePositiveWithoutNegative:unavailablePositive.length,oldYearWithoutCurrent:oldYear.length,weakPrimarySource:weakSource.length,freePartialAmbiguity:ambiguous.length,numericMissing:numericMissing.length,priorityCandidateCount:priority.length},priorityCandidates:priority,universalClaims:universal,unavailablePositiveWithoutNegative:unavailablePositive,oldYearWithoutCurrent:oldYear,weakPrimarySource:weakSource,freePartialAmbiguity:ambiguous,numericMissing,status:'initial_extraction_completed',unresolvedCount:priority.length};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report.counts));
          if(all.length!==226)throw new Error(`expected 226, got ${all.length}`);
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-crosscheck-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-crosscheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json \
                  jichitai-compare/operations/control/west-a-school-meals-crosscheck-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-crosscheck.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A学校給食費を226自治体で横断抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
