name: APP2-005 HM1 XcodeGen release patch

on:
  push:
    branches: [main]
    paths:
      - automation/app2-005-hm1-xcodegen-diagnostics-command.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app2-005-hm1-xcodegen-diagnostics
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove unavailable CM_BUILD_NUMBER dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          start=s.index('  health-manager-1-testflight:')
          end=s.index('\n  health-manager-2-ios:', start)
          block=s[start:end]

          current='''      - name: Set CI build number and generate Xcode project\n        script: |\n          set -o pipefail\n          {\n            set -x\n            cd "$CM_BUILD_DIR/ios/health-manager-1"\n            BUILD_NUM="${CM_BUILD_NUMBER:?CM_BUILD_NUMBER is required}"\n            echo "CM_BUILD_NUMBER=$BUILD_NUM"\n            python3 - "$BUILD_NUM" <<'PY2'\n          from pathlib import Path\n          import re,sys\n          q=Path('project.yml')\n          s=q.read_text(encoding='utf-8')\n          s,n=re.subn(r'CURRENT_PROJECT_VERSION:\\s*\\d+',f'CURRENT_PROJECT_VERSION: {sys.argv[1]}',s,count=1)\n          if n != 1:\n              raise SystemExit('CURRENT_PROJECT_VERSION replacement failed')\n          q.write_text(s,encoding='utf-8')\n          print('PASS: CURRENT_PROJECT_VERSION='+sys.argv[1])\n          PY2\n            xcodegen --version\n            xcodegen generate\n          } 2>&1 | tee /tmp/hm1-xcodegen.log\n'''

          fixed='''      - name: Generate Xcode project\n        script: |\n          set -o pipefail\n          {\n            set -x\n            cd "$CM_BUILD_DIR/ios/health-manager-1"\n            python3 - <<'PY2'\n          from pathlib import Path\n          import re\n          s=Path('project.yml').read_text(encoding='utf-8')\n          m=re.search(r'CURRENT_PROJECT_VERSION:\\s*(\\d+)',s)\n          if not m:\n              raise SystemExit('CURRENT_PROJECT_VERSION missing')\n          print('PASS: CURRENT_PROJECT_VERSION='+m.group(1))\n          PY2\n            xcodegen --version\n            xcodegen generate\n          } 2>&1 | tee /tmp/hm1-xcodegen.log\n'''

          if current in block:
              block=block.replace(current,fixed,1)
          elif 'BUILD_NUM="${CM_BUILD_NUMBER:?CM_BUILD_NUMBER is required}"' in block:
              raise SystemExit('HM1 block contains CM_BUILD_NUMBER but does not match expected guarded block')
          elif '      - name: Generate Xcode project\n' in block and 'CURRENT_PROJECT_VERSION missing' in block:
              print('PASS: release patch already applied')
          else:
              raise SystemExit('Expected HM1 XcodeGen step not found')

          if 'CM_BUILD_NUMBER' in block:
              raise SystemExit('CM_BUILD_NUMBER dependency remains in HM1 block')
          if '      - /tmp/hm1-xcodegen.log\n' not in block:
              block=block.replace('      - /tmp/hm1-prepare.log\n','      - /tmp/hm1-prepare.log\n      - /tmp/hm1-xcodegen.log\n',1)

          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          print('PASS: HM1 Codemagic uses project.yml build number and XcodeGen diagnostics')
          PY

      - name: Commit release patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml
          if git diff --cached --quiet; then
            echo "No Codemagic change"
            exit 0
          fi
          git commit -m "Fix HM1 Codemagic XcodeGen build number"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
