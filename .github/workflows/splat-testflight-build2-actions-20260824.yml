name: Splat TestFlight Build 2 Action Inspect

on:
  push:
    branches:
      - 'testflight/splat-native-ios-20260824'
    paths:
      - '.github/workflows/splat-testflight-build2-actions-20260824.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read sanitized action statuses
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          build_id='6a8b0f7ebd7eece7954737e9'
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token: raise SystemExit('Missing CM_API_TOKEN')
          req=urllib.request.Request(f'https://codemagic.io/api/v3/builds/{build_id}/actions',headers={'x-auth-token':token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
          actions=payload.get('data') or payload.get('actions') or []
          if isinstance(actions,dict): actions=actions.get('actions') or []
          out=[]
          for a in actions:
              if not isinstance(a,dict): continue
              out.append({'id':a.get('id') or a.get('_id'),'name':a.get('name'),'type':a.get('type'),'status':a.get('status'),'started_at':a.get('started_at') or a.get('startedAt'),'finished_at':a.get('finished_at') or a.get('finishedAt')})
          result={'request_id':'scanlab-testflight-build2-actions-20260824','ok':True,'build_id':build_id,'actions':out,'failed_actions':[a for a in out if str(a.get('status')).lower() in {'failed','failure'}]}
          pathlib.Path('/tmp/actions.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('PASS:',result['failed_actions'])
          PY
      - name: Persist sanitized result
        shell: bash
        run: |
          set -euo pipefail
          RESULT='automation/codemagic-results/scanlab-testflight-build2-actions-20260824.json'
          mkdir -p "$(dirname "$RESULT")"
          cp /tmp/actions.json "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'release(splat): persist Build 2 action status'
          git push origin HEAD:testflight/splat-native-ios-20260824
