name: Temporary Build East Release 10 1748

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-build-east-release-10-1748.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed snapshot
        run: |
          set -euxo pipefail
          TARGET='coord/east-release-10-20260722-1748'
          git fetch origin \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
          git switch -C "$TARGET" "origin/$TARGET"
          for code in 09407 09411 10201 10202 10203 10204 10205 10206 10207 10208; do
            pref="${code:0:2}"
            mkdir -p "jichitai-compare/data/municipalities/$pref" jichitai-compare/operations/tasks
            git show "origin/region/east:jichitai-compare/data/municipalities/$pref/$code.json" > "jichitai-compare/data/municipalities/$pref/$code.json"
            git show "origin/region/east:jichitai-compare/operations/tasks/$code.json" > "jichitai-compare/operations/tasks/$code.json"
          done
          git add jichitai-compare/data/municipalities jichitai-compare/operations/tasks
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 東日本10自治体の固定スナップショットを作成'
          git push origin "$TARGET"
          git switch main
          git pull --ff-only origin main
          rm -f .github/workflows/temp-build-east-release-10-1748.yml
          git add .github/workflows/temp-build-east-release-10-1748.yml
          git commit -m '統括管理: 東日本固定スナップショット一時ワークフローを削除'
          git push origin main
