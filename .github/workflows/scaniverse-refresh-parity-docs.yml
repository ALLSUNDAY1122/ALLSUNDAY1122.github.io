name: Scaniverse Refresh Parity Docs

on:
  push:
    branches:
      - feature/splat-native-ios-poc
    paths:
      - '.github/workflows/scaniverse-refresh-parity-docs.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh current parity source of truth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plan = Path('splat-native-ios/SCANIVERSE_PARITY_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          expected = 'Updated: 2026-08-15'
          if expected not in text:
              raise SystemExit('Unexpected parity plan version')
          text = text.replace(expected, 'Updated: 2026-08-24', 1)
          text = text.replace('Branch: `scaniverse/a-capture-reconstruction`', 'Branch: `scaniverse/a2-capture-reconstruction`', 1)
          text = text.replace('Branch: `scaniverse/b-view-edit-mesh`', 'Branch: `scaniverse/b2-view-edit-mesh`', 1)
          text = text.replace('Branch: `scaniverse/c-library-export`', 'Branch: `scaniverse/c2-library-export`', 1)
          text = text.replace('Branch: `scaniverse/d-share-discover`', 'Branch: `scaniverse/d2-share-discover`', 1)

          marker = '## Why the program was reorganized\n'
          current = '''## Current integration evidence — 2026-08-24\n\nThis section supersedes the 2026-08-15 consolidation ledger below for current status. The older ledger is retained only as historical baseline evidence.\n\nCurrent integration branch: `feature/splat-native-ios-poc`\n\nCurrent validated app-source HEAD: `17b52b79f032e7abe225bc216cc2d0ac2b71fadf`\n\nInternal TestFlight candidate:\n\n- version `1.0.0`, build `2`\n- Codemagic build `6a8b1591c8729cb286ce7247`: `finished`\n- App Store Connect build resource `53f5f4ae-2212-47d2-8860-af4805eb60de`: `VALID`\n- audience: `INTERNAL_ONLY`\n- internal beta group `sun` contains Build 2\n\nCurrent automated evidence on the same app source:\n\n- Privacy Preflight: PASS\n- Splat Smoke Diagnostic: PASS\n- production auth/session/profile E2E: PASS\n- S2 reconstruction contracts: PASS\n- D2 browser/live viewer contracts: PASS\n- Simulator msplat smoke: PASS\n- integrated A2/C2 XCTest: PASS\n- reader compatibility OBJ / FBX / GLB / STL / PLY / USDZ: PASS\n- unsigned iPhone Release compile: PASS\n- signed Xcode 26 archive + TestFlight upload: PASS\n\nCurrent parity ledger:\n\n| Area | State | Remaining proof | Owner |\n|---|---|---|---|\n| ARKit capture / tracking / live coverage guidance | PARTIAL | Build 2 real-device continuity, responsiveness and Golden comparison | A/HQ |\n| On-device Gaussian Splat reconstruction | PARTIAL | representative-object physical output quality, processing time, thermal/memory recovery | A |\n| Splat viewer / edit / measure | PARTIAL | newly generated real scan device usability and persistence | B/HQ |\n| Mesh reconstruction / texture / edit / measure / AR | PARTIAL | physical result quality and device workflow proof | B |\n| Local library / raw retention / process later / reopen / reprocess | NEAR_PARITY | Build 2 cold-reopen and process-later physical proof | C/HQ |\n| Export / video interoperability | NEAR_PARITY | CI independent-reader gates pass; device-generated asset/video and memory proof remain | C/B |\n| Auth / session / profile | NEAR_PARITY | production live E2E passes; device UX proof remains | D/HQ |\n| Publish / durable browser URL / visibility / Map / Discover | PARTIAL | real generated scan production publish/share/discover lifecycle E2E | D/HQ |\n| Integrated release candidate | NEAR_PARITY | Build 2 is VALID and internally distributed; physical end-to-end parity gate remains | HQ |\n| Integrated full app flow | PARTIAL | `capture → coverage → finish → processing → 3D result → save → library reopen` on Build 2 | HQ/A-D |\n\nNo row may be promoted to `PARITY` solely from compile, simulator, fixture, CI, or TestFlight upload success. Physical quality rows require representative real-device evidence against the Golden Reference.\n\nThe next blocking gate is therefore real-device Build 2 evidence, not additional branch integration work. In particular verify bottom tabs are hidden during capture and the real ARKit red/green coverage heatmap updates continuously. After a trusted real scan exists, run production `scan → publish → durable browser URL → visibility/Discover → owner lifecycle` E2E.\n\n'''
          if marker not in text:
              raise SystemExit('Parity plan insertion marker not found')
          text = text.replace(marker, current + marker, 1)
          old_heading = '## Consolidation ledger — 2026-08-15\n'
          if old_heading not in text:
              raise SystemExit('Historical ledger heading not found')
          text = text.replace(old_heading, '## Historical consolidation ledger — 2026-08-15\n\n> Historical baseline only. Do not use the row states below as current status; use the 2026-08-24 current integration ledger above.\n\n', 1)
          plan.write_text(text, encoding='utf-8')

          handoff = Path('splat-native-ios/NEXT_CHAT_HANDOFF.md')
          handoff.write_text('''# Scaniverse同等化｜次チャット引継ぎ\n\nUpdated: 2026-08-24 01:10 JST\n\n## 最重要\n\n会話履歴を正本にしない。開始時と各「次」受信時に必ず Notion / GitHub / Supabase production / App Store Connect・TestFlight の必要な最新実状態を再取得する。\n\n現在は **統合本部 + A2/B2/C2/D2** の成果がHQへ統合済み。旧「分割開始前」「A2-D2同期待ち」の記述は失効している。管理作業へ戻らず、真正なPARITY差分か実機Gateを進める。\n\n## 正本\n\n- Notion: `Scaniverse同等化｜4開発班＋統合本部 v2.0`\n- GitHub: `ALLSUNDAY1122/ALLSUNDAY1122.github.io`\n- HQ: `feature/splat-native-ios-poc`\n- Integration PR: `#4145`\n- A2: `scaniverse/a2-capture-reconstruction`\n- B2: `scaniverse/b2-view-edit-mesh`\n- C2: `scaniverse/c2-library-export`\n- D2: `scaniverse/d2-share-discover`\n- Supabase production: `gybchnyqlqwmajwkhsly`\n- parity ledger: `splat-native-ios/SCANIVERSE_PARITY_PLAN.md`\n\n固定SHAを正本にしてはならないが、2026-08-24 01:10 JST時点の確認基準は HQ `17b52b79f032e7abe225bc216cc2d0ac2b71fadf`。\n\n## 2026-08-24の成立済みGate\n\n同app sourceで GitHub Privacy / Smoke / main iOS Build が全SUCCESS。production auth/session/profile E2E、S2/D2 contracts、Simulator msplat smoke、A2/C2 XCTest、OBJ/FBX/GLB/STL/PLY/USDZ reader compatibility、unsigned iPhone Release compileもPASS。\n\nXcode世代差のMetal completion blockerは `SplatVideoExporter.swift` の `addCompletedHandler` + continuation方式で解消し、GitHub側とXcode 26 signed archive側の双方で成立。\n\nInternal TestFlight candidateは version `1.0.0` / build `2`。Codemagic build `6a8b1591c8729cb286ce7247` はfinished、App Store Connect build resource `53f5f4ae-2212-47d2-8860-af4805eb60de` は `VALID / INTERNAL_ONLY`。内部group `sun` のbuild一覧にもBuild 2を確認済み。\n\nPR #4145は意図的にdraft / unmergedを維持する。TestFlight upload成功はPARITY完了ではない。\n\n## 旧HQ未完了事項の再監査結果\n\n以下は現HEADですでに解消済みなので再実装しない。\n\n- 完成済みscanから「新規」: `SplatResultView` が確認ダイアログを出し `returnHomePreservingProject()` を使用。完成物をTrashへ移さない。\n- 「あとで生成」: captured画面に明示入口あり。保存済み一覧の「生成待ち」から再開可能。\n- WorldMap durability race: pause/transitionは `isWorldMapPersistencePending` で遷移を閉じ、`persistWorldMapForTransition` の完了結果をawaitしてからsession pause。失敗時は撮影を継続し、暗黙離脱しない。\n- relaunch後の `points3D.ply`: checkpointからfeature pointsを復元し、生成時に `points3D.ply` が欠落していれば再生成する。captured projectはprocessability contractで生成へ戻せる。\n- ScanModel責任境界: Capture / Persistence / Reconstruction / SessionLifecycle boundary filesは既に導入済み。\n\n## 現在の最大Gate\n\nBuild 2を実機で Golden Reference と比較する。必須flow:\n\n`capture → coverage → finish → processing → 3D result → save → library reopen`\n\n同時に確認する。\n\n- active capture中のbottom tabs非表示\n- real ARKit feature points由来の赤/緑coverage heatmapが移動に応じて更新\n- camera responsiveness / tracking / pause-resume / interruption recovery\n- finish gateが冗長viewだけで誤成立しない\n- processing進捗が実処理に対応\n- resultが粗い偽3Dではなく実Gaussian Splat\n- 保存後reopenして同じ完成物を表示\n- Scaniverse Golden Referenceに対する欠損、二重化、色、立体感、手数、速度の明白な劣位\n\nこの物理Gateを通るまでは capture/reconstruction/viewer/library の `PARITY` 昇格禁止。\n\n## 物理Gate後の次段\n\n実生成したtrusted scanを使ってproduction E2Eを行う。synthetic/hardcoded scanで代替しない。\n\n`explicit publish → durable asset URL → 別browser viewer → public/unlisted/private → Discover/Map（geotag opt-in時のみ） → unpublish/republish → owner delete`\n\nproduction scan rowが実際に作られるまでは publish/share parity完了としない。\n\n## 継続ループ\n\n`最新実状態取得 → 未完了最大差分 → 実装/実測 → test/build/runtime → 辛口比較 → 修正 → 回帰gate → 正本更新`\n\n禁止: compileだけで完了、古いhandoffの再実装、fake 3D/export/progress/Map、管理文書だけで停止、実機が必要でない作業まで人間待ちにすること。\n''', encoding='utf-8')
          PY
          git diff --check
          git diff -- splat-native-ios/SCANIVERSE_PARITY_PLAN.md splat-native-ios/NEXT_CHAT_HANDOFF.md
      - name: Commit refreshed docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splat-native-ios/SCANIVERSE_PARITY_PLAN.md splat-native-ios/NEXT_CHAT_HANDOFF.md
          git commit -m 'docs(scaniverse): refresh current parity gates'
          git push origin HEAD:feature/splat-native-ios-poc
