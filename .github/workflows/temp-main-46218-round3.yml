name: Temporary main sync for West-A round 3

on:
  push:
    branches:
      - 'audit/main-46218-sick-child-care-correction-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[main-round3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply correction and regenerate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'jichitai-compare';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeCompact = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const writePretty = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const municipalityPath = `${base}/data/municipalities/46/46218.json`;
          const municipality = read(municipalityPath);
          municipality.updatedAt = '2026-07-25';
          municipality.services.sickChildCare.summary = '小学6年生までを病児・病後児保育7施設で受け入れ';
          municipality.services.sickChildCare.details = {
            target: '保護者が霧島市内に居住または勤務し、病気・回復期で家庭保育が困難な小学6年生までの児童',
            facilityCount: 7,
            facilities: 'かわの小児科、第2ドリーム保育園、隼人認定こども園、みつぎ童夢園、牧之原認定こども園、こどもの城クローバー、のぐち童夢園',
            fee: '1日1,200円、午前または午後のみ600円。生活保護世帯は無料。かわの小児科は別途診察料が必要',
            usageLimit: '原則7日以内',
            application: '事前登録後、各施設へ予約。病後児保育6施設は利用申請書と医師連絡票が必要'
          };
          municipality.services.sickChildCare.source.checkedAt = '2026-07-25';
          writeCompact(municipalityPath, municipality);

          const taskPath = `${base}/operations/tasks/46218.json`;
          const task = read(taskPath);
          task.lastCheckedAt = '2026-07-25';
          task.lastUpdatedAt = '2026-07-25T00:55:00+09:00';
          task.lastUpdatedBy = '西日本調査班A';
          task.notes = task.notes.filter((note) => !note.includes('病児・病後児保育は小学6年生まで4施設'));
          if (!task.notes.some((note) => note.includes('7施設、1日1,200円'))) task.notes.push('完了後監査で病児・病後児保育の施設数・利用料に誤りを検出。2026年3月31日更新の公式ページに基づき、7施設、1日1,200円、半日600円、生活保護世帯無料へ修正。');
          writeCompact(taskPath, task);

          const auditPath = `${base}/operations/audits/west-a-research-verification-20260725.json`;
          const audit = read(auditPath);
          audit.updatedAt = '2026-07-25T00:55:00+09:00';
          audit.completedRoundCount = 3;
          audit.rounds[audit.rounds.findIndex((r) => r.round === 3)] = {
            round: 3,
            title: 'こども医療・病児保育の年齢、自己負担、施設数監査',
            status: 'completed',
            method: '担当6県から条件が複雑な自治体を各1件抽出し、こども医療と病児・病後児保育の計12項目を自治体公式ページで再照合',
            sampleMunicipalityCount: 6,
            checkedServiceCount: 12,
            samples: [
              {code:'33202',name:'倉敷市',services:['childMedical','sickChildCare'],result:'matched'},
              {code:'37202',name:'丸亀市',services:['childMedical','sickChildCare'],result:'matched'},
              {code:'39204',name:'南国市',services:['childMedical','sickChildCare'],result:'matched'},
              {code:'40100',name:'北九州市',services:['childMedical','sickChildCare'],result:'matched'},
              {code:'43202',name:'八代市',services:['childMedical','sickChildCare'],result:'matched'},
              {code:'46218',name:'霧島市',services:['childMedical','sickChildCare'],result:'corrected',finding:'病児・病後児保育を4施設・1日1,000円と登録していたが、公式ページは7施設・1日1,200円・半日600円・生活保護世帯無料',officialUrl:'https://www.city-kirishima.jp/jidou/kosodate/kosodate/support/byoji.html',officialUpdatedAt:'2026-03-31'}
            ],
            result:'corrected',materialErrorCount:1,correctionAppliedCount:1
          };
          audit.summary = {...audit.summary, materialErrorCount:1, correctionRequiredCount:0, correctionAppliedCount:1, roundsRemaining:7, currentAssessment:'第3回で霧島市の病児・病後児保育の施設数・利用料の誤り1件を検出し、公式情報に基づき修正。ほか5自治体10項目は一致。'};
          audit.nextAction = '第4回として、保育料・学校給食費の令和8年度条件を担当6県の複雑事例で再照合する。';
          writePretty(auditPath, audit);

          const checkpointPath = `${base}/operations/control/session-checkpoints/west-a.json`;
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = '2026-07-25T00:55:00+09:00';
          checkpoint.nextAction = '10回の誤調査検証の第4回として、保育料・学校給食費の令和8年度条件を担当6県の複雑事例で再照合する。';
          checkpoint.researchVerificationAudit = {...checkpoint.researchVerificationAudit, completedRoundCount:3, lastCompletedRound:3, nextRound:4, materialErrorCount:1, correctionRequiredCount:0, correctionAppliedCount:1, lastAuditedAt:'2026-07-25T00:55:00+09:00'};
          checkpoint.integrityAudit.auditedAt = '2026-07-25T00:55:00+09:00';
          if (!checkpoint.integrityAudit.notes.some((note) => note.includes('霧島市の病児・病後児保育'))) checkpoint.integrityAudit.notes.push('第3回監査で霧島市の病児・病後児保育の施設数・利用料を公式情報に基づき修正。');
          writePretty(checkpointPath, checkpoint);
          NODE
          cd jichitai-compare
          npm run generate
          npm run progress
      - name: Commit nationwide correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m '[main-round3-applied] audit: sync Kirishima sick child care correction'
          git push
