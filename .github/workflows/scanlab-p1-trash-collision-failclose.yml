name: Scan Lab P1 trash collision fail-close one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-trash-collision-failclose.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 1
          lfs: false
      - name: Fail closed on occupied trash destination
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/MeshProjectStore.swift')
          s = p.read_text()
          old = '''        let destination = trashURL.appendingPathComponent(projectURL.lastPathComponent, isDirectory: true)\n        if fileManager.fileExists(atPath: destination.path) { try fileManager.removeItem(at: destination) }\n        try fileManager.moveItem(at: projectURL, to: destination)\n'''
          new = '''        let destination = trashURL.appendingPathComponent(projectURL.lastPathComponent, isDirectory: true)\n        // A stale/corrupt duplicate in Trash must never be destroyed implicitly. Normal lifecycle\n        // cannot produce the same project ID in Library and Trash at once, so treat this as an\n        // integrity collision and preserve both sides for explicit recovery.\n        guard !fileManager.fileExists(atPath: destination.path) else {\n            throw MeshProjectStoreError.invalidProject\n        }\n        try fileManager.moveItem(at: projectURL, to: destination)\n'''
          if s.count(old) != 1: raise SystemExit('moveToTrash anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          t = Path('splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift')
          tests = t.read_text()
          anchor = '''    func testTrashRestoreAndPermanentDeleteSurviveStoreRecreation() throws {\n'''
          insertion = '''    func testMoveToTrashPreservesBothSidesWhenDestinationIsAlreadyOccupied() throws {\n        let live = try makeLiveProject(mode: "lidar", resultName: "mesh.obj", marker: 0x53)\n        let archived = try store.archiveFinishedProject(resultURL: live.appendingPathComponent("mesh.obj"))\n        let destination = store.trashURL.appendingPathComponent(archived.projectURL.lastPathComponent)\n        try FileManager.default.createDirectory(at: destination, withIntermediateDirectories: true)\n        let sentinel = destination.appendingPathComponent("sentinel")\n        try Data([0xAC]).write(to: sentinel)\n\n        XCTAssertThrowsError(try store.moveToTrash(projectURL: archived.projectURL)) { error in\n            guard case MeshProjectStoreError.invalidProject = error else {\n                return XCTFail("Expected invalidProject, got \\(error)")\n            }\n        }\n        XCTAssertTrue(FileManager.default.fileExists(atPath: archived.projectURL.path))\n        XCTAssertEqual(try Data(contentsOf: sentinel), Data([0xAC]))\n    }\n\n'''
          if tests.count(anchor) != 1: raise SystemExit('test anchor mismatch')
          t.write_text(tests.replace(anchor, insertion + anchor, 1))
          PY
          grep -q 'integrity collision and preserve both sides' splat-native-ios/SplatNative/MeshProjectStore.swift
          grep -q 'testMoveToTrashPreservesBothSidesWhenDestinationIsAlreadyOccupied' splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
      - name: Commit patch and retire helper
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/scanlab-p1-trash-collision-failclose.yml
          git add splat-native-ios/SplatNative/MeshProjectStore.swift \
            splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
          git commit -m 'fix(mesh): preserve occupied trash collision'
          git push origin HEAD:feature/splat-post-build17-p1
