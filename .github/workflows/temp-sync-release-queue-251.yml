name: Temporary Sync Release Queue 251

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-251.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={'east':[('08236','小美玉市')],'central':[('22203','沼津市')]}
          for entry in data['entries']:
              r=entry['region']; existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(r,[]):
                  if code not in existing: entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if r=='north': entry['pendingSinceLastRelease']=4
              elif r=='east':
                  entry['pendingSinceLastRelease']=5
                  entry['reason']='鹿嶋市から桜川市までの追加10自治体をPR #407でmainへ統合し、PR #408で公開204自治体へ更新。その後、神栖市・行方市・鉾田市・つくばみらい市・小美玉市を地方統合'
              elif r=='central':
                  entry['pendingSinceLastRelease']=5
                  entry['reason']='揖斐川町から白川町までの追加10自治体をPR #437でmainへ統合し、PR #439で公開234自治体へ更新。その後、東白川村・御嵩町・静岡市・浜松市・沼津市を地方統合'
              elif r=='west': entry['pendingSinceLastRelease']=4
          data['updatedAt']='2026-07-22T04:23:00+09:00'
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[]
          s['auditBlockedRegions']=[]
          s['latestGeneratedMunicipalityCount']=234
          s['latestGeneratedPullRequest']=439
          s['latestPublicCountPullRequest']=439
          if s['regionalMergedMunicipalities'] != 251: raise SystemExit(s['regionalMergedMunicipalities'])
          data['nextAction']='東日本・中日本が5自治体、北日本・西日本が4自治体。各地域をコード昇順で継続する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-251.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-251.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合251自治体・公開234自治体へ同期'
          git push origin main
