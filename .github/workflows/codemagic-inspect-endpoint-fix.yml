name: Codemagic Monitoring Contract Audit

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'scripts/codemagic_build_gateway.py'
      - '.github/workflows/codemagic-inspect-endpoint-fix.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[CM-MONITORING-AUDIT]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce documented Codemagic monitoring contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/codemagic_build_gateway.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/codemagic_build_gateway.py').read_text(encoding='utf-8')
          forbidden=(
              'https://api.codemagic.io/builds/{build_id}',
              'https://codemagic.io/api/v3/builds/{build_id}',
              'action must be inspect, inspect_build',
          )
          for token in forbidden:
              assert token not in s, f'unsupported Codemagic polling regression: {token}'
          assert 'inspect_workflow_status' in s
          assert 'status_badge.svg' in s
          assert 'wait=true is unsupported' in s
          assert 'https://api.codemagic.io/builds' in s
          print('PASS: start-build API is separated from workflow-health/ASC completion evidence')
          PY
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Codemagic monitoring contract audit finished. status=${{ job.status }}; run_id=${context.runId}. Unsupported build-id polling is treated as a regression.`
            });
