name: Codemagic Inspect Endpoint Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[CM-INSPECT-ENDPOINT-FIX]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch documented Codemagic GET build endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/codemagic_build_gateway.py')
          s=p.read_text(encoding='utf-8')
          old='https://codemagic.io/api/v3/builds/{build_id}'
          new='https://api.codemagic.io/builds/{build_id}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy inspect endpoint, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('PASS: Codemagic inspect endpoint updated to documented /builds/:id API')
          PY
          grep -q 'https://api.codemagic.io/builds/{build_id}' scripts/codemagic_build_gateway.py
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/codemagic_build_gateway.py
          git diff --cached --exit-code && { echo 'No change required'; exit 0; } || true
          git commit -m 'fix(release): use documented Codemagic build status endpoint'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Codemagic inspect endpoint repair finished. status=${{ job.status }}; run_id=${context.runId}`});
