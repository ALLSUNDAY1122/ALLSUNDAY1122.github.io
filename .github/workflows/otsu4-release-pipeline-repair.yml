name: Otsu4 Release Pipeline Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.actor == 'ALLSUNDAY1122' &&
      startsWith(github.event.issue.title, '[OTSU4-PIPELINE-REPAIR]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fail-closed repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          start=s.index('  otsu4-ios:')
          end=s.index('\n  tsukanshi-ios:', start)
          block=s[start:end]
          required=[
              "bundle_identifier: jp.allsunday1122.otsu4",
              "submit_to_app_store: false",
              "submit_to_testflight: false",
              "xcode-project use-profiles --custom-export-options='{\"testFlightInternalTestingOnly\": true}'",
          ]
          missing=[x for x in required if x not in block]
          if missing:
              raise SystemExit('BLOCKED: Otsu4 contract drift: '+repr(missing))
          old="xcode-project use-profiles --custom-export-options='{\"testFlightInternalTestingOnly\": true}'"
          if block.count(old) != 1:
              raise SystemExit(f'BLOCKED: expected one internal-only signing marker, got {block.count(old)}')
          block=block.replace(old, 'xcode-project use-profiles')
          block=block.replace('name: 危険物乙4 - iOS Internal TestFlight','name: 危険物乙4 - iOS Release Candidate')
          repaired=s[:start]+block+s[end:]
          p.write_text(repaired,encoding='utf-8')
          # Re-read only the Otsu4 block and prove safety properties.
          s2=p.read_text(encoding='utf-8')
          a=s2.index('  otsu4-ios:'); b=s2.index('\n  tsukanshi-ios:',a); b2=s2[a:b]
          assert 'testFlightInternalTestingOnly' not in b2
          assert 'xcode-project use-profiles' in b2
          assert 'submit_to_app_store: false' in b2
          assert 'submit_to_testflight: false' in b2
          assert 'distribution_type: app_store' in b2
          assert 'bundle_identifier: jp.allsunday1122.otsu4' in b2
          print('PASS: Otsu4 now exports App Store eligible RC while retaining zero auto-distribution and zero App Review submission')
          PY
          git diff --check
          git diff -- codemagic.yaml
      - name: Commit repair if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- codemagic.yaml; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'Fix Otsu4 App Store release export'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 release pipeline repair finished. status=${{ job.status }}; run_id=${context.runId}. This workflow does not build, upload, distribute, purchase, or submit.`});
