name: Refine Central A Scope Audit Round 02

on:
  push:
    branches: ['audit/central-a-scope-verification-round-02-20260725']
    paths: ['.github/workflows/central-a-scope-round-02-refine.yml']

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-scope-verification-round-02-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refine findings and extract substantive suspects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare';
          const expected = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const reportPath = `${root}/operations/control/central-a-scope-round-02-ishikawa-20260725.json`;
          const report = JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const resolved = [];
          const remaining = [];
          for (const finding of report.findings) {
            if (finding.type !== 'official_sources_count') { remaining.push(finding); continue; }
            const code = finding.code;
            const data = JSON.parse(fs.readFileSync(`${root}/data/municipalities/17/${code}.json`,'utf8'));
            const task = JSON.parse(fs.readFileSync(`${root}/operations/tasks/${code}.json`,'utf8'));
            const primary = expected.map(k => data.services[k]?.source?.url).filter(Boolean);
            const unique = [...new Set(primary)];
            if (unique.length === task.officialSources.length && unique.every(url => task.officialSources.includes(url))) {
              const groups = {};
              for (const key of expected) {
                const url = data.services[key]?.source?.url;
                if (!url) continue;
                (groups[url] ||= []).push(key);
              }
              resolved.push({
                ...finding,
                resolution:'false_positive_shared_primary_source',
                sharedSources:Object.entries(groups).filter(([,services]) => services.length > 1).map(([url,services]) => ({url,services}))
              });
            } else remaining.push(finding);
          }
          const suspects = [];
          for (const m of report.municipalities) {
            const t = m.highRisk.temporaryChildcare || {};
            if (t.status === 'verified' && !/(誰でも通園|月10時間|満3歳未満)/.test(t.summary || '')) {
              suspects.push({severity:'review',type:'possible_any_child_access_omission',code:m.code,name:m.name,summary:t.summary,source:t.source});
            }
            const s = m.highRisk.schoolMeals || {};
            if (s.status === 'verified' && /(当面の間|支援措置)/.test(s.summary || '')) {
              suspects.push({severity:'review',type:'temporary_school_meal_measure_needs_current_check',code:m.code,name:m.name,summary:s.summary,source:s.source});
            }
          }
          report.findings = remaining;
          report.structuralFindingCount = remaining.length;
          report.resolvedFindings = resolved;
          report.substantiveSuspects = suspects;
          report.refinedAt = '2026-07-25T00:19:00+09:00';
          fs.writeFileSync(reportPath, JSON.stringify(report,null,2)+'\n');

          const auditPath = `${root}/operations/control/central-a-scope-verification-20260724.json`;
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const batch = audit.batches.find(x => x.batch === 2);
          batch.structuralFindingCount = remaining.length;
          batch.resolvedStructuralFindingCount = resolved.length;
          batch.substantiveSuspectCount = suspects.length;
          batch.status = 'structural_passed';
          batch.nextStep = '抽出した制度内容疑義を公式ページで照合する';
          audit.nextAction = '石川県の制度内容疑義を公式ページで照合し、誤りなら修正する';
          fs.writeFileSync(auditPath, JSON.stringify(audit,null,2)+'\n');
          NODE
          rm .github/workflows/central-a-scope-round-02-refine.yml
      - name: Commit refined audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 石川県の共有出典を正常判定し制度疑義を抽出'
          git push origin HEAD:audit/central-a-scope-verification-round-02-20260725
