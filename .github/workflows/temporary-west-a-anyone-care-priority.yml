name: Temporary West A Anyone Care Priority

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-anyone-care-priority-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-a-anyone-care-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Refine priority candidates
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefs = ['33','37','39','40','43','46'];
          const critical = [];
          const unavailablePositive = [];
          const startMissing = [];
          const planLike = [];
          const all = [];
          const corpusOf = s => JSON.stringify(s || {});
          for (const pref of prefs) {
            const dir = `jichitai-compare/data/municipalities/${pref}`;
            for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()) {
              const m = JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
              const s = m.services?.temporaryChildcare;
              if (!s) continue;
              const corpus = corpusOf(s);
              const sourceUrl = s.source?.url || '';
              const anyone = /誰でも通園|こども誰でも|乳児等通園支援|月.{0,3}10時間|10時間.{0,3}月/.test(corpus);
              const negative = /確認できない|確認されていない|未確認|実施していない|制度なし|見当たらない|利用できない|対象外|登録しない/.test(corpus);
              const positive = /実施|開始|利用|受け入れ|開設|申込|予約|施設|月.{0,3}10時間|[0-9０-９,，]+円|無料/.test(corpus);
              const start = /202[4-6]年|令和[678]年|開始|試行|本格実施|法定給付/.test(corpus);
              const age = /6か月|６か月|0歳6か月|０歳６か月|満3歳未満|満３歳未満|3歳未満|３歳未満/.test(corpus);
              const limit = /月.{0,4}(10|１０)時間|(10|１０)時間.{0,4}月/.test(corpus);
              const fee = /[0-9０-９,，]+円|無料|無償/.test(corpus);
              const row = {code:m.code,prefectureCode:m.prefectureCode,prefecture:m.prefecture,name:m.name,status:s.status,summary:s.summary||'',sourceUrl,checkedAt:s.source?.checkedAt||null,anyone,negative,positive,start,age,limit,fee};
              all.push(row);
              if (s.status === 'verified' && anyone && (!age || !limit || !fee)) critical.push({...row,missing:[!age?'age':null,!limit?'monthlyLimit':null,!fee?'fee':null].filter(Boolean)});
              if (s.status === 'unavailable' && anyone && positive && !negative) unavailablePositive.push(row);
              if (s.status === 'verified' && anyone && !start) startMissing.push(row);
              if (/\.pdf(?:$|\?)/i.test(sourceUrl) && /計画|予算|施政方針|事業計画/.test(corpus)) planLike.push(row);
            }
          }
          const report = {
            schemaVersion:'1.0.0',
            auditId:'west-a-anyone-care-priority-review-20260725',
            team:'西日本調査班A',
            generatedAt:new Date().toISOString(),
            scope:{municipalityCount:all.length,prefectureCodes:prefs},
            counts:{criticalMissingFields:critical.length,unavailablePositiveWithoutNegative:unavailablePositive.length,startTimingMissing:startMissing.length,planLikePrimarySource:planLike.length},
            criticalMissingFields:critical,
            unavailablePositiveWithoutNegative:unavailablePositive,
            startTimingMissing:startMissing,
            planLikePrimarySource:planLike,
            status:'priority_refinement_completed',
            unresolvedCount:critical.length + unavailablePositive.length + planLike.length
          };
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-anyone-care-priority-review-20260725.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report.counts));
          if (all.length !== 226) throw new Error(`expected 226, got ${all.length}`);
          NODE
          rm -f jichitai-compare/operations/control/west-a-anyone-care-priority-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-anyone-care-priority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-anyone-care-priority-review-20260725.json \
                  jichitai-compare/operations/control/west-a-anyone-care-priority-trigger-20260725.json \
                  .github/workflows/temporary-west-a-anyone-care-priority.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A誰でも通園制度候補を精密化'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
