name: Temporary Sync Release Queue 276

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-254-retry.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync release queue and remove workflow
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          additions={
            'north':[('01457','上川町'),('01458','東川町'),('01459','美瑛町'),('01460','上富良野町'),('01461','中富良野町')],
            'east':[('08310','城里町'),('08341','東海村')],
            'central':[('22209','島田市'),('22210','富士市'),('22211','磐田市'),('22212','焼津市'),('22213','掛川市'),('22214','藤枝市')],
            'west':[('33202','倉敷市')],
          }
          for entry in data['entries']:
              region=entry['region']
              existing={m['code'] for m in entry['municipalities']}
              for code,name in additions.get(region,[]):
                  if code not in existing:
                      entry['municipalities'].append({'code':code,'name':name})
              entry['municipalities'].sort(key=lambda x:x['code'])
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
              if region=='north':
                  entry['pendingSinceLastRelease']=4
                  entry['reason']='秩父別町から上川町までの追加10自治体をPR #465でmainへ統合し、PR #472で公開254自治体へ更新。その後、東川町・美瑛町・上富良野町・中富良野町を地方統合'
                  entry['mainIntegrationPr']=465
                  entry['generatedPullRequest']=472
              elif region=='east':
                  entry['pendingSinceLastRelease']=9
                  entry['reason']='鹿嶋市から桜川市までの追加10自治体をPR #407でmainへ統合後、神栖市・行方市・鉾田市・つくばみらい市・小美玉市・茨城町・大洗町・城里町・東海村を地方統合'
                  entry['mainIntegrationPr']=407
                  entry['generatedPullRequest']=408
              elif region=='central':
                  entry['pendingSinceLastRelease']=5
                  entry['reason']='東白川村から島田市までの追加10自治体をPR #468でmainへ統合し、PR #472で公開254自治体へ更新。その後、富士市・磐田市・焼津市・掛川市・藤枝市を地方統合'
                  entry['mainIntegrationPr']=468
                  entry['generatedPullRequest']=472
              elif region=='west':
                  entry['pendingSinceLastRelease']=5
                  entry['reason']='前回全国統合後、邑南町・津和野町・吉賀町・岡山市・倉敷市を地方統合'
          data['updatedAt']='2026-07-22T06:18:00+09:00'
          summary=data['summary']
          summary['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          summary['waitingRegionalMergeMunicipalities']=0
          summary['releaseReadyRegions']=[]
          summary['auditBlockedRegions']=[]
          summary['latestGeneratedMunicipalityCount']=254
          summary['latestGeneratedPullRequest']=472
          summary['latestPublicCountPullRequest']=480
          if summary['regionalMergedMunicipalities'] != 276:
              raise SystemExit(f"expected 276, got {summary['regionalMergedMunicipalities']}")
          data['nextAction']='東日本が9自治体で、次の大子町統合時に10自治体へ到達し全国統合する。北日本4・中日本5・西日本5は地方統合を継続する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-generate-public-254-retry.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-generate-public-254-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合276自治体・公開254自治体へ同期'
          git push origin main
