name: Temporary Generate Public 254 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-254-retry.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-254-retry
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and push artifacts
        run: |
          set -euxo pipefail
          cd jichitai-compare
          npm ci
          npm run generate
          npm run progress
          cd ..
          python3 - <<'PY'
          import re
          from pathlib import Path
          path=Path('jichitai-compare/index.html')
          text=path.read_text(encoding='utf-8')
          new,count=re.subn(r'<span>\d+自治体・9制度</span>','<span>254自治体・9制度</span>',text,count=1)
          if count != 1:
              raise SystemExit('public count target not found')
          path.write_text(new,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git commit -m '公開更新: 生成データと表示件数を254自治体へ同期'
          git push origin coord/generated-254-retry
