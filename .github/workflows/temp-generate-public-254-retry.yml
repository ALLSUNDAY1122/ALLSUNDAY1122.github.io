name: Temporary Generate Public 254 Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-254-retry.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-254-retry
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Mark npm-ci stage
        run: |
          printf 'npm-ci\n' > .generation-stage-254
          git add .generation-stage-254
          git commit -m '公開更新: 生成段階 npm-ci' || true
          git push origin coord/generated-254-retry
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd jichitai-compare
          npm ci
      - name: Mark generate stage
        run: |
          printf 'generate\n' > .generation-stage-254
          git add .generation-stage-254
          git commit -m '公開更新: 生成段階 generate'
          git push origin coord/generated-254-retry
      - name: Generate municipalities
        run: |
          cd jichitai-compare
          npm run generate
      - name: Mark progress stage
        run: |
          printf 'progress\n' > .generation-stage-254
          git add .generation-stage-254
          git commit -m '公開更新: 生成段階 progress'
          git push origin coord/generated-254-retry
      - name: Generate progress
        run: |
          cd jichitai-compare
          npm run progress
      - name: Mark index stage
        run: |
          printf 'index\n' > .generation-stage-254
          git add .generation-stage-254
          git commit -m '公開更新: 生成段階 index'
          git push origin coord/generated-254-retry
      - name: Update public count and push artifacts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path=Path('jichitai-compare/index.html')
          text=path.read_text(encoding='utf-8')
          new,count=re.subn(r'<span>\d+自治体・9制度</span>','<span>254自治体・9制度</span>',text,count=1)
          if count != 1:
              raise SystemExit('public count target not found')
          path.write_text(new,encoding='utf-8')
          PY
          rm -f .generation-started-254 .generation-stage-254
          git add -A .generation-started-254 .generation-stage-254 jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git commit -m '公開更新: 生成データと表示件数を254自治体へ同期'
          git push origin coord/generated-254-retry
