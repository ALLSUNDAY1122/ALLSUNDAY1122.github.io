name: Temporary Diagnose Kamifurano Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-public-254-retry.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/01460-kamifurano
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation and save output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd jichitai-compare
          npm run generate > /tmp/01460-validation.log 2>&1
          npm run progress >> /tmp/01460-validation.log 2>&1
          npm run validate >> /tmp/01460-validation.log 2>&1
          status=$?
          cd ..
          printf '\nVALIDATE_EXIT=%s\n' "$status" >> /tmp/01460-validation.log
          encoded=$(base64 -w0 /tmp/01460-validation.log)
          gh api "repos/${GITHUB_REPOSITORY}/contents/diagnostics/01460-validation.txt" \
            --method PUT \
            -f message='統括診断: 上富良野町の検証結果を保存' \
            -f content="$encoded" \
            -f branch='coord/diag-01460'
