name: Temporary Sync Central 21504

on:
  push:
    branches: [region/central]
    paths:
      - .github/workflows/temp-sync-central-21504.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/central
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update task and region state
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          task_path=Path('jichitai-compare/operations/tasks/21504.json')
          task=json.loads(task_path.read_text(encoding='utf-8'))
          task['status']='merged'
          task['lastUpdatedAt']='2026-07-22T03:35:00+09:00'
          task['lastUpdatedBy']='統括'
          notes=task.setdefault('notes',[])
          for line in ['地方統合PR #430・CI run #917成功でregion/centralへ統合済み。']:
              if line not in notes: notes.append(line)
          task_path.write_text(json.dumps(task,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          state_path=Path('jichitai-compare/operations/control/regions/central.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          completed=state.setdefault('completedMunicipalities',[])
          if '21504' not in completed: completed.append('21504')
          state['completedSinceLastRelease']=8
          state['regionalQueue']=['21505']
          state['updatedAt']='2026-07-22T03:35:00+09:00'
          audit=state.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '21504' not in checked: checked.append('21504')
          checks=audit.setdefault('checks',[])
          line='七宗町をPR #430・CI run #917で地方統合'
          if line not in checks: checks.append(line)
          state['lastAction']='全国統合PR #404・生成更新PR #408完了後、揖斐川町（21401）から七宗町（21504）までの8自治体をregion/centralへ地方統合し、各taskをmergedへ更新'
          state['nextAction']='八百津町（21505）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する'
          state_path.write_text(json.dumps(state,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-central-21504.yml
          git add jichitai-compare/operations/tasks/21504.json jichitai-compare/operations/control/regions/central.json .github/workflows/temp-sync-central-21504.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 七宗町統合後の中日本状態を更新'
          git push origin region/central
