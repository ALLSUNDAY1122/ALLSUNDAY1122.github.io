name: Scaniverse camera metadata off-main patch

on:
  push:
    branches: [feature/splat-post-build17-p1]
    paths: [.github/scaniverse-camera-metadata-offmain-trigger]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Trigger camera metadata off-main patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Count every decoded frame for cooperative cancellation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/SplatViewerCameraDatasetLoader.swift')
          text = p.read_text(encoding='utf-8')
          old_decl = '''            var validPositionIndex = 0\n            var retentionStride = 1'''
          new_decl = '''            var validPositionIndex = 0\n            var decodedFrameIndex = 0\n            var retentionStride = 1'''
          old_check = '''                if validPositionIndex % 1_024 == 0, Task.isCancelled {\n                    throw CancellationError()\n                }\n                let frame = try frames.decode(Frame.self)'''
          new_check = '''                if decodedFrameIndex % 1_024 == 0, Task.isCancelled {\n                    throw CancellationError()\n                }\n                decodedFrameIndex += 1\n                let frame = try frames.decode(Frame.self)'''
          if text.count(old_decl) != 1:
              raise SystemExit(f'declaration anchor count={text.count(old_decl)}')
          if text.count(old_check) != 1:
              raise SystemExit(f'cancellation anchor count={text.count(old_check)}')
          text = text.replace(old_decl, new_decl, 1).replace(old_check, new_check, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit cancellation repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add splat-native-ios/SplatNative/SplatViewerCameraDatasetLoader.swift
          git commit -m "Cancel camera metadata decode across malformed frames"
          git push origin HEAD:feature/splat-post-build17-p1
