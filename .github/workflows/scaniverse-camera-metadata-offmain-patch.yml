name: Scaniverse camera metadata off-main patch

on:
  push:
    branches: [feature/splat-post-build17-p1]
    paths: [.github/scaniverse-camera-metadata-offmain-trigger]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Trigger camera metadata off-main patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Repair async loader regression JSON
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNativeTests/SplatViewerCameraDatasetLoaderTests.swift')
          text = p.read_text(encoding='utf-8')
          old = r'''        let json = #"{\"frames\":[{\"transform_matrix\":[[1,0,0,1.25],[0,1,0,-2.5],[0,0,1,3.75],[0,0,0,1]]},{\"transform_matrix\":[[1,0,0,4],[0,1,0,5],[0,0,1,6],[0,0,0,1]]}]}"#'''
          new = r'''        let json = #"{"frames":[{"transform_matrix":[[1,0,0,1.25],[0,1,0,-2.5],[0,0,1,3.75],[0,0,0,1]]},{"transform_matrix":[[1,0,0,4],[0,1,0,5],[0,0,1,6],[0,0,0,1]]}]}"#'''
          if text.count(old) != 1:
              raise SystemExit(f'bad fixture anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add splat-native-ios/SplatNativeTests/SplatViewerCameraDatasetLoaderTests.swift
          git commit -m "Fix async camera loader regression fixture"
          git push origin HEAD:feature/splat-post-build17-p1
