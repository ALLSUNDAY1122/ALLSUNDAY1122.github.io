name: Kangoshi App Store Screenshots

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - 'kangoshi-sprint/ios/Sources/**'
      - 'kangoshi-sprint/ios/UITests/KangoshiScreenshotUITests.swift'
      - 'kangoshi-sprint/ios/Review.storekit'
      - 'kangoshi-sprint/ios/project.yml'
      - 'scripts/app2_009_kangoshi_store_prepare.py'
      - '.github/workflows/kangoshi-appstore-screenshots.yml'

concurrency:
  group: kangoshi-appstore-screenshots
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  screenshots:
    if: github.event_name != 'issues' || (github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[APP2-009] Prepare App Store submission assets')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools and prepare canonical native payload
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen cairo pango
          python3 -m pip install --break-system-packages 'CairoSVG>=2.7,<3'
          python3 kangoshi-sprint/ios/tools/normalize_swift_numeric_literals.py
          python3 kangoshi-sprint/ios/tools/prepare_native_content.py
      - name: Generate Xcode project with StoreKit review configuration
        working-directory: kangoshi-sprint/ios
        run: |
          xcodegen generate
          grep -q 'Review.storekit' KangoshiSprint.xcodeproj/xcshareddata/xcschemes/KangoshiSprint.xcscheme
      - name: Pick current large iPhone simulator
        run: |
          python3 - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          rows=[]
          for runtime,items in d.get('devices',{}).items():
              if 'iOS' not in runtime: continue
              rows += [x for x in items if x.get('isAvailable') and str(x.get('name','')).startswith('iPhone')]
          for preferred in ['iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16 Plus','iPhone 16']:
              hit=next((x for x in rows if x['name']==preferred),None)
              if hit: break
          else: hit=rows[0] if rows else None
          if not hit: raise SystemExit('No available iPhone simulator')
          open('/tmp/kangoshi-shot-udid','w').write(hit['udid'])
          open('/tmp/kangoshi-shot-device','w').write(hit['name'])
          print(hit['name'],hit['udid'])
          PY
      - name: Capture five review screens including priced paywall
        shell: bash
        run: |
          set -euo pipefail
          udid=$(cat /tmp/kangoshi-shot-udid)
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          rm -rf /tmp/KangoshiScreens.xcresult /tmp/kangoshi-screens
          set -o pipefail
          xcodebuild test \
            -project kangoshi-sprint/ios/KangoshiSprint.xcodeproj \
            -scheme KangoshiSprint \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:KangoshiSprintUITests/KangoshiScreenshotUITests/testCaptureAppStoreScreens \
            -resultBundlePath /tmp/KangoshiScreens.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcpretty
          mkdir -p /tmp/kangoshi-screens
          xcrun xcresulttool export attachments \
            --path /tmp/KangoshiScreens.xcresult \
            --output-path /tmp/kangoshi-screens
          find /tmp/kangoshi-screens -type f -maxdepth 2 -print
          count=$(find /tmp/kangoshi-screens -type f \( -name '*.png' -o -name '*.jpeg' \) | wc -l | tr -d ' ')
          test "$count" -ge 5
          grep -q '04-premium' /tmp/kangoshi-screens/manifest.json
      - name: Write screenshot manifest
        run: |
          device=$(cat /tmp/kangoshi-shot-device)
          printf 'device=%s\ncreated=2026-08-23\nflow=home,question,mock,premium,settings\n' "$device" > /tmp/kangoshi-screens/manifest.txt
      - name: Prepare App Store metadata and review assets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 scripts/app2_009_kangoshi_store_prepare.py \
            --screens /tmp/kangoshi-screens \
            --output /tmp/app2-009-store-prepare-result.json
      - name: Persist sanitized App Store preparation result
        run: |
          cp /tmp/app2-009-store-prepare-result.json /tmp/store-result.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/chatgpt-dispatcher/app-development-2/evidence
          cp /tmp/store-result.json automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-store-prepare-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-store-prepare-result.json
          git commit -m 'APP2-009: persist App Store preparation result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: kangoshi-appstore-screenshots
          path: /tmp/kangoshi-screens
          if-no-files-found: error
      - name: Report issue result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-009 App Store asset preparation finished. status=${{ job.status }}; run_id=${context.runId}`});
