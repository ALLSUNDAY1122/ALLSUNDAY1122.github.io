name: Temporary Sync North Eight

on:
  push:
    branches: [region/north]
    paths:
      - .github/workflows/temp-sync-north-eight.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/north
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update north state
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/regions/north.json';
          const state = JSON.parse(fs.readFileSync(path, 'utf8'));
          state.currentMunicipalityCode = '01408';
          state.currentMunicipalityName = '余市町';
          state.currentStage = 'not_started';
          state.completedServiceCount = 0;
          state.pendingServices = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          state.workingBranch = null;
          state.pullRequestNumber = null;
          state.ciStatus = 'not_started';
          state.blockers = [];
          state.lastAction = 'せたな町（01371）から京極町（01399）までの10自治体を全国統合PR #384・生成更新PR #386で公開184自治体へ同期。その後、倶知安町（01400）から積丹町（01405）までの6自治体に加え、古平町（01406）をPR #402・CI run #860、仁木町（01407）をPR #406・CI run #869でregion/northへ地方統合した。';
          state.nextAction = '余市町（01408）の既存task・ブランチ・PR重複を確認し、未着手なら最新region/northからtaskと作業ブランチを作成して必須9制度を一括調査する。';
          state.updatedAt = '2026-07-22T02:24:00+09:00';
          state.completedMunicipalitiesSinceLastNationalMerge = 8;
          fs.writeFileSync(path, JSON.stringify(state));
          NODE
          rm .github/workflows/temp-sync-north-eight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/regions/north.json .github/workflows/temp-sync-north-eight.yml
          git commit -m 'ops: 北日本8自治体完了と余市町を記録'
          git push origin region/north
