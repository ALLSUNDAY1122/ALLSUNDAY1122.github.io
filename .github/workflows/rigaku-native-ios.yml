name: Rigaku Native iOS Quality Gate

on:
  pull_request:
    paths:
      - 'rigaku-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/rigaku-native-ios.yml'

permissions:
  contents: read

concurrency:
  group: rigaku-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-static-and-core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Static native audit
        run: python3 rigaku-sprint/ios/static_audit.py

      - name: Privacy manifest and Required Reason API audit
        run: python3 rigaku-sprint/ios/privacy_audit.py

      - name: Official 600-slot and scoring audit
        run: python3 rigaku-sprint/product-content/validate_exam_structure.py

      - name: Official 600-answer audit
        run: python3 rigaku-sprint/product-content/validate_official_answers.py

      - name: Audited question batches
        run: python3 rigaku-sprint/product-content/validate_question_batches.py

      - name: Evidence specificity audit
        run: python3 rigaku-sprint/product-content/validate_evidence_quality.py

      - name: Classification summary
        run: python3 rigaku-sprint/product-content/summarize_classification.py

      - name: Swift syntax parse
        run: |
          swiftc -frontend -parse \
            rigaku-sprint/ios/Sources/*.swift \
            rigaku-sprint/ios/Tests/*.swift

      - name: Shared LearningSprintCore tests
        working-directory: native-ios/LearningSprintCore
        run: swift test

      - name: Confirm v2.5 canonical identifiers
        run: |
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.rigakuryouhoushi' rigaku-sprint/ios/project.yml
          grep -F 'RigakuPremiumProductID: jp.allsunday1122.rigakuryouhoushi.monthly' rigaku-sprint/ios/project.yml
          grep -F 'static let canonicalBundleIdentifier = "jp.allsunday1122.rigakuryouhoushi"' rigaku-sprint/ios/Sources/AppConfiguration.swift
          grep -F 'static let canonicalMonthlyProductID = "jp.allsunday1122.rigakuryouhoushi.monthly"' rigaku-sprint/ios/Sources/AppConfiguration.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec rigaku-sprint/ios/project.yml --project rigaku-sprint/ios

      - name: Build app and test bundle for iOS Simulator
        run: |
          xcodebuild \
            -project rigaku-sprint/ios/RigakuSprint.xcodeproj \
            -scheme RigakuSprint \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run iOS unit tests
        run: |
          DEVICE_ID=$(python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output([
              'xcrun', 'simctl', 'list', 'devices', 'available', '-j'
          ]))
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator found')
          PY
          )
          xcodebuild \
            -project rigaku-sprint/ios/RigakuSprint.xcodeproj \
            -scheme RigakuSprint \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
