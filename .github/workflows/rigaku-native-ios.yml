name: Rigaku Native iOS Quality Gate

on:
  pull_request:
    paths:
      - 'rigaku-sprint/**'
      - 'native-ios/LearningSprintCore/**'
      - '.github/workflows/rigaku-native-ios.yml'

concurrency:
  group: rigaku-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-static-and-core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Static native audit
        run: python3 rigaku-sprint/ios/static_audit.py

      - name: Official 600-slot and scoring audit
        run: python3 rigaku-sprint/product-content/validate_exam_structure.py

      - name: Official 600-answer audit
        run: python3 rigaku-sprint/product-content/validate_official_answers.py

      - name: Audited question batches
        run: python3 rigaku-sprint/product-content/validate_question_batches.py

      - name: Classification summary
        run: python3 rigaku-sprint/product-content/summarize_classification.py

      - name: Swift syntax parse
        run: |
          swiftc -frontend -parse \
            rigaku-sprint/ios/Sources/*.swift \
            rigaku-sprint/ios/Tests/*.swift

      - name: Shared LearningSprintCore tests
        working-directory: native-ios/LearningSprintCore
        run: swift test

      - name: Confirm unresolved identifiers remain external
        run: |
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: $(RIGAKU_BUNDLE_ID)' rigaku-sprint/ios/project.yml
          ! grep -R -E 'jp\.allsunday1122\.rigaku(sprint)?(\.premium)?' \
            rigaku-sprint/ios/Sources \
            rigaku-sprint/ios/Tests \
            rigaku-sprint/ios/project.yml \
            rigaku-sprint/product-content
