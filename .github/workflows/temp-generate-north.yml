name: Temp Generate North
on:
  push:
    branches: [coord/generated-north-10-20260721]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated
      - run: |
          node -e "const fs=require('fs'); const p='jichitai-compare/data/generated/municipalities.json'; const n=JSON.parse(fs.readFileSync(p,'utf8')).meta.municipalityCount; const i='jichitai-compare/index.html'; let s=fs.readFileSync(i,'utf8'); s=s.replace(/\d+自治体・9制度/g,n+'自治体・9制度').replace(/登録状況：\d+自治体の生成データを公開中/g,'登録状況：'+n+'自治体の生成データを公開中'); fs.writeFileSync(i,s);"
          rm .github/workflows/temp-generate-north.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html .github/workflows/temp-generate-north.yml
          git commit -m "生成更新: 北日本10自治体統合後を反映 [skip ci]"
          git push
