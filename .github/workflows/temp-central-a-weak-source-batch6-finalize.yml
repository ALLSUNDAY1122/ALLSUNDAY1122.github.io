name: Temporary Central A Weak Source Batch 6 Finalize

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch6-finalize-trigger-20260727.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-weak-source-batch6-final-region-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- jichitai-compare/operations/audits/central-a-weak-primary-source-batch6-public-verification-20260727.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const updatedAt='2026-07-27T06:39:00+09:00';
          const regionalPr=4037;
          const regionalRun=30221013836;
          const nationalPr=4039;
          const nationalRun=30221115967;
          const publicPr=4041;
          const publicRun=30221234717;
          const finalRegionPr=Number(process.env.PR_NUMBER);
          const finalRegionRun=Number(process.env.RUN_ID);
          const decisionPath=path.join(root,'operations/audits/central-a-weak-primary-source-batch6-decisions-20260727.json');
          const decision=JSON.parse(fs.readFileSync(decisionPath,'utf8'));
          Object.assign(decision,{status:'completed_public_verified_region_integrated',nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun,completedAt:updatedAt,blocker:null});
          fs.writeFileSync(decisionPath,JSON.stringify(decision,null,2)+'\n');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;checkpoint.status='completed';checkpoint.pullRequestNumber=finalRegionPr;checkpoint.ciStatus='success';checkpoint.nextAction='弱い主出典残3件を公式情報で確認し、利用者向け直接ページまたは要綱と利用導線の組合せへ改善する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          const q=checkpoint.qualityReaudit;q.latestCompletedAt=updatedAt;q.latestRegionalPullRequestNumber=regionalPr;q.latestCiRunNumber=regionalRun;q.latestNationalPullRequestNumber=nationalPr;q.latestPublicVerificationPullRequestNumber=publicPr;q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??0),257);q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??0),693);q.candidateCounts.weakPrimarySource=3;q.latestWeakSourceBatch={batch:6,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:0,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,unavailableConfirmedCount:2,contentCorrectionCount:0,remainingCandidates:3,regionalPullRequestNumber:regionalPr,regionalWorkflowRunId:regionalRun,nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun,blocker:null};checkpoint.lastAction='弱い主出典第6群5制度を地域・全国・公開で一致確認し、3制度の利用導線を補強、2自治体のunavailable判定を再確認した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const publicAudit=JSON.parse(fs.readFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch6-public-verification-20260727.json'),'utf8'));
          const resolution={schemaVersion:'1.0.0',resolutionId:'central-a-weak-source-batch6-resolution-20260727',session:'中日本調査班A',completedAt:updatedAt,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:0,authoritativeSourceRetainedWithNavigationCount:3,directUserPageMaintainedCount:0,unavailableConfirmedCount:2,contentCorrectionCount:0,remainingWeakPrimarySourceCandidates:3,correctedMunicipalitiesRechecked:257,primarySourceSlotsRechecked:693,issue3141UnresolvedItemCount:19,publishedMunicipalityCount:publicAudit.publishedMunicipalityCount,publishedServiceCount:publicAudit.publishedServiceCount,evidence:{regionalPullRequestNumber:regionalPr,regionalWorkflowRunId:regionalRun,nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun},publicVerification:{status:publicAudit.status,pageCount:publicAudit.pageChecks.length,serviceCount:publicAudit.serviceChecks.length,attempt:publicAudit.attempt},temporaryRunnerCleanup:{regional:true,main:false},blocker:null};fs.writeFileSync(path.join(root,'operations/quality/central-a-weak-source-batch6-resolution-20260727.json'),JSON.stringify(resolution,null,2)+'\n');
          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));recovery.status='active_queue_batch6_completed_public_verified';recovery.lastCompletedBatch=6;recovery.lastCompletedAt=updatedAt;recovery.queueCount=Array.isArray(recovery.queue)?recovery.queue.length:3;recovery.nextBatch=Array.isArray(recovery.queue)?recovery.queue.slice(0,5):[];fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch6-finalize-trigger-20260727.json
          rm -f .github/workflows/temp-central-a-weak-source-batch6.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch6-finalize.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run check
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第6群を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
