name: Scaniverse Build 10 Codemagic Gate

on:
  push:
    branches:
      - testflight/splat-native-ios-20260830-build10
    paths:
      - .github/workflows/scaniverse-build10-codemagic.yml

permissions:
  contents: read

jobs:
  build10:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_APP_ID: 6a769d81a1add9d06020b524
      CM_WORKFLOW_ID: splat-native-ios
      CM_BRANCH: testflight/splat-native-ios-20260830-build10
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and verify Codemagic Build 10
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM_API_TOKEN:-}"
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          app_id=os.environ['CM_APP_ID']
          workflow=os.environ['CM_WORKFLOW_ID']
          branch=os.environ['CM_BRANCH']
          expected_commit=os.environ['EXPECTED_COMMIT']
          out=Path('/tmp/scaniverse-build10-codemagic.json')

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={
                  'Content-Type':'application/json','Accept':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          status,payload=api('https://api.codemagic.io/builds','POST',{
              'appId':app_id,'workflowId':workflow,'branch':branch})
          if not 200 <= status < 300:
              raise SystemExit(f'Codemagic start failed HTTP {status}: {payload}')
          build_id=payload.get('buildId') or payload.get('id')
          if not build_id:
              raise SystemExit(f'No Codemagic build id: {payload}')
          result={'ok':False,'build_id':build_id,'status':'started','workflow':workflow,'branch':branch,'expected_commit':expected_commit}
          out.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD10_CODEMAGIC_STARTED',build_id)

          terminal={'finished','failed','canceled','timeout','skipped'}
          details={}
          deadline=time.time()+7200
          while time.time() < deadline:
              code,detail=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= code < 300:
                  raise SystemExit(f'Codemagic inspect failed HTTP {code}: {detail}')
              details=detail.get('data') or detail
              state=details.get('status')
              observed_commit=details.get('commit') or details.get('commitId')
              result['status']=state
              result['commit']=observed_commit
              result['started_at']=details.get('startedAt') or details.get('started_at')
              result['finished_at']=details.get('finishedAt') or details.get('finished_at')
              out.write_text(json.dumps(result,indent=2)+'\n')
              print('BUILD10_CODEMAGIC_STATUS',state,'commit',observed_commit)
              if state in terminal:
                  break
              time.sleep(15)
          else:
              raise SystemExit('Codemagic Build 10 timed out')

          if details.get('status')!='finished':
              result['error']='Codemagic Build 10 ended '+str(details.get('status'))
              out.write_text(json.dumps(result,indent=2)+'\n')
              raise SystemExit(result['error'])
          observed_commit=details.get('commit') or details.get('commitId')
          if observed_commit and observed_commit != expected_commit:
              result['error']=f'Codemagic built unexpected commit {observed_commit}, expected {expected_commit}'
              out.write_text(json.dumps(result,indent=2)+'\n')
              raise SystemExit(result['error'])
          result['ok']=True
          result['status']='finished'
          result['artifact_names']=[a.get('name') for a in (details.get('artifacts') or [])]
          out.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD10_CODEMAGIC_FINISHED',build_id)
          PY
      - name: Upload Build 10 Codemagic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaniverse-build10-codemagic-${{ github.run_id }}
          path: /tmp/scaniverse-build10-codemagic.json
          if-no-files-found: warn
          retention-days: 14
