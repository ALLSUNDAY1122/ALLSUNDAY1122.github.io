name: APP2-008 IT Passport Inspect Codemagic Build

on:
  push:
    branches:
      - main
    paths:
      - automation/app2-008-itpass-inspect-command.json

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Codemagic build and actions
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          command=json.loads(Path('automation/app2-008-itpass-inspect-command.json').read_text())
          token=os.environ['CM_API_TOKEN'].strip(); build_id=command['build_id']; request_id=command['request_id']
          def get(url):
              req=urllib.request.Request(url,headers={'x-auth-token':token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {'http_status':e.code,'error':e.read().decode('utf-8',errors='replace')[:4000]}
          result={'request_id':request_id,'build_id':build_id,'build':get(f'https://codemagic.io/api/v3/builds/{build_id}'),'actions':get(f'https://codemagic.io/api/v3/builds/{build_id}/actions')}
          out=Path('automation/codemagic-results')/f'{request_id}.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REQUEST_ID="$(python -c "import json; print(json.load(open('automation/app2-008-itpass-inspect-command.json'))['request_id'])")"
          RESULT="automation/codemagic-results/${REQUEST_ID}.json"
          git add "$RESULT"
          git commit -m "Persist IT Passport Codemagic inspection ${REQUEST_ID}" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
