name: Otsu4 Release Contract Reconcile

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTSU4-CONTRACT-RECONCILE]')
    runs-on: ubuntu-latest
    env:
      RELEASE_SOURCE_SHA: 8912ef194955900ee4d64b17d37910b7a2931eb8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify pinned release contract
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$RELEASE_SOURCE_SHA"
          git show "$RELEASE_SOURCE_SHA:native-ios/Otsu4Sprint/Generated/questions.generated.json" > /tmp/otsu4-questions.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/otsu4-questions.json', encoding='utf-8'))
          qs=data['questions']
          assert len(qs)==360, len(qs)
          sets={q.get('mockExamSet') for q in qs if q.get('mockExamSet') is not None}
          assert max(sets, default=3) <= 3, sets
          print('PASS pinned release contract: 360 questions / 3 mock sets')
          PY
      - name: Reconcile stale 720/6 metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path('scripts/app2_007_otsu4_iap_bootstrap.py'),
            Path('scripts/app2_007_otsu4_submit_prep.py'),
            Path('scripts/app2_007_otsu4_finalize_submit.py'),
            Path('kikenbutsu-otsu4-sprint/support.html'),
          ]
          changed=[]
          for p in paths:
            s=p.read_text(encoding='utf-8')
            before=s
            s=s.replace('全720問・模擬試験6回', '全360問・模擬試験3回')
            s=s.replace('合計720問を収録しています。', '合計360問を収録しています。')
            # Old support page subject counts belonged to the superseded 720-question bank.
            s=s.replace('法令288問、物理・化学192問、性質・消火240問の合計360問', '法令・物理化学・性質消火の3分野、合計360問')
            if s != before:
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          if not changed:
            raise SystemExit('No stale 720/6 metadata found; refusing no-op mutation')
          print('changed:', *changed, sep='\n- ')
          PY
      - name: Fail if stale release claims remain
        run: |
          set -euo pipefail
          if grep -R -n -E '全720問|合計720問|模擬試験6回|法令288問|物理・化学192問|性質・消火240問' \
            scripts/app2_007_otsu4_iap_bootstrap.py \
            scripts/app2_007_otsu4_submit_prep.py \
            scripts/app2_007_otsu4_finalize_submit.py \
            kikenbutsu-otsu4-sprint/support.html; then
            echo 'stale Otsu4 release contract remains' >&2
            exit 1
          fi
      - name: Commit reconciled contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/app2_007_otsu4_iap_bootstrap.py scripts/app2_007_otsu4_submit_prep.py scripts/app2_007_otsu4_finalize_submit.py kikenbutsu-otsu4-sprint/support.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected contract diff missing' >&2; exit 1; }
          git commit -m 'fix(otsu4): align release metadata with 360-question product'
          git push origin HEAD:main
      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Otsu4 release contract reconcile finished. status=${{ job.status }}; run_id=${context.runId}; pinned_source=${process.env.RELEASE_SOURCE_SHA}. No TestFlight or App Store submission was performed.`
            })
