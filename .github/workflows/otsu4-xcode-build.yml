name: Otsu4 Xcode Build

on:
  pull_request:
    paths:
      - 'native-ios/Otsu4Sprint/**'
      - 'kikenbutsu-otsu4-sprint/question-bank-v2*.js'
      - 'tools/otsu4-build-content-v2.mjs'
      - '.github/workflows/otsu4-xcode-build.yml'
  push:
    branches: [ feat/otsu4-360-productization ]
    paths:
      - 'native-ios/Otsu4Sprint/**'
      - 'kikenbutsu-otsu4-sprint/question-bank-v2*.js'
      - 'tools/otsu4-build-content-v2.mjs'
      - '.github/workflows/otsu4-xcode-build.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate privacy manifest plist
        run: plutil -lint native-ios/Otsu4Sprint/PrivacyInfo.xcprivacy
      - name: Generate Xcode project
        working-directory: native-ios/Otsu4Sprint
        run: xcodegen generate
      - name: Build iPhone Simulator app
        working-directory: native-ios/Otsu4Sprint
        run: |
          set -o pipefail
          xcodebuild \
            -project Otsu4Sprint.xcodeproj \
            -scheme Otsu4Sprint \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
      - name: Verify bundled content and privacy manifest
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/Otsu4Sprint.app' -type d | head -1)
          test -n "$APP"
          test -f "$APP/questions.generated.json"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/bin/python3 - <<'PY' "$APP/questions.generated.json"
          import json,sys
          p=sys.argv[1]
          data=json.load(open(p,encoding='utf-8'))
          assert len(data['questions'])==360
          print('bundle questions=',len(data['questions']))
          PY
