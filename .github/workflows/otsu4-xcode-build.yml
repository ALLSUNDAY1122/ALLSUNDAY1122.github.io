name: Otsu4 Xcode Build

on:
  pull_request:
    paths:
      - 'native-ios/Otsu4Sprint/**'
      - 'kikenbutsu-otsu4-sprint/question-bank-v2*.js'
      - 'tools/otsu4-build-content-v2.mjs'
      - '.github/workflows/otsu4-xcode-build.yml'
  push:
    branches: [ feat/otsu4-360-productization ]
    paths:
      - 'native-ios/Otsu4Sprint/**'
      - 'kikenbutsu-otsu4-sprint/question-bank-v2*.js'
      - 'tools/otsu4-build-content-v2.mjs'
      - '.github/workflows/otsu4-xcode-build.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Foundation-only notice
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') == '' }}
        run: echo 'Otsu4 Xcode project files are not present yet; simulator build will run on the product PR.'
      - name: Install XcodeGen
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: brew install xcodegen
      - name: Validate privacy manifest plist
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: plutil -lint native-ios/Otsu4Sprint/PrivacyInfo.xcprivacy
      - name: Prepare audited native resources
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: bash native-ios/Otsu4Sprint/prepare-ios.sh
      - name: Generate Xcode project
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        working-directory: native-ios/Otsu4Sprint
        run: xcodegen generate
      - name: Build iPhone Simulator app
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        working-directory: native-ios/Otsu4Sprint
        run: |
          set -o pipefail
          xcodebuild \
            -project Otsu4Sprint.xcodeproj \
            -scheme Otsu4Sprint \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
      - name: Verify release bundle resources and canonical identifiers
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/Otsu4Sprint.app' -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          find "$APP" -maxdepth 2 -type f -print | sort
          test -f "$APP/questions.generated.json"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          plutil -p "$APP/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "jp.allsunday1122.otsu4"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "1.0.0"
          test "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")" = "1"
          /usr/bin/python3 - "$APP/questions.generated.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          data=json.load(open(p,encoding='utf-8'))
          assert data['contentVersion']=='otsu4-2026-08-product-v2'
          assert len(data['questions'])==360
          print('bundle questions=',len(data['questions']))
          PY
      - name: Select small and large iPhone simulators
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: |
          python3 - <<'PY' > /tmp/otsu4-simulators.txt
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[]
          for runtime, rows in sorted(data.get('devices',{}).items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for row in rows:
                  name=row.get('name','')
                  if row.get('isAvailable', True) and name.startswith('iPhone'):
                      devices.append((name,row['udid']))
          by_name={}
          for name,udid in devices:
              by_name.setdefault(name,udid)
          if len(by_name) < 2:
              raise SystemExit('Need at least two available iPhone simulator sizes')
          def choose(tokens, excluded=set()):
              for token in tokens:
                  for name,udid in by_name.items():
                      if token in name and udid not in excluded:
                          return name,udid
              for name,udid in by_name.items():
                  if udid not in excluded:
                      return name,udid
              raise SystemExit('No simulator available')
          small=choose(['16e','SE (3rd generation)','15','16'])
          large=choose(['17 Pro Max','Pro Max','Plus'], {small[1]})
          print(f'{small[0]}|{small[1]}')
          print(f'{large[0]}|{large[1]}')
          PY
          cat /tmp/otsu4-simulators.txt
      - name: Boot selected iPhone simulators
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          while IFS='|' read -r NAME UDID; do
            echo "Booting $NAME ($UDID)"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
          done < /tmp/otsu4-simulators.txt
      - name: Run native unit tests
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        timeout-minutes: 10
        working-directory: native-ios/Otsu4Sprint
        run: |
          set -euo pipefail
          FIRST=$(head -1 /tmp/otsu4-simulators.txt)
          UDID=${FIRST##*|}
          set -o pipefail
          xcodebuild test \
            -project Otsu4Sprint.xcodeproj \
            -scheme Otsu4Sprint \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -destination-timeout 60 \
            -only-testing:Otsu4SprintTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 | xcpretty
      - name: Run UI tests on small and large iPhone sizes
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        timeout-minutes: 20
        working-directory: native-ios/Otsu4Sprint
        run: |
          set -euo pipefail
          while IFS='|' read -r NAME UDID; do
            echo "UI testing on $NAME ($UDID)"
            set -o pipefail
            xcodebuild test \
              -project Otsu4Sprint.xcodeproj \
              -scheme Otsu4Sprint \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -destination-timeout 60 \
              -only-testing:Otsu4SprintUITests \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 90 \
              -maximum-test-execution-time-allowance 180 | xcpretty
          done < /tmp/otsu4-simulators.txt
      - name: Enforce canonical App Store icon SHA
        if: ${{ hashFiles('native-ios/Otsu4Sprint/project.yml') != '' }}
        run: |
          set -euo pipefail
          ICON=native-ios/Otsu4Sprint/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          EXPECTED=d0cb19b237ca3306413c481e4fbc0fb871705b390a1bc37619d9683fff19ff2d
          ACTUAL=$(shasum -a 256 "$ICON" | awk '{print $1}')
          echo "canonical=$EXPECTED"
          echo "built=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"