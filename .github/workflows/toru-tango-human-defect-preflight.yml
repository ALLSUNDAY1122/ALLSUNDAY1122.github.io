name: Toru Tango Human Defect Preflight
on:
  push:
    branches: [main]
    paths:
      - 'toru-tango-mobile/**'
      - '.github/workflows/toru-tango-human-defect-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies for preflight
        run: npm install --package-lock=false --ignore-scripts
      - name: Human defect interaction regression gate
        run: npm run interaction-gate
      - name: Typecheck with retained diagnostics
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-typecheck-${{ github.run_id }}
          path: toru-tango-mobile/typecheck.log
      - name: Fail closed on typecheck
        if: steps.typecheck.outcome != 'success'
        run: exit 1
      - name: Lint
        run: npm run lint
      - name: Expo doctor
        run: npm run doctor
