name: Temporary Coordinator Live Reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-coord-reconcile-live-20260722-1631.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile control state and self-delete
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          now='2026-07-22T16:31:00+09:00'
          regions=('north','east','central','west')
          state_fields={
            'north':'completedMunicipalitiesSinceLastNationalMerge',
            'east':'completedMunicipalitiesSinceLastNationalMerge',
            'central':'completedSinceLastRelease',
            'west':'completedMunicipalitiesSinceLastNationalMerge',
          }
          def show(ref,path):
            return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
            n=int(pref)
            return {
              'north':1 <= n <= 7,
              'east':8 <= n <= 15 or n in (19,20),
              'central':16 <= n <= 18 or 21 <= n <= 29,
              'west':31 <= n <= 47,
            }[region]

          states={}
          counts={}
          items_by_region={}
          pending={}
          for region in regions:
            ref=f'origin/region/{region}'
            states[region]=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
            pending[region]=int(states[region].get(state_fields[region],0))
            paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
            items=[]
            for path in paths:
              if not re.search(r'/\d{5}\.json$',path):
                continue
              data=json.loads(show(ref,path))
              if belongs(region,data['prefectureCode']):
                items.append({'code':data['code'],'name':data['name']})
            items.sort(key=lambda x:x['code'])
            items_by_region[region]=items
            counts[region]=len(items)

          total=sum(counts.values())
          ready=[r for r in regions if pending[r] >= 10]
          open_prs=json.loads(subprocess.check_output(['gh','pr','list','--state','open','--limit','100','--json','number,baseRefName,isDraft,title'],text=True))
          municipality_prs=[p for p in open_prs if p['baseRefName'] in ('region/north','region/east','region/central','region/west')]
          unrelated=[p['number'] for p in open_prs if p['baseRefName'] not in ('region/north','region/east','region/central','region/west')]

          queue_path=Path('jichitai-compare/operations/control/release-queue.json')
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          by={e['region']:e for e in queue['entries']}
          for region in regions:
            entry=by[region]
            entry['municipalities']=items_by_region[region]
            entry['count']=counts[region]
            entry['pendingSinceLastRelease']=pending[region]
            entry['releaseStatus']='release_ready' if pending[region] >= 10 else 'pending_threshold'
            entry['reason']=f'最新地方ブランチを再走査。前回全国統合後の繰越は{pending[region]}自治体'
            entry['mainIntegrationPr']=states[region].get('lastNationalIntegrationPr')
            entry['generatedPullRequest']=720
            entry['auditStatus']='passed'
          queue['updatedAt']=now
          queue['status']='active'
          queue['summary']={
            'regionalMergedMunicipalities':total,
            'latestGeneratedMunicipalityCount':454,
            'latestGeneratedPullRequest':720,
            'latestPublicCountPullRequest':720,
            'releaseReadyRegions':ready,
            'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          }
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          global_path=Path('jichitai-compare/operations/control/global-state.json')
          global_state=json.loads(global_path.read_text(encoding='utf-8'))
          global_state['updatedAt']=now
          global_state['phase']='release-monitoring'
          global_state['regionalCompletedSinceLastRelease']={**pending,'total':sum(pending.values())}
          global_state['priority']={
            'type':'release-monitoring',
            'nextAction':f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。" + ('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          }
          latest_region=max(regions,key=lambda r:states[r].get('lastNationalIntegrationAt') or '')
          global_state['lastNationalIntegrationAt']=states[latest_region].get('lastNationalIntegrationAt')
          global_state['lastNationalIntegrationPr']=states[latest_region].get('lastNationalIntegrationPr')
          global_state['latestGeneratedMunicipalityCount']=454
          global_state['latestGeneratedPullRequest']=720
          global_state['latestPublicCountPullRequest']=720
          global_state['regionalMergedMunicipalities']=total
          global_state['openPullRequests']=[p['number'] for p in municipality_prs]
          global_state['humanDecisionRequired']=False
          global_path.write_text(json.dumps(global_state,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          progress=json.loads(Path('jichitai-compare/operations/progress.json').read_text(encoding='utf-8'))
          record={
            'timestamp':now,
            'actor':'全国進行統括',
            'action':'coordinator-live-reconciliation',
            'details':{
              'publicMunicipalityCount':progress['registeredMunicipalities'],
              'publicServices':progress['totalServices'],
              'regionalCounts':counts,
              'regionalMergedMunicipalities':total,
              'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},
              'releaseReadyRegions':ready,
              'openMunicipalityPullRequests':[p['number'] for p in municipality_prs],
              'ignoredUnrelatedOpenPullRequests':unrelated,
              'needsMediumReviewMunicipalities':progress['needsMediumReviewMunicipalities'],
              'blockedMunicipalities':progress['blockedMunicipalities'],
              'temporaryWorkflowFilesAfterCommit':0
            },
            'humanDecisionRequired':False
          }
          with Path('jichitai-compare/operations/control/audit-log.jsonl').open('a',encoding='utf-8') as f:
            f.write(json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps(record,ensure_ascii=False))
          PY
          rm .github/workflows/temp-coord-reconcile-live-20260722-1631.yml
          git add jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-coord-reconcile-live-20260722-1631.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 最新地方統合を公開454自治体の管理状態へ同期'
          git push origin main
