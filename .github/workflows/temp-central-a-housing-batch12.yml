name: Temporary Central A Housing Batch 12

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch12-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch12-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 12
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-25';
          const updatedAt='2026-07-25T23:29:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions={
            '21208': {
              type:'replace_with_child_specific_home_acquisition_program',
              change:true,
              service:{
                status:'verified',
                summary:'岐阜県外から転入して住宅を新築・購入する、18歳未満の子がいる世帯または夫婦の一方が40歳未満の世帯へ30万円を交付する。',
                details:{
                  program:'瑞浪市子育て世帯等移住促進奨励金',
                  amount:'30万円',
                  housing:'2026年4月1日から2029年3月31日までに住宅を新築または購入し、所有権保存登記を完了すること',
                  migration:'2026年4月1日以降に岐阜県外から転入し、転入前3年間は瑞浪市に住所がないこと',
                  household:'転入時に同一世帯の18歳未満の子がいる、または配偶者のいずれか一方が40歳未満であること等',
                  exclusion:'瑞浪市東京圏からの移住支援金との併用不可'
                },
                source:{url:'https://www.city.mizunami.lg.jp/kurashi/1008553/shoureikin/1001522.html',checkedAt},
                additionalSources:[
                  {url:'https://www.city.mizunami.lg.jp/kurashi/1008553/shoureikin/1011635.html',checkedAt,description:'2026年度結婚新生活応援支援金'},
                  {url:'https://www.city.mizunami.lg.jp/kurashi/1008553/shoureikin/1001516.html',checkedAt,description:'東京圏移住支援金。18歳未満世帯員を帯同する世帯へ30万円加算'}
                ]
              }
            },
            '21521': {
              type:'general_young_household_migration_misclassification',
              change:true,
              service:{
                status:'unavailable',
                summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details:{
                  confirmedGeneralProgram:'39歳以下で2人以上の世帯を構成し、岐阜県外から移住する方へ25万円を交付する御嵩町移住支援補助金を実施する。',
                  classificationReview:'年齢と世帯人数を要件とする一般移住支援で、子どもの有無、新婚世帯、住宅取得・改修・家賃費用を固有要件とする制度ではないため、子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.town.mitake.lg.jp/portal/town/measure/other-various-plan/post0076762/',checkedAt},
                additionalSources:[{url:'https://www.town.mitake.lg.jp/portal/town/measure/other-various-plan/post0072709/',checkedAt,description:'御嵩町の現行移住制度一覧'}]
              }
            },
            '22209': {type:'retained_verified_child_addition_intake_closed',change:false,review:'2026年度中古住宅購入奨励金には中学生以下の子との同居で上限10万円の子育て加算がある。予算到達により2026年度受付終了であることも現行公式ページに明記されており、制度内容のverifiedは維持する。'},
            '23207': {type:'retained_verified_child_incentive',change:false,review:'都市機能誘導区域内の住宅取得世帯に対し、中学生以下の子1人につき10万円の子育て奨励金を交付する現行制度を確認したためverifiedを維持する。'},
            '22225': {type:'retained_verified_child_migration_addition',change:false,review:'2026年度移住・就業支援金は18歳未満の世帯員1人につき100万円を加算する現行条件を確認したためverifiedを維持する。'}
          };

          const records=[];
          for(const [code,entry] of Object.entries(decisions)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(entry.change){
              municipality.services.housingSupport=entry.service;
              municipality.updatedAt=checkedAt;
              fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');
            }

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-25: 住宅支援分類第12群で公式情報を独立確認し、${entry.type}として判定。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');

            const after=municipality.services.housingSupport;
            records.push({code,name:municipality.name,service:'housingSupport',decisionType:entry.type,changed:entry.change,beforeStatus:before.status,afterStatus:after.status,beforeSummary:before.summary,afterSummary:after.summary,officialSource:after.source.url,review:entry.review||null});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch12-decisions-20260725',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B②',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:2,
            retainedNoChangeCount:3,
            statusToUnavailableCount:1,
            verifiedReplacementCount:1,
            decisions:records,
            causeScan:{previousRemainingCandidates:119,reviewedHighRiskCandidates:5,remainingCandidates:114},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般移住制度は年齢・世帯人数だけで子育て住宅支援に分類しない',
              '子育て世帯向け住宅取得制度が別にある場合は、一般制度や新婚制度より直接的な現行制度を主出典とする',
              '子ども加算を現行公式本文で確認できる制度は、受付終了等の運用状態を明記した上で制度内容のverifiedを維持する'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch12-decisions-20260725.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残114件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=114;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=546;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=114;
          checkpoint.qualityReaudit.confirmedCorrections.push(
            {type:'child_specific_home_acquisition_replacement',code:'21208',service:'housingSupport',name:'瑞浪市'},
            {type:'general_young_household_migration_misclassification',code:'21521',service:'housingSupport',name:'御嵩町'}
          );
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残114件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.lastAction='住宅支援分類第12群で瑞浪市を子育て世帯等住宅取得30万円へ差し替え、御嵩町の一般移住制度をunavailableへ修正。島田市・豊川市・伊豆の国市は現行の子ども加算を再確認してverifiedを維持した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch={batch:12,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,correctedMunicipalityCount:2,retainedMunicipalityCount:3,remainingCandidates:114,regionalPullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),blocker:null};
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch12-trigger-20260725.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/21/21208.json|jichitai-compare/data/municipalities/21/21521.json|jichitai-compare/operations/tasks/21208.json|jichitai-compare/operations/tasks/21521.json|jichitai-compare/operations/tasks/22209.json|jichitai-compare/operations/tasks/22225.json|jichitai-compare/operations/tasks/23207.json|jichitai-compare/operations/audits/central-a-housing-classification-batch12-decisions-20260725.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/21208/index.html|jichitai-compare/municipality/21521/index.html|jichitai-compare/operations/control/central-a-housing-batch12-trigger-20260725.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第12群を判定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
