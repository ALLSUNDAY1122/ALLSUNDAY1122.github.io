name: Temporary Central A Housing Batch 12

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch12-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch12-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 12
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T01:31:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const corrections={
            '21208':{
              type:'replace_with_child_household_home_acquisition_program',
              service:{
                status:'verified',
                summary:'岐阜県外から移住して住宅を新築・購入する、18歳未満の子がいる世帯または夫婦の一方が40歳未満の世帯へ30万円を交付する。',
                details:{
                  program:'瑞浪市子育て世帯等移住促進奨励金',
                  amount:'30万円',
                  housingCondition:'2026年4月1日から2029年3月31日までに市内住宅を新築または購入し、所有権保存登記を完了すること',
                  migrationCondition:'2026年4月1日以降に岐阜県外から転入し、転入前3年間は瑞浪市に住所がないこと',
                  householdCondition:'転入時に同一世帯に18歳未満の子がいる、または申請者に配偶者がいて夫婦の一方が40歳未満であること',
                  residenceCondition:'申請日から5年以上継続して市内に居住する意思、自治会加入、市税等の滞納なし等が必要',
                  combination:'瑞浪市東京圏からの移住支援金との併用不可'
                },
                source:{url:'https://www.city.mizunami.lg.jp/kurashi/1008553/shoureikin/1001522.html',checkedAt},
                additionalSources:[{url:'https://iju.city.mizunami.lg.jp/living/topics/',checkedAt,description:'住まいに関する支援制度一覧と対象要件の概要'}]
              }
            },
            '21521':{
              type:'general_migration_misclassification',
              service:{
                status:'unavailable',
                summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details:{
                  confirmedGeneralProgram:'令和7年4月1日以降に岐阜県外から転入した39歳以下かつ2人以上世帯へ25万円の移住支援補助金を交付する。',
                  classificationReview:'年齢と世帯人数を要件とする一般移住支援であり、子どもの有無、新婚、住宅取得・改修・家賃費用を対象とする固有条件を現行公式本文で確認できないため、子育て世帯向け住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.town.mitake.lg.jp/portal/town/measure/other-various-plan/post0076762/',checkedAt}
              }
            },
            '22209':{
              type:'replace_closed_purchase_program_with_current_newlywed_program',
              service:{
                status:'verified',
                summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',
                details:{
                  program:'島田市結婚新生活支援補助金',
                  target:'2026年1月1日以後に婚姻届等が受理され、夫婦等がともに39歳以下、合計所得500万円未満等の要件を満たす世帯',
                  covered:'市内住宅の取得、リフォーム、賃借、引越費用',
                  amount:'夫婦等がともに29歳以下は上限60万円、それ以外の39歳以下は上限30万円',
                  expensePeriod:'2026年4月1日から2027年3月10日までに支払った対象費用',
                  applicationDeadline:'2027年3月10日まで。予算上限に達した場合は年度途中で終了する場合がある',
                  replacementReason:'登録していた2026年度中古住宅購入奨励金は予算額到達により受付終了したため、受付中の現行新婚住宅費支援へ差し替えた。'
                },
                source:{url:'https://www.city.shimada.shizuoka.jp/kurashi-docs/kekkonsinseikatsusien.html',checkedAt},
                additionalSources:[{url:'https://www.city.shimada.shizuoka.jp/kurashi-docs/chyukojutakukounyuusyoureikin.html',checkedAt,description:'旧主制度の2026年度受付終了確認'}]
              }
            }
          };
          const noChanges=[
            {code:'23207',name:'豊川市',reason:'中学生以下の子1人につき10万円の子育て奨励金が現行公式ページと2026年5月広報で確認でき、登録内容と一致する。',expectedSource:'https://www.city.toyokawa.lg.jp/shisei/seisaku/10/1/16698.html'},
            {code:'22225',name:'伊豆の国市',reason:'18歳未満の子1人につき100万円加算する2026年度移住・就業支援金が現行公式ページで確認でき、登録内容と一致する。',expectedSource:'https://www.city.izunokuni.shizuoka.jp/seisaku/ijuu/shiennkinn.html'}
          ];

          const corrected=[];
          for(const [code,entry] of Object.entries(corrections)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=structuredClone(municipality.services.housingSupport);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第12群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');

            corrected.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const unchanged=[];
          for(const item of noChanges){
            const municipality=JSON.parse(fs.readFileSync(path.join(root,'data/municipalities',item.code.slice(0,2),`${item.code}.json`),'utf8'));
            const service=municipality.services.housingSupport;
            if(service.status!=='verified')throw new Error(`${item.code}: expected verified`);
            if(service.source?.url!==item.expectedSource)throw new Error(`${item.code}: source changed unexpectedly`);
            unchanged.push({code:item.code,name:item.name,service:'housingSupport',status:service.status,summary:service.summary,officialSource:service.source.url,reason:item.reason});
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残114件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=114;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=546;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=114;
          checkpoint.qualityReaudit.latestHousingBatch={batch:12,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:3,noChangeCount:2,statusToUnavailableCount:1,verifiedReplacementCount:2,remainingCandidates:114,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第12群として瑞浪市・御嵩町・島田市を訂正し、豊川市・伊豆の国市は子ども加算の現行条件を再確認して維持した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch12-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:3,noChangeCount:2,statusToUnavailableCount:1,verifiedReplacementCount:2,corrected,unchanged,causeScan:{previousRemainingCandidates:119,reviewedHighRiskCandidates:5,remainingCandidates:114},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['受付終了した制度を現行のverified主制度として残さず、現在申請可能な子育て・新婚住宅費支援へ差し替える','年齢・世帯人数だけの一般移住支援は、子ども・新婚・住宅費の固有条件がなければhousingSupportのverified根拠にしない','子ども加算が現行公式本文に明記され、登録内容と一致する場合はno-changeとして証跡化する'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch12-decisions-20260726.json');
          fs.mkdirSync(path.dirname(auditPath),{recursive:true});
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch12-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/21/21208.json|jichitai-compare/data/municipalities/21/21521.json|jichitai-compare/data/municipalities/22/22209.json|jichitai-compare/operations/tasks/21208.json|jichitai-compare/operations/tasks/21521.json|jichitai-compare/operations/tasks/22209.json|jichitai-compare/operations/audits/central-a-housing-classification-batch12-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第12群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
