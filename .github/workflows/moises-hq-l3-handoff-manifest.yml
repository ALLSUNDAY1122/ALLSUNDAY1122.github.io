name: Moises HQ Lane3 Handoff Manifest

on:
  push:
    branches:
      - tech/moises-separation
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffManifest.swift'
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffHostValidator.swift'
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffSerializedPackageValidator.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffSerializedPackageSelfTest.swift'
      - '.github/workflows/moises-hq-l3-handoff-manifest.yml'
  pull_request:
    paths:
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffManifest.swift'
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffHostValidator.swift'
      - 'tech-assets/moises-audio/Playback/Sources/Lane3PhysicalEvidenceHandoffSerializedPackageValidator.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift'
      - 'tech-assets/moises-audio/Playback/Tests/L3_HQ_PhysicalEvidenceHandoffSerializedPackageSelfTest.swift'
      - '.github/workflows/moises-hq-l3-handoff-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moises-hq-l3-handoff-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-handoff-manifest-selftest:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Execute Lane 3 physical evidence handoff manifest self-test
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Playback/Tests/L3_HQ_PhysicalEvidenceHandoffManifestSelfTest.swift \
            -o /tmp/l3-hq-handoff-manifest-selftest
          /tmp/l3-hq-handoff-manifest-selftest | tee /tmp/l3-hq-handoff-manifest-selftest.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_MANIFEST_SELF_TEST_PASS ' /tmp/l3-hq-handoff-manifest-selftest.out

      - name: Execute Lane 3 serialized host handoff validator self-test
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Playback/Tests/L3_HQ_PhysicalEvidenceHandoffHostValidatorSelfTest.swift \
            -o /tmp/l3-hq-handoff-host-validator-selftest
          /tmp/l3-hq-handoff-host-validator-selftest | tee /tmp/l3-hq-handoff-host-validator-selftest.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_HOST_VALIDATOR_SELF_TEST_PASS ' /tmp/l3-hq-handoff-host-validator-selftest.out

      - name: Execute Lane 3 fully serialized handoff package self-test
        working-directory: tech-assets/moises-audio
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(
            Shared/DomainContracts.swift
            DSP/Sources/*.swift
            Playback/Sources/*.swift
          )
          swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            -strict-concurrency=complete \
            -O \
            "${sources[@]}" \
            Playback/Tests/L3_HQ_PhysicalEvidenceHandoffSerializedPackageSelfTest.swift \
            -o /tmp/l3-hq-handoff-serialized-package-selftest
          /tmp/l3-hq-handoff-serialized-package-selftest | tee /tmp/l3-hq-handoff-serialized-package-selftest.out
          grep -q '^L3_HQ_PHYSICAL_EVIDENCE_HANDOFF_SERIALIZED_PACKAGE_SELF_TEST_PASS ' /tmp/l3-hq-handoff-serialized-package-selftest.out
