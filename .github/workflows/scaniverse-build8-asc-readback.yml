name: Scaniverse Build 8 ASC Readback

on:
  push:
    branches:
      - testflight/splat-native-ios-20260827-build8
    paths:
      - .github/workflows/scaniverse-build8-asc-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_APP_ID: 6a769d81a1add9d06020b524
      CM_WORKFLOW_ID: splat-build8-asc-readback
      CM_BRANCH: testflight/splat-native-ios-20260827-build8
    steps:
      - uses: actions/checkout@v4
      - name: Start ASC readback and verify Build 8
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM_API_TOKEN:-}"
          python3 - <<'PY'
          import io, json, os, time, urllib.error, urllib.request, zipfile
          from pathlib import Path

          token=os.environ['CM_API_TOKEN'].strip()
          app_id=os.environ['CM_APP_ID']
          workflow=os.environ['CM_WORKFLOW_ID']
          branch=os.environ['CM_BRANCH']
          gateway=Path('/tmp/build8-asc-gateway.json')

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={
                  'Content-Type':'application/json','Accept':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:2000]}
                  return e.code,data

          status,payload=api('https://api.codemagic.io/builds','POST',{
              'appId':app_id,'workflowId':workflow,'branch':branch})
          if not 200 <= status < 300:
              raise SystemExit(f'ASC readback start failed HTTP {status}: {payload}')
          build_id=payload.get('buildId') or payload.get('id')
          if not build_id:
              raise SystemExit(f'No readback build id: {payload}')
          result={'ok':False,'build_id':build_id,'status':'started','workflow_id':workflow,'branch':branch}
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD8_ASC_READBACK_STARTED',build_id)

          terminal={'finished','failed','canceled','timeout','skipped'}
          details={}
          deadline=time.time()+2100
          while time.time() < deadline:
              code,detail=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= code < 300:
                  raise SystemExit(f'ASC readback inspect failed HTTP {code}: {detail}')
              details=detail.get('data') or detail
              state=details.get('status')
              result['status']=state
              gateway.write_text(json.dumps(result,indent=2)+'\n')
              print('BUILD8_ASC_READBACK_STATUS',state)
              if state in terminal:
                  break
              time.sleep(15)
          else:
              raise SystemExit('ASC readback timed out')

          if details.get('status')!='finished':
              raise SystemExit(f'ASC readback ended {details.get("status")}')

          wanted={'asc-readback.json','build8-beta-details.json','build8-list.json','build8-id.txt'}
          extracted=set()
          for artifact in details.get('artifacts') or []:
              name=artifact.get('name') or ''
              url=artifact.get('short_lived_download_url') or artifact.get('url')
              if not url:
                  continue
              with urllib.request.urlopen(url,timeout=60) as r:
                  data=r.read()
              if name in wanted:
                  Path('/tmp',name).write_bytes(data)
                  extracted.add(name)
                  continue
              if name.endswith('.zip') or data[:4]==b'PK\x03\x04':
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for member in archive.infolist():
                          leaf=Path(member.filename).name
                          if leaf in wanted and not member.is_dir():
                              Path('/tmp',leaf).write_bytes(archive.read(member))
                              extracted.add(leaf)

          asc_path=Path('/tmp/asc-readback.json')
          if not asc_path.exists():
              names=[a.get('name') for a in details.get('artifacts') or []]
              raise SystemExit(f'asc-readback.json missing after bundle extraction; artifacts={names}')
          asc=json.loads(asc_path.read_text())
          if not asc.get('ok') or int(asc.get('buildNumber',0))!=8 or asc.get('processingState')!='VALID':
              raise SystemExit(f'Build 8 ASC contract failed: {asc}')
          result.update({'ok':True,'status':'confirmed','asc':asc,'recovered_files':sorted(extracted)})
          gateway.write_text(json.dumps(result,indent=2)+'\n')
          print('BUILD8_ASC_VALID',json.dumps(asc,separators=(',',':')))
          PY
      - name: Upload Build 8 ASC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaniverse-build8-asc-${{ github.run_id }}
          path: |
            /tmp/build8-asc-gateway.json
            /tmp/asc-readback.json
            /tmp/build8-beta-details.json
            /tmp/build8-list.json
            /tmp/build8-id.txt
          if-no-files-found: warn
          retention-days: 14
