name: Temporary Central A Batch 4 Public Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-batch4-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public and official pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path('jichitai-compare/operations/audits/central-a-batch4-public-verification-20260725.json')
          if output.exists():
              print('Verification evidence already exists.')
              raise SystemExit(0)

          base = 'https://allsunday1122.github.io/jichitai-compare'
          official_url = 'https://www.city.hikone.lg.jp/kosodate/kosodate_shien/2/3/7/11495.html'

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 central-a-quality-audit'})
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      body = response.read()
                      return {
                          'status': response.status,
                          'finalUrl': response.geturl(),
                          'contentType': response.headers.get('content-type', ''),
                          'body': body.decode('utf-8', errors='replace')
                      }
              except Exception as exc:
                  return {'status': None, 'finalUrl': url, 'body': '', 'error': repr(exc)}

          def inspect(attempt):
              cache = int(time.time())
              page_url = f'{base}/municipality/25442/?audit={cache}'
              generated_url = f'{base}/data/generated/municipalities.json?audit={cache}'
              page = fetch(page_url)
              official = fetch(official_url)
              generated = fetch(generated_url)

              page_required = [
                  '甲良町',
                  '甲良町在住の概ね10歳未満の児童が、湖東定住自立圏の彦根市病児保育室こあらを利用できる。',
                  '4時間以内1,000円、4時間超2,000円',
                  official_url
              ]
              page_missing = [token for token in page_required if token not in page.get('body', '')]
              page_success = page.get('status') == 200 and not page_missing

              official_required = ['病児保育室', 'こあら', '甲良町', '8時30分', '2,000円']
              official_missing = [token for token in official_required if token not in official.get('body', '')]
              official_success = official.get('status') == 200 and not official_missing

              generated_checks = {}
              generated_error = None
              try:
                  data = json.loads(generated.get('body', ''))
                  municipalities = data.get('municipalities', [])
                  by_code = {item.get('code'): item for item in municipalities}
                  services = by_code.get('25442', {}).get('services', {})
                  service = services.get('sickChildCare', {})
                  service_count = sum(len(item.get('services', {})) for item in municipalities)
                  generated_checks = {
                      'http200': generated.get('status') == 200,
                      'municipalityCount1741': len(municipalities) == 1741,
                      'serviceCount15669': service_count == 15669,
                      'statusVerified': service.get('status') == 'verified',
                      'summaryMatches': service.get('summary') == '甲良町在住の概ね10歳未満の児童が、湖東定住自立圏の彦根市病児保育室こあらを利用できる。',
                      'sourceMatches': service.get('source', {}).get('url') == official_url,
                      'feeMatches': service.get('details', {}).get('fee') == '4時間以内1,000円、4時間超2,000円。生活保護世帯は全額、前年度市町村民税非課税世帯は利用後に半額助成。個別実費・診察費等は別途'
                  }
                  generated_success = all(generated_checks.values())
                  generated_result = {
                      'status': generated.get('status'),
                      'finalUrl': generated.get('finalUrl'),
                      'municipalityCount': len(municipalities),
                      'serviceCount': service_count,
                      'checks': generated_checks,
                      'success': generated_success
                  }
              except Exception as exc:
                  generated_error = repr(exc)
                  generated_result = {'status': generated.get('status'), 'success': False, 'error': generated_error}

              success = page_success and official_success and generated_result.get('success', False)
              return {
                  'schemaVersion': '1.0.0',
                  'auditId': 'central-a-batch4-public-verification-20260725',
                  'generatedAt': datetime.now(timezone.utc).isoformat(),
                  'attempt': attempt,
                  'regionalPullRequest': 3435,
                  'regionalCiRun': 8341,
                  'stateSyncPullRequest': 3437,
                  'nationalSyncPullRequest': 3441,
                  'nationalCiRun': 8371,
                  'municipalityCode': '25442',
                  'publicPage': {
                      'url': page_url,
                      'status': page.get('status'),
                      'finalUrl': page.get('finalUrl'),
                      'missingTokens': page_missing,
                      'success': page_success,
                      'error': page.get('error')
                  },
                  'officialPage': {
                      'url': official_url,
                      'status': official.get('status'),
                      'finalUrl': official.get('finalUrl'),
                      'missingTokens': official_missing,
                      'success': official_success,
                      'error': official.get('error')
                  },
                  'publicGeneratedJson': generated_result,
                  'success': success,
                  'releaseBlocker': 'none' if success else 'active'
              }

          result = None
          for attempt in range(1, 31):
              result = inspect(attempt)
              print(json.dumps({'attempt': attempt, 'success': result['success']}, ensure_ascii=False))
              if result['success']:
                  break
              time.sleep(10)

          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit verification evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/central-a-batch4-public-verification-20260725.json
          if git diff --cached --quiet; then
            echo 'No verification changes.'
          else
            git commit -m 'verify: 中日本A第4群の公開反映を記録'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Enforce verification
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('jichitai-compare/operations/audits/central-a-batch4-public-verification-20260725.json').read_text(encoding='utf-8'))
          if not result.get('success'):
              raise SystemExit(json.dumps(result, ensure_ascii=False))
          print('Central A batch 4 public verification succeeded.')
          PY
