name: Temporary Central A Housing Batch 9

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch9-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch9-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply housing classification batch 9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T16:15:00+09:00';
          const serviceKeys = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const corrections = [
            {code:'23446',pref:'23',name:'美浜町',kind:'clarify_child_specific_eligibility',service:{status:'verified',summary:'同一世帯に子どもが1人以上いる世帯、または夫婦のいずれかが40歳未満の世帯へ、新築・建売住宅の取得費を10万円補助する。',details:{program:'美浜町新築住宅取得費補助金',target:'同一世帯内に子どもを1人以上有する人、または夫婦のいずれかが40歳未満の人で、町内に5年以上定住する見込み等の要件を満たす世帯',support:'新築住宅の建設または購入は10万円',localBusinessAddition:'町内事業者の関与により新築・購入した場合は5万円を加算',housingCondition:'居住面積50平方メートル以上など、要綱の住宅要件を満たすこと',excludedGeneralProgram:'空き家バンク登録中古住宅購入・改修等の一般移住制度は、本比較項目の主制度にしない'},source:{url:'https://www.town.aichi-mihama.lg.jp/kurashi-tetsuzuki/zumai/hojokin-joseikin/1487.html',checkedAt},additionalSources:[{url:'https://www.town.aichi-mihama.lg.jp/section/reiki_int/reiki_honbun/i562RG00000659.html',checkedAt,description:'子ども1人以上または夫婦いずれか40歳未満という補助対象要件'}]}},
            {code:'16210',pref:'16',name:'南砺市',kind:'replace_with_newlywed_specific_program',service:{status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住居費・引越費・リフォーム費を上限30万円または60万円補助する。',details:{program:'南砺市結婚新生活支援事業',target:'2026年1月1日から2027年3月31日までに婚姻し、夫婦とも39歳以下、合算所得500万円未満等の要件を満たす新婚世帯',covered:'新居の家賃・共益費・敷金・礼金・仲介手数料、引越費用、リフォーム費用',amount:'夫婦とも29歳以下は上限60万円、それ以外の39歳以下夫婦は上限30万円',expensePeriod:'2026年4月1日から2027年3月31日までに支払った対象経費',residenceCondition:'夫婦とも29歳以下は2年以上、それ以外は1年以上、市内に居住する見込み',applicationDeadline:'対象経費の支払い後、2027年3月31日まで',excludedGeneralPrograms:'一般の新築奨励金・多世代同居改修・空き家活用制度は本比較項目の主制度にしない'},source:{url:'https://www.city.nanto.toyama.jp/soshiki/shiminkyodo/4/410.html',checkedAt}}},
            {code:'17461',pref:'17',name:'穴水町',kind:'replace_with_child_specific_program',service:{status:'verified',summary:'県外から転入する子育て世帯へ、引越費用20万円と家賃月額最大3万円を補助する。',details:{program:'Iターンファミリー移住暮らし応援補助金',target:'県外出身で県外から穴水町へ転入し、18歳以下の子を扶養・同居する世帯、または夫婦とも50歳以下の世帯',movingSupport:'子育て世帯は引越補助20万円',rentSupport:'住宅手当相当額控除後の家賃月額の2分の1、子育て世帯は月額最大3万円',conditions:'町内の民間借家等または自己所有住宅に定住し、町税滞納なし、公的家賃補助・類似補助との重複なし等',application:'引越補助は転入日から6か月以内、家賃補助は賃貸契約締結日から6か月以内',excludedGeneralProgram:'一般の定住促進奨励金を主制度とする登録を解消'},source:{url:'https://www.town.anamizu.lg.jp/site/iju/100335.html',checkedAt}}},
            {code:'17463',pref:'17',name:'能登町',kind:'replace_with_newlywed_specific_program',service:{status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・引越・リフォーム費を上限30万円または60万円補助する。',details:{program:'令和8年度能登町結婚新生活支援補助金',target:'2026年4月1日から2027年3月31日までに婚姻し、夫婦とも39歳以下、前年度合算所得500万円未満等の要件を満たす世帯',covered:'住宅取得費、住宅賃借費、引越費、リフォーム費',amount:'夫婦とも29歳以下は上限60万円、それ以外の39歳以下夫婦は上限30万円',expensePeriod:'2026年4月1日から2027年3月31日までに支払った対象経費',applicationDeadline:'2027年3月31日まで',excludedGeneralPrograms:'一般定住住宅助成金・被災世帯向け創生住まい支援金は本比較項目の主制度にしない'},source:{url:'https://www.town.noto.lg.jp/kakuka/1001/gyomu/7/1796.html',checkedAt}}},
            {code:'21381',pref:'21',name:'神戸町',kind:'expired_child_specific_program_general_only',service:{status:'unavailable',summary:'子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',details:{reason:'現行の定住促進奨励金は住宅を新築・購入して定住する人を対象とする一般制度で、子育て世帯固有要件がない。',excludedProgram:'神戸町定住促進奨励金',excludedTarget:'2027年3月31日までに新築住宅等を取得して定住する人',expiredProgram:'三世代同居支援奨励金は子育て支援目的だが、対象となる住宅取得・同居開始期限が2025年3月31日で終了済み',evidence:'2026年7月時点で新規対象となる子育て世帯向け住宅制度として扱わない'},source:{url:'https://www.town.godo.gifu.jp/life/other/other13.html',checkedAt},additionalSources:[{url:'https://www.town.godo.gifu.jp/life/other/other18.html',checkedAt,description:'対象期限が2025年3月31日までの旧三世代同居支援'}]}}
          ];
          for (const item of corrections) {
            const municipalityPath = path.join(root,'data/municipalities',item.pref,`${item.code}.json`);
            const taskPath = path.join(root,'operations/tasks',`${item.code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath,'utf8'));
            const task = JSON.parse(fs.readFileSync(taskPath,'utf8'));
            municipality.updatedAt = checkedAt;
            municipality.services.housingSupport = item.service;
            const entries = serviceKeys.map((key)=>[key,municipality.services[key]]);
            const completedStatuses = new Set(['verified','unavailable']);
            const statuses = entries.map(([,service])=>service.status);
            task.completedServices = entries.filter(([,service])=>completedStatuses.has(service.status)).map(([key])=>key);
            task.verifiedCount = statuses.filter((status)=>status==='verified').length;
            task.researchingCount = statuses.filter((status)=>status==='researching').length;
            task.unavailableCount = statuses.filter((status)=>status==='unavailable').length;
            task.needsMediumReviewCount = statuses.filter((status)=>status==='needs_medium_review').length;
            const nextIndex = entries.findIndex(([,service])=>!completedStatuses.has(service.status));
            task.nextServiceIndex = nextIndex===-1 ? serviceKeys.length : nextIndex;
            task.currentService = serviceKeys[task.nextServiceIndex] ?? null;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '中日本調査班A';
            task.officialSources = [...new Set(entries.filter(([,service])=>completedStatuses.has(service.status)).map(([,service])=>service.source.url))];
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            const note = item.service.status==='unavailable' ? '2026年7月25日の原因別重点再監査で、現行の子育て世帯向け住宅支援を確認できず、一般制度・期限終了制度を除外してhousingSupportをunavailableへ修正した。' : '2026年7月25日の原因別重点再監査で、一般住宅制度中心の登録を解消し、現行の子育て・新婚世帯向け住宅支援へ主制度を更新した。';
            if (!task.notes.includes(note)) task.notes.push(note);
            fs.writeFileSync(municipalityPath,JSON.stringify(municipality,null,2)+'\n');
            fs.writeFileSync(taskPath,JSON.stringify(task,null,2)+'\n');
          }
          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch9-decisions-20260725',decidedAt:updatedAt,session:'中日本調査班A',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:corrections.length,confirmedCorrectionCount:corrections.length,statusToUnavailableCount:corrections.filter((item)=>item.service.status==='unavailable').length,childSpecificReplacementCount:corrections.filter((item)=>item.service.status==='verified').length,corrected:corrections.map((item)=>({code:item.code,name:item.name,service:'housingSupport',correctionType:item.kind,afterStatus:item.service.status,officialSource:item.service.source.url,summary:item.service.summary})),causeScan:{previousRemainingCandidates:134,reviewedHighRiskCandidates:5,remainingCandidates:129},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般住宅制度ではなく、現行の子育て・新婚・三世代向け対象要件がある制度を主制度として登録する','対象期限が終了した旧子育て住宅制度は、2026年度のverified根拠に使用しない','利用者向け公式ページと現行要綱から対象、金額、期間を確認する']};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch9-decisions-20260725.json'),JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
          node --check app.js
      - name: Commit batch 9 corrections
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch9-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/16/16210.json jichitai-compare/data/municipalities/17/17461.json jichitai-compare/data/municipalities/17/17463.json jichitai-compare/data/municipalities/21/21381.json jichitai-compare/data/municipalities/23/23446.json jichitai-compare/operations/tasks/16210.json jichitai-compare/operations/tasks/17461.json jichitai-compare/operations/tasks/17463.json jichitai-compare/operations/tasks/21381.json jichitai-compare/operations/tasks/23446.json jichitai-compare/operations/audits/central-a-housing-classification-batch9-decisions-20260725.json jichitai-compare/operations/control/central-a-housing-batch9-trigger-20260725.json
          git commit -m 'audit: 中日本A住宅支援分類第9群を修正'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
