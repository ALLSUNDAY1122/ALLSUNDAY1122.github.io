name: Temporary North B Anyone Single Gap Batch 2 Region Sync

on:
  pull_request:
    branches:
      - region/north
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch2-region-sync.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch2-region-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout regional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import confirmed files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            jichitai-compare/data/municipalities/04/04214.json \
            jichitai-compare/data/municipalities/04/04215.json \
            jichitai-compare/data/municipalities/04/04216.json \
            jichitai-compare/data/municipalities/04/04321.json \
            jichitai-compare/data/municipalities/04/04323.json \
            jichitai-compare/data/municipalities/04/04324.json \
            jichitai-compare/data/municipalities/04/04362.json \
            jichitai-compare/data/municipalities/04/04406.json \
            jichitai-compare/data/municipalities/04/04421.json \
            jichitai-compare/operations/tasks/04214.json \
            jichitai-compare/operations/tasks/04215.json \
            jichitai-compare/operations/tasks/04216.json \
            jichitai-compare/operations/tasks/04321.json \
            jichitai-compare/operations/tasks/04323.json \
            jichitai-compare/operations/tasks/04324.json \
            jichitai-compare/operations/tasks/04362.json \
            jichitai-compare/operations/tasks/04406.json \
            jichitai-compare/operations/tasks/04421.json \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch2-review-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json

      - name: Commit regional synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/north-b-anyone-single-gap-batch2-review-20260725.json \
                  jichitai-compare/operations/control/session-checkpoints/north-b.json
          if git diff --cached --quiet; then
            echo 'No regional changes to commit.'
            exit 1
          fi
          git commit -m 'sync: 北日本B誰でも通園単一条件第2群をregion/northへ反映 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
