name: Temporary North B Anyone Single Gap Batch 5 Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-public.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose public pages and generated JSON
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const expected = {
            '06204': ['2026年4月', '令和8年4月'],
            '06207': ['2026年4月', '令和8年4月'],
            '06208': ['2026年度', '令和8年度'],
            '06209': ['2026年4月', '令和8年4月'],
            '06210': ['2026年1月13日', '令和8年1月13日'],
            '06211': ['2026年度', '令和8年度'],
            '06301': ['2026年度', '令和8年度']
          };
          const diagnostic = { checkedAt: new Date().toISOString(), pages: {}, generated: {}, errors: [] };

          async function fetchText(url) {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}audit=${Date.now()}`, { cache: 'no-store' });
            const text = await response.text();
            return { status: response.status, ok: response.ok, text };
          }
          function matchedNeedle(text, needles) {
            return needles.find(needle => text.includes(needle)) || null;
          }
          function findCode(value, code) {
            if (!value || typeof value !== 'object') return null;
            if (!Array.isArray(value) && Object.prototype.hasOwnProperty.call(value, code)) return value[code];
            if (String(value.code || value.municipalityCode || value.id || '') === code) return value;
            const items = Array.isArray(value) ? value : Object.values(value);
            for (const item of items) {
              const found = findCode(item, code);
              if (found) return found;
            }
            return null;
          }

          for (const [code, needles] of Object.entries(expected)) {
            try {
              const url = `${base}/municipality/${code}/`;
              const response = await fetchText(url);
              const matched = matchedNeedle(response.text, needles);
              diagnostic.pages[code] = {
                url,
                status: response.status,
                length: response.text.length,
                matched,
                hasCode: response.text.includes(code),
                hasAnyoneKeyword: response.text.includes('こども誰でも通園')
              };
              if (!response.ok || !matched) diagnostic.errors.push(`page ${code}: status=${response.status}, matched=${matched}`);
            } catch (error) {
              diagnostic.errors.push(`page ${code}: ${error.message}`);
            }
          }

          try {
            const generatedUrl = `${base}/data/generated/municipalities.json`;
            const response = await fetchText(generatedUrl);
            diagnostic.generated.httpStatus = response.status;
            diagnostic.generated.length = response.text.length;
            diagnostic.generated.prefix = response.text.slice(0, 120);
            if (!response.ok) {
              diagnostic.errors.push(`generated HTTP ${response.status}`);
            } else {
              const generated = JSON.parse(response.text);
              diagnostic.generated.rootType = Array.isArray(generated) ? 'array' : typeof generated;
              diagnostic.generated.rootKeys = !Array.isArray(generated) && generated && typeof generated === 'object' ? Object.keys(generated).slice(0, 20) : [];
              for (const [code, needles] of Object.entries(expected)) {
                const municipality = findCode(generated, code);
                const text = municipality ? JSON.stringify(municipality) : '';
                const matched = matchedNeedle(text, needles);
                diagnostic.generated[code] = {
                  foundObject: Boolean(municipality),
                  matched,
                  rawHasCode: response.text.includes(code),
                  rawMatched: matchedNeedle(response.text, needles)
                };
                if (!municipality || !matched) diagnostic.errors.push(`generated ${code}: found=${Boolean(municipality)}, matched=${matched}`);
              }
            }
          } catch (error) {
            diagnostic.errors.push(`generated: ${error.message}`);
          }

          fs.writeFileSync('jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-public-diagnostic-20260725.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          if (diagnostic.errors.length) process.exit(1);
          NODE

      - name: Commit diagnostic output
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-public-diagnostic-20260725.json
          git commit -m 'diagnostic: 北日本B第5群の公開照合結果を保存 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Fail when diagnostic found errors
        if: steps.diagnose.outcome == 'failure'
        shell: bash
        run: exit 1
