name: Temporary North B Anyone Single Gap Batch 5 Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-public.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record successful public verification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const auditFile = 'jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-public-verification-20260725.json';
          const municipalities = [
            ['06204', '2026年4月'],
            ['06207', '2026年4月'],
            ['06208', '2026年度'],
            ['06209', '2026年4月'],
            ['06210', '2026年1月13日'],
            ['06211', '2026年度'],
            ['06301', '2026年度']
          ].map(([code, expected]) => ({
            code,
            pageUrl: `https://allsunday1122.github.io/jichitai-compare/municipality/${code}/`,
            expected,
            result: 'expected corrected start content found'
          }));
          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'north-b-anyone-single-gap-batch5-public-verification-20260725',
            sessionId: 'north-b',
            verifiedAt: '2026-07-25T08:18:25.719Z',
            status: 'verified',
            verificationWorkflowRun: 30150862221,
            verificationArtifactId: 8617573049,
            mainPullRequest: 3606,
            mainMergeCommit: 'd7dde1d363bfb04a77166b45b605b3dce9722599',
            regionPullRequest: 3612,
            regionMergeCommit: 'ca9005752989928428b9a8ff746025b1f6316d7d',
            scope: { municipalityPages: 7, generatedMunicipalitiesJson: true, statusChanges: 0 },
            municipalities,
            generatedUrl: 'https://allsunday1122.github.io/jichitai-compare/data/generated/municipalities.json',
            evidence: '診断成果物で全7ページと生成JSONの対象自治体オブジェクトに期待開始時期が存在し、stage=success・error=nullを確認'
          };
          fs.writeFileSync(auditFile, `${JSON.stringify(audit, null, 2)}\n`);

          const checkpointFile = 'jichitai-compare/operations/control/session-checkpoints/north-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(checkpointFile, 'utf8'));
          checkpoint.fiscalAnyoneAudit = {
            ...(checkpoint.fiscalAnyoneAudit || {}),
            singleGapBatch5PublicVerification: 'success',
            singleGapBatch5PublicVerificationRun: 30150862221,
            singleGapBatch5PublicVerificationArtifact: 8617573049,
            singleGapBatch5PublicVerificationAuditFile: 'operations/audits/north-b-anyone-single-gap-batch5-public-verification-20260725.json'
          };
          fs.writeFileSync(checkpointFile, `${JSON.stringify(checkpoint, null, 2)}\n`);
          NODE

      - name: Validate repository data
        shell: bash
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Remove workflow and commit verification record
        shell: bash
        run: |
          rm -f .github/workflows/temp-north-b-anyone-single-gap-batch5-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-north-b-anyone-single-gap-batch5-public.yml \
            jichitai-compare/operations/audits/north-b-anyone-single-gap-batch5-public-verification-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/north-b.json \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/sitemap.xml
          git commit -m 'audit: 北日本B誰でも通園単一条件第5群の公開検証記録を確定 [skip ci]'
          git push origin HEAD:"${{ github.head_ref }}"
