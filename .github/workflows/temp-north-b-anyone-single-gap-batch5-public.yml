name: Temporary North B Anyone Single Gap Batch 5 Public Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch5-public.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch5-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture exact verification stage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const expected = {
            '06204': ['2026年4月', '令和8年4月'],
            '06207': ['2026年4月', '令和8年4月'],
            '06208': ['2026年度', '令和8年度'],
            '06209': ['2026年4月', '令和8年4月'],
            '06210': ['2026年1月13日', '令和8年1月13日'],
            '06211': ['2026年度', '令和8年度'],
            '06301': ['2026年度', '令和8年度']
          };
          const report = { stage: 'start', checkedAt: new Date().toISOString(), pages: {}, generated: {}, error: null };
          const save = () => fs.writeFileSync('/tmp/batch5-public-stage.json', `${JSON.stringify(report, null, 2)}\n`);
          function match(text, needles) { return needles.find(n => text.includes(n)) || null; }
          function findCode(value, code) {
            if (!value || typeof value !== 'object') return null;
            if (!Array.isArray(value) && Object.prototype.hasOwnProperty.call(value, code)) return value[code];
            if (String(value.code || value.municipalityCode || value.id || '') === code) return value;
            for (const item of (Array.isArray(value) ? value : Object.values(value))) {
              const found = findCode(item, code);
              if (found) return found;
            }
            return null;
          }
          async function get(url) {
            const response = await fetch(`${url}?audit=${Date.now()}`, { cache: 'no-store' });
            const text = await response.text();
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return text;
          }
          (async () => {
            try {
              report.stage = 'pages'; save();
              for (const [code, needles] of Object.entries(expected)) {
                const text = await get(`${base}/municipality/${code}/`);
                const matched = match(text, needles);
                report.pages[code] = { length: text.length, matched, hasAnyone: text.includes('こども誰でも通園') };
                save();
                if (!matched) throw new Error(`page ${code} missing ${needles.join(' / ')}`);
              }
              report.stage = 'generated-fetch'; save();
              const generatedText = await get(`${base}/data/generated/municipalities.json`);
              report.generated.length = generatedText.length;
              report.generated.prefix = generatedText.slice(0, 100);
              report.stage = 'generated-parse'; save();
              const generated = JSON.parse(generatedText);
              report.generated.rootType = Array.isArray(generated) ? 'array' : typeof generated;
              report.generated.rootKeys = !Array.isArray(generated) && generated && typeof generated === 'object' ? Object.keys(generated).slice(0, 20) : [];
              for (const [code, needles] of Object.entries(expected)) {
                const item = findCode(generated, code);
                const matched = item ? match(JSON.stringify(item), needles) : null;
                report.generated[code] = { found: Boolean(item), matched, rawHasCode: generatedText.includes(code), rawMatched: match(generatedText, needles) };
                save();
                if (!item || !matched) throw new Error(`generated ${code}: found=${Boolean(item)}, matched=${matched}`);
              }
              report.stage = 'checkpoint-read'; save();
              JSON.parse(fs.readFileSync('jichitai-compare/operations/control/session-checkpoints/north-b.json', 'utf8'));
              report.stage = 'success'; save();
            } catch (error) {
              report.error = error.stack || error.message;
              report.stage = 'failed';
              save();
            }
          })().then(() => process.exit(0));
          NODE

      - name: Upload verification diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: north-b-batch5-public-stage
          path: /tmp/batch5-public-stage.json
          if-no-files-found: error
