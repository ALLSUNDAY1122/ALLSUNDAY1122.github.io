name: Pharmacist v0.6 Web Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/index.html'
      - 'pharmacist-manabi-sprint/product-loader-v06.js'
      - 'pharmacist-manabi-sprint/app-v06.js'
      - 'pharmacist-manabi-sprint/record-fix-v061.js'
      - 'pharmacist-manabi-sprint/product-v06.css'
      - 'pharmacist-manabi-sprint/heatmap-fix.css'
      - 'pharmacist-manabi-sprint/sw.js'
      - 'pharmacist-manabi-sprint/tools/validate_v06_web.py'
      - 'pharmacist-manabi-sprint/tools/smoke_v06.mjs'
      - 'pharmacist-manabi-sprint/tools/smoke_record_v061.mjs'
      - 'pharmacist-manabi-sprint/tools/v06-web-trigger.txt'
      - '.github/workflows/pharmacist-v06-web.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax checks
        run: |
          node --check pharmacist-manabi-sprint/product-loader-v06.js
          node --check pharmacist-manabi-sprint/app-v06.js
          node --check pharmacist-manabi-sprint/record-fix-v061.js
          node --check pharmacist-manabi-sprint/sw.js
      - name: Rebuild current bank before validation
        run: |
          python3 pharmacist-manabi-sprint/tools/assemble_product_bank.py
          python3 pharmacist-manabi-sprint/tools/normalize_product_cases.py
          python3 pharmacist-manabi-sprint/tools/build_web_bundle.py
          python3 -c "from pathlib import Path; Path('pharmacist-manabi-sprint/content/product/final-audit-v2.json').unlink(missing_ok=True)"
      - name: Generate current content audit report
        continue-on-error: true
        run: python3 pharmacist-manabi-sprint/tools/final_product_audit_v2.py
      - name: Static product/web audit
        run: python3 pharmacist-manabi-sprint/tools/validate_v06_web.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke with durable diagnostics
        id: smoke
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/pharmacist-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          set +e
          node pharmacist-manabi-sprint/tools/smoke_v06.mjs 2>&1 | tee pharmacist-manabi-sprint/content/product/web-smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > pharmacist-manabi-sprint/content/product/web-smoke.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Record screen regression smoke
        id: record_smoke
        shell: bash
        run: |
          python3 -m http.server 4174 --directory . >/tmp/pharmacist-record-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          set +e
          SMOKE_URL='http://127.0.0.1:4174/pharmacist-manabi-sprint/' node pharmacist-manabi-sprint/tools/smoke_record_v061.mjs 2>&1 | tee pharmacist-manabi-sprint/content/product/record-smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > pharmacist-manabi-sprint/content/product/record-smoke.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacist-web-static-${{ github.run_id }}
          path: |
            pharmacist-manabi-sprint/content/product/final-audit-v2.json
            pharmacist-manabi-sprint/content/product/web-static-audit.json
          retention-days: 14
      - name: Save executed browser diagnostics
        if: always() && steps.smoke.outputs.exit_code != ''
        uses: actions/upload-artifact@v4
        with:
          name: pharmacist-web-smoke-${{ github.run_id }}
          path: |
            pharmacist-manabi-sprint/content/product/web-smoke.log
            pharmacist-manabi-sprint/content/product/web-smoke.exit
            pharmacist-manabi-sprint/content/product/record-smoke.log
            pharmacist-manabi-sprint/content/product/record-smoke.exit
          retention-days: 14
      - name: Enforce browser smoke gate
        run: test "${{ steps.smoke.outputs.exit_code }}" = '0'
      - name: Enforce record regression gate
        run: test "${{ steps.record_smoke.outputs.exit_code }}" = '0'

