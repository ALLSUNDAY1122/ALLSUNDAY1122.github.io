name: Toru Tango Release Branch Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch actual Build 10 release lineage fail-closed
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feature/on-device-ai-card-generation
          git checkout -B fix/toru-build10-speech origin/feature/on-device-ai-card-generation
          python3 - <<'PY'
          from pathlib import Path
          p=Path('toru-tango-mobile/app/(tabs)/cards.tsx')
          s=p.read_text()
          old="""  const [answer, setAnswer] = useState('');
  const [note, setNote] = useState('');"""
          new="""  const [answer, setAnswer] = useState('');
  const [note, setNote] = useState('');
  const [speakingKey, setSpeakingKey] = useState<string | null>(null);"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="""  const speak = (text: string) => {
    void Speech.stop();
    Speech.speak(text, { language: 'ja-JP', rate: 0.95 });
  };"""
          new="""  const speak = (text: string, key: string) => {
    void Speech.stop();
    setSpeakingKey(key);
    Speech.speak(text, {
      language: 'ja-JP',
      rate: 0.95,
      onDone: () => setSpeakingKey(null),
      onStopped: () => setSpeakingKey(null),
      onError: () => {
        setSpeakingKey(null);
        Alert.alert('読み上げできません', 'iPhoneの消音モードと音量を確認して、もう一度お試しください。');
      }
    });
  };"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="""                <View style={styles.actionGrid}>
                  <Pressable onPress={() => speak(card.question)} style={styles.smallAction}>
                    <Text style={styles.smallActionText}>🔊 表</Text>
                  </Pressable>
                  <Pressable onPress={() => speak(card.answer)} style={styles.smallAction}>
                    <Text style={styles.smallActionText}>🔊 裏</Text>
                  </Pressable>"""
          new="""                <View style={styles.actionGrid}>
                  <Pressable
                    accessibilityRole=\"button\"
                    accessibilityLabel=\"表面を読み上げる\"
                    onPress={() => speak(card.question, `${card.id}:front`)}
                    style={styles.smallAction}
                  >
                    <Text style={styles.smallActionText}>
                      {speakingKey === `${card.id}:front` ? '再生中…' : '🔊 表を読む'}
                    </Text>
                  </Pressable>
                  <Pressable
                    accessibilityRole=\"button\"
                    accessibilityLabel=\"裏面を読み上げる\"
                    onPress={() => speak(card.answer, `${card.id}:back`)}
                    style={styles.smallAction}
                  >
                    <Text style={styles.smallActionText}>
                      {speakingKey === `${card.id}:back` ? '再生中…' : '🔊 裏を読む'}
                    </Text>
                  </Pressable>"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="""                </View>
              </>
            )}"""
          new="""                </View>
                <Text style={styles.speechHint}>音が聞こえない場合はiPhoneの消音モードを解除してください。</Text>
              </>
            )}"""
          assert s.count(old)>=1
          s=s.replace(old,new,1)
          old="""  smallActionText: { color: colors.text, fontSize: 11, fontWeight: '800' },"""
          new="""  smallActionText: { color: colors.text, fontSize: 11, fontWeight: '800' },
  speechHint: { color: colors.muted, fontSize: 11, lineHeight: 16 },"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "toru-tango-mobile/app/(tabs)/cards.tsx"
          git add 'toru-tango-mobile/app/(tabs)/cards.tsx'
          git commit -m 'fix(toru-tango): make speech actions observable on iPhone'
          git push --force-with-lease origin HEAD:refs/heads/fix/toru-build10-speech
