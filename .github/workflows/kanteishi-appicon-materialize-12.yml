name: materialize canonical app icon #12

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-appicon-materialize-12.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0
      - name: Download exact canonical App Icon
        shell: bash
        env:
          ICON_URL: 'https://oaisdmntprwestus2.blob.core.windows.net/files/00000000-258c-81f8-a712-3c3d15ed23d7/raw?se=2026-08-14T08%3A49%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=019fff6d-9117-7aad-9cc7-99498816fa6f&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T05%3A48%3A42Z&ske=2026-08-15T05%3A48%3A42Z&sks=b&skv=2026-02-06&sig=d2/GmeRox6V32lFQlpDPk6gZC6VkU9h7UF9SQe7rDPE%3D'
        run: |
          set -euo pipefail
          dest='kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          mkdir -p "$(dirname "$dest")"
          curl --fail --location --silent --show-error "$ICON_URL" --output "$dest"
          python3 - <<'PY'
          import hashlib, struct
          p='kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          b=open(p,'rb').read()
          assert len(b) == 668457, len(b)
          assert hashlib.sha256(b).hexdigest() == '679f3493524dd2cf71126303c998b15395c70ff19f224d158a760ee3c2a395f1'
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          length=struct.unpack('>I', b[8:12])[0]
          assert b[12:16] == b'IHDR' and length == 13
          width,height,bit_depth,color_type,compression,filter_method,interlace=struct.unpack('>IIBBBBB', b[16:29])
          assert (width,height,bit_depth,color_type,compression,filter_method,interlace) == (1024,1024,8,2,0,0,0), (width,height,bit_depth,color_type,compression,filter_method,interlace)
          print('canonical AppIcon verified:', len(b), hashlib.sha256(b).hexdigest())
          PY
      - name: Create AppIcon asset catalog contract
        shell: bash
        run: |
          set -euo pipefail
          cat > kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          cat > kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kanteishi-shortanswer-sprint/ios/project.yml')
          s=p.read_text()
          needle='        DEVELOPMENT_TEAM: "MN3D2ZM44N"\n    scheme:'
          repl='        DEVELOPMENT_TEAM: "MN3D2ZM44N"\n        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon\n    scheme:'
          if 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' not in s:
              assert needle in s
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          rm -rf kanteishi-shortanswer-sprint/ios/icon-source
      - name: Remove temporary bridge and commit exact binary
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/kanteishi-appicon-materialize-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'assets(#12): materialize exact canonical AppIcon'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
