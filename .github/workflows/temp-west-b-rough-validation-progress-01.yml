name: Temporary West B Rough Validation Progress 01

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/west-b-rough-validation-progress-01-20260725
          fetch-depth: 0

      - name: Record validation progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/session-checkpoints/west-b.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt'] = '2026-07-25T00:26:00+09:00'
          data['nextAction'] = '概略検証第2回として、第1回未対象の島根県自治体から約25自治体を検証する。全10回程度で担当250自治体を網羅する。'
          data['roughValidation'] = {
            'status': 'in_progress',
            'plannedCycles': 10,
            'completedCycles': 1,
            'auditedMunicipalityCount': 25,
            'auditedServiceCount': 225,
            'remainingMunicipalityCount': 225,
            'detectedResearchContentErrorCount': 0,
            'detectedSourceMaintenanceIssueCount': 1,
            'correctedSourceMaintenanceIssueCount': 1,
            'lastCycle': {
              'cycle': 1,
              'auditPullRequestNumber': 2921,
              'auditCiRunNumber': 7014,
              'auditMergeCommit': '00389db96962e947d7ebc172679448bd160f8605',
              'auditFile': 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-01-20260725.json',
              'municipalityCount': 25,
              'serviceCount': 225,
              'prefectureCodes': ['31', '32'],
              'manualSpotCheckCount': 5,
              'contentErrorCount': 0,
              'sourceCorrectionPullRequestNumber': 2930,
              'sourceCorrectionCiRunNumber': 7006
            },
            'nextCycle': {
              'cycle': 2,
              'plannedMunicipalityCount': 25,
              'scopePolicy': '第1回未対象の島根県自治体から開始'
            }
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove workflow and commit checkpoint
        run: |
          rm .github/workflows/temp-west-b-rough-validation-progress-01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-west-b-rough-validation-progress-01.yml \
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          git commit -m 'ops: record West B rough validation cycle 01'
          git push origin HEAD:ops/west-b-rough-validation-progress-01-20260725
