name: HM2 Review Screenshot

on:
  push:
    branches: [main]
    paths:
      - 'apps/sanitary-manager-2/**'
      - 'ios/health-manager-2/**'
      - 'scripts/audit_sm2_storekit_ui.py'
      - 'scripts/audit_sm2_learning_contract.py'
      - 'scripts/audit_sm2_release_drift.py'
      - '.github/workflows/hm2-review-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install project tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen imagemagick
      - name: Prepare audited product bundle
        env:
          BUILD_NUMBER: '999999'
        run: bash ios/health-manager-2/prepare-web-assets.sh
      - name: Generate Xcode project
        working-directory: ios/health-manager-2
        run: xcodegen generate
      - name: Choose simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*([^\(]+) \(.*/\1/' | sed 's/[[:space:]]*$//')
          test -n "$DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Run real paywall UI capture
        id: ui_capture
        working-directory: ios/health-manager-2
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project HealthManager2.xcodeproj \
            -scheme HealthManager2 \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath "$RUNNER_TEMP/HM2Review.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$RUNNER_TEMP/hm2-review-test.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Preserve diagnostics even when XCTest fails; final gate enforces code.
          exit 0
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hm2-review-attachments"
          if [ -d "$RUNNER_TEMP/HM2Review.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/HM2Review.xcresult" \
              --output-path "$RUNNER_TEMP/hm2-review-attachments"
          fi
          find "$RUNNER_TEMP/hm2-review-attachments" -type f -maxdepth 3 -print || true
      - name: Summarize UI capture diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '### HM2 review screenshot diagnostics'
            echo "UI capture exit: ${{ steps.ui_capture.outputs.exit_code }}"
            if [ -f "$RUNNER_TEMP/hm2-review-test.log" ]; then
              echo '```text'
              grep -E '(^|[[:space:]])(error:|failed|FAIL|XCTFail|Test Case|Testing failed)' "$RUNNER_TEMP/hm2-review-test.log" | tail -n 80 || true
              echo '```'
            fi
            echo 'Attachments:'
            find "$RUNNER_TEMP/hm2-review-attachments" -type f -maxdepth 3 -printf '%f\n' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Count captured review PNGs
        if: always()
        id: png_gate
        shell: bash
        run: |
          COUNT=$(find "$RUNNER_TEMP/hm2-review-attachments" -type f \( -name '*.png' -o -name '*.PNG' \) | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Captured review PNG count: $COUNT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hm2-iap-review-paywall
          path: |
            ${{ runner.temp }}/hm2-review-attachments
            ${{ runner.temp }}/hm2-review-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce review screenshot gate
        if: always()
        run: |
          test "${{ steps.ui_capture.outputs.exit_code }}" = "0"
          test "${{ steps.png_gate.outputs.count }}" -ge 1
