name: Temporary Coordinator Sync 480 Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-coord-sync-480.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync and self-delete
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          now='2026-07-22T17:21:00+09:00'; regions=('north','east','central','west')
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(r,p):
            n=int(p); return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[r]
          states={};pending={};counts={};items={}
          for r in regions:
            ref=f'origin/region/{r}'; states[r]=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{r}.json')); pending[r]=int(states[r].get(fields[r],0)); arr=[]
            for p in subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines():
              if not re.search(r'/\d{5}\.json$',p): continue
              d=json.loads(show(ref,p))
              if belongs(r,d['prefectureCode']): arr.append({'code':d['code'],'name':d['name']})
            arr.sort(key=lambda x:x['code']);items[r]=arr;counts[r]=len(arr)
          total=sum(counts.values());ready=[r for r,c in pending.items() if c>=10]
          prs=json.loads(subprocess.check_output(['gh','pr','list','--state','open','--limit','100','--json','number,baseRefName'],text=True));municipal=[p['number'] for p in prs if p['baseRefName'] in ('region/north','region/east','region/central','region/west')];unrelated=[p['number'] for p in prs if p['baseRefName'] not in ('region/north','region/east','region/central','region/west')]
          latest=max(regions,key=lambda r:states[r].get('lastNationalIntegrationAt') or '')
          qp=Path('jichitai-compare/operations/control/release-queue.json');q=json.loads(qp.read_text(encoding='utf-8'));by={e['region']:e for e in q['entries']}
          for r in regions: by[r].update({'municipalities':items[r],'count':counts[r],'pendingSinceLastRelease':pending[r],'releaseStatus':'release_ready' if pending[r]>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の繰越は{pending[r]}自治体','mainIntegrationPr':states[r].get('lastNationalIntegrationPr'),'generatedPullRequest':746,'auditStatus':'passed'})
          next_action=f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"+('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          q['updatedAt']=now;q['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':464,'latestGeneratedPullRequest':746,'latestPublicCountPullRequest':746,'releaseReadyRegions':ready,'nextAction':next_action};qp.write_text(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          gp=Path('jichitai-compare/operations/control/global-state.json');g=json.loads(gp.read_text(encoding='utf-8'));g['updatedAt']=now;g['regionalCompletedSinceLastRelease']={**pending,'total':sum(pending.values())};g['priority']={'type':'release-monitoring','nextAction':next_action};g['lastNationalIntegrationAt']=states[latest].get('lastNationalIntegrationAt');g['lastNationalIntegrationPr']=states[latest].get('lastNationalIntegrationPr');g['latestGeneratedMunicipalityCount']=464;g['latestGeneratedPullRequest']=746;g['latestPublicCountPullRequest']=746;g['regionalMergedMunicipalities']=total;g['openPullRequests']=municipal;g['humanDecisionRequired']=False;gp.write_text(json.dumps(g,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          rec={'timestamp':now,'actor':'全国進行統括','action':'coordinator-sync-480','details':{'publicMunicipalityCount':464,'regionalCounts':counts,'regionalMergedMunicipalities':total,'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},'releaseReadyRegions':ready,'openMunicipalityPullRequests':municipal,'ignoredUnrelatedOpenPullRequests':unrelated},'humanDecisionRequired':False}
          with Path('jichitai-compare/operations/control/audit-log.jsonl').open('a',encoding='utf-8') as f:f.write(json.dumps(rec,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY
          rm .github/workflows/temp-coord-sync-480.yml
          git add jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-coord-sync-480.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合480自治体・公開464自治体へ同期'
          git push origin main
