name: Temporary Reset Central After Release 437 Retry

on:
  push:
    branches:
      - region/central
    paths:
      - .github/workflows/temp-reset-central-after-release-437.yml

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/central
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reset region state
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/regions/central.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt']='2026-07-22T03:57:00+09:00'
          data['status']='working'
          data['completedSinceLastRelease']=2
          data['completedMunicipalities']=['21507','21521']
          data['regionalQueue']=['22100']
          audit=data.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '21521' not in checked: checked.append('21521')
          checks=audit.setdefault('checks',[])
          for line in [
            '揖斐川町から白川町までの追加10自治体を全国統合PR #437・CI run #930でmainへ統合',
            '生成更新PR #439・CI run #934で生成JSON・全国進捗・公開トップを234自治体へ同期',
            '御嵩町をPR #438・CI run #933で地方統合。産後ケアは現行公式条件が確認できないためunavailableとして検証済み'
          ]:
              if line not in checks: checks.append(line)
          data['lastAction']='揖斐川町（21401）から白川町（21506）までの10自治体を全国統合PR #437、生成更新PR #439で公開234自治体へ同期。その後、東白川村（21507）・御嵩町（21521）を地方統合した。'
          data['nextAction']='静岡市（22100）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する'
          data['lastNationalIntegrationPr']=437
          data['lastNationalIntegrationAt']='2026-07-22T03:50:48+09:00'
          data['lastGeneratedPullRequest']=439
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-reset-central-after-release-437.yml
          git add jichitai-compare/operations/control/regions/central.json .github/workflows/temp-reset-central-after-release-437.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 中日本全国統合後の状態をリセット'
          git push origin region/central
