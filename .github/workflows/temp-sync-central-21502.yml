name: Temporary Sync Central 21502

on:
  push:
    branches: [region/central]
    paths:
      - .github/workflows/temp-sync-central-21502.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: region/central
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central state
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/regions/central.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updatedAt']='2026-07-22T03:14:00+09:00'
          data['status']='working'
          data['completedSinceLastRelease']=6
          data['completedMunicipalities']=['21401','21403','21404','21421','21501','21502']
          data['regionalQueue']=['21503']
          audit=data.setdefault('completenessAudit',{})
          checked=audit.setdefault('checkedCodes',[])
          if '21502' not in checked: checked.append('21502')
          checks=audit.setdefault('checks',[])
          line='富加町をPR #424・CI run #905で地方統合'
          if line not in checks: checks.append(line)
          data['lastAction']='全国統合PR #404・生成更新PR #408完了後、揖斐川町（21401）から富加町（21502）までの6自治体をregion/centralへ地方統合し、各taskをmergedへ更新'
          data['nextAction']='川辺町（21503）のtask・既存ブランチ・PR重複を確認し、最新region/centralから必須9制度の調査を開始する'
          data['lastNationalIntegrationPr']=404
          data['lastNationalIntegrationAt']='2026-07-22T02:15:09+09:00'
          data['lastGeneratedPullRequest']=408
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-central-21502.yml
          git add jichitai-compare/operations/control/regions/central.json .github/workflows/temp-sync-central-21502.yml
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/temp-sync-central-21502.yml','jichitai-compare/operations/control/regions/central.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual ^ expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 中日本を全国統合後6自治体へ更新'
          git push origin region/central
