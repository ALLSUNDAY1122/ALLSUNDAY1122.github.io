name: Touhan 44 crop mobile audit and guarded promotion
on:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/crop_mobile_release.py'
      - '.github/workflows/touhan-crop-mobile-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: touhan-crop-release
  cancel-in-progress: false
jobs:
  browser-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright harness and Pillow (use runner preinstalled Chrome)
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0 2>&1 | tee /tmp/touhan-crop-run.log
          google-chrome --version 2>&1 | tee -a /tmp/touhan-crop-run.log
      - name: Test 44 original images at 375 and 430 px and conditionally promote
        run: |
          python -m http.server 8765 --directory touroku-hanbaisha-sprint >/tmp/touhan-crop-http.log 2>&1 &
          sleep 2
          set -o pipefail
          python touroku-hanbaisha-sprint/official-kansai/crop_mobile_release.py 2>&1 | tee /tmp/touhan-crop-run.log
      - name: Save diagnostic evidence on failed browser QA
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('touroku-hanbaisha-sprint/official-kansai/CROP_MOBILE_QA_RESULT.json')
          log=Path('/tmp/touhan-crop-run.log')
          p.write_text(json.dumps({'status':'FAIL','promoted':0,
            'errorTail':log.read_text(errors='replace')[-5000:] if log.exists() else 'setup did not write logs',
            'note':'No approval unless full real-browser pass'},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-sprint/official-kansai/CROP_MOBILE_QA_RESULT.json
          git commit -m 'test(touhan): persist failed crop QA evidence' || true
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Upload screenshots and test report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touhan-crop-mobile-375-430
          path: |
            /tmp/touhan_crop_*.png
            touroku-hanbaisha-sprint/official-kansai/CROP_MOBILE_QA_RESULT.json
          if-no-files-found: ignore
      - name: Commit only successful audited outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add touroku-hanbaisha-sprint/official-kansai/CROP_INDEPENDENT_QA_20261124.json
          git add touroku-hanbaisha-sprint/official-kansai/CROP_MOBILE_QA_RESULT.json
          git add touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json
          git add touroku-hanbaisha-ios/release-status.json touroku-hanbaisha-ios/RELEASE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat(touhan): promote 44 original crops after real browser QA'
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
