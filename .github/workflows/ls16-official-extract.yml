name: LS16 Official Extract
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ls16-official-extract.yml'
      - 'sagyo-ryohoshi-sprint/tools/extract_official.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install PDF parser
        run: python -m pip install --quiet 'pypdf>=5,<6'
      - name: Extract official OT exams
        run: python sagyo-ryohoshi-sprint/tools/extract_official.py
      - name: Verify raw frame
        run: |
          python - <<'PY'
          import json
          p='sagyo-ryohoshi-sprint/audit/raw-official.json'
          q=json.load(open(p))
          assert len(q)==600, len(q)
          for r in (1,2,3):
            for s in ('am','pm'):
              z=[x for x in q if x['round']==r and x['session']==s]
              assert len(z)==100,(r,s,len(z))
          print('RAW_FRAME_600_OK')
          print('media',sum(x['requires_media'] for x in q),'excluded',sum(x['scoring_status']=='excluded' for x in q))
          print('bad_choices',sum(len(x['choices'])!=5 for x in q))
          print('answer_missing_nonexcluded',sum((x['answer'] is None and x['scoring_status']!='excluded') for x in q))
          PY
      - name: Commit extraction result
        run: |
          git config user.name 'LS16 Dispatcher'
          git config user.email 'actions@users.noreply.github.com'
          git add sagyo-ryohoshi-sprint/audit/raw-official.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: extract LS16 official 58-60 frames'
            git push origin HEAD:${{ github.head_ref }}
          fi
