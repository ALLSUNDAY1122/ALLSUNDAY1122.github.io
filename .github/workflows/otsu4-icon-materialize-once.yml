name: Otsu4 Canonical AppIcon Materialize Once
on:
  push:
    branches: [feat/otsu4-360-productization]
    paths:
      - '.github/workflows/otsu4-icon-materialize-once.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/otsu4-360-productization
      - name: Download exact canonical Drive PNG
        shell: bash
        run: |
          set -euo pipefail
          out='native-ios/Otsu4Sprint/Assets.xcassets/AppIcon.appiconset/Icon-1024.png'
          curl --fail --location --retry 3 --output "$out" 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-945c-8209-93a8-68cd10b968d0/raw?se=2026-08-10T00%3A19%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=8e0d0232-5e65-5184-81e8-c261b1fd1d29&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T00%3A11%3A14Z&ske=2026-08-11T00%3A11%3A14Z&sks=b&skv=2026-02-06&sig=cNDwowjkZEumdqL2rAuELzAzu2jH2QSt9yAEHE5LzfQ%3D'
          echo 'd0cb19b237ca3306413c481e4fbc0fb871705b390a1bc37619d9683fff19ff2d  '"$out" | sha256sum -c -
          python3 - "$out" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24])==(1024,1024)
          assert b[25]==2
          print('PASS: canonical Otsu4 AppIcon 1024x1024 RGB')
          PY
      - name: Commit canonical icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-ios/Otsu4Sprint/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          if ! git diff --cached --quiet; then
            git commit -m 'otsu4: materialize canonical AppIcon [skip ci]'
            git push origin HEAD:feat/otsu4-360-productization
          fi
