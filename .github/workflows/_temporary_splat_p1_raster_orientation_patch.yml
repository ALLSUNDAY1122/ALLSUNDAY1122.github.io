name: Temporary Splat P1 Raster Orientation Patch

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - .github/workflows/_temporary_splat_p1_raster_orientation_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Apply bounded raster-orientation fix
        shell: python
        run: |
          from pathlib import Path

          software = Path('splat-native-ios/SplatNative/SplatSoftwareDepthSeedBuilder.swift')
          text = software.read_text()
          gray_line = '        grayContext.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))'
          rgb_line = '        rgbContext.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))'
          if text.count(gray_line) != 1 or text.count(rgb_line) != 1:
              raise SystemExit(f'software raster patch point drifted: gray={text.count(gray_line)} rgb={text.count(rgb_line)}')
          text = text.replace(
              gray_line,
              '        grayContext.translateBy(x: 0, y: CGFloat(height))\n'
              '        grayContext.scaleBy(x: 1, y: -1)\n'
              + gray_line,
          )
          text = text.replace(
              rgb_line,
              '        rgbContext.translateBy(x: 0, y: CGFloat(height))\n'
              '        rgbContext.scaleBy(x: 1, y: -1)\n'
              + rgb_line,
          )
          software.write_text(text)

          mesh = Path('splat-native-ios/SplatNative/MeshDenseMVS.swift')
          text = mesh.read_text()
          mesh_line = '        context.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))'
          if text.count(mesh_line) != 1:
              raise SystemExit(f'mesh raster patch point drifted: {text.count(mesh_line)}')
          mesh.write_text(text.replace(
              mesh_line,
              '        context.translateBy(x: 0, y: CGFloat(height))\n'
              '        context.scaleBy(x: 1, y: -1)\n'
              + mesh_line,
          ))

          seed = Path('splat-native-ios/SplatNative/SplatDepthSeedBuilder.swift')
          text = seed.read_text()
          if text.count('static let recipeVersion = 8') != 1:
              raise SystemExit('recipe version patch point drifted')
          seed.write_text(text.replace('static let recipeVersion = 8', 'static let recipeVersion = 9'))

          contract = Path('splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py')
          text = contract.read_text()
          if text.count('"static let recipeVersion = 8"') != 1:
              raise SystemExit('contract recipe patch point drifted')
          text = text.replace('"static let recipeVersion = 8"', '"static let recipeVersion = 9"')
          old = 'assert "translateBy(x: 0, y:" not in SOFTWARE, "S14 image orientation changed independently"'
          if text.count(old) != 1:
              raise SystemExit('orientation contract patch point drifted')
          new = '''for token in (
              "translateBy(x: 0, y: CGFloat(height))",
              "scaleBy(x: 1, y: -1)",
          ):
              assert token in SOFTWARE, f"S14 top-left raster convention missing: {token}"
              assert token in MESH, f"Mesh MVS top-left raster convention missing: {token}"'''
          contract.write_text(text.replace(old, new))
      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --stat
          grep -R "static let recipeVersion = 8" splat-native-ios/SplatNative splat-native-ios/scripts && exit 1 || true
          python3 splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py
      - name: Commit fix
        run: |
          git config user.name "scanlab-macro-loop"
          git config user.email "actions@users.noreply.github.com"
          git add splat-native-ios/SplatNative/SplatSoftwareDepthSeedBuilder.swift \
                  splat-native-ios/SplatNative/MeshDenseMVS.swift \
                  splat-native-ios/SplatNative/SplatDepthSeedBuilder.swift \
                  splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py
          git commit -m "Fix plane-sweep raster orientation"
          git push origin HEAD:feature/splat-post-build17-p1
