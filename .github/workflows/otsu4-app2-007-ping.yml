name: Otsu4 APP2-007 Ping
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  ping:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[OTSU4-PING-APP2-007]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `PING_OK run_id=${context.runId}`});
