name: Temporary Central Release 10 20260722 0648

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-central-release-10-20260722-0648.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/central-release-10-20260722-0648
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy fixed central snapshot
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/region/central:refs/remotes/origin/region/central'
          paths=(
            jichitai-compare/data/municipalities/22/22210.json
            jichitai-compare/operations/tasks/22210.json
            jichitai-compare/data/municipalities/22/22211.json
            jichitai-compare/operations/tasks/22211.json
            jichitai-compare/data/municipalities/22/22212.json
            jichitai-compare/operations/tasks/22212.json
            jichitai-compare/data/municipalities/22/22213.json
            jichitai-compare/operations/tasks/22213.json
            jichitai-compare/data/municipalities/22/22214.json
            jichitai-compare/operations/tasks/22214.json
            jichitai-compare/data/municipalities/22/22215.json
            jichitai-compare/operations/tasks/22215.json
            jichitai-compare/data/municipalities/22/22216.json
            jichitai-compare/operations/tasks/22216.json
            jichitai-compare/data/municipalities/22/22219.json
            jichitai-compare/operations/tasks/22219.json
            jichitai-compare/data/municipalities/22/22220.json
            jichitai-compare/operations/tasks/22220.json
            jichitai-compare/data/municipalities/22/22221.json
            jichitai-compare/operations/tasks/22221.json
          )
          git checkout origin/region/central -- "${paths[@]}"
          actual=$(git diff --name-only --cached | sort)
          expected=$(printf '%s\n' "${paths[@]}" | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '全国統合: 中日本10自治体を固定スナップショット化'
          git push origin coord/central-release-10-20260722-0648
