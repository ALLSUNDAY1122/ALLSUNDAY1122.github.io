name: Sync East B Final 20260725

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.head_ref == 'coord/sync-east-b-final-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate national outputs
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit generated outputs and remove temporary trigger
        run: |
          rm .github/workflows/sync-east-b-final-20260725.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/operations/progress.json \
            jichitai-compare/municipality/12203/index.html \
            jichitai-compare/municipality/13123/index.html \
            jichitai-compare/municipality/15100/index.html \
            jichitai-compare/municipality/15586/index.html \
            .github/workflows/sync-east-b-final-20260725.yml
          git diff --cached --quiet || git commit -m "build: 東日本B最終監査を全国生成物へ反映"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
