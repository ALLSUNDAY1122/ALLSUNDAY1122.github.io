name: Temporary North B Anyone Single Gap Batch 3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-anyone-single-gap-batch3.yml'

permissions:
  contents: write

concurrency:
  group: north-b-anyone-single-gap-batch3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply corrections and capture validation output
        shell: bash
        run: |
          set +e
          mkdir -p jichitai-compare/operations/audits
          log='jichitai-compare/operations/audits/north-b-anyone-single-gap-batch3-ci-diagnostic-20260725.txt'
          : > "$log"

          echo '=== apply corrections ===' | tee -a "$log"
          node jichitai-compare/scripts/temp-north-b-anyone-single-gap-batch3.mjs 2>&1 | tee -a "$log"
          apply_status=${PIPESTATUS[0]}

          echo '=== generate ===' | tee -a "$log"
          (cd jichitai-compare && npm run generate) 2>&1 | tee -a "$log"
          generate_status=${PIPESTATUS[0]}

          echo '=== progress ===' | tee -a "$log"
          (cd jichitai-compare && npm run progress) 2>&1 | tee -a "$log"
          progress_status=${PIPESTATUS[0]}

          echo '=== validate generated ===' | tee -a "$log"
          (cd jichitai-compare && npm run validate:generated) 2>&1 | tee -a "$log"
          validate_status=${PIPESTATUS[0]}

          {
            echo '=== exit codes ==='
            echo "apply=${apply_status}"
            echo "generate=${generate_status}"
            echo "progress=${progress_status}"
            echo "validate=${validate_status}"
          } | tee -a "$log"

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f jichitai-compare/operations/audits/north-b-anyone-single-gap-batch3-ci-diagnostic-20260725.txt
          git commit -m 'diagnostic: 北日本B単一条件第3群の検証出力を保存 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
