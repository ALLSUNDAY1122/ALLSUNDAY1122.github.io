name: Temporary Central A Housing Batch 35 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch35-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch35-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'23212',name:'安城市',status:'verified',summary:'令和8年1月1日以降に結婚等をした39歳以下の夫婦等へ、住宅取得・リフォーム・賃借・引越費用を最大60万円補助する。',source:'https://www.city.anjo.aichi.jp/kurasu/kekkonshien/kekkonshinseikatsushien.html'},
            {code:'23236',name:'みよし市',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.aichi-miyoshi.lg.jp/soshiki/shiminkeizai/kankyo/hojokin/9563.html'},
            {code:'23302',name:'東郷町',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.aichi-togo.lg.jp/hojokin_joseikin/sumai/13261.html'},
            {code:'23230',name:'日進市',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.nisshin.lg.jp/department/toshisangyo/kanko/6/2/3/8514.html'},
            {code:'23424',name:'大治町',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town.oharu.aichi.jp/4509.htm'},
            {code:'25209',name:'甲賀市',status:'verified',summary:'令和8年度、住宅に困窮する民間賃貸住宅入居者へ家賃の2分の1・月額上限2万円を最長24か月補助し、就学前の子がいる世帯は収入基準を月額21万4,000円以下に緩和する。',source:'https://www.city.koka.lg.jp/10842.htm'},
            {code:'28225',name:'朝来市',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住宅取得・リフォーム・賃借・引越費用を最大60万円補助する。',source:'https://www.city.asago.hyogo.jp/site/asagoing/14321.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch35Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const label=target.status==='unavailable'?'公式情報で詳細未確認':'確認済み';
                const statusMatches=html.includes(label);
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,expectedLabel:label,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch35Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{const m=municipalities.find(item=>String(item.code??item.municipalityCode)===target.code);const h=m?.services?.housingSupport;return {code:target.code,found:Boolean(m),statusMatches:h?.status===target.status,summaryMatches:h?.summary===target.summary,sourceMatches:h?.source?.url===target.source,success:Boolean(m)&&h?.status===target.status&&h?.summary===target.summary&&h?.source?.url===target.source};});
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch35-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3967,nationalSyncPullRequest:3969,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:4,expectedVerifiedCount:3,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const out='jichitai-compare/operations/audits/central-a-housing-classification-batch35-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch35-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第35群の公開反映を確認'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
