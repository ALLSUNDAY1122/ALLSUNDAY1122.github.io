name: Central A Cause Scan Summary 20260725

on:
  push:
    branches:
      - audit/central-a-cause-scan-20260725-1031

permissions:
  contents: write

concurrency:
  group: central-a-cause-summary-20260725-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate compact audit summary
        run: node jichitai-compare/scripts/summarize-central-a-cause-scan-20260725.mjs
      - name: Commit summary and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/operations/audits/central-a-cause-based-rescan-summary-20260725.json
          git rm .github/workflows/central-a-cause-summary-20260725.yml
          git rm jichitai-compare/scripts/summarize-central-a-cause-scan-20260725.mjs
          git commit -m "audit: 中日本A原因別横断監査の要約を記録"
          git push origin HEAD:audit/central-a-cause-scan-20260725-1031
