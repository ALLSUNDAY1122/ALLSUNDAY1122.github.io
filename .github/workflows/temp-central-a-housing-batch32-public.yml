name: Temporary Central A Housing Batch 32 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch32-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch32-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'24562',name:'紀宝町',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住居・引越・リフォーム費を最大60万円補助する。',source:'https://www.town.kiho.lg.jp/news/45052/'},
            {code:'28100',name:'神戸市',status:'verified',summary:'2026年4月1日以降、若年夫婦または子育て世帯が親世帯と同居・近居する住みかえに10万円、市外転入の場合は20万円を補助する。',source:'https://www.city.kobe.lg.jp/a01110/kurashi/sumai/jutaku/information/shinkonportal/oyako/r3_oyako.html'},
            {code:'28203',name:'明石市',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.akashi.lg.jp/sangyou/sangyou_ka/jyutakurifomu.html'},
            {code:'28204',name:'西宮市',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.nishi.or.jp/kurashi/sumai/josei/R8-2Reform.html'},
            {code:'28205',name:'洲本市',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻等をした39歳以下の夫婦等へ、住宅購入・賃借・引越・リフォーム費を最大60万円補助する。',source:'https://www.city.sumoto.lg.jp/soshiki/7/31520.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;const pageChecks=[];
            for(const target of targets){
              try{const url=`${base}/municipality/${target.code}/?audit=${nonce}`;const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch32Audit/1.0'}});const html=await response.text();const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));const summaryMatches=html.includes(target.summary);const statusMatches=html.includes(target.status==='unavailable'?'公式情報で詳細未確認':'確認済み');pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});}catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch32Audit/1.0'}});const payload=await response.json();const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);const records=targets.map(target=>{const municipality=municipalities.find(item=>item.code===target.code);const service=municipality?.services?.housingSupport;return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};});const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};}catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};if(final.success)break;await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch32-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3929,nationalSyncPullRequest:3931,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:2,expectedVerifiedCount:3,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const out='jichitai-compare/operations/audits/central-a-housing-classification-batch32-public-verification-20260726.json';fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,JSON.stringify(evidence,null,2)+'\n');const trigger='jichitai-compare/operations/control/central-a-housing-batch32-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第32群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
