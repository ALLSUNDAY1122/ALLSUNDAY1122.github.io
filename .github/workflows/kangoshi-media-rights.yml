name: Kangoshi Media Rights and Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/product-content/media-official-sources.json'
      - 'kangoshi-sprint/product-content/build_official_media_assets.py'
      - 'kangoshi-sprint/product-content/enriched-draft/media-audit-packet.json'
      - '.github/workflows/kangoshi-media-rights.yml'

concurrency:
  group: kangoshi-media-rights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media-rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: python3 -m pip install --disable-pip-version-check 'PyMuPDF>=1.24,<2'
      - name: Build conservative media assets and rights audit
        shell: bash
        run: |
          set +e
          python3 kangoshi-sprint/product-content/build_official_media_assets.py
          code=$?
          set -e
          echo "$code" > /tmp/media-rights.exit
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Commit audit, safe assets and resolutions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/product-content/media-rights-audit.json \
                  kangoshi-sprint/product-content/media-release-resolutions.generated.json \
                  kangoshi-sprint/media/official
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: media rights audit and safe official assets'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
      - name: Enforce no separate rights notation
        run: test "$(cat /tmp/media-rights.exit)" = "0"
