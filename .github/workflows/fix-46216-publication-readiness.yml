name: Fix Hioki Publication Readiness

on:
  pull_request:
    branches: [region/west]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/46216-publication-readiness-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/46216-publication-readiness-20260724
          fetch-depth: 0
      - name: Normalize Hioki data and task
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs = require('fs');
          const municipalityPath = 'jichitai-compare/data/municipalities/46/46216.json';
          const taskPath = 'jichitai-compare/operations/tasks/46216.json';
          const definitionsPath = 'jichitai-compare/data/service-definitions.json';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          const serviceIds = JSON.parse(fs.readFileSync(definitionsPath, 'utf8')).services.map((item) => item.id);

          municipality.status = 'verified';
          municipality.summary = '必須9制度を日置市公式情報で調査。7制度をverified、利用条件を公式公開情報で確定できない病児保育とこども誰でも通園制度をunavailableとして登録。';
          municipality.updatedAt = '2026-07-24';
          municipality.services.sickChildCare = {
            status: 'unavailable',
            summary: '病児保育の実施施設と事前登録は確認できるが、2026年度の利用条件を確定できない',
            details: {
              confirmed: '病院付設の専用スペースで病児保育を実施し、鹿児島こども病院への事前登録が必要',
              unconfirmed: '2026年度の対象年齢、利用料金、開所時間、定員、予約締切、連続利用上限',
              contact: '利用前に鹿児島こども病院または日置市こども未来課へ確認'
            },
            notes: [
              '事業実施の確認を、未掲載の料金・年齢・利用時間の根拠として扱わない。'
            ],
            source: {
              url: 'https://www.city.hioki.kagoshima.jp/jifuku/kurashi/kosodate-kyoiku/kosodate/kodomo/kosodateshien.html',
              checkedAt: '2026-07-24'
            }
          };
          municipality.services.temporaryChildcare = {
            status: 'unavailable',
            summary: '2026年度のこども誰でも通園制度実施は確認できるが、利用者向け条件を確定できない',
            details: {
              confirmed: '2026年3月26日の子ども・子育て会議で、乳児等通園支援事業実施に伴う第3期計画変更が承認された',
              unconfirmed: '実施施設、対象月齢、月間利用上限、利用料金、利用時間、認定・面談・予約方法',
              contact: '日置市こども未来課子ども福祉係へ確認'
            },
            notes: [
              '事業計画の承認を、利用者向けの具体的条件の根拠として扱わない。'
            ],
            source: {
              url: 'https://www.city.hioki.kagoshima.jp/jifuku/kogomokosodatekaigikekka.html',
              checkedAt: '2026-07-24'
            }
          };

          const services = serviceIds.map((id) => municipality.services[id]);
          const completed = new Set(['verified', 'unavailable']);
          const officialSources = [...new Set(services.filter((s) => completed.has(s.status)).map((s) => s.source?.url).filter((url) => /^https:\/\//u.test(url ?? '')))];
          task.status = 'pr_open';
          task.currentService = null;
          task.nextServiceIndex = serviceIds.length;
          task.completedServices = [...serviceIds];
          task.verifiedCount = services.filter((s) => s.status === 'verified').length;
          task.researchingCount = 0;
          task.unavailableCount = services.filter((s) => s.status === 'unavailable').length;
          task.needsMediumReviewCount = 0;
          task.currentBranch = 'fix/46216-publication-readiness-20260724';
          task.pullRequestNumber = null;
          task.lastCheckedAt = '2026-07-24';
          task.lastUpdatedAt = '2026-07-24T14:45:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.officialSources = officialSources;
          task.notes = [...(task.notes ?? []), '病児保育とこども誰でも通園制度は事業実施を確認したが、2026年度利用者向け条件を確定できないためunavailableへ正規化。'];
          task.blockers = [];

          fs.writeFileSync(municipalityPath, `${JSON.stringify(municipality, null, 2)}\n`);
          fs.writeFileSync(taskPath, `${JSON.stringify(task, null, 2)}\n`);
          NODE
          git rm .github/workflows/fix-46216-publication-readiness.yml
          git add jichitai-compare/data/municipalities/46/46216.json jichitai-compare/operations/tasks/46216.json
          git commit -m "fix: 日置市を7 verified・2 unavailableへ正規化"
          git push origin HEAD:fix/46216-publication-readiness-20260724
