name: Central A Scope Audit Round 06 v2

on:
  push:
    branches: ['audit/central-a-round06-work-20260725']
    paths: ['.github/workflows/central-a-scope-round-06-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/central-a-round06-work-20260725
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Aichi municipalities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit-round06.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare',prefectureCode='23',prefectureName='愛知県';
          const expected={
            '23100':'名古屋市','23201':'豊橋市','23202':'岡崎市','23203':'一宮市','23204':'瀬戸市','23205':'半田市','23206':'春日井市','23207':'豊川市','23208':'津島市','23209':'碧南市','23210':'刈谷市','23211':'豊田市','23212':'安城市','23213':'西尾市','23214':'蒲郡市','23215':'犬山市','23216':'常滑市','23217':'江南市','23219':'小牧市','23220':'稲沢市','23221':'新城市','23222':'東海市','23223':'大府市','23224':'知多市','23225':'知立市','23226':'尾張旭市','23227':'高浜市','23228':'岩倉市','23229':'豊明市','23230':'日進市','23231':'田原市','23232':'愛西市','23233':'清須市','23234':'北名古屋市','23235':'弥富市','23236':'みよし市','23237':'あま市','23238':'長久手市','23302':'東郷町','23342':'豊山町','23361':'大口町','23362':'扶桑町','23424':'大治町','23425':'蟹江町','23427':'飛島村','23441':'阿久比町','23442':'東浦町','23445':'南知多町','23446':'美浜町','23447':'武豊町','23501':'幸田町','23561':'設楽町','23562':'東栄町','23563':'豊根村'
          };
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const completedStatus=new Set(['verified','unavailable']);
          const findings=[],unavailable=[],substantiveSuspects=[],municipalities=[];
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const add=(severity,type,code,extra={})=>findings.push({severity,type,code,...extra});
          for(const [code,name] of Object.entries(expected)){
            const dp=path.join(root,'data','municipalities','23',code+'.json'),tp=path.join(root,'operations','tasks',code+'.json');
            if(!fs.existsSync(dp)){add('high','missing_municipality_file',code,{name});continue;}
            if(!fs.existsSync(tp)){add('high','missing_task_file',code,{name});continue;}
            let d,t;try{d=JSON.parse(fs.readFileSync(dp,'utf8'));}catch(e){add('high','invalid_municipality_json',code,{error:e.message});continue;}
            try{t=JSON.parse(fs.readFileSync(tp,'utf8'));}catch(e){add('high','invalid_task_json',code,{error:e.message});continue;}
            if(d.code!==code||d.name!==name||d.prefectureCode!=='23'||d.prefecture!=='愛知県')add('high','municipality_identity_mismatch',code,{actual:{code:d.code,name:d.name,prefectureCode:d.prefectureCode,prefecture:d.prefecture}});
            if(t.municipalityCode!==code||t.municipalityName!==name||t.prefectureCode!=='23'||t.prefectureName!=='愛知県')add('high','task_identity_mismatch',code);
            if(t.assignedTeam!=='中日本調査班')add('high','assigned_team_mismatch',code,{actual:t.assignedTeam});
            if(!eq(Object.keys(d.services||{}).sort(),[...keys].sort()))add('high','service_key_mismatch',code,{actual:Object.keys(d.services||{})});
            const counts={verified:0,unavailable:0,needs_medium_review:0,researching:0};
            for(const k of keys){const s=d.services?.[k];if(s&&Object.hasOwn(counts,s.status))counts[s.status]++;if(s?.status==='unavailable')unavailable.push({code,name,service:k,summary:s.summary||''});}
            const completed=keys.filter(k=>completedStatus.has(d.services?.[k]?.status));
            const official=[...new Set(keys.filter(k=>completedStatus.has(d.services?.[k]?.status)&&/^https:\/\//.test(d.services?.[k]?.source?.url||'')).map(k=>d.services[k].source.url))];
            if(!eq(t.completedServices,completed))add('medium','completed_services_mismatch',code,{expected:completed,actual:t.completedServices});
            const nextIndex=completed.length===9?9:keys.findIndex(k=>!completedStatus.has(d.services?.[k]?.status));
            for(const [field,val] of [['verifiedCount',counts.verified],['unavailableCount',counts.unavailable],['needsMediumReviewCount',counts.needs_medium_review],['researchingCount',counts.researching],['nextServiceIndex',nextIndex]])if(t[field]!==val)add('medium',field+'_mismatch',code,{expected:val,actual:t[field]});
            const current=nextIndex===9?null:keys[nextIndex];if(t.currentService!==current)add('medium','current_service_mismatch',code,{expected:current,actual:t.currentService});
            if(!eq(t.officialSources,official))add('medium','official_sources_mismatch',code,{expected:official,actual:t.officialSources});
            if(completed.length===9&&d.status!=='verified')add('medium','top_level_status_mismatch',code,{actual:d.status});
            if(completed.length===9&&t.status!=='merged')add('medium','task_status_mismatch',code,{actual:t.status});
            const temp=d.services?.temporaryChildcare,text=`${temp?.summary||''} ${JSON.stringify(temp?.details||{})}`;
            if(temp?.status==='verified'&&!/(誰でも通園|乳児等通園|月\s*10\s*時間|就労要件を問わ)/.test(text))substantiveSuspects.push({type:'possible_any_child_access_omission',code,name,service:'temporaryChildcare',summary:temp.summary||'',source:temp.source?.url||''});
            const meal=d.services?.schoolMeals,mtext=`${meal?.summary||''} ${JSON.stringify(meal?.details||{})}`;
            if(meal?.status==='verified'&&!/(令和8|2026)/.test(mtext))substantiveSuspects.push({type:'school_meal_currentness_check',code,name,service:'schoolMeals',summary:meal.summary||'',source:meal.source?.url||''});
            const post=d.services?.postpartumCare,ptext=`${post?.summary||''} ${JSON.stringify(post?.details||{})}`;
            if(post?.status==='verified'&&!/(1年|12か月|宿泊|通所|訪問)/.test(ptext))substantiveSuspects.push({type:'postpartum_scope_check',code,name,service:'postpartumCare',summary:post.summary||'',source:post.source?.url||''});
            const highRisk={};for(const k of ['schoolMeals','postpartumCare','temporaryChildcare','housingSupport']){const s=d.services?.[k];highRisk[k]={status:s?.status||null,summary:s?.summary||'',source:s?.source?.url||'',checkedAt:s?.source?.checkedAt||null};}
            municipalities.push({code,name,status:d.status,updatedAt:d.updatedAt,taskStatus:t.status,taskLastCheckedAt:t.lastCheckedAt,verifiedCount:counts.verified,unavailableCount:counts.unavailable,needsMediumReviewCount:counts.needs_medium_review,officialSourceCount:official.length,taskOfficialSourceCount:(t.officialSources||[]).length,highRisk});
          }
          const report={schemaVersion:'1.0.0',auditId:'central-a-scope-round-06-aichi-20260725',prefectureCode,prefectureName,expectedMunicipalityCount:Object.keys(expected).length,checkedMunicipalityCount:municipalities.length,checkedServiceCount:municipalities.length*9,generatedAt:'2026-07-25T02:20:00+09:00',structuralFindingCount:findings.length,unavailableCount:unavailable.length,substantiveSuspectCount:substantiveSuspects.length,findings,unavailable,substantiveSuspects,municipalities};
          fs.writeFileSync(path.join(root,'operations','control','central-a-scope-round-06-aichi-20260725.json'),JSON.stringify(report,null,2)+'\n');
          NODE
          node /tmp/audit-round06.mjs
          rm .github/workflows/central-a-scope-round-06-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: 愛知県54自治体の構造監査結果を記録'
          git push origin HEAD:audit/central-a-round06-work-20260725
