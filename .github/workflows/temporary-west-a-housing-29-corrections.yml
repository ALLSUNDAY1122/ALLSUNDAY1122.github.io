name: Temporary West A Housing 29 Corrections

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-housing-29-corrections-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply-corrections:
    if: github.head_ref == 'audit/west-a-housing-classification-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply 29 housing classification corrections
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T15:03:00+09:00';
          const branch = 'region/west';
          const pullRequestNumber = 3476;
          const planPath = `${root}/operations/audits/west-a-housing-classification-correction-plan-20260725.json`;
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const definitions = JSON.parse(fs.readFileSync(`${root}/data/service-definitions.json`, 'utf8'));
          const serviceIds = definitions.services.map((item) => item.id);
          const applied = [];

          function writeJson(path, value, pretty = true) {
            fs.writeFileSync(path, JSON.stringify(value, null, pretty ? 2 : 0) + (pretty ? '\n' : ''));
          }
          function primaryUrls(services) {
            return [...new Set(serviceIds
              .map((id) => services[id])
              .filter((service) => ['verified', 'unavailable'].includes(service?.status))
              .map((service) => service?.source?.url)
              .filter((url) => typeof url === 'string' && url.startsWith('https://')))];
          }

          for (const item of plan.correctionsPlanned) {
            const municipalityPath = `${root}/data/municipalities/${item.prefectureCode}/${item.municipalityCode}.json`;
            const municipalityRaw = fs.readFileSync(municipalityPath, 'utf8');
            const municipality = JSON.parse(municipalityRaw);
            const service = municipality.services?.housingSupport;
            if (!service || service.status !== 'verified') {
              throw new Error(`${item.municipalityCode}: expected verified housingSupport`);
            }
            const previous = JSON.parse(JSON.stringify(service));
            const programLabel = previous.summary ?? item.fetchedTitle ?? '一般の住宅・移住支援制度';
            service.status = 'unavailable';
            service.summary = `一般の住宅・移住支援制度（${programLabel}）は確認できるが、子育て世帯固有の住宅支援条件を確認できない`;
            service.notes = [
              `2026年7月25日に公式ページ「${item.fetchedTitle ?? item.sourceUrl}」を再確認した。`,
              '確認できる対象・条件・補助額は一般の移住、空き家、住宅取得、改修、除却または耐震等に関するもので、子どもの有無、対象年齢、子育て世帯限定または子育て加算を要件としていない。',
              '一般制度の存在は保持するが、子育て世帯向け住宅支援として登録しない。'
            ];
            service.details = {
              ...(previous.details ?? {}),
              confirmedGeneralProgramSummary: previous.summary ?? null,
              previousStatus: 'verified',
              classificationReview: '一般移住・一般住宅制度を子育て世帯向け住宅支援として登録していた分類誤りを訂正',
              childSpecificConditionConfirmed: false
            };
            service.source = {
              ...(previous.source ?? {}),
              url: item.sourceUrl,
              checkedAt
            };
            if (previous.additionalSources) service.additionalSources = previous.additionalSources;

            municipality.updatedAt = checkedAt;
            const services = Object.values(municipality.services);
            const verifiedCount = services.filter((entry) => entry.status === 'verified').length;
            const unavailableCount = services.filter((entry) => entry.status === 'unavailable').length;
            municipality.summary = `必須9制度を公式情報で再監査。${verifiedCount}制度をverified、${unavailableCount}制度をunavailableとして登録。住宅支援は一般制度のみ確認され、子育て世帯固有条件を確認できないためunavailableへ訂正。`;
            writeJson(municipalityPath, municipality, municipalityRaw.includes('\n  "'));

            const taskPath = `${root}/operations/tasks/${item.municipalityCode}.json`;
            const taskRaw = fs.readFileSync(taskPath, 'utf8');
            const task = JSON.parse(taskRaw);
            task.status = 'merged';
            task.currentBranch = branch;
            task.pullRequestNumber = pullRequestNumber;
            task.verifiedCount = verifiedCount;
            task.unavailableCount = unavailableCount;
            task.researchingCount = services.filter((entry) => entry.status === 'researching').length;
            task.needsMediumReviewCount = services.filter((entry) => entry.status === 'needs_medium_review').length;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班A・住宅支援分類226自治体横断監査';
            task.officialSources = primaryUrls(municipality.services);
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            const note = `2026-07-25 15:03: 住宅支援分類横断監査で、${programLabel}は子育て世帯固有条件を持たない一般制度と確認。housingSupportをverifiedからunavailableへ訂正（PR #3476）。`;
            if (!task.notes.includes(note)) task.notes.push(note);
            task.blockers = [];
            writeJson(taskPath, task, taskRaw.includes('\n  "'));

            applied.push({
              municipalityCode: item.municipalityCode,
              municipalityName: item.municipalityName,
              prefectureCode: item.prefectureCode,
              prefecture: item.prefecture,
              service: 'housingSupport',
              before: 'verified',
              after: 'unavailable',
              previousSummary: previous.summary ?? null,
              officialSource: item.sourceUrl,
              fetchedTitle: item.fetchedTitle,
              reason: '公式本文および既存記録に子育て世帯固有条件がなく、一般移住・一般住宅制度の分類誤り'
            });
          }

          plan.appliedAt = updatedAt;
          plan.appliedCorrectionCount = applied.length;
          plan.appliedCorrections = applied;
          plan.regionalPullRequestNumber = pullRequestNumber;
          plan.status = 'corrections_applied_manual_and_fetch_review_pending';
          writeJson(planPath, plan);

          const crossPath = `${root}/operations/audits/west-a-housing-classification-crosscheck-20260725.json`;
          const cross = JSON.parse(fs.readFileSync(crossPath, 'utf8'));
          cross.appliedCorrectionCount = applied.length;
          cross.appliedCorrectionMunicipalityCodes = applied.map((entry) => entry.municipalityCode);
          cross.manualReviewPendingCount = plan.manualReviewCount;
          cross.fetchProblemPendingCount = plan.fetchProblemCount;
          cross.regionalPullRequestNumber = pullRequestNumber;
          cross.status = '29_corrections_applied_9_followups_pending';
          writeJson(crossPath, cross);

          const highRiskPath = `${root}/operations/audits/west-a-housing-high-risk-summary-20260725.json`;
          const highRisk = JSON.parse(fs.readFileSync(highRiskPath, 'utf8'));
          highRisk.appliedCorrectionCount = applied.length;
          highRisk.appliedCorrectionMunicipalityCodes = applied.map((entry) => entry.municipalityCode);
          highRisk.status = 'strong_candidates_corrected_manual_and_fetch_review_pending';
          writeJson(highRiskPath, highRisk);

          const batch = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-housing-classification-29-corrections-20260725',
            team: '西日本調査班A',
            appliedAt: updatedAt,
            regionalPullRequestNumber: pullRequestNumber,
            correctionCount: applied.length,
            corrections: applied,
            manualReviewPending: plan.manualReview,
            fetchProblemsPending: plan.fetchProblems,
            unresolvedCount: plan.manualReviewCount + plan.fetchProblemCount,
            status: 'regional_ci_pending',
            blocker: null
          };
          writeJson(`${root}/operations/audits/west-a-housing-classification-29-corrections-20260725.json`, batch);
          NODE

          rm -f jichitai-compare/operations/control/west-a-housing-29-corrections-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-housing-29-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/operations/audits/west-a-housing-classification-crosscheck-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-high-risk-summary-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-correction-plan-20260725.json \
                  jichitai-compare/operations/audits/west-a-housing-classification-29-corrections-20260725.json \
                  jichitai-compare/operations/control/west-a-housing-29-corrections-trigger-20260725.json \
                  .github/workflows/temporary-west-a-housing-29-corrections.yml
          git diff --cached --check
          git commit -m 'fix: 西日本A住宅支援29件の分類誤りを訂正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
