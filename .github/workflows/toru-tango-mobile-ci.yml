name: Toru Tango Mobile CI

on:
  push:
    paths:
      - 'toru-tango-mobile/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'
  pull_request:
    paths:
      - 'toru-tango-mobile/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: toru-tango-mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Expo Doctor
        run: npm run doctor
