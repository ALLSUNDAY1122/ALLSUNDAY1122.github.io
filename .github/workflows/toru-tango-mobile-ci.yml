name: Toru Tango Mobile CI

on:
  push:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/generator-v2.js'
      - 'toru-tango/tests/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'
  pull_request:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/generator-v2.js'
      - 'toru-tango/tests/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: ESLint
        id: lint
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          npm run lint 2>&1 | tee ci-logs/lint.log

      - name: Expo Doctor
        id: doctor
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          npm run doctor 2>&1 | tee ci-logs/doctor.log

      - name: Expo config
        id: expo_config
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          npx expo config --type public 2>&1 | tee ci-logs/expo-config.log

      - name: Web semantic generator regressions
        id: generator_tests
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          node --test ../toru-tango/tests/generator-v2.test.cjs 2>&1 | tee ci-logs/generator-tests.log

      - name: Mobile OCR-aware generator regressions
        id: mobile_generator_tests
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          rm -rf .tmp-regression
          npx tsc -p tsconfig.regression.json 2>&1 | tee ci-logs/mobile-generator-compile.log
          node --test tests/mobile-generator.test.cjs 2>&1 | tee ci-logs/mobile-generator-tests.log
          rm -rf .tmp-regression

      - name: Native OCR module structure
        id: native_ocr
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          test -f modules/toru-tango-ocr/expo-module.config.json
          test -f modules/toru-tango-ocr/index.ts
          test -f modules/toru-tango-ocr/ios/ToruTangoOcrModule.swift
          grep -q 'ToruTangoOcrModule' modules/toru-tango-ocr/expo-module.config.json
          grep -q 'Name("ToruTangoOcr")' modules/toru-tango-ocr/ios/ToruTangoOcrModule.swift
          grep -q 'VNRecognizeTextRequest' modules/toru-tango-ocr/ios/ToruTangoOcrModule.swift
          echo 'Apple Vision OCR module structure: OK' | tee ci-logs/native-ocr.log

      - name: Worker syntax
        id: worker
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          node --check ../toru-tango/backend/src/index.js 2>&1 | tee ci-logs/worker.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-validation-logs
          path: toru-tango-mobile/ci-logs
          if-no-files-found: error
          retention-days: 7

      - name: Validation gate
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.doctor.outcome }}" = "success"
          test "${{ steps.expo_config.outcome }}" = "success"
          test "${{ steps.generator_tests.outcome }}" = "success"
          test "${{ steps.mobile_generator_tests.outcome }}" = "success"
          test "${{ steps.native_ocr.outcome }}" = "success"
          test "${{ steps.worker.outcome }}" = "success"
