name: Toru Tango Mobile CI

on:
  push:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'
  pull_request:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Mobile checks
        run: npm run check

      - name: Worker syntax
        run: node --check ../toru-tango/backend/src/index.js
