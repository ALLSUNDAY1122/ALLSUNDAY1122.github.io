name: Toru Tango Mobile CI

on:
  push:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'
  pull_request:
    paths:
      - 'toru-tango-mobile/**'
      - 'toru-tango/backend/**'
      - '.github/workflows/toru-tango-mobile-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toru-tango-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Expo Doctor
        run: npm run doctor

      - name: Expo config
        run: npx expo config --type public > /tmp/toru-tango-expo-config.json

      - name: Worker syntax
        run: node --check ../toru-tango/backend/src/index.js
