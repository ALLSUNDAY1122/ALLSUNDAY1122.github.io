name: Temporary Central A Weak Source Batch 1

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch1-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-weak-source-batch1-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply weak primary source batch 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T20:53:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const readJson=p=>{const raw=fs.readFileSync(p,'utf8');return{raw,obj:JSON.parse(raw)}};
          const writeJson=(p,raw,obj)=>fs.writeFileSync(p,(raw.startsWith('{\n')?JSON.stringify(obj,null,2):JSON.stringify(obj))+'\n');
          const appendSource=(svc,entry)=>{
            const list=Array.isArray(svc.additionalSources)?svc.additionalSources:[];
            if(!list.some(x=>x.url===entry.url))list.push(entry);
            svc.additionalSources=list;
          };
          const decisions=[
            {code:'17324',pref:'17',name:'川北町',service:'postpartumCare',outcome:'primary_source_replaced',previousUrl:'https://www1.g-reiki.net/kawakita/reiki_honbun/i114RG00000533.html',newUrl:'https://www.town.kawakita.ishikawa.jp/archives/001/202507/%E5%AD%90%E8%82%B2%E3%81%A6%E3%82%AC%E3%82%A4%E3%83%89%E3%83%96%E3%83%83%E3%82%AF%E5%86%85%E5%AE%B92025.pdf',basis:'令和7年度子育てガイドブックの利用者向け産後ケア案内で、産後1年以内、宿泊・通所・訪問型の費用助成を確認'},
            {code:'17384',pref:'17',name:'志賀町',service:'postpartumCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www1.g-reiki.net/shika/reiki_honbun/i130RG00000994.html',newUrl:'https://www1.g-reiki.net/shika/reiki_honbun/i130RG00000994.html',basis:'町公式の妊娠・出産一覧に専用利用案内が掲載されていないため、現行要綱を直接根拠として維持し、利用者向けカテゴリー導線を追加'},
            {code:'21204',pref:'21',name:'多治見市',service:'housingSupport',outcome:'direct_user_page_maintained',previousUrl:'https://www.city.tajimi.lg.jp/shisei/shisaku_keikaku/1007314/1007315.html',newUrl:'https://www.city.tajimi.lg.jp/shisei/shisaku_keikaku/1007314/1007315.html',basis:'令和8年度結婚新生活支援金の対象、費用、上限、申請期限を直接掲載する現行利用者向けページを確認'},
            {code:'22209',pref:'22',name:'島田市',service:'housingSupport',outcome:'direct_user_page_maintained',previousUrl:'https://www.city.shimada.shizuoka.jp/kurashi-docs/chyukojutakukounyuusyoureikin.html',newUrl:'https://www.city.shimada.shizuoka.jp/kurashi-docs/kekkonsinseikatsusien.html',basis:'既に現行JSONでは受付中の結婚新生活支援補助金の直接案内へ差し替え済みで、対象、費用、上限、年度を確認'},
            {code:'22221',pref:'22',name:'湖西市',service:'sickChildCare',outcome:'authoritative_source_retained_navigation_added',previousUrl:'https://www.city.kosai.shizuoka.jp/section/reiki/reiki_honbun/g322RG00001316.html',newUrl:'https://www.city.kosai.shizuoka.jp/section/reiki/reiki_honbun/g322RG00001316.html',basis:'体調不良児対応型は在籍施設内で実施する事業で専用利用案内が公開されていないため、交付要綱を直接根拠として維持し、子育てポータル導線を追加'}
          ];

          for(const d of decisions){
            const municipalityPath=path.join(root,'data/municipalities',d.pref,`${d.code}.json`);
            const m=readJson(municipalityPath);
            const svc=m.obj.services[d.service];
            if(!svc||svc.status!=='verified')throw new Error(`Missing verified service ${d.code}:${d.service}`);
            if(d.code==='17324'){
              svc.source={url:d.newUrl,checkedAt};
              appendSource(svc,{url:d.previousUrl,checkedAt,description:'産後ケア費用助成事業の対象・類型・費用等を定める公式要綱'});
              appendSource(svc,{url:'https://www.town.kawakita.ishikawa.jp/gyosei1/fukushi/entry-495.html',checkedAt,description:'令和7年度川北町子育てガイドブック掲載ページ'});
            }else if(d.code==='17384'){
              svc.source.checkedAt=checkedAt;
              appendSource(svc,{url:'https://www.town.shika.lg.jp/life/3/14/',checkedAt,description:'町公式の妊娠・出産利用者向けカテゴリー。産後ケア専用ページは現時点で未掲載'});
            }else if(d.code==='22221'){
              svc.source.checkedAt=checkedAt;
              appendSource(svc,{url:'https://www.city.kosai.shizuoka.jp/kosodate_kyoiku/kosodate/index.html',checkedAt,description:'湖西市子育てポータル。体調不良児対応型の専用利用案内は現時点で未掲載'});
            }else{
              svc.source.checkedAt=checkedAt;
            }
            m.obj.updatedAt=checkedAt;
            writeJson(municipalityPath,m.raw,m.obj);

            const taskPath=path.join(root,'operations/tasks',`${d.code}.json`);
            const t=readJson(taskPath);
            const counts={verified:0,unavailable:0,researching:0,needsMediumReview:0};
            for(const key of keys){const status=m.obj.services[key]?.status;if(status in counts)counts[status]++;}
            t.obj.status='merged';
            t.obj.currentService=null;
            t.obj.nextServiceIndex=9;
            t.obj.completedServices=[...keys];
            t.obj.verifiedCount=counts.verified;
            t.obj.unavailableCount=counts.unavailable;
            t.obj.researchingCount=counts.researching;
            t.obj.needsMediumReviewCount=counts.needsMediumReview;
            t.obj.lastCheckedAt=checkedAt;
            t.obj.lastUpdatedAt=updatedAt;
            t.obj.lastUpdatedBy='中日本調査班A';
            t.obj.pullRequestNumber=Number(process.env.PR_NUMBER);
            t.obj.mergedViaPR=Number(process.env.PR_NUMBER);
            t.obj.lastWorkflowRunId=Number(process.env.RUN_ID);
            t.obj.officialSources=[...new Set(keys.map(k=>m.obj.services[k]).filter(s=>s?.status==='verified'&&s.source?.url).map(s=>s.source.url))];
            t.obj.notes=Array.isArray(t.obj.notes)?t.obj.notes:[];
            t.obj.notes.push(`2026-07-26 弱い主出典第1群: ${d.service}を再確認（${d.outcome}）。${d.basis}`);
            writeJson(taskPath,t.raw,t.obj);
          }

          const audit={
            schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch1-decisions-20260726',session:'中日本調査班A',coordinatorSession:'統括B',checkedAt,updatedAt,category:'weakPrimarySource',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:1,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:2,remainingCandidates:28,decisions,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'regional_validated_pending_merge',blocker:null
          };
          fs.writeFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch1-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');
          const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));
          const processed=new Set(decisions.map(d=>`${d.code}:${d.service}`));
          recovery.queue=(recovery.queue??[]).filter(x=>!processed.has(`${x.code}:${x.service}`));
          recovery.queueCount=recovery.queue.length;
          recovery.nextBatch=recovery.queue.slice(0,5);
          recovery.processedBatches=Array.isArray(recovery.processedBatches)?recovery.processedBatches:[];
          recovery.processedBatches.push({batch:1,processedAt:updatedAt,reviewedServiceCount:5,remainingCandidates:recovery.queue.length,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID)});
          recovery.status='active_queue_recovered_batch1_processed';
          fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.status='completed';
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='弱い主出典残28件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          const q=checkpoint.qualityReaudit;
          q.latestCompletedAt=updatedAt;
          q.correctedMunicipalitiesRechecked=236;
          q.primarySourceSlotsRechecked=668;
          q.candidateCounts.weakPrimarySource=28;
          q.latestWeakSourceBatch={batch:1,status:'regional_validated_pending_merge',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:1,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:2,remainingCandidates:28,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          q.confirmedCorrections=Array.isArray(q.confirmedCorrections)?q.confirmedCorrections:[];
          for(const d of decisions.filter(x=>x.outcome!=='direct_user_page_maintained')){
            if(!q.confirmedCorrections.some(x=>x.code===d.code&&x.service===d.service))q.confirmedCorrections.push({type:d.outcome,code:d.code,service:d.service,name:d.name});
          }
          checkpoint.lastAction='弱い主出典第1群5制度を再確認し、川北町産後ケアを利用者向けガイドへ更新、志賀町・湖西市は要綱と利用者向け導線を併記、多治見市・島田市は直接案内を維持した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-weak-source-batch1-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第1群を改善'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
