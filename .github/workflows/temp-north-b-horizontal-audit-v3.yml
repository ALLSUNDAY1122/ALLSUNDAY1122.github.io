name: Temporary North B Horizontal Audit V3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-horizontal-audit-v3.yml'

permissions:
  contents: write

concurrency:
  group: north-b-horizontal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run faster horizontal audit
        id: scan
        shell: bash
        run: |
          set +e
          sed -i 's/setTimeout(() => controller.abort(), 15000)/setTimeout(() => controller.abort(), 6000)/' jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs
          sed -i 's/Array.from({ length: 10 }/Array.from({ length: 30 }/' jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs
          timeout 17m node jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs > /tmp/north-b-horizontal-audit.log 2>&1
          status=$?
          tail -200 /tmp/north-b-horizontal-audit.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/north-b-horizontal-audit.log jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log
          else
            rm -f jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit audit result or diagnostic log
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json \
                  jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No report or diagnostic log was created.'
          else
            git commit -m 'audit: 北日本B URL・年度・数値横断検査結果を記録 [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
          if [ '${{ steps.scan.outputs.status }}' != '0' ]; then
            exit '${{ steps.scan.outputs.status }}'
          fi
