name: Temporary North B Horizontal Audit V3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-horizontal-audit-v3.yml'

permissions:
  contents: write

concurrency:
  group: north-b-horizontal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run faster horizontal audit
        id: scan
        shell: bash
        run: |
          set +e
          sed -i 's/setTimeout(() => controller.abort(), 15000)/setTimeout(() => controller.abort(), 6000)/' jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs
          sed -i 's/Array.from({ length: 10 }/Array.from({ length: 30 }/' jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs
          timeout 17m node jichitai-compare/scripts/temp-north-b-horizontal-audit.mjs > /tmp/north-b-horizontal-audit.log 2>&1
          status=$?
          tail -200 /tmp/north-b-horizontal-audit.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/north-b-horizontal-audit.log jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log
          else
            rm -f jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-b-horizontal-audit
          path: |
            jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json
            jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.error.log
          if-no-files-found: warn

      - name: Save successful report through GitHub API
        if: steps.scan.outputs.status == '0'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.head_ref }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const reportPath = 'jichitai-compare/operations/audits/north-b-horizontal-url-year-numeric-20260725.json';
            const content = Buffer.from(fs.readFileSync(reportPath)).toString('base64');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.BRANCH;
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: reportPath, ref: branch });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: reportPath,
              message: 'audit: 北日本B URL・年度・数値横断検査結果を記録 [skip ci]',
              content,
              branch,
              ...(sha ? { sha } : {})
            });

      - name: Fail when scan failed
        if: steps.scan.outputs.status != '0'
        shell: bash
        run: exit '${{ steps.scan.outputs.status }}'
