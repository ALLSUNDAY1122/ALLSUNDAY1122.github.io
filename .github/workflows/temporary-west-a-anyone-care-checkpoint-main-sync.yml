name: Temporary West A Anyone Care Checkpoint Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-anyone-care-checkpoint-main-sync-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-a-anyone-care-checkpoint-main-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Copy regional checkpoint truth
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin region/west
          paths=(
            jichitai-compare/operations/audits/west-a-anyone-care-checkpoint-clean-ci-trigger-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-a-anyone-care-crosscheck-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-a.json
          )
          git checkout origin/region/west -- "${paths[@]}"
          rm -f jichitai-compare/operations/control/west-a-anyone-care-checkpoint-main-sync-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-anyone-care-checkpoint-main-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}" \
                  jichitai-compare/operations/control/west-a-anyone-care-checkpoint-main-sync-trigger-20260725.json \
                  .github/workflows/temporary-west-a-anyone-care-checkpoint-main-sync.yml
          git diff --cached --check
          git commit -m 'sync: 西日本A誰でも通園checkpointをmainへ反映'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
