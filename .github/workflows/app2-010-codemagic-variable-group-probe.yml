name: APP2-010 Codemagic Variable Group Probe

on:
  push:
    branches: [main]
    paths: ['automation/app2-010-codemagic-variable-group-probe.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Probe Codemagic group and secret variable API
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          from pathlib import Path
          cmd=json.loads(Path('automation/app2-010-codemagic-variable-group-probe.json').read_text())
          rid=cmd['request_id']; app=cmd['app_id']; name=cmd['group_name']; token=os.environ.get('CM_API_TOKEN','')
          out=Path('automation/codemagic-results')/f'{rid}.json'; out.parent.mkdir(parents=True,exist_ok=True)
          result={'request_id':rid,'app_id':app,'group_name':name,'ok':False}; group_id=None
          if not re.fullmatch(r'app2-010-cm-group-probe[A-Za-z0-9._-]{1,70}',rid): raise SystemExit('bad request id')
          if app!='6a769d81a1add9d06020b524' or name!='app2_010_probe' or not token: raise SystemExit('bad preflight')
          def call(method,path,payload=None):
              req=urllib.request.Request('https://codemagic.io'+path,data=(json.dumps(payload).encode() if payload is not None else None),method=method,headers={'x-auth-token':token,'Accept':'application/json','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode(); return r.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except: body={'raw':raw[:700]}
                  return e.code,body
          def arr(payload):
              if isinstance(payload,list): return payload
              if isinstance(payload,dict):
                  for k in ('data','variable_groups','groups','variables'):
                      v=payload.get(k)
                      if isinstance(v,list): return v
                      if isinstance(v,dict):
                          for k2 in ('data','items','groups','variables'):
                              if isinstance(v.get(k2),list): return v[k2]
              return []
          def gid(x): return (x.get('id') or x.get('_id')) if isinstance(x,dict) else None
          def gname(x): return (x.get('name') or x.get('group_name')) if isinstance(x,dict) else None
          try:
              s,b=call('GET',f'/api/v3/apps/{app}/variable-groups'); result['list_before_http_status']=s
              if not 200<=s<300: raise RuntimeError(f'list-before HTTP {s}: {str(b)[:500]}')
              existing=next((g for g in arr(b) if gname(g)==name),None); group_id=gid(existing)
              if not group_id:
                  s,b=call('POST',f'/api/v3/apps/{app}/variable-groups',{'name':name}); result['create_http_status']=s; result['create_response_keys']=sorted(b.keys()) if isinstance(b,dict) else []
                  if not 200<=s<300: raise RuntimeError(f'create HTTP {s}: {str(b)[:500]}')
                  candidates=[b,b.get('data') if isinstance(b,dict) else None,b.get('variable_group') if isinstance(b,dict) else None]
                  group_id=next((gid(x) for x in candidates if gid(x)),None)
                  if not group_id:
                      s2,b2=call('GET',f'/api/v3/apps/{app}/variable-groups')
                      group_id=gid(next((g for g in arr(b2) if gname(g)==name),None))
              if not group_id: raise RuntimeError('group id unresolved')
              result['group_id']=group_id
              s,b=call('POST',f'/api/v3/variable-groups/{group_id}/variables',{'secure':True,'variables':[{'name':'APP2_010_PROBE','value':'nonsecret-probe-value'}]}); result['variable_create_http_status']=s; result['variable_create_response_keys']=sorted(b.keys()) if isinstance(b,dict) else []
              if not 200<=s<300: raise RuntimeError(f'variable-create HTTP {s}: {str(b)[:500]}')
              s,b=call('GET',f'/api/v3/variable-groups/{group_id}/variables'); result['variable_readback_http_status']=s
              if not 200<=s<300: raise RuntimeError(f'variable-readback HTTP {s}')
              names=sorted(str(v.get('name')) for v in arr(b) if isinstance(v,dict) and v.get('name')); result['variable_names']=names
              if 'APP2_010_PROBE' not in names: raise RuntimeError('probe variable not returned')
              result['ok']=True
          except Exception as e:
              result['error']=str(e)
          finally:
              if group_id:
                  ds,db=call('DELETE',f'/api/v3/variable-groups/{group_id}'); result['delete_http_status']=ds
                  fs,fb=call('GET',f'/api/v3/apps/{app}/variable-groups'); result['cleanup_verified']=not any(gname(g)==name for g in arr(fb)) if 200<=fs<300 else False
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n'); Path('/tmp/result-path.txt').write_text(str(out)); Path('/tmp/probe-copy.json').write_text(out.read_text())
          print(json.dumps({k:v for k,v in result.items() if k not in {'error'}},ensure_ascii=False))
          PY
      - name: Persist sanitized probe result
        if: always()
        run: |
          test -f /tmp/result-path.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="$(cat /tmp/result-path.txt)"; git add "$P"; git commit -m "Persist APP2-010 Codemagic variable group probe" || exit 0
          if git push; then exit 0; fi
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/probe-copy.json "$P"; git add "$P"; git commit -m "Persist APP2-010 Codemagic variable group probe" || exit 0; git push origin HEAD:main
