name: Temporary North Release Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-north-release-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose snapshot creation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          {
            echo "=== remotes before ==="
            git remote -v
            git branch -a
            echo "=== fetch north ==="
            git fetch origin refs/heads/region/north:refs/heads/source-north
            echo "fetch_status=$?"
            git show-ref | grep -E 'main|north' || true
            echo "=== source paths ==="
            codes=(01233 01234 01235 01236 01303 01304 01331 01332 01333 01334 01337)
            for code in "${codes[@]}"; do
              pref="${code:0:2}"
              data_path="jichitai-compare/data/municipalities/${pref}/${code}.json"
              task_path="jichitai-compare/operations/tasks/${code}.json"
              git cat-file -e "source-north:${data_path}"
              echo "data ${code} status=$?"
              git cat-file -e "source-north:${task_path}"
              echo "task ${code} status=$?"
            done
            echo "=== switch and copy ==="
            git switch -C diagnostic-north-release origin/main
            echo "switch_status=$?"
            for code in "${codes[@]}"; do
              pref="${code:0:2}"
              data_path="jichitai-compare/data/municipalities/${pref}/${code}.json"
              task_path="jichitai-compare/operations/tasks/${code}.json"
              mkdir -p "$(dirname "$data_path")" "$(dirname "$task_path")"
              git show "source-north:${data_path}" > "$data_path"
              echo "copy_data ${code} status=$?"
              git show "source-north:${task_path}" > "$task_path"
              echo "copy_task ${code} status=$?"
            done
            git status --short
          } > /tmp/north-release-debug.txt 2>&1

          git switch main
          git pull --ff-only origin main
          cp /tmp/north-release-debug.txt jichitai-compare/operations/control/north-release-debug.txt
          git rm .github/workflows/temp-north-release-diagnostic.yml
          git add jichitai-compare/operations/control/north-release-debug.txt
          git commit -m "診断: 北日本固定スナップショット作成失敗を記録"
          git push origin main
