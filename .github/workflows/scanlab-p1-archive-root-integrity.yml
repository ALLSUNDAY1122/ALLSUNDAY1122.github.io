name: Scan Lab P1 archive root integrity one-shot

on:
  push:
    branches:
      - feature/splat-post-build17-p1
    paths:
      - '.github/workflows/scanlab-p1-archive-root-integrity.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/splat-post-build17-p1
          fetch-depth: 0
      - name: Bind archive roots and manifest IDs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('splat-native-ios/SplatNative/MeshProjectStore.swift')
          s = p.read_text()

          old = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        guard projectURL.deletingLastPathComponent().standardizedFileURL == libraryURL.standardizedFileURL,\n              projectURL.pathExtension.lowercased() == Self.projectExtension,\n              fileManager.fileExists(atPath: projectURL.path) else {\n            throw MeshProjectStoreError.archiveMissing\n        }\n'''
          new = '''    func moveToTrash(projectURL: URL) throws {\n        try ensureDirectories()\n        try validateArchivedProjectRoot(projectURL)\n        guard projectURL.deletingLastPathComponent().standardizedFileURL == libraryURL.standardizedFileURL,\n              fileManager.fileExists(atPath: projectURL.path) else {\n            throw MeshProjectStoreError.archiveMissing\n        }\n'''
          if s.count(old) != 1: raise SystemExit('moveToTrash anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''        let source = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: source.path) else { throw MeshProjectStoreError.archiveMissing }\n'''
          new = '''        let source = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: source.path) else { throw MeshProjectStoreError.archiveMissing }\n        try validateArchivedProjectRoot(source)\n'''
          if s.count(old) != 1: raise SystemExit('restore anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''        let target = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: target.path) else { throw MeshProjectStoreError.archiveMissing }\n        try fileManager.removeItem(at: target)\n'''
          new = '''        let target = try validatedTrashProjectURL(id: id)\n        guard fileManager.fileExists(atPath: target.path) else { throw MeshProjectStoreError.archiveMissing }\n        try validateArchivedProjectRoot(target)\n        try fileManager.removeItem(at: target)\n'''
          if s.count(old) != 1: raise SystemExit('delete anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''    private func summary(at projectURL: URL) throws -> MeshProjectSummary {\n        let manifest = try readLibraryManifest(projectURL: projectURL)\n        let resultURL = try archivedResultURL(\n'''
          new = '''    private func summary(at projectURL: URL) throws -> MeshProjectSummary {\n        try validateArchivedProjectRoot(projectURL)\n        let manifest = try readLibraryManifest(projectURL: projectURL)\n        let expectedID = projectURL.deletingPathExtension().lastPathComponent\n        guard !expectedID.isEmpty, manifest.id == expectedID else {\n            throw MeshProjectStoreError.invalidProject\n        }\n        let resultURL = try archivedResultURL(\n'''
          if s.count(old) != 1: raise SystemExit('summary anchor mismatch')
          s = s.replace(old, new, 1)

          anchor = '''    private func readSourceManifest(projectURL: URL) -> SourceManifest? {\n'''
          helper = '''    private func validateArchivedProjectRoot(_ projectURL: URL) throws {\n        guard projectURL.isFileURL,\n              projectURL.pathExtension.lowercased() == Self.projectExtension,\n              let values = try? projectURL.resourceValues(forKeys: [.isDirectoryKey, .isSymbolicLinkKey]),\n              values.isDirectory == true,\n              values.isSymbolicLink != true else {\n            throw MeshProjectStoreError.invalidProject\n        }\n        let parent = projectURL.deletingLastPathComponent().standardizedFileURL\n        guard parent == libraryURL.standardizedFileURL || parent == trashURL.standardizedFileURL else {\n            throw MeshProjectStoreError.invalidProject\n        }\n    }\n\n'''
          if s.count(anchor) != 1: raise SystemExit('helper anchor mismatch')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          t = Path('splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift')
          tests = t.read_text()
          anchor = '''    func testAdoptsLegacyCompletedWorkingProjectButIgnoresIncompleteOne() throws {\n'''
          insertion = '''    func testLibraryListingRejectsManifestIDThatDoesNotMatchArchiveDirectory() throws {\n        let live = try makeLiveProject(mode: "lidar", resultName: "mesh.obj", marker: 0x5A)\n        let archived = try store.archiveFinishedProject(resultURL: live.appendingPathComponent("mesh.obj"))\n        let manifestURL = archived.projectURL.appendingPathComponent(MeshProjectStore.libraryManifestFileName)\n        let decoder = JSONDecoder()\n        decoder.dateDecodingStrategy = .iso8601\n        var manifest = try decoder.decode(MeshProjectStore.LibraryManifest.self, from: Data(contentsOf: manifestURL))\n        manifest.id = "different-id"\n        let encoder = JSONEncoder()\n        encoder.dateEncodingStrategy = .iso8601\n        try encoder.encode(manifest).write(to: manifestURL, options: .atomic)\n\n        XCTAssertTrue(store.listProjects().isEmpty)\n    }\n\n    func testTrashListingAndRestoreRejectSymlinkedArchiveRoot() throws {\n        let live = try makeLiveProject(mode: "lidar", resultName: "mesh.obj", marker: 0x5B)\n        let archived = try store.archiveFinishedProject(resultURL: live.appendingPathComponent("mesh.obj"))\n        try store.moveToTrash(projectURL: archived.projectURL)\n        let trashEntry = store.trashURL.appendingPathComponent(archived.id).appendingPathExtension(MeshProjectStore.projectExtension)\n        let external = rootURL.appendingPathComponent("external-archive").appendingPathExtension(MeshProjectStore.projectExtension)\n        try FileManager.default.moveItem(at: trashEntry, to: external)\n        try FileManager.default.createSymbolicLink(at: trashEntry, withDestinationURL: external)\n\n        XCTAssertTrue(store.listTrash().isEmpty)\n        XCTAssertThrowsError(try store.restoreFromTrash(id: archived.id)) { error in\n            guard case MeshProjectStoreError.invalidProject = error else {\n                return XCTFail("Expected invalidProject, got \\(error)")\n            }\n        }\n        XCTAssertTrue(FileManager.default.fileExists(atPath: external.path))\n    }\n\n'''
          if tests.count(anchor) != 1: raise SystemExit('test insertion anchor mismatch')
          t.write_text(tests.replace(anchor, insertion + anchor, 1))
          PY
          grep -q 'validateArchivedProjectRoot' splat-native-ios/SplatNative/MeshProjectStore.swift
          grep -q 'testLibraryListingRejectsManifestID' splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
      - name: Run focused archive integrity regressions
        run: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          cd splat-native-ios
          xcodegen generate
          xcodebuild -project SplatNative.xcodeproj -scheme SplatNativeTests \
            -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:SplatNativeTests/MeshProjectStoreTests test
      - name: Commit verified archive root hardening and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'Scan Lab Macro Loop HQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/scanlab-p1-archive-root-integrity.yml
          git add splat-native-ios/SplatNative/MeshProjectStore.swift splat-native-ios/SplatNativeTests/MeshProjectStoreTests.swift
          git commit -m 'fix(mesh): bind archived projects to trusted roots'
          git push origin HEAD:feature/splat-post-build17-p1
