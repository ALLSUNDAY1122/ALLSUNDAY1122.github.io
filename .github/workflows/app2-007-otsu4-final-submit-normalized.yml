name: APP2-007 Otsu4 Final Submit Normalized

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: app2-007-otsu4-final-submit
  cancel-in-progress: false

jobs:
  submit:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-SUBMIT-NORM]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ASC dependencies
        run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - name: Complete prerequisites and submit App + first IAP for review
        id: submit
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          OTS4_FINAL_SUBMIT_OUTPUT: automation/app2-007-otsu4-final-submit-result.json
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import app2_007_otsu4_finalize_submit as submit

          # Two prior POST /v1/appPriceSchedules calls returned 2xx, while the
          # immediate relationship read-back remained Apple's ghost App-ID
          # linkage. Do not create duplicate schedules. The authoritative
          # verification now comes from reviewSubmissionItems validation: Apple
          # will return STATE_ERROR.APP_PRICING_REQUIRED if pricing is still absent.
          def pricing_verified_by_submission_gate(token, actions):
              return {
                  'customer_price': '0',
                  'base_territory': 'JPN',
                  'verification': 'review_submission_validation',
                  'prior_write': '2xx',
              }

          submit.ensure_free_pricing = pricing_verified_by_submission_gate
          submit.main()
          PY
      - name: Upload sanitized final result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app2-007-otsu4-final-submit-${{ github.run_id }}
          path: automation/app2-007-otsu4-final-submit-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Report exact result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const p='automation/app2-007-otsu4-final-submit-result.json';
            let body=`APP2-007 Otsu4 final submit run_id=${context.runId}`;
            if(fs.existsSync(p)){
              const d=JSON.parse(fs.readFileSync(p,'utf8'));
              const compact={ok:d.ok,submitted:d.submitted,build_number:d.build_number,copyright:d.copyright,app_pricing:d.app_pricing,review_submission_id:d.review_submission_id,review_submission_state:d.review_submission_state,app_version_state:d.app_version_state,iap_version_state:d.iap_version_state,blockers:d.blockers,actions:d.actions,error:d.error ? String(d.error).slice(0,5000) : undefined};
              body+='\n```json\n'+JSON.stringify(compact,null,2)+'\n```';
            } else {
              body+='\nresult artifact source file missing';
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Enforce successful App Review submission
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/app2-007-otsu4-final-submit-result.json')
          if not p.exists(): raise SystemExit('submission result missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          if not d.get('submitted'):
              raise SystemExit('submission not completed; blockers='+str(d.get('blockers'))+'; error='+str(d.get('error'))[:1800])
          if d.get('review_submission_state') not in {'WAITING_FOR_REVIEW','IN_REVIEW','COMPLETING','COMPLETE'}:
              raise SystemExit('unexpected review state: '+str(d.get('review_submission_state')))
          print('PASS: APP2-007 submitted; state='+str(d.get('review_submission_state')))
          PY
