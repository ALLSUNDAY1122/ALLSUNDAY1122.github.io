name: Temporary Central A Weak Source Batch 1 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch1-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch1-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const expected=[
            {code:'17324',name:'川北町',service:'postpartumCare',source:'https://www.town.kawakita.ishikawa.jp/archives/001/202507/%E5%AD%90%E8%82%B2%E3%81%A6%E3%82%AC%E3%82%A4%E3%83%89%E3%83%96%E3%83%83%E3%82%AF%E5%86%85%E5%AE%B92025.pdf'},
            {code:'17384',name:'志賀町',service:'postpartumCare',source:'https://www1.g-reiki.net/shika/reiki_honbun/i130RG00000994.html',additional:'https://www.town.shika.lg.jp/life/3/14/'},
            {code:'21204',name:'多治見市',service:'housingSupport',source:'https://www.city.tajimi.lg.jp/shisei/shisaku_keikaku/1007314/1007315.html'},
            {code:'22209',name:'島田市',service:'housingSupport',source:'https://www.city.shimada.shizuoka.jp/kurashi-docs/kekkonsinseikatsusien.html'},
            {code:'22221',name:'湖西市',service:'sickChildCare',source:'https://www.city.kosai.shizuoka.jp/section/reiki/reiki_honbun/g322RG00001316.html',additional:'https://www.city.kosai.shizuoka.jp/kosodate_kyoiku/kosodate/index.html'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;
              const pageChecks=[];
              for(const item of expected){
                const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});
                if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);
                const html=await response.text();
                if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);
                pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true});
              }
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});
              if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);
              if(!Array.isArray(municipalities)||municipalities.length<1700)throw new Error(`published municipality count ${municipalities.length}`);
              const serviceChecks=[];
              for(const item of expected){
                const municipality=municipalities.find(x=>String(x.code)===item.code);
                if(!municipality)throw new Error(`${item.code} missing in published JSON`);
                const service=municipality.services?.[item.service];
                if(service?.status!=='verified')throw new Error(`${item.code}:${item.service} status ${service?.status}`);
                if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch ${service.source?.url}`);
                if(item.additional && !(service.additionalSources??[]).some(x=>x.url===item.additional))throw new Error(`${item.code}:${item.service} additional source missing`);
                serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,sourceMatched:true,additionalSourceMatched:item.additional?true:null});
              }
              const serviceCount=municipalities.reduce((n,m)=>n+Object.keys(m.services??{}).length,0);
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch1-public-verification-20260726',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:5,reviewedServiceCount:5,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};
              fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch1-public-verification-20260726.json',JSON.stringify(audit,null,2)+'\n');
              console.log(JSON.stringify(audit,null,2));
              lastError=null;
              break;
            }catch(error){
              lastError=error;
              console.log(`attempt ${attempt}: ${error.message}`);
              if(attempt<30)await sleep(10000);
            }
          }
          if(lastError)throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch1-public-trigger-20260726.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第1群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
