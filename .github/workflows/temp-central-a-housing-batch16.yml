name: Temporary Central A Housing Batch 16

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch16-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch16-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 16 decisions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T02:52:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const sourceUpgrade={
            code:'22214',
            name:'藤枝市',
            beforeSource:'https://www.city.fujieda.shizuoka.jp/soshiki/toshikensetsu/akiya/gyomu/hojyokin/1450661881654.html',
            afterSource:'https://www.city.fujieda.shizuoka.jp/mokuteki/teate_josei/kurashi/iju_teiju/22775.html',
            reason:'令和8年度の継続実施、18歳以下の子どもがいる世帯、取得・移転・中古住宅改修の対象額を直接案内する現行利用者向けページへ主出典を更新した。'
          };
          const noChanges=[
            {code:'21503',name:'川辺町',source:'https://www.kawabe-gifu.jp/?page_id=47302',reason:'住宅所有者等45歳未満の基本10万円に加え、18歳年度末までの子との同居で10万円加算する現行制度を確認した。'},
            {code:'22224',name:'菊川市',source:'https://www.city.kikugawa.shizuoka.jp/toshikeikaku/jyuutakuhojyo.html',reason:'令和8年度の若者・子育て世帯住宅取得補助について、40歳未満の親子世帯と三世代同居・隣接住宅の上限額を確認した。'},
            {code:'27225',name:'高石市',source:'https://www.city.takaishi.lg.jp/kakuka/doboku/toshikeikaku_ka/jutaku/akiya/5306.html',reason:'令和8年度の子育て・若年世帯空き家購入補助について、18歳未満の子との同居要件と上限200万円を確認した。'},
            {code:'27381',name:'太子町',source:'https://www.town.taishi.osaka.jp/busyo/seisakusoumubu/hisyoseisakuka/sansedai/1493023013437.html',reason:'令和8年度の三世代同居・近居支援について、中学生以下の子との同居と住宅取得・リフォーム費10分の1・上限50万円を確認した。'}
          ];

          const corrected=[];
          {
            const code=sourceUpgrade.code;
            const municipalityPath=path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(municipalityPath,'utf8'));
            const service=municipality.services.housingSupport;
            if(service.status!=='verified'||service.source?.url!==sourceUpgrade.beforeSource)throw new Error(`${code}: unexpected source/status`);
            service.source={url:sourceUpgrade.afterSource,checkedAt};
            service.additionalSources=[...(service.additionalSources||[]).filter(item=>item.url!==sourceUpgrade.beforeSource),{url:sourceUpgrade.beforeSource,checkedAt,description:'旧URL。現行利用者向け案内への主出典更新前の公式ページ'}];
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(municipalityPath,JSON.stringify(municipality)+'\n');
            corrected.push({code,name:municipality.name,service:'housingSupport',correctionType:'current_user_facing_primary_source_upgrade',beforeStatus:'verified',afterStatus:'verified',summary:service.summary,beforeSource:sourceUpgrade.beforeSource,officialSource:sourceUpgrade.afterSource,reason:sourceUpgrade.reason});
          }

          const unchanged=[];
          for(const target of noChanges){
            const municipality=JSON.parse(fs.readFileSync(path.join(root,'data/municipalities',target.code.slice(0,2),`${target.code}.json`),'utf8'));
            const service=municipality.services.housingSupport;
            if(service.status!=='verified'||service.source?.url!==target.source)throw new Error(`${target.code}: expected verified source`);
            unchanged.push({code:target.code,name:target.name,service:'housingSupport',status:service.status,summary:service.summary,officialSource:service.source.url,reason:target.reason});
          }

          const allCodes=[sourceUpgrade.code,...noChanges.map(item=>item.code)];
          for(const code of allCodes){
            const municipality=JSON.parse(fs.readFileSync(path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`),'utf8'));
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第16群で現行公式情報を再確認し、${code===sourceUpgrade.code?'主出典更新':'verified維持'}として記録。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(checkpoint.qualityReaudit.correctedMunicipalitiesRechecked!==129||checkpoint.qualityReaudit.primarySourceSlotsRechecked!==561||checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification!==99){
            throw new Error(`Unexpected batch15 baseline: ${checkpoint.qualityReaudit.correctedMunicipalitiesRechecked}/${checkpoint.qualityReaudit.primarySourceSlotsRechecked}/${checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification}`);
          }
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残94件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=134;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=566;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=94;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残94件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:16,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:1,noChangeCount:4,sourceUpgradeCount:1,remainingCandidates:94,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第16群として藤枝市の主出典を現行利用者向けページへ更新し、川辺町・菊川市・高石市・太子町の子育て固有条件を再確認して維持した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch16-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:1,noChangeCount:4,sourceUpgradeCount:1,corrected,unchanged,causeScan:{previousRemainingCandidates:99,reviewedHighRiskCandidates:5,remainingCandidates:94},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['子ども加算・三世代・子育て世帯要件が現行公式本文で確認できる候補はverified維持として候補から除外する','制度内容が正しくても旧CMS・組織別URLより現行の利用者向け直接ページを主出典にする'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch16-decisions-20260726.json');
          fs.mkdirSync(path.dirname(auditPath),{recursive:true});
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch16-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/22/22214.json|jichitai-compare/operations/tasks/21503.json|jichitai-compare/operations/tasks/22214.json|jichitai-compare/operations/tasks/22224.json|jichitai-compare/operations/tasks/27225.json|jichitai-compare/operations/tasks/27381.json|jichitai-compare/operations/audits/central-a-housing-classification-batch16-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援分類第16群を判定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
