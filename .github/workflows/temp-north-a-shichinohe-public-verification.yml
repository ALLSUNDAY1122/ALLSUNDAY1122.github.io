name: Temporary North A Shichinohe Public Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'verify/north-a-shichinohe-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect trigger
        id: detect
        shell: bash
        run: |
          if [[ -f jichitai-compare/operations/triggers/north-a-shichinohe-public-verify.txt ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify live generated JSON and municipality page
        if: steps.detect.outputs.run == 'true'
        id: live
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const expected = '町内6施設の一時預かりを実施。こども誰でも通園制度は3施設を予定しているが、町公式案内では準備中で現在は利用できない。';
          const forbidden = '北日本調査班';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let result = null;

          for (let attempt = 1; attempt <= 10; attempt += 1) {
            const token = `${Date.now()}-${attempt}`;
            const checks = [];
            let passed = true;

            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?v=${token}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(30000),
                headers: { 'user-agent': 'NorthAShichinohePublicVerification/1.0' }
              });
              const raw = await response.json();
              const municipalities = Array.isArray(raw) ? raw : raw.municipalities;
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services || {}).length, 0);
              const item = municipalities.find((entry) => String(entry.code) === '02402');
              const serialized = JSON.stringify(item || {});
              const ok = response.ok && municipalities.length === 1741 && serviceCount === 15669 && serialized.includes(expected) && !serialized.includes(forbidden);
              checks.push({ target: 'generated', status: response.status, municipalityCount: municipalities.length, serviceCount, expectedPresent: serialized.includes(expected), forbiddenAbsent: !serialized.includes(forbidden), ok });
              if (!ok) passed = false;
            } catch (error) {
              checks.push({ target: 'generated', ok: false, error: String(error?.message ?? error) });
              passed = false;
            }

            try {
              const response = await fetch(`${base}/municipality/02402/?v=${token}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(30000),
                headers: { 'user-agent': 'NorthAShichinohePublicVerification/1.0' }
              });
              const text = await response.text();
              const ok = response.ok && text.includes(expected) && !text.includes(forbidden);
              checks.push({ target: '02402', status: response.status, bodyLength: text.length, expectedPresent: text.includes(expected), forbiddenAbsent: !text.includes(forbidden), ok });
              if (!ok) passed = false;
            } catch (error) {
              checks.push({ target: '02402', ok: false, error: String(error?.message ?? error) });
              passed = false;
            }

            result = { passed, attempt, checkedAt: new Date().toISOString(), checks };
            console.log(JSON.stringify(result, null, 2));
            if (passed) break;
            await sleep(10000);
          }

          fs.writeFileSync('/tmp/north-a-shichinohe-public-verification.json', JSON.stringify(result, null, 2));
          if (!result?.passed) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `attempt=${result.attempt}\nchecked_at=${result.checkedAt}\n`);
          NODE

      - name: Record final completion
        if: steps.detect.outputs.run == 'true'
        shell: bash
        env:
          VERIFY_PR: ${{ github.event.pull_request.number }}
          VERIFY_RUN: ${{ github.run_id }}
          VERIFY_ATTEMPT: ${{ steps.live.outputs.attempt }}
          VERIFY_CHECKED_AT: ${{ steps.live.outputs.checked_at }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          root = Path('jichitai-compare')
          pr = int(os.environ['VERIFY_PR'])
          run_id = int(os.environ['VERIFY_RUN'])
          attempt = int(os.environ['VERIFY_ATTEMPT'])
          checked_utc = os.environ['VERIFY_CHECKED_AT']
          checked = datetime.fromisoformat(checked_utc.replace('Z', '+00:00')).astimezone().isoformat(timespec='seconds')

          record = {
              'schemaVersion': '1.0.0',
              'auditId': 'north-a-shichinohe-public-verification-20260725',
              'sessionId': 'north-a',
              'municipalityCode': '02402',
              'municipalityName': '七戸町',
              'targetMainPullRequestNumber': 3372,
              'targetMainMergeSha': '0f899c66066a3ddf534ade03804004b01f19f312',
              'targetMainCiRunNumber': 8195,
              'targetMainCiRunId': 30143595267,
              'verificationPullRequestNumber': pr,
              'verificationRunId': run_id,
              'successfulAttempt': attempt,
              'publishedBaseUrl': 'https://allsunday1122.github.io/jichitai-compare',
              'generatedJson': {
                  'status': 'success',
                  'municipalityCount': 1741,
                  'serviceCount': 15669,
                  'expectedAvailabilityNotePresent': True,
                  'internalWordingAbsent': True
              },
              'municipalityPage': {
                  'status': 'success',
                  'httpStatus': 200,
                  'expectedAvailabilityNotePresent': True,
                  'internalWordingAbsent': True
              },
              'status': 'success',
              'checkedAt': checked
          }
          verification_path = root / 'operations/audits/north-a-shichinohe-public-verification-20260725.json'
          verification_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = root / 'operations/audits/north-a-quality-audit-2-20260725.json'
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          audit['status'] = 'completed'
          final = audit.setdefault('finalResult', {})
          final.update({'confirmedNewErrors': 3, 'correctedNewErrors': 3, 'openErrors': 0, 'unfixedErrors': 0, 'result': 'completed_with_zero_open_errors'})
          followup = audit.setdefault('postCompletionFollowup', {})
          followup.update({
              'checkedAt': followup.get('checkedAt'),
              'code': '02402',
              'municipality': '七戸町',
              'service': 'temporaryChildcare',
              'result': 'published_verified',
              'regionPullRequest': 3329,
              'regionSummaryCleanupPullRequest': 3357,
              'mainPullRequest': 3372,
              'mainMergeSha': '0f899c66066a3ddf534ade03804004b01f19f312',
              'mainCiRunNumber': 8195,
              'mainCiRunId': 30143595267,
              'mainCiResult': 'success',
              'officialPageStatus': '準備中のため、まだ利用することができない',
              'mainPublication': 'success',
              'publicVerificationPullRequest': pr,
              'publicVerificationRunId': run_id,
              'publicVerifiedAt': checked
          })
          for finding in audit.get('confirmedFindings', []):
              if finding.get('type') == 'availability_condition_omission' and finding.get('code') == '02402':
                  finding.update({
                      'regionPullRequest': 3329,
                      'regionSummaryCleanupPullRequest': 3357,
                      'mainPullRequest': 3372,
                      'mainMergeSha': '0f899c66066a3ddf534ade03804004b01f19f312',
                      'correctionStatus': 'published_verified'
                  })
          audit['nextAction'] = '品質改善第2監査と七戸町フォローアップ訂正は完了。新たな公式制度改定または年度更新が確認された場合のみ再開する。'
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checkpoint_path = root / 'operations/control/session-checkpoints/north-a.json'
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          checkpoint.update({
              'updatedAt': checked,
              'status': 'completed',
              'workingBranch': 'main',
              'pullRequestNumber': pr,
              'ciStatus': 'success',
              'mainMergeCommit': '0f899c66066a3ddf534ade03804004b01f19f312'
          })
          quality = checkpoint.setdefault('qualitySecondAudit', {})
          quality.update({
              'status': 'completed',
              'confirmedNewErrors': 3,
              'fixedNewErrors': 3,
              'openErrors': 0,
              'unfixedErrors': 0,
              'mainPullRequest': 3372,
              'mainCiRun': 30143595267,
              'mainCiRunNumber': 8195,
              'mainCiResult': 'success',
              'publicationStatus': 'published_verified',
              'livePageVerifiedAt': checked,
              'followupMunicipality': '02402',
              'publicVerificationPullRequest': pr,
              'publicVerificationRunId': run_id
          })
          checkpoint['nextAction'] = '第2監査と七戸町フォローアップ訂正は完了。新しい公式制度改定または年度更新まで待機する。'
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload verification evidence
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: north-a-shichinohe-public-verification
          path: /tmp/north-a-shichinohe-public-verification.json
          retention-days: 7

      - name: Commit final records and remove trigger
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          rm -f jichitai-compare/operations/triggers/north-a-shichinohe-public-verify.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare
          git commit -m 'audit: 七戸町公開確認と北日本A最終完了を記録'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
