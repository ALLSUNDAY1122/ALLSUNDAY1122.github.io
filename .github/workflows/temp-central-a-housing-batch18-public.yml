name: Temporary Central A Housing Batch 18 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch18-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch18-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'17365',name:'内灘町',status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',source:'https://www.town.uchinada.lg.jp/soshiki/kikaku/2058.html'},
            {code:'21209',name:'羽島市',status:'unavailable',summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.hashima.lg.jp/1501.html'},
            {code:'21502',name:'富加町',status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅取得・賃借・リフォーム・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',source:'https://www.town.tomika.gifu.jp/docs/716963.html'},
            {code:'21507',name:'東白川村',status:'unavailable',summary:'結婚新生活支援の案内は確認できるが、2026年度の婚姻・支払・申請対象期間を現行公式情報で確定できない。',source:'https://www.vill.higashishirakawa.gifu.jp/kurashi/teijuu/shinseikatsushien/'},
            {code:'22306',name:'西伊豆町',status:'unavailable',summary:'若者・ひとり親世帯向け家賃補助は転入対象期間が2023年3月31日までで終了しており、2026年度に利用できる子育て・新婚住宅支援は確認できない。',source:'https://www.town.nishiizu.shizuoka.jp/kakuka/machizukuri/kikaku/wakamonosetaihojo.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch18Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const statusMatches=target.status==='verified'?html.includes('確認済み'):(html.includes('公式情報で詳細未確認')||html.includes('利用可能な制度情報を確認できません')||html.includes('未確認'));
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch18Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>item.code===target.code);
                const service=municipality?.services?.housingSupport;
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch18-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3775,nationalSyncPullRequest:3777,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:3,expectedVerifiedCount:2,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch18-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch18-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第18群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
