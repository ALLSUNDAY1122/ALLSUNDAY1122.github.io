name: Shoshi MVP implementation and UI audit

on:
  push:
    branches:
      - feature/shoshi-mvp-loop3
    paths:
      - 'learning-sprint/shoshi/mvp/**'
      - 'learning-sprint/shoshi/content-loop/questions.generated.json'
      - '.github/workflows/shoshi-mvp-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'learning-sprint/shoshi/mvp/**'
      - 'learning-sprint/shoshi/content-loop/questions.generated.json'
      - '.github/workflows/shoshi-mvp-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Japanese fonts for visual audit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: JavaScript syntax
        run: node --check learning-sprint/shoshi/mvp/app.js && node --check learning-sprint/shoshi/mvp/sw.js
      - name: Install browser audit dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Run mobile browser audit
        run: python learning-sprint/shoshi/mvp/mvp_audit.py
      - name: Upload visual audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shoshi-mvp-mobile-audit
          path: learning-sprint/shoshi/mvp/audit/*.png
          if-no-files-found: error
      - name: Persist audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-sprint/shoshi/mvp/mvp-audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m "司法書士MVP実装・UI監査結果を更新"
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}" || true
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}" || true
          fi
