name: D2 Account Delete Live E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/d2-account-delete-live-e2e.yml'
      - 'splat-native-ios/tests/account-delete-live-e2e.ts'
      - 'splat-native-ios/supabase/functions/scanlab-delete-account/**'

permissions:
  contents: read

concurrency:
  group: d2-account-delete-live-e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-e2e:
    if: github.head_ref == 'scaniverse/d2-w16-account-delete' || github.ref_name == 'scaniverse/d2-w16-account-delete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D2_ACCOUNT_DELETE_E2E: '1'
      SUPABASE_URL: 'https://gybchnyqlqwmajwkhsly.supabase.co'
      SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_jYM9b6kivVT80sbAQ2syFw_zSUANBHV'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify destructive-test secret is configured
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'SUPABASE_SERVICE_ROLE_KEY repository secret is not configured.' >&2
            exit 2
          fi
      - name: Run isolated disposable-account deletion E2E
        working-directory: splat-native-ios
        run: deno run --allow-env --allow-net tests/account-delete-live-e2e.ts
