name: Temporary Central A Housing Batch 15 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch15-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch15-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const targets=[
            {code:'16205',name:'氷見市',status:'verified',summary:'子育て世帯の住宅取得を転入者100万円・市内居住者50万円支援し、改修・家賃も補助',source:'https://www.city.himi.toyama.jp/gyosei/soshiki/miraisenryaku/3/1/1653.html'},
            {code:'16323',name:'立山町',status:'verified',summary:'町営住宅等へ入居する18歳以下の子どもがいる世帯等に、家賃軽減や行政ポイントを付与する。',source:'https://www.town.tateyama.toyama.jp/soshikikarasagasu/kikakuseisakuka/chiikishinkogakari/2/1/1089.html'},
            {code:'17206',name:'加賀市',status:'verified',summary:'市内で住宅を新築・購入する45歳未満の方へ基本補助と子ども・移住・市内業者・空き家等の加算を行う。',source:'https://www.city.kaga.ishikawa.jp/soshiki/somu/seisaku_suishin/jinkogensho_taisaku/6/15107.html'},
            {code:'18201',name:'福井市',status:'verified',summary:'令和8年度に新婚・子育て・U・Iターン世帯等の中古住宅取得、改修、家賃、同居・近居を支援する複数の住宅補助を実施する。',source:'https://www.city.fukui.lg.jp/sisei/hojyo/kurasi/jutaku_seisaku31.html'},
            {code:'21204',name:'多治見市',status:'verified',summary:'令和8年度の結婚新生活支援として、婚姻に伴う住宅取得・賃借・リフォーム・引越費用を最大60万円補助する。',source:'https://www.city.tajimi.lg.jp/shisei/shisaku_keikaku/1007314/1007315.html'}
          ];
          const tajimiTemporary={summary:'保護者の病気・出産・介護・冠婚葬祭・就労等で一時的に保育が必要な未就園児を市内保育施設で受け入れる。また、令和8年4月から、保育所等に在籍していない生後6か月から満3歳未満の子どもを、保護者の就労要件を問わず月10時間まで受け入れるこども誰でも通園制度を実施する。',source:'https://www.city.tajimi.lg.jp/kosodate_tajimikko/mokuteki/1006224/1010198.html'};
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch15Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const statusMatches=html.includes('確認済み');
                const relatedMatches=target.code!=='21204'||(html.includes(tajimiTemporary.summary)&&(html.includes(tajimiTemporary.source)||html.includes(tajimiTemporary.source.replaceAll('&','&amp;'))));
                pageChecks.push({code:target.code,name:target.name,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,relatedMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches&&relatedMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch15Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{
                const municipality=municipalities.find(item=>item.code===target.code);
                const service=municipality?.services?.housingSupport;
                const relatedMatches=target.code!=='21204'||(municipality?.services?.temporaryChildcare?.summary===tajimiTemporary.summary&&municipality?.services?.temporaryChildcare?.source?.url===tajimiTemporary.source);
                return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,relatedMatches,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source&&relatedMatches};
              });
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch15-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3742,nationalSyncPullRequest:3744,runnerFixPullRequest:3745,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedVerifiedCount:5,tajimiAnyoneAccessChecked:true,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch15-public-verification-20260726.json';
          fs.mkdirSync(path.dirname(outPath),{recursive:true});
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch15-public-trigger-20260726.json';
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第15群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
