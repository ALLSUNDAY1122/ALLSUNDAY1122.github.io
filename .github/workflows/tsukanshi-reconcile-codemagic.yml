# trigger: 2026-09-15T20:31+09:00
name: Tsukanshi reconcile Codemagic contract

on:
  push:
    paths:
      - '.github/workflows/tsukanshi-reconcile-codemagic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate canonical tsukanshi-native-ios workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('codemagic.yaml').read_text(encoding='utf-8')
          marker='\n  tsukanshi-native-ios:'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('missing tsukanshi-native-ios')
          body_start=start+len(marker)
          rest=s[body_start:]
          m=re.search(r'\n  [A-Za-z0-9_-]+:\s*\n', rest)
          end=body_start+(m.start() if m else len(rest))
          block=s[start:end]
          required=[
              'app_store_connect: "Codemagic Shiwake Swipe"',
              'provisioning_profiles:',
              '- tsukanshi_appstore',
              'BUNDLE_ID: jp.allsunday1122.tsukanshi',
              'APP_STORE_APPLE_ID: "6799753744"',
              'TsukanshiNative.xcodeproj',
              'testFlightInternalTestingOnly',
              'submit_to_testflight: false',
              'submit_to_app_store: false',
          ]
          for token in required:
              if token not in block:
                  raise SystemExit(f'missing required token: {token}')
          if 'submit_to_testflight: true' in block or 'submit_to_app_store: true' in block:
              raise SystemExit('auto-submit must remain disabled')
          print('PASS: canonical tsukanshi-native-ios Codemagic contract')
          PY
      - name: Run Apple preflight
        run: node tsukanshi-sprint/validate-apple-preflight.mjs
