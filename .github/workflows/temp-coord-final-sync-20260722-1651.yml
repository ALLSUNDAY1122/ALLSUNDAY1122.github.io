name: Temporary Coordinator Final Sync Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-coord-final-sync-20260722-1651.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild coordinator state
        run: |
          set -euxo pipefail
          git fetch origin \
            '+refs/heads/region/north:refs/remotes/origin/region/north' \
            '+refs/heads/region/east:refs/remotes/origin/region/east' \
            '+refs/heads/region/central:refs/remotes/origin/region/central' \
            '+refs/heads/region/west:refs/remotes/origin/region/west'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          now='2026-07-22T16:51:00+09:00'
          regions=('north','east','central','west')
          fields={'north':'completedMunicipalitiesSinceLastNationalMerge','east':'completedMunicipalitiesSinceLastNationalMerge','central':'completedSinceLastRelease','west':'completedMunicipalitiesSinceLastNationalMerge'}
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def belongs(region,pref):
              n=int(pref)
              return {'north':1<=n<=7,'east':8<=n<=15 or n in (19,20),'central':16<=n<=18 or 21<=n<=29,'west':31<=n<=47}[region]
          states={};pending={};counts={};items={}
          for region in regions:
              ref=f'origin/region/{region}'
              states[region]=json.loads(show(ref,f'jichitai-compare/operations/control/regions/{region}.json'))
              pending[region]=int(states[region].get(fields[region],0))
              arr=[]
              paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'jichitai-compare/data/municipalities'],text=True).splitlines()
              for path in paths:
                  if not re.search(r'/\d{5}\.json$',path): continue
                  d=json.loads(show(ref,path))
                  if belongs(region,d['prefectureCode']): arr.append({'code':d['code'],'name':d['name']})
              arr.sort(key=lambda x:x['code']); items[region]=arr; counts[region]=len(arr)
          total=sum(counts.values()); ready=[r for r in regions if pending[r]>=10]
          open_prs=json.loads(subprocess.check_output(['gh','pr','list','--state','open','--limit','100','--json','number,baseRefName'],text=True))
          municipality_open=[p['number'] for p in open_prs if p['baseRefName'] in ('region/north','region/east','region/central','region/west')]
          unrelated=[p['number'] for p in open_prs if p['baseRefName'] not in ('region/north','region/east','region/central','region/west')]
          queue_path=Path('jichitai-compare/operations/control/release-queue.json'); queue=json.loads(queue_path.read_text(encoding='utf-8')); by={e['region']:e for e in queue['entries']}
          for r in regions:
              by[r].update({'municipalities':items[r],'count':counts[r],'pendingSinceLastRelease':pending[r],'releaseStatus':'release_ready' if pending[r]>=10 else 'pending_threshold','reason':f'最新地方ブランチを再走査。前回全国統合後の繰越は{pending[r]}自治体','mainIntegrationPr':states[r].get('lastNationalIntegrationPr'),'generatedPullRequest':720,'auditStatus':'passed'})
          next_action=f"北日本{pending['north']}、東日本{pending['east']}、中日本{pending['central']}、西日本{pending['west']}。"+('全国統合対象: '+','.join(ready) if ready else '10自治体到達地域なし。')
          queue['updatedAt']=now; queue['status']='active'; queue['summary']={'regionalMergedMunicipalities':total,'latestGeneratedMunicipalityCount':454,'latestGeneratedPullRequest':720,'latestPublicCountPullRequest':720,'releaseReadyRegions':ready,'nextAction':next_action}; queue_path.write_text(json.dumps(queue,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          global_path=Path('jichitai-compare/operations/control/global-state.json'); g=json.loads(global_path.read_text(encoding='utf-8')); g['updatedAt']=now; g['phase']='release-monitoring'; g['regionalCompletedSinceLastRelease']={**pending,'total':sum(pending.values())}; g['priority']={'type':'release-monitoring','nextAction':next_action}; g['latestGeneratedMunicipalityCount']=454; g['latestGeneratedPullRequest']=720; g['latestPublicCountPullRequest']=720; g['regionalMergedMunicipalities']=total; g['openPullRequests']=municipality_open; g['humanDecisionRequired']=False; global_path.write_text(json.dumps(g,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          progress=json.loads(Path('jichitai-compare/operations/progress.json').read_text(encoding='utf-8'))
          record={'timestamp':now,'actor':'全国進行統括','action':'coordinator-final-sync','details':{'publicMunicipalityCount':progress['registeredMunicipalities'],'publicServices':progress['totalServices'],'regionalCounts':counts,'regionalMergedMunicipalities':total,'pendingSinceLatestNationalIntegration':{**pending,'total':sum(pending.values())},'releaseReadyRegions':ready,'openMunicipalityPullRequests':municipality_open,'ignoredUnrelatedOpenPullRequests':unrelated,'needsMediumReviewMunicipalities':progress['needsMediumReviewMunicipalities'],'blockedMunicipalities':progress['blockedMunicipalities']},'humanDecisionRequired':False}
          with Path('jichitai-compare/operations/control/audit-log.jsonl').open('a',encoding='utf-8') as f: f.write(json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps(record,ensure_ascii=False))
          PY
          rm .github/workflows/temp-coord-final-sync-20260722-1651.yml
          git add jichitai-compare/operations/control/global-state.json jichitai-compare/operations/control/release-queue.json jichitai-compare/operations/control/audit-log.jsonl .github/workflows/temp-coord-final-sync-20260722-1651.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 最新地方統合と公開454自治体へ最終同期'
          git push origin main
