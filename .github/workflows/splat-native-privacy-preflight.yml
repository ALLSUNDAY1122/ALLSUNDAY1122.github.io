name: Splat Native Privacy Preflight

on:
  pull_request:
    paths:
      - 'splat-native-ios/**'
      - '.github/workflows/splat-native-privacy-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app privacy manifest
        run: python3 splat-native-ios/scripts/privacy_manifest_preflight.py
