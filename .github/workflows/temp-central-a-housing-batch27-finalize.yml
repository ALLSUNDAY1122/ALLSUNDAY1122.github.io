name: Temporary Central A Housing Batch 27 Finalize

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch27-finalize-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-housing-batch27-final-region-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          public_path=jichitai-compare/operations/audits/central-a-housing-classification-batch27-public-verification-20260726.json
          git show "origin/main:$public_path" > "$public_path"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const completedAt='2026-07-26T15:48:00+09:00';
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch27-decisions-20260726.json');
          const publicPath=path.join(root,'operations/audits/central-a-housing-classification-batch27-public-verification-20260726.json');
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const publicEvidence=JSON.parse(fs.readFileSync(publicPath,'utf8'));
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(!publicEvidence.success)throw new Error('Public verification is not successful');

          audit.regionalMergePullRequestNumber=3879;
          audit.regionalWorkflowRunId=30190909672;
          audit.nationalSyncPullRequestNumber=3881;
          audit.nationalSyncWorkflowRunId=30191005653;
          audit.publicVerificationPullRequestNumber=3883;
          audit.publicVerificationWorkflowRunId=30191129885;
          audit.publicVerificationStatus='passed';
          audit.finalRegionPullRequestNumber=Number(process.env.PR_NUMBER);
          audit.finalRegionWorkflowRunId=Number(process.env.RUN_ID);
          audit.status='completed_public_verified_region_integrated';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          checkpoint.updatedAt=completedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残39件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=completedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=3879;
          checkpoint.qualityReaudit.latestCiRunNumber=30190909672;
          checkpoint.qualityReaudit.latestNationalPullRequestNumber=3881;
          checkpoint.qualityReaudit.latestPublicVerificationPullRequestNumber=3883;
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=189;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=621;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=39;
          checkpoint.qualityReaudit.latestHousingBatch={batch:27,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,confirmedCorrectionCount:0,verifiedMaintainedCount:5,remainingCandidates:39,regionalPullRequestNumber:3879,regionalWorkflowRunId:30190909672,nationalPullRequestNumber:3881,nationalWorkflowRunId:30191005653,publicVerificationPullRequestNumber:3883,publicVerificationWorkflowRunId:30191129885,finalRegionPullRequestNumber:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第27群の蒲郡市・高山市・多治見市・垂井町・碧南市を公式情報で再確認し、5件ともverifiedを維持して地域・全国・公開一致を確認した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          region.updatedAt=completedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const resolution={
            schemaVersion:'1.0.0',
            resolutionId:'central-a-housing-batch27-resolution-20260726',
            session:'中日本調査班A',
            coordinatorSession:'統括B',
            completedAt,
            category:'generalHousingMisclassification',
            scope:{reviewedMunicipalityCount:5,correctedMunicipalityCount:0,verifiedMaintainedCount:5,remainingHousingCandidates:39,correctedMunicipalitiesRechecked:189,primarySourceSlotsRechecked:621,weakPrimarySourceCandidates:33,issue3141UnresolvedItems:19},
            decisions:{verifiedMaintainedCount:5,codes:['23214','21203','21204','21361','23209']},
            evidence:{regionalPullRequest:3879,regionalWorkflowRunId:30190909672,nationalSyncPullRequest:3881,nationalSyncWorkflowRunId:30191005653,publicVerificationPullRequest:3883,publicVerificationWorkflowRunId:30191129885,finalRegionPullRequest:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID)},
            publicVerification:{pageCount:5,allPagesHttp200:true,statusSummarySourceMatch:true,publicMunicipalityCount:1741,publicServiceCount:15669},
            releaseGuard:{status:'resolved_no_release_blocker',blockers:[]},
            status:'completed_public_verified_region_integrated'
          };
          const resolutionPath=path.join(root,'operations/quality/central-a-housing-batch27-resolution-20260726.json');
          fs.mkdirSync(path.dirname(resolutionPath),{recursive:true});
          fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch27-finalize-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Remove regional runners and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temp-central-a-housing-rescan.yml \
            .github/workflows/temp-central-a-housing-batch27.yml \
            .github/workflows/temp-central-a-housing-batch27-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援第27群を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
