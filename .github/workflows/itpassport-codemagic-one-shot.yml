name: IT Passport Codemagic One Shot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[ITP-CM-CMD]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate command and start fixed TestFlight workflow
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          cmd=json.loads(os.environ['ISSUE_BODY'])
          rid=cmd.get('request_id','')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,100}', rid):
              raise SystemExit('invalid request_id')
          if cmd.get('action') != 'build' or cmd.get('workflow_id') != 'ios-native' or cmd.get('branch') != 'main':
              raise SystemExit('blocked command')
          token=os.environ.get('CM_API_TOKEN','').strip()
          if not token:
              raise SystemExit('missing CM_API_TOKEN')
          payload=json.dumps({'appId':'6a6b41e1bd25e8664f94a9c3','workflowId':'ios-native','branch':'main'}).encode()
          req=urllib.request.Request('https://api.codemagic.io/builds',data=payload,method='POST')
          req.add_header('Content-Type','application/json')
          req.add_header('x-auth-token',token)
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.loads(r.read().decode() or '{}'); status=r.status
          except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')[:1000]
              Path('itpassport-cm-result.json').write_text(json.dumps({'ok':False,'http_status':e.code,'error':raw},indent=2),encoding='utf-8')
              raise
          build_id=body.get('buildId') or body.get('id')
          if status < 200 or status >= 300 or not build_id:
              raise SystemExit('Codemagic did not start a build')
          Path('itpassport-cm-result.json').write_text(json.dumps({'ok':True,'request_id':rid,'workflow_id':'ios-native','branch':'main','build_id':build_id,'status':'started'},indent=2),encoding='utf-8')
          print('PASS: IT Passport Codemagic build started')
          PY
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itpassport-codemagic-${{ github.run_id }}
          path: itpassport-cm-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Report locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `IT Passport Codemagic trigger status=${{ job.status }}; run_id=${context.runId}; artifact=itpassport-codemagic-${context.runId}`});
