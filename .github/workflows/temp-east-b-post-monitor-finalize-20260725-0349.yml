name: East B Post Monitor Finalize 20260725 0349

on:
  pull_request:
    branches: [region/east]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.head_ref == 'ops/east-b-post-monitor-finalize-20260725-0349'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Finalize post-completion monitor status
        env:
          FINALIZE_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          checkpoint_path = Path('jichitai-compare/operations/control/session-checkpoints/east-b.json')
          with checkpoint_path.open(encoding='utf-8') as f:
              data = json.load(f)

          monitor = data.setdefault('postCompletionMonitor', {})
          monitor['monitorPullRequestNumber'] = 3090
          monitor['monitorCiRunNumber'] = 7549
          monitor['monitorCiStatus'] = 'success'
          monitor['monitorMergeSha'] = '52da51cf207e6d9f066ff9ee6a7ff14db6c1f818'
          monitor['finalizedAt'] = '2026-07-25T03:49:00+09:00'
          data['updatedAt'] = '2026-07-25T03:49:00+09:00'
          data['pullRequestNumber'] = int(os.environ['FINALIZE_PR'])
          data['ciStatus'] = 'success'

          with checkpoint_path.open('w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          PY
      - name: Commit final status and remove temporary workflow
        run: |
          rm .github/workflows/temp-east-b-post-monitor-finalize-20260725-0349.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jichitai-compare/operations/control/session-checkpoints/east-b.json \
            .github/workflows/temp-east-b-post-monitor-finalize-20260725-0349.yml
          git commit -m "ops: 東日本B完了後監視CIを確定"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
