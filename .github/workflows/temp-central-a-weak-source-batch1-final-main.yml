name: Temporary Central A Weak Source Batch 1 Final Main

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch1-final-main-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-weak-source-batch1-final-main-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Import final regional records and clean main runners
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/central
          git reset --hard origin/main
          files=(
            jichitai-compare/operations/audits/central-a-weak-primary-source-recovery-20260726.json
            jichitai-compare/operations/audits/central-a-weak-primary-source-batch1-decisions-20260726.json
            jichitai-compare/operations/audits/central-a-weak-primary-source-batch1-public-verification-20260726.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
            jichitai-compare/operations/control/regions/central.json
            jichitai-compare/operations/quality/central-a-weak-source-batch1-resolution-20260726.json
          )
          git checkout origin/region/central -- "${files[@]}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const updatedAt='2026-07-26T21:11:00+09:00';
          const finalMainPr=Number(process.env.PR_NUMBER);
          const finalMainRun=Number(process.env.RUN_ID);
          const resolutionPath=path.join(root,'operations/quality/central-a-weak-source-batch1-resolution-20260726.json');
          const resolution=JSON.parse(fs.readFileSync(resolutionPath,'utf8'));
          resolution.status='completed_public_verified_main_integrated';
          resolution.completedAt=updatedAt;
          resolution.evidence.finalMainPullRequestNumber=finalMainPr;
          resolution.evidence.finalMainWorkflowRunId=finalMainRun;
          resolution.temporaryRunnerCleanup={regional:true,main:true};
          fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');

          const decisionPath=path.join(root,'operations/audits/central-a-weak-primary-source-batch1-decisions-20260726.json');
          const decision=JSON.parse(fs.readFileSync(decisionPath,'utf8'));
          decision.status='completed_public_verified_main_integrated';
          decision.finalMainPullRequestNumber=finalMainPr;
          decision.finalMainWorkflowRunId=finalMainRun;
          decision.completedAt=updatedAt;
          fs.writeFileSync(decisionPath,JSON.stringify(decision,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.status='completed';
          checkpoint.ciStatus='success';
          checkpoint.nextAction='弱い主出典残28件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestWeakSourceBatch.status='completed_public_verified_main_integrated';
          checkpoint.qualityReaudit.latestWeakSourceBatch.finalMainPullRequestNumber=finalMainPr;
          checkpoint.qualityReaudit.latestWeakSourceBatch.finalMainWorkflowRunId=finalMainRun;
          checkpoint.lastAction='弱い主出典第1群5制度を地域・全国・公開・main最終記録まで一致確認し、候補を33件から28件へ減らした。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          if(region.latestCentralAWeakSourceBatch){
            region.latestCentralAWeakSourceBatch.status='completed_public_verified_main_integrated';
            region.latestCentralAWeakSourceBatch.finalMainPullRequestNumber=finalMainPr;
            region.latestCentralAWeakSourceBatch.finalMainWorkflowRunId=finalMainRun;
          }
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch1-final-main-trigger-20260726.json
          rm -f .github/workflows/temp-central-a-weak-source-batch1-main.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch1-public.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch1-final-main.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run check
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第1群をmainで最終確定'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
