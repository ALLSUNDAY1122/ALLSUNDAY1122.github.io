name: Kangoshi Official Exam Import

on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/product-content/import_official_exams.py'
      - 'kangoshi-sprint/product-content/normalize_raw_import.py'
      - 'kangoshi-sprint/product-content/source-data-corrections.json'
      - 'kangoshi-sprint/product-content/validate_raw_import.py'
      - 'kangoshi-sprint/product-content/audit_media_detection.py'
      - 'kangoshi-sprint/product-content/build_common_audit_input.py'
      - 'kangoshi-sprint/product-content/learning-sprint-raw-audit.json'
      - 'kangoshi-sprint/product-content/official-sources.json'
      - 'automation/learning-sprint-question-pipeline/validate_questions.py'
      - '.github/workflows/kangoshi-official-import.yml'

concurrency:
  group: kangoshi-official-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-official-exams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Import official exams 115, 114, 113
        shell: bash
        run: |
          mkdir -p kangoshi-sprint/product-content/raw
          set +e
          python3 kangoshi-sprint/product-content/import_official_exams.py set1 set2 set3 > kangoshi-sprint/product-content/raw/import.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/import.log
          echo "$code" > kangoshi-sprint/product-content/raw/import.exit

      - name: Normalize PDF extraction
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/raw/import.exit)" != "0" ]; then
            echo 'SKIPPED: import failed' | tee kangoshi-sprint/product-content/raw/normalize.log
            echo '99' > kangoshi-sprint/product-content/raw/normalize.exit
            exit 0
          fi
          set +e
          python3 kangoshi-sprint/product-content/normalize_raw_import.py > kangoshi-sprint/product-content/raw/normalize.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/normalize.log
          echo "$code" > kangoshi-sprint/product-content/raw/normalize.exit

      - name: Validate raw imports
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/raw/normalize.exit)" != "0" ]; then
            echo 'SKIPPED: normalization failed' | tee kangoshi-sprint/product-content/raw/raw-validation.log
            echo '99' > kangoshi-sprint/product-content/raw/raw-validation.exit
            exit 0
          fi
          set +e
          python3 kangoshi-sprint/product-content/validate_raw_import.py > kangoshi-sprint/product-content/raw/raw-validation.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/raw-validation.log
          echo "$code" > kangoshi-sprint/product-content/raw/raw-validation.exit

      - name: Audit media detection independently
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/raw/normalize.exit)" != "0" ]; then
            echo 'SKIPPED: normalization failed' | tee kangoshi-sprint/product-content/raw/media-detection.log
            echo '99' > kangoshi-sprint/product-content/raw/media-detection.exit
            exit 0
          fi
          set +e
          python3 kangoshi-sprint/product-content/audit_media_detection.py > kangoshi-sprint/product-content/raw/media-detection.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/media-detection.log
          echo "$code" > kangoshi-sprint/product-content/raw/media-detection.exit

      - name: Build shared audit input
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/raw/normalize.exit)" != "0" ]; then
            echo 'SKIPPED: normalization failed' | tee kangoshi-sprint/product-content/raw/common-build.log
            echo '99' > kangoshi-sprint/product-content/raw/common-build.exit
            exit 0
          fi
          set +e
          python3 kangoshi-sprint/product-content/build_common_audit_input.py > kangoshi-sprint/product-content/raw/common-build.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/common-build.log
          echo "$code" > kangoshi-sprint/product-content/raw/common-build.exit

      - name: Run shared learning-sprint audit
        shell: bash
        run: |
          if [ "$(cat kangoshi-sprint/product-content/raw/common-build.exit)" != "0" ]; then
            echo 'SKIPPED: common audit input build failed' | tee kangoshi-sprint/product-content/raw/common-audit.log
            echo '99' > kangoshi-sprint/product-content/raw/common-audit.exit
            exit 0
          fi
          set +e
          python3 automation/learning-sprint-question-pipeline/validate_questions.py kangoshi-sprint/product-content/learning-sprint-raw-audit.json > kangoshi-sprint/product-content/raw/common-audit.log 2>&1
          code=$?
          set -e
          cat kangoshi-sprint/product-content/raw/common-audit.log
          echo "$code" > kangoshi-sprint/product-content/raw/common-audit.exit

      - name: Record manifest loop state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('kangoshi-sprint/product-content')
          p=root/'manifest.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          def exit_code(name):
              f=root/'raw'/name
              try: return int(f.read_text().strip())
              except Exception: return 98
          imp=exit_code('import.exit')
          norm=exit_code('normalize.exit')
          raw=exit_code('raw-validation.exit')
          media=exit_code('media-detection.exit')
          common=exit_code('common-audit.exit')
          for s in d['sets']:
              rp=root/s['rawFile']
              imported=0
              if rp.exists():
                  try: imported=json.loads(rp.read_text(encoding='utf-8')).get('questionCount',0)
                  except Exception: imported=0
              s['importedCount']=imported
              s['questionCount']=0
              s['expertReviewedCount']=0
              if imp != 0:
                  s['status']='raw_import_failed'
              elif norm != 0:
                  s['status']='raw_normalization_failed'
              elif raw != 0:
                  s['status']='raw_structure_audit_fail'
              elif media != 0:
                  s['status']='raw_media_detection_fail'
              elif common != 0:
                  s['status']='raw_common_audit_fail'
              elif imported == 240:
                  s['status']='raw_imported_pending_review'
              else:
                  s['status']='raw_incomplete'
          d['lastRawLoop']={
              'importExit':imp,
              'normalizeExit':norm,
              'rawValidationExit':raw,
              'mediaDetectionExit':media,
              'commonAuditExit':common,
              'releaseAllowed':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit generated raw datasets and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/product-content/raw kangoshi-sprint/product-content/manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'kangoshi: official exam raw loop result [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Enforce loop gate
        shell: bash
        run: |
          imp=$(cat kangoshi-sprint/product-content/raw/import.exit)
          norm=$(cat kangoshi-sprint/product-content/raw/normalize.exit)
          raw=$(cat kangoshi-sprint/product-content/raw/raw-validation.exit)
          media=$(cat kangoshi-sprint/product-content/raw/media-detection.exit)
          common=$(cat kangoshi-sprint/product-content/raw/common-audit.exit)
          echo "import=$imp normalize=$norm raw=$raw media=$media common=$common"
          test "$imp" = "0"
          test "$norm" = "0"
          test "$raw" = "0"
          test "$media" = "0"
          test "$common" = "0"
