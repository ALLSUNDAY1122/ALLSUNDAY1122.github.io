name: Kangoshi Native UI Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'kangoshi-sprint/ios/Sources/**'
      - 'kangoshi-sprint/ios/UITests/KangoshiSprintUITests.swift'
      - 'kangoshi-sprint/ios/project.yml'
      - 'kangoshi-sprint/ios/tools/**'
      - '.github/workflows/kangoshi-native-ui-tests.yml'

concurrency:
  group: kangoshi-native-ui-tests
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen cairo pango
          python3 -m pip install --break-system-packages 'CairoSVG>=2.7,<3'
      - name: Normalize and prepare native resources
        run: |
          python3 kangoshi-sprint/ios/tools/normalize_swift_numeric_literals.py
          python3 kangoshi-sprint/ios/tools/prepare_native_content.py
      - name: Generate Xcode project
        working-directory: kangoshi-sprint/ios
        run: xcodegen generate
      - name: Select small and large iPhone simulators
        run: |
          python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          iphones=[]
          for runtime,rows in data.get('devices',{}).items():
              if 'iOS' not in runtime: continue
              for row in rows:
                  if row.get('isAvailable') and str(row.get('name','')).startswith('iPhone'):
                      iphones.append(row)
          if not iphones: raise SystemExit('No available iPhone simulators')
          def pick(name): return next((x for x in iphones if x['name']==name),None)
          large=pick('iPhone 16 Pro') or pick('iPhone 16') or iphones[0]
          small=pick('iPhone SE (3rd generation)') or pick('iPhone SE (2nd generation)')
          if small is None:
              small=next((x for x in iphones if 'Plus' not in x['name'] and 'Max' not in x['name'] and x['udid']!=large['udid']),iphones[-1])
          selected=[]
          for x in (small,large):
              if x['udid'] not in [s['udid'] for s in selected]: selected.append(x)
          open('/tmp/kangoshi-simulators.tsv','w').write('\n'.join(f"{x['name']}\t{x['udid']}" for x in selected)+'\n')
          print(selected)
          PY
          cat /tmp/kangoshi-simulators.tsv
      - name: Run UI smoke tests on selected iPhones
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          while IFS=$'\t' read -r name udid; do
            [ -n "$udid" ] || continue
            echo "Testing $name ($udid)"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            set -o pipefail
            xcodebuild test \
              -project kangoshi-sprint/ios/KangoshiSprint.xcodeproj \
              -scheme KangoshiSprint \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$udid" \
              -only-testing:KangoshiSprintUITests/KangoshiSprintUITests \
              CODE_SIGNING_ALLOWED=NO | xcpretty
            passed=$((passed+1))
            xcrun simctl shutdown "$udid" || true
          done < /tmp/kangoshi-simulators.tsv
          test "$passed" -ge 2
      - name: Record UI audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          devices=[]
          for line in Path('/tmp/kangoshi-simulators.tsv').read_text().splitlines():
              if line.strip(): devices.append(line.split('\t')[0])
          out=Path('kangoshi-sprint/ios/native-ui-audit.json')
          out.write_text(json.dumps({
            'schemaVersion':1,'deviceCount':len(devices),'devices':devices,
            'tests':['home_free_sprint_and_close','free_mock_gate_and_restore_entry','free_category_samples_visible'],
            'pass':len(devices)>=2
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit UI audit and normalized sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/ios/Sources kangoshi-sprint/ios/native-ui-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: record two-size native UI PASS [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
