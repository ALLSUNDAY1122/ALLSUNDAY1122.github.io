name: Central A Cause Audit Main Sync 20260725

on:
  push:
    branches:
      - sync/central-a-cause-main-20260725-1112

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy confirmed regional source, task, audit and state files
        run: |
          git fetch origin region/central
          git checkout origin/region/central -- \
            jichitai-compare/data/municipalities/16/16210.json \
            jichitai-compare/data/municipalities/23/23342.json \
            jichitai-compare/data/municipalities/24/24341.json \
            jichitai-compare/operations/tasks/16210.json \
            jichitai-compare/operations/tasks/23342.json \
            jichitai-compare/operations/tasks/24341.json \
            jichitai-compare/operations/audits/central-a-cause-based-rescan-20260725.json \
            jichitai-compare/operations/audits/central-a-cause-based-rescan-summary-20260725.json \
            jichitai-compare/operations/audits/central-a-cause-based-decisions-20260725.json \
            jichitai-compare/operations/control/session-checkpoints/central-a.json \
            jichitai-compare/operations/control/regions/central.json
          rm -f jichitai-compare/data/municipalities/24/24361.json
          rm -f jichitai-compare/operations/tasks/24361.json
      - name: Regenerate national data and public municipality pages
        working-directory: jichitai-compare
        run: |
          npm run check
          node ./scripts/generate-municipality-pages.mjs
          node --check app.js
      - name: Verify corrected public structure
        run: |
          test -f jichitai-compare/data/municipalities/24/24341.json
          test ! -f jichitai-compare/data/municipalities/24/24361.json
          test -f jichitai-compare/municipality/24341/index.html
          test ! -f jichitai-compare/municipality/24361/index.html
          grep -q '/municipality/24341/' jichitai-compare/municipality/24341/index.html
          node -e "const d=require('./jichitai-compare/data/generated/municipalities.json');if(!d.municipalities.some(x=>x.code==='24341'))process.exit(1);if(d.municipalities.some(x=>x.code==='24361'))process.exit(1);console.log(d.meta.municipalityCount)"
      - name: Commit national synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/central-a-cause-main-sync-20260725.yml
          git add -A
          git commit -m "sync: 中日本A原因別監査の確定訂正をmain公開生成物へ反映"
          git push origin HEAD:sync/central-a-cause-main-20260725-1112
