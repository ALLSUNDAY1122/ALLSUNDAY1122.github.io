name: Temporary Central A Housing Batch 26

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch26-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch26-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 26
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T13:38:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const replacements={
            '27341': {
              type:'general_seismic_misclassification',
              service:{
                status:'unavailable',
                summary:'子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',
                details:{
                  confirmedGeneralProgram:'旧耐震基準の木造住宅を対象とする耐震診断・耐震改修・除却補助を確認した。',
                  classificationReview:'建築年・耐震性・所得等を条件とする一般住宅安全対策であり、子ども・新婚・三世代等を対象要件とする住宅取得・改修・家賃支援ではないため、子育て住宅支援として登録しない。',
                  childSpecificConditionConfirmed:false
                },
                source:{url:'https://www.town.tadaoka.osaka.jp/soshiki/machi/2/6/7/5550.html',checkedAt},
                additionalSources:[{url:'https://www.town.tadaoka.osaka.jp/soshiki/machi/2/6/7/5552.html',checkedAt,description:'一般木造住宅除却工事補助'}]
              }
            },
            '27361': {
              type:'replace_with_three_generation_home_acquisition',
              service:{
                status:'verified',
                summary:'中学生以下の子がいる子世帯または夫婦双方40歳以下の子世帯が、親世帯と町内で近居・同居する住宅を取得する場合、10万円を補助する。',
                details:{
                  program:'熊取町3世代近居等支援補助金',
                  target:'親・子・孫の3世代で熊取町内に近居または同居する子世帯。中学生以下の子を扶養する世帯、または子世帯の夫婦双方が40歳以下であること等が必要',
                  housing:'令和8年1月2日から令和9年1月1日までに新たに取得した、床面積50平方メートル以上の新築・中古住宅',
                  amount:'10万円',
                  application:'令和8年4月1日から令和9年2月末まで。企画財政経営課へ申請',
                  fiscalYear:'令和8年度まで実施'
                },
                source:{url:'https://www.town.kumatori.lg.jp/soshiki/kikaku_keiei/seisakukikaku/gyomu/hohoemi/1336.html',checkedAt}
              }
            },
            '27362': {
              type:'replace_with_three_generation_new_life_support',
              service:{
                status:'verified',
                summary:'義務教育修了前の子がいる世帯または夫婦双方40歳未満の世帯が、親世帯との同居・近居のため転入する場合、住宅取得30万円、賃借20万円、同居等10万円を助成する。',
                details:{
                  program:'田尻町三世代同居・近居 新生活スタート助成事業',
                  target:'親世帯との同居・近居のため田尻町へ転入する子世帯。義務教育修了前の子と同居する親子世帯、または夫婦双方が40歳未満の世帯',
                  purchase:'住宅取得助成金30万円',
                  rent:'住宅借入助成金20万円',
                  moveIn:'親元同居または公営住宅転入等の転入助成金10万円',
                  period:'転入日・住宅取得日・借入日が令和10年3月31日まで',
                  application:'転入日の翌日から6か月以内に企画人権課へ申請'
                },
                source:{url:'https://www.town.tajiri.osaka.jp/kakukanojoho/somubu/kikakujinkenka/8/639.html',checkedAt}
              }
            },
            '27366': {
              type:'current_young_child_home_acquisition_clarification',
              service:{
                status:'verified',
                summary:'45歳未満または義務教育終了前の子を扶養する世帯が町内で新築・中古住宅を取得する場合、基本補助に子ども・転入加算を受けられる。',
                details:{
                  programs:'岬町新築住宅取得補助制度・中古住宅取得補助制度',
                  target:'本人または配偶者が45歳未満、または義務教育終了前の子を扶養・同居する世帯等',
                  newHousing:'新築住宅は基本10万円。町外転入または義務教育終了前の子を扶養する場合は5万円加算',
                  usedHousing:'中古住宅は基本5万円。町外転入または義務教育終了前の子を扶養する場合は3万円加算',
                  period:'令和8年1月1日から令和9年3月31日までに取得した住宅',
                  application:'住宅取得・住民登録後、各制度の期限内に申請'
                },
                source:{url:'https://www.town.misaki.osaka.jp/soshiki/matidukuri/kikaku/teiju/357.html',checkedAt},
                additionalSources:[{url:'https://www.town.misaki.osaka.jp/soshiki/matidukuri/kikaku/teiju/356.html',checkedAt,description:'令和8年度中古住宅取得補助制度'}]
              }
            },
            '27382': {
              type:'replace_with_three_generation_acquisition_and_renovation',
              service:{
                status:'verified',
                summary:'中学生以下の子がいる世帯等が親世帯と町内で同居・近居するため住宅を取得・リフォームする場合、取得最大100万円、改修最大50万円を補助する。',
                details:{
                  program:'河南町三世代同居・近居支援事業補助金',
                  target:'中学生以下の子ども（出産予定を含む）がいる子世帯、または子どもがいない場合は夫婦双方40歳未満の子世帯が、町内の親世帯と同居・近居する場合',
                  acquisition:'住宅取得費の10分の1、上限100万円',
                  renovation:'100万円以上の住宅リフォーム費の10分の1、上限50万円',
                  applicationDeadline:'令和8年度の申請は令和9年3月31日まで',
                  application:'事前協議書と必要書類を町総務課へ持参'
                },
                source:{url:'https://www.town.kanan.osaka.jp/kurashi_tetsuzuki/sumai/iyuteijyu/4305.html',checkedAt}
              }
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(replacements)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第26群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');

            records.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch26-decisions-20260726',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B②',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:5,
            statusToUnavailableCount:1,
            verifiedReplacementOrClarificationCount:4,
            corrected:records,
            causeScan:{previousRemainingCandidates:49,reviewedHighRiskCandidates:5,remainingCandidates:44},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般耐震・省エネ制度だけを子育て世帯向け住宅支援として登録しない',
              '三世代同居・近居、子ども加算、若年・子育て世帯の住宅取得要件を現行利用者向け公式ページで確認する',
              '同じ自治体に直接的な子育て住宅制度がある場合は一般制度から主制度を差し替える'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch26-decisions-20260726.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残44件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=184;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=616;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=44;
          checkpoint.qualityReaudit.confirmedCorrections.push(
            {type:'general_seismic_misclassification',code:'27341',service:'housingSupport',name:'忠岡町'},
            {type:'three_generation_home_acquisition_replacement',code:'27361',service:'housingSupport',name:'熊取町'},
            {type:'three_generation_new_life_replacement',code:'27362',service:'housingSupport',name:'田尻町'},
            {type:'young_child_home_acquisition_clarification',code:'27366',service:'housingSupport',name:'岬町'},
            {type:'three_generation_acquisition_renovation_replacement',code:'27382',service:'housingSupport',name:'河南町'}
          );
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残44件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:26,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:1,verifiedReplacementOrClarificationCount:4,remainingCandidates:44,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第26群として、忠岡町の一般耐震制度をunavailableへ修正し、熊取町・田尻町・河南町を三世代住宅支援へ差し替え、岬町の新築・中古住宅取得条件を明確化した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch26-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/27/27341.json|jichitai-compare/data/municipalities/27/27361.json|jichitai-compare/data/municipalities/27/27362.json|jichitai-compare/data/municipalities/27/27366.json|jichitai-compare/data/municipalities/27/27382.json|jichitai-compare/operations/tasks/27341.json|jichitai-compare/operations/tasks/27361.json|jichitai-compare/operations/tasks/27362.json|jichitai-compare/operations/tasks/27366.json|jichitai-compare/operations/tasks/27382.json|jichitai-compare/operations/audits/central-a-housing-classification-batch26-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/27341/index.html|jichitai-compare/municipality/27361/index.html|jichitai-compare/municipality/27362/index.html|jichitai-compare/municipality/27366/index.html|jichitai-compare/municipality/27382/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch26-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第26群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
