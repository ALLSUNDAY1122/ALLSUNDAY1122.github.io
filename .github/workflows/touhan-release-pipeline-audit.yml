# audit-refresh: 2026-09-15T19:30+09:00
name: Touhan Release Pipeline Audit

on:
  push:
    branches: [main]
    paths:
      - 'codemagic.yaml'
      - 'scripts/install_touhan_codemagic.py'
      - 'scripts/audit_touhan_release_pipeline.py'
      - '.github/workflows/touhan-release-pipeline-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touhan-release-pipeline-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Enforce App Store eligible release candidate contract
        run: |
          python3 scripts/audit_touhan_release_pipeline.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/install_touhan_codemagic.py').read_text(encoding='utf-8')
          required = [
              'name: 登録販売者 - iOS App Store Release Candidate',
              'xcode-project use-profiles',
              'app-store-connect publish',
              'internal_testflight_only_export": False',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'installer release contract missing: {token}')
          expected_self_reference_counts = {'testFlightInternalTestingOnly': 1,'Internal TestFlight': 1}
          for token, expected in expected_self_reference_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f'installer obsolete-token occurrence mismatch: {token}: {actual} != {expected}')
          print('PASS: Touhan installer cannot restore internal-only release mode')
          PY
