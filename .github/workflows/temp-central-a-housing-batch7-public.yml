name: Temporary Central A Housing Batch 7 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch7-public-trigger-20260725.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch7-public-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const expectedSummary = '子育て世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const targets = [
            { code: '27209', name: '守口市', source: 'https://www.city.moriguchi.osaka.jp/kakukanoannai/toshiseibibu/jutakumachidukurika/taishin/1927.html' },
            { code: '27231', name: '大阪狭山市', source: 'https://www.city.osakasayama.osaka.jp/tetsuzuki/sumai/2/5128.html' },
            { code: '27322', name: '能勢町', source: 'https://www.town.nose.osaka.jp/soshiki/soumuka/seisakusuishin/kyodo_machi/shisaku/1278.html' },
            { code: '24343', name: '朝日町', source: 'https://www2.town.asahi.mie.jp/www/contents/1765953791058/index.html' },
            { code: '28218', name: '小野市', source: 'https://www.city.ono.hyogo.jp/soshikikarasagasu/chiikishinkobu_machizukurika/gyomuannai/taisinnkazigyou/index.html' }
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const auditPath = 'jichitai-compare/operations/audits/central-a-housing-classification-batch7-public-verification-20260725.json';
          fs.mkdirSync(path.dirname(auditPath), { recursive: true });

          let finalResult = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const cache = `${Date.now()}-${attempt}`;
            const pageChecks = [];
            for (const target of targets) {
              try {
                const response = await fetch(`${base}/municipality/${target.code}/?audit=${cache}`, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(25000),
                  headers: { 'user-agent': 'CentralAHousingBatch7PublicVerification/1.0' }
                });
                const text = await response.text();
                pageChecks.push({
                  code: target.code,
                  name: target.name,
                  url: response.url,
                  httpStatus: response.status,
                  summaryMatches: text.includes(expectedSummary),
                  unavailableLabelMatches: text.includes('公式情報で詳細未確認'),
                  sourceMatches: text.includes(target.source),
                  success: response.ok && text.includes(expectedSummary) && text.includes('公式情報で詳細未確認') && text.includes(target.source)
                });
              } catch (error) {
                pageChecks.push({ code: target.code, name: target.name, httpStatus: null, success: false, error: String(error) });
              }
            }

            let generated = { success: false };
            try {
              const response = await fetch(`${base}/data/generated/municipalities.json?audit=${cache}`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(40000),
                headers: { 'user-agent': 'CentralAHousingBatch7PublicVerification/1.0' }
              });
              const text = await response.text();
              const payload = JSON.parse(text);
              const municipalities = Array.isArray(payload)
                ? payload
                : Array.isArray(payload.municipalities)
                  ? payload.municipalities
                  : Array.isArray(payload.items)
                    ? payload.items
                    : [];
              const checks = targets.map((target) => {
                const municipality = municipalities.find((item) => String(item.code) === target.code);
                const service = municipality?.services?.housingSupport;
                return {
                  code: target.code,
                  found: Boolean(municipality),
                  statusUnavailable: service?.status === 'unavailable',
                  summaryMatches: service?.summary === expectedSummary,
                  sourceMatches: service?.source?.url === target.source,
                  childSpecificConditionFalse: service?.details?.childSpecificConditionConfirmed === false,
                  success: Boolean(municipality) && service?.status === 'unavailable' && service?.summary === expectedSummary && service?.source?.url === target.source && service?.details?.childSpecificConditionConfirmed === false
                };
              });
              const serviceCount = municipalities.reduce((sum, item) => sum + Object.keys(item.services ?? {}).length, 0);
              generated = {
                httpStatus: response.status,
                municipalityCount: municipalities.length,
                serviceCount,
                municipalityCount1741: municipalities.length === 1741,
                serviceCount15669: serviceCount === 15669,
                checks,
                success: response.ok && municipalities.length === 1741 && serviceCount === 15669 && checks.every((item) => item.success)
              };
            } catch (error) {
              generated = { success: false, error: String(error) };
            }

            const success = pageChecks.every((item) => item.success) && generated.success;
            finalResult = {
              schemaVersion: '1.0.0',
              auditId: 'central-a-housing-classification-batch7-public-verification-20260725',
              generatedAt: new Date().toISOString(),
              attempt,
              regionalPullRequest: 3526,
              regionalCiRun: 8552,
              stateSyncPullRequest: 3533,
              stateSyncCiRun: 8567,
              nationalSyncPullRequest: 3536,
              verificationPullRequest: Number(process.env.PR_NUMBER),
              verificationWorkflowRunId: Number(process.env.RUN_ID),
              pageChecks,
              publicGeneratedJson: generated,
              success,
              releaseBlocker: success ? 'none' : 'public_mismatch'
            };
            fs.writeFileSync(auditPath, JSON.stringify(finalResult, null, 2) + '\n');
            if (success) break;
            await sleep(10000);
          }
          NODE

      - name: Commit verification evidence
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch7-public-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/central-a-housing-classification-batch7-public-verification-20260725.json \
            jichitai-compare/operations/control/central-a-housing-batch7-public-trigger-20260725.json
          git commit -m 'audit: 中日本A住宅支援第7群の公開反映を確認'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Enforce verification result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('jichitai-compare/operations/audits/central-a-housing-classification-batch7-public-verification-20260725.json', 'utf8'));
          if (!result.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(result, null, 2));
          NODE
