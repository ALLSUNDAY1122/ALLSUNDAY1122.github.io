name: Temporary West B Rough Validation Progress 02

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/west-b-rough-validation-progress-02-20260725
          fetch-depth: 0

      - name: Record validation progress
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(readFileSync(path, 'utf8'));
          checkpoint.updatedAt = '2026-07-25T00:53:00+09:00';
          checkpoint.roughValidation = {
            status: 'in_progress',
            plannedCycles: 10,
            completedCycles: 2,
            auditedMunicipalityCount: 50,
            auditedServiceCount: 450,
            remainingMunicipalityCount: 200,
            detectedResearchContentErrorCount: 0,
            detectedSourceMaintenanceIssueCount: 3,
            correctedSourceMaintenanceIssueCount: 3,
            lastCycle: {
              cycle: 2,
              auditPullRequestNumber: 2937,
              auditCiRunNumber: 7085,
              auditMergeCommit: 'a132a7acec29b51c6ad0247e46c845232c88e680',
              auditFile: 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-02-20260725.json',
              municipalityCount: 25,
              serviceCount: 225,
              prefectureCodes: ['32', '34'],
              manualSpotCheckCount: 5,
              contentErrorCount: 0,
              sourceMaintenanceIssueCount: 2,
              sourceCorrectionPullRequestNumber: 2951,
              sourceCorrectionCiRunNumber: 7070,
              sourceCorrectionMergeCommit: '702a8cb7b7247a9a089df277a14d8409313fecac'
            },
            cycleHistory: [
              {
                cycle: 1,
                municipalityCount: 25,
                serviceCount: 225,
                contentErrorCount: 0,
                sourceMaintenanceIssueCount: 1,
                auditPullRequestNumber: 2921,
                correctionPullRequestNumber: 2930
              },
              {
                cycle: 2,
                municipalityCount: 25,
                serviceCount: 225,
                contentErrorCount: 0,
                sourceMaintenanceIssueCount: 2,
                auditPullRequestNumber: 2937,
                correctionPullRequestNumber: 2951
              }
            ],
            nextCycle: {
              cycle: 3,
              plannedMunicipalityCount: 25,
              scopePolicy: '広島県の残り自治体から開始し、山口県へ進む'
            }
          };
          writeFileSync(path, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE

      - name: Remove workflow and commit checkpoint
        run: |
          rm .github/workflows/temp-west-b-rough-validation-progress-02.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-west-b-rough-validation-progress-02.yml \
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          git commit -m 'ops: record West B rough validation progress 2 of 10'
          git push origin HEAD:ops/west-b-rough-validation-progress-02-20260725
