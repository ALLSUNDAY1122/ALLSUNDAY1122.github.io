name: Fix Minamiosumi 46491 Publication Readiness

on:
  pull_request:
    branches: [region/west]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/46491-publication-readiness-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/46491-publication-readiness-20260724
      - name: Normalize incomplete services
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const municipalityPath = 'jichitai-compare/data/municipalities/46/46491.json';
          const taskPath = 'jichitai-compare/operations/tasks/46491.json';
          const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
          const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
          const serviceIds = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];

          municipality.status = 'verified';
          municipality.summary = '必須9制度を南大隅町公式情報で調査。6制度をverified、現行の具体条件を確定できない病児・病後児保育、学校給食費、こども誰でも通園制度をunavailableとして登録。';
          municipality.updatedAt = '2026-07-24';

          municipality.services.sickChildCare.status = 'unavailable';
          municipality.services.sickChildCare.summary = '根占こども園の病後児室は確認したが、2026年度の対象年齢・料金・時間・利用手続を確定できない';

          municipality.services.schoolMeals.status = 'unavailable';
          municipality.services.schoolMeals.summary = '令和8年度予算で学校給食の実施経費は確認したが、一般世帯の給食費額・公費負担後の徴収条件を確定できない';
          municipality.services.schoolMeals.source = {
            url: 'https://www.town.minamiosumi.lg.jp/soumu/documents/r8-ippan.pdf',
            checkedAt: '2026-07-24'
          };

          municipality.services.temporaryChildcare.status = 'unavailable';
          municipality.services.temporaryChildcare.summary = '未就園家庭向け子育て支援センターは確認したが、こども誰でも通園制度の2026年度利用条件を確定できない';
          municipality.services.temporaryChildcare.source = {
            url: 'https://www.town.minamiosumi.lg.jp/kaigohukushi/kurashi/kosodate/kosodateshien/kosodateshien.html',
            checkedAt: '2026-07-24'
          };

          const services = serviceIds.map((id) => municipality.services[id]);
          task.status = 'pr_open';
          task.currentService = null;
          task.nextServiceIndex = 9;
          task.completedServices = [...serviceIds];
          task.verifiedCount = services.filter((s) => s.status === 'verified').length;
          task.researchingCount = 0;
          task.unavailableCount = services.filter((s) => s.status === 'unavailable').length;
          task.needsMediumReviewCount = 0;
          task.currentBranch = 'fix/46491-publication-readiness-20260724';
          task.pullRequestNumber = Number(process.env.PR_NUMBER);
          task.lastCheckedAt = '2026-07-24';
          task.lastUpdatedAt = '2026-07-24T16:12:00+09:00';
          task.lastUpdatedBy = '統括B';
          task.officialSources = [...new Set(services.map((s) => s.source?.url).filter((url) => /^https:\/\//.test(url || '')))];
          task.notes = [...task.notes, '病後児保育・学校給食費・こども誰でも通園制度を、制度不存在と断定せず、2026年度具体条件未確定のためunavailableへ正規化。'];
          task.blockers = [];

          fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');
          fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          NODE
      - name: Validate and commit
        run: |
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-46491-publication-readiness.yml
          git add jichitai-compare/data/municipalities/46/46491.json jichitai-compare/operations/tasks/46491.json
          git commit -m "fix: 南大隅町を公開可能状態へ正規化"
          git push origin HEAD:fix/46491-publication-readiness-20260724
