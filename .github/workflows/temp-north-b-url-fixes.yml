name: Temporary North B URL Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-north-b-url-fixes.yml'

permissions:
  contents: write

concurrency:
  group: north-b-url-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply confirmed URL corrections
        run: node jichitai-compare/scripts/temp-north-b-url-fixes.mjs

      - name: Regenerate and validate public data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Commit confirmed corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities \
                  jichitai-compare/operations/tasks \
                  jichitai-compare/data/generated \
                  jichitai-compare/operations/progress.json \
                  jichitai-compare/municipality \
                  jichitai-compare/sitemap.xml
          if git diff --cached --quiet; then
            echo 'No correction changes to commit.'
            exit 1
          fi
          git commit -m 'fix: 北日本Bの現行公式URLを保守更新 [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
