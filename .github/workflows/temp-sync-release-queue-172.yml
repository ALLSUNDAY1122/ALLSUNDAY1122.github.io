name: Temporary sync release queue to 172

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-release-queue-172.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync release queue
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          by_region = {entry['region']: entry for entry in data['entries']}

          central = by_region['central']
          existing = {m['code'] for m in central['municipalities']}
          if '21213' not in existing:
              central['municipalities'].append({'code': '21213', 'name': '各務原市'})
          central['count'] = len(central['municipalities'])
          central['pendingSinceLastRelease'] = 3
          central['releaseStatus'] = 'pending_threshold'
          central['reason'] = '若狭町から羽島市までの追加10自治体をPR #348でmainへ全国統合し、生成・公開をPR #350で154自治体へ更新。その後、恵那市・美濃加茂市・各務原市を地方統合'
          central['auditStatus'] = 'passed'

          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).replace(second=0, microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities'] = 0
          data['summary']['releaseReadyRegions'] = []
          data['summary']['auditBlockedRegions'] = []
          data['nextAction'] = '東日本が前回全国統合後4自治体で先行。中日本3、北日本1、西日本1。最初に10自治体へ到達した地域を全国統合する。'
          data['humanDecisionRequired'] = False

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit synchronized queue and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-sync-release-queue-172.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-172.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '統括管理: 地方統合172自治体・公開164自治体へ同期'
          git push origin main
