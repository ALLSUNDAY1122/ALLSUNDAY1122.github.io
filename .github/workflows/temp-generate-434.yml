name: Temporary Generate 434 Municipalities

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-434.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-434-20260722-1605
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and validate
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          text=text.replace('414自治体・9制度','434自治体・9制度')
          text=text.replace('登録状況：414自治体の生成データを公開中','登録状況：434自治体の生成データを公開中')
          if '414自治体' in text:
              raise SystemExit('old public count remains')
          path.write_text(text,encoding='utf-8')
          PY
          node ./scripts/validate-data.mjs --require-generated
          cd ..
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/progress.json | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git commit -m '生成更新: 公開データを434自治体へ同期'
          git push origin coord/generated-434-20260722-1605
      - name: Remove temporary workflow
        if: always()
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-generate-434.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 公開434自治体生成一時ワークフローを削除'
          git push origin main
