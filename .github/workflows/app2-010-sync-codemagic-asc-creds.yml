name: APP2-010 Sync ASC Credentials to Codemagic

on:
  push:
    branches: [main]
    paths: ['automation/app2-010-sync-codemagic-asc-creds-command.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Sync App Store Connect credentials into existing secure Codemagic group
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          from pathlib import Path

          cmd=json.loads(Path('automation/app2-010-sync-codemagic-asc-creds-command.json').read_text(encoding='utf-8'))
          rid=str(cmd.get('request_id','')); app=str(cmd.get('app_id','')); group_id=str(cmd.get('group_id','')); group_name=str(cmd.get('group_name',''))
          if not re.fullmatch(r'app2-010-sync-asc-creds-[A-Za-z0-9._-]{1,60}',rid): raise SystemExit('invalid request id')
          if app!='6a769d81a1add9d06020b524' or group_id!='6a858cbdf36a890a9fa2c3f4' or group_name!='app2_010_touhan_signing': raise SystemExit('unexpected target')
          token=os.environ.get('CM_API_TOKEN','').strip(); issuer=os.environ.get('ASC_ISSUER_ID','').strip(); kid=os.environ.get('ASC_KEY_ID','').strip(); p8=os.environ.get('ASC_PRIVATE_KEY','')
          if not token or not issuer or not kid or 'PRIVATE KEY' not in p8: raise SystemExit('required credentials unavailable')

          def call(method,path,payload=None):
              req=urllib.request.Request('https://codemagic.io'+path,data=(json.dumps(payload).encode('utf-8') if payload is not None else None),method=method,headers={'x-auth-token':token,'Accept':'application/json','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8'); return r.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except: body={'raw':raw[:500]}
                  return e.code,body
          def items(payload):
              if isinstance(payload,list): return payload
              if isinstance(payload,dict):
                  for key in ('data','variables'):
                      value=payload.get(key)
                      if isinstance(value,list): return value
                      if isinstance(value,dict):
                          for nested in ('data','items','variables'):
                              if isinstance(value.get(nested),list): return value[nested]
              return []

          # Confirm the group and pre-existing signing private key by name only.
          gs,gp=call('GET',f'/api/v3/apps/{app}/variable-groups')
          if gs!=200: raise RuntimeError(f'group list failed HTTP {gs}')
          groups=items(gp)
          if not any(str(g.get('id') or g.get('_id'))==group_id and (g.get('name') or g.get('group_name'))==group_name for g in groups if isinstance(g,dict)):
              raise RuntimeError('expected signing group not found')
          vs,vp=call('GET',f'/api/v3/variable-groups/{group_id}/variables')
          if vs!=200: raise RuntimeError(f'variable list failed HTTP {vs}')
          before_names={str(v.get('name')) for v in items(vp) if isinstance(v,dict) and v.get('name')}
          if 'CERTIFICATE_PRIVATE_KEY' not in before_names: raise RuntimeError('signing private key variable is missing')

          payload={'secure':True,'variables':[
              {'name':'APP_STORE_CONNECT_PRIVATE_KEY','value':p8},
              {'name':'APP_STORE_CONNECT_KEY_IDENTIFIER','value':kid},
              {'name':'APP_STORE_CONNECT_ISSUER_ID','value':issuer},
          ]}
          ps,pp=call('POST',f'/api/v3/variable-groups/{group_id}/variables',payload)
          if ps!=201: raise RuntimeError(f'credential sync failed HTTP {ps}: {str(pp)[:400]}')
          rs,rp=call('GET',f'/api/v3/variable-groups/{group_id}/variables')
          if rs!=200: raise RuntimeError(f'credential read-back failed HTTP {rs}')
          variables=[v for v in items(rp) if isinstance(v,dict)]
          names=sorted(str(v.get('name')) for v in variables if v.get('name'))
          required={'CERTIFICATE_PRIVATE_KEY','APP_STORE_CONNECT_PRIVATE_KEY','APP_STORE_CONNECT_KEY_IDENTIFIER','APP_STORE_CONNECT_ISSUER_ID'}
          if not required.issubset(set(names)): raise RuntimeError(f'missing variables after sync: {sorted(required-set(names))}')
          secure_names=sorted(str(v.get('name')) for v in variables if v.get('name') and bool(v.get('secure') or v.get('is_secure') or v.get('encrypted')))
          result={'request_id':rid,'ok':True,'app_id':app,'group_id':group_id,'group_name':group_name,'sync_http_status':ps,'readback_http_status':rs,'variable_names':names,'secure_variable_names':secure_names,'secret_values_persisted_to_git':False}
          out=Path('automation/codemagic-results')/f'{rid}.json'; out.parent.mkdir(parents=True,exist_ok=True); payload_out=json.dumps(result,ensure_ascii=False,indent=2)+'\n'; out.write_text(payload_out,encoding='utf-8'); Path('/tmp/result-path.txt').write_text(str(out),encoding='utf-8'); Path('/tmp/result-copy.json').write_text(payload_out,encoding='utf-8')
          print('PASS: synced ASC credential names into Codemagic secure group')
          PY
      - name: Persist sanitized sync result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="$(cat /tmp/result-path.txt)"; git add "$P"; git commit -m "Persist APP2-010 ASC credential sync result" || exit 0
          if git push; then exit 0; fi
          git fetch origin main; git reset --hard origin/main; mkdir -p "$(dirname "$P")"; cp /tmp/result-copy.json "$P"; git add "$P"; git commit -m "Persist APP2-010 ASC credential sync result" || exit 0; git push origin HEAD:main
