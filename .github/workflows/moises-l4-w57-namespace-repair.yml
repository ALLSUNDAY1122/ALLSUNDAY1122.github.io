name: Moises L4 W57 Compile Gate

on:
  push:
    branches:
      - moises/wp4-analysis-platform
    paths:
      - '.github/workflows/moises-l4-w57-namespace-repair.yml'
      - 'tech-assets/moises-audio/**'

permissions:
  contents: read

jobs:
  validate-l4:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.0
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Verify Analysis is compiled by Package.swift
        working-directory: tech-assets/moises-audio
        run: |
          set -euo pipefail
          grep -q '"Analysis/AnalysisPhysicalRealAudioBridgeConsumptionDurablePublication.swift"' Package.swift
          grep -q '"Analysis/AnalysisPhysicalRealAudioBridgeConsumptionSecureFilesystem.swift"' Package.swift
          test -f Analysis/AnalysisPhysicalRealAudioBridgeConsumptionDurablePublication.swift
          test -f Analysis/AnalysisPhysicalRealAudioBridgeConsumptionSecureFilesystem.swift

      - name: W57 bypass contract diagnostic
        working-directory: tech-assets/moises-audio
        run: |
          set -euo pipefail
          nl -ba Analysis/AnalysisPhysicalRealAudioBridgeConsumptionQuiescentCustody.swift | sed -n '395,470p'
          grep -R -n -E 'bypassToken|authorizeNormalizedRouting' Analysis || true

      - name: Full recovered Lane4 SwiftPM
        working-directory: tech-assets/moises-audio
        run: swift test
