name: Network Specialist release config patch

on:
  push:
    branches:
      - automation/network-release-unblock-20260909
    paths:
      - scripts/patch_network_specialist_release.py
      - .github/workflows/network-specialist-release-config-patch.yml

permissions:
  contents: write

jobs:
  patch-release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/network-release-unblock-20260909
          fetch-depth: 0
      - name: Patch release configuration
        run: python3 scripts/patch_network_specialist_release.py
      - name: Verify method-family migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('codemagic.yaml').read_text(encoding='utf-8')
          m=re.search(r'(?ms)^  network-specialist-native-ios:\n.*?(?=^  [A-Za-z0-9_-]+:\n|\Z)',root)
          assert m, 'network workflow missing'
          block=m.group(0)
          for token in ['distribution_type: app_store','bundle_identifier: jp.allsunday1122.networkspecialist','xcode-project use-profiles','submit_to_testflight: false','submit_to_app_store: false']:
              assert token in block, token
          for token in ['app-store-connect fetch-signing-files','keychain initialize','keychain add-certificates','drive.google.com/uc?export=download']:
              assert token not in block, token
          print('PASS root network release workflow')
          PY
      - name: Commit patched configs
        run: |
          if git diff --quiet -- codemagic.yaml network-specialist-sprint/codemagic.yaml; then
            echo 'No config changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml network-specialist-sprint/codemagic.yaml
          git commit -m 'Network Specialist: use Codemagic managed signing'
          git push origin HEAD:automation/network-release-unblock-20260909
