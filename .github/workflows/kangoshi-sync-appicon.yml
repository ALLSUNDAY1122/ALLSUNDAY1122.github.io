name: Kangoshi Sync Approved AppIcon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kangoshi-sync-appicon.yml'

concurrency:
  group: kangoshi-sync-appicon
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved individual PNG from Drive canonical asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1VDnbT0s9gEPde4baCfw9kXYfnEHLQrp3&export=download&confirm=t' \
            -o /tmp/Kangoshi-AppIcon.png
          echo '6afe16483852c98e0e030874ce7829f0e1a42fe017bb2f854eee1d9410f8ee80  /tmp/Kangoshi-AppIcon.png' | sha256sum -c -
          file /tmp/Kangoshi-AppIcon.png | grep -q 'PNG image data, 1024 x 1024'
          cp /tmp/Kangoshi-AppIcon.png kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Write AppIcon asset catalog metadata
        run: |
          cat > kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          cat > kangoshi-sprint/ios/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
      - name: Connect asset catalog to XcodeGen project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kangoshi-sprint/ios/project.yml')
          s=p.read_text(encoding='utf-8')
          marker='      - path: Sources\n'
          addition='      - path: Sources\n      - path: Assets.xcassets\n'
          if '      - path: Assets.xcassets\n' not in s:
              if marker not in s: raise SystemExit('project.yml Sources marker missing')
              s=s.replace(marker,addition,1)
          if 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' not in s:
              settings='        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kangoshi\n'
              replacement=settings+'        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon\n'
              if settings not in s: raise SystemExit('bundle id marker missing')
              s=s.replace(settings,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate exact canonical icon and project binding
        run: |
          echo '6afe16483852c98e0e030874ce7829f0e1a42fe017bb2f854eee1d9410f8ee80  kangoshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png' | sha256sum -c -
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' kangoshi-sprint/ios/project.yml
          grep -q 'Assets.xcassets' kangoshi-sprint/ios/project.yml
      - name: Commit canonical AppIcon integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kangoshi-sprint/ios/Assets.xcassets kangoshi-sprint/ios/project.yml
          if ! git diff --cached --quiet; then
            git commit -m 'kangoshi: integrate approved canonical AppIcon'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = "1"
          fi
