name: APP2-009 Kangoshi Subscription Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'automation/app2-009-kangoshi-subscription-command.json'

permissions:
  contents: write

concurrency:
  group: app2-009-kangoshi-subscription-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate command
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('automation/app2-009-kangoshi-subscription-command.json').read_text(encoding='utf-8'))
          if data.get('task_id')!='APP2-009' or data.get('action')!='ensure_subscription':
              raise SystemExit('Unexpected APP2-009 command payload')
          PY
      - name: Ensure Kangoshi monthly subscription
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_009_kangoshi_subscription_bootstrap.py
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/app2-009-kangoshi-subscription-result.json
          git commit -m 'APP2-009: persist Kangoshi subscription result'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
