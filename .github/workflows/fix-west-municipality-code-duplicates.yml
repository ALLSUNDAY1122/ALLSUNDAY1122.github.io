name: Fix West Municipality Code Duplicates

on:
  pull_request:
    branches: [region/west]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/west-municipality-code-duplicates-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-municipality-code-duplicates-20260724
          fetch-depth: 0
      - name: Correct current municipality codes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const project = path.join(root, 'jichitai-compare');
          const services = JSON.parse(fs.readFileSync(path.join(project, 'data/service-definitions.json'), 'utf8')).services.map((x) => x.id);
          const read = (p) => JSON.parse(fs.readFileSync(path.join(root, p), 'utf8'));
          const write = (p, value) => {
            const full = path.join(root, p);
            fs.mkdirSync(path.dirname(full), { recursive: true });
            fs.writeFileSync(full, `${JSON.stringify(value, null, 2)}\n`);
          };

          const sourceMunicipalityPath = 'jichitai-compare/data/municipalities/40/40208.json';
          const sourceTaskPath = 'jichitai-compare/operations/tasks/40208.json';
          const targetMunicipalityPath = 'jichitai-compare/data/municipalities/40/40210.json';
          const targetTaskPath = 'jichitai-compare/operations/tasks/40210.json';

          const municipality = read(sourceMunicipalityPath);
          municipality.code = '40210';
          municipality.name = '八女市';
          municipality.officialUrl = 'https://www.city.yame.fukuoka.jp/';
          municipality.status = 'verified';
          municipality.summary = '必須9制度を八女市公式情報で調査し、全制度をverifiedとして登録。自治体コードを現行標準地域コード40210へ修正。';
          municipality.updatedAt = '2026-07-24';
          write(targetMunicipalityPath, municipality);

          const sourceTask = read(sourceTaskPath);
          const officialSources = services.map((id) => municipality.services[id]?.source?.url).filter((url) => /^https:\/\//u.test(url ?? ''));
          const task = {
            ...sourceTask,
            municipalityCode: '40210',
            municipalityName: '八女市',
            prefectureCode: '40',
            prefectureName: '福岡県',
            assignedTeam: '西日本調査班',
            status: 'merged',
            currentService: null,
            nextServiceIndex: 9,
            completedServices: [...services],
            verifiedCount: 9,
            researchingCount: 0,
            unavailableCount: 0,
            needsMediumReviewCount: 0,
            currentBranch: 'fix/west-municipality-code-duplicates-20260724',
            pullRequestNumber: null,
            lastCheckedAt: '2026-07-24',
            lastUpdatedAt: '2026-07-24T20:20:00+09:00',
            lastUpdatedBy: '統括B自治体コード修復',
            officialSources: [...new Set(officialSources)],
            notes: [
              ...(Array.isArray(sourceTask.notes) ? sourceTask.notes : []),
              'e-Stat現行標準地域コードに基づき、八女市を誤コード40208から正規コード40210へ移行。',
              '非現行コード40208・40209・46410の重複自治体データとtaskを削除。',
              '正規コード40211筑後市、40212大川市、46404長島町は維持。'
            ],
            blockers: []
          };
          write(targetTaskPath, task);

          for (const code of ['40208', '40209', '46410']) {
            for (const p of [
              `jichitai-compare/data/municipalities/${code.slice(0, 2)}/${code}.json`,
              `jichitai-compare/operations/tasks/${code}.json`
            ]) {
              if (fs.existsSync(path.join(root, p))) fs.rmSync(path.join(root, p));
            }
          }

          const expected = new Map([
            ['40210', '八女市'],
            ['40211', '筑後市'],
            ['40212', '大川市'],
            ['46404', '長島町']
          ]);
          for (const [code, name] of expected) {
            const p = `jichitai-compare/data/municipalities/${code.slice(0, 2)}/${code}.json`;
            const item = read(p);
            if (item.code !== code || item.name !== name) throw new Error(`${code}の識別情報不一致: ${item.code}/${item.name}`);
          }
          for (const code of ['40208', '40209', '46410']) {
            const dataPath = path.join(project, 'data/municipalities', code.slice(0, 2), `${code}.json`);
            const taskPath = path.join(project, 'operations/tasks', `${code}.json`);
            if (fs.existsSync(dataPath) || fs.existsSync(taskPath)) throw new Error(`非現行コードが残存: ${code}`);
          }
          NODE
      - name: Validate corrected source data
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit correction and remove workflow
        run: |
          git rm .github/workflows/fix-west-municipality-code-duplicates.yml
          git add -A jichitai-compare/data/municipalities/40 jichitai-compare/data/municipalities/46 jichitai-compare/operations/tasks
          git commit -m "fix: 福岡・鹿児島の自治体コード重複を修復"
          git push origin HEAD:fix/west-municipality-code-duplicates-20260724
