name: Rigaku Settings One-time Wiring

on:
  pull_request:
    paths:
      - 'rigaku-sprint/ios/wire_release_sections.py'
      - '.github/workflows/rigaku-settings-wire.yml'

permissions:
  contents: write

jobs:
  wire-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire release settings sections
        run: python3 rigaku-sprint/ios/wire_release_sections.py
      - name: Commit once
        run: |
          if ! git diff --quiet -- rigaku-sprint/ios/Sources/RigakuRootViewV2.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rigaku-sprint/ios/Sources/RigakuRootViewV2.swift
            git commit -m "feat(rigaku): expose StoreKit and legal links in settings"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
