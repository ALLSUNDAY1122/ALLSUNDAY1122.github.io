name: Temporary West A School Meals Finalize

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-school-meals-finalize-trigger-20260725.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'audit/west-a-school-meals-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply source maintenance and finalize audit
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,o)=>fs.writeFileSync(p,JSON.stringify(o)+'\n');
          const date='2026-07-25'; const now='2026-07-25T16:50:00+09:00'; const pr=3584;

          // 五木村: 計画ページから現行補助要綱へ主出典を更新。
          {
            const mp='jichitai-compare/data/municipalities/43/43511.json'; const m=read(mp); const s=m.services.schoolMeals;
            s.details.target='五木村立学校に在籍する児童生徒の保護者。村内在住で村外の特別支援学校等へ通学する児童生徒の保護者も補助対象';
            s.details.support='村立学校在籍者は毎年度算定する月額給食費の全額を補助。村外特別支援学校等の対象者は月額給食費の3分の2を補助';
            s.details.legalBasis='五木村学校給食費補助金交付要綱第2条・第3条';
            delete s.details.fiscalYear;
            s.source={url:'https://www.vill.itsuki.lg.jp/reiki/reiki_honbun/q480RG00000841.html',checkedAt:date};
            s.additionalSources=[{url:'https://www.vill.itsuki.lg.jp/kiji0032221/',checkedAt:date}];
            m.updatedAt=date; write(mp,m);
            const tp='jichitai-compare/operations/tasks/43511.json'; const t=read(tp);
            t.pullRequestNumber=pr;t.lastCheckedAt=date;t.lastUpdatedAt=now;t.lastUpdatedBy='西日本調査班A・学校給食費226自治体横断監査';
            t.officialSources=[...new Set(Object.values(m.services).map(x=>x.source?.url).filter(Boolean))];
            const note='2026-07-25: schoolMealsの主出典を実施計画ページから現行「五木村学校給食費補助金交付要綱」へ更新。村立学校は月額給食費全額、村外特別支援学校等は3分の2補助を確認（PR #3584）。';
            t.notes=t.notes||[];if(!t.notes.includes(note))t.notes.push(note);write(tp,t);
          }

          // 出水市: 会議一覧から令和8年度当初予算説明の具体ページへ主出典を更新。
          {
            const mp='jichitai-compare/data/municipalities/46/46208.json'; const m=read(mp); const s=m.services.schoolMeals;
            s.details.start='2026年1月に第1子・第2子を含む市立小中学校給食費の完全無償化を開始し、2026年度当初予算でも継続';
            s.details.support='令和8年度当初予算の学校給食費助成事業費により、国の交付金等を活用して小中学校の給食費無償化を継続';
            s.source={url:'https://www.city.kagoshima-izumi.lg.jp/gikai/gijiroku/detail_select/533/1',checkedAt:date};
            s.additionalSources=[
              {url:'https://www.city.kagoshima-izumi.lg.jp/gikai/gijiroku/detail_select/530/6',checkedAt:date},
              {url:'https://www.city.kagoshima-izumi.lg.jp/gikai/gijiroku/detail_select/530/58',checkedAt:date}
            ];
            m.updatedAt=date; write(mp,m);
            const tp='jichitai-compare/operations/tasks/46208.json'; const t=read(tp);
            t.pullRequestNumber=pr;t.lastCheckedAt=date;t.lastUpdatedAt=now;t.lastUpdatedBy='西日本調査班A・学校給食費226自治体横断監査';
            t.officialSources=[...new Set(Object.values(m.services).map(x=>x.source?.url).filter(Boolean))];
            const note='2026-07-25: schoolMealsの主出典を議会会議一覧から令和8年度当初予算説明の具体ページへ更新。2026年1月開始の完全無償化と2026年度継続を確認（PR #3584）。';
            t.notes=t.notes||[];if(!t.notes.includes(note))t.notes.push(note);write(tp,t);
          }

          const dispositions=[
            {code:'43505',name:'多良木町',resolution:'retained_verified',finding:'現行学校給食一覧と無償化ページで、2023年4月開始・小中学校等・保護者負担0円を確認。取得時404は一時的応答差として扱い、内容変更なし。'},
            {code:'46203',name:'鹿屋市',resolution:'retained_verified',finding:'現行利用者向けページで2024年4月から市立小中学生の給食費全額支援を確認。'},
            {code:'43511',name:'五木村',resolution:'source_maintenance_and_fact_enrichment',finding:'計画ページを主出典とせず、現行補助要綱へ更新。村立学校は全額、村外特別支援学校等は3分の2補助。'},
            {code:'46208',name:'出水市',resolution:'source_maintenance',finding:'会議一覧を主出典とせず、2026年度当初予算説明の具体ページへ更新。2026年1月開始・2026年度継続を確認。'},
            {code:'46524',name:'宇検村',resolution:'retained_verified',finding:'村公式子育て支援ページの給食費無料記載と施政方針の継続記載が一致。'}
          ];
          const final={
            schemaVersion:'1.0.0',auditId:'west-a-school-meals-final-resolution-20260725',team:'西日本調査班A',completedAt:now,
            scope:{prefectureCodes:['33','37','39','40','43','46'],municipalityCount:226,service:'schoolMeals'},
            method:{initialPriorityCandidateCount:64,refinedPriorityCandidateCount:50,highRiskOfficialFetchCount:19,manualReviewCount:5,policy:'完全無償、一部助成、就学援助、一般世帯負担、年度、主出典を分離して確認。計画・予算・議事録のみの場合は具体的実施根拠へ差し替える。'},
            result:{statusCorrectionCount:0,factValueCorrectionCount:0,sourceMaintenanceCount:2,factEnrichmentCount:1,retainedHighRiskCount:17,unavailableImplementationOmissionCount:0,unresolvedCount:0},
            sourceMaintenanceCodes:['43511','46208'],dispositions,
            evidence:{initialAudit:'jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json',priorityAudit:'jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json',officialFetchAudit:'jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json',decisionSummary:'jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json',manualList:'jichitai-compare/operations/audits/west-a-school-meals-manual-list-20260725.json',regionalPullRequestNumber:pr},
            status:'regional_clean_ci_pending',blocker:null
          };
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json',JSON.stringify(final,null,2)+'\n');

          for(const p of ['jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json','jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json']){
            const a=read(p);a.finalResolution='jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json';a.unresolvedCount=0;a.status='completed_with_final_resolution';write(p,a);
          }
          NODE
          rm -f jichitai-compare/operations/control/west-a-school-meals-finalize-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-school-meals-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/data/municipalities/43/43511.json \
                  jichitai-compare/data/municipalities/46/46208.json \
                  jichitai-compare/operations/tasks/43511.json \
                  jichitai-compare/operations/tasks/46208.json \
                  jichitai-compare/operations/audits/west-a-school-meals-crosscheck-20260725.json \
                  jichitai-compare/operations/audits/west-a-school-meals-priority-review-20260725.json \
                  jichitai-compare/operations/audits/west-a-school-meals-official-fetch-20260725.json \
                  jichitai-compare/operations/audits/west-a-school-meals-decision-summary-20260725.json \
                  jichitai-compare/operations/audits/west-a-school-meals-manual-list-20260725.json \
                  jichitai-compare/operations/audits/west-a-school-meals-final-resolution-20260725.json \
                  jichitai-compare/operations/control/west-a-school-meals-finalize-trigger-20260725.json \
                  .github/workflows/temporary-west-a-school-meals-finalize.yml
          git diff --cached --check
          git commit -m 'fix: 西日本A学校給食費2件の主出典を現行根拠へ更新'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
