name: HM2 Production Readiness (read-only, no submission)

on:
  push:
    branches: [audit/hm2-quality-20261110, fix/hm2-priority123-regression-20261122]
    paths:
      - 'scripts/hm2_submission_readiness.py'
      - 'apps/sanitary-manager-2/gm4.js'
      - 'health-manager-2/support.html'
      - 'ios/health-manager-2/APP_STORE_METADATA_JA.md'
      - 'ios/health-manager-2/HealthManager2/StoreKitManager.swift'
      - 'ios/health-manager-2/release-questions.json'
      - 'ios/health-manager-2/audit/**'
      - '.github/workflows/hm2-production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check script syntax
        run: python -m py_compile scripts/hm2_submission_readiness.py
      - name: Check unofficial disclosure in app, support and store metadata
        run: |
          node --check apps/sanitary-manager-2/gm4.js
          python - <<'PY'
          from pathlib import Path
          paths = ['apps/sanitary-manager-2/gm4.js', 'health-manager-2/support.html', 'ios/health-manager-2/APP_STORE_METADATA_JA.md']
          for path in paths:
              s = Path(path).read_text(encoding='utf-8')
              assert '公式' in s and ('監修' in s or '専門家' in s), path
              assert ('監修・承認を受けていません' in s or '専門家監修なし' in s or '監修・承認を受けた教材ではありません'), path
          print('PASS HM2_UNOFFICIAL_UNREVIEWED_DISCLOSURE')
          PY
      - name: Audit source reproducibility and submission blockers
        env:
          HM2_REPORT: /tmp/hm2-submission-readiness.json
        run: |
          python scripts/hm2_submission_readiness.py --output "$HM2_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path(os.environ['HM2_REPORT']).read_text(encoding='utf-8'))
          lines=["## HM2 production readiness (read-only)", "",
                 "Submission ready: **"+str(d['submission_ready'])+"**", "",
                 "Technical errors: "+str(d['technical_errors']), "",
                 "Blocking evidence:"]
          lines+=["- "+x for x in d['submission_blockers']]
          lines+=["", "This job does not approve content, weaken release gates, build IPA, or submit to Apple."]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text("\n".join(lines)+"\n",encoding='utf-8')
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hm2-production-readiness-report
          path: /tmp/hm2-submission-readiness.json
          if-no-files-found: warn
          retention-days: 14
