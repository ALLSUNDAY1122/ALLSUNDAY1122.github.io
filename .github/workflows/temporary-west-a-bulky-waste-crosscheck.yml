name: Temporary West A Bulky Waste Crosscheck

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-bulky-waste-crosscheck-trigger-20260725.json

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/west-a-bulky-waste-crosscheck-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Scan 226 municipalities
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs'); const path=require('path');
          const prefs=['33','37','39','40','43','46'];
          const rows=[];
          const categories={
            unavailablePositiveEvidence:[],verifiedMissingMethod:[],verifiedMissingFee:[],staleFiscalYear:[],weakPrimarySource:[],externalPrimarySource:[],summaryMethodMismatch:[],feeExpressionRisk:[],genericCalendarOnly:[]
          };
          const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch{return ''}};
          for(const pref of prefs){
            const dir=`jichitai-compare/data/municipalities/${pref}`;
            for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort()){
              const m=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8')); const s=m.services?.bulkyWaste;
              if(!s)continue;
              const summary=s.summary||''; const details=s.details||{}; const notes=s.notes||[]; const source=s.source||{};
              const corpus=[summary,JSON.stringify(details),JSON.stringify(notes)].join(' ');
              const url=source.url||''; const officialHost=host(m.officialUrl||''); const sourceHost=host(url);
              const methodPattern=/(戸別収集|直接搬入|持ち込み|持込|自己搬入|収集日|ごみステーション|処理施設|清掃センター|環境センター|クリーンセンター|リサイクルセンター|予約|申込|申し込み|処理券|シール)/;
              const positivePattern=/(粗大ごみ|大型ごみ).{0,30}(戸別収集|直接搬入|持ち込み|持込|自己搬入|収集|受付|予約|処理施設|センター)|(?:戸別収集|直接搬入|持ち込み|持込|自己搬入).{0,30}(粗大ごみ|大型ごみ)/;
              const feePattern=/(?:[0-9０-９][0-9０-９,，]*(?:\.[0-9]+)?\s*円|無料|無償|手数料|処理券|シール|10kg|１０kg|10キロ|100kg|1点|一点|品目別|重量制|従量制|有料)/;
              const oldYear=/(202[0-5]|令和[2-7２-７])(?:年度|年)/.test(corpus+url);
              const currentYear=/(2026|令和8|令和８)(?:年度|年)/.test(corpus+url);
              const continuing=/(随時|通年|毎年|毎週|毎月|条例|規則|要綱|現在|引き続き|継続|当分の間|年度を問わず)/.test(corpus);
              const weak=url===(m.officialUrl||'') || /\/index\.(?:html?|php)$/.test(url) || /\/$/.test(url) || !/(gomi|garbage|waste|recycle|kankyo|kankyou|clean|seisou|sodai|sodaigomi|粗大|ごみ|ゴミ|廃棄|環境|清掃|収集|分別)/i.test(url);
              const external=sourceHost&&officialHost&&sourceHost!==officialHost;
              const summaryCollection=/(戸別|収集|ステーション)/.test(summary); const summaryCarry=/(直接搬入|持ち込み|持込|自己搬入)/.test(summary);
              const detailsCollection=/(戸別|収集日|ステーション|予約収集|申込収集)/.test(JSON.stringify(details)); const detailsCarry=/(直接搬入|持ち込み|持込|自己搬入|センターへ搬入)/.test(JSON.stringify(details));
              const methodMismatch=(summaryCollection&&!detailsCollection&&detailsCarry)||(summaryCarry&&!detailsCarry&&detailsCollection);
              const feeRisk=/(無料|無償)/.test(summary)&&/[0-9０-９][0-9０-９,，]*\s*円/.test(JSON.stringify(details)) || /(?:10kg|１０kg|10キロ).{0,12}[0-9０-９]+円/.test(summary)&&/(?:1点|一点|品目別)/.test(JSON.stringify(details));
              const calendarOnly=/(カレンダー|収集日程)/.test(corpus)&&!/(料金|手数料|円|処理券|シール|直接搬入|持ち込み|持込|予約|申込)/.test(corpus);
              const row={code:m.code,prefectureCode:m.prefectureCode,prefecture:m.prefecture,name:m.name,status:s.status,summary,details,notes,sourceUrl:url,checkedAt:source.checkedAt||null,officialUrl:m.officialUrl,officialHost,sourceHost,flags:{methodPresent:methodPattern.test(corpus),feePresent:feePattern.test(corpus),oldYear,currentYear,continuing,weak,external,methodMismatch,feeRisk,calendarOnly}};
              rows.push(row);
              if(s.status==='unavailable'&&positivePattern.test(corpus))categories.unavailablePositiveEvidence.push(row);
              if(s.status==='verified'&&!row.flags.methodPresent)categories.verifiedMissingMethod.push(row);
              if(s.status==='verified'&&!row.flags.feePresent)categories.verifiedMissingFee.push(row);
              if(oldYear&&!currentYear&&!continuing)categories.staleFiscalYear.push(row);
              if(s.status==='verified'&&weak)categories.weakPrimarySource.push(row);
              if(s.status==='verified'&&external)categories.externalPrimarySource.push(row);
              if(s.status==='verified'&&methodMismatch)categories.summaryMethodMismatch.push(row);
              if(s.status==='verified'&&feeRisk)categories.feeExpressionRisk.push(row);
              if(s.status==='verified'&&calendarOnly)categories.genericCalendarOnly.push(row);
            }
          }
          const uniq=arr=>[...new Map(arr.map(x=>[x.code,x])).values()];
          const priority=uniq(Object.values(categories).flat());
          const statusCounts=rows.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});
          const report={schemaVersion:'1.0.0',auditId:'west-a-bulky-waste-crosscheck-20260725',team:'西日本調査班A',generatedAt:new Date().toISOString(),scope:{prefectureCodes:prefs,municipalityCount:rows.length,service:'bulkyWaste'},statusCounts,counts:Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v.length])),priorityCandidateCount:priority.length,priorityCandidates:priority,...categories,status:'initial_crosscheck_completed',unresolvedCount:priority.length};
          fs.writeFileSync('jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({municipalityCount:rows.length,statusCounts,counts:report.counts,priorityCandidateCount:priority.length}));
          NODE
          rm -f jichitai-compare/operations/control/west-a-bulky-waste-crosscheck-trigger-20260725.json
          rm -f .github/workflows/temporary-west-a-bulky-waste-crosscheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json \
                  jichitai-compare/operations/control/west-a-bulky-waste-crosscheck-trigger-20260725.json \
                  .github/workflows/temporary-west-a-bulky-waste-crosscheck.yml
          git diff --cached --check
          git commit -m 'audit: 西日本A粗大ごみ226自治体を横断抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
