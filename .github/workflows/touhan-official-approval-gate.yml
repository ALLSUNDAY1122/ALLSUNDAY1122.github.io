name: Registered Seller Official Approval Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'touroku-hanbaisha-sprint/official-kansai/MANUAL_VISUAL_AUDIT_20261123.json'
      - 'touroku-hanbaisha-sprint/official-kansai/visual-reaudit-results/**'
      - 'touroku-hanbaisha-sprint/official-kansai/build_approved_bank.py'
      - 'touroku-hanbaisha-sprint/official-practice.html'
      - '.github/workflows/touhan-official-approval-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild approved bank in an isolated copy (never write canonical bank)
        shell: bash
        run: |
          set -euo pipefail
          source_dir=touroku-hanbaisha-sprint/official-kansai
          tmp_dir="$(mktemp -d)"
          canonical_sha="$(sha256sum "$source_dir/APPROVED_OFFICIAL_BANK.json" | awk '{print $1}')"
          cp -a "$source_dir" "$tmp_dir/official-kansai"
          python "$tmp_dir/official-kansai/build_approved_bank.py" | tee /tmp/touhan-approval-builder.log
          python - "$source_dir/APPROVED_OFFICIAL_BANK.json" "$tmp_dir/official-kansai/APPROVED_OFFICIAL_BANK.json" <<'PY'
          import json,sys
          from pathlib import Path
          current=json.loads(Path(sys.argv[1]).read_text())
          rebuilt=json.loads(Path(sys.argv[2]).read_text())
          for label,d in (("current",current),("rebuilt",rebuilt)):
              qs=d["questions"]
              ids=[q["id"] for q in qs]
              assert d["count"]==len(qs)==len(d["approvedIds"])==599,(label,d["count"],len(qs),len(d["approvedIds"]))
              assert len(set(ids))==599 and set(ids)==set(d["approvedIds"]),label
              assert {y:sum(q["year"]==y for q in qs) for y in range(2022,2027)}=={2022:120,2023:119,2024:120,2025:120,2026:120},label
              assert "KSAI-2023-090" not in set(ids),label
              assert all(q["verbatimCertified"] is True and q["renderReady"] is True and q["needsVisualReview"] is False and q["audit"]["status"]=="PASS" for q in qs),label
          current_by={q["id"]:q for q in current["questions"]}
          rebuilt_by={q["id"]:q for q in rebuilt["questions"]}
          diffs=[]
          for qid in sorted(current_by):
              if current_by[qid]!=rebuilt_by[qid]:
                  keys=sorted(k for k in set(current_by[qid])|set(rebuilt_by[qid]) if current_by[qid].get(k)!=rebuilt_by[qid].get(k))
                  diffs.append({"id":qid,"fields":keys})
          if diffs:
              print("REBUILD_PAYLOAD_DIFFS",json.dumps(diffs[:60],ensure_ascii=False))
              raise AssertionError(f"isolated rebuild differs in {len(diffs)} question records")
          assert rebuilt["questions"]==current["questions"]
          assert sum(sum(v.get(k,0) for v in rebuilt["byYear"].values()) for k in (
              "auto","geometry","ruby","rubyOrdered","layout","visual","cropImage","rubyFontCluster",
              "visualRubyV2","imageV3","directRubyV3","sourceOrderUnattached","ruby113Auto","manualVisualReaudit"
          ))==599
          print("PASS: isolated builder reproduces all 599 exact approved records; canonical bank is not touched")
          PY
          test "$(sha256sum "$source_dir/APPROVED_OFFICIAL_BANK.json" | awk '{print $1}')" = "$canonical_sha"
      - name: Bank and UI safety gates
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          b=Path('touroku-hanbaisha-sprint/official-kansai')
          bank=json.loads((b/'APPROVED_OFFICIAL_BANK.json').read_text())
          qa=bank['questions']
          assert bank['count']==len(qa)==599
          assert len({q['id'] for q in qa})==599
          assert 'KSAI-2023-090' not in {q['id'] for q in qa}
          assert {y:sum(q['year']==y for q in qa) for y in range(2022,2027)}=={2022:120,2023:119,2024:120,2025:120,2026:120}
          assert all(q['verbatimCertified'] is True and q['renderReady'] is True and q['needsVisualReview'] is False and q['audit']['status']=='PASS' for q in qa)
          assert all(q['officialStatus']=='NORMAL' and len(q['choices']) in (4,5) and 0<=q['answer']<len(q['choices']) for q in qa)
          assert all(q['answer']==q['answerNumberOfficial']-1 and q['sourceIssuer']=='関西広域連合' and q['sourceUrl'].startswith('https://') and q['answerSourceUrl'].startswith('https://') and q['attributionDisplay'] for q in qa)
          text=Path('touroku-hanbaisha-sprint/official-practice.html').read_text()
          assert 'APPROVED_OFFICIAL_BANK.json' in text
          assert 'excludeFromAccuracyDenominator' in text
          assert 'official-practice.html' in Path('touroku-hanbaisha-sprint/app-v07.js').read_text()
          q90=json.loads((b/'QUESTIONS_2023_APP_CANDIDATE.json').read_text())['questions'][89]
          assert q90['id']=='KSAI-2023-090' and q90['answer'] is None and q90['excludeFromAccuracyDenominator']
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          assert len(scripts)==1
          Path('/tmp/touhan-official-practice.js').write_text(scripts[0])
          print('PASS approval/data/source/invalid question gates')
          PY
          node --check /tmp/touhan-official-practice.js
          node --check touroku-hanbaisha-sprint/app-v07.js
      - name: Verify canonical bank was not modified
        run: git diff --exit-code -- touroku-hanbaisha-sprint/official-kansai/APPROVED_OFFICIAL_BANK.json
