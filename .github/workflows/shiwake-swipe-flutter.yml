name: Shiwake Swipe Flutter CI

on:
  pull_request:
    paths:
      - "shiwake-swipe/flutter_app/**"
      - ".github/workflows/shiwake-swipe-flutter.yml"
  push:
    branches: [main]
    paths:
      - "shiwake-swipe/flutter_app/**"
      - ".github/workflows/shiwake-swipe-flutter.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiwake-swipe/flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
