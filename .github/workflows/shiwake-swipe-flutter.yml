name: Shiwake Swipe Flutter CI

on:
  pull_request:
    paths:
      - "shiwake-swipe/flutter_app/**"
      - ".github/workflows/shiwake-swipe-flutter.yml"
  push:
    branches: [main]
    paths:
      - "shiwake-swipe/flutter_app/**"
      - ".github/workflows/shiwake-swipe-flutter.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiwake-swipe/flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test 2>&1 | tee test.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiwake-swipe-ci-logs
          path: |
            shiwake-swipe/flutter_app/analyze.log
            shiwake-swipe/flutter_app/test.log
          if-no-files-found: warn

      - name: Verify outcomes
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
