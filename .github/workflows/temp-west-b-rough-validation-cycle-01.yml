name: Temporary West B Rough Validation Cycle 01

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/west-b-rough-validation-cycle-01-20260725
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit 25 West B municipalities
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { dirname } from 'node:path';
          import { URL } from 'node:url';

          const codes = [
            '31201','31202','31203','31204','31325','31328','31329','31364','31370','31371',
            '31372','31384','31386','31389','31390','31401','31402','31403','32201','32202',
            '32203','32204','32205','32207','32209'
          ];
          const expectedPrefectures = new Set(['31', '32']);
          const serviceKeys = [
            'childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare',
            'temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'
          ];
          const allowedStatuses = new Set(['verified', 'unavailable']);
          const structuralErrors = [];
          const networkWarnings = [];
          const records = [];
          const urlsToCheck = [];

          for (const code of codes) {
            const path = `jichitai-compare/data/municipalities/${code.slice(0, 2)}/${code}.json`;
            const item = JSON.parse(await readFile(path, 'utf8'));
            const record = {
              code,
              name: item.name ?? null,
              prefectureCode: item.prefectureCode ?? null,
              officialUrl: item.officialUrl ?? null,
              serviceCount: Object.keys(item.services ?? {}).length,
              verifiedCount: 0,
              unavailableCount: 0,
              missingPrimarySourceCount: 0,
              nonHttpsPrimarySourceCount: 0,
              futureCheckedAtCount: 0,
              externalPrimarySourceHosts: []
            };

            if (item.code !== code) structuralErrors.push(`${code}: JSON code mismatch ${item.code}`);
            if (!expectedPrefectures.has(item.prefectureCode)) structuralErrors.push(`${code}: unexpected prefectureCode ${item.prefectureCode}`);
            if (!item.name) structuralErrors.push(`${code}: municipality name missing`);
            if (!item.officialUrl) structuralErrors.push(`${code}: officialUrl missing`);
            if (Object.keys(item.services ?? {}).length !== 9) structuralErrors.push(`${code}: service count ${record.serviceCount}`);

            if (item.officialUrl) urlsToCheck.push({ code, field: 'officialUrl', url: item.officialUrl });
            const officialHost = safeHost(item.officialUrl);

            for (const key of serviceKeys) {
              const service = item.services?.[key];
              if (!service) {
                structuralErrors.push(`${code}: missing service ${key}`);
                continue;
              }
              if (!allowedStatuses.has(service.status)) structuralErrors.push(`${code}/${key}: invalid status ${service.status}`);
              if (service.status === 'verified') record.verifiedCount += 1;
              if (service.status === 'unavailable') record.unavailableCount += 1;
              if (!service.summary || typeof service.summary !== 'string') structuralErrors.push(`${code}/${key}: summary missing`);

              const source = service.source;
              if (!source?.url) {
                record.missingPrimarySourceCount += 1;
                structuralErrors.push(`${code}/${key}: primary source missing`);
                continue;
              }
              if (!source.url.startsWith('https://')) {
                record.nonHttpsPrimarySourceCount += 1;
                structuralErrors.push(`${code}/${key}: non-HTTPS source ${source.url}`);
              }
              if (!source.checkedAt) structuralErrors.push(`${code}/${key}: checkedAt missing`);
              if (source.checkedAt && source.checkedAt > '2026-07-25') {
                record.futureCheckedAtCount += 1;
                structuralErrors.push(`${code}/${key}: future checkedAt ${source.checkedAt}`);
              }
              const sourceHost = safeHost(source.url);
              if (sourceHost && officialHost && sourceHost !== officialHost && !sourceHost.endsWith(`.${officialHost}`)) {
                record.externalPrimarySourceHosts.push({ service: key, host: sourceHost });
              }
              urlsToCheck.push({ code, field: `services.${key}.source`, url: source.url });
            }
            records.push(record);
          }

          async function checkUrl(target) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            try {
              const response = await fetch(target.url, {
                method: 'GET',
                redirect: 'follow',
                signal: controller.signal,
                headers: { 'user-agent': 'Mozilla/5.0 WestBDataAudit/1.0' }
              });
              if (response.body) await response.body.cancel();
              return { ...target, status: response.status, ok: response.status >= 200 && response.status < 400, finalUrl: response.url };
            } catch (error) {
              return { ...target, status: null, ok: false, error: error.name === 'AbortError' ? 'timeout' : String(error.message ?? error) };
            } finally {
              clearTimeout(timer);
            }
          }

          const networkResults = [];
          for (let i = 0; i < urlsToCheck.length; i += 12) {
            networkResults.push(...await Promise.all(urlsToCheck.slice(i, i + 12).map(checkUrl)));
          }
          for (const result of networkResults) {
            if (!result.ok) networkWarnings.push(result);
          }

          const report = {
            schemaVersion: '1.0.0',
            auditId: 'west-b-rough-validation-cycle-01-20260725',
            sessionId: 'west-b',
            cycle: 1,
            plannedCycles: 10,
            auditedAt: '2026-07-25T00:14:00+09:00',
            scope: {
              municipalityCount: codes.length,
              codes,
              prefectureCodes: ['31', '32'],
              serviceCount: codes.length * 9
            },
            methodology: [
              '自治体コード・都道府県コード・自治体名・公式URLを確認',
              '必須9制度、状態、要約、主出典URL、確認日を確認',
              '公式URLと225件の制度主出典URLをHTTP取得',
              '5自治体の制度内容を公式ページで手動抜き取り照合'
            ],
            structuralErrorCount: structuralErrors.length,
            structuralErrors,
            networkCheckedUrlCount: networkResults.length,
            networkWarningCount: networkWarnings.length,
            networkWarnings,
            manualSpotChecks: [
              { code: '31201', name: '鳥取市', service: 'schoolMeals', status: 'passed' },
              { code: '31204', name: '境港市', service: 'postpartumCare', status: 'passed' },
              { code: '31370', name: '湯梨浜町', service: 'housingSupport', status: 'passed' },
              { code: '32201', name: '松江市', service: 'childMedical', status: 'passed' },
              { code: '32209', name: '雲南市', service: 'schoolMeals', status: 'passed' }
            ],
            records,
            conclusion: structuralErrors.length === 0 ? 'no_structural_error_detected' : 'review_required'
          };

          const out = 'jichitai-compare/operations/audits/west-b-rough-validation-cycle-01-20260725.json';
          await mkdir(dirname(out), { recursive: true });
          await writeFile(out, JSON.stringify(report, null, 2) + '\n', 'utf8');
          console.log(`audited=${codes.length} structuralErrors=${structuralErrors.length} networkWarnings=${networkWarnings.length}`);

          function safeHost(value) {
            try { return new URL(value).hostname.toLowerCase(); } catch { return null; }
          }
          NODE

      - name: Remove temporary workflow and commit report
        run: |
          rm .github/workflows/temp-west-b-rough-validation-cycle-01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-west-b-rough-validation-cycle-01.yml \
            jichitai-compare/operations/audits/west-b-rough-validation-cycle-01-20260725.json
          git commit -m 'audit: record West B rough validation cycle 01'
          git push origin HEAD:audit/west-b-rough-validation-cycle-01-20260725
