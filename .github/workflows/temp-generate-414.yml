name: Temporary Generate 414

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-generate-414.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-414-20260722-1450
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public data
        run: |
          set -euxo pipefail
          cd jichitai-compare
          node ./scripts/generate-municipalities.mjs
          node ./scripts/update-progress.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '394自治体' not in s:
              raise SystemExit('394自治体 display not found')
          s=s.replace('394自治体','414自治体')
          p.write_text(s,encoding='utf-8')
          PY
          node ./scripts/validate-data.mjs --require-generated
          test "$(node -e "const d=require('./operations/progress.json'); process.stdout.write(String(d.registeredMunicipalities))")" = 414
          cd ..
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            jichitai-compare/data/generated/municipalities.json \
            jichitai-compare/index.html \
            jichitai-compare/operations/progress.json | sort)
          test "$changed" = "$expected"
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データと表示件数を414自治体へ同期'
          git push origin coord/generated-414-20260722-1450
