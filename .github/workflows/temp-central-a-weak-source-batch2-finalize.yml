name: Temporary Central A Weak Source Batch 2 Finalize

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch2-finalize-trigger-20260726.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/central-a-weak-source-batch2-final-region-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- jichitai-compare/operations/audits/central-a-weak-primary-source-batch2-public-verification-20260726.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const updatedAt='2026-07-26T21:46:00+09:00';
          const regionalPr=3990;
          const regionalRun=30202437596;
          const nationalPr=3996;
          const nationalRun=30202545526;
          const publicPr=3998;
          const publicRun=30202644176;
          const finalRegionPr=Number(process.env.PR_NUMBER);
          const finalRegionRun=Number(process.env.RUN_ID);

          const decisionPath=path.join(root,'operations/audits/central-a-weak-primary-source-batch2-decisions-20260726.json');
          const decision=JSON.parse(fs.readFileSync(decisionPath,'utf8'));
          Object.assign(decision,{status:'completed_public_verified_region_integrated',nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun,completedAt:updatedAt,blocker:null});
          fs.writeFileSync(decisionPath,JSON.stringify(decision,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.status='completed';
          checkpoint.pullRequestNumber=finalRegionPr;
          checkpoint.ciStatus='success';
          checkpoint.nextAction='弱い主出典残23件を、制度に直接対応する利用者向け公式ページへ更新する。専用ページがない場合は要綱と利用者向け導線を併記する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          const q=checkpoint.qualityReaudit;
          q.latestCompletedAt=updatedAt;
          q.latestRegionalPullRequestNumber=regionalPr;
          q.latestCiRunNumber=regionalRun;
          q.latestNationalPullRequestNumber=nationalPr;
          q.latestPublicVerificationPullRequestNumber=publicPr;
          q.correctedMunicipalitiesRechecked=Math.max(Number(q.correctedMunicipalitiesRechecked??0),241);
          q.primarySourceSlotsRechecked=Math.max(Number(q.primarySourceSlotsRechecked??0),673);
          q.candidateCounts.weakPrimarySource=23;
          q.latestWeakSourceBatch={batch:2,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:1,contentCorrectionCount:1,remainingCandidates:23,regionalPullRequestNumber:regionalPr,regionalWorkflowRunId:regionalRun,nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun,blocker:null};
          checkpoint.lastAction='弱い主出典第2群5制度を地域・全国・公開で一致確認し、候補を28件から23件へ減らした。稲沢市学校給食は令和8年度完全無償化へ訂正した。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAWeakSourceBatch=q.latestWeakSourceBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const publicAudit=JSON.parse(fs.readFileSync(path.join(root,'operations/audits/central-a-weak-primary-source-batch2-public-verification-20260726.json'),'utf8'));
          const resolution={schemaVersion:'1.0.0',resolutionId:'central-a-weak-source-batch2-resolution-20260726',session:'中日本調査班A',completedAt:updatedAt,status:'completed_public_verified_region_integrated',reviewedMunicipalityCount:5,reviewedServiceCount:5,confirmedSourceUpgradeCount:2,authoritativeSourceRetainedWithNavigationCount:2,directUserPageMaintainedCount:1,contentCorrectionCount:1,remainingWeakPrimarySourceCandidates:23,correctedMunicipalitiesRechecked:241,primarySourceSlotsRechecked:673,issue3141UnresolvedItemCount:19,publishedMunicipalityCount:publicAudit.publishedMunicipalityCount,publishedServiceCount:publicAudit.publishedServiceCount,evidence:{regionalPullRequestNumber:regionalPr,regionalWorkflowRunId:regionalRun,nationalPullRequestNumber:nationalPr,nationalWorkflowRunId:nationalRun,publicVerificationPullRequestNumber:publicPr,publicVerificationWorkflowRunId:publicRun,finalRegionPullRequestNumber:finalRegionPr,finalRegionWorkflowRunId:finalRegionRun},publicVerification:{status:publicAudit.status,pageCount:publicAudit.pageChecks.length,serviceCount:publicAudit.serviceChecks.length,attempt:publicAudit.attempt},temporaryRunnerCleanup:{regional:true,main:false},blocker:null};
          fs.writeFileSync(path.join(root,'operations/quality/central-a-weak-source-batch2-resolution-20260726.json'),JSON.stringify(resolution,null,2)+'\n');

          const recoveryPath=path.join(root,'operations/audits/central-a-weak-primary-source-recovery-20260726.json');
          const recovery=JSON.parse(fs.readFileSync(recoveryPath,'utf8'));
          recovery.status='active_queue_batch2_completed_public_verified';
          recovery.lastCompletedBatch=2;
          recovery.lastCompletedAt=updatedAt;
          recovery.queueCount=Array.isArray(recovery.queue)?recovery.queue.length:23;
          recovery.nextBatch=Array.isArray(recovery.queue)?recovery.queue.slice(0,5):[];
          fs.writeFileSync(recoveryPath,JSON.stringify(recovery,null,2)+'\n');
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch2-finalize-trigger-20260726.json
          rm -f .github/workflows/temp-central-a-weak-source-batch2.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch2-diagnose.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch2-workflow-fix.yml
          rm -f .github/workflows/temp-central-a-weak-source-batch2-finalize.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run check
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A弱い主出典第2群を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
