name: Shoshi Codemagic Provenance Repair
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.issue.title == '[SHOSHI] Repair Codemagic Provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fail-closed provenance patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml')
          s=p.read_text()
          old_branch='feature/shoshi-ios-native-storekit'
          old_sha='37c006838463df56e9fd84b22d250005856cfff3'
          new_sha='8c817e19b5ee0a158bbaf75e73a5d13e81299d0e'
          assert s.count(old_branch) == 1, f'expected one old branch pin, found {s.count(old_branch)}'
          assert s.count(old_sha) == 1, f'expected one old SHA pin, found {s.count(old_sha)}'
          s=s.replace(old_branch,'main',1).replace(old_sha,new_sha,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- codemagic.yaml
      - name: Commit provenance repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codemagic.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(shoshi): pin Codemagic release source to audited main'
          git push origin HEAD:main
