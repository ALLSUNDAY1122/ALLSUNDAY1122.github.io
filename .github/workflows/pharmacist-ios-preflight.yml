name: Pharmacist Native iOS Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pharmacist-ios-preflight.yml'
      - 'pharmacist-manabi-sprint/tools/assemble_product_bank.py'
      - 'pharmacist-manabi-sprint/tools/build_web_bundle.py'
      - 'pharmacist-manabi-sprint/ios/**'
      - 'pharmacist-manabi-sprint/metadata/**'
      - 'pharmacist-manabi-sprint/support.html'
      - 'pharmacist-manabi-sprint/privacy.html'
      - 'pharmacist-manabi-sprint/terms.html'
      - 'pharmacist-manabi-sprint/scripts/validate_release.py'
      - 'pharmacist-manabi-sprint/content/product/questions.json'
      - 'pharmacist-manabi-sprint/content/product/final-audit-v2.json'
      - 'codemagic.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pharmacist-ios-preflight.yml'
      - 'pharmacist-manabi-sprint/**'
      - 'codemagic.yaml'
permissions:
  contents: write
concurrency:
  group: pharmacist-native-ios-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    # macos-14 GitHub-hosted runner was retired 2026-11-02.
    # macos-15 carries Xcode 16.x for backward-compatibility regression testing.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 toolchain
        shell: bash
        run: |
          set -euo pipefail
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' -print | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,".");print a[1]}')"
          test "$MAJOR" = "16"

      - name: Assemble corrected official question bank and Web bundle
        run: |
          set -euo pipefail
          python3 pharmacist-manabi-sprint/tools/assemble_product_bank.py
          python3 pharmacist-manabi-sprint/tools/build_web_bundle.py
          python3 - <<'PY'
          import json,re
          p='pharmacist-manabi-sprint/content/product/questions.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('questionCount') == 1035
          qs={q['id']:q for q in d['questions']}
          for qid in ('P111-220','P111-221'):
              stem=qs[qid].get('sharedStem') or ''
              assert 'デュロキセチン塩酸塩カプセル 20 mg 1 回 1 カプセル （ 1 日 2 カプセル）' in stem, (qid,stem)
              assert not re.search(r'デュロキセチン塩酸塩カプセル\s+20\s+mg\s+1\s+回\s+1\s+錠',stem), qid
          print('PASS: official correction is present in both product records')
          PY
          # Final Product Bank owns generated bank publication; preflight stays local.

      - name: Static no-IAP release audit
        run: python3 pharmacist-manabi-sprint/scripts/validate_release.py

      - name: Shell and Python syntax
        run: |
          bash -n pharmacist-manabi-sprint/ios/prepare-ios.sh
          python3 -m py_compile pharmacist-manabi-sprint/scripts/validate_release.py

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Prepare audited native resources
        env:
          PREFLIGHT_PLACEHOLDER_ICON: '1'
        run: bash pharmacist-manabi-sprint/ios/prepare-ios.sh

      - name: Verify generated native question bundle
        run: |
          python3 - <<'PY'
          import json
          p='pharmacist-manabi-sprint/ios/Generated/questions.native.json'
          d=json.load(open(p,encoding='utf-8'))
          q=d['questions']; active=[x for x in q if x['scoringStatus']!='excluded']
          flex=[x for x in q if x['scoringStatus']=='multiple_accepted']
          media=[x for x in q if x['displayMode']=='officialQuestionImage']
          assert len(q)==1035 and len(active)==1031 and len(flex)==4 and len(media)==169
          assert all(x['memoryPoint'] and x['explanation'] for x in q)
          print('PASS native resource:',len(q),'active',len(active),'flex',len(flex),'media',len(media))
          PY

      - name: Generate Xcode project and enforce no IAP capability
        run: |
          cd pharmacist-manabi-sprint/ios
          xcodegen generate
          ! grep -q 'com.apple.InAppPurchase' PharmacistSprint.xcodeproj/project.pbxproj
          ! grep -R -q 'import StoreKit\|StoreKitManager\|PaywallView\|WKWebView\|import WebKit' --include='*.swift' .
          grep -q 'PharmacistSprintUITests' PharmacistSprint.xcodeproj/project.pbxproj

      - name: Native unit + UI Visual Gate
        id: tests
        shell: bash
        run: |
          set +e
          UDID=$(python3 - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for devices in d['devices'].values():
              for x in devices:
                  if x.get('isAvailable') and x.get('name','').startswith('iPhone'):
                      print(x['udid']); raise SystemExit
          raise SystemExit(2)
          PY
          )
          echo "simulator_udid=$UDID" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/PharmacistVisualGate.xcresult /tmp/pharmacist-visual-png
          xcodebuild test \
            -project pharmacist-manabi-sprint/ios/PharmacistSprint.xcodeproj \
            -scheme PharmacistSprint \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath /tmp/PharmacistVisualGate.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > /tmp/pharmacist-tests.log 2>&1
          code=$?
          set -e
          tail -n 200 /tmp/pharmacist-tests.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Export native Visual Gate screenshots
        id: visual_png
        if: always() && steps.tests.outputs.exit_code != ''
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pharmacist-visual-png
          if [ -d /tmp/PharmacistVisualGate.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path /tmp/PharmacistVisualGate.xcresult \
              --output-path /tmp/pharmacist-visual-png \
              > /tmp/pharmacist-visual-export.log 2>&1
          fi
          count=$(find /tmp/pharmacist-visual-png -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Exported visual images: $count"
          find /tmp/pharmacist-visual-png -type f -maxdepth 4 -print || true
          if command -v sips >/dev/null 2>&1; then
            find /tmp/pharmacist-visual-png -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' f; do
              echo "--- $f"
              sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null || true
            done
          fi
          # The UI contract explicitly captures seven key states. Fewer than seven
          # exported images means visual evidence is incomplete even if XCTest exits 0.
          test "$count" -ge 7

      - name: Upload native Visual Gate evidence
        if: always() && steps.tests.outputs.exit_code != ''
        uses: actions/upload-artifact@v6
        with:
          name: pharmacist-native-visual-gate
          path: |
            /tmp/PharmacistVisualGate.xcresult
            /tmp/pharmacist-tests.log
            /tmp/pharmacist-visual-png
            /tmp/pharmacist-visual-export.log
          if-no-files-found: error
          retention-days: 14

      - name: Release simulator build
        id: build
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project pharmacist-manabi-sprint/ios/PharmacistSprint.xcodeproj \
            -scheme PharmacistSprint \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/pharmacist-release.log 2>&1
          code=$?
          set -e
          tail -n 160 /tmp/pharmacist-release.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Verify Release app resources
        id: resources
        shell: bash
        run: |
          set +e
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/PharmacistSprint.app' -type d | head -1)
          echo "APP=$APP"
          test -n "$APP" \
            && test -f "$APP/questions.native.json" \
            && test -f "$APP/PrivacyInfo.xcprivacy" \
            && test -f "$APP/Assets.car"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Write durable native preflight report
        if: always()
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          RESOURCE_EXIT: ${{ steps.resources.outputs.exit_code }}
          VISUAL_COUNT: ${{ steps.visual_png.outputs.count }}
        run: |
          python3 - <<'PY'
          import json,os
          t=int(os.environ.get('TEST_EXIT') or 999)
          b=int(os.environ.get('BUILD_EXIT') or 999)
          r=int(os.environ.get('RESOURCE_EXIT') or 999)
          vc=int(os.environ.get('VISUAL_COUNT') or 0)
          out={
            'pass': t==0 and b==0 and r==0 and vc>=7,
            'architecture':'SwiftUI-native',
            'monetization':'none',
            'allScoredQuestionsUnlocked':True,
            'webViewRuntime':False,
            'unitAndVisualGateExit':t,
            'releaseBuildExit':b,
            'resourceAuditExit':r,
            'visualScreenshotCount':vc,
            'visualEvidenceArtifact':'pharmacist-native-visual-gate',
            'bundleId':'jp.allsunday1122.yakuzaishi',
            'appStoreConnectAppId':'6799753724',
            'version':'1.0.0',
            'questionBank':1035,
            'activeQuestions':1031,
            'note':'No IAP. All 1,031 scored questions are available without purchase.'
          }
          open('/tmp/pharmacist-ios-preflight-report.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git reset --hard HEAD
            cp /tmp/pharmacist-ios-preflight-report.json pharmacist-manabi-sprint/content/product/ios-preflight-report.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pharmacist-manabi-sprint/content/product/ios-preflight-report.json
            if ! git diff --cached --quiet; then
              git commit -m 'pharmacist: native visual preflight result [skip ci]'
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Enforce native Preflight + Visual Gate
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = '0'
          test "${{ steps.build.outputs.exit_code }}" = '0'
          test "${{ steps.resources.outputs.exit_code }}" = '0'
          test "${{ steps.visual_png.outputs.count }}" -ge 7

