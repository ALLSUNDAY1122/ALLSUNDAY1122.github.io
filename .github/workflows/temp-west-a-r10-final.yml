name: Temporary West-A round 10 finalization

on:
  push:
    branches:
      - 'audit/west-a-research-verification-r10-final-20260725'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[west-a-r10-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize West-A verification audit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'jichitai-compare';
          const read = p => JSON.parse(fs.readFileSync(`${root}/${p}`, 'utf8'));
          const write = (p, value) => fs.writeFileSync(`${root}/${p}`, JSON.stringify(value, null, 2) + '\n');
          const stamp = '2026-07-25T02:19:00+09:00';

          const auditPath = 'operations/audits/west-a-research-verification-20260725.json';
          const audit = read(auditPath);
          audit.status = 'completed';
          audit.updatedAt = stamp;
          audit.completedRoundCount = 10;
          const round10 = audit.rounds.find(r => r.round === 10);
          Object.assign(round10, {
            status: 'completed',
            method: '発見3件を公式情報で再検証し、地域CI・全国公開反映・生成JSON・静的ページ・task件数の整合性を確認して最終集計',
            findingsReverified: [
              {
                code: '46218',
                name: '霧島市',
                service: 'sickChildCare',
                result: 'resolved',
                evidence: '公式ページで7施設、1日1,200円、半日600円、生活保護世帯無料を再確認',
                regionalPullRequestNumber: 2960,
                regionalCiRunNumber: 7133,
                nationalPullRequestNumber: 2986,
                nationalCiRunNumber: 7223
              },
              {
                code: '40448',
                name: '東峰村',
                service: 'childMedical',
                result: 'resolved',
                evidence: '現行条例で18歳年度末まで、保険診療自己負担相当額の支給、医療証による現物給付を再確認',
                regionalPullRequestNumber: 3021,
                regionalCiRunNumber: 7346
              },
              {
                code: '46530',
                name: '徳之島町',
                service: 'childMedical',
                result: 'resolved',
                evidence: '町広報で課税世帯は未就学児、非課税世帯は18歳年度末まで、2025年4月受診分から窓口負担無料を再確認',
                regionalPullRequestNumber: 3021,
                regionalCiRunNumber: 7346
              }
            ],
            structuralAuditMunicipalityCount: 226,
            structuralAuditServiceCount: 2034,
            directOfficialRecheckCount: 64,
            unavailableInventoryMunicipalityCount: 75,
            unavailableInventoryServiceCount: 189,
            materialErrorCount: 3,
            correctionAppliedCount: 3,
            unresolvedErrorCount: 0,
            result: 'completed_with_corrections',
            limitation: '担当226自治体・2,034制度の構造と生成整合性は全件検証したが、全制度本文を1件ずつ公式ページで再読したものではない。直接公式再照合は高変動・高リスク項目を中心とする64項目。'
          });
          audit.summary.materialErrorCount = 3;
          audit.summary.correctionAppliedCount = 3;
          audit.summary.correctionRequiredCount = 0;
          audit.summary.roundsRemaining = 0;
          audit.summary.currentAssessment = '10回監査を完了。重大誤り3件を検出し全件修正済み。未修正0件。構造監査は226自治体・2,034制度、直接公式再照合は64項目。';
          audit.nextAction = '通常の完了後監査へ戻り、公式情報更新、CI異常、公開文言異常が発生した場合のみ再調査する。';
          write(auditPath, audit);

          const checkpointPath = 'operations/control/session-checkpoints/west-a.json';
          const checkpoint = read(checkpointPath);
          checkpoint.updatedAt = stamp;
          checkpoint.nextAction = '10回の誤調査検証は完了。通常の完了後監査へ戻り、公式情報更新、CI異常、公開文言異常が発生した場合のみ再調査する。';
          checkpoint.researchVerificationAudit.completedRoundCount = 10;
          checkpoint.researchVerificationAudit.lastCompletedRound = 10;
          checkpoint.researchVerificationAudit.nextRound = null;
          checkpoint.researchVerificationAudit.status = 'completed';
          checkpoint.researchVerificationAudit.materialErrorCount = 3;
          checkpoint.researchVerificationAudit.correctionAppliedCount = 3;
          checkpoint.researchVerificationAudit.correctionRequiredCount = 0;
          checkpoint.researchVerificationAudit.lastAuditedAt = stamp;
          checkpoint.researchVerificationAudit.directOfficialRecheckCount = 64;
          checkpoint.researchVerificationAudit.finalAssessment = 'completed_with_corrections';
          checkpoint.integrityAudit.auditedAt = stamp;
          checkpoint.integrityAudit.notes = [...(checkpoint.integrityAudit.notes || []), '10回の誤調査検証を完了。重大誤り3件を全件修正し、未修正0件。全2,034制度の構造監査と高リスク64項目の公式再照合を実施。'];
          write(checkpointPath, checkpoint);
          NODE
      - name: Commit final audit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/west-a-research-verification-20260725.json jichitai-compare/operations/control/session-checkpoints/west-a.json
          git commit -m '[west-a-r10-final] audit: complete ten-round research verification'
          git push
