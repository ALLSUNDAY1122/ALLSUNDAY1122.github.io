name: Temporary West B Anyone Corrections

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-anyone-corrections-trigger-20260725.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ops/run-west-b-anyone-corrections-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply confirmed corrections on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main audit/west-b-anyone-crosscheck-20260725
          git switch -C fix/west-b-anyone-confirmed-20260725 origin/main
          audit_paths=(
            jichitai-compare/operations/audits/west-b-anyone-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-b-anyone-priority-review-20260725.json
            jichitai-compare/operations/audits/west-b-anyone-status-focus-review-20260725.json
            jichitai-compare/operations/audits/west-b-anyone-official-policy-review-20260725.json
          )
          for audit_path in "${audit_paths[@]}"; do
            mkdir -p "$(dirname "$audit_path")"
            git show "origin/audit/west-b-anyone-crosscheck-20260725:$audit_path" > "$audit_path"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T15:45:00+09:00';
          const codes = ['36405', '42383', '45403', '45441'];
          const configs = {
            '36405': {
              prefectureCode: '36',
              municipalitySummary: '必須9制度を上板町公式情報で調査。8制度をverified、現行の詳細を確認できない産後ケアをunavailableとして登録。',
              serviceSummary: '2026年5月から上板町立さくら保育所でこども誰でも通園制度を実施',
              eligibility: null,
              details: {
                facility: '上板町立さくら保育所',
                publishedStatus: '2026年5月15日付の町公式案内で実施を確認',
                localConditions: '対象月齢、月利用枠、料金、申込方法は町公式案内またはさくら保育所へ確認',
                noInference: '地域条件を全国標準から推測しない'
              },
              note: 'こども誰でも通園制度は2026年5月の町公式案内で実施を確認しverifiedへ訂正。地域別条件は要確認。'
            },
            '42383': {
              prefectureCode: '42',
              municipalitySummary: '必須9制度を小値賀町公式情報で調査。7制度をverified、現行利用条件を公式ページで確定できない病児・病後児保育と産後ケアをunavailableとして登録。',
              serviceSummary: '小値賀こども園で一時保育を実施。対象年齢・時間・料金は更新中のため要問い合わせ',
              eligibility: null,
              details: {
                facility: '小値賀こども園',
                currentStatus: '町公式の現行施設情報で一時保育ありと掲載',
                localConditions: '対象年齢、利用時間、料金等は現在更新中のため小値賀こども園または福祉事務所へ確認'
              },
              note: '小値賀こども園の現行施設情報で一時保育実施を確認しverifiedへ訂正。条件は更新中。'
            },
            '45403': {
              prefectureCode: '45',
              municipalitySummary: '必須9制度を西米良村・宮崎県の公式情報で調査。6制度をverified、現行条件を公式公開情報で確定できない病児・病後児保育、保育料、学校給食費をunavailableとして登録。',
              serviceSummary: '村公式の現行子育て一覧でこども誰でも通園制度の実施案内を公開',
              eligibility: null,
              details: {
                publishedStatus: '村公式子育て一覧に「こども誰でも通園制度（乳児等通園支援事業）について」を掲載',
                localConditions: '対象月齢、月利用枠、利用料金、実施施設、予約方法は個別案内または福祉健康課へ確認',
                noInference: '地域条件を全国標準から推測しない'
              },
              note: '村公式の現行子育て一覧でこども誰でも通園制度の実施案内を確認しverifiedへ訂正。'
            },
            '45441': {
              prefectureCode: '45',
              municipalitySummary: '必須9制度を高千穂町公式情報で調査。8制度をverified、学校給食費は2026年度の最終保護者負担額を公式公開情報で確定できないためunavailableとして登録。',
              serviceSummary: '2026年4月からこども誰でも通園制度を開始。施設別条件は町窓口へ確認',
              eligibility: { minAgeMonths: 6, maxAgeYears: 2 },
              details: {
                publishedStatus: '2026年4月から保護者の就労状況に関係なく月一定時間保育園等を利用できる制度を開始',
                generalTarget: '保育所等に通っていない生後6か月から満3歳未満児',
                localConditions: '実施施設、月利用枠、利用料、実施日、認定・予約方法は福祉保険課へ確認',
                noInference: '全国標準の月10時間・料金を町の確定条件として転記しない'
              },
              note: '町公式ページで2026年4月のこども誰でも通園制度開始を確認しverifiedへ訂正。'
            }
          };

          for (const code of codes) {
            const config = configs[code];
            const municipalityPath = path.join(root, 'data/municipalities', config.prefectureCode, `${code}.json`);
            const municipality = JSON.parse(fs.readFileSync(municipalityPath, 'utf8'));
            const service = municipality.services.temporaryChildcare;
            service.status = 'verified';
            service.summary = config.serviceSummary;
            if (config.eligibility === null) delete service.eligibility;
            else service.eligibility = config.eligibility;
            service.details = config.details;
            service.source.checkedAt = checkedAt;
            municipality.summary = config.municipalitySummary;
            municipality.updatedAt = checkedAt;
            fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');

            const taskPath = path.join(root, 'operations/tasks', `${code}.json`);
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            const statuses = Object.values(municipality.services).map((item) => item.status);
            task.verifiedCount = statuses.filter((status) => status === 'verified').length;
            task.researchingCount = statuses.filter((status) => status === 'researching').length;
            task.unavailableCount = statuses.filter((status) => status === 'unavailable').length;
            task.needsMediumReviewCount = statuses.filter((status) => status === 'needs_medium_review').length;
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班B';
            task.notes = (task.notes ?? []).filter((note) => !/誰でも通園制度.*unavailable|一時保育.*unavailable|こども誰でも通園制度は現行詳細を確認できない/.test(note));
            if (!task.notes.includes(config.note)) task.notes.push(config.note);
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          }

          const auditUpdates = [
            ['west-b-anyone-crosscheck-20260725.json', 'official_review_completed_corrections_applied_pending_ci'],
            ['west-b-anyone-priority-review-20260725.json', 'official_review_completed_corrections_applied_pending_ci'],
            ['west-b-anyone-status-focus-review-20260725.json', 'official_review_completed_corrections_applied_pending_ci'],
            ['west-b-anyone-official-policy-review-20260725.json', 'corrections_applied_pending_ci']
          ];
          for (const [fileName, status] of auditUpdates) {
            const auditPath = path.join(root, 'operations/audits', fileName);
            const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
            audit.result = {
              ...(audit.result ?? {}),
              status,
              confirmedCorrectionCount: 4,
              correctedCount: 4,
              confirmedCorrectionCodes: codes,
              unresolvedConfirmedErrorCount: 0
            };
            fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          }

          const checkpointPath = path.join(root, 'operations/control/session-checkpoints/west-b.json');
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.updatedAt = updatedAt;
          checkpoint.anyoneCrosscheck = {
            auditId: 'west-b-anyone-crosscheck-20260725',
            priorityReviewId: 'west-b-anyone-priority-review-20260725',
            statusFocusReviewId: 'west-b-anyone-status-focus-review-20260725',
            officialReviewId: 'west-b-anyone-official-policy-review-20260725',
            auditedMunicipalityCount: 250,
            mechanicalCandidateCount: 232,
            priorityCandidateCount: 77,
            statusFocusCandidateCount: 43,
            confirmedCorrectionCount: 4,
            correctedCount: 4,
            municipalityCodes: codes,
            status: 'corrections_applied_pending_ci',
            unresolvedConfirmedErrorCount: 0,
            judgment: '全国給付化だけでは地域の利用可能性を断定せず、2026年度の自治体公式案内または現行施設情報を確認できた4件のみ訂正'
          };
          fs.writeFileSync(checkpointPath, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: npm run check
      - name: Commit and push correction branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare
          git commit -m 'fix: 西日本B誰でも通園制度4件を訂正'
          git push --force origin HEAD:fix/west-b-anyone-confirmed-20260725
