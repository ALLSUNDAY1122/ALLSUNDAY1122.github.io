name: Temporary West A Bulky Waste Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-a-bulky-main-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/west-a-bulky-source-main-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset to latest main and import regional evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main region/west
          git reset --hard origin/main
          files=(
            jichitai-compare/data/municipalities/39/39424.json
            jichitai-compare/data/municipalities/40/40421.json
            jichitai-compare/data/municipalities/43/43208.json
            jichitai-compare/operations/tasks/39424.json
            jichitai-compare/operations/tasks/40421.json
            jichitai-compare/operations/tasks/43208.json
            jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json
            jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json
            jichitai-compare/operations/audits/west-a-bulky-waste-review-preparation-20260725.json
            jichitai-compare/operations/audits/west-a-bulky-waste-official-source-review-20260725.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/region/west:$file" > "$file"
          done
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/39/39424.json|jichitai-compare/data/municipalities/40/40421.json|jichitai-compare/data/municipalities/43/43208.json|jichitai-compare/operations/tasks/39424.json|jichitai-compare/operations/tasks/40421.json|jichitai-compare/operations/tasks/43208.json|jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json|jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json|jichitai-compare/operations/audits/west-a-bulky-waste-review-preparation-20260725.json|jichitai-compare/operations/audits/west-a-bulky-waste-official-source-review-20260725.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/39424/index.html|jichitai-compare/municipality/40421/index.html|jichitai-compare/municipality/43208/index.html) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
      - name: Commit national sync
        shell: bash
        run: |
          set -euo pipefail
          trigger=jichitai-compare/operations/control/west-a-bulky-main-trigger-20260725.json
          rm -f "$trigger"
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'sync: 西日本A粗大ごみ出典保守を全国反映'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
