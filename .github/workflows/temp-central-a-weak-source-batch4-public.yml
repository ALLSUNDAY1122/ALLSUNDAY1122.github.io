name: Temporary Central A Weak Source Batch 4 Public Verify

on:
  pull_request:
    branches: [main]
    paths:
      - jichitai-compare/operations/control/central-a-weak-source-batch4-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-weak-source-batch4-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://allsunday1122.github.io/jichitai-compare';
          const pages=[
            {code:'25207',name:'守山市'},
            {code:'25210',name:'野洲市'},
            {code:'25425',name:'愛荘町'},
            {code:'25442',name:'甲良町'}
          ];
          const expected=[
            {code:'25207',name:'守山市',service:'schoolMeals',source:'https://www.city.moriyama.lg.jp/shichoushitsu/shiseihoushin/1014271/1014395.html',additional:['https://www.city.moriyama.lg.jp/kosodatekyouiku/gakkoukyouiku/1002268/1002397.html','https://www2.city.moriyama.lg.jp/reiki_int/reiki_honbun/i400RG00002497.html','https://www.city.moriyama.lg.jp/kosodatekyouiku/gakkoukyouiku/1002268/1002399.html'],summary:'令和8年度は市立小学校の学校給食費を実質無償化し、市立中学校は月額4,900円を据え置く。'},
            {code:'25210',name:'野洲市',service:'schoolMeals',source:'https://www.city.yasu.lg.jp/section/reiki_int/reiki_honbun/r042RG00001018.html',additional:['https://www.city.yasu.lg.jp/soshiki/kyushoku/kondate/reiwa8nenndo/index.html'],summary:'市立小中学校の学校給食費は、小学校月4,200円、中学校月4,900円を基本額とする。'},
            {code:'25425',name:'愛荘町',service:'schoolMeals',source:'https://www.town.aisho.shiga.jp/material/files/group/2/2026032306.pdf',additional:['https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001218.html','https://www.town.aisho.shiga.jp/kosodate/kyushoku/gaiyou/1668.html','https://www.town.aisho.shiga.jp/school/05_echisyou/topics/reiwa/index.html','https://www.town.aisho.shiga.jp/soshiki/kyoiku/1/1/tetuduki/932.html'],summary:'令和8年度以降は小学校給食費を無償化し、中学校は月額4,400円の保護者負担を維持する。'},
            {code:'25425',name:'愛荘町',service:'postpartumCare',source:'https://www.town.aisho.shiga.jp/section/reiki_honbun/r304RG00001467.html',additional:['https://www.town.aisho.shiga.jp/soshiki/kenko/2/1/4423.html'],summary:'出産後1年以内の母子へ、短期入所・通所・居宅訪問型の産後ケアを通算7日まで提供する。'},
            {code:'25442',name:'甲良町',service:'schoolMeals',source:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001075.html',additional:['https://www.kouratown.jp/cyonososhiki/somuka/zaiseikakari/zaisei/1385622361935.html'],summary:'町立小中学校の学校給食費は令和10年3月まで徴収しない。'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastError;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`?v=${Date.now()}`;
              const pageChecks=[];
              for(const item of pages){
                const response=await fetch(`${base}/municipality/${item.code}/${stamp}`,{redirect:'follow'});
                if(!response.ok)throw new Error(`${item.code} page HTTP ${response.status}`);
                const html=await response.text();
                if(!html.includes(item.name))throw new Error(`${item.code} page name mismatch`);
                for(const service of expected.filter(x=>x.code===item.code))if(!html.includes(service.summary))throw new Error(`${item.code}:${service.service} page summary mismatch`);
                pageChecks.push({code:item.code,httpStatus:response.status,nameMatched:true,serviceSummariesMatched:expected.filter(x=>x.code===item.code).length});
              }
              const response=await fetch(`${base}/data/generated/municipalities.json${stamp}`,{redirect:'follow'});
              if(!response.ok)throw new Error(`published JSON HTTP ${response.status}`);
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities??payload.items??[]);
              if(!Array.isArray(municipalities)||municipalities.length!==1741)throw new Error(`published municipality count ${municipalities.length}`);
              let serviceCount=0;for(const municipality of municipalities)serviceCount+=Object.keys(municipality.services??{}).length;
              if(serviceCount!==15669)throw new Error(`published service count ${serviceCount}`);
              const serviceChecks=[];
              for(const item of expected){
                const municipality=municipalities.find(x=>String(x.code)===item.code);
                if(!municipality)throw new Error(`${item.code} missing`);
                const service=municipality.services?.[item.service];
                if(service?.status!=='verified')throw new Error(`${item.code}:${item.service} status ${service?.status}`);
                if(service.summary!==item.summary)throw new Error(`${item.code}:${item.service} summary mismatch`);
                if(service.source?.url!==item.source)throw new Error(`${item.code}:${item.service} source mismatch`);
                const additionalUrls=(service.additionalSources??[]).map(x=>x.url);
                for(const url of item.additional)if(!additionalUrls.includes(url))throw new Error(`${item.code}:${item.service} additional source missing ${url}`);
                serviceChecks.push({code:item.code,name:item.name,service:item.service,status:service.status,summaryMatched:true,sourceMatched:true,additionalSourcesMatched:item.additional.length});
              }
              const audit={schemaVersion:'1.0.0',auditId:'central-a-weak-primary-source-batch4-public-verification-20260726',verifiedAt:new Date().toISOString(),baseUrl:base,reviewedMunicipalityCount:4,reviewedServiceCount:5,pageChecks,serviceChecks,publishedMunicipalityCount:municipalities.length,publishedServiceCount:serviceCount,pullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),status:'passed',attempt,blocker:null};
              fs.writeFileSync('jichitai-compare/operations/audits/central-a-weak-primary-source-batch4-public-verification-20260726.json',JSON.stringify(audit,null,2)+'\n');
              process.exit(0);
            }catch(error){lastError=error;if(attempt<30)await sleep(20000);}
          }
          throw lastError;
          NODE
          rm -f jichitai-compare/operations/control/central-a-weak-source-batch4-public-trigger-20260726.json
      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A弱い主出典第4群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
