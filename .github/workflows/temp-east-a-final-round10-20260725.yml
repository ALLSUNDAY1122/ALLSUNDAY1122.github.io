name: Temporary East A final round10 audit

on:
  pull_request:
    branches: [region/east]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/east-a-final-round10-20260725
          fetch-depth: 0
      - name: Fetch latest main
        run: git fetch origin main region/east
      - name: Compare East A sources and tasks with main
        run: |
          python <<'PY'
          import json, subprocess
          from pathlib import Path

          prefectures={'10','13','19','20'}
          service_keys={'childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'}
          task_keys=['municipalityCode','municipalityName','prefectureCode','prefectureName','assignedTeam','status','currentService','nextServiceIndex','completedServices','verifiedCount','researchingCount','unavailableCount','needsMediumReviewCount','pullRequestNumber','officialSources','blockers']
          root=Path('jichitai-compare'); source_paths=[]; task_paths=[]; codes=[]; source_mismatches=[]; task_mismatches=[]; structure_errors=[]

          def main_json(path):
              r=subprocess.run(['git','show',f'origin/main:{path.as_posix()}'],capture_output=True,text=True)
              return json.loads(r.stdout) if r.returncode==0 else None

          for pref in sorted(prefectures):
              for path in sorted((root/'data'/'municipalities'/pref).glob('*.json')):
                  code=path.stem; data=json.loads(path.read_text(encoding='utf-8')); codes.append(code); source_paths.append(path)
                  task_path=root/'operations'/'tasks'/f'{code}.json'; task_paths.append(task_path)
                  if data.get('code')!=code or set(data.get('services',{}))!=service_keys or not task_path.exists():
                      structure_errors.append(path.as_posix()); continue
                  task=json.loads(task_path.read_text(encoding='utf-8'))
                  counts={'verifiedCount':sum(s.get('status')=='verified' for s in data['services'].values()),'researchingCount':sum(s.get('status')=='researching' for s in data['services'].values()),'unavailableCount':sum(s.get('status')=='unavailable' for s in data['services'].values()),'needsMediumReviewCount':sum(s.get('status')=='needs_medium_review' for s in data['services'].values())}
                  if task.get('municipalityCode')!=code or any(task.get(k)!=v for k,v in counts.items()): structure_errors.append(task_path.as_posix())
                  main_source=main_json(path)
                  if main_source!=data: source_mismatches.append(path.as_posix())
                  main_task=main_json(task_path)
                  if main_task is None: task_mismatches.append(task_path.as_posix())
                  else:
                      def normalize(key,value):
                          if key in {'completedServices','officialSources'}: return sorted(value or [])
                          if key=='blockers': return value or []
                          return value
                      if any(normalize(k,task.get(k))!=normalize(k,main_task.get(k)) for k in task_keys): task_mismatches.append(task_path.as_posix())

          if structure_errors or source_mismatches or task_mismatches:
              print('structure errors:',structure_errors); print('source mismatches:',source_mismatches); print('task semantic mismatches:',task_mismatches)
              raise SystemExit(1)

          main_generated=json.loads(subprocess.check_output(['git','show','origin/main:jichitai-compare/data/generated/municipalities.json'],text=True))
          main_by_code={item['code']:item for item in main_generated['municipalities']}; missing=[code for code in codes if code not in main_by_code]
          if missing: raise SystemExit(f'main generated data missing: {missing}')

          audit={'schemaVersion':'1.0.0','auditId':'east-a-final-consistency-20260725','sessionId':'east-a','auditRound':10,'targetRounds':10,'prefectureCodes':sorted(prefectures),'municipalityCount':len(codes),'sourceFileCount':len(source_paths),'taskFileCount':len(task_paths),'targetedStructureErrorCount':0,'sourceMismatchCount':0,'taskSemanticMismatchCount':0,'mainGeneratedMissingCount':0,'correctedPageCodes':['19364','19425','19443','19442','19429','10367','10424','10426','13361','13362','13363','13364','13381','20303','20305','20306'],'targetedRegionalValidation':'success','mainSourceTaskComparison':'success','publicVerification':'pending','status':'in_progress'}
          Path('/tmp/east-a-final-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); Path('/tmp/east-a-codes.json').write_text(json.dumps(codes),encoding='utf-8')
          PY
      - name: Verify public generated data and corrected pages
        run: |
          node <<'NODE'
          const fs=require('fs'); const {execFileSync}=require('child_process'); const base='https://allsunday1122.github.io/jichitai-compare'; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const codes=JSON.parse(fs.readFileSync('/tmp/east-a-codes.json','utf8')); const audit=JSON.parse(fs.readFileSync('/tmp/east-a-final-audit.json','utf8'));
          const mainGenerated=JSON.parse(execFileSync('git',['show','origin/main:jichitai-compare/data/generated/municipalities.json'],{encoding:'utf8'})); const mainByCode=new Map(mainGenerated.municipalities.map(x=>[x.code,x])); let publicData=null;
          for(let attempt=1;attempt<=20;attempt++){const res=await fetch(`${base}/data/generated/municipalities.json?v=${Date.now()}`);if(res.ok){const c=await res.json();const m=new Map(c.municipalities.map(x=>[x.code,x]));if(codes.every(code=>JSON.stringify(m.get(code))===JSON.stringify(mainByCode.get(code)))){publicData=c;break;}}await sleep(15000);}
          if(!publicData)throw new Error('East A public generated data did not match latest main');
          for(const code of audit.correctedPageCodes){const res=await fetch(`${base}/municipality/${code}/?v=${Date.now()}`);if(!res.ok)throw new Error(`${code}: public page HTTP ${res.status}`);await res.arrayBuffer();}
          audit.publicVerification='success';audit.publicGeneratedMunicipalityCount=publicData.municipalities.length;audit.publicCorrectedPageCount=audit.correctedPageCodes.length;audit.auditedAt='2026-07-25T04:16:00+09:00';audit.status='success';fs.writeFileSync('jichitai-compare/operations/audits/east-a-final-consistency-20260725.json',JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Complete East A verification campaign
        run: |
          python <<'PY'
          import json,os
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/session-checkpoints/east-a.json');data=json.loads(path.read_text(encoding='utf-8'));campaign=data['verificationCampaign'];rounds=[x for x in campaign.setdefault('rounds',[]) if x.get('round')!=10]
          rounds.append({'round':10,'topic':'source JSON・task・生成JSON・静的ページ・main・公開環境の最終整合性','result':'passed_with_external_follow_up','details':'担当4都県の全自治体JSONとtask主要項目をmainと照合し不一致0件。main生成JSONに全担当自治体が存在し、公開生成JSONも担当全自治体でmainと一致。監査修正16自治体の公開ページHTTP応答を確認。栄村は公式サイト障害が継続しているためIssue #2847で非ブロッキング追跡を継続する。'})
          campaign['rounds']=sorted(rounds,key=lambda x:x['round']);campaign['completedRounds']=10;campaign['status']='completed';campaign['nextRound']=None;campaign['nextTopic']=None;campaign['nextAction']='東日本Aの誤調査10回検証は完了。確定した誤り・記録漏れは修正済み。栄村公式サイト障害のみIssue #2847で非ブロッキング追跡し、復旧後に対象制度を再確認する。'
          data['updatedAt']='2026-07-25T04:16:00+09:00';data['pullRequestNumber']=int(os.environ['PR_NUMBER']);data['ciStatus']='pending';path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit final audit result
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-east-a-final-round10-20260725.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'audit: 東日本A誤調査検証10回を完了'
          git push --force-with-lease origin HEAD:audit/east-a-final-round10-20260725
