name: Temporary East A final round10 diagnostic

on:
  pull_request:
    branches: [region/east]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/east-a-final-round10-20260725
          fetch-depth: 0
      - name: Diagnose source and task differences
        run: |
          git fetch origin main region/east
          python <<'PY'
          import json,subprocess
          from pathlib import Path
          prefs={'10','13','19','20'};root=Path('jichitai-compare');source=[];task=[];structure=[]
          task_keys=['municipalityCode','municipalityName','prefectureCode','prefectureName','assignedTeam','status','currentService','nextServiceIndex','completedServices','verifiedCount','researchingCount','unavailableCount','needsMediumReviewCount','pullRequestNumber','officialSources','blockers']
          def main_json(path):
              r=subprocess.run(['git','show',f'origin/main:{path.as_posix()}'],capture_output=True,text=True)
              return json.loads(r.stdout) if r.returncode==0 else None
          def norm(k,v):
              return sorted(v or []) if k in {'completedServices','officialSources'} else (v or [] if k=='blockers' else v)
          count=0
          for pref in sorted(prefs):
              for p in sorted((root/'data'/'municipalities'/pref).glob('*.json')):
                  count+=1;code=p.stem;d=json.loads(p.read_text(encoding='utf-8'));mp=main_json(p)
                  if mp!=d: source.append(p.as_posix())
                  tp=root/'operations'/'tasks'/f'{code}.json'
                  if not tp.exists(): structure.append(tp.as_posix());continue
                  t=json.loads(tp.read_text(encoding='utf-8'));mt=main_json(tp)
                  if mt is None: task.append({'path':tp.as_posix(),'keys':['missing_in_main']})
                  else:
                      keys=[k for k in task_keys if norm(k,t.get(k))!=norm(k,mt.get(k))]
                      if keys: task.append({'path':tp.as_posix(),'keys':keys})
                  if len(d.get('services',{}))!=9: structure.append(p.as_posix())
          report={'schemaVersion':'1.0.0','auditId':'east-a-final-diagnostic-20260725','municipalityCount':count,'sourceMismatchPaths':source,'taskSemanticMismatches':task,'structureErrorPaths':structure,'status':'diagnostic_complete'}
          out=root/'operations'/'audits'/'east-a-final-diagnostic-20260725.json';out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          rm -f .github/workflows/temp-east-a-final-round10-20260725.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 東日本A最終整合差分を診断'
          git push --force-with-lease origin HEAD:audit/east-a-final-round10-20260725
