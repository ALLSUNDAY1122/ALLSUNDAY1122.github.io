name: APP2-007 Otsu4 Store Upload

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: app2-007-otsu4-store-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[ASC-CMD] APP2-007 OTSU4 STORE ASSETS')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSET_RUN_ID: '33231735147'
      ASSET_NAME: 'otsu4-store-assets-986218c7f22076c2b988f91597c6d7fa8097fea0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ASC dependencies
        run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - name: Download pinned audited store assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p otsu4-store-assets
          gh run download "$ASSET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ASSET_NAME" --dir otsu4-store-assets
          test -f otsu4-store-assets/manifest.json
          test "$(find otsu4-store-assets -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "7"
      - name: Upload App Store and IAP review screenshots
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          OTS4_STORE_ASSET_DIR: otsu4-store-assets
          OTS4_STORE_UPLOAD_OUTPUT: app2-007-otsu4-store-upload-result.json
        run: python scripts/app2_007_otsu4_store_assets_upload.py
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app2-007-otsu4-store-upload-${{ github.run_id }}
          path: app2-007-otsu4-store-upload-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `APP2-007 Otsu4 store upload finished. status=${{ job.status }}; run_id=${context.runId}; artifact=app2-007-otsu4-store-upload-${context.runId}`
            });
