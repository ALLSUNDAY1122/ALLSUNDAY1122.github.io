name: Clipboard Widget Phase 0 TestFlight

on:
  push:
    branches:
      - feature/clipboard-widget-poc
    paths:
      - '.github/workflows/clipboard-widget-testflight-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and sanitize latest Codemagic diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('automation/clipboard-widget/evidence/codemagic-phase0-testflight.json').read_text(encoding='utf-8'))
          arts=(r.get('build_details') or {}).get('artifacts') or []
          if not arts:
              raise SystemExit('No Codemagic artifact in latest evidence')
          url=arts[0].get('short_lived_download_url')
          if not url:
              raise SystemExit('No short-lived artifact URL')
          Path('/tmp/artifact-url.txt').write_text(url,encoding='utf-8')
          PY
          curl --fail --location --retry 2 "$(cat /tmp/artifact-url.txt)" -o /tmp/cm-artifacts.zip
          rm -f /tmp/artifact-url.txt
          unzip -q /tmp/cm-artifacts.zip -d /tmp/cm-artifacts
          find /tmp/cm-artifacts -maxdepth 4 -type f -print
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('/tmp/cm-artifacts').rglob('clipboard-widget-phase0-diagnostics.log'))
          if not files:
              raise SystemExit('Diagnostic log not found in artifact bundle')
          raw=files[0].read_text(encoding='utf-8',errors='replace')
          raw=re.sub(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----','[REDACTED PEM]',raw,flags=re.S)
          raw=re.sub(r'eyJ[A-Za-z0-9._-]{20,}','[REDACTED JWT]',raw)
          raw=re.sub(r'(?i)(token|secret|password|private[_ -]?key)\s*[:=]\s*\S+',r'\1=[REDACTED]',raw)
          out=Path('automation/clipboard-widget/evidence/codemagic-phase0-diagnostic.log')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(raw[-30000:],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/clipboard-widget/evidence/codemagic-phase0-diagnostic.log
          git commit -m 'chore: persist sanitized clipboard Codemagic diagnostic log'
          git pull --rebase origin feature/clipboard-widget-poc
          git push origin HEAD:feature/clipboard-widget-poc
