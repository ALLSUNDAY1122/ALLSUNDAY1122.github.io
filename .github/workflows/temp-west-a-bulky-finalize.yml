name: Temporary West A Bulky Waste Finalize

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-bulky-finalize-trigger-20260725.json

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sync/west-a-bulky-final-region-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import public evidence and finalize regional state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          public_path=jichitai-compare/operations/audits/west-a-bulky-waste-public-verification-20260725.json
          git show "origin/main:$public_path" > "$public_path"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const completedAt='2026-07-25T21:57:00+09:00';
          const checkpointPath=path.join(root,'operations/control/session-checkpoints/west-a.json');
          const regionPath=path.join(root,'operations/control/regions/west.json');
          const publicPath=path.join(root,'operations/audits/west-a-bulky-waste-public-verification-20260725.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          const publicEvidence=JSON.parse(fs.readFileSync(publicPath,'utf8'));
          if(!publicEvidence.success) throw new Error('Public verification evidence is not successful');

          const record={
            status:'completed_with_source_maintenance_and_nonblocking_followup',
            completedAt,
            municipalityCount:226,
            initialPriorityCandidateCount:65,
            contentConditionReviewCount:28,
            fetchErrorManualReviewCount:2,
            likelyFalsePositiveCount:13,
            retainedSpotCheckCount:11,
            sourceMaintenanceReviewCount:8,
            highPriorityStatusReviewCount:3,
            confirmedSourceMaintenanceCount:3,
            sourceMisassignmentCount:1,
            sourceEnrichmentCount:2,
            statusCorrectionCount:0,
            contentErrorCount:0,
            unresolvedConfirmedErrorCount:0,
            continuationIssue:3675,
            continuationMunicipalityCount:4,
            continuationMunicipalityCodes:['33203','43511','46502','33586'],
            regionalCorrectionPullRequestNumber:3677,
            regionalCorrectionWorkflowRunId:30158202086,
            nationalPullRequestNumber:3679,
            nationalWorkflowRunId:30158329113,
            publicVerificationPullRequestNumber:3681,
            publicVerificationWorkflowRunId:30158773931,
            publicPageCount:3,
            nationwideMunicipalityCount:1741,
            nationwideServiceCount:15669,
            blocker:null
          };
          checkpoint.updatedAt=completedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='粗大ごみ226自治体横断監査は出典保守3件・status変更0で完了。津山市・五木村・南種子町・新庄村はIssue #3675で非blocker継続確認し、新しい公式情報が得られた場合のみ再監査する。';
          checkpoint.bulkyWasteCrosscheck=record;
          checkpoint.notes=[...(checkpoint.notes||[]),'2026-07-25 21:57: 粗大ごみ226自治体を横断監査。優先65件を分類し、大月町の誤出典1件を訂正、桂川町・山鹿市の出典2件を補強。status・料金・処理方法の訂正0、公開3ページと全国JSONを確認。4自治体はIssue #3675で非blocker継続確認。'];
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          region.updatedAt=completedAt;
          region.latestWestABulkyWasteAudit=record;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const resolution={
            schemaVersion:'1.0.0',
            resolutionId:'west-a-bulky-waste-final-resolution-20260725',
            session:'西日本調査班A',
            coordinatorSession:'統括B②',
            completedAt,
            scope:{municipalityCount:226,priorityCandidateCount:65},
            result:{sourceMisassignmentCount:1,sourceEnrichmentCount:2,statusCorrectionCount:0,contentErrorCount:0,unresolvedConfirmedErrorCount:0,releaseBlocker:'none'},
            correctedMunicipalities:[
              {code:'39424',name:'大月町',classification:'source_misassignment'},
              {code:'40421',name:'桂川町',classification:'source_enrichment'},
              {code:'43208',name:'山鹿市',classification:'source_enrichment'}
            ],
            retainedNoChange:['40646','46505','43424'],
            continuation:{issue:3675,nonBlocking:true,codes:['33203','43511','46502','33586']},
            evidence:{mechanicalAuditPullRequest:3634,reviewPreparationPullRequest:3674,regionalCorrectionPullRequest:3677,regionalCorrectionWorkflowRunId:30158202086,nationalSyncPullRequest:3679,nationalSyncWorkflowRunId:30158329113,publicVerificationPullRequest:3681,publicVerificationWorkflowRunId:30158773931,finalRegionPullRequest:Number(process.env.PR_NUMBER),finalRegionWorkflowRunId:Number(process.env.RUN_ID)},
            publicVerification:{pageCount:3,allPagesHttp200:true,primarySourcesMatch:true,publicGeneratedJsonMatches:true,publicMunicipalityCount:1741,publicServiceCount:15669},
            status:'completed_public_verified_region_integrated'
          };
          const resolutionPath=path.join(root,'operations/audits/west-a-bulky-waste-final-resolution-20260725.json');
          fs.writeFileSync(resolutionPath,JSON.stringify(resolution,null,2)+'\n');
          const trigger=path.join(root,'operations/control/west-a-bulky-finalize-trigger-20260725.json');
          if(fs.existsSync(trigger)) fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Remove regional temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temp-west-a-bulky-review-prep.yml \
            .github/workflows/temp-west-a-bulky-source-maintenance.yml \
            .github/workflows/temp-west-a-bulky-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 西日本A粗大ごみ監査を地域で最終確定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
