name: APP2-009 Run Watch

on:
  workflow_run:
    workflows:
      - Kangoshi App Store Screenshots
      - APP2-009 Submission Build
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture run summary and step outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          rid=os.environ['RUN_ID']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f"https://api.github.com/repos/ALLSUNDAY1122/ALLSUNDAY1122.github.io/actions/runs/{rid}/jobs?per_page=100",
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
          jobs=[]
          for j in payload.get('jobs',[]):
              jobs.append({'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in j.get('steps',[])]})
          out={'task_id':'APP2-009','workflow':os.environ['RUN_NAME'],'run_id':int(rid),'conclusion':os.environ['RUN_CONCLUSION'],'head_sha':os.environ['RUN_SHA'],'jobs':jobs}
          safe_name='screenshots' if 'Screenshots' in os.environ['RUN_NAME'] else 'submission-build'
          Path('/tmp/path').write_text(f'automation/chatgpt-dispatcher/app-development-2/evidence/APP2-009-{safe_name}-run-latest.json')
          Path('/tmp/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist run summary
        run: |
          set -euo pipefail
          TARGET="$(cat /tmp/path)"
          cp /tmp/result.json /tmp/result-copy.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/result-copy.json "$TARGET"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "APP2-009: persist completed workflow run summary" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
