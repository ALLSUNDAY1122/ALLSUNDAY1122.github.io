name: Temporary East A Second Audit Round 4 PR Runner

on:
  pull_request:
    branches:
      - region/east
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'audit/east-a-second-quality-20260725-r4' ||
       github.event.pull_request.head.ref == 'audit/east-a-second-quality-20260725-finalize')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect completed run
        id: detect
        shell: bash
        run: |
          if [[ -f jichitai-compare/operations/scripts/patch-east-a-second-audit-r4.py ]]; then
            echo "run_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_patch=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.run_patch == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.run_patch == 'true'
        with:
          node-version: '24'
      - name: Apply audit patch
        if: steps.detect.outputs.run_patch == 'true'
        run: python jichitai-compare/operations/scripts/patch-east-a-second-audit-r4.py
      - name: Regenerate and validate
        if: steps.detect.outputs.run_patch == 'true'
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit audit update and remove branch-local patch files
        if: steps.detect.outputs.run_patch == 'true'
        shell: bash
        run: |
          rm -f jichitai-compare/operations/scripts/patch-east-a-second-audit-r4.py
          rm -f jichitai-compare/operations/triggers/east-a-second-audit-r4.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "audit: finalize East A second audit round 4"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
