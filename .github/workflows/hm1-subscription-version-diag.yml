name: HM1 Subscription Version Diagnosis

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hm1_subscription_version_diag.py'
      - '.github/workflows/hm1-subscription-version-diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hm1-subscription-version-diag
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect versioned subscription metadata
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/hm1_subscription_version_diag.py
      - name: Persist sanitized diagnosis
        if: always() && hashFiles('automation/asc-results/hm1-subscription-version-diag.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cp automation/asc-results/hm1-subscription-version-diag.json /tmp/hm1-subscription-version-diag.json
          git reset --hard HEAD
          git pull --rebase origin main
          cp /tmp/hm1-subscription-version-diag.json automation/asc-results/hm1-subscription-version-diag.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/asc-results/hm1-subscription-version-diag.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist HM1 subscription version diagnosis [skip ci]'
            git push origin HEAD:main
          fi
