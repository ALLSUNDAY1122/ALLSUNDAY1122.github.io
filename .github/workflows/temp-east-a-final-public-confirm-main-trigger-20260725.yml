name: Temporary finalize East A public confirmation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'finalize East-A public confirmation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified East-A publication record to latest main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main audit/east-a-final-round10-20260725
            base_sha="$(git rev-parse origin/main)"
            git reset --hard "${base_sha}"
            git checkout origin/audit/east-a-final-round10-20260725 -- \
              jichitai-compare/operations/audits/east-a-final-consistency-20260725.json \
              jichitai-compare/operations/control/session-checkpoints/east-a.json

            python <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('jichitai-compare/operations/audits/east-a-final-consistency-20260725.json').read_text(encoding='utf-8'))
          checkpoint=json.loads(Path('jichitai-compare/operations/control/session-checkpoints/east-a.json').read_text(encoding='utf-8'))
          assert audit['status']=='completed'
          assert audit['publicVerification']=='success'
          assert audit['publicGeneratedMunicipalityCount']==1741
          assert audit['publicCorrectedPageCount']==49
          assert audit['sourceMismatchCount']==0
          assert audit['taskEssentialMismatchCount']==0
          assert checkpoint['ciStatus']=='success'
          assert checkpoint['verificationCampaign']['completedRounds']==10
          assert checkpoint['verificationCampaign']['status']=='completed'
          assert checkpoint['publicationConfirmation']['status']=='success'
          PY

            pushd jichitai-compare
            npm run validate:generated
            node --check app.js
            popd

            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "${base_sha}" ]; then
              echo 'main advanced during finalization; retrying'
              continue
            fi

            rm -f .github/workflows/temp-east-a-final-public-confirm-main-trigger-20260725.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            git commit -m 'ops: 東日本A最終公開確認をmainへ確定'
            git push origin HEAD:main
            exit 0
          done
          echo 'main kept advancing; final publication record was not committed' >&2
          exit 1
