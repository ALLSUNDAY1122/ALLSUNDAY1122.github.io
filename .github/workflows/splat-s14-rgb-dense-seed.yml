name: Splat S14 RGB Dense Seed
on:
  workflow_dispatch:
  push:
    paths:
      - 'splat-native-ios/SplatNative/SplatSoftwareDepthSeedBuilder.swift'
      - 'splat-native-ios/SplatNative/SplatDepthSeedBuilder.swift'
      - 'splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py'
      - '.github/workflows/splat-s14-rgb-dense-seed.yml'
  pull_request:
    paths:
      - 'splat-native-ios/SplatNative/SplatSoftwareDepthSeedBuilder.swift'
      - 'splat-native-ios/SplatNative/SplatDepthSeedBuilder.swift'
      - 'splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py'
      - '.github/workflows/splat-s14-rgb-dense-seed.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: S14 RGB multi-view dense-seed contract
        run: python3 splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py
      - name: Preserve S13 same-raw materialization contract
        run: python3 splat-native-ios/scripts/test_s13_depth_seed_contract.py
      - name: Verify S13 materializer composes S14 seed routing
        working-directory: splat-native-ios
        run: |
          python3 scripts/apply_s13_depth_seed.py
          python3 scripts/apply_s13_ios26_reprocess_tap_fix.py
          grep -q 'SplatDepthSeedBuilder.preparePointCloudPLY' SplatNative/ScanModel.swift
          grep -q 'restoreFinishedProjectForS13Reprocess' SplatNative/ScanModel.swift
          grep -q 'scanLabRouteToScanForReprocess' SplatNative/ScanLibraryView.swift
          grep -q 'SplatSoftwareDepthSeedBuilder.makeSeedPoints' SplatNative/SplatDepthSeedBuilder.swift
          grep -q 's14-seed-recipe.json' SplatNative/SplatDepthSeedBuilder.swift
          grep -q 'case planeSweep' SplatNative/SplatDepthSeedBuilder.swift
      - name: Preserve protected reconstruction invariants
        working-directory: splat-native-ios
        run: |
          grep -q 'standardIterations = 7_000' SplatNative/SplatReconstructionPolicy.swift
          grep -q 'datasetDownscale: Float = 4.0' SplatNative/SplatReconstructionPolicy.swift
          grep -q 'config.shDegree = 3' SplatNative/SplatReconstructionPolicy.swift
          grep -q 'config.densifyGradThresh = 0.0002' SplatNative/SplatReconstructionPolicy.swift
          grep -q 'config.densifySizeThresh = 0.01' SplatNative/SplatReconstructionPolicy.swift
          grep -q 'residentMemoryBudgetBytes' SplatNative/SplatResourceGuard.swift
          grep -q 'minimumAvailableMemoryReserveBytes' SplatNative/SplatResourceGuard.swift
