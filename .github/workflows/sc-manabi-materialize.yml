name: SC Manabi materialize

# trigger 2026-08-09T19:46+09:00
on:
  push:
    paths:
      - '.github/workflows/sc-manabi-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Safari-compatible HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          root = Path('sc-manabi-sprint')
          encoded = (root / 'app.gz.b64').read_text(encoding='utf-8').strip()
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          (root / 'app.html').write_text(html, encoding='utf-8')

          index = '''<!doctype html>
          <html lang="ja"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#f7f3ea">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <title>情報処理安全確保支援士｜学びスプリント</title>
          <script>location.replace('./app.html?v=20260809-1946');</script>
          </head><body style="margin:0;background:#f7f3ea;font-family:-apple-system,sans-serif">
          <div style="padding:48px 20px;text-align:center;color:#4a5468">アプリを開いています…</div>
          <p style="padding:0 20px;text-align:center"><a href="./app.html?v=20260809-1946">開かない場合はこちら</a></p>
          </body></html>'''
          (root / 'index.html').write_text(index, encoding='utf-8')

          sw = """const CACHE='sc-manabi-v011';
          const ASSETS=['./','./index.html','./app.html','./q0.txt','./q1.txt','./q2.txt','./q3.txt','./q4.txt','./q5.txt','./manifest.json','./icon.svg'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return res}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./app.html'))))});
          """
          (root / 'sw.js').write_text(sw, encoding='utf-8')
          PY
      - name: Verify generated files
        run: |
          test -s sc-manabi-sprint/app.html
          grep -q '<html' sc-manabi-sprint/app.html
          grep -q 'app.html' sc-manabi-sprint/index.html
          grep -q 'sc-manabi-v011' sc-manabi-sprint/sw.js
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sc-manabi-sprint/app.html sc-manabi-sprint/index.html sc-manabi-sprint/sw.js
          git commit -m 'sc sprint: materialize Safari-compatible app' || exit 0
          git push
