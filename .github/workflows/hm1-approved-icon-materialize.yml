name: Materialize approved Health Manager 1 icon

on:
  push:
    branches:
      - agent/approved-icons-it-hm1
    paths:
      - 'ios/health-manager-1/approved-icon-v1/**'
      - 'ios/health-manager-1/prepare-approved-icon.sh'
      - '.github/workflows/hm1-approved-icon-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/health-manager-1/approved-icon-v1/**'
      - 'ios/health-manager-1/prepare-approved-icon.sh'
      - 'ios/health-manager-1/Resources/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/hm1-approved-icon-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/approved-icons-it-hm1
          fetch-depth: 0
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y webp python3-pil
      - name: Decode approved icon part01
        run: tr -d '\r\n' < ios/health-manager-1/approved-icon-v1/part01.b64 | base64 --ignore-garbage --decode > /tmp/hm1-p01.bin
      - name: Decode approved icon part02
        run: tr -d '\r\n' < ios/health-manager-1/approved-icon-v1/part02.b64 | base64 --ignore-garbage --decode > /tmp/hm1-p02.bin
      - name: Decode approved icon part03
        run: tr -d '\r\n' < ios/health-manager-1/approved-icon-v1/part03.b64 | base64 --ignore-garbage --decode > /tmp/hm1-p03.bin
      - name: Decode approved icon part04
        run: tr -d '\r\n' < ios/health-manager-1/approved-icon-v1/part04.b64 | base64 --ignore-garbage --decode > /tmp/hm1-p04.bin
      - name: Reconstruct approved icon transport
        run: cat /tmp/hm1-p01.bin /tmp/hm1-p02.bin /tmp/hm1-p03.bin /tmp/hm1-p04.bin > /tmp/hm1-approved.webp
      - name: Verify approved icon byte count
        run: test "$(wc -c < /tmp/hm1-approved.webp | tr -d ' ')" = "43200"
      - name: Verify approved icon SHA
        run: echo 'ac8f0c2c050801ed2121bdd50494fdcafcec8af89a1d7811cd044b8977dd2d59  /tmp/hm1-approved.webp' | sha256sum -c -
      - name: Verify approved icon WebP container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('/tmp/hm1-approved.webp').read_bytes()
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          assert struct.unpack('<I', b[4:8])[0]+8 == len(b)
          print('PASS: RIFF/WebP container')
          PY
      - name: Decode approved WebP
        run: dwebp /tmp/hm1-approved.webp -o /tmp/hm1-approved.png
      - name: Verify Pillow can read approved artwork
        run: |
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/hm1-approved.png') as im:
              im.load()
              print(f'PASS: Pillow image size={im.size} mode={im.mode}')
          PY
      - name: Materialize exact approved artwork into AppIcon sizes
        run: bash ios/health-manager-1/prepare-approved-icon.sh
      - name: Commit generated AppIcon assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/health-manager-1/Resources/Assets.xcassets/AppIcon.appiconset/*.png
          if git diff --cached --quiet; then
            echo 'PASS: approved AppIcon assets already current'
          else
            git commit -m 'Materialize approved First-class Health Manager AppIcon'
            git push origin HEAD:agent/approved-icons-it-hm1
          fi
