name: Materialize approved Health Manager 1 icon

on:
  push:
    branches:
      - agent/approved-icons-it-hm1
    paths:
      - 'ios/health-manager-1/approved-icon-v1/**'
      - 'ios/health-manager-1/prepare-approved-icon.sh'
      - 'ios/health-manager-1/prepare-ios.sh'
      - '.github/workflows/hm1-approved-icon-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/health-manager-1/approved-icon-v1/**'
      - 'ios/health-manager-1/prepare-approved-icon.sh'
      - 'ios/health-manager-1/prepare-ios.sh'
      - 'ios/health-manager-1/Resources/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/hm1-approved-icon-materialize.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y webp python3-pil
      - name: Materialize exact approved artwork into AppIcon sizes
        run: bash ios/health-manager-1/prepare-approved-icon.sh
      - name: Verify generated AppIcon slots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('ios/health-manager-1/Resources/Assets.xcassets/AppIcon.appiconset')
          expected={'icon-20@2x.png':40,'icon-20@3x.png':60,'icon-29@2x.png':58,'icon-29@3x.png':87,'icon-40@2x.png':80,'icon-40@3x.png':120,'icon-60@2x.png':120,'icon-60@3x.png':180,'icon-1024.png':1024}
          contents=json.loads((root/'Contents.json').read_text(encoding='utf-8'))
          assert {x.get('filename') for x in contents['images'] if x.get('filename')}==set(expected)
          for name,px in expected.items():
              b=(root/name).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n' and b[12:16]==b'IHDR'
              assert struct.unpack('>II',b[16:24])==(px,px)
              assert b[25] not in (4,6), f'{name}: alpha channel'
          print('PASS: 9 approved HM1 AppIcon slots generated from checksum-verified source')
          PY
