name: Temporary Sync Release Queue 215

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-215.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release queue
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'jichitai-compare/operations/control/release-queue.json';
          const q = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byRegion = Object.fromEntries(q.entries.map(e => [e.region, e]));
          const add = (region, items) => {
            const e = byRegion[region];
            const seen = new Set(e.municipalities.map(m => m.code));
            for (const item of items) if (!seen.has(item.code)) e.municipalities.push(item);
            e.municipalities.sort((a,b) => a.code.localeCompare(b.code));
            e.count = e.municipalities.length;
          };

          add('north', [{code:'01406',name:'古平町'},{code:'01407',name:'仁木町'}]);
          add('east', [{code:'08231',name:'桜川市'}]);
          add('central', [{code:'21382',name:'輪之内町'},{code:'21383',name:'安八町'},{code:'21401',name:'揖斐川町'}]);
          add('west', [{code:'32505',name:'吉賀町'}]);

          Object.assign(byRegion.north, {
            pendingSinceLastRelease: 8,
            releaseStatus: 'pending_threshold',
            reason: 'せたな町から京極町までの追加10自治体をPR #384でmainへ全国統合し、生成・公開をPR #386で184自治体へ更新。その後、倶知安町から仁木町まで8自治体を地方統合',
            mainIntegrationPr: 384,
            generatedPullRequest: 386
          });
          Object.assign(byRegion.east, {
            pendingSinceLastRelease: 0,
            releaseStatus: 'pending_threshold',
            reason: '鹿嶋市から桜川市までの追加10自治体をPR #407でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新',
            mainIntegrationPr: 407,
            generatedPullRequest: 408
          });
          Object.assign(byRegion.central, {
            pendingSinceLastRelease: 1,
            releaseStatus: 'pending_threshold',
            reason: '下呂市から安八町までの追加10自治体をPR #404でmainへ全国統合し、生成・公開をPR #408で204自治体へ更新。その後、揖斐川町を地方統合',
            auditStatus: 'passed',
            mainIntegrationPr: 404,
            generatedPullRequest: 408
          });
          Object.assign(byRegion.west, {
            pendingSinceLastRelease: 3,
            releaseStatus: 'pending_threshold',
            reason: '浜田市から美郷町までの追加10自治体をPR #324でmainへ全国統合し、生成・公開をPR #325で134自治体へ更新。その後、邑南町・津和野町・吉賀町を地方統合',
            mainIntegrationPr: 324,
            generatedPullRequest: 325
          });

          q.updatedAt = '2026-07-22T02:25:00+09:00';
          q.summary.regionalMergedMunicipalities = q.entries.reduce((sum,e) => sum + e.count, 0);
          q.summary.waitingRegionalMergeMunicipalities = 0;
          q.summary.releaseReadyRegions = [];
          q.summary.auditBlockedRegions = [];
          q.summary.lastNationalIntegrationAt = '2026-07-22T02:18:07+09:00';
          q.summary.lastNationalIntegrationPr = 407;
          q.summary.latestGeneratedMunicipalityCount = 204;
          q.summary.latestGeneratedPullRequest = 408;
          q.summary.latestPublicCountPullRequest = 408;
          q.nextAction = '北日本が前回全国統合後8自治体で先行。西日本3、中日本1、東日本0。北日本はあと2自治体で全国統合条件へ到達する。';
          q.humanDecisionRequired = false;

          if (byRegion.north.count !== 69) throw new Error(`north count mismatch: ${byRegion.north.count}`);
          if (byRegion.east.count !== 30) throw new Error(`east count mismatch: ${byRegion.east.count}`);
          if (byRegion.central.count !== 82) throw new Error(`central count mismatch: ${byRegion.central.count}`);
          if (byRegion.west.count !== 34) throw new Error(`west count mismatch: ${byRegion.west.count}`);
          if (q.summary.regionalMergedMunicipalities !== 215) throw new Error(`total mismatch: ${q.summary.regionalMergedMunicipalities}`);
          fs.writeFileSync(path, JSON.stringify(q));
          NODE
          rm .github/workflows/temp-sync-release-queue-215.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-215.yml
          git commit -m '統括管理: 地方統合215自治体・公開204自治体へ同期'
          git push origin main
