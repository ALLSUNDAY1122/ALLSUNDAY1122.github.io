name: APP2-007 Otsu4 IAP Contract Reconcile

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[ASC-CMD] APP2-007 OTSU4 IAP CONTRACT RECONCILE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconcile current IAP metadata only
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python scripts/app2_007_otsu4_iap_contract_reconcile.py
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app2-007-otsu4-iap-contract-${{ github.run_id }}
          path: automation/app2-007-otsu4-iap-contract-reconcile-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `APP2-007 Otsu4 IAP contract reconcile finished. status=${{ job.status }}; run_id=${context.runId}. Metadata only; no build upload or App Review submission.`
            })
