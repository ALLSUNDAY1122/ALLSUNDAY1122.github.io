name: Kanteishi Official 240 #12

on:
  pull_request:
    paths:
      - 'kanteishi-shortanswer-sprint/scripts/extract_official_questions.py'
      - 'kanteishi-shortanswer-sprint/scripts/extract_official_questions_runner.py'
      - 'kanteishi-shortanswer-sprint/learning-sprint-audit.production.json'
      - '.github/workflows/kanteishi-official-extraction-12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanteishi-official-240-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  extract-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Extract 240 official questions and answers
        run: |
          python3 kanteishi-shortanswer-sprint/scripts/extract_official_questions_runner.py \
            --out kanteishi-shortanswer-sprint/build/official
      - name: Verify extraction totals
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('kanteishi-shortanswer-sprint/build/official')
          report = json.loads((root / 'extraction-report.json').read_text(encoding='utf-8'))
          assert report['total'] == 240, report
          assert report['byEdition'] == {'2026': 80, '2025': 80, '2024': 80}, report['byEdition']
          assert report['bySubject'] == {
              '不動産に関する行政法規': 120,
              '不動産の鑑定評価に関する理論': 120,
          }, report['bySubject']
          for year in (2026, 2025, 2024):
              data = json.loads((root / f'exam-{year}.json').read_text(encoding='utf-8'))
              assert len(data['questions']) == 80, (year, len(data['questions']))
          print('Extraction totals PASS')
          PY
      - name: Prepare production audit array
        run: |
          jq '.questions' kanteishi-shortanswer-sprint/build/official/questions-240.json \
            > kanteishi-shortanswer-sprint/build/official/questions.audit.json
      - name: Shared 240-question machine audit
        run: |
          python3 automation/learning-sprint-question-pipeline/validate_questions.py \
            kanteishi-shortanswer-sprint/learning-sprint-audit.production.json
      - name: Rights and layout release gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('kanteishi-shortanswer-sprint/build/official')
          data = json.loads((root / 'questions-240.json').read_text(encoding='utf-8'))['questions']
          rights_bad = [q['id'] for q in data if q['rightsStatus'] != 'text_only_pass']
          assert not rights_bad, rights_bad
          queue = json.loads((root / 'rights-review-queue.json').read_text(encoding='utf-8'))
          assert queue == [], queue
          layout_bad = [
              q['id'] for q in data
              if q.get('requiresLayoutReview') and q.get('layoutReviewStatus') != 'pass_text_reconstruction'
          ]
          assert not layout_bad, layout_bad
          print('Rights PASS: 240/240')
          print('Layout-dependent questions PASS:', sum(bool(q.get('requiresLayoutReview')) for q in data))
          PY
      - name: Build application payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('kanteishi-shortanswer-sprint/build/official/questions-240.json')
          out = Path('kanteishi-shortanswer-sprint/build/official/questions.production.json')
          raw = json.loads(source.read_text(encoding='utf-8'))
          fields = [
              'id','round','edition','questionNo','subject','domain','topic','question','choices',
              'correctIndex','memoryLine','shortExplanation','detailExplanation','sourceURL',
              'referenceDate','originType','rightsBasis'
          ]
          payload = {
              'schemaVersion': 1,
              'contentVersion': 'official-240-2026-08-13.1',
              'qualification': '不動産鑑定士試験・短答式',
              'sourceCheckedAt': '2026-08-13',
              'productionTargetCount': 240,
              'questions': [{k: q[k] for k in fields} for q in raw['questions']],
          }
          assert len(payload['questions']) == 240
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Application payload bytes:', out.stat().st_size)
          PY
      - name: Freeze audited canonical data on feature branch
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p kanteishi-shortanswer-sprint/questions
          cp kanteishi-shortanswer-sprint/build/official/exam-2026.json kanteishi-shortanswer-sprint/questions/exam-2026.json
          cp kanteishi-shortanswer-sprint/build/official/exam-2025.json kanteishi-shortanswer-sprint/questions/exam-2025.json
          cp kanteishi-shortanswer-sprint/build/official/exam-2024.json kanteishi-shortanswer-sprint/questions/exam-2024.json
          cp kanteishi-shortanswer-sprint/build/official/extraction-report.json kanteishi-shortanswer-sprint/questions/extraction-report.json
          cp kanteishi-shortanswer-sprint/build/official/questions.production.json kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Resources/questions.production.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kanteishi-shortanswer-sprint/questions/exam-2026.json \
            kanteishi-shortanswer-sprint/questions/exam-2025.json \
            kanteishi-shortanswer-sprint/questions/exam-2024.json \
            kanteishi-shortanswer-sprint/questions/extraction-report.json \
            kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Resources/questions.production.json
          if git diff --cached --quiet; then
            echo 'Canonical data already up to date.'
          else
            git commit -m 'data(kanteishi): freeze audited official 240-question corpus'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Upload extraction corpus and audit report
        uses: actions/upload-artifact@v4
        with:
          name: kanteishi-official-240-extract
          path: |
            kanteishi-shortanswer-sprint/build/official/exam-2026.json
            kanteishi-shortanswer-sprint/build/official/exam-2025.json
            kanteishi-shortanswer-sprint/build/official/exam-2024.json
            kanteishi-shortanswer-sprint/build/official/questions-240.json
            kanteishi-shortanswer-sprint/build/official/questions.production.json
            kanteishi-shortanswer-sprint/build/official/rights-review-queue.json
            kanteishi-shortanswer-sprint/build/official/extraction-report.json
          if-no-files-found: error
          retention-days: 14
