name: Temporary Fix Main Task Status 1143

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-main-task-status-1143.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix published task statuses
        run: |
          set -euxo pipefail
          TARGET='coord/fix-main-task-status-20260722-1143'
          git fetch origin "$TARGET" main
          git checkout "$TARGET"
          cd jichitai-compare
          python3 - <<'PY'
          import json
          from pathlib import Path
          changed=[]
          for p in sorted(Path('operations/tasks').glob('*.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('status')=='pr_open':
                  d['status']='merged'
                  notes=d.setdefault('notes',[])
                  note='全国統合済みのためmain上task.statusをmergedへ補正。'
                  if note not in notes: notes.append(note)
                  p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  changed.append(str(p))
          if len(changed)!=1:
              raise SystemExit(f'unexpected pr_open tasks: {changed}')
          print('fixed', changed)
          PY
          node ./scripts/update-progress.mjs
          node ./scripts/validate-data.mjs --require-generated
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('operations/progress.json').read_text(encoding='utf-8'))
          assert d['registeredMunicipalities']==354, d['registeredMunicipalities']
          assert d['prOpenMunicipalities']==0, d['prOpenMunicipalities']
          assert d['mergedMunicipalities']==354, d['mergedMunicipalities']
          PY
          cd ..
          git add jichitai-compare/operations/tasks jichitai-compare/operations/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '進捗修正: 全国統合済みtaskの状態をmergedへ補正'
          git push origin "$TARGET"
          git checkout main
          git pull --ff-only origin main
          rm .github/workflows/temp-fix-main-task-status-1143.yml
          git add .github/workflows/temp-fix-main-task-status-1143.yml
          git commit -m '統括管理: task状態補正一時処理を削除'
          git push origin main
