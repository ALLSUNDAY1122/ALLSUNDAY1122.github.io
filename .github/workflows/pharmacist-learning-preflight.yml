name: Pharmacist Learning Preflight

on:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/ios/**'
      - 'pharmacist-manabi-sprint/content/product/**'
      - 'pharmacist-manabi-sprint/scripts/validate_release.py'
      - 'pharmacist-manabi-sprint/tools/release_readiness.py'
      - '.github/workflows/pharmacist-learning-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacist-learning-preflight
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Existing release preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 pharmacist-manabi-sprint/tools/assemble_product_bank.py
          python3 pharmacist-manabi-sprint/tools/build_web_bundle.py
          python3 pharmacist-manabi-sprint/scripts/validate_release.py

      - name: Swift syntax and native-source attribution regression
        shell: bash
        env:
          PREFLIGHT_PLACEHOLDER_ICON: '1'
        run: |
          set -euo pipefail
          swiftc -parse pharmacist-manabi-sprint/ios/*.swift pharmacist-manabi-sprint/ios/Tests/*.swift
          bash pharmacist-manabi-sprint/ios/prepare-ios.sh
          python3 - <<'PY'
          import json
          p='pharmacist-manabi-sprint/ios/Generated/questions.native.json'
          data=json.load(open(p,encoding='utf-8'))
          rows={q['id']:q for q in data['questions']}
          assert len(rows)==1035
          expected={
            'P109-025':'https://www.e-stat.go.jp/stat-search/files?layout=datalist&lid=000001306196&page=1',
            'P109-124':'https://www.stat.go.jp/data/jinsui/2022np/index.htm',
            'P110-122':'https://doi.org/10.1093/aje/kwn073',
            'P110-140':'https://www.env.go.jp/air/osen/pc_oxidant/kijun.html',
          }
          for qid,url in expected.items():
              assert rows[qid]['originalDataSourceURL']==url, qid
              assert len(rows[qid]['originalDataSourceTitle'])>8, qid
          assert sum(bool(q['originalDataSourceURL']) for q in rows.values())==4
          assert all(q['sourceURL'].startswith('https://') for q in rows.values())
          explanation=rows['P111-220']['explanation']
          assert all(w in explanation for w in ('NADPH','ソルビトール','反応5','反応1','反応2','反応3','反応4')), explanation
          assert rows['P111-220']['answer']==[4], 'official choice 5 zero-based'
          assert rows['P111-221']['answer']==[4], 'Q221 official choice 5 zero-based'
          assert all(w in rows['P111-221']['explanation'] for w in ('CYP2D6', 'セロトニン', 'ミロガバリン', '選択肢1', '4のデュロキセチン減量'))
          print('PASS: Swift syntax, four provenance links and aldose reductase teaching rationale')
          PY

      - name: Independent content readiness evidence (does not declare release PASS)
        shell: bash
        run: |
          set -euo pipefail
          python3 pharmacist-manabi-sprint/tools/release_readiness.py --out /tmp/pharmacist-release-readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pharmacist-release-readiness.json',encoding='utf-8'))
          assert d['counts']['questions']==1035
          assert d['counts']['images']==154
          assert d['counts']['legalCandidates']==107
          assert d['counts']['thirdPartyItems']==4
          assert d['counts']['genericExplanations'] <= 125, 'generic teaching explanations regressed or recent revisions not bundled'
          assert d['counts']['missingThirdPartyProvenance']==0
          assert d['structuralAuditPassIsNotContentApproval'] is True
          print('PASS: quality readiness report generated; Q0-Q5 retain evidence-based decisions')
          PY

      - name: Upload content readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: pharmacist-release-readiness
          path: /tmp/pharmacist-release-readiness.json
          retention-days: 14

      - name: Learning Acceptance Contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('pharmacist-manabi-sprint/ios')
          store=(root/'LearningStore.swift').read_text(encoding='utf-8')
          result=(root/'LearningStoreResultActions.swift').read_text(encoding='utf-8')
          quiz=(root/'QuizViews.swift').read_text(encoding='utf-8')
          home=(root/'RootAndHomeViews.swift').read_text(encoding='utf-8')
          history=(root/'HistorySettingsViews.swift').read_text(encoding='utf-8')
          combined='\n'.join((store,result,quiz,home,history))

          required={
            'start daily':'func startDaily(',
            'start field':'func startField(',
            'start mock':'func startMock(',
            'session persistence':'persist()',
            'interruption resume':'func resume()',
            'quit without losing progress':'func quitQuiz()',
            'unknown answer':'func revealUnknown()',
            'answer feedback':'AnswerFeedback(',
            'progress seen':'state.seen.insert(q.id)',
            'daily progress':'daily.answered += 1',
            'weak review':'func startWeak(',
            'wrong-only review':'func reviewWrongCurrent()',
            'retry current':'func repeatCurrentSession()',
            'weak graduation':'weak.streak',
            'result route':'route = .result',
            'learning record':'5週間の学習',
            'understanding aid':'ここだけ覚える',
          }
          missing=[f'{label}: {token}' for label,token in required.items() if token not in combined]
          if missing:
              raise SystemExit('Learning Acceptance Contract missing:\n- '+'\n- '.join(missing))

          # Release promise is full free access to all 1,031 scored questions.
          # Premium arguments may remain as a generic model shape, but all human
          # entry routes shipped in the no-IAP build must explicitly pass true.
          for token in ('startDaily(premium: true)','startWeak(premium: true)','premium: true'):
              if token not in combined:
                  raise SystemExit(f'no-IAP full-access route missing: {token}')

          print('PASS: pharmacist learning cycle=start-understand-progress-review-retry-resume')
          print('PASS: no-IAP human routes remain explicitly full-access')
          PY
