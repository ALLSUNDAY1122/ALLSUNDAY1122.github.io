name: Pharmacist Official Source Import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/tools/import_official_exams.py'
      - 'pharmacist-manabi-sprint/tools/validate_raw_import.py'
      - 'pharmacist-manabi-sprint/content/official-sources.json'
      - 'pharmacist-manabi-sprint/content/source-manifest.json'
      - 'pharmacist-manabi-sprint/content/mandatory-audit-v1.json'
      - 'pharmacist-manabi-sprint/content/theory-audit-v1.json'
      - 'pharmacist-manabi-sprint/content/practical-audit-v1.json'
      - '.github/workflows/pharmacist-source-extract.yml'

concurrency:
  group: pharmacist-official-source-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Import official exams 111, 110, 109
        id: import
        shell: bash
        run: |
          mkdir -p pharmacist-manabi-sprint/content/raw
          set +e
          python3 pharmacist-manabi-sprint/tools/import_official_exams.py > pharmacist-manabi-sprint/content/raw/import.log 2>&1
          code=$?
          set -e
          cat pharmacist-manabi-sprint/content/raw/import.log
          echo "$code" > pharmacist-manabi-sprint/content/raw/import.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Validate raw import
        id: rawaudit
        shell: bash
        run: |
          if [ "$(cat pharmacist-manabi-sprint/content/raw/import.exit)" != "0" ]; then
            echo 'SKIPPED: import failed' | tee pharmacist-manabi-sprint/content/raw/raw-validation.log
            echo '99' > pharmacist-manabi-sprint/content/raw/raw-validation.exit
            echo 'exit_code=99' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 pharmacist-manabi-sprint/tools/validate_raw_import.py > pharmacist-manabi-sprint/content/raw/raw-validation.log 2>&1
          code=$?
          set -e
          cat pharmacist-manabi-sprint/content/raw/raw-validation.log
          echo "$code" > pharmacist-manabi-sprint/content/raw/raw-validation.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit generated raw datasets and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/content/raw/
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'pharmacist: official exam raw loop result [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Enforce raw loop gate
        shell: bash
        run: |
          imp=$(cat pharmacist-manabi-sprint/content/raw/import.exit)
          raw=$(cat pharmacist-manabi-sprint/content/raw/raw-validation.exit)
          echo "import=$imp raw=$raw"
          test "$imp" = "0"
          test "$raw" = "0"
