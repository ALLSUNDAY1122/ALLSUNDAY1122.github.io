name: Pharmacist Official Source Extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/tools/extract_mhlw_pdfs.py'
      - '.github/workflows/pharmacist-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extractor dependency
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.3
      - name: Extract all official question blocks
        run: python pharmacist-manabi-sprint/tools/extract_mhlw_pdfs.py
      - name: Commit extracted audit inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/content/extracted/
          if git diff --cached --quiet; then
            echo 'No extraction changes.'
            exit 0
          fi
          git commit -m 'Extract 1035 pharmacist official question blocks'
          git push
