name: Pharmacist Official Source Extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pharmacist-manabi-sprint/tools/extract_mhlw_pdfs.py'
      - '.github/workflows/pharmacist-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extractor dependency
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.3
      - name: Extract all official question blocks and preserve log
        id: extract
        shell: bash
        run: |
          set +e
          mkdir -p pharmacist-manabi-sprint/content/extracted
          python pharmacist-manabi-sprint/tools/extract_mhlw_pdfs.py 2>&1 | tee pharmacist-manabi-sprint/content/extracted/extraction-ci.log
          rc=${PIPESTATUS[0]}
          printf '{"exitCode":%s,"commit":"%s"}\n' "$rc" "${GITHUB_SHA}" > pharmacist-manabi-sprint/content/extracted/run-status.json
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit extraction output even on FAIL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pharmacist-manabi-sprint/content/extracted/
          if git diff --cached --quiet; then
            echo 'No extraction changes.'
          else
            git commit -m 'pharmacist: source extraction loop result [skip ci]'
            git push
          fi
      - name: Enforce extraction PASS
        shell: bash
        run: |
          if [ "${{ steps.extract.outputs.exit_code }}" != "0" ]; then
            echo 'Official source extraction failed; see committed extraction-ci.log.'
            exit 1
          fi
