name: App Store Connect API Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'automation/app-store-connect-command.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gateway:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Execute App Store Connect command
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/app_store_connect_gateway.py
      - name: Persist sanitized API summary
        if: success() && hashFiles('asc-result.json') != ''
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source = json.loads(Path('asc-result.json').read_text(encoding='utf-8'))
          request_id = source.get('request_id') or 'unknown'
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,100}', request_id):
              raise SystemExit('Invalid request_id in asc-result.json')
          summary = {
              'request_id': request_id,
              'completed_at': source.get('completed_at'),
              'results': [],
          }

          for result in source.get('results', []):
              item = {
                  'label': result.get('label'),
                  'http_status': result.get('http_status'),
                  'data': [],
              }
              response = result.get('response') or {}
              data = response.get('data') or []
              if isinstance(data, dict):
                  data = [data]
              for resource in data:
                  if not isinstance(resource, dict):
                      continue
                  attrs = resource.get('attributes') or {}
                  item['data'].append({
                      'id': resource.get('id'),
                      'type': resource.get('type'),
                      'attributes': {
                          key: attrs.get(key)
                          for key in (
                              'name', 'bundleId', 'sku', 'primaryLocale',
                              'version', 'versionString', 'platform',
                              'appStoreState', 'appVersionState', 'state', 'betaReviewState',
                              'submitted', 'canceled',
                              'availableInNewTerritories', 'available', 'releaseDate',
                              'preOrderEnabled', 'preOrderPublishDate', 'contentStatuses',
                              'uploadedDate', 'processingState',
                              'expired', 'expirationDate', 'minOsVersion'
                          )
                          if key in attrs
                      },
                  })
              summary['results'].append(item)

          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          Path('automation/asc-last-result-summary.json').write_text(payload, encoding='utf-8')
          unique = Path('automation/asc-results') / f'{request_id}.json'
          unique.parent.mkdir(parents=True, exist_ok=True)
          unique.write_text(payload, encoding='utf-8')
          Path('/tmp/asc-unique-summary.json').write_text(payload, encoding='utf-8')
          Path('/tmp/asc-request-id.txt').write_text(request_id, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REQUEST_ID="$(cat /tmp/asc-request-id.txt)"
          UNIQUE_PATH="automation/asc-results/${REQUEST_ID}.json"
          git add automation/asc-last-result-summary.json "$UNIQUE_PATH"
          if git diff --cached --quiet; then
            echo "No sanitized status changes to persist"
            exit 0
          fi
          git commit -m "Persist sanitized App Store Connect status"
          if git push; then
            exit 0
          fi

          echo "Main advanced concurrently; preserving request-scoped result on latest main"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation/asc-results
          cp /tmp/asc-unique-summary.json "$UNIQUE_PATH"
          git add "$UNIQUE_PATH"
          if git diff --cached --quiet; then
            echo "Request-scoped result already persisted"
            exit 0
          fi
          git commit -m "Persist App Store Connect status for ${REQUEST_ID}"
          git push
      - name: Upload API result
        if: always() && hashFiles('asc-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-store-connect-result-${{ github.run_id }}
          path: asc-result.json
          retention-days: 7
