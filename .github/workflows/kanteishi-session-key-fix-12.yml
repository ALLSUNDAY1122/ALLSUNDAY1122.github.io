name: Kanteishi Session Key Fix

on:
  push:
    branches:
      - feat/kanteishi-shortanswer-sprint-12
    paths:
      - .github/workflows/kanteishi-session-key-fix-12.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanteishi-shortanswer-sprint-12
          fetch-depth: 0
      - name: Expose session starter to access policy
        run: sed -i 's/    private func startSession(/    func startSession(/' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/AppCore.swift
      - name: Commit exact fix
        run: |
          rm .github/workflows/kanteishi-session-key-fix-12.yml
          grep -Fq '    func startSession(' kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/AppCore.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(#12): preserve access-aware session keys'
          git push origin HEAD:feat/kanteishi-shortanswer-sprint-12
