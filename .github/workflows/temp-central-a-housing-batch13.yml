name: Temporary Central A Housing Batch 13

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch13-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch13-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 13
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T00:03:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions={
            '16202': {
              type:'current_child_addition_clarification',change:true,
              service:{status:'verified',summary:'令和8年度、対象区域の住宅取得・リフォーム等を補助し、若年子育て世帯・新婚世帯・三世代同居等には加算がある。',details:{programs:'たかおか暮らし支援事業、空き家バンク住宅取得支援事業等',homePurchase:'まちなか区域は住宅ローン費の5％・上限50万円、居住誘導区域は上限20万円',renovation:'対象リフォーム工事費の3分の1・上限20万円',vacantHouse:'空き家バンク登録物件取得費の5％・上限20万円',childCondition:'新築・購入・中古住宅取得・一戸建てリフォーム・空き家バンク住宅取得等で、若年子育て世帯、新婚世帯、三世代同居等の加算を実施',applicationTiming:'工事着工前または所有権移転前など、事業別の時期までに申請'},source:{url:'https://www.city.takaoka.toyama.jp/soshiki/kenchikuseisakuka/2/3/4/2521.html',checkedAt}}
            },
            '17201': {
              type:'child_specific_municipal_housing_scope_clarification',change:true,
              service:{status:'verified',summary:'18歳年度末までの子がいる子育て世帯等だけが応募できる市営住宅募集枠を設ける場合があり、令和8年度の定期・随時募集を実施する。',details:{program:'金沢市営住宅の子育て世帯等優遇募集',childDefinition:'18歳に達する日以後の最初の3月31日までにある子がいる世帯',priority:'子育て世帯、ひとり親家庭、多人数世帯、若年夫婦世帯等だけが応募できる募集枠を設ける場合がある',currentRecruitment:'令和8年度は定期募集を年3回予定し、随時募集物件は毎月更新する',conditions:'住宅困窮、所得、住所または勤務、市税滞納なし等の市営住宅入居要件を満たす必要がある'},source:{url:'https://www4.city.kanazawa.lg.jp/soshikikarasagasu/jutakuseisakuka/yokuarushitsumon_1/3116.html',checkedAt},additionalSources:[{url:'https://www4.city.kanazawa.lg.jp/kurashi_tetsuzuki/sumai/shieijutaku/14057.html',checkedAt,description:'令和8年度市営住宅の定期募集予定と随時募集'}]}
            },
            '23100': {
              type:'current_child_housing_package_source_upgrade',change:true,
              service:{status:'verified',summary:'18歳以下の子がいる世帯等へ、定住促進住宅・公社賃貸住宅の家賃20％減額を最大10年間行い、家賃補助付き子育て世帯専用住戸等も提供する。',eligibility:{residency:'制度・物件ごとの入居要件を満たすこと',householdCondition:'18歳に達する日以後最初の3月31日までの子ども、または妊娠している方がいる世帯等',incomeCondition:'家賃補助付き子育て世帯専用住戸は所得月額214,000円以下。子ども3人以上は259,000円以下'},details:{project:'なごや子ども住まいるプロジェクト',rentReduction:'定住促進住宅と公社賃貸住宅は家賃20％減額。令和6年4月1日以降の新規入居世帯は最大10年間',safetyNetHousing:'入居者を子育て世帯または新婚世帯に限定した家賃減額補助付きセーフティネット住宅を実施',currentAvailability:'令和8年度選定住戸・空室戸数・補助後家賃を公式ページで更新',otherSupport:'市営住宅の子育て・若年世帯募集、中古住宅取得の融資利子補給、子どもあんしん住まいる補助金等も実施'},source:{url:'https://www.city.nagoya.jp/kurashi/juutaku/1014573/1014580.html',checkedAt},additionalSources:[{url:'https://www.city.nagoya.jp/kurashi/juutaku/1014583/1014635/1014638.html',checkedAt,description:'公社賃貸住宅の家賃20％減額を最大10年間'},{url:'https://www.city.nagoya.jp/kurashi/juutaku/1014583/1014635/1040294.html',checkedAt,description:'令和8年度の家賃補助付き子育て世帯専用住戸・空室・所得要件'},{url:'https://www.city.nagoya.jp/kurashi/juutaku/1014583/1014585/1014622/1034009.html',checkedAt,description:'定住促進住宅の子育て世帯家賃20％減額'}]}
            },
            '25442': {
              type:'current_fiscal_period_unconfirmed',change:true,
              service:{status:'unavailable',summary:'結婚新生活支援の現行要綱は確認できるが、2026年度の婚姻・支払・申請対象期間を利用者向け公式情報で確定できない。',details:{confirmedRule:'現行要綱では、夫婦とも39歳以下・合算所得500万円未満等の新婚世帯を対象に、町内住宅の取得費・賃借費の3分の2を補助する',ruleMaximum:'夫婦とも29歳以下は上限60万円、39歳以下は上限40万円',missingCurrentConditions:'要綱が町長の別途指定に委ねる2026年度の婚姻日、支払対象期間、申請期限を公開情報で確認できない',handling:'年度の対象期間と受付状況を企画監理課等へ確認するまで、2026年度に利用可能とは断定しない'},source:{url:'https://www.kouratown.jp/section/reiki_int/reiki_honbun/k032RG00001041.html',checkedAt},additionalSources:[{url:'https://www.kouratown.jp/cyonososhiki/somuka/zaiseikakari/zaisei/1385622361935.html',checkedAt,description:'令和8年度当初予算概要の入口。利用者向け申請条件の単独根拠にはしない'}]}
            },
            '24216': {type:'retained_verified_direct_child_program',change:false,review:'市外から転入する中学生以下の子がいる世帯は中古住宅取得費の2分の1・上限50万円、空き家バンク物件は10万円加算という直接的な子育て要件を現行公式移住ポータルで確認したためverifiedを維持する。'}
          };

          const records=[];
          for(const [code,entry] of Object.entries(decisions)){
            const pref=code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(entry.change){municipality.services.housingSupport=entry.service;municipality.updatedAt=checkedAt;fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');}
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';task.currentService=null;task.nextServiceIndex=9;task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;task.researchingCount=statuses.filter(v=>v==='researching').length;task.unavailableCount=statuses.filter(v=>v==='unavailable').length;task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';task.pullRequestNumber=Number(process.env.PR_NUMBER);task.lastCheckedAt=checkedAt;task.lastUpdatedAt=updatedAt;task.lastUpdatedBy='統括B②';task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第13群で公式情報を再確認し、${entry.type}として判定。`];task.blockers=task.blockers||[];fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            const after=municipality.services.housingSupport;
            records.push({code,name:municipality.name,service:'housingSupport',decisionType:entry.type,changed:entry.change,beforeStatus:before.status,afterStatus:after.status,beforeSummary:before.summary,afterSummary:after.summary,officialSource:after.source.url,review:entry.review||null});
          }

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch13-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:4,retainedNoChangeCount:1,statusToUnavailableCount:1,verifiedClarificationOrSourceUpgradeCount:3,decisions:records,causeScan:{previousRemainingCandidates:114,reviewedHighRiskCandidates:5,remainingCandidates:109},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['制度一覧だけでなく、子育て・新婚の対象条件が直接分かる現行利用者向けページを優先する','年度ごとの対象期間を要綱が別途指定に委ねる場合、当該年度の受付条件を確認できなければ利用可能と断定しない','子育て要件が明確な制度は金額・年齢・加算を要約へ反映する'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch13-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.ciStatus='success';checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.nextAction='一般住宅・移住制度の分類候補残109件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。';checkpoint.qualityReaudit.latestCompletedAt=updatedAt;checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=119;checkpoint.qualityReaudit.primarySourceSlotsRechecked=551;checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=109;
          checkpoint.qualityReaudit.confirmedCorrections.push({type:'current_child_addition_clarification',code:'16202',service:'housingSupport',name:'高岡市'},{type:'child_specific_municipal_housing_scope_clarification',code:'17201',service:'housingSupport',name:'金沢市'},{type:'current_child_housing_package_source_upgrade',code:'23100',service:'housingSupport',name:'名古屋市'},{type:'current_fiscal_period_unconfirmed',code:'25442',service:'housingSupport',name:'甲良町'});
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残109件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];checkpoint.lastAction='住宅支援分類第13群で高岡市・金沢市・名古屋市の子育て条件と主出典を明確化し、甲良町は2026年度対象期間未確認のためunavailableへ修正。伊賀市は直接的な子育て制度を確認してverifiedを維持した。';fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          const regionPath=path.join(root,'operations/control/regions/central.json');const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));region.updatedAt=updatedAt;region.latestCentralAHousingBatch={batch:13,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,correctedMunicipalityCount:4,retainedMunicipalityCount:1,remainingCandidates:109,regionalPullRequestNumber:Number(process.env.PR_NUMBER),workflowRunId:Number(process.env.RUN_ID),blocker:null};region.lastAction=checkpoint.lastAction;fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch13-trigger-20260726.json');if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/16/16202.json|jichitai-compare/data/municipalities/17/17201.json|jichitai-compare/data/municipalities/23/23100.json|jichitai-compare/data/municipalities/25/25442.json|jichitai-compare/operations/tasks/16202.json|jichitai-compare/operations/tasks/17201.json|jichitai-compare/operations/tasks/23100.json|jichitai-compare/operations/tasks/24216.json|jichitai-compare/operations/tasks/25442.json|jichitai-compare/operations/audits/central-a-housing-classification-batch13-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/16202/index.html|jichitai-compare/municipality/17201/index.html|jichitai-compare/municipality/23100/index.html|jichitai-compare/municipality/25442/index.html|jichitai-compare/operations/control/central-a-housing-batch13-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第13群を判定'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
