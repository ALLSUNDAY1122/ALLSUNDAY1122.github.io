name: Temporary Fix Sapporo Bulky Waste

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-sapporo-bulky.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update region and main correction branches
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            '+refs/heads/fix/01100-sapporo-bulky-region:refs/remotes/origin/fix/01100-sapporo-bulky-region' \
            '+refs/heads/fix/01100-sapporo-bulky-main:refs/remotes/origin/fix/01100-sapporo-bulky-main'
          for branch in fix/01100-sapporo-bulky-region fix/01100-sapporo-bulky-main; do
            git checkout -B "$branch" "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          municipality_path = Path('jichitai-compare/data/municipalities/01/01100.json')
          task_path = Path('jichitai-compare/operations/tasks/01100.json')
          municipality = json.loads(municipality_path.read_text(encoding='utf-8'))
          task = json.loads(task_path.read_text(encoding='utf-8'))

          municipality['status'] = 'verified'
          municipality['summary'] = '9制度すべてを公式情報で確認済み。大型ごみの減免は対象区分を推測せず、条例・施行規則と電話申込手続を登録。'
          municipality['updatedAt'] = '2026-07-22'
          bulky = municipality['services']['bulkyWaste']
          bulky['status'] = 'verified'
          bulky['summary'] = '指定袋に入らない家庭の大型ごみを戸別有料収集。減免申請は電話受付で、条例・施行規則に基づく申請と承認の手続がある。'
          details = bulky['details']
          details['reduction'] = '札幌市条例第47条に基づき、市長が一般廃棄物処理手数料を減額または免除できる。大型ごみの公式案内ではインターネット受付の対象外で、大型ごみ収集センターへの電話申込が必要。'
          details['reductionProcedure'] = '札幌市廃棄物の減量及び処理に関する条例施行規則第22条により、原則として一般廃棄物処理手数料減額（免除）申請書を提出し、承認時に承認書が交付される。具体的な適用可否は申込時に確認する。'
          details['officialRegulationPage'] = 'https://www.city.sapporo.jp/ncms/reiki/d1w_reiki/H405902100009/H405902100009_j.html'
          details.pop('reviewReason', None)
          bulky['source']['checkedAt'] = '2026-07-22'

          services = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention']
          task['status'] = 'merged'
          task['currentService'] = None
          task['nextServiceIndex'] = 9
          task['completedServices'] = services
          task['verifiedCount'] = 9
          task['researchingCount'] = 0
          task['unavailableCount'] = 0
          task['needsMediumReviewCount'] = 0
          task['lastCheckedAt'] = '2026-07-22'
          task['lastUpdatedAt'] = '2026-07-22T15:45:00+09:00'
          task['lastUpdatedBy'] = '全国進行統括'
          sources = task.setdefault('officialSources', [])
          for url in [
              'https://www.city.sapporo.jp/seiso/gomi/oogatagomi.html',
              'https://www.city.sapporo.jp/seiso/gomi/oogatagomi_02.html',
              'https://www.city.sapporo.jp/ncms/reiki/d1w_reiki/H405902100009/H405902100009_j.html'
          ]:
              if url not in sources:
                  sources.append(url)
          task.setdefault('notes', []).append('2026-07-22に大型ごみの減免について、対象区分を推測せず、公式大型ごみ案内の電話申込と施行規則第22条の申請・承認手続までを確認済み情報として登録。bulkyWasteをverifiedへ変更し、9制度すべてを確認済みとした。')
          task['blockers'] = []

          municipality_path.write_text(json.dumps(municipality, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          task_path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add jichitai-compare/data/municipalities/01/01100.json jichitai-compare/operations/tasks/01100.json
            git commit -m 'fix: 札幌市大型ごみの減免手続を公式例規で確定'
            git push origin "$branch"
          done
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-fix-sapporo-bulky.yml
          git commit -m '統括管理: 札幌市補正一時ワークフローを削除'
          git push origin main
