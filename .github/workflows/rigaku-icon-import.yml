name: Rigaku Canonical AppIcon Import

on:
  pull_request:
    paths:
      - '.github/workflows/rigaku-icon-import.yml'

permissions:
  contents: write

concurrency:
  group: rigaku-icon-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download exact canonical Drive asset
        env:
          CANONICAL_DRIVE_FILE_ID: 1RvSyvCapkoon09U4HbYNM1e4v5V29LVY
        run: |
          set -euo pipefail
          target='rigaku-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          mkdir -p "$(dirname "$target")"
          curl -L --fail --retry 2 \
            "https://drive.usercontent.google.com/download?id=${CANONICAL_DRIVE_FILE_ID}&export=download&confirm=t" \
            -o "$target"

          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path('rigaku-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Downloaded file is not PNG')
          if data[12:16] != b'IHDR':
              raise SystemExit('PNG IHDR missing')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1024, 1024):
              raise SystemExit(f'Expected 1024x1024, got {width}x{height}')
          if len(data) != 663589:
              raise SystemExit(f'Canonical size mismatch: expected 663589, got {len(data)}')
          print(f'canonical AppIcon verified: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit canonical icon once
        run: |
          if ! git diff --quiet -- rigaku-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rigaku-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png
            git commit -m "feat(rigaku): import canonical AppIcon #15"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
