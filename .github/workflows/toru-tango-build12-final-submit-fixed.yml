name: Toru Tango Build12 Final Submit Fixed

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: toru-tango-build12-final-submit-fixed
  cancel-in-progress: false

env:
  APP_BUNDLE_ID: com.allsunday1122.torutango
  EXPO_PUBLIC_SCREENSHOT_FIXTURES: '1'
  CI: '1'

jobs:
  finalize:
    if: github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[TORU-TANGO] Build12 Final Submit Fixed'
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Report workflow start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Build 12 fixed final submission started. run_id=${context.runId}`
            })

      - name: Checkout main tooling
        uses: actions/checkout@v4
        with:
          path: main-src

      - name: Checkout exact Build 12 source
        uses: actions/checkout@v4
        with:
          ref: release/toru-tango-build12-20260923
          path: release-src

      - name: Select newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -1)
          test -n "$latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: release-src/toru-tango-mobile/package-lock.json

      - name: Install dependencies
        working-directory: release-src/toru-tango-mobile
        run: npm ci

      - name: Inject screenshot-only sample data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release-src/toru-tango-mobile/src/repositories/storage.ts')
          text=p.read_text(encoding='utf-8')
          marker="  return {\n    cards,\n    history,\n    decks: normalizeDecks([...storedDecks, ...decksFromCards]),\n    studyDays: normalizeStudyDays([...storedStudyDays, ...legacyStudyDays])\n  };"
          if marker not in text:
              raise SystemExit('storage fixture injection marker not found')
          lines=[
            "  if (!cards.length && process.env.EXPO_PUBLIC_SCREENSHOT_FIXTURES === '1') {",
            "    const now = '2026-09-23T00:00:00.000Z';",
            "    const fixtureCards: Card[] = [",
            "      { id:'m1', question:'abandon', answer:'捨てる・断念する', deckName:'メイン', correct:5, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now },",
            "      { id:'m2', question:'accurate', answer:'正確な', deckName:'メイン', correct:4, wrong:0, lastStudiedAt:now, createdAt:now, updatedAt:now },",
            "      { id:'k1', question:'いとをかし', answer:'とても趣がある', deckName:'古文', correct:3, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now },",
            "      { id:'e1', question:'implement', answer:'実行する・実装する', deckName:'英語', correct:2, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now },",
            "      { id:'h1', question:'大政奉還が行われた年は？', answer:'1867年', deckName:'世界史', correct:2, wrong:1, lastStudiedAt:now, createdAt:now, updatedAt:now },",
            "      { id:'g1', question:'日本で最も面積が大きい都道府県は？', answer:'北海道', deckName:'地理', correct:4, wrong:0, lastStudiedAt:now, createdAt:now, updatedAt:now }",
            "    ];",
            "    const fixtureHistory: StudyHistory[] = [",
            "      { id:'r1', cardId:'m1', answeredAt:now, dateKey:'2026-09-23', correct:true },",
            "      { id:'r2', cardId:'k1', answeredAt:now, dateKey:'2026-09-23', correct:false }",
            "    ];",
            "    return { cards: fixtureCards, history: fixtureHistory, decks: ['古文','メイン','英語','漢文','世界史','地理'], studyDays: ['2026-09-23'] };",
            "  }",
            ""
          ]
          p.write_text(text.replace(marker,'\n'.join(lines)+marker),encoding='utf-8')
          PY

      - name: Validate Build 12 source
        working-directory: release-src/toru-tango-mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "buildNumber: '12'" app.config.ts
          grep -q 'フォルダ名を編集' 'app/(tabs)/cards.tsx'
          grep -q '並べ替え完了' 'app/(tabs)/cards.tsx'
          npm run typecheck
          npm run lint

      - name: Generate native iOS project
        working-directory: release-src/toru-tango-mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: release-src/toru-tango-mobile/ios
        run: pod install

      - name: Pick accepted large-iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          rows=[]
          for runtime,items in data.get('devices',{}).items():
              if 'iOS' in runtime:
                  rows.extend([x for x in items if x.get('isAvailable') and str(x.get('name','')).startswith('iPhone')])
          preferred=['iPhone 16 Pro Max','iPhone 16 Plus','iPhone 15 Pro Max','iPhone 15 Plus','iPhone 14 Pro Max']
          hit=None
          for name in preferred:
              hit=next((x for x in rows if x.get('name')==name),None)
              if hit: break
          if not hit:
              raise SystemExit('No accepted large-iPhone simulator available')
          Path('/tmp/toru-shot-udid').write_text(hit['udid'])
          Path('/tmp/toru-shot-device').write_text(hit['name'])
          print(hit['name'],hit['udid'])
          PY

      - name: Build app with CocoaPods workspace
        working-directory: release-src/toru-tango-mobile
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print | head -1)
          test -n "$workspace"
          echo "workspace=$workspace"
          case "$workspace" in
            *.xcodeproj/project.xcworkspace) echo 'Refusing internal Xcode project workspace'; exit 1 ;;
          esac
          scheme=$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          udid=$(cat /tmp/toru-shot-udid)
          EXPO_PUBLIC_SCREENSHOT_FIXTURES=1 xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath /tmp/toru-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=$(find /tmp/toru-derived/Build/Products -path '*Release-iphonesimulator/*.app' -print | head -1)
          test -n "$app"
          echo "$app" > /tmp/toru-app-path

      - name: Capture four App Store screenshots
        shell: bash
        run: |
          set -euo pipefail
          udid=$(cat /tmp/toru-shot-udid)
          app=$(cat /tmp/toru-app-path)
          mkdir -p /tmp/toru-final-screens
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time '9:41' --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --terminate-running-process "$udid" "$APP_BUNDLE_ID"
          sleep 8
          capture() {
            name="$1"
            out="/tmp/toru-final-screens/${name}.png"
            xcrun simctl io "$udid" screenshot "$out"
            width=$(sips -g pixelWidth "$out" | awk '/pixelWidth/{print $2}')
            height=$(sips -g pixelHeight "$out" | awk '/pixelHeight/{print $2}')
            echo "$name ${width}x${height} device=$(cat /tmp/toru-shot-device)"
            case "${width}x${height}" in
              1260x2736|1290x2796|1320x2868|1284x2778|1242x2688) ;;
              *) echo "Unexpected App Store screenshot size: ${width}x${height}"; exit 1 ;;
            esac
          }
          capture '01-folders'
          xcrun simctl openurl "$udid" 'torutango://create'
          sleep 3
          capture '02-create'
          xcrun simctl openurl "$udid" 'torutango://study'
          sleep 3
          capture '03-study'
          xcrun simctl openurl "$udid" 'torutango://records'
          sleep 3
          capture '04-records'

      - name: Submit existing Apple Build 12 for App Review
        working-directory: main-src
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import sys
          import toru_tango_finalize_submission as submitter
          submitter.BUILD='12'
          sys.argv=['toru_tango_finalize_submission.py','--screens','/tmp/toru-final-screens','--output','/tmp/toru-build12-final-result.json']
          submitter.main()
          PY

      - name: Verify final submission result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/toru-build12-final-result.json').read_text(encoding='utf-8'))
          if r.get('submitted') is not True:
              raise SystemExit(f'not submitted: {r}')
          if r.get('review_submission_state') not in {'WAITING_FOR_REVIEW','IN_REVIEW','COMPLETING','PENDING_DEVELOPER_RELEASE','READY_FOR_SALE','PROCESSING_FOR_DISTRIBUTION'}:
              raise SystemExit(f'unexpected review state: {r.get("review_submission_state")}')
          if r.get('release_type') != 'MANUAL':
              raise SystemExit(f'release type is not MANUAL: {r.get("release_type")}')
          if r.get('release_performed') is not False:
              raise SystemExit('unexpected release performed')
          print(json.dumps(r,ensure_ascii=False))
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toru-tango-build12-final-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/toru-final-screens
            /tmp/toru-build12-final-result.json
            /tmp/toru-shot-device
          if-no-files-found: warn
          retention-days: 30

      - name: Report final result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const lines=['撮る単語帳 Build 12 fixed final App Review result.'];
            if(fs.existsSync('/tmp/toru-build12-final-result.json')) {
              const r=JSON.parse(fs.readFileSync('/tmp/toru-build12-final-result.json','utf8'));
              lines.push(`submitted=${r.submitted}`);
              lines.push(`review_submission_state=${r.review_submission_state||''}`);
              lines.push(`apple_build_id=${r.build_id||''}`);
              lines.push(`build_processing_state=${r.build_processing_state||''}`);
              lines.push(`build_attached=${r.build_attached||false}`);
              lines.push(`complete_screenshot_count=${r.complete_screenshot_count||0}`);
              lines.push(`screenshots_uploaded_new=${r.screenshots_uploaded_new||0}`);
              lines.push(`release_type=${r.release_type||''}`);
              lines.push(`release_performed=${r.release_performed}`);
              if(r.error) lines.push(`error=${r.error}`);
            } else {
              lines.push('submitted=false');
              lines.push('error=workflow_failed_before_final_submission_result');
            }
            lines.push(`job_status=${{ toJSON(job.status) }}`);
            lines.push(`run_id=${context.runId}`);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:lines.join('\n')});
