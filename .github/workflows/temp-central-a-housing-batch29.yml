name: Temporary Central A Housing Batch 29

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch29-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch29-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 29
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T17:30:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions=[
            {code:'21403',name:'大野町',type:'general_home_acquisition_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.town-ono.jp/0000001884.html',basis:'現行の新築住宅移住定住補助金は町内で新築住宅を取得する一般世帯を対象とし、子育て・新婚・三世代を対象要件としない'},
            {code:'22223',name:'御前崎市',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年度の結婚新生活支援として、婚姻に伴う住宅取得・賃借・リフォーム・引越費用を、夫婦の年齢に応じ最大60万円補助する。',source:'https://www.city.omaezaki.shizuoka.jp/soshiki/kikakuseisaku/ijyuteijyu/5915.html',basis:'夫婦双方39歳以下等を対象とする令和8年度の現行結婚新生活支援を確認'},
            {code:'23213',name:'西尾市',type:'three_generation_housing_conditions_clarified',status:'verified',summary:'別居する親世帯と孫を含む子世帯が新たに三世代同居・隣居するための住宅新築・増改築・リフォーム費の2分の1を、上限30万円補助する。',source:'https://www.city.nishio.aichi.jp/kurashi/sumai/1001389/1002315.html',basis:'孫を含む子世帯と親世帯の三世代同居・隣居、新築・増改築・リフォーム、上限30万円の現行条件を確認'},
            {code:'23227',name:'高浜市',type:'general_migration_employment_support_misclassification',status:'unavailable',summary:'子育て世帯・新婚世帯・三世代世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。',source:'https://www.city.takahama.lg.jp/soshiki/keizai/12790.html',basis:'現行の移住定住就業支援は東京圏からの移住・就業等を要件とする一般移住支援で、住宅費や子育て世帯を対象要件とする制度ではない'},
            {code:'23441',name:'阿久比町',type:'current_three_generation_housing_verified_maintained',status:'verified',summary:'三世代同居または近居のために住宅を新築・購入する世帯へ、最大30万円を交付する。',source:'https://www.town.agui.lg.jp/0000007799.html',basis:'親・子・孫の三世代同居・近居を対象とする現行制度と上限30万円を確認'}
          ];

          function writePreservingStyle(file,obj){
            const raw=fs.readFileSync(file,'utf8');
            const pretty=raw.startsWith('{\n');
            fs.writeFileSync(file,JSON.stringify(obj,null,pretty?2:0)+'\n');
          }

          const reviewed=[];
          for(const decision of decisions){
            const pref=decision.code.slice(0,2);
            const dataPath=path.join(root,'data/municipalities',pref,`${decision.code}.json`);
            const taskPath=path.join(root,'operations/tasks',`${decision.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const svc=municipality.services?.housingSupport;
            if(!svc)throw new Error(`${decision.code}: missing housingSupport`);
            const before={status:svc.status,summary:svc.summary,source:svc.source?.url};
            svc.status=decision.status;
            svc.summary=decision.summary;
            svc.source={url:decision.source,checkedAt};
            if(decision.code==='21403'){
              svc.details={
                reviewedProgram:'大野町新築住宅の移住定住補助金',
                generalSupport:'町内で新築・建替え・新築住宅購入を行う世帯へ30万円、町外からの転入世帯は10万円を加算',
                classificationReason:'子育て世帯・新婚世帯・三世代世帯を対象要件としない一般定住・住宅取得制度のため、子育て住宅支援としては対象外'
              };
            }
            if(decision.code==='22223'){
              svc.details={
                program:'御前崎市結婚新生活支援補助金',
                eligibleHouseholds:'令和8年度に婚姻し、夫婦双方が婚姻日に39歳以下等の要件を満たす世帯',
                coveredCosts:'住宅購入費、賃料、敷金、礼金、共益費、仲介手数料、リフォーム費、引越費',
                maximum:'夫婦の年齢が高い方が29歳以下は最大60万円、39歳以下は最大30万円',
                conditions:'対象住宅が御前崎市内にあり、夫婦双方または一方が当該住宅に住所を置くこと等'
              };
            }
            if(decision.code==='23213'){
              svc.details.program='西尾市三世代同居対応住宅支援事業補助金';
              svc.details.familyTarget='別居する親世帯と、孫を含む子世帯が新たに三世代同居または隣接敷地で隣居する世帯';
              svc.details.coverage='三世代同居・隣居のための新築、増築、改築、リフォーム工事';
              svc.details.rate='工事費の2分の1';
              svc.details.maximum='上限30万円';
              svc.details.residency='工事後、子世帯全員が親世帯と5年以上同居・隣居すること等';
            }
            if(decision.code==='23227'){
              svc.details={
                reviewedProgram:'高浜市移住定住就業支援事業補助金',
                generalSupport:'東京圏から高浜市へ移住し、市内対象企業への就業・対象起業・関係人口就業等の要件を満たす場合、単身60万円・世帯100万円',
                classificationReason:'住宅取得・改修・家賃または子育て世帯を対象要件としない一般移住・就業支援のため、子育て住宅支援としては対象外'
              };
            }
            municipality.updatedAt=checkedAt;
            writePreservingStyle(dataPath,municipality);

            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第29群で公式利用者向けページを独立確認し、${decision.type}として判定。`];
            task.blockers=task.blockers||[];
            writePreservingStyle(taskPath,task);

            reviewed.push({code:decision.code,name:decision.name,service:'housingSupport',correctionType:decision.type,beforeStatus:before.status,afterStatus:decision.status,beforeSummary:before.summary,afterSummary:decision.summary,officialSource:decision.source,officialBasis:decision.basis,contentChanged:before.status!==decision.status||before.summary!==decision.summary||before.source!==decision.source});
          }

          const audit={
            schemaVersion:'1.0.0',
            auditId:'central-a-housing-classification-batch29-decisions-20260726',
            decidedAt:updatedAt,
            session:'中日本調査班A',
            coordinatorSession:'統括B',
            category:'generalHousingMisclassification',
            regionalPullRequestNumber:Number(process.env.PR_NUMBER),
            runnerWorkflowRunId:Number(process.env.RUN_ID),
            reviewedMunicipalityCount:5,
            confirmedCorrectionCount:4,
            statusToUnavailableCount:2,
            verifiedReplacementOrClarificationCount:2,
            verifiedMaintainedCount:1,
            reviewed,
            causeScan:{previousRemainingCandidates:34,reviewedHighRiskCandidates:5,remainingCandidates:29},
            issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},
            policy:[
              '一般定住・住宅取得制度は子育て等の対象要件がなければ子育て住宅支援に分類しない',
              '一般移住・就業支援は住宅費または子育て世帯固有の支援でなければ住宅支援に分類しない',
              '三世代同居・近居制度は家族世帯向け住宅支援としてverified対象に含める',
              '結婚新生活支援は新婚世帯向け住宅支援としてverified対象に含める'
            ],
            result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}
          };
          fs.writeFileSync(path.join(root,'operations/audits/central-a-housing-classification-batch29-decisions-20260726.json'),JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.stateSyncPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.nextAction='一般住宅・移住制度の分類候補残29件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=199;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=631;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=29;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残29件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:29,status:'regional_corrected_pending_national_sync',reviewedMunicipalityCount:5,confirmedCorrectionCount:4,statusToUnavailableCount:2,verifiedReplacementOrClarificationCount:2,verifiedMaintainedCount:1,remainingCandidates:29,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第29群として、大野町・高浜市をunavailableへ修正し、御前崎市を結婚新生活支援へ差し替え、西尾市の三世代条件を明確化、阿久比町はverifiedを維持した。';
          writePreservingStyle(checkpointPath,checkpoint);

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          writePreservingStyle(regionPath,region);

          const trigger=path.join(root,'operations/control/central-a-housing-batch29-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/21/21403.json|jichitai-compare/data/municipalities/22/22223.json|jichitai-compare/data/municipalities/23/23213.json|jichitai-compare/data/municipalities/23/23227.json|jichitai-compare/data/municipalities/23/23441.json|jichitai-compare/operations/tasks/21403.json|jichitai-compare/operations/tasks/22223.json|jichitai-compare/operations/tasks/23213.json|jichitai-compare/operations/tasks/23227.json|jichitai-compare/operations/tasks/23441.json|jichitai-compare/operations/audits/central-a-housing-classification-batch29-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/21403/index.html|jichitai-compare/municipality/22223/index.html|jichitai-compare/municipality/23213/index.html|jichitai-compare/municipality/23227/index.html|jichitai-compare/municipality/23441/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch29-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第29群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
