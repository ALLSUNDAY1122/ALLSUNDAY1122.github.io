name: Temporary West B Cycle 07 Source Fix

on:
  push:
    branches:
      - fix/west-b-cycle07-source-maintenance-20260725

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-cycle07-source-maintenance-20260725
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update four current official sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.join(process.cwd(), 'jichitai-compare');
          const changes = [
            {
              code: '42210', pref: '42', service: 'bulkyWaste',
              oldUrl: 'https://www.city.iki.nagasaki.jp/kurashi/seikatsu/gomi/2892.html',
              newUrl: 'https://www.city.iki.nagasaki.jp/kurashi/seikatsu/gomi/dashikata/2892.html',
              note: '概略検証第7回で粗大ごみ主出典の移転を確認し、現行のごみ分別ガイドブックへ更新。'
            },
            {
              code: '42212', pref: '42', service: 'sickChildCare',
              oldUrl: 'https://www.city.saikai.nagasaki.jp/soshiki/kodomo/1/2/5/1606.html',
              newUrl: 'https://www.city.saikai.nagasaki.jp/soshiki/kenko/2/2_1/5/1606.html',
              note: '概略検証第7回で病児保育主出典の組織改編後URLを確認し、現行ページへ更新。'
            },
            {
              code: '42308', pref: '42', service: 'schoolMeals',
              oldUrl: 'https://www.town.togitsu.nagasaki.jp/material/files/group/21/syuugakuenjozai.pdf',
              newUrl: 'https://www.town.togitsu.nagasaki.jp/kurashi_joho/nyuen_nyugaku/7801.html',
              note: '概略検証第7回で令和8年度就学援助の旧PDF失効を確認し、現行HTML案内へ更新。'
            },
            {
              code: '44210', pref: '44', service: 'disasterPrevention',
              oldUrl: 'https://www.city.kitsuki.lg.jp/1/kikikanri/bousai/saigai/index.html',
              newUrl: 'https://www.city.kitsuki.lg.jp/soshiki/1/kikikanri/hinan/854.html',
              note: '概略検証第7回で防災ページの旧階層失効を確認し、現行ハザードマップへ更新。'
            }
          ];

          for (const change of changes) {
            const sourcePath = path.join(root, 'data', 'municipalities', change.pref, `${change.code}.json`);
            const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
            const service = source.services?.[change.service];
            if (!service?.source) throw new Error(`Missing service source: ${change.code} ${change.service}`);
            if (service.source.url !== change.oldUrl) throw new Error(`Unexpected old URL for ${change.code}: ${service.source.url}`);
            service.source.url = change.newUrl;
            service.source.checkedAt = '2026-07-25';
            source.updatedAt = '2026-07-25';
            fs.writeFileSync(sourcePath, JSON.stringify(source, null, 2) + '\n');

            const taskPath = path.join(root, 'operations', 'tasks', `${change.code}.json`);
            const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
            if (Array.isArray(task.officialSources)) {
              task.officialSources = task.officialSources.map(url => url === change.oldUrl ? change.newUrl : url);
              if (!task.officialSources.includes(change.newUrl)) task.officialSources.push(change.newUrl);
            }
            task.lastCheckedAt = '2026-07-25';
            task.lastUpdatedAt = '2026-07-25T02:43:00+09:00';
            task.lastUpdatedBy = '西日本調査班B';
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            if (!task.notes.includes(change.note)) task.notes.push(change.note);
            fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          }
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm .github/workflows/temp-west-b-cycle07-source-fix.yml
          rm -f .github/west-b-cycle07-source-fix.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare/data/municipalities/42/42210.json
          git add jichitai-compare/data/municipalities/42/42212.json
          git add jichitai-compare/data/municipalities/42/42308.json
          git add jichitai-compare/data/municipalities/44/44210.json
          git add jichitai-compare/operations/tasks/42210.json
          git add jichitai-compare/operations/tasks/42212.json
          git add jichitai-compare/operations/tasks/42308.json
          git add jichitai-compare/operations/tasks/44210.json
          git add jichitai-compare/data/generated/municipalities.json
          git add jichitai-compare/municipality/42210/index.html
          git add jichitai-compare/municipality/42212/index.html
          git add jichitai-compare/municipality/42308/index.html
          git add jichitai-compare/municipality/44210/index.html
          git add jichitai-compare/operations/progress.json
          git add .github/workflows/temp-west-b-cycle07-source-fix.yml
          git add .github/west-b-cycle07-source-fix.trigger
          git commit -m "fix: 西日本B第7回の移転済み公式出典4件を更新"
          git push origin HEAD:fix/west-b-cycle07-source-maintenance-20260725
