name: Temporary Central A Housing Batch 20 Public Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch20-public-trigger-20260726.json

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/central-a-housing-batch20-public-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and generated JSON
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const unavailable='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const targets=[
            {code:'23562',name:'東栄町',status:'unavailable',summary:unavailable,source:'https://www.town.toei.aichi.jp/1990.htm'},
            {code:'24205',name:'桑名市',status:'unavailable',summary:unavailable,source:'https://www.city.kuwana.lg.jp/sdgs/20230530.html'},
            {code:'24303',name:'木曽岬町',status:'verified',summary:'39歳以下・年間所得500万円未満の新婚世帯へ、2026年度の住居費や引越費用等を補助し、申請期限は2027年3月31日とする。',source:'https://www.town.kisosaki.lg.jp/0000002515.html'},
            {code:'24341',name:'菰野町',status:'unavailable',summary:unavailable,source:'https://www2.town.komono.mie.jp/soshiki/10/1591.html'},
            {code:'24442',name:'明和町',status:'unavailable',summary:unavailable,source:'https://www.town.meiwa.mie.jp/main/soshiki/seikatu/jyutaku/3854.html'}
          ];
          const base='https://allsunday1122.github.io/jichitai-compare';
          let final=null;
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const pageChecks=[];
            for(const target of targets){
              try{
                const url=`${base}/municipality/${target.code}/?audit=${nonce}`;
                const response=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch20Audit/1.0'}});
                const html=await response.text();
                const sourceMatches=html.includes(target.source)||html.includes(target.source.replaceAll('&','&amp;'));
                const summaryMatches=html.includes(target.summary);
                const statusMatches=target.status==='verified'?html.includes('確認済み'):(html.includes('公式情報で詳細未確認')||html.includes('利用可能な制度情報を確認できません')||html.includes('未確認'));
                pageChecks.push({code:target.code,name:target.name,expectedStatus:target.status,url,httpStatus:response.status,sourceMatches,summaryMatches,statusMatches,success:response.status===200&&sourceMatches&&summaryMatches&&statusMatches});
              }catch(error){pageChecks.push({code:target.code,name:target.name,error:String(error),success:false});}
            }
            let jsonCheck={success:false};
            try{
              const response=await fetch(`${base}/data/generated/municipalities.json?audit=${nonce}`,{headers:{'cache-control':'no-cache','user-agent':'CentralAHousingBatch20Audit/1.0'}});
              const payload=await response.json();
              const municipalities=Array.isArray(payload)?payload:(payload.municipalities||[]);
              const records=targets.map(target=>{const municipality=municipalities.find(item=>item.code===target.code);const service=municipality?.services?.housingSupport;return {code:target.code,found:Boolean(municipality),statusMatches:service?.status===target.status,summaryMatches:service?.summary===target.summary,sourceMatches:service?.source?.url===target.source,success:Boolean(municipality)&&service?.status===target.status&&service?.summary===target.summary&&service?.source?.url===target.source};});
              const serviceCount=municipalities.reduce((sum,item)=>sum+Object.keys(item.services||{}).length,0);
              jsonCheck={httpStatus:response.status,municipalityCount:municipalities.length,serviceCount,records,success:response.status===200&&municipalities.length===1741&&serviceCount===15669&&records.every(v=>v.success)};
            }catch(error){jsonCheck={error:String(error),success:false};}
            final={attempt,pageChecks,jsonCheck,success:pageChecks.every(v=>v.success)&&jsonCheck.success};
            if(final.success)break;
            await sleep(10000);
          }
          const evidence={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch20-public-verification-20260726',generatedAt:new Date().toISOString(),regionalPullRequest:3795,nationalSyncPullRequest:3797,verificationPullRequest:Number(process.env.PR_NUMBER),verificationWorkflowRunId:Number(process.env.RUN_ID),expectedUnavailableCount:4,expectedVerifiedCount:1,...final,releaseBlocker:final.success?'none':'public_verification_failed'};
          const outPath='jichitai-compare/operations/audits/central-a-housing-classification-batch20-public-verification-20260726.json';fs.mkdirSync(path.dirname(outPath),{recursive:true});fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          const trigger='jichitai-compare/operations/control/central-a-housing-batch20-public-trigger-20260726.json';if(fs.existsSync(trigger))fs.rmSync(trigger);
          if(!final.success)throw new Error('Public verification failed after retries');
          NODE
      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'verify: 中日本A住宅支援第20群の公開反映を確認'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
