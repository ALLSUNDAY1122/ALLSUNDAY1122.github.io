name: Temporary Sync Release Queue 252 Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-sync-release-queue-252.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync queue
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('jichitai-compare/operations/control/release-queue.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          for entry in data['entries']:
              if entry['region']=='north':
                  if not any(m['code']=='01452' for m in entry['municipalities']):
                      entry['municipalities'].append({'code':'01452','name':'鷹栖町'})
                  entry['municipalities'].sort(key=lambda x:x['code'])
                  entry['pendingSinceLastRelease']=5
                  entry['reason']='南幌町から妹背牛町までの追加10自治体をPR #436でmainへ統合し、PR #439で公開234自治体へ更新。その後、秩父別町・雨竜町・北竜町・沼田町・鷹栖町を地方統合'
              entry['count']=len(entry['municipalities'])
              entry['releaseStatus']='pending_threshold'
          data['updatedAt']='2026-07-22T04:26:00+09:00'
          s=data['summary']
          s['regionalMergedMunicipalities']=sum(e['count'] for e in data['entries'])
          s['waitingRegionalMergeMunicipalities']=0
          s['releaseReadyRegions']=[]
          s['auditBlockedRegions']=[]
          s['latestGeneratedMunicipalityCount']=234
          s['latestGeneratedPullRequest']=439
          s['latestPublicCountPullRequest']=439
          if s['regionalMergedMunicipalities'] != 252: raise SystemExit(s['regionalMergedMunicipalities'])
          data['nextAction']='北日本・東日本・中日本が5自治体、西日本4自治体。各地域をコード昇順で継続する。'
          data['humanDecisionRequired']=False
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          rm .github/workflows/temp-sync-release-queue-252.yml
          git add jichitai-compare/operations/control/release-queue.json .github/workflows/temp-sync-release-queue-252.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '統括管理: 地方統合252自治体・公開234自治体へ同期'
          git push origin main
