name: Temporary Central A Housing Batch 34

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch34-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch34-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply housing classification batch 34
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T19:33:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const decisions=[
            {code:'28217',pref:'28',name:'川西市',type:'current_child_young_household_purchase_replacement',status:'verified',summary:'令和8年度、子育て住宅促進区域内で若年世帯・子育て世帯が新築住宅または中古住宅を取得する場合、新築100万円、中古60万円を補助する。',source:'https://www.city.kawanishi.hyogo.jp/kurashi/1017490/sumai/1021174/1021177.html',basis:'令和8年度募集、若年・子育て世帯の対象条件、区域、新築100万円・中古60万円を確認'},
            {code:'21202',pref:'21',name:'大垣市',type:'current_child_young_household_used_home_remodel_replacement',status:'verified',summary:'中学生以下の子がいる世帯または夫婦の一方が40歳未満の世帯が、新たに取得した中古住宅を改修する場合、費用の3分の1・上限30万円、一定の移住空家は上限50万円を補助する。',source:'https://www.city.ogaki.lg.jp/0000030637.html',basis:'2026年4月1日更新の現行制度で、子育て世代等の対象、取得後の中古住宅改修、上限30万円・一定条件50万円を確認'},
            {code:'21382',pref:'21',name:'輪之内町',type:'current_child_household_home_construction_replacement',status:'verified',summary:'令和8年度から住宅新築・建替え・購入支援を拡充し、固定資産税3年相当分に加え、18歳未満の子の人数に応じ20万～40万円を加算する。',source:'https://town.wanouchi.gifu.jp/portal/life-process/subsidy-allowance/about-residence/post0021693/',basis:'令和8年度の子育て世帯加算拡充、対象住宅、固定資産税3年相当分、子加算20万～40万円を確認'},
            {code:'22304',pref:'22',name:'南伊豆町',type:'current_newlywed_housing_replacement',status:'verified',summary:'令和8年1月1日から令和9年3月31日までに婚姻した39歳以下の夫婦へ、住居・リフォーム・引越費用を最大50万円補助する。',source:'https://www.town.minamiizu.shizuoka.jp/docs/2024051300016/',basis:'令和8年制度として婚姻期間、夫婦年齢、所得、対象経費、29歳以下最大50万円・30～39歳最大20万円を確認'},
            {code:'22305',pref:'22',name:'松崎町',type:'current_newlywed_housing_replacement_with_fiscal_year_note',status:'verified',summary:'申請年度を基準とする結婚新生活支援として、39歳以下の新婚世帯へ住宅購入・賃借・リフォーム・引越費用を最大60万円補助する。年度別予算状況は申請前に町へ確認が必要。',source:'https://www.town.matsuzaki.shizuoka.jp/docs/2022053000026/',basis:'現行公式ページで申請年度基準、39歳以下、所得500万円未満、対象経費、29歳以下60万円・30～39歳30万円を確認。関連資料は令和7年度のため令和8年度と断定せず確認注意を付記'}
          ];

          function writePreservingStyle(file,obj){
            const raw=fs.readFileSync(file,'utf8');
            const compact=!raw.includes('\n  ');
            fs.writeFileSync(file,compact?JSON.stringify(obj)+'\n':JSON.stringify(obj,null,2)+'\n');
          }
          for(const d of decisions){
            const municipalityPath=path.join(root,'data/municipalities',d.pref,`${d.code}.json`);
            const municipality=JSON.parse(fs.readFileSync(municipalityPath,'utf8'));
            const oldSource=municipality.services.housingSupport?.source?.url;
            const service={status:d.status,summary:d.summary,details:{},source:{url:d.source,checkedAt}};
            if(d.code==='28217')service.details={program:'川西市新築・中古住宅取得補助',fiscalYear:'令和8年度',target:'子育て住宅促進区域内で住宅を取得する若年世帯・子育て世帯。市内在住または市内通勤・通園通学歴・親の市内居住等の要件あり',housing:'新築戸建住宅の建築・購入または中古戸建住宅の購入',amount:'新築100万円、中古60万円',applicationPeriod:'令和8年4月1日から令和9年3月31日',procedure:'契約前の事前エントリーが必要'};
            if(d.code==='21202')service.details={program:'大垣市子育て世代等中古住宅取得リフォーム支援事業',target:'中学生以下の子（妊娠中を含む）がいる世帯、または夫婦のどちらか一方が40歳未満の世帯',housing:'市内で新たに取得し転入・転居した中古戸建住宅または中古分譲マンション',condition:'工事請負契約前・市の交付決定後に市内事業者へ依頼するリフォーム',amount:'リフォーム費用の3分の1、上限30万円',migrationVacantHouse:'市外移住者が1年以上空家の戸建住宅を取得し10年間居住する場合は2分の1、上限50万円',deadline:'住宅取得から1年以内かつ工事着手前'};
            if(d.code==='21382')service.details={program:'輪之内町住宅建設支援事業',fiscalYear:'令和8年度から子育て世帯加算を拡充',target:'町内で自己居住用住宅を新築・建替え・購入した人',baseAmount:'住宅の固定資産税額3年間相当分',childAddition:'18歳未満の子1人20万円、2人30万円、3人以上40万円',migrationAddition:'夫婦いずれか39歳以下は40万円、その他20万円',application:'新たに固定資産税が課される年度に申請'};
            if(d.code==='22304')service.details={program:'令和8年南伊豆町結婚新生活支援補助金',eligibleMarriage:'令和8年1月1日から令和9年3月31日までに婚姻',ageCondition:'夫婦とも39歳以下',incomeCondition:'世帯所得500万円未満等',coveredCosts:'住宅取得・賃借費、リフォーム費、引越費',maximum:'高い方の年齢が29歳以下は最大50万円、30～39歳は最大20万円',expensePeriod:'令和8年4月1日から令和9年3月31日'};
            if(d.code==='22305')service.details={program:'松崎町結婚新生活支援事業',eligibleMarriage:'申請年度の前年度1月1日から申請年度3月31日までに婚姻',ageCondition:'婚姻日に夫婦とも39歳以下',incomeCondition:'夫婦の前年所得合計500万円未満等',coveredCosts:'住宅購入・賃借費、リフォーム費、引越費',maximum:'高い方の年齢が29歳以下は最大60万円、30～39歳は最大30万円',fiscalYearNote:'公式制度本文は申請年度基準で現行掲載されているが、掲載中の関連実施計画は令和7年度。令和8年度の予算・受付状況は申請前に健康福祉課へ確認する'};
            municipality.services.housingSupport=service;
            municipality.updatedAt=checkedAt;
            writePreservingStyle(municipalityPath,municipality);

            const taskPath=path.join(root,'operations/tasks',`${d.code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='中日本調査班A';
            task.verifiedCount=keys.filter(k=>municipality.services[k]?.status==='verified').length;
            task.unavailableCount=keys.filter(k=>municipality.services[k]?.status==='unavailable').length;
            task.researchingCount=keys.filter(k=>municipality.services[k]?.status==='researching').length;
            task.needsMediumReviewCount=keys.filter(k=>municipality.services[k]?.status==='needs_medium_review').length;
            task.officialSources=Array.isArray(task.officialSources)?task.officialSources:[];
            if(oldSource && task.officialSources.includes(oldSource))task.officialSources=task.officialSources.map(x=>x===oldSource?d.source:x);
            if(!task.officialSources.includes(d.source))task.officialSources.push(d.source);
            task.officialSources=[...new Set(task.officialSources)];
            task.notes=Array.isArray(task.notes)?task.notes:[];
            task.notes.push(`2026-07-26 中日本A住宅支援分類第34群: ${d.basis}。`);
            writePreservingStyle(taskPath,task);
          }

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch34-decisions-20260726',session:'中日本調査班A',generatedAt:updatedAt,category:'generalHousingMisclassification',previousRemainingCandidates:9,reviewedMunicipalityCount:5,remainingCandidates:4,confirmedCorrectionCount:5,statusToUnavailableCount:0,verifiedReplacementOrClarificationCount:5,verifiedMaintainedCount:0,decisions:decisions.map(d=>({code:d.code,name:d.name,type:d.type,beforeStatus:'verified',afterStatus:d.status,summary:d.summary,sourceUrl:d.source,basis:d.basis})),issue3141:{unresolvedItems:19,status:'unchanged_waiting_for_official_usage_conditions'},releaseBlocker:'none',regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),status:'validated_pending_region_merge'};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch34-decisions-20260726.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='pending';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残4件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=224;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=656;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=4;
          checkpoint.qualityReaudit.latestHousingBatch={batch:34,status:'validated_pending_region_merge',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:0,verifiedReplacementOrClarificationCount:5,verifiedMaintainedCount:0,remainingCandidates:4,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第34群の川西市・大垣市・輪之内町・南伊豆町・松崎町を、現行の若年・子育て・新婚世帯向け住宅支援へ差し替えた。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');

          const regionPath=path.join(root,'operations/control/regions/central.json');
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const trigger=path.join(root,'operations/control/central-a-housing-batch34-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第34群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
