name: Temporary Central A Housing Batch 17

on:
  pull_request:
    branches:
      - region/central
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch17-trigger-20260726.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/central-a-housing-batch17-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 17 decisions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare';
          const checkedAt='2026-07-26';
          const updatedAt='2026-07-26T03:41:00+09:00';
          const keys=['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const unavailableSummary='子育て世帯・新婚世帯を対象要件とする現行の住宅取得・改修・家賃支援制度は、公式情報で確認できない。';
          const replacements={
            '23226':{
              type:'general_migration_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'東京23区からの移住者へ、就業・テレワーク・関係人口・起業等の要件に応じて世帯100万円・単身60万円の移住支援金を交付する。',classificationReview:'中学生以下の子がいることは関係人口ルートの選択要件の一つだが、住宅取得・改修・家賃への子育て固有支援や子ども加算ではないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.owariasahi.lg.jp/page/3512.html',checkedAt}}
            },
            '23234':{
              type:'general_migration_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'東京圏から移住し、就業・起業・農業就業等の要件を満たす人へ単身60万円・世帯100万円の移住支援金を交付する。',classificationReview:'東京一極集中是正と担い手確保を目的とする一般移住支援であり、子ども・新婚・三世代を要件とする住宅取得・改修・家賃支援を現行公式ページで確認できない。',childSpecificConditionConfirmed:false},source:{url:'https://www.city.kitanagoya.lg.jp/sangyo/koyo/1004190.html',checkedAt}}
            },
            '23501':{
              type:'general_migration_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'東京圏から移住し、就業・起業等の要件を満たす人へ単身60万円・2人以上世帯100万円の移住等支援補助金を交付する。',classificationReview:'年齢・就業・世帯人数等による一般移住支援で、子ども・新婚・三世代を対象要件とする住宅取得・改修・家賃支援ではないため、子育て住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.town.kota.lg.jp/soshiki/13/25626.html',checkedAt}}
            },
            '28222':{
              type:'replace_with_current_newlywed_program',
              service:{status:'verified',summary:'39歳以下の新婚世帯へ、2026年度の住宅賃借初期費用・引越費用を上限30万円、夫婦とも29歳以下の場合は上限60万円補助する。',details:{program:'養父市結婚新生活スタートアップ事業',marriagePeriod:'2026年1月1日から2027年3月31日までに婚姻届を提出し受理された世帯',target:'夫婦とも婚姻日に39歳以下、合算所得500万円未満、対象住宅が養父市内等の要件を満たす新婚世帯',coveredCosts:'住宅賃借の敷金・礼金・共益費・仲介手数料、引越業者等へ支払う引越費用',amount:'夫婦とも29歳以下は上限60万円、その他の39歳以下世帯は上限30万円',expensePeriod:'2026年4月1日から2027年3月31日まで',applicationPeriod:'2026年4月1日から2027年3月31日まで。予算到達時は終了する場合がある。'},source:{url:'https://www.city.yabu.hyogo.jp/kurashi_tetsuzuki/machizukuri/teijusokushin/8119.html',checkedAt},additionalSources:[{url:'https://www.city.yabu.hyogo.jp/soshiki/seibi/miraika/2736.html',checkedAt,description:'一般のやぶ暮らし住宅支援制度。子育て住宅支援の主制度には使用しない。'}]}
            },
            '16321':{
              type:'general_settlement_housing_misclassification',
              service:{status:'unavailable',summary:unavailableSummary,details:{confirmedGeneralProgram:'リラフォートふなはし等の賃貸住宅に一定期間居住した転入者が村内で住宅を取得する場合、50万円から150万円の定住支援助成金を交付する。',classificationReview:'募集ページは「ファミリー向け村営住宅」と表記するが、定住支援助成金交付要綱の助成対象者・助成額には子ども、新婚、三世代の固有要件がないため、子育て世帯向け住宅支援として登録しない。',childSpecificConditionConfirmed:false},source:{url:'https://www.vill.funahashi.toyama.jp/wp/topics/%E3%80%90%E5%8B%9F%E9%9B%86%E3%80%91%E3%83%95%E3%82%A1%E3%83%9F%E3%83%AA%E3%83%BC%E5%90%91%E3%81%91%E6%9D%91%E5%96%B6%E4%BD%8F%E5%AE%85%E3%80%8C%E3%83%AA%E3%83%A9%E3%83%95%E3%82%A9%E3%83%BC%E3%83%88-2/',checkedAt},additionalSources:[{url:'https://www.vill.funahashi.toyama.jp/wp/wp-content/uploads/2023/02/da735968bc510f06425fbb9b298edb43.pdf',checkedAt,description:'定住支援事業助成金交付要綱。助成対象者・金額に子ども・新婚要件がないことを確認。'}]}
            }
          };

          const records=[];
          for(const [code,entry] of Object.entries(replacements)){
            const dataPath=path.join(root,'data/municipalities',code.slice(0,2),`${code}.json`);
            const municipality=JSON.parse(fs.readFileSync(dataPath,'utf8'));
            const before=JSON.parse(JSON.stringify(municipality.services.housingSupport));
            if(before.status!=='verified')throw new Error(`${code}: expected verified before status`);
            municipality.services.housingSupport=entry.service;
            municipality.updatedAt=checkedAt;
            fs.writeFileSync(dataPath,JSON.stringify(municipality)+'\n');

            const taskPath=path.join(root,'operations/tasks',`${code}.json`);
            const task=JSON.parse(fs.readFileSync(taskPath,'utf8'));
            const statuses=Object.values(municipality.services).map(v=>v.status);
            task.status='merged';
            task.currentService=null;
            task.nextServiceIndex=9;
            task.completedServices=keys;
            task.verifiedCount=statuses.filter(v=>v==='verified').length;
            task.researchingCount=statuses.filter(v=>v==='researching').length;
            task.unavailableCount=statuses.filter(v=>v==='unavailable').length;
            task.needsMediumReviewCount=statuses.filter(v=>v==='needs_medium_review').length;
            task.currentBranch='region/central';
            task.pullRequestNumber=Number(process.env.PR_NUMBER);
            task.lastCheckedAt=checkedAt;
            task.lastUpdatedAt=updatedAt;
            task.lastUpdatedBy='統括B②';
            task.officialSources=[...new Set(keys.map(key=>municipality.services[key]?.source?.url).filter(Boolean))];
            task.notes=[...(task.notes||[]),`2026-07-26: 住宅支援分類第17群で公式情報を独立確認し、${entry.type}としてhousingSupportを更新。`];
            task.blockers=task.blockers||[];
            fs.writeFileSync(taskPath,JSON.stringify(task)+'\n');
            records.push({code,name:municipality.name,service:'housingSupport',correctionType:entry.type,beforeStatus:before.status,afterStatus:entry.service.status,beforeSummary:before.summary,afterSummary:entry.service.summary,officialSource:entry.service.source.url});
          }

          const checkpointPath=path.join(root,'operations/control/session-checkpoints/central-a.json');
          const regionPath=path.join(root,'operations/control/regions/central.json');
          const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
          const region=JSON.parse(fs.readFileSync(regionPath,'utf8'));
          if(checkpoint.qualityReaudit.correctedMunicipalitiesRechecked!==134||checkpoint.qualityReaudit.primarySourceSlotsRechecked!==566||checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification!==94){
            throw new Error(`Unexpected batch16 baseline: ${checkpoint.qualityReaudit.correctedMunicipalitiesRechecked}/${checkpoint.qualityReaudit.primarySourceSlotsRechecked}/${checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification}`);
          }
          checkpoint.updatedAt=updatedAt;
          checkpoint.pullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.ciStatus='success';
          checkpoint.nextAction='一般住宅・移住制度の分類候補残89件と弱い主出典残33件を、利用者向け公式情報で原因別に継続判定する。Issue #3141の19項目は公式利用条件公開時のみ解消する。';
          checkpoint.qualityReaudit.latestCompletedAt=updatedAt;
          checkpoint.qualityReaudit.latestRegionalPullRequestNumber=Number(process.env.PR_NUMBER);
          checkpoint.qualityReaudit.latestCiRunNumber=Number(process.env.RUN_ID);
          checkpoint.qualityReaudit.correctedMunicipalitiesRechecked=139;
          checkpoint.qualityReaudit.primarySourceSlotsRechecked=571;
          checkpoint.qualityReaudit.candidateCounts.generalHousingMisclassification=89;
          checkpoint.qualityReaudit.nextPriority=['一般住宅・移住制度の分類候補残89件','弱い主出典残33候補','Issue #3141の19項目を公式利用条件公開時のみ解消'];
          checkpoint.qualityReaudit.latestHousingBatch={batch:17,status:'regional_validated_pending_national_publication',reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:4,verifiedReplacementCount:1,remainingCandidates:89,regionalPullRequestNumber:Number(process.env.PR_NUMBER),regionalWorkflowRunId:Number(process.env.RUN_ID),blocker:null};
          checkpoint.lastAction='住宅支援分類第17群として尾張旭市・北名古屋市・幸田町・舟橋村の一般移住・定住制度をunavailableへ修正し、養父市を2026年度結婚新生活支援へ差し替えた。';
          fs.writeFileSync(checkpointPath,JSON.stringify(checkpoint,null,2)+'\n');
          region.updatedAt=updatedAt;
          region.latestCentralAHousingBatch=checkpoint.qualityReaudit.latestHousingBatch;
          region.lastAction=checkpoint.lastAction;
          fs.writeFileSync(regionPath,JSON.stringify(region,null,2)+'\n');

          const audit={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-batch17-decisions-20260726',decidedAt:updatedAt,session:'中日本調査班A',coordinatorSession:'統括B②',category:'generalHousingMisclassification',regionalPullRequestNumber:Number(process.env.PR_NUMBER),runnerWorkflowRunId:Number(process.env.RUN_ID),reviewedMunicipalityCount:5,confirmedCorrectionCount:5,statusToUnavailableCount:4,verifiedReplacementCount:1,corrected:records,candidateRankingAudit:'central-a-housing-batch17-candidate-ranking-20260726',causeScan:{previousRemainingCandidates:94,reviewedHighRiskCandidates:5,remainingCandidates:89},issue3141:{unresolvedItemCount:19,unresolvedMunicipalityCount:19,changed:false},policy:['一般移住・就業支援は、子どもが選択要件の一部でも住宅取得・改修・家賃への固有支援でなければhousingSupportへ登録しない','ファミリー向けという名称だけで子育て世帯限定と推定せず、交付要綱の対象要件を確認する','同一自治体に現行の新婚住宅費支援がある場合は、一般住宅支援より直接的な制度を主制度とする'],result:{unresolvedConfirmedErrorCount:0,releaseBlocker:'none'}};
          const auditPath=path.join(root,'operations/audits/central-a-housing-classification-batch17-decisions-20260726.json');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          const trigger=path.join(root,'operations/control/central-a-housing-batch17-trigger-20260726.json');
          if(fs.existsSync(trigger))fs.rmSync(trigger);
          NODE
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          cd jichitai-compare
          npm run generate
          npm run check
          node --check app.js
          cd ..
      - name: Reject unexpected changes and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/region/central)
          for file in "${changed[@]}"; do
            case "$file" in
              jichitai-compare/data/municipalities/16/16321.json|jichitai-compare/data/municipalities/23/23226.json|jichitai-compare/data/municipalities/23/23234.json|jichitai-compare/data/municipalities/23/23501.json|jichitai-compare/data/municipalities/28/28222.json|jichitai-compare/operations/tasks/16321.json|jichitai-compare/operations/tasks/23226.json|jichitai-compare/operations/tasks/23234.json|jichitai-compare/operations/tasks/23501.json|jichitai-compare/operations/tasks/28222.json|jichitai-compare/operations/audits/central-a-housing-classification-batch17-decisions-20260726.json|jichitai-compare/operations/control/session-checkpoints/central-a.json|jichitai-compare/operations/control/regions/central.json|jichitai-compare/data/generated/municipalities.json|jichitai-compare/data/generated/municipality-pages.json|jichitai-compare/operations/progress.json|jichitai-compare/municipality/16321/index.html|jichitai-compare/municipality/23226/index.html|jichitai-compare/municipality/23234/index.html|jichitai-compare/municipality/23501/index.html|jichitai-compare/municipality/28222/index.html|jichitai-compare/sitemap.xml|jichitai-compare/operations/control/central-a-housing-batch17-trigger-20260726.json) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 中日本A住宅支援分類第17群を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
