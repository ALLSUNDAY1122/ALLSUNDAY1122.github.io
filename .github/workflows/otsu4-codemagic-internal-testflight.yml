name: Otsu4 Codemagic Internal TestFlight

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: otsu4-internal-testflight
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-CM]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TARGET_BRANCH: release/otsu4-720-internal-testflight
      TARGET_WORKFLOW: otsu4-ios
      CONFIRMED_CM_APP_ID: 6a769d81a1add9d06020b524
      CONFIRMED_ASC_INTEGRATION: Codemagic Shiwake Swipe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/otsu4-720-internal-testflight
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Verify Internal TestFlight-only target
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          cfg=yaml.safe_load(open('codemagic.yaml',encoding='utf-8'))
          wf=(cfg.get('workflows') or {}).get('otsu4-ios')
          assert wf, 'otsu4-ios workflow missing'
          integrations=wf.get('integrations') or {}
          assert integrations.get('app_store_connect') == os.environ['CONFIRMED_ASC_INTEGRATION'], integrations
          signing=((wf.get('environment') or {}).get('ios_signing') or {})
          assert signing.get('distribution_type') == 'app_store'
          assert signing.get('bundle_identifier') == 'jp.allsunday1122.otsu4'
          assert not signing.get('certificates') and not signing.get('provisioning_profiles')
          pub=((wf.get('publishing') or {}).get('app_store_connect') or {})
          assert pub.get('auth') == 'integration'
          assert pub.get('submit_to_testflight') is True, 'TestFlight upload must be explicitly enabled'
          assert pub.get('submit_to_app_store') is False, 'App Store submission must remain disabled'
          joined=str(wf)
          assert 'testFlightInternalTestingOnly' in joined, 'internal-only export option missing'
          assert 'len(data[\'questions\'])==720' in joined or 'len(data["questions"])==720' in joined, 'signed bundle 720 validation missing'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('PASS: isolated Internal TestFlight workflow; target head='+sha)
          PY

      - name: Start and wait for Codemagic build
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ.get('CM_API_TOKEN','').strip()
          app_id=os.environ.get('CM_APP_ID','').strip() or os.environ['CONFIRMED_CM_APP_ID']
          branch=os.environ['TARGET_BRANCH']
          out=Path('otsu4-codemagic-result.json')
          result={'ok':False,'app_id':app_id,'workflow_id':'otsu4-ios','branch':branch,'status':'preflight'}
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          if not token:
              result['error']='CM_API_TOKEN is not configured'
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit(result['error'])

          def api(url, method='GET', payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={'Content-Type':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8',errors='replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={'error':raw[:1000]}
                  return e.code,data

          payload={'appId':app_id,'workflowId':'otsu4-ios','branch':branch}
          status,data=api('https://api.codemagic.io/builds','POST',payload)
          if not 200 <= status < 300:
              result['status']='start_failed'
              result['error']=f'POST build failed HTTP {status}: {data}'
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit(result['error'])
          build_id=data.get('buildId') or data.get('id')
          if not build_id:
              result['status']='start_failed'
              result['error']='Codemagic did not return buildId'
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit(result['error'])

          result.update({'build_id':build_id,'status':'started'})
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Codemagic build started:',build_id)

          terminal={'finished','failed','canceled','timeout','skipped'}
          deadline=time.time()+4200
          last=None
          while time.time() < deadline:
              status,data=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= status < 300:
                  result['error']=f'GET build failed HTTP {status}'
                  out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
                  raise SystemExit(result['error'])
              details=data.get('data') or data
              state=details.get('status')
              if state != last:
                  print('Codemagic status:',state)
                  last=state
              result['status']=state
              result['commit']=(details.get('commit') or {}).get('hash')
              result['app_store_connect_status']=details.get('app_store_connect_status')
              result['started_at']=details.get('started_at')
              result['finished_at']=details.get('finished_at')
              result['ok']=state=='finished'
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              if state in terminal:
                  if state!='finished':
                      result['error']=f'Codemagic build ended with {state}'
                      out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
                      raise SystemExit(result['error'])
                  break
              time.sleep(30)
          else:
              result['error']='Timed out waiting for Codemagic build'
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit(result['error'])
          PY

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otsu4-codemagic-internal-${{ github.run_id }}
          path: otsu4-codemagic-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Otsu4 Internal TestFlight gateway finished. status=${{ job.status }}; run_id=${context.runId}`
            });
