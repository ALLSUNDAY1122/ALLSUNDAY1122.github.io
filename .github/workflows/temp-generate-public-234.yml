name: Temporary Generate Public 234 Retry

on:
  push:
    branches:
      - coord/generated-234-20260722
    paths:
      - .github/workflows/temp-generate-public-234.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/generated-234-20260722
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate public data
        run: |
          set -euxo pipefail
          cd jichitai-compare
          npm run generate
          npm run progress
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('214自治体・9制度','234自治体・9制度')
          s=s.replace('登録状況：214自治体の生成データを公開中','登録状況：234自治体の生成データを公開中')
          if '234自治体・9制度' not in s or '登録状況：234自治体の生成データを公開中' not in s:
              raise SystemExit('index count update failed')
          p.write_text(s,encoding='utf-8')
          PY
          npm run validate:generated
          cd ..
          rm .github/workflows/temp-generate-public-234.yml
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html .github/workflows/temp-generate-public-234.yml
          python3 - <<'PY'
          import subprocess
          expected={
            'jichitai-compare/data/generated/municipalities.json',
            'jichitai-compare/operations/progress.json',
            'jichitai-compare/index.html',
            '.github/workflows/temp-generate-public-234.yml',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected files: {sorted(actual ^ expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '公開更新: 生成データと表示件数を234自治体へ同期'
          git push origin coord/generated-234-20260722
