name: Kangoshi Sprint CI

on:
  push:
    paths:
      - 'kangoshi-sprint/**'
      - '.github/workflows/kangoshi-sprint-ci.yml'
  pull_request:
    paths:
      - 'kangoshi-sprint/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check kangoshi-sprint/questions.js
          node --check kangoshi-sprint/questions-numeric.js
          node --check kangoshi-sprint/app-v02.js
          node --check kangoshi-sprint/subject-hierarchy.js
      - name: Question data audit
        run: node kangoshi-sprint/audit-v02.mjs
      - name: Basic HTML contract
        run: |
          grep -q 'id="app"' kangoshi-sprint/index.html
          grep -q 'questions.js' kangoshi-sprint/index.html
          grep -q 'questions-numeric.js' kangoshi-sprint/index.html
          grep -q 'app-v02.js' kangoshi-sprint/index.html
          grep -q 'subject-hierarchy.js' kangoshi-sprint/index.html
          grep -q 'style-subject-hierarchy.css' kangoshi-sprint/index.html
