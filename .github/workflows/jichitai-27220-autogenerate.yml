name: Jichitai 27220 Autogenerate

on:
  push:
    branches:
      - coord/sync-audit-27220-20260724

permissions:
  contents: write

env:
  GENERATION_TARGET: "27220"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate and validate public data
        run: |
          echo "Generating municipality ${GENERATION_TARGET} and nationwide outputs"
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated

      - name: Commit generated outputs and remove temporary workflow
        run: |
          rm .github/workflows/jichitai-27220-autogenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/jichitai-27220-autogenerate.yml \
            jichitai-compare/data/generated \
            jichitai-compare/municipality/27220 \
            jichitai-compare/operations/progress.json \
            jichitai-compare/sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: 箕面市全国同期の生成物を更新"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
