name: Temporary Fix Toyoura Progress 1317 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-toyoura-progress-20260722-1317.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/fix-toyoura-task-20260722-1317
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate progress
        run: |
          set -euxo pipefail
          cd jichitai-compare
          npm run progress
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('operations/progress.json','utf8'));
          if(p.registeredMunicipalities!==384) throw new Error(`registered ${p.registeredMunicipalities}`);
          if(p.prOpenMunicipalities!==0) throw new Error(`pr_open ${p.prOpenMunicipalities}`);
          if(p.mergedMunicipalities!==384) throw new Error(`merged ${p.mergedMunicipalities}`);
          NODE
          cd ..
          git add jichitai-compare/operations/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '進捗修正: PR作成中0・merged 384へ再生成'
          git push origin coord/fix-toyoura-task-20260722-1317
