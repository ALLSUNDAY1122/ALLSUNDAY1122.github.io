name: APP2-007 Otsu4 App Store Candidate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: app2-007-otsu4-appstore-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-APPSTORE]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TARGET_BRANCH: release/otsu4-appstore-candidate-20260829
      TARGET_WORKFLOW: otsu4-appstore-candidate
      CM_APP_ID: 6a769d81a1add9d06020b524
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/otsu4-appstore-candidate-20260829
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Verify candidate branch and upload policy
        run: |
          python - <<'PY'
          import os,subprocess,yaml
          cfg=yaml.safe_load(open('codemagic.yaml',encoding='utf-8'))
          wf=(cfg.get('workflows') or {}).get(os.environ['TARGET_WORKFLOW'])
          assert wf, 'candidate workflow missing'
          assert ((wf.get('integrations') or {}).get('app_store_connect')) == 'Codemagic Shiwake Swipe'
          signing=((wf.get('environment') or {}).get('ios_signing') or {})
          assert signing.get('distribution_type')=='app_store'
          assert signing.get('bundle_identifier')=='jp.allsunday1122.otsu4'
          pub=((wf.get('publishing') or {}).get('app_store_connect') or {})
          assert pub.get('auth')=='integration'
          assert pub.get('submit_to_testflight') is True
          assert pub.get('submit_to_app_store') is False
          joined=str(wf)
          assert 'testFlightInternalTestingOnly' not in joined
          scripts='\n'.join(str(x.get('script','')) for x in (wf.get('scripts') or []) if isinstance(x,dict))
          assert 'questions.generated.json' in scripts and '720' in scripts
          assert '288' in scripts and '192' in scripts and '240' in scripts
          print('PASS candidate preflight',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
      - name: Start and wait for Codemagic candidate
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.error,urllib.request
          from pathlib import Path
          token=os.environ.get('CM_API_TOKEN','').strip(); out=Path('otsu4-appstore-candidate-result.json')
          result={'ok':False,'app_id':os.environ['CM_APP_ID'],'workflow_id':os.environ['TARGET_WORKFLOW'],'branch':os.environ['TARGET_BRANCH'],'status':'preflight'}
          def save(): out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          save()
          if not token: raise SystemExit('CM_API_TOKEN missing')
          def api(url,method='GET',payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,method=method,headers={'Content-Type':'application/json','x-auth-token':token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode(); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); return e.code,{'error':raw[:1500]}
          status,data=api('https://api.codemagic.io/builds','POST',{'appId':os.environ['CM_APP_ID'],'workflowId':os.environ['TARGET_WORKFLOW'],'branch':os.environ['TARGET_BRANCH']})
          if not 200 <= status < 300:
              result.update(status='start_failed',error=f'HTTP {status}: {data}'); save(); raise SystemExit(result['error'])
          build_id=data.get('buildId') or data.get('id')
          if not build_id: raise SystemExit('Codemagic did not return buildId')
          result.update(build_id=build_id,status='started'); save(); print('started',build_id)
          terminal={'finished','failed','canceled','timeout','skipped'}; deadline=time.time()+4200
          while time.time()<deadline:
              status,data=api(f'https://codemagic.io/api/v3/builds/{build_id}')
              if not 200 <= status < 300: raise SystemExit(f'GET build HTTP {status}')
              d=data.get('data') or data; state=d.get('status')
              result.update(status=state,commit=(d.get('commit') or {}).get('hash'),app_store_connect_status=d.get('app_store_connect_status'),started_at=d.get('started_at'),finished_at=d.get('finished_at')); save()
              print('status',state)
              if state in terminal:
                  result['ok']=state=='finished'; save()
                  if state!='finished': raise SystemExit(f'Codemagic ended {state}')
                  break
              time.sleep(30)
          else:
              result['error']='Timed out waiting for Codemagic'; save(); raise SystemExit(result['error'])
          PY
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app2-007-otsu4-appstore-candidate-${{ github.run_id }}
          path: otsu4-appstore-candidate-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Report run locator
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`APP2-007 Otsu4 App Store candidate finished. status=${{ job.status }}; run_id=${context.runId}; artifact=app2-007-otsu4-appstore-candidate-${context.runId}`});
