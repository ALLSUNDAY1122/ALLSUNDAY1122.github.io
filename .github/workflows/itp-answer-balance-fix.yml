name: IT Passport Answer Balance Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[ITP-ANSWER-BALANCE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebalance without changing question or choice text
        run: |
          python3 apps/it-passport-rebuild/quality/rebalance-answer-positions.py --apply
          python3 apps/it-passport-rebuild/quality/validate-question-dataset.py
          python3 - <<'PY'
          import collections,json
          p='apps/it-passport-rebuild/questions/original-mock.json'
          d=json.load(open(p,encoding='utf-8'))
          c=collections.Counter(q['correct_index'] for q in d)
          assert len(d)==20
          assert c == collections.Counter({0:5,1:5,2:5,3:5}), c
          print('PASS: batch-01 answer positions exactly balanced 5/5/5/5')
          PY
          git diff --check
      - name: Commit mechanical reorder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/it-passport-rebuild/questions/original-mock.json
          git commit -m 'fix(it-passport): balance canonical answer positions'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`IT Passport answer-balance repair finished. status=${{ job.status }}; run_id=${context.runId}`});
