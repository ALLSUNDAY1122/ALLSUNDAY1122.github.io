name: Temporary Central A Housing Batch 35 Rescan

on:
  pull_request:
    branches: [region/central]
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch35-rescan-trigger-20260726.json

permissions:
  contents: write

jobs:
  scan:
    if: github.head_ref == 'audit/central-a-housing-batch35-rescan-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Extract current housing candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='jichitai-compare/data/municipalities';
          const out='jichitai-compare/operations/audits/central-a-housing-classification-candidates-after-batch34-20260726.json';
          const prefectures=new Set(['16','17','18','21','22','23','24','25','27','28']);
          const childTerms=/(子育て|子ども|こども|児童|多子|ひとり親|母子|父子|妊娠|出産|新婚|若年夫婦|若年世帯|義務教育終了前|18歳未満|18歳以下|中学生以下|高校生以下|三世代|同居|近居)/;
          const generalTerms=/(移住|定住|空き家|空家|耐震|住宅取得|新築|リフォーム|改修|除却|家財|引越|転入|結婚新生活|若者世帯|住宅ローン|省エネ|ZEH)/;
          const candidates=[];
          for(const pref of fs.readdirSync(root)){
            if(!prefectures.has(pref))continue;
            const dir=path.join(root,pref);
            for(const filename of fs.readdirSync(dir)){
              if(!filename.endsWith('.json'))continue;
              const data=JSON.parse(fs.readFileSync(path.join(dir,filename),'utf8'));
              const svc=data.services?.housingSupport;
              if(!svc||svc.status!=='verified')continue;
              const text=JSON.stringify({summary:svc.summary,eligibility:svc.eligibility,details:svc.details});
              if(!generalTerms.test(text)||childTerms.test(text))continue;
              const riskTerms=[];
              for(const term of ['移住','定住','空き家','空家','耐震','住宅取得','新築','リフォーム','改修','除却','家財','引越','転入','結婚新生活','若者世帯','住宅ローン','省エネ','ZEH'])if(text.includes(term))riskTerms.push(term);
              candidates.push({code:data.code,name:data.name,prefecture:data.prefecture,status:svc.status,summary:svc.summary,sourceUrl:svc.source?.url??null,riskTerms});
            }
          }
          candidates.sort((a,b)=>b.riskTerms.length-a.riskTerms.length||a.code.localeCompare(b.code));
          const result={schemaVersion:'1.0.0',auditId:'central-a-housing-classification-candidates-after-batch34-20260726',generatedAt:new Date().toISOString(),session:'中日本調査班A',scopeMunicipalities:314,candidateCount:candidates.length,criteria:{requiredStatus:'verified',generalHousingTermsPresent:true,childOrFamilySpecificTermsAbsent:true},nextBatch:candidates.slice(0,5),candidates};
          fs.mkdirSync(path.dirname(out),{recursive:true});
          fs.writeFileSync(out,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({candidateCount:candidates.length,nextBatch:candidates.slice(0,5)},null,2));
          NODE
      - name: Commit candidate report
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/central-a-housing-batch35-rescan-trigger-20260726.json
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'audit: 中日本A住宅支援第35群候補を再抽出'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
