name: Temporary West-A Region State Copy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-west-a-region-state-copy.yml'

permissions:
  contents: write

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Save main state files
        shell: bash
        run: |
          cp jichitai-compare/operations/control/session-checkpoints/west-a.json /tmp/west-a.json
          cp jichitai-compare/operations/control/regions/west.json /tmp/west.json

      - name: Sync region/west and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin region/west
          git checkout -B sync-region-west origin/region/west
          cp /tmp/west-a.json jichitai-compare/operations/control/session-checkpoints/west-a.json
          cp /tmp/west.json jichitai-compare/operations/control/regions/west.json
          cd jichitai-compare
          npm run generate
          npm run progress
          npm run validate:generated
          cd ..
          unexpected="$(git status --porcelain | grep -v -E 'session-checkpoints/west-a.json|control/regions/west.json' || true)"
          if [ -n "$unexpected" ]; then
            echo 'region/westに予期しない差分があります。'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add jichitai-compare/operations/control/session-checkpoints/west-a.json jichitai-compare/operations/control/regions/west.json
          git commit -m 'ops: 西日本Aソフト警告監査証跡を地域へ同期'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:region/west; then
              break
            fi
            git pull --rebase origin region/west
          done

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/temp-west-a-region-state-copy.yml
          git commit -m 'ci: 西日本A地域状態同期ランナーを削除'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
