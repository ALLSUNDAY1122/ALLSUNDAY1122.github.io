name: Otsu4 RC Package Gate Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.actor == 'ALLSUNDAY1122' && startsWith(github.event.issue.title, '[OTS4-RC-VERIFY-REPAIR]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Add packaged IPA verification and remove RC publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codemagic.yaml')
          s=p.read_text(encoding='utf-8')
          start=s.index('\n  otsu4-ios:')
          end=s.index('\n  tsukanshi-ios:', start)
          block=s[start:end]
          old_build='''      - name: Build signed IPA\n        script: |\n          xcode-project build-ipa \\\n            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \\\n            --scheme "$XCODE_SCHEME"\n'''
          if block.count(old_build) != 1:
              raise SystemExit(f'expected one Otsu4 build step, found {block.count(old_build)}')
          verify='''      - name: Build signed IPA\n        script: |\n          xcode-project build-ipa \\\n            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \\\n            --scheme "$XCODE_SCHEME"\n      - name: Verify packaged Otsu4 IPA\n        script: |\n          set -euo pipefail\n          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -type f -name '*.ipa' -print -quit)"\n          test -n "$IPA_PATH"\n          VERIFY_DIR="$(mktemp -d)"\n          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"\n          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"\n          test -n "$APP_DIR"\n          python3 - "$APP_DIR" "$BUILD_NUMBER" <<'PY2'\n          from pathlib import Path\n          import json,plistlib,sys\n          app=Path(sys.argv[1]); expected=sys.argv[2]\n          info=plistlib.loads((app/'Info.plist').read_bytes())\n          actual=str(info.get('CFBundleVersion',''))\n          assert expected.isdigit(), expected\n          assert actual == expected, f'CFBundleVersion mismatch actual={actual} expected={expected}'\n          assert info.get('CFBundleIdentifier') == 'jp.allsunday1122.otsu4', info.get('CFBundleIdentifier')\n          qpath=app/'questions.generated.json'\n          assert qpath.is_file(), 'packaged questions.generated.json missing'\n          data=json.loads(qpath.read_text(encoding='utf-8'))\n          assert data.get('contentVersion') == 'otsu4-2026-08-product-v2'\n          assert len(data.get('questions') or []) == 360, len(data.get('questions') or [])\n          assert (app/'Assets.car').is_file(), 'Assets.car missing'\n          assert (app/'embedded.mobileprovision').is_file(), 'embedded.mobileprovision missing'\n          assert (app/'_CodeSignature').is_dir(), '_CodeSignature missing'\n          print(f'PASS: signed Otsu4 IPA bundle={info.get("CFBundleIdentifier")} version={info.get("CFBundleShortVersionString")} build={actual} questions=360')\n          PY2\n'''
          block=block.replace(old_build,verify)
          old_pub='''    publishing:\n      app_store_connect:\n        auth: integration\n        submit_to_testflight: false\n        submit_to_app_store: false\n'''
          if block.count(old_pub) != 1:
              raise SystemExit(f'expected one Otsu4 RC publishing block, found {block.count(old_pub)}')
          block=block.replace(old_pub,'')
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('codemagic.yaml').read_text(encoding='utf-8')
          start=s.index('\n  otsu4-ios:'); end=s.index('\n  tsukanshi-ios:',start)
          b=s[start:end]
          assert 'Verify packaged Otsu4 IPA' in b
          assert 'submit_to_testflight' not in b
          assert 'submit_to_app_store' not in b
          assert 'RELEASE_SOURCE_SHA: 8912ef194955900ee4d64b17d37910b7a2931eb8' in b
          assert 'distribution_type: app_store' in b
          print('PASS: Otsu4 RC package gate repaired without product-source or submission changes')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml
          git commit -m 'ci(otsu4): verify signed RC package before release handoff'
          git push origin HEAD:main
      - name: Report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Otsu4 RC package-gate repair finished. status=${{ job.status }}; run_id=${context.runId}`});
