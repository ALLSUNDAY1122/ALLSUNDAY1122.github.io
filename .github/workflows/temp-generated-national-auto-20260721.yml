name: Temporary Generate National Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-generated-national-auto-20260721.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate current national snapshot
        env:
          BRANCH: coord/generated-national-auto-20260721
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C "$BRANCH" origin/main
          cd jichitai-compare
          npm run generate
          npm run progress
          node - <<'NODE'
          import fs from 'node:fs';
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          const count = progress.registeredMunicipalities;
          if (!Number.isInteger(count) || count <= 0) {
            throw new Error(`不正な登録自治体数: ${count}`);
          }
          const path = 'index.html';
          const current = fs.readFileSync(path, 'utf8');
          let updated = current.replace(
            /(<span>)\d+自治体(・9制度<\/span>)/,
            `$1${count}自治体$2`,
          );
          updated = updated.replace(
            /(登録状況：)\d+自治体(の生成データを公開中)/,
            `$1${count}自治体$2`,
          );
          if (updated === current) {
            throw new Error('トップページの自治体件数表示を更新できませんでした');
          }
          fs.writeFileSync(path, updated);
          console.log(`公開件数を ${count} 自治体へ更新`);
          NODE
          npm run validate:generated
          cd ..
          git add jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html
          git diff --cached --quiet && { echo "生成差分がありません"; exit 1; }
          git commit -m "生成更新: 全国統合後の公開データを最新件数へ同期"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

      - name: Remove temporary workflow
        if: always()
        run: |
          set -euxo pipefail
          git switch main
          git pull --ff-only origin main
          git rm .github/workflows/temp-generated-national-auto-20260721.yml
          git commit -m "ci: 全国公開生成用の一時ワークフローを削除"
          git push origin main
