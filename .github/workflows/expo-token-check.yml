name: Expo Robot Token Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expo-token-check.yml
      - automation/app2-003-eas-signing-command.json

permissions:
  contents: write

jobs:
  expo-auth:
    name: Verify Expo authentication and APP2-003 signing bridge
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo robot authentication
        run: eas whoami

      - name: Probe or install exact APP2-003 signing key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
        run: python3 scripts/app2_003_eas_signing_bridge_nodeua.py

      - name: Persist sanitized APP2-003 bridge result
        if: always()
        run: |
          test -f /tmp/app2-003-eas-signing-result-path.txt || exit 0
          P="$(cat /tmp/app2-003-eas-signing-result-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P"
          git commit -m "Persist APP2-003 EAS signing bridge result" || exit 0
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$P")"
          cp /tmp/app2-003-eas-signing-result-copy.json "$P"
          git add "$P"
          git commit -m "Persist APP2-003 EAS signing bridge result" || exit 0
          git push origin HEAD:main

# APP2-003 bridge is temporary; restore this workflow after signing migration completes.
