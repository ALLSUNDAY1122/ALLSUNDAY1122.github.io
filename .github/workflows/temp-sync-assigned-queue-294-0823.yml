name: Temporary sync assigned queue 294

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-sync-assigned-queue-294-0823.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync queue from assigned regional files
        shell: bash
        run: |
          git pull --rebase origin main
          git fetch origin \
            region/north:refs/remotes/origin/region/north \
            region/east:refs/remotes/origin/region/east \
            region/central:refs/remotes/origin/region/central \
            region/west:refs/remotes/origin/region/west
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path, PurePosixPath

          queue_path = Path('jichitai-compare/operations/control/release-queue.json')
          data = json.loads(queue_path.read_text(encoding='utf-8'))
          policy = json.loads(Path('jichitai-compare/operations/municipality-assignment-policy.json').read_text(encoding='utf-8'))
          team_for_region = {
              'north': '北日本調査班',
              'east': '東日本調査班',
              'central': '中日本調査班',
              'west': '西日本調査班',
          }
          prefix_map = {team['team']: set(team['prefectureCodes']) for team in policy['teams']}

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def name_from_file(ref, path, code):
              try:
                  obj = json.loads(run('git', 'show', f'{ref}:{path}'))
                  if isinstance(obj.get('municipality'), dict) and obj['municipality'].get('name'):
                      return obj['municipality']['name']
                  for key in ('municipalityName', 'name'):
                      if isinstance(obj.get(key), str) and obj[key]:
                          return obj[key]
              except Exception:
                  pass
              return code

          for entry in data['entries']:
              baseline = int(entry.get('count', 0)) - int(entry.get('pendingSinceLastRelease', 0))
              prefixes = prefix_map[team_for_region[entry['region']]]
              ref = f"origin/{entry['branch']}"
              listed = run('git', 'ls-tree', '-r', '--name-only', ref, '--', 'jichitai-compare/data/municipalities')
              existing = {item['code']: item['name'] for item in entry.get('municipalities', [])}
              items = []
              for path in listed.splitlines():
                  if not path.endswith('.json'):
                      continue
                  code = PurePosixPath(path).stem
                  if not code.isdigit() or code[:2] not in prefixes:
                      continue
                  items.append({'code': code, 'name': existing.get(code) or name_from_file(ref, path, code)})
              items.sort(key=lambda item: item['code'])
              entry['municipalities'] = items
              entry['count'] = len(items)
              pending = max(0, entry['count'] - baseline)
              entry['pendingSinceLastRelease'] = pending
              entry['releaseStatus'] = 'release_ready' if pending >= 10 else 'pending_threshold'
              entry['reason'] = f'担当割当で地方ブランチを再走査。前回全国統合後の地方統合繰越は{pending}自治体'
              entry['generatedPullRequest'] = 518

          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).replace(second=0, microsecond=0).isoformat()
          data['summary']['regionalMergedMunicipalities'] = sum(entry['count'] for entry in data['entries'])
          data['summary']['waitingRegionalMergeMunicipalities'] = 0
          data['summary']['releaseReadyRegions'] = [entry['region'] for entry in data['entries'] if entry.get('pendingSinceLastRelease', 0) >= 10]
          data['summary']['auditBlockedRegions'] = []
          data['summary']['lastNationalIntegrationAt'] = '2026-07-22T07:59:35+09:00'
          data['summary']['lastNationalIntegrationPr'] = 517
          data['summary']['latestGeneratedMunicipalityCount'] = 294
          data['summary']['latestGeneratedPullRequest'] = 518
          data['summary']['latestPublicCountPullRequest'] = 518
          ordered = sorted(data['entries'], key=lambda item: item.get('pendingSinceLastRelease', 0), reverse=True)
          data['nextAction'] = '地方統合を継続。現在の公開後繰越: ' + '、'.join(f"{e['region']} {e.get('pendingSinceLastRelease', 0)}" for e in ordered) + '。10自治体到達地域を固定スナップショットで全国統合する。'
          data['humanDecisionRequired'] = False
          queue_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jichitai-compare/operations/control/release-queue.json
          git rm .github/workflows/temp-sync-assigned-queue-294-0823.yml
          git commit -m "統括管理: 公開294自治体後の地方キューを同期"
          git push origin HEAD:main
