name: Publish Minamata 43205 v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.head_ref == 'coord/publish-43205-minamata-20260724-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coord/publish-43205-minamata-20260724-v2
          fetch-depth: 0
      - name: Import 水俣市 from region/west
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git fetch origin region/west:refs/remotes/origin/region/west
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const show = (p) => execFileSync('git', ['show', `origin/region/west:${p}`], { encoding: 'utf8' });
          const municipalityPath = 'jichitai-compare/data/municipalities/43/43205.json';
          const taskPath = 'jichitai-compare/operations/tasks/43205.json';
          const municipality = JSON.parse(show(municipalityPath));
          const task = JSON.parse(show(taskPath));
          const serviceIds = ['childMedical','sickChildCare','childcareFee','schoolMeals','postpartumCare','temporaryChildcare','housingSupport','bulkyWaste','disasterPrevention'];
          const statuses = serviceIds.map((id) => municipality.services?.[id]?.status);
          if (statuses.some((status) => !['verified','unavailable'].includes(status))) throw new Error(`未完了制度: ${statuses.join(',')}`);
          const progress = JSON.parse(fs.readFileSync('jichitai-compare/operations/progress.json', 'utf8'));
          if (progress.registeredMunicipalities !== 1482) throw new Error(`基点変化: ${progress.registeredMunicipalities}`);
          municipality.status = 'verified';
          municipality.updatedAt = '2026-07-24';
          const verifiedCount = statuses.filter((s) => s === 'verified').length;
          const unavailableCount = statuses.filter((s) => s === 'unavailable').length;
          Object.assign(task, {
            status: 'merged', currentService: null, nextServiceIndex: 9,
            completedServices: serviceIds, verifiedCount, researchingCount: 0,
            unavailableCount, needsMediumReviewCount: 0, pullRequestNumber: null,
            lastCheckedAt: '2026-07-24', lastUpdatedAt: '2026-07-24T09:39:00+09:00',
            lastUpdatedBy: '統括B全国統合',
            officialSources: serviceIds.map((id) => municipality.services[id].source?.url).filter(Boolean), blockers: []
          });
          fs.mkdirSync('jichitai-compare/data/municipalities/43', { recursive: true });
          fs.writeFileSync(municipalityPath, JSON.stringify(municipality, null, 2) + '\n');
          fs.writeFileSync(taskPath, JSON.stringify(task, null, 2) + '\n');
          fs.writeFileSync('jichitai-compare/operations/control/publish-43205-minamata-20260724-v2.json', JSON.stringify({
            schemaVersion: '1.0.0', municipalityCode: '43205', municipalityName: '水俣市',
            createdAt: '2026-07-24T09:39:00+09:00', previousPublishedMunicipalities: 1482,
            expectedPublishedMunicipalities: 1483, verifiedCount, unavailableCount,
            sourceRegionalMergeSha: '8eb193a9b3f82f1f353c7779949dcf7519947bec'
          }, null, 2) + '\n');
          NODE
      - name: Generate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          node <<'NODE'
          const fs = require('fs');
          const progress = JSON.parse(fs.readFileSync('operations/progress.json', 'utf8'));
          if (progress.registeredMunicipalities !== 1483) throw new Error(`件数不一致: ${progress.registeredMunicipalities}`);
          if (progress.completedServices !== 13347) throw new Error(`制度数不一致: ${progress.completedServices}`);
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/\d+自治体・9制度/u, '1483自治体・9制度');
          fs.writeFileSync('index.html', html);
          NODE
          npm run validate:generated
      - name: Commit and remove workflow
        run: |
          git rm .github/workflows/publish-43205-minamata-v2.yml
          git add jichitai-compare/data/municipalities/43/43205.json jichitai-compare/operations/tasks/43205.json jichitai-compare/data/generated/municipalities.json jichitai-compare/operations/progress.json jichitai-compare/index.html jichitai-compare/operations/control/publish-43205-minamata-20260724-v2.json
          git commit -m "release: 水俣市を最新mainへ全国公開"
          git push origin HEAD:coord/publish-43205-minamata-20260724-v2
