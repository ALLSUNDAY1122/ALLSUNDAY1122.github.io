name: Yorugatari SEO audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - robots.txt
      - 173baadd8bd18212cc1286c5ae612fce.txt
      - yorugatari/index.html
      - yorugatari/5min-horror.html
      - yorugatari/bedtime-horror.html
      - yorugatari/horror-quiz.html
      - yorugatari/archive.html
      - yorugatari/about.html
      - yorugatari/privacy.html
      - yorugatari/terms.html
      - yorugatari/contact.html
      - yorugatari/categories/**
      - yorugatari/feed.xml
      - yorugatari/sitemap.xml
      - yorugatari/stories/**
      - yorugatari/assets/stories*.js
      - yorugatari/assets/horror-quiz.js
      - yorugatari/tools/normalize-story-pages.mjs
      - yorugatari/tools/enhance-story-structured-data.mjs
      - yorugatari/tools/story-structured-data-audit.mjs
      - yorugatari/tools/optimize-story-search-metadata.mjs
      - yorugatari/tools/story-search-audit.mjs
      - yorugatari/tools/generate-discovery-pages.mjs
      - yorugatari/tools/ensure-horror-quiz.mjs
      - yorugatari/tools/discovery-audit.mjs
      - yorugatari/tools/generate-sitemap.mjs
      - yorugatari/tools/seo-audit.mjs
      - yorugatari/tools/submit-indexnow.mjs
      - .github/workflows/yorugatari-seo-audit.yml

concurrency:
  group: yorugatari-seo-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate story metadata scripts
        run: |
          node --check yorugatari/tools/enhance-story-structured-data.mjs
          node --check yorugatari/tools/story-structured-data-audit.mjs
          node --check yorugatari/tools/optimize-story-search-metadata.mjs
          node --check yorugatari/tools/story-search-audit.mjs
          node --check yorugatari/tools/ensure-horror-quiz.mjs
          node --check yorugatari/assets/horror-quiz.js

      - name: Enhance all story structured data
        run: node yorugatari/tools/enhance-story-structured-data.mjs

      - name: Optimize all story search metadata
        run: node yorugatari/tools/optimize-story-search-metadata.mjs

      - name: Generate category pages and RSS
        run: node yorugatari/tools/generate-discovery-pages.mjs

      - name: Ensure horror quiz discovery links
        run: node yorugatari/tools/ensure-horror-quiz.mjs

      - name: Generate current sitemap
        run: node yorugatari/tools/generate-sitemap.mjs

      - name: Validate story structured data
        run: node yorugatari/tools/story-structured-data-audit.mjs

      - name: Validate story search metadata
        run: node yorugatari/tools/story-search-audit.mjs

      - name: Validate repository discovery
        run: node yorugatari/tools/discovery-audit.mjs

      - name: Validate repository SEO
        run: node yorugatari/tools/seo-audit.mjs

      - name: Commit generated story metadata and discovery files
        shell: bash
        run: |
          if git status --short -- \
            yorugatari/index.html \
            yorugatari/5min-horror.html \
            yorugatari/bedtime-horror.html \
            yorugatari/archive.html \
            yorugatari/categories \
            yorugatari/feed.xml \
            yorugatari/sitemap.xml \
            yorugatari/stories \
            yorugatari/tools/discovery-manifest-latest.json \
            yorugatari/tools/story-search-metadata-latest.json \
            yorugatari/tools/story-structured-data-manifest-latest.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              yorugatari/index.html \
              yorugatari/5min-horror.html \
              yorugatari/bedtime-horror.html \
              yorugatari/archive.html \
              yorugatari/categories \
              yorugatari/feed.xml \
              yorugatari/sitemap.xml \
              yorugatari/stories \
              yorugatari/tools/discovery-manifest-latest.json \
              yorugatari/tools/story-search-metadata-latest.json \
              yorugatari/tools/story-structured-data-manifest-latest.json
            git commit -m "Publish Yorugatari story structured data and search metadata [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Story structured data, search metadata, discovery pages, quiz links and sitemap are already current."
          fi

      - name: Audit published SEO
        id: live
        continue-on-error: true
        shell: bash
        run: |
          status=1
          for attempt in 1 2 3; do
            echo "Published SEO audit attempt ${attempt}/3"
            if node yorugatari/tools/seo-audit.mjs --live; then
              exit 0
            fi
            status=$?
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit "$status"

      - name: Audit published story structured data
        id: story_schema
        continue-on-error: true
        run: node yorugatari/tools/story-structured-data-audit.mjs --live

      - name: Audit published story search metadata
        id: story_search
        continue-on-error: true
        run: node yorugatari/tools/story-search-audit.mjs --live

      - name: Audit published category discovery
        id: discovery
        continue-on-error: true
        run: node yorugatari/tools/discovery-audit.mjs --live

      - name: Submit URLs through IndexNow
        id: indexnow
        continue-on-error: true
        run: node yorugatari/tools/submit-indexnow.mjs

      - name: Preserve search discovery reports
        if: always()
        shell: bash
        run: |
          test -f yorugatari-seo-report.json
          test -f yorugatari-story-structured-data-report.json
          test -f yorugatari-story-search-report.json
          test -f yorugatari-discovery-report.json
          test -f yorugatari-indexnow-report.json
          cp yorugatari-seo-report.json /tmp/yorugatari-seo-report.json
          cp yorugatari-story-structured-data-report.json /tmp/yorugatari-story-structured-data-report.json
          cp yorugatari-story-search-report.json /tmp/yorugatari-story-search-report.json
          cp yorugatari-discovery-report.json /tmp/yorugatari-discovery-report.json
          cp yorugatari-indexnow-report.json /tmp/yorugatari-indexnow-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/yorugatari-seo-report.json yorugatari/tools/seo-audit-latest.json
            cp /tmp/yorugatari-story-structured-data-report.json yorugatari/tools/story-structured-data-audit-latest.json
            cp /tmp/yorugatari-story-search-report.json yorugatari/tools/story-search-audit-latest.json
            cp /tmp/yorugatari-discovery-report.json yorugatari/tools/discovery-audit-latest.json
            cp /tmp/yorugatari-indexnow-report.json yorugatari/tools/indexnow-latest.json
            git add \
              yorugatari/tools/seo-audit-latest.json \
              yorugatari/tools/story-structured-data-audit-latest.json \
              yorugatari/tools/story-search-audit-latest.json \
              yorugatari/tools/discovery-audit-latest.json \
              yorugatari/tools/indexnow-latest.json
            if git diff --cached --quiet; then
              saved=true
              break
            fi
            git commit -m "Record Yorugatari story schema and search audit [skip ci]"
            if git push; then
              saved=true
              break
            fi
            sleep 3
          done
          test "$saved" = true

      - name: Upload search discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorugatari-search-discovery-reports
          path: |
            yorugatari-seo-report.json
            yorugatari-story-structured-data-report.json
            yorugatari-story-search-report.json
            yorugatari-discovery-report.json
            yorugatari-indexnow-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce search discovery result
        if: always()
        shell: bash
        run: |
          test "${{ steps.live.outcome }}" = "success"
          test "${{ steps.story_schema.outcome }}" = "success"
          test "${{ steps.story_search.outcome }}" = "success"
          test "${{ steps.discovery.outcome }}" = "success"
          test "${{ steps.indexnow.outcome }}" = "success"
