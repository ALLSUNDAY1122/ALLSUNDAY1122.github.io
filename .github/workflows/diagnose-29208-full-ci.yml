name: Diagnose 29208 Full CI
on:
  pull_request:
    branches: [region/central]
permissions:
  contents: write
  pull-requests: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/29208-validation-final-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/29208-validation-final-v2
          fetch-depth: 0
      - name: Capture full validation errors
        shell: bash
        run: |
          cd jichitai-compare
          {
            npm run generate
            npm run progress
            npm run validate:generated
          } > operations/control/diagnose-29208-full-ci.txt 2>&1 || true
          git checkout -- data/generated/municipalities.json operations/progress.json index.html || true
          cd ..
          rm -f .github/workflows/diagnose-29208-full-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/control/diagnose-29208-full-ci.txt .github/workflows/diagnose-29208-full-ci.yml
          git commit -m 'chore: 御所市の完全CI診断を記録'
          git push origin HEAD:fix/29208-validation-final-v2
