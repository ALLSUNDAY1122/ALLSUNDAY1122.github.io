name: Temporary West A Bulky Waste Review Preparation

on:
  pull_request:
    branches:
      - region/west
    paths:
      - jichitai-compare/operations/control/west-a-bulky-review-prep-trigger-20260725.json

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'audit/west-a-bulky-review-prep-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/west-a-bulky-waste-crosscheck-20260725
          for path in \
            jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json \
            jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/audit/west-a-bulky-waste-crosscheck-20260725:$path" > "$path"
          done

      - name: Build compact review preparation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'jichitai-compare';
          const priorityPath = path.join(root, 'operations/audits/west-a-bulky-waste-priority-fetch-20260725.json');
          const outputPath = path.join(root, 'operations/audits/west-a-bulky-waste-review-preparation-20260725.json');
          const payload = JSON.parse(fs.readFileSync(priorityPath, 'utf8'));
          const trim = (value, max = 420) => {
            const text = String(value ?? '').replace(/\s+/g, ' ').trim();
            return text.length > max ? `${text.slice(0, max)}…` : text;
          };

          const records = payload.results.map((item) => {
            const reasons = Array.isArray(item.reasons) ? item.reasons : [];
            const markers = item.markers ?? {};
            const fetchError = item.httpStatus !== 200 || Boolean(item.error);
            const strongImplementationEvidence = Boolean(markers.bulkyTerm && (markers.collection || markers.carryIn));
            const feeEvidence = Boolean(markers.fee);
            const potentialUpgrade = item.status === 'unavailable' && strongImplementationEvidence;
            const potentialDowngrade = item.status === 'verified' && item.httpStatus === 200 && !markers.bulkyTerm && !markers.collection && !markers.carryIn;
            const sourceMaintenance = reasons.some((reason) => ['staleFiscalYear','externalPrimarySource','genericCalendarOnly'].includes(reason));
            const methodReview = reasons.some((reason) => ['missingMethod','summaryMethodMismatch'].includes(reason));
            const feeReview = reasons.some((reason) => ['missingFee','feeExpressionRisk'].includes(reason));
            const navigationFalsePositive = item.status === 'unavailable' && !markers.bulkyTerm && !markers.collection && !markers.carryIn && !feeEvidence;

            let disposition = 'retain_current_pending_spot_check';
            if (fetchError) disposition = 'fetch_error_manual_review';
            else if (potentialUpgrade && feeEvidence) disposition = 'status_upgrade_high_priority';
            else if (potentialUpgrade) disposition = 'status_upgrade_conditions_incomplete';
            else if (potentialDowngrade) disposition = 'status_downgrade_high_priority';
            else if (sourceMaintenance) disposition = 'source_maintenance_review';
            else if (methodReview || feeReview) disposition = 'content_condition_review';
            else if (navigationFalsePositive) disposition = 'likely_false_positive_retain_unavailable';

            const priority =
              (fetchError ? 100 : 0) +
              (potentialDowngrade ? 80 : 0) +
              (potentialUpgrade ? 70 : 0) +
              (sourceMaintenance ? 30 : 0) +
              (methodReview ? 20 : 0) +
              (feeReview ? 15 : 0) +
              Number(item.score ?? 0);

            return {
              code: item.code,
              name: item.name,
              prefecture: item.prefecture,
              currentStatus: item.status,
              currentSummary: item.summary,
              sourceUrl: item.sourceUrl,
              finalUrl: item.finalUrl,
              httpStatus: item.httpStatus,
              error: item.error,
              score: item.score,
              reasons,
              markers: {
                bulkyTerm: Boolean(markers.bulkyTerm),
                collection: Boolean(markers.collection),
                carryIn: Boolean(markers.carryIn),
                reservation: Boolean(markers.reservation),
                fee: Boolean(markers.fee),
                current2026: Boolean(markers.current2026),
                old2025: Boolean(markers.old2025),
                ongoing: Boolean(markers.ongoing)
              },
              signals: {
                strongImplementationEvidence,
                feeEvidence,
                potentialUpgrade,
                potentialDowngrade,
                sourceMaintenance,
                methodReview,
                feeReview,
                navigationFalsePositive
              },
              disposition,
              manualReviewPriority: priority,
              excerpts: (item.excerpts ?? []).slice(0, 4).map((entry) => ({ term: entry.term, snippet: trim(entry.snippet) }))
            };
          }).sort((a, b) => b.manualReviewPriority - a.manualReviewPriority || a.code.localeCompare(b.code));

          const groups = Object.fromEntries([...new Set(records.map((item) => item.disposition))].sort().map((key) => [key, records.filter((item) => item.disposition === key).map((item) => item.code)]));
          const summary = Object.fromEntries(Object.entries(groups).map(([key, codes]) => [key, codes.length]));
          const result = {
            schemaVersion: '1.0.0',
            auditId: 'west-a-bulky-waste-review-preparation-20260725',
            generatedAt: new Date().toISOString(),
            sourcePullRequest: 3634,
            preparationPullRequest: Number(process.env.PR_NUMBER),
            preparationWorkflowRunId: Number(process.env.RUN_ID),
            scope: {
              municipalityCount: 226,
              selectedPriorityCount: records.length,
              expectedPriorityCount: 65,
              prefectureCodes: ['33','37','39','40','43','46']
            },
            summary,
            groups,
            records,
            policy: [
              '機械マーカーだけでstatusを変更しない',
              'unavailableは現行の処理方法・対象・料金・申込条件を公式情報で確認できた場合のみverified候補とする',
              'verifiedは主出典に制度本文がなく、他の現行公式根拠も確認できない場合のみdowngrade候補とする',
              'ナビゲーションやAdobe Readerの無料表記などの偽陽性を除外する'
            ],
            status: records.length === 65 ? 'prepared_for_official_review' : 'candidate_count_mismatch',
            releaseBlocker: 'none_candidate_review_only'
          };
          fs.writeFileSync(outputPath, JSON.stringify(result, null, 2) + '\n');
          if (records.length !== 65) throw new Error(`Expected 65 records, got ${records.length}`);
          NODE

      - name: Validate repository
        working-directory: jichitai-compare
        run: |
          npm run validate:generated
          node --check app.js

      - name: Commit review preparation
        shell: bash
        run: |
          set -euo pipefail
          rm -f jichitai-compare/operations/control/west-a-bulky-review-prep-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jichitai-compare/operations/audits/west-a-bulky-waste-crosscheck-20260725.json \
            jichitai-compare/operations/audits/west-a-bulky-waste-priority-fetch-20260725.json \
            jichitai-compare/operations/audits/west-a-bulky-waste-review-preparation-20260725.json \
            jichitai-compare/operations/control/west-a-bulky-review-prep-trigger-20260725.json
          git commit -m 'audit: 西日本A粗大ごみ65候補を公式確認向けに分類'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
