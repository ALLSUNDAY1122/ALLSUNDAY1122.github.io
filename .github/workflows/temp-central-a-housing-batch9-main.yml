name: Temporary Central A Housing Batch 9 Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/central-a-housing-batch9-main-trigger-20260725.json

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sync/central-a-housing-batch9-main-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to latest main and fetch region
        shell: bash
        run: |
          git fetch --quiet --no-tags origin main:refs/remotes/origin/main region/central:refs/remotes/origin/region/central
          git reset --hard origin/main

      - name: Copy audited batch 9 source files
        shell: bash
        run: |
          paths=(
            jichitai-compare/data/municipalities/16/16210.json
            jichitai-compare/data/municipalities/17/17461.json
            jichitai-compare/data/municipalities/17/17463.json
            jichitai-compare/data/municipalities/21/21381.json
            jichitai-compare/data/municipalities/23/23446.json
            jichitai-compare/operations/tasks/16210.json
            jichitai-compare/operations/tasks/17461.json
            jichitai-compare/operations/tasks/17463.json
            jichitai-compare/operations/tasks/21381.json
            jichitai-compare/operations/tasks/23446.json
            jichitai-compare/operations/audits/central-a-housing-classification-batch9-decisions-20260725.json
            jichitai-compare/operations/control/regions/central.json
            jichitai-compare/operations/control/session-checkpoints/central-a.json
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/region/central:${path}" > "$path"
          done

      - name: Regenerate and validate national outputs
        id: validate
        continue-on-error: true
        working-directory: jichitai-compare
        shell: bash
        run: |
          diagnostic='operations/audits/central-a-housing-batch9-main-diagnostic-20260725.log'
          rm -f "$diagnostic"
          if ! npm run check > /tmp/central-a-batch9-check.log 2>&1; then
            tail -n 240 /tmp/central-a-batch9-check.log > "$diagnostic"
            exit 1
          fi
          node --check app.js

      - name: Persist validation diagnostic
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jichitai-compare/operations/audits/central-a-housing-batch9-main-diagnostic-20260725.log
          git commit -m 'diagnostic: 第9群全国同期の検証失敗を記録'
          git push --force origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Reject unexpected generated changes
        shell: bash
        run: |
          allowed='^(jichitai-compare/(data/municipalities/(16/16210|17/(17461|17463)|21/21381|23/23446)\.json|operations/tasks/(16210|17461|17463|21381|23446)\.json|operations/audits/central-a-housing-classification-batch9-decisions-20260725\.json|operations/control/regions/central\.json|operations/control/session-checkpoints/central-a\.json|data/generated/(municipalities|municipality-pages)\.json|operations/progress\.json|municipality/(16210|17461|17463|21381|23446)/index\.html|sitemap\.xml))$'
          unexpected=$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changes:'
            echo "$unexpected"
            exit 1
          fi

      - name: Create clean commit on latest main
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/central-a-housing-batch9-main-trigger-20260725.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No synchronization changes.'
            exit 0
          fi
          git commit -m 'sync: 中日本A住宅支援分類第9群を全国反映'
          git push --force origin "HEAD:${GITHUB_HEAD_REF}"
