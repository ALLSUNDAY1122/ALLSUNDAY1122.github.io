name: CPA Product Preflight

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cpa-product-preflight
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'ALLSUNDAY1122' && github.event.issue.title == '[CPA] Product Preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 279-question content gates
        run: |
          set -euo pipefail
          python learning-sprint/cpa-short-answer/r9-mock/generate_and_audit_r9.py
          python learning-sprint/cpa-short-answer/integration/integrate_279.py
          python automation/learning-sprint-question-pipeline/validate_questions.py learning-sprint/cpa-short-answer/integration/learning-sprint-audit.json
          python learning-sprint/cpa-short-answer/integration/validate_279_cpa.py
      - name: Static Golden Master and data audit
        run: |
          set -euo pipefail
          python cpa-short-answer-sprint/scripts/validate_ui.py
          node --check cpa-short-answer-sprint/app-v21.js
          python -m json.tool cpa-short-answer-sprint/manifest.json >/dev/null
          python -m json.tool cpa-short-answer-sprint/audit/ui-30-state-manifest.json >/dev/null
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local product server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cpa-http.log 2>&1 &
          echo $! > /tmp/cpa-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/cpa-short-answer-sprint/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/cpa-http.log
          exit 1
      - name: Golden Master 30-state browser audit
        env:
          BASE_URL: http://127.0.0.1:4173/cpa-short-answer-sprint/
        run: node cpa-short-answer-sprint/scripts/capture_30_states.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpa-product-preflight
          path: |
            cpa-short-answer-sprint/audit/screenshots/
            cpa-short-answer-sprint/audit/screenshot-audit-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Report
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `CPA Product Preflight finished. status=${{ job.status }}; run_id=${context.runId}. No TestFlight/App Store action performed.`});
