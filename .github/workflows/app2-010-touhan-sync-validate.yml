name: APP2-010 Touhan Content Validate

on:
  push:
    branches: [main]
    paths:
      - 'automation/app2-010-touhan-sync-validate-command.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical 360 questions
        id: canonical
        continue-on-error: true
        run: python scripts/app2_010_validate_touhan_canonical.py
      - name: Check canonical runtime entry
        id: runtime
        continue-on-error: true
        run: |
          node --check touroku-hanbaisha-sprint/app-v07.js
          node --check touroku-hanbaisha-sprint/choice-balance-v07.js
          node --check touroku-hanbaisha-sprint/r1-canonical-loader-v08.js
          grep -q 'choice-balance-v07.js' touroku-hanbaisha-sprint/index.html
          grep -q 'r1-canonical-loader-v08.js' touroku-hanbaisha-sprint/index.html
          grep -q 'history-calendar-v02.js' touroku-hanbaisha-sprint/index.html
          if grep -Eq 'questions\.js|questions-extra\.js|questions-v05-|app-v06\.js' touroku-hanbaisha-sprint/index.html; then exit 1; fi
      - name: Test history calendar regression
        id: history
        continue-on-error: true
        run: node touroku-hanbaisha-sprint/validate-history-calendar.mjs
      - name: Persist validation evidence
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          HISTORY: ${{ steps.history.outcome }}
        run: |
          mkdir -p automation/audits
          REQUEST_ID=$(node -p "require('./automation/app2-010-touhan-sync-validate-command.json').request_id")
          node - <<'NODE' "$REQUEST_ID"
          const fs=require('fs');
          const requestId=process.argv[2];
          const norm=x=>x==='success'?'PASS':'FAIL';
          const out={
            request_id:requestId,
            canonical_questions:360,
            canonical_validation:norm(process.env.CANONICAL),
            canonical_runtime_entry:norm(process.env.RUNTIME),
            history_calendar:norm(process.env.HISTORY),
            timestamp:new Date().toISOString()
          };
          fs.writeFileSync('automation/audits/app2-010-touhan-sync-validate.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/audits/app2-010-touhan-sync-validate.json
          git commit -m 'Persist APP2-010 Touhan content validation' || true
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Enforce validation result
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          HISTORY: ${{ steps.history.outcome }}
        run: |
          test "$CANONICAL" = success
          test "$RUNTIME" = success
          test "$HISTORY" = success
