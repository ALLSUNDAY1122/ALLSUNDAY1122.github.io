name: Temporary West B Post Completion Maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - jichitai-compare/operations/control/west-b-post-completion-trigger-20260725.json

permissions:
  contents: write

jobs:
  correct-main:
    if: github.head_ref == 'fix/west-b-post-completion-broken-sources-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/west-b-post-completion-broken-sources-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update two broken official sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'jichitai-compare';
          const checkedAt = '2026-07-25';
          const updatedAt = '2026-07-25T12:45:00+09:00';
          const write = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const unique = (values) => [...new Set(values.filter(Boolean))];

          const updates = [
            {
              code: '31384',
              prefectureCode: '31',
              name: '日吉津村',
              service: 'disasterPrevention',
              oldUrl: 'https://www.hiezu.jp/list/soumu/y121/u509/e970/',
              newUrl: 'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%A5%E6%B3%A2%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/',
              additionalSources: [
                'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%AA%E6%B0%B4%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/',
                'https://www.hiezu.jp/%E5%9C%B0%E5%9F%9F%E9%98%B2%E7%81%BD%E8%A8%88%E7%94%BB%E3%82%92%E8%A6%8B%E7%9B%B4%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F/'
              ],
              evidence: '新CMSの津波・洪水ハザードマップと令和7年度地域防災計画見直しページを確認'
            },
            {
              code: '45402',
              prefectureCode: '45',
              name: '新富町',
              service: 'childMedical',
              oldUrl: 'https://www.town.shintomi.lg.jp/1061.htm',
              newUrl: 'https://www.town.shintomi.lg.jp/item/1600.htm',
              additionalSources: [],
              evidence: '18歳年度末まで入院・外来・調剤の自己負担なしを直接制度ページで再確認'
            }
          ];

          const definitions = read(path.join(base, 'data/service-definitions.json')).services.map((item) => item.id);
          for (const update of updates) {
            const municipalityPath = path.join(base, 'data/municipalities', update.prefectureCode, `${update.code}.json`);
            const municipality = read(municipalityPath);
            const service = municipality.services[update.service];
            if (!service) throw new Error(`${update.code}/${update.service} missing`);
            service.source = { url: update.newUrl, checkedAt };
            if (update.additionalSources.length) {
              service.additionalSources = update.additionalSources.map((url) => ({ url, checkedAt }));
            } else {
              delete service.additionalSources;
            }
            municipality.updatedAt = checkedAt;
            write(municipalityPath, municipality);

            const taskPath = path.join(base, 'operations/tasks', `${update.code}.json`);
            const task = read(taskPath);
            const entries = definitions.map((id) => [id, municipality.services[id]]);
            task.completedServices = entries.filter(([, s]) => ['verified', 'unavailable'].includes(s?.status)).map(([id]) => id);
            task.verifiedCount = entries.filter(([, s]) => s?.status === 'verified').length;
            task.researchingCount = entries.filter(([, s]) => s?.status === 'researching').length;
            task.unavailableCount = entries.filter(([, s]) => s?.status === 'unavailable').length;
            task.needsMediumReviewCount = entries.filter(([, s]) => s?.status === 'needs_medium_review').length;
            const nextIndex = entries.findIndex(([, s]) => !['verified', 'unavailable'].includes(s?.status));
            task.nextServiceIndex = nextIndex === -1 ? definitions.length : nextIndex;
            task.currentService = definitions[task.nextServiceIndex] ?? null;
            task.officialSources = unique(entries.filter(([, s]) => ['verified', 'unavailable'].includes(s?.status)).map(([, s]) => s?.source?.url));
            task.lastCheckedAt = checkedAt;
            task.lastUpdatedAt = updatedAt;
            task.lastUpdatedBy = '西日本調査班B';
            task.notes = Array.isArray(task.notes) ? task.notes : [];
            const note = `${checkedAt}: ${update.service}の旧主出典404を現行公式ページへ更新。制度内容・statusは変更なし。`;
            if (!task.notes.includes(note)) task.notes.push(note);
            write(taskPath, task);
          }

          const audit = {
            schemaVersion: '1.0.0',
            auditId: 'west-b-post-completion-source-maintenance-20260725',
            sessionId: 'west-b',
            checkedAt: updatedAt,
            trigger: { coordinatorPullRequest: 3320, reason: 'correction_reverification_detected_http_404' },
            scope: { detectedBrokenOfficialSourceCount: 2, correctedBrokenOfficialSourceCount: 2 },
            corrections: updates.map((item) => ({
              code: item.code,
              name: item.name,
              service: item.service,
              beforeUrl: item.oldUrl,
              afterUrl: item.newUrl,
              statusChanged: false,
              contentChanged: false,
              evidence: item.evidence
            })),
            result: { status: 'corrected_pending_main_pr', unresolvedConfirmedErrorCount: 0 }
          };
          write(path.join(base, 'operations/audits/west-b-post-completion-source-maintenance-20260725.json'), audit);

          const checkpointPath = path.join(base, 'operations/control/session-checkpoints/west-b.json');
          const checkpoint = read(checkpointPath);
          checkpoint.postCompletionSourceMaintenance = {
            auditId: audit.auditId,
            triggerPullRequest: 3320,
            detectedBrokenOfficialSourceCount: 2,
            correctedBrokenOfficialSourceCount: 2,
            municipalityCodes: ['31384', '45402'],
            serviceIds: ['disasterPrevention', 'childMedical'],
            status: 'main_correction_validated_pending_pr',
            unresolvedConfirmedErrorCount: 0
          };
          checkpoint.updatedAt = updatedAt;
          write(checkpointPath, checkpoint);
          NODE
      - name: Regenerate and validate
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit correction data
        shell: bash
        run: |
          rm -f jichitai-compare/operations/control/west-b-post-completion-trigger-20260725.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          git commit -m "fix: 西日本Bの公式出典切れ2件を保守"
          git push origin HEAD:fix/west-b-post-completion-broken-sources-20260725

  sync-region:
    if: github.head_ref == 'ops/run-west-b-post-completion-region-sync-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/west-b-post-completion-region-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read sync metadata and copy main source of truth
        shell: bash
        run: |
          git fetch origin main
          git fetch origin "$GITHUB_HEAD_REF" --depth=1
          git show FETCH_HEAD:jichitai-compare/operations/control/west-b-post-completion-trigger-20260725.json > /tmp/west-b-sync-trigger.json
          files=(
            jichitai-compare/data/municipalities/31/31384.json
            jichitai-compare/data/municipalities/45/45402.json
            jichitai-compare/operations/tasks/31384.json
            jichitai-compare/operations/tasks/45402.json
            jichitai-compare/operations/audits/west-b-post-completion-source-maintenance-20260725.json
            jichitai-compare/operations/control/session-checkpoints/west-b.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/main:$file" > "$file"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const trigger = JSON.parse(fs.readFileSync('/tmp/west-b-sync-trigger.json', 'utf8'));
          const p = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(p, 'utf8'));
          checkpoint.postCompletionSourceMaintenance = {
            ...(checkpoint.postCompletionSourceMaintenance ?? {}),
            status: 'region_sync_validated_pending_pr',
            mainPullRequest: trigger.mainPullRequest,
            mainCiRun: trigger.mainCiRun,
            mainMergeCommit: trigger.mainMergeCommit,
            regionBranch: 'sync/west-b-post-completion-region-20260725'
          };
          checkpoint.updatedAt = trigger.updatedAt;
          fs.writeFileSync(p, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
      - name: Regenerate and validate region
        working-directory: jichitai-compare
        run: |
          npm run generate
          npm run progress
          npm run validate:generated
      - name: Commit region sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          git commit -m "sync: 西日本Bの公式出典保守をregion/westへ反映"
          git push origin HEAD:sync/west-b-post-completion-region-20260725

  verify-public:
    if: github.head_ref == 'ops/run-west-b-post-completion-public-verify-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/west-b-post-completion-public-20260725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Read metadata and verify public links
        shell: bash
        run: |
          git fetch origin "$GITHUB_HEAD_REF" --depth=1
          git show FETCH_HEAD:jichitai-compare/operations/control/west-b-post-completion-trigger-20260725.json > /tmp/west-b-public-trigger.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const trigger = JSON.parse(fs.readFileSync('/tmp/west-b-public-trigger.json', 'utf8'));
          const targets = [
            ['31384', 'https://www.hiezu.jp/%E6%97%A5%E5%90%89%E6%B4%A5%E6%9D%91%E6%B4%A5%E6%B3%A2%E3%83%8F%E3%82%B6%E3%83%BC%E3%83%89%E3%83%9E%E3%83%83%E3%83%97/'],
            ['45402', 'https://www.town.shintomi.lg.jp/item/1600.htm']
          ];
          const base = 'https://allsunday1122.github.io/jichitai-compare';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let checks = [];
          let passed = false;
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            checks = [];
            let allOk = true;
            for (const [code, expected] of targets) {
              const url = `${base}/municipality/${code}/`;
              try {
                const response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(20000), headers: { 'user-agent': 'WestBPostCompletionVerification/1.0' } });
                const text = await response.text();
                const ok = response.ok && text.includes(expected.replaceAll('&', '&amp;')) || response.ok && text.includes(expected);
                checks.push({ code, url, expected, httpStatus: response.status, ok });
                if (!ok) allOk = false;
              } catch (error) {
                checks.push({ code, url, expected, httpStatus: null, ok: false, error: String(error?.message ?? error) });
                allOk = false;
              }
            }
            try {
              const generatedUrl = `${base}/data/generated/municipalities.json`;
              const response = await fetch(generatedUrl, { redirect: 'follow', signal: AbortSignal.timeout(30000), headers: { 'user-agent': 'WestBPostCompletionVerification/1.0' } });
              const text = await response.text();
              const ok = response.ok && targets.every(([code, expected]) => text.includes(`\"code\":\"${code}\"`) || text.includes(`\"code\": \"${code}\"`)) && targets.every(([, expected]) => text.includes(expected));
              checks.push({ code: 'generated', url: generatedUrl, expected: 'two updated official source URLs', httpStatus: response.status, ok });
              if (!ok) allOk = false;
            } catch (error) {
              checks.push({ code: 'generated', url: `${base}/data/generated/municipalities.json`, expected: 'two updated official source URLs', httpStatus: null, ok: false, error: String(error?.message ?? error) });
              allOk = false;
            }
            if (allOk) { passed = true; break; }
            await sleep(10000);
          }
          const verifiedAt = new Date().toISOString();
          const result = {
            schemaVersion: '1.0.0',
            verificationId: 'west-b-post-completion-source-public-verification-20260725',
            sessionId: 'west-b',
            verifiedAt,
            status: passed ? 'passed' : 'failed',
            checks
          };
          const auditPath = 'jichitai-compare/operations/audits/west-b-post-completion-source-public-verification-20260725.json';
          fs.writeFileSync(auditPath, JSON.stringify(result, null, 2) + '\n');
          if (!passed) { console.error(JSON.stringify(result, null, 2)); process.exit(1); }
          const p = 'jichitai-compare/operations/control/session-checkpoints/west-b.json';
          const checkpoint = JSON.parse(fs.readFileSync(p, 'utf8'));
          checkpoint.postCompletionSourceMaintenance = {
            ...(checkpoint.postCompletionSourceMaintenance ?? {}),
            status: 'completed_public_verified_region_integrated',
            mainPullRequest: trigger.mainPullRequest,
            mainCiRun: trigger.mainCiRun,
            mainMergeCommit: trigger.mainMergeCommit,
            regionPullRequest: trigger.regionPullRequest,
            regionCiRun: trigger.regionCiRun,
            regionMergeCommit: trigger.regionMergeCommit,
            publicVerification: 'passed',
            publicVerificationId: result.verificationId,
            unresolvedConfirmedErrorCount: 0
          };
          checkpoint.updatedAt = verifiedAt;
          fs.writeFileSync(p, JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
      - name: Commit verification record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jichitai-compare
          git commit -m "audit: 西日本Bの公式出典保守を公開確認"
          git push origin HEAD:verify/west-b-post-completion-public-20260725
