name: Sync Yorugatari to user site

# Sync marker: source main integration finalized.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-yorugatari.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out user site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current Yorugatari branch
        run: |
          git clone --depth 1 --branch main \
            https://github.com/ALLSUNDAY1122/Kohei-Morita000.github.io.git /tmp/yorugatari-source

      - name: Preserve public-only approved stories
        shell: bash
        run: |
          mkdir -p /tmp/yorugatari-overrides/assets
          if [ -f yorugatari/index.html ]; then cp yorugatari/index.html /tmp/yorugatari-overrides/index.html; fi
          if [ -f yorugatari/assets/app.js ]; then cp yorugatari/assets/app.js /tmp/yorugatari-overrides/assets/app.js; fi
          if [ -f yorugatari/assets/archive.js ]; then cp yorugatari/assets/archive.js /tmp/yorugatari-overrides/assets/archive.js; fi
          if [ -f yorugatari/assets/story.js ]; then cp yorugatari/assets/story.js /tmp/yorugatari-overrides/assets/story.js; fi
          if [ -f yorugatari/assets/styles.css ]; then cp yorugatari/assets/styles.css /tmp/yorugatari-overrides/assets/styles.css; fi
          if [ -f yorugatari/privacy.html ]; then cp yorugatari/privacy.html /tmp/yorugatari-overrides/privacy.html; fi
          if [ -f yorugatari/assets/notion-stories.js ]; then cp yorugatari/assets/notion-stories.js /tmp/yorugatari-overrides/assets/notion-stories.js; fi
          if [ -d yorugatari/series ]; then cp -a yorugatari/series /tmp/yorugatari-overrides/series; fi

      - name: Copy public files and rewrite URLs
        shell: bash
        run: |
          rm -rf yorugatari
          cp -a /tmp/yorugatari-source/yorugatari ./yorugatari
          rm -rf yorugatari/editorial

          python - <<'PY'
          from pathlib import Path

          root = Path('yorugatari')
          old_absolute = 'https://allsunday1122.github.io/Kohei-Morita000.github.io/yorugatari/'
          new_absolute = 'https://allsunday1122.github.io/yorugatari/'
          old_path = '/Kohei-Morita000.github.io/yorugatari/'
          new_path = '/yorugatari/'

          text_suffixes = {'.html', '.js', '.css', '.json', '.webmanifest', '.xml', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_absolute, new_absolute).replace(old_path, new_path)
              path.write_text(text, encoding='utf-8')

          manifest = root / 'site.webmanifest'
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              for old_description in (
                  '3分で読めるオリジナル短編ホラーサイト',
                  '約8分で読めるオリジナル長編ホラーサイト',
              ):
                  text = text.replace(old_description, '約5分で読めるオリジナル中編ホラーサイト')
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Restore public-only approved stories
        shell: bash
        run: |
          if [ -f /tmp/yorugatari-overrides/index.html ]; then cp /tmp/yorugatari-overrides/index.html yorugatari/index.html; fi
          if [ -f /tmp/yorugatari-overrides/assets/app.js ]; then cp /tmp/yorugatari-overrides/assets/app.js yorugatari/assets/app.js; fi
          if [ -f /tmp/yorugatari-overrides/assets/archive.js ]; then cp /tmp/yorugatari-overrides/assets/archive.js yorugatari/assets/archive.js; fi
          if [ -f /tmp/yorugatari-overrides/assets/story.js ]; then cp /tmp/yorugatari-overrides/assets/story.js yorugatari/assets/story.js; fi
          if [ -f /tmp/yorugatari-overrides/assets/styles.css ]; then cp /tmp/yorugatari-overrides/assets/styles.css yorugatari/assets/styles.css; fi
          if [ -f /tmp/yorugatari-overrides/privacy.html ]; then cp /tmp/yorugatari-overrides/privacy.html yorugatari/privacy.html; fi
          if [ -f /tmp/yorugatari-overrides/assets/notion-stories.js ]; then cp /tmp/yorugatari-overrides/assets/notion-stories.js yorugatari/assets/notion-stories.js; fi
          if [ -d /tmp/yorugatari-overrides/series ]; then rm -rf yorugatari/series; cp -a /tmp/yorugatari-overrides/series yorugatari/series; fi

      - name: Validate deployed files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('yorugatari')
          required = [
              root / 'index.html',
              root / 'assets' / 'styles.css',
              root / 'assets' / 'stories.js',
              root / 'assets' / 'app.js',
              root / 'assets' / 'story.js',
              root / 'assets' / 'notion-stories.js',
              root / 'site.webmanifest',
          ]
          core_stories = sorted((root / 'stories').glob('*.html'))
          if len(core_stories) != 12:
              raise SystemExit(f'Expected 12 core story pages, found {len(core_stories)}')
          required += core_stories
          for path in required:
              if not path.exists():
                  raise SystemExit(f'Missing required file: {path}')

          text_suffixes = {'.html', '.js', '.css', '.json', '.webmanifest', '.xml', '.txt'}
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in text_suffixes:
                  text = path.read_text(encoding='utf-8')
                  if 'Kohei-Morita000.github.io/yorugatari' in text:
                      raise SystemExit(f'Old URL remains in {path}')

          stories_text = (root / 'assets' / 'stories.js').read_text(encoding='utf-8')
          prefix = 'window.STORIES = '
          data = json.loads(stories_text[len(prefix):].rstrip()[:-1])
          if len(data) != 12:
              raise SystemExit(f'Expected 12 story records, found {len(data)}')
          minutes_by_slug = {story['slug']: int(story['minutes']) for story in data}
          if any(story.get('length') != '中編' or int(story.get('minutes', 0)) != 5 for story in data):
              raise SystemExit('Core story list contains a non-medium or non-five-minute record')

          related_pattern = re.compile(
              r'<a class="rank-item" href="([^"]+)\.html"[^>]*>.*?<small>[^<]*・約(\d+)分</small>',
              re.S,
          )
          for path in core_stories:
              text = path.read_text(encoding='utf-8')
              slug_match = re.search(r'<body data-slug="([^"]+)">', text)
              if not slug_match:
                  raise SystemExit(f'Missing slug in {path}')
              slug = slug_match.group(1)
              canonical = f'https://allsunday1122.github.io/yorugatari/stories/{slug}.html'
              required_markers = [
                  f'<link rel="canonical" href="{canonical}">',
                  f'"timeRequired": "PT{minutes_by_slug[slug]}M"',
                  '<span>中編</span><span>約5分</span>',
              ]
              for marker in required_markers:
                  if marker not in text:
                      raise SystemExit(f'Core metadata mismatch in {path}: {marker}')

              related = related_pattern.findall(text)
              if len(related) != 2:
                  raise SystemExit(f'Expected two related links in {path}, found {len(related)}')
              for related_slug, actual_minutes in related:
                  related_slug = Path(related_slug).name
                  expected_minutes = minutes_by_slug.get(related_slug)
                  if expected_minutes is None or int(actual_minutes) != expected_minutes:
                      raise SystemExit(
                          f'Related reading-time mismatch in {path}: '
                          f'{related_slug} expected {expected_minutes}, got {actual_minutes}'
                      )

          manifest_text = (root / 'site.webmanifest').read_text(encoding='utf-8')
          if '約5分で読めるオリジナル中編ホラーサイト' not in manifest_text:
              raise SystemExit('Web manifest reading-time description is stale')
          index_text = (root / 'index.html').read_text(encoding='utf-8')
          if '約8分' in index_text:
              raise SystemExit('Old eight-minute label remains on the public index')
          print('Public URL, metadata and reading-time checks passed for all 12 core stories.')
          PY
          node --check yorugatari/assets/stories.js
          node --check yorugatari/assets/notion-stories.js
          node --check yorugatari/assets/app.js

      - name: Commit deployed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yorugatari
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'Deploy Yorugatari at root Pages URL'
          git push origin main
