name: Sync Yorugatari to user site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-yorugatari.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out user site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current Yorugatari branch
        run: |
          git clone --depth 1 --branch agent/yorugatari-longform \
            https://github.com/ALLSUNDAY1122/Kohei-Morita000.github.io.git /tmp/yorugatari-source

      - name: Copy public files and rewrite URLs
        shell: bash
        run: |
          rm -rf yorugatari
          cp -a /tmp/yorugatari-source/yorugatari ./yorugatari
          rm -rf yorugatari/editorial

          python - <<'PY'
          from pathlib import Path

          root = Path('yorugatari')
          old_absolute = 'https://allsunday1122.github.io/Kohei-Morita000.github.io/yorugatari/'
          new_absolute = 'https://allsunday1122.github.io/yorugatari/'
          old_path = '/Kohei-Morita000.github.io/yorugatari/'
          new_path = '/yorugatari/'

          text_suffixes = {'.html', '.js', '.css', '.json', '.webmanifest', '.xml', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_absolute, new_absolute).replace(old_path, new_path)
              path.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          replacements = {
              '夜語り｜3分で読めるオリジナル怖い話': '夜語り｜約8分で読めるオリジナル怖い話',
              '心霊、人怖、意味が分かると怖い話、ネット怪談、都市伝説風のオリジナル短編を収録。全作品フィクション。眠る前の3分に、ひとつだけ。': '心霊、人怖、意味が分かると怖い話、ネット怪談、都市伝説風のオリジナル長編を収録。全作品フィクション。眠る前に、ひとつだけ。',
              '3分で読めるオリジナル短編ホラーサイト。': '約8分で読めるオリジナル長編ホラーサイト。',
              '3分で読めて、少しだけ後を引くオリジナル短編。': '約8分で読めて、少しだけ後を引くオリジナル長編。',
              '3分で読めて、少しだけ後を引くオリジナル短編を集めました。': '約8分で読めて、少しだけ後を引くオリジナル長編を集めました。',
              '通勤時間や眠る前に読み切れる掌編・短編を中心に収録します。': '通勤時間や眠る前に読み切れる長編怪談を中心に収録します。',
              'Original short horror stories': 'Original horror stories',
              '約4分': '約8分',
              '約3分': '約8分',
              '約2分': '約8分',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          manifest = root / 'site.webmanifest'
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              text = text.replace('3分で読めるオリジナル短編ホラーサイト', '約8分で読めるオリジナル長編ホラーサイト')
              manifest.write_text(text, encoding='utf-8')

          required = [
              root / 'index.html',
              root / 'assets' / 'styles.css',
              root / 'assets' / 'stories.js',
              root / 'assets' / 'app.js',
              root / 'assets' / 'story.js',
          ]
          required += list((root / 'stories').glob('*.html'))
          if len(list((root / 'stories').glob('*.html'))) != 12:
              raise SystemExit('Expected 12 story pages')
          for path in required:
              if not path.exists():
                  raise SystemExit(f'Missing required file: {path}')

          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in text_suffixes:
                  text = path.read_text(encoding='utf-8')
                  if 'Kohei-Morita000.github.io/yorugatari' in text:
                      raise SystemExit(f'Old URL remains in {path}')
          PY

      - name: Commit deployed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yorugatari
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'Deploy Yorugatari at root Pages URL'
          git push origin main
