name: Sync Yorugatari to user site

# Sync marker: read-receipt medium version finalized.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-yorugatari.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out user site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current Yorugatari branch
        run: |
          git clone --depth 1 --branch agent/yorugatari-longform \
            https://github.com/ALLSUNDAY1122/Kohei-Morita000.github.io.git /tmp/yorugatari-source

      - name: Preserve public-only approved stories
        shell: bash
        run: |
          mkdir -p /tmp/yorugatari-overrides/assets
          if [ -f yorugatari/index.html ]; then cp yorugatari/index.html /tmp/yorugatari-overrides/index.html; fi
          if [ -f yorugatari/assets/app.js ]; then cp yorugatari/assets/app.js /tmp/yorugatari-overrides/assets/app.js; fi
          if [ -f yorugatari/assets/notion-stories.js ]; then cp yorugatari/assets/notion-stories.js /tmp/yorugatari-overrides/assets/notion-stories.js; fi
          if [ -d yorugatari/series ]; then cp -a yorugatari/series /tmp/yorugatari-overrides/series; fi

      - name: Copy public files and rewrite URLs
        shell: bash
        run: |
          rm -rf yorugatari
          cp -a /tmp/yorugatari-source/yorugatari ./yorugatari
          rm -rf yorugatari/editorial

          python - <<'PY'
          from pathlib import Path

          root = Path('yorugatari')
          old_absolute = 'https://allsunday1122.github.io/Kohei-Morita000.github.io/yorugatari/'
          new_absolute = 'https://allsunday1122.github.io/yorugatari/'
          old_path = '/Kohei-Morita000.github.io/yorugatari/'
          new_path = '/yorugatari/'

          text_suffixes = {'.html', '.js', '.css', '.json', '.webmanifest', '.xml', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_absolute, new_absolute).replace(old_path, new_path)
              path.write_text(text, encoding='utf-8')

          manifest = root / 'site.webmanifest'
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              text = text.replace('3分で読めるオリジナル短編ホラーサイト', '約8分で読めるオリジナル長編ホラーサイト')
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Restore public-only approved stories
        shell: bash
        run: |
          if [ -f /tmp/yorugatari-overrides/index.html ]; then cp /tmp/yorugatari-overrides/index.html yorugatari/index.html; fi
          if [ -f /tmp/yorugatari-overrides/assets/app.js ]; then cp /tmp/yorugatari-overrides/assets/app.js yorugatari/assets/app.js; fi
          if [ -f /tmp/yorugatari-overrides/assets/notion-stories.js ]; then cp /tmp/yorugatari-overrides/assets/notion-stories.js yorugatari/assets/notion-stories.js; fi
          if [ -d /tmp/yorugatari-overrides/series ]; then rm -rf yorugatari/series; cp -a /tmp/yorugatari-overrides/series yorugatari/series; fi

      - name: Validate deployed files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('yorugatari')
          required = [
              root / 'index.html',
              root / 'assets' / 'styles.css',
              root / 'assets' / 'stories.js',
              root / 'assets' / 'app.js',
              root / 'assets' / 'story.js',
              root / 'assets' / 'notion-stories.js',
          ]
          core_stories = list((root / 'stories').glob('*.html'))
          if len(core_stories) != 12:
              raise SystemExit(f'Expected 12 core story pages, found {len(core_stories)}')
          required += core_stories
          for path in required:
              if not path.exists():
                  raise SystemExit(f'Missing required file: {path}')

          text_suffixes = {'.html', '.js', '.css', '.json', '.webmanifest', '.xml', '.txt'}
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in text_suffixes:
                  text = path.read_text(encoding='utf-8')
                  if 'Kohei-Morita000.github.io/yorugatari' in text:
                      raise SystemExit(f'Old URL remains in {path}')
          PY
          node --check yorugatari/assets/stories.js
          node --check yorugatari/assets/notion-stories.js
          node --check yorugatari/assets/app.js

      - name: Commit deployed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yorugatari
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'Deploy Yorugatari at root Pages URL'
          git push origin main
