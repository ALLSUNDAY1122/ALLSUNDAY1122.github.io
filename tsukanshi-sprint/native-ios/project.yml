name: TsukanshiNative
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
packages:
  LearningSprintCore:
    path: ../../native-ios/LearningSprintCore
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MN3D2ZM44N

targets:
  TsukanshiNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TsukanshiNativeApp.swift
      - path: TsukanshiNativeConfig.swift
      - path: TsukanshiContentStore.swift
      - path: TsukanshiAppModel.swift
      - path: TsukanshiRootViews.swift
      - path: TsukanshiStudyViews.swift
      - path: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LearningSprintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.tsukanshi
        PRODUCT_NAME: TsukanshiNative
        INFOPLIST_FILE: Info.plist
    scheme:
      testTargets:
        - TsukanshiNativeTests
        - TsukanshiNativeUITests
  TsukanshiNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: TsukanshiNative
      - package: LearningSprintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.tsukanshi.tests
        GENERATE_INFOPLIST_FILE: YES
  TsukanshiNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: TsukanshiNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.tsukanshi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TsukanshiNative
