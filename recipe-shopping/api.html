<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>まとめ買いレシピ AI版</title><style>body{margin:0;background:#f7f3ea;color:#25231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:720px;margin:auto;padding:20px 14px 60px}h1{font-size:24px;margin:0 0 4px}.sub{color:#777268;font-size:13px;margin:0 0 18px}.card{background:#fffdf8;border:1px solid #e7e0d4;border-radius:20px;padding:16px;margin:12px 0}label{display:block;font-size:12px;color:#777268;font-weight:700;margin:12px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #e7e0d4;border-radius:12px;padding:12px;background:#fff}button{border:0;border-radius:14px;padding:13px 16px;font-weight:700}.primary{background:#d95f35;color:white;width:100%}.secondary{background:#ece7de}.drop{display:block;text-align:center;border:2px dashed #ddc9b8;border-radius:18px;padding:20px}.drop input{display:none}#preview{display:none;max-width:100%;max-height:360px;border-radius:14px;margin-top:12px}.row{display:grid;grid-template-columns:1.5fr .75fr .8fr 40px;gap:6px;margin-bottom:8px}.row button{background:#f8e3df;color:#a33d29;padding:0}.bar{height:9px;background:#ebe5dc;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;width:0;background:#d95f35;transition:.2s}.status{font-size:13px;color:#777268;white-space:pre-wrap}.note{font-size:12px;line-height:1.55;color:#777268}.saved{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee4d9;padding:10px 0}.hidden{display:none}</style></head><body><main class="app"><h1>まとめ買いレシピ AI版</h1><p class="sub">Geminiがスクリーンショットから材料を構造化します。</p><section class="card"><label>接続方法</label><select id="mode"><option value="direct">Gemini APIキーで試す</option><option value="worker">Cloudflare Workerを使う</option></select><div id="direct"><label>Gemini APIキー</label><input id="key" type="password" placeholder="AIza..."><p class="note">キーはこの端末内だけに保存します。公開運用ではWorkerを使用してください。</p></div><div id="worker" class="hidden"><label>Worker URL</label><input id="workerUrl" placeholder="https://...workers.dev"></div><label>モデル</label><select id="model"><option value="gemini-2.5-flash">Gemini 2.5 Flash</option><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option></select><button id="saveSettings" class="secondary" style="width:100%;margin-top:12px">設定を保存</button></section><section class="card"><label class="drop"><input id="file" type="file" accept="image/*"><strong>スクリーンショットを選択</strong><div class="note">材料欄が見える画像を選んでください</div></label><img id="preview" alt="選択画像"><div class="bar"><span id="progress"></span></div><div id="status" class="status">画像を選択してください</div><button id="extract" class="primary" disabled>AIで材料を抽出</button></section><section id="result" class="card hidden"><label>料理名</label><input id="name"><label>人数</label><input id="servings" type="number" min="1" value="2"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:17px">材料</h2><button id="add" class="secondary">＋追加</button></div><div id="rows"></div><button id="saveRecipe" class="primary">レシピを保存</button><label>AI補足</label><textarea id="notes" rows="4" readonly></textarea></section><section class="card"><h2 style="font-size:17px">保存レシピ</h2><div id="saved"></div></section></main><script>
const K='recipe-ai-api-v1';let st=JSON.parse(localStorage.getItem(K)||'{"settings":{"mode":"direct","key":"","workerUrl":"","model":"gemini-2.5-flash"},"recipes":[]}'),file=null;const $=id=>document.getElementById(id);function persist(){localStorage.setItem(K,JSON.stringify(st))}function mode(){let d=$('mode').value==='direct';$('direct').classList.toggle('hidden',!d);$('worker').classList.toggle('hidden',d)}$('mode').onchange=mode;function loadSettings(){let s=st.settings;$('mode').value=s.mode;$('key').value=s.key;$('workerUrl').value=s.workerUrl;$('model').value=s.model;mode()}$('saveSettings').onclick=()=>{st.settings={mode:$('mode').value,key:$('key').value.trim(),workerUrl:$('workerUrl').value.trim().replace(/\/$/,''),model:$('model').value};persist();$('status').textContent='接続設定を保存しました'};$('file').onchange=e=>{file=e.target.files[0];if(!file)return;$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';$('extract').disabled=false;$('status').textContent='画像を選択しました'};function b64(f){return new Promise((ok,ng)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f)})}const schema={type:'OBJECT',properties:{recipe_name:{type:'STRING'},servings:{type:'NUMBER'},ingredients:{type:'ARRAY',items:{type:'OBJECT',properties:{name:{type:'STRING'},quantity:{type:'NUMBER'},unit:{type:'STRING'},note:{type:'STRING'},confidence:{type:'NUMBER'}},required:['name','quantity','unit']}},notes:{type:'STRING'}},required:['recipe_name','servings','ingredients']};const prompt=`日本語レシピ画像の材料欄だけを抽出してください。時刻、電池残量、広告、アプリ名、見出し、作り方は除外します。材料名は省略せず復元します。1/2は0.5。1/2個(100g)はquantity=0.5, unit=個, note=100g。小さじ1/2はquantity=0.5, unit=小さじ。3かけ(60g)はquantity=3, unit=かけ, note=60g。読めない箇所は勝手に短縮せずnotesに記載してください。`;async function call(){let s=st.settings,data=await b64(file),mime=file.type||'image/jpeg',payload={imageBase64:data,mimeType:mime,model:s.model,prompt,schema};if(s.mode==='worker'){if(!s.workerUrl)throw Error('Worker URLを設定してください');let r=await fetch(s.workerUrl+'/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.error||'Workerエラー');return j}if(!s.key)throw Error('Gemini APIキーを設定してください');let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(s.model)}:generateContent?key=${encodeURIComponent(s.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inlineData:{mimeType:mime,data}}]}],generationConfig:{responseMimeType:'application/json',responseSchema:schema}})}),j=await r.json();if(!r.ok)throw Error(j.error?.message||'Gemini APIエラー');return JSON.parse(j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'{}')}function row(v={name:'',quantity:'',unit:'個'}){let d=document.createElement('div');d.className='row';d.innerHTML=`<input class="n" value="${String(v.name||'').replace(/"/g,'&quot;')}"><input class="q" type="number" step="0.01" value="${v.quantity??''}"><select class="u">${['g','kg','ml','cc','個','本','枚','袋','パック','箱','かけ','大さじ','小さじ','少々','適量'].map(x=>`<option ${x===v.unit?'selected':''}>${x}</option>`).join('')}</select><button>×</button>`;d.querySelector('button').onclick=()=>d.remove();$('rows').appendChild(d)}$('add').onclick=()=>row();$('extract').onclick=async()=>{if(!file)return;$('extract').disabled=true;$('progress').style.width='20%';$('status').textContent='AIが画像を解析しています…';try{let x=await call();$('progress').style.width='100%';$('name').value=x.recipe_name||'スクリーンショットのレシピ';$('servings').value=Math.max(1,+x.servings||2);$('rows').innerHTML='';(x.ingredients||[]).forEach(row);$('notes').value=x.notes||'';$('result').classList.remove('hidden');$('status').textContent=`抽出完了：${(x.ingredients||[]).length}件`}catch(e){$('progress').style.width='0';$('status').textContent='失敗：'+e.message}finally{$('extract').disabled=false}};function renderSaved(){$('saved').innerHTML=st.recipes.length?st.recipes.map((r,i)=>`<div class="saved"><div><strong>${r.name}</strong><div class="note">${r.servings}人分・${r.ingredients.length}品</div></div><button class="secondary" data-i="${i}">削除</button></div>`).join(''):'<p class="note">まだ保存されていません</p>';$('saved').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{st.recipes.splice(+b.dataset.i,1);persist();renderSaved()})}$('saveRecipe').onclick=()=>{let ns=[...document.querySelectorAll('.n')],qs=[...document.querySelectorAll('.q')],us=[...document.querySelectorAll('.u')],ings=ns.map((n,i)=>({name:n.value.trim(),quantity:+qs[i].value||0,unit:us[i].value})).filter(x=>x.name);if(!$('name').value.trim()||!ings.length)return;$('status').textContent='レシピを保存しました';st.recipes.unshift({name:$('name').value.trim(),servings:Math.max(1,+$('servings').value||2),ingredients:ings});persist();renderSaved()};loadSettings();renderSaved();
</script></body></html>
