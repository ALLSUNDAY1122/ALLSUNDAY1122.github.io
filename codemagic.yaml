workflows:
  splat-native-ios:
    name: Splat Lab Native - Internal TestFlight
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'testflight/splat-native-ios-20260825-build5'
          include: true
          source: true
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.splatlab
        APP_STORE_CONNECT_APP_ID: 6803778932
        XCODE_PROJECT: splat-native-ios/SplatNative.xcodeproj
        XCODE_SCHEME: SplatNative
      xcode: latest
    scripts:
      - name: Stop if App Store Connect app record is not registered
        script: |
          set -euo pipefail
          test "$APP_STORE_CONNECT_APP_ID" = "6803778932"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
      - name: Verify Apple upload toolchain
        script: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test -n "$XCODE_MAJOR"
          test -n "$IOS_SDK_MAJOR"
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect upload requires Xcode 26+ and iOS 26 SDK+; found Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION" >&2
            exit 1
          fi
          echo "PASS: Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION"
      - name: Install required Metal Toolchain
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Disable unrelated msplat LFS datasets
        script: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate deterministic PoC AppIcon
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/splat-native-ios/scripts/make_test_icon.py"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Set build number and generate project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          old='CURRENT_PROJECT_VERSION: 1'
          if old not in text:
              raise SystemExit('Expected CURRENT_PROJECT_VERSION: 1 not found')
          text=text.replace(old, 'CURRENT_PROJECT_VERSION: 5', 1)
          p.write_text(text,encoding='utf-8')
          print('Using TestFlight build number 5')
          PY
          xcodegen generate
      - name: Static release checks
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/splat-native-ios/scripts/validate.sh"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Verify managed certificate private key is available
        script: |
          set -euo pipefail
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"
      - name: Verify Apple Developer Bundle ID exists
        script: |
          set -euo pipefail
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier | grep -Fq "$BUNDLE_ID"
      - name: Fetch existing App Store signing files
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply App Store profile for Internal TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
