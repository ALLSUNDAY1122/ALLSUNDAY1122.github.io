workflows:
  hokenshi-apple-bootstrap:
    name: 保健師国家試験 - Apple Bundle ID Bootstrap
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_ID: jp.allsunday1122.hokenshi
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "testflight/hokenshi-bootstrap"
          include: true
          source: true
    scripts:
      - name: Ensure Explicit Apple Bundle ID exists
        script: |
          set -euo pipefail
          if ! app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier | grep -Fq "$BUNDLE_ID"; then
            app-store-connect bundle-ids create \
              --name "保健師国家試験 学びスプリント" \
              --platform IOS \
              "$BUNDLE_ID"
          fi
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier | grep -F "$BUNDLE_ID"
