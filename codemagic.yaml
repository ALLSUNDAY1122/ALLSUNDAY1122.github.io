workflows:
  splat-native-ios:
    name: Splat Lab Native - Internal TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.splatlab
        APP_STORE_CONNECT_APP_ID: 6803778932
        XCODE_PROJECT: splat-native-ios/SplatNative.xcodeproj
        XCODE_SCHEME: SplatNative
      xcode: latest
    scripts:
      - name: Stop if App Store Connect app record is not registered
        script: |
          set -euo pipefail
          test "$APP_STORE_CONNECT_APP_ID" = "6803778932"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
      - name: Verify Apple upload toolchain
        script: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test -n "$XCODE_MAJOR"
          test -n "$IOS_SDK_MAJOR"
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect upload requires Xcode 26+ and iOS 26 SDK+; found Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION" >&2
            exit 1
          fi
          echo "PASS: Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION"
      - name: Install required Metal Toolchain
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Disable unrelated msplat LFS datasets
        script: |
          set -euo pipefail
          git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate deterministic PoC AppIcon
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/splat-native-ios/scripts/make_test_icon.py"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Set build number and generate project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          old='CURRENT_PROJECT_VERSION: 1'
          if old not in text:
              raise SystemExit('Expected CURRENT_PROJECT_VERSION: 1 not found')
          text=text.replace(old, 'CURRENT_PROJECT_VERSION: 7', 1)
          p.write_text(text,encoding='utf-8')
          print('Using TestFlight build number 7')
          PY
          xcodegen generate
      - name: Static release checks
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/splat-native-ios/scripts/validate.sh"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Verify managed certificate private key is available
        script: |
          set -euo pipefail
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"
      - name: Verify Apple Developer Bundle ID exists
        script: |
          set -euo pipefail
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier | grep -Fq "$BUNDLE_ID"
      - name: Fetch existing App Store signing files
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply App Store profile for Internal TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  splat-build7-asc-readback:
    name: Splat Lab Native - Build 7 ASC Readback
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      vars:
        APP_STORE_APPLE_ID: '6803778932'
        EXPECTED_BUILD: '7'
        EXPECTED_VERSION: '1.0.0'
      xcode: latest
    scripts:
      - name: Wait for Build 7 to become VALID in App Store Connect
        script: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            if app-store-connect apps builds "$APP_STORE_APPLE_ID" \
              --build-version-number "$EXPECTED_BUILD" \
              --version-string "$EXPECTED_VERSION" \
              --processing-state VALID \
              --platform IOS \
              --json > build7-list.json 2>build7-list.err; then
              if python3 - <<'PY'
          import json
          data=json.load(open('build7-list.json',encoding='utf-8'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          ids=[]
          for d in walk(data):
              rid=d.get('id')
              attrs=d.get('attributes') if isinstance(d.get('attributes'),dict) else {}
              version=str(attrs.get('version',d.get('version','')))
              state=str(attrs.get('processingState',d.get('processingState','')))
              if rid and version=='7' and (not state or state=='VALID'):
                  ids.append(str(rid))
          ids=list(dict.fromkeys(ids))
          if len(ids)!=1:
              raise SystemExit(1)
          open('build7-id.txt','w').write(ids[0])
          PY
              then
                found=1
                break
              fi
            fi
            sleep 15
          done
          test "$found" = 1
          BUILD_ID="$(cat build7-id.txt)"
          latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          [[ "$latest" =~ ^[0-9]+$ ]]
          (( latest >= EXPECTED_BUILD ))
          app-store-connect builds beta-details "$BUILD_ID" --json > build7-beta-details.json
          python3 - "$BUILD_ID" "$latest" <<'PY'
          import json,sys
          rid=sys.argv[1]
          latest=int(sys.argv[2])
          payload={
              'ok':True,
              'appAppleId':'6803778932',
              'bundleId':'jp.allsunday1122.splatlab',
              'version':'1.0.0',
              'buildNumber':7,
              'buildResourceId':rid,
              'processingState':'VALID',
              'latestTestFlightBuild':latest,
              'internalOnlyExpected':True,
              'appStoreSubmitted':False,
              'externalBetaReviewSubmitted':False
          }
          open('asc-readback.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print('BUILD7_ASC_READBACK',json.dumps(payload,ensure_ascii=False))
          PY
    artifacts:
      - asc-readback.json
      - build7-id.txt
      - build7-list.json
      - build7-beta-details.json
