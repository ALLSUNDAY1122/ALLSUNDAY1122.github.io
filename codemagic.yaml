  shiwake-swipe-ios:
    name: Shiwake Swipe - iOS 1.0.1 Japanese TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.shiwakeswipe
      flutter: stable
      xcode: latest
      vars:
        SHIWAKE_BUNDLE: jp.allsunday1122.shiwakeswipe
        SHIWAKE_VERSION: 1.0.1
        SHIWAKE_BUILD: "6"
    scripts:
      - name: Generate Flutter iOS Runner
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          flutter --version
          flutter create --platforms=ios .
          flutter pub get
      - name: Set exact App Store bundle ID and Japanese-only localizations
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          project=Path("ios/Runner.xcodeproj/project.pbxproj")
          s=project.read_text(encoding="utf-8")
          source="com.example.shiwakeSwipe"
          target="jp.allsunday1122.shiwakeswipe"
          if source not in s:
              raise SystemExit("Generated Runner bundle ID differs from expected Flutter template; stop")
          project.write_text(s.replace(source,target), encoding="utf-8")
          plist=Path("ios/Runner/Info.plist")
          with plist.open("rb") as f:
              settings=plistlib.load(f)
          settings["CFBundleDisplayName"]="仕訳スワイプ"
          with plist.open("wb") as f:
              plistlib.dump(settings, f, sort_keys=False)
          PY
          python3 scripts/set_ios_japanese_locale.py
          python3 scripts/set_ios_japanese_locale.py --check
          test "$(grep -c 'jp.allsunday1122.shiwakeswipe' ios/Runner.xcodeproj/project.pbxproj)" -ge 1
          grep -Eq '^version: 1[.]0[.]1[+]6$' pubspec.yaml
      - name: Flutter quality checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          flutter analyze --no-fatal-infos
          flutter test
      - name: Apply Codemagic App Store signing certificates and profiles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          xcode-project use-profiles
      - name: Build signed IPA without submitting to App Review
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          if test -f "$HOME/export_options.plist"; then
            flutter build ipa --release --build-name=1.0.1 --build-number=6 --export-options-plist="$HOME/export_options.plist"
          else
            flutter build ipa --release --build-name=1.0.1 --build-number=6
          fi
      - name: Verify signed IPA localization, identity and version
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/shiwake-swipe/flutter_app"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,plistlib
          files=list(Path("build/ios/ipa").glob("*.ipa"))
          if len(files)!=1:
              raise SystemExit(f"Expected exactly one IPA, got {len(files)}")
          with zipfile.ZipFile(files[0]) as z:
              names=[name for name in z.namelist() if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
              if len(names)!=1:
                  raise SystemExit("No unique signed Runner app Info.plist in IPA")
              info=plistlib.loads(z.read(names[0]))
              checks={
                  "CFBundleIdentifier":"jp.allsunday1122.shiwakeswipe",
                  "CFBundleShortVersionString":"1.0.1",
                  "CFBundleVersion":"6",
                  "CFBundleDevelopmentRegion":"ja",
                  "CFBundleLocalizations":["ja"],
              }
              for key,expected in checks.items():
                  if info.get(key)!=expected:
                      raise SystemExit(f"IPA verification failed: {key}: {info.get(key)!r} != {expected!r}")
              print("PASS signed IPA: app 6794796078 / version 1.0.1 build 6 / iOS locale ja")
          PY
    artifacts:
      - shiwake-swipe/flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
  taku-calc-build11-internal:
    name: TAKU CALC - Build 11 Internal TestFlight
    max_build_duration: 80
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      groups:
        - taku_calc_source_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.koheimorita.takucalc
      vars:
        TAKU_CALC_SOURCE_REPO: git@github.com:ALLSUNDAY1122/taku-calc-app.git
        TAKU_CALC_SOURCE_BRANCH: main
        TAKU_CALC_MIN_SOURCE_COMMIT: 27a00ecc84f0d2762de24ee177f4ef16c77c2201
        TAKU_CALC_BUNDLE_ID: com.koheimorita.takucalc
        TAKU_CALC_VERSION: 1.5.0
        TAKU_CALC_BUILD_NUMBER: "11"
        APP_STORE_CONNECT_APP_ID: "6794350490"
      node: 22.13.0
      xcode: latest
    scripts:
      - name: Verify source-repository access and clone main
        script: |
          set -euo pipefail
          test -n "${TAKU_CALC_SOURCE_SSH_KEY:-}" || {
            echo "Missing secret TAKU_CALC_SOURCE_SSH_KEY in group taku_calc_source_credentials" >&2
            exit 1
          }
          ssh-add -l
          mkdir -p "$CM_BUILD_DIR/taku-calc-source"
          git clone --depth 1 --branch "$TAKU_CALC_SOURCE_BRANCH" "$TAKU_CALC_SOURCE_REPO" "$CM_BUILD_DIR/taku-calc-source"
          cd "$CM_BUILD_DIR/taku-calc-source"
          git fetch --unshallow origin "$TAKU_CALC_SOURCE_BRANCH"
          git merge-base --is-ancestor "$TAKU_CALC_MIN_SOURCE_COMMIT" HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > "$CM_BUILD_DIR/taku-calc-source-commit.txt"
          echo "PASS: source main contains required baseline $TAKU_CALC_MIN_SOURCE_COMMIT; actual=$(git rev-parse HEAD)"
      - name: Install dependencies and run release tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          node --version
          npm ci --no-audit --no-fund
          npm run verify:release
      - name: Set Build 11 in temporary Expo config and prebuild iOS
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          node - <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!data.expo || data.expo.version !== process.env.TAKU_CALC_VERSION) {
            throw new Error('Unexpected Expo version; refusing to change release version');
          }
          if (data.expo.ios?.bundleIdentifier !== process.env.TAKU_CALC_BUNDLE_ID) {
            throw new Error('Unexpected iOS bundle identifier');
          }
          data.expo.ios = data.expo.ios || {};
          data.expo.ios.buildNumber = process.env.TAKU_CALC_BUILD_NUMBER;
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          NODE
          npx expo config --type public --json > /tmp/taku-calc-expo-config.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/taku-calc-expo-config.json',encoding='utf-8'))
          assert d['version']==os.environ['TAKU_CALC_VERSION'], d.get('version')
          assert d['ios']['bundleIdentifier']==os.environ['TAKU_CALC_BUNDLE_ID'], d['ios']
          assert str(d['ios']['buildNumber'])==os.environ['TAKU_CALC_BUILD_NUMBER'], d['ios']
          print('PASS: Expo config version/bundle/build =',d['version'],d['ios']['bundleIdentifier'],d['ios']['buildNumber'])
          PY
          npx expo prebuild --platform ios --clean --no-install
      - name: Verify generated Xcode project identity and build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          PROJECT="$(find ios -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          python3 - "$PROJECT/project.pbxproj" <<'PY'
          from pathlib import Path
          import os,re,sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          expected=os.environ['TAKU_CALC_BUILD_NUMBER']
          s,n=re.subn(r'CURRENT_PROJECT_VERSION = [^;]+;',f'CURRENT_PROJECT_VERSION = {expected};',s)
          if n < 1:
              raise SystemExit('CURRENT_PROJECT_VERSION not found in generated Xcode project')
          if 'com.koheimorita.takucalc' not in s:
              raise SystemExit('Expected bundle identifier missing from generated Xcode project')
          p.write_text(s,encoding='utf-8')
          print(f'PASS: generated Xcode project build number set to {expected}; replacements={n}')
          PY
          printf '%s\n' "$PROJECT" > /tmp/taku-calc-project-path.txt
      - name: Apply App Store signing profile for Internal TestFlight only
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          PROJECT="$(cat /tmp/taku-calc-project-path.txt)"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=next(iter(d["project"].values())) if "project" not in d else d["project"]; print(p["schemes"][0])')"
          test -n "$SCHEME"
          xcode-project build-ipa --project "$PROJECT" --scheme "$SCHEME"
      - name: Verify signed IPA before publishing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/taku-calc-source"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          python3 - "$APP_DIR/Info.plist" <<'PY'
          import os,plistlib,sys
          d=plistlib.load(open(sys.argv[1],'rb'))
          expected={
            'CFBundleIdentifier':os.environ['TAKU_CALC_BUNDLE_ID'],
            'CFBundleShortVersionString':os.environ['TAKU_CALC_VERSION'],
            'CFBundleVersion':os.environ['TAKU_CALC_BUILD_NUMBER'],
          }
          for k,v in expected.items():
            actual=str(d.get(k,''))
            if actual != v:
              raise SystemExit(f'{k} mismatch: {actual!r} != {v!r}')
          print('PASS: signed IPA identity/version/build verified:',expected)
          PY
          test -f "$APP_DIR/embedded.mobileprovision"
          test -d "$APP_DIR/_CodeSignature"
          test -f "$APP_DIR/Assets.car"
      - name: Preserve source revision evidence
        script: |
          set -euo pipefail
          cp "$CM_BUILD_DIR/taku-calc-source-commit.txt" "$CM_EXPORT_DIR/taku-calc-source-commit.txt"
    artifacts:
      - taku-calc-source/build/ios/ipa/*.ipa
      - taku-calc-source-commit.txt
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - sun
        submit_to_app_store: false

