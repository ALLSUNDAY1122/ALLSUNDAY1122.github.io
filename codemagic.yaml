          test -f "$CM_BUILD_DIR/tsukanshi-sprint/ios/Web/release-links.js"
          test -f "$CM_BUILD_DIR/tsukanshi-sprint/ios/Web/storekit-ui-guard.js"
          test -f "$CM_BUILD_DIR/tsukanshi-sprint/ios/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/tsukanshi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          grep -q 'com.apple.InAppPurchase' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          ! grep -q 'SystemCapabilities = "' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
      - name: Apply App Store signing profiles for internal TestFlight only
        script: |
          cd "$CM_BUILD_DIR/tsukanshi-sprint/ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
