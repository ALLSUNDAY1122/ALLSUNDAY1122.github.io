workflows:
  pitari-direct-testflight:
    name: Pitari Direct iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/pitari-testflight-direct-20260830
          include: true
          source: true
      cancel_previous_builds: false
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      vars:
        APP_STORE_APPLE_ID: "6795941132"
        BUNDLE_ID: "jp.allsunday.pitariresize"
      node: 22.13.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Publish ephemeral source-transfer key
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p pitari-bridge
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/pitari-cm-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/pitari-cm-private.pem -pubout -out pitari-bridge/public.pem
          printf '%s\n' '{"stage":"waiting_encrypted_source"}' > pitari-bridge/status.json
          git config user.name 'codemagic-ci'
          git config user.email 'noreply@example.invalid'
          git add pitari-bridge/public.pem pitari-bridge/status.json
          git commit -m 'release: publish Pitari Codemagic transfer key [skip ci]'
          git push origin HEAD:release/pitari-testflight-direct-20260830
      - name: Receive and decrypt Pitari source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          READY=0
          for n in $(seq 1 120); do
            git fetch origin release/pitari-testflight-direct-20260830 >/dev/null 2>&1 || true
            if git cat-file -e origin/release/pitari-testflight-direct-20260830:pitari-bridge/ready.json 2>/dev/null; then READY=1; break; fi
            sleep 5
          done
          test "$READY" = 1
          for p in 00 01 02 03 04; do git show "origin/release/pitari-testflight-direct-20260830:pitari-bridge/source.part$p"; done > /tmp/pitari-source.b64
          git show origin/release/pitari-testflight-direct-20260830:pitari-bridge/key.b64 | base64 -d > /tmp/pitari-key.enc
          base64 -d /tmp/pitari-source.b64 > /tmp/pitari-source.enc
          openssl pkeyutl -decrypt -inkey /tmp/pitari-cm-private.pem -in /tmp/pitari-key.enc -out /tmp/pitari-keyiv.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/pitari-keyiv.bin').read_bytes()
          assert len(b)==48
          Path('/tmp/pitari-k').write_text(b[:32].hex())
          Path('/tmp/pitari-i').write_text(b[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/pitari-k)" -iv "$(cat /tmp/pitari-i)" -in /tmp/pitari-source.enc -out /tmp/pitari-source.tgz
          test "$(shasum -a 256 /tmp/pitari-source.tgz | awk '{print $1}')" = '3d9a0f25a7e5bf88a5dfd624af6823180dfb2e667e6cc4a5def0d8a122802dfb'
          rm -rf /tmp/pitari-app
          mkdir -p /tmp/pitari-app
          tar -xzf /tmp/pitari-source.tgz -C /tmp/pitari-app
          rm -f /tmp/pitari-cm-private.pem /tmp/pitari-key.enc /tmp/pitari-keyiv.bin /tmp/pitari-k /tmp/pitari-i /tmp/pitari-source.enc /tmp/pitari-source.b64
      - name: Validate TypeScript and Expo project
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm doctor
      - name: Set next TestFlight build number and prebuild iOS
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 6)
          case "$LATEST" in ''|*[!0-9]*) LATEST=6 ;; esac
          NEXT=$((LATEST + 1))
          export PITARI_BUILD_NUMBER="$NEXT"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('app.json')
          d=json.loads(p.read_text())
          d['expo'].setdefault('ios',{})['buildNumber']=os.environ['PITARI_BUILD_NUMBER']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          pnpm exec expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          printf '%s' "$NEXT" > /tmp/pitari-build-number
      - name: Fetch and apply App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          cd /tmp/pitari-app/ios
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          test -n "$SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          IPA=$(find build/ios/ipa -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          cd "$CM_BUILD_DIR"
          printf '{"stage":"ipa_built","build_number":"%s","source_commit":"db13c80e3c9dd6dbad8a3465b8919cc97fea6a23","temporary_icon":true}\n' "$(cat /tmp/pitari-build-number)" > pitari-bridge/status.json
          git add pitari-bridge/status.json
          git commit -m 'release: Pitari signed IPA built [skip ci]' || true
          git push origin HEAD:release/pitari-testflight-direct-20260830 || true
    artifacts:
      - /tmp/pitari-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/pitari-app/ios/**/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
