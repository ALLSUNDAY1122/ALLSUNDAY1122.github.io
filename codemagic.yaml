workflows:
  otsu4-ios:
    name: 危険物乙4 - Codemagic ASC integration probe
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.otsu4
      xcode: latest
    scripts:
      - name: Probe App Store Connect integration
        script: |
          set -euo pipefail
          echo "Codemagic ASC integration workflow initialized"
          xcodebuild -version
