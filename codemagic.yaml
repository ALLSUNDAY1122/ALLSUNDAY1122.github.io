workflows:
  pitari-direct-testflight:
    name: Pitari Private Clone iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      vars:
        APP_STORE_APPLE_ID: "6795941132"
        BUNDLE_ID: "jp.allsunday.pitariresize"
      node: 22.13.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clone current Pitari private source
        script: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          rm -rf /tmp/pitari-src /tmp/pitari-app
          git clone --depth=1 --branch main https://github.com/ALLSUNDAY1122/pitari-resize.git /tmp/pitari-src
          test -f /tmp/pitari-src/mobile/package.json
          cp -a /tmp/pitari-src/mobile /tmp/pitari-app
          echo "PITARI_PRIVATE_CLONE=PASS"
          git -C /tmp/pitari-src rev-parse HEAD | sed 's/^/PITARI_SOURCE_COMMIT=/'
      - name: Validate TypeScript and Expo project
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm doctor
          echo "PITARI_VALIDATION=PASS"
      - name: Set next TestFlight build number and prebuild iOS
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 6)
          case "$LATEST" in ''|*[!0-9]*) LATEST=6 ;; esac
          NEXT=$((LATEST + 1))
          export PITARI_BUILD_NUMBER="$NEXT"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('app.json')
          d=json.loads(p.read_text())
          assert d['expo']['version']=='1.0.0', d['expo']['version']
          d['expo'].setdefault('ios',{})['buildNumber']=os.environ['PITARI_BUILD_NUMBER']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          pnpm exec expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          printf '%s' "$NEXT" > /tmp/pitari-build-number
          echo "PITARI_NEXT_BUILD=${NEXT}"
      - name: Fetch and apply App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          cd /tmp/pitari-app/ios
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd /tmp/pitari-app
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          test -n "$SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          IPA=$(find build/ios/ipa -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "PITARI_IPA_BUILT=YES"
          echo "PITARI_BUILD_NUMBER=$(cat /tmp/pitari-build-number)"
    artifacts:
      - /tmp/pitari-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/pitari-app/ios/**/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
