workflows:
  splat-native-ios:
    name: Splat Lab Native - Internal TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.splatlab
        APP_STORE_CONNECT_APP_ID: 6803778932
        XCODE_PROJECT: splat-native-ios/SplatNative.xcodeproj
        XCODE_SCHEME: SplatNative
      xcode: latest
    scripts:
      - name: Stop if App Store Connect app record is not registered
        script: |
          set -euo pipefail
          test "$APP_STORE_CONNECT_APP_ID" = "6803778932"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
      - name: Verify Apple upload toolchain
        script: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test -n "$XCODE_MAJOR"
          test -n "$IOS_SDK_MAJOR"
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect upload requires Xcode 26+ and iOS 26 SDK+; found Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION" >&2
            exit 1
          fi
      - name: Install required Metal Toolchain
        script: xcodebuild -downloadComponent MetalToolchain
      - name: Disable unrelated msplat LFS datasets
        script: git lfs install --skip-smudge --skip-repo
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate deterministic PoC AppIcon
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/splat-native-ios/scripts/make_test_icon.py"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Set build number and generate project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          old='CURRENT_PROJECT_VERSION: 1'
          if old not in text:
              raise SystemExit('Expected CURRENT_PROJECT_VERSION: 1 not found')
          text=text.replace(old, 'CURRENT_PROJECT_VERSION: 14', 1)
          p.write_text(text,encoding='utf-8')
          print('Using TestFlight build number 14')
          PY
          xcodegen generate
      - name: Static release checks
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/splat-native-ios/scripts/validate.sh"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Verify managed certificate private key is available
        script: |
          set -euo pipefail
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"
      - name: Verify Apple Developer Bundle ID exists
        script: app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier | grep -Fq "$BUNDLE_ID"
      - name: Fetch existing App Store signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply App Store profile for Internal TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  splat-build14-asc-readback:
    name: Splat Lab Native - Build 14 ASC Readback
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      vars:
        APP_STORE_APPLE_ID: '6803778932'
        EXPECTED_BUILD: '14'
        EXPECTED_VERSION: '1.0.0'
      xcode: latest
    scripts:
      - name: Wait for Build 14 to become VALID in App Store Connect
        script: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            if app-store-connect apps builds "$APP_STORE_APPLE_ID" --build-version-number "$EXPECTED_BUILD" --version-string "$EXPECTED_VERSION" --processing-state VALID --platform IOS --json > build14-list.json 2>build14-list.err; then
              if python3 - <<'PY'
          import json
          data=json.load(open('build14-list.json',encoding='utf-8'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          ids=[]
          for d in walk(data):
              rid=d.get('id')
              attrs=d.get('attributes') if isinstance(d.get('attributes'),dict) else {}
              version=str(attrs.get('version',d.get('version','')))
              state=str(attrs.get('processingState',d.get('processingState','')))
              if rid and version=='14' and (not state or state=='VALID'): ids.append(str(rid))
          ids=list(dict.fromkeys(ids))
          if len(ids)!=1: raise SystemExit(1)
          open('build14-id.txt','w').write(ids[0])
          PY
              then
                found=1
                break
              fi
            fi
            sleep 15
          done
          test "$found" = 1
          BUILD_ID="$(cat build14-id.txt)"
          latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          [[ "$latest" =~ ^[0-9]+$ ]]
          (( latest >= EXPECTED_BUILD ))
          app-store-connect builds beta-details "$BUILD_ID" --json > build14-beta-details.json
          python3 - "$BUILD_ID" "$latest" <<'PY'
          import json,sys
          rid=sys.argv[1]; latest=int(sys.argv[2])
          payload={'ok':True,'appAppleId':'6803778932','bundleId':'jp.allsunday1122.splatlab','version':'1.0.0','buildNumber':14,'buildResourceId':rid,'processingState':'VALID','latestTestFlightBuild':latest,'internalOnlyExpected':True,'appStoreSubmitted':False,'externalBetaReviewSubmitted':False}
          open('asc-readback.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print('BUILD14_ASC_READBACK',json.dumps(payload,ensure_ascii=False))
          PY
    artifacts:
      - asc-readback.json
      - build14-id.txt
      - build14-list.json
      - build14-beta-details.json

  splat-build14-distribution-readback:
    name: Splat Lab Native - Build 14 Distribution Readback
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      vars:
        APP_STORE_APPLE_ID: '6803778932'
        EXPECTED_BUILD: '14'
        EXPECTED_VERSION: '1.0.0'
      xcode: latest
    scripts:
      - name: Read Build 14 tester-group availability without mutations
        script: |
          set -euo pipefail
          app-store-connect apps builds "$APP_STORE_APPLE_ID" --build-version-number "$EXPECTED_BUILD" --version-string "$EXPECTED_VERSION" --processing-state VALID --platform IOS --json > build14-list.json
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64url(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=')

          issuer = os.environ['APP_STORE_CONNECT_ISSUER_ID'].strip()
          key_id = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER'].strip()
          private_key_text = os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].replace('\\n', '\n').strip()
          if private_key_text.startswith('@file:'):
              private_key_text = open(private_key_text[6:], encoding='utf-8').read().strip()
          elif private_key_text.startswith('@env:'):
              private_key_text = os.environ[private_key_text[5:]].replace('\\n', '\n').strip()
          elif os.path.isfile(private_key_text):
              private_key_text = open(private_key_text, encoding='utf-8').read().strip()
          if 'BEGIN PRIVATE KEY' not in private_key_text:
              decoded = base64.b64decode(private_key_text + '=' * (-len(private_key_text) % 4)).decode().replace('\\n', '\n').strip()
              if 'BEGIN PRIVATE KEY' not in decoded:
                  raise SystemExit('App Store Connect private-key encoding is unsupported')
              private_key_text = decoded
          header = b64url(json.dumps({'alg':'ES256','kid':key_id,'typ':'JWT'}, separators=(',',':')).encode())
          now = int(time.time())
          payload = b64url(json.dumps({'iss':issuer,'iat':now,'exp':now+900,'aud':'appstoreconnect-v1'}, separators=(',',':')).encode())
          signing_input = header + b'.' + payload
          private_key = serialization.load_pem_private_key(private_key_text.encode(), password=None)
          der = private_key.sign(signing_input, ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der)
          token = (signing_input + b'.' + b64url(r.to_bytes(32,'big') + s.to_bytes(32,'big'))).decode()

          def get(path, params=None):
              url = 'https://api.appstoreconnect.apple.com' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          builds = json.load(open('build14-list.json', encoding='utf-8'))
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values(): yield from walk(child)
              elif isinstance(value, list):
                  for child in value: yield from walk(child)
          build_ids = []
          for item in walk(builds):
              attrs = item.get('attributes') if isinstance(item.get('attributes'), dict) else {}
              if item.get('id') and str(attrs.get('version', item.get('version',''))) == '14':
                  build_ids.append(str(item['id']))
          build_ids = list(dict.fromkeys(build_ids))
          if len(build_ids) != 1:
              raise SystemExit(f'Expected one Build 14 resource, found {len(build_ids)}')
          build_id = build_ids[0]

          all_groups = get('/v1/betaGroups', {'filter[app]':os.environ['APP_STORE_APPLE_ID'],'limit':'200'}).get('data', [])
          assigned_ids = {item['id'] for item in get(f'/v1/builds/{build_id}/betaGroups', {'limit':'200'}).get('data', [])}
          sanitized = []
          for index, group in enumerate(all_groups, start=1):
              attrs = group.get('attributes') or {}
              tester_count = len(get(f"/v1/betaGroups/{group['id']}/relationships/betaTesters", {'limit':'200'}).get('data', []))
              sanitized.append({
                  'groupIndex': index,
                  'internal': bool(attrs.get('isInternalGroup')),
                  'allBuilds': bool(attrs.get('hasAccessToAllBuilds')),
                  'testerCount': tester_count,
                  'build14Assigned': group['id'] in assigned_ids,
                  'publicLinkEnabled': bool(attrs.get('publicLinkEnabled')),
              })
          report = {
              'ok': True,
              'appAppleId': os.environ['APP_STORE_APPLE_ID'],
              'version': os.environ['EXPECTED_VERSION'],
              'buildNumber': int(os.environ['EXPECTED_BUILD']),
              'processingState': 'VALID',
              'groupCount': len(all_groups),
              'assignedGroupCount': len(assigned_ids),
              'groups': sanitized,
              'mutationPerformed': False,
          }
          open('build14-distribution-readback.json','w',encoding='utf-8').write(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          print('BUILD14_DISTRIBUTION_READBACK', json.dumps(report, ensure_ascii=False))
          PY
    artifacts:
      - build14-distribution-readback.json
