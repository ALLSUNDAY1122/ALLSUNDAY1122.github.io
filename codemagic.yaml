  pharmacist-ios:
    name: 薬剤師国家試験 - iOS App Store Candidate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.yakuzaishi
      vars:
        BUNDLE_ID: jp.allsunday1122.yakuzaishi
        APP_STORE_CONNECT_APP_ID: "6799753724"
        CODEMAGIC_PROFILE_REF: yakuzaishi_appstore
        XCODE_PROJECT: pharmacist-manabi-sprint/ios/PharmacistSprint.xcodeproj
        XCODE_SCHEME: PharmacistSprint
      # App Store Connect now requires the iOS 26 SDK or later.
      xcode: 26.4
    scripts:
      - name: Release audit before signed native build
        script: |
          cd "$CM_BUILD_DIR"
          python3 pharmacist-manabi-sprint/tools/assemble_product_bank.py
          python3 pharmacist-manabi-sprint/tools/build_web_bundle.py
          python3 - <<'PY'
          import json
          d=json.load(open('pharmacist-manabi-sprint/content/product/questions.json',encoding='utf-8'))
          qs={q['id']:q for q in d['questions']}
          expected='デュロキセチン塩酸塩カプセル 20 mg 1 回 1 カプセル （ 1 日 2 カプセル）'
          for qid in ('P111-220','P111-221'):
              assert expected in (qs[qid].get('sharedStem') or ''), qid
          print('PASS: MHLW Q220/Q221 dosage-form correction in release source')
          PY
          python3 pharmacist-manabi-sprint/scripts/validate_release.py
          bash -n pharmacist-manabi-sprint/ios/prepare-ios.sh
          python3 -m py_compile pharmacist-manabi-sprint/ios/apply-xcode-capabilities.py
          test "$BUNDLE_ID" = "jp.allsunday1122.yakuzaishi"
          test "$APP_STORE_CONNECT_APP_ID" = "6799753724"
          test "$CODEMAGIC_PROFILE_REF" = "yakuzaishi_appstore"
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited native resources and canonical icon
        script: bash "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios/prepare-ios.sh"
      - name: Set unique release build number and generate native project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios"
          # Codemagic's per-workflow CM_BUILD_NUMBER can collide with a build
          # already present in App Store Connect after workflow history resets.
          # UTC seconds avoid collisions with existing App Store Connect builds.
          # This workflow uploads to internal TestFlight only; App Review is disabled.
          RELEASE_BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          export RELEASE_BUILD_NUMBER
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          updated,count=re.subn(r'(?m)^(\s*CURRENT_PROJECT_VERSION:\s*)\d+\s*$', r'\g<1>'+os.environ['RELEASE_BUILD_NUMBER'], text, count=1)
          if count != 1:
              raise SystemExit('CURRENT_PROJECT_VERSION was not updated exactly once')
          p.write_text(updated,encoding='utf-8')
          print('PASS: Pharmacist release build number='+os.environ['RELEASE_BUILD_NUMBER'])
          PY
          xcodegen generate
          python3 apply-xcode-capabilities.py PharmacistSprint.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' PharmacistSprint/Info.plist 2>/dev/null || true
      - name: Verify signed native release inputs
        script: |
          test -f "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios/Generated/questions.native.json"
          test -f "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          grep -q 'com.apple.InAppPurchase' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          ! grep -q 'SystemCapabilities = "' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          ! grep -R -q 'WKWebView\|import WebKit' --include='*.swift' "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios"
          python3 - <<'PY'
          import hashlib,json
          p='pharmacist-manabi-sprint/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='dfc7dfe4a1c13afbe98658cde591274e11665b016c39e2a4411de4dbe86127ec'
          d=json.load(open('pharmacist-manabi-sprint/ios/Generated/questions.native.json',encoding='utf-8'))
          q=d['questions']; active=[x for x in q if x['scoringStatus']!='excluded']
          free=[x for x in active if x['exam']==111 and x['section']=='必須']
          media=[x for x in q if x['displayMode']=='officialQuestionImage']
          assert (len(q),len(active),len(free),len(media))==(1035,1031,90,154)
          print('PASS: native pharmacist release inputs and canonical AppIcon')
          PY
      - name: Build native UI tests and run unit tests before TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and device.get('name','').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator')
          PY
          )"
          # Xcode 26.4's iOS 26.4 simulator intermittently fails to initialize
          # XCTest UIAccessibility before any UI test executes (AX loaded notification
          # timeout). Compile the complete UI test target here, but execute unit tests
          # only. The separate Xcode 16 macOS 14 preflight runs the full UI Visual Gate
          # and requires seven captured screenshots before this release is mergeable.
          xcodebuild build-for-testing \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild test-without-building \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:PharmacistSprintTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Apply App Store signing profiles for internal TestFlight only
        script: |
          cd "$CM_BUILD_DIR/pharmacist-manabi-sprint/ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

