workflows:
  otsu4-ios:
    name: 危険物乙4 - Codemagic ASC integration-only probe
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
    scripts:
      - name: Probe App Store Connect integration only
        script: |
          set -euo pipefail
          echo "Codemagic ASC integration-only workflow initialized"
          xcodebuild -version
