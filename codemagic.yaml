workflows:
  otsu4-ios:
    name: 危険物乙4 - iOS Internal TestFlight 720
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.otsu4
      vars:
        APP_STORE_APPLE_ID: '6799755566'
        APPLE_TEAM_ID: MN3D2ZM44N
        BUNDLE_ID: jp.allsunday1122.otsu4
        XCODE_PROJECT: native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj
        XCODE_SCHEME: Otsu4Sprint
      xcode: latest
    scripts:
      - name: Verify canonical identifiers
        script: |
          set -euo pipefail
          test "$BUNDLE_ID" = "jp.allsunday1122.otsu4"
          test "$APP_STORE_APPLE_ID" = "6799755566"
          test "$APPLE_TEAM_ID" = "MN3D2ZM44N"
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited final 720-question resources and icon
        script: bash "$CM_BUILD_DIR/native-ios/Otsu4Sprint/prepare-ios.sh"
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"
          xcodegen generate
      - name: Set monotonic Codemagic build number
        script: |
          set -euo pipefail
          test -n "${PROJECT_BUILD_NUMBER:-}"
          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Verify release inputs
        script: |
          set -euo pipefail
          python3 - "$CM_BUILD_DIR/native-ios/Otsu4Sprint/Generated/questions.generated.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['contentVersion']=='otsu4-2026-08-product-v2'
          assert len(data['questions'])==720
          counts={s:sum(1 for q in data['questions'] if q['subject']==s) for s in ['法令','物理・化学','性質・消火']}
          assert counts=={'法令':288,'物理・化学':192,'性質・消火':240}, counts
          assert data.get('difficultyAudit',{}).get('policy')=='2026-08 exam-level v1'
          PY
      - name: Apply App Store signing profiles for internal TestFlight only
        script: |
          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Verify signed final IPA before TestFlight
        script: |
          set -euo pipefail
          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -type f -name '*.ipa' -print -quit)"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          python3 - "$APP_DIR" <<'PY'
          import json,plistlib,sys
          from pathlib import Path
          app=Path(sys.argv[1])
          data=json.loads((app/'questions.generated.json').read_text(encoding='utf-8'))
          assert len(data['questions'])==720
          counts={s:sum(1 for q in data['questions'] if q['subject']==s) for s in ['法令','物理・化学','性質・消火']}
          assert counts=={'法令':288,'物理・化学':192,'性質・消火':240}, counts
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info.get('CFBundleIdentifier')=='jp.allsunday1122.otsu4'
          assert info.get('CFBundleShortVersionString')=='1.0.0'
          assert str(info.get('CFBundleVersion','')).isdigit()
          assert (app/'PrivacyInfo.xcprivacy').is_file()
          assert (app/'Assets.car').is_file()
          assert (app/'embedded.mobileprovision').is_file()
          assert (app/'_CodeSignature').is_dir()
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  otsu4-asc-readback:
    name: 危険物乙4 - TestFlight Build 93 readback
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      vars:
        APP_STORE_APPLE_ID: '6799755566'
        EXPECTED_BUILD: '93'
      xcode: latest
    scripts:
      - name: Wait for Build 93 to appear in TestFlight
        script: |
          set -euo pipefail
          latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          [[ "$latest" =~ ^[0-9]+$ ]]
          (( latest >= EXPECTED_BUILD ))
          printf '{"appAppleId":"6799755566","expectedBuild":93,"latestTestFlightBuild":%s,"build93Visible":true}\n' "$latest" > asc-readback.json
    artifacts:
      - asc-readback.json

  otsu4-internal-group-assign:
    name: 危険物乙4 - Assign Build 93 to Internal group sun
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      vars:
        APP_STORE_APPLE_ID: '6799755566'
        EXPECTED_BUILD: '93'
        EXPECTED_VERSION: '1.0.0'
        BETA_GROUP: sun
      xcode: latest
    scripts:
      - name: Resolve Build 93 App Store Connect resource ID
        script: |
          set -euo pipefail
          app-store-connect apps builds "$APP_STORE_APPLE_ID" \
            --build-version-number "$EXPECTED_BUILD" \
            --version-string "$EXPECTED_VERSION" \
            --processing-state VALID \
            --platform IOS \
            --json > build93-list.json
          python3 - <<'PY'
          import json
          data=json.load(open('build93-list.json',encoding='utf-8'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          ids=[]
          for d in walk(data):
              rid=d.get('id')
              attrs=d.get('attributes') if isinstance(d.get('attributes'),dict) else {}
              version=str(attrs.get('version',d.get('version','')))
              if rid and version=='93': ids.append(str(rid))
          ids=list(dict.fromkeys(ids))
          if len(ids)!=1: raise SystemExit(f'Expected exactly one Build 93 resource, found {ids}')
          open('build93-id.txt','w').write(ids[0])
          print('PASS: resolved Build 93 resource id',ids[0])
          PY
      - name: Add Build 93 to Internal TestFlight group sun
        script: |
          BUILD_ID="$(cat build93-id.txt)"
          set +e
          app-store-connect beta-groups add-build "$BUILD_ID" --beta-group "$BETA_GROUP" --json > group-add.json 2> group-add-error.txt
          RC=$?
          set -e
          python3 - "$BUILD_ID" "$RC" <<'PY'
          import json,sys
          err=''
          try: err=open('group-add-error.txt',encoding='utf-8').read()
          except Exception: pass
          payload={'appAppleId':'6799755566','version':'1.0.0','buildNumber':93,'buildResourceId':sys.argv[1],'betaGroup':'sun','internalOnly':True,'betaReviewSubmitted':False,'appStoreSubmitted':False,'returnCode':int(sys.argv[2]),'error':err[-4000:]}
          open('internal-group-assignment.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          cat group-add-error.txt || true
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          echo "PASS: Build 93 added to internal group sun"
      - name: Verify Build 93 beta details remain valid
        script: |
          set -euo pipefail
          BUILD_ID="$(cat build93-id.txt)"
          app-store-connect builds beta-details "$BUILD_ID" --json > build93-beta-details.json
          test -s build93-beta-details.json
    artifacts:
      - build93-id.txt
      - build93-list.json
      - group-add.json
      - group-add-error.txt
      - internal-group-assignment.json
      - build93-beta-details.json
