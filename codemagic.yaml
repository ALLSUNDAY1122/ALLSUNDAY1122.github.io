workflows:
  scanlab-ios:
    name: Scan Lab - iOS Internal TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      groups:
        - app2_010_touhan_signing
      vars:
        BUNDLE_ID: jp.allsunday1122.splatlab
        APP_STORE_CONNECT_APP_ID: '6803778932'
        XCODE_PROJECT: splat-native-ios/SplatNative.xcodeproj
        XCODE_SCHEME: SplatNative
      xcode: latest
    scripts:
      - name: Stop if App Store Connect app record is not registered
        script: |
          set -euo pipefail
          test "$APP_STORE_CONNECT_APP_ID" = "6803778932"
          test "$BUNDLE_ID" = "jp.allsunday1122.splatlab"

      - name: Verify Apple upload toolchain
        script: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test -n "$XCODE_MAJOR"
          test -n "$IOS_SDK_MAJOR"
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect upload requires Xcode 26+ and iOS 26 SDK+; found Xcode major $XCODE_MAJOR / iOS SDK $IOS_SDK_VERSION" >&2
            exit 1
          fi

      - name: Install required Metal Toolchain
        script: xcodebuild -downloadComponent MetalToolchain

      - name: Disable unrelated msplat LFS datasets
        script: git lfs install --skip-smudge --skip-repo

      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate deterministic PoC AppIcon
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/splat-native-ios/scripts/make_test_icon.py"
          test -f "$CM_BUILD_DIR/splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

      - name: Resolve next TestFlight build number and generate project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_CONNECT_APP_ID")"
          [[ "$LATEST" =~ ^[0-9]+$ ]]
          NEXT=$((LATEST + 1))
          test "$NEXT" -gt 15
          export NEXT
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          old='CURRENT_PROJECT_VERSION: 1'
          if old not in text:
              raise SystemExit('Expected CURRENT_PROJECT_VERSION: 1 not found')
          text=text.replace(old, f"CURRENT_PROJECT_VERSION: {os.environ['NEXT']}", 1)
          p.write_text(text,encoding='utf-8')
          print(f"Using TestFlight build number {os.environ['NEXT']}")
          PY
          printf '%s\n' "$NEXT" > "$CM_BUILD_DIR/scanlab-next-build-number.txt"
          xcodegen generate

      - name: Verify reconstruction release contracts
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 splat-native-ios/scripts/test_s14_rgb_dense_seed_contract.py
          python3 splat-native-ios/scripts/diagnose_s15_pose_trajectory.py --self-test
          grep -q 'recipeVersion = 5' splat-native-ios/SplatNative/SplatDepthSeedBuilder.swift
          grep -q 'standardIterations = 7_000' splat-native-ios/SplatNative/SplatReconstructionPolicy.swift
          bash splat-native-ios/scripts/validate.sh
          test -f splat-native-ios/SplatNative/PrivacyInfo.xcprivacy
          test -f splat-native-ios/SplatNative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Verify managed certificate private key is available
        script: |
          set -euo pipefail
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"

      - name: Verify Apple Developer Bundle ID exists
        script: app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier | grep -Fq "$BUNDLE_ID"

      - name: Fetch existing App Store signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE

      - name: Add signing certificate
        script: keychain add-certificates

      - name: Apply App Store profile for Internal TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/splat-native-ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - scanlab-next-build-number.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
