  shoshi-ios:
    name: 司法書士 - SwiftUI Native Internal TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        provisioning_profiles:
          - shoshi_appstore
      vars:
        RELEASE_SOURCE_BRANCH: feature/shoshi-native-swiftui
        RELEASE_SOURCE_SHA: 37c006838463df56e9fd84b22d250005856cfff3
        BUNDLE_ID: jp.allsunday1122.shoshi
        APP_STORE_CONNECT_APP_ID: "6799755748"
        CODEMAGIC_SIGNING_PROFILE: shoshi_appstore
        XCODE_PROJECT: learning-sprint/shoshi/ios/ShoshiSprint.xcodeproj
        XCODE_SCHEME: ShoshiSprint
      xcode: latest
    scripts:
      - name: Check out pinned Release Gate source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git fetch --depth=1 origin "$RELEASE_SOURCE_BRANCH"
          git checkout --detach "$RELEASE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
      - name: Audit pure-native Shoshi release inputs
        script: |
          cd "$CM_BUILD_DIR"
          python3 automation/learning-sprint-question-pipeline/validate_questions.py \
            learning-sprint/shoshi/content-loop/learning-sprint-audit.json
          python3 learning-sprint/shoshi/ios/native_source_audit.py
          node learning-sprint/shoshi/validate-apple-preflight.mjs
          bash -n learning-sprint/shoshi/ios/prepare-ios.sh
          python3 -m py_compile learning-sprint/shoshi/ios/apply-xcode-capabilities.py \
            learning-sprint/shoshi/ios/native_source_audit.py
          python3 - <<'PY'
          import plistlib
          with open('learning-sprint/shoshi/ios/PrivacyInfo.xcprivacy','rb') as f:
              data=plistlib.load(f)
          assert data.get('NSPrivacyTracking') is False
          assert data.get('NSPrivacyCollectedDataTypes') == []
          entries=data.get('NSPrivacyAccessedAPITypes',[])
          assert any(x.get('NSPrivacyAccessedAPIType')=='NSPrivacyAccessedAPICategoryUserDefaults' and 'CA92.1' in x.get('NSPrivacyAccessedAPITypeReasons',[]) for x in entries)
          print('PASS: Shoshi Privacy Manifest matches native UserDefaults persistence.')
          PY
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited native resources and canonical icon
        script: bash "$CM_BUILD_DIR/learning-sprint/shoshi/ios/prepare-ios.sh"
      - name: Set CI build number and generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/learning-sprint/shoshi/ios"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('project.yml')
          text=p.read_text(encoding='utf-8')
          text=text.replace('CURRENT_PROJECT_VERSION: 1', 'CURRENT_PROJECT_VERSION: '+os.environ['CM_BUILD_NUMBER'], 1)
          p.write_text(text,encoding='utf-8')
          PY
          xcodegen generate
          python3 apply-xcode-capabilities.py ShoshiSprint.xcodeproj/project.pbxproj
      - name: Run native unit tests
        script: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(xs[0] if xs else "")')"
          test -n "$DEVICE_ID"
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Verify signed release inputs
        script: |
          test -f "$CM_BUILD_DIR/learning-sprint/shoshi/ios/Resources/questions.generated.json"
          test -f "$CM_BUILD_DIR/learning-sprint/shoshi/ios/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/learning-sprint/shoshi/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test "$(shasum -a 256 "$CM_BUILD_DIR/learning-sprint/shoshi/ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png" | awk '{print $1}')" = "c34399358e182a4709f805127fc7244f9763a1f796bb68dfed24b5c4ee815506"
          ! grep -R -nE 'import[[:space:]]+WebKit|WKWebView|UIViewRepresentable' "$CM_BUILD_DIR/learning-sprint/shoshi/ios" --include='*.swift'
          grep -q 'com.apple.InAppPurchase' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          ! grep -q 'SystemCapabilities = "' "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          python3 - "$CM_BUILD_DIR/learning-sprint/shoshi/ios/Resources/questions.generated.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
