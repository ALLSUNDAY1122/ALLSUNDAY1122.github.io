  fp2-internal-testflight-build8:
    name: FP2 1.0.0 Build 10 App Store Distribution
    max_build_duration: 40
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.allsunday1122.fp2manabisprint
    scripts:
      - name: Verify the branch and install XcodeGen
        script: |
          set -euo pipefail
          test "$CM_BRANCH" = 'main'
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep -Eq '^2[6-9](\.|$)'
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Create the distribution-signed FP2 Release archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 fp2-manabi-sprint/ios/prepare-ios.py
          test "$(git rev-parse HEAD:fp2-manabi-sprint)" = '3557e07e2a670012bb09ec3852c8d1e924a90ce8'
          diagram_dir=questions/verbatim/assets
          mkdir -p "fp2-manabi-sprint/ios/Web/$diagram_dir"
          for diagram in fp2-202405-q53-family-diagram.png fp2-202605-q55-family-diagram.png; do
            cp "fp2-manabi-sprint/$diagram_dir/$diagram" "fp2-manabi-sprint/ios/Web/$diagram_dir/$diagram"
          done
          cd fp2-manabi-sprint/ios
          python3 - <<'PY'
          import hashlib, json, os, plistlib, shutil, subprocess
          from pathlib import Path

          path = Path('Web/bundle-evidence.json')
          evidence = json.loads(path.read_bytes())
          assert evidence['version'] == '1.0.0' and evidence['build'] == '10'

          team = 'MN3D2ZM44N'
          bundle = 'com.allsunday1122.fp2manabisprint'
          library = Path.home() / 'Library'
          old_profiles = library / 'MobileDevice/Provisioning Profiles'
          xcode_profiles = library / 'Developer/Xcode/UserData/Provisioning Profiles'
          installed = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning'], text=True)
          for candidate in old_profiles.glob('*.mobileprovision'):
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(candidate)]))
              if profile.get('Name') != 'FP2 App Store Codemagic':
                  continue
              assert profile['Entitlements']['application-identifier'] == f'{team}.{bundle}'
              assert 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices')
              certificate = next(hashlib.sha1(cert).hexdigest().upper() for cert in profile['DeveloperCertificates']
                                 if hashlib.sha1(cert).hexdigest().upper() in installed)
              xcode_profiles.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(candidate, xcode_profiles / (profile['UUID'] + '.mobileprovision'))
              break
          else:
              raise SystemExit('The approved FP2 profile was not installed by Codemagic')

          options = {'method': 'app-store-connect', 'destination': 'export', 'teamID': team,
                     'signingStyle': 'manual', 'signingCertificate': certificate,
                     'provisioningProfiles': {bundle: profile['UUID']},
                     'testFlightInternalTestingOnly': False, 'manageAppVersionAndBuildNumber': False}
          (Path(os.environ['TMPDIR']) / 'fp2-export.plist').write_bytes(plistlib.dumps(options))
          (Path(os.environ['TMPDIR']) / 'fp2-certificate.txt').write_text(certificate, encoding='ascii')
          PY
          xcodegen generate
          xcodebuild -project FP2ManabiSprint.xcodeproj -scheme FP2ManabiSprint \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/FP2ManabiSprint.xcarchive" \
            DEVELOPMENT_TEAM=MN3D2ZM44N TARGETED_DEVICE_FAMILY=1 CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$(cat "$TMPDIR/fp2-certificate.txt")" \
            'PROVISIONING_PROFILE_SPECIFIER=FP2 App Store Codemagic' archive
      - name: Export for App Store distribution with the FP2 profile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild -help > "$TMPDIR/fp2-xcode-help.txt" 2>&1
          grep -q testFlightInternalTestingOnly "$TMPDIR/fp2-xcode-help.txt"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          options = plistlib.loads((Path(os.environ['TMPDIR']) / 'fp2-export.plist').read_bytes())
          assert options['method'] == 'app-store-connect' and options['destination'] == 'export'
          assert options['teamID'] == 'MN3D2ZM44N'
          assert options['signingStyle'] == 'manual'
          assert set(options['provisioningProfiles']) == {'com.allsunday1122.fp2manabisprint'}
          assert options['testFlightInternalTestingOnly'] is False
          assert options['manageAppVersionAndBuildNumber'] is False
          PY
          xcodebuild -exportArchive -archivePath "$CM_BUILD_DIR/build/FP2ManabiSprint.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/fp2-internal" -exportOptionsPlist "$TMPDIR/fp2-export.plist"
      - name: Verify the signed IPA before uploading
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          ipa=(build/fp2-internal/*.ipa)
          test "${#ipa[@]}" -eq 1
          expanded="$(mktemp -d)"
          ditto -x -k "${ipa[0]}" "$expanded"
          app="$expanded/Payload/FP2ManabiSprint.app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx 'TeamIdentifier=MN3D2ZM44N'
          archived_app="build/FP2ManabiSprint.xcarchive/Products/Applications/FP2ManabiSprint.app"
          security cms -D -i "$archived_app/embedded.mobileprovision" > "$expanded/profile.plist"
          python3 - "$app" "$expanded/profile.plist" <<'PY'
          import json, plistlib, sys
          from pathlib import Path

          app = Path(sys.argv[1])
          source = Path('fp2-manabi-sprint')
          profile = plistlib.loads(Path(sys.argv[2]).read_bytes())
          assert profile['Name'] == 'FP2 App Store Codemagic'
          assert profile['Entitlements']['application-identifier'] == 'MN3D2ZM44N.com.allsunday1122.fp2manabisprint'
          assert not profile['Entitlements'].get('get-task-allow')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.allsunday1122.fp2manabisprint'
          assert info['CFBundleShortVersionString'] == '1.0.0' and info['CFBundleVersion'] == '10'
          assert info['UIDeviceFamily'] == [1], info['UIDeviceFamily']
          assert info['UISupportedInterfaceOrientations'] == ['UIInterfaceOrientationPortrait']
          assert info['ITSAppUsesNonExemptEncryption'] is False
          path = 'questions/canonical/approved-questions-20261123.json'
          full = json.loads((source / path).read_bytes())['questions']
          bundled = json.loads((app / 'Web' / path).read_bytes())['questions']
          assert len(full) == 310 and len(bundled) == 298
          assert bundled == [q for q in full if q['release_selected'] is True]
          for name in ('fp2-202405-q53-family-diagram.png', 'fp2-202605-q55-family-diagram.png'):
              asset = Path('questions/verbatim/assets') / name
              assert (app / 'Web' / asset).read_bytes() == (source / asset).read_bytes()
          print('Signed 1.0.0 (10) IPA verified: 298 official questions and 2 original PNGs')
          PY
    artifacts:
      - build/fp2-internal/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

