# Codemagic configuration refreshed for the health-manager-2-ios release workflow.
workflows:
  sprint-study-ios:
    name: Sprint Study - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.sprintstudy
      vars:
        BUNDLE_ID: jp.allsunday1122.sprintstudy
        XCODE_PROJECT: ios/sprint-study/SprintStudy.xcodeproj
        XCODE_SCHEME: SprintStudy
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare bundled web assets
        script: bash "$CM_BUILD_DIR/ios/sprint-study/prepare-ios.sh"
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios/sprint-study"
          xcodegen generate
      - name: Verify release inputs
        script: |
          test -f "$CM_BUILD_DIR/ios/sprint-study/SprintStudy/Web/index.html"
          test -f "$CM_BUILD_DIR/ios/sprint-study/SprintStudy/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/ios/sprint-study/SprintStudy/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/ios/sprint-study"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  health-manager-1-testflight:
    name: Health Manager 1 - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Shiwake Swipe
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.healthmanager1
      vars:
        BUNDLE_ID: jp.allsunday1122.healthmanager1
        XCODE_PROJECT: ios/health-manager-1/HealthManager1.xcodeproj
        XCODE_SCHEME: HealthManager1
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited 264-question bundle and icon
        script: |
          set -o pipefail
          bash -x "$CM_BUILD_DIR/ios/health-manager-1/prepare-ios.sh" 2>&1 | tee /tmp/hm1-prepare.log
      - name: Generate Xcode project
        script: |
          set -o pipefail
          {
            set -x
            cd "$CM_BUILD_DIR/ios/health-manager-1"
            python3 - <<'PY2'
          from pathlib import Path
          import re
          s=Path('project.yml').read_text(encoding='utf-8')
          m=re.search(r'CURRENT_PROJECT_VERSION:\s*(\d+)',s)
          if not m:
              raise SystemExit('CURRENT_PROJECT_VERSION missing')
          print('PASS: CURRENT_PROJECT_VERSION='+m.group(1))
          PY2
            xcodegen --version
            xcodegen generate
          } 2>&1 | tee /tmp/hm1-xcodegen.log
      - name: Verify HM1 release inputs
        script: |
          python3 - "$CM_BUILD_DIR/ios/health-manager-1" <<'PY2'
          from pathlib import Path
          import collections,json,re
          import sys
          root=Path(sys.argv[1])
          q=json.loads((root/'Resources/questions.json').read_text(encoding='utf-8'))
          html=(root/'Resources/index.html').read_text(encoding='utf-8')
          assert len(q)==264, len(q)
          assert len({x['id'] for x in q})==264
          assert collections.Counter(x['round'] for x in q)=={'2026-04':44,'2025-10':44,'2025-04':44,'practice-A':44,'practice-B':44,'practice-C':44}
          assert 'practice-C-Q44' in html and '合計264問' in html
          assert (root/'Resources/PrivacyInfo.xcprivacy').is_file()
          assert (root/'Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png').is_file()
          print('PASS: HM1 audited release inputs contain 264 questions / 6x44 sets')
          PY2
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/ios/health-manager-1"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify packaged HM1 IPA content
        script: |
          IPA_PATH="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          python3 - "$APP_DIR" <<'PY2'
          from pathlib import Path
          import collections,json,plistlib,re,sys
          app=Path(sys.argv[1])
          index=(app/'index.html').read_text(encoding='utf-8')
          m=re.search(r'const QUESTIONS=(\[.*?\]);\nconst DOMAINS=',index,re.S)
          assert m, 'embedded QUESTIONS not found'
          q=json.loads(m.group(1))
          assert len(q)==264, len(q)
          assert len({x['id'] for x in q})==264
          assert collections.Counter(x['round'] for x in q)=={'2026-04':44,'2025-10':44,'2025-04':44,'practice-A':44,'practice-B':44,'practice-C':44}
          assert 'practice-C-Q44' in index and '合計264問' in index
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info.get('CFBundleIdentifier')=='jp.allsunday1122.healthmanager1'
          assert str(info.get('CFBundleVersion','')).isdigit()
          assert (app/'Assets.car').is_file()
          assert (app/'embedded.mobileprovision').is_file()
          assert (app/'_CodeSignature').is_dir()
          print('PASS: signed HM1 IPA contains audited 264-question bundle')
          PY2
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/hm1-prepare.log
      - /tmp/hm1-xcodegen.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  health-manager-2-ios:
    name: Health Manager 2 - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.healthmanager2
      vars:
        BUNDLE_ID: jp.allsunday1122.healthmanager2
        XCODE_PROJECT: ios/health-manager-2/HealthManager2.xcodeproj
        XCODE_SCHEME: HealthManager2
      xcode: latest
    scripts:
      - name: Audit learning content before macOS build
        script: |
          cd "$CM_BUILD_DIR"
          node "$CM_BUILD_DIR/ios/health-manager-2/export-audit-data.cjs"
          python3 "$CM_BUILD_DIR/automation/learning-sprint-question-pipeline/validate_questions.py" \
            "$CM_BUILD_DIR/ios/health-manager-2/learning-sprint-audit.json"
          bash -n "$CM_BUILD_DIR/ios/health-manager-2/prepare-web-assets.sh"
          python3 - <<'PY'
          import plistlib
          with open('ios/health-manager-2/HealthManager2/PrivacyInfo.xcprivacy','rb') as f:
              data=plistlib.load(f)
          assert data.get('NSPrivacyTracking') is False
          assert data.get('NSPrivacyCollectedDataTypes') == []
          print('PASS: Privacy Manifest parses and matches no-data-collection implementation.')
          PY
      - name: Install project tools
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen imagemagick
      - name: Prepare bundled web assets
        script: |
          bash "$CM_BUILD_DIR/ios/health-manager-2/prepare-web-assets.sh"
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios/health-manager-2"
          xcodegen generate
          PLIST="$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string AppIcon-120.png" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:1 string AppIcon-152" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:2 string AppIcon-167" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:3 string AppIcon-180" "$PLIST"
      - name: Verify bundled release inputs
        script: |
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Web/index.html"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Web/audit-fixes.js"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Web/question-order-v1.js"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Info.plist"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/AppIcon-120.png"
          test -f "$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/AppIcon-152.png"
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/ios/health-manager-2"
          xcode-project use-profiles
          PLIST="$CM_BUILD_DIR/ios/health-manager-2/HealthManager2/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string AppIcon-120" "$PLIST"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  otsu4-ios:
    name: 危険物乙4 - iOS Release Candidate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.otsu4
      vars:
        RELEASE_SOURCE_SHA: 8912ef194955900ee4d64b17d37910b7a2931eb8
        BUNDLE_ID: jp.allsunday1122.otsu4
        XCODE_PROJECT: native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj
        XCODE_SCHEME: Otsu4Sprint
      xcode: latest
    scripts:
      - name: Materialize audited pinned release source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git fetch --depth=1 origin "$RELEASE_SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test -f native-ios/Otsu4Sprint/project.yml
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited 360-question resources and icon
        script: bash "$CM_BUILD_DIR/native-ios/Otsu4Sprint/prepare-ios.sh"
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"
          xcodegen generate
      - name: Set numeric build number
        script: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "BUILD_NUMBER must be numeric: $BUILD_NUMBER" >&2; exit 1 ;;
          esac
          PBX="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Otsu4Sprint.xcodeproj/project.pbxproj"
          python3 - "$PBX" "$BUILD_NUMBER" <<'PY2'
          from pathlib import Path
          import re,sys
          path=Path(sys.argv[1]); number=sys.argv[2]
          if not number.isdigit(): raise SystemExit('non-numeric build number')
          text=path.read_text(encoding='utf-8')
          text,n=re.subn(r'CURRENT_PROJECT_VERSION = [^;]+;', f'CURRENT_PROJECT_VERSION = {number};', text)
          if n < 1: raise SystemExit('CURRENT_PROJECT_VERSION not found')
          if re.search(r'CURRENT_PROJECT_VERSION = (YES|NO);', text): raise SystemExit('boolean build number remains')
          path.write_text(text,encoding='utf-8')
          print(f'PASS: CURRENT_PROJECT_VERSION={number} replacements={n}')
          PY2
      - name: Verify release inputs
        script: |
          test -f "$CM_BUILD_DIR/native-ios/Otsu4Sprint/Generated/questions.generated.json"
          test -f "$CM_BUILD_DIR/native-ios/Otsu4Sprint/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/native-ios/Otsu4Sprint/Assets.xcassets/AppIcon.appiconset/Icon-1024.png"
          python3 - "$CM_BUILD_DIR/native-ios/Otsu4Sprint/Generated/questions.generated.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['contentVersion']=='otsu4-2026-08-product-v2'
          assert len(data['questions'])==360
          print('PASS: audited Otsu4 bundle inputs')
          PY
      - name: Apply App Store signing profiles for internal TestFlight only
        script: |
          cd "$CM_BUILD_DIR/native-ios/Otsu4Sprint"
          xcode-project use-profiles
      - name: Force packaged bundle version
        script: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "BUILD_NUMBER must be numeric: $BUILD_NUMBER" >&2; exit 1 ;;
          esac
          PLIST="$CM_BUILD_DIR/native-ios/Otsu4Sprint/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          test "$ACTUAL" = "$BUILD_NUMBER"
          echo "PASS: source Info.plist CFBundleVersion=$ACTUAL"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify packaged Otsu4 IPA
        script: |
          set -euo pipefail
          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          python3 - "$APP_DIR" "$BUILD_NUMBER" <<'PY2'
          from pathlib import Path
          import json,plistlib,sys
          app=Path(sys.argv[1]); expected=sys.argv[2]
          info=plistlib.loads((app/'Info.plist').read_bytes())
          actual=str(info.get('CFBundleVersion',''))
          assert expected.isdigit(), expected
          assert actual == expected, f'CFBundleVersion mismatch actual={actual} expected={expected}'
          assert info.get('CFBundleIdentifier') == 'jp.allsunday1122.otsu4', info.get('CFBundleIdentifier')
          qpath=app/'questions.generated.json'
          assert qpath.is_file(), 'packaged questions.generated.json missing'
          data=json.loads(qpath.read_text(encoding='utf-8'))
          assert data.get('contentVersion') == 'otsu4-2026-08-product-v2'
          assert len(data.get('questions') or []) == 360, len(data.get('questions') or [])
          assert (app/'Assets.car').is_file(), 'Assets.car missing'
          assert (app/'embedded.mobileprovision').is_file(), 'embedded.mobileprovision missing'
          assert (app/'_CodeSignature').is_dir(), '_CodeSignature missing'
          print(f'PASS: signed Otsu4 IPA bundle={info.get("CFBundleIdentifier")} version={info.get("CFBundleShortVersionString")} build={actual} questions=360')
          PY2
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

