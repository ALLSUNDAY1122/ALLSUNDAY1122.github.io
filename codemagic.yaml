  enprint-guard-ios-testflight:
    name: Enprint Guard - Internal TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/enprint-guard-testflight-20261127'
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: "Codemagic Shiwake Swipe"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.enprintguard
      vars:
        BUNDLE_ID: jp.allsunday1122.enprintguard
        APP_STORE_APPLE_ID: "6839814394"
        XCODE_PROJECT: enprint-guard/ios/EnprintGuard.xcodeproj
        XCODE_SCHEME: EnprintGuard
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Verify App Store Connect record gate
        script: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          app = json.loads(Path('automation/app-release-registry.json').read_text(encoding='utf-8'))['apps']['enprintguard']
          assert app['bundle_id'] == 'jp.allsunday1122.enprintguard'
          assert app.get('app_id'), 'App Store Connect App record is not created/read back'
          assert app.get('readback') is True, 'App Store Connect App ID has not been verified'
          assert app.get('status') == 'active', 'App registry is not active'
          print('PASS: Enprint Guard Apple app record identity verified')
          PY
      - name: Set unique build number and generate Xcode project
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/enprint-guard/ios/scripts/generate_app_icon.py"
          cd "$CM_BUILD_DIR/enprint-guard/ios"
          python3 - <<'PY'
          import os
          from pathlib import Path
          build = os.environ.get('CM_BUILD_NUMBER')
          if not build or not build.isdigit():
              raise RuntimeError('Codemagic CM_BUILD_NUMBER missing or invalid')
          path = Path('project.yml')
          text = path.read_text(encoding='utf-8')
          marker = 'CURRENT_PROJECT_VERSION: "1"'
          if marker not in text:
              raise RuntimeError('Expected project build-number marker not found')
          path.write_text(text.replace(marker, 'CURRENT_PROJECT_VERSION: "' + build + '"', 1), encoding='utf-8')
          print('PASS: build number injected')
          PY
          xcodegen generate
      - name: Apply App Store signing profiles for Internal TestFlight only
        script: |
          cd "$CM_BUILD_DIR/enprint-guard/ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed IPA identity and privacy manifest
        script: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          python3 - "$APP_DIR" <<'PY'
          from pathlib import Path
          import os, plistlib, sys
          app = Path(sys.argv[1])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info.get('CFBundleIdentifier') == 'jp.allsunday1122.enprintguard'
          assert info.get('CFBundleShortVersionString') == '1.0.0'
          assert info.get('CFBundleVersion') == os.environ.get('CM_BUILD_NUMBER')
          privacy = plistlib.loads((app / 'PrivacyInfo.xcprivacy').read_bytes())
          assert privacy.get('NSPrivacyTracking') is False
          assert (app / 'embedded.mobileprovision').is_file()
          assert (app / '_CodeSignature').is_dir()
          print('PASS: signed IPA identity, privacy manifest and signature')
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

