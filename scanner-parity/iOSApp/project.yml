name: ScannerParity
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: "$(SCANNER_PARITY_MARKETING_VERSION)"
    CURRENT_PROJECT_VERSION: "$(SCANNER_PARITY_BUILD_NUMBER)"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  AppShell:
    path: ../AppShell

targets:
  ScannerParity:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SCANNER_PARITY_BUNDLE_ID)"
        PRODUCT_NAME: ScannerParity
        INFOPLIST_KEY_CFBundleDisplayName: ブックスキャナー
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 本のページを連続撮影してスキャンするためにカメラを使用します。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 写真または動画から本を読み込んでスキャンするために写真ライブラリを使用します。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
