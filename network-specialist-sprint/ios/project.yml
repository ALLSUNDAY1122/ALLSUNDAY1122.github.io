name: NetworkSpecialist
options:
  bundleIdPrefix: jp.allsunday1122
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NetworkSpecialist:
    type: application
    platform: iOS
    sources:
      - path: NetworkSpecialist
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Info.plist
          - Resources
    resources:
      - path: NetworkSpecialist/Resources/questions.native.json
      - path: NetworkSpecialist/Assets.xcassets
      - path: NetworkSpecialist/PrivacyInfo.xcprivacy
    info:
      path: NetworkSpecialist/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.networkspecialist
        PRODUCT_NAME: NetworkSpecialist
        INFOPLIST_FILE: NetworkSpecialist/Info.plist
        DEVELOPMENT_TEAM: "MN3D2ZM44N"
    scheme:
      testTargets:
        - NetworkSpecialistTests
        - NetworkSpecialistUITests

  NetworkSpecialistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NetworkSpecialistTests
    dependencies:
      - target: NetworkSpecialist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.networkspecialist.tests
        DEVELOPMENT_TEAM: "MN3D2ZM44N"

  NetworkSpecialistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NetworkSpecialistUITests
    dependencies:
      - target: NetworkSpecialist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.networkspecialist.uitests
        DEVELOPMENT_TEAM: "MN3D2ZM44N"
