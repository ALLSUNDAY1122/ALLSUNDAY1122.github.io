<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#162231">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>学びスプリント v0.8.0</title>
<style>
:root{--bg:#f3f0e9;--card:#fffdfa;--ink:#162231;--muted:#68727c;--line:#ddd7cc;--navy:#162231;--green:#1d7259;--green-bg:#dff3e9;--amber:#8b5908;--amber-bg:#fff0cf;--blue:#2d5f9f;--blue-bg:#e4ecf8;--red:#9f3f48;--radius:24px;--shadow:0 18px 48px rgba(31,28,24,.10)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}
.app{width:min(640px,100%);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}.header{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 2px 18px}.header p{margin:0 0 3px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.14em}.header h1{margin:0;font-size:29px;letter-spacing:-.055em}.version{background:var(--navy);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.hero{background:linear-gradient(145deg,#162231,#24384d);color:#fff;border-radius:30px;padding:23px;box-shadow:0 22px 50px rgba(17,27,41,.2);margin-bottom:14px}.hero h2{margin:0;font-size:clamp(27px,8vw,38px);line-height:1.15;letter-spacing:-.055em}.hero p{margin:12px 0 0;color:#ced8e2;font-size:13px;line-height:1.65}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.card h2{margin:0 0 15px;font-size:19px;letter-spacing:-.035em}.field{margin-bottom:13px}.field label{display:block;margin:0 0 6px;color:var(--muted);font-size:11px;font-weight:900}.field input,.field select{width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);padding:10px 12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}.chip{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#f4f1eb;color:var(--ink);font-weight:900;font-size:13px}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.sound-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4f1eb;border-radius:14px;padding:12px 13px;margin-bottom:13px}.sound-row span{font-size:12px;font-weight:800}.sound-row input{width:22px;height:22px;accent-color:var(--navy)}.primary{width:100%;min-height:56px;border:0;border-radius:17px;background:var(--navy);color:#fff;font-weight:950;font-size:16px}
.timer-card{text-align:center;padding:18px 18px 20px}.timer-top{display:flex;justify-content:space-between;align-items:center}.phase{display:inline-flex;background:#ffe2d8;color:#9c432b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.subject{margin:14px 0 0;color:var(--muted);font-size:14px;font-weight:800}.timer{font-variant-numeric:tabular-nums;font-size:clamp(88px,27vw,150px);line-height:.93;letter-spacing:-.075em;font-weight:950;margin:9px 0 8px}.position{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.position strong{color:var(--ink);font-size:15px}.track{height:10px;border-radius:999px;background:#e7e2da;overflow:hidden;margin:13px 0 13px}.bar{height:100%;width:100%;background:linear-gradient(90deg,#f16946,#ff9c68);border-radius:inherit;transition:width .1s linear}.message{min-height:38px;margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.55}.message.awaiting{color:var(--amber);font-weight:900}.judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.judge{min-height:68px;border:0;border-radius:16px;text-align:left;padding:11px 13px}.judge strong,.judge small{display:block}.judge strong{font-size:14px}.judge small{margin-top:4px;font-size:10px;opacity:.76}.understood{background:var(--green-bg);color:var(--green)}.review{background:var(--amber-bg);color:var(--amber)}.extend{background:var(--blue-bg);color:var(--blue)}.skip{background:#ece8e1;color:var(--muted)}.session-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:9px}.session-actions button{min-height:48px;border:0;border-radius:15px;font-weight:900}.pause{background:var(--navy);color:#fff}.finish{background:#ece8e1;color:var(--red)}.live{display:flex;justify-content:center;gap:18px;margin:13px 0 0;color:var(--muted);font-size:11px}.live strong{color:var(--ink)}
.result{background:var(--green-bg);color:var(--green);border-radius:18px;padding:15px;margin-top:12px;text-align:left}.result h3{margin:0 0 6px;font-size:17px}.result p{margin:0;font-size:12px;line-height:1.6}.result button{margin-top:10px;min-height:42px;border:0;border-radius:13px;background:var(--green);color:#fff;padding:0 14px;font-weight:900}
details.history{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}details.history summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer;font-weight:900}details.history summary::-webkit-details-marker{display:none}details.history summary span{color:var(--muted);font-size:11px;font-weight:700}.history-body{border-top:1px solid var(--line);padding:14px}.history-item{border-bottom:1px solid var(--line);padding:11px 0}.history-item:last-child{border:0}.history-item strong,.history-item span{display:block}.history-item span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}.empty{color:var(--muted);font-size:12px;margin:0}.clear{margin-top:10px;border:0;background:transparent;color:var(--red);font-size:11px;font-weight:900;padding:8px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:var(--navy);color:#fff;border-radius:13px;padding:11px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 28px);z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.row{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}.hero{padding:20px}.card{padding:15px}.timer-card{padding:15px}.timer{font-size:26vw}.judge{min-height:64px}.session-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><p>SPRINT STUDY</p><h1>学びスプリント</h1></div><span class="version">v0.8.0</span></header>
<section id="hero" class="hero"><h2>短い締切を、<br>繰り返す。</h2><p>1ページ・1問ごとに時間を区切り、理解できた場所と復習する場所だけを記録します。</p></section>
<section id="setupCard" class="card">
<h2>学習を始める</h2>
<div class="field"><label for="subject">科目・教材名</label><input id="subject" maxlength="40" value="今日の学習" autocomplete="off"></div>
<div class="field"><label>1回の時間</label><div id="secondsChips" class="chips"><button class="chip" data-value="15">15秒</button><button class="chip" data-value="30">30秒</button><button class="chip active" data-value="45">45秒</button><button class="chip" data-value="60">60秒</button></div><input id="seconds" type="number" min="5" max="600" value="45" inputmode="numeric" aria-label="1回の秒数"></div>
<div class="row"><div class="field"><label for="count">回数</label><input id="count" type="number" min="1" max="999" value="10" inputmode="numeric"></div><div class="field"><label for="unit">単位</label><select id="unit"><option>ページ</option><option>問</option><option>枚</option><option>回</option></select></div></div>
<label class="sound-row"><span>終了前のカウント音</span><input id="soundEnabled" type="checkbox" checked></label>
<button id="startBtn" class="primary" type="button">開始する</button>
</section>
<section id="timerCard" class="card timer-card hidden" aria-live="polite">
<div class="timer-top"><span id="phase" class="phase">学習中</span><span id="counter">1 / 10</span></div>
<p id="currentSubject" class="subject">今日の学習</p>
<div id="timer" class="timer" role="timer">00:45</div>
<div class="position"><strong id="positionLabel">ページ 1</strong><span id="statusText">進行中</span></div>
<div class="track"><div id="bar" class="bar"></div></div>
<p id="message" class="message">理解できた時点で次へ進めます。</p>
<div class="judge-grid"><button id="understoodBtn" class="judge understood"><strong>理解できた</strong><small>次へ進む</small></button><button id="reviewBtn" class="judge review"><strong>復習が必要</strong><small>場所を記録</small></button><button id="extendBtn" class="judge extend"><strong>＋15秒</strong><small>今の範囲を続ける</small></button><button id="skipBtn" class="judge skip"><strong>未判定</strong><small>判定せず次へ</small></button></div>
<div class="session-actions"><button id="pauseBtn" class="pause">一時停止</button><button id="finishBtn" class="finish">終了</button></div>
<div class="live"><span>完了 <strong id="doneCount">0</strong></span><span>理解 <strong id="understoodCount">0</strong></span><span>復習 <strong id="reviewCount">0</strong></span></div>
<div id="result" class="result hidden"><h3>完了しました</h3><p id="resultText"></p><button id="againBtn">同じ設定でもう一度</button></div>
</section>
<details class="history"><summary>学習記録 <span id="historySummary">0回</span></summary><div class="history-body"><div id="historyList"></div><button id="clearHistory" class="clear">履歴を削除</button></div></details>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),KEY='sprintStudyV080History',SETTINGS_KEY='sprintStudyV080Settings';
let state={status:'idle',index:0,remaining:45,total:45,endAt:0,results:[],timer:null,beeped:new Set(),settings:null},audioCtx=null,clearArmed=false;
const clamp=(n,min,max)=>Math.min(max,Math.max(min,Number(n)||0)),fmt=n=>{const s=Math.max(0,Math.ceil(n));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},safeParse=(s,f)=>{try{return JSON.parse(s)}catch{return f}};
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function settings(){return {subject:$('subject').value.trim()||'今日の学習',seconds:clamp($('seconds').value,5,600),count:clamp($('count').value,1,999),unit:$('unit').value,sound:$('soundEnabled').checked}}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function loadSettings(){const s=safeParse(localStorage.getItem(SETTINGS_KEY),null);if(!s)return;$('subject').value=s.subject||'今日の学習';$('seconds').value=clamp(s.seconds||45,5,600);$('count').value=clamp(s.count||10,1,999);$('unit').value=['ページ','問','枚','回'].includes(s.unit)?s.unit:'ページ';$('soundEnabled').checked=s.sound!==false;syncChips()}
function history(){const own=safeParse(localStorage.getItem(KEY),null);if(Array.isArray(own))return own;for(const legacy of ['sprintStudyV072History','sprintStudyV061History']){const a=safeParse(localStorage.getItem(legacy),null);if(Array.isArray(a))return a.map(x=>({id:x.id||Date.now()+Math.random(),date:x.date||new Date().toISOString(),subject:x.subject||'学習',unit:x.unit||'ページ',count:x.count||x.results?.length||0,understood:x.understood??x.under??0,review:x.review||0,unjudged:x.unjudged??Math.max(0,(x.count||0)-(x.understood??x.under??0)-(x.review||0))}));}return []}
function saveHistory(a){localStorage.setItem(KEY,JSON.stringify(a.slice(0,100)))}
function syncChips(){const v=Number($('seconds').value);document.querySelectorAll('#secondsChips .chip').forEach(b=>b.classList.toggle('active',Number(b.dataset.value)===v))}
async function unlockAudio(){if(!$('soundEnabled').checked)return null;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state!=='running')await audioCtx.resume();return audioCtx}catch{return null}}
function beep(kind='count'){if(!$('soundEnabled').checked||!audioCtx||audioCtx.state!=='running')return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=kind==='finish'?980:kind==='next'?760:620;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='finish'?.12:.07,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.12);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.14)}
function render(){const s=state.settings||settings();$('currentSubject').textContent=s.subject;$('timer').textContent=fmt(state.remaining);$('counter').textContent=`${Math.min(state.index+1,s.count)} / ${s.count}`;$('positionLabel').textContent=`${s.unit} ${state.index+1}`;$('bar').style.width=`${state.total?clamp(state.remaining/state.total,0,1)*100:0}%`;const u=state.results.filter(r=>r==='understood').length,r=state.results.filter(r=>r==='review').length;$('doneCount').textContent=state.results.length;$('understoodCount').textContent=u;$('reviewCount').textContent=r;const awaiting=state.status==='awaiting';$('phase').textContent=state.status==='paused'?'一時停止':awaiting?'判定待ち':state.status==='done'?'完了':'学習中';$('statusText').textContent=awaiting?'時間です':state.status==='paused'?'停止中':state.status==='done'?'終了':'進行中';$('message').textContent=awaiting?'理解を判定するか、15秒延長してください。':state.status==='paused'?'再開すると残り時間から続きます。':'理解できた時点で次へ進めます。';$('message').classList.toggle('awaiting',awaiting);$('pauseBtn').textContent=state.status==='paused'?'再開':'一時停止';const canJudge=['running','awaiting'].includes(state.status);['understoodBtn','reviewBtn','extendBtn','skipBtn'].forEach(id=>$(id).disabled=!canJudge);$('pauseBtn').disabled=!['running','paused'].includes(state.status)}
function tick(){if(state.status!=='running')return;state.remaining=Math.max(0,(state.endAt-Date.now())/1000);const sec=Math.ceil(state.remaining);if(state.settings.sound&&sec>0&&sec<=3&&!state.beeped.has(sec)){state.beeped.add(sec);beep('count')}if(state.remaining<=0){state.status='awaiting';clearInterval(state.timer);state.timer=null;beep('next')}render()}
async function start(){const s=settings();saveSettings(s);await unlockAudio();clearInterval(state.timer);state={status:'running',index:0,remaining:s.seconds,total:s.seconds,endAt:Date.now()+s.seconds*1000,results:[],timer:null,beeped:new Set(),settings:s};$('hero').classList.add('hidden');$('setupCard').classList.add('hidden');$('timerCard').classList.remove('hidden');$('result').classList.add('hidden');render();state.timer=setInterval(tick,100);window.scrollTo({top:0,behavior:'smooth'})}
function next(outcome){if(!['running','awaiting'].includes(state.status))return;state.results.push(outcome);beep('next');if(state.results.length>=state.settings.count){complete();return}state.index++;state.remaining=state.total=state.settings.seconds;state.endAt=Date.now()+state.settings.seconds*1000;state.status='running';state.beeped=new Set();clearInterval(state.timer);state.timer=setInterval(tick,100);render()}
function complete(){clearInterval(state.timer);state.timer=null;state.status='done';beep('finish');const u=state.results.filter(x=>x==='understood').length,r=state.results.filter(x=>x==='review').length,n=state.results.filter(x=>x==='unjudged').length,item={id:Date.now(),date:new Date().toISOString(),subject:state.settings.subject,unit:state.settings.unit,count:state.settings.count,understood:u,review:r,unjudged:n};saveHistory([item,...history()]);$('resultText').textContent=`理解 ${u}、要復習 ${r}、未判定 ${n}`;$('result').classList.remove('hidden');renderHistory();render()}
function pauseResume(){if(state.status==='running'){state.remaining=Math.max(0,(state.endAt-Date.now())/1000);state.status='paused';clearInterval(state.timer);state.timer=null}else if(state.status==='paused'){state.status='running';state.endAt=Date.now()+state.remaining*1000;state.timer=setInterval(tick,100)}render()}
function extend(){if(!['running','awaiting'].includes(state.status))return;state.total+=15;state.remaining+=15;state.endAt=Date.now()+state.remaining*1000;state.status='running';state.beeped=new Set();clearInterval(state.timer);state.timer=setInterval(tick,100);render();toast('15秒延長しました')}
function finish(){if(state.status==='done'){backToSetup();return}if(confirm('今回の途中記録を終了しますか？'))backToSetup()}
function backToSetup(){clearInterval(state.timer);state.timer=null;state.status='idle';$('timerCard').classList.add('hidden');$('hero').classList.remove('hidden');$('setupCard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function renderHistory(){const a=history();$('historySummary').textContent=`${a.length}回`;$('historyList').innerHTML=a.length?a.slice(0,10).map(x=>`<div class="history-item"><strong>${escapeHtml(x.subject||'学習')}</strong><span>${new Date(x.date).toLocaleString('ja-JP')}<br>${x.count||0}${escapeHtml(x.unit||'')} ／ 理解 ${x.understood??x.under??0} ／ 復習 ${x.review||0} ／ 未判定 ${x.unjudged||0}</span></div>`).join(''):'<p class="empty">まだ記録はありません。</p>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clearHistory(){if(!clearArmed){clearArmed=true;$('clearHistory').textContent='もう一度押して削除';toast('もう一度押すと削除します');setTimeout(()=>{clearArmed=false;$('clearHistory').textContent='履歴を削除'},3000);return}saveHistory([]);clearArmed=false;$('clearHistory').textContent='履歴を削除';renderHistory();toast('履歴を削除しました')}
document.querySelectorAll('#secondsChips .chip').forEach(b=>b.onclick=()=>{$('seconds').value=b.dataset.value;syncChips()});$('seconds').oninput=syncChips;$('startBtn').onclick=start;$('understoodBtn').onclick=()=>next('understood');$('reviewBtn').onclick=()=>next('review');$('skipBtn').onclick=()=>next('unjudged');$('extendBtn').onclick=extend;$('pauseBtn').onclick=pauseResume;$('finishBtn').onclick=finish;$('againBtn').onclick=()=>{const s=state.settings;backToSetup();$('subject').value=s.subject;$('seconds').value=s.seconds;$('count').value=s.count;$('unit').value=s.unit;$('soundEnabled').checked=s.sound;syncChips();start()};$('clearHistory').onclick=clearHistory;
loadSettings();renderHistory();
})();
</script>
</body>
</html>
