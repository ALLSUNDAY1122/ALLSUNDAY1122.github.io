<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1eb">
<title>Sprint Study</title>
<style>
:root{--bg:#f3f1eb;--card:#fffefa;--ink:#17212b;--muted:#66717c;--line:#e5e0d7;--accent:#f15a3a;--soft:#ffe2d9;--green:#226f5b;--gsoft:#e3f3ed;--blue:#315fa8;--danger:#ae3f45}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}body{padding:env(safe-area-inset-top) 12px calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{width:min(720px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}.head h1{font-size:28px;margin:0;letter-spacing:-.04em}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}.badge{padding:7px 10px;border-radius:999px;background:var(--gsoft);color:var(--green);font-size:11px;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(53,43,32,.08)}.hero{background:linear-gradient(145deg,#1f2c37,#263c4b);color:#fff}.hero h2{font-size:26px;line-height:1.25;margin:0 0 9px}.hero p{margin:0;color:#d7e1e7;line-height:1.65;font-size:14px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.q{min-height:70px;border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:9px;text-align:left}.q strong{display:block}.q span{font-size:10px;color:#d7e1e7}.timer-card{text-align:center;position:relative;overflow:hidden}.timer-card:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--accent)}.phase{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--soft);color:#a83c25;font-size:12px;font-weight:900}.timer{font-size:clamp(88px,27vw,150px);font-weight:950;line-height:1;letter-spacing:-.07em;margin:10px 0}.counter{font-weight:800;color:var(--muted)}.progress{height:11px;border-radius:999px;background:#eee9e1;overflow:hidden;margin:16px 0}.bar{height:100%;background:var(--accent);width:100%}.main-controls{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}.judge{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}.btn{min-height:50px;border-radius:15px;font-weight:900;background:#ece7df;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:var(--gsoft);color:var(--green)}.btn.review{background:#fff0d5;color:#805600}.btn.more{background:#e8eef8;color:var(--blue)}.btn.danger{background:#f8e3e5;color:var(--danger)}.btn:disabled{opacity:.4}.section-title{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}input,select{width:100%;min-height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 11px;font-size:16px}.save-row{display:grid;grid-template-columns:1fr auto;gap:8px}.insight{padding:12px;border-radius:14px;background:var(--gsoft);color:var(--green);font-size:13px;line-height:1.55;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.summary div{background:#f4f0e9;border-radius:14px;padding:10px 5px;text-align:center}.summary strong{display:block;font-size:20px}.summary span{font-size:9px;color:var(--muted)}.history{display:grid;gap:8px}.item{background:#f7f3ed;border-radius:15px;padding:12px}.item strong{display:block}.meta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(243,241,235,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}.tabs-inner{width:min(720px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{height:46px;border-radius:14px;background:transparent;color:var(--muted);font-weight:900}.tab.active{background:#fff;color:var(--ink)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,15px);background:#17212b;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:540px){.quick{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.judge{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div><h1>Sprint Study</h1><p>理解を置き去りにしない学習スプリント</p></div><span class="badge">v0.6</span></header>
<main id="timerView">
<section class="card hero"><h2>1ページ・1問ごとに、短い締切をつくる。</h2><p>だらだら読むのを防ぎながら、難しい箇所は延長し、理解できなかった場所は復習対象として残します。</p><div class="quick"><button class="q" data-sec="45" data-count="10" data-unit="ページ"><strong>読む</strong><span>45秒×10ページ</span></button><button class="q" data-sec="30" data-count="20" data-unit="問"><strong>問題演習</strong><span>30秒×20問</span></button><button class="q" data-sec="15" data-count="30" data-unit="枚"><strong>暗記</strong><span>15秒×30枚</span></button><button class="q" data-sec="90" data-count="8" data-unit="ページ"><strong>精読</strong><span>90秒×8ページ</span></button></div></section>
<section class="card timer-card" id="timerCard"><span class="phase" id="phase">準備完了</span><div class="timer" id="timer">00:45</div><div class="counter" id="counter">1 / 10 ページ</div><div class="progress"><div class="bar" id="bar"></div></div><div class="main-controls"><button class="btn primary" id="mainBtn">開始</button><button class="btn" id="skipBtn" disabled>スキップ</button><button class="btn danger" id="resetBtn">リセット</button></div><div class="judge"><button class="btn good" id="goodBtn" disabled>理解して次へ</button><button class="btn review" id="reviewBtn" disabled>要復習で次へ</button><button class="btn more" id="moreBtn" disabled>＋30秒</button></div></section>
<section class="card"><h3 class="section-title">すぐ始める設定</h3><div class="grid"><div class="field"><label>科目・教材名</label><input id="subject" value="今日の学習"></div><div class="field"><label>単位</label><select id="unit"><option>ページ</option><option>問</option><option>枚</option><option>回</option></select></div><div class="field"><label>1回の秒数</label><input id="seconds" type="number" min="5" max="600" value="45"></div><div class="field"><label>回数</label><input id="count" type="number" min="1" max="999" value="10"></div></div><div class="save-row"><button class="btn good" id="quickStart">この設定で開始</button><button class="btn" id="saveSetting">設定保存</button></div></section>
</main>
<main id="historyView" class="hidden"><section class="card"><h3 class="section-title">学習記録</h3><div id="insight" class="insight">学習を重ねると、前回との速度差と連続日数を表示します。</div><div class="summary"><div><strong id="sumSessions">0</strong><span>学習回数</span></div><div><strong id="sumUnits">0</strong><span>進んだ量</span></div><div><strong id="sumRate">-</strong><span>理解率</span></div><div><strong id="sumTime">0分</strong><span>合計時間</span></div></div><div class="history" id="history"></div><button class="btn danger" id="clearHistory">履歴を削除</button></section></main>
</div>
<nav class="tabs"><div class="tabs-inner"><button class="tab active" data-view="timer">タイマー</button><button class="tab" data-view="history">記録</button></div></nav><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='sprintStudyV06History',SET='sprintStudyV06Setting';let st={status:'idle',index:1,left:45,total:45,end:0,under:0,review:0,extend:0,results:[],started:0,timer:null};const val=()=>({subject:$('subject').value.trim()||'今日の学習',unit:$('unit').value,seconds:Math.max(5,Math.min(600,+$('seconds').value||45)),count:Math.max(1,Math.min(999,+$('count').value||10))});const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.ceil(s%60)).padStart(2,'0')}`;const hist=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};const saveHist=a=>localStorage.setItem(KEY,JSON.stringify(a));function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function apply(x){$('seconds').value=x.seconds;$('count').value=x.count;$('unit').value=x.unit||'ページ';idle()}function idle(){if(st.status!=='idle')return;const s=val();st.left=st.total=s.seconds;st.index=1;$('timer').textContent=fmt(st.left);$('counter').textContent=`1 / ${s.count} ${s.unit}`;$('bar').style.width='100%'}function controls(run){$('skipBtn').disabled=!run;$('goodBtn').disabled=!run;$('reviewBtn').disabled=!run;$('moreBtn').disabled=!run}function beep(f=720,d=.08){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}function start(){const s=val();st={...st,status:'running',index:1,left:s.seconds,total:s.seconds,end:Date.now()+s.seconds*1000,under:0,review:0,extend:0,results:[],started:Date.now()};$('phase').textContent='学習中';$('mainBtn').textContent='一時停止';controls(true);tick();st.timer=setInterval(tick,100)}function tick(){if(st.status!=='running')return;st.left=Math.max(0,(st.end-Date.now())/1000);$('timer').textContent=fmt(st.left);$('bar').style.width=`${Math.max(0,st.left/st.total*100)}%`;const s=val();$('counter').textContent=`${st.index} / ${s.count} ${s.unit}`;if(st.left<=0)next('unjudged')}function next(outcome){const s=val();if(outcome==='understood')st.under++;if(outcome==='review')st.review++;st.results.push({index:st.index,outcome});beep(outcome==='review'?420:760);if(st.index>=s.count){finish();return}st.index++;st.left=st.total=s.seconds;st.end=Date.now()+s.seconds*1000;tick()}function finish(){clearInterval(st.timer);st.status='idle';controls(false);$('mainBtn').textContent='開始';$('phase').textContent='完了';const s=val(),elapsed=Math.round((Date.now()-st.started)/1000),judged=st.under+st.review,rate=judged?Math.round(st.under/judged*100):null,item={id:Date.now(),date:new Date().toISOString(),subject:s.subject,unit:s.unit,count:s.count,seconds:elapsed,avg:Math.round(elapsed/s.count),under:st.under,review:st.review,rate,extend:st.extend,results:st.results};saveHist([item,...hist()].slice(0,200));beep(980,.2);toast(`完了：理解率 ${rate??'-'}% ／ 要復習 ${st.review}${s.unit}`);render();setTimeout(idle,300)}function pause(){clearInterval(st.timer);st.status='paused';st.left=Math.max(0,(st.end-Date.now())/1000);$('mainBtn').textContent='再開';$('phase').textContent='一時停止'}function resume(){st.status='running';st.end=Date.now()+st.left*1000;$('mainBtn').textContent='一時停止';$('phase').textContent='学習中';st.timer=setInterval(tick,100)}function reset(){clearInterval(st.timer);st.status='idle';controls(false);$('mainBtn').textContent='開始';$('phase').textContent='準備完了';idle()}function render(){const a=hist(),units=a.reduce((n,x)=>n+x.count,0),secs=a.reduce((n,x)=>n+x.seconds,0),judged=a.reduce((n,x)=>n+x.under+x.review,0),under=a.reduce((n,x)=>n+x.under,0);$('sumSessions').textContent=a.length;$('sumUnits').textContent=units;$('sumTime').textContent=Math.round(secs/60)+'分';$('sumRate').textContent=judged?Math.round(under/judged*100)+'%':'-';if(!a.length){$('history').innerHTML='<div class="meta">まだ履歴はありません。</div>';return}$('history').innerHTML=a.map(x=>`<div class="item"><strong>${esc(x.subject)}</strong><div class="meta">${new Date(x.date).toLocaleString('ja-JP')}<br>${x.count}${esc(x.unit)} ／ ${Math.round(x.seconds/60)}分 ／ 平均${x.avg}秒<br>理解率 ${x.rate??'-'}% ／ 要復習 ${x.review}${esc(x.unit)}${x.review?'<br>復習箇所：'+x.results.filter(r=>r.outcome==='review').map(r=>r.index+x.unit+'目').join('、'):''}</div></div>`).join('');const latest=a[0],prev=a.slice(1).find(x=>x.subject===latest.subject&&x.unit===latest.unit);let text='連続して記録すると変化を表示します。';if(prev){const d=prev.avg-latest.avg;text=d>0?`${latest.subject}は前回より1${latest.unit}あたり${d}秒速くなりました。`:d<0?`${latest.subject}は前回より1${latest.unit}あたり${Math.abs(d)}秒長くなりました。`:'前回と同じペースです。'}$('insight').textContent=text}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{apply({seconds:+b.dataset.sec,count:+b.dataset.count,unit:b.dataset.unit});start();$('timerCard').scrollIntoView({behavior:'smooth'})});$('quickStart').onclick=()=>{start();$('timerCard').scrollIntoView({behavior:'smooth'})};$('mainBtn').onclick=()=>st.status==='idle'?start():st.status==='running'?pause():resume();$('skipBtn').onclick=()=>next('unjudged');$('goodBtn').onclick=()=>next('understood');$('reviewBtn').onclick=()=>next('review');$('moreBtn').onclick=()=>{if(st.status!=='running')return;st.left+=30;st.total+=30;st.end+=30000;st.extend++;toast('30秒延長しました')};$('resetBtn').onclick=reset;$('saveSetting').onclick=()=>{localStorage.setItem(SET,JSON.stringify(val()));toast('設定を保存しました')};$('clearHistory').onclick=()=>{if(confirm('履歴をすべて削除しますか？')){saveHist([]);render()}};['seconds','count','unit'].forEach(id=>$(id).oninput=idle);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const v=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('timerView').classList.toggle('hidden',v!=='timer');$('historyView').classList.toggle('hidden',v!=='history');if(v==='history')render();scrollTo(0,0)});try{const s=JSON.parse(localStorage.getItem(SET)||'null');if(s)apply(s)}catch{}idle();render()})();
</script>
</body>
</html>
