<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>学びスプリント v1.0.0</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#18202a;--sub:#737b84;--line:#e3e1db;--accent:#294f6f;--accent-soft:#e9f0f5;--work:#315f7f;--break:#bb7435;--rest:#39765d;--danger:#b24b4b;--shadow:0 12px 34px rgba(24,32,42,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.hidden{display:none!important}.app{width:min(560px,100%);min-height:100dvh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand small{display:block;color:var(--sub);font-size:10px;letter-spacing:.16em;font-weight:800}.brand h1{margin:3px 0 0;font-size:28px;letter-spacing:-.05em}.version{font-size:10px;color:var(--sub)}
.hero{padding:4px 1px 20px}.hero h2{margin:0;font-size:34px;line-height:1.18;letter-spacing:-.055em}.hero p{margin:10px 0 0;color:var(--sub);font-size:13px;line-height:1.65}.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.section-title h2{margin:0;font-size:17px}.section-title span{color:var(--sub);font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.preset-list{display:grid;gap:9px}.preset{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px}.preset-main{border:0;background:transparent;text-align:left;padding:0;color:var(--ink)}.preset-main strong{display:block;font-size:15px}.preset-main small{display:block;margin-top:4px;color:var(--sub);font-size:11px;line-height:1.45}.preset-edit{border:0;background:#f1f1ed;color:var(--sub);width:38px;height:38px;border-radius:12px;font-weight:900}.empty{color:var(--sub);font-size:12px;line-height:1.6;margin:0}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;color:var(--sub);font-size:11px;font-weight:800}.field input,.field select{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:0 12px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.time-chip{height:43px;border:1px solid var(--line);border-radius:13px;background:#f4f4f0;color:var(--ink);font-weight:900}.time-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.primary{width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:900;font-size:16px}.secondary{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:800}.link-btn{border:0;background:transparent;color:var(--accent);font-weight:800;font-size:12px;padding:8px 2px}.advanced{margin:2px 0 13px;border-top:1px solid var(--line);padding-top:12px}.advanced summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:900;list-style:none}.advanced summary::-webkit-details-marker{display:none}.advanced-body{padding-top:12px}.toggle{display:flex;align-items:center;justify-content:space-between;background:#f4f4f0;border-radius:14px;padding:12px 13px;margin-bottom:10px}.toggle span{font-size:12px;font-weight:800}.toggle input{width:22px;height:22px;accent-color:var(--accent)}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);height:calc(68px + env(safe-area-inset-bottom));padding:7px 14px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(243,242,238,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}.nav button{border:0;border-radius:14px;background:transparent;color:var(--sub);font-size:12px;font-weight:900}.nav button.active{background:#fff;color:var(--accent);box-shadow:0 4px 14px rgba(24,32,42,.06)}
.run{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto}.run-inner{width:min(560px,100%);min-height:100dvh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.run-head{display:flex;align-items:center;justify-content:space-between}.run-head button{border:0;background:transparent;color:var(--danger);font-size:13px;font-weight:900;padding:10px}.run-head span{color:var(--sub);font-size:11px;font-weight:800}.run-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px}.phase-label{font-size:14px;font-weight:900;letter-spacing:.08em;margin-bottom:20px}.ring{--p:100;--ring:var(--work);position:relative;width:min(72vw,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring) calc(var(--p)*1%),#dddcd7 0);box-shadow:0 22px 50px rgba(24,32,42,.10)}.ring:before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}.ring-content{position:relative;text-align:center}.remaining{font-variant-numeric:tabular-nums;font-size:clamp(70px,20vw,104px);font-weight:800;letter-spacing:-.07em;line-height:1}.unit-now{margin-top:12px;font-size:15px;font-weight:900}.unit-now small{display:block;margin-top:4px;color:var(--sub);font-size:11px;font-weight:700}.run-metrics{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:360px;margin-top:28px}.run-metrics div{text-align:center;padding:8px}.run-metrics div+div{border-left:1px solid var(--line)}.run-metrics strong{display:block;font-size:23px}.run-metrics span{display:block;margin-top:3px;color:var(--sub);font-size:10px}.run-actions{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:9px}.run-actions button{height:54px;border:0;border-radius:17px;font-weight:900}.run-actions .move{background:#fff;color:var(--ink);border:1px solid var(--line)}.run-actions .pause{background:var(--accent);color:#fff}.run-hint{text-align:center;color:var(--sub);font-size:10px;margin:10px 0 0}
.history-list{display:grid;gap:9px}.history-item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px 15px}.history-item strong{display:block;font-size:14px}.history-item span{display:block;margin-top:4px;color:var(--sub);font-size:11px;line-height:1.5}.danger-link{border:0;background:transparent;color:var(--danger);font-size:11px;font-weight:800;padding:8px 0}.result{position:fixed;inset:0;background:rgba(24,32,42,.42);z-index:80;display:grid;place-items:end center;padding:16px}.result-card{width:min(520px,100%);background:#fff;border-radius:26px;padding:22px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 24px 70px rgba(0,0,0,.24)}.result-card h2{margin:0;font-size:25px}.result-card p{color:var(--sub);font-size:13px;line-height:1.6}.result-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.result-summary div{background:#f4f4f0;border-radius:14px;padding:12px;text-align:center}.result-summary strong{display:block;font-size:22px}.result-summary span{display:block;margin-top:3px;color:var(--sub);font-size:10px}.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 13px;font-size:11px;opacity:0;transition:.2s;pointer-events:none;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.app{padding-left:13px;padding-right:13px}.hero h2{font-size:31px}.grid2{grid-template-columns:1fr 1fr}.run-inner{padding-left:15px;padding-right:15px}.ring{width:min(78vw,310px)}.run-actions{gap:7px}.run-actions button{height:51px;font-size:13px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><small>SPRINT STUDY</small><h1>学びスプリント</h1></div><span class="version">v1.0.0</span></header>
<main id="homeView">
<section class="hero"><h2>1ページの時間を、<br>先に決める。</h2><p>時間が来たら音で次へ。教材から目を離さず、一定のテンポで学習を進めます。</p></section>
<section id="savedSection" class="hidden"><div class="section-title"><h2>保存したタイマー</h2><span>タップですぐ開始</span></div><div id="presetList" class="preset-list"></div></section>
<div class="section-title"><h2 id="formTitle">新しいタイマー</h2><span>最短3項目</span></div>
<section class="card">
<div class="field"><label for="name">学習名</label><input id="name" maxlength="32" value="今日の学習" autocomplete="off"></div>
<div class="field"><label>1ページ・1問の時間</label><div class="time-row"><button class="time-chip" data-sec="15">15秒</button><button class="time-chip" data-sec="30">30秒</button><button class="time-chip active" data-sec="45">45秒</button><button class="time-chip" data-sec="60">60秒</button></div><input id="workSec" type="number" min="5" max="3600" value="45" inputmode="numeric" aria-label="学習時間（秒）"></div>
<div class="grid2"><div class="field"><label for="count">回数</label><input id="count" type="number" min="1" max="999" value="10" inputmode="numeric"></div><div class="field"><label for="unit">単位</label><select id="unit"><option>ページ</option><option>問</option><option>語</option><option>枚</option><option>回</option></select></div></div>
<details class="advanced"><summary>詳細設定</summary><div class="advanced-body">
<div class="grid2"><div class="field"><label for="startNo">開始番号</label><input id="startNo" type="number" min="0" max="99999" value="1" inputmode="numeric"></div><div class="field"><label for="switchSec">切替時間（秒）</label><input id="switchSec" type="number" min="0" max="300" value="3" inputmode="numeric"></div></div>
<div class="grid2"><div class="field"><label for="sets">セット数</label><input id="sets" type="number" min="1" max="99" value="1" inputmode="numeric"></div><div class="field"><label for="restSec">セット間休憩（秒）</label><input id="restSec" type="number" min="0" max="3600" value="60" inputmode="numeric"></div></div>
<div class="field"><label for="prepSec">開始前カウント（秒）</label><input id="prepSec" type="number" min="0" max="60" value="3" inputmode="numeric"></div>
<label class="toggle"><span>切替音</span><input id="sound" type="checkbox" checked></label>
<label class="toggle"><span>終了前3秒のカウント音</span><input id="countdownSound" type="checkbox"></label>
</div></details>
<button id="startBtn" class="primary" type="button">開始する</button>
<div class="form-actions"><button id="saveBtn" class="secondary" type="button">この設定を保存</button><button id="resetFormBtn" class="secondary" type="button">設定をリセット</button></div>
<input id="editingId" type="hidden" value="">
</section>
</main>
<main id="historyView" class="hidden"><section class="hero"><h2>学習履歴</h2><p>いつ、何を、どれだけ進めたかだけを残します。</p></section><div id="historyList" class="history-list"></div><button id="clearHistoryBtn" class="danger-link" type="button">履歴をすべて削除</button></main>
</div>
<nav id="nav" class="nav"><button class="active" data-view="home">タイマー</button><button data-view="history">履歴</button></nav>
<section id="runView" class="run hidden" aria-live="polite"><div class="run-inner"><div class="run-head"><button id="endBtn" type="button">終了</button><span id="runName">今日の学習</span><span style="width:52px"></span></div><div class="run-stage"><div id="phaseLabel" class="phase-label">学習中</div><div id="ring" class="ring"><div class="ring-content"><div id="remaining" class="remaining">00:45</div><div id="unitNow" class="unit-now">1ページ<small>学習中</small></div></div></div><div class="run-metrics"><div><strong id="itemMetric">1 / 10</strong><span>進み</span></div><div><strong id="setMetric">1 / 1</strong><span>セット</span></div></div></div><div class="run-actions"><button id="prevBtn" class="move" type="button">前へ</button><button id="pauseBtn" class="pause" type="button">一時停止</button><button id="nextBtn" class="move" type="button">次へ</button></div><p class="run-hint">時間が来ると自動で次へ進みます</p></div></section>
<section id="result" class="result hidden"><div class="result-card"><h2 id="resultTitle">完了</h2><p id="resultText"></p><div class="result-summary"><div><strong id="resultUnits">0</strong><span>進んだ量</span></div><div><strong id="resultTime">0分</strong><span>経過時間</span></div></div><button id="resultClose" class="primary" type="button">ホームへ戻る</button></div></section>
<div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const VERSION='1.0.0', KEY='manabi_timer_v100';
const $=id=>document.getElementById(id);const $$=q=>[...document.querySelectorAll(q)];
const defaults={name:'今日の学習',workSec:45,count:10,unit:'ページ',startNo:1,switchSec:3,sets:1,restSec:60,prepSec:3,sound:true,countdownSound:false};
let db={presets:[],history:[]};let session=null;let interval=null;let audioCtx=null;let countdownPlayed=new Set();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')db={presets:Array.isArray(x.presets)?x.presets:[],history:Array.isArray(x.history)?x.history:[]}}catch{}renderPresets();renderHistory()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function num(id,min,max){return Math.max(min,Math.min(max,Number($(id).value)||min))}
function readForm(){return{name:$('name').value.trim()||'今日の学習',workSec:num('workSec',5,3600),count:num('count',1,999),unit:$('unit').value,startNo:num('startNo',0,99999),switchSec:num('switchSec',0,300),sets:num('sets',1,99),restSec:num('restSec',0,3600),prepSec:num('prepSec',0,60),sound:$('sound').checked,countdownSound:$('countdownSound').checked}}
function writeForm(s){const x={...defaults,...s};for(const k of ['name','workSec','count','unit','startNo','switchSec','sets','restSec','prepSec'])$(k).value=x[k];$('sound').checked=!!x.sound;$('countdownSound').checked=!!x.countdownSound;syncTimeChips()}
function resetForm(){writeForm(defaults);$('editingId').value='';$('formTitle').textContent='新しいタイマー';$('saveBtn').textContent='この設定を保存'}
function syncTimeChips(){$$('.time-chip').forEach(b=>b.classList.toggle('active',Number(b.dataset.sec)===Number($('workSec').value)))}
function summary(s){let t=`${s.workSec}秒 × ${s.count}${s.unit}`;if(s.sets>1)t+=` × ${s.sets}セット`;return t}
function renderPresets(){const list=$('presetList');list.innerHTML='';$('savedSection').classList.toggle('hidden',db.presets.length===0);db.presets.forEach(p=>{const row=document.createElement('div');row.className='preset';row.innerHTML=`<button class="preset-main" type="button"><strong></strong><small></small></button><button class="preset-edit" type="button" aria-label="編集">•••</button>`;row.querySelector('strong').textContent=p.name;row.querySelector('small').textContent=summary(p);row.querySelector('.preset-main').onclick=()=>startSession(p);row.querySelector('.preset-edit').onclick=()=>editPreset(p.id);list.appendChild(row)})}
function editPreset(id){const p=db.presets.find(x=>x.id===id);if(!p)return;writeForm(p);$('editingId').value=id;$('formTitle').textContent='タイマーを編集';$('saveBtn').textContent='変更を保存';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function savePreset(){const s=readForm(),id=$('editingId').value;if(id){const i=db.presets.findIndex(x=>x.id===id);if(i>=0)db.presets[i]={...s,id}}else db.presets.unshift({...s,id:crypto.randomUUID?crypto.randomUUID():String(Date.now())});save();renderPresets();resetForm();toast(id?'変更を保存しました':'タイマーを保存しました')}
function renderHistory(){const list=$('historyList');list.innerHTML='';if(!db.history.length){list.innerHTML='<p class="empty">まだ履歴はありません。タイマーを完了するとここに記録されます。</p>';return}db.history.slice(0,60).forEach(h=>{const d=document.createElement('div');d.className='history-item';d.innerHTML='<strong></strong><span></span>';d.querySelector('strong').textContent=h.name;const date=new Date(h.finishedAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});d.querySelector('span').textContent=`${date} ・ ${h.units}${h.unit} ・ ${formatDuration(h.elapsedSec)} ・ ${h.completed?'完了':'途中終了'}`;list.appendChild(d)})}
function formatDuration(sec){sec=Math.max(0,Math.round(sec));if(sec<60)return`${sec}秒`;const m=Math.floor(sec/60),s=sec%60;return s?`${m}分${s}秒`:`${m}分`}
function switchView(v){$('homeView').classList.toggle('hidden',v!=='home');$('historyView').classList.toggle('hidden',v!=='history');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='history')renderHistory()}
async function unlockAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return true}catch{return false}}
function beep(freq=720,dur=.07,vol=.055){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function cue(type){if(!session?.settings.sound&&type!=='countdown')return;if(type==='work')beep(760,.08);if(type==='switch')beep(520,.08);if(type==='rest')beep(430,.12);if(type==='finish'){beep(720,.1);setTimeout(()=>beep(920,.13),140)}if(type==='countdown')beep(620,.045,.035)}
function phaseDuration(phase){const s=session.settings;if(phase==='prep')return s.prepSec;if(phase==='work')return s.workSec;if(phase==='switch')return s.switchSec;if(phase==='rest')return s.restSec;return 0}
function setPhase(phase,baseTime=Date.now()){session.phase=phase;session.phaseStartedAt=baseTime;session.phaseEndAt=baseTime+phaseDuration(phase)*1000;countdownPlayed=new Set();if(phase==='work')cue('work');else if(phase==='switch')cue('switch');else if(phase==='rest')cue('rest');renderRun()}
function nextPhase(baseTime){const s=session.settings;if(session.phase==='prep'){setPhase('work',baseTime);return true}if(session.phase==='work'){if(session.item<s.count-1){if(s.switchSec>0)setPhase('switch',baseTime);else{session.item++;setPhase('work',baseTime)}return true}if(session.set<s.sets-1){if(s.restSec>0)setPhase('rest',baseTime);else{session.set++;session.item=0;setPhase('work',baseTime)}return true}finishSession(true);return false}if(session.phase==='switch'){session.item++;setPhase('work',baseTime);return true}if(session.phase==='rest'){session.set++;session.item=0;setPhase('work',baseTime);return true}return false}
function catchUp(){if(!session||session.paused)return;let guard=0,now=Date.now();while(session&&now>=session.phaseEndAt&&guard++<10000){const base=session.phaseEndAt;if(!nextPhase(base))return}renderRun()}
function tick(){if(!session||session.paused)return;catchUp();if(!session)return;const remain=Math.max(0,session.phaseEndAt-Date.now());if(session.settings.countdownSound&&session.phase==='work'){const n=Math.ceil(remain/1000);if(n>0&&n<=3&&!countdownPlayed.has(n)){countdownPlayed.add(n);cue('countdown')}}renderRun(remain)}
function startSession(settings){unlockAudio();const s={...defaults,...settings};session={settings:s,phase:'',item:0,set:0,startedAt:Date.now(),paused:false,pauseRemaining:0};$('runView').classList.remove('hidden');$('nav').classList.add('hidden');$('runName').textContent=s.name;if(s.prepSec>0)setPhase('prep');else setPhase('work');clearInterval(interval);interval=setInterval(tick,100);tick()}
function formatClock(ms){const total=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(total/60),s=total%60;return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderRun(remainingMs){if(!session)return;const s=session.settings,phase=session.phase;const dur=phaseDuration(phase)*1000,remain=remainingMs??Math.max(0,session.phaseEndAt-Date.now());const p=dur?Math.max(0,Math.min(100,remain/dur*100)):0;const labels={prep:'準備',work:'学習中',switch:'切替',rest:'休憩'};const colors={prep:'#8a7b62',work:'#315f7f',switch:'#bb7435',rest:'#39765d'};$('phaseLabel').textContent=labels[phase]||'';$('phaseLabel').style.color=colors[phase]||'';$('ring').style.setProperty('--p',p);$('ring').style.setProperty('--ring',colors[phase]||'#315f7f');$('remaining').textContent=formatClock(remain);const no=s.startNo+session.item;if(phase==='work')$('unitNow').innerHTML=`${no}${s.unit}<small>この範囲を進める</small>`;else if(phase==='switch')$('unitNow').innerHTML=`次は ${Math.min(no+1,s.startNo+s.count-1)}${s.unit}<small>教材を切り替える</small>`;else if(phase==='rest')$('unitNow').innerHTML=`セット休憩<small>次はセット ${session.set+2}</small>`;else $('unitNow').innerHTML=`まもなく開始<small>${s.name}</small>`;$('itemMetric').textContent=`${session.item+1} / ${s.count}`;$('setMetric').textContent=`${session.set+1} / ${s.sets}`;$('pauseBtn').textContent=session.paused?'再開':'一時停止'}
function togglePause(){if(!session)return;if(!session.paused){session.pauseRemaining=Math.max(0,session.phaseEndAt-Date.now());session.paused=true}else{session.paused=false;session.phaseEndAt=Date.now()+session.pauseRemaining}renderRun(session.paused?session.pauseRemaining:undefined)}
function move(dir){if(!session)return;const s=session.settings;session.paused=false;if(dir>0){if(session.item<s.count-1)session.item++;else if(session.set<s.sets-1){session.set++;session.item=0}else{finishSession(true);return}}else{if(session.item>0)session.item--;else if(session.set>0){session.set--;session.item=s.count-1}else{toast('最初です');return}}setPhase('work')}
function finishSession(completed){if(!session)return;clearInterval(interval);interval=null;const s=session.settings,elapsed=Math.max(0,Math.round((Date.now()-session.startedAt)/1000));const units=completed?s.count*s.sets:session.set*s.count+session.item+(session.phase==='work'?1:0);db.history.unshift({name:s.name,unit:s.unit,units,elapsedSec:elapsed,completed,finishedAt:new Date().toISOString()});db.history=db.history.slice(0,100);save();renderHistory();cue('finish');$('runView').classList.add('hidden');$('nav').classList.remove('hidden');$('resultTitle').textContent=completed?'スプリント完了':'ここで終了';$('resultText').textContent=completed?'設定した範囲を最後まで進めました。':'途中までの進捗を履歴に保存しました。';$('resultUnits').textContent=`${units}${s.unit}`;$('resultTime').textContent=formatDuration(elapsed);$('result').classList.remove('hidden');session=null}
$$('.time-chip').forEach(b=>b.onclick=()=>{$('workSec').value=b.dataset.sec;syncTimeChips()});$('workSec').oninput=syncTimeChips;$('startBtn').onclick=()=>startSession(readForm());$('saveBtn').onclick=savePreset;$('resetFormBtn').onclick=resetForm;$('pauseBtn').onclick=togglePause;$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('endBtn').onclick=()=>{if(confirm('このスプリントを終了しますか？'))finishSession(false)};$('resultClose').onclick=()=>{$('result').classList.add('hidden');switchView('home')};$$('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('clearHistoryBtn').onclick=()=>{if(confirm('履歴をすべて削除しますか？')){db.history=[];save();renderHistory();toast('履歴を削除しました')}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')catchUp()});window.addEventListener('pageshow',catchUp);load();
})();
