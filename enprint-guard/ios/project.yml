name: EnprintGuard
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  EnprintGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EnprintGuard
      - path: EnprintGuard/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.enprintguard
        PRODUCT_NAME: EnprintGuard
        INFOPLIST_FILE: EnprintGuard/Info.plist
    scheme:
      testTargets:
        - EnprintGuardTests

  EnprintGuardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: EnprintGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.enprintguard.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
