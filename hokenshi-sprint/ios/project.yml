name: HokenshiSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
packages:
  HokenshiSprintNative:
    path: ../NativePackage
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: MN3D2ZM44N
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  HokenshiSprint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HokenshiSprintApp.swift
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: HokenshiSprintNative
        product: HokenshiSprintFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.hokenshi
        PRODUCT_NAME: HokenshiSprint
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 保健師国家試験
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      gatherCoverageData: false
