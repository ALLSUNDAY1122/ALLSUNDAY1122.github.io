name: ClipboardWidget
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MN3D2ZM44N

targets:
  ClipboardWidget:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/ClipboardWidgetApp.swift
      - path: Shared/Phase0.swift
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ClipboardWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.clipboardwidget
        PRODUCT_NAME: ClipboardWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "クリップボードWidget"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_ENTITLEMENTS: App/ClipboardWidget.entitlements
    scheme:
      testTargets: []

  ClipboardWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widget/ClipboardWidget.swift
      - path: Shared/Phase0.swift
      - path: Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.clipboardwidget.widget
        PRODUCT_NAME: ClipboardWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ClipboardWidgetExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
