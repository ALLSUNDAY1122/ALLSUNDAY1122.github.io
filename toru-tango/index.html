<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>撮る単語帳</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#151821;--sub:#667085;--accent:#4f46e5;--accent2:#7c3aed;--line:#e5e7eb;--ok:#16803c;--ng:#c62828}@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#191c24;--text:#f5f7fb;--sub:#aab1bd;--line:#303441}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.hero h1{margin:0;font-size:1.8rem}.hero p{margin:6px 0 0;opacity:.9}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summary div{background:rgba(255,255,255,.14);padding:10px;border-radius:12px;text-align:center}.summary b{display:block;font-size:1.2rem}.summary span{font-size:.72rem}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 4px;border-radius:14px;font-weight:700}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.card h2{font-size:1.1rem;margin:0 0 12px}.label{display:block;font-size:.88rem;color:var(--sub);margin:10px 0 5px}.input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--text)}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:#fff}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--ng)}.btn.ok{background:var(--ok)}.muted{color:var(--sub);font-size:.88rem}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qa{min-width:0}.qa b,.qa span{display:block;overflow-wrap:anywhere}.qa span{color:var(--sub);margin-top:4px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--bg);font-size:.75rem;color:var(--sub);margin-top:6px}.study{min-height:310px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px 20px}.study .side{font-size:.8rem;color:var(--sub)}.study .text{font-size:1.55rem;font-weight:800;line-height:1.5;margin:18px 0}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--accent);width:0}.hidden{display:none!important}.empty{text-align:center;color:var(--sub);padding:30px 8px}#preview{max-width:100%;max-height:280px;border-radius:12px;margin-top:10px}.status{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.9rem;margin-top:10px}.footer{text-align:center;color:var(--sub);font-size:.8rem;margin-top:24px}.small{font-size:.82rem}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.statbox{background:var(--bg);padding:14px;border-radius:14px;text-align:center}.statbox b{display:block;font-size:1.45rem}.history{padding:10px 0;border-bottom:1px solid var(--line)}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0}
</style></head><body><div class="wrap">
<section class="hero"><h1>撮る単語帳</h1><p>教材から、自分専用の一問一答を作る。</p><div class="summary"><div><b id="heroCards">0</b><span>カード</span></div><div><b id="heroToday">0</b><span>今日の回答</span></div><div><b id="heroStreak">0</b><span>連続日数</span></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="create">作る</button><button class="tab" data-tab="list">単語帳</button><button class="tab" data-tab="study">学習</button><button class="tab" data-tab="record">記録</button></nav>
<section id="create" class="panel active">
<div class="card"><h2>教材から自動作問</h2><p class="muted">教材本文を貼り付けると、重要語句を使った一問一答と穴埋め問題を端末内で生成します。文章は外部へ送信しません。</p><textarea id="sourceText" placeholder="例：日本国憲法は1947年5月3日に施行された。国民主権、基本的人権の尊重、平和主義を基本原理とする。"></textarea><label class="label">作問形式</label><select id="questionType"><option value="mix">一問一答＋穴埋め</option><option value="qa">一問一答中心</option><option value="cloze">穴埋め中心</option></select><label class="label">作問数</label><select id="questionCount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><div class="row" style="margin-top:10px"><button id="generate" class="btn">自動で問題を作る</button><button id="useOcr" class="btn secondary">OCR結果を使う</button></div><div id="genStatus" class="status hidden"></div><textarea id="generated" class="hidden" placeholder="生成結果"></textarea><div class="row" style="margin-top:10px"><button id="addGenerated" class="btn hidden">生成問題を追加</button></div><p class="muted small">現在のWeb版は生成AI APIを使わず、端末内の文章解析で作問します。内容を確認してから追加してください。</p></div>
<div class="card"><h2>直接入力</h2><label class="label">問題</label><input id="q" class="input"><label class="label">答え</label><input id="a" class="input"><div class="row" style="margin-top:12px"><button id="add" class="btn">カードを追加</button><button id="sample" class="btn secondary">例を入れる</button></div></div>
<div class="card"><h2>まとめて作成</h2><p class="muted">1行に「問題｜答え」の形式で入力してください。</p><textarea id="bulk"></textarea><button id="bulkAdd" class="btn" style="margin-top:10px">まとめて追加</button></div>
<div class="card"><h2>教材写真</h2><input id="photo" type="file" accept="image/*" capture="environment" class="input"><img id="preview" class="hidden"><div id="ocrStatus" class="status hidden"></div><textarea id="ocrText" class="hidden"></textarea><div class="row" style="margin-top:10px"><button id="ocr" class="btn secondary">写真から文字を読む</button><button id="toSource" class="btn secondary hidden">認識結果を自動作問へ</button></div></div>
</section>
<section id="list" class="panel"><div class="card"><div class="row" style="justify-content:space-between"><h2>保存済み <span id="count">0</span>枚</h2><button id="clear" class="btn danger">全削除</button></div><select id="listFilter"><option value="all">すべて</option><option value="weak">苦手カード</option><option value="unseen">未学習</option></select><div id="items"></div></div></section>
<section id="study" class="panel"><div class="card"><select id="studyMode"><option value="all">すべて</option><option value="weak">苦手を優先</option><option value="unseen">未学習のみ</option></select><button id="restart" class="btn secondary" style="margin-top:10px">この条件で開始</button><div class="progress"><div id="bar" class="bar"></div></div><div id="studyBox" class="study"><div class="empty">カードを追加すると学習できます。</div></div><div id="studyActions" class="row hidden" style="justify-content:center"><button id="speak" class="btn secondary">読み上げ</button><button id="flip" class="btn">答えを見る</button></div><div id="gradeActions" class="row hidden" style="justify-content:center"><button id="again" class="btn danger">もう一度</button><button id="known" class="btn ok">覚えた</button></div></div></section>
<section id="record" class="panel"><div class="card"><h2>学習記録</h2><div class="statgrid"><div class="statbox"><b id="totalAnswers">0</b><span>総回答数</span></div><div class="statbox"><b id="accuracy">0%</b><span>正答率</span></div><div class="statbox"><b id="streak">0日</b><span>連続学習</span></div><div class="statbox"><b id="weakCount">0</b><span>苦手カード</span></div></div><div id="historyList"></div></div><div class="card"><h2>バックアップ</h2><div class="row"><button id="backup" class="btn secondary">保存</button><label class="btn secondary filebtn">復元<input id="restore" type="file" accept="application/json"></label></div></div></section>
<div class="footer"><a href="privacy-policy.html">プライバシーポリシー</a></div></div>
<script>
const KEY='toru-tango-cards-v2',HKEY='toru-tango-history-v1';let cards=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('toru-tango-cards-v1')||'[]').map(c=>({...c,correct:c.correct||0,wrong:c.wrong||0,lastStudied:c.lastStudied||null}));let history=JSON.parse(localStorage.getItem(HKEY)||'[]'),order=[],pos=0,showAnswer=false,selectedFile=null;const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function persist(){localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(HKEY,JSON.stringify(history));renderAll()}function addCard(q,a){q=q.trim();a=a.trim();if(!q||!a)return false;cards.push({id:Date.now()+Math.random(),q,a,correct:0,wrong:0,lastStudied:null});return true}function addLines(text){let n=0;text.split(/\n/).forEach(line=>{const p=line.split(/[｜|\t]/);if(p.length>=2&&addCard(p.shift(),p.join('｜')))n++});if(n)persist();return n}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='study'&&!order.length)startStudy()});
$('#add').onclick=()=>{if(addCard($('#q').value,$('#a').value)){persist();$('#q').value='';$('#a').value=''}};$('#sample').onclick=()=>{$('#q').value='日本の首都は？';$('#a').value='東京'};$('#bulkAdd').onclick=()=>alert(addLines($('#bulk').value)+'枚追加しました');
function splitSentences(t){return t.replace(/\r/g,'').split(/[。！？!?\n]+/).map(s=>s.trim()).filter(s=>s.length>=8)}function keyword(s){const quoted=s.match(/[「『“"]([^」』”"]{2,24})[」』”"]/);if(quoted)return quoted[1];const date=s.match(/\d{4}年(?:\d{1,2}月(?:\d{1,2}日)?)?/);if(date)return date[0];const num=s.match(/\d+(?:\.\d+)?(?:％|%|人|円|年|回|個|か月|ヶ月|日|時間)/);if(num)return num[0];const defs=s.match(/^(.{2,24}?)(?:とは|は|をいう|と呼ばれる)/);if(defs)return defs[1].replace(/[、，]/g,'').trim();const words=s.match(/[一-龠々ァ-ヶA-Za-z]{3,18}/g)||[];const stop=['こと','ため','もの','これ','それ','について','によって','として','および','または'];return words.filter(w=>!stop.some(x=>w.includes(x))).sort((a,b)=>b.length-a.length)[0]||''}
function generateQuestions(text,count,type){const out=[],seen=new Set();for(const s of splitSentences(text)){const k=keyword(s);if(!k||seen.has(k))continue;seen.add(k);if(type!=='cloze')out.push(`次の内容に当てはまる語句は何ですか：${s.replace(k,'＿＿＿＿')}｜${k}`);if(type!=='qa')out.push(`${s.replace(k,'（　　）')}｜${k}`);if(out.length>=count)break}return out.slice(0,count)}
$('#generate').onclick=()=>{const text=$('#sourceText').value.trim(),st=$('#genStatus');st.classList.remove('hidden');if(text.length<20){st.textContent='教材本文を20文字以上入力してください。';return}const q=generateQuestions(text,+$('#questionCount').value,$('#questionType').value);if(!q.length){st.textContent='問題を作れませんでした。文章を増やすか、句点を含めてください。';return}$('#generated').value=q.join('\n');$('#generated').classList.remove('hidden');$('#addGenerated').classList.remove('hidden');st.textContent=q.length+'問を作成しました。内容を確認してください。'};$('#addGenerated').onclick=()=>{const n=addLines($('#generated').value);alert(n+'枚追加しました')};$('#useOcr').onclick=()=>{if(!$('#ocrText').value.trim())alert('先に写真から文字を読んでください');else $('#sourceText').value=$('#ocrText').value};
function isWeak(c){return c.wrong>c.correct||c.wrong>=2}function filterCards(m){return cards.map((c,i)=>({c,i})).filter(x=>m==='weak'?isWeak(x.c):m==='unseen'?(x.c.correct+x.c.wrong===0):true)}function renderList(){const rows=filterCards($('#listFilter').value);$('#count').textContent=cards.length;$('#items').innerHTML=rows.length?rows.map(({c,i})=>`<div class="item"><div class="qa"><b>${esc(c.q)}</b><span>${esc(c.a)}</span><small class="badge">正解 ${c.correct}・再学習 ${c.wrong}</small></div><button class="btn secondary" onclick="delCard(${i})">削除</button></div>`).join(''):'<div class="empty">該当するカードがありません。</div>'}window.delCard=i=>{if(confirm('削除しますか？')){cards.splice(i,1);persist()}};$('#listFilter').onchange=renderList;$('#clear').onclick=()=>{if(confirm('すべて削除しますか？')&&confirm('取り消せません。実行しますか？')){cards=[];history=[];order=[];persist()}};
function startStudy(){order=filterCards($('#studyMode').value).map(x=>x.i).sort(()=>Math.random()-.5);pos=0;showAnswer=false;renderStudy()}$('#restart').onclick=startStudy;function renderStudy(){if(!order.length||pos>=order.length){$('#studyBox').innerHTML='<div class="empty">'+(cards.length?'学習対象がありません。':'カードを追加すると学習できます。')+'</div>';$('#studyActions').classList.add('hidden');$('#gradeActions').classList.add('hidden');return}const c=cards[order[pos]];$('#studyBox').innerHTML=`<div class="side">${showAnswer?'ANSWER':'QUESTION'}</div><div class="text">${esc(showAnswer?c.a:c.q)}</div><div>${pos+1} / ${order.length}</div>`;$('#bar').style.width=(pos/order.length*100)+'%';$('#studyActions').classList.toggle('hidden',showAnswer);$('#gradeActions').classList.toggle('hidden',!showAnswer)}$('#flip').onclick=()=>{showAnswer=true;renderStudy()};$('#speak').onclick=()=>{const c=cards[order[pos]],u=new SpeechSynthesisUtterance(showAnswer?c.a:c.q);u.lang='ja-JP';speechSynthesis.cancel();speechSynthesis.speak(u)};function grade(ok){const i=order[pos];ok?cards[i].correct++:cards[i].wrong++;cards[i].lastStudied=Date.now();history.push({date:today(),ok,cardId:cards[i].id});if(!ok)order.push(i);pos++;showAnswer=false;persist()}$('#known').onclick=()=>grade(true);$('#again').onclick=()=>grade(false);
function calcStreak(){const days=[...new Set(history.map(h=>h.date))].sort().reverse();let n=0,d=new Date();for(let i=0;i<days.length;i++){const a=new Date(d.getTime()-i*86400000).toISOString().slice(0,10);if(days.includes(a))n++;else break}return n}function renderRecord(){const total=history.length,ok=history.filter(h=>h.ok).length,st=calcStreak();$('#totalAnswers').textContent=total;$('#accuracy').textContent=total?Math.round(ok/total*100)+'%':'0%';$('#streak').textContent=st+'日';$('#weakCount').textContent=cards.filter(isWeak).length;$('#heroCards').textContent=cards.length;$('#heroToday').textContent=history.filter(h=>h.date===today()).length;$('#heroStreak').textContent=st;const by={};history.forEach(h=>{by[h.date]??={all:0,ok:0};by[h.date].all++;if(h.ok)by[h.date].ok++});$('#historyList').innerHTML=Object.keys(by).sort().reverse().slice(0,14).map(d=>`<div class="history"><b>${d}</b><div>${by[d].all}問・正答率 ${Math.round(by[d].ok/by[d].all*100)}%</div></div>`).join('')}
$('#backup').onclick=()=>{const blob=new Blob([JSON.stringify({cards,history},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toru-tango-'+today()+'.json';a.click()};$('#restore').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.cards)||!Array.isArray(d.history))throw 0;if(confirm('現在のデータを置き換えますか？')){cards=d.cards;history=d.history;persist()}}catch{alert('復元できませんでした')}};
$('#photo').onchange=e=>{selectedFile=e.target.files[0]||null;if(selectedFile){$('#preview').src=URL.createObjectURL(selectedFile);$('#preview').classList.remove('hidden')}};$('#ocr').onclick=async()=>{if(!selectedFile)return alert('写真を選んでください');const st=$('#ocrStatus');st.classList.remove('hidden');st.textContent='文字認識機能を読み込み中…';try{if(!window.Tesseract)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});const x=await Tesseract.recognize(selectedFile,'jpn+eng',{logger:m=>{if(m.progress)st.textContent='文字認識中 '+Math.round(m.progress*100)+'%'}});$('#ocrText').value=x.data.text.trim();$('#ocrText').classList.remove('hidden');$('#toSource').classList.remove('hidden');st.textContent='認識完了'}catch{st.textContent='文字認識に失敗しました。'}};$('#toSource').onclick=()=>{$('#sourceText').value=$('#ocrText').value;window.scrollTo({top:0,behavior:'smooth'})};function renderAll(){renderList();renderStudy();renderRecord()}renderAll();
</script></body></html>
