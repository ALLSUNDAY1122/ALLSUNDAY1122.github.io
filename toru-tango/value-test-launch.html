<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>撮る単語帳｜Safari価値検証版を起動中</title>
  <style>
    body{align-items:center;background:#f3f5fa;color:#172033;display:flex;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;justify-content:center;margin:0;min-height:100vh;padding:24px;text-align:center}
    main{background:#fff;border:1px solid #dce2ec;border-radius:20px;max-width:420px;padding:24px;width:100%}
    p{color:#667085;line-height:1.6}
  </style>
</head>
<body>
  <main><strong>撮る単語帳</strong><p id="status">Safari価値検証版を読み込んでいます。</p></main>
  <script>
    (async () => {
      try {
        const response = await fetch('value-test.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const source = await response.text();
        const oldGenerator = 'https://cdn.jsdelivr.net/gh/ALLSUNDAY1122/ALLSUNDAY1122.github.io@fa6d712ed693dae45b08a85f26326b8c9d734033/toru-tango/generator-v2.js';
        const generatorUpdated = source.replace(oldGenerator, 'generator-v2.js');
        if (generatorUpdated === source) throw new Error('作問機能の参照を更新できませんでした。');
        const prepared = generatorUpdated.replace('</body>', '<script src="ocr-enhance-v2.js"><\/script></body>');
        if (prepared === generatorUpdated) throw new Error('OCR改善機能を追加できませんでした。');
        document.open();
        document.write(prepared);
        document.close();
      } catch (error) {
        document.querySelector('#status').textContent = `読み込みに失敗しました。ページを再読み込みしてください。${error instanceof Error ? `（${error.message}）` : ''}`;
      }
    })();
  </script>
</body>
</html>
