<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>作問改善版テスト｜撮る単語帳</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#151821;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:20px 14px 60px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:12px}h1{font-size:1.55rem;margin:0 0 6px}p{color:#667085;line-height:1.7}textarea,select{width:100%;border:1px solid #d8dce5;border-radius:12px;background:#f8f9fc;color:#151821;padding:12px;font:inherit}textarea{min-height:260px;resize:vertical}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#4f46e5;color:#fff;font-weight:800;font:inherit}.status{margin-top:10px;padding:11px;border-radius:12px;background:#eef0ff;color:#3730a3}.output{min-height:220px}.note{font-size:.88rem}@media(max-width:560px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>作問改善版テスト</h1>
    <p>単語の機械的な抜き出しをやめ、年代・場所・発見・命名・移動方向など、本文から明確に答えられる事実だけを問題にします。問題数より品質を優先します。</p>
  </section>
  <section class="card">
    <label for="source">教材本文</label>
    <textarea id="source">人類史のはじまり

最古の人類、ルーシーの骨（複製）
人類は、数百万年前にアフリカ大陸で誕生した、とされている。

約540万年前アフリカ大陸で、現在のところ最古の猿人とよばれるアウストラロピテクスが登場した。これが最初の人類とされている。東アフリカのタンザニアで、猿人の一種である、ジンジャントロプス（Zinjanthropus、en:Paranthropus boisei）の化石が発見された。

エチオピア北東部ハダール村付近では、318万年前のアウストラロピテクス・アファレンシス（アファール猿人、en:Australopithecus afarensis）の化石骨が1974年11月24日に発見され、「ルーシー」と名付けられた。

200万年前から100万年前、アフリカ大陸の北側から、陸地づたいに、地中海東岸方面へ生活の場を広げ、ユーラシアを西方（地中海北側を、ヨーロッパ方面）へ進む者と、東方（中央アジア、東アジア方面）へ進む者に分かれて広がっていった、と考えられている。</textarea>
    <div class="row">
      <select id="type"><option value="mix">一問一答＋穴埋め</option><option value="qa">一問一答</option><option value="cloze">穴埋め</option></select>
      <select id="difficulty"><option value="easy">やさしい</option><option value="normal" selected>標準</option><option value="hard">難しい</option></select>
      <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
    </div>
    <button id="run" class="btn">改善版で作問する</button>
    <div id="status" class="status">上の文章でそのまま試せます。</div>
  </section>
  <section class="card">
    <label for="output">生成結果</label>
    <textarea id="output" class="output" readonly></textarea>
    <p class="note">「問題｜答え」形式です。意味のある問題が不足する場合、選択した件数より少なく生成します。</p>
  </section>
</main>
<script src="generator-v2.js?v=20260726"></script>
<script>
  document.querySelector('#run').onclick=()=>{
    const text=document.querySelector('#source').value;
    const count=Number(document.querySelector('#count').value);
    const type=document.querySelector('#type').value;
    const difficulty=document.querySelector('#difficulty').value;
    const result=ToruTangoGeneratorV2.generateQuestionsV2(text,count,type,difficulty);
    document.querySelector('#output').value=result.join('\n');
    document.querySelector('#status').textContent=result.length<count?`品質を優先し、${result.length}問を生成しました。`:`${result.length}問を生成しました。`;
  };
  document.querySelector('#run').click();
</script>
</body>
</html>
