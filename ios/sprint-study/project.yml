name: SprintStudy
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
targets:
  SprintStudy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SprintStudy/SprintStudyApp.swift
      - path: SprintStudy/LocalWebView.swift
    resources:
      - path: SprintStudy/Web
      - path: SprintStudy/Assets.xcassets
      - path: SprintStudy/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.sprintstudy
        PRODUCT_NAME: SprintStudy
        INFOPLIST_FILE: SprintStudy/Info.plist
    info:
      path: SprintStudy/Info.plist
      properties:
        CFBundleDisplayName: 学びスプリント
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      testTargets: []
