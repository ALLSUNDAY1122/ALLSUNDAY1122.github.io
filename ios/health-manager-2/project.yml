name: HealthManager2
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  HealthManager2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthManager2/HealthManager2App.swift
      - path: HealthManager2/WebView.swift
    resources:
      - path: HealthManager2/Web
      - path: HealthManager2/Assets.xcassets
      - path: HealthManager2/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.healthmanager2
        PRODUCT_NAME: HealthManager2
        INFOPLIST_FILE: HealthManager2/Info.plist
    info:
      path: HealthManager2/Info.plist
      properties:
        CFBundleDisplayName: 第二種衛生管理者
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      testTargets: []
