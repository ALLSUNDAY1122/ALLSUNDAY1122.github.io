name: HealthManager2
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  HealthManager2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthManager2/HealthManager2App.swift
      - path: HealthManager2/StoreKitManager.swift
      - path: HealthManager2/WebView.swift
      - path: HealthManager2/Web
        type: folder
        buildPhase: resources
      - path: HealthManager2/Assets.xcassets
        buildPhase: resources
      - path: HealthManager2/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: HealthManager2/AppIcon-120.png
        buildPhase: resources
      - path: HealthManager2/AppIcon-152.png
        buildPhase: resources
      - path: HealthManager2/AppIcon-167.png
        buildPhase: resources
      - path: HealthManager2/AppIcon-180.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.healthmanager2
        PRODUCT_NAME: HealthManager2
        INFOPLIST_FILE: HealthManager2/Info.plist
    info:
      path: HealthManager2/Info.plist
      properties:
        CFBundleDisplayName: 第二種衛生管理者
        CFBundleIconName: AppIcon
        UIDeviceFamily:
          - 1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    scheme:
      testTargets: []
