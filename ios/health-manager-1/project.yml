name: HealthManager1
options:
  bundleIdPrefix: jp.allsunday1122
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2026081903
targets:
  HealthManager1:
    type: application
    platform: iOS
    sources:
      - path: HealthManager1
      - path: Resources
        buildPhase: resources
    preBuildScripts:
      - name: Prepare audited 264 questions and unified AppIcon
        script: |
          bash "$SRCROOT/prepare-ios.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.healthmanager1
        PRODUCT_NAME: "第一種衛生管理者"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HealthManager1/Info.plist
      properties:
        CFBundleDisplayName: "第一種衛生管理者"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
schemes:
  HealthManager1:
    build:
      targets:
        HealthManager1: all
    run:
      config: Debug
    archive:
      config: Release
