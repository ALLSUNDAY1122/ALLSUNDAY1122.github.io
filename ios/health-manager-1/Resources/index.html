function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function renderHome(){const goal=STATE.settings.goal,done=todayDone(),pct=Math.min(100,Math.round(done/goal*100));let h=`<main class="screen"><div class="top"><div class="brand"><span class="brandmark">学</span>学びスプリント</div><h1 class="title">第一種衛生管理者</h1><p class="tagline">今日も1問、力に変える。</p></div>${examCountdown()}<section class="today"><div class="ring82" style="--pct:${pct}%"><div><b>${Math.min(done,goal)}/${goal}</b><span>今日</span></div></div><div class="todaybody"><div class="todaycap">今日の学習</div><div class="todaymain">${done>=goal?'今日の目標を達成':'あと '+Math.max(0,goal-done)+'問'}</div><div class="todaysub">短い反復を積み上げます。無理なく続ければ十分です。</div><span class="streak">連続 ${streak()}日</span></div></section>`;

();start('weak',shuffle(w).slice(0,goal),'苦手をつぶす')};app.querySelector('#mockGo').onclick=()=>go('mock');app.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>start('domain',shuffle(domainQs(b.dataset.domain)).slice(0,goal),b.dataset.domain,{subject:b.dataset.domain}));}
function mockState(r,d){const k=`${r}|${d}`,n=STATE.completions[k]||0;let hist=STATE.history.find(x=>x.meta?.round===r&&x.meta?.subject===d);if(!hist)return {text:n?`完答 ${n}回`:'未受験',cls:''};const rate=hist.total?hist.correct/hist.total:0;return {text:`前回 ${hist.correct}/${hist.total}`,cls:rate>=.6?'good':'bad'}}
function renderMock(){let h=`<main class="screen"><div class="mockWrap"><div class="pageBrand">模擬試験</div><h1 class="pageTitle">本番形式</h1><p class="pageTag">3回分を科目ごとに。1科目ずつでも通しでも解けます。</p>${ROUNDS.map(r=>{const locked=r.id!=='2026-04'&&!IAP.isPremium;return `<section class="mockRound"><div class="mocktitle"><b>${r.title}</b><span>${r.period}</span></div><button class="fullMock ${locked?'locked':''}" data-full="${r.id}">44問を通しで解く</button><div class="mockgrid">${DOMAINS.map(d=>{const qs=roundSubject(r.id,d),s=mockState(r.id,d);return `<button class="mockcard ${locked?'locked':''}" data-r="${r.id}" data-s="${d}"><b>${d}</b><span>${qs.length}問</span><em class="state ${s.cls}">${s.text}</em></button>`}).join('')}</div></section>`}).join('')}</div>${nav('mock')}</main>`;app.innerHTML=h;bindNav();app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(b.dataset.r!=='2026-04'&&!IAP.isPremium)return requirePremium();const qs=roundSubject(b.dataset.r,b.dataset.s),rr=ROUNDS.find(x=>x.id===b.dataset.r);start('mockSubject',qs,`${rr.title}｜${b.dataset.s}`,{round:b.dataset.r,subject:b.dataset.s})});app.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{if(b.dataset.full!=='2026-04'&&!IAP.isPremium)return requirePremium();const rr=ROUNDS.find(x=>x.id===b.dataset.full);start('mockFull',roundQs(b.dataset.full),`${rr.title}｜44問`,{round:b.dataset.full})})}
function choicesFor(q){let arr=q.choices.map((text,idx)=>({text,idx}));if(STATE.settings.shuffleC){const seed=(SESSION?.idx||0)+q.id.length;for(let i=arr.length-1;i>0;i--){const j=(seed*31+i*17)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}}return arr}

function renderQuiz(){if(!SESSION){SESSION=STATE.active;if(!SESSION)return go('home')}const id=SESSION.ids[SESSION.idx],q=byId[id],ans=SESSION.answers[id],total=SESSION.ids.length;let prog='';if(total<=20){prog=`<div class="pips">${SESSION.ids.map((qid,i)=>{const a=SESSION.answers[qid];return `<i class="pip ${a?(a.correct?'ok':'ng'):''} ${i===SESSION.idx?'cur':''}"></i>`}).join('')}</div>`}else{prog=`<div class="longProgress"><i style="width:${Math.round((SESSION.idx+(ans?1:0))/total*100)}%"></i></div>`}let ch=choicesFor(q);let choiceHtml=ch.map((c,i)=>{let cls='',mark='';if(ans){if(c.idx===q.ans){cls='correct';mark=`<span class="mark">${markSvg(true)}</span>`}else if(ans.selected===c.idx){cls='wrong';mark=`<span class="mark x">${markSvg(false)}</span>`}else cls='dim'}return `<button class="choice ${cls}" data-choice="${c.idx}" ${ans?'disabled':''}><span class="n">${i+1}</span><span>${esc(c.text)}</span>${mark}</button>`}).join('');let fb='';if(ans){let weakMsg='';const rec=p(id);if(!ans.correct)weakMsg='苦手に追加しました　あとで復習できます';else if(SESSION.mode==='weak'&&rec.weak)weakMsg=`苦手卒業まであと${Math.max(0,3-(rec.weakStreak||0))}回 ${'●'.repeat(rec.weakStreak||0)}${'○'.repeat(Math.max(0,3-(rec.weakStreak||0)))}`;else if(SESSION.mode==='weak'&&!rec.weak)weakMsg='3回連続正解　苦手から外れました';fb=`<div class="feedback"><div class="fbhead ${ans.correct?'ok':'ng'}">${ans.correct?'正解':'惜しい'}</div><div class="memory">${esc(q.key)}</div><div class="reason">${esc(q.short)}</div><details class="detail"><summary>詳しい解説を見る</summary><p>${esc(q.detail)}</p>${q.lawAsOf?`<p>法令基準日：${esc(q.lawAsOf)} ／ 監査日：${esc(q.auditDate||'')}</p>`:''}</details>${weakMsg?`<div class="weakHint">${weakMsg}</div>`:''}<button class="next" id="next">${SESSION.idx===total-1?'結果を見る':'次の問題へ'}</button></div>`}
app.innerHTML=`<main class="screen"><header class="quizhead"><button id="quit">‹ 中断</button><div class="qhtitle"><b>${esc(SESSION.title)}</b><span>${esc(q.label)}</span></div><div class="qhcount">${SESSION.idx+1} / ${total}</div></header>${prog}<section class="qcard"><span class="qtag">${esc(q.label)}</span><div class="qtext">${esc(q.stem)}</div><div class="choices">${choiceHtml}</div>${!ans?'<button class="unknown" id="unknown">わからない（答えを見る）</button>':''}${fb}</section></main>`;app.querySelector('#quit').onclick=()=>{STATE.active=SESSION;save();go('home')};if(!ans){app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>grade(Number(b.dataset.choice),false));app.querySelector('#unknown').onclick=()=>grade(null,true)}else app.querySelector('#next').onclick=nextQuestion}
function grade(selected,unknown){const q=byId[SESSION.ids[SESSION.idx]],correct=!unknown&&selected===q.ans;SESSION.answers[q.id]={selected,unknown,correct};if(correct)SESSION.correct++;else SESSION.wrongIds.push(q.id);if(unknown)SESSION.unknown++;const rec=p(q.id);rec.attempts=(rec.attempts||0)+1;if(correct)rec.correct=(rec.correct||0)+1;if(!correct){rec.weak=true;rec.weakStreak=0}else if(SESSION.mode==='weak'&&rec.weak){rec.weakStreak=(rec.weakStreak||0)+1;if(rec.weakStreak>=3){rec.weak=false;setTimeout(()=>showToast('苦手をひとつ卒業しました'),120)}}STATE.dayCounts[todayKey()]=(STATE.dayCounts[todayKey()]||0)+1;STATE.active=SESSION;save();renderQuiz()}

function finish(){const total=SESSION.ids.length,dur=Math.max(1,Math.round((Date.now()-SESSION.startedAt)/1000));const rec={date:new Date().toISOString(),title:SESSION.title,total,correct:SESSION.correct,wrongIds:[...new Set(SESSION.wrongIds)],unknown:SESSION.unknown,duration:dur,mode:SESSION.mode,meta:SESSION.meta};STATE.history.unshift(rec);STATE.history=STATE.history.slice(0,40);if(SESSION.mode==='mockSubject'){const k=`${SESSION.meta.round}|${SESSION.meta.subject}`;STATE.completions[k]=(STATE.completions[k]||0)+1}STATE.active=null;LAST=rec;save();VIEW='result';render();scrollTo(0,0)}

function heatSvg(){let cells='',start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-34);for(let i=0;i<35;i++){const d=new Date(start);d.setDate(start.getDate()+i);const n=STATE.dayCounts[todayKey(d)]||0;const fill=n===0?'#eee7da':n<=3?'#f7c9bd':n<=7?'#ef9c88':n<=15?'#e26f55':'#d8452c';const x=(i%7)*12,y=Math.floor(i/7)*12;cells+=`<rect x="${x}" y="${y}" width="10" height="10" rx="2.5" fill="${fill}"/>`}return `<svg viewBox="-1.5 -1.5 85 61" width="100%" aria-label="5週間の学習ヒートマップ">${cells}</svg>`}

ce(0,STATE.settings.goal),'苦手をつぶす')}}
function seg(values,current,attr){return `<div class="seg">${values.map(([v,l])=>`<button data-${attr}="${v}" class="${String(current)===String(v)?'active':''}">${l}</button>`).join('')}</div>`}
function renderSettings(){let h=`<main class="screen"><div class="settingsWrap"><div class="pageBrand">設定</div><h1 class="pageTitle">学び方</h1><p class="pageTag">自分のペースに合わせて、毎日の負担を調整できます。</p><section class="setting"><span class="slab">1. 文字サイズ</span><small>標準・大・特大の3段階</small>${seg([['normal','標準'],['large','大'],['xlarge','特大']],STATE.settings.font,'font')}</section><section class="setting"><span class="slab">2. 1日の目標</span><small>今日の進捗リングとスプリント数に反映</small>${seg([[4,'4問'],[8,'8問'],[16,'16問']],STATE.settings.goal,'goal')}</section><section class="setting"><div class="toggleRow"><div><span class="slab">3. 出題順シャッフル</span><small>デフォルトON</small></div><button class="toggle ${STATE.settings.shuffleQ?'on':''}" id="toggleQ"></button></div></section><section class="setting"><div class="toggleRow"><div><span class="slab">4. 選択肢シャッフル</span><small>デフォルトOFF。正答位置は追従します。</small></div><button class="toggle ${STATE.settings.shuffleC?'on':''}" id="toggleC"></button></div></section><section class="setting"><span class="slab">5. 試験日</span><small>設定するとホームに残日数と必要ペースを表示</small><input class="dateInput" type="date" id="examDate" value="${STATE.settings.examDate||''}"></section><section class="setting"><span class="slab">6. 学習データ書き出し／読み込み</span><small>端末変更やバックアップ用JSON</small><div class="dataBtns"><button id="exportBtn">書き出す</button><button id="importBtn">読み込む</button></div><input type="file" id="importFile" accept="application/json" hidden></section><section class="setting"><details><summary>7. 覚えかたのルール</summary><ul><li>間違えた問題は自動で苦手に追加します。</li><li>苦手問題を3回連続で正解すると卒業します。</li><li>「わからない」も正式な回答として苦手に追加します。</li></ul></details></section><section class="setting"><details><summary>8. この教材について</summary><p>第一種衛生管理者の公表3回分の出題論点に対応した独自問題132問を収録しています。公式問題本文の転載ではありません。関係法令は2026年8月8日基準で監査しています。</p><div class="premiumBox"><b>${IAP.isPremium?'プレミアム解放済み':'プレミアム'}</b><p>${IAP.isPremium?(IAP.entitlementSource==='lifetime'?'買い切りプランが有効です。全132問・苦手復習を期限なく利用できます。':'月額プランが有効です。全132問・苦手復習を利用できます。'):'月額プランと買い切りプランから選べます。'}</p>${IAP.isPremium?'':`<button id="buySettings">プランを見る</button>`}<button class="restore" id="restoreSettings">購入を復元</button>${IAP.entitlementSource==='monthly'?'<button class="restore" id="manageSubscription">サブスクリプションを管理</button>':''}</div><div class="dataBtns"><button id="privacy">プライバシー</button><button id="support">サポート</button></div><button class="aboutBtn" style="width:100%;margin-top:8px" id="terms">利用規約</button></details></section><section class="setting"><span class="slab">9. 学習記録リセット</span><small>購入資格はリセットされません。</small><button class="danger" id="reset" style="margin-top:10px">学習記録をリセット</button></section></div>${nav('settings')}</main>`;app.innerHTML=h;bindNav();document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{STATE.settings.font=b.dataset.font;save();applyFont();renderSettings()});document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{STATE.settings.goal=Number(b.dataset.goal);save();renderSettings()});app.querySelector('#toggleQ').onclick=()=>{STATE.settings.shuffleQ=!STATE.settings.shuffleQ;save();renderSettings()};app.querySelector('#toggleC').onclick=()=>{STATE.settings.shuffleC=!STATE.settings.shuffleC;save();renderSettings()};app.querySelector('#examDate').onchange=e=>{STATE.settings.examDate=e.target.value;save()};app.querySelector('#exportBtn').onclick=exportData;app.querySelector('#importBtn').onclick=()=>app.querySelector('#importFile').click();app.querySelector('#importFile').onchange=importData;const buy=app.querySelector('#buySettings');if(buy)buy.onclick=()=>{PAYWALL=true;render()};app.querySelector('#restoreSettings').onclick=()=>bridge('restore');const manage=app.querySelector('#manageSubscription');if(manage)manage.onclick=()=>bridge('openURL',{url:'https://apps.apple.com/account/subscriptions'});app.querySelector('#privacy').onclick=()=>openURL('privacy');app.querySelector('#support').onclick=()=>openURL('support');app.querySelector('#terms').onclick=()=>openURL('terms');app.querySelector('#reset').onclick=()=>{if(confirm('学習記録をリセットしますか？')){STATE=fresh();save();applyFont();renderSettings()}}}
function exportData(){const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hm1-study-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s.settings||!s.progress)throw 0;STATE=Object.assign(fresh(),s);save();applyFont();showToast('学習データを読み込みました');renderSettings()}catch(err){alert('読み込めないデータです')}};rd.readAsText(f)}
function monthlyTrialLine(){
 const trial=IAP.monthlyIntroEligible&&IAP.monthlyHasSevenDayFreeTrial;
 return trial?'初回7日間無料。その後は'+esc(IAP.monthlyPrice)+'で自動更新。無料期間中に解約した場合、料金は発生しません。':'毎月自動更新。価格・更新条件は購入確認画面でも表示されます。'
}
function paywallHtml(){
 if(!PAYWALL)return '';
 const active=IAP.entitlementSource;
 return `<div class="paywallOverlay"><div class="paywall"><button class="closePw" id="closePw">×</button><div class="pageBrand">プレミアム</div><h2>使い方に合わせて選べます</h2><p>どちらのプランでも全132問・苦手復習・模試を解放します。</p><div class="planGrid"><div class="planCard recommended"><span class="planBadge">短期集中</span><div class="planType">自動更新</div><div class="planName">月額プラン</div><div class="planPrice">${esc(IAP.monthlyPrice)}<small>/月</small></div><div class="planSub">受験まで数か月だけ使いたい方向け。</div>${IAP.monthlyIntroEligible&&IAP.monthlyHasSevenDayFreeTrial?'<div class="trialNote">初回7日間無料</div>':''}<button class="planBuy" id="buyMonthly" ${active==='monthly'||active==='lifetime'?'disabled':''}>${active==='monthly'?'利用中':active==='lifetime'?'買い切り済み':'月額で始める'}</button></div><div class="planCard lifetime"><span class="planBadge">長く使う</span><div class="planType">一度だけ</div><div class="planName">買い切り</div><div class="planPrice">${esc(IAP.lifetimePrice)}</div><div class="planSub">期限なく利用。自動更新はありません。</div><button class="planBuy" id="buyLifetime" ${active==='lifetime'?'disabled':''}>${active==='lifetime'?'購入済み':'買い切る'}</button></div></div><p class="subTerms">${monthlyTrialLine()}</p><button class="restore" id="restorePw">購入を復元</button>${active==='monthly'?'<button class="manageSub" id="managePw">サブスクリプションを管理</button>':''}<div class="dataBtns"><button id="pwTerms">利用規約</button><button id="pwPrivacy">プライバシー</button></div></div></div>`;
}
function bindPaywall(){
 const c=document.querySelector('#closePw');if(c)c.onclick=()=>{PAYWALL=false;render()};
 const m=document.querySelector('#buyMonthly');if(m)m.onclick=()=>bridge('purchase',{productID:MONTHLY_PRODUCT_ID});
 const l=document.querySelector('#buyLifetime');if(l)l.onclick=()=>bridge('purchase',{productID:LIFETIME_PRODUCT_ID});
 const r=document.querySelector('#restorePw');if(r)r.onclick=()=>bridge('restore');
 const g=document.querySelector('#managePw');if(g)g.onclick=()=>bridge('openURL',{url:'https://apps.apple.com/account/subscriptions'});
 const t=document.querySelector('#pwTerms');if(t)t.onclick=()=>openURL('terms');
 const p=document.querySelector('#pwPrivacy');if(p)p.onclick=()=>openURL('privacy');
}
function showToast(t){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function applyFont(){document.body.classList.remove('large','xlarge');if(STATE.settings.font==='large')document.body.classList.add('large');if(STATE.settings.font==='xlarge')document.body.classList.add('xlarge')}
function render(){if(VIEW==='home')renderHome();else if(VIEW==='mock')renderMock();else if(VIEW==='quiz')renderQuiz();else if(VIEW==='result')renderResult();else if(VIEW==='history')renderHistory();else renderSettings();if(PAYWALL){app.insertAdjacentHTML('beforeend',paywallHtml());bindPaywall()}}
applyFont();render();requestStore();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
