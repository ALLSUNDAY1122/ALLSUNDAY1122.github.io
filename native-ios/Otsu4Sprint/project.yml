name: Otsu4Sprint
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Otsu4Sprint:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - '*.swift'
    resources:
      - path: PrivacyInfo.xcprivacy
      - path: Generated/questions.generated.json
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.otsu4
        PRODUCT_NAME: Otsu4Sprint
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
