name: Otsu4Sprint
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Otsu4Sprint:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - '*.swift'
    resources:
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.otsu4
        PRODUCT_NAME: Otsu4Sprint
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    preBuildScripts:
      - name: Generate audited 360-question bundle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/../.."
          node tools/otsu4-build-content-v2.mjs
          RESOURCE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RESOURCE_DIR"
          cp kikenbutsu-otsu4-sprint/questions.generated.json "$RESOURCE_DIR/questions.generated.json"
    scheme:
      testTargets: []
