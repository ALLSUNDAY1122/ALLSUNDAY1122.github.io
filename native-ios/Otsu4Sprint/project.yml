name: Otsu4Sprint
options:
  deploymentTarget:
    iOS: '17.0'
  bundleIdPrefix: jp.allsunday1122.otsu4
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '95'
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: MN3D2ZM44N
targets:
  Otsu4Sprint:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - '*.swift'
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/questions.generated.json
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 危険物乙4
        CFBundleShortVersionString: '1.0.0'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.otsu4
        PRODUCT_NAME: Otsu4Sprint
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '95'
        DEVELOPMENT_TEAM: MN3D2ZM44N
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - Otsu4SprintTests
        - Otsu4SprintUITests
      gatherCoverageData: true
      coverageTargets:
        - Otsu4Sprint

  Otsu4SprintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Otsu4Sprint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  Otsu4SprintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Otsu4Sprint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
