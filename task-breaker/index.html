<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>タスク分解くん</title>
<style>
:root{--p:#6750a4;--p2:#ede4ff;--bg:#f8f5fa;--card:#fff;--text:#211d25;--muted:#706979;--line:#ddd5e2;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;background:#eee9f1;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:84px}header{position:sticky;top:0;z-index:5;padding:15px 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:21px;margin:0}.screen{display:none;padding:16px}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(55,40,70,.05)}.hero{padding:22px}.eyebrow{font-size:12px;font-weight:800;color:var(--p);letter-spacing:.08em}.hero h2{font-size:29px;line-height:1.25;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.bigstep{font-size:22px;font-weight:800;line-height:1.45;margin:14px 0}.progress{height:9px;background:#eee7f1;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--p);transition:width .25s}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.primary,.secondary{width:100%;border-radius:999px;padding:14px;font-weight:800}.primary{border:0;background:var(--p);color:#fff}.secondary{border:1px solid var(--p);background:#fff;color:var(--p)}.small{border:0;border-radius:999px;background:var(--p2);color:var(--p);padding:9px 12px;font-weight:800}.icon{width:40px;height:40px;border:0;border-radius:50%;background:var(--p2);color:var(--p);font-weight:900}.danger{border:0;background:transparent;color:var(--danger);font-weight:800;padding:10px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:7px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;color:var(--text)}textarea{min-height:100px;resize:vertical}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.chip.active{background:var(--p);border-color:var(--p);color:#fff}.step{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee8f0}.step:first-child{border-top:0}.check{width:32px;height:32px;flex:none;border:2px solid var(--p);border-radius:50%;background:#fff;color:#fff;font-weight:900}.check.done{background:var(--p)}.doneText{text-decoration:line-through;color:var(--muted)}.tabs{position:fixed;bottom:0;width:min(100%,520px);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.tabs button{border:0;background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-weight:800}.tabs button.active{background:var(--p2);color:var(--p)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.43);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheethead h2{margin:0}.empty{text-align:center;color:var(--muted);padding:40px 10px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#27222a;color:#fff;padding:10px 15px;border-radius:999px;display:none;z-index:60;white-space:nowrap}.onboard{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#f8f5ff,#fff);display:none;align-items:center;justify-content:center;padding:24px}.onboard.show{display:flex}.oncard{max-width:430px;width:100%;text-align:center}.onicon{font-size:64px}.oncard h2{font-size:30px}.onDots{display:flex;justify-content:center;gap:8px;margin:18px}.dot{width:8px;height:8px;border-radius:50%;background:#d4cadc}.dot.active{background:var(--p);width:22px;border-radius:99px}.notice{background:#fff4ce;border:1px solid #eed98b;padding:11px;border-radius:12px;color:#5d4b00;display:none}.notice.show{display:block}@media(max-width:520px){body{background:var(--bg)}}
</style>
</head>
<body>
<div id="onboard" class="onboard"><div class="oncard"><div id="onIcon" class="onicon">🧩</div><h2 id="onTitle"></h2><p id="onText" class="muted"></p><div id="onDots" class="onDots"></div><button id="onNext" class="primary" type="button">次へ</button></div></div>
<div class="app"><header><h1>タスク分解くん</h1></header>
<section id="home" class="screen active"><div id="homeContent"></div></section>
<section id="history" class="screen"><div id="historyContent"></div></section>
<section id="settings" class="screen"><div class="card"><strong>動作診断</strong><p id="diag" class="muted">JavaScriptを確認中…</p><button id="testBtn" class="secondary" type="button">ボタン動作テスト</button></div><div class="card"><strong>データ保存</strong><p class="muted">入力内容はこのブラウザ内だけに保存されます。通信やログインはありません。</p><button id="resetBtn" class="secondary" type="button">すべて初期化</button></div><div class="card"><strong>バージョン</strong><p class="muted">Safari価値検証版 1.0.0</p></div></section>
<nav class="tabs"><button class="active" data-screen="home" type="button">ホーム</button><button data-screen="history" type="button">履歴</button><button data-screen="settings" type="button">設定</button></nav></div>
<div id="createModal" class="modal"><div class="sheet"><div class="sheethead"><h2>タスクを分解</h2><button class="icon" data-close="createModal" type="button">×</button></div><div class="field"><label for="taskInput">大きなタスク</label><textarea id="taskInput" maxlength="200" placeholder="例：資格試験の勉強を始める"></textarea></div><div class="field"><label>分解の細かさ</label><div class="chips"><button class="chip" data-count="3" type="button">かんたん 3</button><button class="chip active" data-count="5" type="button">標準 5</button><button class="chip" data-count="7" type="button">細かく 7</button></div></div><div id="createNotice" class="notice"></div><button id="splitBtn" class="primary" type="button">小さな行動に分解する</button></div></div>
<div id="previewModal" class="modal"><div class="sheet"><div class="sheethead"><div><h2>分解結果</h2><span id="previewCategory" class="muted"></span></div><button class="icon" data-close="previewModal" type="button">×</button></div><div id="previewSteps" class="card"></div><button id="addStepBtn" class="secondary" type="button">ステップを追加</button><div style="height:10px"></div><button id="saveTaskBtn" class="primary" type="button">この内容で始める</button></div></div>
<div id="detailModal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="detailTitle"></h2><button class="icon" data-close="detailModal" type="button">×</button></div><div id="detailBody"></div></div></div>
<div id="completeModal" class="modal"><div class="sheet" style="text-align:center"><div style="font-size:64px">🎉</div><h2>タスク完了</h2><p id="completeText" class="muted"></p><button class="primary" data-close="completeModal" type="button">履歴を見る</button></div></div>
<div id="toast" class="toast"></div>
<script>
(function(){'use strict';
var KEY='task_breaker_safari_v1',state={tasks:[],activeId:null,onboarded:false},draft={title:'',category:'',steps:[],count:5},onIndex=0;
var onboarding=[['🧩','大きなタスクを入力','何から始めるか分からない状態を、小さな行動に変えます。'],['✂️','3〜7個へ分解','通信なしで、すぐ実行できる手順を作ります。'],['👣','次の一歩だけ進める','今やることを1件だけ大きく表示します。']];
function el(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function toast(t){var x=el('toast');x.textContent=t;x.style.display='block';setTimeout(function(){x.style.display='none'},1500)}
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.tasks))state=p}}catch(e){}render();if(!state.onboarded)showOnboard();el('diag').textContent='正常：JavaScriptを読み込みました'}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}
function cat(t){if(/勉強|試験|資格|学習|宿題/.test(t))return'学習';if(/片付|掃除|整理/.test(t))return'片付け';if(/資料|報告|文章|レポート|書類/.test(t))return'書類作成';if(/申請|手続|予約|提出/.test(t))return'手続き';if(/買う|購入|買い物/.test(t))return'買い物';if(/旅行|外出|持ち物|準備/.test(t))return'外出準備';if(/連絡|返信|メール|電話|相談/.test(t))return'連絡';if(/調べ|比較|リサーチ/.test(t))return'調査';if(/作る|制作|開発|執筆/.test(t))return'制作';return'一般'}
function templates(c){var m={学習:['教材を1つ出す','試験日と範囲を確認する','最初の学習範囲を決める','15分だけ取り組む','終わった位置を記録する','間違えた点を1つ確認する','次回の開始位置を決める'],片付け:['片付ける場所を1か所決める','ごみ袋を用意する','不要な物を5個選ぶ','残す物を種類で分ける','物を元の場所へ戻す','床や机を拭く','完了した場所を確認する'],書類作成:['完成形を1文で決める','必要資料を集める','見出しを3つ作る','本文を埋める','数字と固有名詞を確認する','誤字を直す','保存先を確認する'],手続き:['締切と提出先を確認する','必要書類を一覧にする','手元の書類を集める','不足書類を用意する','入力欄を埋める','内容を確認する','提出して控えを保存する'],買い物:['必要条件を3つ決める','予算上限を決める','候補を3つ探す','候補を比較する','購入先を決める','注文内容を確認する','購入記録を残す'],外出準備:['日時と行き先を確認する','必要な持ち物を書き出す','重要な物を先に用意する','服装を決める','移動経路を確認する','残りの物を入れる','出発前に確認する'],連絡:['伝える目的を1文にする','必要な事実を3つ書く','最初の一文を作る','本文を短くまとめる','宛先を確認する','送信する','返信待ちを記録する'],調査:['知りたいことを1文にする','比較条件を3つ決める','情報源を探す','候補を比較する','重要点を記録する','結論を1文にする','次の行動を決める'],制作:['完成形を1文で決める','必要素材を集める','最小構成を作る','主要部分を作る','一度動かす','問題を1つ直す','完成版を保存する'],一般:['完了状態を1文で決める','必要な情報や物を集める','最初の作業を1つ選ぶ','10分だけ作業する','残りを小さく分ける','終わった位置を記録する','次の行動を決める']};return m[c]||m.一般}
function makeSteps(c,n){return templates(c).slice(0,n).map(function(x){return{id:uid(),title:x,done:false}})}function active(){return state.tasks.find(function(t){return t.id===state.activeId&&!t.completed})||state.tasks.find(function(t){return!t.completed})||null}function prog(t){var d=t.steps.filter(function(s){return s.done}).length;return{d:d,n:t.steps.length,p:t.steps.length?Math.round(d/t.steps.length*100):0}}
function render(){var a=active();if(a)state.activeId=a.id;el('homeContent').innerHTML=a?homeTask(a):'<div class="card hero"><div class="eyebrow">最初の30秒</div><h2>大きなタスクを<br>次の一歩に変える</h2><p class="muted">入力するだけで、今すぐ着手できる3〜7個の行動に分解します。</p><button class="primary" data-create type="button">最初のタスクを作る</button></div>';var done=state.tasks.filter(function(t){return t.completed});el('historyContent').innerHTML=done.length?done.map(taskCard).join(''):'<div class="empty">完了したタスクはありません。</div>'}
function homeTask(t){var p=prog(t),next=t.steps.find(function(s){return!s.done});return'<div class="card hero"><div class="row"><div class="grow"><div class="eyebrow">次の一歩</div><h2>'+esc(t.title)+'</h2></div><button class="small" data-open="'+t.id+'" type="button">全て見る</button></div><div class="bigstep">'+esc(next?next.title:'完了')+'</div><div class="progress"><span style="width:'+p.p+'%"></span></div><p class="muted">'+p.d+' / '+p.n+' 完了</p>'+(next?'<button class="primary" data-nextdone="'+t.id+'" type="button">できた</button>':'')+'</div><button class="secondary" data-create type="button">新しいタスクを追加</button><h3>進行中</h3>'+state.tasks.filter(function(x){return!x.completed}).map(taskCard).join('')}
function taskCard(t){var p=prog(t);return'<div class="card"><div class="row"><div class="grow"><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.category)+'・'+p.d+'/'+p.n+'</div></div><button class="small" data-open="'+t.id+'" type="button">開く</button></div><div class="progress"><span style="width:'+p.p+'%"></span></div></div>'}
function openModal(id){el(id).classList.add('show')}function closeModal(id){el(id).classList.remove('show')}function switchScreen(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.toggle('active',x.id===id)});document.querySelectorAll('[data-screen]').forEach(function(x){x.classList.toggle('active',x.dataset.screen===id)})}
function startCreate(){draft={title:'',category:'',steps:[],count:5};el('taskInput').value='';el('createNotice').className='notice';document.querySelectorAll('[data-count]').forEach(function(x){x.classList.toggle('active',x.dataset.count==='5')});openModal('createModal')}
function split(){var t=el('taskInput').value.trim().replace(/\s+/g,' '),n=el('createNotice');if(!t){n.textContent='タスクを入力してください。';n.className='notice show';return}draft.title=t;draft.category=cat(t);draft.steps=makeSteps(draft.category,draft.count);n.className='notice';renderPreview();closeModal('createModal');openModal('previewModal')}
function renderPreview(){el('previewCategory').textContent='推定カテゴリ：'+draft.category;el('previewSteps').innerHTML=draft.steps.map(function(s,i){return'<div class="step"><div class="grow"><input data-editstep="'+s.id+'" value="'+esc(s.title)+'"></div><button class="icon" data-up="'+s.id+'" type="button">↑</button><button class="icon" data-down="'+s.id+'" type="button">↓</button><button class="danger" data-delstep="'+s.id+'" type="button">削除</button></div>'}).join('')}
function saveTask(){draft.steps.forEach(function(s){var i=document.querySelector('[data-editstep="'+s.id+'"]');if(i)s.title=i.value.trim()});draft.steps=draft.steps.filter(function(s){return s.title});if(!draft.steps.length){toast('ステップがありません');return}var t={id:uid(),title:draft.title,category:draft.category,steps:draft.steps,completed:false,updatedAt:Date.now()};state.tasks.unshift(t);state.activeId=t.id;save();closeModal('previewModal');toast('保存しました')}
function openDetail(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;el('detailTitle').textContent=t.title;el('detailBody').innerHTML='<div class="card">'+t.steps.map(function(s){return'<div class="step"><button class="check '+(s.done?'done':'')+'" data-toggle="'+t.id+'|'+s.id+'" type="button">'+(s.done?'✓':'')+'</button><div class="grow '+(s.done?'doneText':'')+'">'+esc(s.title)+'</div></div>'}).join('')+'</div>'+(t.completed?'<button class="secondary" data-reopen="'+t.id+'" type="button">進行中に戻す</button><div style="height:8px"></div>':'')+'<button class="danger" data-delete="'+t.id+'" type="button">このタスクを削除</button>';openModal('detailModal')}
function toggle(tid,sid){var t=state.tasks.find(function(x){return x.id===tid}),s=t&&t.steps.find(function(x){return x.id===sid});if(!s)return;s.done=!s.done;t.updatedAt=Date.now();t.completed=t.steps.every(function(x){return x.done});save();if(t.completed){closeModal('detailModal');el('completeText').textContent=t.title+'・'+t.steps.length+'ステップ完了';openModal('completeModal')}else openDetail(tid)}function doneNext(id){var t=state.tasks.find(function(x){return x.id===id}),s=t&&t.steps.find(function(x){return!x.done});if(s)toggle(id,s.id)}
function showOnboard(){onIndex=0;el('onboard').classList.add('show');renderOn()}function renderOn(){var o=onboarding[onIndex];el('onIcon').textContent=o[0];el('onTitle').textContent=o[1];el('onText').textContent=o[2];el('onNext').textContent=onIndex===onboarding.length-1?'始める':'次へ';el('onDots').innerHTML=onboarding.map(function(_,i){return'<span class="dot '+(i===onIndex?'active':'')+'"></span>'}).join('')}
function bind(){el('onNext').addEventListener('click',function(){if(onIndex<onboarding.length-1){onIndex++;renderOn()}else{state.onboarded=true;save();el('onboard').classList.remove('show')}});el('splitBtn').addEventListener('click',split);el('saveTaskBtn').addEventListener('click',saveTask);el('addStepBtn').addEventListener('click',function(){draft.steps.push({id:uid(),title:'新しいステップ',done:false});renderPreview()});el('testBtn').addEventListener('click',function(){el('diag').textContent='正常：タップイベントが動作しました';toast('動作テスト成功')});el('resetBtn').addEventListener('click',function(){if(confirm('すべて初期化しますか？')){state={tasks:[],activeId:null,onboarded:false};try{localStorage.removeItem(KEY)}catch(e){}render();showOnboard()}});document.addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;if(x.dataset.screen)switchScreen(x.dataset.screen);else if(x.hasAttribute('data-create'))startCreate();else if(x.dataset.close){closeModal(x.dataset.close);if(x.dataset.close==='completeModal')switchScreen('history')}else if(x.dataset.count){draft.count=Number(x.dataset.count);document.querySelectorAll('[data-count]').forEach(function(b){b.classList.toggle('active',b===x)})}else if(x.dataset.open)openDetail(x.dataset.open);else if(x.dataset.nextdone)doneNext(x.dataset.nextdone);else if(x.dataset.toggle){var q=x.dataset.toggle.split('|');toggle(q[0],q[1])}else if(x.dataset.delstep){draft.steps=draft.steps.filter(function(s){return s.id!==x.dataset.delstep});renderPreview()}else if(x.dataset.up||x.dataset.down){var id=x.dataset.up||x.dataset.down,i=draft.steps.findIndex(function(s){return s.id===id}),j=x.dataset.up?i-1:i+1;if(j>=0&&j<draft.steps.length){var z=draft.steps[i];draft.steps[i]=draft.steps[j];draft.steps[j]=z;renderPreview()}}else if(x.dataset.delete){if(confirm('このタスクを削除しますか？')){state.tasks=state.tasks.filter(function(t){return t.id!==x.dataset.delete});save();closeModal('detailModal')}}else if(x.dataset.reopen){var t=state.tasks.find(function(t){return t.id===x.dataset.reopen});if(t){t.completed=false;state.activeId=t.id;save();closeModal('detailModal');switchScreen('home')}}})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){bind();load()});else{bind();load()}
})();
</script>
</body>
</html>
