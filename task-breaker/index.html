<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>タスク分解くん</title>
<style>
:root{--p:#6750a4;--p2:#ede4ff;--bg:#f8f5fa;--card:#fff;--text:#211d25;--muted:#706979;--line:#ddd5e2;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;background:#eee9f1;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:84px}header{position:sticky;top:0;z-index:5;padding:15px 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:21px;margin:0}.screen{display:none;padding:16px}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(55,40,70,.05)}.hero{padding:22px}.eyebrow{font-size:12px;font-weight:800;color:var(--p);letter-spacing:.08em}.hero h2{font-size:29px;line-height:1.25;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.bigstep{font-size:22px;font-weight:800;line-height:1.45;margin:14px 0}.progress{height:9px;background:#eee7f1;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--p);transition:width .25s}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.primary,.secondary{width:100%;border-radius:999px;padding:14px;font-weight:800}.primary{border:0;background:var(--p);color:#fff}.secondary{border:1px solid var(--p);background:#fff;color:var(--p)}.small{border:0;border-radius:999px;background:var(--p2);color:var(--p);padding:9px 12px;font-weight:800}.icon{width:40px;height:40px;border:0;border-radius:50%;background:var(--p2);color:var(--p);font-weight:900}.danger{border:0;background:transparent;color:var(--danger);font-weight:800;padding:10px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:7px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;color:var(--text)}textarea{min-height:100px;resize:vertical}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.chip.active{background:var(--p);border-color:var(--p);color:#fff}.step{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee8f0}.step:first-child{border-top:0}.check{width:32px;height:32px;flex:none;border:2px solid var(--p);border-radius:50%;background:#fff;color:#fff;font-weight:900}.check.done{background:var(--p)}.doneText{text-decoration:line-through;color:var(--muted)}.tabs{position:fixed;bottom:0;width:min(100%,520px);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.tabs button{border:0;background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-weight:800}.tabs button.active{background:var(--p2);color:var(--p)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.43);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheethead h2{margin:0}.empty{text-align:center;color:var(--muted);padding:40px 10px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#27222a;color:#fff;padding:10px 15px;border-radius:999px;display:none;z-index:60;white-space:nowrap}.onboard{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#f8f5ff,#fff);display:none;align-items:center;justify-content:center;padding:24px}.onboard.show{display:flex}.oncard{max-width:430px;width:100%;text-align:center}.onicon{font-size:64px}.oncard h2{font-size:30px}.onDots{display:flex;justify-content:center;gap:8px;margin:18px}.dot{width:8px;height:8px;border-radius:50%;background:#d4cadc}.dot.active{background:var(--p);width:22px;border-radius:99px}.notice{background:#fff4ce;border:1px solid #eed98b;padding:11px;border-radius:12px;color:#5d4b00;display:none}.notice.show{display:block}@media(max-width:520px){body{background:var(--bg)}}
</style>
</head>
<body>
<div id="onboarding" class="onboard"><div class="oncard"><div id="onboardingIcon" class="onicon">🧩</div><h2 id="onboardingTitle"></h2><p id="onboardingText" class="muted"></p><div id="onboardingDots" class="onDots"></div><button id="onboardingNext" class="primary" type="button">次へ</button><button id="onboardingSkip" class="secondary" type="button" style="margin-top:10px">スキップ</button></div></div>
<div class="app"><header><div class="row"><h1 id="headerTitle" class="grow">タスク分解くん</h1><button id="headerAdd" class="small" type="button">＋追加</button></div></header>
<section id="homeScreen" class="screen active"><div id="homeContent"></div></section>
<section id="historyScreen" class="screen"><div id="historyContent"></div></section>
<section id="settingsScreen" class="screen"><div class="card"><strong>動作診断</strong><p id="diagnosticText" class="muted">JavaScriptを確認中…</p><button id="diagnosticBtn" class="secondary" type="button">ボタン動作テスト</button></div><div class="card"><strong>使い方</strong><p class="muted">内容が短いほど、分解結果は一般的になります。行き先・手段・完了状態を少し加えると精度が上がります。</p><button id="replayOnboarding" class="secondary" type="button">使い方をもう一度見る</button></div><div class="card"><strong>データ保存</strong><p class="muted">入力内容はこのブラウザ内だけに保存されます。</p><button id="resetBtn" class="secondary" type="button">すべて初期化</button></div><div class="card"><strong>バージョン</strong><p class="muted">Safari価値検証版 1.1.0</p></div></section>
<nav class="tabs"><button class="active" data-nav="home" type="button">ホーム</button><button data-nav="history" type="button">履歴</button><button data-nav="settings" type="button">設定</button></nav></div>
<div id="createModal" class="modal" aria-hidden="true"><div class="sheet"><div class="sheethead"><h2>タスクを分解</h2><button class="icon" data-close="createModal" type="button">×</button></div><div class="field"><label for="taskInput">大きなタスク</label><textarea id="taskInput" maxlength="200" placeholder="例：実家に電車で帰る"></textarea></div><div class="field"><label>分解の細かさ</label><div class="chips"><button class="chip" data-level="3" type="button">かんたん 3</button><button class="chip active" data-level="5" type="button">標準 5</button><button class="chip" data-level="7" type="button">細かく 7</button></div></div><div id="createNotice" class="notice"></div><button id="generateBtn" class="primary" type="button">小さな行動に分解する</button><div id="previewArea" hidden><div style="height:18px"></div><div class="row"><h2 class="grow">分解結果</h2><span id="previewCategory" class="muted"></span></div><div id="previewList" class="card"></div><button id="addStepBtn" class="secondary" type="button">ステップを追加</button><button id="regenerateBtn" class="secondary" type="button" style="margin-top:10px">分解し直す</button><button id="saveTaskBtn" class="primary" type="button" style="margin-top:10px">この内容で始める</button></div></div></div>
<div id="detailModal" class="modal" aria-hidden="true"><div class="sheet"><div class="sheethead"><h2 id="detailTitle"></h2><button class="icon" data-close="detailModal" type="button">×</button></div><div id="detailBody"></div></div></div>
<div id="completionModal" class="modal" aria-hidden="true"><div class="sheet" style="text-align:center"><div style="font-size:64px">🎉</div><h2>タスク完了</h2><p id="completionText" class="muted"></p><button id="goHistoryBtn" class="primary" type="button">履歴を見る</button><button id="newTaskBtn" class="secondary" type="button" style="margin-top:10px">新しいタスクを作る</button></div></div>
<div id="toast" class="toast"></div>
<script>
(function(){'use strict';
var KEY='task_breaker_value_v1',ONBOARD='task_breaker_onboard_v1',memory={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return memory[k]||null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){memory[k]=v}}function storageRemove(k){try{localStorage.removeItem(k)}catch(e){delete memory[k]}}
var state={tasks:[],selectedTaskId:null},draft=[],draftCategory='',level=5,onboardIndex=0;
var templates={
'学習':['教材を1つ出す','試験日と範囲を確認する','最初の学習範囲を決める','15分だけ取り組む','終わった位置を記録する','間違えた点を1つ確認する','次回の開始位置を決める'],
'片付け・整理':['片付ける場所を1か所決める','ごみ袋を用意する','不要な物を5個選ぶ','残す物を種類で分ける','物を元の場所へ戻す','床や机を拭く','完了した場所を確認する'],
'書類作成':['完成形を1文で決める','必要資料を集める','見出しを3つ作る','本文を埋める','数字と固有名詞を確認する','誤字を直す','保存先を確認する'],
'申請・手続き':['締切と提出先を確認する','必要書類を一覧にする','手元の書類を集める','不足書類を用意する','入力欄を埋める','内容を確認する','提出して控えを保存する'],
'買い物':['必要条件を3つ決める','予算上限を決める','候補を3つ探す','候補を比較する','購入先を決める','注文内容を確認する','購入記録を残す'],
'外出・旅行準備':['日時と行き先を確認する','必要な持ち物を書き出す','重要な物を先に用意する','服装を決める','移動経路を確認する','残りの物を入れる','出発前に確認する'],
'移動・帰省':['帰る日時を決める','移動手段と経路を確認する','必要なら交通機関を予約する','持ち物をまとめる','出発前に戸締まりと忘れ物を確認する','到着予定を家族へ連絡する','帰宅後に使う物を準備する'],
'連絡・相談':['伝える目的を1文にする','必要な事実を3つ書く','最初の一文を作る','本文を短くまとめる','宛先を確認する','送信する','返信待ちを記録する'],
'調査・比較':['知りたいことを1文にする','比較条件を3つ決める','情報源を探す','候補を比較する','重要点を記録する','結論を1文にする','次の行動を決める'],
'制作・執筆':['完成形を1文で決める','必要な素材を集める','最小構成を作る','主要部分を1つ作る','全体をつなげる','実際に動かして確認する','修正点を反映して保存する'],
'健康・通院準備':['受付時間を確認する','保険証や診察券を用意する','症状と経過を短く記録する','服用中の薬を確認する','聞きたいことを一覧にする','移動方法を決める','受診後の指示を記録する'],
'一般タスク':['完了した状態を1文で決める','必要な情報や物を1か所に集める','最初に行う作業を1つ選ぶ','10分だけ作業する','終わった位置と次の行動を記録する','不足を1つ補う','完了条件を確認する']};
var onboardingPages=[['🧩','大きなタスクを入力','そのままでは始めにくいタスクを入力します。'],['🌱','小さな行動へ分解','通信せず、端末内で具体的な3〜7件へ分けます。'],['👣','次の一歩だけ進める','今やる1件を大きく表示し、迷いを減らします。']];
function el(id){return document.getElementById(id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(){try{storageSet(KEY,JSON.stringify(state))}catch(e){toast('保存に失敗しました')}render()}
function load(){try{var raw=storageGet(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.tasks))state=p}}catch(e){state={tasks:[],selectedTaskId:null}}render();if(storageGet(ONBOARD)!=='1')showOnboarding()}
function category(text){var rules=[['移動・帰省',/実家|帰省|帰る|帰宅|移動|訪問|里帰り/],['学習',/勉強|学習|試験|資格|宿題|復習|読む/],['片付け・整理',/片付|掃除|整理|断捨離|洗濯/],['書類作成',/資料|報告書|レポート|文章|企画書|書類/],['申請・手続き',/申請|手続|予約|更新|登録|提出|確定申告/],['買い物',/買う|購入|買い物|注文/],['外出・旅行準備',/旅行|外出|出張|引越|準備/],['連絡・相談',/連絡|返信|メール|電話|相談/],['調査・比較',/調べ|比較|リサーチ|検討/],['制作・執筆',/作る|制作|開発|執筆|デザイン|編集/],['健康・通院準備',/通院|病院|受診|健診|検診|診察/]];for(var i=0;i<rules.length;i++)if(rules[i][1].test(text))return rules[i][0];return '一般タスク'}
function normalize(text){return text.trim().replace(/\s+/g,' ')}function active(){return state.tasks.filter(function(t){return !t.completed})}function history(){return state.tasks.filter(function(t){return t.completed})}function prog(t){var d=t.steps.filter(function(s){return s.done}).length;return {done:d,total:t.steps.length,pct:t.steps.length?Math.round(d/t.steps.length*100):0}}
function selected(){var list=active();var found=list.find(function(t){return t.id===state.selectedTaskId});return found||list[0]||null}
function showModal(id){el(id).classList.add('show');el(id).setAttribute('aria-hidden','false')}function closeModal(id){el(id).classList.remove('show');el(id).setAttribute('aria-hidden','true')}
function toast(text){var t=el('toast');t.textContent=text;t.style.display='block';setTimeout(function(){t.style.display='none'},1500)}
function switchScreen(name){['home','history','settings'].forEach(function(n){el(n+'Screen').classList.toggle('active',n===name)});document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===name)});el('headerTitle').textContent=name==='home'?'タスク分解くん':name==='history'?'完了履歴':'設定';el('headerAdd').style.visibility=name==='home'?'visible':'hidden'}
function render(){var focus=selected();var list=active();if(!focus){el('homeContent').innerHTML='<div class="empty"><div class="onicon">🧩</div><h2>大きなタスクを分けましょう</h2><p>何から始めればよいか分からないタスクを、今できる行動へ変えます。</p><button id="emptyCreate" class="primary" type="button">最初のタスクを作る</button></div>'}else{var p=prog(focus);var next=focus.steps.find(function(s){return !s.done});el('homeContent').innerHTML='<div class="eyebrow">次の一歩</div><div class="card hero"><div class="muted">'+esc(focus.title)+'</div><div class="bigstep">'+esc(next?next.title:'すべて完了')+'</div><div class="progress"><span style="width:'+p.pct+'%"></span></div><div class="row muted"><span class="grow">'+p.done+'/'+p.total+' 完了</span><span>'+p.pct+'%</span></div>'+(next?'<button class="primary" data-complete-task="'+focus.id+'" data-complete-step="'+next.id+'" type="button" style="margin-top:14px">✓ できた</button>':'')+'<button class="secondary" data-open-task="'+focus.id+'" type="button" style="margin-top:10px">全ステップを見る</button></div>'+list.map(taskCard).join('')}var done=history();el('historyContent').innerHTML=done.length?done.map(taskCard).join(''):'<div class="empty"><div class="onicon">✓</div><h2>履歴はまだありません</h2><p>完了したタスクがここに表示されます。</p></div>'}
function taskCard(t){var p=prog(t);return '<div class="card row" data-open-task="'+t.id+'"><div class="grow"><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.category)+'・'+p.done+'/'+p.total+'完了</div><div class="progress"><span style="width:'+p.pct+'%"></span></div></div><button class="small" data-open-task="'+t.id+'" type="button">開く</button></div>'}
function openCreate(){el('taskInput').value='';level=5;draft=[];document.querySelectorAll('[data-level]').forEach(function(b){b.classList.toggle('active',Number(b.dataset.level)===5)});el('previewArea').hidden=true;el('createNotice').classList.remove('show');showModal('createModal');setTimeout(function(){el('taskInput').focus()},50)}
function generate(){var title=normalize(el('taskInput').value);if(!title){el('createNotice').textContent='タスクを入力してください。';el('createNotice').classList.add('show');return}draftCategory=category(title);if(draftCategory==='一般タスク'&&title.length<8){el('createNotice').textContent='内容が短いため、的外れになる可能性があります。例：「実家に電車で帰る」「会社へ提出する資料を作る」のように、行き先・手段・完了状態を少し加えてください。';el('createNotice').classList.add('show');return}el('createNotice').classList.remove('show');draft=templates[draftCategory].slice(0,level).map(function(x){return {id:uid(),title:x}});renderDraft()}
function renderDraft(){el('previewCategory').textContent='推定カテゴリ：'+draftCategory;el('previewList').innerHTML=draft.map(function(s,i){return '<div class="step"><span class="small">'+(i+1)+'</span><input maxlength="50" data-draft-input="'+i+'" value="'+esc(s.title)+'"><button class="icon" data-move-up="'+i+'" type="button">↑</button><button class="icon" data-move-down="'+i+'" type="button">↓</button><button class="danger" data-remove-step="'+i+'" type="button">削除</button></div>'}).join('');el('previewArea').hidden=false}
function syncDraft(){document.querySelectorAll('[data-draft-input]').forEach(function(i){var n=Number(i.dataset.draftInput);if(draft[n])draft[n].title=i.value})}
function saveTask(){syncDraft();var title=normalize(el('taskInput').value);var steps=draft.filter(function(s){return normalize(s.title)}).map(function(s){return {id:uid(),title:normalize(s.title),done:false}});if(!title||!steps.length){toast('入力内容を確認してください');return}var task={id:uid(),title:title,category:draftCategory,steps:steps,completed:false,createdAt:Date.now(),updatedAt:Date.now()};state.tasks.unshift(task);state.selectedTaskId=task.id;store();closeModal('createModal');toast('タスクを保存しました')}
function openTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;var p=prog(t);el('detailTitle').textContent=t.title;el('detailBody').innerHTML='<div class="row"><span class="small">'+esc(t.category)+'</span><span class="muted">'+p.done+'/'+p.total+' 完了</span></div><div class="progress"><span style="width:'+p.pct+'%"></span></div><div class="card" style="margin-top:15px">'+t.steps.map(function(s){return '<div class="step"><button class="check '+(s.done?'done':'')+'" data-toggle-task="'+t.id+'" data-toggle-step="'+s.id+'" type="button">'+(s.done?'✓':'')+'</button><div class="grow '+(s.done?'doneText':'')+'">'+esc(s.title)+'</div></div>'}).join('')+'</div>'+(t.completed?'<button class="secondary" data-reopen="'+t.id+'" type="button">進行中へ戻す</button>':'')+'<button class="danger" data-delete="'+t.id+'" type="button" style="width:100%;margin-top:8px">このタスクを削除</button>';showModal('detailModal')}
function toggle(taskId,stepId){var t=state.tasks.find(function(x){return x.id===taskId});if(!t)return;var s=t.steps.find(function(x){return x.id===stepId});if(!s)return;s.done=!s.done;t.updatedAt=Date.now();t.completed=t.steps.every(function(x){return x.done});state.selectedTaskId=t.id;store();if(t.completed){closeModal('detailModal');el('completionText').textContent='「'+t.title+'」の'+t.steps.length+'ステップを完了しました。';showModal('completionModal')}else if(el('detailModal').classList.contains('show'))openTask(t.id);else toast(s.done?'1ステップ完了':'完了を取り消しました')}
function removeTask(id){if(!confirm('このタスクを削除しますか？'))return;state.tasks=state.tasks.filter(function(t){return t.id!==id});if(state.selectedTaskId===id)state.selectedTaskId=null;store();closeModal('detailModal');toast('削除しました')}
function reopen(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.completed=false;t.updatedAt=Date.now();state.selectedTaskId=id;store();closeModal('detailModal');switchScreen('home');toast('進行中へ戻しました')}
function showOnboarding(){onboardIndex=0;renderOnboarding();el('onboarding').classList.add('show')}function renderOnboarding(){var p=onboardingPages[onboardIndex];el('onboardingIcon').textContent=p[0];el('onboardingTitle').textContent=p[1];el('onboardingText').textContent=p[2];el('onboardingDots').innerHTML=onboardingPages.map(function(_,i){return '<span class="dot '+(i===onboardIndex?'active':'')+'"></span>'}).join('');el('onboardingNext').textContent=onboardIndex===onboardingPages.length-1?'始める':'次へ'}function finishOnboarding(){storageSet(ONBOARD,'1');el('onboarding').classList.remove('show')}

f(b.dataset.moveUp!==undefined){syncDraft();var i=Number(b.dataset.moveUp);if(i>0){var x=draft[i-1];draft[i-1]=draft[i];draft[i]=x;renderDraft()}return}if(b.dataset.moveDown!==undefined){syncDraft();var j=Number(b.dataset.moveDown);if(j<draft.length-1){var y=draft[j+1];draft[j+1]=draft[j];draft[j]=y;renderDraft()}return}if(b.dataset.delete){removeTask(b.dataset.delete);return}if(b.dataset.reopen){reopen(b.dataset.reopen);return}});document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)closeModal(m.id)})});el('diagnosticText').textContent='正常：JavaScriptを読み込みました。'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){bind();load()});else{bind();load()}})();
