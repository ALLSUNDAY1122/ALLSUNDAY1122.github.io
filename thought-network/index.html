let catalog={},placements=0,branchRows=[];function addCat(label,path,type='leaf'){placements++;if(!catalog[label])catalog[label]={label,paths:[],parents:new Set(),tops:new Set(),type};let c=catalog[label];c.paths.push(path.join(' › '));if(path.length>1)c.parents.add(path[path.length-2]);if(path[0])c.tops.add(path[0]);if(type!=='leaf')c.type='branch'}

const DOMAIN=domainTree();function altTree(name){let root={label:'自分',children:[]},obj=ALT[name];for(const [group,str] of Object.entries(obj)){let g={label:group,children:[]};for(const x of str.split('|')){g.children.push({label:x,children:[]});if(!catalog[x])addCat(x,[name,group,x]);else catalog[x].paths.push(name+' › '+group+' › '+x)}root.children.push(g)}return root}

function nodeEl(n,depth,path){let li=document.createElement('li');li.className='depth'+depth;li.dataset.label=n.label;let has=n.children&&n.children.length,ct=has?desc(n):0,w=weight(n.label);let row=document.createElement('div');row.className='node';row.innerHTML=`<button class="toggle">${has?'▸':'·'}</button><span class="dot" style="background:${COLORS[(hash(path[0]||n.label)%COLORS.length)]}"></span><span class="label"></span>${has?`<span class="count">${ct}</span>`:''}<span class="weight">${w}</span><span class="bar"><i style="width:${w}%"></i></span>`;row.querySelector('.label').textContent=n.label;li.appendChild(row);if(has){let ul=document.createElement('ul');ul.className='children collapsed';for(const c of n.children)ul.appendChild(nodeEl(c,depth+1,[...path,n.label]));li.appendChild(ul);row.querySelector('.toggle').onclick=e=>{e.stopPropagation();ul.classList.toggle('collapsed');row.querySelector('.toggle').textContent=ul.classList.contains('collapsed')?'▸':'▾'}}row.onclick=()=>selectNode(n.label,row);return li}

function selectNode(label,row){selected=label;document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));if(row)row.classList.add('sel');showDetail(label);if(innerWidth<=840){mobilePanel.classList.remove('hidden');mobilePanel.innerHTML=detail.innerHTML;tabLinks.classList.add('active');tabTree.classList.remove('active')}}
function related(label){let out=[];for(const b of BR){if(b[0]===label)out.push([b[1],b[2]]);else if(b[1]===label)out.push([b[0],b[2]])}let c=catalog[label];if(c){for(const p of c.parents){for(const [x,v] of Object.entries(catalog)){if(x!==label&&v.parents.has(p)&&!out.some(a=>a[0]===x))out.push([x,'同じ枝「'+p+'」に属する近接概念。'])}}}return out.slice(0,8)}
function holeQuestions(label){let c=catalog[label],base=['この概念を何のために使うのか','何をもって正しい・成功と判定するのか','反対仮説・失敗ケースは何か','適用できない境界条件はどこか','根拠となる一次情報・観測値は何か','次に検証する最小実験は何か'];if(c&&[...c.tops].includes('プロジェクト群'))base=['最終目的は何か','利用者・受益者は誰か','入力と出力は何か','成功指標は何か','失敗・撤退条件は何か','人間が判断すべき箇所はどこか','次の最小実験は何か','運用・保守方法は決まっているか'];return base}
function showDetail(label){let c=catalog[label]||{paths:[],parents:new Set(),tops:new Set()},rels=related(label),qs=holeQuestions(label);detail.innerHTML=`<h2>${label}</h2><div class="sub">重みは重要度の初期推定。±でこの端末上の値を修正できます。</div><div class="weightCtl"><button id="wm">−</button><b>${weight(label)}</b><button id="wp">＋</button></div><div class="block"><h3>所属</h3>${(c.paths||[]).slice(0,8).map(p=>`<div class="path">${p}</div>`).join('')||'<div class="sub">未分類</div>'}</div><div class="block"><h3>横断接続</h3>${rels.length?rels.map(r=>`<div class="item"><div class="itemTop"><div class="itemName">${r[0]}</div><div class="score">${weight(r[0])}</div></div><div class="reason">${r[1]}</div></div>`).join(''):'<div class="sub">明示的な横断接続はまだありません。ここ自体が追加候補です。</div>'}</div><div class="block"><h3>穴診断用の問い</h3>${qs.map(x=>`<div class="qrow"><div class="qmark">?</div><div>${x}</div></div>`).join('')}</div><div class="notice">この診断は「欠陥の断定」ではなく、このノードにまだ紐付いていない情報スロットを探すための問いです。</div>`;wm.onclick=()=>changeW(label,-3);wp.onclick=()=>changeW(label,3)}function changeW(l,d){overrides[l]=Math.max(0,Math.min(100,weight(l)+d));localStorage.setItem('pttWeights',JSON.stringify(overrides));render();showDetail(l)}
function doSearch(){let s=q.value.trim().toLowerCase();if(!s)return;let hits=Object.keys(catalog).filter(x=>x.toLowerCase().includes(s)).sort((a,b)=>weight(b)-weight(a)).slice(0,30);searchResults.innerHTML=hits.map(x=>`<div class="result" data-label="${x.replace(/"/g,'&quot;')}"><b>${x}</b><div>重み ${weight(x)} / ${(catalog[x].paths[0]||'').replaceAll('›','→')}</div></div>`).join('')||'<div class="result">該当なし</div>';searchResults.querySelectorAll('.result[data-label]').forEach(e=>e.onclick=()=>focusLabel(e.dataset.label))}
function focusLabel(l){current='領域から見る';view.value=current;render();let target=[...document.querySelectorAll('li[data-label]')].find(x=>x.dataset.label===l);if(!target)return;let p=target.parentElement;while(p&&p!==tree){if(p.classList.contains('children')){p.classList.remove('collapsed');let r=p.previousElementSibling;if(r?.classList.contains('node'))r.querySelector('.toggle').textContent='▾'}p=p.parentElement}target.scrollIntoView({behavior:'smooth',block:'center'});selectNode(l,target.firstElementChild)}

function showSer(){let list=BR.slice().sort((a,b)=>(weight(b[0])+weight(b[1]))-(weight(a[0])+weight(a[1]))).slice(0,20);let h='<h2>セレンディピティ候補</h2><div class="sub">樹形図上では離れているが、問題構造を共有する組み合わせ。</div>'+list.map(x=>`<div class="item"><div class="itemTop"><div class="itemName">${x[0]} × ${x[1]}</div><div class="score">${Math.round((weight(x[0])+weight(x[1]))/2)}</div></div><div class="reason">${x[2]}</div></div>`).join('');panel(h,'links')}
