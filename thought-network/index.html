function genericLinks(name){const all=["思考整理","検証","自動化","自己理解","期待値","反対役AI","セレンディピティ","構造化"];return all.filter(x=>x!==name).slice(0,3).map((x,i)=>[x,.55-i*.07,"このノードにはまだ明示的な横断接続が少ない。仮説候補として提示。"])}
function genericHoles(){return [["目的",70],["前提",58],["反証",45],["評価指標",55],["停止条件",40],["他領域接続",50]]}
function showDetail(name){const links=LINKS[name]||genericLinks(name),holes=HOLES[name]||genericHoles(),ins=INSIGHTS[name]||"このテーマは、親子関係だけでなく『何の判断を変えるための情報か』を明示すると枝を増やしすぎずに済む。";$("detail").innerHTML=`<h2>${esc(name)}</h2><div class="sub">選択中のテーマ。樹形図では所属だけを示し、横断関係と欠落はここに分離します。</div><div class="block"><h3>横断接続</h3>${links.map(x=>`<div class="linkItem"><div class="linkTop"><span class="linkName">${esc(x[0])}</span><span class="score">${x[1].toFixed(2)}</span></div><div class="reason">${esc(x[2])}</div></div>`).join("")}</div><div class="block"><h3>穴診断</h3>${holes.map(x=>statusHTML(x[0],x[1])).join("")}</div><div class="block"><h3>AI仮説</h3><div class="insight">${esc(ins)}</div></div>`}
function statusHTML(k,v){const cls=v>=75?"ok":v>=55?"warn":"bad",label=v>=75?"十分":v>=55?"要確認":"穴候補",col=v>=75?"#3fb950":v>=55?"#d29922":"#f85149";return `<div class="status"><span>${esc(k)}</span><span class="meter"><i style="width:${v}%;background:${col}"></i></span><span class="${cls}">${label}</span></div>`}
function expandAll(all){document.querySelectorAll(".children").forEach((u,i)=>{const rootChild=u.parentElement.parentElement&&u.parentElement.parentElement.id==="tree";u.classList.toggle("collapsed",!all&&!rootChild);const b=u.parentElement.querySelector(":scope>.node>.toggle");if(b)b.textContent=u.classList.contains("collapsed")?"▸":"▾"})}
function findPaths(o,q,path=[],out=[]){const p=[...path,o.n];if(o.n.toLowerCase().includes(q))out.push(p);(o.c||[]).forEach(c=>findPaths(c,q,p,out));return out}
function search(){const q=$("q").value.trim().toLowerCase();const box=$("searchResults");box.innerHTML="";if(!q)return;let hits=findPaths(TREES[currentView],q);if(!hits.length){for(const [vn,tr] of Object.entries(TREES)){if(vn===currentView)continue;hits.push(...findPaths(tr,q).map(p=>["["+vn+"]",...p]))}}if(!hits.length){box.innerHTML='<div class="empty">該当なし</div>';return}hits.slice(0,10).forEach(p=>{const name=p[p.length-1],r=document.createElement("div");r.className="result";r.innerHTML=`<b>${esc(name)}</b><div>${esc(p.join(" › "))}</div>`;r.onclick=()=>{if(p[0]&&p[0].startsWith("[")){const vn=p[0].slice(1,-1);$("view").value=vn;currentView=vn;renderTree(TREES[vn])}expandAll(true);setTimeout(()=>{const el=[...document.querySelectorAll(".node")].find(x=>x.dataset.name===name);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.click()}},30)};box.appendChild(r)})}
function showSerendipity(){const pool=Object.entries(LINKS).flatMap(([a,ls])=>ls.map(x=>[a,...x])).sort((a,b)=>b[2]-a[2]).slice(0,12);const html=`<h2>横断接続</h2><div class="sub">樹形図では隠している、分野をまたぐ関係だけを表示。</div><div class="block">${pool.map(x=>`<div class="linkItem"><div class="linkTop"><span class="linkName">${esc(x[0])} × ${esc(x[1])}</span><span class="score">${x[2].toFixed(2)}</span></div><div class="reason">${esc(x[3])}</div></div>`).join("")}</div>`;showPanel(html,"links")}
function showHoles(){const pool=Object.entries(HOLES).map(([n,hs])=>{const low=[...hs].sort((a,b)=>a[1]-b[1])[0];return[n,low[0],low[1]]}).sort((a,b)=>a[2]-b[2]);const html=`<h2>穴診断</h2><div class="sub">『線が少ない』ではなく、各テーマで未検討になりやすい観点を表示。</div><div class="block">${pool.map(x=>`<div class="holeItem"><div class="linkTop"><span class="linkName">${esc(x[0])}</span><span class="score bad">${x[2]}</span></div><div class="reason">最も弱い観点：${esc(x[1])}</div></div>`).join("")}</div>`;showPanel(html,"holes")}
function showPanel(html,tab){if(innerWidth<=820){$("mobilePanel").innerHTML=html;$("mobilePanel").classList.remove("hidden");$("tree").closest(".treecard").classList.add("hidden");$("tabTree").classList.toggle("active",tab==="tree");$("tabLinks").classList.toggle("active",tab==="links");$("tabHoles").classList.toggle("active",tab==="holes")}else{$("detail").innerHTML=html}}
function showMobile(tab){if(tab==="tree"){$("mobilePanel").classList.add("hidden");$("tree").closest(".treecard").classList.remove("hidden");$("tabTree").classList.add("active");$("tabLinks").classList.remove("active");$("tabHoles").classList.remove("active");return}if(tab==="links"){const links=LINKS[selected]||genericLinks(selected);showPanel(`<h2>${esc(selected)}</h2><div class="sub">横断接続</div>${links.map(x=>`<div class="linkItem"><div class="linkTop"><span class="linkName">${esc(x[0])}</span><span class="score">${x[1].toFixed(2)}</span></div><div class="reason">${esc(x[2])}</div></div>`).join("")}`,"links")}else{const holes=HOLES[selected]||genericHoles();showPanel(`<h2>${esc(selected)}</h2><div class="sub">穴診断</div>${holes.map(x=>statusHTML(x[0],x[1])).join("")}<div class="block"><div class="insight">${esc(INSIGHTS[selected]||"このテーマで何が未検討かを明示してから枝を増やす。")}</div></div>`,"holes")}}
Object.keys(TREES).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;$("view").appendChild(o)});$("view").onchange=()=>{currentView=$("view").value;selected="自分";$("searchResults").innerHTML="";renderTree(TREES[currentView]);showDetail("自分")};$("expand").onclick=()=>expandAll(true);$("collapse").onclick=()=>expandAll(false);$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};$("ser").onclick=showSerendipity;$("holes").onclick=showHoles;$("tabTree").onclick=()=>showMobile("tree");$("tabLinks").onclick=()=>showMobile("links");$("tabHoles").onclick=()=>showMobile("holes");
renderTree(TREES[currentView]);showDetail("自分");setTimeout(()=>expandAll(false),0);
</script>
</body>
</html>
