</style></head><body><div id="app"><header><div class="head"><div class="title">Thought Discovery</div><div class="search"><input id="q" placeholder="考え・プロジェクトを検索"><button id="go">検索</button></div></div><div class="nav"><a href="./">樹形図</a><a href="./frequency.html">頻度</a><button id="discover" class="on">発見</button><button id="all">全体</button><button id="cross">橋</button><button id="gaps">穴</button><button id="patterns">仮説</button><button id="local">近傍</button><button id="labels">ラベル</button><select id="depth"><option value="1">1-hop</option><option value="2" selected>2-hop</option><option value="3">3-hop</option></select></div></header><main class="stage" id="stage"><canvas id="c"></canvas><div id="loading" class="loading">思考地図を再構成中…</div><div id="status"></div><div class="zoom"><button id="zp">＋</button><button id="zm">−</button><button id="zr">◎</button></div><div class="legend"><span class="dot" style="background:#bd93f9"></span>領域 <span class="dot" style="background:#62d394"></span>枝 <span class="dot" style="background:#e4bd59"></span>横断 <span class="dot" style="background:#ff7474"></span>穴候補</div><section id="discoveryCard" class="discovery"><div class="eyebrow">DISCOVERY</div><div id="dTitle" class="discoverTitle">読み込み中</div><div id="dReason" class="discoverReason"></div><div class="actions"><button id="dFocus">この接続を見る</button><button id="dNext">次の発見</button><button id="dWhy">なぜ重要？</button></div></section><section id="panel" class="inspector"><button id="close" class="close">×</button><h2 id="pt"></h2><div id="pb"></div></section><section id="drawer" class="drawer"><button id="drawerClose" class="close">×</button><h2 id="drawerTitle"></h2><div id="drawerBody"></div></section></main></div><script>
const COLORS=['#69b2ff','#62d394','#e4bd59','#ff7474','#bd93f9','#64d7df','#ff9bce','#9ea7ff','#e5c07b','#7ee787','#ffa657','#c9d1d9'];
const EXTRA=[['競馬AI','個別株','不確実性下で期待値を推定し、後から検証する構造が共通。'],['競馬AI','法人提案','複数案の比較・期待成果・下振れ管理という構造が共通。'],['Scaniverse同等化','知識グラフ','空間を点と関係から復元する発想を、思考空間の復元へ転用できる。'],['3D','樹形図','平面的な階層に視点軸や時間軸を加える発想源。'],['ホラー','ループエンジニアリング','伏線→検証→回収を長期プロジェクトのチェックポイント設計へ転用できる。'],['営業教育','AI家庭教師','個別弱点に合わせ説明粒度を変える構造が共通。'],['自治体比較','法人保険比較','多条件制度を同じ評価軸へ正規化する技法が共通。'],['投資原則','アプリ開発','小さく賭ける・損失上限・検証・撤退条件という実験設計が共通。'],['自己理解','アクセス解析','感覚ではなく行動ログから興味変化を推定する発想。'],['TestFlight','仮説','実機テストを「仮説を潰す実験」として扱える。'],['反対役AI','法人提案','顧客が断る理由を先に生成し、提案の穴を潰せる。'],['反対役AI','投資','強気仮説に対するベアケース生成器として使える。'],['Notion','GitHub','知識状態と実装状態を相互参照し、情報と成果物の乖離を減らせる。'],['セレンディピティ','弱い結合','少し遠い関連を探索対象にする中心概念。'],['未完了','サンクコスト','継続価値ではなく残存価値でプロジェクトを再評価する。'],['熱中','新規性','新規性の減衰と熱量変化を時系列で測ると、飽きの予測材料になる。'],['自律ループ','人間承認','完全自動化より、人間がどこだけ決めるかの設計が重要。'],['MVP','撤退条件','作る条件だけでなく、捨てる条件を最初に決める。'],['200社研究','監査AI','大量調査では分析AIより誤りを探すAIの限界効用が高くなりやすい。'],['マインドマップ','知識グラフ','表示は木、内部は多重所属という外部脳設計に直結する。']];
const LATENT=[{label:'仮説: 構造化→自動化→検証',parts:['構造化','自動化','反復','検証','改善'],reason:'異なるプロジェクトでも「集める→構造化する→自動化する→反復検証する」という操作が繰り返されている可能性。'},{label:'仮説: 新規性→熱中→飽き',parts:['新規性','熱中','退屈','飽き','深掘り'],reason:'テーマそのものより、新規性と改善余地が熱量を左右している可能性。'},{label:'仮説: AI委任→自律化→人間承認',parts:['Codex','エージェント','自律ループ','人間承認','判断'],reason:'AIへの委任範囲を広げつつ、最終判断点だけ人間に残す方向へ収束している可能性。'}];
const CORE=new Set('構造化|自動化|検証|改善|判断|セレンディピティ|思考の穴|ChatGPT|Codex|エージェント|自律ループ|ループエンジニアリング|アプリ開発|GitHub|TestFlight|投資|期待値|個別株|競馬AI|法人提案|マネジメント|自己理解|熱中|新規性|知識グラフ|樹形図|Notion|Obsidian|MVP|反対役AI|人間承認'.split('|'));
let N=[],E=[],byId={},byLabel={},adj={},freqMap={},mode='discover',selected=null,showLabels=false,zoom=1,panX=0,panY=0,W=1,H=1,DPR=1,dragNode=null,dragLast=null,pointers=new Map(),pinch=null,simRunning=true,temp=1,iteration=0,discoveries=[],dIndex=0,currentDiscovery=null;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
function extractObject(text,marker,nextMarker){let a=text.indexOf(marker);if(a<0)throw new Error(marker+' not found');a+=marker.length;let b=text.indexOf(nextMarker,a);if(b<0)throw new Error(nextMarker+' not found');return text.slice(a,b).trim().replace(/;$/,'')}
function addNode(id,label,type,group,gi){if(byId[id])return byId[id];let n={id,label,type,group,gi,x:0,y:0,vx:0,vy:0,parents:new Set(),groups:new Set(),fixed:false,hyp:false};N.push(n);byId[id]=n;if(type==='concept')byLabel[label]=n;adj[id]=[];return n}
function addEdge(a,b,type='hier',reason=''){if(!a||!b||a===b)return;if(adj[a]?.some(x=>x.to===b&&x.type===type))return;let e={a,b,type,reason};E.push(e);adj[a].push({to:b,type,reason});adj[b].push({to:a,type,reason})}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function build(spec){let tops=Object.keys(spec);tops.forEach((top,gi)=>{let tn=addNode('top:'+top,top,'top',top,gi),ang=gi/tops.length*Math.PI*2;tn.x=Math.cos(ang)*680;tn.y=Math.sin(ang)*520;Object.keys(spec[top]).forEach((sub,si,subs)=>{let sid='sub:'+top+'::'+sub,sn=addNode(sid,sub,'sub',top,gi),sa=ang+(si-(subs.length-1)/2)*.14,sr=300+(si%3)*42;sn.x=tn.x+Math.cos(sa)*sr;sn.y=tn.y+Math.sin(sa)*sr;addEdge(tn.id,sn.id,'hier');String(spec[top][sub]).split('|').filter(Boolean).forEach(label=>{let cn=byLabel[label]||addNode('c:'+label,label,'concept',top,gi);cn.parents.add(sid);cn.groups.add(top);if(cn.parents.size===1){let h=hash(label),a=sa+((h%1000)/1000-.5)*1.1,r=110+(h%180);cn.x=sn.x+Math.cos(a)*r;cn.y=sn.y+Math.sin(a)*r}else{let ps=[...cn.parents].map(x=>byId[x]);cn.x=ps.reduce((s,p)=>s+p.x,0)/ps.length;cn.y=ps.reduce((s,p)=>s+p.y,0)/ps.length}addEdge(sid,cn.id,'hier')})})});EXTRA.forEach(x=>{let a=byLabel[x[0]],b=byLabel[x[1]];if(a&&b)addEdge(a.id,b.id,'cross',x[2])});LATENT.forEach((h,i)=>{let hn=addNode('hyp:'+i,h.label,'hyp','仮説',11);hn.hyp=true;let pts=h.parts.map(x=>byLabel[x]).filter(Boolean);if(pts.length){hn.x=pts.reduce((s,p)=>s+p.x,0)/pts.length;hn.y=pts.reduce((s,p)=>s+p.y,0)/pts.length}h.parts.forEach(p=>{let n=byLabel[p];if(n)addEdge(hn.id,n.id,'hyp',h.reason)})});N.forEach(n=>{if(n.type==='concept'&&n.groups.size>1)n.multi=true});makeDiscoveries()}
function importance(n){let f=freqMap[n.label]||0,base=n.type==='top'?95:n.type==='sub'?78:n.type==='hyp'?88:CORE.has(n.label)?92:55;return Math.min(100,base+Math.min(18,f*1.7)+Math.min(12,(n.groups?.size||0)*3)+Math.min(8,adj[n.id].filter(x=>x.type==='cross').length*4))}
function crossDegree(n){return (adj[n.id]||[]).filter(x=>x.type==='cross'||x.type==='hyp'||(byId[x.to]?.type==='concept'&&byId[x.to]?.group!==n.group)).length+(n.groups?.size||1)-1}
function gapScore(n){if(n.type!=='concept')return 0;let imp=importance(n),cross=crossDegree(n),parents=n.parents?.size||1;return Math.max(0,imp-(cross*17+parents*4))}
function bridgeScore(n){if(n.type!=='concept')return 0;return Math.min(100,20+(n.groups?.size||1)*18+adj[n.id].filter(x=>x.type==='cross').length*25+Math.min(20,(freqMap[n.label]||0)*2))}
function makeDiscoveries(){discoveries=[];EXTRA.forEach(x=>{let a=byLabel[x[0]],b=byLabel[x[1]];if(a&&b)discoveries.push({kind:'横断接続',a:a.id,b:b.id,title:x[0]+' × '+x[1],reason:x[2],score:Math.round((importance(a)+importance(b))/2)} )});N.filter(n=>n.multi&&n.type==='concept').forEach(n=>discoveries.push({kind:'橋渡しノード',a:n.id,title:n.label,reason:[...n.groups].join(' と ')+'の複数領域に同時所属している。樹形図だけでは見えにくい横断点。',score:bridgeScore(n)}));LATENT.forEach((x,i)=>discoveries.push({kind:'潜在パターン',a:'hyp:'+i,title:x.label,reason:x.reason,score:88}));discoveries.sort((a,b)=>b.score-a.score)}
async function init(){try{let [htmlRes,fRes]=await Promise.all([fetch('./index.html?g='+Date.now()).then(r=>r.text()),fetch('./frequency.json?g='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]);let spec=JSON.parse(extractObject(htmlRes,'const SPEC=',';\nconst ALT='));if(fRes){(fRes.tokens||[]).forEach(x=>freqMap[x.token]=x.confirmed_chats_min)}build(spec);resize();loading.style.display='none';setDiscovery(0);requestAnimationFrame(loop)}catch(e){loading.textContent='読み込み失敗: '+e.message}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);let r=stage.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);draw()}
function radius(n){let r=n.type==='top'?11:n.type==='sub'?6.5:n.type==='hyp'?8:3.3;r+=Math.min(6,Math.sqrt(adj[n.id].length));if(n.multi)r+=2.2;if(freqMap[n.label])r+=Math.min(8,freqMap[n.label]*.45);return r}
function color(n){if(n.type==='top')return '#bd93f9';if(n.type==='sub')return '#62d394';if(n.type==='hyp')return '#e4bd59';if(mode==='gaps'&&gapScore(n)>55)return '#ff7474';return COLORS[n.gi%COLORS.length]||'#8f9bad'}
function screen(n){return{x:W/2+panX+n.x*zoom,y:H/2+panY+n.y*zoom}}
function currentSet(){if(mode==='all')return null;if(mode==='discover'){let s=new Set;N.forEach(n=>{if(n.type!=='concept'||importance(n)>=86||n.multi||adj[n.id].some(x=>x.type==='cross')||n.type==='hyp')s.add(n.id)});E.forEach(e=>{if((e.type==='cross'||e.type==='hyp')&&(s.has(e.a)||s.has(e.b))){s.add(e.a);s.add(e.b)}});N.filter(n=>n.type==='top').forEach(n=>s.add(n.id));return s}if(mode==='cross'){let s=new Set;N.forEach(n=>{if(n.type==='hyp'||n.multi||adj[n.id].some(x=>x.type==='cross'))s.add(n.id)});E.filter(e=>e.type==='cross'||e.type==='hyp').forEach(e=>{s.add(e.a);s.add(e.b)});return s}if(mode==='gaps'){return new Set(N.filter(n=>n.type==='concept'&&gapScore(n)>=58).map(n=>n.id))}if(mode==='patterns'){let s=new Set;N.filter(n=>n.type==='hyp').forEach(n=>{s.add(n.id);adj[n.id].forEach(x=>s.add(x.to))});return s}if(mode==='local'&&selected){let d=+depth.value,s=new Set([selected]),front=[selected];for(let i=0;i<d;i++){let nx=[];front.forEach(u=>(adj[u]||[]).forEach(v=>{if(!s.has(v.to)){s.add(v.to);nx.push(v.to)}}));front=nx}return s}return null}
function edgeVisible(e,set){if(set&&!set.has(e.a)&&!set.has(e.b))return false;if(mode==='cross')return e.type==='cross'||e.type==='hyp';if(mode==='patterns')return e.type==='hyp';if(mode==='gaps')return set&&set.has(e.a)&&set.has(e.b);return true}
function draw(){ctx.clearRect(0,0,W,H);let set=currentSet(),vis=n=>!set||set.has(n.id);E.forEach(e=>{if(!edgeVisible(e,set))return;let a=byId[e.a],b=byId[e.b];if(!vis(a)||!vis(b))return;let pa=screen(a),pb=screen(b),active=selected&&(e.a===selected||e.b===selected);ctx.strokeStyle=e.type==='cross'?`rgba(228,189,89,${active?.95:.48})`:e.type==='hyp'?`rgba(189,147,249,${active?.9:.42})`:`rgba(134,154,180,${active?.58:.09})`;ctx.lineWidth=(e.type==='cross'||e.type==='hyp'?1.35:.55)+(active?1.2:0);ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()});N.forEach(n=>{if(!vis(n))return;let p=screen(n);if(p.x<-50||p.y<-50||p.x>W+50||p.y>H+50)return;let r=radius(n),dim=selected&&n.id!==selected&&!adj[selected]?.some(x=>x.to===n.id);ctx.globalAlpha=dim?.18:1;ctx.fillStyle=color(n);if(selected===n.id||n.hyp){ctx.shadowBlur=selected===n.id?20:9;ctx.shadowColor=ctx.fillStyle}ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(selected===n.id){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}let should=showLabels||n.type==='top'||n.type==='hyp'||importance(n)>=92||selected===n.id;if(should){ctx.font=(n.type==='top'?'12px':'11px')+' -apple-system,BlinkMacSystemFont,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#0b0f16';ctx.strokeText(n.label,p.x+r+4,p.y+4);ctx.fillStyle='#eef3f8';ctx.fillText(n.label,p.x+r+4,p.y+4)}ctx.globalAlpha=1});status.textContent=(set?set.size:N.length)+' / '+N.length+' nodes · '+modeLabel()}
function modeLabel(){return{discover:'発見モード',all:'全体',cross:'橋だけ',gaps:'構造的な穴候補',patterns:'潜在パターン',local:'近傍'}[mode]||mode}
function forces(){let set=currentSet(),arr=set?N.filter(n=>set.has(n.id)):N;if(arr.length>260&&mode==='all'){temp*=.985;return}for(let i=0;i<arr.length;i++){let a=arr[i];if(a.fixed)continue;let fx=0,fy=0;for(let j=i+1;j<arr.length;j++){let b=arr[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+80,d=Math.sqrt(d2),rep=(a.type==='top'||b.type==='top'?17000:6500)/d2;if(!b.fixed){b.vx-=dx/d*rep;b.vy-=dy/d*rep}fx+=dx/d*rep;fy+=dy/d*rep}a.vx+=fx;a.vy+=fy}E.forEach(e=>{if(!edgeVisible(e,set))return;let a=byId[e.a],b=byId[e.b];if(set&&(!set.has(a.id)||!set.has(b.id)))return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,target=e.type==='hier'?(a.type==='top'||b.type==='top'?240:100):180,k=e.type==='cross'?.004:.006,f=(d-target)*k;if(!a.fixed){a.vx+=dx/d*f;a.vy+=dy/d*f}if(!b.fixed){b.vx-=dx/d*f;b.vy-=dy/d*f}});arr.forEach(n=>{if(n.fixed)return;n.vx+=-n.x*.0008;n.vy+=-n.y*.0008;n.vx*=.83;n.vy*=.83;n.x+=n.vx*Math.max(.25,temp);n.y+=n.vy*Math.max(.25,temp)})}
function loop(){if(simRunning&&iteration<340){forces();iteration++;temp*=.993;draw()}requestAnimationFrame(loop)}function restart(){iteration=0;temp=.9;simRunning=true}
function hit(x,y){let set=currentSet(),best=null,bd=1e9;N.forEach(n=>{if(set&&!set.has(n.id))return;let p=screen(n),d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(13,radius(n)+5)&&d<bd){best=n;bd=d}});return best}
function select(n){selected=n.id;showInspector(n);draw()}
function roles(n){let a=[];if(n.type==='hyp')a.push(['仮説','hyp']);if(bridgeScore(n)>=60)a.push(['橋渡し','bridge']);if(adj[n.id].length>=8)a.push(['ハブ','hub']);if(gapScore(n)>=58)a.push(['横断不足','gap']);return a}
function diagnostic(n){if(n.type==='hyp')return['この仮説を反証する会話・行動はあるか','このパターンは一時的なブームではないか','別の説明モデルの方が単純ではないか','今後どんな観測があれば確信度を上げられるか'];let project=/アプリ|サイト|AI$|研究|同等化|Tree|比較|モデル|自動取得/.test(n.label);return project?['最終目的と成功指標は明示されているか','誰が使い、何が変われば価値があるのか','撤退・停止条件は決まっているか','次に潰すべき最大の不確実性は何か','完成より検証を優先できる最小実験は何か']:['この考えの根拠は何か','反対例・適用できない条件は何か','何を測れば正しさを判定できるか','別領域へ転用できる構造は何か','最近も重要なのか、惰性で残っていないか']}
function showInspector(n){let rs=roles(n),near=(adj[n.id]||[]).map(x=>({n:byId[x.to],...x})).sort((a,b)=>(b.type==='cross'?2:0)-(a.type==='cross'?2:0)||importance(b.n)-importance(a.n));let crossNear=near.filter(x=>x.type==='cross'||x.type==='hyp'||x.n?.multi);pt.textContent=n.label;pb.innerHTML=`<div>${rs.map(x=>`<span class="badge ${x[1]}">${x[0]}</span>`).join('')}<span class="badge">重要度 ${Math.round(importance(n))}</span>${freqMap[n.label]?`<span class="badge">≥${freqMap[n.label]} chats</span>`:''}</div><div class="sub">所属: ${n.type==='concept'?[...n.groups].join(' / '):(n.group||n.type)}</div><div class="block"><h3>意味のある横断接続</h3>${crossNear.length?crossNear.slice(0,7).map(x=>`<div class="item"><div class="itemTop"><div class="itemName">${x.n.label}</div><div class="meta">${x.type}</div></div><div class="reason">${x.reason||'複数の枝・領域をまたぐ接続。'}</div></div>`).join(''):'<div class="empty">明示的な横断接続がまだありません。これは追加候補です。</div>'}</div><div class="block"><h3>このノードの穴を探す</h3>${diagnostic(n).map(x=>`<div class="qrow"><div class="qmark">?</div><div>${x}</div></div>`).join('')}</div><div class="actions"><button onclick="focusLocal('${n.id.replaceAll("'","\\'")}')">近傍だけ見る</button><button onclick="jumpFrom('${n.id.replaceAll("'","\\'")}')">遠い所へ飛ぶ</button></div>`;panel.classList.add('show')}
function focusLocal(id){selected=id;mode='local';sync();fitSelection();draw()}function jumpFrom(id){let n=byId[id],cand=(adj[id]||[]).filter(x=>x.type==='cross'||x.type==='hyp').map(x=>byId[x.to]);if(!cand.length){let ds=discoveries.filter(d=>d.a===id||d.b===id);if(ds.length){let d=ds[0],t=byId[d.a===id?d.b:d.a];if(t)select(t)}return}select(cand[Math.floor(Math.random()*cand.length)])}
function setDiscovery(i){if(!discoveries.length)return;dIndex=(i+discoveries.length)%discoveries.length;currentDiscovery=discoveries[dIndex];dTitle.textContent=currentDiscovery.title;dReason.textContent=currentDiscovery.reason;dFocus.disabled=false}
function focusDiscovery(){if(!currentDiscovery)return;mode='local';selected=currentDiscovery.a;sync();let ids=[currentDiscovery.a,currentDiscovery.b].filter(Boolean),pts=ids.map(x=>byId[x]).filter(Boolean);if(pts.length){let cx=pts.reduce((s,n)=>s+n.x,0)/pts.length,cy=pts.reduce((s,n)=>s+n.y,0)/pts.length;zoom=1.15;panX=-cx*zoom;panY=-cy*zoom}let n=byId[currentDiscovery.a];if(n)showInspector(n);draw()}
function whyDiscovery(){if(!currentDiscovery)return;drawerTitle.textContent='なぜこの接続を見るのか';drawerBody.innerHTML=`<div class="insightCard"><span class="score">${currentDiscovery.score}</span><b>${currentDiscovery.title}</b><p>${currentDiscovery.reason}</p></div><div class="block"><h3>見るポイント</h3><div class="qrow"><div class="qmark">?</div><div>この共通構造を別のプロジェクトにも転用できるか</div></div><div class="qrow"><div class="qmark">?</div><div>片方で学んだ失敗パターンをもう片方へ移せるか</div></div><div class="qrow"><div class="qmark">?</div><div>この2つをつなぐ中間概念がまだ未言語化ではないか</div></div></div>`;drawer.classList.add('show')}
function showBridgeDrawer(){let rows=N.filter(n=>n.type==='concept').map(n=>[bridgeScore(n),n]).filter(x=>x[0]>=55).sort((a,b)=>b[0]-a[0]).slice(0,24);drawerTitle.textContent='思考の橋';drawerBody.innerHTML='<div class="sub">複数領域に所属するか、明示的な横断接続を持つ概念。樹形図では見落としやすい部分です。</div><div class="sectionGrid">'+rows.map(x=>`<div class="insightCard" data-id="${x[1].id}"><span class="score">${Math.round(x[0])}</span><b>${x[1].label}</b><p>${[...x[1].groups].join(' / ')||'横断接続あり'}</p></div>`).join('')+'</div>';drawer.classList.add('show');drawer.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{select(byId[e.dataset.id]);drawer.classList.remove('show')})}
function showGapDrawer(){let rows=N.filter(n=>n.type==='concept').map(n=>[gapScore(n),n]).filter(x=>x[0]>=50).sort((a,b)=>b[0]-a[0]).slice(0,24);drawerTitle.textContent='構造的な穴候補';drawerBody.innerHTML='<div class="sub">「重要そうなのに横断接続が薄い」候補。論理的誤りの断定ではありません。</div><div class="sectionGrid">'+rows.map(x=>`<div class="insightCard" data-id="${x[1].id}"><span class="score">${Math.round(x[0])}</span><b>${x[1].label}</b><p>重要度 ${Math.round(importance(x[1]))} / 横断 ${crossDegree(x[1])}</p></div>`).join('')+'</div>';drawer.classList.add('show');drawer.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{select(byId[e.dataset.id]);drawer.classList.remove('show')})}
function showPatternDrawer(){drawerTitle.textContent='潜在パターン（仮説）';drawerBody.innerHTML=LATENT.map((x,i)=>`<div class="insightCard" data-id="hyp:${i}"><span class="badge hyp">仮説</span><b>${x.label}</b><p>${x.reason}</p></div>`).join('');drawer.classList.add('show');drawer.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{select(byId[e.dataset.id]);drawer.classList.remove('show')})}
function sync(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));let b=document.getElementById(mode);if(b)b.classList.add('on');discoveryCard.style.display=mode==='discover'?'block':'none';restart();draw()}
function setMode(m){mode=m;selected=null;panel.classList.remove('show');drawer.classList.remove('show');fit();sync();if(m==='cross')showBridgeDrawer();if(m==='gaps')showGapDrawer();if(m==='patterns')showPatternDrawer()}
function fit(){zoom=.72;panX=0;panY=0;draw()}function fitSelection(){let n=byId[selected];if(!n)return;zoom=1.15;panX=-n.x*zoom;panY=-n.y*zoom}
function search(){let s=q.value.trim().toLowerCase();if(!s)return;let hits=N.filter(n=>n.label.toLowerCase().includes(s)).sort((a,b)=>importance(b)-importance(a));if(!hits.length)return alert('該当なし');let n=hits[0];mode='local';selected=n.id;fitSelection();sync();showInspector(n)}
go.onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};discover.onclick=()=>setMode('discover');all.onclick=()=>setMode('all');cross.onclick=()=>setMode('cross');gaps.onclick=()=>setMode('gaps');patterns.onclick=()=>setMode('patterns');local.onclick=()=>{if(selected){mode='local';sync()}else alert('先にノードを選択してください')};labels.onclick=()=>{showLabels=!showLabels;labels.classList.toggle('on',showLabels);draw()};depth.onchange=()=>draw();close.onclick=()=>panel.classList.remove('show');drawerClose.onclick=()=>drawer.classList.remove('show');dNext.onclick=()=>setDiscovery(dIndex+1);dFocus.onclick=focusDiscovery;dWhy.onclick=whyDiscovery;zp.onclick=()=>{zoom=Math.min(4,zoom*1.2);draw()};zm.onclick=()=>{zoom=Math.max(.18,zoom/1.2);draw()};zr.onclick=fit;
canvas.onpointerdown=e=>{canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let r=canvas.getBoundingClientRect(),n=hit(e.clientX-r.left,e.clientY-r.top);if(pointers.size===1){if(n){dragNode=n;dragNode.fixed=true}else dragLast={x:e.clientX,y:e.clientY,m:false}}if(pointers.size===2){let p=[...pointers.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoom};dragNode=null;dragLast=null}};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoom=Math.max(.18,Math.min(5,pinch.z*d/pinch.d));draw();return}if(dragNode){let r=canvas.getBoundingClientRect();dragNode.x=(e.clientX-r.left-W/2-panX)/zoom;dragNode.y=(e.clientY-r.top-H/2-panY)/zoom;draw();restart()}else if(dragLast){let dx=e.clientX-dragLast.x,dy=e.clientY-dragLast.y;if(Math.abs(dx)+Math.abs(dy)>3)dragLast.m=true;panX+=dx;panY+=dy;dragLast.x=e.clientX;dragLast.y=e.clientY;draw()}};
canvas.onpointerup=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;let r=canvas.getBoundingClientRect();if(dragNode){let n=dragNode;dragNode.fixed=false;dragNode=null;select(n);restart()}else if(dragLast&&!dragLast.m){let n=hit(e.clientX-r.left,e.clientY-r.top);if(n)select(n);else{selected=null;panel.classList.remove('show');draw()}}dragLast=null};canvas.onpointercancel=e=>{pointers.delete(e.pointerId);if(dragNode)dragNode.fixed=false;dragNode=null;dragLast=null;pinch=null};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.18,Math.min(5,zoom*(e.deltaY<0?1.12:.89)));draw()},{passive:false});window.onresize=resize;init();
</script></body></html>
