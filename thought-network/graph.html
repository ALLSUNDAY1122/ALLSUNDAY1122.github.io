<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><title>Personal Thought Graph</title><style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1d2430;--line:#30363d;--text:#f0f3f6;--muted:#8b949e;--blue:#58a6ff;--purple:#bc8cff;--green:#3fb950;--yellow:#d29922}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #3a4554;border-radius:8px;padding:7px 9px}button{cursor:pointer}button.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{z-index:20;background:rgba(13,17,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 9px}.head{display:flex;gap:7px;align-items:center}.title{font-size:16px;font-weight:700;white-space:nowrap}.search{display:flex;gap:5px;flex:1}.search input{min-width:0;width:100%}.nav{display:flex;gap:6px;align-items:center;overflow-x:auto;margin-top:7px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav>*{flex:none;white-space:nowrap}.nav a{font-size:12px;color:#9cc7ff;text-decoration:none;padding:6px 7px;border:1px solid #31415a;border-radius:8px}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at 50% 48%,#151c29 0,#0d1117 65%)}#status{position:absolute;left:8px;top:8px;background:#0b1018d9;border:1px solid #2c3748;border-radius:8px;padding:6px 8px;font-size:10px;color:var(--muted);pointer-events:none}.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.zoom button{width:42px;height:42px;padding:0;font-size:20px;background:#1d2430e8}.legend{position:absolute;left:8px;bottom:8px;background:#0b1018d9;border:1px solid #2c3748;border-radius:8px;padding:6px 8px;font-size:10px;color:var(--muted);pointer-events:none}.panel{position:absolute;right:8px;bottom:8px;width:min(390px,calc(100% - 16px));max-height:48%;overflow:auto;background:#161b22f7;border:1px solid #364153;border-radius:13px;padding:12px;display:none;backdrop-filter:blur(12px)}.panel.show{display:block}.panel h2{font-size:17px;margin:0 34px 3px 0}.close{position:absolute;right:8px;top:8px;padding:4px 9px}.sub{font-size:11px;color:var(--muted);line-height:1.5}.block{margin-top:13px}.block h3{font-size:11px;color:#c9d1d9;margin:0 0 6px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:10px;border:1px solid #354154;border-radius:999px;padding:4px 6px;color:#d7e0eb}.item{border:1px solid #2c3746;border-radius:9px;padding:8px;margin:6px 0;background:#111720}.itemTop{display:flex;gap:6px;align-items:center}.itemName{font-size:12px;font-weight:600;flex:1}.itemMeta{font-size:10px;color:var(--muted)}.reason{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1117;color:var(--muted);z-index:30;font-size:13px}.dotLegend{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 7px}@media(max-width:700px){header{padding:7px}.title{font-size:14px}.search button{padding-left:8px;padding-right:8px}.nav button,.nav select,.nav a{font-size:11px;padding:6px 7px}.panel{max-height:52%;left:8px;right:8px;width:auto}.legend{max-width:65%}}
</style></head><body><div id="app"><header><div class="head"><div class="title">Thought Graph</div><div class="search"><input id="q" placeholder="ノード検索"><button id="go">検索</button></div></div><div class="nav"><a href="./">樹形図</a><a href="./frequency.html">頻度分析</a><button id="all" class="on">全体</button><button id="local">近傍</button><button id="cross">横断のみ</button><button id="freq">頻度サイズ</button><button id="labels">ラベル</button><select id="depth"><option value="1">1-hop</option><option value="2" selected>2-hop</option><option value="3">3-hop</option></select></div></header><main class="stage" id="stage"><canvas id="c"></canvas><div id="loading" class="loading">樹形図データを読み込み中…</div><div id="status"></div><div class="zoom"><button id="zp">＋</button><button id="zm">−</button><button id="zr">◎</button></div><div class="legend"><span class="dotLegend" style="background:#bc8cff"></span>領域 <span class="dotLegend" style="background:#3fb950"></span>枝 <span class="dotLegend" style="background:#8b949e"></span>概念　線が複数領域へ伸びるほど横断性が高い</div><section id="panel" class="panel"><button id="close" class="close">×</button><h2 id="pt"></h2><div id="pb"></div></section></main></div><script>
const COLORS=['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39c5cf','#ff9bce','#9ea7ff','#e5c07b','#7ee787','#ffa657','#c9d1d9'];
const EXTRA=[['競馬AI','個別株','不確実性下で期待値を推定し、後から検証する構造が共通。'],['競馬AI','法人提案','複数案の比較・期待成果・下振れ管理という問題構造が共通。'],['Scaniverse同等化','知識グラフ','空間を点と関係から復元する発想を、思考空間の復元へ転用できる。'],['3D','樹形図','平面的な階層に視点軸や時間軸を加える発想源。'],['ホラー','ループエンジニアリング','伏線→検証→回収を長期プロジェクトのチェックポイント設計へ転用。'],['営業教育','AI家庭教師','個別弱点に合わせ説明粒度を変える構造が共通。'],['自治体比較','法人保険比較','多条件制度を同じ評価軸へ正規化する技法が共通。'],['投資原則','アプリ開発','小さく賭ける・損失上限・検証・撤退条件という実験設計が共通。'],['自己理解','アクセス解析','感覚ではなく行動ログから興味変化を推定する発想。'],['TestFlight','仮説','実機テストを仮説を潰す実験として扱う。'],['反対役AI','法人提案','顧客が断る理由を先に生成し、提案の穴を潰す。'],['反対役AI','投資','強気仮説に対するベアケース生成器として使える。'],['Notion','GitHub','知識状態と実装状態を相互参照し、情報と成果物の乖離を減らす。'],['セレンディピティ','弱い結合','少し遠い関連を探索対象にする中心概念。'],['未完了','サンクコスト','継続価値ではなく残存価値でプロジェクトを再評価する。'],['熱中','新規性','新規性の減衰と熱量変化を時系列で測る。'],['自律ループ','人間承認','完全自動化より人間がどこだけ決めるかを設計する。'],['MVP','撤退条件','作る条件だけでなく捨てる条件を最初に決める。'],['200社研究','監査AI','大量調査では分析AIより誤りを探すAIの限界効用が高くなりやすい。'],['マインドマップ','知識グラフ','表示は木、内部は多重所属という現在の外部脳設計。']];
let N=[],E=[],byId={},byLabel={},adj={},freqMap={},mode='all',selected=null,showLabels=false,useFreq=false,zoom=1,panX=0,panY=0,W=1,H=1,DPR=1,dragNode=null,dragLast=null,pointers=new Map(),pinch=null,simRunning=true,temperature=1,iter=0;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
function extractObject(text,marker,nextMarker){let a=text.indexOf(marker);if(a<0)throw new Error(marker+' not found');a+=marker.length;let b=text.indexOf(nextMarker,a);if(b<0)throw new Error(nextMarker+' not found');return text.slice(a,b).trim().replace(/;$/,'')}
function addNode(id,label,type,group,gi){if(byId[id])return byId[id];let n={id,label,type,group,gi,x:0,y:0,vx:0,vy:0,parents:new Set(),groups:new Set(),fixed:false};N.push(n);byId[id]=n;if(type==='concept')byLabel[label]=n;adj[id]=[];return n}
function addEdge(a,b,type='hier',reason=''){if(!a||!b||a===b)return;if(adj[a]?.some(x=>x.to===b&&x.type===type))return;let e={a,b,type,reason};E.push(e);adj[a].push({to:b,type,reason});adj[b].push({to:a,type,reason})}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function build(spec){let tops=Object.keys(spec);tops.forEach((top,gi)=>{let tn=addNode('top:'+top,top,'top',top,gi),ang=gi/tops.length*Math.PI*2;tn.x=Math.cos(ang)*650;tn.y=Math.sin(ang)*520;let subs=Object.keys(spec[top]);subs.forEach((sub,si)=>{let sid='sub:'+top+'::'+sub,sn=addNode(sid,sub,'sub',top,gi),sa=ang+(si-(subs.length-1)/2)*.13,sr=300+(si%3)*38;sn.x=tn.x+Math.cos(sa)*sr;sn.y=tn.y+Math.sin(sa)*sr;addEdge(tn.id,sn.id,'hier');String(spec[top][sub]).split('|').filter(Boolean).forEach((label,k)=>{let cn=byLabel[label]||addNode('c:'+label,label,'concept',top,gi);cn.parents.add(sid);cn.groups.add(top);if(cn.parents.size===1){let h=hash(label),a=sa+((h%1000)/1000-.5)*1.0,r=110+(h%170);cn.x=sn.x+Math.cos(a)*r;cn.y=sn.y+Math.sin(a)*r}else{let ps=[...cn.parents].map(x=>byId[x]);cn.x=ps.reduce((s,p)=>s+p.x,0)/ps.length;cn.y=ps.reduce((s,p)=>s+p.y,0)/ps.length}addEdge(sid,cn.id,'hier')})})});EXTRA.forEach(x=>{let a=byLabel[x[0]],b=byLabel[x[1]];if(a&&b)addEdge(a.id,b.id,'cross',x[2])});for(let n of N){if(n.type==='concept'&&n.parents.size>1)n.multi=true}}
async function init(){try{let [htmlRes,fRes]=await Promise.all([fetch('./index.html?g='+Date.now()).then(r=>r.text()),fetch('./frequency.json?g='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]);let raw=extractObject(htmlRes,'const SPEC=',';\nconst ALT=');let spec=JSON.parse(raw);if(fRes){(fRes.tokens||[]).forEach(x=>freqMap[x.token]=x.confirmed_chats_min);(fRes.themes||[]).forEach(x=>freqMap[x.theme]=x.confirmed_chats_min)}build(spec);resize();document.getElementById('loading').style.display='none';simRunning=true;requestAnimationFrame(loop)}catch(e){document.getElementById('loading').textContent='読み込み失敗: '+e.message}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);let r=stage.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);draw()}
function radius(n){let deg=adj[n.id].length,b=n.type==='top'?12:n.type==='sub'?7:3.2;b+=Math.min(7,Math.sqrt(deg)*.9);if(n.multi)b+=2;if(useFreq&&freqMap[n.label])b+=Math.min(10,freqMap[n.label]*.55);return b}
function color(n){if(n.type==='top')return '#bc8cff';if(n.type==='sub')return '#3fb950';return COLORS[n.gi%COLORS.length]||'#8b949e'}
function screen(n){return{x:W/2+panX+n.x*zoom,y:H/2+panY+n.y*zoom}}
function visibleSet(){if(mode==='all')return null;if(mode==='cross'){let s=new Set;N.forEach(n=>{if(n.type==='concept'&&(n.multi||adj[n.id].some(x=>x.type==='cross')))s.add(n.id)});E.filter(e=>e.type==='cross').forEach(e=>{s.add(e.a);s.add(e.b)});return s}if(mode==='local'&&selected){let depthN=+document.getElementById('depth').value,s=new Set([selected]),front=[selected];for(let d=0;d<depthN;d++){let nx=[];for(let u of front)for(let v of adj[u]||[])if(!s.has(v.to)){s.add(v.to);nx.push(v.to)}front=nx}return s}return null}
function draw(){ctx.clearRect(0,0,W,H);let vis=visibleSet();for(let e of E){if(vis&&(!vis.has(e.a)||!vis.has(e.b)))continue;let a=screen(byId[e.a]),b=screen(byId[e.b]);let related=selected&&(e.a===selected||e.b===selected),cross=e.type==='cross';ctx.strokeStyle=cross?(related?'rgba(255,200,90,.95)':'rgba(210,153,34,.48)'):(related?'rgba(120,185,255,.8)':'rgba(130,145,165,.13)');ctx.lineWidth=(cross?1.4:.55)+(related?1.3:0);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}let order=N.filter(n=>!vis||vis.has(n.id)).sort((a,b)=>radius(a)-radius(b));for(let n of order){let p=screen(n);if(p.x<-80||p.y<-80||p.x>W+80||p.y>H+80)continue;let r=radius(n),direct=selected&&(n.id===selected||adj[selected]?.some(x=>x.to===n.id)),dim=selected&&mode==='all'&&!direct;ctx.globalAlpha=dim?.16:1;ctx.fillStyle=color(n);if(n.id===selected){ctx.shadowBlur=20;ctx.shadowColor='#8ec7ff'}ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(n.multi&&n.type==='concept'){ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.stroke()}if(n.id===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke()}let lab=showLabels||n.type==='top'||(n.type==='sub'&&zoom>.48)||n.id===selected||(direct&&zoom>.7)||(useFreq&&freqMap[n.label]&&zoom>.55);if(lab){ctx.font=(n.type==='top'?'600 13px':'11px')+' -apple-system,BlinkMacSystemFont,sans-serif';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(13,17,23,.96)';ctx.strokeText(n.label,p.x+r+4,p.y);ctx.fillStyle='#e9eef5';ctx.fillText(n.label,p.x+r+4,p.y)}ctx.globalAlpha=1}let vc=vis?vis.size:N.length,ec=E.filter(e=>!vis||(vis.has(e.a)&&vis.has(e.b))).length;status.textContent=`${vc} nodes / ${ec} edges${selected?' / '+byId[selected].label:''}`}
function step(){if(temperature<.025){simRunning=false;return}let grid=new Map,cell=95;for(let n of N){let gx=Math.floor(n.x/cell),gy=Math.floor(n.y/cell),k=gx+','+gy;(grid.get(k)||grid.set(k,[]).get(k)).push(n)}for(let n of N){if(n.fixed)continue;let gx=Math.floor(n.x/cell),gy=Math.floor(n.y/cell),fx=0,fy=0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){let arr=grid.get((gx+dx)+','+(gy+dy));if(!arr)continue;for(let m of arr){if(m===n)continue;let x=n.x-m.x,y=n.y-m.y,d2=x*x+y*y+20,dist=Math.sqrt(d2),min=(radius(n)+radius(m))*4+18;if(dist<min*2){let f=1800/d2;fx+=x/dist*f;fy+=y/dist*f}}}n.vx+=fx*.08*temperature;n.vy+=fy*.08*temperature}for(let e of E){let a=byId[e.a],b=byId[e.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.001,target=e.type==='cross'?190:(a.type==='top'||b.type==='top'?260:a.type==='sub'||b.type==='sub'?125:75),f=(d-target)*.0018*temperature,fx=dx/d*f,fy=dy/d*f;if(!a.fixed){a.vx+=fx;a.vy+=fy}if(!b.fixed){b.vx-=fx;b.vy-=fy}}for(let n of N){if(n.fixed)continue;n.vx*=.84;n.vy*=.84;n.x+=n.vx;n.y+=n.vy;if(n.type==='top'){n.x*=.9995;n.y*=.9995}}temperature*=.994;iter++}
function loop(){if(simRunning){for(let i=0;i<2;i++)step();draw();requestAnimationFrame(loop)}}
function restart(){temperature=Math.max(temperature,.28);if(!simRunning){simRunning=true;requestAnimationFrame(loop)}}
function hit(x,y){let vis=visibleSet(),best=null,bd=1e9;for(let n of N){if(vis&&!vis.has(n.id))continue;let p=screen(n),d=Math.hypot(x-p.x,y-p.y),r=Math.max(11,radius(n)+5);if(d<r&&d<bd){best=n;bd=d}}return best}
function select(n){selected=n.id;showPanel(n);draw()}
function showPanel(n){pt.textContent=n.label;let links=(adj[n.id]||[]).map(x=>({n:byId[x.to],type:x.type,reason:x.reason})).sort((a,b)=>(b.type==='cross')-(a.type==='cross')||adj[b.n.id].length-adj[a.n.id].length),paths=[];if(n.type==='concept'){for(let p of n.parents){let s=byId[p];paths.push(s.group+' › '+s.label)}}else if(n.type==='sub')paths.push(n.group);let exact=freqMap[n.label];pb.innerHTML=`<div class="sub">${n.type==='top'?'領域':n.type==='sub'?'枝':'概念'} / 接続 ${adj[n.id].length}${n.multi?' / 多重所属 '+n.parents.size:''}${exact?` / 確認 ≥${exact} chats`:''}</div>${paths.length?`<div class="block"><h3>所属</h3><div class="chips">${paths.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`:''}<div class="block"><h3>接続先</h3>${links.slice(0,28).map(x=>`<div class="item" data-id="${x.n.id}"><div class="itemTop"><div class="itemName">${x.n.label}</div><div class="itemMeta">${x.type==='cross'?'横断':'構造'} · ${adj[x.n.id].length}</div></div>${x.reason?`<div class="reason">${x.reason}</div>`:''}</div>`).join('')}</div>`;panel.classList.add('show');panel.querySelectorAll('.item[data-id]').forEach(el=>el.onclick=()=>{let m=byId[el.dataset.id];selected=m.id;centerOn(m);showPanel(m);draw()})}
function centerOn(n){zoom=Math.max(zoom,1.1);panX=-n.x*zoom;panY=-n.y*zoom}
function search(){let s=q.value.trim().toLowerCase();if(!s)return;let n=N.filter(x=>x.label.toLowerCase().includes(s)).sort((a,b)=>adj[b.id].length-adj[a.id].length)[0];if(!n)return alert('該当ノードなし');selected=n.id;mode='local';sync();centerOn(n);showPanel(n);draw()}
function sync(){all.classList.toggle('on',mode==='all');local.classList.toggle('on',mode==='local');cross.classList.toggle('on',mode==='cross');freq.classList.toggle('on',useFreq);labels.classList.toggle('on',showLabels)}
go.onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};all.onclick=()=>{mode='all';sync();draw()};local.onclick=()=>{if(!selected)return alert('先にノードを選択してください');mode='local';sync();draw()};cross.onclick=()=>{mode='cross';sync();draw()};freq.onclick=()=>{useFreq=!useFreq;sync();draw()};labels.onclick=()=>{showLabels=!showLabels;sync();draw()};depth.onchange=draw;close.onclick=()=>panel.classList.remove('show');zp.onclick=()=>{zoom=Math.min(5,zoom*1.25);draw()};zm.onclick=()=>{zoom=Math.max(.18,zoom/1.25);draw()};zr.onclick=()=>{zoom=.72;panX=panY=0;draw()};
canvas.onpointerdown=e=>{canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let r=canvas.getBoundingClientRect(),n=hit(e.clientX-r.left,e.clientY-r.top);if(pointers.size===1){if(n){dragNode=n;dragNode.fixed=true}else dragLast={x:e.clientX,y:e.clientY,m:false}}if(pointers.size===2){let p=[...pointers.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoom};dragNode=null;dragLast=null}};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoom=Math.max(.18,Math.min(5,pinch.z*d/pinch.d));draw();return}if(dragNode){let r=canvas.getBoundingClientRect();dragNode.x=(e.clientX-r.left-W/2-panX)/zoom;dragNode.y=(e.clientY-r.top-H/2-panY)/zoom;draw();restart()}else if(dragLast){let dx=e.clientX-dragLast.x,dy=e.clientY-dragLast.y;if(Math.abs(dx)+Math.abs(dy)>3)dragLast.m=true;panX+=dx;panY+=dy;dragLast.x=e.clientX;dragLast.y=e.clientY;draw()}};
canvas.onpointerup=e=>{let old=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;let r=canvas.getBoundingClientRect();if(dragNode){let n=dragNode;dragNode.fixed=false;dragNode=null;select(n);restart()}else if(dragLast&&!dragLast.m){let n=hit(e.clientX-r.left,e.clientY-r.top);if(n)select(n);else{selected=null;panel.classList.remove('show');draw()}}dragLast=null};canvas.onpointercancel=e=>{pointers.delete(e.pointerId);if(dragNode)dragNode.fixed=false;dragNode=null;dragLast=null;pinch=null};canvas.addEventListener('wheel',e=>{e.preventDefault();let f=e.deltaY<0?1.12:.89;zoom=Math.max(.18,Math.min(5,zoom*f));draw()},{passive:false});window.onresize=resize;sync();init();
</script></body></html>
