name: JosanshiSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  LearningSprintCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../native-ios/LearningSprintCore/Sources/LearningSprintCore
  JosanshiSprintFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JosanshiSprintFeature/Sources/JosanshiSprintFeature
      - path: JosanshiSprintFeature/Sources/JosanshiSprintFeature/Resources
        buildPhase: resources
    dependencies:
      - target: LearningSprintCore
  JosanshiSprint:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    attributes:
      ProvisioningStyle: Automatic
    sources:
      - path: App
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: JosanshiSprintFeature
    settings:
      base:
        PRODUCT_NAME: JosanshiSprint
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.josanshi
        DEVELOPMENT_TEAM: MN3D2ZM44N
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 助産師 学びスプリント
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
