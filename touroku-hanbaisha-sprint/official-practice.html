<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ef"><title>公式過去問｜登録販売者 学びスプリント</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#27221d;background:#fdf6ef}
*{box-sizing:border-box}body{margin:0}.app{max-width:660px;margin:auto;padding:18px 15px 95px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}header a{color:#a34825;text-decoration:none;font-weight:600}h1{font-size:1.38rem;margin:0}.eyebrow{font-size:.78rem;color:#876c5c}.card{background:white;border:1px solid #e8dbcd;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px #22150008}h2{font-size:1.16rem;margin:8px 0 15px}.sub{font-size:.88rem;line-height:1.7;color:#67594f}.controls{display:flex;gap:8px;flex-wrap:wrap}.button,select{font:inherit;min-height:46px;border-radius:12px;padding:11px 15px;border:1px solid #d5bba9;background:white;color:#43291c}.button.primary{background:#a64926;color:white;border-color:#a64926}.button:disabled{opacity:.48}.button:focus-visible,select:focus-visible{outline:3px solid #eaa969}.choice{width:100%;display:flex;align-items:flex-start;gap:14px;margin:10px 0;text-align:left;line-height:1.65;font-size:1rem;white-space:pre-wrap}.num{font-weight:700;flex-shrink:0}.choice.good{border-color:#248251;background:#edf7ef}.choice.bad{border-color:#b94d47;background:#fff0ee}.question ruby,.choice ruby{ruby-position:over;ruby-align:center;white-space:nowrap}.question rt,.choice rt{font-size:.55em;line-height:1.1;user-select:none}.question{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere;font-size:1.02rem}.ruby-sequence{border-left:3px solid #aa7950;background:#fff8ee;padding:9px 12px;font-size:.88rem;line-height:1.8;margin:12px 0}.ruby-sequence strong{display:block}.ruby-sequence span{white-space:pre-wrap}.source-figure{margin:14px 0}.source-figure figure{margin:0 0 16px}.source-figure a{display:block;max-width:100%;overflow:hidden;cursor:zoom-in}.source-figure img{display:block;width:100%;height:auto;max-width:100%;border:1px solid #ded3c7;border-radius:8px}.source-figure figcaption{font-size:.78rem;line-height:1.6;color:#67594f;padding-top:6px}.source{font-size:.82rem;line-height:1.7;color:#6d5e54;border-top:1px solid #eadfd3;margin-top:15px;padding-top:12px;overflow-wrap:anywhere}.source a{color:#8c4327}.meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:#74665d}.result{font-weight:700;font-size:1.06rem}.explanation{white-space:pre-wrap;line-height:1.8;border-top:1px solid #eadfd3;margin-top:12px;padding-top:12px;font-size:.92rem}.explanation strong{display:block;margin-bottom:6px}.note{border-left:3px solid #b07940;padding:10px 14px;background:#fff4e6;font-size:.85rem;line-height:1.7;margin-bottom:16px}.hidden{display:none}footer{font-size:.78rem;color:#77675d;margin-top:25px}
</style></head><body><main class="app">
<header><a href="./index.html">‹ ホーム</a><div><div class="eyebrow">関西広域連合・原典照合済み</div><h1>公式過去問</h1></div></header>
<div id="notice" class="note">原典画像・公式正答を照合した問題のみを表示します。未監査の候補問題は含まれません。</div>
<section class="card" id="setup"><h2>学習範囲</h2><p id="available" class="sub">監査済み問題を読み込んでいます。</p>
<div class="controls"><label>年度 <select id="year" aria-label="実施年度"><option value="all">全年度</option></select></label>
<label>分野 <select id="chapter" aria-label="分野"><option value="all">全分野</option></select></label></div>
<p class="sub" id="count"></p><button class="button primary" id="start">監査済み問題を学習する</button></section>
<section id="quiz" class="hidden"><div class="meta"><span id="counter"></span><span id="score"></span></div>
<article class="card"><h2 id="questionTitle"></h2><div id="question" class="question"></div><div id="rubySequence" class="ruby-sequence hidden"></div><div id="sourceFigure" class="source-figure"></div><div id="choices"></div>
<div id="feedback" class="hidden" aria-live="polite"></div><div class="controls"><button class="button" id="unknown">わからない</button><button class="button primary hidden" id="next">次へ</button></div>
<div class="source" id="attribution"></div></article></section>
<section id="complete" class="card hidden"><h2>学習結果</h2><p id="summary" class="result"></p><p id="exclusion" class="sub"></p><button class="button primary" id="restart">別の範囲で学ぶ</button></section>
<footer>出典表示は問題ごとに記載しています。関西広域連合の公式アプリではありません。<a href="./privacy.html">プライバシーポリシー</a>　<a href="./support.html">サポート</a></footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const BANK='official-kansai/APPROVED_OFFICIAL_BANK.json';
let records=[],subset=[],position=0,correct=0,denominator=0,selected=false,excluded=0;
let explanationMap=new Map();
fetch('official-kansai/EXPLANATIONS_AUDITED_599.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{if(d?.count!==599||d.records?.length!==599||d.auditSummary?.PASS!==599||d.auditSummary?.HOLD!==0)throw Error('解説監査データの件数・状態が一致しません');explanationMap=new Map(d.records.map(x=>[x.id,x]));}).catch(()=>{explanationMap=new Map()});
const allowed=new Set(['NORMAL','OFFICIALLY_INVALID_ALL_CANDIDATES_CORRECT']);
function sourceLink(url,label){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;return a}
function renderedText(parts){return parts.map(p=>Object.prototype.hasOwnProperty.call(p,'text')?p.text:p.rubyBase).join('')}
function isRichParts(parts,plain){return Array.isArray(parts)&&parts.length>0&&parts.every(p=>p&&typeof p==='object'&&((typeof p.text==='string'&&p.rubyBase===undefined&&p.rubyText===undefined)||(typeof p.rubyBase==='string'&&typeof p.rubyText==='string'&&p.rubyBase.length>=1&&/^[\u3400-\u9fff々]+$/.test(p.rubyBase)&&/^[ぁ-んァ-ンー]{1,20}$/.test(p.rubyText)&&p.text===undefined)))&&renderedText(parts)===plain}
function appendRich(parent,parts,plain){if(!parts){parent.textContent=plain;return}if(!isRichParts(parts,plain))throw Error('ルビ監査データの整合性が失われています');parent.replaceChildren();for(const piece of parts){if(piece.text!==undefined){parent.append(document.createTextNode(piece.text));continue}const ruby=document.createElement('ruby');const rt=document.createElement('rt');const rp1=document.createElement('rp');const rp2=document.createElement('rp');ruby.append(document.createTextNode(piece.rubyBase));rp1.textContent='（';rt.textContent=piece.rubyText;rp2.textContent='）';ruby.append(rp1,rt,rp2);parent.append(ruby)}}
function approvedFigures(q){if(!q.sourceFigures)return true;return Array.isArray(q.sourceFigures)&&q.sourceFigures.length>0&&q.sourceFigures.every(f=>f&&f.licenseVerified===true&&f.visualVerified===true&&typeof f.webPath==='string'&&/^official-kansai\/layout-crops\/KSAI-20[2][2-6]-[0-9]{3}-p[0-9]+-[0-9]+\.png$/.test(f.webPath)&&f.sha256&&f.sourcePdfUrl)}
function renderFigures(q){const el=$('sourceFigure');el.replaceChildren();if(!q.sourceFigures)return;for(const fig of q.sourceFigures){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=fig.webPath;img.alt='関西広域連合の公式問題PDFから切り出した該当設問の図版。'+(fig.page||'')+'ページ';img.loading='lazy';caption.textContent=q.attributionDisplay+'。公式PDFを表示用に切り出し（加工）。';const a=document.createElement('a');a.href=fig.webPath;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','公式PDFの切り出し画像を原寸で表示');a.append(img);caption.textContent+=' 画像をタップすると原寸表示できます。';figure.append(a,caption);el.append(figure)}}
function richVerified(q){const has=q.questionParts!==undefined||q.choicesParts!==undefined;if(!has)return !['AUTO_PDF_GLYPH_XY_RUBY_DOM_RECONSTRUCTION','AUTO_PDF_ORDERED_GLYPH_RUBY_DOM_RECONSTRUCTION'].includes(q.audit?.method);const questionOK=q.questionParts===undefined||isRichParts(q.questionParts,q.question);const choicesOK=q.choicesParts===undefined||(Array.isArray(q.choicesParts)&&q.choicesParts.length===q.choices.length&&q.choicesParts.every((parts,i)=>isRichParts(parts,q.choices[i])));const parts=[...(q.questionParts||[]),...(q.choicesParts||[]).flat()];return questionOK&&choicesOK&&parts.some(p=>p.rubyBase!==undefined)}

function attachedRubyReadings(q){
 const parts=[...(q.questionParts||[]),...(q.choicesParts||[]).flat()];
 return parts.filter(p=>p&&p.rubyBase!==undefined).map(p=>p.rubyText);
}
function unattachedRubyReadings(q){
 const rr=q.originalRubyReadings||[];
 if(q.rubyDisplayMode==='SOURCE_ORDER_UNATTACHED')return rr;
 if(q.rubyDisplayMode==='POSITIONALLY_ATTACHED'){
  const attached=attachedRubyReadings(q);
  return rr.slice(0,rr.length-attached.length);
 }
 return [];
}
function sequenceVerified(q){
 if(q.originalRubyReadings===undefined)return true;
 const rr=q.originalRubyReadings;
 if(!Array.isArray(rr)||rr.length===0||rr.length>100||!rr.every(x=>typeof x==='string'&&/^[ぁ-んァ-ンー]{1,20}$/.test(x)))return false;
 const manualVisual=q.audit?.status==='PASS'&&q.audit?.method==='MANUAL_VISUAL_REAUDIT'&&typeof q.audit?.record==='string'&&/^visual-reaudit-fix[0-9]+-b[0-9]+\\.json$/.test(q.audit.record);
 const pinnedSource=q.rubySourceVerified===true&&typeof q.rubySourcePdfSha256==='string'&&/^[a-f0-9]{64}$/.test(q.rubySourcePdfSha256);
 if(!pinnedSource&&!manualVisual)return false;
 if(q.rubyDisplayMode==='SOURCE_ORDER_UNATTACHED')return q.questionParts===undefined&&q.choicesParts===undefined;
 if(q.rubyDisplayMode==='POSITIONALLY_ATTACHED'){
  const attached=attachedRubyReadings(q);
  return attached.length>0&&attached.length<=rr.length&&JSON.stringify(rr.slice(-attached.length))===JSON.stringify(attached)
   &&(q.questionParts!==undefined||q.choicesParts!==undefined)
   &&(q.choicesParts===undefined||(Array.isArray(q.choicesParts)&&q.choicesParts.length===q.choices.length));
 }
 return false;
}
function renderRubySequence(q){
 const el=$('rubySequence');el.replaceChildren();
 const readings=unattachedRubyReadings(q);
 if(!readings.length){el.classList.add('hidden');return}
 el.classList.remove('hidden');
 const heading=document.createElement('strong');heading.textContent='原典のルビ（出現順・漢字との対応付けなし）';
 const content=document.createElement('span');content.textContent=readings.join('　／　');
 el.append(heading,content);
}
function verified(q){return sequenceVerified(q)&&approvedFigures(q)&&richVerified(q)&&q.renderReady===true&&q.verbatimCertified===true&&q.needsVisualReview===false&&q.sourceIssuer==='関西広域連合'&&q.attributionDisplay&&q.sourceUrl&&Array.isArray(q.choices)&&[4,5].includes(q.choices.length)&&q.choices.every(Boolean)&&allowed.has(q.officialStatus)&&((q.excludeFromAccuracyDenominator===true&&q.answer===null&&q.officialStatus==='OFFICIALLY_INVALID_ALL_CANDIDATES_CORRECT')||(q.excludeFromAccuracyDenominator!==true&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.choices.length))}
function eligible(){return records.filter(q=>($('year').value==='all'||String(q.year)===$('year').value)&&($('chapter').value==='all'||q.chapter===$('chapter').value))}
function updateCount(){$('count').textContent='この範囲で学べる問題：'+eligible().length+'問';$('start').disabled=!eligible().length}
fetch(BANK,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
if(!d||!Array.isArray(d.questions)||d.questions.length!==d.count||d.questions.some(q=>!verified(q)))throw Error('監査ゲートに通らない問題が含まれています');
records=d.questions;
[...new Set(records.map(q=>q.year))].sort().forEach(y=>{let o=document.createElement('option');o.value=String(y);o.textContent=y+'年度';$('year').append(o)});
[...new Set(records.map(q=>q.chapter))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('chapter').append(o)});
$('available').textContent='現在、原典と照合済みの公式問題は'+records.length+'問です。候補600問を監査済みと表示しません。';
$('year').onchange=updateCount;$('chapter').onchange=updateCount;updateCount();
}).catch(e=>{$('available').textContent='監査済み問題の読込に失敗しました：'+e.message;$('start').disabled=true});
$('start').onclick=()=>{subset=eligible();if(!subset.length)return;position=0;correct=0;denominator=0;excluded=0;$('setup').classList.add('hidden');$('complete').classList.add('hidden');$('quiz').classList.remove('hidden');show()};
function show(){
selected=false;const q=subset[position];$('counter').textContent=(position+1)+' / '+subset.length+'問';$('score').textContent=correct+' / '+denominator+'（採点対象）';$('questionTitle').textContent=q.year+'年度・問'+q.questionNo+'・'+q.chapter;appendRich($('question'),q.questionParts,q.question);renderRubySequence(q);renderFigures(q);
$('feedback').classList.add('hidden');$('feedback').replaceChildren();$('unknown').classList.remove('hidden');$('next').classList.add('hidden');
const choices=$('choices');choices.replaceChildren();q.choices.forEach((s,i)=>{const b=document.createElement('button');b.className='button choice';const n=document.createElement('span');n.className='num';n.textContent=i+1+'．';const t=document.createElement('span');appendRich(t,q.choicesParts?.[i],s);b.append(n,t);b.onclick=()=>answer(i);choices.append(b)});
const attr=$('attribution');attr.replaceChildren();attr.append(document.createTextNode(q.attributionDisplay+'　'),sourceLink(q.sourceUrl,'公式問題PDF'),document.createTextNode('　'),sourceLink(q.answerSourceUrl,'公式正答PDF'),document.createElement('div'),document.createTextNode(q.modificationDisclosureDisplay||'表示配置はPDFと異なります'));
}
function answer(i){
if(selected)return;selected=true;const q=subset[position],exclude=q.excludeFromAccuracyDenominator===true;
if(exclude)excluded++;else{denominator++;if(i===q.answer)correct++}
Array.from($('choices').children).forEach((el,n)=>{el.disabled=true;if(!exclude&&n===q.answer)el.classList.add('good');else if(n===i&&!exclude&&i!==q.answer)el.classList.add('bad')});
const f=$('feedback');f.classList.remove('hidden');const p=document.createElement('p');p.className='result';p.textContent=exclude?'公式不適切問題：全員正解扱い（正答率の分母から除外）':i===q.answer?'正解':'正解は '+(q.answer+1)+' 番';f.append(p);
const key=q.id||('KSAI-'+q.year+'-'+String(q.questionNo).padStart(3,'0'));
const explanation=explanationMap.get(key);
if(explanation){const section=document.createElement('div');section.className='explanation';const heading=document.createElement('strong');heading.textContent='解説';const body=document.createElement('div');body.textContent=explanation.explanation;section.append(heading,body);f.append(section)}
$('unknown').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=position===subset.length-1?'結果を見る':'次へ';$('score').textContent=correct+' / '+denominator+'（採点対象）';
}
$('unknown').onclick=()=>answer(-1);
$('next').onclick=()=>{if(!selected)return;if(++position<subset.length){show();window.scrollTo(0,0)}else finish()};
function finish(){$('quiz').classList.add('hidden');$('complete').classList.remove('hidden');$('summary').textContent=denominator?correct+' / '+denominator+'（'+Math.round(correct/denominator*100)+'%）':'採点対象なし';$('exclusion').textContent='学習'+subset.length+'問、うち採点除外'+excluded+'問';window.scrollTo(0,0)}
$('restart').onclick=()=>{$('complete').classList.add('hidden');$('setup').classList.remove('hidden')};
</script></body></html>
