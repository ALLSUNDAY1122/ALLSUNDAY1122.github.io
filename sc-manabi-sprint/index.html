<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ea"><title>学びスプリント</title></head><body style="margin:0;background:#f7f3ea;font-family:-apple-system,sans-serif"><div style="padding:48px 20px;text-align:center;color:#4a5468">読み込み中…</div><script>(async()=>{try{const r=await fetch('app.gz.b64',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.text();const u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const s=new DecompressionStream('gzip');const h=await new Response(new Blob([u]).stream().pipeThrough(s)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="padding:32px;color:#b33">読み込みに失敗しました。再読み込みしてください。</div>'}})();</script></body></html>
