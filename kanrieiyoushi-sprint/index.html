<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>管理栄養士｜学びスプリント</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--ink:#231f1a;--sub:#726b60;--accent:#ee7d3f;--accent2:#a8481c;--border:#f0e4d6;--good:#16a34a;--bad:#dc2626;--green:#2f6d50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 92px;min-height:100vh}.brand{font-size:13px;font-weight:800;color:var(--accent2)}h1{font-size:30px;margin:5px 0}.sub{color:var(--sub);margin:0 0 18px}.cta,.btn,.subject,.choice{font:inherit}.cta{width:100%;border:0;border-radius:18px;padding:18px;background:linear-gradient(135deg,var(--accent),#f29a66);color:#fff;text-align:left;font-size:20px;font-weight:900}.cta small{display:block;font-size:12px;margin-top:4px}.row{display:flex;gap:10px;margin-top:10px}.btn{flex:1;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;font-weight:800}.section{font-size:16px;font-weight:900;margin:22px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subject{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;min-height:82px}.subject strong{display:block}.subject span{display:block;color:var(--sub);font-size:12px;margin-top:6px}.hidden{display:none!important}.top{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:rgba(253,246,239,.96);padding:8px 0}.top .btn{flex:0 0 auto;padding:10px 12px}.progress{margin-left:auto;color:var(--sub);font-weight:800}.cat{font-size:12px;color:var(--green);font-weight:900;margin-top:12px}.question{font-size:21px;line-height:1.55;font-weight:850;margin:8px 0 16px}.choice{display:block;width:100%;background:#fff;border:1px solid var(--border);border-radius:15px;padding:15px;margin:8px 0;text-align:left;min-height:54px}.choice.correct{background:#f0fdf4;border-color:#86d59c}.choice.wrong{background:#fef2f2;border-color:#f2a0a0}.feedback{margin-top:14px;padding:15px;border-radius:16px;background:#fff;border:1px solid var(--border)}.memory{font-weight:900;margin:8px 0}.next{width:100%;border:0;background:var(--accent);color:#fff;border-radius:15px;padding:16px;font-weight:900;margin-top:12px}.score{font-size:48px;font-weight:950}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.metric:last-child{border:0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:10px;color:var(--sub);font-weight:800}.nav button.active{color:var(--accent2)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2f2b27;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px}.notice{font-size:12px;color:var(--sub)}@media(max-width:360px){.grid{grid-template-columns:1fr}.question{font-size:19px}}
</style>
</head><body>
<div class="app">
<main id="home">
<div class="brand">学びスプリント</div><h1>管理栄養士</h1><p class="sub">今日の12問を、本番の1点へ。</p>
<button id="resume" class="cta hidden"></button>
<button id="today" class="cta">今日の12問<small>Safariでそのまま動作する検証版</small></button>
<div class="row"><button id="weak" class="btn">苦手復習 <span id="weakN">0</span>問</button><button id="exam" class="btn">本番200問 🔒</button></div>
<div class="section">科目・領域から始める</div><div id="subjects" class="grid"></div>
</main>
<main id="quiz" class="hidden">
<div class="top"><button id="back" class="btn">戻る</button><button id="homeBtn" class="btn">ホーム</button><span id="prog" class="progress"></span></div>
<div id="cat" class="cat"></div><div id="q" class="question"></div><div id="choices"></div><button id="dont" class="btn" style="width:100%;margin-top:8px">わからない</button><div id="feedback"></div>
</main>
<main id="result" class="hidden"><div class="brand">学びスプリント</div><h1>今回の結果</h1><div class="card"><div id="score" class="score"></div><div class="metric"><span>正答率</span><strong id="rate"></strong></div><div class="metric"><span>現在の苦手</span><strong id="rweak"></strong></div></div><button id="resultMain" class="cta"></button><button id="resultHome" class="btn" style="width:100%;margin-top:10px">ホームへ</button></main>
<main id="records" class="hidden"><div class="brand">学びスプリント</div><h1>学習記録</h1><div class="card"><div class="metric"><span>累計解答</span><strong id="total"></strong></div><div class="metric"><span>正答率</span><strong id="allrate"></strong></div><div class="metric"><span>苦手</span><strong id="allweak"></strong></div></div></main>
<main id="settings" class="hidden"><div class="brand">学びスプリント</div><h1>設定</h1><div class="card"><div class="metric"><span>問題データ</span><strong>検証版12問</strong></div><div class="metric"><span>課金</span><strong>製品版でStoreKit 2</strong></div><button id="reset" class="btn" style="width:100%;margin-top:12px">学習データをリセット</button></div><p class="notice">このページはSafari価値検証用です。実課金は行いません。</p></main>
</div>
<nav id="nav" class="nav"><button data-v="home" class="active">ホーム</button><button data-v="records">学習記録</button><button data-v="settings">設定</button></nav><div id="toast" class="toast hidden"></div>
<script>
var QS=[
{id:'K1',c:'公衆栄養',t:'健康日本21',q:'成人1人1日あたりの野菜摂取量の目標として最も適切なのはどれか。',a:['150g','250g','350g','450g','550g'],x:2,m:'野菜摂取量の目標は350g。'},
{id:'K2',c:'基礎栄養',t:'エネルギー産生栄養素',q:'たんぱく質1gが産生するエネルギー量はどれか。',a:['2kcal','4kcal','7kcal','9kcal','12kcal'],x:1,m:'たんぱく質は1gあたり4kcal。'},
{id:'K3',c:'食べ物',t:'食品成分',q:'脂質1gが産生するエネルギー量はどれか。',a:['2kcal','4kcal','7kcal','9kcal','12kcal'],x:3,m:'脂質は1gあたり9kcal。'},
{id:'K4',c:'人体・疾病',t:'糖代謝',q:'血糖値を低下させる作用をもつホルモンはどれか。',a:['グルカゴン','インスリン','コルチゾール','アドレナリン','成長ホルモン'],x:1,m:'インスリンは血糖値を低下させる。'},
{id:'K5',c:'応用栄養',t:'妊娠期',q:'妊娠期に特に不足へ注意する栄養素として最も適切なのはどれか。',a:['葉酸','ビタミンK','ナトリウム','アルコール','トランス脂肪酸'],x:0,m:'妊娠前後は葉酸摂取が重要。'},
{id:'K6',c:'栄養教育',t:'行動変容',q:'行動変容ステージで、近い将来に行動を始める意思がある段階はどれか。',a:['無関心期','関心期','準備期','実行期','維持期'],x:2,m:'準備期は行動開始に近い段階。'},
{id:'K7',c:'臨床栄養',t:'高血圧',q:'高血圧の食事療法で特に制限が重要なのはどれか。',a:['食塩','水溶性食物繊維','ビタミンC','葉酸','カルシウム'],x:0,m:'高血圧では食塩摂取量を抑える。'},
{id:'K8',c:'社会・環境',t:'疫学',q:'ある時点で疾病を有する人の割合を示す指標はどれか。',a:['罹患率','有病率','死亡率','致命率','出生率'],x:1,m:'ある時点の疾病保有割合は有病率。'},
{id:'K9',c:'給食経営',t:'衛生管理',q:'大量調理施設で重要な衛生管理手法はどれか。',a:['HACCPの考え方','官能検査のみ','経験則のみ','記録を残さない','加熱温度を測らない'],x:0,m:'大量調理ではHACCPの考え方に基づく管理が重要。'},
{id:'K10',c:'公衆栄養',t:'食事調査',q:'個人の1日分の摂取内容を聞き取る代表的手法はどれか。',a:['24時間思い出し法','生態学的研究','症例対照研究','コホート研究','介入研究'],x:0,m:'1日の摂取内容の聞き取りには24時間思い出し法がある。'},
{id:'K11',c:'給食経営',t:'加熱',q:'ノロウイルス汚染のおそれがある二枚貝等の加熱条件として適切なのはどれか。',a:['60℃30秒','70℃1分','75℃1分','80℃10秒','85〜90℃90秒以上'],x:4,m:'二枚貝等は85〜90℃で90秒以上。'},
{id:'K12',c:'応用力',t:'糖尿病',q:'2型糖尿病の食事支援として最も不適切なのはどれか。',a:['適正エネルギー量を意識する','主食・主菜・副菜を組み合わせる','食物繊維を取り入れる','脂質や食塩の過剰を避ける','清涼飲料水を積極的に追加する'],x:4,m:'糖尿病では清涼飲料水などの糖質を控えめにする。'}
];
var SUBJECTS=['社会・環境','人体・疾病','食べ物','基礎栄養','応用栄養','栄養教育','臨床栄養','公衆栄養','給食経営','応用力'];
var KEY='kanriSprintLiveV1',S={weak:{},hist:[],ip:null},session=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function el(id){return document.getElementById(id)}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}homeRefresh()}function toast(s){el('toast').textContent=s;el('toast').classList.remove('hidden');setTimeout(function(){el('toast').classList.add('hidden')},1600)}
function show(v){['home','quiz','result','records','settings'].forEach(function(x){el(x).classList.add('hidden')});el(v).classList.remove('hidden');el('nav').classList.toggle('hidden',v==='quiz'||v==='result');document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.v===v)});if(v==='records')records();window.scrollTo(0,0)}
function homeRefresh(){el('weakN').textContent=Object.keys(S.weak||{}).length;if(S.ip){el('resume').classList.remove('hidden');el('resume').innerHTML='続きから<small>'+(S.ip.i+1)+' / '+S.ip.ids.length+'</small>'}else el('resume').classList.add('hidden');renderSubjects()}
function renderSubjects(){var g=el('subjects');g.innerHTML='';SUBJECTS.forEach(function(s){var n=QS.filter(function(q){return q.c===s}).length,b=document.createElement('button');b.className='subject';b.innerHTML='<strong>'+s+'</strong><span>'+n+'問（検証版）</span>';b.onclick=function(){start(QS.filter(function(q){return q.c===s}))};g.appendChild(b)})}
function start(qs){if(!qs.length){toast('この科目の問題は準備中です');return}session={ids:qs.map(function(q){return q.id}),i:0,correct:0,answered:false};S.ip=session;save();show('quiz');renderQ()}
function resume(){if(!S.ip)return;session=Object.assign({},S.ip);show('quiz');renderQ()}
function cur(){return QS.find(function(q){return q.id===session.ids[session.i]})}
function renderQ(){var q=cur();if(!q)return finish();session.answered=false;el('prog').textContent=(session.i+1)+' / '+session.ids.length;el('cat').textContent=q.c+'｜'+q.t;el('q').textContent=q.q;el('choices').innerHTML='';el('feedback').innerHTML='';el('dont').classList.remove('hidden');q.a.forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+t;b.onclick=function(){answer(i,false)};el('choices').appendChild(b)});S.ip=session;save()}
function answer(i,unknown){if(session.answered)return;var q=cur(),ok=!unknown&&i===q.x;session.answered=true;if(ok){session.correct++;if(S.weak[q.id]){S.weak[q.id].streak=(S.weak[q.id].streak||0)+1;if(S.weak[q.id].streak>=3){delete S.weak[q.id];toast('苦手から解除しました')}}}else S.weak[q.id]={streak:0};S.hist.push({id:q.id,c:q.c,ok:ok});Array.from(el('choices').children).forEach(function(b,j){b.disabled=true;if(j===q.x)b.classList.add('correct');if(!unknown&&j===i&&j!==q.x)b.classList.add('wrong')});el('dont').classList.add('hidden');el('feedback').innerHTML='<div class="feedback"><strong>'+(ok?'✓ 正解':unknown?'わからない':'✕ 不正解')+'</strong><div class="memory">'+q.m+'</div><button id="next" class="next">'+(session.i===session.ids.length-1?'結果を見る':'次の問題へ')+'</button></div>';el('next').onclick=next;S.ip=session;save()}
function next(){if(!session.answered)return;if(session.i===session.ids.length-1)return finish();session.i++;renderQ()}
function finish(){var total=session.ids.length;S.ip=null;save();el('score').textContent=session.correct+' / '+total;el('rate').textContent=Math.round(session.correct/total*100)+'%';el('rweak').textContent=Object.keys(S.weak).length+'問';var has=Object.keys(S.weak).length>0;el('resultMain').textContent=has?'苦手だけ復習':'もう12問';el('resultMain').onclick=has?startWeak:function(){start(QS)};show('result')}
function startWeak(){var qs=Object.keys(S.weak).map(function(id){return QS.find(function(q){return q.id===id})}).filter(Boolean);if(!qs.length){toast('現在の苦手はありません');return}start(qs)}
function records(){var n=S.hist.length,ok=S.hist.filter(function(x){return x.ok}).length;el('total').textContent=n+'問';el('allrate').textContent=n?Math.round(ok/n*100)+'%':'—';el('allweak').textContent=Object.keys(S.weak).length+'問'}
el('today').onclick=function(){start(QS)};el('resume').onclick=resume;el('weak').onclick=startWeak;el('exam').onclick=function(){toast('製品版で200問モードを解放します')};el('back').onclick=function(){S.ip=session;save();show('home')};el('homeBtn').onclick=function(){S.ip=session;save();show('home')};el('dont').onclick=function(){answer(null,true)};el('resultHome').onclick=function(){show('home')};el('reset').onclick=function(){if(confirm('学習データをリセットしますか？')){S={weak:{},hist:[],ip:null};save();toast('リセットしました')}};document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});homeRefresh();show('home');
</script></body></html>
