d="settings" class="hidden"><div class="brand">学びスプリント</div><h1>設定</h1><div class="card"><div class="metric"><span>問題データ</span><strong>安定版 v0.2.1</strong></div><div class="metric"><span>収録</span><strong>12 / 600問</strong></div><button id="reset" class="btn" style="width:100%;margin-top:12px">学習データをリセット</button></div></main></div><nav id="nav" class="nav"><button data-v="home" class="active">ホーム</button><button data-v="records">学習記録</button><button data-v="settings">設定</button></nav><div id="toast" class="toast hidden"></div><script>(function(){var Q=[{"id":"KN001","c":"公衆栄養","t":"健康日本21","q":"成人1人1日あたりの野菜摂取量の目標として最も適切なのはどれか。","a":["150g","250g","350g","450g","550g"],"x":2,"m":"野菜摂取量の目標は1日350g。","r":"健康日本21では、野菜を十分に摂取することが推奨されている。","d":"数値問題は基準値とセットで覚える。野菜摂取量の目標は350g/日。","y":"健康日本21"},{"id":"KN002","c":"社会・環境","t":"国民健康・栄養調査","q":"国民健康・栄養調査に関する記述として最も適切なのはどれか。","a":["学校保健安全法に基づく","健康増進法に基づく","医療法に基づく","食品衛生法に基づく","介護保険法に基づく"],"x":1,"m":"国民健康・栄養調査は健康増進法に基づく。","r":"国民の身体・栄養摂取・生活習慣の状況を把握する国の調査。","d":"公衆衛生では、調査の目的と根拠法令を対応させて整理する。","y":"健康増進法"},{"id":"KN003","c":"食べ物","t":"エネルギー換算","q":"脂質1gが産生するエネルギー量はどれか。","a":["2kcal","4kcal","7kcal","9kcal","12kcal"],"x":3,"m":"脂質は1gあたり9kcal。","r":"炭水化物4、たんぱく質4、脂質9kcal/gが基本。","d":"エネルギー換算係数は計算問題の基礎になる。","y":"栄養学基礎"},{"id":"KN004","c":"基礎栄養","t":"エネルギー産生栄養素","q":"たんぱく質1gが産生するエネルギー量はどれか。","a":["2kcal","4kcal","7kcal","9kcal","12kcal"],"x":1,"m":"たんぱく質は1gあたり4kcal。","r":"たんぱく質のエネルギー換算係数は4kcal/g。","d":"脂質9kcal/gとの取り違えに注意する。","y":"栄養学基礎"},{"id":"KN005","c":"応用栄養","t":"妊娠期","q":"妊娠期に特に不足へ注意する栄養素として最も適切なのはどれか。","a":["葉酸","ビタミンK","ナトリウム","アルコール","トランス脂肪酸"],"x":0,"m":"妊娠前後は葉酸摂取が重要。","r":"妊娠期の栄養では、時期ごとの付加量や重要栄養素を整理する。","d":"妊娠前から妊娠初期の葉酸摂取は特に重要な論点。","y":"食事摂取基準"},{"id":"KN006","c":"栄養教育","t":"行動変容","q":"行動変容ステージで、近い将来に行動を始める意思があり準備を進めている段階はどれか。","a":["無関心期","関心期","準備期","実行期","維持期"],"x":2,"m":"行動開始に近い段階は準備期。","r":"ステージに応じて支援方法を変える。","d":"無関心→関心→準備→実行→維持の順を押さえる。","y":"行動変容ステージモデル"},{"id":"KN007","c":"臨床栄養","t":"高血圧","q":"高血圧の食事療法で過剰摂取を避けることが特に重要なのは en'},1500)}function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),v=a[i];a[i]=a[j];a[j]=v}return a}function pk(a,n){var u=[],w=[],r=[];for(var i=0;i<a.length;i++){var q=a[i];if(!S.seen[q.id])u.push(q);else if(S.weak[q.id])w.push(q);else r.push(q)}return sh(u).concat(sh(w),sh(r)).slice(0,Math.min(n||12,a.length))}function vw(v){var A=['home','quiz','result','records','settings'];for(var i=0;i<A.length;i++)E(A[i]).className=A[i]===v?'':'hidden';E('nav').className=(v==='quiz'||v==='result')?'nav hidden':'nav';var b=document.querySelectorAll('.nav button');for(i=0;i<b.length;i++)b[i].className=b[i].getAttribute('data-v')===v?'active':'';if(v==='records')rec();window.scrollTo(0,0)}function rf(){S.weak=S.weak||{};S.seen=S.seen||{};S.hist=S.hist||[];S.comp=S.comp||{};E('weakN').textContent=Object.keys(S.weak).length;var u=0;for(var i=0;i<Q.length;i++)if(!S.seen[Q[i].id])u++;E('unseenN').textContent=u;if(S.ip){E('resume').className='cta';E('resume').innerHTML='続きから<small>'+(S.ip.i+1)+' / '+S.ip.ids.length+'</small>'}else E('resume').className='cta hidden';var g=E('subjects');g.innerHTML='';for(i=0;i<C.length;i++)(function(c){var a=[];for(var j=0;j<Q.length;j++)if(Q[j].c===c)a.push(Q[j]);var b=document.createElement('button');b.className='subject';b.innerHTML='<strong>'+c+'</strong><span>収録 '+a.length+' / 目標 '+T[c]+'問・完答 '+(S.comp[c]||0)+'回</span>';b.onclick=function(){st(pk(a,12),c,c)};g.appendChild(b)})(C[i])}function st(a,k,l){if(!a.length){tt('この科目の問題は準備中です');return}X={k:k,l:l,ids:[],i:0,ok:0,answered:false};for(var i=0;i<a.length;i++)X.ids.push(a[i].id);S.ip=X;sv();vw('quiz');rd()}function cu(){if(!X)return null;for(var i=0;i<Q.length;i++)if(Q[i].id===X.ids[X.i])return Q[i];return null}function rd(){var q=cu();if(!q){fin();return}E('prog').textContent=(X.i+1)+' / '+X.ids.length;E('cat').textContent=q.c+'｜'+q.t;E('q').textContent=q.q;E('choices').innerHTML='';E('feedback').innerHTML='';E('dont').className='btn';for(var i=0;i<q.a.length;i++)(function(n){var b=document.createElement('button');b.className='choice';b.innerHTML='<strong>'+(n+1)+'.</strong> '+q.a[n];b.onclick=function(){ans(n,false)};E('choices').appendChild(b)})(i);X.answered=false;S.ip=X;sv()}function ans(n,dk){if(!X||X.answered)return;var q=cu(),ok=!dk&&n===q.x;X.answered=true;if(ok){X.ok++;if(S.weak[q.id]){S.weak[q.id].st=(S.weak[q.id].st||0)+1;if(S.weak[q.id].st>=3)delete S.weak[q.id]}}else{var o=S.weak[q.id]||{n:0};S.weak[q.id]={st:0,n:(o.n||0)+1}}S.seen[q.id]=1;S.hist.push({id:q.id,c:q.c,ok:ok});var b=E('choices').children;for(var i=0;i<b.length;i++){b[i].disabled=true;if(i===q.x)b[i].className+=' correct';if(!dk&&i===n&&i!==q.x)b[i].className+=' wrong'}E('dont').className='btn hidden';E('feedback').innerHTML='<div class="feedback"><strong>'+(ok?'✓ 正解':'✕ '+(dk?'わからない':'不正解'))+'</strong><div class="memory">'+q.m+'</div><div>'+q.r+'</div><details><summary>詳しい解説</summary><p>'+q.d+'</p><p class="muted">基準：'+q.y+'</p></details><button id="next" class="next">'+(X.i===X.ids.length-1?'結果を見る':'次の問題へ')+'</button></div>';E('next').onclick=nx;S.ip=X;sv()}function nx(){if(!X||!X.answered)return;if(X.i>=X.ids.length-1){fin();return}X.i++;rd()}function fin(){if(!X)return;var n=X.ids.length;if(X.k===X.l)S.comp[X.l]=(S.comp[X.l]||0)+1;S.ip=null;sv();E('score').textContent=X.ok+' / '+n;E('rate').textContent=Math.round(X.ok/n*100)+'%';E('rweak').textContent=Object.keys(S.weak).length+'問';E('resultMain').textContent=Object.keys(S.weak).length?'苦手だけ復習':'もう12問';E('resultMain').onclick=Object.keys(S.weak).length?wk:td;vw('result')}function td(){st(pk(Q,12),'today','今日の12問')}function wk(){var a=[];for(var id in S.weak)for(var i=0;i<Q.length;i++)if(Q[i].id===id)a.push(Q[i]);if(!a.length){tt('現在の苦手はありません');return}st(a.slice(0,12),'weak','苦手復習')}function un(){var a=[];for(var i=0;i<Q.length;i++)if(!S.seen[Q[i].id])a.push(Q[i]);if(!a.length){tt('収録済み問題はすべて学習済みです');return}st(sh(a).slice(0,12),'unseen','未出題')}function rs(){if(!S.ip)return;X=JSON.parse(JSON.stringify(S.ip));if(X.answered){if(X.i>=X.ids.length-1){fin();return}X.i++;X.answered=false}S.ip=X;sv();vw('quiz');rd()}function rec(){var h=S.hist,o=0;for(var i=0;i<h.length;i++)if(h[i].ok)o++;E('total').textContent=h.length+'問';E('allrate').textContent=h.length?Math.round(o/h.length*100)+'%':'—';E('allweak').textContent=Object.keys(S.weak).length+'問';var d=E('bycat');d.innerHTML='';for(i=0;i<C.length;i++){var c=C[i],n=0,x=0;for(var j=0;j<h.length;j++)if(h[j].c===c){n++;if(h[j].ok)x++}var k=document.createElement('div');k.className='card';k.innerHTML='<div class="metric"><span>'+c+'</span><strong>'+(n?x+'/'+n+'・'+Math.round(x/n*100)+'%':'未学習')+'</strong></div>';d.appendChild(k)}}E('today').onclick=td;E('resume').onclick=rs;E('weak').onclick=wk;E('unseen').onclick=un;E('exam').onclick=function(){tt('本番200問は600問完成後に開放します')};E('back').onclick=function(){vw('home')};E('homeBtn').onclick=function(){vw('home')};E('dont').onclick=function(){ans(null,true)};E('resultHome').onclick=function(){vw('home')};var nb=document.querySelectorAll('.nav button');for(var i=0;i<nb.length;i++)nb[i].onclick=function(){vw(this.getAttribute('data-v'))};E('reset').onclick=function(){if(confirm('学習データを消去しますか？')){S={weak:{},seen:{},hist:[],comp:{},ip:null};sv();vw('home')}};rf();vw('home')})();</script></body></html>
