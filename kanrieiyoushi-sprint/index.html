<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>管理栄養士｜学びスプリント</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><main id="home"><div class="brand">学びスプリント</div><h1>管理栄養士</h1><p class="sub">今日の12問を、本番の1点へ。</p><div id="status" class="notice"></div><button id="resume" class="cta hidden"></button><button id="today" class="cta">今日の12問<small>未出題を優先して出題</small></button><div class="row"><button id="weak" class="btn">苦手 <span id="weakN">0</span>問</button><button id="unseen" class="btn">未出題 <span id="unseenN">0</span>問</button></div><button id="exam" class="btn" style="width:100%;margin-top:10px">本番200問 🔒</button><div class="section">科目・領域から始める</div><div id="subjects" class="grid"></div></main><main id="quiz" class="hidden"><div class="top"><button id="back" class="btn">戻る</button><button id="homeBtn" class="btn">ホーム</button><span id="prog" class="progress"></span></div><div id="cat" class="cat"></div><div id="q" class="question"></div><div id="choices"></div><button id="dont" class="btn" style="width:100%;margin-top:8px">わからない</button><div id="feedback"></div></main><main id="result" class="hidden"><div class="brand">学びスプリント</div><h1>今回の結果</h1><div class="card"><div id="score" class="score"></div><div class="metric"><span>正答率</span><strong id="rate"></strong></div><div class="metric"><span>現在の苦手</span><strong id="rweak"></strong></div></div><button id="resultMain" class="cta"></button><button id="resultHome" class="btn" style="width:100%;margin-top:10px">ホームへ</button></main><main id="records" class="hidden"><div class="brand">学びスプリント</div><h1>学習記録</h1><div class="card"><div class="metric"><span>累計解答</span><strong id="total"></strong></div><div class="metric"><span>正答率</span><strong id="allrate"></strong></div><div class="metric"><span>苦手</span><strong id="allweak"></strong></div></div><div id="bycat"></div></main><main id="settings" class="hidden"><div class="brand">学びスプリント</div><h1>設定</h1><div class="card"><div class="metric"><span>問題データ</span><strong>v0.2</strong></div><div class="metric"><span>監査</span><strong>12/12承認済み</strong></div><div class="metric"><span>課金</span><strong>製品版StoreKit 2</strong></div><button id="reset" class="btn" style="width:100%;margin-top:12px">学習データをリセット</button></div><p class="notice">Safari開発版です。本番200問は600問データ完成後に有効化します。</p></main></div><nav id="nav" class="nav"><button data-v="home" class="active">ホーム</button><button data-v="records">学習記録</button><button data-v="settings">設定</button></nav><div id="toast" class="toast hidden"></div><script src="questions.js"></script><script src="app.js"></script></body></html>
