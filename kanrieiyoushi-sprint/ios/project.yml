name: KanriEiyoushiSprint
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
packages:
  LearningSprintCore:
    path: ../../native-ios/LearningSprintCore
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MN3D2ZM44N
targets:
  KanriEiyoushiSprint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KanriEiyoushiSprint
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LearningSprintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanrieiyoushi
        PRODUCT_NAME: KanriEiyoushiSprint
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 管理栄養士 学びスプリント
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
  KanriEiyoushiSprintTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KanriEiyoushiSprintTests
    dependencies:
      - target: KanriEiyoushiSprint
      - package: LearningSprintCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanrieiyoushi.tests
        CODE_SIGNING_ALLOWED: NO
  KanriEiyoushiSprintUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KanriEiyoushiSprintUITests
    dependencies:
      - target: KanriEiyoushiSprint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanrieiyoushi.uitests
        CODE_SIGNING_ALLOWED: NO
schemes:
  KanriEiyoushiSprint:
    build:
      targets:
        KanriEiyoushiSprint: all
        KanriEiyoushiSprintTests: [test]
        KanriEiyoushiSprintUITests: [test]
    test:
      targets:
        - KanriEiyoushiSprintTests
        - KanriEiyoushiSprintUITests
