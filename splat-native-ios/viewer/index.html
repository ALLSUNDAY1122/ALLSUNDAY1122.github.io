<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#050607">
  <meta name="description" content="Scan Labで公開された3D Gaussian Splatをブラウザで閲覧します。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Scan Lab">
  <meta property="og:title" content="Scan Lab 3D Viewer">
  <meta property="og:description" content="Scan Labで公開された3D Gaussian Splatをブラウザで閲覧します。">
  <meta property="og:url" content="https://allsunday1122.github.io/splat-native-ios/viewer/">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Scan Lab 3D Viewer">
  <meta name="twitter:description" content="Scan Labで公開された3D Gaussian Splatをブラウザで閲覧します。">
  <meta name="twitter:image" content="">
  <meta name="twitter:image:alt" content="">
  <link rel="canonical" href="https://allsunday1122.github.io/splat-native-ios/viewer/">
  <title>Scan Lab 3D Viewer</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <section id="viewer" aria-label="3D viewer"></section>
    <header class="topbar">
      <a class="brand" href="../" aria-label="Scan Lab">Scan Lab</a>
      <button id="share" class="icon-button" type="button" aria-label="この3Dを共有">共有</button>
    </header>
    <section id="card" class="card" hidden>
      <p id="author" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="caption" class="caption"></p>
      <p id="location" class="meta"></p>
      <p id="likes" class="meta"></p>
    </section>
    <section id="status" class="status" role="status" aria-live="polite">
      <img id="status-preview" class="status-preview" alt="" hidden>
      <div class="status-overlay" aria-hidden="true"></div>
      <div class="status-content">
        <div class="spinner" aria-hidden="true"></div>
        <p id="status-text">共有情報を読み込んでいます</p>
      </div>
    </section>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
