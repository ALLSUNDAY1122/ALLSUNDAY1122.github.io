<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>D2 browser viewer runtime harness</title>
<script>
const scenario = new URLSearchParams(location.search).get('scenario') || 'success';
window.__viewerHarness = { scenario, fetchCount: 0, sceneCount: 0, retryClicks: 0 };
const item = { title:'Fixture Scan', modelUrl:'http://127.0.0.1:8765/fixture.spz', author:{handle:'fixture',displayName:'Fixture'}, likeCount:3 };
window.fetch = async () => {
  const h = window.__viewerHarness;
  h.fetchCount += 1;
  if (scenario === 'terminal404') return new Response('{}', {status:404, headers:{'Content-Type':'application/json'}});
  if (scenario === 'metadataRetry' && h.fetchCount <= 2) return new Response('{}', {status:503, headers:{'Content-Type':'application/json'}});
  return new Response(JSON.stringify({item}), {status:200, headers:{'Content-Type':'application/json'}});
};
window.addEventListener('DOMContentLoaded', () => {
  const status = document.querySelector('#status');
  const retry = document.querySelector('#retry');
  const observer = new MutationObserver(() => {
    document.body.dataset.status = status.classList.contains('hidden') ? 'success' : (status.classList.contains('error') ? 'error' : 'loading');
    document.body.dataset.message = document.querySelector('#status-text').textContent;
    if ((scenario === 'metadataRetry' || scenario === 'sceneRetry') && !retry.hidden && !retry.disabled && window.__viewerHarness.retryClicks === 0) {
      window.__viewerHarness.retryClicks += 1;
      setTimeout(() => retry.click(), 20);
    }
  });
  observer.observe(status, {attributes:true, subtree:true, childList:true, characterData:true});
});
</script>
<script type="importmap">{"imports":{"@mkkellogg/gaussian-splats-3d":"./splats-stub.js"}}</script>
</head>
<body data-status="boot">
<main id="app">
<section id="viewer"></section>
<button id="share" type="button">共有</button>
<section id="card" hidden><p id="author"></p><h1 id="title"></h1><p id="caption"></p><p id="location"></p><p id="likes"></p></section>
<section id="status" role="status" aria-live="polite" aria-busy="true"><p id="status-text">boot</p><p id="status-detail" hidden></p><button id="retry" type="button" hidden>もう一度試す</button></section>
</main>
<script type="module" src="../../../viewer/viewer.js"></script>
</body>
</html>
