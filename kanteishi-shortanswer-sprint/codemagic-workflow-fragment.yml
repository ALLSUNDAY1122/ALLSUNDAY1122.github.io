  kanteishi-shortanswer-ios:
    name: 不動産鑑定士短答式 - Internal TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.allsunday1122.kanteishishortanswer
      vars:
        BUNDLE_ID: jp.allsunday1122.kanteishishortanswer
        EXPECTED_CODEMAGIC_PROFILE: kanteishishortanswer_appstore
        XCODE_PROJECT: kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer.xcodeproj
        XCODE_SCHEME: KanteishiShortAnswer
        EXPECTED_APPICON_SHA256: 679f3493524dd2cf71126303c998b15395c70ff19f224d158a760ee3c2a395f1
      xcode: latest
    scripts:
      - name: Require registered App Store subscription Product ID
        script: |
          set -euo pipefail
          test -n "${PREMIUM_PRODUCT_ID:-}" || { echo 'PREMIUM_PRODUCT_ID is not configured yet.'; exit 2; }
          echo "Expected signing profile: $EXPECTED_CODEMAGIC_PROFILE"
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Prepare audited release project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios"
          python3 -c 'from pathlib import Path; import os; p=Path("project.yml"); t=p.read_text(encoding="utf-8"); b=os.environ["CM_BUILD_NUMBER"]; pid=os.environ["PREMIUM_PRODUCT_ID"].strip(); assert b and pid; t=t.replace("CURRENT_PROJECT_VERSION: \"1\"", f"CURRENT_PROJECT_VERSION: \"{b}\"", 1); t=t.replace("PREMIUM_PRODUCT_ID: \"\"", f"PREMIUM_PRODUCT_ID: \"{pid}\"", 1); p.write_text(t, encoding="utf-8")'
          xcodegen generate
      - name: Verify canonical release inputs
        script: |
          set -euo pipefail
          APPICON="$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          PROD="$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Resources/questions.production.json"
          PLIST="$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios/KanteishiShortAnswer/Info.plist"
          test -f "$APPICON"
          test "$(shasum -a 256 "$APPICON" | awk '{print $1}')" = "$EXPECTED_APPICON_SHA256"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert len(p["questions"]) == 240; assert p["productionTargetCount"] == 240; assert {q["edition"] for q in p["questions"]} == {2024,2025,2026}; assert all(len(q["choices"]) == 5 for q in p["questions"]); print("PASS: canonical 240-question release payload")' "$PROD"
          grep -q '<key>PremiumProductID</key>' "$PLIST"
          grep -q "PREMIUM_PRODUCT_ID: \"$PREMIUM_PRODUCT_ID\"" "$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios/project.yml"
      - name: Apply App Store signing profiles for Internal TestFlight only
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/kanteishi-shortanswer-sprint/ios"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
