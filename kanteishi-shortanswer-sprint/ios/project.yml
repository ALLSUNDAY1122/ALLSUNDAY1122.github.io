name: KanteishiShortAnswer
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: jp.allsunday1122
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  KanteishiShortAnswer:
    type: application
    platform: iOS
    sources:
      - path: KanteishiShortAnswer
        excludes:
          - PrivacyInfo.xcprivacy
          - Info.plist
          - Resources
      - path: KanteishiShortAnswer/Resources/questions.production.json
        buildPhase: resources
      - path: KanteishiShortAnswer/Resources/questions.prototype.json
        buildPhase: resources
      - path: KanteishiShortAnswer/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanteishishortanswer
        PRODUCT_NAME: KanteishiShortAnswer
        INFOPLIST_FILE: KanteishiShortAnswer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DEVELOPMENT_TEAM: "MN3D2ZM44N"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PREMIUM_PRODUCT_ID: ""
    scheme:
      testTargets:
        - KanteishiShortAnswerTests
        - KanteishiShortAnswerUITests

  KanteishiShortAnswerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KanteishiShortAnswerTests
    dependencies:
      - target: KanteishiShortAnswer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanteishishortanswer.tests
        DEVELOPMENT_TEAM: "MN3D2ZM44N"

  KanteishiShortAnswerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KanteishiShortAnswerUITests
    dependencies:
      - target: KanteishiShortAnswer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanteishishortanswer.uitests
        DEVELOPMENT_TEAM: "MN3D2ZM44N"
