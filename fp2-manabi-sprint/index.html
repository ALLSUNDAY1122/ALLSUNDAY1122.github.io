<!doctype html>

<title>FP2級｜学びスプリント</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--ink:#231f1a;--sub:#726b60;--accent:#ee7d3f;--accent-dark:#a8481c;--accent-soft:#fdeee2;--good:#16a34a;--good-soft:#f0fdf4;--bad:#dc2626;--bad-soft:#fef2f2;--border:#f0e4d6;--radius:18px;--radius-sm:14px;--shadow-sm:0 1px 3px rgba(60,45,20,.08);--shadow-md:0 6px 20px rgba(168,72,28,.18);--fs-base:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:var(--fs-base);-webkit-font-smoothing:antialiased;overflow-x:hidden}button{font:inherit;color:inherit}button:focus-visible,summary:focus-visible{outline:3px solid rgba(238,125,63,.3);outline-offset:2px}.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}.top{padding:calc(16px + env(safe-area-inset-top)) 16px 6px}.brand{font-size:.72rem;color:var(--sub);font-weight:800;letter-spacing:.06em}.title{font-size:1.65rem;font-weight:900;margin:5px 0 2px}.tagline{font-size:.86rem;color:var(--sub);margin:0;line-height:1.5}.badge{display:inline-flex;margin-top:10px;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:5px 9px;font-size:.7rem;font-weight:800}.section{padding:12px 16px}.section h2{font-size:.93rem;margin:0 0 10px}.card,.action,.chapter{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}.resume{display:none;margin:6px 16px 4px;padding:16px;border:0;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent-dark),#7a3313);color:#fff;width:calc(100% - 32px);text-align:left;box-shadow:var(--shadow-md)}.resume.show{display:block}.resume strong{font-size:1rem}.resume small{display:block;margin-top:4px;opacity:.82}.action{width:100%;padding:16px;text-align:left;display:flex;align-items:center;gap:12px}.action:active,.chapter:active,.choice:active,.nav button:active{transform:scale(.985)}.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);font-weight:900;flex:0 0 auto}.action strong{display:block;font-size:1rem}.action span{display:block;color:var(--sub);font-size:.77rem;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chapter{padding:14px;text-align:left;min-height:105px}.chapter b{display:block;font-size:.88rem;line-height:1.35}.chapter small{display:block;margin-top:7px;color:var(--sub);font-size:.72rem}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px 8px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm)}.stat strong{display:block;font-size:1.25rem;color:var(--accent-dark)}.stat span{font-size:.68rem;color:var(--sub)}.screen{display:none}.screen.active{display:block}.quizhead{position:sticky;top:0;z-index:10;background:rgba(253,246,239,.96);backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}.homebtn{min-width:44px;min-height:44px;border:1px solid var(--border);background:#fff;border-radius:12px;font-weight:800}.quizmeta{flex:1}.quizmeta b{display:block;font-size:.86rem}.quizmeta span{font-size:.72rem;color:var(--sub)}.counter{font-size:.8rem;font-weight:900}.progress{height:6px;margin:0 16px 13px;border-radius:999px;background:#f2e6d8;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.qcard{margin:0 16px;padding:17px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}.qtag{display:inline-flex;background:var(--accent-soft);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:.7rem;font-weight:800}.qtext{font-size:1.13rem;line-height:1.62;font-weight:800;margin:13px 0 15px}.choices{display:grid;gap:9px}.choice{width:100%;min-height:58px;padding:10px 12px;display:grid;grid-template-columns:32px 1fr;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff}.num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:900}.choice.correct{border-color:#86d3a5;background:var(--good-soft)}.choice.correct .num{background:var(--good);color:#fff}.choice.wrong{border-color:#f0a7a7;background:var(--bad-soft)}.choice.wrong .num{background:var(--bad);color:#fff}.choice.dim{opacity:.55}.unknown{width:100%;min-height:48px;margin-top:10px;border:1.5px dashed #d8c7b6;background:#fffaf5;color:var(--sub);border-radius:var(--radius-sm);font-weight:800}.feedback{display:none;margin-top:14px;padding:14px;border-radius:var(--radius-sm)}.feedback.show{display:block}.feedback.ok{background:var(--good-soft);border:1px solid #bce8cb}.feedback.ng{background:var(--bad-soft);border:1px solid #f5c5c5}.feedback h3{margin:0 0 8px;font-size:1rem}.memory{font-weight:900;font-size:.88rem;line-height:1.55}.reason{font-size:.8rem;line-height:1.65;margin-top:7px;color:#514a42}.feedback details{margin-top:10px;border-top:1px solid rgba(114,107,96,.16);padding-top:8px}.feedback summary{min-height:42px;display:flex;align-items:center;font-size:.8rem;color:var(--accent-dark);font-weight:900;cursor:pointer}.detail{font-size:.78rem;line-height:1.7;color:#5b544c}.next{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900}.result{margin:18px 16px;padding:22px;text-align:center}.score{font-size:3rem;font-weight:950;color:var(--accent-dark)}.muted{color:var(--sub);font-size:.8rem;line-height:1.6}.stack{display:grid;gap:9px;margin-top:16px}.secondary{min-height:50px;border:1px solid var(--border);border-radius:14px;background:#fff;font-weight:850}.primary{min-height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900}.settings{padding:14px 16px}.setting{padding:15px;margin-bottom:10px}.setting h3{font-size:.86rem;margin:0 0 10px}.seg{display:flex;gap:7px}.seg button{flex:1;min-height:42px;border:1px solid var(--border);border-radius:10px;background:#fff}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.note{font-size:.73rem;color:var(--sub);line-height:1.7}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:calc(68px + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}.nav button{border:0;background:transparent;border-radius:12px;color:var(--sub);font-size:.7rem;font-weight:800}.nav button.on{color:var(--accent-dark);background:var(--accent-soft)}body.large{--fs-base:18px}body.xlarge{--fs-base:20px}@media(max-width:380px){.grid{grid-template-columns:1fr}.title{font-size:1.5rem}.qtext{font-size:1.06rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app">
<section id="home" class="screen active">
  <div class="top"><div class="brand">学びスプリント</div><div class="title">FP2級</div><p class="tagline">今日も1問、力に変える。</p><span class="badge">FP2 v1.3｜GitHub復旧・UI検証版</span></div>
  <button id="resume" class="resume"><strong>続きから</strong><small id="resumeMeta"></small></button>
  <div class="section"><button class="action" id="startAll"><span class="icon">8</span><span><strong>復旧確認 8問</strong><span>短い演習でFP2 v1.3の操作を確認</span></span></button></div>
  <div class="section"><button class="action" id="startWeak"><span class="icon">復</span><span><strong>苦手復習</strong><span id="weakMeta">現在の苦手 0問</span></span></button></div>
  <div class="section"><h2>分野から解く</h2><div id="chapters" class="grid"></div></div>
  <div class="section"><h2>学習状況</h2><div class="statgrid"><div class="stat"><strong id="answeredStat">0</strong><span>回答数</span></div><div class="stat"><strong id="rateStat">—</strong><span>正答率</span></div><div class="stat"><strong id="weakStat">0</strong><span>苦手</span></div></div></div>
</section>
<section id="quiz" class="screen"><div class="quizhead"><button class="homebtn" id="quizHome" aria-label="ホームへ戻る">⌂</button><div class="quizmeta"><b id="quizTitle">FP2級</b><span id="quizSub"></span></div><div class="counter" id="counter"></div></div><div class="progress"><i id="bar"></i></div><div class="qcard"><span class="qtag" id="qtag"></span><div class="qtext" id="qtext"></div><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div id="feedback" class="feedback"><h3 id="feedbackTitle"></h3><div class="memory" id="memory"></div><div class="reason" id="reason"></div><details><summary>詳しい解説を見る</summary><div id="detail" class="detail"></div></details><button id="next" class="next">次の問題へ</button></div></div></section>
<section id="result" class="screen"><div class="result card"><div class="muted">今回の結果</div><div id="resultScore" class="score"></div><div id="resultMeta" class="muted"></div><div class="stack"><button id="reviewWrong" class="primary">苦手だけ復習</button><button id="again" class="secondary">もう8問</button><button id="resultHome" class="secondary">ホームへ戻る</button></div></div></section>
<section id="history" class="screen"><div class="top"><div class="brand">学習記録</div><div class="title">積み上げ</div><p class="tagline">短い反復を見える化します。</p></div><div class="section"><div class="statgrid"><div class="stat"><strong id="hAnswered">0</strong><span>総回答</span></div><div class="stat"><strong id="hCorrect">0</strong><span>正解</span></div><div class="stat"><strong id="hWeak">0</strong><span>苦手</span></div></div></div><div class="section"><div class="card" style="padding:15px"><div class="note">苦手問題は、苦手復習中に3連続正解すると自動解除されます。</div></div></div></section>
<section id="settings" class="screen"><div class="top"><div class="brand">設定</div><div class="title">読みやすさ</div></div><div class="settings"><div class="setting card"><h3>文字サイズ</h3><div class="seg"><button data-size="normal">標準</button><button data-size="large">大</button><button data-size="xlarge">特大</button></div></div><div class="setting card"><h3>教材情報</h3><div class="note">UI基準：FP2 v1.3<br>公開状態：Safari UI検証版（独自表現8問）<br>製品版データは別途600問監査後に置換します。</div></div><div class="setting card"><h3>学習状態</h3><button id="reset" class="secondary" style="width:100%">学習記録をリセット</button></div></div></section>
<nav class="nav" id="nav"><button data-screen="home" class="on">ホーム</button><button data-screen="history">学習記録</button><button data-screen="settings">設定</button></nav>
</div>
<script>
const QUESTIONS=[
{id:'FP2-R01',domain:'ライフプランニング',q:'将来の目標額を、毎年一定額ずつ積み立てながら一定利率で準備するとき、目標額から毎年の積立額を求めるために使う係数はどれか。',c:['終価係数','現価係数','減債基金係数','資本回収係数'],a:2,m:'目標額から毎年の積立額を逆算するのは「減債基金係数」。',r:'将来の目標額を基準に、必要な定期積立額を求める用途だからです。',d:'終価係数は現在資金の将来価値、現価係数は将来額の現在価値、資本回収係数は元本から毎年の受取額・返済額を求めるときに使います。'},
{id:'FP2-R02',domain:'ライフプランニング',q:'夫婦がそれぞれ別々に健康保険の被保険者である。妻が出産した場合の出産に関する給付として最も適切なのはどれか。',c:['妻の資格に基づく出産育児一時金が支給される','夫と妻の両方から同額の一時金が支給される','夫に家族出産育児一時金だけが支給される','被保険者本人の出産は給付対象外である'],a:0,m:'本人が被保険者なら、本人の資格に基づく出産育児一時金。',r:'家族出産育児一時金は、被扶養者である家族の出産に対する給付です。',d:'夫婦がそれぞれ被保険者であれば、妻は自身の被保険者資格に基づく給付を受けます。夫の被扶養者としての給付と重ねて受ける仕組みではありません。'},
{id:'FP2-R03',domain:'ライフプランニング',q:'雇用保険の基本手当日額の基礎となる賃金日額について、原則的な考え方として適切なのはどれか。',c:['離職前1年間の給与と賞与を365で割る','離職前6か月の賃金（原則として賞与等を除く）を180で割る','離職時の月給だけを30で割る','標準報酬月額を30で割る'],a:1,m:'賃金日額は、原則「離職前6か月の賃金÷180」。賞与等は除く。',r:'基本手当は離職直前の通常の賃金を基礎に算定するためです。',d:'臨時に支払われる賃金や一定の賞与は、通常の賃金日額の計算から除かれます。期間と除外項目をセットで覚えます。'},
{id:'FP2-R04',domain:'ライフプランニング',q:'国民年金の学生納付特例を利用した期間について、追納しないままの場合の扱いとして適切なのはどれか。',c:['受給資格期間にも年金額にも算入されない','受給資格期間には算入されるが、年金額には原則反映されない','全額免除と同じく年金額に2分の1反映される','必ず10年後に自動追納される'],a:1,m:'学生納付特例は「資格期間には入るが、追納しなければ年金額には反映されない」。',r:'保険料免除とは年金額への反映方法が異なります。',d:'学生納付特例の承認期間は老齢基礎年金の受給資格期間には算入されますが、追納しなければ年金額の計算には反映されません。'},
{id:'FP2-R05',domain:'ライフプランニング',q:'老齢厚生年金を繰下げる人に在職老齢年金による支給停止部分がある場合、その停止部分の繰下げ増額の扱いとして適切なのはどれか。',c:['停止部分も全額増額対象','停止部分は増額対象にならない','老齢基礎年金まで停止される','繰下げ自体ができない'],a:1,m:'在職老齢年金で支給停止された部分は、繰下げ増額の対象外。',r:'実際に支給対象となる部分を基礎に繰下げ増額が計算されるためです。',d:'在職老齢年金の支給調整と繰下げ増額は別の仕組みですが、支給停止となる部分まで繰下げ加算が付くわけではありません。'},
{id:'FP2-R06',domain:'ライフプランニング',q:'障害厚生年金の年金額を計算するとき、被保険者期間の扱いとして原則最も適切なのはどれか。',c:['障害認定日の属する月までの期間を基礎とする','65歳までの見込み期間をすべて加える','受給開始後の被保険者期間も毎月自動加算する','初診日前の期間はすべて除外する'],a:0,m:'障害厚生年金の額は、原則として障害認定日の属する月までの被保険者期間が基礎。',r:'障害認定時点までの加入記録を基準に年金額を計算する考え方です。',d:'障害認定日の後に厚生年金へ加入していた期間が、その障害厚生年金の当初の額計算へそのまま追加されるわけではありません。'},
{id:'FP2-R07',domain:'ライフプランニング',q:'iDeCo（個人型確定拠出年金）の運用について適切なのはどれか。',c:['掛金合計額は制度として必ず元本保証される','運用結果によって受取額が掛金合計額を下回ることがある','運用商品は国が一つに固定する','加入者は運用商品を選べない'],a:1,m:'iDeCoは確定拠出型。運用結果によっては元本割れもあり得る。',r:'将来の給付額があらかじめ確定している制度ではないためです。',d:'元本確保型の商品を選べる場合はありますが、制度そのものが掛金合計額を最低保証するわけではありません。'},
{id:'FP2-R08',domain:'タックスプランニング',q:'企業型確定拠出年金で加入者本人がマッチング拠出した掛金について、所得税上の扱いとして適切なのはどれか。',c:['医療費控除の対象','雑損控除の対象','小規模企業共済等掛金控除の対象','配当控除の対象'],a:2,m:'企業型DCの加入者掛金（マッチング拠出）は「小規模企業共済等掛金控除」。',r:'確定拠出年金の加入者本人が負担する一定の掛金は、この所得控除の対象です。',d:'必要経費や税額控除ではなく所得控除です。iDeCoの加入者掛金も同じ控除区分で整理すると覚えやすくなります。'}
];
const KEY='fp2_manabi_sprint_restore_v130';
let state={answered:0,correct:0,weak:{},history:[],resume:null,font:'normal'};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let session=[],idx=0,score=0,answered=false,mode='all',wrongThis=[];
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.screen===id));$('nav').style.display=(id==='quiz'||id==='result')?'none':'grid';if(id==='home')renderHome();if(id==='history')renderHistory();}
function renderHome(){const domains=[...new Set(QUESTIONS.map(q=>q.domain))];$('chapters').innerHTML=domains.map(d=>`<button class="chapter" data-domain="${d}"><b>${d}</b><small>${QUESTIONS.filter(q=>q.domain===d).length}問｜復旧確認版</small></button>`).join('');document.querySelectorAll('.chapter').forEach(b=>b.onclick=()=>start(QUESTIONS.filter(q=>q.domain===b.dataset.domain),b.dataset.domain));const w=Object.keys(state.weak||{}).length;$('weakMeta').textContent=`現在の苦手 ${w}問`;$('weakStat').textContent=w;$('answeredStat').textContent=state.answered||0;$('rateStat').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'—';if(state.resume&&state.resume.ids&&state.resume.index<state.resume.ids.length){$('resume').classList.add('show');$('resumeMeta').textContent=`${state.resume.title}｜${state.resume.index+1}/${state.resume.ids.length}`;}else $('resume').classList.remove('show');}
function start(qs,title='復旧確認 8問',startIndex=0){if(!qs.length){alert('対象の問題はありません');return}session=qs;idx=startIndex;score=0;wrongThis=[];mode=title;show('quiz');renderQuestion();}
function renderQuestion(){answered=false;const q=session[idx];$('quizTitle').textContent=mode;$('quizSub').textContent=q.domain;$('counter').textContent=`${idx+1}/${session.length}`;$('bar').style.width=`${idx/session.length*100}%`;$('qtag').textContent=q.domain;$('qtext').textContent=q.q;$('feedback').className='feedback';$('choices').innerHTML=q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${c}</span></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));$('unknown').disabled=false;$('unknown').style.display='block';state.resume={title:mode,ids:session.map(x=>x.id),index:idx};save();}
function answer(sel){if(answered)return;answered=true;const q=session[idx],ok=sel===q.a;state.answered=(state.answered||0)+1;if(ok){state.correct=(state.correct||0)+1;score++;if(state.weak&&state.weak[q.id]){state.weak[q.id].streak=(state.weak[q.id].streak||0)+1;if(state.weak[q.id].streak>=3)delete state.weak[q.id];}}else{state.weak=state.weak||{};state.weak[q.id]={streak:0,last:Date.now()};wrongThis.push(q.id)}save();document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===sel)b.classList.add('wrong');else b.classList.add('dim')});$('unknown').disabled=true;$('unknown').style.display='none';$('feedback').className='feedback show '+(ok?'ok':'ng');$('feedbackTitle').textContent=ok?'正解':'不正解';$('memory').textContent='この問題で覚える一文：'+q.m;$('reason').textContent=q.r;$('detail').textContent=q.d;}
function next(){if(!answered)return;if(idx+1<session.length){idx++;renderQuestion()}else finish()}
function finish(){state.resume=null;state.history=(state.history||[]).slice(-19);state.history.push({at:Date.now(),title:mode,score,total:session.length});save();$('resultScore').textContent=`${score}/${session.length}`;$('resultMeta').textContent=`正答率 ${Math.round(score/session.length*100)}%｜苦手 ${Object.keys(state.weak||{}).length}問`;$('reviewWrong').style.display=Object.keys(state.weak||{}).length?'block':'none';show('result');}
function weakQuestions(){const ids=Object.keys(state.weak||{});return ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean)}
function renderHistory(){$('hAnswered').textContent=state.answered||0;$('hCorrect').textContent=state.correct||0;$('hWeak').textContent=Object.keys(state.weak||{}).length;}
$('startAll').onclick=()=>start(QUESTIONS,'復旧確認 8問');$('startWeak').onclick=()=>{const q=weakQuestions();if(!q.length){alert('現在の苦手はありません');return}start(q,'苦手復習')};$('resume').onclick=()=>{const r=state.resume;if(!r)return;const q=r.ids.map(id=>QUESTIONS.find(x=>x.id===id)).filter(Boolean);start(q,r.title,Math.min(r.index,q.length-1))};$('quizHome').onclick=()=>show('home');$('next').onclick=next;$('unknown').onclick=()=>answer(null);$('reviewWrong').onclick=()=>{const q=weakQuestions();if(q.length)start(q,'苦手復習');else show('home')};$('again').onclick=()=>start(QUESTIONS,'復旧確認 8問');$('resultHome').onclick=()=>show('home');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.font=b.dataset.size;save();applyFont()});function applyFont(){document.body.classList.remove('large','xlarge');if(state.font!=='normal')document.body.classList.add(state.font);document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.size===state.font))}$('reset').onclick=()=>{if(confirm('学習記録をリセットしますか？')){localStorage.removeItem(KEY);location.reload()}};applyFont();renderHome();
</script>
