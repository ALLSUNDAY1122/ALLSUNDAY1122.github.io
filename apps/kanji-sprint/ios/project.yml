name: KanjiStudy
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0

targets:
  KanjiStudy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/kanji-1026.json
        buildPhase: resources
      - path: Resources/bgm.m4a
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
    # INFOPLIST_KEY では配列を表せないキー（SKAdNetworkItems）と、
    # 確実に同梱したい GADApplicationIdentifier は info.properties 側にも書く。
    # 最終的な Info.plist の中身は Codemagic の検証ステップで断言する。
    info:
      path: Info.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cktu78qm5g.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.kanjisprint
        PRODUCT_NAME: KanjiStudy
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 小学生漢字｜学びスプリント
        INFOPLIST_KEY_GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
