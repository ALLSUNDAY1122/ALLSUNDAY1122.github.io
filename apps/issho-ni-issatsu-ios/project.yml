name: IsshoNiIssatsu
options:
  bundleIdPrefix: jp.allsunday1122
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  IsshoNiIssatsu:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources/stories.json
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.isshoniissatsu
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
