name: MoisesLane4Host
options:
  bundleIdPrefix: jp.allsunday1122
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MoisesLane4Host:
    type: application
    platform: iOS
    sources:
      - path: ../Shared
      - path: ../App
      - path: ../Analysis
        excludes:
          - benchmarks
      - path: HostCore
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.moiseslane4host
        PRODUCT_NAME: "Moises Lane 4 Host"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Moises Lane 4 Host"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  MoisesLane4HostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/MoisesAudioCoreTests/IOSHostCompositionTests.swift
    dependencies:
      - target: MoisesLane4Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.allsunday1122.moiseslane4host.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  MoisesLane4Host:
    build:
      targets:
        MoisesLane4Host: all
    test:
      targets:
        - MoisesLane4HostTests
    run:
      config: Debug
    archive:
      config: Release
